<title>BPSC Ancient India — PYQ Practice</title>

<script>
  (function() {
    const saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');

  })();

<style>
  :root {
    --ink: #0F1513; 
    --panel: #18211E; 
    --panel2: #1E2926; 
    --line: #2C3B37;
    --text: #DFE6E2; 
    --dim: #8C9A95; 
    --faint: #6A7873;
    --patina: #4FA88B; 
    --patina-dim: #2E5E50;
    --rust: #C4614F; 
    --haldi: #C9A227;
    --flag-border: #4A3D14;
    --right-bg: rgba(79, 168, 139, 0.11);
    --wrong-bg: rgba(196, 97, 79, 0.10);
    --btn-text: #08110E;
    --shadow: rgba(0, 0, 0, 0.35);
    --radius: 10px;
  }

  [data-theme="light"] {
    --ink: #F6F8F7;
    --panel: #FFFFFF;
    --panel2: #EEF3F0;
    --line: #D5DFDC;
    --text: #16201D;
    --dim: #546660;
    --faint: #798D86;
    --patina: #1F7A5E;
    --patina-dim: #99C7B8;
    --rust: #BC3A26;
    --haldi: #8E6500;
    --flag-border: #D8C78B;
    --right-bg: rgba(31, 122, 94, 0.12);
    --wrong-bg: rgba(188, 58, 38, 0.12);
    --btn-text: #FFFFFF;
    --shadow: rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink); 
    color: var(--text);
    font-family: Barlow, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; 
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s ease, color .2s ease;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 96px; }

  /* ---------- top navigation controls ---------- */
  .home-btn {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 99;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 38px;
    padding: 0 14px;
    border-radius: 9999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 3px 10px var(--shadow);
    transition: background .15s, border-color .15s, transform .1s;
  }
  .home-btn:hover {
    border-color: var(--patina);
    background: var(--panel2);
    color: var(--patina);
  }
  .home-btn:active { transform: scale(0.96); }

  .theme-toggle {
    position: fixed;
    top: 18px;
    right: 20px;
    z-index: 99;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 3px 10px var(--shadow);
    transition: background .15s, border-color .15s, transform .1s;
    padding: 0;
  }
  .theme-toggle:hover {
    border-color: var(--patina);
    background: var(--panel2);
  }
  .theme-toggle:active { transform: scale(0.94); }
  .theme-toggle svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-sun { display: block; }
  .icon-moon { display: none; }
  [data-theme="light"] .icon-sun { display: none; }
  [data-theme="light"] .icon-moon { display: block; }

  /* ---------- masthead ---------- */
  header {
    border-bottom: 1px solid var(--line);
    padding: 34px 44px 22px 0;
    margin-bottom: 30px;
  }
  .masthead-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .portal-bread {
    color: var(--patina);
    text-decoration: none;
    font-weight: 500;
  }
  .portal-bread:hover { text-decoration: underline; }

  h1 {
    font-family: Spectral, Georgia, serif; 
    font-weight: 600;
    font-size: clamp(26px, 5vw, 36px); 
    line-height: 1.15; 
    margin: 0 0 8px;
    letter-spacing: -.01em;
  }
  .sub { color: var(--dim); font-size: 14.5px; margin: 0; }
  .sub b { color: var(--patina); font-weight: 600; }

  /* ---------- topic index ---------- */
  .index { display: grid; gap: 2px; }
  .topic {
    display: flex; align-items: baseline; gap: 14px; width: 100%;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: var(--text); font: inherit; text-align: left;
    padding: 13px 4px; cursor: pointer; transition: background .12s, padding .12s;
  }
  .topic:hover, .topic:focus-visible { background: var(--panel); padding-left: 10px; }
  .topic:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
  .topic .name { font-family: Spectral, Georgia, serif; font-size: 18px; flex: 1; }
  .topic .rule { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
  .topic .n { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 14px; }
  .topic .done { color: var(--patina); font-size: 13px; font-variant-numeric: tabular-nums; }
  .allbtn {
    margin: 22px 0 0; width: 100%; padding: 15px; cursor: pointer;
    background: var(--patina); color: var(--btn-text); border: 0; border-radius: var(--radius);
    font: 600 16px Barlow, sans-serif;
  }
  .allbtn:hover { filter: brightness(1.08); }
  .note {
    color: var(--faint); font-size: 13.5px; line-height: 1.6; margin-top: 26px;
    border-top: 1px solid var(--line); padding-top: 18px;
  }

  /* ---------- quiz ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 44px 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  .back { background: none; border: 0; color: var(--dim); font: inherit; cursor: pointer; padding: 4px 0; }
  .back:hover { color: var(--patina); }
  .bar .now { font-family: Spectral, Georgia, serif; font-size: 16px; flex: 1; min-width: 120px; }
  .tally { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--dim); }
  .tally .ok { color: var(--patina); } 
  .tally .no { color: var(--rust); }
  .track { height: 2px; background: var(--line); margin-bottom: 26px; }
  .track i { display: block; height: 100%; background: var(--patina); transition: width .25s; }

  .meta {
    color: var(--faint); font-size: 13px; letter-spacing: .02em; margin-bottom: 10px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .flag { color: var(--haldi); border: 1px solid var(--flag-border); border-radius: 4px; padding: 1px 7px; font-size: 12px; }
  .stem {
    font-family: Spectral, Georgia, serif; font-size: 19.5px; line-height: 1.55;
    margin: 0 0 22px;
  }
  .opts { display: grid; gap: 9px; margin-bottom: 22px; }
  .opt {
    display: flex; gap: 13px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--text); font: inherit; padding: 13px 15px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--patina-dim); background: var(--panel2); }
  .opt:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt .k {
    flex: 0 0 24px; height: 24px; border: 1px solid var(--line); border-radius: 5px;
    display: grid; place-items: center; font-size: 13px; color: var(--dim);
  }
  .opt .v { flex: 1; }
  .opt.right { border-color: var(--patina); background: var(--right-bg); }
  .opt.right .k { border-color: var(--patina); background: var(--patina); color: var(--btn-text); }
  .opt.wrong { border-color: var(--rust); background: var(--wrong-bg); }
  .opt.wrong .k { border-color: var(--rust); color: var(--rust); }

  .why { min-height: 34px; margin-bottom: 20px; }
  .why:not(:empty) {
    border-left: 2px solid var(--patina-dim); padding: 2px 0 2px 15px;
  }
  .verdict { font-size: 14px; font-weight: 600; margin: 0 0 6px; letter-spacing: .01em; }
  .verdict.ok { color: var(--patina); } 
  .verdict.no { color: var(--rust); }
  .why .note {
    font-family: Spectral, Georgia, serif; font-size: 16px; line-height: 1.6;
    color: var(--text); margin: 0;
  }
  .why .again { color: var(--haldi); font-size: 13px; margin: 8px 0 0; }

  .nav { display: flex; gap: 10px; }
  .nav button {
    flex: 1; padding: 13px; border-radius: var(--radius); font: 600 15px Barlow, sans-serif; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
  }
  .nav button:hover:not(:disabled) { border-color: var(--patina-dim); }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .go { background: var(--patina); border-color: var(--patina); color: var(--btn-text); }
  .keys { color: var(--faint); font-size: 12.5px; text-align: center; margin-top: 16px; }

  /* ---------- results ---------- */
  .score { font-family: Spectral, Georgia, serif; font-size: 44px; margin: 10px 0 2px; }
  .score small { font-size: 20px; color: var(--dim); }
  .rows { margin: 24px 0; }
  .row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row .name { flex: 1; }
  .row .sc { font-variant-numeric: tabular-nums; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const DATA = [{"i":0,"t":"Stone Age","q":"The earliest evidence of animal Husbandry and agriculture in India has come from:","o":[["a","Anjira"],["b","Damb Sadat"],["c","Kili Gul Muhammad"],["d","Mehrgarh"],["e","None of the above/More than one of the above"]],"a":"d","s":"64th BPSC (Pre) 2018","n":"Mehrgarh, in present-day Balochistan, is the classic answer: wheat cultivation plus domesticated animals. Note that Lahuradewa (Sant Kabir Nagar, UP) has since yielded rice from c. 8000-7000 BCE, and Koldihwa on the Belan is the older rice site.","r":0},{"i":1,"t":"Stone Age","q":"Which one of the following periods is also known as the Chalcolithic Age?","o":[["a","Old Stone Age"],["b","New Stone Age"],["c","Copper Stone Age"],["d","Iron Age"]],"a":"c","s":"44th BPSC (Pre) 2000","n":"Chalco = copper, lithic = stone. Cultures using copper tools alongside stone ones are Chalcolithic.","r":0},{"i":2,"t":"Stone Age","q":"Which river valley in India was the first human fossil obtained from?","o":[["a","Ganga River"],["b","Yamuna Valley"],["c","Narmada Valley"],["d","Tapi Valley"],["e","None of the above / More than one of the above"]],"a":"c","s":"66th BPSC Re-Exam (Pre) 2020","n":"Found at Hathnora (Sehore district, MP) in the Narmada valley, by Arun Sonakia of the Geological Survey of India in 1982.","r":0},{"i":3,"t":"Stone Age","q":"Which of the following states is the Bhimbetka site located in?","o":[["a","Chhattisgarh"],["b","Madhya Pradesh"],["c","Tamil Nadu"],["d","Punjab"]],"a":"b","s":"BPSC (CDPO) (Pre) 2009","n":"Bhimbetka is in Raisen district, Madhya Pradesh. Around 750 rock shelters have been identified, roughly 500 of them painted, spanning the Early Stone Age to historical times.","r":0},{"i":4,"t":"Stone Age","q":"Match List - I with List - II and choose the correct answer using the codes given below the lists. List - I List - II (Neolithic Site) (Locations) A. Utnoor 1. Tamil Nadu B. Chirand 2. Kashmir C. Gufkral 3. Telangana D. Paiyampalli 4. Bihar A B C D","o":[["a","4 2 1 3"],["b","3 1 4 2"],["c","3 4 2 1"],["d","2 1 3 4"]],"a":"c","s":"BPSC (CDPO) (Pre) 2005","n":"Utnoor - Telangana; Chirand - Bihar; Gufkral - Kashmir; Paiyampalli - Tamil Nadu. Chirand and Gufkral are the two worth memorising.","r":0},{"i":5,"t":"Stone Age","q":"Match List I with List II and choose the correct answer using the code given below the lists. List - I List - II (Chalcolithic Site) ( Rivers of Chalcolithic Civilization Sites) A. Ahar 1. Tapti B. Kayatha 2. Narmada C. Savalda 3. Kali Sindh D. Malwa 4. Banas Code: A B C D","o":[["a","1 3 2 4"],["b","2 1 4 3"],["c","4 3 1 2"],["d","2 4 1 3"]],"a":"c","s":"BPSC (Assistant ) 2019","n":"Ahar - Banas; Kayatha - Kali Sindh; Savalda - Tapti; Malwa - Narmada.","r":0},{"i":6,"t":"Indus Valley Civilization","q":"Indus Civilization existed in:","o":[["a","Prehistoric age"],["b","Proto-historic age"],["c","Historic age"],["d","Post-historic age"]],"a":"b","s":"39th BPSC (Pre) 1994","n":"Protohistoric means writing existed but cannot be read. The Harappan script is known and undeciphered, which places the civilisation between prehistory and history. In Indian terms this covers roughly 3000-600 BCE.","r":0},{"i":7,"t":"Indus Valley Civilization","q":"What is the most significant feature of the Indus Valley Civilization?","o":[["a","Burnt brick buildings"],["b","First true arches"],["c","Buildings of worship"],["d","Art and architecture"],["e","None of the above/More than one of the above"]],"a":"e","s":"63rd BPSC (Pre.) 2017","n":"The Commission treated no single option as adequate. Town planning is normally called the defining feature; burnt-brick buildings and planned drainage are part of it, while true arches appear only much later, and no clear place of worship has been identified.","r":0},{"i":8,"t":"Indus Valley Civilization","q":"Which city is known as 'Mini Harappa'?","o":[["a","Lothal"],["b","Desalpur"],["c","Sohgaura"],["d","Kotdiji"]],"a":"a","s":"BPSC (CDPO) (Pre) 2009","n":"Lothal in Gujarat is called Mini Harappa. Its first excavation was directed by S.R. Rao.","r":0},{"i":9,"t":"Indus Valley Civilization","q":"Which of the following is a Harappan port?","o":[["a","Alexandria"],["b","Lothal"],["c","Mahasthangarh"],["d","Nagapattinam"]],"a":"b","s":"53rd to 55th BPSC (Pre) 2011","n":"Lothal sits on the Bhogava river in Ahmedabad district, Gujarat, and has yielded a structure widely read as a dockyard.","r":0},{"i":10,"t":"Indus Valley Civilization","q":"Which of the following is a Harappan site in Gujarat?","o":[["a","Lothal"],["b","Dabarkot"],["c","Kalibanga"],["d","Rakhigarhi"],["e","None of the above/ More than one of the above"]],"a":"a","s":"67th BPSC (Pre) 2022","n":"Lothal is in Gujarat. Kalibangan is in Rajasthan, Rakhigarhi in Haryana, Dabarkot in Balochistan.","r":0},{"i":11,"t":"Indus Valley Civilization","q":"Which is the oldest civilization in the world?","o":[["a","Indus Valley Civilization"],["b","Chinese Civilization"],["c","Egyptian Civilization"],["d","Mesopotamian Civilization (Iraq)"]],"a":"d","s":"70th BPSC Re-Exam (Pre) 2024","n":"Mesopotamia, in present-day Iraq, is reckoned the oldest. Egypt in the Nile valley came later, and the Indus later still.","r":0},{"i":12,"t":"Indus Valley Civilization","q":"Which of the following animals was not known to the people of the Indus Valley Civilization?","o":[["a","Bull"],["b","Horse"],["c","Elephant"],["d","None of the above"]],"a":"b","s":"69th BPSC (Pre) 2023","n":"Bulls and elephants are well attested on seals; the horse is not. Bones claimed as horse are hard to separate from the wild ass (onager), so its presence stays disputed.","r":0},{"i":13,"t":"Indus Valley Civilization","q":"Which among the following Harappan sites was terracotta of a 'plough' was found?","o":[["a","Dholavira"],["b","Banawali"],["c","Kalibangan"],["d","Lothal"],["e","None of the above/More than one of the above"]],"a":"e","s":"60th to 62nd BPSC (Pre) 2016","n":"Terracotta plough models have come from both Banawali (Haryana) and Kalibangan (Rajasthan), so no single option works. Kalibangan also gave the ploughed field.","r":0},{"i":14,"t":"Indus Valley Civilization","q":"In which of the following Harappan cities, furrows of ploughed fields have been found?","o":[["a","Kalibangan"],["b","Dholavira"],["c","Mohenjo-Daro"],["d","Lothal"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th BPSC (Pre) 2020","n":"Kalibangan, on the Ghaggar in Hanumangarh district, Rajasthan, gave the ploughed field with criss-cross furrows. Pair it with Banawali for the plough model and Lothal for the dockyard.","r":0},{"i":15,"t":"Indus Valley Civilization","q":"At which Harappan site do we find evidence of a ploughed field?","o":[["a","Kalibangan (Rajasthan)"],["b","Lothal (Gujarat)"],["c","Banawali (Haryana)"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"BPSC TRE-3 July, 2024","n":"Kalibangan, on the Ghaggar in Hanumangarh district, Rajasthan, gave the ploughed field with criss-cross furrows. Pair it with Banawali for the plough model and Lothal for the dockyard.","r":1},{"i":16,"t":"Indus Valley Civilization","q":"Who among the following was not associated with the excavation of Harappa and Mohenjodaro?","o":[["a","R. D. Banerjee"],["b","K.N. Dikshit"],["c","M.S. Vats"],["d","V.A. Smith"]],"a":"d","s":"56th to 59th BPSC (Pre) 2015","n":"V.A. Smith was a historian, not an excavator. Daya Ram Sahni excavated Harappa from 1921, Madho Sarup Vats continued there, and R.D. Banerjee identified Mohenjodaro in 1922.","r":0},{"i":17,"t":"Indus Valley Civilization","q":"Which colour was commonly used in the Harappan Pottery?","o":[["a","Red"],["b","Blue-grey (7) General Studies"],["c","Yellow"],["d","Blue"]],"a":"a","s":"40th BPSC (Pre) 1995","n":"Harappan pottery is characteristically red, often with black painted designs. Sand mixed into the clay gave the fired surface its brownish-red tone.","r":0},{"i":18,"t":"Indus Valley Civilization","q":"According to the report of the IIT Kharagpur study group, continuous low rainfall for how many years was the cause of the fall of the Indus Valley Civilization?","o":[["a","600 years"],["b","700 years"],["c","800 years"],["d","900 years"],["e","None of the above/More than one of the above"]],"a":"d","s":"64th BPSC (Pre) 2018","n":"An IIT Kharagpur study published in 2018 attributed the decline to a drought lasting about 900 years. Aurel Stein had earlier argued for climatic change.","r":0},{"i":19,"t":"Vedic Age","q":"Which one of the following is not related to the Rigvedic period?","o":[["a","Gargi"],["b","Ghosha"],["c","Apala"],["d","Vishvavara"]],"a":"a","s":"71st BPSC (Pre) 2025","n":"Ghosha, Apala and Vishvavara are women associated with Rigvedic hymns. Gargi belongs to the later Upanishadic period, so she is the odd one out.","r":0},{"i":20,"t":"Vedic Age","q":"Which city served as the capital of the ancient kingdom of Magadha during the early Vedic period?","o":[["a","Pataliputra"],["b","Rajagriha"],["c","Champa"],["d","Vaishali"]],"a":"b","s":"69th BPSC (Pre) 2023","n":"Rajagriha, modern Rajgir. Magadha's first dynasty was the Brihadratha, named in the Rigveda.","r":0},{"i":21,"t":"Vedic Age","q":"Which Mandala of the Rig Veda is completely dedicated to ‘Soma’?","o":[["a","Seventh Mandala"],["b","Eighth Mandala"],["c","Ninth Mandala"],["d","Tenth Mandala"]],"a":"c","s":"42nd BPSC (Pre) 1997-98","n":"The Rigveda has ten mandalas; all 114 hymns of the ninth are for Soma. The tenth mandala carries the Purusha Sukta on the origin of the four varnas.","r":0},{"i":22,"t":"Vedic Age","q":"To whom is the ninth Mandala of the Rigveda Samhita completely dedicated?","o":[["a","Indra and his elephant"],["b","Urvashi and heaven"],["c","Deities related to plants and herbs"],["d","Soma and the deity named after this drink"]],"a":"d","s":"40th BPSC (Pre) 1995","n":"Same point: the ninth mandala is given over entirely to Soma, both the drink and the deity.","r":1},{"i":23,"t":"Vedic Age","q":"Gayatri Mantra is found in which book?","o":[["a","Upanishad"],["b","Bhagavad Gita"],["c","Rig Veda"],["d","Yajurveda"]],"a":"c","s":"39th BPSC (Pre) 1994","n":"It sits in the third mandala of the Rigveda, is ascribed to Vishvamitra, and addresses Savitr, the sun.","r":0},{"i":24,"t":"Vedic Age","q":"In which phase was the concept of untouchability was clearly put?","o":[["a","Rigvedic phase"],["b","Later Vedic phase"],["c","Later Gupta phase"],["d","Dharmashastra phase"]],"a":"d","s":"39th BPSC (Pre) 1994","n":"Untouchability is stated plainly only in the Dharmashastra (Sutra) phase, when mixed castes multiplied through anuloma and pratiloma marriage. Panini's Niravasita Shudras were the excluded group.","r":0},{"i":25,"t":"Vedic Age","q":"When did the use of iron begin in the Indian subcontinent?","o":[["a","Around 9000 years ago"],["b","Around 12000 years ago"],["c","Around 6000 years ago (8) General Studies"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"68th BPSC (Pre) 2022","n":"No option matches, so the answer is 'none'. Iron with Black-and-Red Ware at Noh (Rajasthan) dates to about 1400 BCE, and Atranjikhera's iron tools to about 1000 BCE, which most scholars accept. The Atharvaveda calls iron shyama ayas.","r":0},{"i":26,"t":"Vedic Age","q":"Boghaz-Koi is important because:","o":[["a","It was an important trading centre between Central Asia and Tibet"],["b","Inscriptions were found which mentioned the names of Vedic Gods and goddesses"],["c","Original texts of the Vedas were composed here"],["d","None of the above"]],"a":"b","s":"39th BPSC (Pre) 1994","n":"Fourteenth-century BCE inscriptions from Boghazkoi in Asia Minor invoke Indra, Mitra, Varuna and the Nasatyas as witnesses to a treaty, which is why they matter for the Aryan question.","r":0},{"i":27,"t":"Vedic Age","q":"Famous Battle of ‘Ten Kings’ was fought on the bank of the river:","o":[["a","Ganges"],["b","Brahmaputra"],["c","Kaveri"],["d","Parushni"]],"a":"d","s":"42nd BPSC (Pre) 1997","n":"The Dasarajna was fought on the Parushni, the modern Ravi. Sudas of the Bharatas won.","r":0},{"i":28,"t":"Vedic Age","q":"Which ancient Indian text, composed during the Later Vedic period, contains philosophical hymns and discussions on cosmology and ethics?","o":[["a","Yajurveda"],["b","Upanishads"],["c","Rigveda"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"BPSC Preview ( | BPSC (Tre-3) July, 2024","n":"The Upanishads, composed roughly 700-300 BCE, carry the philosophical discussion of cosmology and ethics.","r":0},{"i":29,"t":"Buddhism","q":"Where was Gautam a Buddha born?","o":[["a","In Kundagram"],["b","In Pataliputra"],["c","In Lumbini"],["d","In Vaishali"]],"a":"c","s":"BPSC (CDPO) (Pre) 2005","n":"Born at Lumbini near Kapilavastu in 563 BCE. Fix the four sites together: born Lumbini, enlightened Bodh Gaya, first sermon Sarnath, died Kushinagar.","r":0},{"i":30,"t":"Buddhism","q":"At which place did Mahatma Buddha give his first ‘Dhammachakkhapavattana’?","o":[["a","Lumbini"],["b","Sarnath"],["c","Pataliputra"],["d","Vaishali"]],"a":"b","s":"47th BPSC (Pre) 2005","n":"Sarnath, near Kashi, also called Rishipattana or Mrigadava. The first sermon is the Dhammachakkappavattana.","r":0},{"i":31,"t":"Buddhism","q":"Where did Gautama Buddha give his first sermon?","o":[["a","Pataliputra"],["b","Sarnath"],["c","Gaya"],["d","Vaishali"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th BPSC (Re-Exam) (Pre) 2020","n":"Sarnath, near Kashi, also called Rishipattana or Mrigadava. The first sermon is the Dhammachakkappavattana.","r":1},{"i":32,"t":"Buddhism","q":"Who got enlightenment in Bodh Gaya?","o":[["a","Mahavir Swami"],["b","Gautam Buddha"],["c","Samdhar Swami"],["d","Parshvanath Swami"],["e","None of the above/ More than one of the above"]],"a":"b","s":"67th BPSC (Pre) 2022","n":"Born at Lumbini near Kapilavastu in 563 BCE. Fix the four sites together: born Lumbini, enlightened Bodh Gaya, first sermon Sarnath, died Kushinagar.","r":1},{"i":33,"t":"Buddhism","q":"Four important events of Buddha’s life and there related four places are mentioned below. Match Schedule- I and Schedule- II and select the correct answer from the codes given below - Schedule - I Schedule - II A. Birth 1. Sarnath B. Enlightenment 2. Bodh Gaya C. First preaching 3. Lumbini D. Death 4. Kushinagar Code : A B C D","o":[["a","1 2 4 3"],["b","2 3 1 4"],["c","3 2 1 4"],["d","None of the above."]],"a":"c","s":"41st BPSC (Pre) 1996","n":"Birth - Lumbini; Enlightenment - Bodh Gaya; First preaching - Sarnath; Death - Kushinagar.","r":0},{"i":34,"t":"Buddhism","q":"Which Buddhist council was not held in Bihar?","o":[["a","Second"],["b","First"],["c","Third"],["d","Fourth"]],"a":"d","s":"71st BPSC (Pre) 2025","n":"First at Rajagriha, second at Vaishali, third at Pataliputra, all in Bihar. Only the fourth, at Kundalvan in Kashmir, was held outside.","r":0},{"i":35,"t":"Buddhism","q":"In which city was the first Buddhist council held during the reign of Ajatashatru?","o":[["a","Rajgriha"],["b","Magadha"],["c","Pataliputra"],["d","Kashmir"]],"a":"a","s":"BPSC (CDPO) (Pre) 2005","n":"Rajagriha, in the Saptaparni cave, immediately after the Buddha's death, when Ajatashatru ruled Magadha. Mahakassapa presided; Ananda and Upali supplied the Dhamma and Vinaya.","r":0},{"i":36,"t":"Buddhism","q":"Who was the chairman of the First Buddhist Council?","o":[["a","Vasumitra"],["b","Mahakashyapa"],["c","Sangharaksha"],["d","Parshva"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th BPSC (Pre) 2022","n":"Rajagriha, in the Saptaparni cave, immediately after the Buddha's death, when Ajatashatru ruled Magadha. Mahakassapa presided; Ananda and Upali supplied the Dhamma and Vinaya.","r":1},{"i":37,"t":"Buddhism","q":"Where was the First Buddhist Council convened?","o":[["a","Pataliputra"],["b","Rajagriha"],["c","Amaravati"],["d","Kanganhalli"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th BPSC (Re-exam) (Pre) 2021","n":"Rajagriha, in the Saptaparni cave, immediately after the Buddha's death, when Ajatashatru ruled Magadha. Mahakassapa presided; Ananda and Upali supplied the Dhamma and Vinaya.","r":1},{"i":38,"t":"Buddhism","q":"After the Mahaparinirvana of Lord Buddha, the first Buddhist council was held at:","o":[["a","Rajgriha (Rajgir)"],["b","Gaya"],["c","Pataliputra"],["d","Vaishali"],["e","None of the above/More than one of the above"]],"a":"a","s":"64th BPSC (Pre) 2018","n":"Rajagriha, in the Saptaparni cave, immediately after the Buddha's death, when Ajatashatru ruled Magadha. Mahakassapa presided; Ananda and Upali supplied the Dhamma and Vinaya.","r":1},{"i":39,"t":"Buddhism","q":"A Buddhist Council during the reign of Kanishka was held at –","o":[["a","Magadha"],["b","Pataliputra"],["c","Kashmir"],["d","Rajgriha"]],"a":"c","s":"47th BPSC (Pre) 2005","n":"Kundalvan in Kashmir, under Kanishka. Vasumitra presided with Ashvaghosha as deputy; the commentaries produced are the Vibhasha Shastra.","r":0},{"i":40,"t":"Buddhism","q":"Which of the following rulers convened the Fourth Buddhist Council in Kashmir?","o":[["a","Ashoka"],["b","Ajatashatru"],["c","Kanishka"],["d","Kalashoka"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th BPSC (Pre.) 2020","n":"Kundalvan in Kashmir, under Kanishka. Vasumitra presided with Ashvaghosha as deputy; the commentaries produced are the Vibhasha Shastra.","r":1},{"i":41,"t":"Buddhism","q":"A Buddhist Council during the reign of Ashoka was held at –","o":[["a","Magadha"],["b","Pataliputra"],["c","Samastipur"],["d","Rajgriha"]],"a":"b","s":"45th BPSC (Pre) 2000","n":"Pataliputra, under Ashoka, chaired by Moggaliputta Tissa. The Sinhalese chronicles Dipavamsa and Mahavamsa are the source.","r":0},{"i":42,"t":"Buddhism","q":"Where was the third Buddhist Council held?","o":[["a","Taxila"],["b","Sarnath"],["c","Bodh Gaya"],["d","Pataliputra"]],"a":"d","s":"53rd to 55th BPSC (Pre) 2011","n":"Pataliputra, under Ashoka, chaired by Moggaliputta Tissa. The Sinhalese chronicles Dipavamsa and Mahavamsa are the source.","r":1},{"i":43,"t":"Buddhism","q":"Where did Mahatma Buddha’s ‘Mahaparinirvana’ take place?","o":[["a","Lumbini"],["b","Bodh Gaya"],["c","Kushinagar"],["d","Kapilvastu"]],"a":"c","s":"53rd to 55th BPSC (Pre) 2011 | 47th BPSC (Pre) 2005","n":"Kushinagar, capital of the Mallas, in 483 BCE at the age of 80. He fell ill after eating sukaramaddava at Chunda's home in Pava.","r":0},{"i":44,"t":"Buddhism","q":"Tripitakas are the sacred books of the:","o":[["a","Jains"],["b","Hindus"],["c","Parsees"],["d","Buddhists"],["e","None of the above/More than one of the above"]],"a":"d","s":"63rd BPSC (Pre.) 2017","n":"The Tripitaka is Buddhist: Vinaya (monastic rules), Sutta (sermons) and Abhidhamma (philosophy).","r":0},{"i":45,"t":"Buddhism","q":"Which of the following represents a fundamental difference between Mahayana Buddhism and Hinayana Buddhism?","o":[["a","Emphasis on non-violence"],["b","Casteless society"],["c","Worship of idols of gods and goddesses"],["d","Worship of Stupas"]],"a":"c","s":"BPSC (Assistant) 2019","n":"Hinayana did not worship images; Mahayana treated the Buddha as a deity and worshipped his idols. Non-violence and stupa worship were common to both.","r":0},{"i":46,"t":"Buddhism","q":"The ‘Bodhi Vriksha’ in Bodh Gaya belongs to which generation of its family?","o":[["a","Third"],["b","Fourth"],["c","Fifth"],["d","Sixth"]],"a":"*","s":"48th to 52nd BPSC (Pre) 2008","n":"BPSC dropped this question. The Bihar tourism department calls the present tree fifth-generation, but counting the plantings by Ashoka, Pushyamitra Shunga, the Burmese king and Cunningham gives six, so the sources conflict.","r":0},{"i":47,"t":"Buddhism","q":"The Chinese traveler 'Sung yun' visited India in -","o":[["a","515 AD to 520 AD"],["b","525 AD to 529 AD"],["c","545 AD to 552 AD"],["d","592 AD to 597 AD"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd BPSC (Pre) 2016","n":"Sung-yun reached India in 518 CE and returned to China three years later with Buddhist texts, which is why the 515-520 window is marked correct.","r":0},{"i":48,"t":"Buddhism","q":"Gautama Buddha was elevated to the position of God during the period of:","o":[["a","Ashoka"],["b","Kanishka"],["c","Chandragupta Vikramaditya"],["d","Harsha"]],"a":"b","s":"44th BPSC (Pre) 2000","n":"Under Kanishka. The fourth council split Buddhism into Hinayana and Mahayana, and the Mahayana branch began worshipping the Buddha and the Bodhisattvas.","r":0},{"i":49,"t":"Buddhism","q":"The teachers from whom Buddha first attempted to gain enlightenment after the Mahabhinishkramana were:","o":[["a","Kaundinya and Kaladeva"],["b","Ananda and Ashvaghosha"],["c","Alara Kalama and Rudraka Ramaputra"],["d","Sariputta and Nagasena"]],"a":"c","s":"BPSC (CDPO) (Pre) 2005","n":"Alara Kalama, a Sankhya teacher, then Rudraka Ramaputra. He left both unsatisfied before finding his own path.","r":0},{"i":50,"t":"Buddhism","q":"Which one of the following is not common between Buddhism and Jainism?","o":[["a","Ahimsa"],["b","Indifference to Vedas"],["c","Self-mortification"],["d","Rejection of Rituals"]],"a":"c","s":"44th BPSC (Pre) 2000","n":"Extreme self-mortification is Jain; the Buddha rejected it for the Middle Path. Both faiths share non-violence, rejection of Vedic authority and dismissal of ritual.","r":0},{"i":51,"t":"Buddhism","q":"Nalanda University was a great center of knowledge of -","o":[["a","Buddhism"],["b","Jainism"],["c","Vaishnavism"],["d","Sankhya"]],"a":"a","s":"BPSC (CDPO) (Pre) 2005","n":"Nalanda was the great centre of Buddhist philosophy. It arose in the mid-fifth century CE under the Guptas, with Kumaragupta I as its first patron.","r":0},{"i":52,"t":"Jainism","q":"Where was Mahavira Swami born?","o":[["a","Kundagram"],["b","Pataliputra"],["c","Magadha"],["d","Vaishali"]],"a":"a","s":"53rd to 55thBPSC (Pre) 2011 | 47th BPSC (Pre) 2005 | 42nd BPSC (Pre) 1997-98","n":"Kundagrama (Kundalpur) near Vaishali, around 599 BCE. His father Siddhartha headed the Jnatrika clan; his mother Trishala was sister to the Licchavi chief Chetaka.","r":0},{"i":53,"t":"Jainism","q":"The first disciple of Lord Mahavira was –","o":[["a","Jamali"],["b","Yashoda"],["c","Bipin"],["d","Prabhash"]],"a":"a","s":"47th BPSC (Pre) 2005","n":"Jamali, who was also his son-in-law, married to his daughter Priyadarshana. Mahavira's wife was Yashoda.","r":0},{"i":54,"t":"Jainism","q":"The salvation place of Mahavira, the Propounder of Jain religion, is located at -:","o":[["a","Maner"],["b","Rajgir"],["c","Pavapuri"],["d","Jalan Port"],["e","None of the above/More than one of the above"]],"a":"c","s":"63rd BPSC (Pre.) 2017","n":"Pavapuri, in Nalanda district, Bihar, in 527 BCE at the age of 72. Mahavira was the 24th Tirthankara; Rishabhadeva is counted the original founder.","r":0},{"i":55,"t":"Jainism","q":"Mahavira Jain breathed his last at –","o":[["a","Rajgir"],["b","Ranchi"],["c","Pavapuri"],["d","Samastipur"]],"a":"c","s":"44th BPSC (Pre) 2001","n":"Pavapuri, in Nalanda district, Bihar, in 527 BCE at the age of 72. Mahavira was the 24th Tirthankara; Rishabhadeva is counted the original founder.","r":1},{"i":56,"t":"Jainism","q":"Which of the following is the earliest holy book of Jainism?","o":[["a","Twelve Angas"],["b","Twelve Upangas"],["c","Fourteen Purvas"],["d","Fourteen Uppurva"]],"a":"c","s":"40th BPSC (Pre) 1995","n":"The fourteen Purvas are the oldest Jain texts. Bhadrabahu was the last person who knew them all.","r":0},{"i":57,"t":"Jainism","q":"Triratna or Three Jewels, i.e., right knowledge, right faith and right action are related to which of the following?","o":[["a","Buddhism"],["b","Hinduism"],["c","Jainism"],["d","Christianity"],["e","None of the above/More than one of the above"]],"a":"c","s":"BPSC Preview (1 | 66th BPSC (Pre.) 2020","n":"Jainism. The Triratna are samyak darshan (right faith), samyak gyan (right knowledge) and samyak charitra (right conduct).","r":0},{"i":58,"t":"Jainism","q":"‘Ajivaka’, sect was founded by:","o":[["a","Anand"],["b","Rahulabhadra"],["c","Makkhali Gosala"],["d","Upali"]],"a":"c","s":"39th BPSC (Pre) 1994","n":"Makkhali Gosala, once a companion of Mahavira, is traditionally named the founder, though Ajivika teachers are recorded before him. He is better described as the man who popularised the sect.","r":0},{"i":59,"t":"Jainism","q":"Who was the chairman of the first Jain Sangiti convened in Pataliputra?","o":[["a","Vasumitra"],["b","Sthiramati"],["c","Sthulabhadra"],["d","Sudharman"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th BPSC (Re-Exam) (Pre) 2020","n":"Sthulabhadra chaired the first Jain council at Pataliputra in the fourth century BCE, where the twelve Angas were compiled.","r":0},{"i":60,"t":"Jainism","q":"Who of the following kings was strongly inclined towards Jainism?","o":[["a","Dasaratha"],["b","Brihadrath"],["c","Kharavel"],["d","Huvishk"],["e","None of the above/ More than one of the above"]],"a":"c","s":"48th to 52nd BPSC (Pre) 2008","n":"Kharavela of Kalinga, of the Chedi dynasty. His Hathigumpha inscription on Udayagiri hill near Bhubaneswar, in Prakrit, is the main source for his reign.","r":0},{"i":61,"t":"Jainism","q":"The place where Mahavira attained complete spiritual knowledge (Kaivalya) is -","o":[["a","Kundagram"],["b","Vaishali"],["c","Gaya"],["d","Jrimbhikagrama"]],"a":"d","s":"BPSC (CDPO) (Pre) 2005","n":"Jrimbhikagrama, under a sal tree on the bank of the Rijupalika, after twelve years of austerity. He then became a Kevalin.","r":0},{"i":62,"t":"Shaiva & Bhagavata Religion","q":"Who contributed the most to the development of the Bhagavata sect?","o":[["a","Persian"],["b","Indo-Greek people"],["c","Kushan"],["d","Gupta"]],"a":"d","s":"39th BPSC (Pre) 1994","n":"The Guptas. Vaishnavism was effectively their state religion, most rulers took the title Paramabhagavata, and Garuda was their emblem.","r":0},{"i":63,"t":"Shaiva & Bhagavata Religion","q":"Nathpanthis, Siddhas and Yogis made devotional religion popular in","o":[["a","Northern India"],["b","Southern India"],["c","Eastern India"],["d","Western India"]],"a":"a","s":"69th BPSC (Pre) 2023","n":"North India. They argued against ritual and orthodoxy in plain language and taught meditation on a formless supreme reality.","r":0},{"i":64,"t":"6th Century BCE - Political Condition","q":"Who founded Pataliputra?","o":[["a","Udayin"],["b","Ashoka"],["c","Bimbisara"],["d","Mahapadmananda"]],"a":"*","s":"48th to 52nd BPSC (Pre) 2008","n":"BPSC accepted Udayin, which the book calls wrong. Ajatashatru built the fort at Pataligrama where the Ganga meets the Son; Udayin then moved the capital there.","r":0},{"i":65,"t":"6th Century BCE - Political Condition","q":"Which ruler first made Pataliputra his capital?","o":[["a","Chandragupta Maurya"],["b","Ashoka the Great"],["c","Chandragupta Vikramaditya"],["d","Kanishka"]],"a":"*","s":"42nd BPSC (Pre) Exam 1997","n":"Same dispute over founding versus shifting the capital, so no clean key.","r":1},{"i":66,"t":"6th Century BCE - Political Condition","q":"Which ruler moved his capital to Pataliputra?","o":[["a","Bimbisara"],["b","Ajatashatru"],["c","Udayin"],["d","Chandragupta Maurya"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th BPSC (Re-Exam) (Pre) 2020","n":"BPSC accepted Udayin, which the book calls wrong. Ajatashatru built the fort at Pataligrama where the Ganga meets the Son; Udayin then moved the capital there.","r":1},{"i":67,"t":"6th Century BCE - Political Condition","q":"Which of the following kings founded Patliputra?","o":[["a","Shishunaga"],["b","Bimbisara"],["c","Ajatashatru"],["d","Udayin"]],"a":"c","s":"44th BPSC (Pre) 2000","n":"BPSC accepted Udayin, which the book calls wrong. Ajatashatru built the fort at Pataligrama where the Ganga meets the Son; Udayin then moved the capital there.","r":1},{"i":68,"t":"6th Century BCE - Political Condition","q":"By which ruler was Patliputra was chosen as the capital for the first time?","o":[["a","Ajatashatru"],["b","Kalashoka"],["c","Udayin"],["d","Kanishka"]],"a":"c","s":"46th BPSC (Pre) 2004","n":"BPSC accepted Udayin, which the book calls wrong. Ajatashatru built the fort at Pataligrama where the Ganga meets the Son; Udayin then moved the capital there.","r":1},{"i":69,"t":"6th Century BCE - Political Condition","q":"In ancient times, the area to the south of the Ganga was known as","o":[["a","Anarta"],["b","Takshashila 14) General Studies"],["c","Chola"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"68th BPSC (Pre) 2022","n":"None of the options fits. The land south of the Ganga was Magadha. Taxila lay between the Indus and Jhelum, and Anarta was a Vedic-period state in the west.","r":0},{"i":70,"t":"6th Century BCE - Political Condition","q":"In which century did the first Magadhan Empire rise?","o":[["a","Fourth Century B.C."],["b","Sixth Century B.C."],["c","Second Century B.C."],["d","First Century B.C."]],"a":"b","s":"42nd BPSC (Pre) 1997-98","n":"The sixth century BCE. Bimbisara (c. 544-492 BCE) of the Haryanka dynasty is the real architect of Magadha's rise.","r":0},{"i":71,"t":"6th Century BCE - Political Condition","q":"Which of the following great rulers founded the \"Haryanka Vansh\" in ancient Bihar ?","o":[["a","Bimbisara"],["b","Brihadrath"],["c","Ajatashatru"],["d","More than one of the above"]],"a":"a","s":"70th BPSC Pre-2024","n":"Bimbisara founded the Haryanka dynasty and made Magadha the leading power.","r":0},{"i":72,"t":"6th Century BCE - Political Condition","q":"What was the Prakrit name of Rajgir, the capital of Magadha?","o":[["a","Grahraj"],["b","Rajagriha"],["c","Pataliputra"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"BPSC TRE-3 July, 2024","n":"Rajgriha. The city is Girivraja in some texts; the Haryanka dynasty founded by Bimbisara ruled from here.","r":0},{"i":73,"t":"6th Century BCE - Political Condition","q":"Match List I with List II and select the correct answer using the codes given below the lists. List - I List - II (Mahajanapada) (Capitals of Mahajanapadas) A. Malla 1. Taxila B. Anga 2. Kaushambi C. Gandhara 3. Champa D. Vatsa 4. Kushinara Code:","o":[["a","A-4, B-3, C-1, D-2"],["b","A-1, B-2, C-4, D-3"],["c","A-3, B-1, C-2, D-4"],["d","A-2, B-3, C-4, D-1"]],"a":"a","s":"BPSC Preview (1 | BPSC CDPO (Pre) 2005","n":"Malla - Kushinara; Anga - Champa; Gandhara - Taxila; Vatsa - Kaushambi.","r":0},{"i":74,"t":"6th Century BCE - Political Condition","q":"By whom was the first republic of the world was established in Vaishali –","o":[["a","Maurya"],["b","Nanda"],["c","Gupta"],["d","Licchavi"]],"a":"d","s":"48th to 52nd BPSC (Pre) 2008","n":"The Licchavis of Vaishali. Among the Mahajanapadas only Vajji and Malla were republics, and the Licchavis were the strongest of the eight clans in the Vajji confederacy.","r":0},{"i":75,"t":"6th Century BCE - Political Condition","q":"Where was the world’s first republican system in the sixth century BC?","o":[["a","Vaishali"],["b","Athens"],["c","Sparta"],["d","Pataliputra"]],"a":"a","s":"46th BPSC (Pre) 2004","n":"The Licchavis of Vaishali. Among the Mahajanapadas only Vajji and Malla were republics, and the Licchavis were the strongest of the eight clans in the Vajji confederacy.","r":1},{"i":76,"t":"6th Century BCE - Political Condition","q":"Which one was the capital of Magadha?","o":[["a","Pataliputra"],["b","Vaishali"],["c","Girivraj (Rajagriha)"],["d","Champa"]],"a":"c","s":"53rd to 55th BPSC (Pre) 2011 | 47th BPSC (Pre) 2005","n":"Girivraja, that is Rajagriha. The Puranas make the Brihadratha dynasty the first to rule Magadha, with Jarasandha ruling from Girivraja.","r":0},{"i":77,"t":"6th Century BCE - Political Condition","q":"Which was the first capital of the ancient Mahajanapada Magadh?","o":[["a","Pataliputra"],["b","Vaishali"],["c","Champa"],["d","Anga"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th BPSC (Pre.) 2020","n":"No single option works, since Girivraja and Rajagriha are the same place under different names.","r":1},{"i":78,"t":"6th Century BCE - Political Condition","q":"What was the name of the dynasty of Ajatashatru?","o":[["a","Maurya"],["b","Haryanka"],["c","Nanda"],["d","Gupta"]],"a":"b","s":"53rd to 55th BPSC (Pre) 2011 | BPSC (CDPO) (Pre) 2005","n":"Haryanka. Ajatashatru (492-460 BCE) took the throne by killing his father Bimbisara, and was in turn killed by his own son Udayin.","r":0},{"i":79,"t":"6th Century BCE - Political Condition","q":"The list of sixteen Mahajanapadas is available in –","o":[["a","Mahabharata"],["b","Anguttar Nikaya"],["c","Chandogya Upanishad"],["d","Samyukta Nikaya"]],"a":"b","s":"46th BPSC (Pre) 2004","n":"The Anguttara Nikaya, a Buddhist text, lists the sixteen. Of them only Ashmaka lay in the south.","r":0},{"i":80,"t":"6th Century BCE - Political Condition","q":"Pradyota was the king of–","o":[["a","Kasi"],["b","Kosala"],["c","Magadha"],["d","Avanti"],["e","None of the above/More than one of the above"]],"a":"d","s":"BPSC CDPO 2018","n":"Avanti. Chandapradyota ruled it in the Buddha's time; his daughter Vasavadatta married Udayana of Vatsa, the story behind Bhasa's Swapnavasavadatta. Avanti's northern capital was Ujjayini.","r":0},{"i":81,"t":"6th Century BCE - Political Condition","q":"Who was the physician of Magadha ruler Bimbisara?","o":[["a","Shilabhadra"],["b","Vijayasena"],["c","Jivaka"],["d","Manu"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th BPSC (Re-Exam) (Pre)-2022","n":"Jivaka, whom Bimbisara also sent to treat Chandapradyota of Avanti.","r":0},{"i":82,"t":"6th Century BCE - Political Condition","q":"Which dynasty did ruled over Magadha after the Nanda Dynasty?","o":[["a","Maurya"],["b","Shunga"],["c","Gupta"],["d","Kushana"]],"a":"a","s":"44th BPSC (Pre) 2000","n":"The Mauryas. The Nandas had displaced the Shishunagas and grew unpopular through heavy taxation, which opened the way for Chandragupta Maurya.","r":0},{"i":83,"t":"6th Century BCE - Political Condition","q":"Kaling king Kharavel was related to-","o":[["a","Mahameghavahan Dynasty"],["b","Chedi Dynasty"],["c","Satavahan Dynasty"],["d","Rath-Bhojak Dynasty"],["e","None of the above/ More than one of the above"]],"a":"e","s":"60th to 62nd BPSC (Pre) 2016","n":"No option fits neatly. Kharavela belonged to the Chedi line of Kalinga, also called the Mahameghavahana dynasty after its founder.","r":0},{"i":84,"t":"6th Century BCE - Political Condition","q":"King Kharavela is related to –","o":[["a","Pillar inscription of Girnar"],["b","Pillar inscription of Junagarh"],["c","Hathigumpha inscription"],["d","Sarnath inscription"]],"a":"c","s":"43rd BPSC (Pre) 1999","n":"The Hathigumpha inscription on Udayagiri hill, Bhubaneswar, which gives a year-by-year account of his reign.","r":0},{"i":85,"t":"6th Century BCE - Political Condition","q":"Gorathagiri in the Barabar Hills was conquered by","o":[["a","Rajaraja Chola"],["b","Kharavela"],["c","Menander"],["d","Pushyamitra Shunga"],["e","None of the above/More than one of the above"]],"a":"b","s":"BPSC CDPO (Pre) 2018","n":"Kharavela. His Hathigumpha inscription records the conquest of Gorathagiri in the Barabar hills and is the first to use the term Maharaja.","r":0},{"i":86,"t":"6th Century BCE - Political Condition","q":"The capital of Anga Janapada was-","o":[["a","Champa"],["b","Ramagrama"],["c","Kapilvastu"],["d","Kundagram"]],"a":"a","s":"BPSC (CDPO) (Pre) 2005","n":"Champa, covering the modern Bhagalpur and Munger districts of south Bihar. The Mahabharata and Puranas call it Malini.","r":0},{"i":87,"t":"Greek Invasion","q":"Which one of the following rulers of Magadha was the contemporary of Alexander, the Great?","o":[["a","Mahapadmananda"],["b","Dhanananda"],["c","Sukalpa"],["d","Chandragupta Maurya"]],"a":"b","s":"44th BPSC (Pre) 2000","n":"Dhanananda, last of the Nandas, whom Greek writers called Agrammes. Xenophon notes his wealth.","r":0},{"i":88,"t":"Mauryan Empire","q":"Who recognized Sandrokottos as Chandragupta Maurya?","o":[["a","William Jones"],["b","V. Smith"],["c","R. K. Mukherjee"],["d","D. R. Bhandarkar"]],"a":"a","s":"48th to 52nd BPSC (Pre) 2008","n":"William Jones first identified the Greek Sandrokottos with Chandragupta Maurya, which anchors the whole chronology of ancient India.","r":0},{"i":89,"t":"Mauryan Empire","q":"The first empire was established by which ruler in India?","o":[["a","Chandragupta Maurya"],["b","Ashoka"],["c","Kanishka"],["d","Chandragupta-II Vikramaditya"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th BPSC Re-Exam (Pre) 2020","n":"Chandragupta Maurya, the first ruler to bring most of the subcontinent under one political authority, with his frontier reaching towards Iran.","r":0},{"i":90,"t":"Mauryan Empire","q":"Who was the founder of the Maurya Empire?","o":[["a","Bindusara"],["b","Brihadratha"],["c","Ashoka"],["d","Chandragupta Maurya"]],"a":"d","s":"70th BPSC Re-Exam (Pre) 2024","n":"Chandragupta Maurya. The dynasty ran roughly 321-184 BCE.","r":0},{"i":91,"t":"Mauryan Empire","q":"Who amongst the following Mauryan rulers did conquered the Deccan?","o":[["a","Ashoka"],["b","Chandragupta"],["c","Bindusara"],["d","Kunala"]],"a":"b","s":"46th BPSC (Pre) 2004","n":"Chandragupta Maurya. Ashoka's only recorded conquest was Kalinga, and Bindusara is not remembered as a conqueror, so Jain and Tamil sources credit the Deccan campaign to Chandragupta.","r":0},{"i":92,"t":"Mauryan Empire","q":"Chandragupta Maurya figures prominently in the book of –","o":[["a","Bhasa"],["b","Sudraka"],["c","Vishakhadatta"],["d","Ashvaghosha"]],"a":"c","s":"46th BPSC (Pre) 2004","n":"Vishakhadatta's Mudrarakshasa, which calls him Vrishala and Kulahina. Dhundhiraj wrote an eighteenth-century commentary on it.","r":0},{"i":93,"t":"Mauryan Empire","q":"Megasthenes was the ambassador of -","o":[["a","Seleucus"],["b","Alexander"],["c","Darius"],["d","Greeks"],["e","None of the above/ More than one of the above"]],"a":"a","s":"63rd BPSC (Pre.) 2017","n":"Seleucus Nicator sent him to Chandragupta Maurya's court. He had earlier served Seleucus at the court of the satrap of Arachosia.","r":0},{"i":94,"t":"Mauryan Empire","q":"In how many categories did Megasthenes divide the Indian society?","o":[["a","Four"],["b","Five"],["c","Six"],["d","Seven"]],"a":"d","s":"46th BPSC (Pre) 2003","n":"Seven, in the Indica: philosophers, farmers, herders, artisans and traders, warriors, inspectors, and councillors. He records no slavery in India.","r":0},{"i":95,"t":"Mauryan Empire","q":"The description of the administration of Pataliputra is available in?","o":[["a","Divyavadana"],["b","Arthashastra"],["c","Indica"],["d","Ashoka’s inscriptions"]],"a":"c","s":"46th BPSC (Pre) 2004","n":"Megasthenes' Indica, which describes six committees of five members each running the city, and calls the officials Astynomoi.","r":0},{"i":96,"t":"Mauryan Empire","q":"Match List I with List II List-I List-II Event Place Connected with person A Chola Gangam Lake 1 Chandragupta Maurya B Appointment of 2 Harshavardhan Dharma Mahamatra C Assembly at Prayag 3 Rajendra I D Sudarshan Lake 4 Ashoka Select the correct answer using the codes given below: A B C D","o":[["a","3 4 2 1"],["b","1 4 2 3"],["c","3 4 1 2"],["d","2 3 1 4"]],"a":"a","s":"71st BPSC (Pre) 2025","n":"Chola Gangam lake - Rajendra I; Dharma Mahamatras - Ashoka; the Prayag assembly - Harshavardhana; Sudarshana lake - Chandragupta Maurya.","r":0},{"i":97,"t":"Mauryan Empire","q":"The inscription which proves Chandragupta’s sway over western India is:","o":[["a","Kalinga Rock Inscription"],["b","Girnar Rock Inscription of Ashoka"],["c","Junagarh Rock Inscription of Rudradaman"],["d","Sopara Rock Inscription of Ashoka"]],"a":"c","s":"39th BPSC (Pre) 1994","n":"Rudradaman's Junagadh inscription records that Pushyagupta, Chandragupta's governor in Saurashtra, built Sudarshana lake, which places Mauryan authority in the west.","r":0},{"i":98,"t":"Mauryan Empire","q":"In which inscription is Kalinga victory is mentioned?","o":[["a","Maski Inscription"],["b","Rudradaman Inscription"],["c","Junagarh Inscription"],["d","Hathigumpha Inscription"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th BPSC Re-Exam (Pre) 2020","n":"None of the options. Kalinga is described in Ashoka's 13th Major Rock Edict. Hathigumpha is Kharavela's record, not Ashoka's.","r":0},{"i":99,"t":"Mauryan Empire","q":"Which one territory of the following was not a part of Ashoka’s empire?","o":[["a","Afghanistan"],["b","Bihar"],["c","Sri Lanka"],["d","Kalinga"]],"a":"c","s":"42nd BPSC (Pre) 1997-98","n":"Sri Lanka. The Second Rock Edict places Chola, Pandya, Satiyaputra, Keralaputra and Tamraparni (Sri Lanka) outside the empire, as frontier states.","r":0},{"i":100,"t":"Mauryan Empire","q":"The only pillar on which Ashoka declares himself as the emperor of Magadha –","o":[["a","Minor pillar of Maski"],["b","Rummindei pillar"],["c","Queen pillar"],["d","Bhabru pillar"]],"a":"d","s":"39th BPSC (Pre) 1994","n":"The Bhabru (Bairat) inscription, where he addresses the Sangha as king of Magadha. It also confirms his Buddhist allegiance.","r":0},{"i":101,"t":"Mauryan Empire","q":"The central point in Ashoka's Dhamma is -","o":[["a","Loyalty to the king"],["b","Peace and non-violence"],["c","Respect for elders"],["d","Religious tolerance"],["e","None of the above/More than one of the above"]],"a":"e","s":"BPSC Preview (1 | 63rd BPSC (Pre.) 2017","n":"No single option captures it. His Dhamma bundles together non-violence, compassion, charity, truthfulness, respect for elders and religious tolerance, set out in the second and seventh pillar edicts.","r":0},{"i":102,"t":"Mauryan Empire","q":"The name by which Ashoka is referred to in his inscriptions is :","o":[["a","Chakravarti"],["b","Dharmadeva"],["c","Dharmakirti"],["d","Priyadarshi"],["e","None of the above/More than one of the above"]],"a":"d","s":"65th BPSC (Pre) 2019","n":"Priyadarshi. The inscriptions use Devanampiya and Devanampiya Piyadasi; the Puranas call him Ashokavardhana.","r":0},{"i":103,"t":"Mauryan Empire","q":"Language used in the inscriptions of Ashoka is:","o":[["a","Sanskrit"],["b","Prakrit"],["c","Pali"],["d","Hindi"]],"a":"b","s":"44th BPSC (Pre) 2000","n":"Prakrit, mostly in Brahmi script. Shahbazgarhi and Mansehra are in Kharosthi, and Aramaic and Greek appear in the north-west.","r":0},{"i":104,"t":"Mauryan Empire","q":"The script written on Ashoka's Pillars is","o":[["a","Brahmi"],["b","Samaritan"],["c","Pali"],["d","Sanskrit"]],"a":"a","s":"70th BPSC Re-Exam 2024","n":"Brahmi, the script of nearly all his edicts.","r":0},{"i":105,"t":"Mauryan Empire","q":"Which one of the following scripts was written from right to left in ancient India?","o":[["a","Brahmi"],["b","Nandanagari"],["c","Sharada"],["d","Kharosthi"]],"a":"d","s":"BPSC (CDPO) 2005","n":"Kharosthi, a north-western script written right to left, deciphered through the work of Prinsep, Grotefend and Lassen.","r":0},{"i":106,"t":"Mauryan Empire","q":"Which one of the following scripts of ancient India was written from right to left?","o":[["a","Brahmi"],["b","Sharada"],["c","Kharosthi"],["d","Nandanagari"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th BPSC (Pre) 2019","n":"Kharosthi, a north-western script written right to left, deciphered through the work of Prinsep, Grotefend and Lassen.","r":1},{"i":107,"t":"Mauryan Empire","q":"The inscriptions of Ashoka were read for the first time by -","o":[["a","James Prinsep"],["b","Buhler"],["c","Robert Sewell"],["d","Codrington"]],"a":"a","s":"BPSC (Assistant) 2019","n":"James Prinsep, who read the Delhi-Topra inscription in 1837.","r":0},{"i":108,"t":"Mauryan Empire","q":"Who first deciphered the Brahmi script ?","o":[["a","A. Cunningham"],["b","A.H. Dani"],["c","Buhler"],["d","James Prinsep"]],"a":"d","s":"48th to 52nd BPSC (Pre) 2008","n":"James Prinsep, who read the Delhi-Topra inscription in 1837.","r":1},{"i":109,"t":"Mauryan Empire","q":"Which ruler had made Pataliputra the capital of his empire for the first time?","o":[["a","Chandragupta Maurya"],["b","Ashoka the Great"],["c","Chandragupta Vikramaditya"],["d","Kanishka"]],"a":"a","s":"42nd BPSC (Pre) 1997-98","n":"Udayin actually did this, but he is not among the options, so Chandragupta Maurya is taken as the answer.","r":0},{"i":110,"t":"Mauryan Empire","q":"Who was the last ruler of the Mauryan dynasty?","o":[["a","Ashoka"],["b","Samudragupta"],["c","Brihadratha"],["d","Pushyamitra"]],"a":"c","s":"BPSC (CDPO) (Pre) 2005","n":"Brihadratha, killed in 184 BCE by his own commander Pushyamitra Shunga.","r":0},{"i":111,"t":"Mauryan Empire","q":"The last Mauryan emperor was:","o":[["a","Jaloka"],["b","Avanti Verma"],["c","Nandi Vardhana"],["d","Brihadratha"]],"a":"d","s":"48th to 52nd BPSC (Pre) 2008","n":"Brihadratha, killed in 184 BCE by his own commander Pushyamitra Shunga.","r":1},{"i":112,"t":"Mauryan Empire","q":"The decline of the Mauryan Empire was largely due to the economic consequences of Ashoka's policy. Who believed in this fact?","o":[["a","Romila Thapar"],["b","D. N. Jha"],["c","V. A. Smith"],["d","H. C. Raychaudhuri"],["e","None of the above / More than one of the above"]],"a":"a","s":"BPSC CDPO (Pre) 2022","n":"Romila Thapar argued that the economic burden of Ashoka's policies drained the empire.","r":0},{"i":113,"t":"Mauryan Empire","q":"The most famous centre of learning during the Mauryan period was:","o":[["a","Vaishali"],["b","Nalanda"],["c","Taxila"],["d","Ujjain"]],"a":"c","s":"47th BPSC (Pre) 2005","n":"Taxila, the great centre of learning in the Mauryan period, drawing students from across the known world. Nalanda came much later, under the Guptas.","r":0},{"i":114,"t":"Post-Mauryan Period","q":"Consider the following dynasties of Ancient India: 1. Shunga 2. Maurya 3. Kushana 4. Kanva Which of the following is the correct chronological order of their rule? - - - - - -","o":[["a","1 2 3 4"],["b","2 1 4 3 - - - - - -"],["c","2 3 1 4"],["d","2 1 3 4"]],"a":"b","s":"71st BPSC (Pre) 2025","n":"Maurya (321-184 BCE), Shunga (184-73 BCE), Kanva (73-28 BCE), Kushana (1st-3rd centuries CE).","r":0},{"i":115,"t":"Post-Mauryan Period","q":"Epigraphic records (Inscriptions) suggest that in ancient India, the rulers of Bihar had contact with –","o":[["a","Burma"],["b","Thailand"],["c","Cambodia"],["d","Java-Sumatra"]],"a":"d","s":"43rd BPSC (Pre) 1999","n":"Java and Sumatra. Balaputradeva, the Shailendra ruler of Java, asked the Pala king Devapala to endow a monastery at Nalanda, and Devapala granted five villages.","r":0},{"i":116,"t":"Post-Mauryan Period","q":"Who was the king of Suvarnabhumi who established a Buddhist monastery in Nalanda and requested Devapala through his messenger to donate five villages for its maintenance?","o":[["a","Dharanindra"],["b","Sangramadhananjaya"],["c","Balaputradeva"],["d","Chudamani Varman"],["e","None of the above/More than one of the above"]],"a":"c","s":"64th BPSC (Pre) 2018","n":"Java and Sumatra. Balaputradeva, the Shailendra ruler of Java, asked the Pala king Devapala to endow a monastery at Nalanda, and Devapala granted five villages.","r":1},{"i":117,"t":"Post-Mauryan Period","q":"Match List I with List II List-I List-II Places in Ancient Presently in which India State a. Karmasuvarna 1. Maharashtra b. Pragjyotish 2. Gujarat c. Girnar 3. West Bengal d. Pratishthan 4. Assam Select the correct answer using the codes given below: A B C D","o":[["a","3 4 2 1"],["b","4 3 1 2"],["c","3 2 4 1"],["d","4 2 1 3"]],"a":"a","s":"71st BPSC (Pre) 2025","n":"Karnasuvarna - West Bengal (Murshidabad); Pragjyotisha - Assam; Girnar - Gujarat; Pratishthana (Paithan) - Maharashtra.","r":0},{"i":118,"t":"Post-Mauryan Period","q":"Which inscription tells about the various achievements of Rudradaman-I?","o":[["a","Junagadh"],["b","Bhitari"],["c","Nasik"],["d","Sanchi"]],"a":"a","s":"53rd to 55th BPSC (Pre) 2011","n":"The Junagadh inscription, on Girnar hill in Gujarat. The same rock carries Ashoka's fourteen major edicts and a Skandagupta inscription.","r":0},{"i":119,"t":"Post-Mauryan Period","q":"According to the rock inscription in Sanskrit, composed around the second century CE, Sudarshan Lake, an artificial reservoir, was repaired by","o":[["a","Harsha"],["b","Kanishka"],["c","Rudradaman"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th BPSC (Pre) 2022","n":"Rudradaman I. His Junagadh inscription (130-150 CE) is one of the earliest in polished Sanskrit and records the repair of the lake's dam.","r":0},{"i":120,"t":"Post-Mauryan Period","q":"Who among the following first issued gold coins on a large scale?","o":[["a","Pushyamitra Shunga"],["b","Menander"],["c","Vima Kadphises"],["d","Gautamiputra Satakarni"],["e","None of the above/More than one of the above"]],"a":"c","s":"64th BPSC (Pre) 2018","n":"Vima Kadphises. Large-scale gold coinage is the Kushanas' main contribution to Indian currency.","r":0},{"i":121,"t":"Post-Mauryan Period","q":"In pre-Gupta times, a large number of lead coins were issued by the","o":[["a","Satavahanas"],["b","Shakas"],["c","Kushanas"],["d","Mauryas"],["e","None of the above / More than one of the above"]],"a":"a","s":"BPSC (CDPO) 2022","n":"The Satavahanas, whose dynasty was founded by Simuka with its capital at Pratishthana (Paithan). The Puranas call them Andhrabhritya.","r":0},{"i":122,"t":"Post-Mauryan Period","q":"Which dynasty ruled over India after the Shunga dynasty?","o":[["a","Satavahana"],["b","Kushana"],["c","Kanva"],["d","Gupta"]],"a":"c","s":"44th BPSC (Pre) 2000","n":"The Kanvas. Vasudeva, a minister, killed the last Shunga king Devabhuti and founded the line; like the Shungas it was Brahmin.","r":0},{"i":123,"t":"Gupta & Post-Gupta Period","q":"Which Gupta ruler assumed the throne after killing his elder brother?","o":[["a","Shri Gupta"],["b","Samudragupta"],["c","Chandragupta II"],["d","Skandagupta"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th BPSC (Re-Exam) (Pre)-2022","n":"Chandragupta II killed his brother Ramagupta, who had failed against the Shakas, married Ramagupta's wife Dhruvadevi and then defeated the Shakas himself.","r":0},{"i":124,"t":"Gupta & Post-Gupta Period","q":"Who is called ‘the Napoleon of Ancient India’?","o":[["a","Chandragupta Maurya"],["b","Pushyamitra"],["c","Kanishka"],["d","Samudragupta"]],"a":"d","s":"56th to 59th BPSC (Pre) 2014","n":"Samudragupta. Vincent Smith gave him the label in The Early History of India; his campaigns are recorded in Harishena's Prayag Prashasti.","r":0},{"i":125,"t":"Gupta & Post-Gupta Period","q":"The Gupta emperor who defeated the ‘Hunas’ was:","o":[["a","Samudragupta"],["b","Chandragupta- II"],["c","Skandagupta"],["d","Ramagupta"]],"a":"c","s":"53rd to 55th BPSC (Pre) 2011","n":"Skandagupta beat back the first Huna invasion around 455 CE. The raid did no lasting damage directly but hastened the empire's decline.","r":0},{"i":126,"t":"Gupta & Post-Gupta Period","q":"Who was the founder of Nalanda University?","o":[["a","Chandragupta Vikramaditya"],["b","Kumaragupta"],["c","Dharmapal"],["d","Pushyagupta"]],"a":"b","s":"56th to 59th BPSC (Pre) 2014","n":"Kumaragupta I, whom Hiuen Tsang names as Shakraditya. His better-known title was Mahendraditya.","r":0},{"i":127,"t":"Gupta & Post-Gupta Period","q":"Nalanda University was founded during the dynasty of","o":[["a","Maurya"],["b","Kushan"],["c","Gupta"],["d","Pala"]],"a":"c","s":"43rd BPSC (Pre) 1999","n":"Kumaragupta I, whom Hiuen Tsang names as Shakraditya. His better-known title was Mahendraditya.","r":1},{"i":128,"t":"Gupta & Post-Gupta Period","q":"Who among the following was not an Acharya in the Nalanda Vishvavidyalaya?","o":[["a","Kautilya"],["b","Nagarjuna"],["c","Shilabhadra"],["d","Shantarakshita"]],"a":"a","s":"71st BPSC (Pre) 2025","n":"Kautilya belongs to the fourth-third century BCE and to Taxila, long before Nalanda existed. Nagarjuna, Shilabhadra and Shantarakshita all taught there.","r":0},{"i":129,"t":"Gupta & Post-Gupta Period","q":"Why was Nalanda University famous in the world?","o":[["a","Medical Science"],["b","Philosophy"],["c","Buddhist Religious Philosophy"],["d","Chemical Science"]],"a":"c","s":"42nd BPSC (Pre) 1997-98","n":"For Buddhist philosophy. Hiuen Tsang came specifically to study it there.","r":0},{"i":130,"t":"Gupta & Post-Gupta Period","q":"Out of two statements below first is Assertion(A) and second is Reason (R), carefully read both statements. Assertion (A) : Till the end of the twelfth century Nalanda Mahavihara lost its glory. Reason (R) : State protection ceased to be available to the Mahavihara. With respect to the above-mentioned two statements, which of the following is true?","o":[["a","(A) and (R) both are true, and (R) is the correct explanation of (A)."],["b","(A) and (R) both are true, and (R) is not the correct explanation of (A)."],["c","(A) is true, but (R) is false."],["d","(A) is false, but (R) is true."]],"a":"b","s":"BPSC Preview (2 | 41st BPSC (Pre) 1996","n":"Both statements are true but the reason given is not the explanation. Nalanda declined through the Turkish invasions of the late twelfth century, while the loss of patronage came from the Palas favouring Vikramashila.","r":0},{"i":131,"t":"Gupta & Post-Gupta Period","q":"Consider the following statements : 1. Fa-Hien was a Chinese pilgrim who visited India during the reign of Harsha. 2. Hiuen Tsang was a Chinese Buddhist monk who visited India during the reign of Chandragupta II. Which of the above statements is/are correct?","o":[["a","Only 1"],["b","Only 2"],["c","Both 1 and 2"],["d","None of the above"]],"a":"d","s":"69th BPSC (Pre) 2023","n":"Both statements are wrong, and they are swapped. Fa-Hien came under Chandragupta II, Hiuen Tsang under Harsha.","r":0},{"i":132,"t":"Gupta & Post-Gupta Period","q":"The famous Chinese pilgrim Fa-Hien visited India during the reign of:","o":[["a","Chandragupta I"],["b","Chandragupta II"],["c","Ramagupta 23) General Studies"],["d","Srigupta"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd BPSC (Pre) 2017","n":"Both statements are wrong, and they are swapped. Fa-Hien came under Chandragupta II, Hiuen Tsang under Harsha.","r":1},{"i":133,"t":"Gupta & Post-Gupta Period","q":"The gradual decline of towns was an important feature of which period?","o":[["a","Gupta period"],["b","Pratihara era"],["c","Rashtrakut"],["d","Satavahana era"]],"a":"a","s":"40th BPSC (Pre) 1995","n":"The Gupta period. Once-prosperous Ganga valley towns were abandoned or shrank, and by Hiuen Tsang's visit Pataliputra had fallen to the size of a village.","r":0},{"i":134,"t":"Gupta & Post-Gupta Period","q":"Which one of the following ports was in use for the North Indian trade during the Gupta period?","o":[["a","Kalyan"],["b","Tamralipti"],["c","Broach"],["d","Cambay"],["e","None of the above/More than one of the above"]],"a":"e","s":"65th BPSC (Pre) 2019","n":"No single option works. Tamralipti in Bengal handled north Indian trade with South-East Asia and China, but Bharuch, Kalyan and Cambay were also in use.","r":0},{"i":135,"t":"Gupta & Post-Gupta Period","q":"Which ruling dynasty donated the maximum villages to temples and Brahmins?","o":[["a","Gupta Dynasty"],["b","Pala Dynasty"],["c","Rashtrakuta"],["d","Pratihara"]],"a":"a","s":"39th BPSC (Pre) 1994","n":"The Guptas. Their inscriptions show that land grants to Brahmins and temples carried the village's revenue along with the land.","r":0},{"i":136,"t":"Gupta & Post-Gupta Period","q":"What was the land revenue rate in the Gupta age?","o":[["a","Fourth part of the production"],["b","Sixth part of the production"],["c","Eighth part of the production"],["d","Half part of the production"]],"a":"b","s":"42nd BPSC (Pre) 1997-98","n":"One-sixth of the produce, the shashthansha. Gupta inscriptions call the land tax bhagakara or udranga.","r":0},{"i":137,"t":"Gupta & Post-Gupta Period","q":"What is the rate of land revenue in the Dharmashastras?","o":[["a","1/3"],["b","1/4"],["c","1/6"],["d","1/8"]],"a":"c","s":"40th BPSC (Pre) 1995","n":"One-sixth, the rate given in almost every Dharmashastra text.","r":0},{"i":138,"t":"Gupta & Post-Gupta Period","q":"What type of land was called ‘Aprahata’?","o":[["a","Unploughed wild land"],["b","Irrigated land"],["c","Land with dense forests"],["d","Ploughed/cultivated land"],["e","None of the above / More than one of the above"]],"a":"a","s":"60th to 62nd BPSC (Pre) 2016","n":"Aprahata was wild, unploughed land that had never been brought under cultivation, a term from the Gupta revenue vocabulary.","r":0},{"i":139,"t":"Gupta & Post-Gupta Period","q":"Consider the types of land according to the Amarkosha: (A) Urvara-fertile (B) Maru-desert (C) Shadvala-grassy (D) Devamatrika-watered by rain Which of the following is correct ?","o":[["a","(A) and (B) both"],["b","(C) and (D) both"],["c","(B), (C) and (D)"],["d","More than one of the above"]],"a":"d","s":"70th BPSC Pre-2024","n":"More than one pairing is right. The Amarakosha of Amarasimha, a courtier of Chandragupta II, lists twelve land types including urvara (fertile), maru (desert), ushara (barren), aprahata (fallow) and shadvala (grassy).","r":0},{"i":140,"t":"Gupta & Post-Gupta Period","q":"Who was the author of the famous ‘Allahabad Prashasti’?","o":[["a","Kalidasa"],["b","Harishena"],["c","Ravikirti"],["d","Shudraka"],["e","None of the above / More than one of the above"]],"a":"b","s":"BPSC (CDPO) (Pre) 2022","n":"Harishena, who composed it on an Ashokan pillar at Prayagraj in praise of Samudragupta. He describes himself as Sandhivigrahika, Kumaramatya and Dandanayaka.","r":0},{"i":141,"t":"Gupta & Post-Gupta Period","q":"In the Puranas, the rulers of which dynasty were called ‘Shriparvatiya’?","o":[["a","Vakataka"],["b","Ikshvaku"],["c","Shaka"],["d","Kharavela"]],"a":"b","s":"65th BPSC Re -Exam (Pre) 2020","n":"The Ikshvakus, called Shriparvatiya and Andhrabhritya in the Puranas. Once Satavahana feudatories, they broke away under Shri Shantamula.","r":0},{"i":142,"t":"Gupta & Post-Gupta Period","q":"Consider the following about the King “Pravaerasena” : (A) He was the real founder of the Vakataka dynasty. (B) His empire extended from Bundelkhand in the north to Hyderabad in the South. (C) He succeeded his father king Vindhyashakti. (D) He is mentioned in the Puranas. Which of the following statements are correct ?","o":[["a","(A) and (B) both"],["b","(A) and (C) both"],["c","(B), (C) and (D)"],["d","More than one of the above"]],"a":"d","s":"BPSC Preview (2 | 70th BPSC Pre-2024","n":"More than one statement holds. Vindhyashakti I founded the Vakatakas, but Pravarasena I is treated as the real founder, and the dynasty ruled central and southern India from the third to the early sixth century CE.","r":0},{"i":143,"t":"Gupta & Post-Gupta Period","q":"The Huna King Toramana was defeated by the Aulikara King","o":[["a","Yasodharman"],["b","Prakashadharman"],["c","Rajyavardhana"],["d","Vishnuvardhana"],["e","None of the above/More than one of the above"]],"a":"b","s":"BPSC CDPO 2018","n":"Prakashadharman, the Aulikara king. Toramana led the second Huna wave after Skandagupta's death; his Eran boar inscription records his presence in central India.","r":0},{"i":144,"t":"Gupta & Post-Gupta Period","q":"Who laid the foundation of the Vardhana Dynasty?","o":[["a","Pushyabhuti"],["b","Rajyavardhana"],["c","Adityavardhana"],["d","Prabhakarvardhana"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th BPSC (Re-Exam) (Pre)-2021","n":"Pushyabhuti, at Thanesar, according to Banabhatta's Harshacharita. Harshavardhana was the dynasty's greatest ruler.","r":0},{"i":145,"t":"Gupta & Post-Gupta Period","q":"Poet Bana was an inhabitant of –","o":[["a","Pataliputra"],["b","Thanesar"],["c","Bhojpur"],["d","None of the above"]],"a":"d","s":"41st BPSC (Pre) 1996","n":"The sources disagree, so no option stands. One tradition puts his birth at Pritikuta on the Son in Bihar, another near Kannauj in Uttar Pradesh.","r":0},{"i":146,"t":"Gupta & Post-Gupta Period","q":"Which Chinese traveller visited India during Harsha- vardhana’s rule?","o":[["a","Fa-Hien"],["b","Hiuen-Tsang"],["c","I-Tsing"],["d","Taranath"]],"a":"b","s":"56th to 59th BPSC (Pre) 2014","n":"Hiuen Tsang, whose visit is the best-documented event of Harsha's reign.","r":0},{"i":147,"t":"Gupta & Post-Gupta Period","q":"Chinese traveller Hiuen Tsang studied at the University of –","o":[["a","Taxila"],["b","Vikramashila"],["c","Magadh"],["d","Nalanda"]],"a":"d","s":"46th BPSC (Pre) 2004","n":"Nalanda, where he arrived in 637 CE and studied Yogashastra for about fifteen months under Acharya Shilabhadra.","r":0},{"i":148,"t":"Gupta & Post-Gupta Period","q":"During Hiuen-Tsang tour in India the most famous city for the production of cotton clothes was:","o":[["a","Varanasi"],["b","Mathura"],["c","Pataliputra"],["d","Kanchi"]],"a":"b","s":"BPSC Preview (2 | 41st BPSC (Pre) 1996","n":"Mathura, famous for cotton. Varanasi was the silk centre, and Thanesar prospered on trade.","r":0},{"i":149,"t":"Gupta & Post-Gupta Period","q":"Which of the following rulers ruled Assam during the time of Harsha?","o":[["a","Asaf Jahan"],["b","Bhaskar Varman"],["c","Raja Dahir"],["d","More than one of the above"]],"a":"b","s":"70th BPSC (Pre) 2024","n":"Bhaskaravarman of the Varman dynasty of Kamarupa, Harsha's ally in Assam.","r":0},{"i":150,"t":"Gupta & Post-Gupta Period","q":"Who was the ruler of India during the 7th century CE known for his patronage of Buddhism and support for cultural activities?","o":[["a","Harsha"],["b","Ashoka the Great"],["c","Chandragupta Maurya"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"BPSC (Tre-3) July, 2024","n":"Harshavardhana of the Pushyabhuti dynasty, who ruled roughly 606-647 CE and patronised Buddhism.","r":0},{"i":151,"t":"Gupta & Post-Gupta Period","q":"During the Gupta-Vakataka Era, which important school of Indian philosophy developed, focusing on logical reasoning and debate?","o":[["a","Vaisheshika"],["b","Mimamsa"],["c","Nyaya"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"BPSC TRE-3 July, 2024","n":"Nyaya, the school built on logic and debate, founded by Gautama. It separates valid knowledge (prama) from invalid (aprama).","r":0},{"i":152,"t":"Gupta & Post-Gupta Period","q":"Who among these was the first to explain that the daily sunrise and sunset occur due to the Earth's rotation on its axis?","o":[["a","Aryabhatta"],["b","Bhaskara"],["c","Brahmagupta"],["d","Varahamihira"],["e","None of the above/More than one of the above"]],"a":"a","s":"64th BPSC (Pre) 2018","n":"Aryabhata, who explained the apparent daily movement of the sun by the Earth's rotation on its axis.","r":0},{"i":153,"t":"Gupta & Post-Gupta Period","q":"Who among the following is known for his work on medicine during the Gupta period?","o":[["a","Sushruta"],["b","Saumilla"],["c","Shudraka"],["d","Shaunaka"],["e","None of the above/More than one of the above"]],"a":"e","s":"65th BPSC (Pre) 2019","n":"No option fits the Gupta period. Sushruta, the father of surgery, belongs to roughly 1000-600 BCE, about a millennium too early.","r":0},{"i":154,"t":"Architecture in Ancient India","q":"Who used the caves of Barabar as their shelter-house?","o":[["a","Ajivakas"],["b","Tharus"],["c","Jains"],["d","Tantrikas"]],"a":"a","s":"40th BPSC (Pre) 1995","n":"The Ajivikas. Ashoka and his grandson Dasharatha cut caves in the Barabar and Nagarjuni hills for them, including the Sudama cave and Karna Chaupar.","r":0},{"i":155,"t":"Architecture in Ancient India","q":"In Indian art, the construction of ‘Stupa’, ‘Chaitya’ and ‘Vihara’ is related to which of the following?","o":[["a","Ajivika sect"],["b","Vaishnava sect"],["c","Buddhism"],["d","Shaiva sect"]],"a":"c","s":"69th BPSC (Pre) 2023","n":"Buddhism. The stupa holds relics, the chaitya is the prayer hall and the vihara the monastic residence.","r":0},{"i":156,"t":"Architecture in Ancient India","q":"The associates of Khajuraho Temple Architecture were –","o":[["a","Chandela"],["b","Gurjara-Pratihara"],["c","Chahamana"],["d","Paramara"]],"a":"a","s":"43rd BPSC (Pre) 1999","n":"The Chandelas, who built the Khajuraho temples in Chhatarpur district, Madhya Pradesh, mainly between about 950 and 1050 CE.","r":0},{"i":157,"t":"Architecture in Ancient India","q":"Art of Gandhara style flourished during the reign of –","o":[["a","Kushans"],["b","Guptas"],["c","Akbar"],["d","Mauryas"]],"a":"a","s":"38th BPSC (Pre) 1992","n":"The Kushanas. Gandhara art, with its Greco-Roman treatment of the Buddha figure, flourished under them.","r":0},{"i":158,"t":"Architecture in Ancient India","q":"The oldest sculpture of Buddha is made in which style?","o":[["a","Gandhara Style"],["b","Mathura Style"],["c","Mauryan Style"],["d","Gupta Style"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th BPSC Re-Exam (Pre) 2020","n":"Gandhara is the answer taken here, though Mathura has a rival claim: V.S. Agrawal argued Buddha images were first made at Mathura. Both schools produced them under the Kushanas.","r":0},{"i":159,"t":"Architecture in Ancient India","q":"The temple of Deogarh near Jhansi and the sculptures in the temple at Garwha near Allahabad (Prayagraj) are the important remains of the which art?","o":[["a","Mauryan Art"],["b","Gupta Art"],["c","Rashtrakuta Art"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"70th BPSC Re-Exam (Pre) 2024 | 68th BPSC (Pre) 2023","n":"Gupta art. The Dashavatara temple at Deogarh and the Garhwa remains near Prayagraj are standard Gupta-period examples.","r":0},{"i":160,"t":"Architecture in Ancient India","q":"The painting of ‘Bodhisattva Padmapani’ is located at","o":[["a","Bagh"],["b","Ellora"],["c","Ajanta"],["d","Badami"]],"a":"c","s":"69th BPSC (Pre) 2023","n":"Ajanta, in the rock-cut Buddhist caves. The Padmapani mural dates to roughly the fifth-sixth century CE.","r":0},{"i":161,"t":"Architecture in Ancient India","q":"In which of the following inscriptions is an example of widow-burning mentioned?","o":[["a","Eran stone inscription of Samudragupta"],["b","Eran Pillar Inscription of Buddhagupta"],["c","Eran Pillar Inscription of Bhanugupta"],["d","Eran Varaha Inscription of Toramana"],["e","None of the above/More than one of the above"]],"a":"c","s":"BPSC (CDPO) (Pre) 2018","n":"The Eran pillar inscription of Bhanugupta, dated 510 CE, which records the sati of the wife of Goparaja after he died in battle. Eran is in Sagar district, Madhya Pradesh.","r":0},{"i":162,"t":"Architecture in Ancient India","q":"The contributors in the construction of Khajuraho temple architecture were—","o":[["a","Chandelas"],["b","Gurjara-Pratiharas"],["c","Chahamanas"],["d","Paramaras"]],"a":"a","s":"43rd BPSC (Pre) 1999","n":"The Chandelas, who built the Khajuraho temples in Chhatarpur district, Madhya Pradesh, mainly between about 950 and 1050 CE.","r":1},{"i":163,"t":"Architecture in Ancient India","q":"Borobudur is the most amazing stupa in the world and whose magnificent example is its statue and sculpture?","o":[["a","Indo-Tibetan art"],["b","Indo-Cambodian art"],["c","India-Champa Art"],["d","India-Java Art"],["e","None of the above/More than one of the above"]],"a":"d","s":"BPSC (CDPO) (Pre) 2022","n":"Indo-Javanese art. Borobudur stands on Java in Indonesia and is a UNESCO World Heritage Site.","r":0},{"i":164,"t":"Architecture in Ancient India","q":"According to Chinese source, Meghavarman, the ruler of Sri Lanka, sent a missionary to which of the following Gupta Kings for permission to build a Buddhist temple at Gaya?","o":[["a","Chandragupta I"],["b","Samudragupta"],["c","Chandragupta II"],["d","None of them"]],"a":"b","s":"69th BPSC (Pre) 2023","n":"Samudragupta, who allowed the Sri Lankan king Meghavarman to build a monastery at Bodh Gaya.","r":0},{"i":165,"t":"South India & Sangam Age","q":"Who was the founder of Chola dynasty?","o":[["a","Vijayalaya"],["b","Karikal"],["c","Aditya first"],["d","Rajaraja first"],["e","None of the above/ More than one of the above"]],"a":"a","s":"67th BPSC (Pre) 2022","n":"Vijayalaya, once a Pallava feudatory, who took Tanjore around 850 CE.","r":0},{"i":166,"t":"South India & Sangam Age","q":"The Chola age was most famous for:","o":[["a","Village assemblies"],["b","War with the Rashtrakutas"],["c","Trade with Ceylon"],["d","Advancement of Tamil culture"],["e","None of the above/More than one of the above"]],"a":"a","s":"63rd BPSC (Pre.) 2017","n":"Its village assemblies. Chola villages ran their own affairs, the most developed local self-government in Indian history.","r":0},{"i":167,"t":"South India & Sangam Age","q":"Which medieval Indian empire was famous for elaborate local self-government?","o":[["a","Chalukya"],["b","Chola"],["c","Solanki"],["d","Parmar"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th BPSC (Pre) 2020","n":"Its village assemblies. Chola villages ran their own affairs, the most developed local self-government in Indian history.","r":1},{"i":168,"t":"South India & Sangam Age","q":"Which dynasty built the Kailasanatha Temple and in which state?","o":[["a","Chola, Andhra Pradesh"],["b","Chola, Tamil Nadu"],["c","Pallava, Tamil Nadu"],["d","Pallava, Andhra Pradesh"]],"a":"c","s":"BPSC (Assistant) 2019","n":"The Pallavas, at Kanchipuram in Tamil Nadu.","r":0},{"i":169,"t":"South India & Sangam Age","q":"Which of the following temples is located in Kanchipuram?","o":[["a","Sri Venkateswara Swami Vari Temple"],["b","Sri Padmanabhaswamy Temple"],["c","Arulmigu Ramanathaswamy Temple"],["d","Ekambareswarar Temple"]],"a":"d","s":"BPSC CDPO (Pre) 2009","n":"The Eka
