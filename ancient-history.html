ade routes of ancient India:","o":[["a","Sangam Literature"],["b","Milindpanho"],["c","Jataka Tales"],["d","All of the above"]],"a":"b","s":"39th BPSC (Pre) 1994","n":"The Milindapanho, a Pali dialogue between the monk Nagasena and the Indo-Greek king Menander. It says nothing about trade routes.","r":0},{"i":196,"t":"Ancient Literature","q":"Who wrote the book 'Harshacharita'?","o":[["a","Aryabhata"],["b","Banabhatta"],["c","Vishnugupta"],["d","Parimalagupta"]],"a":"b","s":"47th BPSC (Pre) 2005","n":"Banabhatta. The Harshacharita is the principal source for the Vardhana dynasty and a biography of his own patron.","r":0},{"i":197,"t":"Ancient Literature","q":"Match List–I with List–II : List—I List—II A. Charaka 1. Mathematics B. Brahmagupta 2. Medicine C. Varahamihira 3. Playwright D. Vishakhadatta 4. Astrology Select the correct answer using the codes given below. A B C D","o":[["a","2 1 4 3"],["b","1 2 3 4"],["c","3 2 4 1"],["d","1 4 3 2"]],"a":"a","s":"69th BPSC (Pre) 2023","n":"Charaka - medicine; Brahmagupta - mathematics; Varahamihira - astrology; Vishakhadatta - drama.","r":0},{"i":198,"t":"Ancient Literature","q":"Nitisara, an early book of politics, was written by","o":[["a","Kautilya"],["b","Kamandaka"],["c","Charaka"],["d","None of them"]],"a":"b","s":"69th BPSC (Pre) 2023","n":"Kamandaka. The Nitisara runs to 1,192 verses on statecraft, the Mandala theory and the constituents of the state.","r":0},{"i":199,"t":"Pre-Medieval Period","q":"Who was the founder of the Karnata dynasty?","o":[["a","Nanyadeva"],["b","Narasimhadeva"],["c","Vijaydev"],["d","Haridev"],["e","None of the above/More than one of the above"]],"a":"a","s":"56th to 59th BPSC (Pre) 2014","n":"Nanyadeva (1097-1147 CE), who made Simraongarh his capital. The Karnat period, 1097-1325 CE, is called the golden age of Mithila.","r":0},{"i":200,"t":"Pre-Medieval Period","q":"Who was the last king of the Karnata dynasty?","o":[["a","Harisimha"],["b","Ramsimha"],["c","Matisimha"],["d","Shyamsimha"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd BPSC (Pre) 2016","n":"Harisimha Deva, a patron of art and letters who introduced a registration system.","r":0},{"i":201,"t":"Pre-Medieval Period","q":"Consider the following statements regarding the Vikramshila University in Bihar : 1. It was located in the present-day Banka district of Bihar. 2. It was established by King Gopala I of the Pala dynasty. 3. The ‘Vajrayana’ sect of Buddhism flourished here. 4. Other subjects like Astronomy, Logic, Law, Grammar and Philosophy were also taught here. Which of the above statements are incorrect ?","o":[["a","2 and 3"],["b","1 and 4"],["c","1 and 2"],["d","None of the above"]],"a":"c","s":"69th BPSC (Pre) 2023","n":"Statements 1 and 2 are the wrong ones. Vikramashila was in Bhagalpur district, not Banka, and Dharmapala founded it, not Gopala. Vajrayana genuinely did flourish there.","r":0},{"i":202,"t":"Pre-Medieval Period","q":"Which ruler of Bengal founded the ancient University called ‘Vikramshila.’","o":[["a","Dharamapala"],["b","Gopala"],["c","Devpala"],["d","Mahipala 43rd B. P.S.C. (Pre) 1999"]],"a":"a","s":"BPSC","n":"Dharmapala of the Palas (770-810 CE). Lama Taranatha records that by the tenth century it had outgrown Nalanda.","r":0},{"i":203,"t":"Pre-Medieval Period","q":"Vikramshila University was established by whom?","o":[["a","Gopal"],["b","Dharmapala"],["c","Devapala"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"68th BPSC (Pre) 2023","n":"Dharmapala of the Palas (770-810 CE). Lama Taranatha records that by the tenth century it had outgrown Nalanda.","r":1},{"i":204,"t":"Pre-Medieval Period","q":"The founder of Vikramashila Education Center is -","o":[["a","Devpal"],["b","Dharmpal"],["c","Nayanpal"],["d","Narendra Pal"]],"a":"b","s":"43rd BPSC (Pre) 1999","n":"Dharmapala of the Palas (770-810 CE). Lama Taranatha records that by the tenth century it had outgrown Nalanda.","r":1},{"i":205,"t":"Pre-Medieval Period","q":"The Maithili language was started to develop during the reign of which of the following?","o":[["a","Chero dynasty"],["b","Oiniwar dynasty"],["c","Karnat dynasty"],["d","Pithipatis"]],"a":"c","s":"69th BPSC (Pre) 2023","n":"The Karnat dynasty, between the eleventh and fourteenth centuries. Nanyadeva founded the line.","r":0},{"i":206,"t":"Pre-Medieval Period","q":"‘Odantapura’ educational center was located in which state?","o":[["a","Bengal"],["b","Bihar"],["c","Gujarat"],["d","Tamil Nadu"],["e","None of these/More than one of the above"]],"a":"b","s":"60th to 62nd BPSC(Pre) 2016","n":"Bihar. Odantapuri was founded by Gopala, the first Pala ruler.","r":0},{"i":207,"t":"Pre-Medieval Period","q":"Which Sultan was reputed to be 'Akbar of Kashmir'?","o":[["a","Sultan Shamsuddin Shah"],["b","Sultan Qutbuddin"],["c","Sultan Sikandar"],["d","Sultan Zainul Abidin"],["e","None of the above/More than one of the above"]],"a":"d","s":"64th BPSC (Pre) 2018","n":"Zain-ul-Abidin, called the Akbar of Kashmir for his religious tolerance and reforms. He had Sanskrit works translated and patronised scholars such as Shri Bhatt.","r":0}];
const TOPICS = [["Stone Age", 6], ["Indus Valley Civilization", 13], ["Vedic Age", 10], ["Buddhism", 23], ["Jainism", 10], ["Shaiva & Bhagavata Religion", 2], ["6th Century BCE - Political Condition", 23], ["Greek Invasion", 1], ["Mauryan Empire", 26], ["Post-Mauryan Period", 9], ["Gupta & Post-Gupta Period", 31], ["Architecture in Ancient India", 11], ["South India & Sangam Age", 12], ["Ancient Literature", 22], ["Pre-Medieval Period", 9]];
const app = document.getElementById('app');

let pool = [], idx = 0, picks = {}, title = '';
const seen = {};

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ------------------------- theme toggle ------------------ */
const toggleBtn = document.getElementById('theme-toggle');
toggleBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!localStorage.getItem('theme')) {
    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
  }
});

/* ------------------------- index ------------------------- */
function home(){
  const total = DATA.length;
  app.innerHTML = `
    <header>
      <div class="masthead-nav">
        <a href="index.html" class="portal-bread">← BPSC PYQs and Notes Portal</a>
      </div>
      <h1>Ancient India</h1>
      <p class="sub">Every previous-year question from the chapter — <b>${total}</b> in all,
      from the 38th BPSC Prelims through the 71st.</p>
    </header>
    <div class="index">
      ${TOPICS.map(([t,n],i)=>{
        const s = seen[t];
        return `<button class="topic" data-t="${i}">
          <span class="name">${esc(t)}</span><span class="rule"></span>
          ${s?`<span class="done">${s.right}/${s.done}</span>`:''}
          <span class="n">${n}</span></button>`;
      }).join('')}
    </div>
    <button class="allbtn" id="all">Practise all ${total} questions</button>
    <p class="note">Answer keys are the ones printed in the book. Three questions were later
    cancelled by the Commission; they are flagged and left out of your score.
    Progress is kept for this session only — closing the page clears it.</p>`;

  app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{
    const t = TOPICS[+b.dataset.t][0];
    start(DATA.filter(d=>d.t===t), t);
  });
  document.getElementById('all').onclick = ()=>start(DATA.slice(), 'All topics');
}

/* ------------------------- quiz -------------------------- */
function start(list, name){ pool=list; title=name; idx=0; picks={}; question(); }

function question(){
  const q = pool[idx];
  const picked = picks[q.i];
  const dead = q.a === '*';
  const done = Object.keys(picks).length;
  const right = Object.values(picks).filter(p=>p.ok).length;

  app.innerHTML = `
    <div class="bar">
      <button class="back" id="back">← Topics</button>
      <span class="now">${esc(title)}</span>
      <span class="tally"><span class="ok">${right}</span> / ${done} answered</span>
    </div>
    <div class="track"><i style="width:${(idx+1)/pool.length*100}%"></i></div>
    <div class="meta">
      <span>Question ${idx+1} of ${pool.length}</span>
      <span>·</span><span>${esc(q.s)}</span>
      ${dead?'<span class="flag">Cancelled by BPSC</span>':''}
    </div>
    <p class="stem">${esc(q.q)}</p>
    <div class="opts">
      ${q.o.map(([k,v])=>{
        let cls='';
        if(picked){
          if(k===q.a) cls=' right';
          else if(k===picked.k) cls=' wrong';
        }
        return `<button class="opt${cls}" data-k="${k}" ${picked?'disabled':''}>
          <span class="k">${k}</span><span class="v">${esc(v)}</span></button>`;
      }).join('')}
    </div>
    ${!picked ? '<div class="why"></div>' : `
      <div class="why">
        <p class="verdict ${picked.ok?'ok':'no'}">${
          picked.ok ? 'Correct.'
          : dead ? 'Withdrawn by the Commission — there is no valid key.'
          : `The answer is (${q.a}).`
        }</p>
        <p class="note">${esc(q.n)}</p>
        ${q.r?'<p class="again">BPSC has asked this fact in more than one year.</p>':''}
      </div>`}
    <div class="nav">
      <button id="prev" ${idx===0?'disabled':''}>Previous</button>
      <button id="next" class="go">${idx===pool.length-1?'See results':'Next'}</button>
    </div>
    <p class="keys">Keys 1–5 to answer · ← → to move</p>`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.k));
  document.getElementById('back').onclick = home;
  document.getElementById('prev').onclick = ()=>{ if(idx>0){idx--;question();} };
  document.getElementById('next').onclick = ()=>{ idx<pool.length-1 ? (idx++,question()) : results(); };
}

function answer(k){
  const q = pool[idx];
  if(picks[q.i]) return;
  const ok = k === q.a;
  picks[q.i] = {k, ok};
  if(q.a !== '*'){
    const s = seen[q.t] || (seen[q.t] = {done:0, right:0});
    s.done++; if(ok) s.right++;
  }
  question();
}

/* ------------------------ results ------------------------ */
function results(){
  const graded = pool.filter(q=>q.a!=='*' && picks[q.i]);
  const right = graded.filter(q=>picks[q.i].ok).length;
  const pct = graded.length ? Math.round(right/graded.length*100) : 0;
  const wrong = pool.filter(q=>picks[q.i] && !picks[q.i].ok && q.a!=='*');

  const byTopic = {};
  graded.forEach(q=>{
    const b = byTopic[q.t] || (byTopic[q.t]={d:0,r:0});
    b.d++; if(picks[q.i].ok) b.r++;
  });

  app.innerHTML = `
    <header>
      <h1>${esc(title)}</h1>
      <p class="score">${pct}%<small> · ${right} of ${graded.length}</small></p>
      <p class="sub">${pool.length-graded.length} left unanswered</p>
    </header>
    <div class="rows">
      ${Object.entries(byTopic).map(([t,b])=>`
        <div class="row"><span class="name">${esc(t)}</span>
        <span class="sc">${b.r}/${b.d}</span></div>`).join('')}
    </div>
    <div class="nav">
      <button id="again">Back to topics</button>
      ${wrong.length?`<button id="redo" class="go">Redo ${wrong.length} missed</button>`:''}
    </div>`;

  document.getElementById('again').onclick = home;
  const r = document.getElementById('redo');
  if(r) r.onclick = ()=>start(wrong, 'Questions you missed');
}

/* ---------------------- keyboard ------------------------- */
document.addEventListener('keydown', e=>{
  if(!pool.length) return;
  const n = document.getElementById('next'), p = document.getElementById('prev');
  if(e.key==='ArrowRight' && n){ n.click(); e.preventDefault(); }
  if(e.key==='ArrowLeft' && p && !p.disabled){ p.click(); e.preventDefault(); }
  if(/^[1-5]$/.test(e.key)){
    const b = app.querySelectorAll('.opt')[+e.key-1];
    if(b && !b.disabled) b.click();
  }
});

home();
</script>
</body>
</html>
