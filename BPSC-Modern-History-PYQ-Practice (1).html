gh, while the Bangkok Conference resolutions of June 1942 paved the way for the formation of the INA (Indian National Army). It is noteworthy that Indian residents in the Malaya region formed a political organisation named the “All Malaya Indian Independence League”. Rash Bihari Bose was invited to preside over it. In the Bangkok Conference held in June 1942, a proposal was made to form a “Council of Action” and a “Representative Committee”, which was entrusted with the responsibility of coordination and supervision between the “Indian Independence League” and the “Indian National Army”. Rash Behari Bose was made the Chairman of the Council of Action, while K. P. K. Menon and Nedyam Raghavan were civilian members, and Mohan Singh and Gilani were military members. Due to ideological differences with the Japanese, Mohan Singh announced the dissolution of the INA in December 1942; however, Rash Behari Bose removed Mohan Singh from his post. Later, Mohan Singh was arrested by the Japanese army. The leadership of the INA was handed over by Rash Bihari Bose to the great leader Subhas Chandra Bose. Two days after reaching Singapore, on 4 July 1943, Subhas Chandra Bose assumed the leadership of the Indian National Army. For convenience, it is also called the Second Indian National Army. In Hindi, we know it as the “Azad Hind Fauj.”","b":true},{"id":474,"c":44,"q":"The result of whose brain is I.N.A. and who founded it?","o":[["a","Subhas Chandra Bose"],["b","Mohan Singh"],["c","Chandra Shekhar Azad"],["d","Bhagat Singh"]],"a":"b","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"In practical terms, as a military unit, the Indian National Army (another name—Azad Hind Fauj) was formed on 15 July 1942 under the leadership of Captain Mohan Singh, while the Bangkok Conference resolutions of June 1942 paved the way for the formation of the INA (Indian National Army). It is noteworthy that Indian residents in the Malaya region formed a political organisation named the “All Malaya Indian Independence League”. Rash Bihari Bose was invited to preside over it. In the Bangkok Conference held in June 1942, a proposal was made to form a “Council of Action” and a “Representative Committee”, which was entrusted with the responsibility of coordination and supervision between the “Indian Independence League” and the “Indian National Army”. Rash Behari Bose was made the Chairman of the Council of Action, while K. P. K. Menon and Nedyam Raghavan were civilian members, and Mohan Singh and Gilani were military members. Due to ideological differences with the Japanese, Mohan Singh announced the dissolution of the INA in December 1942; however, Rash Behari Bose removed Mohan Singh from his post. Later, Mohan Singh was arrested by the Japanese army. The leadership of the INA was handed over by Rash Bihari Bose to the great leader Subhas Chandra Bose. Two days after reaching Singapore, on 4 July 1943, Subhas Chandra Bose assumed the leadership of the Indian National Army. For convenience, it is also called the Second Indian National Army. In Hindi, we know it as the “Azad Hind Fauj.”","b":true},{"id":475,"c":44,"q":"Who among the following advocates had appeared for the INA trials at Delhi in 1945-46?","o":[["a","Dr. Rajendra Prasad"],["b","Bhulabhai Desai"],["c","K.M. Munshi"],["d","Sardar Patel"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"In 1945, the famous trials of the soldiers of the Azad Hind Fauj at the Red Fort began. The defence was conducted by Kailash Nath Katju, Sir Tej Bahadur Sapru, Jawaharlal Nehru, Bhulabhai Desai, etc. Bhulabhai Desai was the chief/senior lawyer of the Azad Hind Defence Committee","b":false},{"id":476,"c":44,"q":"Where was Azad Hind Fauj set up in 1943?","o":[["a","Japan"],["b","Burma"],["c","Singapore"],["d","Malaya"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"The Azad Hind Fauj was reorganized in 1943 on the island of Singapore under the leadership of Subhas Chandra Bose; however, at that time Singapore was under Japanese control (from 1942 to 1945). Before Japanese occupation, Singapore was a part of British Malaya (Malaya).","b":false},{"id":477,"c":44,"q":"In 1943, the Azad Hind Fauj (I.N.A.) came into existence in -","o":[["a","Japan"],["b","Present-day Burma"],["c","Singapore"],["d","present-day Malaya"]],"a":"c","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"The Azad Hind Fauj was reorganized in 1943 on the island of Singapore under the leadership of Subhas Chandra Bose; however, at that time Singapore was under Japanese control (from 1942 to 1945). Before Japanese occupation, Singapore was a part of British Malaya (Malaya).","b":true},{"id":478,"c":44,"q":"In October 1943, Subhas Chandra Bose set up a provisional government of Free India which was recognized by how many countries including Japan?","o":[["a","4"],["b","5"],["c","10"],["d","9"]],"a":"d","s":"70th B.P.S.C. (Pre) 2024","y":2024,"e":"In October 1943, during the Second World War, the Provisional Government of Azad Hind (Provisional Government of Free India) established by Subhas Chandra Bose was recognized by nine countries. These were mainly Axis powers and Japan-backed regimes. The list of recognizing countries is as follows-1. Japan, 2. Germany (Nazi regime), 3. Italy, 4. Thailand (Siam), 5. Burma/Myanmar (Japan-supported government), 6. Philippines (Second Republic sponsored by Japan), 7. Manchukuo (Japanese puppet government in Manchuria, China), 8. Wang Jingwei regime (Nanjing, China—Japanese puppet government), and 9. Croatia (a puppet government supported by powers). Some sources mention Slovakia or some other Axis-associated country, but the widely accepted number is nine. However, these recognitions were largely symbolic. Note- The Wang Jingwei regime is also called the Nationalist China or China (Nanking/Nanjing) regime.","b":false},{"id":479,"c":44,"q":"Who took the lead in organizing the provisional government of independent India outside the country?","o":[["a","Ras Bihari Bose"],["b","Raja Mahendra Pratap"],["c","Subhas Chandra Bose"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"On 21 October 1943, the Provisional Government of Free India was established at Singapore by Indians living in exile under the leadership of Subhas Chandra Bose. It was also known as the Azad Hind Government or the Provisional Government of Free India.","b":false},{"id":480,"c":44,"q":"Organization of Azad Hind Fauj was declared on:","o":[["a","26 January, 1930"],["b","8 August,1942"],["c","21 October, 1943"],["d","18 February, 1946"]],"a":"c","s":"42nd B.P.S.C. (Pre) 1997","y":1997,"e":"On 21 October 1943, the Provisional Government of Free India was established at Singapore by Indians living in exile under the leadership of Subhas Chandra Bose. It was also known as the Azad Hind Government or the Provisional Government of Free India.","b":true},{"id":481,"c":44,"q":"Subhas Chandra Bose renamed Nicobar Island as","o":[["a","Swaraj Island"],["b","Shaheed Island"],["c","Balidan Island"],["d","Navodaya Island"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Re-Exam) (Pre) 2021","y":2021,"e":"During the Second World War (1939–45), the Andaman and Nicobar Islands slipped out of British control and came under Japanese occupation in 1942. Japan’ s control remained till 1945, when the British reoccupied the islands. In November 1943, the Japanese government symbolically handed over the Andaman and Nicobar Islands to Subhas Chandra Bose’ s Azad Hind Provisional Government of Free India (Provisional Government of Free India). After receiving this charge, Netaji renamed Nicobar as “Swaraj” and Andaman as “Shaheed”.","b":false},{"id":482,"c":44,"q":"Whichof the following isnot associated with the Azad Hind Fauj (INA)?","o":[["a","S. A. Dange"],["b","Prem Singh Sehgal"],["c","Shah Nawaz Khan"],["d","General Mohan Singh"]],"a":"a","s":"70th B.P.S.C. (Pre) 2024","y":2024,"e":"Among the given options, Prem Kumar Sehgal, Shah Nawaz Khan, and General Mohan Singh were associated with the Azad Hind Fauj (INA), whereas Shripad Amrit Dange (S. A. Dange) was linked to the Communist movement in India, not to the INA. Hence, option (a) is the correct answer. Due to an error in the option, Prem Kumar Sehgal has been written as Prem Singh Sehgal.","b":false},{"id":483,"c":44,"q":"The Royal Indian Navy Mutiny, also known as the Bombay Mutiny, took place in the year–","o":[["a","1946"],["b","1942"],["c","1930"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"BPSC (TRE-3) July, 2024","y":2024,"e":"The Royal Indian Navy (RIN) mutiny, also known as the Bombay Mutiny, took place in 1946. On 18 February 1946, about 1100 Indian naval personnel (sailors) announced a hunger strike.","b":false},{"id":484,"c":45,"q":"The Cabinet Mission was sent to India for which of the following?","o":[["a","3 only"],["b","1 only"],["c","2 only"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2020","y":2020,"e":"The Cabinet Mission (1946), chaired by the Secretary of State for India, Lord Pethick-Lawrence, with two other members— Stafford Cripps and A.V. Alexander—was sent to prepare a constitutional arrangement for the transfer of power in India.","b":false,"L":["1. To establish a national government","2. To work out a constitutional arrangement for the transfer of power","3. To work out the details of Jinnah's demand for Pakistan"]},{"id":485,"c":45,"q":"Cabinet Mission was presided over by:","o":[["a","Lord Attlee"],["b","Stafford Cripps"],["c","Clement Attlee"],["d","Sir P. Lawrence"]],"a":"d","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"The Cabinet Mission (1946), chaired by the Secretary of State for India, Lord Pethick-Lawrence, with two other members— Stafford Cripps and A.V. Alexander—was sent to prepare a constitutional arrangement for the transfer of power in India.","b":true},{"id":486,"c":45,"q":"The Cabinet Mission came to India in:","o":[["a","February 1942"],["b","March 1942"],["c","April 1942"],["d","May 1942"],["e","None of the above/More than one of the above."]],"a":"e","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"The Cabinet Mission arrived at Karachi (then in India) on 23 March, 1946. It reached Delhi on 24 March, 1946. Its chairman was Lord Pethick-Lawrence (Secretary of State for India), and the other two members were Stafford Cripps (President of the Board of Trade) and A.V. Alexander (First Lord of the Admiralty).","b":false},{"id":487,"c":45,"q":"Who among the following was not a member of the Cabinet Mission sent to India in 1946 A.D.?","o":[["a","Sir Stafford Cripps"],["b","Ramsay Mac Donald"],["c","A. V. Alexander"],["d","Lord Pethick Lawrence"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Re-Exam) (Pre)-2022","y":2022,"e":"The Cabinet Mission arrived at Karachi (then in India) on 23 March, 1946. It reached Delhi on 24 March, 1946. Its chairman was Lord Pethick-Lawrence (Secretary of State for India), and the other two members were Stafford Cripps (President of the Board of Trade) and A.V. Alexander (First Lord of the Admiralty).","b":true},{"id":488,"c":45,"q":"Who was not the member of the Cabinet Mission?","o":[["a","Pethick Lawrence"],["b","Wavell"],["c","Stafford Cripps"],["d","A.V. Alexander"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre.) 2017","y":2017,"e":"The Cabinet Mission arrived at Karachi (then in India) on 23 March, 1946. It reached Delhi on 24 March, 1946. Its chairman was Lord Pethick-Lawrence (Secretary of State for India), and the other two members were Stafford Cripps (President of the Board of Trade) and A.V. Alexander (First Lord of the Admiralty).","b":true},{"id":489,"c":45,"q":"Who among the following was not the member of the Cabinet Mission?","o":[["a","P. Lawrence"],["b","A. V. Alexander"],["c","J. Andrew"],["d","None of them"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"The Cabinet Mission arrived at Karachi (then in India) on 23 March, 1946. It reached Delhi on 24 March, 1946. Its chairman was Lord Pethick-Lawrence (Secretary of State for India), and the other two members were Stafford Cripps (President of the Board of Trade) and A.V. Alexander (First Lord of the Admiralty).","b":true},{"id":490,"c":46,"q":"Who was the Finance Minister in the Interim Government?","o":[["a","Liaquat Ali Khan"],["b","Sardar Patel"],["c","M.A. Jinnah"],["d","Jawaharlal Nehru"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Pre) 2021","y":2021,"e":"In the reorganized Interim Government (October, 1946), the Finance portfolio was with Liaquat Ali Khan, the Home Department was with Sardar Patel, and the Department of External Affairs and the Commonwealth was with Jawaharlal Nehru.","b":false},{"id":491,"c":46,"q":"Which portfolio did Dr. Rajendra Prasad hold during the interim government of 1946?","o":[["a","Defense"],["b","Home"],["c","Food and agriculture"],["d","None of the above"]],"a":"c","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"On the basis of the Cabinet Mission Plan, under the declaration of 24 August, 1946, the Interim Government of India was formed on 2 September, 1946. In it, Dr. Rajendra Prasad held the Food and Agriculture Department.","b":false},{"id":492,"c":46,"q":"Which portfolio did Rajendra Prasad hold in the interim government formed in 1946?","o":[["a","Finance"],["b","Defense"],["c","Home"],["d","Food and Agriculture"],["e","None of the above/ More than one of the above"]],"a":"d","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"On the basis of the Cabinet Mission Plan, under the declaration of 24 August, 1946, the Interim Government of India was formed on 2 September, 1946. In it, Dr. Rajendra Prasad held the Food and Agriculture Department.","b":true},{"id":493,"c":46,"q":"Who was allotted the Portfolio of the Labour Department in the Interim Government's Cabinet of 1946 A.D.?","o":[["a","Jagjivan Ram"],["b","Dr. Rajendra Prasad"],["c","Dr. Anugraha Narayan Singh"],["d","Syed Ali Zaheer"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Re-Exam) (Pre)-2021","y":2021,"e":"In the Interim Government formed in 1946, the Labour Department was given to Babu Jagjivan Ram. Rajendra Prasad was given the Food and Agriculture Department. Syed Ali Zaheer was given the Law and Communications Department (he worked in this post from September 1946 to October 1946).","b":false},{"id":494,"c":46,"q":"Who was given the Department of Princely States in the National Interim Government?","o":[["a","V.P. Menon"],["b","Sardar Vallabhbhai Patel"],["c","Krishnaswamy"],["d","C. Rajagopalachari"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Pre) (Re-Exam), 2022","y":2022,"e":"In the Interim Government, Sardar Vallabhbhai Patel was given the departments of Princely States (States Department), Home, and Information and Broadcasting.","b":false},{"id":495,"c":47,"q":"On February 20, 1947,Prime Minister Attlee announced the British Government's decision to withdraw from India latest by","o":[["a","June 1948"],["b","August 1947"],["c","January 1948"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2022","y":2022,"e":"On 20 February 1947, Attlee stated before the House of Commons that his government intended to transfer power to Indians by June 1948. He also said that if by then no decision on a constitution had been reached, the British Government would have to consider to whom the powers of the central government in British India should be handed over—either to a central government, or to provincial governments in some areas, or in any other manner considered appropriate in the interests of the Indian people. In March 1947, Lord Mountbatten was sworn in as Viceroy. His task was to wind up British power in India. He was specifically instructed to keep India united as far as possible along with the transfer of power; however, he was also authorised to take decisions according to the changed circumstances in India so that Britain could withdraw honour ably with minimum loss. Mountbatten soon reached the conclusion during the talks on the transfer of power that the partition of India and the creation of Pakistan had become necessary.","b":false},{"id":496,"c":47,"q":"When was the Indian Independence Bill passed by the House of Lords in England?","o":[["a","14 July, 1947"],["b","15 July, 1947"],["c","16 July, 1947"],["d","14 August, 1947"],["e","None of the above/More than one of the above"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"On the basis of the Mountbatten Plan, the Indian Independence Bill was introduced in the British Parliament on 4 July 1947. It was passed by the House of Commons on 15 July 1947 and by the House of Lords on 16 July 1947. Thereafter, the Bill received Royal Assent on 18 July 1947.","b":false},{"id":497,"c":47,"q":"Who among these headed the two boundary commissions established in 1947 to draw the international borders between India and Pakistan?","o":[["a","Cyril Radcliffe"],["b","A.P. Moon"],["c","A.V. Alexander"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"On 30 June 1947, the Bengal Boundary Commission and the Punjab Boundary Commission were constituted. Cyril Radcliffe was appointed as the chairman of these commissions. On the basis of the Radcliffe Award Report, the partition boundaries of Punjab and Bengal were determined, which were later adopted as the India–Pakistan border (and in the Bengal sector, as the present India–Bangladesh border).","b":false},{"id":498,"c":47,"q":"The Department of State was established under whose head ship?","o":[["a","Mahatma Gandhi"],["b","J.L. Nehru"],["c","G.B. Pant"],["d","Sardar Patel"],["e","None of the above/ More than one of the above"]],"a":"d","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"Mountbatten announced that after Partition, the issues of the princely states falling in the two new countries—India and Pakistan—would be settled separately by “States Departments.” Nehru entrusted the responsibility of the “States Department” for the integration of the princely states to Sardar Patel. Sardar Patel took charge on 5 July, 1947, and V.P. Menon took charge as his Secretary.","b":false},{"id":499,"c":47,"q":"Who was the President of Indian National Congress at the time of Partition of India?","o":[["a","J. B. Kriplani"],["b","Jawaharlal Nehru"],["c","Maulana Abul Kalam Azad"],["d","C. Rajagopalachari"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016 · 65th B.P.S.C. (Pre.) 2019","y":2019,"e":"At the time of the Partition of India (transfer of power), J.B. Kriplani was the President of the Indian National Congress. He became President in the Meerut Session in November, 1946, and remained President until November, 1947. After he resigned, Dr. Rajendra Prasad was made the President.","b":false},{"id":500,"c":47,"q":"Who presided over the Meerut Session of the Indian National Congress in the year 1947?","o":[["a","J.B. Kripalani"],["b","Rajendra Prasad"],["c","Abul Kalam Azad"],["d","Jawaharlal Nehru"]],"a":"a","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"At the time of the Partition of India (transfer of power), J.B. Kriplani was the President of the Indian National Congress. He became President in the Meerut Session in November, 1946, and remained President until November, 1947. After he resigned, Dr. Rajendra Prasad was made the President.","b":true},{"id":501,"c":47,"q":"Who was the Congress President at the time of the transfer of power to Indians by the British in the year 1947?","o":[["a","Jawaharlal Nehru"],["b","Rajendra Prasad"],["c","Abul Kalam Azad"],["d","J.B. Kripalani"]],"a":"d","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"At the time of the Partition of India (transfer of power), J.B. Kriplani was the President of the Indian National Congress. He became President in the Meerut Session in November, 1946, and remained President until November, 1947. After he resigned, Dr. Rajendra Prasad was made the President.","b":true},{"id":502,"c":47,"q":"The President of the Indian National Congress in the year 1947 was","o":[["a","J.B. Kripalani"],["b","Jawaharlal Nehru"],["c","C. Rajagopalachari"],["d","Rajendra Prasad"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"At the time of the Partition of India (transfer of power), J.B. Kriplani was the President of the Indian National Congress. He became President in the Meerut Session in November, 1946, and remained President until November, 1947. After he resigned, Dr. Rajendra Prasad was made the President.","b":true},{"id":503,"c":47,"q":"Which of the following political parties was in power in Britain at the time of India's independence?","o":[["a","Conservative Party"],["b","Liberal Party"],["c","Labour Liberal Formation"],["d","Labour Party"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"At the time of India’ s independence, Clement R. Attlee was the British Prime Minister. His tenure was from 1945 to 1951. During that period, the Labour Party was in power in Britain. On 20 February, 1947, British Prime Minister Clement Attlee announced in the House of Commons that the British would leave India after transferring power to responsible hands, and that this would be done before June, 1948.","b":false},{"id":504,"c":48,"q":"In which year was the Regulating Act passed?","o":[["a","A.D. 1757"],["b","A.D. 1765"],["c","A.D. 1773"],["d","A.D. 1793"]],"a":"c","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"To remove widespread corruption and mis administration in the Company, the British Parliament passed the Regulating Act, 1773. Under this, the Madras and Bombay Presidencies were brought under the Calcutta Presidency. The Governor of Bengal was now called the Governor-General of Bengal. Warren Hastings was made the first Governor-General of Bengal.","b":false},{"id":505,"c":48,"q":"The Regulating Act was passed in –","o":[["a","1773"],["b","1774"],["c","1785"],["d","1793"]],"a":"a","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"To remove widespread corruption and mis administration in the Company, the British Parliament passed the Regulating Act, 1773. Under this, the Madras and Bombay Presidencies were brought under the Calcutta Presidency. The Governor of Bengal was now called the Governor-General of Bengal. Warren Hastings was made the first Governor-General of Bengal.","b":true},{"id":506,"c":48,"q":"Under which of the following acts did Lord Cornwallis get the right to overrule the decisions of his council?","o":[["a","Regulating Act"],["b","Act of 1786"],["c","Charter Act of 1793"],["d","Charter Act of 1813"]],"a":"b","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"Cornwallis wanted to hold the powers of both the Governor-General and the Commander-in-Chief. According to the Act of 1786, this was accepted, and in special circumstances the Governor-General was also given the power to override the decisions of his Council and to enforce his own decision.","b":false},{"id":507,"c":48,"q":"When was the Pitt's India Act passed by the British Parliament?","o":[["a","1783 AD"],["b","1833 AD"],["c","1784 AD"],["d","1853 AD"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The Pitt’ s India Act was passed in 1784 AD. The main provisions of the Pitt’ s India Act, 1784 were the establishment of a Board of Control to supervise the Company’ s civil, military and revenue affairs; reduction of the members of the Council of the Governor General in India to three members; and civil and military officers were asked to disclose details of their properties in India and Britain.","b":false},{"id":508,"c":48,"q":"Which Act provided for the competitive exam system for Civil Services?","o":[["a","1833"],["b","1853"],["c","1858"],["d","1882"]],"a":"b","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"In the Charter Act, 1853, it was provided that the salaries of the Board of Control and its other officers would be fixed by the government; however, the Company would pay them. The number of Directors was reduced from 24 to 18, out of which 6 were to be nominated by the Crown. It also provided that appointments would now be made through competitive examinations, without any kind of discrimination.","b":false},{"id":509,"c":48,"q":"The post of the Indian High Commission was created by which Act?","o":[["a","The Indian Councils Act, 1909"],["b","The Government of India Act, 1919"],["c","The Government of India Act, 1935"],["d","The Indian Independence Act, 1947"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre.) 2017","y":2017,"e":"In the Government of India Act, 1919, a provision was made for appointing an Indian High Commissioner to reduce the workload of the Secretary of State for India. Its functions included purchasing arms and other goods for the Government of India, awarding contracts, looking after commercial interests, and taking care of Indian students studying in England, etc. The expenditure on the salaries of the High Commissioner and his assistants was to be met from India’ s resources.","b":false},{"id":510,"c":48,"q":"The Montagu-Chelmsford Report formed the basis of the–","o":[["a","Indian Councils Act, 1909"],["b","Government of India Act, 1919"],["c","Government of India Act, 1935"],["d","Indian Independence Act, 1947"]],"a":"b","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"The report of Edwin Montagu (then Secretary of State for India) and Viceroy Lord Chelmsford became the basis of the Government of India Act, 1919. Under this Act, dyarchy was introduced in the provinces for the first time.","b":false},{"id":511,"c":48,"q":"Who was the Prime Minister of England when the Montagu-Chelmsford Act was passed in 1919?","o":[["a","Lloyd George"],["b","George Hamilton"],["c","Sir Samuel Hoare"],["d","Lord Salisbury"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"In 1919, when the Montagu–Chelmsford Act was passed, David Lloyd George was the Prime Minister of the U.K. He remained the Prime Minister of the U.K. from 1916 to 1922.","b":false},{"id":512,"c":48,"q":"About which Act, Jawaharlal Nehru had said, \"We were provided with a car with all brakes and no engine\"?","o":[["a","Act of 1858"],["b","Act of 1909"],["c","Act of 1919"],["d","Act of 1935"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"About the Act of 1935, Jawaharlal Nehru said, “A car that has brakes but no engine.” He served as the Prime Minister of India from 1947 to 1964. He was a leading proponent of Panchsheel and believed in non-alignment.","b":false},{"id":513,"c":48,"q":"Which Act is not the landmark in the development of the Constitution during the British Rule?","o":[["a","The Regulating Act, 1773"],["b","The Charter Act, 1833"],["c","The Government of India Act, 1919"],["d","The Protection of Civil Rights Act, 1955"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"During British rule in India, the British Government passed the Regulating Act, 1773; the Charter Act, 1833; and the Government of India Act, 1919, whereas the Protection of Civil Rights Act, 1955 was passed by the Indian Parliament.","b":false},{"id":514,"c":48,"q":"Who described the Government of India Act, 1935 as a ‘Charter of Slavery’?","o":[["a","Mahatma Gandhi"],["b","Netaji Subhas Chandra Bose"],["c","Maulana Hasrat Mohani"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"B.P.S.C. Teacher (11th-12th) 15-12-2023","y":2023,"e":"In his presidential address at the annual session of the Congress held at Lucknow, on 12 April 1936, Pandit Jawaharlal Nehru called the Government of India Act, 1935 the “Charter of Slavery.” This Act provided for the establishment of an All-India Federation in which both British Indian provinces and Indian States (Princely States) were to be included, though this federation could never actually come into existence. Under this Act, there was also a provision for a bicameral legislature at the Centre.","b":false},{"id":515,"c":48,"q":"Government of India Act, 1935 abolished-","o":[["a","Provincial autonomy"],["b","Provincial dyarchy"],["c","Federal structure of India"],["d","Responsible Central Government"]],"a":"b","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"The Government of India Act, 1935 abolished provincial dyarchy and introduced provincial autonomy. As a result, the distinction between reserved and transferred subjects ended. With some reservations, responsible government was established in the provinces.","b":false},{"id":516,"c":48,"q":"Which of the following was not one of the features of the Government of India Act, 1935?","o":[["a","Reconstruction of the Governor General's Executive Council"],["b","Provincial Autonomy"],["c","Approval of the Act of 1935"],["d","Proposal for Federation of India"]],"a":"c","s":"70th B.P.S.C. (Pre) 2024","y":2024,"e":"The features of the Government of India Act, 1935 included the proposal of an Indian Federation, reorganization of the Governor-General’ s Executive Council, and provincial autonomy; however, there was no provision for an evaluation of the Act of 1935. This Act also provided for the establishment of a Federal Court, division of powers between the Centre and the Provinces, a bicameral Central Legislature, abolition of dyarchy in the provinces, and dyarchy at the Centre, etc. India’ s present constitutional structure is largely based on the Act of 1935.","b":false},{"id":517,"c":48,"q":"Which Act provided for the partition of India into two new dominions -India and Pakistan?","o":[["a","Govt. of India Act, 1919"],["b","Govt. of India Act, 1935"],["c","Indian Independence Act, 1947"],["d","None of the above"]],"a":"c","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"The Indian Independence Act, 1947, passed by the British Parliament, formally approved the partition of British India and provided the legal basis for the creation of two new independent dominions/states—India and Pakistan. This Act received Royal Assent on 18 July 1947, and it provided that from 15 August 1947 the two independent dominions/states India and Pakistan would come into existence.","b":false},{"id":518,"c":48,"q":"Who is considered the father of dyarchy?","o":[["a","Lord Clive"],["b","Hector Munro"],["c","Lord Macaulay"],["d","Sir Lionel Curtis"],["e","None of the above B.P.C.S. (Pre) 2016"]],"a":"d","s":"B.P.S.C. (Pre)","y":null,"e":"Sir Lionel Curtis is regarded as the father of dyarchy. His ideas related to dyarchy formed the basis of the Government of India Act, 1919.","b":false},{"id":519,"c":48,"q":"The Muddiman Committee was appointed to report on the working of which of the following?","o":[["a","Communal Representation"],["b","Dyarchy"],["c","Federalism"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Muddiman Committee was appointed in the year 1924 under the leadership of Sir Alexander Muddiman. This committee was appointed to discuss and examine the issue of dyarchy under the constitution established under the Government of India Act, 1919. Apart from the British members, it also had six Indian members—Shivswami Iyer, R. P. Paranjpye, Tej Bahadur Sapru, Bijoy/Vijay Chand Mahtab, Muhammad Shafi, and Muhammad Ali Jinnah. The committee submitted its report in the year 1925.","b":false},{"id":520,"c":49,"q":"Name the Principal of M.A.O. College, Aligarh, who encouraged Muslim Communalism inthe last decades of the 19th Century?","o":[["a","Minto"],["b","Dunlop Smith"],["c","William Morris"],["d","Theodore Beck"]],"a":"d","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"M.A.O. College (Mohammad an Anglo-Oriental College), Aligarh, was founded by Sir Syed Ahmad Khan. In the last decades of the 19th century, the ‘Muslim separatist’ tendencies that emerged here were encouraged by several persons, among whom the Principal of M.A.O. College, Aligarh, Theodore Beck, was prominent. 2 Consider the following events of Modern Indian History","b":false},{"id":521,"c":49,"q":"Treaty of Salbai","o":[["a","3-1-2-4"],["b","2-3-4-1"],["c","2-4-1-3"],["d","3-2-1-4"]],"a":"a","s":"71st BPSC (Pre) 2025","y":2025,"e":"The accepted years of these four events are as follows— Battle of Wandiwash – This was the decisive battle fought between the British and the French during the Third Carnatic War, which took place in 1760. This is the earliest event among the four. Death sentence to Raja Nanda kumar – Raja Nanda kumar, a high Brahmin of Bengal and former Diwan, was tried on the charge of forgery and hanged. This incident took place in 1775 in Calcutta. Treaty of Salbai – The agreement between the East India Company and the Marathas at the end of the First Anglo-Maratha War (1775–1782) is called the Treaty of Salbai. This treaty took place in 1782. Death of Tipu Sultan – Tipu Sultan, the ruler of Mysore, was killed in the Battle of Sri ranga patna during the Fourth Anglo–Mysore War (1799).","b":false,"L":["3. Battle of Wandiwash","4. Death of Tipu Sultan Which of the following is the correct chronological order of the above envents?"]},{"id":522,"c":49,"q":"Whichof the following statements is correct regarding Queen Elizabeth II of the United Kingdom?","o":[["a","She reigned for 70 years and died at the age of 96."],["b","She reigned for 68 years and died at the age of 94."],["c","She ruled for 72 years and died at the age of 92."],["d","She ruled for 66 years and died at the age of 90."]],"a":"a","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"On 8 September, 2022, Queen Elizabeth II of the United Kingdom died at the age of 96. In the year 1952, Elizabeth II assumed the throne of the United Kingdom. Thus, she reigned for 70 years, 214 days (6 February, 1952 – 8 September, 2022). Therefore, as the closest answer, option (a) can be selected.","b":false},{"id":523,"c":49,"q":"Queen Victoria was appointed the Empress of India in–","o":[["a","1858"],["b","1876"],["c","1877"],["d","1885"]],"a":"c","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"The Royal Titles Act, 1876 was passed by the British Parliament in April, 1876. Under this Act, Queen Victoria was proclaimed the Empress of India at the Delhi Durbar on 1 January, 1877. Similarly, Emperor Edward VII was proclaimed Emperor of India in the year 1903, and George V in the year 1911.","b":false},{"id":524,"c":49,"q":"Under the Royal Titles Act, Queen Victoria became the Empress of India in","o":[["a","1875"],["b","1874"],["c","1877"],["d","1876"]],"a":"c","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The Royal Titles Act, 1876 was passed by the British Parliament in April, 1876. Under this Act, Queen Victoria was proclaimed the Empress of India at the Delhi Durbar on 1 January, 1877. Similarly, Emperor Edward VII was proclaimed Emperor of India in the year 1903, and George V in the year 1911.","b":true},{"id":525,"c":49,"q":"Which of the following statements is/are correct?","o":[["a","Raja Ram Mohan Roy was the pioneer of modern education."],["b","Swami Dayanand proclaimed India for Indians."],["c","Vivekananda participated in the Parliament of World Religions."],["d","More than one of the above"],["e","None of the above"]],"a":"d","s":"B.P.S.C. Teacher (Class 11th-12th) 15-12-2023","y":2023,"e":"Swami Dayanand Saraswati gave the slogan “India for Indians.” Swami Vivekananda participated in the “Parliament of the World’ s Religions” held in Chicago in 1893. Raja Ram Mohan Roy was a pioneer of modern education. Therefore, option (d) is correct.","b":false},{"id":526,"c":49,"q":"Who was the first Indian to resist the political reforms?","o":[["a","Dadabhai Naoroji"],["b","Surendranath"],["c","Ram Mohan Roy"],["d","Bal Gangadhar Tilak"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"Raja Ram Mohan Roy was the first Indian to raise a voice/ protest for political reforms. He wrote several articles on human rights and the development of democratic values. Bipin Chandra Pal wrote that the message of political freedom in India was first given by Raja Ram Mohan Roy. Some historians consider Surendranath Banerjee to be the first Indian to lead a movement for political reforms.","b":false},{"id":527,"c":49,"q":"Who first raised the demand for'complete independence' in the year 1921?","o":[["a","Maulana Mohammad Ali"],["b","Pandit Jawaharlal Nehru"],["c","Mahatma Gandhi"],["d","Maulana Hasrat Mohani"]],"a":"d","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"The Congress session held at Ahmedabad in 1921 was presided over by Hakim Ajmal Khan, as C. R. Das was in jail. In this session, Maulana Hasrat Mohani first raised the demand for “Complete Independence,” but Gandhiji opposed this demand and it was rejected.","b":false},{"id":528,"c":49,"q":"The slogans of the French Revolution- liberty, equality and inspired the whole world.","o":[["a","Fraternity"],["b","Justice"],["c","Simplicity"],["d","Freedom"]],"a":"a","s":"BPSC (CDPO) (Pre) 2005","y":2005,"e":"The slogan of Equality, Liberty and Fraternity (Brotherhood) is a contribution of the French Revolution, which influenced not only France but the whole world. It is noteworthy that the French Revolution began on 14 July 1789. At that time, the King of France was Louis XVI.","b":false},{"id":529,"c":49,"q":"Who was the most bitter critic of Sir Syed Ahmad Khan?","o":[["a","Jamaluddin Afghani"],["b","C.F. Andrews"],["c","Maulvi Zakaullah"],["d","Shibli Nomani"],["e","None of the above/More than one of the above"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"Jamaluddin Afghani was the most bitter critic of Sir Syed Ahmad Khan. Sir Syed started one of the most influential movements in favour of English education and cooperation with the British government. Sir Syed Ahmad Khan opposed the establishment of the Congress and, along with Raja Shiv Prasad Singh of Banaras, founded the “United Indian Patriotic Association” in 1888.","b":false},{"id":530,"c":49,"q":"Which of the following pairs is correct?","o":[["a","i, ii, and iii"],["b","i and iii"],["c","i and iii"],["d","i and ii"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The Partition of Bengal took place in 1905 and the Rowlatt Satyagraha took place in 1919. The split in Congress (Congress division) took place in the Surat session of 1907. Therefore, only pairs (i) and (iii) are correctly matched.","b":false,"L":["i. 1905 — Partition of Bengal","ii. 1908 - Split in Congress","iii. 1919 - Rowlatt Satyagraha"]},{"id":531,"c":49,"q":"Presided over the Banaras Hindu Mahasabha session of August, 1923-","o":[["a","Swami Shraddhanand"],["b","Rajendra Prasad"],["c","Lala Lajpat Rai"],["d","Pandit Madan Mohan Malaviya"]],"a":"d","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"Pandit Madan Mohan Malaviya was among the most eminent leaders of the Hindu Mahasabha, and he presided over the Hindu Mahasabha session held at Banaras in 1923. In the same Banaras session, movements such as the Shuddhi movement were welcomed. He began the publication of ‘Abhyudaya’ (in Hindi) and ‘The Leader’ (in English), and he also served as editor of newspapers such as ‘Hindustan’ and ‘The Indian Union’.","b":false},{"id":532,"c":49,"q":"Who was the secretary of Mahatma Gandhi during Noakhali?","o":[["a","Nirmal Kumar Bose"],["b","Mahadev Desai"],["c","Pyare Lal"],["d","Vallabh Bhai Patel"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"During the phase of violence in the Noakhali region of Bengal, Mahatma Gandhi’ s personal secretary was the famous Bengali anthropologist and Gandhian leader Nirmal Kumar Bose. He also worked as Mahatma Gandhi’ s interpreter in Bengal. He remained Mahatma Gandhi’ s personal secretary till 1946–47.","b":false},{"id":533,"c":49,"q":"The Bombay Plan proposed:","o":[["a","A rapid rate of economic growth"],["b","Equal distribution"],["c","Abandonment of some capitalist characteristics"],["d","Employee/worker welfare scheme"],["e","None of the above/More than one of the above"]],"a":"e","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The ‘Bombay Plan’ was presented in 1944 by a group of leading Indian industrialists. Under this plan, rapid economic growth of the Indian economy was advocated through proposals based on import substitution and industrialisation. At the same time, it reflected the need for state intervention and planned development in the country’ s economic development, along with the need for public sector undertakings, which shows an abandonment of some capitalist features. On this basis, the correct answer will be option (e).","b":false},{"id":534,"c":49,"q":"In which year the first Census was introduced in India?","o":[["a","1872"],["b","1901"],["c","1911"],["d","1921"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Re-Exam) (Pre)-2022","y":2022,"e":"During British rule, the first census was conducted in 1872 during the time of Lord Mayo; however, the first regular census, i.e., the beginning of continuous decennial census, is considered from 1881 during the time of Lord Ripon.","b":false},{"id":535,"c":49,"q":"Which Dogra general led successful military campaigns in Ladakh, Baltistan, and parts of Tibet between 1834 and 1841?","o":[["a","Mehar Singh"],["b","Gulab Singh"],["c","Mehta Basti Ram"],["d","Zorawar Singh"]],"a":"d","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"Zorawar Singh, the commander-in-chief of Dogra ruler Gulab Singh of Jammu and Kashmir and the Governor of Kishtwar, led successful military campaigns in Ladakh, Baltistan and some parts of Tibet between 1834 and 1841. He was killed in battle during the Western Tibet campaign (1841). Under the Treaty of Amritsar (March 1846), the colonial rulers sold Kashmir to Gulab Singh for 75 lakh rupees. Maharaja Gulab Singh unified Jammu and Kashmir.","b":false},{"id":536,"c":49,"q":"Which of the following statements is/are correct? I. Laik Ali wasthe President of the Nizam's Executive Council. II. 'Operation Polo' against Hyderabad lasted for 48 hours. III. The state of Kashmir signed the Instrument of Accession on 15-08-1947. IV. Shah Nawaz Bhutto wasthe last Diwanof Junagadh State. V. K.M. Munshi was appointed by the Government of India as its agent in Hyderabad.","o":[["a","Only I, IV and V"],["b","I, II and III only"],["c","II, III and IV only"],["d","I, II, III and IV only"],["e","None of the above"]],"a":"a","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"Mir Laik Ali was the President of the Nizam’ s Executive Council (the last Prime Minister of Hyderabad during the Nizam’ s rule). ‘Operation Polo’ for Hyderabad’ s merger with India took about five days in September 1948. The Maharaja of Kashmir, Hari Singh, signed the Instrument of Accession with India on 26 October 1947. Shah Nawaz Bhutto was the last Diwan of the Junagadh State. K.M. Munshi was appointed by the Government of India as its Agent General in the Hyderabad State. Thus, among the given statements, only I, IV and V are correct.","b":false},{"id":537,"c":49,"q":"\"So long as this third power, i.e. England is here, our communal differences would keep on troubling us\" Who said this?","o":[["a","Dr. Rajendra Prasad"],["b","Maulana Abul Kalam Azad"],["c","Jawaharlal Nehru"],["d","Vinayak Damodar Savarkar"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"The above statement was made by Mahatma Gandhi in an interview with Louis Fischer.","b":false},{"id":538,"c":49,"q":"Consider the following events during India’ s Freedom Struggle:","o":[["a","1–3–2–4"],["b","2–4–1–3"],["c","1–4–2–3"],["d","2–3–1–4"]],"a":"b","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"Event — Year\nSurat Split — 1907\nMinto–Morley Reforms — 1909 (Morley–Minto Reforms) Home Rule Movement — 1916\nKheda Satyagraha — 1918","b":false,"L":["1. Home Rule Movement 2. Surat Split","3. Kheda Satyagraha 4. Minto-Morley Reforms Which of the following is the correct chronological order of the events given above?"]},{"id":539,"c":49,"q":"The objective of the 'Antyodaya' program is -","o":[["a","Development of minorities"],["b","Upliftment of Dalits"],["c","Helping the poorest of the poor"],["d","Complete eradication of poverty"]],"a":"c","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"The objective of the Antyodaya Programme is to help the poorest among the poor. The idea of Antyodaya was propounded by Mahatma Gandhi. He treated the benefit to the poorest/weakest person in society as the yardstick for judging any step or policy. This “last person–centred” thought is the core of the Antyodaya concept. However, the credit for making the idea or philosophy of Antyodaya widely popular goes to Shyama Prasad Mukherjee.","b":false},{"id":540,"c":49,"q":"“He was a great uni fier in India who taught us not only bare tolerance of others but the willing acceptance of them as our friends and comrades in common undertakings” who said it?","o":[["a","Subhash Chandra Bose"],["b","Bal Gangadhar Tilak"],["c","Rajendra Prasad"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"B.P.S.C. (Tre-3) July 2024","y":2024,"e":"The given statement is by Pt. Jawaharlal Nehru, in which he said this about Mahatma Gandhi.","b":false},{"id":541,"c":49,"q":"Who among the following capitalists served as anAICC Treasurer for many years and went to jail in 1930?","o":[["a","G. D. Birla"],["b","Jamnalal Bajaj"],["c","J. R. D. Tata"],["d","Balchand Hirachand"]],"a":"b","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Seth Jamnalal Bajaj was among the close associates of Gandhiji. He remained the Treasurer of the All India Congress Committee (AICC) for a long time. He went to jail for participating in the Nagpur Flag Satyagraha (1923) and again during the Civil Disobedience Movement (1930).","b":false},{"id":542,"c":49,"q":"Ambabai, a woman freedom fighter,belonged to which of the following states of India?","o":[["a","Kerala"],["b","Andhra Pradesh"],["c","Karnataka"],["d","Madhya Pradesh"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"Ambabai was born in 1889 in the then princely state of Mysore (now Karnataka) in an orthodox Brahmin family. She played an important role in the freedom movement in South India. She also led sit-in protests in Udupi against shops selling foreign clothes and liquor.","b":false},{"id":543,"c":49,"q":"Which among the following year Surendra Nath Banerjee was eliminated from Indian Civil Services?","o":[["a","1874 AD"],["b","1877 AD"],["c","1885 AD"],["d","1892 AD"],["e","None of the above/ More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"Surendranath Banerjee was the second Indian to pass the Indian Civil Service examination. His first posting was as an Assistant Magistrate in Sylhet (present-day Bangladesh). Due to procedural irregularities, he was removed from service in 1874 A.D.","b":false},{"id":544,"c":49,"q":"“Therefore, the Government of India always acts with consent and often on the instructions of the Chamber of Commerce, and this is called 'White Man's Burden'.” Who said this?","o":[["a","Bankim Chandra Chatterjee"],["b","Mahatma Gandhi"],["c","Sachchidanand Sinha"],["d","Rajendra Prasad"],["e","None of the above/More than one of the above"]],"a":"c","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The given statement was made by Sachchidanand Sinha.","b":false},{"id":545,"c":49,"q":"Who became champion of socialism and wanted to overthrow British rule, Princely states, landlord ism and Capitalism in 1933?","o":[["a","Rajendra Prasad"],["b","Jawaharlal Nehru"],["c","Bhulabhai Desai"],["d","Sardar Patel"],["e","None of the above/More than one of the above"]],"a":"b","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"Jawaharlal Nehru was a supporter of socialism. In 1933, he wanted to uproot British rule, princely states, zamindari, and capitalism. Nehru’ s socialism was influenced by Soviet socialism. He visited the Soviet Union in November 1927.","b":false},{"id":546,"c":49,"q":"How did the study of history help in creating a feeling of nationalism in India towards the end of the 19th century?","o":[["a","Urging people to change the miserable conditions under British rule and to struggle"],["b","By reinterpreting history and refuting the British portrayal of Indians as backward, primitive, and incapable of governing themselves"],["c","By writing about India's glorious past and urging people to be proud of their achievements"],["d","More than one of the above"],["e","None of the above"]],"a":"d","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"All the statements given in the options show how the study of history helped create a sense of nationalism in India at the end of the 19th century.","b":false},{"id":547,"c":49,"q":"Arrange the following events in chronological order during British rule:'","o":[["a","B A C D"],["b","B A D C"],["c","D C A B"],["d","D C B A"]],"a":"b","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The years of the events are as follows— Dandi March — 1930\nSimon Commission (formation) — 1927\nPoona Pact — 1932\nGandhi–Irwin Pact — 1931 Accordingly, the correct chronological order is B A D C, which matches option (b).","b":false,"L":["A. Dandi March⦙B. Simon Commission","C. Poona Pact⦙D. Gandhi-Irwin Pact"]},{"id":548,"c":49,"q":"February 1927 marked a turning point in Jawaharlal's 'intellectual development' with his active participation in the Brussels Congress against colonial repression and imperialism.\" Who wrote these words?'","o":[["a","S. Gopal"],["b","B.R. Nanda"],["c","Michael Brecher"],["d","B.N. Pandey"],["e","None of the above"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2022","y":2022,"e":"“…… a turning point came in Jawaharlal’ s ‘intellectual development’ when he actively participated against colonial oppression and imperialism at the Brussels Congress in February 1927.” This statement is by S. Gopal.","b":false},{"id":549,"c":49,"q":"Which of the following events happened first?","o":[["a","Resolution of the Quit India Movement"],["b","Arrival of the Cripps Mission"],["c","Arrival of Lord Wavell as the Governor General"],["d","Arrival of the Cabinet Mission"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"Events Year (1) Arrival of the Cripps Mission March 1942 (2) Resolution of the Quit India Movement August 1942 (3) Arrival of Lord Wavell as Governor-General October 1943 (4) Arrival of the Cabinet Mission March 1946 Therefore, among the given events, the earliest was the arrival of the Cripps Mission under the leadership of Stafford Cripps.","b":false},{"id":550,"c":49,"q":"Match the following:","o":[["a","1 2 3 4"],["b","2 1 4 3"],["c","2 4 1 3"],["d","4 3 1 2"]],"a":"*","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"Bardoli is located in the state of Gujarat. Chauri-Chaura is presently located in Uttar Pradesh. It was here that during the Non-Cooperation Movement, on 4 February 1922, a violent mob set a police station on fire, in which 23 policemen were killed. Saddened by this incident, Gandhiji withdrew the Non-Cooperation Movement on 12 February 1922. Yerwada Jail is located in Maharashtra. At present, Noakhali is a part of Bangladesh, not the state of West Bengal. Before the partition of India, it was a part of the Bengal Province.","b":false,"L":["(A) Bardoli 1. Maharashtra","(B) Chauri-Chaura 2. Gujarat","(C) Yerwada 3. West Bengal","(D) Noakhali 4. Uttar Pradesh"]},{"id":551,"c":49,"q":"First Indian elected to the British House of Commons was Dadabhai Naoroji who contested on the ticket of:","o":[["a","Liberal Party"],["b","Labour Party"],["c","Conservative Party"],["d","Communist Party"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"Dadabhai Naoroji (1825–1917) formed the London Indian Society in 1865 along with W. C. Banerjee. Its main objective was to increase political and social awareness among Indian students in England and to place India’ s problems before the British public and the government. In 1892, he became the first Indian to be elected to the British House of Commons on the ticket of the Liberal Party. In his book “Poverty and Un-British Rule in India”, Dadabhai Naoroji clearly highlighted India’ s economic distress during British rule, and he was the first to propound the Drain of Wealth, that is, the Drain Theory.","b":false},{"id":552,"c":49,"q":"Who among the following became India’ s unofficial ambassador to England?","o":[["a","Surendranath Banerjee"],["b","Dadabhai Naoroji"],["c","Swami Vivekananda"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. Teacher (Class 11th-12th) 15-12-2023","y":2023,"e":"Dadabhai Naoroji is known as India’ s unofficial ambassador in England. With the objective of conveying the Indian viewpoint to the British public, he founded the East India Association in 1866.","b":false},{"id":553,"c":49,"q":"Which famous Indian was known as 'Gurudev'?","o":[["a","Rabindranath"],["b","C. Rajagopalachari"],["c","Lala Lajpat Rai"],["d","B.R. Ambedkar"]],"a":"a","s":"38th B.P.S.C. (Pre) 1992-93","y":1992,"e":"Rabindranath Tagore was born in the city of Calcutta on 7 May 1861. In 1901, he started a school at Santiniketan called the Brahmacharya Ashram. On 23 December 1918, Gurudev Rabindranath Tagore laid the foundation of Visva-Bharati. In 1913, he was awarded the Nobel Prize in Literature for the English translation of his collection of songs “Gitanjali”, titled “Song Offerings”. He was known as “Gurudev”.","b":false},{"id":554,"c":49,"q":"Who gave the slogan 'Jai Jawan, Jai Kisan'?","o":[["a","Lal Bahadur Shastri"],["b","Subhash Chandra Bose"],["c","Devilal"],["d","Morarji Desai"]],"a":"a","s":"38th B.P.S.C. (Pre) 1992-93","y":1992,"e":"The famous slogan “Jai Jawan, Jai Kisan” was given by India’ s former Prime Minister Lal Bahadur Shastri.","b":false},{"id":555,"c":49,"q":"Which woman made the most significant contribution to Indian politics after 1947?","o":[["a","Aruna Asaf Ali"],["b","Kamala Rani Singh"],["c","Tar kesh war i Sinha"],["d","Rabri Devi"]],"a":"a","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"Aruna Asaf Ali was a nationalist and a freedom fighter. In the Quit India Movement of 1942, she and Sucheta Kriplani were two leading women organisers of the underground movement. After 1947, Aruna Asaf Ali joined the Socialist Party in 1948. In the 1950s, she joined the Communist Party of India and visited Moscow (Russia). In 1954, she was a collaborator in the formation of the National Federation of Indian Women. In 1958, she became the Mayor of Delhi, and in 1958 she also founded the newspaper ‘Patriot’. In this way, she made the maximum contribution to Indian politics after 1947.","b":false},{"id":556,"c":49,"q":"Name the scholar of Deoband who played an important role in the freedom movement:","o":[["a","Abul Kalam Azad"],["b","Mohammad Ali Jinnah"],["c","Badruddin Tyabji"],["d","Chirag Ali"]],"a":"a","s":"47th B.P.S.C.(Pre) 2005","y":2005,"e":"Abul Kalam Azad was associated with the Deoband movement. ‘Mazameen al-Nadwa’, a collection of articles written by Abul Kalam Azad, was published in the Urdu magazine ‘Al Nadwa’. He served as the President of the Indian National Congress from 1940 to 1946. ‘India Wins Freedom’ is his famous book.","b":false},{"id":557,"c":49,"q":"What wasthe common relationship between Katherine Mayo, Aldous Huxley, Charles Andrews and William Digby?","o":[["a","They wrote commentaries on the condition of India during the British rule"],["b","They were supporters of the Indian National Movement"],["c","They were opponents of the Indian National Movement"],["d","They were friends of Mahatma Gandhi"]],"a":"a","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"Katherine Mayo, Aldous Huxley, Charles Andrews and William Digby wrote comments on India’ s condition during British rule. Katherine Mayo was the author of ‘Mother India’, and William Digby wrote ‘Prosperous British India’. Charles Andrews was born in 1871 in England. He was a friend of Mahatma Gandhi. He came to India in 1904 and taught at St. Stephen’ s College. He encouraged Indian nationalism through his books and journalism. Aldous Huxley travelled to India in the first half of the 20th century and, in his travelogue, wrote about the conditions of India at that time.","b":false},{"id":558,"c":49,"q":"Which of the following pairs is correct?","o":[["a","Vinoba Bhave - Second Individual Satyagrahi"],["b","C.R. Das - Deshbandhu"],["c","William Wedderburn - Congress President in 1907"],["d","Shyamji Krishna Varma- Founder of India House in Paris"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"Under the Individual Satyagraha Movement started by Mahatma Gandhi in 1940, Vinoba Bhave was made the first individual satyagrahi and Jawaharlal Nehru was made the second individual satyagrahi. Chittaranjan Das (C.R. Das) was a famous Indian leader, politician, lawyer, and a major leader of the Indian freedom movement. He was given the title ‘Deshbandhu’. The Surat session of the Congress held in 1907 was presided over by Rash Behari Ghosh, whereas William Wedderburn was elected as the Congress President in 1889 and 1910. In 1905, Shyamji Krishna Varma established India House in London.","b":false},{"id":559,"c":49,"q":"Who was the leader of the Non-Aligned Movement?","o":[["a","China"],["b","India"],["c","Pakistan"],["d","Indonesia"]],"a":"b","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"The Non-Aligned Movement was started on India’ s initiative. It may be noted that, to establish peace and mutual cooperation in the world, India’ s Prime Minister Jawaharlal Nehru, Egypt’ s President Colonel Nasser, Ghana’ s President Kwame Nkrumah, Indonesia’ s President Sukarno, and Yugoslavia’ s President Marshal Tito Josip Broz, with mutual cooperation, initiated the Non-Aligned Movement as a third force in world politics. The first summit of the non-aligned countries was held in Belgrade under the chairmanship of Yugoslavia’ s President Marshal Tito. The 19th summit of the Non-Aligned Movement was held in January 2024 in Kampala (Uganda).","b":false},{"id":560,"c":49,"q":"Which principle did Nehru present to establish world peace and mutual cooperation?","o":[["a","Non-alignment"],["b","Panchsheel"],["c","Peaceful coexistence"],["d","None of these"]],"a":"a","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"The Non-Aligned Movement was started on India’ s initiative. It may be noted that, to establish peace and mutual cooperation in the world, India’ s Prime Minister Jawaharlal Nehru, Egypt’ s President Colonel Nasser, Ghana’ s President Kwame Nkrumah, Indonesia’ s President Sukarno, and Yugoslavia’ s President Marshal Tito Josip Broz, with mutual cooperation, initiated the Non-Aligned Movement as a third force in world politics. The first summit of the non-aligned countries was held in Belgrade under the chairmanship of Yugoslavia’ s President Marshal Tito. The 19th summit of the Non-Aligned Movement was held in January 2024 in Kampala (Uganda).","b":true},{"id":561,"c":49,"q":"Mother Teresa’ s birthplace was—","o":[["a","Albania"],["b","France"],["c","Greece"],["d","Italy 42nd B.P.S.C. (Pre) 1997–98"]],"a":"a","s":"B.P.S.C. (Pre)","y":null,"e":"Mother Teresa was a citizen of Albanian origin. She was born on 26 August 1910 in the city of Skopje, in present-day North Macedonia. In 1929, she came to Kolkata. To serve the poor and the sick, she founded the institution named “Missionaries of Charity” in 1950 and established a shelter home named “Nirmal Hriday” for the homeless, the sick, and the distressed. Mother Teresa received the Nobel Peace Prize in 1979.","b":false},{"id":562,"c":49,"q":"Religious Organisation established by Mother Teresa is called:","o":[["a","Sisters of Charity"],["b","Missionaries of Charity"],["c","Organisation of love"],["d","Charity for all"]],"a":"b","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"The religious organisation established by Mother Teresa in 1950 for humanitarian service is called “Missionaries of Charity”.","b":false},{"id":563,"c":49,"q":"National Library of India started its journey with the opening of–","o":[["a","Calcutta Public Library in March 1838"],["b","Calcutta Public Library in March 1837"],["c","Calcutta Public Library in March 1836"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"BPSC (Tre-3) July, 2024","y":2024,"e":"The history of libraries began with the earliest efforts to systematically organize collections of documents. The history of the National Library began with the formation of the Calcutta Public Library on 21 March 1836. It was a non-governmental institution run on a proprietary basis.","b":false},{"id":564,"c":49,"q":"The main feature of Panchsheel is—","o":[["a","Non-Alignment"],["b","Economic cooperation and development"],["c","Development of cultural relations"],["d","Friendship and peaceful coexistence among nations"]],"a":"d","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"The Panchsheel Agreement between India and China was signed on 29 April 1954. This agreement mentioned all the five principles of Panchsheel. The principles were—","b":false},{"id":565,"c":49,"q":"Which agreement failed to resolve the border issues between India and China, ultimately leading to the conflict?","o":[["a","Tashkent Agreement"],["b","Shimla Agreement"],["c","Panchsheel Agreement"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"BPSC (Tre-3) July, 2024","y":2024,"e":"Panchsheel, i.e., the five principles of peaceful co-existence, was formally signed on 29 April 1954 to increase trade and cultural contacts and to provide facilities for pilgrimage and travel. However, this agreement failed to resolve boundary-related issues, and India and China fought a war in 1962.","b":false},{"id":566,"c":49,"q":"Who was the first director of the ASI?","o":[["a","John Marshall"],["b","R.D. Banerjee"],["c","Alexander Cunningham"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Archaeological Survey of India (ASI) is an Indian government agency responsible for archaeological research and for the conservation and preservation of cultural-historical monuments in the country. Alexander Cunningham played an important role in its establishment, and he became its first Director-General.","b":false},{"id":567,"c":49,"q":"Match List I with List II - Organization Headquarter I. Swadeshi Sevak Home A. Vancouver II. United India House B. Seattle III. Yugantar Ashram C. San Francisco IV. INAor Azad Hind Fauj D. Rangoon List -I List - II","o":[["a","D C A B"],["b","D C B A"],["c","C D A B"],["d","A B C D"]],"a":"d","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The correct matching is as follows— Organisation Headquarters Swadeshi Sevak Home Vancouver United India House Seattle Yugantar Ashram San Francisco INA or Azad Hind Fauj Rangoon Note—(Initially, the INA headquarters was in Singapore, which was later shifted to Rangoon (Yangon).","b":false},{"id":568,"c":49,"q":"I. Khaksar A. Subhas Chandra Bose II. Socialist Party B. In ayat ullah Mashriqui III. Independent Labour C. Jayaprakash Narayan Party IV. Forward Bloc D. B.R. Ambedkar (Political Organization) (Founder)","o":[["a","B D A C"],["b","B C D A"],["c","C D A B"],["d","D C B A"]],"a":"b","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The correct matching is as follows— Political Organization Founder Khaksar In ayat ullah Mashriqui Socialist Party Jayaprakash Narayan Independent Labour Party B. R. Ambedkar Forward Bloc Subhas Chandra Bose","b":false,"n":"Match the following and select the correct code."},{"id":569,"c":49,"q":"Who headed the Royal Commission on Indian Currency appointed in 1913?","o":[["a","James Wilson"],["b","J. M. Keynes"],["c","Sir Austin Chamberlain"],["d","Sir W. R. Mansfield"]],"a":"c","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The chairman of the Royal Commission appointed on Indian currency in 1913 was Sir Austin Chamberlain.","b":false},{"id":570,"c":49,"q":"What is the ‘Mohajir Qaumi Movement’?","o":[["a","A terrorist organisation based in Karachi"],["b","A political party of immigrant Muslims settled in Pakistan"],["c","A secret society of Sunni Muslims in Karachi"],["d","None of the above"]],"a":"b","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"The Mohajir Qaumi Movement (MQM) is a political party of immigrant Muslims settled in Pakistan. Its leader is Afaq Ahmed.","b":false},{"id":571,"c":49,"q":"Which is the oldest civilization in the world?","o":[["a","Indus Valley"],["b","Chinese"],["c","Egyptian"],["d","Mesopotamian (Iraq)"]],"a":"d","s":"70th B.P.S.C. Re-Exam (Pre) 2024","y":2024,"e":"The Mesopotamian civilization is considered the oldest civilization in the world. This civilization mainly developed in the regions of present-day Iraq, north-eastern Syria, south-eastern Turkey, and western Iran. The Egyptian civilization developed in the Nile river valley and is considered to be later than the Mesopotamian civilization.","b":false},{"id":572,"c":50,"q":"Choose the correct statement-","o":[["a","Aryabhattiya is a mathematical text."],["b","The book named Lilavati was written by Brahmagupta."],["c","Panchasiddhantik a is a text of the seventh century."],["d","Zero has not been considered a number in Ganit a Sara-Sangrah."]],"a":"a","s":"43rd B.P.S.C. (Pre), 1999","y":1999,"e":"Aryabhata was a great astronomer, mathematician, and astrologer of the 5th–6th centuries CE. “Arya bhat i yam” is a treatise related to mathematics. The author of “Lilavati” was Bhaskara II. The author of “Panchasiddhantik a” was Varahamihira, who lived in the court of Chandragupta II “Vikramaditya” (375–415 CE). In “Ganita Sara-Sangraha,” zero is also considered a number.","b":false},{"id":573,"c":50,"q":"Which of the following is NOT correctly matched? Person Associated with","o":[["a","Dayanand Saraswati — Satyarth Prakash"],["b","James Augustus Hicky — Calcutta Chronicle"],["c","Ramaswami Naicker — Justice Party"],["d","Jyotirao Phule — Satyashodhak Samaj"]],"a":"b","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"James Augustus Hicky started a weekly newspaper in 1780 titled “Hicky’ s Bengal Gazette, or, The Original Calcutta General Advertiser.” He was not associated with “Calcutta Chronicle.” The famous book “Satyarth Prakash” was written by Dayanand Saraswati. E. V. Ramaswami Naicker (Periyar Ramaswami Naicker) was a leader of the Dravidian movement and the Self-Respect Movement in South India. He later joined the Justice Party. Jyotirao (Jyotiba) Phule founded the “Satyashodhak Samaj” in 1873.","b":false},{"id":574,"c":50,"q":"Whichone ofthe following books was written by Tilak?","o":[["a","India in Transition"],["b","Gita Rahasya"],["c","Gokhale-My Political Guru"],["d","Discovery of India"]],"a":"b","s":"53rd to 55th B.P.S.C. (Pre) 2011 · B.P.S.C. (CDPO) (Pre) 2005","y":2011,"e":"The book “Gita Rahasya” was written by Lokmanya Bal Gangadhar Tilak in Mandalay Jail. In it, he gave a detailed explanation of the Karma Yoga of the Shrimad Bhagavad Gita. After reading “Gita Rahasya,” Gandhiji said that Tilak’ s commentary on the Gita would remain his eternal memorial. In the preface of this book, Tilak wrote: “I prepared the first draft of the book in Mandalay Jail during the winter of 1910–1911. Thereafter, as new ideas came to my mind, I kept improving that draft from time to time, and the parts that had to be left incomplete due to the lack of necessary books were completed after my release from prison.” This makes it clear that most of “Gita Rahasya” was written by Tilak in Mandalay Jail itself, and some part was written after his release.","b":false},{"id":575,"c":50,"q":"What was the name of the first book of Raja Ram Mohan Roy published in 1815?","o":[["a","Vedanta Grantha"],["b","Tuhfat-ul-Muwahhidin"],["c","Bharathi Vilasa"],["d","Shakuntalam"],["e","None of the above/More than one of the above"]],"a":"*","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"The given question is incorrect. Raja Ram Mohan Roy’ s first book was “Tuhfat-ul-Muwahhidin,” written in 1803–04, and it was published in 1805. This book was originally written in Persian, with an Arabic preface. Another of his books, “Vedanta Grantha,” was published in 1815. Therefore, the book published in 1815 (“Vedanta Grantha”) was not his first book.","b":false},{"id":576,"c":50,"q":"Who had translated the Bengali play, Nil Darpan into English?","o":[["a","Dinabandhu Mitra"],["b","James Long"],["c","Antonio Gramsci"],["d","Michael Madhusudan Dutt"],["e","None of the above/More than one of the above"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"Dinabandhu Mitra’ s Bengali play Nil Darpan mentions the Indigo Revolt (1859–60) and highlights the exploitation of peasants. The English translation of Nil Darpan from the original Bengali was published in 1861 without naming the translator, and the translator was mentioned only as “A Native” (as written in the original text—“Translated from the Bengali by a Native”). James Long, who published and supervised the English edition, never revealed the translator’ s identity. Contemporary scholars like Bankim Chandra Chattopadhyay and Shibnath Shastri believed that the translator was Michael Madhusudan Dutt. Although this belief is widespread, there has been no formal confirmation. It remains a matter of controversy even today.","b":false},{"id":577,"c":50,"q":"Who founded the ‘Amrita Bazar Patrika’?","o":[["a","Harish Chandra Mukherjee"],["b","S.N. Banerjee"],["c","Girish Chandra Ghosh"],["d","Shishir Kumar Ghosh"]],"a":"d","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"The Amrita Bazar Patrika was founded by Motilal Ghosh and Shishir Kumar Ghosh in 1868 in Amrita Bazar village (now in Jessore district, Bangladesh). However, due to an epidemic in the village, its office was shifted to Calcutta in 1871. Initially, it was published in the Bengali language. To escape the Vernacular Press Act, 1878, the newspaper was converted overnight into an English-language publication. Girish Chandra Ghosh started The Bengalee in 1862, which was taken over by S.N. Banerjee in 1879.","b":false},{"id":578,"c":50,"q":"Playeda supporting role in the publication of Dadabhai Naoroji's book'Poverty and Un-British Rule in India' in 1901.","o":[["a","To highlight the economic exploitation of India by British colonialism."],["b","To advocate for the abolition of the caste system."],["c","To promote the idea of separate electorates for Muslims."],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"In 1901, Dadabhai Naoroji’ s book 'Poverty and Un-British Rule in India highlighted India’ s' economic exploitation under British colonialism. Dadabhai Naoroji is also known as the “Grand Old Man of India.”","b":false},{"id":579,"c":50,"q":"In 1901 who has published the book 'Poverty and Un-British Rule in India'?","o":[["a","Dadabhai Naoroji"],["b","S. N. Banerjee"],["c","R. C. Dutt"],["d","Pherozeshah Mehta"]],"a":"a","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"In 1901, Dadabhai Naoroji’ s book 'Poverty and Un-British Rule in India highlighted India’ s' economic exploitation under British colonialism. Dadabhai Naoroji is also known as the “Grand Old Man of India.”","b":true},{"id":580,"c":50,"q":"Who wrote the book, Poverty and Un-British Rule in India?","o":[["a","R.C. Dutt"],["b","Dadabhai Naoroji"],["c","Bipin Chandra Pal"],["d","Lajpat Rai"],["e","None of the above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"In 1901, Dadabhai Naoroji’ s book 'Poverty and Un-British Rule in India highlighted India’ s' economic exploitation under British colonialism. Dadabhai Naoroji is also known as the “Grand Old Man of India.”","b":true},{"id":581,"c":50,"q":"Which newspaper propagated strong nationalist views during India’ s freedom struggle?","o":[["a","Pioneer"],["b","Amrita Bazar Patrika"],["c","Statesman"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"BPSC (Tre-3) July, 2024","y":2024,"e":"Some of the most powerful newspapers that emerged to spread national awakening against colonial rule were— Sudharak, Kesari, Mahratta, Navjivan, Swadeshmitran, Amrita Bazar Patrika, Hindustan, Matribhoomi, etc. Amrita Bazar Patrika was started in 1868 by two brothers, Shishir Kumar Ghosh and Motilal Ghosh.","b":false},{"id":582,"c":50,"q":"The 'Young India', a Nationalist paper, was started by","o":[["a","Mahatma Gandhi"],["b","Annie Besant"],["c","Bal Gangadhar Tilak"],["d","Maulana Abul Kalam Azad"]],"a":"a","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"‘Young India’ was an English weekly national journal which became a highly influential platform during India’ s freedom struggle. It was edited by Mahatma Gandhi during 1919–1931. Since, in the question, ‘The Young India’ was written in place of ‘Young India’, the Bihar Public Service Commission removed this question.","b":false},{"id":583,"c":50,"q":"Which journal was not associated with revolutionary activities?","o":[["a","Sandhya"],["b","Yugantar"],["c","Ghadar"],["d","Young India"],["e","None of the above/More than one of the above"]],"a":"d","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"The magazine ‘Young India’ was not associated with revolutionary activities. ‘Young India’ was edited by Mahatma Gandhi. Mahatma Gandhi was a supporter of non-violent movements. In 1913, Sohan Singh Bhakna, along with other associates, founded an organisation called the ‘Hindustan Association of the Pacific Coast’. This organisation brought out a newspaper named ‘Ghadar’, due to which the organisation also came to be known as the ‘Ghadar Party’. The magazines Yugantar and Sandhya were also related to revolutionary activities.","b":false},{"id":584,"c":50,"q":"Who started the journal 'Bahishkrit Bharat'?","o":[["a","Jyotiba Phule"],["b","Karsandas Mulji"],["c","Bal Gangadhar Tilak"],["d","Babasaheb Ambedkar"],["e","None of the above/More than one of the above"]],"a":"d","s":"67th B.P.S.C. (Pre) 2021","y":2021,"e":"On 20 July, 1924, Bhimrao Ambedkar formed an organisation in Bombay called the ‘Bahishkrit Hit a karin i Sabha’, with the objective of bringing about the moral and material upliftment of the untouchable people. Sir Chimanlal Harilal Setalvad was made its first president, while Ambedkar became the chairman of the managing committee. The resolution of the Sabha was accepted as: educate, agitate and organise. The objective of the Sabha was to place the problems of the untouchables before the government. On 3 April, 1927, he started the Marathi fortnightly ‘Bahishkrit Bharat’ from Bombay.","b":false},{"id":585,"c":50,"q":"‘New Lamps for Old’ was a series of articles (1893-94) that criticized the Congress for being out of touch with the ‘proletariat.’ Who was the author of these articles?","o":[["a","Aurobindo Ghose"],["b","A. O. Hume"],["c","G.K. Gokhale"],["d","B.G. Tilak"]],"a":"a","s":"56th to 59thB.P.S.C. (Pre) 2014","y":2014,"e":"Due to the then prevailing Indian conditions, and because the Congress adopted a wavering attitude towards imperialist forces, Aurobindo Ghosh criticised the Congress in his article series ‘New Lamps for Old’.","b":false},{"id":586,"c":50,"q":"Who wrote \"New Lamps For The Old\"?","o":[["a","Surendranath"],["b","Aurobindo Ghosh"],["c","Motilal Ghosh"],["d","More than one of the above"]],"a":"b","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"Due to the then prevailing Indian conditions, and because the Congress adopted a wavering attitude towards imperialist forces, Aurobindo Ghosh criticised the Congress in his article series ‘New Lamps for Old’.","b":true},{"id":587,"c":50,"q":"Who was the editor of ‘Hindu Patriot’?","o":[["a","Harishchandra Mukherjee"],["b","Dinabandhu Mitra"],["c","Babul Mani"],["d","Nab in chandra Sen"],["e","None of the above/More than one of the above"]],"a":"a","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"A weekly newspaper named ‘Hindu Patriot’ was established in January, 1853 in Calcutta under the leadership of a businessman, Madhusudan Ray. For this English-language paper, Girish Chandra Ghosh was appointed as the editor. Later, Harishchandra Mukherjee became its editor. Therefore, in some books, the name of Girish Chandra Ghosh appears as the founder of ‘Hindu Patriot’, whereas both Madhusudan Ray and Girish Chandra Ghosh played important roles in its establishment.","b":false},{"id":588,"c":50,"q":"Who wrote the book 'India for Indians'?","o":[["a","C. R. Das"],["b","M.G. Ranade"],["c","V.D. Savarkar"],["d","S.N. Banerjee"],["e","None of the above"]],"a":"a","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"The author of the well-known book ‘India for Indians’ during the Indian freedom movement was Chittaranjan Das (C.R. Das).","b":false},{"id":589,"c":50,"q":"Who has written the book 'Unhappy India'?","o":[["a","Bal Gangadhar Tilak"],["b","Annie Besant"],["c","Lala Lajpat Rai"],["d","A.O. Hume"],["e","None of the above/ More than one of the above"]],"a":"c","s":"67th B.P.S.C. (Pre) 2021","y":2021,"e":"The author of ‘Unhappy India’ is Lala Lajpat Rai. Bal Gangadhar Tilak edited ‘Kesari’ and ‘Maratha’, and Annie Besant edited ‘Common weal’ and ‘New India’.","b":false},{"id":590,"c":50,"q":"Which one of the following was a journal brought out by Abul Kalam Azad?","o":[["a","Zamindar"],["b","The Comrade"],["c","Al-Hilal"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"‘Al-Hilal’ was edited by Abul Kalam Azad. He was the first Education Minister of independent India. ‘India Wins Freedom’, ‘Gubar-e-Khatir’, etc. are his major works, whereas the newspapers ‘Zamindar’ and ‘The Comrade’ were associated respectively with Sira judd in and Maulana Mohammad Ali Jauhar.","b":false},{"id":591,"c":50,"q":"The author of ‘India Wins Freedom’ is—","o":[["a","Jawaharlal Nehru"],["b","Abul Kalam Azad"],["c","Sarojini Naidu"],["d","Nayantara Sahgal"]],"a":"b","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"‘Al-Hilal’ was edited by Abul Kalam Azad. He was the first Education Minister of independent India. ‘India Wins Freedom’, ‘Gubar-e-Khatir’, etc. are his major works, whereas the newspapers ‘Zamindar’ and ‘The Comrade’ were associated respectively with Sira judd in and Maulana Mohammad Ali Jauhar.","b":true},{"id":592,"c":50,"q":"Who wrote the book, 'India Divided'?","o":[["a","Rajendra Prasad"],["b","Maulana Abul Kalam Azad"],["c","Penderel Moon"],["d","Amba Prasad"],["e","None of the above / More than one of the above"]],"a":"a","s":"B.P.S.C. CDPO (Pre) 2022","y":2022,"e":"The author of ‘India Divided’ is Dr. Rajendra Prasad, former President of India. The first edition of this book was published in January 1946. Dr. Rajendra Prasad divided the book into six parts. In it, he mainly discusses various aspects of the Partition of India.","b":false},{"id":593,"c":50,"q":"Who wrote the book 'India Divided'?","o":[["a","B.G. Tilak"],["b","Rajendra Prasad"],["c","Penderel Moon"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. School teacher · Headmaster 10.12.2023","y":2023,"e":"The author of ‘India Divided’ is Dr. Rajendra Prasad, former President of India. The first edition of this book was published in January 1946. Dr. Rajendra Prasad divided the book into six parts. In it, he mainly discuss
