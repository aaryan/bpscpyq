ociation was established by -","o":[["a","Pherozeshah Mehta"],["b","K. T. Telang"],["c","W.C. Banerjee"],["d","Tyabji"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. (Pre) 2020 · 63rd B.P.S.C. (Pre) 2017","y":2020,"e":"In 1885, the Bombay Presidency Association was founded by Pherozeshah Mehta, K.T. Telang, and Badruddin Tyabji. Its objective was to submit memoranda/representations for Indian representation and political reforms under British rule, and to oppose the discriminatory policies of the British government.","b":false},{"id":175,"c":10,"q":"Who was the founder of the Indian Association?","o":[["a","Dadabhai Naoroji"],["b","Bal Gangadhar Tilak"],["c","A.O. Hume"],["d","Surendra Nath Banerjee"]],"a":"d","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"On 26 July, 1876, Surendranath Banerjee, with the help of Anand Mohan Bose, founded the Indian Association in Calcutta. It was the most important among the contemporary organizations and, before the Congress, it was regarded as an all-India organization. This organization demanded reforms in the Civil Service examination system and launched movements on issues such as controversies like the Ilbert Bill. In the Indian Association (Bharat Sabha), the middle class was given priority over the zamindars.","b":false},{"id":176,"c":10,"q":"Who led the Indian Association?","o":[["a","Surendranath Banerjee"],["b","Anand Mohan Bose"],["c","Dwarka nath Ganguly"],["d","R.C. Dutt"],["e","None of the above/More than one of the above"]],"a":"e","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"On 26 July, 1876, Surendranath Banerjee, with the help of Anand Mohan Bose, founded the Indian Association in Calcutta. It was the most important among the contemporary organizations and, before the Congress, it was regarded as an all-India organization. This organization demanded reforms in the Civil Service examination system and launched movements on issues such as controversies like the Ilbert Bill. In the Indian Association (Bharat Sabha), the middle class was given priority over the zamindars.","b":true},{"id":177,"c":10,"q":"Who established Indian Association in 1876?","o":[["a","Surendra Nath Banerjee"],["b","Chittaranjan Das"],["c","W. C. Banerjee"],["d","Aurobindo Ghosh"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"On 26 July, 1876, Surendranath Banerjee, with the help of Anand Mohan Bose, founded the Indian Association in Calcutta. It was the most important among the contemporary organizations and, before the Congress, it was regarded as an all-India organization. This organization demanded reforms in the Civil Service examination system and launched movements on issues such as controversies like the Ilbert Bill. In the Indian Association (Bharat Sabha), the middle class was given priority over the zamindars.","b":true},{"id":178,"c":10,"q":"The most important of the pre-Congress nationalist organisation was the","o":[["a","Bengal British India Society"],["b","East India Association"],["c","Young Bengal Association"],["d","Indian Association of Calcutta"]],"a":"d","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"On 26 July, 1876, Surendranath Banerjee, with the help of Anand Mohan Bose, founded the Indian Association in Calcutta. It was the most important among the contemporary organizations and, before the Congress, it was regarded as an all-India organization. This organization demanded reforms in the Civil Service examination system and launched movements on issues such as controversies like the Ilbert Bill. In the Indian Association (Bharat Sabha), the middle class was given priority over the zamindars.","b":true},{"id":179,"c":10,"q":"The Madras Mahajan Sabha was established in the year-","o":[["a","1880"],["b","1881"],["c","1882"],["d","1883"]],"a":"*","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"The Madras Mahajan Sabha was established in May, 1884 by M. Veeraraghavachar , 21 from Madras, 3 from Bengal, 7 from the North-Western Provinces and Awadh (present-day Uttar Pradesh), and 3 from Punjab. The first session of the Indian National Congress was presided over by Womesh Chandra Banerjee (W.C. Banerjee), and its first General Secretary was A.O. Hume himself.","b":true},{"id":188,"c":11,"q":"The second session of the Indian National Congress was presided over by-","o":[["a","Ganesh Agarkar"],["b","Surendra Nath Banerjee"],["c","Dadabhai Naoroji"],["d","Pherozeshah Mehta"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"The second session of the Congress was held in 1886 in Calcutta. It was presided over by Dadabhai Naoroji.","b":false},{"id":189,"c":11,"q":"Who was the first woman president of the Indian National Congress?","o":[["a","Kasturba Gandhi"],["b","Mrs. Annie Besant"],["c","Sarojini Naidu"],["d","Bhakti Lakshmi Desai"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"Annie Besant was a woman of Irish origin. She remained the President of the Theosophical Society from 1907 to 1933, formed the Home Rule League in 1916, and became the first woman president of the Indian National Congress in 1917. In the Congress session held at Kanpur in 1925, Sarojini Naidu became the first Indian woman president of the Congress and the second woman president. From 1947 to 1949, she also served as the Governor of Uttar Pradesh (then called the United Provinces).","b":false},{"id":190,"c":11,"q":"In which year did an Indian woman become the president of the Indian National Congress?","o":[["a","1917"],["b","1918"],["c","1920"],["d","1924"],["e","None of the above"]],"a":"e","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"Annie Besant was a woman of Irish origin. She remained the President of the Theosophical Society from 1907 to 1933, formed the Home Rule League in 1916, and became the first woman president of the Indian National Congress in 1917. In the Congress session held at Kanpur in 1925, Sarojini Naidu became the first Indian woman president of the Congress and the second woman president. From 1947 to 1949, she also served as the Governor of Uttar Pradesh (then called the United Provinces).","b":true},{"id":191,"c":11,"q":"Who was the first Indian woman President of the Indian National Congress?","o":[["a","Mrs. Annie Besant"],["b","Sucheta Kriplani"],["c","Sarojini Naidu"],["d","Indira Gandhi"]],"a":"c","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"Annie Besant was a woman of Irish origin. She remained the President of the Theosophical Society from 1907 to 1933, formed the Home Rule League in 1916, and became the first woman president of the Indian National Congress in 1917. In the Congress session held at Kanpur in 1925, Sarojini Naidu became the first Indian woman president of the Congress and the second woman president. From 1947 to 1949, she also served as the Governor of Uttar Pradesh (then called the United Provinces).","b":true},{"id":192,"c":11,"q":"The first woman President of the Indian National Congress was","o":[["a","Sarojini Naidu"],["b","Annie Besant"],["c","Kasturba Gandhi"],["d","Aruna Asaf Ali"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"Annie Besant was a woman of Irish origin. She remained the President of the Theosophical Society from 1907 to 1933, formed the Home Rule League in 1916, and became the first woman president of the Indian National Congress in 1917. In the Congress session held at Kanpur in 1925, Sarojini Naidu became the first Indian woman president of the Congress and the second woman president. From 1947 to 1949, she also served as the Governor of Uttar Pradesh (then called the United Provinces).","b":true},{"id":193,"c":11,"q":"How many Muslim delegates participated in the second Convention of the Indian National Congress?","o":[["a","2"],["b","33"],["c","30"],["d","41"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The second session of the Congress was held at Calcutta from 27–30 December 1886, under the presidency of Dadabhai Naoroji. A total of 436 registered delegates participated in the second session. In the first session, the number of Muslim representatives was 2; in the second session it became 33; in the third session (1887) it became 81; and in the fourth session (1888) it reached 221.","b":false},{"id":194,"c":11,"q":"Who was the first Muslim President of the Indian National Congress?","o":[["a","Hasrat Mohani"],["b","Badruddin Tyabji"],["c","Maulana Azad"],["d","More than one of the above"]],"a":"b","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"Badruddin Tyabji had the honour of being the first Muslim President of the Indian National Congress. He was elected to preside over the third session of the INC held at Madras from 27–30 December 1887.","b":false},{"id":195,"c":11,"q":"Who was the second Muslim President of the Indian National Congress?","o":[["a","Abul Kalam Azad"],["b","Zakir Hussain"],["c","Rahimtulla M. Sayani"],["d","Badruddin Tyabji"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The second Muslim President of the Indian National Congress was Rahimtulla Muhammad Sayani. Notably, the 12th session of the INC was held at Calcutta from 28–31 December 1896, under the presidency of Rahimtulla Sayani. The first Muslim President of the INC was Badruddin Tyabji.","b":false},{"id":196,"c":11,"q":"Mahatma Gandhi presided over which session of the Indian National Congress?","o":[["a","1922"],["b","1924"],["c","1928"],["d","1930"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"In December 1924, Mahatma Gandhi presided over the 39th annual session of the Congress at Belgaum. A resolution at this session decided that emphasis should be laid on Gandhi’ s constructive programmes. In the same session, the “Gandhi–Nehru–Das Agreement” (Gandhi–Swarajist Pact) was also ratified.","b":false},{"id":197,"c":11,"q":"“The Indian National Congress was founded on the basis of Safety Valve Theory, to protect the British Government from threats.” Which leader said that?","o":[["a","C. Rajagopalachari"],["b","Lala Lajpat Rai"],["c","Bipin Chandra Pal"],["d","None of them"]],"a":"b","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"The Safety Valve Theory was used by the extremist leader Lala Lajpat Rai in his book ‘Young India’. He considered the Congress to be a creation of Lord Dufferin’ s mind. Lala Lajpat Rai believed that the British used the Congress organisation to protect the British government from dangers.","b":false},{"id":198,"c":11,"q":"Who said that “Congress Movement was neither inspired by the people, nor devised or planned by them”?","o":[["a","Lord Dufferin"],["b","Sir Syed Ahmed"],["c","Lord Curzon"],["d","Lala Lajpat Rai"]],"a":"d","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"In his book ‘Young India’, Lala Lajpat Rai wrote: “The Congress movement was neither inspired by the people, nor devised or planned by them.”","b":false},{"id":199,"c":11,"q":"“In my belief, Congress is too tottering to its fall and one of my great ambitions while in India is to assist it to a peaceful demise.” Who wrote it?","o":[["a","Lord Lytton"],["b","Lord Dufferin"],["c","Lord Curzon"],["d","Lord Minto"],["e","None of the above/More than one of the above"]],"a":"c","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"The British rulers believed that the Congress, under the leadership of the moderates, was quite weak and had no deep roots among the masses; therefore, it could be finished. Lord Curzon was the main spokesman of this policy. In a letter written by Curzon to the Secretary of State for India on 18 November 1900, he said: “In my belief, congress... peaceful demise.” In 1903, he wrote to the Governor of Madras: “Ever since I came to India, my policy has been to make the Congress impotent by every means.” In 1904, Curzon refused to meet a deputation led by the Congress President.","b":false},{"id":200,"c":11,"q":"Who among the following said that “Congress is too tottering to its fall andone of my great ambitions while in India is to assist it to a peaceful demise”?","o":[["a","Dufferin"],["b","Minto"],["c","Curzon"],["d","More than one of the above"],["e","None of the above B.P.S.C. School Teacher (Class 9 th-10th) 08-12-2023"]],"a":"c","s":"B.P.S.C. (Pre)","y":null,"e":"The British rulers believed that the Congress, under the leadership of the moderates, was quite weak and had no deep roots among the masses; therefore, it could be finished. Lord Curzon was the main spokesman of this policy. In a letter written by Curzon to the Secretary of State for India on 18 November 1900, he said: “In my belief, congress... peaceful demise.” In 1903, he wrote to the Governor of Madras: “Ever since I came to India, my policy has been to make the Congress impotent by every means.” In 1904, Curzon refused to meet a deputation led by the Congress President.","b":true},{"id":201,"c":11,"q":"Rajani Palme Dutt said, \"They both fought and collaborated with imperialism.\" Which political grouping was he referring to?","o":[["a","The Indian National Congress"],["b","The Communist Party of India"],["c","The Swaraj Party"],["d","Hindustan Socialist Republican Association."],["e","None of the above/More than one of the above"]],"a":"a","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Rajani Palme Dutt made this statement about the Indian National Congress. On many occasions, the Congress also cooperated with British rule—for example, Indian support during the First World War and the Gandhi–Irwin talks. At the same time, it opposed imperialism and fought the freedom struggle against the British, and it also led the country to independence.","b":false},{"id":202,"c":11,"q":"Who called the 1897 Amravati session of the Indian National Congress a 'three-day spectacle'?","o":[["a","Jat indra nath"],["b","Satish Mukherjee"],["c","Ashwini Kumar Dutt"],["d","Harkishan Lal"],["e","None of the above"]],"a":"c","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The 1897 Amravati session of the Indian National Congress was called a “three-day spectacle” by Ashwini Kumar Dutt.","b":false},{"id":203,"c":11,"q":"The process of a split inthe Congress in the early years of the twentieth century began over –","o":[["a","Strategies of the Congress Movement"],["b","Objectives of the Congress"],["c","Participation of the people in the Congress Movement"],["d","All of the above"]],"a":"d","s":"56th to 59thB.P.S.C. (Pre) 2014","y":2014,"e":"One major reason for the Congress split in the early years of the twentieth century was that the Moderates failed in their strategies and objectives, and they could not keep the common people with them. The Moderates did not work among the masses. They could not adjust their strategy according to political developments. They could not realise that their very achievements had made their politics impractical. The outlook and assessment of both the Moderates and the Extremists were also wrong—both in terms of their mutual differences and from a nationalist perspective. The Moderates could not understand that the government was negotiating with them mainly due to fear of the Extremists, and the Extremists could not understand that the Moderates could act as a protective shield in their struggle. As a result, the Congress split at the Surat session in 1907.","b":false},{"id":204,"c":11,"q":"Who was the president of the Indian National Congress during the 1916 Lucknow session where the Congress and the Garam Dal signed an agreement?","o":[["a","Bal Gangadhar Tilak"],["b","Ambika Charan Majumdar"],["c","Annie Besant"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"During the Lucknow session of 1916, the President of the Indian National Congress was Ambika Charan Mazumdar. In this session, the Extremists re-entered the Congress, and the Congress–Muslim League agreement was also concluded in the same session.","b":false},{"id":205,"c":11,"q":"The Congress took a critical stand over the Montford Reforms in 1918, which led to break up with the old moderate remnants (Sapru, Jayakar and Chin tam ani) who formed the","o":[["a","Indian National Liberal Federation"],["b","Servants of India Society"],["c","Swaraj Party"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2022","y":2022,"e":"In August 1917, the Secretary of State for India, Edwin Montagu, made a historic statement in the British Parliament, known as the Montagu Declaration (August Declaration). In this declaration, it was proposed to increase the participation of Indians in administration and in the development of self-governing institutions in India. To work out these reforms, Montagu, along with the then Viceroy Lord Chelmsford, brought out a detailed report titled “Constitutional Reforms in India”, which is called the Montford Report or the Montagu–Chelmsford Report. This report was published in 1918. Regarding this report, differences between the liberal and extremist groups within the Congress became clearly visible. As a result, the liberals who supported the Montford Report separated from the Congress in 1918 and, under the leadership of Surendranath Banerjee, founded a new party in 1919 named the “Indian National Liberal Federation”.","b":false},{"id":206,"c":11,"q":"In which working Committee did the Congress adopt the policy of abolishing land ownership?","o":[["a","Working Committee, 1937"],["b","Working Committee, 1942"],["c","Working Committee, 1945"],["d","Working Committee, 1946"]],"a":"a","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"The Executive Committee of the Indian National Congress adopted the policy of abolishing landlord ism in 1937. Tenancy bills were passed in the United Provinces and Bihar. In all Congress-ruled provinces, efforts were made to protect cultivators from the clutches of moneylenders and to improve irrigation facilities.","b":false},{"id":207,"c":11,"q":"Who was elected as the President ofthe Indian National Congress in 1938?","o":[["a","Abul Kalam Azad"],["b","Subhas Chandra Bose"],["c","Pattabhi Sitaramayya"],["d","J.B. Kripalani"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"At the Haripura (Gujarat) session of the Congress (February 1938), Subhas Chandra Bose was elected President unopposed. It is noteworthy that in 1939 as well, at the Tripuri session, Subhas won the presidential election by defeating Sitaramayya. However, he resigned from the post of President in April 1939, and Dr. Rajendra Prasad was made the new Congress President in his place.","b":false},{"id":208,"c":11,"q":"Who became the President of Indian National Congress when Subhas Chandra Bose resigned in 1939?","o":[["a","Rajendra Prasad"],["b","Abul Kalam Azad"],["c","Jawahar Lal Nehru"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"At the Haripura (Gujarat) session of the Congress (February 1938), Subhas Chandra Bose was elected President unopposed. It is noteworthy that in 1939 as well, at the Tripuri session, Subhas won the presidential election by defeating Sitaramayya. However, he resigned from the post of President in April 1939, and Dr. Rajendra Prasad was made the new Congress President in his place.","b":true},{"id":209,"c":11,"q":"In which year was Subhas Chandra Bose the President of the Indian National Congress?","o":[["a","1939"],["b","1937"],["c","1938"],["d","More than one of the above"],["e","None of the above"]],"a":"d","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"At the Haripura (Gujarat) session of the Congress (February 1938), Subhas Chandra Bose was elected President unopposed. It is noteworthy that in 1939 as well, at the Tripuri session, Subhas won the presidential election by defeating Sitaramayya. However, he resigned from the post of President in April 1939, and Dr. Rajendra Prasad was made the new Congress President in his place.","b":true},{"id":210,"c":11,"q":"Who was the Congress President who held talks with both the Cripps Mission and Lord Wavell?","o":[["a","Abul Kalam Azad"],["b","Jawaharlal Nehru"],["c","J.B. Kripalani"],["d","C. Rajagopalachari"]],"a":"a","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Abul Kalam Azad remained the President of the Congress from 1940 to 1946. He held talks with both the Cripps Mission (in 1942) and Lord Wavell (in 1945).","b":false},{"id":211,"c":11,"q":"Who wasthe President of the Indian National Congress at the time of the partition of India?","o":[["a","J.B. Kripalani"],["b","Jawaharlal Nehru"],["c","Maulana Abul Kalam Azad"],["d","C. Rajagopalachari"],["e","None of the above"]],"a":"a","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"When India became independent, J.B. Kripalani was the President of the Congress. He was elected President at the Meerut Session of the Congress (November 1946), and he remained President at the time of Independence as well. The Jaipur Session of the Congress (December 1948) was presided over by Dr. Pattabhi Sitaramayya. Mahatma Gandhi presided over the Belgaum Session (1924); Jawaharlal Nehru presided over the Lahore, Lucknow and Faizpur Sessions (respectively: December 1929, April 1936 and December 1936); and Sardar Vallabhbhai Patel presided over the Karachi Session (March 1931).","b":false},{"id":212,"c":11,"q":"Who presided over the Delhi Session the of Indian National Congress in 1947?","o":[["a","J. B. Kripalani"],["b","Rajendra Prasad"],["c","Abul Kalam Azad"],["d","Jawaharlal Nehru"]],"a":"b","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"A special session of the Indian National Congress was held in Delhi on 14–15 June 1947. Although Acharya J.B. Kripalani was the President of the Congress then, this historic meeting was presided over by Dr. Rajendra Prasad. The main purpose of this meeting was to deliberate on the Mountbatten Plan.","b":false},{"id":213,"c":11,"q":"At the Congress Working Committee meeting at Allahabad (April-May 1947), who of the following members was able to secure a majority for his plan of a guerrilla War against the Japanese due to India’ s unequivocal stand against Nazism, Fascism and imperialism?","o":[["a","Subhash Chandra Bose"],["b","Sarojini Naidu"],["c","Maulana Azad"],["d","Jawaharlal Nehru"]],"a":"d","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"Pandit Jawaharlal Nehru, because of India’ s firm anti-Nazism, anti-Fascism and anti-imperialist stand, secured a majority in support of his plan for guerrilla war against Japan in the Congress Working Committee meeting held at Allahabad (13 May 1942).","b":false},{"id":214,"c":11,"q":"In which of the following Indian National Congress Sessions, the resolutions related to the Fundamental Rights were passed for the first time?","o":[["a","Surat Session—1907"],["b","Gaya Session—1922"],["c","Karachi Session—1931"],["d","None of the above"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"To approve the Gandhi–Irwin Pact (Delhi Pact), the Karachi Session of the Congress was held on 29–31 March 1931 under the president ship of Sardar Vallabhbhai Patel. In this session, for the first time, the Congress passed resolutions related to Fundamental Rights and the National Economic Programme. In the same session, when some people opposed it, Gandhiji said, “Gandhi may die, but Gandhism will not.”","b":false},{"id":215,"c":12,"q":"Which Indian leader for the first time used the 'Safety-Valve Theory'to attack the Moderates in the Congress?","o":[["a","Lala Lajpat Rai"],["b","Bipin Chandra Pal"],["c","Bal Gangadhar Tilak"],["d","Dadabhai Naoroji"]],"a":"a","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"For the first time, the extremist leader Lala Lajpat Rai, in his book Young India published in 1916, used this theory to accuse the moderate leaders of the Congress of running an organisation which the British rulers were using like a “safety-valve”.","b":false},{"id":216,"c":12,"q":"Most of the moderate leaders hailed from:","o":[["a","Rural areas"],["b","Urban areas"],["c","Both rural and urban areas"],["d","Punjab"]],"a":"b","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"In the era of liberal politics or political mendicancy, most moderate leaders—such as Dadabhai Naoroji, Feroze shah Mehta, Dinshaw Wacha, Womesh Chandra Bonnerjee and Surendranath Banerjee—were associated with urban areas. During this period, the Congress was dominated by prosperous, middle-class intellectuals, including lawyers, doctors, engineers, journalists and literary persons. Titles and high positions attracted them. The representatives who came to the Congress generally came from big cities, and their contact with the common people was limited. Feroze shah Mehta himself said, “The voice of the Congress is not the voice of the people; however, it is the duty of other countrymen living among them to understand their feelings.","b":false},{"id":217,"c":12,"q":"Which one of the following was not an extremist?","o":[["a","Bal Gangadhar Tilak"],["b","Madan Lal"],["c","Udham Singh"],["d","G.K. Gokhale"]],"a":"d","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"Gopal Krishna Gokhale was associated with the Liberal (Moderate) camp. He believed in equanimity and a gentle sense of justice. He had complete faith that the nation’ s regeneration could not take place amid storms of agitation. He believed in the purity of both means and ends. Influenced by these ideas, Gandhiji became his disciple. He entered politics from the platform of the Bombay Congress session of 1889. In 1897, he and Dinshaw Wacha were asked to give evidence before the Welby Commission appointed to examine Indian expenditure. In 1899, he was elected to the Bombay Legislative Council and later to the Imperial Legislative Council.","b":false},{"id":218,"c":12,"q":"Indian National Movement came to be dominated by the extremists after –","o":[["a","1906"],["b","1909"],["c","1914"],["d","1919"]],"a":"a","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"After 1906, within the Congress, the influence of the extremist group increased in Indian politics. The extremist group was jointly led by major Congress leaders—Bal Gangadhar Tilak, Lala Lajpat Rai, Bipin Chandra Pal, and Aurobindo Ghosh.","b":false},{"id":219,"c":12,"q":"Which one of the following leaders belonged to the Extremist wing of the Congress?","o":[["a","Aurobindo Ghosh"],["b","Dadabhai Naoroji"],["c","G.K. Gokhale"],["d","S.N. Banerjee"]],"a":"a","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Aurobindo Ghosh was a leader of the extremist group in the Congress. He was one of the four pillars of the extremist group (Lala Lajpat Rai, Bal Gangadhar Tilak, Bipin Chandra Pal, and Aurobindo Ghosh). In his article written in 1893–94, he said that the Congress was away from the working class, was anti-national, and had completely failed; and he described as cowardice the Congress policy of not speaking clearly due to fear of displeasing the British rulers. According to him, the Congress was going to die of tuberculosis. In 1908, the police raided Manictala Garden (another name—Murari Pukur Baganbari), arrested 14 revolutionaries, and arrested Aurobindo Ghosh from his house on Grey Street. All of them were tried in the Alipore Conspiracy Case. The trial against Aurobindo Ghosh continued for about a year, but later he was acquitted due to lack of evidence. In the course of time, he withdrew from revolutionary activities, became an ascetic, and went to Pondicherry (now Puducherry).","b":false},{"id":220,"c":12,"q":"Who propounded the doctrine of ‘Passive Resistance’?","o":[["a","Mahatma Gandhi"],["b","Bipin Chandra Pal"],["c","Bal Gangadhar Tilak"],["d","Aurobindo Ghosh"]],"a":"d","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"A series of articles on “Passive Resistance” was first published in the newspaper Bande Mataram between 9 and 23 April, 1907. Aurobindo Ghosh believed that the British should leave India immediately. Until the British did so, protests against them should continue.","b":false},{"id":221,"c":12,"q":"Who among the following was not known as a moderate in the National Movement?","o":[["a","Bal Gangadhar Tilak"],["b","Dadabhai Naoroji"],["c","M.G. Ranade"],["d","Gopal Krishna Gokhale"]],"a":"a","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Among the four main pillars of extremism (Lala Lajpat Rai, Bal Gangadhar Tilak, Bipin Chandra Pal, and Aurobindo Ghosh), Bal Gangadhar Tilak was the pioneer of this ideology. He criticized the Congress policy of petition and prayer. Tilak said about the Congress, “If we croak like frogs once a year, we will get nothing.” Dadabhai Naoroji and Gopal Krishna Gokhale were Moderate leaders of the Congress, whereas M.G. Ranade was a social reformer.","b":false},{"id":222,"c":12,"q":"Bal Gangadhar Tilak came to be known as'Lokmanya Tilak' when –","o":[["a","He became a popular teacher."],["b","He started a popular newspaper."],["c","The government accused him in the Rand Murder Case."],["d","He started the Shivaji and Ganpati festivals."],["e","None of the above/More than one of the above."]],"a":"e","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The British government made Bal Gangadhar Tilak an accused in the murder case of the then Pune plague commissioner W.C. Rand and Lieutenant Ayerst. Tilak was found guilty and was sentenced to 18 months of rigorous imprisonment. When he came out of jail, he emerged as a national hero. Thus, not due to any single incident, but after many nationalist actions, Tilak was given the title “Lokmanya.”","b":false},{"id":223,"c":12,"q":"Who said, “Swarajis my birthright and Is hall have it”?","o":[["a","Bipin Chandra Pal"],["b","Aurobindo Ghosh"],["c","Bal Gangadhar Tilak"],["d","Subhas Chandra Bose"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"The slogan, “Swaraj is my birthright, and I shall have it,” associated with Bal Gangadhar Tilak, has been a subject of considerable disagreement among scholars regarding when Tilak first used it. In fact, the idea of this slogan began to take shape in the 1890s. Scholars believe that Tilak’ s close associate, Joseph “Kaka” Baptista, first coined this sentence. It is believed that Baptista probably composed this line in Marathi—“Swarajya ha maza janmasiddha hakk ahe, ani to mi milavnarach”—and Tilak adopted it and carried it to the masses. On the basis of available evidence, it can be said that Tilak used this slogan from public platforms during the Home Rule Movement in April–May 1916. Some sources emphasize that Tilak used this slogan at the Lucknow session of the Congress in 1916, but sufficient historical evidence in support of this is not available.","b":false},{"id":224,"c":12,"q":"“Swaraj is my birthright and I will have it.” This statement is concerned with-","o":[["a","Lala Lajpat Rai"],["b","Mahatma Gandhi"],["c","Bal Gangadhar Tilak"],["d","Subhash Chandra Bose"]],"a":"c","s":"42nd B.P.S.C. (Pre) 1997 · 46th B.P.S.C. (Pre) 2004","y":2004,"e":"The slogan, “Swaraj is my birthright, and I shall have it,” associated with Bal Gangadhar Tilak, has been a subject of considerable disagreement among scholars regarding when Tilak first used it. In fact, the idea of this slogan began to take shape in the 1890s. Scholars believe that Tilak’ s close associate, Joseph “Kaka” Baptista, first coined this sentence. It is believed that Baptista probably composed this line in Marathi—“Swarajya ha maza janmasiddha hakk ahe, ani to mi milavnarach”—and Tilak adopted it and carried it to the masses. On the basis of available evidence, it can be said that Tilak used this slogan from public platforms during the Home Rule Movement in April–May 1916. Some sources emphasize that Tilak used this slogan at the Lucknow session of the Congress in 1916, but sufficient historical evidence in support of this is not available.","b":true},{"id":225,"c":12,"q":"Who said, “Swaraj is my birthright, I will have it”?","o":[["a","M.K. Gandhi"],["b","Jawaharlal Nehru"],["c","Bal Gangadhar Tilak"],["d","Bhagat Singh"]],"a":"c","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"The slogan, “Swaraj is my birthright, and I shall have it,” associated with Bal Gangadhar Tilak, has been a subject of considerable disagreement among scholars regarding when Tilak first used it. In fact, the idea of this slogan began to take shape in the 1890s. Scholars believe that Tilak’ s close associate, Joseph “Kaka” Baptista, first coined this sentence. It is believed that Baptista probably composed this line in Marathi—“Swarajya ha maza janmasiddha hakk ahe, ani to mi milavnarach”—and Tilak adopted it and carried it to the masses. On the basis of available evidence, it can be said that Tilak used this slogan from public platforms during the Home Rule Movement in April–May 1916. Some sources emphasize that Tilak used this slogan at the Lucknow session of the Congress in 1916, but sufficient historical evidence in support of this is not available.","b":true},{"id":226,"c":12,"q":"'\"Swaraj is my birthright, and I shall have it\" — this slogan was given by.'","o":[["a","Lala Lajpat Rai"],["b","Mahatma Gandhi"],["c","Bal Gangadhar Tilak"],["d","Jawaharlal Nehru"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The slogan, “Swaraj is my birthright, and I shall have it,” associated with Bal Gangadhar Tilak, has been a subject of considerable disagreement among scholars regarding when Tilak first used it. In fact, the idea of this slogan began to take shape in the 1890s. Scholars believe that Tilak’ s close associate, Joseph “Kaka” Baptista, first coined this sentence. It is believed that Baptista probably composed this line in Marathi—“Swarajya ha maza janmasiddha hakk ahe, ani to mi milavnarach”—and Tilak adopted it and carried it to the masses. On the basis of available evidence, it can be said that Tilak used this slogan from public platforms during the Home Rule Movement in April–May 1916. Some sources emphasize that Tilak used this slogan at the Lucknow session of the Congress in 1916, but sufficient historical evidence in support of this is not available.","b":true},{"id":227,"c":12,"q":"In 1908, Bal Gangadhar Tilak was imprisoned for –","o":[["a","5 years"],["b","6 years"],["c","7 years"],["d","8 years"]],"a":"b","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"In 1908, on the basis of articles published in ‘Kesari’, Tilak was tried for sedition and was sentenced to 6 years of transportation/exile along with a fine of Rs. 1000, and he was sent to Mandalay Jail (Myanmar).","b":false},{"id":228,"c":12,"q":"The protest method of moderate leaders of the Congress was?","o":[["a","Non-Co-operation"],["b","Constitutional agitation"],["c","Passive resistance"],["d","Civil disobedience"]],"a":"b","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"The chief method of agitation of the moderate leaders of the Congress was constitutional agitation, i.e., demanding Indians’ participation in administration and creating political awareness among the people.","b":false},{"id":229,"c":12,"q":"Who is popularly known as ‘Sher-e-Punjab’?","o":[["a","Rajguru"],["b","Bhagat Singh"],["c","Lala Lajpat Rai"],["d","Udham Singh"]],"a":"c","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"Lala Lajpat Rai was also known as “Sher-e-Punjab.” He was a leader of the extremist faction in the Indian National Congress and a representative of the whole of Punjab. He is also called “Punjab Kesari.” While leading a procession in protest against the Simon Commission, Lala Ji was injured due to lathi blows; as a result, he passed away on 17 November 1928.","b":false},{"id":230,"c":13,"q":"In which year was V.D. Savarkar elected the President of the Hindu Mahasabha?","o":[["a","1938"],["b","1916"],["c","1935"],["d","1919"],["e","None of the above/More than one of the above"]],"a":"e","s":"B.P.S.C. CDPO (Pre) 2018","y":2018,"e":"V.D. Savarkar was the President of the Hindu Mahasabha from 1937 to 1943. V.D. Savarkar founded an organisation named Abhinav Bharat.","b":false},{"id":231,"c":13,"q":"Who founded the ‘‘Revolutionary Society’’ in 1904, which aimed at armed revolution against British rule?","o":[["a","Lala Har Dayal"],["b","Vinayak Damodar Savarkar"],["c","Bipin Chandra Pal"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. (T.R.E.-3) July, 2024","y":2024,"e":"In 1904, the Abhinav Bharat Society (Young India Society), established by Vinayak Damodar Savarkar and his other associates, functioned as a revolutionary society. Its objective was to carry out an armed revolution against British rule.","b":false},{"id":232,"c":13,"q":"Who is associated with ‘Abhinav Bharat’?","o":[["a","V.D. Savarkar"],["b","C.R. Das"],["c","B.G. Tilak"],["d","S.C. Bose"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"In 1904, the Abhinav Bharat Society (Young India Society), established by Vinayak Damodar Savarkar and his other associates, functioned as a revolutionary society. Its objective was to carry out an armed revolution against British rule.","b":true},{"id":233,"c":13,"q":"Who organized a secret society called'Abhinav Bharat' in India to confront the British?","o":[["a","Mangal Pandey"],["b","Bhagat Singh"],["c","V.D. Savarkar"],["d","Khudiram Bose"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"In 1904, the Abhinav Bharat Society (Young India Society), established by Vinayak Damodar Savarkar and his other associates, functioned as a revolutionary society. Its objective was to carry out an armed revolution against British rule.","b":true},{"id":234,"c":13,"q":"Which of the following was not related to the Kakori incident?","o":[["a","Ram Prasad Bismil"],["b","Surya Sen"],["c","Rajendra Lahiri"],["d","Ash faq ullah B.P.C.S. (Pre) 2016"]],"a":"b","s":"B.P.S.C. (Pre)","y":null,"e":"Surya Sen was not related to the Kakori incident (Kakori Train Action). Among the given options, all the other persons were related to the Kakori incident.","b":false},{"id":235,"c":13,"q":"Who started the HindustaniS eva Dalinthe mid-1920s?","o":[["a","Jawaharlal Nehru"],["b","Subhas Chandra Bose"],["c","N.S. Hardikar"],["d","N.G. Ranga"],["e","None of the above"]],"a":"c","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The Hindustani Seva Dal (Mandal) was started by freedom fighter and Congress leader Dr. N.S. Hardikar. This organisation worked under the Indian National Congress, and its members are known for wearing the Gandhi cap. This organisation was founded in 1923.","b":false},{"id":236,"c":13,"q":"The reason for the revival of revolutionary methods in Indian politics during the period of 1923-28 was -","o":[["a","Har Dayal and Lajpat Rai, such as the growing influence of leaders"],["b","Gandhiji Suspends the non-cooperation movements"],["c","Influence of foreign events"],["d","The demands of the Indians by the British To be rejected"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"After 1922, with the suspension of the Non-Cooperation Movement and the absence of any political activity in the country, many capable nationalist youths became disillusioned. They were also dissatisfied with Gandhi’ s leadership and the politics of non-violent struggle. Inspired by revolutionary movements and rebellions in Russia, China, Ireland, Turkey, Egypt, etc., they sought to overthrow British rule through violent means. Therefore, this period is regarded as the phase of revival of revolutionary methods in Indian politics.","b":false},{"id":237,"c":13,"q":"Which year was the ‘Hindustan Republican Association’ set up –","o":[["a","1920"],["b","1924"],["c","1928"],["d","1930"]],"a":"b","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"In October, 1924, Sachindranath Sanyal, Ram Prasad Bismil and others founded the revolutionary organisation ‘Hindustan Republican Association’ at Kanpur. On 9 August, 1925, this organisation looted the government treasury by carrying out a dacoity on the “8 Down Saharanpur–Lucknow Passenger Train” at a place called Kakori on the Lucknow–Saharanpur Division of the Northern Railway. This incident became famous as the Kakori Case (present name—Kakori Train Action). In this case, 43 revolutionaries were arrested, including Ram Prasad Bismil, Ash faq ullah Khan, Roshan Singh and Rajendra Lahiri, who were hanged, while Chandrashekhar Azad escaped.","b":false},{"id":238,"c":13,"q":"Which revolutionaries were hanged in the 'Kakori Train Robbery Case'?","o":[["a","Ram Prasad Bismil and Ashfaquallah."],["b","Veer Savarkar and Vasudev Chapekar"],["c","Prafulla Chandra Chaki and Khudiram Bose"],["d","Surya Sen and Udham Singh"],["e","None of the above/More than one of the above"]],"a":"a","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"In October, 1924, Sachindranath Sanyal, Ram Prasad Bismil and others founded the revolutionary organisation ‘Hindustan Republican Association’ at Kanpur. On 9 August, 1925, this organisation looted the government treasury by carrying out a dacoity on the “8 Down Saharanpur–Lucknow Passenger Train” at a place called Kakori on the Lucknow–Saharanpur Division of the Northern Railway. This incident became famous as the Kakori Case (present name—Kakori Train Action). In this case, 43 revolutionaries were arrested, including Ram Prasad Bismil, Ash faq ullah Khan, Roshan Singh and Rajendra Lahiri, who were hanged, while Chandrashekhar Azad escaped.","b":true},{"id":239,"c":13,"q":"One of the founder leaders of the Hindustan Socialist Republican Army was-","o":[["a","B.R. Ambedkar"],["b","Bhagat Singh"],["c","Subhas Chandra Bose"],["d","Jayap Prakash Narayan"]],"a":"b","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"After the Kakori Case (Kakori Train Action), due to the repression launched by the police, the Hindustan Republican Association (H.R.A.) suffered a severe setback. However, later, Bijoy/Vijay Kumar Sinha, Shiv Verma, Jaidev Kapoor, Bhagat Singh, Bhagwati Charan Vohra and Sukhdev began the work of reorganising the H.R.A. under the leadership of Chandrashekhar Azad. In September, 1928, a meeting was held at the Feroz Shah Kotla Ground (Delhi) under the leadership of Chandrashekhar Azad, in which the name of the H.R.A. was changed to ‘Hindustan Socialist Republican Association’ (H.S.R.A.).","b":false},{"id":240,"c":13,"q":"Who penned the following lines? “Sarfaroshi ki tam anna ab hamare dil me in hai Dekhna hai zor kitna bazu-e-qatil me hai”.","o":[["a","Bismil"],["b","Rajguru"],["c","Bhagat Singh"],["d","Azad"]],"a":"a","s":"56th to 59th B.P.S.C. (Pre) 2015","y":2015,"e":"These lines of the ghazal were written by the poet Bismil Azimabadi. Bismil Azimabadi’ s real name was Syed Shah Mohammad Hasan. He was born in 1901 in Hardas Bigaha village, Patna. This ghazal was written in Urdu and was published in 1921 in Qazi Abdul Ghaffar’ s magazine ‘Sabah’.","b":false},{"id":241,"c":13,"q":"Who is the author of the popular song, Sarfaroshi Ki Tamanna Ab Hamare Dil Mein Hai?","o":[["a","Surya Sen"],["b","Chandra Shekhar Azad"],["c","Sardar Bhagat Singh"],["d","Ram Prasad Bismil"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"These lines of the ghazal were written by the poet Bismil Azimabadi. Bismil Azimabadi’ s real name was Syed Shah Mohammad Hasan. He was born in 1901 in Hardas Bigaha village, Patna. This ghazal was written in Urdu and was published in 1921 in Qazi Abdul Ghaffar’ s magazine ‘Sabah’.","b":true},{"id":242,"c":13,"q":"Who gave the ‘Inquilab Zindabad's logan?","o":[["a","Iqbal"],["b","M.K. Gandhi"],["c","Bhagat Singh"],["d","S.C. Bose"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"The famous slogan ‘Inquilab Zindabad’ was given by Hasrat Mohani. Hasrat Mohani was a freedom fighter and a renowned poet of the Urdu language, whereas Bhagat Singh made it popular. Therefore, as the nearest answer, option (c) can be chosen.","b":false},{"id":243,"c":13,"q":"Who gave the famous slogan 'Inquilab Zindabad'?","o":[["a","Hakim Ajmal Khan"],["b","Chandrasekhar Azad"],["c","Hasrat Mohani"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. School Teacher · Headmaster 09.12.2023","y":2023,"e":"The famous slogan ‘Inquilab Zindabad’ was given by Hasrat Mohani. Hasrat Mohani was a freedom fighter and a renowned poet of the Urdu language, whereas Bhagat Singh made it popular. Therefore, as the nearest answer, option (c) can be chosen.","b":true},{"id":244,"c":13,"q":"Bhagat Singh,Rajguru,and Sukhdev were executed on–","o":[["a","23 March, 1931"],["b","23 March, 1932"],["c","23 March, 1933"],["d","23 March, 1934"]],"a":"a","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Two members of the Hindustan Socialist Republican Association (H.S.R.A.), Bhagat Singh and Batukeshwar Dutt, threw bombs in the Central Legislative Assembly on 8 April, 1929. Both were arrested and tried under the Central Assembly Bomb Case. Later, other members of the H.S.R.A. were also arrested, and the revolutionaries were tried under the Lahore Conspiracy Case. In 1930, the judgment in the Lahore Conspiracy Case was delivered, in which Bhagat Singh, Rajguru and Sukhdev were sentenced to death. On 23 March, 1931, all three were hanged. The news of their execution plunged the entire country into deep mourning.","b":false},{"id":245,"c":13,"q":"On which date, Sukhdev, Bhagat Singh and Rajguru were hanged?","o":[["a","12th November, 1930"],["b","23rd March, 1931"],["c","7 th September, 1931"],["d","4th March, 1931"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Re-Exam) (Pre)-2021","y":2021,"e":"Two members of the Hindustan Socialist Republican Association (H.S.R.A.), Bhagat Singh and Batukeshwar Dutt, threw bombs in the Central Legislative Assembly on 8 April, 1929. Both were arrested and tried under the Central Assembly Bomb Case. Later, other members of the H.S.R.A. were also arrested, and the revolutionaries were tried under the Lahore Conspiracy Case. In 1930, the judgment in the Lahore Conspiracy Case was delivered, in which Bhagat Singh, Rajguru and Sukhdev were sentenced to death. On 23 March, 1931, all three were hanged. The news of their execution plunged the entire country into deep mourning.","b":true},{"id":246,"c":13,"q":"How old was Bhagat Singh when he threw a bomb in the assembly in protest against the government?","o":[["a","21 years"],["b","A little more than 21 years"],["c","25 years"],["d","A little more than 25 years"],["e","None of the above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Bhagat Singh was a prominent revolutionary freedom fighter of India. He was born on 28 September, 1907. Bhagat Singh and Batukeshwar Dutt threw a bomb in the Central Legislative Assembly on 8 April, 1929. Therefore, at the time of this incident, Bhagat Singh’ s age was 21 years (21 years, 6 months, 11 days). Bhagat Singh was hanged on 23 March, 1931.","b":false},{"id":247,"c":13,"q":"Who threw harmless bombs in the Central Legislative Assembly?","o":[["a","Jatin Das"],["b","Chandrasekhar Azad"],["c","Batukeshwar Dutt"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"Bhagat Singh was a prominent revolutionary freedom fighter of India. He was born on 28 September, 1907. Bhagat Singh and Batukeshwar Dutt threw a bomb in the Central Legislative Assembly on 8 April, 1929. Therefore, at the time of this incident, Bhagat Singh’ s age was 21 years (21 years, 6 months, 11 days). Bhagat Singh was hanged on 23 March, 1931.","b":true},{"id":248,"c":13,"q":"The ‘Anushilan Samiti’ was –","o":[["a","Dedicated to the upliftment of women"],["b","Promoting widow remarriage"],["c","Interested in labour welfare"],["d","A revolutionary organization"]],"a":"d","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Anushilan Samiti was a revolutionary organization.","b":false},{"id":249,"c":13,"q":"The Chittagong Armoury Raid had been planned by:","o":[["a","Surya Sen"],["b","Chandan Dutta"],["c","Vidhan Ghosh"],["d","Jatin Das"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Pre) 2021 · 60th to 62nd B.P.S.C. (Pre) 2016","y":2021,"e":"The Chittagong Armoury Raid was organized by the revolutionary Surya Sen, popularly known as “Master Da”. Surya Sen founded the Indian Republican Army (I.R.A.) in Bengal. Its prominent members included Ananta Singh, Ambika Chak rav arty, Lokinath, Pritilata Waddedar, Ganesh Ghosh, Kalpana Dutt, and Anand Gupta. On 18 April, 1930, Surya Sen declared war against the British. Under his leadership, I.R.A. members attacked the Chittagong armoury and seized weapons. On 22 May, 1930, a clash took place between the I.R.A. members and the army, in which 80 soldiers and 12 revolutionaries were killed. Surya Sen was arrested on 16 February, 1933. He was tried and was hanged on 12 January, 1934.","b":false},{"id":250,"c":13,"q":"Who is related to the 'Chittagong Armoury Raid'?","o":[["a","Rashbehari Bose"],["b","Chandrasekhar Azad"],["c","Batukeshwar Dutt"],["d","Surya Sen"],["e","None of the above"]],"a":"d","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"The Chittagong Armoury Raid was organized by the revolutionary Surya Sen, popularly known as “Master Da”. Surya Sen founded the Indian Republican Army (I.R.A.) in Bengal. Its prominent members included Ananta Singh, Ambika Chak rav arty, Lokinath, Pritilata Waddedar, Ganesh Ghosh, Kalpana Dutt, and Anand Gupta. On 18 April, 1930, Surya Sen declared war against the British. Under his leadership, I.R.A. members attacked the Chittagong armoury and seized weapons. On 22 May, 1930, a clash took place between the I.R.A. members and the army, in which 80 soldiers and 12 revolutionaries were killed. Surya Sen was arrested on 16 February, 1933. He was tried and was hanged on 12 January, 1934.","b":true},{"id":251,"c":14,"q":"Who was the founder of the 'India House'in London?","o":[["a","Shyamji Krishna Varma"],["b","Rashbehari Bose"],["c","Ramchandra"],["d","Taraknath Das"],["e","None of the above/More than one of the above"]],"a":"a","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"In February 1905, Shyamji Krishna Varma founded the Indian Home Rule Society in London. He also established ‘India House’. From here, the newspaper ‘The Indian Sociologist’ also began publication. As the government machinery became especially active in London, Shyamji left for Paris and finally moved to Geneva.","b":false},{"id":252,"c":14,"q":"Who founded Abhinav Bharat Society in 1906 in London?","o":[["a","Vinayak Damodar Savarkar"],["b","Shyamji Krishna Varma"],["c","Sohan Singh"],["d","P.N. Bapat"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"After reaching London in 1906, Vinayak Damodar Savarkar established a branch of the Abhinav Bharat Society and, as a prototype of the Abhinav Bharat Society, formed the ‘Free India Society’ in 1906, so that youths coming to London from different parts of India could be brought together as an organized force. The youths associated with the ‘Free India Society’ were closely observed, and only thereafter were they given a place in the central group of Abhinav Bharat.","b":false},{"id":253,"c":14,"q":"Who wasthe founder of 'Abhinav Bharat'in London?","o":[["a","Vinayak Damodar Savarkar"],["b","P. M. Bapat"],["c","Shyamji Krishna Varma"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (11th-12th) 26.08.2023","y":2023,"e":"After reaching London in 1906, Vinayak Damodar Savarkar established a branch of the Abhinav Bharat Society and, as a prototype of the Abhinav Bharat Society, formed the ‘Free India Society’ in 1906, so that youths coming to London from different parts of India could be brought together as an organized force. The youths associated with the ‘Free India Society’ were closely observed, and only thereafter were they given a place in the central group of Abhinav Bharat.","b":true},{"id":254,"c":14,"q":"Who is regarded as the “Mother of Indian Revolution”:","o":[["a","Annie Besant"],["b","Madam Sarojini Naidu"],["c","Ramabai"],["d","Madam Bhikaji Rustam Cama"]],"a":"d","s":"60th to 62ndB.P.S.C. (Pre) 2016","y":2016,"e":"Madam Cama was born on 24 September 1861. Her parents were Parsis. Sorabji Framji Patel was her father. She married Rustam K. R. Cama, who was a lawyer and a social worker. Madam Cama served as the private secretary to Dadabhai Naoroji, a great pioneer leader of India’ s national movement. Later, after coming in contact with some patriotic students and European intellectuals, she joined the freedom movement. She participated in the International Socialist Conference held at Stuttgart, Germany, on 22 August 1907. In this very conference, she unfurled the Indian tricolour flag. She was the first person to hoist the Indian flag on foreign soil or on an international platform. The flag hoisted there was a modified form of the Calcutta Flag. She is called the ‘Mother of the Indian Revolution’.","b":false},{"id":255,"c":14,"q":"Where did Madam Cama hoist the tricolour flag of India's independence?","o":[["a","Paris"],["b","London"],["c","Stuttgart"],["d","Geneva"],["e","None of the above"]],"a":"c","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"Madam Cama was born on 24 September 1861. Her parents were Parsis. Sorabji Framji Patel was her father. She married Rustam K. R. Cama, who was a lawyer and a social worker. Madam Cama served as the private secretary to Dadabhai Naoroji, a great pioneer leader of India’ s national movement. Later, after coming in contact with some patriotic students and European intellectuals, she joined the freedom movement. She participated in the International Socialist Conference held at Stuttgart, Germany, on 22 August 1907. In this very conference, she unfurled the Indian tricolour flag. She was the first person to hoist the Indian flag on foreign soil or on an international platform. The flag hoisted there was a modified form of the Calcutta Flag. She is called the ‘Mother of the Indian Revolution’.","b":true},{"id":256,"c":14,"q":"Where did Madam Cama hoist the first tricolour flag in 1907?","o":[["a","London"],["b","Paris"],["c","Moscow"],["d","Stuttgart"]],"a":"d","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"Madam Cama was born on 24 September 1861. Her parents were Parsis. Sorabji Framji Patel was her father. She married Rustam K. R. Cama, who was a lawyer and a social worker. Madam Cama served as the private secretary to Dadabhai Naoroji, a great pioneer leader of India’ s national movement. Later, after coming in contact with some patriotic students and European intellectuals, she joined the freedom movement. She participated in the International Socialist Conference held at Stuttgart, Germany, on 22 August 1907. In this very conference, she unfurled the Indian tricolour flag. She was the first person to hoist the Indian flag on foreign soil or on an international platform. The flag hoisted there was a modified form of the Calcutta Flag. She is called the ‘Mother of the Indian Revolution’.","b":true},{"id":257,"c":14,"q":"Who was given life punishment for the murder of Curzon Wyllie?","o":[["a","Madan Lal Dhingra"],["b","Udham Singh"],["c","Bhagat Singh"],["d","Man math a nath"],["e","None of the above/More than one of the above"]],"a":"a","s":"63rd B.P.S.C (Pre) 2017","y":2017,"e":"Curzon Wyllie was shot dead in London on 1 July 1909 by Madan Lal Dhingra. Curzon Wyllie served as the Political Aide-de-Camp to the Secretary of State for India. Madan Lal Dhingra was hanged on 17 August 1909.","b":false},{"id":258,"c":14,"q":"Who got an opportunity tóbecome Professor of Indian Philosophy in the University of California in 1911?","o":[["a","Virendranath Chattopadhyay"],["b","Sohan Singh Bhakna"],["c","Har Dayal"],["d","Shyamji Krishna Varma"]],"a":"c","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"Lala Har Dayal was an Indian revolutionary and a scholar. In 1911, he got the opportunity to become Professor of Indian Philosophy at the University of California, USA.","b":false},{"id":259,"c":14,"q":"Ghadar Party was established in the year:","o":[["a","1907"],["b","1913"],["c","1917"],["d","1920"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"In 1913, under the leadership of Sohan Singh Bhakna, an organization named the “Pacific Coast Hindustan Association” was established at Portland (Oregon), USA. Its headquarters were in San Francisco. This organization started publishing a newspaper named “Ghadar”, due to which the organization also came to be known as the Ghadar Party. Lala Har Dayal was the chief ideo logue and guiding force of this organization. Its other members included—Ram Chandra, Barkatullah, Rash Behari Bose, Bhai Parmanand, etc.","b":false},{"id":260,"c":14,"q":"Who was the leader of the Ghadar Movement, a revolutionary movement aimed at overthrowing British rule in India?","o":[["a","Lala Lajpat Rai"],["b","Kartar Singh Sarabha"],["c","Bhagat Singh"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"In 1913, under the leadership of Sohan Singh Bhakna, an organization named the “Pacific Coast Hindustan Association” was established at Portland (Oregon), USA. Its headquarters were in San Francisco. This organization started publishing a newspaper named “Ghadar”, due to which the organization also came to be known as the Ghadar Party. Lala Har Dayal was the chief ideo logue and guiding force of this organization. Its other members included—Ram Chandra, Barkatullah, Rash Behari Bose, Bhai Parmanand, etc.","b":true},{"id":261,"c":14,"q":"Where was the Ghadar Party founded?","o":[["a","France"],["b","Germany"],["c","United States of America"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. Teacher (11th-12th) 26.08.2023","y":2023,"e":"In 1913, under the leadership of Sohan Singh Bhakna, an organization named the “Pacific Coast Hindustan Association” was established at Portland (Oregon), USA. Its headquarters were in San Francisco. This organization started publishing a newspaper named “Ghadar”, due to which the organization also came to be known as the Ghadar Party. Lala Har Dayal was the chief ideo logue and guiding force of this organization. Its other members included—Ram Chandra, Barkatullah, Rash Behari Bose, Bhai Parmanand, etc.","b":true},{"id":262,"c":14,"q":"Where was the Ghadar Party established?","o":[["a","Germany"],["b","United States of America"],["c","France"],["d","England"],["e","None of the above / More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"In 1913, under the leadership of Sohan Singh Bhakna, an organization named the “Pacific Coast Hindustan Association” was established at Portland (Oregon), USA. Its headquarters were in San Francisco. This organization started publishing a newspaper named “Ghadar”, due to which the organization also came to be known as the Ghadar Party. Lala Har Dayal was the chief ideo logue and guiding force of this organization. Its other members included—Ram Chandra, Barkatullah, Rash Behari Bose, Bhai Parmanand, etc.","b":true},{"id":263,"c":14,"q":"Theperson(s) associated with the 'Zimmermann Plan' was/were:","o":[["a","Lala Har Dayal"],["b","Bhupendranath Dutt"],["c","Virendranath Chattopadhyay"],["d","All of the above"],["e","None of the above"]],"a":"d","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"During the First World War, Indian revolutionaries made a plan to procure arms and ammunition from Germany with the help of Indians living abroad. This came to be known as the “Hindu–German Conspiracy”, also referred to as the “Zimmermann Plan”. Lala Har Dayal, Bhupendranath Dutt, and Virendranath Chattopadhyay were connected with this plan. With German support, they established the “Berlin Committee / Berlin India Committee” in 1914. In 1915, this organization came to be known as the “Indian Independence Committee”.","b":false},{"id":264,"c":14,"q":"What was the cause of the outbreak of Ghadar Revolution–","o":[["a","Arrest of Lala Har Dayal"],["b","Kom agata maru incident"],["c","Beginning of first World War"],["d","Hanging of Kartar Singh Sarabha"]],"a":"c","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"With the decline of the Swadeshi Movement, revolutionary activities also weakened for some time. Then, in 1914, the sudden outbreak of the First World War created a situation that the revolutionaries considered favourable for action. In North America, the Ghadar revolutionaries, and in India, leaders like Lokmanya Tilak and Annie Besant, and organizations like the Home Rule League tried to take advantage of this situation. The Ghadar revolutionaries attempted to overthrow British rule through armed struggle.","b":false},{"id":265,"c":14,"q":"Interim government under the leadership of Raja Mahendra Pratap Singh was founded in Kabul with the support of Germany during the:","o":[["a","Ghadar Movement"],["b","Swadeshi Movement"],["c","Second World War"],["d","Home Rule Movement"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"Raja Mahendra Pratap, along with his associate Barkatullah, formed India’ s first provisional government in Kabul (Afghanistan) in 1915 during the First World War. In this government, Raja Mahendra Pratap himself was the President and Barkatullah was the Prime Minister. It was also recognized by Germany.","b":false},{"id":266,"c":14,"q":"Sardar Udham Singh killed whom?","o":[["a","General Dyer"],["b","Curzon Wyllie"],["c","Michael O'Dwyer"],["d","Saunders"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th B.P.S.C. (Re-Exam) (Pre) 2022","y":2022,"e":"Sardar Udham Singh killed Michael O’ Dwyer (Dyer). Udham Singh assassinated Sir Michael O’ Dwyer, the Lieutenant Governor held indirectly responsible for the Jallianwala Bagh massacre, in London in March 1940.","b":false},{"id":267,"c":14,"q":"Sir Michael O'Dwyer was shot dead on 13th March, 1940 in London by:","o":[["a","Madan Lal Dhingra"],["b","M.P.T. Acharya"],["c","V.D. Savarkar"],["d","Udham Singh"],["e","None of the above/More than one of the above"]],"a":"d","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"Sardar Udham Singh killed Michael O’ Dwyer (Dyer). Udham Singh assassinated Sir Michael O’ Dwyer, the Lieutenant Governor held indirectly responsible for the Jallianwala Bagh massacre, in London in March 1940.","b":true},{"id":268,"c":14,"q":"Who from the following killed Michael O'Dwyer responsible for Jallianwala Bagh massacre?","o":[["a","Prithvi Singh Azad"],["b","Sardar Kishan Singh"],["c","Udham Singh"],["d","Sohan Singh Josh"]],"a":"c","s":"45th B.P.S.C. (Pre) 2000","y":2000,"e":"Sardar Udham Singh killed Michael O’ Dwyer (Dyer). Udham Singh assassinated Sir Michael O’ Dwyer, the Lieutenant Governor held indirectly responsible for the Jallianwala Bagh massacre, in London in March 1940.","b":true},{"id":269,"c":15,"q":"Who said about the Bengal Partition, \"The partition announcement fell like a bombshell\"?","o":[["a","Surendra Nath Banerjee"],["b","Gopal Krishna Gokhale"],["c","Bipin Chandra Pal"],["d","Chittaranjan Das"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Re-Exam) (Pre)2022","y":2022,"e":"Regarding the Partition of Bengal, Surendranath Banerjee said, “The announcement of partition fell like a bombshell.” The Partition of Bengal took place during the tenure of Lord Curzon.","b":false},{"id":270,"c":15,"q":"The Declaration of Partition of Bengal was done on -:","o":[["a","19th July, 1905"],["b","7 th August, 1905"],["c","15th August, 1905"],["d","16th October, 1905"],["e","None of the above/More than one of the above"]],"a":"a","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"The outline of the Partition of Bengal was presented in a famous “Risley Circular” sent by the Home Secretary of the Government of India, H.H. Risley, to the Bengal Government on 3 December 1903. Its formal announcement was made on 19 July 1905. Its objective was to divide the growing “nationalism” in the Bengal Presidency. The Partition of Bengal came into effect on 16 October 1905. On this day, Rabindranath Tagore advised that it be celebrated as “Raksha Bandhan”.","b":false},{"id":271,"c":15,"q":"The partition of Bengal came into effect on -","o":[["a","October 14, 1905"],["b","October 15, 1905"],["c","October 16, 1905"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. Teacher (11th-12th) 15-12-2023","y":2023,"e":"The outline of the Partition of Bengal was presented in a famous “Risley Circular” sent by the Home Secretary of the Government of India, H.H. Risley, to the Bengal Government on 3 December 1903. Its formal announcement was made on 19 July 1905. Its objective was to divide the growing “nationalism” in the Bengal Presidency. The Partition of Bengal came into effect on 16 October 1905. On this day, Rabindranath Tagore advised that it be celebrated as “Raksha Bandhan”.","b":true},{"id":272,"c":15,"q":"Which movement was started as a reaction to the Partition of Bengal?","o":[["a","Non-Cooperation Movement"],["b","Civil Disobedience Movement"],["c","Swadeshi Movement"],["d","Purna Swaraj Movement"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"The Viceroy of India, Lord Curzon, announced the Partition of Bengal on 19 July 1905 (some sources also mention 20 July 1905). In protest against this announcement, a historic meeting was held at the Calcutta Town Hall, where the formal declaration was made of the Swadeshi Movement. When the Partition of Bengal was implemented in October 1905, that day was observed as a “Day of Mourning”. On the suggestion of Rabindranath Tagore, it was also observed as “Rakhi Day”. Nationalists observed this day to demonstrate the unbroken unity of Bengal. On the lines of Tagore’ s Shanti nike tan, the Bengal National College was established. Very soon, many national schools were set up across the country. In March 1906, the National Council of Education was formed. The Swadeshi Movement raised the slogan of self-reliance and self-power. The question of self-support and self-reliance was linked with national self-respect, honour, and self-confidence. The Congress, in its Calcutta Session (1906), also passed four resolutions related to the Swadeshi Movement, the Boycott Movement, National Education, and Self-government. Thus, it is clear that in opposition to the Partition of Bengal, nationalists launched movements such as Swadeshi, Boycott, National Education, and Self-government.","b":false},{"id":273,"c":15,"q":"During which period did the Swadeshi Movement take place in India?","o":[["a","Gandhi’ s Champaran Satyagraha"],["b","Movement against the Partition of Bengal"],["c","Movement against the Rowlatt Act"],["d","Non-Cooperation Movement"],["e","None of the above / More than one of the above"]],"a":"b","s":"63rd B.P.S.C.(Pre) 2017","y":2017,"e":"The Viceroy of India, Lord Curzon, announced the Partition of Bengal on 19 July 1905 (some sources also mention 20 July 1905). In protest against this announcement, a historic meeting was held at the Calcutta Town Hall, where the formal declaration was made of the Swadeshi Movement. When the Partition of Bengal was implemented in October 1905, that day was observed as a “Day of Mourning”. On the suggestion of Rabindranath Tagore, it was also observed as “Rakhi Day”. Nationalists observed this day to demonstrate the unbroken unity of Bengal. On the lines of Tagore’ s Shanti nike tan, the Bengal National College was established. Very soon, many
