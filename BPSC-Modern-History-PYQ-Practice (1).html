es various aspects of the Partition of India.","b":true},{"id":594,"c":50,"q":"Who founded the newspaper ‘‘The Hindu’’ in 1878, which became influential in shaping public opinion during the Indian national movement?","o":[["a","Vir arag hava char iar"],["b","G. Subramania Iyer"],["c","Mahatma Gandhi"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"BPSC (Tre-3) July, 2024","y":2024,"e":"‘The Hindu’ was founded in 1878 at Madras by six young nationalists under the leadership of G. Subramania Iyer. It started as a weekly in 1878 and was converted into a daily in 1889.","b":false},{"id":595,"c":50,"q":"Match the names mentioned in column I with the names mentioned in column II and select the right Column I Column II (Books) (Authors)","o":[["a","1 4 6 3 2"],["b","2 4 3 2 1"],["c","1 5 6 3 2"],["d","None of these"]],"a":"c","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"‘History of the Freedom Movement in India’ is a history of India’ s freedom struggle written by Tara Chand. ‘Anand Math’ was written by Bankim Chandra Chatterjee; its theme is based on the Sannyasi Rebellion (1763–1800). ‘Precepts of Jesus’ is a work of Raja Rammohan Roy, ‘Indian Musalmans’ was written by W. W. Hunter, and K. K. Dutta wrote ‘History of the Freedom Movement in Bihar’.","b":false,"L":["A. History of the Freedom 1. Tara Chand Movement in India","B. History of the Freedom 2. W.W. Hunter Movement in Bihar","C. Anand Math 3. Raja Ram Mohan Roy","D. Precepts of Jesus 4. Father Bulke","E. Indian Musalmans 5. K.K. Dutta","6. Bankim Chandra Chatterjee"],"n":"answer using the codes given below:"},{"id":596,"c":50,"q":"Who was the author of ‘Indian Unrest’?","o":[["a","Dadabhai Naoroji"],["b","Annie Besant"],["c","Lala Lajpat Rai"],["d","Valentine Chirol"]],"a":"d","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"The author of Indian Unrest was Valentine Chirol. He also called Bal Gangadhar Tilak “the father of unrest in India”. As a result, Tilak filed a defamation suit against him.","b":false},{"id":597,"c":50,"q":"The novel ‘Durgesh Nandini’ is written by:","o":[["a","Rabindranath Tagore"],["b","Taraknath Gang opa dhy aya"],["c","Swarna Kumari"],["d","Bankim Chandra Chatterjee"]],"a":"d","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"Durgesh Nandini was written by Bankim Chandra Chatterjee. It was published in 1865. He also wrote novels like Anandamath, Rajsingha, and Bis hab rik sha, giving Bengali literature a new direction. Durgesh Nandini was Bankim Chandra’ s first novel published in the Bengali language.","b":false},{"id":598,"c":50,"q":"Who wrote ‘Jhanda Geet’?","o":[["a","Rabindranath Tagore"],["b","Bankim Chandra Chatterjee"],["c","Maithili Sharan Gupta"],["d","Shyamlal Parshad"]],"a":"d","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"The credit for writing the Jhanda Geet goes to Shyamlal Gupta ‘Parshad’.","b":false},{"id":599,"c":50,"q":"The composer of the song ‘Vande Mataram’ was—","o":[["a","Bankim Chandra Chatterjee"],["b","Sarojini Naidu"],["c","Rabindranath Tagore"],["d","Jai shankar Prasad"]],"a":"a","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"The composer of Vande Mataram was the famous Bengali writer Bankim Chandra Chatterjee. The song was later published in the book Anandamath, which was written against the backdrop of the Sannyasi Revolt. It was sung for the first time at the Calcutta session of the Indian National Congress in 1896.","b":false},{"id":600,"c":50,"q":"'Vande Mataram' was apart of which novel by Bankim Chandra Chatterjee that inspired millions of Indians to patriotism?","o":[["a","Swaraj"],["b","Shakuntal a"],["c","Anand Math"],["d","Gita Rahasya"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The composer of Vande Mataram was the famous Bengali writer Bankim Chandra Chatterjee. The song was later published in the book Anandamath, which was written against the backdrop of the Sannyasi Revolt. It was sung for the first time at the Calcutta session of the Indian National Congress in 1896.","b":true},{"id":601,"c":50,"q":"Who was the author of Mahatma Gandhi and Bihar, Some Reminiscences?","o":[["a","Dr. Rajendra Prasad"],["b","J.P. Narayan"],["c","Karpuri Thakur"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"The author of Mahatma Gandhi and Bihar: Some Reminiscences is Dr. Rajendra Prasad. Some other major works by Satyagraha in Champaran, India Divided, At the Feet of Mahatma Gandhi, etc.","b":false},{"id":602,"c":50,"q":"Who is the author of the book 'A Gallery of Rascals'?","o":[["a","Arundhati Roy"],["b","Ruskin Bond"],["c","Vikram Seth"],["d","Toni Morrison"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"The author of A Gallery of Rascals (A Gallery of Rascals: My Favourite Tales of Rogues, Rapscallions & ne’ er-do-wells) is Ruskin Bond. Ruskin Bond is a world-renowned Indian author who writes in English.","b":false},{"id":603,"c":50,"q":"Who wrote the book, Desher Katha?","o":[["a","Sakharam Ganesh Deuskar"],["b","Rajendra Prasad"],["c","Nivaran Chandra"],["d","Murali Mohan Prasad"],["e","None of the above/More than one of the above"]],"a":"a","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"Desher Katha (“Talk of the Country”) is a Bengali book containing revolutionary ideas, written by the great revolutionary thinker and writer Sakharam Ganesh Deuskar. It was published in 1904.","b":false},{"id":604,"c":50,"q":"Who is the author of the famous book 'Gulamgiri'?","o":[["a","Jyotiba Phule"],["b","Ramaswami Naicker Periyar"],["c","B. R. Ambedkar"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C. (Re-Exam) (Pre) 2024","y":2024,"e":"The upliftment of the backward classes was the main programme of the Satyashodhak Samaj, which was founded by Jyotiba Phule in 1873. This movement worked for the welfare of Dalits and lower-caste people. To spread his anti-Brahmanical activities in an organised manner, he wrote critical works like ‘Sarvajanik Satya Dharma Pustak’ and ‘Gulamgiri’.","b":false},{"id":605,"c":50,"q":"Matchthe List-I of authors with List-II of the books on","o":[["a","iv ii i ii"],["b","ii iii i iv"],["c","i iv ii iii"],["d","None of the above"]],"a":"c","s":"70th B.P.S.C Re-Exam 2024","y":2024,"e":"The correct matching is as follows— V.D. Savarkar – The Indian War of Independence, 1857\nS.N. Sen – Eighteen Fifty-Seven\nEric Stokes – The Peasant and the Raj\nS.B. Chaudhuri – Civil Rebellion in the Indian Mutinies Thus, option (c) is the correct answer.","b":false,"L":["⦚List-I⦙⦙List-II","(A)⦙V. D. Savarkar⦙(i)⦙The First War of Independence","(B) S. N. Sen (ii) The Peasant and the Raj","(C)⦙Eric Stokes⦙(iii)⦙Civil Rebellion in the Indian Mutinies","(D)⦙S.B. Chaudhuri⦙(iv)⦙Eighteen Fifty-Seven"],"n":"1857 and choose answers from the code given below:"},{"id":606,"c":50,"q":"The author of ‘Udwant Prakash’ is—","o":[["a","Mauli Kavi"],["b","Bodhraj"],["c","Parmal"],["d","Vidyapati"],["e","None of the above / More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"‘Udwant Prakash’ is an 18th-century work, authored by Mauli Kavi. Mauli Kavi also composed two other works—‘Udwant Vinod’ and ‘Bagh Singh’.","b":false},{"id":607,"c":50,"q":"Who is the author of the famous book, Indira: India's Most Powerful Prime Minister?","o":[["a","Rajendra Saxena"],["b","Nandan Nilekani"],["c","A.J. Finn"],["d","Sagarika Ghose"],["e","None of the above/More than one of the above"]],"a":"d","s":"B.P.S.C. C.D.P.O. (Pre) 2018","y":2018,"e":"The famous book ‘Indira: India’ s Most Powerful Prime Minister’ is written by Sagarika Ghose. She has also written a book titled ‘Atal Bihari Vajpayee’.","b":false},{"id":608,"c":50,"q":"Conflicts of Interest: My Journey Through India's Green Movement is written by whom?","o":[["a","Sanjay Manjrekar"],["b","Sunita Narain"],["c","Rajiv Mehrishi"],["d","Rajal Gupta"],["e","None of the above/More than one of the above"]],"a":"b","s":"B.P.S.C.(C.D.P.O.) (Pre) 2018","y":2018,"e":"The book ‘Conflicts of Interest: My Journey Through India’ s Green Movement’ is written by Sunita Narain. She is an environmentalist and political activist. She received the Padma Shri from the Government of India in 2005.","b":false},{"id":609,"c":50,"q":"Who isthe author of the book'Nineteen Eighty-Four'?","o":[["a","R.K. Narayan"],["b","Khushwant Singh"],["c","George Orwell"],["d","None"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre), 2008","y":2008,"e":"The book ‘Nineteen Eighty-Four’ was written by George Orwell.","b":false},{"id":610,"c":50,"q":"‘The Autobiography of an Unknown Indian’ has been written by—","o":[["a","Nirad C. Chaudhuri"],["b","Khushwant Singh"],["c","Kamala Das"],["d","Balwant Gargi"]],"a":"a","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"‘The Autobiography of an Unknown Indian’ is a book published in 1951 by Indian author Nirad C. Chaudhuri. Written in autobiographical form, the book begins with his birth in 1897 at Kishoreganj (now in Bangladesh). In this book, he describes his mental and intellectual development, the course of his life in Calcutta (Kolkata), and his depiction of the decline of symbols as he perceived it.","b":false},{"id":611,"c":50,"q":"Who is Anita Roddick the author of?","o":[["a","The Untold Story"],["b","Business as usual"],["c","Business as Unusual"],["d","Tears and Smiles"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Anita Roddick wrote ‘Business as Unusual’. It was published in 2000. Her other works include—‘Body and Soul’ (with Russell Miller), ‘Take It Personally’, ‘A Revolution in Kindness’, etc.","b":false},{"id":612,"c":50,"q":"The author of the book 'Life Divine' is -","o":[["a","S. Radhakrishnan"],["b","Mulk Raj Anand"],["c","Aurobindo Ghosh"],["d","Swami Vivekananda"]],"a":"c","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"‘The Life Divine’ is a book by Aurobindo Ghose, written in two parts and divided into 56 chapters. In this book, Aurobindo Ghose presents a synthesis of Western thought and Eastern spirituality based on his intuition. He also wrote ‘Savitri’, ‘The Synthesis of Yoga’, ‘Essays on the Gita’, etc.","b":false},{"id":613,"c":50,"q":"The author of 'The Moor's Last Sigh' is-","o":[["a","Peg Tyre"],["b","Salman Rushdie"],["c","P. G. Wodehouse"],["d","Mary Higgins Clark"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"‘The Moor’ s Last Sigh’ (The Moor’ s Last Sigh) was written by Salman Rushdie, a writer of Indian origin. It was published in 1995.","b":false},{"id":614,"c":50,"q":"Which of the following statements regarding the composition titled 'Triumph of the Spirit' is true?","o":[["a","It is composed by Romi Dev."],["b","It contains details of Kapil Dev's sporting life."],["c","It was formally released by the famous painter M. F. Husain."],["d","All of the above."]],"a":"d","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"Triumph of the Spirit (Triumph of the Spirit) was written by Romi Dev, Kapil Dev’ s wife, and was published in 1994 by Allied Publishers. This book, which describes Kapil Dev’ s sporting career, was released by M. F. Husain.","b":false},{"id":615,"c":50,"q":"Match List - I and List - II and select from the list","o":[["a","A-1, B-3, C-2, D-4"],["b","A-1, B-2, C-4, D-3"],["c","A-2, B-1, C-3, D-4"],["d","A-4, B-2, C-3, D-1"]],"a":"b","s":"B.P.S.C. (Assistant), 2019","y":2019,"e":"The correct matching is as follows— List-I (Author) List-II (Book) Charles Dickens A Christmas Carol Salman Rushdie Midnight’ s Children Shashi Tharoor The Great Indian Novel Khushwant Singh The Company of Women","b":false,"L":["⦚List - I⦙List - II","⦚(Author's name)⦙(Name of the book)","(A) Charles Dickens⦙(1) A Christmas Carol","(B) Salman Rushdie⦙(2) Midnight's Children","(C) Shashi Tharoor⦙(3)The Company of Women","(D) Khushwant Singh⦙(4) The Great Indian Novel"],"n":"Choose the correct answer using the code provided."},{"id":616,"c":51,"q":"What is the name of the 16th-century step well that the Archaeological Survey of india recently conserved in collaboration with the World Monuments Fund India?","o":[["a","Agasen ki Baoli"],["b","Rajon ki Baoli"],["c","Chauki Bavdi"],["d","More than one of the above"]],"a":"b","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"Rajon ki Baoli, located in the Mehrauli Archaeological Park, Delhi, is a four-tiered step well built around 1506 CE during the reign of Sikandar Lodi. It is an excellent example of Lodi-period architecture and water-structure engineering. The Archaeological Survey of India, in collaboration with World Monuments Fund India and the TCS Foundation, has successfully completed the conservation of Rajon ki Baoli.","b":false},{"id":617,"c":51,"q":"Chitrakoot temple is located in which state of India?","o":[["a","Chhattisgarh"],["b","Orissa"],["c","Madhya Pradesh"],["d","Uttar Pradesh"]],"a":"*","s":"70th B.P.S.C. (Re-Exam) (Pre) 2024","y":2024,"e":"The Chitrakoot Temple is located in both Uttar Pradesh and Madhya Pradesh. Chitrakoot district lies in Uttar Pradesh.","b":false},{"id":618,"c":51,"q":"Where was the last Kumbh Mela of the 20th century celebrated?","o":[["a","Allahabad"],["b","Ayodhya"],["c","Haridwar"],["d","Varanasi"]],"a":"c","s":"42nd B.P.S.C. (Pre), 1997-98","y":1997,"e":"The last Kumbh Mela of the 20th century was held in Haridwar in 1998. In India, apart from Haridwar, Kumbh Melas are also organized at three other places—Allahabad (now Prayagraj), Nashik, and Ujjain.","b":false},{"id":619,"c":51,"q":"Jantar Mantar was built by -","o":[["a","Akbar"],["b","Shah Jahan"],["c","Shivaji"],["d","Maharaja Jai Singh"]],"a":"d","s":"38th B.P.S.C. (Pre), 1992","y":1992,"e":"The Jantar-Mantar in Jaipur was built by Sawai Raja Jai Singh. It is located near the City Palace. The main instruments at the Jantar-Mantar observatory include Samrat Yantra, Ram Yantra, Rashi-Valaya Yantra, and Kapali Yantra, which accurately indicate the motion of the sun and the moon and the positions of stars. Notably, for research in astronomy and celestial science, Sawai Jai Singh built five observatories at Delhi, Mathura, Ujjain, Varanasi, and Jaipur, among which the Jaipur observatory is the largest and highly scientific in design.","b":false},{"id":620,"c":51,"q":"Who painted 'Bharat Mata', famous for its historical values?","o":[["a","A ban indra nath Tagore"],["b","Satyendra nath Tagore"],["c","Surendranath Banerjee"],["d","Rabindranath Tagore"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"“Bharat Mata” is a painting painted in 1905 by the famous Indian painter A ban indra nath Tagore (nephew of Nobel Prize-winning Rabindranath Tagore).","b":false},{"id":621,"c":51,"q":"Various States and their popular dance styles are given as follows-","o":[["a","1 2 3 4"],["b","2 1 3 4"],["c","2 1 4 3"],["d","2 4 3 1"]],"a":"c","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"The matching of the given states and their folk dances is as follows— Andhra Pradesh — Burra\nAssam — Bihu Himachal Pradesh— Nati Rajasthan — Ghoomar","b":false,"L":["(A) Andhra Pradesh 1. Bihu","(B) Assam 2. Burra","(C) Himachal Pradesh 3. Ghoomar","(D) Rajasthan 4. Nati What willbe the correct matching of state and dance?"]},{"id":622,"c":51,"q":"In which country isthe three-day Tha ding yut Festival celebrated?","o":[["a","Chile"],["b","Nepal"],["c","Germany"],["d","Myanmar"]],"a":"d","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"The Tha ding yut festival is celebrated in Myanmar. In Myanmar, this festival is celebrated as a festival of lights. It is a prestigious cultural and religious festival. This festival is the second most popular festival in Myanmar after the Thingyan festival. It lasts for three days, which include the day before the full moon, the day of the full moon, and the day after the full moon.","b":false},{"id":623,"c":51,"q":"Monuments - Which of the following pairs of states is correct? I. Sheikh Chilli's Tomb - Haryana II. Chitradurga Fort - Karnataka","o":[["a","Both I and II"],["b","Only I"],["c","Only II"],["d","Neither I nor II"]],"a":"a","s":"B.P.S.C. District Art & Culture Officer 2021","y":2021,"e":"The Tomb of Sheikh Chilli is located at Thanesar in Kurukshetra district of Haryana, while Chitradurga Fort is located in Chitradurga district of Karnataka.","b":false},{"id":624,"c":51,"q":"In which Indian state is the Barabati Fort located?","o":[["a","Kerala"],["b","Maharashtra"],["c","West Bengal"],["d","Odisha"]],"a":"d","s":"B.P.S.C. Assistant 2019","y":2019,"e":"Barabati Fort is located in the Indian state of Odisha. It is located in the Cuttack area of Odisha.","b":false},{"id":625,"c":51,"q":"using the codes given below the lists.","o":[["a","2 3 1 4"],["b","2 4 1 3"],["c","2 1 4 3"],["d","2 1 3 4"]],"a":"b","s":"B.P.S.C. District Art & Culture Officer 2021","y":2021,"e":"The correct matching is as follows— List–I List–II ( (Traditional Sport) (States where they are played) Kalaripayattu Kerala Archery Manipur Jallikattu Tamil Nadu Mal lakh amb Madhya Pradesh","b":false,"L":["⦚List - I⦙List - II","⦚(Traditional sport)⦙(State where they are played)","A. Kalaripayattu⦙1. Tamil Nadu","B. Archery⦙2. Kerala","C. Jallikattu⦙3. Madhya Pradesh","D. Mal lakh amb⦙4. Manipur"]},{"id":626,"c":51,"q":"Which of the following festival-state pairs is correct? I. Modhera Dance Festival - Gujarat II. Baneshwar Fair - Rajasthan","o":[["a","Only I"],["b","Neither I nor II"],["c","Both I and II"],["d","Only II"]],"a":"c","s":"B.P.S.C. District Art & Culture Officer 2021","y":2021,"e":"The correct matching is as follows— Festival/Fair State I. Modhera Dance Festival Gujarat II. Baneshwar Fair Rajasthan Both pairs are matched; therefore option (c) is the correct answer.","b":false},{"id":627,"c":51,"q":"Consider the following statements regarding the Mam all apu ram Dance Festival.","o":[["a","1 and 2 only"],["b","Only 1, 3 and 4"],["c","Only 1 and 3"],["d","Only 2, 3 and 4"]],"a":"b","s":"B.P.S.C. District Art & Culture Officer 2021","y":2021,"e":"The Mam all apu ram Dance Festival is one of the notable festivals of India, devoted entirely to the country’ s traditional fine arts. It is held in Mahabalipuram for about four weeks. Hence, statement 2 is false. All the remaining statements are true.","b":false,"L":["1. This is a festival of folk dances prevalent in different regions of the country.","2.⦙This festival is held in the citycalledMahabalipuram for about ten days.","3.⦙Mahabharata, Radha Krishna, Balli Mukhya, Shiva Shakti and many ancient folk tales are brought to life through sensitive dance forms.","4.⦙Hypnotic dances are performed on the stage decorated with the historical 'Arjuna's Penance' sculpture series in the background. Which of the statement(s) given above is/are correct?"]},{"id":628,"c":51,"q":"Which of the following states celebrates the Gangaur festival?","o":[["a","Rajasthan"],["b","Arunachal Pradesh"],["c","Goa"],["d","Karnataka"]],"a":"a","s":"B.P.S.C. Assistant 2019","y":2019,"e":"Among the given options, the Gangaur festival is celebrated in Rajasthan. It falls on the Tritiya (third day) of the Shukla Paksha in the month of Chaitra. On this day, girls and women worship Lord Shiva and Goddess Parvati.","b":false},{"id":629,"c":51,"q":"Consider the following statements regarding Hoysala art:","o":[["a","1 and 2 only"],["b","3 and 4 only"],["c","2 and 3 only"],["d","1, 2 and 3"]],"a":"d","s":"B.P.S.C. District Art & Culture Officer 2021","y":2021,"e":"1. The Hoysala style (1050–1300 AD) developed in the southern region of Karnataka; therefore statement 1 is correct. 2. The beginning of Hoysala art can be traced to the Early Chalukya temples at Aihole, Badami and Pat tada kal; statement 2 is also correct. 3. An important monument employing this art is the Keshava Temple at Belur; statement 3 is also correct. 4. Hoysala temples are richly ornamented, and soapstone was used extensively. Since soapstone is softer and more suitable for carving than sandstone, statement 4 is incorrect.","b":false,"L":["1. The Hoysala style (1050-1300 AD) developed in the southern region of Karnataka.","2. The beginning of Hoysala art can be traced to the early Chalukya temples in Aihole, Badami, and Pat tada kal.","3. An important monument employing this art is the Keshava Temple located in Belur.","4. Besides the architectural plan, the Hoysala style acquired some more specific characteristics. For example,chl ori tic schist was abandoned due to the more readily available sandstone. Which of the statement/statements given above is/are correct?"]},{"id":630,"c":51,"q":"Consider the following statements about festivals and fairs in India.","o":[["a","3 and 4 only"],["b","Only 2 and 3"],["c","1 and 2 only"],["d","1, 2 and 3"]],"a":"d","s":"B.P.S.C. District Art & Culture Officer 2021","y":2021,"e":"The Pushkar fair is organized in Ajmer district of Rajasthan, at Pushkar. The famous temple of Lord Brahma is also located at Pushkar, and Pushkar is also known for Jain pilgrimage sites. Bihu is celebrated in Assam. The main attraction of the Pooram festival is the elephant parade. Karthigai is celebrated on Kartik Purnima in Andhra Pradesh, Tamil Nadu and some parts of Kerala.","b":false,"L":["1.⦙The main attraction of the Pooram festival held in Thrissur, Kerala is the parade of magnificently decorated elephants.","2.⦙Bihu festival is celebrated in Assam.","3.⦙Karthigai is celebrated on Kartik Purnima in Andhra Pradesh, Tamil Nadu and some parts of Kerala.","4.⦙The famous Pushkar Mela is held in the Jaisalmer district of Rajasthan.Which of the statements given above are correct?"]},{"id":631,"c":51,"q":"Which of the following temples is located in Kanchipuram?","o":[["a","Sri Venkateswara Swamy Vari Temple"],["b","Sri Pad mana bha swamy Temple"],["c","Arulmigu Rama natha swamy Temple"],["d","Ekambareswarar Temple"]],"a":"d","s":"B.P.S.C. Assistant 2019","y":2019,"e":"Ekambareswarar Temple is located in Kanchipuram. This temple is dedicated to Lord Shiva. The construction of this temple was carried out by the Pallavas. Notably, this temple is thousands of years old, and it was reconstructed by the Pallavas around the 7th century CE. Later, the Vijayanagara rulers also contributed to the construction of this temple.","b":false},{"id":632,"c":51,"q":"Which of the following is a classical dance form of the state of Assam?","o":[["a","Gotipua"],["b","Rouf"],["c","Sattriya"],["d","Chhau"]],"a":"c","s":"B.P.S.C. (C.D.P.O.) (Pre) 2005","y":2005,"e":"Assam’ s classical dance is Sattriya. This dance form is devotional in nature because its purpose was to propagate Neo-Vaishnavism. It was introduced by the great Vaishnav saint of Assam and reformer, Mah apu rush Srimanta Shankara deva. It is one of India’ s eight classical dances.","b":false},{"id":633,"c":51,"q":"‘Magh arMa hot sav’ was started in honor of Sant Kabir, in the year-","o":[["a","In 1987"],["b","In 1985"],["c","In 1990"],["d","In 1975"]],"a":"a","s":"41st B.P.S.C. (Pre), 1996","y":1996,"e":"At the place where the great Bhakti saint Kabir passed away, who gave the message of humanity to the world, the Maghar Mahotsav began in 1987.","b":false},{"id":634,"c":51,"q":"The world's largest stadium is located in-","o":[["a","Brazil"],["b","Czechoslovakia"],["c","Germany"],["d","the United States of America"]],"a":"*","s":"38th B.P.S.C. (Pre), 1992","y":1992,"e":"According to Guinness World Records and the Olympic Website- The world’ s largest football stadium is the Rungrado 1 st of May Stadium in Pyongyang, North Korea. Its spectator capacity is reported as 150,000 (another commonly reported figure is 114,000). The world’ s largest cricket stadium is Narendra Modi Stadium, Motera (Gujarat), with a spectator capacity of 1.32 lakh.","b":false},{"id":635,"c":51,"q":"The 'Statue of Liberty' is located in-","o":[["a","France"],["b","Spain"],["c","England"],["d","United States of America"]],"a":"d","s":"42nd B.P.S.C. (Pre), 1997-98","y":1997,"e":"The 'Statue of Liberty' was made in France. The sculptor of the Statue of Liberty was Frédéric Auguste Bartholdi. The architect of the pedestal on which it is installed was Richard Morris Hunt, and the engineer of the internal framework was Alexandre Gustave Eiffel. As a symbol of France–America friendship, France gifted the Statue of Liberty to the United States on 28 October 1886, on the occasion of the centenary of American independence. This statue is located on Liberty","b":false}]};

let memoryOnly = !hasStore;
let P = { ans:{}, saved:{}, times:{} };

async function sget(k){
  if(!hasStore) return null;
  try{ const r = await window.storage.get(k); return r && r.value ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sset(k, v){
  if(!hasStore) return;
  try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){ memoryOnly = true; }
}
let saveTimer = null;
function saveProgress(){
  if(!hasStore) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>sset(KEY, P), 350);
}

/* ---------- time helpers ---------- */
function clock(ms){
  const t = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}
function dur(ms){
  const t = Math.max(0, Math.round(ms/1000));
  if(t < 60) return t + 's';
  const m = Math.floor(t/60), s = t%60;
  return s ? m+'m '+s+'s' : m+'m';
}

  ['m-jhansi', 63, 56, 250, -5], ['m-ship', 6, 60, 230, 4],

/* ---------- state ---------- */
let mode = 'practice';
let examPhase = 'setup';
let chapter = null;
let shuffle = false, onlyUnseen = false, onlyWrong = false, onlySaved = false, year = 'all';
let pool = [], pos = 0;
let seed = 20260904;
function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }
function shuffled(list, s){
  seed = s; return list.map(x=>[rnd(), x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}

let qStart = 0, ticker = null;
const sessionStart = Date.now();

const exam = {
  ids:[], ans:{}, flags:{}, times:{},
  start:0, durationMs:0, pos:0, negative:true,
  count:25, minutes:0, scope:'all', timedOut:false, reviewing:false, submittedAt:0
};
let examTimer = null;

function buildPool(keepId){
  let list = Q.filter(q=>{
    if(chapter!==null && q.c!==chapter) return false;
    if(year!=='all' && String(q.y)!==year) return false;
    if(onlyUnseen && P.ans[q.id]!==undefined) return false;
    if(onlySaved && !P.saved[q.id]) return false;
    if(onlyWrong){ const a=P.ans[q.id]; if(a===undefined || a===q.a) return false; }
    return true;
  });
  if(shuffle) list = shuffled(list, 20260904);
  pool = list; pos = 0;
  if(keepId!==undefined){
    const i = pool.findIndex(q=>q.id===keepId);
    if(i>=0) pos = i;
  }
}

/* ---------- tally ---------- */
function tallyItem(num, lab, cls){
  const d=document.createElement('div'); d.className='tally-item';
  const n=document.createElement('div'); n.className='tally-num'+(cls?' '+cls:''); n.textContent=num;
  const l=document.createElement('div'); l.className='tally-lab'; l.textContent=lab;
  d.append(n,l); return d;
}
function renderTally(){
  const t=document.getElementById('tally');
  t.innerHTML='';
  if(mode==='exam' && examPhase!=='running') return;
  if(mode==='exam'){
    const d=document.createElement('div'); d.className='tally-item';
    const n=document.createElement('div'); n.className='clock'; n.id='clockEl';
    const l=document.createElement('div'); l.className='tally-lab'; l.textContent='time left';
    d.append(n,l);
    t.append(tallyItem(Object.keys(exam.ans).length+'/'+exam.ids.length,'answered'), d);
    paintClock();
    return;
  }
  let ok=0,bad=0,ms=0;
  for(const q of Q){
    const a=P.ans[q.id];
    if(a===undefined) continue;
    if(a===q.a) ok++; else bad++;
    if(P.times[q.id]) ms+=P.times[q.id];
  }
  const seen=ok+bad;
  t.append(tallyItem(ok,'correct','good'), tallyItem(bad,'wrong','bad'), tallyItem(seen,'attempted'));
  if(seen) t.append(tallyItem(dur(ms/seen),'avg / question'));
}
function paintClock(){
  const el=document.getElementById('clockEl');
  if(!el) return;
  const left = exam.durationMs - (Date.now()-exam.start);
  el.textContent = clock(left);
  el.className = 'clock' + (left<=60000 ? ' crit' : left<=300000 ? ' warn' : '');
}

/* ---------- rail ---------- */
function renderRail(){
  const rail=document.getElementById('spine'), shell=document.getElementById('shell');
  const examView = mode==='exam' && (examPhase==='running' || exam.reviewing);
  if(mode==='exam' && !examView){ shell.classList.add('wide'); rail.style.display='none'; return; }
  shell.classList.remove('wide'); rail.style.display='';
  rail.innerHTML='';

  const close=document.createElement('div'); close.className='spine-close';
  const h=document.createElement('strong'); h.style.fontSize='15px';
  h.textContent = examView ? 'Questions' : 'Chapters';
  const cb=document.createElement('button'); cb.className='chip'; cb.type='button'; cb.textContent='Close';
  cb.addEventListener('click', ()=>rail.classList.remove('open'));
  close.append(h,cb); rail.appendChild(close);

  if(examView){ renderPalette(rail); return; }

  const head=document.createElement('div');
  head.className='spine-head'; head.textContent='1498 → 1947, in the order the book teaches them';
  rail.appendChild(head);
  const all=document.createElement('button');
  all.className='allbtn'; all.type='button'; all.textContent='All chapters';
  all.setAttribute('aria-pressed', chapter===null);
  all.addEventListener('click', ()=>{ chapter=null; buildPool(); rail.classList.remove('open'); route(); });
  rail.appendChild(all);

  const ul=document.createElement('ul'); ul.className='chapters';
  CH.forEach(c=>{
    const qs=Q.filter(q=>q.c===c.id);
    const done=qs.filter(q=>P.ans[q.id]!==undefined).length;
    const ok=qs.filter(q=>P.ans[q.id]!==undefined && P.ans[q.id]===q.a).length;
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.className='chap'+((done===c.n && c.n)?' done':''); b.type='button';
    b.setAttribute('aria-pressed', chapter===c.id);
    b.innerHTML='<span class="yr"></span><span class="dot"><i></i></span>'
      +'<span class="body"><span class="nm"></span><span class="meta"></span>'
      +'<span class="bar"><span></span></span></span>';
    b.querySelector('.yr').textContent=c.era;
    b.querySelector('.nm').textContent=c.short;
    b.querySelector('.meta').textContent = done ? done+'/'+c.n+' done · '+ok+' right' : c.n+' questions';
    b.querySelector('.bar span').style.width=(done/c.n*100)+'%';
    b.addEventListener('click', ()=>{
      chapter = (chapter===c.id)?null:c.id;
      buildPool(); rail.classList.remove('open'); route();
    });
    li.appendChild(b); ul.appendChild(li);
  });
  rail.appendChild(ul);
}

function renderPalette(rail){
  const grid=document.createElement('div'); grid.className='palette';
  exam.ids.forEach((id,i)=>{
    const q=Q[id];
    const b=document.createElement('button');
    b.className='pq'; b.type='button'; b.textContent=i+1;
    if(exam.reviewing){
      const a=exam.ans[id];
      if(a===undefined) b.classList.add('seen');
      else b.classList.add(a===q.a?'ok':'no');
    } else {
      if(exam.flags[id]) b.classList.add('flag');
      else if(exam.ans[id]!==undefined) b.classList.add('done');
      else if(exam.times[id]) b.classList.add('seen');
    }
    if(i===exam.pos) b.classList.add('now');
    b.addEventListener('click', ()=>{
      rail.classList.remove('open');
      if(exam.reviewing){ exam.pos=i; route(); } else gotoExam(i);
    });
    grid.appendChild(b);
  });
  rail.appendChild(grid);
  const lg=document.createElement('div'); lg.className='legend';
  lg.innerHTML = exam.reviewing
    ? '<span><i class="l-done"></i>correct</span><span><i class="l-wrong"></i>wrong</span><span><i class="l-seen"></i>skipped</span>'
    : '<span><i class="l-done"></i>answered</span><span><i class="l-flag"></i>marked</span><span><i class="l-seen"></i>seen</span>';
  rail.appendChild(lg);
}

/* ---------- shared card ---------- */
function questionCard(q, chosen, reveal, onPick){
  const card=document.createElement('div'); card.className='card';
  const stem=document.createElement('p'); stem.className='stem'; stem.textContent=q.q;
  card.appendChild(stem);

  if(q.L && q.L.length){
    const lb=document.createElement('div'); lb.className='listblock';
    q.L.forEach(row=>{
      const isHead = row.charCodeAt(0)===0x299A;
      const cols=(isHead?row.slice(1):row).split('\u2999');
      if(cols.length===2){
        const l=document.createElement('span'), r=document.createElement('span');
        l.textContent=cols[0].trim(); r.textContent=cols[1].trim();
        if(isHead){ l.className='hd'; r.className='hd'; }
        lb.append(l,r);
      } else {
        const f=document.createElement('span'); f.className='full';
        f.textContent=row.replace(/[\u2999\u299A]/g,' ').trim();
        lb.appendChild(f);
      }
    });
    card.appendChild(lb);
  }
  if(q.n){
    const ins=document.createElement('p'); ins.className='instr'; ins.textContent=q.n;
    card.appendChild(ins);
  }

  const wrap=document.createElement('div'); wrap.className='opts';
  q.o.forEach(([ltr,txt])=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button';
    b.innerHTML='<span class="ltr"></span><span class="txt"></span><span class="mk"></span>';
    b.querySelector('.ltr').textContent=ltr;
    b.querySelector('.txt').textContent=txt;
    if(reveal){
      b.disabled=true;
      if(ltr===q.a){ b.classList.add('correct'); b.querySelector('.mk').textContent='✓'; }
      else if(ltr===chosen){ b.classList.add('wrong'); b.querySelector('.mk').textContent='✕'; }
    } else {
      if(ltr===chosen){ b.classList.add('picked'); b.querySelector('.mk').textContent='●'; }
      b.addEventListener('click', ()=>onPick(ltr));
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
  return card;
}

function verdictBlock(q, chosen, tookMs){
  const v=document.createElement('div'); v.className='verdict';
  const h=document.createElement('p'); h.className='verdict-h';
  const label=document.createElement('span');
  if(q.a==='*'){ h.classList.add('void'); label.textContent='BPSC cancelled this question — no option was accepted.'; }
  else if(chosen===undefined){ h.classList.add('void'); label.textContent='Not attempted. The answer is ('+q.a+').'; }
  else if(chosen===q.a){ h.classList.add('good'); label.textContent='Correct.'; }
  else { h.classList.add('bad'); label.textContent='Not this one. The answer is ('+q.a+').'; }
  h.appendChild(label);
  if(tookMs){
    const t=document.createElement('span'); t.className='took'; t.textContent='took '+dur(tookMs);
    h.appendChild(t);
  }
  const e=document.createElement('p'); e.className='expl'; e.textContent=q.e;
  v.append(h,e);
  if(q.b){
    const n=document.createElement('p'); n.className='borrowed';
    n.textContent='The book explains this together with the preceding question; that explanation is shown above.';
    v.appendChild(n);
  }
  return v;
}

/* ---------- practice ---------- */
function render(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  if(!pool.length){
    const d=document.createElement('div'); d.className='empty';
    d.innerHTML='<h2>Nothing matches these filters</h2><p></p>';
    d.querySelector('p').textContent='Turn one off, or pick a different chapter, to bring questions back.';
    stage.appendChild(d); return;
  }
  pos=Math.max(0,Math.min(pos,pool.length-1));
  const q=pool[pos], chosen=P.ans[q.id], answered=chosen!==undefined;
  if(!answered) qStart=Date.now();

  const head=document.createElement('div'); head.className='qhead';
  const cn=document.createElement('span'); cn.className='counter';
  cn.innerHTML='<b>'+(pos+1)+'</b> of '+pool.length+' · ';
  cn.append(CH[q.c].short);
  const meta=document.createElement('div'); meta.className='qmeta';
  const sw=document.createElement('span'); sw.className='stopwatch'; sw.id='sw';
  sw.textContent = answered ? (P.times[q.id] ? 'took '+dur(P.times[q.id]) : '—') : '0:00';
  const src=document.createElement('span'); src.className='src'; src.textContent=q.s;
  meta.append(sw,src); head.append(cn,meta);

  const card=questionCard(q, chosen, answered, ltr=>{
    P.ans[q.id]=ltr; P.times[q.id]=Date.now()-qStart; saveProgress(); route();
  });
  if(answered) card.appendChild(verdictBlock(q, chosen, P.times[q.id]));

  const nav=document.createElement('div'); nav.className='navrow';
  const prev=document.createElement('button');
  prev.className='nav'; prev.type='button'; prev.textContent='Previous';
  prev.disabled=pos===0;
  prev.addEventListener('click', ()=>{ pos--; route(); });
  const next=document.createElement('button');
  next.className='nav'+(answered?' primary':''); next.type='button';
  next.textContent = pos===pool.length-1 ? 'Back to first' : 'Next';
  next.addEventListener('click', ()=>{ pos = pos===pool.length-1?0:pos+1; route(); });
  const sv=document.createElement('button');
  sv.className='save'; sv.type='button';
  sv.setAttribute('aria-pressed', !!P.saved[q.id]);
  sv.textContent = P.saved[q.id] ? '★ Saved' : '☆ Save';
  sv.addEventListener('click', ()=>{
    if(P.saved[q.id]) delete P.saved[q.id]; else P.saved[q.id]=1;
    saveProgress(); route();
  });
  nav.append(prev,next,sv);

  const hint=document.createElement('p'); hint.className='hint';
  hint.textContent = (memoryOnly
    ? 'Keys 1–5 answer · arrow keys move between questions · progress is kept for this session only'
    : 'Keys 1–5 answer · arrow keys move between questions · progress is saved automatically')
    + ' · this session ' + dur(Date.now()-sessionStart);

  stage.append(head,card,nav,hint);

  if(!answered){
    ticker=setInterval(()=>{
      const el=document.getElementById('sw');
      if(!el){ clearInterval(ticker); return; }
      el.textContent=clock(Date.now()-qStart);
    },1000);
  }
}

/* ---------- exam setup ---------- */
function renderExamSetup(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const box=document.createElement('div'); box.className='setup';
  const h=document.createElement('h2'); h.textContent='Set up a timed paper';
  const p=document.createElement('p'); p.className='lede';
  p.textContent='Questions are drawn at random, answers stay hidden until you submit, and the clock runs down on its own. Nothing here touches your practice progress.';
  box.append(h,p);

  const avail = (exam.scope==='chapter' && chapter!==null)
    ? Q.filter(q=>q.c===chapter).length : Q.length;
  if(exam.count>avail) exam.count=avail;

  function field(label, note){
    const f=document.createElement('div'); f.className='field';
    const l=document.createElement('label'); l.textContent=label;
    const row=document.createElement('div'); row.className='opts-row';
    f.append(l,row);
    if(note){ const n=document.createElement('p'); n.className='note'; n.textContent=note; f.appendChild(n); }
    box.appendChild(f); return row;
  }
  function pill(row, label, on, fn){
    const b=document.createElement('button');
    b.className='orb'; b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', on);
    b.addEventListener('click', fn); row.appendChild(b);
  }

  const r1=field('How many questions', avail+' available in the current scope');
  [10,25,50,100,150].forEach(n=>{
    if(n>=avail) return;
    pill(r1, String(n), exam.count===n, ()=>{ exam.count=n; renderExamSetup(); });
  });
  pill(r1, 'All '+avail, exam.count>=avail, ()=>{ exam.count=avail; renderExamSetup(); });

  const autoMin=Math.max(1, exam.count);
  const r2=field('Time limit',
    'BPSC allows roughly a minute a question. Auto gives you '+autoMin+' minute'+(autoMin===1?'':'s')+'.');
  pill(r2, 'Auto ('+autoMin+' min)', exam.minutes===0, ()=>{ exam.minutes=0; renderExamSetup(); });
  [10,20,30,60,90,150].forEach(m=>pill(r2, m+' min', exam.minutes===m, ()=>{ exam.minutes=m; renderExamSetup(); }));

  const r3=field('Which questions');
  pill(r3, 'Every chapter', exam.scope==='all', ()=>{ exam.scope='all'; renderExamSetup(); });
  pill(r3, chapter!==null ? CH[chapter].short : 'Current chapter (none picked)',
       exam.scope==='chapter', ()=>{
         if(chapter===null){ alert('Pick a chapter in Practice mode first, then come back.'); return; }
         exam.scope='chapter'; renderExamSetup();
       });

  const r4=field('Negative marking', 'BPSC deducts a third of a mark for each wrong answer.');
  pill(r4, 'On (−1/3)', exam.negative, ()=>{ exam.negative=true; renderExamSetup(); });
  pill(r4, 'Off', !exam.negative, ()=>{ exam.negative=false; renderExamSetup(); });

  const nav=document.createElement('div'); nav.className='navrow';
  const go=document.createElement('button');
  go.className='nav primary'; go.type='button'; go.textContent='Start the paper';
  go.addEventListener('click', startExam);
  nav.appendChild(go); box.appendChild(nav);
  stage.appendChild(box);
}

function startExam(){
  let src = (exam.scope==='chapter' && chapter!==null) ? Q.filter(q=>q.c===chapter) : Q.slice();
  src = shuffled(src, Date.now() & 0x7fffffff);
  const n=Math.min(exam.count, src.length);
  exam.ids=src.slice(0,n).map(q=>q.id);
  exam.ans={}; exam.flags={}; exam.times={}; exam.pos=0;
  exam.timedOut=false; exam.reviewing=false;
  exam.durationMs=(exam.minutes || n)*60000;
  exam.start=Date.now(); qStart=Date.now();
  examPhase='running';
  startExamTimer(); route();
}
function startExamTimer(){
  stopExamTimer();
  examTimer=setInterval(()=>{
    paintClock();
    if(Date.now()-exam.start >= exam.durationMs){ exam.timedOut=true; submitExam(); }
  },1000);
}
function stopExamTimer(){ if(examTimer){ clearInterval(examTimer); examTimer=null; } }
function bankTime(){
  const id=exam.ids[exam.pos];
  if(id===undefined) return;
  exam.times[id]=(exam.times[id]||0)+(Date.now()-qStart);
  qStart=Date.now();
}
function gotoExam(i){
  bankTime();
  exam.pos=Math.max(0, Math.min(i, exam.ids.length-1));
  route();
}
function submitExam(){
  bankTime(); stopExamTimer();
  exam.submittedAt=Date.now();
  examPhase='results'; exam.reviewing=false;
  route();
}

/* ---------- exam running ---------- */
function renderExamQuestion(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const id=exam.ids[exam.pos], q=Q[id], chosen=exam.ans[id];

  const head=document.createElement('div'); head.className='qhead';
  const cn=document.createElement('span'); cn.className='counter';
  cn.innerHTML='<b>'+(exam.pos+1)+'</b> of '+exam.ids.length;
  const meta=document.createElement('div'); meta.className='qmeta';
  const sw=document.createElement('span'); sw.className='stopwatch'; sw.id='sw'; sw.textContent='0:00';
  const src=document.createElement('span'); src.className='src'; src.textContent=q.s;
  meta.append(sw,src); head.append(cn,meta);

  const card=questionCard(q, chosen, false, ltr=>{ exam.ans[id]=ltr; route(); });

  const nav=document.createElement('div'); nav.className='navrow';
  const prev=document.createElement('button');
  prev.className='nav'; prev.type='button'; prev.textContent='Previous';
  prev.disabled=exam.pos===0;
  prev.addEventListener('click', ()=>gotoExam(exam.pos-1));
  const next=document.createElement('button');
  next.className='nav primary'; next.type='button';
  next.textContent = exam.pos===exam.ids.length-1 ? 'Back to first' : 'Next';
  next.addEventListener('click', ()=>gotoExam(exam.pos===exam.ids.length-1?0:exam.pos+1));
  const flag=document.createElement('button');
  flag.className='nav flag'; flag.type='button';
  flag.setAttribute('aria-pressed', !!exam.flags[id]);
  flag.textContent = exam.flags[id] ? 'Marked' : 'Mark for review';
  flag.addEventListener('click', ()=>{
    if(exam.flags[id]) delete exam.flags[id]; else exam.flags[id]=1;
    route();
  });
  const clr=document.createElement('button');
  clr.className='nav'; clr.type='button'; clr.textContent='Clear';
  clr.disabled=chosen===undefined;
  clr.addEventListener('click', ()=>{ delete exam.ans[id]; route(); });
  const sub=document.createElement('button');
  sub.className='nav danger'; sub.type='button'; sub.textContent='Submit paper';
  sub.style.marginLeft='auto';
  sub.addEventListener('click', ()=>{
    const left=exam.ids.length-Object.keys(exam.ans).length;
    const msg = left ? 'Submit now? '+left+' question'+(left===1?'':'s')+' still unanswered.'
                     : 'Submit the paper?';
    if(confirm(msg)) submitExam();
  });
  nav.append(prev,next,flag,clr,sub);

  const hint=document.createElement('p'); hint.className='hint';
  hint.textContent='Keys 1–5 answer · arrow keys move · M marks for review · answers stay hidden until you submit';

  stage.append(head,card,nav,hint);
  ticker=setInterval(()=>{
    const el=document.getElementById('sw');
    if(!el){ clearInterval(ticker); return; }
    el.textContent=clock((exam.times[id]||0)+(Date.now()-qStart));
  },1000);
}

/* ---------- exam results ---------- */
function renderExamResults(){
  if(exam.reviewing){ renderExamReview(); return; }
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  let ok=0,bad=0,skip=0,voidq=0;
  const perCh={};
  exam.ids.forEach(id=>{
    const q=Q[id], a=exam.ans[id];
    const c=perCh[q.c] || (perCh[q.c]={n:0,ok:0});
    c.n++;
    if(q.a==='*'){ voidq++; return; }
    if(a===undefined){ skip++; return; }
    if(a===q.a){ ok++; c.ok++; } else bad++;
  });
  const total=exam.ids.length-voidq;
  const raw=ok-(exam.negative?bad/3:0);
  const used=(exam.submittedAt||Date.now())-exam.start;
  const spent=exam.ids.reduce((s,id)=>s+(exam.times[id]||0),0);
  const attempted=ok+bad;

  const box=document.createElement('div'); box.className='res';
  if(exam.timedOut){
    const t=document.createElement('div'); t.className='timeout';
    t.textContent='Time ran out — the paper was submitted automatically.';
    box.appendChild(t);
  }
  const h=document.createElement('h2'); h.textContent='Paper finished';
  box.appendChild(h);

  const sb=document.createElement('div'); sb.className='scorebig';
  const s1=document.createElement('div');
  s1.innerHTML='<div class="big"></div><div class="of"></div>';
  s1.querySelector('.big').textContent=String(Math.round(raw*100)/100);
  s1.querySelector('.of').textContent='marks out of '+total+(exam.negative?' (−1/3 applied)':'');
  const s2=document.createElement('div');
  s2.innerHTML='<div class="big"></div><div class="of"></div>';
  s2.querySelector('.big').textContent = attempted ? Math.round(ok/attempted*100)+'%' : '—';
  s2.querySelector('.of').textContent='accuracy on what you attempted';
  sb.append(s1,s2); box.appendChild(sb);

  function stat(v,k){
    const d=document.createElement('div'); d.className='stat';
    d.innerHTML='<div class="v"></div><div class="k"></div>';
    d.querySelector('.v').textContent=v; d.querySelector('.k').textContent=k;
    return d;
  }
  const sg=document.createElement('div'); sg.className='statgrid';
  sg.append(
    stat(ok,'correct'), stat(bad,'wrong'), stat(skip,'unattempted'),
    stat(clock(used),'time on the clock'),
    stat(exam.ids.length ? dur(spent/exam.ids.length) : '—','avg / question'),
    stat(clock(Math.max(0, exam.durationMs-used)),'time to spare')
  );
  if(voidq) sg.append(stat(voidq,'cancelled by BPSC'));
  box.appendChild(sg);

  const chIds=Object.keys(perCh).map(Number)
    .filter(c=>perCh[c].n>=2)
    .sort((a,b)=>perCh[b].n-perCh[a].n).slice(0,12);
  if(chIds.length>1){
    const bd=document.createElement('div'); bd.className='breakdown';
    const bh=document.createElement('h3'); bh.textContent='Where the marks went';
    bd.appendChild(bh);
    chIds.forEach(c=>{
      const r=perCh[c];
      const row=document.createElement('div'); row.className='brow';
      row.innerHTML='<span class="bn"></span><span class="bb"><span></span></span><span class="bs"></span>';
      row.querySelector('.bn').textContent=CH[c].short;
      row.querySelector('.bb span').style.width=(r.ok/r.n*100)+'%';
      row.querySelector('.bs').textContent=r.ok+'/'+r.n;
      bd.appendChild(row);
    });
    box.appendChild(bd);
  }

  const nav=document.createElement('div'); nav.className='navrow';
  const rev=document.createElement('button');
  rev.className='nav primary'; rev.type='button'; rev.textContent='Review every question';
  rev.addEventListener('click', ()=>{ exam.reviewing=true; exam.pos=0; route(); });
  const again=document.createElement('button');
  again.className='nav'; again.type='button'; again.textContent='New paper';
  again.addEventListener('click', ()=>{ examPhase='setup'; route(); });
  const back=document.createElement('button');
  back.className='nav'; back.type='button'; back.textContent='Back to practice';
  back.addEventListener('click', ()=>{ mode='practice'; route(); });
  nav.append(rev,again,back); box.appendChild(nav);
  stage.appendChild(box);
}

function renderExamReview(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const id=exam.ids[exam.pos], q=Q[id], chosen=exam.ans[id];

  const head=document.createElement('div'); head.className='qhead';
  const cn=document.createElement('span'); cn.className='counter';
  cn.innerHTML='<b>'+(exam.pos+1)+'</b> of '+exam.ids.length+' · ';
  cn.append(CH[q.c].short);
  const meta=document.createElement('div'); meta.className='qmeta';
  const src=document.createElement('span'); src.className='src'; src.textContent=q.s;
  meta.appendChild(src); head.append(cn,meta);

  const card=questionCard(q, chosen, true, ()=>{});
  card.appendChild(verdictBlock(q, chosen, exam.times[id]));

  const nav=document.createElement('div'); nav.className='navrow';
  const prev=document.createElement('button');
  prev.className='nav'; prev.type='button'; prev.textContent='Previous';
  prev.disabled=exam.pos===0;
  prev.addEventListener('click', ()=>{ exam.pos--; route(); });
  const next=document.createElement('button');
  next.className='nav primary'; next.type='button';
  next.textContent = exam.pos===exam.ids.length-1 ? 'Back to first' : 'Next';
  next.addEventListener('click', ()=>{ exam.pos = exam.pos===exam.ids.length-1?0:exam.pos+1; route(); });
  const sum=document.createElement('button');
  sum.className='nav'; sum.type='button'; sum.textContent='Back to the score';
  sum.style.marginLeft='auto';
  sum.addEventListener('click', ()=>{ exam.reviewing=false; route(); });
  nav.append(prev,next,sum);
  stage.append(head,card,nav);
}

/* ---------- router ---------- */
function route(){
  if(ticker){ clearInterval(ticker); ticker=null; }
  renderControls(); renderTally(); renderRail();
  if(mode==='exam'){
    if(examPhase==='setup') renderExamSetup();
    else if(examPhase==='running') renderExamQuestion();
    else renderExamResults();
  } else render();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(mode==='exam' && examPhase==='running'){
    const id=exam.ids[exam.pos], q=Q[id];
    if(e.key==='ArrowRight'){ gotoExam(exam.pos+1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ gotoExam(exam.pos-1); e.preventDefault(); }
    else if(/^[1-5]$/.test(e.key)){
      const o=q.o[+e.key-1];
      if(o){ exam.ans[id]=o[0]; route(); e.preventDefault(); }
    } else if(e.key==='m'||e.key==='M'){
      if(exam.flags[id]) delete exam.flags[id]; else exam.flags[id]=1;
      route(); e.preventDefault();
    }
    return;
  }
  if(mode==='exam' && examPhase==='results' && exam.reviewing){
    if(e.key==='ArrowRight'){ exam.pos=Math.min(exam.pos+1,exam.ids.length-1); route(); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ exam.pos=Math.max(exam.pos-1,0); route(); e.preventDefault(); }
    return;
  }
  if(mode!=='practice' || !pool.length) return;
  const q=pool[pos];
  if(e.key==='ArrowRight'){ pos=Math.min(pos+1,pool.length-1); route(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ pos=Math.max(pos-1,0); route(); e.preventDefault(); }
  else if(/^[1-5]$/.test(e.key) && P.ans[q.id]===undefined){
    const o=q.o[+e.key-1];
    if(o){ P.ans[q.id]=o[0]; P.times[q.id]=Date.now()-qStart; saveProgress(); route(); e.preventDefault(); }
  }
});

/* ---------- boot ---------- */
(async ()=>{
  buildArt();
  const res = await Promise.all([sget(KEY), sget(THEME_KEY), sget(ART_KEY)]);
  const prog=res[0], th=res[1], ar=res[2];
  if(prog){ P.ans=prog.ans||{}; P.saved=prog.saved||{}; P.times=prog.times||{}; }
  if(th==='light'||th==='dark') theme=th;
  artOn = (ar===null ? true : !!ar);
  buildPool();
  route();
  applyArt(artOn);
})();
</script>

<script>
/**
 * Universal Home navigation handler
 * Handles: iframes, popup tabs, local file:// protocols, relative paths, and browser history fallbacks.
 */
function goHome(event) {
  if (event) event.preventDefault();

  // 1. If loaded inside an iframe, navigate top-level window
  try {
    if (window.self !== window.top && window.top) {
      window.top.location.href = 'index.html';
      return false;
    }
  } catch (err) {}

  // 2. If opened as a popup tab from home portal, focus or close
  try {
    if (window.opener && !window.opener.closed) {
      if (document.referrer && document.referrer.includes('index.html')) {
        window.close();
        return false;
      }
    }
  } catch (err) {}

  // 3. If navigated internally from the portal within the same origin, perform smooth history back
  try {
    const isSameHost = document.referrer && new URL(document.referrer).origin === window.location.origin;
    if (isSameHost && window.history.length > 1 && /index\.html|bpscpyq/i.test(document.referrer)) {
      window.history.back();
      return false;
    }
  } catch (err) {}

  // 4. Fallback: navigate directly to index.html (works across http, https, and file:// protocols)
  window.location.href = 'index.html';
  return false;
}

      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>← Home</span>
    `;
    homeBtn.addEventListener('click', goHome);
    controls.prepend(homeBtn);
  }
})();
</script>
