esolutions related to the Swadeshi Movement, the Boycott Movement, National Education, and Self-government. Thus, it is clear that in opposition to the Partition of Bengal, nationalists launched movements such as Swadeshi, Boycott, National Education, and Self-government.","b":true},{"id":275,"c":15,"q":"'Swadeshi' and'boycott' as methods of struggle for the first time. When were they it adopted in India?","o":[["a","Partition of Bengal"],["b","Home Rule Movement"],["c","Non-Cooperation Movement"],["d","More than one of the above"],["e","More than one of the above"]],"a":"a","s":"B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"The Viceroy of India, Lord Curzon, announced the Partition of Bengal on 19 July 1905 (some sources also mention 20 July 1905). In protest against this announcement, a historic meeting was held at the Calcutta Town Hall, where the formal declaration was made of the Swadeshi Movement. When the Partition of Bengal was implemented in October 1905, that day was observed as a “Day of Mourning”. On the suggestion of Rabindranath Tagore, it was also observed as “Rakhi Day”. Nationalists observed this day to demonstrate the unbroken unity of Bengal. On the lines of Tagore’ s Shanti nike tan, the Bengal National College was established. Very soon, many national schools were set up across the country. In March 1906, the National Council of Education was formed. The Swadeshi Movement raised the slogan of self-reliance and self-power. The question of self-support and self-reliance was linked with national self-respect, honour, and self-confidence. The Congress, in its Calcutta Session (1906), also passed four resolutions related to the Swadeshi Movement, the Boycott Movement, National Education, and Self-government. Thus, it is clear that in opposition to the Partition of Bengal, nationalists launched movements such as Swadeshi, Boycott, National Education, and Self-government.","b":true},{"id":276,"c":15,"q":"Which movement started after the Partition of Bengal?","o":[["a","Civil Disobedience"],["b","Swadeshi Movement"],["c","Quit India Movement"],["d","Non-Cooperation Movement"]],"a":"b","s":"56th to 59thB.P.S.C. (Pre) 2014","y":2014,"e":"The Viceroy of India, Lord Curzon, announced the Partition of Bengal on 19 July 1905 (some sources also mention 20 July 1905). In protest against this announcement, a historic meeting was held at the Calcutta Town Hall, where the formal declaration was made of the Swadeshi Movement. When the Partition of Bengal was implemented in October 1905, that day was observed as a “Day of Mourning”. On the suggestion of Rabindranath Tagore, it was also observed as “Rakhi Day”. Nationalists observed this day to demonstrate the unbroken unity of Bengal. On the lines of Tagore’ s Shanti nike tan, the Bengal National College was established. Very soon, many national schools were set up across the country. In March 1906, the National Council of Education was formed. The Swadeshi Movement raised the slogan of self-reliance and self-power. The question of self-support and self-reliance was linked with national self-respect, honour, and self-confidence. The Congress, in its Calcutta Session (1906), also passed four resolutions related to the Swadeshi Movement, the Boycott Movement, National Education, and Self-government. Thus, it is clear that in opposition to the Partition of Bengal, nationalists launched movements such as Swadeshi, Boycott, National Education, and Self-government.","b":true},{"id":277,"c":15,"q":"Who was the Viceroy of India at the time of the partition of Bengal in the year 1905?","o":[["a","Lord Canning"],["b","General Dyer"],["c","Lord Wellesley"],["d","Lord Curzon"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The Viceroy of India, Lord Curzon, announced the Partition of Bengal on 19 July 1905 (some sources also mention 20 July 1905). In protest against this announcement, a historic meeting was held at the Calcutta Town Hall, where the formal declaration was made of the Swadeshi Movement. When the Partition of Bengal was implemented in October 1905, that day was observed as a “Day of Mourning”. On the suggestion of Rabindranath Tagore, it was also observed as “Rakhi Day”. Nationalists observed this day to demonstrate the unbroken unity of Bengal. On the lines of Tagore’ s Shanti nike tan, the Bengal National College was established. Very soon, many national schools were set up across the country. In March 1906, the National Council of Education was formed. The Swadeshi Movement raised the slogan of self-reliance and self-power. The question of self-support and self-reliance was linked with national self-respect, honour, and self-confidence. The Congress, in its Calcutta Session (1906), also passed four resolutions related to the Swadeshi Movement, the Boycott Movement, National Education, and Self-government. Thus, it is clear that in opposition to the Partition of Bengal, nationalists launched movements such as Swadeshi, Boycott, National Education, and Self-government.","b":true},{"id":278,"c":15,"q":"In which of the following periods did the ‘Swadeshi Movement’ rise in India?","o":[["a","Opposition to the Jallianwala Bagh tragedy"],["b","Anti-partition movement of Bengal"],["c","Gandhi Ji's Champaran Satyagraha"],["d","Anti-Rowlatt Act Movement"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The Viceroy of India, Lord Curzon, announced the Partition of Bengal on 19 July 1905 (some sources also mention 20 July 1905). In protest against this announcement, a historic meeting was held at the Calcutta Town Hall, where the formal declaration was made of the Swadeshi Movement. When the Partition of Bengal was implemented in October 1905, that day was observed as a “Day of Mourning”. On the suggestion of Rabindranath Tagore, it was also observed as “Rakhi Day”. Nationalists observed this day to demonstrate the unbroken unity of Bengal. On the lines of Tagore’ s Shanti nike tan, the Bengal National College was established. Very soon, many national schools were set up across the country. In March 1906, the National Council of Education was formed. The Swadeshi Movement raised the slogan of self-reliance and self-power. The question of self-support and self-reliance was linked with national self-respect, honour, and self-confidence. The Congress, in its Calcutta Session (1906), also passed four resolutions related to the Swadeshi Movement, the Boycott Movement, National Education, and Self-government. Thus, it is clear that in opposition to the Partition of Bengal, nationalists launched movements such as Swadeshi, Boycott, National Education, and Self-government.","b":true},{"id":279,"c":15,"q":"In which year partition of Bengal made by Lord Curzon was cancelled?","o":[["a","1911"],["b","1904"],["c","1906"],["d","1907"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"In December 1911, on the arrival of King-Emperor George V and Queen Mary in India, a Durbar was held in Delhi to welcome them. At the Delhi Durbar, on 12 December 1911, the King-Emperor declared the annulment of the Partition of Bengal. He also announced that Delhi would be made the new capital of India in place of Calcutta. In accordance with this announcement, Bengal was reorganised as a new province. Orissa and Bihar were separated from it. Assam was made a new province, as it had been in 1874, and Sylhet was added to it.","b":false},{"id":280,"c":15,"q":"Bengal was partitioned in 1905, but due to opposition it was again divided in –","o":[["a","1906"],["b","1916"],["c","1911"],["d","1909"]],"a":"c","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"In December 1911, on the arrival of King-Emperor George V and Queen Mary in India, a Durbar was held in Delhi to welcome them. At the Delhi Durbar, on 12 December 1911, the King-Emperor declared the annulment of the Partition of Bengal. He also announced that Delhi would be made the new capital of India in place of Calcutta. In accordance with this announcement, Bengal was reorganised as a new province. Orissa and Bihar were separated from it. Assam was made a new province, as it had been in 1874, and Sylhet was added to it.","b":true},{"id":281,"c":15,"q":"During whose tenure was the partition of Bengal withdrawn?","o":[["a","Lord Minto"],["b","Lord Hardinge"],["c","Lord Curzon"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. TRE-3, July 2024","y":2024,"e":"The partition of Bengal was withdrawn during the tenure of Lord Hardinge II. In 1912, the capital of British India was shifted from Calcutta to Delhi. On 19 July, 1905, the then Viceroy Lord Curzon announced the partition of Bengal.","b":false},{"id":282,"c":16,"q":"Which of the following leaders presided over the Congress Session at Calcutta in 1906?","o":[["a","B.G. Tilak"],["b","G.K. Gokhale"],["c","Aurobindo Ghosh"],["d","Dadabhai Naoroji"]],"a":"d","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"In 1906, the Calcutta session of the Indian National Congress was presided over by Dadabhai Naoroji. In this session, resolutions related to Swaraj/Self-rule, Swadeshi, Boycott, and National Education were passed, and the flag of Swaraj was hoisted by Dadabhai Naoroji.","b":false},{"id":283,"c":16,"q":"At the Calcutta Session of the Indian National Congress (INC) held in 1906, the Flag of Swaraj for India was unfurled by","o":[["a","G. K. Gokhale"],["b","A. O. Hume"],["c","Dadabhai Naoroji"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2022","y":2022,"e":"In 1906, the Calcutta session of the Indian National Congress was presided over by Dadabhai Naoroji. In this session, resolutions related to Swaraj/Self-rule, Swadeshi, Boycott, and National Education were passed, and the flag of Swaraj was hoisted by Dadabhai Naoroji.","b":true},{"id":284,"c":16,"q":"Congress passed the ‘Swaraj’ resolution in the year 1905. The purpose of the resolution was-","o":[["a","right to make a constitution for themselves but it was not done"],["b","to secure self-rule"],["c","responsible government"],["d","self-government"]],"a":"*","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"In 1906, the Calcutta session of the Indian National Congress was presided over by Dadabhai Naoroji. In this session, resolutions related to Swaraj/Self-rule, Swadeshi, Boycott, and National Education were passed, and the flag of Swaraj was hoisted by Dadabhai Naoroji.","b":true},{"id":285,"c":17,"q":"Who among the following was the founder of the All India Muslim League?","o":[["a","Sir Sayed Ahmad Khan"],["b","Sir Mohammad Iqbal"],["c","Agha Khan"],["d","Nawab Salimullah Khan"]],"a":"d","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"In October 1906, under the leadership of Aga Khan, the Simla Deputation of Muslims proposed the idea of forming a central Muslim organization to protect Muslim interests. In line with this idea, during the All India Mohammed an Educational Conference held at Dhaka in December 1906, Nawab Salimullah Khan of Dhaka the President of the reception committee of the conference and the convenor of political meetings got a resolution passed for the formation of the All India Muslim League. A 60-member provisional committee was selected, and Mohsin-ul-Mulk and Waqar-ul-Mulk were appointed jointly as Secretaries of the organization. The headquarters of the Muslim League was set up at Lucknow, and Aga Khan was made its first President. In the options, if these three names are present (or if any two of them are present), then the order of preference for selecting the “founder” will be as follows—","b":false},{"id":286,"c":17,"q":"When did the Muslim League accept the objective of self-government under the Empire?","o":[["a","1906"],["b","1913"],["c","1939"],["d","1946"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The Muslim League adopted the objective of self-government within the British Empire in 1913.","b":false},{"id":287,"c":17,"q":"The Muslim League started its annual convention on a regular basis from:","o":[["a","1916 AD"],["b","1919 AD"],["c","1924 AD"],["d","1925 AD"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The All-India Muslim League was founded in December, 1906 at Dhaka. The Nawab of Dhaka, Salimullah Khan, played an important role in its foundation. In 1907, the annual session of the Muslim League was held at Karachi, and in 1908 at Amritsar. After this, the sessions of the Muslim League continued to be held irregularly in different cities. However, the Bihar Public Service Commission, in its answer key, considered option (d) as the answer to this question, which is not correct.","b":false},{"id":288,"c":17,"q":"The Muslim deputation met Minto in 1906 at Simla and pleaded for –","o":[["a","Separate electorate for Muslims"],["b","A composite electorate"],["c","Higher representation to the Hindus"],["d","Special representation to Muslims by nomination"]],"a":"a","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"On 1 October, 1906, a Muslim deputation led by Aga Khan met the then Viceroy Lord Minto at Simla. The deputation demanded a special position for Muslims for elections in provincial, central, and local bodies. In response to this demand, Minto assured the Muslims that their political rights and interests would be protected in India.","b":false},{"id":289,"c":18,"q":"Which of the following Acts introduced the separate electorate system in India?","o":[["a","The Regulating Act, 1773"],["b","The Charter Act, 1833"],["c","The Pitt's India Act, 1784"],["d","The Indian Councils Act, 1909"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"Through the Indian Councils Act, 1909 (Morley–Minto Reforms, 1909), a system of communal representation was introduced in British India, under which provision was made for separate electorates for Muslims.","b":false},{"id":290,"c":19,"q":"When was the capital of India changed from Calcutta to Delhi?","o":[["a","In 1912 AD"],["b","In 1916 AD"],["c","In 1920 AD"],["d","In 1908 AD"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"In 1912, the capital of India was shifted from Calcutta to Delhi. It is noteworthy that the announcement regarding the change of capital was made in 1911.","b":false},{"id":291,"c":19,"q":"When did Britishers shifted the capital to Delhi?","o":[["a","1912"],["b","1913"],["c","1914"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"In 1912, the capital of India was shifted from Calcutta to Delhi. It is noteworthy that the announcement regarding the change of capital was made in 1911.","b":true},{"id":292,"c":20,"q":"Who presented the question of indigo cultivators of Bihar at the 1916 Lucknow session of the Indian National Congress?","o":[["a","Rajkumar Shukla"],["b","Dr. Rajendra Prasad"],["c","J.B. Kripalani"],["d","Sampurnanand Sinha"],["e","None of the above/More than one of the above"]],"a":"a","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"At the 1916 Lucknow Session of the Indian National Congress, a simple farmer from Bihar, Rajkumar Shukla, informed Gandhiji about the problem of indigo cultivators of Champaran and took a promise from him to visit Champaran. However, at the Lucknow Session of 1916, Braj Kishore Prasad of Darbhanga proposed the formation of a committee to investigate the problems of indigo cultivators and the atrocities of European planters, and it was passed unanimously. Therefore, the Champaran issue was discussed at the Lucknow Session of the Congress (1916).","b":false},{"id":293,"c":20,"q":"At which of the following Sessions of the Indian National Congress did the Champaran trouble come up for discussion?","o":[["a","Calcutta, 1911"],["b","Patna, 1912"],["c","Ramgarh, 1940"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"B.P.S.C. School Teacher Headmaster 09-12-2023","y":2023,"e":"At the 1916 Lucknow Session of the Indian National Congress, a simple farmer from Bihar, Rajkumar Shukla, informed Gandhiji about the problem of indigo cultivators of Champaran and took a promise from him to visit Champaran. However, at the Lucknow Session of 1916, Braj Kishore Prasad of Darbhanga proposed the formation of a committee to investigate the problems of indigo cultivators and the atrocities of European planters, and it was passed unanimously. Therefore, the Champaran issue was discussed at the Lucknow Session of the Congress (1916).","b":true},{"id":294,"c":20,"q":"The Lucknow Pact took place in","o":[["a","1915"],["b","1916"],["c","1917"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. School Teacher 07-12-2023","y":2023,"e":"In 1916, the session of the Indian National Congress was held at Lucknow. The session was presided over by Ambika Charan Majumdar. In this session, an agreement was reached between the Congress and the Muslim League. In addition, an understanding was also reached between the extremist group and the moderate group within the Congress.","b":false},{"id":295,"c":20,"q":"When was the Lucknow Pact signed by the Muslim League and the Indian National Congress?","o":[["a","1919"],["b","1925"],["c","1916"],["d","1905"]],"a":"c","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The Muslim League and the Indian National Congress signed the Lucknow Pact during the Congress session of 1916. Through this pact, the Congress accepted the Muslim League’ s demand for separate electorates.","b":false},{"id":296,"c":21,"q":"Which of the following did not contribute to the establishment of the Home Rule League?","o":[["a","Bal Gangadhar Tilak"],["b","Annie Besant"],["c","M. Sub rah many a Aiyar"],["d","H. S. Olcott"]],"a":"d","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"H. S. Olcott was associated not with the Home Rule League, but with the Theosophical Society. Bal Gangadhar Tilak started his Home Rule League in April 1916, and Annie Besant started hers in September 1916. S. Sub rah many a Aiyar was also associated with the establishment of Annie Besant’ s Home Rule League movement.","b":false},{"id":297,"c":21,"q":"In which conference could the Home-Rule supporters demonstrate their political power successfully?","o":[["a","Lucknow Conference of Congress in 1916"],["b","All India Trade Union Conference held at Bombay in 1920"],["c","First U.P. Farmers Association held in 1918."],["d","Joint A.I.T.U.C and N.T.U. Sabha at Nagpur in 1938."]],"a":"a","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"In the Lucknow session of 1916, the members of the Home Rule League got a good opportunity to show their strength. Tilak’ s supporters even made it a tradition on which the Congress rested for many years. His supporters reserved a train to reach Lucknow; some called it the “Congress Special,” while others called it the “Home Rule Special.” Arundale asked every member of the League to make every possible effort to become a member of the Lucknow session. Immediately after the conclusion of the session, meetings of both Home Rule Leagues were held in the same pavilion, in which about one thousand representatives participated. The Congress–League agreement was praised. Tilak and Annie Besant addressed the meeting.","b":false},{"id":298,"c":21,"q":"Home Rule Movement was symbol of starting a new phase of freedom movement in India because:","o":[["a","It put a perfect project for the self-government before the nation"],["b","Leadership of the movement came in to the hands of Gandhiji"],["c","Hindus and Muslims started to struggle jointly"],["d","It established coordination between extremists and moderates"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"In the eyes of both leaders of the Home Rule Movement— Tilak and Annie Besant—the meaning of Swaraj was almost the same: within the British Empire, there should be maximum arrangements for responsible government and administration at the local, provincial, and central levels, like in other British colonies that had Dominion status, such as Canada and Australia.","b":false},{"id":299,"c":22,"q":"In which of the following colleges, Gandhiji studied?","o":[["a","Samaldas College, Bhavnagar"],["b","Dharmendrasinhji College, Rajkot"],["c","Gujarat College, Ahmedabad"],["d","Bahauddin College, Junagadh"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"While mentioning his education in his autobiography, Mahatma Gandhi wrote: “I began my education in a school at Porbandar, where with great difficulty I could learn a few multiplication tables; thereafter, at the age of seven, due to my father’ s transfer to Rajkot, I came here, where I received education up to high school.” Mahatma Gandhi passed his 10th examination from Alfred High School, Rajkot. After this, he enrolled in Samaldas Arts College, Bhavnagar. After that, he completed his studies in Law from University College London.","b":false},{"id":300,"c":22,"q":"Who was the ‘Political Guru’ of Mahatma Gandhi?","o":[["a","Dadabhai Naoroji"],["b","M. G. Ranade"],["c","Surendranath Banerjee"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"B.P.S.C. School Teacher 07-12-2023","y":2023,"e":"In the book written by Mahatma Gandhi, ‘Gokhale: My Political Guru’, he wrote that “my guru–disciple relationship with Gopal Krishna Gokhale began in 1896, but I truly felt the reality of this relationship when I met him in the Calcutta Congress Session in 1902.” Thereafter, this relationship kept becoming deeper. After returning to India in 1915, Mahatma Gandhi began his political life in India under the guidance of Gokhale.","b":false},{"id":301,"c":22,"q":"Who first used the word \"Sarvodaya\"?'","o":[["a","Mahatma Gandhi"],["b","Pandit Nehru"],["c","Vinoba Bhave"],["d","Jayaprakash Narayan"]],"a":"a","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"Sarvodaya is formed from two Sanskrit words—sarva (meaning: all) and udaya (meaning: upliftment). The word Sarvodaya was used for the first time by Mahatma Gandhi. In 1908, it was used in the translation of John Ruskin’ s book ‘Unto This Last’. Its objective was to develop the spirit of freedom and equality in everyone. Note—In the book ‘Mahavira: His Times and Philosophy of Life’ written by Dr. Hiralal Jain and A. N. Upadhyay, it is written that the word ‘Sarvodaya’ was first used by a Jain philosopher named Sam anta bhadra around the 2nd century BCE. Later, Gandhiji gave this word a strong foundation and made it popular among the masses.","b":false},{"id":302,"c":22,"q":"To sort out whose legal problem was Mahatma Gandhi invited to South Africa in 1893?","o":[["a","Sheikh Abdullah of Kashmir"],["b","Titu Mir of Bengal"],["c","Imdad Imam of Bihar"],["d","Dada Abdullah of Gujarat"],["e","None of the above/More than one of the above"]],"a":"d","s":"B.P.S.C. CDPO (Pre) 2018","y":2018,"e":"An Indian Muslim businessman from Gujarat, Dada Abdullah, who was engaged in trade in South Africa, proposed to Gandhiji to look into his case. Gandhiji accepted this proposal, and in 1893 he went to South Africa.","b":false},{"id":303,"c":22,"q":"Whichof the following was Gandhiji's firstSatyagraha Movement in India in which he used civil disobedience?","o":[["a","Champaran"],["b","Kheda"],["c","Ahmedabad"],["d","Rowlatt Satyagraha"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"The Champaran Movement (1917) was Gandhiji’ s first Satyagraha movement in India, in which he used civil disobedience. This Satyagraha was started as a protest against the ‘Tinkathia system’ prevalent in Champaran (Bihar) in the early 19th century. After the Champaran Satyagraha, Gandhiji used Satyagraha in 1918 when he intervened in the dispute between the cotton mill owners and workers in Ahmedabad over the plague bonus. In the same year, 1918, Gandhiji started the Kheda Satyagraha in Gujarat because, despite crops being destroyed, the British government did not grant remission in land revenue. It may be noted that Gandhiji began the Rowlatt Satyagraha in 1919 in protest against the ‘Rowlatt Act’ passed by the British government.","b":false},{"id":304,"c":22,"q":"Which of the following was the first Satyagraha of Mahatma Gandhi in India?","o":[["a","Ahmedabad"],["b","Bardoli"],["c","Champaran"],["d","Individual"]],"a":"c","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The Champaran Movement (1917) was Gandhiji’ s first Satyagraha movement in India, in which he used civil disobedience. This Satyagraha was started as a protest against the ‘Tinkathia system’ prevalent in Champaran (Bihar) in the early 19th century. After the Champaran Satyagraha, Gandhiji used Satyagraha in 1918 when he intervened in the dispute between the cotton mill owners and workers in Ahmedabad over the plague bonus. In the same year, 1918, Gandhiji started the Kheda Satyagraha in Gujarat because, despite crops being destroyed, the British government did not grant remission in land revenue. It may be noted that Gandhiji began the Rowlatt Satyagraha in 1919 in protest against the ‘Rowlatt Act’ passed by the British government.","b":true},{"id":305,"c":22,"q":"Who invited Gandhiji to come to Champaran?","o":[["a","Rajkumar Shukla"],["b","Rajendra Prasad"],["c","Jayaprakash Narayan"],["d","Krishna Sahai"],["e","None of the above More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Pre) 2021","y":2021,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":false},{"id":306,"c":22,"q":"Who drew Gandhiji's attention to the plight of indigo peasants in Champaran?","o":[["a","Rajendra Prasad"],["b","Anugrah Narayan Sinha"],["c","Acharya Kripalani"],["d","Raj Kumar Shukla"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":307,"c":22,"q":"Who drew Mahatma Gandhi's attention towards the exploitation of the peasants by the European indigo planters?","o":[["a","Baba Ram Chandra"],["b","Raj Kumar Shukla"],["c","Swami Sahajananda Saraswati"],["d","Sri Krishna Sinha"],["e","None of the above/More than one of the above"]],"a":"b","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ ted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":315,"c":22,"q":"Champaran Satyagraha was related to:","o":[["a","Ezaredari"],["b","Tinkathia"],["c","Jenmis"],["d","None"]],"a":"b","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":316,"c":22,"q":"How much part of the land was kept in trust for the cultivation of indigo inBiharunderTinkathiya system?","o":[["a","01/10"],["b","01/03"],["c","03/20"],["d","03/25"],["e","None of the above / More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":317,"c":22,"q":"Gandhi Ji entered Indian politics through -","o":[["a","Champaran Movement"],["b","Kheda Movement"],["c","From the Non-Cooperation Movement"],["d","From the Rowlatt Act Movement"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":318,"c":22,"q":"In which peasant movement did Mahatma Gandhi participate for the first time?","o":[["a","Kheda"],["b","Champaran"],["c","Bardoli"],["d","Baroda"]],"a":"b","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":319,"c":22,"q":"Who led the Champaran Satyagraha in 1917?","o":[["a","Jawaharlal Nehru"],["b","Subhas Chandra Bose"],["c","Sardar Patel"],["d","Mahatma Gandhi"]],"a":"d","s":"70th B.P.S.C Re-Exam 2024","y":2024,"e":"After returning from South Africa in January 1915, Gandhiji carried out his first successful Satyagraha in Bihar’ s Champaran district in 1917. In 1916, a Champaran farmer, Rajkumar Shukla, met Gandhiji in Lucknow and urged him to visit Champaran. The Champaran issue was quite old. By the end of the 19th century, German synthetic dyes replaced indigo in the market. As a result, the European plantation owners in Champaran were forced to stop indigo cultivation. The peasants too wanted to get rid of indigo cultivation as a cash crop. Taking advantage of the peasants helplessness, the white planters arbitrarily increased rent and other illegal taxes in the name of releasing them from their contracts. It was against this exploitation of the peasants that Gandhiji began the Champaran Satyagraha.","b":true},{"id":320,"c":22,"q":"Champaran Agrarian Committee was appointed in agreement between:","o":[["a","Indian Government and Raj Kumar Shukla"],["b","Indian Government and Gandhiji"],["c","Indian Government and Rajendra Prasad"],["d","Indian Government and Anugraha Narayan Singh"]],"a":"b","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"During the Champaran Satyagraha in 1917, to inquire into the complaints of farmers suffering under the Tinkathia system of indigo cultivation, the colonial provincial government of Bihar and Orissa constituted a formal inquiry committee, commonly known as the Champaran Agrarian Committee or the Champaran Agrarian Inquiry Committee. The formation of this committee was the outcome of an agreement reached between Gandhiji and the then government.","b":false},{"id":321,"c":22,"q":"In response to the mass agitation of the Champaran Movement, the British Government took which step to address the issue?","o":[["a","Appointed Mahatma Gandhi as the Governor of Champaran"],["b","Enforced strict curfew and imposed Martial Law in the region"],["c","Instituted the Champaran Agrarian Committee"],["d","Declared Champaran as an independent State"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"To resolve the Champaran Satyagraha (1917), the British government appointed an inquiry committee to investigate the agrarian conditions of Champaran. Gandhiji was chosen as a member of this committee. On the basis of the committee’ s recommendations, the British government passed the Champaran Agrarian Act, 1918. Under this Act, the Champaran Agrarian Committee was established.","b":false},{"id":322,"c":22,"q":"When was Mahatma Gandhi prosecuted for the Champaran Satyagraha?","o":[["a","1916"],["b","1917"],["c","1918"],["d","1919"],["e","None of the above/More than one of the above"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"In 1917, Mahatma Gandhi was prosecuted for the Champaran Satyagraha. Gandhiji carried out his first major experiment of Satyagraha in 1917 in the Champaran district of Bihar. N. G. Ranga opposed Mahatma Gandhi’ s Champaran Satyagraha. A few years after the Champaran Satyagraha, Gurudev Rabindranath Tagore addressed Gandhiji as “Mahatma”. However, no authentic primary source is available that mentions Rabindranath Tagore addressing Gandhiji as “Mahatma” during the Champaran Satyagraha.","b":false},{"id":323,"c":22,"q":"The person not connected with Champaran movement was-","o":[["a","Rajendra Prasad"],["b","Anugrah Narayan Sinha"],["c","J.B. Kripalani"],["d","Jai Prakash Narayan"]],"a":"d","s":"42nd B.P.S.C. (Pre) 1997","y":1997,"e":"In the Champaran Movement (1917), Gandhiji was supported by Rajkumar Shukla, Rajendra Prasad, Anugrah Narayan Sinha, J. B. Kripalani, Mahadev Desai, Narhari Parekh, etc. Jayaprakash Narayan was not associated with the Champaran Movement.","b":false},{"id":324,"c":22,"q":"Who is not related to the Champaran Satyagraha of 1917?","o":[["a","J. B. Kripalani"],["b","Rajkumar Shukla"],["c","Rajendra Prasad"],["d","Ram Manohar Lohia"],["e","None of the above/More than one of the above"]],"a":"d","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"In the Champaran Movement (1917), Gandhiji was supported by Rajkumar Shukla, Rajendra Prasad, Anugrah Narayan Sinha, J. B. Kripalani, Mahadev Desai, Narhari Parekh, etc. Jayaprakash Narayan was not associated with the Champaran Movement.","b":true},{"id":325,"c":22,"q":"Which compensation tax the indigo farmers were required to pay, if they desired exemption from indigo cultivation?","o":[["a","Batta"],["b","Jaziya"],["c","Tawan"],["d","Nazrana"],["e","None of the above/More than one of the above"]],"a":"c","s":"B.P.S.C. C.D.P.O. (Pre) 2018","y":2018,"e":"The peasants had to cultivate indigo on at least 3/20 of their land and sell it at prices fixed by the European planters. This was also called the Tinkathia system. If the peasants wanted exemption from indigo cultivation, they had to pay compensation, which was called “Tawan”.","b":false},{"id":326,"c":22,"q":"Who participated in ‘Satyagraha's tarted by Gandhiji at Ahmedabad in 1917-18?","o":[["a","Cultivators class"],["b","Industrial workers"],["c","Public"],["d","Middle Class"]],"a":"b","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"After the success at Champaran, Gandhiji’ s next experiment was to intervene in 1918 in a dispute in a cotton textile mill in Ahmedabad between the mill owners and the workers regarding an increase in bonus. The dispute was over the plague bonus. After the plague subsided, the owners wanted to discontinue it, while the workers demanded that it should continue. After a detailed study of production cost, profits, and the workers’ subsistence expenses, Gandhiji declared that the workers’ wages should be increased by 35%. The tribunal constituted by the mill owners accepted his view.","b":false},{"id":327,"c":22,"q":"Who intervened in the dispute between the mill owners and labourers of Ahmedabad in 1918?","o":[["a","Mahatma Gandhi"],["b","Vallabhbhai Patel"],["c","Jamsetji Tata"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"After the success at Champaran, Gandhiji’ s next experiment was to intervene in 1918 in a dispute in a cotton textile mill in Ahmedabad between the mill owners and the workers regarding an increase in bonus. The dispute was over the plague bonus. After the plague subsided, the owners wanted to discontinue it, while the workers demanded that it should continue. After a detailed study of production cost, profits, and the workers’ subsistence expenses, Gandhiji declared that the workers’ wages should be increased by 35%. The tribunal constituted by the mill owners accepted his view.","b":true},{"id":328,"c":22,"q":"In which of the following movements did Mahatma Gandhi make the first use of the hunger strike as a weapon?","o":[["a","Non-Cooperation Movement"],["b","Bardoli Satyagraha"],["c","Ahmedabad Strike"],["d","Rowlatt Satyagraha"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"During the Ahmedabad Mill Strike (1918), Mahatma Gandhi used the hunger strike as a weapon for the first time in India.","b":false},{"id":329,"c":22,"q":"In which of the following Satyagraha movements, did Gandhiji not participate directly?","o":[["a","Rajkot Satyagraha"],["b","Kheda Satyagraha"],["c","Vaikom Satyagraha"],["d","Non-cooperation movement"]],"a":"c","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"Gandhi did not participate directly in the Vaikom Temple Entry Satyagraha, whereas he himself led the Kheda Satyagraha, Rajkot Satyagraha, and the Non-Cooperation Movement.","b":false},{"id":330,"c":22,"q":"Gandhi’ s close English compatriot during the freedom movement was:","o":[["a","Thomas Moore"],["b","A. O. Hume"],["c","Charles Andrews"],["d","William Wavell"]],"a":"c","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"Charles Andrews (Deenbandhu Andrews) was a professor at St. Stephen’ s College, Delhi. He had deep affection for Indians and wanted to become an Indian in every way. He had close relations with Rabindranath Tagore, Gopal Krishna Gokhale, and Mahatma Gandhi. The biographers of C.F. Andrews—Bana rsi das Cha tur ved i and Marjorie Sykes—in their book “Charles Freer Andrews: A Narrative” mention that the nickname “Deenbandhu” (friend of the poor) was first given to C.F. Andrews in 1917 by Indians in Fiji. Andrews was also the President of the All India Trade Union Congress (AITUC) in 1925 and 1927. He went to London with Gandhi to attend the Round Table Conference.","b":false},{"id":331,"c":22,"q":"Whowasthe founder of All India Harijan Sangh in1932?","o":[["a","Dr. B. R. Ambedkar"],["b","Jagjivan Ram"],["c","Mahatma Gandhi"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"In 1932, Mahatma Gandhi founded the “All India Anti-Untouchability League”. Earlier, this organisation was called the All India Untouchability Removal Association. Later, its name was changed to “Harijan Sevak Sangh”.","b":false},{"id":332,"c":22,"q":"Who earned the title of 'Recruiting Sergeant of the British' for his support to the government during the First World War?","o":[["a","Motilal Nehru"],["b","Mahatma Gandhi"],["c","Gopal Krishna Gokhale"],["d","Madan Mohan Malaviya"],["e","None of the above / More than one of the above"]],"a":"b","s":"B.P.S.C. C.D.P.O. (Pre) 2022","y":2022,"e":"During the First World War, Mahatma Gandhi decided to support the British government in India, because he hoped that after the end of the war, the British government would grant Indians the right to self-government. Due to this support, he was called the “British Recruiting Sergeant”.","b":false},{"id":333,"c":23,"q":"The immediate cause of the Deccan Riots of 1875 was:","o":[["a","The shadow of a famine"],["b","High interest rates charged by Mahajans"],["c","High land revenue rates"],["d","Protest against imposition"],["e","None of the above above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The Deccan Riots of 1875 had many causes, such as: high interest rates charged by Mahajans and peasants becoming permanently indebted; high interest rates related to land revenue; getting peasants to sign loan documents by mortgaging their fields, houses, etc., due to illiteracy and poverty; and the failure of peasants to protect their interests due to the complex and costly judicial system. The Bihar Public Service Commission considered option (b) as the correct answer.","b":false},{"id":334,"c":23,"q":"'Eka Movement' was launched in the rural areas of which region?","o":[["a","Bihar"],["b","Punjab"],["c","Bengal"],["d","Awadh"],["e","None of the above/More than one of the above"]],"a":"d","s":"B.P.S.C. CDPO (Pre) 2018","y":2018,"e":"In 1921–22, the peasants of Awadh ran a movement known as the Eka Movement. This movement was concentrated in the Hardoi, Bahraich, Barabanki, and Sitapur regions. The chief leader of the Eka Movement was Madari Pasi.","b":false},{"id":335,"c":23,"q":"What was the aim of Eka Movement in Oudh?","o":[["a","To stop to giving rent to the Government"],["b","To protect the rights of landlords"],["c","End of satyagraha"],["d","Transformation of rent into cash."]],"a":"d","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"The Eka Movement (1921–22) was led by Madari Pasi. The main centres of this movement were Hardoi, Barabanki, Bahraich and Sitapur. The peasants main complaints were the increase in land revenue and the practice of collecting land revenue in the form of produce. More than 50% land revenue was being taken from the peasants. The zamindars’ agents (thekedars) used to harass the peasants. The Eka Movement had little faith in the non-violent policies laid down by the nationalists. As a result, the nationalist leaders became separated from the movement, and the movement took a different path. In this movement, paying land revenue to the government was not stopped; rather, the main demand of the agitators was—“Due to rising inflation, land revenue should be converted into cash payment.”","b":false},{"id":336,"c":23,"q":"Who was associated with the Kisan Movement in Bihar?","o":[["a","Rajendra Prasad"],["b","C.R. Das"],["c","Motilal Nehru"],["d","Bhagat Singh"]],"a":"a","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"Rajendra Prasad was associated with the peasant movement in Bihar. He was associated with Mahatma Gandhi in Bihar during the Champaran Satyagraha (1917). He was the Food and Agriculture Minister in the Interim Government formed in September 1946 and was also the President of the Constituent Assembly. After the Constitution came into force, he became the first President of India.","b":false},{"id":337,"c":23,"q":"Farmer leader Motilal Tejawat is related to-","o":[["a","Bijolia movement"],["b","Mewar's Bhil tribal movement"],["c","From the peasant movement of Marwar"],["d","From the peasant movement of U.P."],["e","None of the above"]],"a":"b","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"Peasant leader Motilal Tejawat is associated with the Bhil tribal movement of the Mewar region. He founded the ‘Vanvasi Sangh’ and led this movement in the 1920s","b":false},{"id":338,"c":23,"q":"Who presided over the first session of All India Kisan Sabha?","o":[["a","Swami Sahajanand"],["b","Indulal Yagnik"],["c","N.G. Ranga"],["d","P.C. Joshi"]],"a":"a","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"In April 1936, in Lucknow, the ‘All India Kisan Congress’ was formed, which was later renamed the ‘All India Kisan Sabha’. Swami Sahajanand Saraswati, the combative founder of the Bihar Provincial Kisan Sabha, was chosen as its President, and N.G. Ranga—an important leader of the peasant movement in Andhra and a scholar of agricultural problems—was chosen as its General Secretary. Along with the Faizpur session of the Congress, the second session of the All India Kisan Congress was also held, which was presided over by N.G. Ranga.","b":false},{"id":339,"c":23,"q":"Akhil Bharatiya Kisan Congress was founded in:","o":[["a","1936 AD"],["b","1939 AD"],["c","1942 AD"],["d","1945 AD"],["e","None of the above/More than one of the above."]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"In April 1936, in Lucknow, the ‘All India Kisan Congress’ was formed, which was later renamed the ‘All India Kisan Sabha’. Swami Sahajanand Saraswati, the combative founder of the Bihar Provincial Kisan Sabha, was chosen as its President, and N.G. Ranga—an important leader of the peasant movement in Andhra and a scholar of agricultural problems—was chosen as its General Secretary. Along with the Faizpur session of the Congress, the second session of the All India Kisan Congress was also held, which was presided over by N.G. Ranga.","b":true},{"id":340,"c":23,"q":"Who was elected the first President of All India Kisan Sabha at Lucknow in 1936?","o":[["a","N.G. Ranga"],["b","E.M.S. Namboodripad"],["c","Swami Sahajanand Saraswati"],["d","Acharya Narendra Dev"],["e","None of the above/More than one of the above."]],"a":"c","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"In April 1936, in Lucknow, the ‘All India Kisan Congress’ was formed, which was later renamed the ‘All India Kisan Sabha’. Swami Sahajanand Saraswati, the combative founder of the Bihar Provincial Kisan Sabha, was chosen as its President, and N.G. Ranga—an important leader of the peasant movement in Andhra and a scholar of agricultural problems—was chosen as its General Secretary. Along with the Faizpur session of the Congress, the second session of the All India Kisan Congress was also held, which was presided over by N.G. Ranga.","b":true},{"id":341,"c":23,"q":"Where was the first All India Kisan Maha Sabha formed?","o":[["a","Allahabad"],["b","Kolkata"],["c","Lucknow"],["d","Patna"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"In April 1936, in Lucknow, the ‘All India Kisan Congress’ was formed, which was later renamed the ‘All India Kisan Sabha’. Swami Sahajanand Saraswati, the combative founder of the Bihar Provincial Kisan Sabha, was chosen as its President, and N.G. Ranga—an important leader of the peasant movement in Andhra and a scholar of agricultural problems—was chosen as its General Secretary. Along with the Faizpur session of the Congress, the second session of the All India Kisan Congress was also held, which was presided over by N.G. Ranga.","b":true},{"id":342,"c":23,"q":"Which one of the following Congress leaders participated in the first All India Kisan Sabha?","o":[["a","Jawaharlal Nehru"],["b","M.K. Gandhi"],["c","Subhas Chandra Bose"],["d","Rajendra Prasad"]],"a":"a","s":"B.P.S.C. (Pre) 2016","y":2016,"e":"Jawaharlal Nehru also addressed the All India Kisan Sabha (1936). In the same session, Swami Sahajanand Saraswati was elected the President of this Sabha and N.G. Ranga was elected the General Secretary.","b":false},{"id":343,"c":23,"q":"Swami Sahajananda Saraswati formed the All India United Kisan Sabha with the demand for the ‘nationalisation of land and waterways’:","o":[["a","Just before his death"],["b","At a very young age"],["c","In the 1930s"],["d","In the 1920s"]],"a":"a","s":"56th to 59thB.P.S.C. (Pre) 2014","y":2014,"e":"The All India Kisan Sabha was formed in 1936. Swami Sahajanand Saraswati was elected its first President and N.G. Ranga its General Secretary. In 1949 (shortly before his death), Sahajanand formed the All India United Kisan Sabha. The basic demand of this organisation was the nationalisation of land, waterways, energy, and all sources of wealth and property.","b":false},{"id":344,"c":23,"q":"The Sarabandi Campaign of 1922 was led by","o":[["a","Chittaranjan Das"],["b","Sardar Vallabhbhai Patel"],["c","Rajendra Prasad"],["d","Lala Lajpat Rai"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"After 1928, Bardoli (in Surat district of Gujarat) became a centre of political activities. The ‘Mehta brothers’ of Bardoli (Kalyanji and Kunvarji) and Dayalji Desai started an agitation in support of the peasants from 1928. Later, it was led by Sardar Vallabhbhai Patel. Under Patel’ s leadership, the ‘No-Tax (Sarabandi)’ movement was launched in 1928. It is noteworthy that during the Non-Cooperation Movement, Gandhiji had planned to launch a no-tax (Sarabandi) movement from Bardoli in 1922, but due to the Chauri-Chaura incident, this plan was postponed. The Bihar Public Service Commission has mistakenly written the year of the Sarabandi (no-tax) movement as 1922 instead of 1928, which is incorrect.","b":false},{"id":345,"c":23,"q":"Who successfully led the Bardoli Satyagraha?","o":[["a","Vallabhbhai Patel"],["b","Motilal Nehru"],["c","J. B. Kripalani"],["d","Jawaharlal Nehru"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Re-Exam) (Pre)-2022","y":2022,"e":"After 1928, Bardoli (in Surat district of Gujarat) became a centre of political activities. The ‘Mehta brothers’ of Bardoli (Kalyanji and Kunvarji) and Dayalji Desai started an agitation in support of the peasants from 1928. Later, it was led by Sardar Vallabhbhai Patel. Under Patel’ s leadership, the ‘No-Tax (Sarabandi)’ movement was launched in 1928. It is noteworthy that during the Non-Cooperation Movement, Gandhiji had planned to launch a no-tax (Sarabandi) movement from Bardoli in 1922, but due to the Chauri-Chaura incident, this plan was postponed. The Bihar Public Service Commission has mistakenly written the year of the Sarabandi (no-tax) movement as 1922 instead of 1928, which is incorrect.","b":true},{"id":346,"c":23,"q":"\"A Sannyasi who came to that district after a spell as an indentured labourer in Fiji, carrying a copy of Tulsidas Ramayana on his back from which he would recite verses to rural audience.\" The peasant leader referred to here is","o":[["a","Baba Ram Chandra"],["b","Jhinguri Singh"],["c","Yadunandan Sharma"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"In October, 1920, under the guidance of Baba Ramchandra, the Awadh Kisan Sabha was formally constituted in Pratapgarh district of Uttar Pradesh. The statement given in the question refers to Baba Ramchandra, who came to India after working in Fiji as an indentured labourer and then began to live as an ascetic.","b":false},{"id":347,"c":24,"q":"When was All India Trade Union Congress established in Bombay?","o":[["a","1920"],["b","1925"],["c","1929"],["d","1935"]],"a":"a","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Through the efforts of N.M. Joshi, Joseph Baptista, and Lala Lajpat Rai, the “All India Trade Union Congress”, i.e., the All India Trade Union Congress (AITUC), was established in Bombay on 31 October, 1920. Lala Lajpat Rai was its first President, while Joseph Baptista was the Vice-President and Diwan Chamanlal Bajaj was the General Secretary. The first split in this organisation took place in 1929 at the Nagpur session. At that time, Jawaharlal Nehru was its President.","b":false},{"id":348,"c":24,"q":"All India Trade Union Congress was formed in the year","o":[["a","1920"],["b","1919"],["c","1918"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C Re-Exam 2024","y":2024,"e":"Through the efforts of N.M. Joshi, Joseph Baptista, and Lala Lajpat Rai, the “All India Trade Union Congress”, i.e., the All India Trade Union Congress (AITUC), was established in Bombay on 31 October, 1920. Lala Lajpat Rai was its first President, while Joseph Baptista was the Vice-President and Diwan Chamanlal Bajaj was the General Secretary. The first split in this organisation took place in 1929 at the Nagpur session. At that time, Jawaharlal Nehru was its President.","b":true},{"id":349,"c":24,"q":"The first president of the All India Trade Union Congress was-","o":[["a","Diwan Chamanlal"],["b","Acharya N.G. Ranga"],["c","Swami Sahajanand"],["d","Lala Lajpat Rai"]],"a":"d","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"Through the efforts of N.M. Joshi, Joseph Baptista, and Lala Lajpat Rai, the “All India Trade Union Congress”, i.e., the All India Trade Union Congress (AITUC), was established in Bombay on 31 October, 1920. Lala Lajpat Rai was its first President, while Joseph Baptista was the Vice-President and Diwan Chamanlal Bajaj was the General Secretary. The first split in this organisation took place in 1929 at the Nagpur session. At that time, Jawaharlal Nehru was its President.","b":true},{"id":350,"c":24,"q":"Who was the first President of All India Trade Union Congress?","o":[["a","B.T. Ranade"],["b","Satya Bhakta"],["c","Lala Lajpat Rai"],["d","N.M. Joshi"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre) 2008 · 42nd B.P.S.C. (Pre) 1997-98","y":2008,"e":"Through the efforts of N.M. Joshi, Joseph Baptista, and Lala Lajpat Rai, the “All India Trade Union Congress”, i.e., the All India Trade Union Congress (AITUC), was established in Bombay on 31 October, 1920. Lala Lajpat Rai was its first President, while Joseph Baptista was the Vice-President and Diwan Chamanlal Bajaj was the General Secretary. The first split in this organisation took place in 1929 at the Nagpur session. At that time, Jawaharlal Nehru was its President.","b":true},{"id":351,"c":24,"q":"The Revolutionary phase of the trade union movement in India was:","o":[["a","1939-45"],["b","1926-39"],["c","1918-26"],["d","1914-18"]],"a":"b","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"The revolutionary phase of the trade union movement is considered to be from 1926 to 1939. During this period, M.N. Roy, Muzaffar Ahmad, Shripad A. Dange, Shaukat Usmani, etc. were the major leaders of the trade union movement in India.","b":false},{"id":352,"c":24,"q":"Identify the years closest to the establishment of the Communist Party of India and the Rashtriya Swayamsevak Sangh respectively.","o":[["a","1915,1914"],["b","1925, 1925"],["c","1928, 1925"],["d","1925, 1929"]],"a":"b","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"The Communist Party of India and the Rashtriya Swayamsevak Sangh were founded in 1925 at Kanpur and Nagpur, respectively.","b":false},{"id":353,"c":24,"q":"Who was the first Indian to be the member of Communist International?","o":[["a","M.N. Roy"],["b","Muzaffar Ahmad"],["c","S.A. Dange"],["d","None of the above"]],"a":"a","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"The Communist International (Comintern), also known as the Third International, was established in March, 1919 in Moscow. Vladimir Lenin (Vladimir Ilyich Ulyanov) and the Russian Communist Party (Bolshevik) played a major role in the formation of the Comintern. M.N. Roy went to Moscow on Lenin’ s invitation and became a member of the Communist International. He was the first Indian to become a member of the Communist International.","b":false},{"id":354,"c":25,"q":"When was the Rowlatt Act passed?","o":[["a","1909"],["b","1919"],["c","1930"],["d","1942"]],"a":"b","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"To curb the rising revolutionary activities in India, the government constituted a committee in 1917 under the chairmanship of Justice Sidney Rowlatt, with the objective of preparing an effective plan to suppress terrorism. On the basis of its recommendations, the bill passed in March, 1919 came to be known as the Rowlatt Act. Under the Rowlatt Act, the British government could imprison anyone, without trial, for a maximum of two years. Therefore, this law was called the law of “No appeal, No dalil, No Vakil”.","b":false},{"id":355,"c":25,"q":"Indian National Congress opposed the Rowlatt Act because it aimed-","o":[["a","To limit the individual liberty"],["b","To ban the Indian National Congress"],["c","To enlarge the communal delegations"],["d","To imprison national leaders charging the traitors to the nation"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"The bill passed by the Central Legislative Council in March, 1919 was known as the Rowlatt Act. According to it, the British government could imprison anyone, without trial, for a maximum of two years. This law limited individual liberty.","b":false},{"id":356,"c":25,"q":"During the First WorldWar, which British policy aimed to suppress dissent and reduce civil liberties in India?","o":[["a","Government of India Act"],["b","Simon Commission"],["c","Rowlatt Act"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Rowlatt Act was passed in March, 1919, but its seeds were sown in 1915, when, during the First World War, the repressive Defence of India Act was enforced to curb anti-colonial activities. Hence, option (c) is correct.","b":false},{"id":357,"c":25,"q":"The Jallianwala Bagh Massacre happened in the context of which Gandhian Satyagraha?","o":[["a","Swadeshi Satyagraha"],["b","Rowlatt Satyagraha"],["c","Bardoli Satyagraha"],["d","Individual Satyagraha"],["e","None of the above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Gandhiji’ s first bold step in all-India politics was the satyagraha against the Rowlatt Act. The Rowlatt Act was implemented in March, 1919, against which Gandhiji organised a nationwide strike on 6 April, 1919. At Jallianwala Bagh, on 13 April, 1919, Brigadier General Dyer carried out a brutal massacre during a peaceful public meeting.","b":false},{"id":358,"c":25,"q":"The massacre of the crowd at Jallianwala Bagh at Amritsar took place on:","o":[["a","May 5, 1918"],["b","April 1, 1919"],["c","April 13, 1919"],["d","July 29, 1919"]],"a":"c","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"Gandhiji’ s first bold step in all-India politics was the satyagraha against the Rowlatt Act. The Rowlatt Act was implemented in March, 1919, against which Gandhiji organised a nationwide strike on 6 April, 1919. At Jallianwala Bagh, on 13 April, 1919, Brigadier General Dyer carried out a brutal massacre during a peaceful public meeting.","b":true},{"id":359,"c":25,"q":"The suppression of the crowd at Jallianwala Bagh, Amritsar, took place on—","o":[["a","1 June, 1918"],["b","13 April, 1919"],["c","13 April, 1920"],["d","6 July, 1921"]],"a":"b","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Gandhiji’ s first bold step in all-India politics was the satyagraha against the Rowlatt Act. The Rowlatt Act was implemented in March, 1919, against which Gandhiji organised a nationwide strike on 6 April, 1919. At Jallianwala Bagh, on 13 April, 1919, Brigadier General Dyer carried out a brutal massacre during a peaceful public meeting.","b":true},{"id":360,"c":25,"q":"The year 1919 in Indian history is related to—","o":[["a","Shifting of the capital from Calcutta to Delhi"],["b","Jallianwala Bagh tragedy"],["c","Partition of Bengal"],["d","Khilafat Movement"]],"a":"b","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"Gandhiji’ s first bold step in all-India politics was the satyagraha against the Rowlatt Act. The Rowlatt Act was implemented in March, 1919, against which Gandhiji organised a nationwide strike on 6 April, 1919. At Jallianwala Bagh, on 13 April, 1919, Brigadier General Dyer carried out a brutal massacre during a peaceful public meeting.","b":true},{"id":361,"c":25,"q":"Why did people gather to demonstrate at Jallianwala Bagh?","o":[["a","To protest against the arrest of Gandhi and Lajpat Rai"],["b","To protest against the arrest of Kitchlew and Satyapal"],["c","To offer prayers on the Baisakhi Day"],["d","To protest against the arb it rar i in ess of inhuman acts of the Punjab Government."]],"a":"b","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"In view of the growing opposition to the Rowlatt Act, the government imposed a ban on Gandhiji and some other leaders from entering Punjab. This increased public anger there. The anger grew further when two popular leaders of Punjab—Dr. Satyapal and Dr. Kitchlew—were arrested. To protest this arrest and the Rowlatt Act, people organised a huge meeting at Jallianwala Bagh in Amritsar. In the same garden, on 13 April, 1919, Brigadier General Dyer carried out a brutal massacre during a peaceful public meeting.","b":false},{"id":362,"c":25,"q":"Rabindranath Tagore gave up his 'Knighthood' because of –","o":[["a","Brutal suppression of Civil Disobedience Movement"],["b","Execution of Bhagat Singh"],["c","Jallianwala Bagh Tragedy"],["d","Chauri Chaura Incident"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"After the heart-rending incident of the Jallianwala Bagh massacre on 13 April, 1919, Rabindranath Tagore returned the ‘Knighthood’ title conferred by the British Crown. Tagore said— “The time has come when medals of honour make our shame glaring in the absurd context of humiliation; as for me, I wish to stand by my countrymen, stripped of all special titles.”","b":false},{"id":363,"c":26,"q":"Who viewed the Khilafat Movement as an opportunity for integrating Hindus and Muslims which will not appear again within coming hundred years?","o":[["a","Ali Brothers"],["b","Abul Kalam Azad"],["c","Mahatma Gandhi"],["d","Khan Abdul Ghaffar Khan"]],"a":"c","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"On 23–24 November, 1919, the All-India Khilafat Conference was held in Delhi, and Gandhiji was its president (on 24 November). In December, 1919, the Khilafat Movement received further support at the Amritsar Session of the Indian National Congress. Until then, the Congress had carefully kept itself separate from religious matters; but after the Khilafat Movement began, Gandhiji felt that this was a golden opportunity to unite Hindus and Muslims—an opportunity that might not be available again even in the next hundred years.","b":false},{"id":364,"c":26,"q":"In which city wasthe conference of Khilafat Committee in 1920 held that requested Gandhiji to assume the leadership of Non-Cooperation Movement?","o":[["a","Lucknow"],["b","Lahore"],["c","Allahabad"],["d","Karachi"]],"a":"c","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"Gandhiji advised the Khilafat Committee in 1920 to launch a Non-Cooperation Movement against British rule. In June, 1920, the Khilafat Committee accepted this advice at Allahabad (Now – Prayagraj) and authorised Gandhiji to lead the movement. In September, 1920, at the special session of the Congress held in Calcutta under the leadership of Lala Lajpat Rai, the decision to launch the Non-Cooperation Movement was taken.","b":false},{"id":365,"c":26,"q":"Why did Mahatma Gandhi support the Khilafat Movement?","o":[["a","The Khalifa had given shelter to Indian revolutionaries"],["b","Gandhiji wanted to win the support of the Indian Muslims against the British"],["c","The Khalifa supported Indian struggle for freedom"],["d","The Khalifa was a friend of Gandhiji"]],"a":"b","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"The Khilafat Movement began against the British plan to partition the Turkish (Ottoman) Empire. On 23–24 November, 1919, at the All-India Khilafat Conference held in Delhi, Gandhiji was made the president of the conference on 24 November, 1919. The Khilafat Movement received further momentum from the Amritsar Session of the Indian National Congress in December, 1919. Gandhiji saw it as a golden opportunity for Hindu–Muslim unity—one that might not be available even in the next hundred years. Therefore, he supported the Khilafat Movement to secure the cooperation of Indian Muslims in the struggle against the British.","b":false},{"id":366,"c":26,"q":"Which event served as a catalyst for the Khilafat Movement?","o":[["a","The Treaty of Versailles"],["b","The Partition of Bengal"],["c","The Jallianwala Bagh Massacre"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"BPSC (Tre-3) (July)–2024","y":2024,"e":"The immediate issue of the Khilafat Movement was the fear that, after the First World War, harsh peace terms would be imposed on the Ottoman Empire, and the protection of the position and powers of the Khalifa (Caliph), who was highly respected in the Muslim world. In this context, the Khilafat Committee was formed in Bombay in March, 1919. Supporters of the Khilafat believed that the Allied Powers would deal leniently with the Ottoman Empire; but the humiliating Treaty of Versailles signed by the Allies with Germany in June, 1919 shattered this belief. As a result, the Khilafat Movement intensified in India to protect Turkey’ s holy places and the office of the Khalifa. Although the Treaty of Versailles was not directly related to the Ottoman Empire, it influenced the Khilafat Movement in India by affecting opinions regarding the Khalifa's position and the future of the Ottoman Empire.","b":false},{"id":367,"c":27,"q":"Where did the first instance of organized non-cooperation occur in the history of Indian farmers?","o":[["a","Bihar and Bengal"],["b","Madras Presidency"],["c","Punjab Province"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (9th-10th) 26.08.2023","y":2023,"e":"In the history of Indian peasants, the first example of organized non-cooperation occurred in Bihar and Bengal.","b":false},{"id":368,"c":27,"q":"The Non-Cooperation Movement was started in –","o":[["a","1918"],["b","1919"],["c","1920"],["d","1921"]],"a":"c","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"In September 1920, at the Congress special session held in Calcutta, the resolution related to Non-Cooperation was passed, and it was ratified at the annual Congress session held in Nagpur in December 1920. The formal beginning of the Non-Cooperation Movement under Gandhiji’ s leadership took place on 1 August 1920.","b":false},{"id":369,"c":27,"q":"Gandhiji launched the Non-Cooperation Movement in–","o":[["a","1920"],["b","1919"],["c","1921"],["d","1922"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"In September 1920, at the Congress special session held in Calcutta, the resolution related to Non-Cooperation was passed, and it was ratified at the annual Congress session held in Nagpur in December 1920. The formal beginning of the Non-Cooperation Movement under Gandhiji’ s leadership took place on 1 August 1920.","b":true},{"id":370,"c":27,"q":"After which incident, Mahatma Gandhi had called Non-cooperation Movement as his \"Himalayan Blunder\"?","o":[["a","Chauri Chaura"],["b","Kheda Satyagraha"],["c","Nagpur Satyagraha"],["d","Rajkot Satyagraha"]],"a":"a","s":"56th to 59thB.P.S.C. (Pre) 2014","y":2014,"e":"Chauri-Chaura is a town in Gorakhpur district of Uttar Pradesh. Here, on 4 February 1922, a crowd of protesters set fire to a police outpost of the British administration. According to the Chauri-Chaura Martyrs’ Memorial, a total of 23 policemen were killed in this incident. Gandhiji condemned this incident and described it as a “Himalayan blunder.” On 12 February 1922, in the meeting of the Congress Working Committee held at Bardoli, it was decided to suspend the movement. Regarding his decision to end the movement, Gandhiji wrote in ‘Young India’ that— “To save the movement from turning violent, I am ready to bear every insult, every suffering, complete boycott, and even death.”","b":false},{"id":371,"c":27,"q":"Due to which of the event Mahatma Gandhi halted the Non-Cooperation Movement?","o":[["a","Kakori Case"],["b","Chauri-Chaura incident"],["c","Jallianwala Bagh Massacre"],["d","Muzaffarpur case"]],"a":"b","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"Chauri-Chaura is a town in Gorakhpur district of Uttar Pradesh. Here, on 4 February 1922, a crowd of protesters set fire to a police outpost of the British administration. According to the Chauri-Chaura Martyrs’ Memorial, a total of 23 policemen were killed in this incident. Gandhiji condemned this incident and described it as a “Himalayan blunder.” On 12 February 1922, in the meeting of the Congress Working Committee held at Bardoli, it was decided to suspend the movement. Regarding his decision to end the movement, Gandhiji wrote in ‘Young India’ that— “To save the movement from turning violent, I am ready to bear every insult, every suffering, complete boycott, and even death.”","b":true},{"id":372,"c":27,"q":"The Non-Cooperation Movement was suspended in–","o":[["a","1921"],["b","1922"],["c","1923"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. School Teacher 7.12.2023","y":2023,"e":"Chauri-Chaura is a town in Gorakhpur district of Uttar Pradesh. Here, on 4 February 1922, a crowd of protesters set fire to a police outpost of the British administration. According to the Chauri-Chaura Martyrs’ Memorial, a total of 23 policemen were killed in this incident. Gandhiji condemned this incident and described it as a “Himalayan blunder.” On 12 February 1922, in the meeting of the Congress Working Committee held at Bardoli, it was decided to suspend the movement. Regarding his decision to end the movement, Gandhiji wrote in ‘Young India’ that— “To save the movement from turning violent, I am ready to bear every insult, every suffering, complete boycott, and even death.”","b":true},{"id":373,"c":27,"q":"Indicate the true sequence of events concerning the postponement of Non-cooperation Movement:","o":[["a","1, 2, 3 and 4"],["b","2, 1, 3 and 4"],["c","4, 1, 2 and 3"],["d","2, 1, 4 and 3"]],"a":"a","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"On 4 February 1922, a Congress and Khilafat procession was taken out at Chauri-Chaura (Gorakhpur, Uttar Pradesh). Some policemen misbehaved with them; as a result, a group within the procession attacked the police. The police opened fire, which further enraged the crowd, and the crowd again attacked the police. The policemen ran into the police station, and the crowd set it on fire. After receiving news of this incident, Gandhiji decided to withdraw the movement. In the Congress Working Committee meeting held at Bardoli on 12 February 1922, it was decided to suspend the movement. Taking advantage of this situation, the government arrested him on 10 March 1922 and, on 18 March 1922, sentenced him to six years’ imprisonment. Thus, option (a) is the correct answer.","b":false,"L":["(1) Police firing in Chauri-Chaura","(2) Police station set fired by violent crowd","(3) Postponement of Movement by Gandhiji","(4) Arresting of Gandhiji Select your answer from the following codes –"]},{"id":374,"c":27,"q":"In which state is 'Chauri Chaura', where in February 1922 AD a police station was set on fire?","o":[["a","Rajasthan"],["b","Madhya Pradesh"],["c","Bihar"],["d","Uttar Pradesh"],["e","None of the above/More than one of the above"]],"a":"d","s":"67th B.P.S.C. (Re-Exam) (Pre) 2022","y":2022,"e":"On 4 February 1922, a Congress and Khilafat procession was taken out at Chauri-Chaura (Gorakhpur, Uttar Pradesh). Some policemen misbehaved with them; as a result, a group within the procession attacked the police. The police opened fire, which further enraged the crowd, and the crowd again attacked the police. The policemen ran into the police station, and the crowd set it on fire. After receiving news of this incident, Gandhiji decided to withdraw the movement. In the Congress Working Committee meeting held at Bardoli on 12 February 1922, it was decided to suspend the movement. Taking advantage of this situation, the government arrested him on 10 March 1922 and, on 18 March 1922, sentenced him to six years’ imprisonment. Thus, option (a) is the correct answer.","b":true},{"id":375,"c":27,"q":"Regarding the Non-Cooperation Movement in towns, which of the following statements are NOT correct?","o":[["a","Only (1) and (2)"],["b","Only (1) and (3)"],["c","Only (2) and (3)"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"The Non-Cooperation Movement was formally launched on 1 August 1920. In it, thousands of students left government-controlled schools, headmasters and teachers submitted resignation letters, and lawyers gave up their legal practice. It is noteworthy that people from both urban and rural areas participated in this movement, and it was the largest mass movement of the freedom struggle up to that time. In the council elections held then, the Justice Party of Madras participated and won 63 seats.","b":false,"L":["(1)⦙Only the upper castes and the rich participated in the movement.","(2)⦙The Justice Party of Madras also boycotted the council elections.","(3)⦙Thousands of students left government-controlled schools; headmasters and teachers resigned; and lawyers gave up their practice."]},{"id":376,"c":27,"q":"Whichof the following statements regarding the Indian freedom struggle is not correct?","o":[["a","Mahatma Gandhi was arrested in the year 1921."],["b","Gandhiji withdrew from the Non- Cooperation Movement due to the Chauri-Chaura Incident."],["c","Gandhiji gave his first major public speech at Banaras Hindu University."],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"The Non-Cooperation Movement was formally launched on 1 August 1920. Due to the Chauri-Chaura incident on 4 February 1922, the Congress Working Committee, in its meeting held at Bardoli on 12 February 1922, decided to suspend the movement. Thereafter, on 10 March 1922, Mahatma Gandhi was arrested. Gandhiji delivered his first major public speech at the Banaras Hindu University.","b":false},{"id":377,"c":28,"q":"What was the purpose for which C.R. Das and Motilal Nehru formed the Swaraj Party within the Congress?","o":[["a","To lead the struggle of the general public"],["b","To strengthen Hindu-Muslim unity"],["c","To participate in elections to the State Councils"],["d","For legislative opposition against the Rowlatt Act"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"On 31 December 1922, in a meeting held at the residence of the Maharaja of Tikari in Gaya, the formation of a new party within the Congress—‘Congress-Khilafat Swaraj Party’ was announced. In 1923, the ‘Congress-Khilafat Swaraj Party’ (Swaraj Party) was formed, and from 20–22 February 1923, the general meeting of this newly formed party was held in Allahabad (present-day Prayagraj). In this meeting, the party’ s programme and constitution were approved and the party was given the new name ‘Swaraj Party’. C.R. Das became its President and Motilal Nehru became its General Secretary. This party was formed with the objective of contesting council elections while remaining within the Congress. It also participated in the elections to the State Councils as well as the Central Legislative Council and achieved good success. Their real aim was to enter these assemblies, present their views, and practise non-cooperation with the government from within. The Swaraj Party was established after the failure of the Non-Cooperation Movement.","b":false},{"id":378,"c":28,"q":"Swaraj Party was formed following the failure of:","o":[["a","Non-Cooperation Movement"],["b","Civil Disobedience Movement"],["c","Rowlatt Bill Satyagraha"],["d","Champaran Satyagraha"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"On 31 December 1922, in a meeting held at the residence of the Maharaja of Tikari in Gaya, the formation of a new party within the Congress—‘Congress-Khilafat Swaraj Party’ was announced. In 1923, the ‘Congress-Khilafat Swaraj Party’ (Swaraj Party) was formed, and from 20–22 February 1923, the general meeting of this newly formed party was held in Allahabad (present-day Prayagraj). In this meeting, the party’ s programme and constitution were approved and the party was given the new name ‘Swaraj Party’. C.R. Das became its President and Motilal Nehru became its General Secretary. This party was formed with the objective of contesting council elections while remaining within the Congress. It also participated in the elections to the State Councils as well as the Central Legislative Council and achieved good success. Their real aim was to enter these assemblies, present their views, and practise non-cooperation with the government from within. The Swaraj Party was established after the failure of the Non-Cooperation Movement.","b":true},{"id":379,"c":28,"q":"Swaraj Party was formed after the failure of the:","o":[["a","Non-Cooperation Movement"],["b","Quit India Movement"],["c","Civil Disobedience Movement"],["d","Swadeshi Movement"]],"a":"a","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"On 31 December 1922, in a meeting held at the residence of the Maharaja of Tikari in Gaya, the formation of a new party within the Congress—‘Congress-Khilafat Swaraj Party’ was announced. In 1923, the ‘Congress-Khilafat Swaraj Party’ (Swaraj Party) was formed, and from 20–22 February 1923, the general meeting of this newly formed party was held in Allahabad (present-day Prayagraj). In this meeting, the party’ s programme and constitution were approved and the party was given the new name ‘Swaraj Party’. C.R. Das became its President and Motilal Nehru became its General Secretary. This party was formed with the objective of contesting council elections while remaining within the Congress. It also participated in the elections to the State Councils as well as the Central Legislative Council and achieved good success. Their real aim was to enter these assemblies,
