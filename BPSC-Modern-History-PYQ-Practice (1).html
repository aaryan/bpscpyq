a 15-member Council of India was established. The then Governor-General, Lord Canning, was made the first Viceroy of India.","b":false},{"id":75,"c":5,"q":"Which of the following dates was Queen Victoria's proclamation issued?","o":[["a","November 1, 1857"],["b","March 27, 1858"],["c","November 1, 1858"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. Teacher (11th-12th) 15-12-2023","y":2023,"e":"After the suppression of the Revolt of 1857, on 1 November, 1858, Queen Victoria declared that Indian administration would be taken under the control of the British Crown. After this proclamation, Company rule in India ended and India was brought directly under the British Crown. The post of Secretary of State for India (also called India Secretary) was created, and to assist him a 15-member Council of India was established. The then Governor-General, Lord Canning, was made the first Viceroy of India.","b":true},{"id":76,"c":5,"q":"After the revolt of 1857, the British recruited the Soldiers from the","o":[["a","Brahmins of U.P. & Bihar"],["b","Bengalis and Oriyas from the East"],["c","Gurkhas, Sikhs, and Punjabis in the North"],["d","Madras Presidency and Marathas"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"After the Revolt of 1857, the British government shifted recruitment away from the high-caste Hindus of Bengal, Bihar and Awadh, and selected people whom the British called “martial races,” especially Dogras, Jats, Rajputs, Baluchis, Garhwalis, Gorkhas, Sikhs and people from the northern provinces of Punjab. The soldiers from Uttar Pradesh and Bihar had played an important role in igniting the revolt of 1857, so the British government looked at them with suspicion. During the revolt, 60% of the soldiers of the Bengal Army were from Awadh and the North-Western Provinces (U.P.). For this reason, under Queen Victoria’ s Proclamation dated 1 November, 1858, the army was reorganized, which was based on the policy of division and inducement.","b":false},{"id":77,"c":5,"q":"Who called the revolt of 1857 a conspiracy?","o":[["a","Sir James Outram and W. Taylor"],["b","Sir John K."],["c","Sir John Lawrence"],["d","T.R. Holmes"]],"a":"a","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"Sir James Outram and W. Taylor described the Revolt of 1857 as the result of a Hindu–Muslim conspiracy. Outram believed that it was a Muslim conspiracy in which advantage was taken of Hindu grievances. According to John Lawrence and Seeley, it was only a military mutiny. According to Sir John Seeley, the Revolt of 1857 was a completely unpatriotic and selfish military mutiny, in which there was no local leadership and it did not receive the support of the general public. According to him, it was a revolt of the Indian army against an established government.","b":false},{"id":78,"c":5,"q":"The Uprising of 1857 was described as the 'First Indian War of Independence'?","o":[["a","V.D. Savarkar"],["b","Bal Gangadhar Tilak"],["c","R. C. Mazumdar"],["d","Dadabhai Naoroji"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Pre) 2022 · B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"In his book ‘The Indian War of Independence 1857’, V.D. Savarkar described the Revolt of 1857 as an organized war of independence and termed it the First Indian War of Independence.","b":false},{"id":79,"c":5,"q":"Who described the revolt of 1857 as the 'First Indian War of Independence'?","o":[["a","V. D. Savarkar"],["b","Bal Gangadhar Tilak"],["c","Bipin Chandra Pal"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C.f Teacher (9th-10th) 26.08.2023","y":2023,"e":"In his book ‘The Indian War of Independence 1857’, V.D. Savarkar described the Revolt of 1857 as an organized war of independence and termed it the First Indian War of Independence.","b":true},{"id":80,"c":5,"q":"Who first described the Revolt of 1857 as the 'First Indian War of Independence'?","o":[["a","V. D. Savarkar"],["b","Bal Gangadhar Tilak"],["c","R. C. Majumdar"],["d","None of the above"]],"a":"a","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"In his book ‘The Indian War of Independence 1857’, V.D. Savarkar described the Revolt of 1857 as an organized war of independence and termed it the First Indian War of Independence.","b":true},{"id":81,"c":5,"q":"Which one of the following commissions is associated with the Army Reorganization after the suppression of the Revolt of 1857?","o":[["a","Public Service Commission"],["b","Peel Commission"],["c","Hunter Commission"],["d","Simon Commission"]],"a":"b","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"After the suppression of the Revolt of 1857, the British government appointed the Peel Commission for the reorganization of the Indian army. It recommended adopting the principle of keeping different castes and communities mixed within the regiments. The number of European soldiers, which was 45,000 before 1857, was increased to 65,000, and the number of Indian soldiers was reduced from 238,000 to 140,000. In Bengal, the ratio of European soldiers to Indian soldiers was kept at 1:2, whereas in Madras and Bombay this ratio was kept at 1:3.","b":false},{"id":82,"c":5,"q":"Who said that \"The event of 1857 started as a religious conflict and ended as a freedom struggle\"?","o":[["a","Dr. S.N. Sen"],["b","Ashok Mehta"],["c","V.D. Savarkar"],["d","Dr. R.C. Majumdar"],["e","None of the above/More than one of the above"]],"a":"a","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"According to Dr. S. N. Sen, “The event of 1857 started a religious conflict and ended as a freedom struggle.”","b":false},{"id":83,"c":5,"q":"Match List -I of leaders with List -II of their territory","o":[["a","iv i ii iii"],["b","ii i iii iv"],["c","iii iv ii i"],["d","None of the above"]],"a":"c","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"The correct matching of List-I (heroes of the Revolt of 1857) and List-II (their area of activity) is as follows— List-I List-II Kunwar Singh Jagdishpur Hazrat Mahal Lucknow Khan Bahadur Bareilly Maulvi Ahmadullah Faizabad","b":false,"L":["⦚List - I⦙⦙List - II","(A)⦙Kunwar Singh⦙⦙(i)⦙Faizabad","(B)⦙Hazrat Mahal⦙⦙(ii)⦙Bareilly","(C)⦙Khan Bahadur⦙⦙(iii) Jagdishpur","(D) Maulvi Ahmadullah⦙(iv) Lucknow"],"n":"and select answer from the code given below:"},{"id":84,"c":6,"q":"The Indigo Rebellion was about:","o":[["a","the peasant not wanting to grow indigo but being forced"],["b","the peasant wanting to grow indigo but being forced not to"],["c","the peasant not wanting to grow indigo but being forced to grow at a price that was unacceptable"],["d","a protest movement that carried an indigo-coloured flag"],["e","None of the above/More than one of the above"]],"a":"c","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The Indigo Revolt began from Govindpur village in Nadia district of Bengal. Under the leadership of two former employees of an indigo planter—Digambar Biswas and Vishnu Biswas (Vishnu charan Biswas)—the peasants united there and stopped cultivating indigo. This was the most widespread and militant revolt in the history of indigo movements in terms of demands. The Indigo Revolt of Bengal was the peasants’ direct struggle against exploitation. The cultivators of Bengal who wanted to grow rice in their fields were forced by European indigo planters to cultivate indigo. Those who refused indigo cultivation had to face the oppressive machinery of the planters. In March 1859, thousands of raiyats in Bengal refused to cultivate indigo. As the revolt spread, the raiyats also refused to pay rent to the planters. By 1860, the indigo movement spread to Nadia, Pabna, Khulna, Dhaka, Malda, Dinajpur, etc. Due to the unity of the peasants, by 1860 almost all indigo factories in Bengal were closed. The intellectual class of Bengal expressed support for this revolt through newspaper articles and public meetings. The editor of “Hindu Patriot,” Harishchandra Mukherjee, played a special role in it. The atrocities of indigo planters were vividly portrayed by Dinabandhu Mitra in his play “Neel Darpan.”","b":false},{"id":85,"c":6,"q":"Who among the following was a leader of the Indigo Revolt?","o":[["a","Budhu Bhagat and Jhindari Monak"],["b","Digambar Biswas and Bis hnu charan Biswas"],["c","Dinabandhu Mitra and Madhusudan Dutt"],["d","Birsa Munda and Gaya Munda"]],"a":"b","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The Indigo Revolt began from Govindpur village in Nadia district of Bengal. Under the leadership of two former employees of an indigo planter—Digambar Biswas and Vishnu Biswas (Vishnu charan Biswas)—the peasants united there and stopped cultivating indigo. This was the most widespread and militant revolt in the history of indigo movements in terms of demands. The Indigo Revolt of Bengal was the peasants’ direct struggle against exploitation. The cultivators of Bengal who wanted to grow rice in their fields were forced by European indigo planters to cultivate indigo. Those who refused indigo cultivation had to face the oppressive machinery of the planters. In March 1859, thousands of raiyats in Bengal refused to cultivate indigo. As the revolt spread, the raiyats also refused to pay rent to the planters. By 1860, the indigo movement spread to Nadia, Pabna, Khulna, Dhaka, Malda, Dinajpur, etc. Due to the unity of the peasants, by 1860 almost all indigo factories in Bengal were closed. The intellectual class of Bengal expressed support for this revolt through newspaper articles and public meetings. The editor of “Hindu Patriot,” Harishchandra Mukherjee, played a special role in it. The atrocities of indigo planters were vividly portrayed by Dinabandhu Mitra in his play “Neel Darpan.”","b":true},{"id":86,"c":6,"q":"Who wrote the famous play 'Nil Darpan', which depicts the oppression of indigo farmers?","o":[["a","Shar at chandra Chatterjee"],["b","Rabindranath Tagore"],["c","Barin Ghosh"],["d","Dinabandhu Mitra"],["e","None of the above"]],"a":"d","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"The Indigo Revolt began from Govindpur village in Nadia district of Bengal. Under the leadership of two former employees of an indigo planter—Digambar Biswas and Vishnu Biswas (Vishnu charan Biswas)—the peasants united there and stopped cultivating indigo. This was the most widespread and militant revolt in the history of indigo movements in terms of demands. The Indigo Revolt of Bengal was the peasants’ direct struggle against exploitation. The cultivators of Bengal who wanted to grow rice in their fields were forced by European indigo planters to cultivate indigo. Those who refused indigo cultivation had to face the oppressive machinery of the planters. In March 1859, thousands of raiyats in Bengal refused to cultivate indigo. As the revolt spread, the raiyats also refused to pay rent to the planters. By 1860, the indigo movement spread to Nadia, Pabna, Khulna, Dhaka, Malda, Dinajpur, etc. Due to the unity of the peasants, by 1860 almost all indigo factories in Bengal were closed. The intellectual class of Bengal expressed support for this revolt through newspaper articles and public meetings. The editor of “Hindu Patriot,” Harishchandra Mukherjee, played a special role in it. The atrocities of indigo planters were vividly portrayed by Dinabandhu Mitra in his play “Neel Darpan.”","b":true},{"id":87,"c":6,"q":"Who is the author of ‘Neel Darpan’ a book written on the miserable condition of indigo farmers?","o":[["a","Bankim Chandra Chatterji"],["b","Dinabandhu Mitra"],["c","Sharat Chandra Chatterji"],["d","Rabindranath Tagore"]],"a":"b","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"The Indigo Revolt began from Govindpur village in Nadia district of Bengal. Under the leadership of two former employees of an indigo planter—Digambar Biswas and Vishnu Biswas (Vishnu charan Biswas)—the peasants united there and stopped cultivating indigo. This was the most widespread and militant revolt in the history of indigo movements in terms of demands. The Indigo Revolt of Bengal was the peasants’ direct struggle against exploitation. The cultivators of Bengal who wanted to grow rice in their fields were forced by European indigo planters to cultivate indigo. Those who refused indigo cultivation had to face the oppressive machinery of the planters. In March 1859, thousands of raiyats in Bengal refused to cultivate indigo. As the revolt spread, the raiyats also refused to pay rent to the planters. By 1860, the indigo movement spread to Nadia, Pabna, Khulna, Dhaka, Malda, Dinajpur, etc. Due to the unity of the peasants, by 1860 almost all indigo factories in Bengal were closed. The intellectual class of Bengal expressed support for this revolt through newspaper articles and public meetings. The editor of “Hindu Patriot,” Harishchandra Mukherjee, played a special role in it. The atrocities of indigo planters were vividly portrayed by Dinabandhu Mitra in his play “Neel Darpan.”","b":true},{"id":88,"c":6,"q":"Who wrote the play Neel Darpan describing the plight of the Indigo cultivators of Bengal and Bihar?","o":[["a","Mahatma Gandhi"],["b","Acharya Kripalani"],["c","Dinabandhu Mitra"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. School Teacher · Headmaster 10-12-2023","y":2023,"e":"The Indigo Revolt began from Govindpur village in Nadia district of Bengal. Under the leadership of two former employees of an indigo planter—Digambar Biswas and Vishnu Biswas (Vishnu charan Biswas)—the peasants united there and stopped cultivating indigo. This was the most widespread and militant revolt in the history of indigo movements in terms of demands. The Indigo Revolt of Bengal was the peasants’ direct struggle against exploitation. The cultivators of Bengal who wanted to grow rice in their fields were forced by European indigo planters to cultivate indigo. Those who refused indigo cultivation had to face the oppressive machinery of the planters. In March 1859, thousands of raiyats in Bengal refused to cultivate indigo. As the revolt spread, the raiyats also refused to pay rent to the planters. By 1860, the indigo movement spread to Nadia, Pabna, Khulna, Dhaka, Malda, Dinajpur, etc. Due to the unity of the peasants, by 1860 almost all indigo factories in Bengal were closed. The intellectual class of Bengal expressed support for this revolt through newspaper articles and public meetings. The editor of “Hindu Patriot,” Harishchandra Mukherjee, played a special role in it. The atrocities of indigo planters were vividly portrayed by Dinabandhu Mitra in his play “Neel Darpan.”","b":true},{"id":89,"c":6,"q":"Which rebellion is mentioned in Bankim Chandra Chatterjee's novel, Anandamath?","o":[["a","Sannyasi"],["b","Pag alp an thi"],["c","Neel"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"The plot of Bankim Chandra Chatterjee’ s work ‘Anandamath’ is based on the Sannyasi Revolt. The song ‘Vande Mataram’ was published in the book ‘Anandamath’; it was composed against the backdrop of the Sannyasi Revolt.","b":false},{"id":90,"c":6,"q":"Which rebellion is mentioned in Bankim Chandra Chattopadhyay's Anandamath?","o":[["a","Sanyasi"],["b","Santhal"],["c","Indigo"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (11th-12th) 26.08.2023","y":2023,"e":"The plot of Bankim Chandra Chatterjee’ s work ‘Anandamath’ is based on the Sannyasi Revolt. The song ‘Vande Mataram’ was published in the book ‘Anandamath’; it was composed against the backdrop of the Sannyasi Revolt.","b":true},{"id":91,"c":6,"q":"Which rebellion is mentioned in Bankim Chandra Chatterjee's 'Anand Math'?","o":[["a","Sannyasi"],["b","Kuka"],["c","Santhal"],["d","Neel"],["e","None of the above"]],"a":"a","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"The plot of Bankim Chandra Chatterjee’ s work ‘Anandamath’ is based on the Sannyasi Revolt. The song ‘Vande Mataram’ was published in the book ‘Anandamath’; it was composed against the backdrop of the Sannyasi Revolt.","b":true},{"id":92,"c":6,"q":"Who founded Ramosi KrishakJatha in Maharashtra?","o":[["a","Justice Ranade"],["b","Gopal Krishna Gokhale"],["c","Vasudev Balwant Phadke"],["d","Jyotiba Phule"]],"a":"c","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"Among the early revolutionaries, the prominent leader Vasudev Balwant Phadke (1845–1883) organized the people of the Ramosi tribe in the Bombay Presidency and trained them, turning them into a disciplined fighting force. He was sentenced to transportation for life, and he died in 1883 after a hunger strike until death (In some sources, the cause of their death is started to be T.B.).","b":false},{"id":93,"c":6,"q":"The correct geographical location for the Ramosi Uprising was –","o":[["a","Western India"],["b","Eastern Ghats"],["c","Eastern India"],["d","Western Ghats"]],"a":"d","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"The people of the Ramosi tribe, living in the Western Ghats, carried out the Ramosi Revolt in 1822 under the leadership of Sardar Chittur Singh. The Ramosis looted areas around Satara and also attacked forts. In 1825–26, due to a severe famine and food shortage, they again revolted under the leadership of Umaji Naik.","b":false},{"id":94,"c":6,"q":"The Waghera Uprising happened in –","o":[["a","Surat"],["b","Poona"],["c","Calicut"],["d","Baroda"]],"a":"d","s":"56th to 59th B.P.S.C. (Pre) 2015","y":2015,"e":"The Waghera Revolt was carried out against the British government in 1818. It took place in Baroda. The Gaekwads of Baroda, with the help of the British army, tried to collect higher taxes from the Bagheras, due to which the Waghera chiefs revolted. They also attacked British territories during 1818–1819. This revolt ended around 1820.","b":false},{"id":95,"c":6,"q":"Who founded the ‘Pagal Panth’?","o":[["a","Bulleh Shah"],["b","Karam Shah"],["c","Yaduvendra Singh"],["d","Swami Sahajananda"]],"a":"b","s":"56th to 59th B.P.S.C. (Pre) 2015","y":2015,"e":"The Pagal Panth was a semi-religious sect initiated by Karam/ Karim Shah. In reality, it was a revolt associated with the Garo tribe. The Pag alp an thi revolt mainly spread in the Sherpur and Mymensingh regions of Bengal (located in present-day Bangladesh). Shah’ s son and successor Titu (Tipu) was driven by religious and political objectives. He led a movement against the atrocities committed by zamindars on tenants (muzaras). In 1825, Titu captured Sherpur and declared himself king. He became so powerful that he began exercising independent authority, and to run the administration he appointed a judge, a magistrate, and a collector.","b":false},{"id":96,"c":6,"q":"Trace the tribe that rebelled against Britishers because human sacrifice system was banned –","o":[["a","Kuki"],["b","Khond"],["c","Oraon"],["d","Nackda"]],"a":"b","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"The Khond tribal people lived in a vast hilly belt stretching from Tamil Nadu to Bengal and Central India. Because it was a hilly region, they were largely independent. They revolted against the British during 1846–1855 (the movement continued even before and after this period; this phase is mainly associated with the leadership of Chakra Bisoi) in the name of a young king. The main causes of the revolt were the British government’ s attempts to ban human sacrifice (Meriah), the imposition of new taxes, and the entry of zamindars and moneylenders into many areas, which caused immense suffering to the tribals. The British formed a Meriah Agency, against which the Khonds rebelled.","b":false},{"id":97,"c":6,"q":"Which tribal leader was involved in the tribal rebellion against the British authorities inthe Garo Hills region of present-day Meghalaya in the late 19th century?","o":[["a","Jadunath Sharma"],["b","Tike ndr ajit Singh"],["c","Rani Gaidinliu"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"Pa Togan Sangma (also known as Pa Tongon Nengminja Sangma) was a Garo tribal leader who revolted against British officers in the present-day Garo Hills region of Meghalaya in the late 19th century. He attained martyrdom in December 1872, fighting with exceptional bravery and courage.","b":false},{"id":98,"c":6,"q":"Who opposed the exploitative powers against the new system of tax?","o":[["a","The tribes of Khandesh in 1856"],["b","The Santhals of Bihar in 1855-56"],["c","In 1850, the tribes of Chotanagpur"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Santhals of Bihar opposed the exploitative forces under the new tax system imposed by the British in 1855–56. The main causes of the Santhal Rebellion were heavy taxes, exploitation by moneylenders, interference by zamindars, and the colonial administration/revenue system. This revolt represented the struggle of marginalized communities against colonial exploitation and oppression.","b":false},{"id":99,"c":6,"q":"Kol Mutiny of 1831 under Buddhu Bhagat took place in which of the following regions?","o":[["a","Kutch"],["b","Singhbhum"],["c","Western Ghats"],["d","Satara"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"In 1831, under the leadership of Buddhu Bhagat, the Kol Rebellion took place in the Chotanagpur region in the areas of Singhbhum, Palamu, Hazaribagh, and Manbhum. The nature of this rebellion was economic as well as political. The most important reason for the growth of this rebellion was the excessive increase in land tax by the zamindars of these areas. After the death of Buddhu Bhagat in 1832, this rebellion was led by Ganga Narayan from 1832 to 1833.","b":false},{"id":100,"c":6,"q":"The Hoz revolt took place during –","o":[["a","1620 - 21"],["b","1720 - 21"],["c","1820 - 21"],["d","1920 - 21"]],"a":"c","s":"43rd B.P.S.C. (Pre) 1994","y":1994,"e":"The Hoz Rebellion took place in 1820-21, and its centre was the present-day West Singhbhum district of Jharkhand state.","b":false},{"id":101,"c":6,"q":"The 'Tana Bhagat Movement' is related to -","o":[["a","From dalit movement"],["b","From tribal movement"],["c","From farmer's movement"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"The Tana Bhagat Movement was a tribal movement. This movement began in the Chotanagpur region (presently located in the state of Jharkhand) in the year 1914. This movement was led by Jatra Bhagat and Turiya Bhagat. It is also known as the Oraon Tana Bhagat Movement.","b":false},{"id":102,"c":6,"q":"The Tana Bhagat Movement, a non violent movement against British rule, originated among the tribal communities of which Indian State?","o":[["a","Uttar Pradesh"],["b","Kerala"],["c","Jharkhand"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. T.R.E.-3 July –2024","y":2024,"e":"The Tana Bhagat Movement was a non-violent movement against British rule, which originated among the Oraon community of the Indian state of Jharkhand. Initially, it was religious in nature, but gradually its objective became political.","b":false},{"id":103,"c":6,"q":"Which of the following events happened first?","o":[["a","Santhal Rebellion"],["b","Birsa Munda's Rebellion"],["c","Tana Bhagat Movement"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"Santhal Rebellion 1855-56 Birsa Munda Rebellion 1899-1900 Tana Bhagat Movement Began in 1914 Therefore, option (a) is the correct answer.","b":false},{"id":104,"c":6,"q":"Kuka Movement was organized by –","o":[["a","Guru Ram Das"],["b","Guru Nanak"],["c","Guru Ram Singh"],["d","Guru Gobind Singh"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"The Kuka Movement was largely similar to the Wahabi Movement. Both began as religious movements, but later turned into political movements, with the common objective of driving the British out of the country. In Western Punjab, the Kuka Movement was started in the 1840s by Bhagat Jawahar Mal, who was mainly known as Sian Sahib. His objective was to remove the evils and superstitions prevalent in Sikhism and purify this religion. However, later it turned into a political movement, led by Ram Singh. In 1872, the leader of this movement, Ram Singh, was exiled to Rangoon (Myanmar), and he died in Magui (Myanmar) in 1885.","b":false},{"id":105,"c":6,"q":"What wasthe initial objective of the 'Kuka Movement' in Punjab?","o":[["a","To Purify Sikhism"],["b","To gain political power in Punjab"],["c","Organizing the peasant movement"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (9th-10th) 26.08.2023","y":2023,"e":"The Kuka Movement was largely similar to the Wahabi Movement. Both began as religious movements, but later turned into political movements, with the common objective of driving the British out of the country. In Western Punjab, the Kuka Movement was started in the 1840s by Bhagat Jawahar Mal, who was mainly known as Sian Sahib. His objective was to remove the evils and superstitions prevalent in Sikhism and purify this religion. However, later it turned into a political movement, led by Ram Singh. In 1872, the leader of this movement, Ram Singh, was exiled to Rangoon (Myanmar), and he died in Magui (Myanmar) in 1885.","b":true},{"id":106,"c":6,"q":"The Moplah Movement of 1921 was a branch of the —","o":[["a","Khilafat Movement"],["b","Revolt of 1857"],["c","Swadeshi Movement"],["d","Non-Cooperation Movement"]],"a":"a","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"The movement of the Moplah (Mappila) tenants of Malabar in the Kerala province was mainly related to rent and eviction. The zamindars evicted them from the land whenever they wished and collected arbitrary rent as they pleased. The Khilafat Movement was also taking root. The situation became such that it was difficult to differentiate between meetings of the Khilafat Movement and those of the tenants. In this way, both movements merged into each other.","b":false},{"id":107,"c":6,"q":"Moplah revolt of 1921 took place in:","o":[["a","Kashmir"],["b","Punjab"],["c","Kerala"],["d","Assam"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"The movement of the Moplah (Mappila) tenants of Malabar in the Kerala province was mainly related to rent and eviction. The zamindars evicted them from the land whenever they wished and collected arbitrary rent as they pleased. The Khilafat Movement was also taking root. The situation became such that it was difficult to differentiate between meetings of the Khilafat Movement and those of the tenants. In this way, both movements merged into each other.","b":true},{"id":108,"c":6,"q":"The Moplah Rebellion of 1921 broke out in -","o":[["a","Assam"],["b","Kerala"],["c","Punjab"],["d","Bengal"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"The movement of the Moplah (Mappila) tenants of Malabar in the Kerala province was mainly related to rent and eviction. The zamindars evicted them from the land whenever they wished and collected arbitrary rent as they pleased. The Khilafat Movement was also taking root. The situation became such that it was difficult to differentiate between meetings of the Khilafat Movement and those of the tenants. In this way, both movements merged into each other.","b":true},{"id":109,"c":6,"q":"The Tebhaga Movement was started in 1946 from Bengal under the leadership of:","o":[["a","Muslim League"],["b","Kisan Sabha"],["c","Indian National Congress"],["d","Trade Union"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"The Tebhaga Movement (1946–47) was a famous peasant movement of Bengal. Under it, peasants began a struggle to reduce the rent rate to one-third in accordance with the recommendations of the ‘Floud Commission’. This movement, fought under the leadership of the Bengal Provincial Kisan Sabha (BPKS), was a movement of sharecroppers against the jotedars.","b":false},{"id":110,"c":6,"q":"The Tebhaga movement in Bengal during the 1940s demanded","o":[["a","Complete abolition of the Zamindari System"],["b","Redistribution of surplus land among landless farmers"],["c","One-third of the crop will be given to the sharecroppers."],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"In the 1940s, the Tebhaga Movement began in Bengal. At that time, farmers had to give half the share to the sharecroppers, whereas the peasants ran the Tebhaga Movement to give only one-third of the crop share.","b":false},{"id":111,"c":7,"q":"Consider the following statements regarding Wood’ s Dispatch of 1854:","o":[["a","Only 1"],["b","Only 2"],["c","Both 1 and 2"],["d","Neither 1 nor 2"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"In 1854, the Court of Directors of the East India Company in London sent a note to the Governor-General of India, Lord Dalhousie, on the subject of education. In response, Charles Wood, the President of the Board of Control, issued a policy document in July 1854, which is known as ‘Wood’ s Despatch’ or ‘Wood’ s policy document/charter’. This charter prepared a comprehensive plan for future education in India, and it is called the ‘Magna Carta’ of English education in India. Wood’ s Despatch made the following recommendations— (i) Emphasis was laid on imparting higher education through the medium of the English language; however, importance was also given to the development of vernacular (native) languages. (ii) It recommended women’ s education and vocational training. (iv) Establishment of one university each in the three Presidencies (Calcutta, Bombay, and Madras) on the model of the University of London. (v) Establishment of teacher training institutions for the training of teachers. Therefore, the required answer will be option (c).","b":false,"L":["1. It recommended English as the medium of instruction for higher studies.","2. It laid stress on female education and vocational training. Which of the above statements is/are correct?"]},{"id":112,"c":7,"q":"Whendid Macaulay issue his famous minute on Indian Education?","o":[["a","12 February 1835"],["b","12 February 1836"],["c","02 February 1835"],["d","01 February 1835"]],"a":"c","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"To resolve the Orientalist–Western controversy over the medium of education in India, William Bentinck appointed Macaulay (a law member in his Council) in 1834 as the head of the General Committee of Public Instruction. His task was to present a decision on the language dispute. Macaulay submitted his memorandum/minute on 2 February 1835, in which he sharply criticized Indian languages and literature. Accepting the main recommendations of Macaulay’ s Minute, Governor-General Bentinck issued a resolution on 7 March 1835, making English the medium of higher education in India.","b":false},{"id":113,"c":7,"q":"Who said, \"A single shelf of a good European library was worth the whole native literature of India and Arabia\"?","o":[["a","T.B. Macaulay"],["b","Dr. William Carey"],["c","Lord Minto"],["d","Charles Grant"],["e","None of the above/More than one of the above"]],"a":"a","s":"B.P.S.C. CDPO (Pre) 2018","y":2018,"e":"The foundation of the modern education system in India was laid by Macaulay’ s Minute (1835). Macaulay believed that “a single shelf in a good European library was worth the whole native literature of India and Arabia.” Ignoring Indian culture, he described it as a “storehouse of superstitions.” He wanted to spread Western education among Indians and create a group that would be Indian in colour and blood, but English in thought, taste, and intellect.","b":false},{"id":114,"c":7,"q":"The foundation of the modern education system in India was laid in -","o":[["a","Charter Act of 1813"],["b","Macaulay's Minute of 1835"],["c","Wood's Dispatch of 1854"],["d","Hunter Commission of 1882"]],"a":"b","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The foundation of the modern education system in India was laid by Macaulay’ s Minute (1835). Macaulay believed that “a single shelf in a good European library was worth the whole native literature of India and Arabia.” Ignoring Indian culture, he described it as a “storehouse of superstitions.” He wanted to spread Western education among Indians and create a group that would be Indian in colour and blood, but English in thought, taste, and intellect.","b":true},{"id":115,"c":7,"q":"To what was Wood's Dispatch of 1854 related?","o":[["a","Modern education"],["b","Establishment of universities in India"],["c","Social reform"],["d","More than one of the above"],["e","None of the above"]],"a":"d","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Wood’ s Despatch (1854) is called the “Magna Carta of Indian Education.” It emphasized modern education. It made provision for establishing universities in the three Presidency towns—Bombay, Calcutta, and Madras—on the pattern of the University of London. It also recommended setting up a Department of Public Instruction in each province. Therefore, option (d) is correct.","b":false},{"id":116,"c":7,"q":"In which year was Banaras Hindu University established?","o":[["a","1910"],["b","1916"],["c","1920"],["d","1921"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"Banaras Hindu University was established in 1916 by Pandit Madan Mohan Malaviya. It was established under a legislative enactment, the B.H.U. Act, 1915.","b":false},{"id":117,"c":7,"q":"In 1902, Lord Curzon appointed the University Commission including two Indian members.Who were they?","o":[["a","Bal Gangadhar Tilak and Surendranath Banerjee"],["b","Gopal Krishna Gokhale and Rashbehari Bose"],["c","Syed Hussain Bilgrami and Surendranath Banerjee"],["d","Syed Hussain Bilgrami & Justice Gurudas Banerjee"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"Viceroy Lord Curzon, as part of educational reforms, constituted a University Commission in 1902 under the chairmanship of Sir Thomas Raleigh. Two Indian members— Syed Hussain Bilgrami and Justice Gurudas Banerjee— were appointed to this commission. On the basis of the commission’ s recommendations, the “Indian Universities Act, 1904” was passed.","b":false},{"id":118,"c":7,"q":"________ passed the Indian Universities Act in 1904, implementing strict controls on Indian universities.","o":[["a","Lord Dufferin"],["b","Lord Curzon"],["c","Lord Simon"],["d","Lord Robertson"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"Lord Curzon was the Viceroy of India from 1899 to 1905. During his tenure, to carry out educational reforms, he constituted a “University Commission” in 1902 under the chairmanship of Sir Thomas Raleigh. Based on the commission’ s recommendations, the Indian Universities Act was passed in 1904. Under this Act, government control over universities increased.","b":false},{"id":119,"c":7,"q":"In which year was the Indian Universities Act passed by Lord Curzon?","o":[["a","1899"],["b","1901"],["c","1904"],["d","1906"],["e","None of the above/More than one of the above"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"Lord Curzon was the Viceroy of India from 1899 to 1905. During his tenure, to carry out educational reforms, he constituted a “University Commission” in 1902 under the chairmanship of Sir Thomas Raleigh. Based on the commission’ s recommendations, the Indian Universities Act was passed in 1904. Under this Act, government control over universities increased.","b":true},{"id":120,"c":7,"q":"In 1817, who founded the Hindu College in Calcutta?","o":[["a","Henry Vivian Derozio"],["b","David Hare"],["c","Jonathan Duncan"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"In 1817, the Hindu College in Calcutta was founded by Maharaja Radha kant a Deb, David Hare, and Diwan Baidyanath Mukherjee, among others. Raja Ram Mohan Roy was also associated with the establishment of this college.","b":false},{"id":121,"c":7,"q":"Establishment of Fort William College in Calcutta","o":[["a","Was established in 1802 AD for historical research in Indian languages."],["b","Was established in 1802 AD to understand Indian culture and tradition."],["c","Established in 1800 AD solely to train Indian civil servants."],["d","Established in 1800 AD to train civil servants in Indian languages."]],"a":"d","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"Fort William College in Calcutta was established by the then Governor-General Wellesley of the East India Company. The college was formally established on 4 May 1800, and the legal and administrative regulations related to its formation were approved on 10 July 1800. The main objective of this college was to train British civil servants in Persian and Indian languages for administration in India.","b":false},{"id":122,"c":7,"q":"When was the National Council of Education established?","o":[["a","15th August, 1903"],["b","15th August, 1904"],["c","15th August, 1905"],["d","15th August, 1906"]],"a":"d","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"In the field of national education, the “Rangpur National School” was established on 8 November 1905. A conference was held in Calcutta on 16 November 1905. In this conference, it was decided to establish the “National Council of Education” to provide national literary, scientific, and technical education. On the basis of official records and authentic historical documents, the correct date of establishment of the National Council of Education is 11 March 1906, not 15 August 1906. On 11 March 1906, the National Council of Education was constituted through a resolution passed during a public conference in Kolkata. It is considered the first concrete step of the Swadeshi education campaign of the Indian freedom movement. The date given in the options—15 August 1906—was the day when the first National College (Bengal National School), under the aegis of the National Council of Education, was started.","b":false},{"id":123,"c":7,"q":"Which of the following was not an objective of the Indian National Congress as pointed out by W.C. Banerjee in 1885?","o":[["a","To promote contact and friendship among the protectors of the interests of the country."],["b","To promote the feeling of nationalism among fellow countrymen by removing the feeling of casteism, communalism and regional biases."],["c","To express the viewpoint on the necessary social issues with due consent of the educated class."],["d","To determine on which direction and on which basis the work has to be done in the coming years for the Indian public interest."],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"In 1885, at the first session of the Indian National Congress, the following objectives were stated as indicated by Womesh Chandra Banerjee— (1) To Promote contact and friendship among the protectors of the interests of the country; (2) To Promote feelings of nationalism among fellow countrymen by removing the feeling of casteism, communalism and regional biases. (3) To express the viewpoint on the necessary social issues with due consent of the educated class. (4) To determine on which direction and on which basis to work has to be done in the coming years for the Indian public interest. It is noteworthy that, in the beginning, there was a provision/ arrangement that social issues would not be taken up from the Congress platform.","b":false},{"id":124,"c":7,"q":"When did the British Government appoint the Sadler University Commission for reforms in education:","o":[["a","1919"],["b","1917"],["c","1921"],["d","1896"]],"a":"b","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"The Sadler Commission (Calcutta University Commission) was related to education. In 1917, the Government of India appointed a commission to study the condition and prospects of the University of Calcutta and to submit its report. Dr. M. E. Sadler, who was the Vice-Chancellor of the University of Leeds, was appointed as its Chairman. The Commission held that if university education was to be improved, reform of secondary education was essential. It strongly criticized the University Act of 1904 and stated that, because of it, proper coordination between college education and university education was not possible.","b":false},{"id":125,"c":7,"q":"By whom was the Asiatic Society established in Calcutta?'","o":[["a","Warren Hastings"],["b","Sir William Jones"],["c","Raja Ram Mohan Roy"],["d","T.B. Macaulay"]],"a":"b","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The Asiatic Society in Calcutta was founded in 1784 by Sir William Jones. Through this institution, many important Indian texts were translated into English.","b":false},{"id":126,"c":8,"q":"To control the media in India, ‘Acts’ were passed in –","o":[["a","1835, 1867, 1878, 1908"],["b","1854, 1864, 1872, 1910"],["c","1854, 1872, 1908, 1910"],["d","1867, 1908, 1910, 1919"]],"a":"a","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"To control newspapers that exposed the government’ s repressive policies, the Press Act of 1835 (Act No. XI of 1835) was promulgated. After this, the Press and Registration of Books Act, 1867 was passed. Viceroy Lord Lytton passed the Vernacular Press Act in 1878, under which no newspaper could be published without the government’ s permission if it contained criticism of the British government. In addition, an Act to control the press was passed by Lord Minto in 1908, under which the government had the power to confiscate any publication that was accused of inciting public feeling against the government.","b":false},{"id":127,"c":8,"q":"Who among the following repealed the Vernacular Press Act of 1878?","o":[["a","Lord Ripon"],["b","Lord Lytton"],["c","Lord Curzon"],["d","Lord Minto"]],"a":"a","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"Lord Ripon repealed the Vernacular Press Act in 1882 and gave Indian-language newspapers the same freedom as English-language newspapers. It is noteworthy that the Vernacular Press Act was passed in 1878 during Lord Lytton’ s tenure (1876–1880). This Act was called the “Gagging Act.” Its most objectionable feature was that it discriminated between newspapers in Indian languages and those in English, and it did not give the offender the right to appeal. Under this Act, a district magistrate, or the Police Commissioner of a presidency town—within whose local jurisdiction a newspaper was printed and published—had the power to make any Indian-language newspaper sign a bond (Bond) stating that it would not publish any anti-government material. The security deposit of printing presses that opposed the law could be cancelled. Under this Act, cases were registered against Som Prakash, Bharat Mihir, Dhaka Prakash, Sahchar, and many other newspapers.","b":false},{"id":128,"c":8,"q":"Which of the following statements about the Vernacular Press Act is/are correct?","o":[["a","Only 1 and 2"],["b","Only 2 and 3"],["c","Only 1"],["d","1, 2 and 3"]],"a":"d","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"Lord Lytton enacted the Vernacular Press Act, 1878, which empowered the government to seize newspapers publishing so-called “anti-government material”. It may be noted that English-language newspapers were exempted from this Act and were not regulated under its provisions. Under the Vernacular Press Act, any magistrate or police commissioner had the authority to order any printer or publisher of a newspaper not to print a specified kind of material and could seize any printed matter considered objectionable. This Act was nicknamed the “Gagging Act”. Its most objectionable features were—(i) discrimination between the English and vernacular press, and (ii) no right of appeal. Under the VPA, action was initiated against newspapers such as Som Prakash, Bharat Mihir, Dhaka Prakash, and others. This law was repealed in 1882 by Lord Ripon (Viceroy, 1880–84), Lord Lytton’ s successor.","b":false,"L":["1. It was enacted by Lord Lytton.","2. It came to be known as a ‘Gagging Act’.","3. The Act was repealed by Lord Ripon."],"n":"Select the correct answer using the codes given below."},{"id":129,"c":8,"q":"The Vernacular Press Act imposed severe restrictions on the freedom of Indian language newspapers. In which year was it passed?","o":[["a","1878"],["b","1885"],["c","1880"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Vernacular Press Act was passed in 1878 by Lord Lytton. According to this law, the editor of a vernacular newspaper had to get the content (newspaper matter) reviewed by the police before publication.","b":false},{"id":130,"c":8,"q":"Which of the following papers was essentially the mouthpiece of the policies of the Liberals?","o":[["a","New India"],["b","Leader"],["c","Young India"],["d","Free Press Journal"]],"a":"b","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"'Free Press Journal' is a daily English newspaper established in 1928 by S. Sadanand, published from Mumbai. 'Young India' was a weekly journal published by Mahatma Gandhi. With the efforts of Madan Mohan Malaviya, the English daily newspaper 'The Leader' was founded. He was a leader of the Moderate group. Through it, the Moderates propagated their policies.","b":false},{"id":131,"c":8,"q":"Which of the following was not a ‘nationalist’ newspaper?","o":[["a","The Hindu"],["b","Bengalee"],["c","The Mahratta"],["d","The Times of India"],["e","None of the above/More than one of the above"]],"a":"d","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The Times of India supported the British government, and was not nationalist. The Hindu, The Bengalee, and The Mahratta were major nationalist newspapers.","b":false},{"id":132,"c":8,"q":"Who founded the Asiatic Society of Bengal?","o":[["a","Sir William Bentinck"],["b","Sir James Tod"],["c","Sir William Jones"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The Asiatic Society of Bengal was founded in 1784 on the initiative of Sir William Jones. The Society’ s name underwent several changes over time, such as The Asiatic Society of Bengal (1832–1935), The Royal Asiatic Society of Bengal (1936–1951), and since July 1951 it has been known as the Asiatic Society. Since 1984, the Asiatic Society has been accorded the status of an institution of national importance under an Act of the Indian Parliament.","b":false},{"id":133,"c":8,"q":"Who started the Asiatic Society of Bengal in 1784?","o":[["a","Max Muller"],["b","Charles William"],["c","William Jones"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. School Teacher, 07-12-2023","y":2023,"e":"The Asiatic Society of Bengal was founded in 1784 on the initiative of Sir William Jones. The Society’ s name underwent several changes over time, such as The Asiatic Society of Bengal (1832–1935), The Royal Asiatic Society of Bengal (1936–1951), and since July 1951 it has been known as the Asiatic Society. Since 1984, the Asiatic Society has been accorded the status of an institution of national importance under an Act of the Indian Parliament.","b":true},{"id":134,"c":8,"q":"Who first brought the printing press to India in the mid-sixteenth century?","o":[["a","Dutch textile merchant"],["b","British merchant"],["c","Portuguese missionary"],["d","Arabic manuscript writer"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"In the mid-sixteenth century, the printing press was first brought to India by Portuguese Jesuit missionaries to Goa.","b":false},{"id":135,"c":8,"q":"The nationalist daily newspaper, The Indian Nation started its publication in","o":[["a","1930"],["b","1931"],["c","1940"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. School Teacher, 10-12-2023","y":2023,"e":"The Indian Nation was an independent nationalist daily newspaper. It was published from Patna, the capital of the state of Bihar, by Newspaper and Publication Private Limited. The publication of this daily newspaper began in 1931.","b":false},{"id":136,"c":8,"q":"Who in America started to issue the newspaper ‘The Free Hindustan’?","o":[["a","Ram Nath Puri"],["b","G.D. Kumar"],["c","Lala Hardayal"],["d","Tarak Nath Das"]],"a":"d","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"In North America (Vancouver), the monthly magazine/journal titled ‘Free Hindustan’ was started by Taraknath Das.","b":false},{"id":137,"c":8,"q":"Which newspaper wrote the following about the possible future role of the Indian National Congress:‘... is the nucleus of a future Parliament of our country... and will lead to the good of inconceivable magnitude for our countrymen'?","o":[["a","The Indian Mirror"],["b","The New York Times"],["c","The Times of India"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"The above article about the possible future role of the Indian National Congress was written by The Indian Mirror newspaper in its January 1886 issue.","b":false},{"id":138,"c":8,"q":"From the options given below, find the correct combination of the names of editors of the nationalist newspapers The Hindu, Kesari, Bengalee, Hindustani, Sudharak:","o":[["a","Surendra Nath Banerjee, G. Subramania Iyer, Bal Gangadhar Tilak, Ganga Prasad Verma, Gopal Krishna Gokhale"],["b","Bal Gangadhar Tilak, G. Subramania Iyer, Surendra Nath Banerjee, Ganga Prasad Verma, Gopal Krishna Gokhale"],["c","G. Subramania Iyer, Bal Gangadhar Tilak, Ganga Prasad Verma, Gopal Krishna Gokhale, Surendra Nath Banerjee"],["d","G. Subramania Iyer, Bal Gangadhar Tilak, Surendra Nath Banerjee, Ganga Prasad Verma, Gopal Krishna Gokhale"],["e","None of the above/More than one of the above"]],"a":"d","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Newspaper Editor The Hindu G. Subramania Iyer Kesari Bal Gangadhar Tilak The Bengalee Surendranath Banerjee Hindustani Ganga Prasad Verma Sudharak Gopal Krishna Gokhale Thus, option (d) is the correct answer.","b":false},{"id":139,"c":8,"q":"Newspaper Editor I. Free Hindustan A. Mahatma Gandhi II. Indian Opinion B. Dadabhai Naoroji III. Voice of India C. Surendranath Banerjee IV. Bengalee D. Taraknath Das","o":[["a","C D A B"],["b","D A B C"],["c","C A D B"],["d","D C B A"]],"a":"b","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The correct matching is as follows— Newspaper Editor Free Hindustan Taraknath Das Indian Opinion Mahatma Gandhi Voice of India Dadabhai Naoroji The Bengalee Surendranath Banerjee","b":false,"n":"Match the following and choose the correct answer."},{"id":140,"c":9,"q":"Which category of population was primarily attracted by the religious reform movements of the nineteenth century? (i) Intellectuals (ii) Urban upper castes (iii)Poor ordinary class (iv) Liberal princes Choose your answer from the given code:","o":[["a","Only i"],["b","i and ii"],["c","i, ii and iii"],["d","i, ii and iv"]],"a":"d","s":"47th B.P.S.C. (Pre) 2005 · 40th B.P.S.C. (Pre) 1995","y":2005,"e":"The religious and social reform movements of the nineteenth century occupy a special place in modern Indian history. These movements influenced intellectuals and the middle class the most. The poor masses remained almost unaffected by these movements. Intellectuals, urban upper castes, and liberal princely rulers were influenced by these movements.","b":false},{"id":141,"c":9,"q":"Who were the Faraizis?","o":[["a","Followers of Haji Shariatullah"],["b","Followers of Dadu"],["c","Followers of the Arya Samaj"],["d","Followers of the Muslim League"]],"a":"a","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"The Faraizis (Faraizi) were followers of the sect run by Haji Shariatullah of Faridpur in Bengal. They advocated many radical religious, social, and political changes. Shariatullah’ s son, Dudu Miyan, planned to drive the British out of Bengal. The period from 1818 to 1862 was the main phase of the Faraizi movement; the movement continued even afterward, but its pace slowed down.","b":false},{"id":142,"c":9,"q":"Who began the 'Faraiji Movement'?","o":[["a","Haji Shariatullah"],["b","Syed Ahmed"],["c","Salimullah"],["d","M.A. Jinnah"],["e","None of the above / More than one of the above"]],"a":"a","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"The Faraizis (Faraizi) were followers of the sect run by Haji Shariatullah of Faridpur in Bengal. They advocated many radical religious, social, and political changes. Shariatullah’ s son, Dudu Miyan, planned to drive the British out of Bengal. The period from 1818 to 1862 was the main phase of the Faraizi movement; the movement continued even afterward, but its pace slowed down.","b":true},{"id":143,"c":9,"q":"Taiyuni Movement began in opposition to the Faraizi Movement at Dhaka in 1893 was started by","o":[["a","Syed Amir Ali of Calcutta"],["b","Sir Syed Ahmed of Aligarh"],["c","Hasan Imam of Patna"],["d","Karamat Ali of Jaunpur"],["e","None of the above/More than one of the above"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"In opposition to the Faraizi movement, the Taiyuni movement was launched in Dhaka in 1839, and it was led by Karamat Ali of Jaunpur. The Faraizi movement was started by Haji Shariatullah in 1818. The main area of this movement was Eastern Bengal, and its objective was to eliminate social innovations or non-Islamic practices prevalent among the Muslims of the region. Note: The Taiyuni movement began in 1839, not in 1893. The Commission excluded this question from evaluation.","b":false},{"id":144,"c":9,"q":"Whowasthe father of the Indian Renaissance movement?","o":[["a","Bal Gangadhar Tilak"],["b","Dayanand Saraswati"],["c","Shraddhanand"],["d","Raja Ram Mohan Roy"]],"a":"d","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"Raja Ram Mohan Roy is called the “Father of the Indian Renaissance,” the “Prophet of Indian Nationalism,” the “Bridge between the past and the future,” the “Father of Indian Nationalism,” the “Father of Modern India,” the “Prophet of New India,” the first modern man, and the “Messenger of the Age (Yugdoot).”","b":false},{"id":145,"c":9,"q":"Who is called the 'Prophet of New India'?","o":[["a","Raja Ram Mohan Roy"],["b","Dayanand Saraswati"],["c","Dadabhai Naoroji"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (11th-12th) 26.08.2023","y":2023,"e":"Raja Ram Mohan Roy is called the “Father of the Indian Renaissance,” the “Prophet of Indian Nationalism,” the “Bridge between the past and the future,” the “Father of Indian Nationalism,” the “Father of Modern India,” the “Prophet of New India,” the first modern man, and the “Messenger of the Age (Yugdoot).”","b":true},{"id":146,"c":9,"q":"Who among the following was the founder of Atmiya Sabha?","o":[["a","Raja Ram Mohan Roy"],["b","Swami Dayanand Saraswati"],["c","Swami Vivekananda"],["d","Aurobindo Ghosh"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"To propagate the monotheistic ideals of Hinduism, Raja Rammohan Roy, with the help of his young supporters, founded the “Atmiya Sabha” in 1815. He criticized idol worship and argued with evidence that all ancient original Hindu religious texts preach one Brahman. In support of this, he translated Vedanta texts such as Vedanta Sutra, Vedanta Sara, etc., and also translated five major Upanishads into Bengali.","b":false},{"id":147,"c":9,"q":"Brahmo Samaj was founded in the year of-","o":[["a","1827"],["b","1829"],["c","1831"],["d","1843"]],"a":"*","s":"47th B.P.S.C. (Pre) 2005 · 41st B.P.S.C. (Pre) 1996","y":2005,"e":"Raja Rammohan Roy founded a new society on 20 August 1828 under the name “Brahmo Sabha,” which later came to be known as the “Brahmo Samaj.” This society opposed idol worship and preached the worship of one Brahman. It was a group of people who believed in the unity of God and stayed away from idol worship. In the Brahmo Samaj, social customs and religious rituals were not given much importance. It emphasized love for all human beings without considering colour, caste, or creed, and stressed service to humanity as the highest way of life. None of the options given is correct.","b":false},{"id":148,"c":9,"q":"Raja Rammohan Roy founded the Brahmo Samaj in—","o":[["a","1816"],["b","1820"],["c","1828"],["d","1830"]],"a":"c","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"Raja Rammohan Roy founded a new society on 20 August 1828 under the name “Brahmo Sabha,” which later came to be known as the “Brahmo Samaj.” This society opposed idol worship and preached the worship of one Brahman. It was a group of people who believed in the unity of God and stayed away from idol worship. In the Brahmo Samaj, social customs and religious rituals were not given much importance. It emphasized love for all human beings without considering colour, caste, or creed, and stressed service to humanity as the highest way of life. None of the options given is correct.","b":true},{"id":149,"c":9,"q":"Who declared “Sati” illegal?","o":[["a","Warren Hastings"],["b","William Bentinck"],["c","Cornwallis"],["d","Curzon"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"Lord William Bentinck banned the practice of Sati through Regulation XVII of the Bengal Sati Regulation, 1829. Initially, this law was applied only in the Bengal Presidency; however, in 1830 it was also applied in the Bombay and Madras Presidencies.","b":false},{"id":150,"c":9,"q":"Who was the founder of ‘Prarthana Samaj’?","o":[["a","Atmaram Pandurang a"],["b","Tilak"],["c","Annie Besant"],["d","Rashbehari Ghose"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"The Prarthana Samaj was founded in 1867 in Bombay by Atmaram Pandurang, inspired by Acharya Keshab Chandra Sen. Mahadev Govind Ranade joined this institution in 1868. The main objectives of this institution were: opposition to the caste system, increasing the marriageable age of men and women, promoting widow remarriage, and encouraging women’ s education. Ranade’ s social reform movement continued successfully till the end of the 19th century.","b":false},{"id":151,"c":9,"q":"During the Indian independence movement, who founded the Prarthana Samaj?","o":[["a","Atmaram Pandurang"],["b","Gopal Hari Deshmukh"],["c","Ishwar Chandra Vidya sagar"],["d","Keshav Chandra Sen"]],"a":"a","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The Prarthana Samaj was founded in 1867 in Bombay by Atmaram Pandurang, inspired by Acharya Keshab Chandra Sen. Mahadev Govind Ranade joined this institution in 1868. The main objectives of this institution were: opposition to the caste system, increasing the marriageable age of men and women, promoting widow remarriage, and encouraging women’ s education. Ranade’ s social reform movement continued successfully till the end of the 19th century.","b":true},{"id":152,"c":9,"q":"Thebest representative of Neo-Hinduism inthe second half of the nineteenth century was –","o":[["a","Ram krishna Param a hams"],["b","Swami Vivekananda"],["c","Bankim Chandra Chatterji"],["d","Raja Ram Mohan Roy"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"Swami Vivekananda founded the Ramakrishna Mission on 1 May 1897 in memory of his guru. After taking sannyasa, he made an extensive study of religious scriptures. The credit for giving a practical form to the interpretation of his guru’ s teachings goes to Swami Vivekananda (1863–1902). He described these teachings in simple language. Swami Vivekananda emerged as a propagator of this Neo-Hinduism. In 1893, he went to Chicago, where he delivered his famous speech at the ‘Parliament of the World’ s Religions’ (World Parliament of Religions). Through this speech, for the first time, he presented the importance of India’ s culture before the Western world in a very effective manner. After this, he travelled in America and England and propagated Hinduism. Swamiji strongly condemned the tendency in Hinduism that says, “Don’ t touch ism.” According to him, Hinduism had now become confined only to food and drink. He was very unhappy with religion’ s silence on the exploitation of the poor by the rich. According to him, to speak of religion to a hungry person is an insult to God and humanity. Vivekananda did not give any political message; yet, through his writings and speeches, he awakened in the new generation a renewed sense of self-respect in their past. He was a true patriot. Subhas Chandra Bose said about him: “As far as Bengal is concerned, we may look upon Vivekananda as the ‘Spiritual Father’ of the modern national movement.”","b":false},{"id":153,"c":9,"q":"Who among the following participated in the Parliament of Religions held at Chicago in 1893?","o":[["a","Dayananda Saraswati"],["b","Swami Vivekananda"],["c","Mahatma Gandhi"],["d","Raja Ram Mohan Roy"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"Swami Vivekananda founded the Ramakrishna Mission on 1 May 1897 in memory of his guru. After taking sannyasa, he made an extensive study of religious scriptures. The credit for giving a practical form to the interpretation of his guru’ s teachings goes to Swami Vivekananda (1863–1902). He described these teachings in simple language. Swami Vivekananda emerged as a propagator of this Neo-Hinduism. In 1893, he went to Chicago, where he delivered his famous speech at the ‘Parliament of the World’ s Religions’ (World Parliament of Religions). Through this speech, for the first time, he presented the importance of India’ s culture before the Western world in a very effective manner. After this, he travelled in America and England and propagated Hinduism. Swamiji strongly condemned the tendency in Hinduism that says, “Don’ t touch ism.” According to him, Hinduism had now become confined only to food and drink. He was very unhappy with religion’ s silence on the exploitation of the poor by the rich. According to him, to speak of religion to a hungry person is an insult to God and humanity. Vivekananda did not give any political message; yet, through his writings and speeches, he awakened in the new generation a renewed sense of self-respect in their past. He was a true patriot. Subhas Chandra Bose said about him: “As far as Bengal is concerned, we may look upon Vivekananda as the ‘Spiritual Father’ of the modern national movement.”","b":true},{"id":154,"c":9,"q":"Swami Vivekananda established the Ramakrishna Mission in the year:","o":[["a","1861"],["b","1891"],["c","1893"],["d","1897"]],"a":"d","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"Swami Vivekananda founded the Ramakrishna Mission on 1 May 1897 in memory of his guru. After taking sannyasa, he made an extensive study of religious scriptures. The credit for giving a practical form to the interpretation of his guru’ s teachings goes to Swami Vivekananda (1863–1902). He described these teachings in simple language. Swami Vivekananda emerged as a propagator of this Neo-Hinduism. In 1893, he went to Chicago, where he delivered his famous speech at the ‘Parliament of the World’ s Religions’ (World Parliament of Religions). Through this speech, for the first time, he presented the importance of India’ s culture before the Western world in a very effective manner. After this, he travelled in America and England and propagated Hinduism. Swamiji strongly condemned the tendency in Hinduism that says, “Don’ t touch ism.” According to him, Hinduism had now become confined only to food and drink. He was very unhappy with religion’ s silence on the exploitation of the poor by the rich. According to him, to speak of religion to a hungry person is an insult to God and humanity. Vivekananda did not give any political message; yet, through his writings and speeches, he awakened in the new generation a renewed sense of self-respect in their past. He was a true patriot. Subhas Chandra Bose said about him: “As far as Bengal is concerned, we may look upon Vivekananda as the ‘Spiritual Father’ of the modern national movement.”","b":true},{"id":155,"c":9,"q":"The spiritual side of nationalism was voiced by–","o":[["a","Raja Ram Mohan Roy"],["b","Swami Shraddhanand"],["c","Swami Vivekananda"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"BPSC (T.R.E.-3) July, 2024","y":2024,"e":"Swami Vivekananda’ s nationalism, which arose during colonial rule and amid the widespread poverty and suffering of the people, was based on Indian spirituality. Swami Vivekananda was a true nationalist from his heart and soul. He adopted a spiritual outlook on nationalism in the struggle for freedom. Subhas Chandra Bose called Swami Vivekananda the “Spiritual father of the modern nationalist movement.","b":false},{"id":156,"c":9,"q":"Dayanand Saraswati founded –","o":[["a","Brahmo Samaj"],["b","Arya Samaj"],["c","Prarthana Samaj"],["d","Bahujan Samaj"]],"a":"b","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"Dayanand Saraswati (Mool Shankar) founded the Arya Samaj in Bombay in 1875, whose main objective was to re-establish the ancient Vedic religion in its pure form. The Arya Samaj movement spread mainly as a reaction to Western influences. In 1877, the headquarters of the Arya Samaj was established in Lahore, after which it was propagated more widely. Due to faith in the pure Vedic tradition, Swamiji gave the slogan, “Back to the Vedas.” Swami Dayanand’ s objective was to unite India religiously, socially, and nationally. In the religious sphere, he did not accept idol worship, polytheism, avatar ism, animal sacrifice, blind faith, tantra-mantra, and false rituals. He considered the Vedas as divine knowledge and accepted literature up to the Up a nish adic period. The rules and principles of the Arya Samaj were first framed in Bombay; later, they were edited in Lahore in 1877 and given a definite form. The expansion of Arya Samaj was highly successful in Punjab, and to some extent it also achieved success in Uttar Pradesh, Gujarat, and Rajasthan. Mahatma Hansraj, Pandit Gurudutt, Lala Lajpat Rai, and Swami Shraddhanand were among its notable workers. In 1893, the Arya Samaj split into two groups—one group supported Western education, while the other opposed it. Among the opponents of Western education, Swami Shraddhanand (another name—Mahatma Munshiram) and Lekhram were prominent. These people founded ‘Gurukul Kangri’ (Gurukul Kangri University) in 1902. Among the supporters of Western education, Lala Lajpat Rai and Hansraj were prominent. These people founded the ‘Dayanand Anglo-Vedic College’.","b":false},{"id":157,"c":9,"q":"Arya Samaj was founded by Swami Dayanand -","o":[["a","In 1820 AD"],["b","In 1828 AD"],["c","In 1830 AD"],["d","In 1875 AD"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"Dayanand Saraswati (Mool Shankar) founded the Arya Samaj in Bombay in 1875, whose main objective was to re-establish the ancient Vedic religion in its pure form. The Arya Samaj movement spread mainly as a reaction to Western influences. In 1877, the headquarters of the Arya Samaj was established in Lahore, after which it was propagated more widely. Due to faith in the pure Vedic tradition, Swamiji gave the slogan, “Back to the Vedas.” Swami Dayanand’ s objective was to unite India religiously, socially, and nationally. In the religious sphere, he did not accept idol worship, polytheism, avatar ism, animal sacrifice, blind faith, tantra-mantra, and false rituals. He considered the Vedas as divine knowledge and accepted literature up to the Up a nish adic period. The rules and principles of the Arya Samaj were first framed in Bombay; later, they were edited in Lahore in 1877 and given a definite form. The expansion of Arya Samaj was highly successful in Punjab, and to some extent it also achieved success in Uttar Pradesh, Gujarat, and Rajasthan. Mahatma Hansraj, Pandit Gurudutt, Lala Lajpat Rai, and Swami Shraddhanand were among its notable workers. In 1893, the Arya Samaj split into two groups—one group supported Western education, while the other opposed it. Among the opponents of Western education, Swami Shraddhanand (another name—Mahatma Munshiram) and Lekhram were prominent. These people founded ‘Gurukul Kangri’ (Gurukul Kangri University) in 1902. Among the supporters of Western education, Lala Lajpat Rai and Hansraj were prominent. These people founded the ‘Dayanand Anglo-Vedic College’.","b":true},{"id":158,"c":9,"q":"Who established the 'Arya Samaj'?","o":[["a","Ranade"],["b","Dayanand"],["c","Dayananda Saraswati"],["d","Swami Vivekananda"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"Dayanand Saraswati (Mool Shankar) founded the Arya Samaj in Bombay in 1875, whose main objective was to re-establish the ancient Vedic religion in its pure form. The Arya Samaj movement spread mainly as a reaction to Western influences. In 1877, the headquarters of the Arya Samaj was established in Lahore, after which it was propagated more widely. Due to faith in the pure Vedic tradition, Swamiji gave the slogan, “Back to the Vedas.” Swami Dayanand’ s objective was to unite India religiously, socially, and nationally. In the religious sphere, he did not accept idol worship, polytheism, avatar ism, animal sacrifice, blind faith, tantra-mantra, and false rituals. He considered the Vedas as divine knowledge and accepted literature up to the Up a nish adic period. The rules and principles of the Arya Samaj were first framed in Bombay; later, they were edited in Lahore in 1877 and given a definite form. The expansion of Arya Samaj was highly successful in Punjab, and to some extent it also achieved success in Uttar Pradesh, Gujarat, and Rajasthan. Mahatma Hansraj, Pandit Gurudutt, Lala Lajpat Rai, and Swami Shraddhanand were among its notable workers. In 1893, the Arya Samaj split into two groups—one group supported Western education, while the other opposed it. Among the opponents of Western education, Swami Shraddhanand (another name—Mahatma Munshiram) and Lekhram were prominent. These people founded ‘Gurukul Kangri’ (Gurukul Kangri University) in 1902. Among the supporters of Western education, Lala Lajpat Rai and Hansraj were prominent. These people founded the ‘Dayanand Anglo-Vedic College’.","b":true},{"id":159,"c":9,"q":"In 1873 who founded Satyashodhak Samaj?","o":[["a","Gopal Krishna Gokhale"],["b","Jyotiba Phule"],["c","Shiv Nath Shastri"],["d","None of the above"]],"a":"b","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"In 1873, the Satyashodhak Samaj was founded by Jyotiba Phule. He led a powerful non-Brahmin movement. Through his book ‘Gulamgiri’ (1873) and his organisation ‘Satyashodhak Samaj’, he stressed the need to protect the lower castes from hypocritical Brahmins and their self-serving religious texts.","b":false},{"id":160,"c":9,"q":"‘Satya Shodhak Samaj’ was founded by","o":[["a","Dayanand Saraswati"],["b","Jyotiba Phule"],["c","Gandhiji"],["d","Dr. Baba Saheb Ambedkar"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"In 1873, the Satyashodhak Samaj was founded by Jyotiba Phule. He led a powerful non-Brahmin movement. Through his book ‘Gulamgiri’ (1873) and his organisation ‘Satyashodhak Samaj’, he stressed the need to protect the lower castes from hypocritical Brahmins and their self-serving religious texts.","b":true},{"id":161,"c":9,"q":"The women’ s movement in India started largely under the inspiration of:","o":[["a","Padmabai Ranaday"],["b","Annie Besant"],["c","Sarojini Naidu"],["d","Jyotiba Phule"]],"a":"d","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"According to the given options, the women’ s movement in India began under the inspiration of Jyotiba Phule. Phule believed that social evils could be removed only by uplifting women and Dalits. In 1848, he opened a school for girls. This was India’ s first school for girls. In modern India, the main source of inspiration for the women’ s movement was Ramabai Ranade. Mrs. Ramabai, the wife of Mahadev Govind Ranade, founded an organisation called Seva Sadan. If option (a) had mentioned Ramabai, that would have been the correct answer. This is why the Bihar Public Service Commission did not accept any option as correct and marked it as “starred”.","b":false},{"id":162,"c":9,"q":"Who founded the ‘Theosophical Society’?","o":[["a","Madame H.P. Blavatsky"],["b","Raja Ram Mohan Roy"],["c","Mahatma Gandhi"],["d","Swami Vivekananda"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"The Theosophical Society was founded in 1875 in New York by Madame H.P. Blavatsky, a Russian woman (now a resident of Ukraine), American Military Officer Colonel Olcott, William Quan Judge, and others. In 1882, the founders established the Society’ s headquarters at Adyar near Madras, which later became its international headquarters. In India, the main objective of this institution was to awaken and strengthen people’ s self-confidence in ancient Hinduism and to make religion the main basis of social service.","b":false},{"id":163,"c":9,"q":"Who founded the Theosophical Society?","o":[["a","Madame H.P. Blavatsky"],["b","Raja Rammohan Roy"],["c","Mahatma Gandhi"],["d","Swami Vivekananda"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The Theosophical Society was founded in 1875 in New York by Madame H.P. Blavatsky, a Russian woman (now a resident of Ukraine), American Military Officer Colonel Olcott, William Quan Judge, and others. In 1882, the founders established the Society’ s headquarters at Adyar near Madras, which later became its international headquarters. In India, the main objective of this institution was to awaken and strengthen people’ s self-confidence in ancient Hinduism and to make religion the main basis of social service.","b":true},{"id":164,"c":9,"q":"Identify the correct combination from the options given below for Prarthana Samaj, Young India, Lokahitavadi, Satyashodhak Samaj, Rahnumai Mazda yas nan Sabha:","o":[["a","Gopal Hari Deshmukh, Atmaram Pandurang, Mohandas Karamchand Gandhi, Jyotiba Phule, Naoroji Furdunji."],["b","Atmaram Pandurang, Mohandas Karamchand Gandhi, Gopal Hari Deshmukh, Jyotiba Phule, Naoroji Furdunji"],["c","Atmaram Pandurang, Jyotiba Phule, Mohandas Karamchand Gandhi, Gopal Hari Deshmukh, Naoroji Furdunji."],["d","Naoroji Furdunji, Atmaram Pandurang, Mohandas Karamchand Gandhi, Gopal Hari Deshmukh, Jyotiba Phule."],["e","None of the above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Prarthana Samaj was founded in 1867 in Bombay by Atmaram Pandurang under the inspiration of Keshab Chandra Sen. Mahatma Gandhi was associated with newspapers such as Indian Opinion, Harijan and Young India. The social reformer of Maharashtra, Gopal Hari Deshmukh, was famous as ‘Loka hit wadi’. In 1873, the Satyashodhak Samaj was founded by Jyotiba Phule. In 1851, Naoroji Furdunji, along with other Parsi associates, founded the Rahnumai Mazda yas nan Sabha. Thus, option (b) is the correct combination.","b":false},{"id":165,"c":9,"q":"‘Nai-Dhobi Band’ was a form of social boycott in1919 which–","o":[["a","was started by the farmers of Pratapgarh district"],["b","was a movement started by saints for the emancipation of the people lower classes"],["c","was a step against contractors of lower castes by landlords"],["d","was a movement against contractors by lower castes"]],"a":"a","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"In 1919, in a jagir of Pratapgarh district, the “Nai–Dhobi Band” was the first instance of an organised act of social boycott. Jhinguri Singh and Durgapal played an important role in it, but soon a new face emerged in the movement—Baba Ramchandra, who not only took charge of the movement but also made it stronger and more combative. Baba Ramchandra belonged to a Brahmin family in Maharashtra. By the middle of 1920, he emerged as a peasant leader and began organising the peasants in Awadh. He had an extraordinary capacity for organisation.","b":false},{"id":166,"c":9,"q":"Who demanded the right to enter temples that caused a terrible riot in Tirunelveli in 1899?","o":[["a","Okkalinga"],["b","Nadars"],["c","Mahar"],["d","Pali"]],"a":"b","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"On 6 June, 1899, severe riots took place in Tirunelveli (Tamil Nadu). People of the Nadar community had long been demanding the right to worship in temples. When the demand was not met, this riot occurred in the Sivakasi (Virudhunagar district) clash between the Nadar and the Maravar community (Maravan community).","b":false},{"id":167,"c":9,"q":"Who was Sharada Mani?","o":[["a","Wife of Raja Ram Mohan Roy"],["b","Wife of Ramakrishna Param a hams a"],["c","Mother of Vivekananda"],["d","Daughter of Keshab Chandra Sen."]],"a":"b","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Sharada mani Muk hop adh yay, known as Sarada Devi, was married to Ramakrishna Param a hams a in 1859, when she was about five years old.","b":false},{"id":168,"c":9,"q":"‘Satyarth Prakash’ was written by –","o":[["a","Raja Ram Mohan Roy"],["b","Mahatma Gandhi"],["c","Swami Vive kan and"],["d","Swami Dayanand Saraswati"]],"a":"d","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Mool Shankar (Swami Dayanand Saraswati) was born in 1824 in a Brahmin family in the Morbi princely state (Kathiawar region) of Gujarat. In 1860, in Mathura, he learnt the pure meaning of the Vedas from Swami Virjanand Ji and developed deep faith in the Vedic religion. In 1867, he raised the “Pakhand Khandini Pataka”. In 1875, he founded the Arya Samaj in Bombay. His ideas are described in his famous book “Satyarth Prakash”. His other works include Pakhand Khandan, Rigvedadi Bhashyabhumika, Rigveda Bhashya, Advaitmat Khandan, Panch Mahayagya Vidhi, and Ved avi rud dha Mat khanda nam.","b":false},{"id":169,"c":9,"q":"Poona Sarvajanik Sabha was founded in:","o":[["a","1858 by Mahadev Govind Ranade"],["b","1870 by Mahadev Govind Ranade"],["c","1870 by Pandita Ramabai Ranade"],["d","1870 by Surendranath Banerjee"],["e","None of the above/More than one of the above"]],"a":"b","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"The Poona Sarvajanik Sabha was established in 1870, with the cooperation of S. H. Sathe, S. H. Chip lun kar, G. V. Joshi, etc. Ranade joined this Sabha in 1871. He provided remarkable leadership, which increased its popularity. Due to Ranade’ s invaluable contribution to the Poona Sarvajanik Sabha, he is also considered a founder of this institution.","b":false},{"id":170,"c":9,"q":"Who founded the Servants of India Society in 1905?","o":[["a","Surendranath Banerjee"],["b","Bipin Chandra Pal"],["c","Mahadev Govind Ranade"],["d","Gopal Krishna Gokhale"],["e","None of the above"]],"a":"d","s":"67th B.P.S.C. (Pre), 2021","y":2021,"e":"In the year 1905, Gopal Krishna Gokhale founded the Servants of India Society in Poona (Pune). Its objective was to prepare dedicated workers for the service of India and, in a constitutional manner, to promote the true interests of the Indian people. This organisation produced great social workers such as V. Srinivasa Sastri, G.K. Devadhar, N.M. Joshi, and Pandit Hriday nath Kunzru. M.C. Setalvad, B.N. Rau, and Alladi Krishnaswamy Ayyar were among its prominent members.","b":false},{"id":171,"c":9,"q":"Who established the 'Servants of India Society'?","o":[["a","Lala Lajpat Rai"],["b","Bipin Chandra Pal"],["c","Gopal Krishna Gokhale"],["d","Bhagat Singh"],["e","None of the above/More
