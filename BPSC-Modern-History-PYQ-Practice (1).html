 present their views, and practise non-cooperation with the government from within. The Swaraj Party was established after the failure of the Non-Cooperation Movement.","b":true},{"id":380,"c":28,"q":"Who founded the ‘Swaraj Dal’?","o":[["a","Tilak and Chittaranjan Das"],["b","Gandhi and Motilal Nehru"],["c","Gandhi and Tilak"],["d","Chittaranjan Das and Motilal Nehru"]],"a":"d","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"On 31 December 1922, in a meeting held at the residence of the Maharaja of Tikari in Gaya, the formation of a new party within the Congress—‘Congress-Khilafat Swaraj Party’ was announced. In 1923, the ‘Congress-Khilafat Swaraj Party’ (Swaraj Party) was formed, and from 20–22 February 1923, the general meeting of this newly formed party was held in Allahabad (present-day Prayagraj). In this meeting, the party’ s programme and constitution were approved and the party was given the new name ‘Swaraj Party’. C.R. Das became its President and Motilal Nehru became its General Secretary. This party was formed with the objective of contesting council elections while remaining within the Congress. It also participated in the elections to the State Councils as well as the Central Legislative Council and achieved good success. Their real aim was to enter these assemblies, present their views, and practise non-cooperation with the government from within. The Swaraj Party was established after the failure of the Non-Cooperation Movement.","b":true},{"id":381,"c":28,"q":"Who established Swaraj Party in 1923?","o":[["a","Mahatma Gandhi"],["b","Vallabhbhai Patel"],["c","C.R. Das and Motilal Nehru"],["d","B.R. Ambedkar"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"On 31 December 1922, in a meeting held at the residence of the Maharaja of Tikari in Gaya, the formation of a new party within the Congress—‘Congress-Khilafat Swaraj Party’ was announced. In 1923, the ‘Congress-Khilafat Swaraj Party’ (Swaraj Party) was formed, and from 20–22 February 1923, the general meeting of this newly formed party was held in Allahabad (present-day Prayagraj). In this meeting, the party’ s programme and constitution were approved and the party was given the new name ‘Swaraj Party’. C.R. Das became its President and Motilal Nehru became its General Secretary. This party was formed with the objective of contesting council elections while remaining within the Congress. It also participated in the elections to the State Councils as well as the Central Legislative Council and achieved good success. Their real aim was to enter these assemblies, present their views, and practise non-cooperation with the government from within. The Swaraj Party was established after the failure of the Non-Cooperation Movement.","b":true},{"id":382,"c":28,"q":"In the year 1923, the Swaraj Party was formed as a group out of which of the following organizations?","o":[["a","R.S.S."],["b","Congress"],["c","Muslim League"],["d","Swatantra Party"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"In 1923, the Swaraj Party was established as a part of the Congress; Chittaranjan Das was made its President, and Motilal Nehru was made its General Secretary.","b":false},{"id":383,"c":28,"q":"The famous slogan ‘Swaraj should be for common people not only for classes’ was given by-","o":[["a","C.R. Das"],["b","C. Rajagopalachari"],["c","Motilal Nehru"],["d","Gopi Nath Saha"]],"a":"a","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"Deshbandhu Chittaranjan Das (C.R. Das) had said—“Swaraj should be for common people, not only for classes.”","b":false},{"id":384,"c":29,"q":"Which Commission accentuated the discontent in all the political groups and parties for not associating any Indian member in it?","o":[["a","Cripps Mission"],["b","Welby Commission"],["c","Simon Commission"],["d","Cabinet Mission"]],"a":"c","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"In 1927, the British government appointed a statutory commission to review the provisions of the Government of India Act, 1919; it was called the Simon Commission. All seven members of this commission were British, and not even a single Indian representative from any Indian political party, group, community, or organization was included in it.","b":false},{"id":385,"c":29,"q":"When did Simon Commission visit India?","o":[["a","1927"],["b","1928"],["c","1929"],["d","1931"]],"a":"b","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"In the Montagu–Chelmsford Reforms of 1919, there was a provision to set up a Statutory Commission for review after 10 years. The Commission had to examine how far this Act had been successful in practice and how much progress had been made towards responsible government. However, the Conservative government in Britain appointed the Simon Commission (Indian Statutory Commission) two years earlier itself, in November 1927. This commission was chaired by Sir John Simon and had a total of 7 members. Since all the members were British, the Congressmen opposed it by calling it a “White Commission.” The Simon Commission reached Bombay on 3 February 1928.","b":false},{"id":386,"c":29,"q":"When was the formation of the Simon Commission announced?","o":[["a","November 8, 1929"],["b","December 8, 1927"],["c","November 8, 1928"],["d","More than one of the above"],["e","None of the above"]],"a":"e","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"In the Montagu–Chelmsford Reforms of 1919, there was a provision to set up a Statutory Commission for review after 10 years. The Commission had to examine how far this Act had been successful in practice and how much progress had been made towards responsible government. However, the Conservative government in Britain appointed the Simon Commission (Indian Statutory Commission) two years earlier itself, in November 1927. This commission was chaired by Sir John Simon and had a total of 7 members. Since all the members were British, the Congressmen opposed it by calling it a “White Commission.” The Simon Commission reached Bombay on 3 February 1928.","b":true},{"id":387,"c":29,"q":"Who was the Simon Commission appointed under the chairmanship of?","o":[["a","Sir John Simon"],["b","Clement Attlee"],["c","Harry Levy-Lawson"],["d","Edward Cadogan"],["e","None of the above"]],"a":"a","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"In the Montagu–Chelmsford Reforms of 1919, there was a provision to set up a Statutory Commission for review after 10 years. The Commission had to examine how far this Act had been successful in practice and how much progress had been made towards responsible government. However, the Conservative government in Britain appointed the Simon Commission (Indian Statutory Commission) two years earlier itself, in November 1927. This commission was chaired by Sir John Simon and had a total of 7 members. Since all the members were British, the Congressmen opposed it by calling it a “White Commission.” The Simon Commission reached Bombay on 3 February 1928.","b":true},{"id":388,"c":29,"q":"Fill in the blanks— The Nehru Report was prepared by a committee under the chairmanship of........... and its subject was...........","o":[["a","Motilal Nehru and Jawaharlal Nehru; India’ s relationship with the British Empire"],["b","Jawaharlal Nehru; local self-government in India"],["c","Motilal Nehru; constitutional arrangements in India"],["d","Jawaharlal Nehru; constitutional arrangements in India"]],"a":"c","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"Since no Indian was included in the Simon Commission, during the protests against the Commission in India, the Secretary of State for India, Lord Birkenhead, challenged the Indians and said that Indians were incapable of making concrete proposals for constitutional reforms. He said that Indians were unable to frame a constitution that could receive broad political support from all Indians. The Indians accepted this challenge, and to finalize this plan, all-party conferences were held in February, May and August, 1928. A committee of nine members under the chairmanship of Motilal Nehru (the total number of members, including the chairman, was 10) presented the draft of the proposed constitution in August, 1928. Later, it came to be known as the “Nehru Report” after Motilal Nehru. In it, the demand for separate electorates on a communal basis was rejected. This report demanded “Dominion Status”. Besides this, other recommendations were also made, such as: adult franchise for all, equal rights for women, freedom to form unions (associations), and separation of religion from the state in every respect.","b":false},{"id":389,"c":30,"q":"\"Remember once again, now that this flag is unfurled, it must not be lowered as long as a single Indian, man, woman, or child lives in India.\" Who said this?","o":[["a","Gandhi in Gujarat"],["b","Jawaharlal Nehru in Lahore"],["c","S.N. Banerjee in Bengal"],["d","Subhas Chandra Bose in Singapore"],["e","None of the above/More than one of the above"]],"a":"b","s":"B.P.S.C. C.D.P.O. (Pre) 2018","y":2018,"e":"Jawaharlal Nehru said in Lahore: “Remember once again, now that this flag is unfurled; it must not be lowered as long as a single Indian man, woman, or child remains alive in India.” The Lahore Session of 1929 was presided over by Jawaharlal Nehru. In this very session, the resolution of “Purna Swaraj” was passed, and it was decided to celebrate 26 January as Independence Day.","b":false},{"id":390,"c":30,"q":"The proposal of Purna Swaraj was passed in Lahore Congress in the year-","o":[["a","1919"],["b","1929"],["c","1939"],["d","1942"]],"a":"b","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"In the Calcutta Session of the Congress, an ultimatum was given to the British Government that it should accept the Nehru Report by the end of the year, or else it would have to face a mass movement to be started by the Congress. When the government did not give any definite reply within the fixed time-limit, the historic Lahore Session of the Congress was held in December, 1929 under the president ship of Pt. Jawaharlal Nehru, in which Pt. Jawaharlal Nehru declared the objective of Purna Swaraj (Complete Independence). As the midnight hour struck on 31 December, 1929, the Congress President, Pt. Jawaharlal Nehru, unfurled the flag of Indian independence on the banks of the Ravi River at Lahore. In its meeting on 2 January, 1930, the Congress Working Committee decided that 26 January, 1930 would be celebrated as “Purna Swadhinata Diwas” or “Purna Swaraj Diwas”. From here, the celebration of 26 January every year as Complete Independence Day began.","b":false},{"id":391,"c":30,"q":"In which session of the Indian National Congress was the 'Principle of Complete Independence' adopted?","o":[["a","Kanpur Session, 1925"],["b","Lahore Session, 1929"],["c","Karachi Session, 1931"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. Teacher (9th-10th) 26.08.2023","y":2023,"e":"In the Calcutta Session of the Congress, an ultimatum was given to the British Government that it should accept the Nehru Report by the end of the year, or else it would have to face a mass movement to be started by the Congress. When the government did not give any definite reply within the fixed time-limit, the historic Lahore Session of the Congress was held in December, 1929 under the president ship of Pt. Jawaharlal Nehru, in which Pt. Jawaharlal Nehru declared the objective of Purna Swaraj (Complete Independence). As the midnight hour struck on 31 December, 1929, the Congress President, Pt. Jawaharlal Nehru, unfurled the flag of Indian independence on the banks of the Ravi River at Lahore. In its meeting on 2 January, 1930, the Congress Working Committee decided that 26 January, 1930 would be celebrated as “Purna Swadhinata Diwas” or “Purna Swaraj Diwas”. From here, the celebration of 26 January every year as Complete Independence Day began.","b":true},{"id":392,"c":30,"q":"In which Session Indian National Congress passed Complete Independence (Purna Swaraj) Resolution?","o":[["a","1920 AD Nagpur"],["b","1924 AD Belgaon"],["c","1929 AD Lahore"],["d","1931 AD Karachi"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th B.P.S.C. (Re-Exam) (Pre) 2022","y":2022,"e":"In the Calcutta Session of the Congress, an ultimatum was given to the British Government that it should accept the Nehru Report by the end of the year, or else it would have to face a mass movement to be started by the Congress. When the government did not give any definite reply within the fixed time-limit, the historic Lahore Session of the Congress was held in December, 1929 under the president ship of Pt. Jawaharlal Nehru, in which Pt. Jawaharlal Nehru declared the objective of Purna Swaraj (Complete Independence). As the midnight hour struck on 31 December, 1929, the Congress President, Pt. Jawaharlal Nehru, unfurled the flag of Indian independence on the banks of the Ravi River at Lahore. In its meeting on 2 January, 1930, the Congress Working Committee decided that 26 January, 1930 would be celebrated as “Purna Swadhinata Diwas” or “Purna Swaraj Diwas”. From here, the celebration of 26 January every year as Complete Independence Day began.","b":true},{"id":393,"c":30,"q":"Who was the president of the Indian National Congress session held in Lahore in the year 1929?","o":[["a","Vallabhbhai Patel"],["b","Motilal Nehru"],["c","Jawaharlal Nehru"],["d","Rajendra Prasad"],["e","None of the above"]],"a":"c","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"In the Calcutta Session of the Congress, an ultimatum was given to the British Government that it should accept the Nehru Report by the end of the year, or else it would have to face a mass movement to be started by the Congress. When the government did not give any definite reply within the fixed time-limit, the historic Lahore Session of the Congress was held in December, 1929 under the president ship of Pt. Jawaharlal Nehru, in which Pt. Jawaharlal Nehru declared the objective of Purna Swaraj (Complete Independence). As the midnight hour struck on 31 December, 1929, the Congress President, Pt. Jawaharlal Nehru, unfurled the flag of Indian independence on the banks of the Ravi River at Lahore. In its meeting on 2 January, 1930, the Congress Working Committee decided that 26 January, 1930 would be celebrated as “Purna Swadhinata Diwas” or “Purna Swaraj Diwas”. From here, the celebration of 26 January every year as Complete Independence Day began.","b":true},{"id":394,"c":30,"q":"Whichday was declared as'Purna Swaraj Day'by the Indian National Congress?","o":[["a","26-01-1930"],["b","15-08-1947"],["c","30-01-1948"],["d","31-12-1950"],["e","None of the above/More than one of the above"]],"a":"a","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"In the Calcutta Session of the Congress, an ultimatum was given to the British Government that it should accept the Nehru Report by the end of the year, or else it would have to face a mass movement to be started by the Congress. When the government did not give any definite reply within the fixed time-limit, the historic Lahore Session of the Congress was held in December, 1929 under the president ship of Pt. Jawaharlal Nehru, in which Pt. Jawaharlal Nehru declared the objective of Purna Swaraj (Complete Independence). As the midnight hour struck on 31 December, 1929, the Congress President, Pt. Jawaharlal Nehru, unfurled the flag of Indian independence on the banks of the Ravi River at Lahore. In its meeting on 2 January, 1930, the Congress Working Committee decided that 26 January, 1930 would be celebrated as “Purna Swadhinata Diwas” or “Purna Swaraj Diwas”. From here, the celebration of 26 January every year as Complete Independence Day began.","b":true},{"id":395,"c":30,"q":"Who raised the Flag of Independence at the Congress Session of 1929?","o":[["a","Maulana Muhammad Ali"],["b","Pandit Jawaharlal Nehru"],["c","Vallabhbhai Patel"],["d","Subhas Chandra Bose"],["e","None of the above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"In the Calcutta Session of the Congress, an ultimatum was given to the British Government that it should accept the Nehru Report by the end of the year, or else it would have to face a mass movement to be started by the Congress. When the government did not give any definite reply within the fixed time-limit, the historic Lahore Session of the Congress was held in December, 1929 under the president ship of Pt. Jawaharlal Nehru, in which Pt. Jawaharlal Nehru declared the objective of Purna Swaraj (Complete Independence). As the midnight hour struck on 31 December, 1929, the Congress President, Pt. Jawaharlal Nehru, unfurled the flag of Indian independence on the banks of the Ravi River at Lahore. In its meeting on 2 January, 1930, the Congress Working Committee decided that 26 January, 1930 would be celebrated as “Purna Swadhinata Diwas” or “Purna Swaraj Diwas”. From here, the celebration of 26 January every year as Complete Independence Day began.","b":true},{"id":396,"c":31,"q":"Dandi March was undertaken in:","o":[["a","1932"],["b","1931"],["c","1929"],["d","1930"]],"a":"d","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"Mahatma Gandhi began the Salt Satyagraha on 12 March 1930. He set out from Sabarmati Ashram with 80 companions; including Mahatma Gandhi, there were 81 members in all. After a long journey of 24 days, on 6 April 1930, he symbolically broke the salt law at Dandi and formally inaugurated the Civil Disobedience Movement. Under Gandhi’ s leadership, the movement spread across the country. In Tamil Nadu, the Gandhian leader C. Rajagopalachari undertook a Salt Satyagraha march from Tiruchirappalli to Veda ran yam.","b":false},{"id":397,"c":31,"q":"For how many days did Dandi March last?","o":[["a","10 days"],["b","20 days"],["c","24 days"],["d","30 days"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"Mahatma Gandhi began the Salt Satyagraha on 12 March 1930. He set out from Sabarmati Ashram with 80 companions; including Mahatma Gandhi, there were 81 members in all. After a long journey of 24 days, on 6 April 1930, he symbolically broke the salt law at Dandi and formally inaugurated the Civil Disobedience Movement. Under Gandhi’ s leadership, the movement spread across the country. In Tamil Nadu, the Gandhian leader C. Rajagopalachari undertook a Salt Satyagraha march from Tiruchirappalli to Veda ran yam.","b":true},{"id":398,"c":31,"q":"Where did Mahatma Gandhi start the Civil Disobedience Movement in 1930?","o":[["a","Wardha"],["b","Dandi"],["c","Sevagram"],["d","Sabarmati"],["e","None of the above"]],"a":"d","s":"63th B.P.S.C. (Pre) 2017","y":2017,"e":"Mahatma Gandhi began the Salt Satyagraha on 12 March 1930. He set out from Sabarmati Ashram with 80 companions; including Mahatma Gandhi, there were 81 members in all. After a long journey of 24 days, on 6 April 1930, he symbolically broke the salt law at Dandi and formally inaugurated the Civil Disobedience Movement. Under Gandhi’ s leadership, the movement spread across the country. In Tamil Nadu, the Gandhian leader C. Rajagopalachari undertook a Salt Satyagraha march from Tiruchirappalli to Veda ran yam.","b":true},{"id":399,"c":31,"q":"In 1930, Mahatma Gandhi started Civil Disobedience Movement from:","o":[["a","Sevagram"],["b","Dandi"],["c","Sabarmati"],["d","Wardha"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"Mahatma Gandhi began the Salt Satyagraha on 12 March 1930. He set out from Sabarmati Ashram with 80 companions; including Mahatma Gandhi, there were 81 members in all. After a long journey of 24 days, on 6 April 1930, he symbolically broke the salt law at Dandi and formally inaugurated the Civil Disobedience Movement. Under Gandhi’ s leadership, the movement spread across the country. In Tamil Nadu, the Gandhian leader C. Rajagopalachari undertook a Salt Satyagraha march from Tiruchirappalli to Veda ran yam.","b":true},{"id":400,"c":31,"q":"The famous Dandi March led by Mahatma Gandhi during the Civil Disobedience Movement covered a distance of approximately–","o":[["a","241 Miles"],["b","400 kilometers"],["c","200 kilometers"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"BPSC (TRE-3) July, 2024","y":2024,"e":"Under Mahatma Gandhi’ s leadership, the Dandi March began from Sabarmati Ashram on 12 March. He covered the 241- mile distance from Sabarmati to Dandi in 24 days.","b":false},{"id":401,"c":31,"q":"What was the ultimate goal of Gandhiji's Salt Satyagraha?","o":[["a","Repeal of Salt laws"],["b","Curtailment of the government's power"],["c","Economic relief to the common people"],["d","'Purna Swaraj' for India"],["e","None of the above/More than one of the above"]],"a":"e","s":"63rd B.P.S.C. (Pre.) 2017","y":2017,"e":"The objectives of the Salt Satyagraha launched by Gandhiji included repealing the law that gave the government a monopoly over salt manufacture, running the Civil Disobedience Movement for complete independence, providing economic relief to common people, etc.","b":false},{"id":402,"c":31,"q":"After the failure of the Civil Disobedience Movement, Gandhiji gave importance to:","o":[["a","Constructive programmes"],["b","Limited use of violence"],["c","Negotiation with British"],["d","None of the above"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"After the failure of the Civil Disobedience Movement, Gandhiji emphasized the constructive programme. In 1934, Gandhiji decided to withdraw from active politics to devote all his time to Harijan uplift. In September 1932, he established the All India Anti-Untouchability League for Harijan welfare, and in 1933 he started publishing a weekly newspaper titled ‘Harijan’.","b":false},{"id":403,"c":31,"q":"Who organized the 'Khudai Khidmatgar' in 1929?","o":[["a","Abdul Ghaffar Khan"],["b","Ali Brothers"],["c","Ansari Brothers"],["d","Maulana Abul Kalam Azad"],["e","None of the above"]],"a":"a","s":"B.P.S.C. (Pre) 2016","y":2016,"e":"In the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar Khan, a volunteer organization named ‘Khudai Khidmatgar’ was established. They were also known as the ‘Red Shirts’. The ‘Red Shirts’ raised the slogan of national unity among the Pathans, organized a movement against British colonialism for independence, and demanded improvement in the condition of working people. It is noteworthy that when Muslims in other provinces were keeping themselves away from the Satyagraha movement, the Muslims of the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar, played an important role in the Civil Disobedience Movement.","b":false},{"id":404,"c":31,"q":"What was'Khudai Khidmatgar', established by Khan Abdul Ghaffar Khan, also known as?","o":[["a","Blue Shirts"],["b","Green Shirts"],["c","Black Shirts"],["d","Red Shirts"],["e","None of the above"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"In the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar Khan, a volunteer organization named ‘Khudai Khidmatgar’ was established. They were also known as the ‘Red Shirts’. The ‘Red Shirts’ raised the slogan of national unity among the Pathans, organized a movement against British colonialism for independence, and demanded improvement in the condition of working people. It is noteworthy that when Muslims in other provinces were keeping themselves away from the Satyagraha movement, the Muslims of the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar, played an important role in the Civil Disobedience Movement.","b":true},{"id":405,"c":31,"q":"Who organised the 'Khudai Khidmatgar' in 1929?","o":[["a","Abdul Ghaffar Khan"],["b","Ali Brothers"],["c","Ansari Brothers"],["d","Maulana Abul Kalam Azad"],["e","None of the above/More than one of the above"]],"a":"a","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"In the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar Khan, a volunteer organization named ‘Khudai Khidmatgar’ was established. They were also known as the ‘Red Shirts’. The ‘Red Shirts’ raised the slogan of national unity among the Pathans, organized a movement against British colonialism for independence, and demanded improvement in the condition of working people. It is noteworthy that when Muslims in other provinces were keeping themselves away from the Satyagraha movement, the Muslims of the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar, played an important role in the Civil Disobedience Movement.","b":true},{"id":406,"c":31,"q":"Who is known as 'Frontier Gandhi'?","o":[["a","M. A. Jinnah"],["b","Shaukat Ali"],["c","Abul Kalam Azad"],["d","Abdul Ghaffar Khan"],["e","None of the above/More than one of the above"]],"a":"d","s":"67th B.P.S.C. (Re-Exam) (Pre)-2022","y":2022,"e":"Khan Abdul Ghaffar Khan was known as the Frontier Gandhi.","b":false},{"id":407,"c":31,"q":"The real name of the ‘Frontier Gandhi’ is:","o":[["a","Purus hot tam Das Tandon"],["b","Netaji Subhash Chandra Bose"],["c","Abdul Ghaffar Khan"],["d","Maulana Abul Kalam Azad"]],"a":"c","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"In the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar Khan, a volunteer organization named ‘Khudai Khidmatgar’ was established. They were also known as the ‘Red Shirts’. The ‘Red Shirts’ raised the slogan of national unity among the Pathans, organized a movement against British colonialism for independence, and demanded improvement in the condition of working people. It is noteworthy that when Muslims in other provinces were keeping themselves away from the Satyagraha movement, the Muslims of the North-West Frontier Province, under the leadership of Khan Abdul Ghaffar, played an important role in the Civil Disobedience Movement.","b":true},{"id":408,"c":32,"q":"Gandhi-Irwin Pact was signed in:","o":[["a","1931"],["b","1935"],["c","1942"],["d","1919"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011 · 44th B.P.S.C. (Pre) 2000","y":2011,"e":"The Gandhi–Irwin Pact was concluded on 5 March, 1931. According to this pact- (i) Under Gandhi’ s leadership, the Congress agreed to suspend the Civil Disobedience Movement. (ii) Orders were issued to release political prisoners against whom there was no allegation of violence. (iii) The right to stage peaceful dha rnas at foreign cloth shops and liquor shops was granted. (iv) In coastal regions, permission was given to make salt without paying the salt tax. (v) The Congress agreed to participate in the Second Round Table Conference; however, this pact disappointed the public because it did not include the public demand that Bhagat Singh, Sukhdev, and Rajguru should not be hanged.","b":false},{"id":409,"c":32,"q":"Who played an important role inthe signing of Gandhi-Irwin Pact?","o":[["a","Motilal Nehru"],["b","Madan Mohan Malviya"],["c","Tej Bahadur Sapru"],["d","Chin tam ani"]],"a":"c","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"Viceroy Irwin released Gandhi from jail on 26 January, 1931 to create an atmosphere of harmony in the country. Due to the efforts of Tej Bahadur Sapru, V.S. Srinivasa Sastri, and M.R. Jayakar, talks between Mahatma Gandhi and Irwin began in Delhi in February, 1931. On 5 March, 1931, an agreement was reached between them, which came to be known as the Gandhi–Irwin Pact. In this context, Sarojini Naidu described Gandhi and Irwin as “two Mahatmas”.","b":false},{"id":410,"c":32,"q":"In which year the famous Gandhi-Irwin Pact took place?","o":[["a","1929 AD"],["b","1930 AD"],["c","1931 AD"],["d","1932 AD"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th B.P.S.C. (Re-Exam) (Pre)-2022","y":2022,"e":"Viceroy Irwin released Gandhi from jail on 26 January, 1931 to create an atmosphere of harmony in the country. Due to the efforts of Tej Bahadur Sapru, V.S. Srinivasa Sastri, and M.R. Jayakar, talks between Mahatma Gandhi and Irwin began in Delhi in February, 1931. On 5 March, 1931, an agreement was reached between them, which came to be known as the Gandhi–Irwin Pact. In this context, Sarojini Naidu described Gandhi and Irwin as “two Mahatmas”.","b":true},{"id":411,"c":32,"q":"What important event happened on March 5, 1931?","o":[["a","Gandhi-Irwin Pact"],["b","Gandhi's participation in the Round Table Conference"],["c","Karachi Congress"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. School Teacher · Headmaster 09.12.2023","y":2023,"e":"Viceroy Irwin released Gandhi from jail on 26 January, 1931 to create an atmosphere of harmony in the country. Due to the efforts of Tej Bahadur Sapru, V.S. Srinivasa Sastri, and M.R. Jayakar, talks between Mahatma Gandhi and Irwin began in Delhi in February, 1931. On 5 March, 1931, an agreement was reached between them, which came to be known as the Gandhi–Irwin Pact. In this context, Sarojini Naidu described Gandhi and Irwin as “two Mahatmas”.","b":true},{"id":412,"c":32,"q":"The Second Round Table Conference in London was held in the backdrop of the:","o":[["a","Emerson-Gandhi Pact"],["b","Hailey-Gandhi Pact"],["c","Irwin-Gandhi Pact"],["d","Gandhi-Simon Pact"]],"a":"c","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"Viceroy Irwin released Gandhi from jail on 26 January, 1931 to create an atmosphere of harmony in the country. Due to the efforts of Tej Bahadur Sapru, V.S. Srinivasa Sastri, and M.R. Jayakar, talks between Mahatma Gandhi and Irwin began in Delhi in February, 1931. On 5 March, 1931, an agreement was reached between them, which came to be known as the Gandhi–Irwin Pact. In this context, Sarojini Naidu described Gandhi and Irwin as “two Mahatmas”.","b":true},{"id":413,"c":33,"q":"Which of the following Indian leaders attended the First Round Table Conference in London?","o":[["a","Maulana Mohammad Ali"],["b","Maulana Abul Kalam Azad"],["c","Mahatma Gandhi"],["d","Pt. Jawaharlal Nehru"]],"a":"a","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"On 10 June and 24 June 1930, the Simon Commission’ s report was published in two parts. Indian political organizations rejected the Commission’ s recommendations. At the time the report was published, the main Congress leaders were in jail. In an atmosphere of disappointment and dissatisfaction, the British government convened the First Round Table Conference in London in November 1930. About 89 representatives participated, but no representative from the Congress attended. The prominent Indian participants included—Tej Bahadur Sapru, V. S. Srinivasa Sastri, Muhammad Ali, Muhammad Shafi, Aga Khan, Fazlul Haq, Muhammad Ali Jinnah, Homi Modi, M. R. Jayakar, Moonje, B. R. Ambedkar, and Sundar Singh Majithia.","b":false},{"id":414,"c":33,"q":"Who participated in all three RoundTable Conferences?","o":[["a","Maulana Abul Kalam Azad"],["b","Madan Mohan Malaviya"],["c","B.R. Ambedkar"],["d","Mahatma Gandhi"],["e","None of the above"]],"a":"c","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"Among the given options, the Dalit leader B. R. Ambedkar participated in all the three Round Table Conferences. In the Second Round Table Conference, Mahatma Gandhi took part as the sole representative of the Congress. Besides him, Sarojini Naidu and Madan Mohan Malaviya also participated in this conference.","b":false},{"id":415,"c":33,"q":"Which Round Table Conference was held in 1932?","o":[["a","First"],["b","Second"],["c","Third"],["d","Fourth"]],"a":"c","s":"56th to 59thB.P.S.C. (Pre) 2014 · 53rd to 55th B.P.S.C. (Pre) 2011","y":2014,"e":"The First Round Table Conference was held in London from 12 November 1930 to 19 January 1931. Representatives of the Indian Liberal Party, Muslim League, Hindu Mahasabha, Depressed Classes, business community, and princely states participated, but the Congress did not join it. The Second Round Table Conference was held in London from 7 September 1931 to 1 December 1931, in which Gandhi participated as the sole representative of the Congress. The Third Round Table Conference was held in London from 17 November 1932 to 24 December 1932. The Congress boycotted this conference.","b":false},{"id":416,"c":33,"q":"The Indian National Congress did not take part in which of the following Round Table Conferences?","o":[["a","First"],["b","Second"],["c","Third"],["d","Participated in all"],["e","None of the above/More than one of the above"]],"a":"e","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"The First Round Table Conference was held in London from 12 November 1930 to 19 January 1931. Representatives of the Indian Liberal Party, Muslim League, Hindu Mahasabha, Depressed Classes, business community, and princely states participated, but the Congress did not join it. The Second Round Table Conference was held in London from 7 September 1931 to 1 December 1931, in which Gandhi participated as the sole representative of the Congress. The Third Round Table Conference was held in London from 17 November 1932 to 24 December 1932. The Congress boycotted this conference.","b":true},{"id":417,"c":33,"q":"On which issue did the Second RoundTable Conference fail?","o":[["a","Communal Delegations"],["b","Granting Dominion Status"],["c","The date of transfer of ruling power"],["d","Postponement of Civil Disobedience Movement"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"The Second Round Table Conference began on 7 September 1931, in which Mahatma Gandhi participated as the sole representative of the Congress. Due to disputes over the communal issue, the conference could not reach any decisive conclusion. Dalit leader B. R. Ambedkar demanded separate electorates for Dalits, which Gandhi rejected. Ultimately, due to the deadlock over communal representation, the conference was declared closed on 1 December 1931.","b":false},{"id":418,"c":33,"q":"What was the point of difference between Dr. Ambedkar and Mahatma Gandhi during the Second Round Table Conference?","o":[["a","Dalit reservation in government jobs"],["b","Dalit reservation in ministries"],["c","Separate citizenship status for Dalits"],["d","Separate voting for Dalits"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The Second Round Table Conference began on 7 September 1931, in which Mahatma Gandhi participated as the sole representative of the Congress. Due to disputes over the communal issue, the conference could not reach any decisive conclusion. Dalit leader B. R. Ambedkar demanded separate electorates for Dalits, which Gandhi rejected. Ultimately, due to the deadlock over communal representation, the conference was declared closed on 1 December 1931.","b":true},{"id":419,"c":33,"q":"Mahatma Gandhi returned to India in December, 1931 empty-handed from","o":[["a","London"],["b","Moscow"],["c","Washington"],["d","Tokyo"]],"a":"a","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"As the sole representative of the Congress, Mahatma Gandhi participated in the Second Round Table Conference, which began on 7 September, 1931. However, on 28 December, 1931, he returned from London to Bombay, disappointed and empty-handed. On reaching India, he said, “It is true that I have returned empty-handed, but I am satisfied that the flag which was entrusted to me, I did not let it fall, and I did not compromise with its honour.”","b":false},{"id":420,"c":33,"q":"Who was the Prime Minister of Englandat the time of the Round Table Conference?","o":[["a","Sir Winston Churchill"],["b","Clement Attlee"],["c","Harold Wilson"],["d","James Ramsay Mac Donald"]],"a":"d","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"To discuss constitutional reforms in India, the British government organized three Round Table Conferences during 1930–32 as part of a series of conferences. These conferences were conducted on the basis of the report submitted by the Simon Commission in June, 1930. At this time, James Ramsay Mac Donald was the Prime Minister of the United Kingdom.","b":false},{"id":421,"c":34,"q":"When was the Poona Pact signed?","o":[["a","September 24, 1932"],["b","September 24, 1930"],["c","September 26, 1932"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. School Teacher · Headmaster 09.12.2023","y":2023,"e":"On 24 September, 1932, the Poona Agreement took place between Bhimrao Ambedkar and the followers of Mahatma Gandhi. After the British government approved this agreement, Gandhiji broke his fast on 26 September, 1932.","b":false},{"id":422,"c":34,"q":"Aseparate electoral group was madeby the Communal Award of Ramsay Mac Donald first time in August, 1932 for–","o":[["a","Muslims"],["b","Indian Christians"],["c","Anglo-Indians"],["d","Untouchables"]],"a":"d","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"British Prime Minister Ramsay Mac Donald presented the Communal Award on 16 August, 1932. Under it, certain seats were reserved in the legislatures for each minority community, and the members were to be elected through separate electorates. Muslims and Sikhs were already considered minorities. Now, under this Communal Award, the Dalit class was also treated as a minority and separated from the Hindus.","b":false},{"id":423,"c":34,"q":"How many seats were given to Depressed Classes under Communal Award and Poona Pact?","o":[["a","74 and 79 respectively"],["b","71 and 147 respectively"],["c","78 and 80 respectively"],["d","78 and 69 respectively"]],"a":"b","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"In the Communal Award, the number of reserved seats for Dalits in the provincial legislatures was 71, which was increased in the Poona Pact (Poona Agreement) to 148 (Madras–30; Bombay including Sindh–15; Punjab–8; Bihar and Orissa–18; Central Provinces and Berar–20; Assam–7; Bengal–30; and the United Provinces of Agra and Oudh–20). In some books, however, this number is given as 147. Also, in the Central Legislature, 18 percent of the seats from the general category were reserved for the Dalit classes.","b":false},{"id":424,"c":34,"q":"The purpose of Poona Pact was:","o":[["a","Hindu-Muslim unity"],["b","To provide representation of untouchables"],["c","To privileged the Kings"],["d","Reconsideration of Diarchy"]],"a":"b","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"In the Communal Award, the number of reserved seats for Dalits in the provincial legislatures was 71, which was increased in the Poona Pact (Poona Agreement) to 148 (Madras–30; Bombay including Sindh–15; Punjab–8; Bihar and Orissa–18; Central Provinces and Berar–20; Assam–7; Bengal–30; and the United Provinces of Agra and Oudh–20). In some books, however, this number is given as 147. Also, in the Central Legislature, 18 percent of the seats from the general category were reserved for the Dalit classes.","b":true},{"id":425,"c":35,"q":"The Congress Socialist Party was founded in 1934 by:","o":[["a","Jawaharlal Nehru and Vinoba Bhave"],["b","Jawaharlal Nehru and Jayaprakash Narayan"],["c","Jayaprakash Narayan and Acharya Narendra Dev"],["d","Ashok Mehta and Dr. Rajendra Prasad"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"In 1934, due to the efforts of Jayaprakash Narayan and Acharya Narendra Dev, the Congress Socialist Party was formed. Other members of this party included Dr. Ram Manohar Lohia, Achyut Pat war dhan, Minoo Masani, and Ashok Mehta. The first All-India conference of this party was held in Patna in October, 1934.","b":false},{"id":426,"c":35,"q":"Which party was Jayaprakash Narayan associated with?","o":[["a","Congress"],["b","Kisan Sabha"],["c","Congress Socialist"],["d","Communist"]],"a":"c","s":"48th to 52nd B.P.S.C. (Pre) 2008 · 45th B.P.S.C. 2001-02 · 42nd B.P.S.C. (Pre) 1997-98","y":2008,"e":"In 1934, due to the efforts of Jayaprakash Narayan and Acharya Narendra Dev, the Congress Socialist Party was formed. Other members of this party included Dr. Ram Manohar Lohia, Achyut Pat war dhan, Minoo Masani, and Ashok Mehta. The first All-India conference of this party was held in Patna in October, 1934.","b":true},{"id":427,"c":35,"q":"In which year was the Congress Socialist Party (CSP) formed?","o":[["a","1934"],["b","1930"],["c","1932"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"In 1934, due to the efforts of Jayaprakash Narayan and Acharya Narendra Dev, the Congress Socialist Party was formed. Other members of this party included Dr. Ram Manohar Lohia, Achyut Pat war dhan, Minoo Masani, and Ashok Mehta. The first All-India conference of this party was held in Patna in October, 1934.","b":true},{"id":428,"c":36,"q":"The Provincial Governments were constituted under the Act of-","o":[["a","1935"],["b","1932"],["c","1936"],["d","1947"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"On the basis of the Government of India Act, 1935, elections to the provincial legislatures were held in February 1937. In these elections, Congress wiped out its rival parties and secured an absolute majority in five provinces—Madras (159 out of 215 seats), Bihar (98 out of 152), Central Provinces and Berar (70 out of 112), United Provinces (134 out of 228), and Orissa (36 out of 60). Congress emerged as the largest party in Bombay (almost an absolute majority), Assam, and the North-West Frontier Province. Only in Bengal, Punjab, and Sind was Congress unable to become the largest party. In July 1937, Congress formed its governments in 6 provinces—Madras, United Provinces, Central Provinces and Berar, Bihar, Bombay, and Orissa. Note: In Bombay, Congress got almost an absolute majority (86 out of 175 seats). In Ayodhya Singh’ s book 'Bharat Ka Mukti-Sangram', Congress is shown as having an absolute majority in Bombay as well (88 out of 175 seats), which, according to other sources, is not correct.","b":false},{"id":429,"c":37,"q":"Who was elected the President of Indian National Congress in 1938?","o":[["a","Abul Kalam Azad"],["b","Subhash Chandra Bose"],["c","Pattabhi Sitaramayya"],["d","J. B. Kripalani"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"At the Haripura (Gujarat) session of the Congress (February 1938), Subhas Chandra Bose was elected President unopposed. It is noteworthy that in 1939, at the Tripuri session, he was elected President by defeating Pattabhi Sitaramayya.","b":false},{"id":430,"c":37,"q":"Whobecome the President of Indian National Congress when Subhash Chandra Bose resigned in 1939?","o":[["a","Rajendra Prasad"],["b","Abul Kalam Azad"],["c","Jawaharlal Nehru"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C. Re-Exam (Pre) 2024","y":2024,"e":"At the Haripura (Gujarat) session of the Congress in 1938, Subhas Chandra Bose became Congress President for the first time (unopposed). At the Tripuri session of 1939, he became President for the second time by defeating Pattabhi Sitaramayya, who was supported by Gandhiji; however, due to differences with Gandhiji on the issue of constituting the Working Committee, he resigned, after which Dr. Rajendra Prasad became the acting President of Congress. It should be noted that the Second World War ended (especially with reference to Japan’ s surrender) in August–September 1945 (in August 1945, the United States of America dropped atomic bombs on Japan, and in September 1945 Japan signed the surrender instrument). During this period (August–September 1945), Clement Attlee was the Prime Minister of Britain, not Churchill. After the change of power in Britain in July 1945, Attlee (1945–1951) became Prime Minister in place of Churchill. In an official research note of the British Parliament (House of Lords Library), it is clearly stated that the confirmation of the end of the Second World War was made through a radio broadcast by Prime Minister Attlee.","b":false},{"id":431,"c":38,"q":"The purpose of the Butler Committee, 1927:","o":[["a","Modernization of Indian Army"],["b","Innovative modernization of Indian Agriculture."],["c","Implementation of Sensor over National Newspapers."],["d","Improvement of relationships between Indian Provinces and the Crown. 46th B.P.C.S. (Pre) 2004"]],"a":"d","s":"B.P.S.C. (Pre)","y":null,"e":"The Butler Committee was constituted in 1927; it is also called the Indian States Committee. Its objective was to examine the relations between the Government of India and the Indian princely states, and to make recommendations to improve the economic and financial relations between British India and the princely states. The Indian rulers appointed a well-known lawyer, Leslie Scott, to present their viewpoint before the Committee. Scott argued that each princely state was originally independent, and therefore it remained independent except to the extent to which it had surrendered its sovereignty to the British Crown; that is, special rights/ privileges lay with the princely states.","b":false},{"id":432,"c":38,"q":"All India State People's Conference was set up in –","o":[["a","1924"],["b","1926"],["c","1927"],["d","1929"]],"a":"c","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"The All-India States’ People’ s Conference was organized in December 1927. It was a federation of political movements and Praja Mandals in the princely states under British rule. About 700 political activists from different princely states participated in it and played an important role in its organization.","b":false},{"id":433,"c":38,"q":"During the freedom struggle, a parallel movement launched in the Indian States (in the States ruled by the Indian rulers such as Kashmir, Nizam's Hyderabad, Travancore, etc.) was","o":[["a","Swaraj Movement"],["b","State People's Movement"],["c","Praja Mandal Movement"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"During the freedom struggle, a parallel movement was started in the Indian states (states ruled by Indian rulers such as Kashmir, the Nizam of Hyderabad, Travancore, etc.), which was called the Praja Mandal Movement.","b":false},{"id":434,"c":39,"q":"Who was the British Prime Minister of Britain during the Second World War?","o":[["a","Clement Attlee"],["b","Anthony Eden"],["c","Winston Churchill"],["d","Herold Wilson"]],"a":"c","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"At the beginning of the Second World War (1939–45), the British Prime Minister was Neville Chamberlain (1937–40), and during the Second World War the British Prime Minister was Winston Churchill (tenure 1940–45). Note—Winston Churchill served as British Prime Minister twice: 1940–45 and 1951–55.","b":false},{"id":435,"c":40,"q":"Who wrote the ‘Now or Never’ pamphlet?","o":[["a","Muhammad Jinnah"],["b","Muhammad Iqbal"],["c","Rahmat Ali"],["d","Khafi Khan"],["e","None of the above / More than one of the above"]],"a":"c","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"A Cambridge University student, Chaudhry Rahmat Ali, wrote a pamphlet in 1933 titled Now or Never; Are We to Live or Perish for Ever? In it, he demanded a separate national status for a new identity, which he named Pakistan. [In his pamphlet, Chaudhry Rahmat Ali used the word ‘Pakstan’ (PAKSTAN), which was later called ‘Pakistan’ (PAKISTAN).] The word “Pakistan” was formed from the first letters of Punjab, Afghan Province, Kashmir and Sindh, and the last three letters of Balochistan— P - Punjab\nA - Afghan Province (North-West Frontier Province)\nK - Kashmir\nS - Sindh\nTan - Balochistan","b":false},{"id":436,"c":40,"q":"Who raised the cry \"Divide and Quit\"","o":[["a","M.A. Jinnah"],["b","M.A.Ansari"],["c","Jawaharlal Nehru"],["d","Muhammad Iqbal"]],"a":"a","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"The slogan “Divide and Quit” was raised by the Muslim League leader Muhammad Ali Jinnah during the Second World War, in 1943. Jinnah and the Muslim League demanded that the British should first divide India into two parts—Hindustan and Pakistan—and then quit India. This idea was expressed in the form of the political slogan “Divide and Quit”.","b":false},{"id":437,"c":40,"q":"Who among following led the movement for the separate State of Pakistan?","o":[["a","Aga Khan"],["b","Nawab Salim Ullah"],["c","Liaqat Ali Khan"],["d","Md. Ali Jinnah"]],"a":"d","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"On 22–24 March, 1940, the Muslim League session was held at Lahore. It was presided over by Muhammad Ali Jinnah. In this session, a resolution was passed demanding ‘independent states’ for the Muslims of the north-western and eastern regions; this is known as the ‘Lahore Resolution’. Later, this ‘Lahore Resolution’ came to be known as the ‘Pakistan Resolution’. However, it is noteworthy that this resolution mentioned neither partition nor the word ‘Pakistan’. In the Lahore Resolution, it was stated that separate independent states should be formed by grouping together the Muslim-majority regions of north-western and eastern India—not a single independent nation. Some people at that time interpreted it as a demand for two independent countries (India and Pakistan). However, the Lahore Resolution (Pakistan Resolution) later paved the way for the creation of Pakistan.","b":false},{"id":438,"c":40,"q":"The resolution demanding the formation of Pakistan was passed by Muslim League in the year of –","o":[["a","1939"],["b","1940"],["c","1941"],["d","1942"]],"a":"b","s":"42nd B.P.S.C. (Pre) 1997-98","y":1997,"e":"On 22–24 March, 1940, the Muslim League session was held at Lahore. It was presided over by Muhammad Ali Jinnah. In this session, a resolution was passed demanding ‘independent states’ for the Muslims of the north-western and eastern regions; this is known as the ‘Lahore Resolution’. Later, this ‘Lahore Resolution’ came to be known as the ‘Pakistan Resolution’. However, it is noteworthy that this resolution mentioned neither partition nor the word ‘Pakistan’. In the Lahore Resolution, it was stated that separate independent states should be formed by grouping together the Muslim-majority regions of north-western and eastern India—not a single independent nation. Some people at that time interpreted it as a demand for two independent countries (India and Pakistan). However, the Lahore Resolution (Pakistan Resolution) later paved the way for the creation of Pakistan.","b":true},{"id":439,"c":40,"q":"The 'Day of Deliverance' was observed by the Muslim League on which date?","o":[["a","December 22, 1939"],["b","October 17, 1939"],["c","December 22, 1940"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. Teacher (9th-10th) 26.08.2023","y":2023,"e":"The Muslim League observed 22 December, 1939 as ‘Deliverance Day’.","b":false},{"id":440,"c":40,"q":"Whendid Muslim League observe “Direct Action Day”?","o":[["a","14 August, 1946"],["b","15 August, 1947"],["c","16 August, 1946"],["d","More than one of the above"]],"a":"c","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The date 16 August, 1946 was fixed by the Muslim League for “Direct Action Day”. Rejecting the Viceroy’ s decision regarding the Interim Government, the Muslim League demanded the establishment of an independent and fully sovereign state of Pakistan. The aim on that date was to incite riots and create an atmosphere of terror to show that Hindus and Muslims could not live together. In this action, Noakhali became a major centre of the riots.","b":false},{"id":441,"c":40,"q":"Whom did Rajendra Prasad consider as the father of Pakistan?","o":[["a","Md. Jinnah"],["b","Lord Mountbatten"],["c","Lord Minto"],["d","Liaquat Ali Khan"],["e","None of the above/More than one of the above"]],"a":"c","s":"63rd B.P.S.C. (Pre.) 2017","y":2017,"e":"Rajendra Prasad regarded Lord Minto as the father of Pakistan. It may be noted that the system of communal representation introduced in the Morley–Minto Reforms of 1909 greatly encouraged communalism, which ultimately led to Partition.","b":false},{"id":442,"c":40,"q":"“The Muslims,if contented and satisfied, would become the greatest bulwark of British power in India.” Who wrote it?","o":[["a","Herbert Risley"],["b","Lord Lytton"],["c","W.W. Hunter"],["d","H.N. Brailsford"],["e","None of the above/More than one of the above"]],"a":"c","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"W. W. Hunter wrote in his book The Indian Musalmans that, “The Muslims, if contented and satisfied would become the greatest bul work of British power in India.”","b":false},{"id":443,"c":41,"q":"In 1940, where did Vinoba Bhave start the Individual Satyagraha?","o":[["a","Punnapra-Vayalar, Kerala"],["b","Nadiad in Kheda district, Gujarat"],["c","Paunar, Maharashtra"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"The Individual Satyagraha began on 17 October 1940 from Paunar Ashram, Maharashtra. Vinoba Bhave was the first satyagrahi, while Pandit Jawaharlal Nehru was the second satyagrahi. After the arrest of Jawaharlal Nehru at Chheoki Railway Station (Prayagraj), Brahma datta was appointed as the next satyagrahi.","b":false},{"id":444,"c":41,"q":"Who was the first Satyagrahi of the Individual Satyagraha Movement?","o":[["a","Sarojini Naidu"],["b","C. Rajagopalachari"],["c","Vinoba Bhave"],["d","Subhash Chandra Bose"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"The Individual Satyagraha began on 17 October 1940 from Paunar Ashram, Maharashtra. Vinoba Bhave was the first satyagrahi, while Pandit Jawaharlal Nehru was the second satyagrahi. After the arrest of Jawaharlal Nehru at Chheoki Railway Station (Prayagraj), Brahma datta was appointed as the next satyagrahi.","b":true},{"id":445,"c":41,"q":"Who was the third Satyagrahi of the Individual Satyagraha started by Mahatma Gandhi in the year 1940?","o":[["a","Vinoba Bhave"],["b","Jawaharlal Nehru"],["c","Rajendra Prasad"],["d","Brahma datta"],["e","None of the above"]],"a":"d","s":"67th B.P.S.C. (Pre) (Re. Exam), 2021","y":2021,"e":"The Individual Satyagraha began on 17 October 1940 from Paunar Ashram, Maharashtra. Vinoba Bhave was the first satyagrahi, while Pandit Jawaharlal Nehru was the second satyagrahi. After the arrest of Jawaharlal Nehru at Chheoki Railway Station (Prayagraj), Brahma datta was appointed as the next satyagrahi.","b":true},{"id":446,"c":41,"q":"Who started Individual Civil Disobedience?","o":[["a","Vinoba Bhave"],["b","Jawaharlal Nehru"],["c","Sardar Patel"],["d","Shaukat Ali"]],"a":"a","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"The Individual Satyagraha began on 17 October 1940 from Paunar Ashram, Maharashtra. Vinoba Bhave was the first satyagrahi, while Pandit Jawaharlal Nehru was the second satyagrahi. After the arrest of Jawaharlal Nehru at Chheoki Railway Station (Prayagraj), Brahma datta was appointed as the next satyagrahi.","b":true},{"id":447,"c":42,"q":"When did Sir Stafford Cripps arrive in Delhi?","o":[["a","January 23, 1941"],["b","March 23, 1942"],["c","June 23, 1942"],["d","October 23, 1942"],["e","None of the above"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"America and China put pressure on Britain to grant independence to India. As a result, the then British Prime Minister Winston Churchill announced the Cripps Mission on 11 March 1942. On 23 March 1942, the Cripps Mission reached Delhi, headed by Sir Stafford Cripps.","b":false},{"id":448,"c":42,"q":"\"The offer of Cripps really gave us nothing. If we accepted the offer, we might have to rue in the future ________ War had given India an opportunity for achieving her freedom. We must not lose it by depending upon a mere promise.\" Who wrote these words?","o":[["a","Jawaharlal Nehru"],["b","Maulana Abul Kalam Azad"],["c","Mahatma Gandhi"],["d","Subhas Chandra Bose"],["e","None of the above / More than one of the above"]],"a":"b","s":"B.P.S.C. CDPO (Pre) 2022","y":2022,"e":"Maulana Abul Kalam Azad, in his book India Wins Freedom, said about the proposals that the British delegation of the Cripps Mission was to place before Indians: “The Cripps offer really gave us nothing. If we accepted his offer, we might have cause to rue it in the future. The war had given India an opportunity for achieving her freedom. We must not lose it by depending upon a mere promise.”","b":false},{"id":449,"c":42,"q":"Who viewed the Cripps proposal as a 'post-dated cheque upon a crashing bank'?","o":[["a","Mahatma Gandhi"],["b","Jawaharlal Nehru"],["c","J.B. Kripalani"],["d","Jayaprakash Narayan"]],"a":"a","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"After the Japanese forces captured Rangoon, under pressure from the United States, the British Government decided to send Sir Stafford Cripps (a member of the British Cabinet) to India, so that a solution could be found through talks with Indian leaders. Cripps stayed in India for three weeks (March–April 1942) and, after discussions with Indian leaders, announced his proposals as a draft. Mahatma Gandhi described it as a “post-dated cheque”; according to Sar vep all i Gopal’ s book Jawaharlal Nehru: A Biography, the words “on a crashing bank” were added by a journalist.","b":false},{"id":450,"c":43,"q":"Quit India movement began on:","o":[["a","9 th August, 1942"],["b","10th August, 1942"],["c","15th August, 1942"],["d","16th August, 1942"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"On 7–8 August 1942, a special meeting of the All India Congress Committee was held at the historic Gowalia Tank (August Kranti Maidan) in Bombay, in which the Wardha Resolution (Quit India) was ratified. After minor amendments, the resolution was adopted on 8 August 1942, and the formal launch of the Quit India Movement against the British, as part of India’ s freedom struggle, took place on 8 August 1942 itself. On 9 August 1942, due to the arrest of leaders, the movement spontaneously spread among the masses. Thus, the practical beginning of the Quit India Movement is considered to be 9 August 1942. As soon as the movement began, under “Operation Zero Hour”, Gandhiji and other prominent Congress leaders were arrested. Gandhiji was arrested and kept in the Aga Khan Palace at Poona (Pune) along with Sarojini Naidu. The 1942 movement had the maximum impact in Bombay, Bengal, Bihar, Odisha, the United Provinces and Madras.","b":false},{"id":451,"c":43,"q":"Quit India resolution passed by Congress in Bombay-","o":[["a","August 7, 1942"],["b","August 8, 1942"],["c","August 9, 1942"],["d","More than one of the above"],["e","None of the above B.P.S.C. Teacher (11th -12th) 15-12-2023"]],"a":"b","s":"B.P.S.C. (Pre)","y":null,"e":"On 7–8 August 1942, a special meeting of the All India Congress Committee was held at the historic Gowalia Tank (August Kranti Maidan) in Bombay, in which the Wardha Resolution (Quit India) was ratified. After minor amendments, the resolution was adopted on 8 August 1942, and the formal launch of the Quit India Movement against the British, as part of India’ s freedom struggle, took place on 8 August 1942 itself. On 9 August 1942, due to the arrest of leaders, the movement spontaneously spread among the masses. Thus, the practical beginning of the Quit India Movement is considered to be 9 August 1942. As soon as the movement began, under “Operation Zero Hour”, Gandhiji and other prominent Congress leaders were arrested. Gandhiji was arrested and kept in the Aga Khan Palace at Poona (Pune) along with Sarojini Naidu. The 1942 movement had the maximum impact in Bombay, Bengal, Bihar, Odisha, the United Provinces and Madras.","b":true},{"id":452,"c":43,"q":"After passing the resolution of ‘Quit India Movement’ Gandhiji was arrested in –","o":[["a","Yarawada Jail"],["b","Naini Jail"],["c","The fort of Ahmednagar"],["d","Aga Khan Palace"]],"a":"d","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"On 7–8 August 1942, a special meeting of the All India Congress Committee was held at the historic Gowalia Tank (August Kranti Maidan) in Bombay, in which the Wardha Resolution (Quit India) was ratified. After minor amendments, the resolution was adopted on 8 August 1942, and the formal launch of the Quit India Movement against the British, as part of India’ s freedom struggle, took place on 8 August 1942 itself. On 9 August 1942, due to the arrest of leaders, the movement spontaneously spread among the masses. Thus, the practical beginning of the Quit India Movement is considered to be 9 August 1942. As soon as the movement began, under “Operation Zero Hour”, Gandhiji and other prominent Congress leaders were arrested. Gandhiji was arrested and kept in the Aga Khan Palace at Poona (Pune) along with Sarojini Naidu. The 1942 movement had the maximum impact in Bombay, Bengal, Bihar, Odisha, the United Provinces and Madras.","b":true},{"id":453,"c":43,"q":"On 6th July, 1942, at the Working Committee of the Congress, Mahatma Gandhi discussed for the first time his ‘Quit India Policy’.The President of the Committee was:","o":[["a","Rajagopalachari"],["b","Maulana Abul Kalam Azad"],["c","Pandit Jawaharlal Nehru"],["d","Annie Besant"]],"a":"b","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"In the Congress Working Committee meeting held at Wardha in July 1942, Maulana Abul Kalam Azad, Sarojini Naidu, J.L. Nehru, Vallabhbhai Patel, Dr. Rajendra Prasad, Sitaramayya, G.B. Pant, Prafulla Chandra Ghosh, Saiyyid Mahmud, Aruna Asaf Ali, J.B. Kripalani, Mahatma Gandhi, etc. participated, and the resolution named “Quit India” was passed, which was adopted on 8 August 1942 in the All India Congress Committee meeting held at Gowalia Tank. It was presided over by Abul Kalam Azad.","b":false},{"id":454,"c":43,"q":"\"We shall either free India or die in the attempt \"who said it?","o":[["a","Mahatma Gandhi"],["b","Jawaharlal Nehru"],["c","Abul Kalam Azad"],["d","V.D. Savarkar"]],"a":"a","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"This statement was made by Mahatma Gandhi on 8 August 1942 on the occasion of the Quit India Movement. In the session of the All India Congress Committee at the Gowalia Tank ground in Bombay (now Mumbai)—later known as “August Kranti Maidan”—Gandhiji gave this message in the form of his famous slogan “Do or Die”. In his speech, he said that Indians must now resolve that either they will make India free, or they will sacrifice their lives in this effort.","b":false},{"id":455,"c":43,"q":"Quit India Movement was led by:","o":[["a","B.R. Ambedkar"],["b","Jawaharlal Nehru"],["c","Mahatma Gandhi"],["d","None of them"]],"a":"d","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"The meeting of the All-India Congress Committee ended around midnight on 8 August, 1942. On 9 August, 1942, the police arrested major Congress leaders such as Mahatma Gandhi and Maulana Azad. Therefore, the movement became leader less.","b":false},{"id":456,"c":43,"q":"The slogan ‘Do or Die’ was related with –","o":[["a","Dandi"],["b","Non-cooperation"],["c","Khilafat"],["d","Quit India"]],"a":"d","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"The slogan mentioned in the question is associated with the Quit India Movement. On 8 August, 1942, the Quit India Resolution was passed after certain amendments. During this time, Gandhi’ s statement was especially important: “I will not be satisfied with anything less than complete freedom. The British government may offer to abolish the salt tax, liquor-drinking, etc., but my words will be—nothing less than freedom. I give you a mantra—‘Do or Die’. The meaning of this mantra is that either we will free India, or we will die in the attempt to win freedom.”","b":false},{"id":457,"c":43,"q":"Who gave the slogan “DO OR DIE” and when?","o":[["a","Subhas Chandra Bose during Quit India Movement"],["b","Jawahar Lal Nehru during Non-cooperation Movement"],["c","Gandhiji during Quit India Movement"],["d","More than one of the above"]],"a":"c","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"The slogan mentioned in the question is associated with the Quit India Movement. On 8 August, 1942, the Quit India Resolution was passed after certain amendments. During this time, Gandhi’ s statement was especially important: “I will not be satisfied with anything less than complete freedom. The British government may offer to abolish the salt tax, liquor-drinking, etc., but my words will be—nothing less than freedom. I give you a mantra—‘Do or Die’. The meaning of this mantra is that either we will free India, or we will die in the attempt to win freedom.”","b":true},{"id":458,"c":43,"q":"August 8, 1942 is important in Indian history -","o":[["a","For the formation of the Azad Hind Fauj (Indian National Army)"],["b","For the Cripps Proposal"],["c","For the Quit India Resolution"],["d","For the plan of Chakravarti Rajagopalachari"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The slogan mentioned in the question is associated with the Quit India Movement. On 8 August, 1942, the Quit India Resolution was passed after certain amendments. During this time, Gandhi’ s statement was especially important: “I will not be satisfied with anything less than complete freedom. The British government may offer to abolish the salt tax, liquor-drinking, etc., but my words will be—nothing less than freedom. I give you a mantra—‘Do or Die’. The meaning of this mantra is that either we will free India, or we will die in the attempt to win freedom.”","b":true},{"id":459,"c":43,"q":"The Prime Minister of England during Quit India Movement was","o":[["a","Chamberlain"],["b","Churchill"],["c","Clement Attlee"],["d","Macdonald"]],"a":"b","s":"46th B.P.S.C. (Pre) 2005","y":2005,"e":"The slogan mentioned in the question is associated with the Quit India Movement. On 8 August, 1942, the Quit India Resolution was passed after certain amendments. During this time, Gandhi’ s statement was especially important: “I will not be satisfied with anything less than complete freedom. The British government may offer to abolish the salt tax, liquor-drinking, etc., but my words will be—nothing less than freedom. I give you a mantra—‘Do or Die’. The meaning of this mantra is that either we will free India, or we will die in the attempt to win freedom.”","b":true},{"id":460,"c":43,"q":"Who launched secret radio during the Quit India Movement?","o":[["a","Usha Mehta"],["b","Subhadra Kumari Chauhan"],["c","Sucheta Kripalani"],["d","Annie Besant"],["e","None of the above/More than one of the above"]],"a":"a","s":"67th B.P.S.C. (Re-Exam) (Pre)-2022","y":2022,"e":"During the Quit India Movement, Congress radio broadcasts were transmitted underground from different parts of Bombay, and they could be heard up to Madras. Ram Manohar Lohia used to broadcast on this radio. Usha Mehta was an important member of the small team that operated the Congress underground radio.","b":false},{"id":461,"c":43,"q":"Whicharea was affected most with the communal riots due to ‘Quit India’ Movement? (i) Bihar (ii) Bengal (iii)Gujarat (iv) United Province Select your answer from the following code –","o":[["a","i and ii"],["b","only i"],["c","ii and iii"],["d","i and iv"]],"a":"d","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"The riots arising from the Quit India Movement (1942) were most widespread in Bihar and U.P. (United Provinces). An atmosphere like a rebellion developed there. In eastern U.P., Azamgarh, Ballia and Gorakhpur, and in Bihar, Gaya, Bhagalpur, Saran, Purnia, Shahabad, Muzaffarpur and Champaran became the main centres of spontaneous mass uprising.","b":false},{"id":462,"c":43,"q":"All India Azad Dasta at Bakri ka Tapu was organised during the Quit India Movement by:","o":[["a","Ram Manohar Lohia"],["b","Usha Mehta"],["c","Chittu Pandey"],["d","Jayaprakash Narayan"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"During the Quit India Movement, Jayaprakash Narayan formed the “All-India Azad Squad” on an island called “Bakri ka Tapu”, located in the Terai region of Nepal, in the floodplain of the Kosi River. It was formed especially to carry out acts of sabotage against the government, so that the government’ s war activities could be obstructed. In May 1943, under British pressure, the Government of Nepal arrested Jayaprakash Narayan. Those arrested along with him included Ram Manohar Lohia, Shyam nand an Singh, Vaidyanath Jha, and Kartik Prasad Singh.","b":false},{"id":463,"c":43,"q":"Two statements are given below; the one is Assertion (A) and other is the Reason (R), read them carefully-Assertion (A): Rashtriya Swayamsevak Sangh (RSS) was separate from Quit India Movement, 1942. Reason (R): It thought that the freedom of India would be delayed due to this Movement. Which of them is correct from the given statements-","o":[["a","(A) and (R) are individually true, and (R) is the correct explanation of (A)."],["b","(A) and (R) are individually true, but (R) is not the correct explanation of (A)."],["c","(A) is true, but (R) is false."],["d","(A) is false, but (R) is true."]],"a":"c","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"Statement (A) is true, but Reason (R) is false. The Rashtriya Swayamsevak Sangh remained separate from the Quit India Movement of 1942. From 1940 until the end of foreign rule in 1947, the Sangh had no role in any national movement.","b":false},{"id":464,"c":43,"q":"During the Quit India Movement parallel ‘National Government’ was established at many places. Which of the following is not correctly matched?","o":[["a","Raiyati Sarkar — Kheda (Gujarat)"],["b","Prati Sarkar — Satara (Maharashtra)"],["c","Praja Mandal — Talchar (Orissa)"],["d","Jatiy Sarkar — Tamluk (Bengal)"]],"a":"a","s":"70th B.P.S.C. Pre-2024","y":2024,"e":"During the Quit India Movement, parallel governments were set up at various places— Prat i Sarkar— Satara (Maharashtra) — Prati Sarkar was established in Satara (Maharashtra) under the leadership of Nana Patil. Praja Mandal —Talchhad(Talcher/Talcher) (Odisha) — In Talcher (Odisha), the Praja Mandal movement revolted against British rule and local rulers; it was a part of the Quit India Movement. JatiyaSarkar — Tamluk(Bengal) — In Tamluk (Bengal), Jatiya Sarkar was established, which was a strong parallel government during the Quit India Movement. It handled many functions of local administration and continued the struggle against British rule. Raiyati Sarkar — The Raiyati Government was not established in Kheda; rather, it was established in Bardoli (Gujarat). The Raiyati Government was a parallel government set up during the Quit India Movement.","b":false},{"id":465,"c":44,"q":"Which of the following statements about Subhas Chandra Bose are correct?","o":[["a","Only 2 and 3"],["b","Only l and 2"],["c","Only 1 and 3"],["d","1,2 and 3"]],"a":"a","s":"71stB.P.S.C. (Pre) 2025","y":2025,"e":"In 1938, the 51st annual session of the Congress was held at Haripura (Gujarat), not at Tripuri. Subhas Chandra Bose presided over the Haripura session. The 52nd annual session of the Congress was held at Tripuri (M.P.) in 1939, and it was also presided over by Subhas Chandra Bose. However, later he resigned from this post. Netaji Subhas Chandra Bose successfully carried out the plan to escape from his house at night in disguise and leave Calcutta in January 1941. He formed the Provincial Government of India in Singapore on 21 October 1943.","b":false,"L":["1.⦙He was elected President of the Indian National Congress at Tripuri session of 1938 A.D.","2.⦙He escaped from home internment in January 1941 A.D.","3.⦙On October 21st 1943 A.D. he constituted the Provincial Governmert of India in Singapore."]},{"id":466,"c":44,"q":"Who formed the Forward Bloc?","o":[["a","Subhas Chandra Bose"],["b","Rajendra Prasad"],["c","Bhagat Singh"],["d","B.R. Ambedkar"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008 · 44th B.P.S.C. (Pre) 2000","y":2008,"e":"Netaji Subhas Chandra Bose was born on 23 January 1897 in Cuttack, Odisha. In 1919, he obtained the degree of graduation from Scottish Church College, affiliated to Calcutta University, and in 1920 he passed the Indian Civil Service (I.C.S.) examination. He became the President of the Indian National Congress at Haripura in 1938 and at Tripuri in 1939. In 1939, he resigned from the Congress president ship and founded the Forward Bloc, and in 1941 he went to Germany. In 1943, he took command of the Azad Hind Fauj (Indian National Army). He is commonly remembered as “Netaji”. The title/address “Netaji” was given to Subhas Chandra Bose by the Free India Legion (Indian Free Legion) of Indian soldiers stationed in Germany.","b":false},{"id":467,"c":44,"q":"In which country was the honorific 'Netaji' added before the name of Subhas Chandra Bose?","o":[["a","India"],["b","Italy"],["c","Germany"],["d","Japan"],["e","None of the above"]],"a":"c","s":"67th B.P.S.C. (Pre) 2021","y":2021,"e":"Netaji Subhas Chandra Bose was born on 23 January 1897 in Cuttack, Odisha. In 1919, he obtained the degree of graduation from Scottish Church College, affiliated to Calcutta University, and in 1920 he passed the Indian Civil Service (I.C.S.) examination. He became the President of the Indian National Congress at Haripura in 1938 and at Tripuri in 1939. In 1939, he resigned from the Congress president ship and founded the Forward Bloc, and in 1941 he went to Germany. In 1943, he took command of the Azad Hind Fauj (Indian National Army). He is commonly remembered as “Netaji”. The title/address “Netaji” was given to Subhas Chandra Bose by the Free India Legion (Indian Free Legion) of Indian soldiers stationed in Germany.","b":true},{"id":468,"c":44,"q":"Who founded the Forward Bloc?","o":[["a","Sardar Singh Rana"],["b","Subhas Chandra Bose"],["c","Jayaprakash Narayan"],["d","Lakshmi Sehgal"],["e","None of the above"]],"a":"b","s":"67th B.P.S.C. (Pre) 2021","y":2021,"e":"Netaji Subhas Chandra Bose was born on 23 January 1897 in Cuttack, Odisha. In 1919, he obtained the degree of graduation from Scottish Church College, affiliated to Calcutta University, and in 1920 he passed the Indian Civil Service (I.C.S.) examination. He became the President of the Indian National Congress at Haripura in 1938 and at Tripuri in 1939. In 1939, he resigned from the Congress president ship and founded the Forward Bloc, and in 1941 he went to Germany. In 1943, he took command of the Azad Hind Fauj (Indian National Army). He is commonly remembered as “Netaji”. The title/address “Netaji” was given to Subhas Chandra Bose by the Free India Legion (Indian Free Legion) of Indian soldiers stationed in Germany.","b":true},{"id":469,"c":44,"q":"Who assumed the command of the Indian National Army and gave famous battle cry, 'Chalo Delhi'?","o":[["a","Mohan Singh"],["b","Rash Behari Bose"],["c","Shah Nawaz Khan"],["d","Subhas Chandra Bose"]],"a":"d","s":"71st B.P.S.C. (Pre) 2025","y":2025,"e":"The initial formation of the Azad Hind Fauj (Indian National Army—INA) took place during the Second World War with Japan’ s support. In the early phase, Captain Mohan Singh and Ras Bihari Bose played an important role in its organisation, but later its leadership came into the hands of Subhas Chandra Bose. He organised the Azad Hind Fauj and gave the famous slogan “Chalo Delhi”.","b":false},{"id":470,"c":44,"q":"Which incident/incidents shocked British Prime Minister Clement Attlee, who had to declare that the edifice ofthe British imperialism had suffered a severe jolt?","o":[["a","Failure of the Cabinet Mission"],["b","Revolt of the Royal Indian Navy"],["c","Rejection of the Cripps Mission"],["d","Campaign of the INA and Revolt of the Royal Indian Navy"],["e","None of the above / More than one of the above"]],"a":"d","s":"B.P.S.C. C.D.P.O. (Pre) 2022","y":2022,"e":"Events such as the military campaign of the Azad Hind Fauj and the revolt of the Royal Indian Navy shocked British Prime Minister Clement Attlee. Influenced by these events, he declared that the edifice of British imperialism had suffered a major blow.","b":false},{"id":471,"c":44,"q":"In which year wasthe Indian National Army founded?","o":[["a","1940"],["b","1941"],["c","1942"],["d","1943"]],"a":"c","s":"43rd B.P.S.C. (Pre) 1999","y":1999,"e":"In practical terms, as a military unit, the Indian National Army (another name—Azad Hind Fauj) was formed on 15 July 1942 under the leadership of Captain Mohan Singh, while the Bangkok Conference resolutions of June 1942 paved the way for the formation of the INA (Indian National Army). It is noteworthy that Indian residents in the Malaya region formed a political organisation named the “All Malaya Indian Independence League”. Rash Bihari Bose was invited to preside over it. In the Bangkok Conference held in June 1942, a proposal was made to form a “Council of Action” and a “Representative Committee”, which was entrusted with the responsibility of coordination and supervision between the “Indian Independence League” and the “Indian National Army”. Rash Behari Bose was made the Chairman of the Council of Action, while K. P. K. Menon and Nedyam Raghavan were civilian members, and Mohan Singh and Gilani were military members. Due to ideological differences with the Japanese, Mohan Singh announced the dissolution of the INA in December 1942; however, Rash Behari Bose removed Mohan Singh from his post. Later, Mohan Singh was arrested by the Japanese army. The leadership of the INA was handed over by Rash Bihari Bose to the great leader Subhas Chandra Bose. Two days after reaching Singapore, on 4 July 1943, Subhas Chandra Bose assumed the leadership of the Indian National Army. For convenience, it is also called the Second Indian National Army. In Hindi, we know it as the “Azad Hind Fauj.”","b":false},{"id":472,"c":44,"q":"Who among the following individuals helped Subhas Chandra Bose form the I.N.A.in Singapore inthe year 1943?","o":[["a","General Cariappa"],["b","General Mohan Singh"],["c","General Manekshaw"],["d","General G.S. Aurora"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"In practical terms, as a military unit, the Indian National Army (another name—Azad Hind Fauj) was formed on 15 July 1942 under the leadership of Captain Mohan Singh, while the Bangkok Conference resolutions of June 1942 paved the way for the formation of the INA (Indian National Army). It is noteworthy that Indian residents in the Malaya region formed a political organisation named the “All Malaya Indian Independence League”. Rash Bihari Bose was invited to preside over it. In the Bangkok Conference held in June 1942, a proposal was made to form a “Council of Action” and a “Representative Committee”, which was entrusted with the responsibility of coordination and supervision between the “Indian Independence League” and the “Indian National Army”. Rash Behari Bose was made the Chairman of the Council of Action, while K. P. K. Menon and Nedyam Raghavan were civilian members, and Mohan Singh and Gilani were military members. Due to ideological differences with the Japanese, Mohan Singh announced the dissolution of the INA in December 1942; however, Rash Behari Bose removed Mohan Singh from his post. Later, Mohan Singh was arrested by the Japanese army. The leadership of the INA was handed over by Rash Bihari Bose to the great leader Subhas Chandra Bose. Two days after reaching Singapore, on 4 July 1943, Subhas Chandra Bose assumed the leadership of the Indian National Army. For convenience, it is also called the Second Indian National Army. In Hindi, we know it as the “Azad Hind Fauj.”","b":true},{"id":473,"c":44,"q":"Who was the founder of the 'Indian National Army (I.N.A.)'?","o":[["a","Subhas Chandra Bose"],["b","Mohan Singh"],["c","Lala Lajpat Rai"],["d","More than one of the above"],["e","None of the above"]],"a":"b","s":"B.P.S.C. Teacher (9th-10th) 08.12.2023","y":2023,"e":"In practical terms, as a military unit, the Indian National Army (another name—Azad Hind Fauj) was formed on 15 July 1942 under the leadership of Captain Mohan Sin
