<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Modern History of India — BPSC Previous Year Questions</title>
<script>
document.documentElement.dataset.theme =
  (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Tiro Devanagari Hindi",Georgia,"Times New Roman",serif;
  --sans:"Mukta","Segoe UI",system-ui,-apple-system,sans-serif;
}
html[data-theme="light"]{
  color-scheme:light;
  --ink:#14213D; --indigo:#27437A; --indigo-soft:#DCE3F0;
  --paper:#EDEFF3; --card:#FFFFFF; --line:#C9D0DE;
  --madder:#9E2B25; --madder-soft:#F6E4E2;
  --verdigris:#1F6B52; --verdigris-soft:#DFEDE7;
  --amber:#8A5A0B; --amber-soft:#F7ECD8;
  --mute:#6A7590;
  --fill:#14213D; --on-fill:#FFFFFF; --fill-hover:#27437A;
  --hover:#F5F7FC; --hover-rail:#E4E8F1; --active:#E1E6F2;
  --tint:#F3F6FC; --expl:#26304A; --chipface:#FFFFFF;
  --art-op:.07;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E6EAF4; --indigo:#93AEE0; --indigo-soft:#2C3B5D;
  --paper:#101623; --card:#18202F; --line:#2E3A54;
  --madder:#E58C85; --madder-soft:#3B2321;
  --verdigris:#7FC7A8; --verdigris-soft:#16302A;
  --amber:#E0B069; --amber-soft:#3A2E18;
  --mute:#96A1B9;
  --fill:#2F4A82; --on-fill:#F2F5FC; --fill-hover:#3B5B9B;
  --hover:#1F2A3D; --hover-rail:#1E2739; --active:#232F46;
  --tint:#1C2740; --expl:#CBD3E4; --chipface:#18202F;
  --art-op:.075;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  transition:background-color .18s,color .18s;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--madder);outline-offset:2px;border-radius:2px}

/* ---------- artwork ---------- */
#art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  color:var(--indigo);opacity:var(--art-op);transition:opacity .25s}
#art.off{opacity:0}
#art svg{position:absolute;display:block}
.masthead,.controls,.shell{position:relative;z-index:1}

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--line);background:var(--card)}
.masthead-in{max-width:1180px;margin:0 auto;padding:20px 24px 16px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.title{font-family:var(--serif);font-size:26px;line-height:1.15;margin:0;font-weight:400}
.subtitle{font-size:13.5px;color:var(--mute);margin:4px 0 0}
.tally{display:flex;gap:22px;align-items:flex-end}
.tally-item{text-align:right}
.tally-num{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.tally-lab{font-size:11.5px;color:var(--mute);margin-top:3px}
.tally-num.good{color:var(--verdigris)}
.tally-num.bad{color:var(--madder)}
.clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--amber)}
.clock.crit{color:var(--madder)}

/* ---------- controls ---------- */
.controls{border-bottom:1px solid var(--line);background:var(--card)}
.controls-in{max-width:1180px;margin:0 auto;padding:10px 24px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 13px;font-size:13.5px;color:var(--mute);transition:.15s}
.chip:hover{border-color:var(--indigo);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  background:var(--card)}
.seg button{padding:5px 15px;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}
.sel{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 11px;font-size:13.5px;color:var(--ink);font-family:var(--sans)}
.spacer{flex:1}
.reset{font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--madder)}
#chapToggle{display:none}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:26px 24px 64px;
  display:grid;grid-template-columns:264px 1fr;gap:36px;align-items:start}
.shell.wide{grid-template-columns:1fr}

/* ---------- rail: timeline ---------- */
.spine{position:sticky;top:16px;max-height:calc(100vh - 40px);overflow-y:auto;
  padding-right:4px;scrollbar-width:thin}
.spine-head{font-size:12px;color:var(--mute);padding:0 0 10px 0}
.allbtn{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:4px;
  border:1px solid var(--line);background:var(--card);margin-bottom:14px;font-size:14px}
.allbtn[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.chapters{list-style:none;margin:0;padding:0;position:relative}
.chapters::before{content:"";position:absolute;left:37px;top:6px;bottom:10px;
  width:1px;background:var(--indigo-soft)}
.chap{display:grid;grid-template-columns:34px 14px 1fr;align-items:start;
  width:100%;text-align:left;padding:5px 6px 5px 0;border-radius:4px;position:relative}
.chap:hover{background:var(--hover-rail)}
.chap .yr{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;
  padding-top:3px;text-align:right;padding-right:6px}
.chap .dot{width:14px;display:flex;justify-content:center;padding-top:6px}
.chap .dot i{width:7px;height:7px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--indigo-soft);display:block}
.chap .body{padding-left:10px;min-width:0}
.chap .nm{font-size:13.5px;line-height:1.3;color:var(--ink);display:block}
.chap .meta{font-size:11px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--indigo-soft);border-radius:2px;margin-top:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--indigo);width:0}
.chap[aria-pressed="true"]{background:var(--active)}
.chap[aria-pressed="true"] .nm{font-weight:600}
.chap[aria-pressed="true"] .dot i{background:var(--madder);border-color:var(--madder)}
.chap.done .dot i{background:var(--indigo);border-color:var(--indigo)}

/* ---------- rail: exam palette ---------- */
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.pq{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;background:var(--card);
  font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--mute);
  display:flex;align-items:center;justify-content:center}
.pq:hover{border-color:var(--indigo)}
.pq.seen{background:var(--hover-rail);color:var(--ink)}
.pq.done{background:var(--verdigris-soft);border-color:var(--verdigris);color:var(--verdigris);font-weight:600}
.pq.flag{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:600}
.pq.ok{background:var(--verdigris-soft);border-color:var(--verdigris);color:var(--verdigris)}
.pq.no{background:var(--madder-soft);border-color:var(--madder);color:var(--madder)}
.pq.now{outline:2px solid var(--fill);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-size:11.5px;color:var(--mute)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;
  border:1px solid var(--line);vertical-align:-1px}
.legend .l-done{background:var(--verdigris-soft);border-color:var(--verdigris)}
.legend .l-flag{background:var(--amber-soft);border-color:var(--amber)}
.legend .l-wrong{background:var(--madder-soft);border-color:var(--madder)}
.legend .l-seen{background:var(--hover-rail)}

/* ---------- question ---------- */
.stage{min-width:0}
.qhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;
  justify-content:space-between;margin-bottom:12px}
.counter{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:600}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src{font-size:12px;color:var(--indigo);border:1px solid var(--indigo-soft);
  background:var(--tint);border-radius:3px;padding:3px 9px}
.stopwatch{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:3px;padding:3px 9px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px 28px}
.stem{font-family:var(--serif);font-size:19.5px;line-height:1.6;margin:0 0 20px;max-width:62ch}
.listblock{margin:0 0 20px;border-left:2px solid var(--indigo-soft);padding:2px 0 2px 16px;
  display:grid;grid-template-columns:max-content 1fr;gap:5px 22px;
  font-family:var(--serif);font-size:16px;line-height:1.5;max-width:62ch}
.listblock .full{grid-column:1/-1}
.listblock .hd{font-family:var(--sans);font-size:12.5px;color:var(--mute);padding-bottom:2px}
.instr{font-size:13.5px;color:var(--mute);margin:-8px 0 16px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:start;
  text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:5px;
  background:var(--card);transition:border-color .12s,background .12s;width:100%}
.opt:hover:not(:disabled){border-color:var(--indigo);background:var(--hover)}
.opt:disabled{cursor:default}
.opt .ltr{font-size:13px;color:var(--mute);font-weight:600;
  border:1px solid var(--line);border-radius:3px;text-align:center;line-height:22px;height:24px}
.opt .txt{font-family:var(--serif);font-size:16.5px;line-height:1.5}
.opt .mk{font-size:15px;line-height:1.6;text-align:right}
.opt.picked{border-color:var(--fill);background:var(--active)}
.opt.picked .ltr{border-color:var(--fill);color:var(--ink)}
.opt.correct{border-color:var(--verdigris);background:var(--verdigris-soft)}
.opt.correct .ltr{border-color:var(--verdigris);color:var(--verdigris);background:var(--chipface)}
.opt.correct .mk{color:var(--verdigris)}
.opt.wrong{border-color:var(--madder);background:var(--madder-soft)}
.opt.wrong .ltr{border-color:var(--madder);color:var(--madder);background:var(--chipface)}
.opt.wrong .mk{color:var(--madder)}

.verdict{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.verdict-h{font-size:13.5px;font-weight:600;margin:0 0 8px;
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.verdict-h.good{color:var(--verdigris)}
.verdict-h.bad{color:var(--madder)}
.verdict-h.void{color:var(--indigo)}
.took{font-weight:400;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.expl{font-family:var(--serif);font-size:16px;line-height:1.72;color:var(--expl);
  margin:0;max-width:68ch;white-space:pre-line}
.borrowed{font-size:12px;color:var(--mute);margin:8px 0 0;font-style:italic}

.navrow{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.nav{border:1px solid var(--line);background:var(--card);border-radius:5px;
  padding:9px 18px;font-size:14px;transition:.12s}
.nav:hover:not(:disabled){border-color:var(--indigo);background:var(--hover)}
.nav:disabled{opacity:.4;cursor:default}
.nav.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.nav.primary:hover{background:var(--fill-hover);border-color:var(--fill-hover)}
.nav.flag[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.nav.danger{border-color:var(--madder);color:var(--madder)}
.nav.danger:hover{background:var(--madder-soft);border-color:var(--madder)}
.save{margin-left:auto;font-size:14px;color:var(--mute);border:1px solid var(--line);
  background:var(--card);border-radius:5px;padding:9px 14px}
.save[aria-pressed="true"]{color:var(--madder);border-color:var(--madder);background:var(--madder-soft)}
.hint{font-size:12px;color:var(--mute);margin-top:14px}
.empty{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:44px 28px;text-align:center}
.empty h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 8px}
.empty p{color:var(--mute);font-size:14.5px;margin:0}

/* ---------- exam setup ---------- */
.setup{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:28px;max-width:720px}
.setup h2{font-family:var(--serif);font-weight:400;font-size:23px;margin:0 0 6px}
.setup .lede{color:var(--mute);font-size:14.5px;margin:0 0 24px;max-width:58ch}
.field{margin-bottom:20px}
.field > label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.field .note{font-size:12.5px;color:var(--mute);margin-top:7px}
.opts-row{display:flex;flex-wrap:wrap;gap:7px}
.orb{border:1px solid var(--line);background:var(--card);border-radius:5px;
  padding:7px 15px;font-size:14px;color:var(--mute)}
.orb:hover{border-color:var(--indigo);color:var(--ink)}
.orb[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}

/* ---------- results ---------- */
.res{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px}
.res h2{font-family:var(--serif);font-weight:400;font-size:23px;margin:0 0 20px}
.scorebig{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end;
  padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.scorebig .big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.scorebig .of{font-size:14px;color:var(--mute);margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:18px 20px}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11.5px;color:var(--mute);margin-top:4px}
.breakdown{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.breakdown h3{font-size:13px;font-weight:600;margin:0 0 12px}
.brow{display:grid;grid-template-columns:1fr 62px 52px;gap:12px;align-items:center;
  font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.brow .bs{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.brow .bb{height:4px;background:var(--indigo-soft);border-radius:3px;overflow:hidden}
.brow .bb span{display:block;height:100%;background:var(--verdigris)}
.timeout{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
  border-radius:5px;padding:10px 14px;font-size:13.5px;margin-bottom:20px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:0;padding:18px 16px 56px}
  #chapToggle{display:inline-block}
  .spine{position:fixed;inset:0;z-index:40;background:var(--card);max-height:none;
    padding:18px 18px 40px;overflow-y:auto;display:none}
  .spine.open{display:block}
  .spine-close{position:sticky;top:0;background:var(--card);padding-bottom:12px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);margin-bottom:14px}
  .masthead-in,.controls-in{padding-left:16px;padding-right:16px}
  .card,.setup,.res{padding:20px 18px}
  .stem{font-size:18px}
  .opt{grid-template-columns:24px 1fr 18px;padding:10px 12px}
  .title{font-size:21px}
  .tally{gap:16px}
  .clock{font-size:26px}
  .palette{grid-template-columns:repeat(8,1fr)}
  .scorebig .big{font-size:36px}
  #art svg{transform:scale(.68)}
}
@media (min-width:901px){.spine-close{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const DATA = {"chapters":[{"id":0,"name":"Advent of European Companies","short":"Advent of European Companies","era":"1498","n":10},{"id":1,"name":"East India Company and Nawabs of Bengal","short":"East India Co. & Nawabs of Bengal","era":"1757","n":5},{"id":2,"name":"Regional States: Punjab and Mysore","short":"Regional States: Punjab and Mysore","era":"1767","n":6},{"id":3,"name":"Governor / Governor-General / Viceroy","short":"Governors-General & Viceroys","era":"1773","n":28},{"id":4,"name":"Economic Impact of British Rule on India","short":"Economic Impact of British Rule","era":"1793","n":10},{"id":5,"name":"Revolt of 1857","short":"Revolt of 1857","era":"1857","n":25},{"id":6,"name":"Other Civil Uprisings","short":"Other Civil Uprisings","era":"1763","n":27},{"id":7,"name":"Development of Education in Modern India","short":"Education in Modern India","era":"1813","n":15},{"id":8,"name":"Development of Press in Modern India","short":"Press in Modern India","era":"1780","n":14},{"id":9,"name":"Social and Religious Movements","short":"Social and Religious Movements","era":"1828","n":34},{"id":10,"name":"Political Organisations Established Before Congress","short":"Pre-Congress Organisations","era":"1836","n":7},{"id":11,"name":"Indian National Congress","short":"Indian National Congress","era":"1885","n":34},{"id":12,"name":"Moderates and Extremists in Congress","short":"Moderates and Extremists in Congress","era":"1885","n":15},{"id":13,"name":"Revolutionary Movement in India","short":"Revolutionary Movement in India","era":"1897","n":21},{"id":14,"name":"Revolutionary Activities Outside India","short":"Revolutionary Activities Outside India","era":"1905","n":18},{"id":15,"name":"Partition of Bengal and Swadeshi Movement","short":"Partition of Bengal and Swadeshi Movement","era":"1905","n":13},{"id":16,"name":"Congress: Banaras, Calcutta and Surat Sessions","short":"Banaras, Calcutta & Surat Sessions","era":"1905","n":3},{"id":17,"name":"Formation of Muslim League","short":"Formation of Muslim League","era":"1906","n":4},{"id":18,"name":"Morley-Minto Reforms","short":"Morley-Minto Reforms","era":"1909","n":1},{"id":19,"name":"Delhi Durbar and Change of Capital","short":"Delhi Durbar and Change of Capital","era":"1911","n":2},{"id":20,"name":"Lucknow Session of Congress","short":"Lucknow Session of Congress","era":"1916","n":4},{"id":21,"name":"Home Rule League Movement","short":"Home Rule League Movement","era":"1916","n":3},{"id":22,"name":"Gandhi and His Early Movements","short":"Gandhi and His Early Movements","era":"1917","n":34},{"id":23,"name":"Peasant Movement and Kisan Sabha","short":"Peasant Movement and Kisan Sabha","era":"1918","n":14},{"id":24,"name":"Trade Union and Communist Party","short":"Trade Union and Communist Party","era":"1920","n":7},{"id":25,"name":"Rowlatt Act and Jallianwala Bagh Massacre","short":"Rowlatt Act & Jallianwala Bagh","era":"1919","n":9},{"id":26,"name":"Khilafat Movement","short":"Khilafat Movement","era":"1919","n":4},{"id":27,"name":"Non-Cooperation Movement","short":"Non-Cooperation Movement","era":"1920","n":10},{"id":28,"name":"Formation of Swaraj Party (1923)","short":"Formation of Swaraj Party (1923)","era":"1923","n":7},{"id":29,"name":"Simon Commission (1927)","short":"Simon Commission (1927)","era":"1927","n":5},{"id":30,"name":"Lahore Session of Congress, Proposal of Complete Independence (1929)","short":"Lahore Session · Purna Swaraj","era":"1929","n":7},{"id":31,"name":"Civil Disobedience Movement","short":"Civil Disobedience Movement","era":"1930","n":12},{"id":32,"name":"Gandhi-Irwin Pact","short":"Gandhi-Irwin Pact","era":"1931","n":5},{"id":33,"name":"Round Table Conference","short":"Round Table Conference","era":"1930","n":8},{"id":34,"name":"Communal Award and Poona Pact","short":"Communal Award and Poona Pact","era":"1932","n":4},{"id":35,"name":"Congress Socialist Party (1934)","short":"Congress Socialist Party (1934)","era":"1934","n":3},{"id":36,"name":"Provincial Election and Formation of Cabinet (1937)","short":"Provincial Elections (1937)","era":"1937","n":1},{"id":37,"name":"Tripuri Crisis of Congress","short":"Tripuri Crisis of Congress","era":"1939","n":2},{"id":38,"name":"Indian Princely States","short":"Indian Princely States","era":"1939","n":3},{"id":39,"name":"Second World War","short":"Second World War","era":"1939","n":1},{"id":40,"name":"Demand for Pakistan","short":"Demand for Pakistan","era":"1940","n":8},{"id":41,"name":"Individual Satyagraha (1940)","short":"Individual Satyagraha (1940)","era":"1940","n":4},{"id":42,"name":"Cripps Mission (1942)","short":"Cripps Mission (1942)","era":"1942","n":3},{"id":43,"name":"Quit India Movement","short":"Quit India Movement","era":"1942","n":15},{"id":44,"name":"Subhas Chandra Bose and Azad Hind Fauj","short":"Subhas Bose & Azad Hind Fauj","era":"1943","n":19},{"id":45,"name":"Cabinet Mission Plan (1946)","short":"Cabinet Mission Plan (1946)","era":"1946","n":6},{"id":46,"name":"Formation of Interim Government (1946)","short":"Formation of Interim Government (1946)","era":"1946","n":5},{"id":47,"name":"Partition of India and Independence","short":"Partition of India and Independence","era":"1947","n":9},{"id":48,"name":"Constitutional Development of India","short":"Constitutional Development of India","era":"1773","n":16},{"id":49,"name":"Modern History: Miscellaneous","short":"Modern History: Miscellaneous","era":"—","n":52},{"id":50,"name":"Magazines, Books and Their Authors","short":"Magazines, Books and Their Authors","era":"—","n":44},{"id":51,"name":"Art and Culture","short":"Art and Culture","era":"—","n":20}],"questions":[{"id":0,"c":0,"q":"Who was the first Portuguese Viceroy in India?","o":[["a","Diaz"],["b","Vasco da Gama"],["c","Almeida"],["d","Albuquerque"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Vasco da Gama was the first Portuguese to reach India. He arrived at the port of Calicut on the western coast of India on 20 May, 1498. By reaching here, he discovered a new sea route to India. The then ruler of Calicut, the Zamorin (Zamorin was the hereditary title of the rulers of Calicut), welcomed Vasco da Gama. Portuguese traders established their trading factories at the ports of Calicut, Goa, Daman, Diu and Hooghly in India. In 1505, Francisco de Almeida came to India as the first Portuguese Viceroy and Governor. In the context of commercial interests, to establish supremacy in the Indian Ocean, Almeida propounded the ‘Blue Water Policy’, i.e., the policy of dominance over the seas.","b":false},{"id":1,"c":0,"q":"Who used Hooghly as a base for piracy in the Bay of Bengal?","o":[["a","The Dutch"],["b","The French"],["c","The Portuguese"],["d","The British"],["e","None of the above/More than one of the above"]],"a":"c","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"The Portuguese used Hooghly as a base for maritime plunder in the Bay of Bengal.","b":false},{"id":2,"c":0,"q":"Where in India did the British setup their first factory in 1613?","o":[["a","Goa"],["b","Hooghly in Bengal"],["c","Amarkot"],["d","Surat"]],"a":"d","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"Captain William Hawkins reached the Mughal court from Surat in April, 1609, but he could not succeed in obtaining permission to establish a factory at Surat. In 1611, despite Portuguese opposition, Captain Henry Middleton reached Swally (near Surat) and succeeded in obtaining permission from the Mughal governor to trade there. In 1612, Captain Thomas Best defeated the Portuguese at Swally (near Surat) and ended the continuation of their monopoly. After this, with Jahangir’ s permission, the English permanently established a factory at Surat in 1613. It is noteworthy that the English had earlier set up their first factory (temporarily) at Masu lip a tnam. From here, the English expanded their trade to other parts of the country and soon established subsidiary factories at Ahmedabad, Burhanpur, Ajmer and Agra.","b":false},{"id":3,"c":0,"q":"Which of the British officials defeated the Portuguese at Swally?","o":[["a","William Hawkins"],["b","Thomas Best"],["c","Thomas Roe"],["d","Josiah Child"]],"a":"b","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"Captain William Hawkins reached the Mughal court from Surat in April, 1609, but he could not succeed in obtaining permission to establish a factory at Surat. In 1611, despite Portuguese opposition, Captain Henry Middleton reached Swally (near Surat) and succeeded in obtaining permission from the Mughal governor to trade there. In 1612, Captain Thomas Best defeated the Portuguese at Swally (near Surat) and ended the continuation of their monopoly. After this, with Jahangir’ s permission, the English permanently established a factory at Surat in 1613. It is noteworthy that the English had earlier set up their first factory (temporarily) at Masu lip a tnam. From here, the English expanded their trade to other parts of the country and soon established subsidiary factories at Ahmedabad, Burhanpur, Ajmer and Agra.","b":true},{"id":4,"c":0,"q":"Which one of the following was the immediate cause of the First Carnatic War?","o":[["a","Anglo-French Rivalry"],["b","Austrian War of Succession"],["c","Issues of Carnatic Succession"],["d","Capture of French ships by the British"]],"a":"d","s":"44th B.P.S.C. (Pre) 2000","y":2000,"e":"The First Carnatic War (1746-48) was merely an extension of the War of the Austrian Succession, which began in 1740. Even against the orders of their home governments, war between the two parties (English and French) began in 1746. The immediate cause of the war was the seizure of some French ships by the English navy under Commodore Curtis Barnett. During the First Carnatic War itself, the Nawab of Carnatic, A nwa rudd in, sent an army under Mahfuz Khan to attack the French. Under Captain Paradis, the French army defeated the Nawab at a place called St. Thomé, situated on the Adyar River. With the end of war in Europe, the First Carnatic War also came to an end. By the Treaty of Aix-la-Chapelle (1748), the War of the Austrian Succession ended, and Madras was restored to the English. The First Carnatic War is remembered for the Battle of St. Thomé.","b":false},{"id":5,"c":0,"q":"The famous Battle of Wandiwash in 1760 was fought by the British against whom?","o":[["a","French"],["b","Spain"],["c","Mysore"],["d","Carnatic"],["e","None of the above/ More than one of the above"]],"a":"a","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"The Battle of Wandiwash (January, 1760) was fought between the English and the French. The French were defeated. The English army was led by Sir Eyre Coote, while the French army was led by Count de Lally.","b":false},{"id":6,"c":0,"q":"Identify the region from where Europeans got best shora (Saltpetre) and opium –","o":[["a","Bihar"],["b","Gujarat"],["c","Bengal"],["d","Madras"]],"a":"a","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"Europeans obtained the best saltpetre and opium from Bihar.","b":false},{"id":7,"c":0,"q":"During British rule which region of India was famous for the production of opium?","o":[["a","Bihar"],["b","Southern India"],["c","Gujarat"],["d","Assam"]],"a":"a","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"The Battle of Wandiwash (January, 1760) was fought between the English and the French. The French were defeated. The English army was led by Sir Eyre Coote, while the French army was led by Count de Lally.","b":true},{"id":8,"c":0,"q":"What was the main economic basis of the triangular trade between India, China, and England?","o":[["a","Silk"],["b","Opium"],["c","Black pepper"],["d","More than one of the above"]],"a":"b","s":"70th B.P.S.C. (Pre) 2024","y":2024,"e":"The main basis of trade between India, China, and England was opium, tea, and cloth. The British East India Company established a monopoly over opium cultivation in regions such as Bengal and Bihar, compelled Indian farmers to cultivate opium, and exported it to China to reduce the trade imbalance. Britain needed tea, porcelain (crockery) and silk from China in large quantities. Therefore, as per the options, opium was the main economic basis of this trade.","b":false},{"id":9,"c":0,"q":"Match List–I with List–II:","o":[["a","3 4 2 1"],["b","1 2 4 3"],["c","3 4 1 2"],["d","1 4 2 3"]],"a":"a","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"The correct matching is as follows— List-I List-II (Explorer) (Birthplace) Christopher Columbus – Italy\nJacques Cartier – France\nSir Francis Drake – United Kingdom\nFerdinand Magellan – Portugal Therefore, option (a) is the correct answer.","b":false,"L":["⦚List—I⦙List—II","⦚(Explorer)⦙(Birthplace)","A. Christopher Columbus⦙1. Portugal","B. Jacques Cartier⦙2. United Kingdom","C. Sir Francis Drake⦙3. Italy","D. Ferdinand Magellan⦙4. France"],"n":"Select the correct answer using the codes given below."},{"id":10,"c":1,"q":"Which treaty was signed after the Battle of Buxar?","o":[["a","The Treaty of Allahabad"],["b","The Treaty of Sugauli"],["c","The Treaty of Bassein"],["d","The Treaty of Salbai"]],"a":"a","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"The Battle of Buxar (October 1764) was fought between the combined forces of Mir Qasim, Nawab of Awadh Shuja-ud-Daula, and the Mughal Emperor Shah Alam II, on one side, and the British, on the other. The British won the battle. The British army was led by Hector Munro. After the end of this battle, two Treaties of Allahabad (1765) were concluded. The first Treaty of Allahabad was between Clive and the Mughal Emperor Shah Alam II, while the second Treaty of Allahabad was between Clive and the Nawab of Awadh, Shuja-ud-Daula.","b":false},{"id":11,"c":1,"q":"Who was appointed Deputy Diwan of Murshidabad by Robert Clive after the Allahabad Treaty?","o":[["a","Mohd. Raza Khan"],["b","Shitab Rai"],["c","Rai Durlabh"],["d","Syed Ghulam Hussain"]],"a":"a","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"According to the second Treaty of Allahabad (August 1765), the then-fugitive Emperor Shah Alam II was taken under British protection and kept at Allahabad. By his farman (royal order) dated 12 August 1765, Shah Alam II granted the Company the Diwani (right to collect revenue) of Bengal, Bihar, and Orissa (present-day Odisha) permanently. In return, the Company would pay the Emperor 26 lakh rupees and would provide 53 lakh rupees for the expenses of the Nizamat. At this time, the Company neither wanted to take direct responsibility for revenue collection nor did it have such capacity. For the Diwani work, the Company appointed two Deputy Diwans—Muhammad Raza Khan for Murshidabad (Bengal) and Raja Shitab Rai for Bihar. Muhammad Raza Khan also worked as the Deputy Nazim. Thus, the entire Diwani and Nizamat administration continued to be run by Indians, although the responsibility rested with the Company.","b":false},{"id":12,"c":1,"q":"Emperor Shah Alam- II gave the Diwani of Bengal - Bihar and Orissa to the East India Company on:","o":[["a","12 August, 1765"],["b","18 August, 1765"],["c","29 August, 1765"],["d","21 August, 1765"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"Under the First Treaty of Allahabad (12 August 1765), the Mughal Emperor Shah Alam II permanently granted the Company the Diwani of Bengal, Bihar and Orissa; and under the Second Treaty of Allahabad (16 August 1765), the Nawab of Awadh (Shuja-ud-Daula) promised to give the districts of Allahabad and Kara to the Mughal Emperor Shah Alam II. At this time, Robert Clive was the Governor of Bengal on behalf of the East India Company. The entire life of Shah Alam II was full of calamities. He was blinded in 1788. During the time of Shah Alam II, the British gained control over Delhi in 1803. Shah Alam II and his two successors Akbar II (1806–37) and Bahadur Shah II (1837–57) remained merely pensioners of the East India Company.","b":false},{"id":13,"c":1,"q":"The dual system of governance in Bengal was enforced by:","o":[["a","Warren Hastings"],["b","William Bentinck"],["c","Robert Clive"],["d","Lord Curzon"],["e","None of the above/ More than one of the above"]],"a":"c","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"The Dual Government began in Bengal in 1765 during the time of Robert Clive. On 28 August 1772, the Court of Directors decided to abolish the Dual Government in Bengal. Warren Hastings implemented this decision in 1772. The Calcutta Council and its head were instructed to become the Diwan themselves and take the management of Bengal, Bihar and Orissa into their own hands. Warren Hastings removed both the Deputy-Diwans, Muhammad Raza Khan and Raja Shitab Rai.","b":false},{"id":14,"c":1,"q":"The British ruled India for a long period due to the","o":[["a","liberal policies of the Congress"],["b","imprisonment of Indian leaders"],["c","policy of Divide and Rule"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"B.P.S.C. Teacher (11th-12th) 15-12-2023","y":2023,"e":"The main reason the British ruled India for nearly 200 years was their policy of 'Divide and Rule'.","b":false},{"id":15,"c":2,"q":"Tipu Sultan set up his capital at –","o":[["a","Srirangapatnam"],["b","Mysore"],["c","Bangalore"],["d","Coimbatore"]],"a":"a","s":"38th B.P.S.C. (Pre) 1992","y":1992,"e":"Tipu Sultan made Srirangapatnam his capital, and here French officers established the Jacobin Club (it was a branch of the Jacobin Club established in France; Tipu Sultan supported this club and is also said to have become its member). He (Tipu) planted a Tree of Liberty in his capital as a symbol of friendship between France and Mysore. Tipu Sultan sent his missions to Arabia, Constantinople (modern Istanbul), Kabul and Mauritius in order to establish friendly relations with contemporary foreign states and to obtain their support against the British.","b":false},{"id":16,"c":2,"q":"The Treaty of Mangalore was signed between Tipu Sultan and the British East India Company inthe year","o":[["a","1782"],["b","1792"],["c","1779"],["d","1784"]],"a":"d","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The Treaty of Mangalore between Tipu Sultan and the British East India Company was signed in 1784. In this treaty, the Second Mysore War (1780–84) came to an end.","b":false},{"id":17,"c":2,"q":"Englishmen made the Treaty of Srirangapatnam with–","o":[["a","Hyder Ali"],["b","Dupleix"],["c","Tipu Sultan"],["d","Nandraj"]],"a":"c","s":"42nd B.P.S.C. (Pre) 1997","y":1997,"e":"The Third Anglo–Mysore War (1790–92) ended with the Treaty of Srirangapatnam (March,1792). In this treaty, Cornwallis represented the British side and Tipu Sultan represented Mysore. According to its terms, Tipu had to cede nearly half of his territory to the British and their allies, and he also had to pay three crore rupees to the British as war indemnity. The treaty further provided that until Tipu paid about three crore rupees (330 lakh rupees), his two sons would remain in British custody. After this treaty, Cornwallis remarked—“We have effectively crippled our enemy without making our friend too formidable.”","b":false},{"id":18,"c":2,"q":"Ranjit Singh got the famous Koh ino or diamond from-","o":[["a","Shah Shuja"],["b","Zaman Shah"],["c","Dost Mohammad"],["d","Sher Ali"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"Punjab was a part of Ahmad Shah Abdali’ s empire, but after his death in 1772, except for a few smaller regions like Multan and Kashmir, the rest came under the control of the Sikh Misls. Meanwhile, due to internal conflicts among the Afghans, Ranjit Singh got an opportunity to strengthen his position. In 1803, Ahmad Shah Abdali’ s grandson Shah Shuja ascended the throne of Kabul, but his brother Shah Mahmud, with the help of powerful Barakzai chiefs—Fateh Khan and Dost Mohammad Khan deposed him in 1809 and himself captured Kashmir and Peshawar. On this occasion, Shah Shuja sought Ranjit Singh’ s help to regain the throne of Kabul and presented him with the Koh-i-Noor (Kohinoor) diamond.","b":false},{"id":19,"c":2,"q":"When was the Punjab Land Alienation Act passed?","o":[["a","1850"],["b","1895"],["c","1900"],["d","1905"],["e","None of the above/ More than one of the above"]],"a":"c","s":"63rd B.P.S.C. (Pre.) 2017","y":2017,"e":"The Punjab Land Alienation Act was passed in 1900, which largely restricted the transfer of cultivators’ land to non-cultivators.","b":false},{"id":20,"c":2,"q":"In which year was the Punjab Hindu Sabha founded?","o":[["a","1905"],["b","1909"],["c","1915"],["d","1917"],["e","None of the above/More than one of the above"]],"a":"b","s":"B.P.S.C. CDPO (Pre) 2018","y":2018,"e":"Before its establishment at the all-India level, the Hindu Mahasabha was formed at the provincial level. First, in Punjab province, the Punjab Hindu Mahasabha was established in 1909. The Hindu Mahasabha was founded in April, 1915 at the Kumbh Mela in Haridwar under the name “Sarvadeshik Hindu Sabha”. In 1921, the name of this organization was changed to “Akhil Bharatiya Hindu Mahasabha”.","b":false},{"id":21,"c":3,"q":"Who was the first Governor General of India?","o":[["a","Lord Mayo"],["b","Lord Lytton"],["c","Lord Canning"],["d","Lord Dufferin"],["e","None of the above/More than one of the above"]],"a":"e","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"Warren Hastings was appointed the first Governor-General of Bengal in 1774. In 1834, Lord William Bentinck was made the first Governor-General of India. Robert Clive was appointed the first Governor of Bengal, and he held this post during 1758–60 and 1765–67.","b":false},{"id":22,"c":3,"q":"Who was the founder of the Empire in India?","o":[["a","C. Sleeman"],["b","Lord Minto"],["c","Lord Clive"],["d","Lord Mayo"],["e","None of the above/More than one of the above"]],"a":"c","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"Lord Clive is considered the founder of the British Empire in India. In the Battle of Plassey (23 June, 1757), Lord Clive led the victorious British forces. After this battle, the foundation of the British Empire in Bengal was laid.","b":false},{"id":23,"c":3,"q":"Who among the following is considered the founder of the British Empire in India?","o":[["a","Lord Cornwallis"],["b","Warren Hastings"],["c","Lord Clive"],["d","Sir Thomas Roe"]],"a":"c","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"Lord Clive is considered the founder of the British Empire in India. In the Battle of Plassey (23 June, 1757), Lord Clive led the victorious British forces. After this battle, the foundation of the British Empire in Bengal was laid.","b":true},{"id":24,"c":3,"q":"Who is considered the Father of Dyarchy?","o":[["a","Lord Clive"],["b","Hector Munro"],["c","Lord Macaulay"],["d","Sir Lionel Curtis"],["e","None of the above / More than one of the above"]],"a":"d","s":"64th B.P.S.C. (Pre)2018","y":2018,"e":"Sir Lionel Curtis is regarded as the “Father of Dyarchy”. Under this system, the Government of India Act, 1919 divided provincial subjects into “Reserved” and “Transferred” categories.","b":false},{"id":25,"c":3,"q":"Who among the following abolished ‘Dual Government’ system in Bengal?","o":[["a","Robert Clive"],["b","Lord Cornwallis"],["c","Warren Hastings"],["d","None of the above"]],"a":"c","s":"41st B.P.S.C. (Pre) 1996 · 47th B.P.S.C. (Pre) 2005","y":2005,"e":"In 1771, the Court of Directors decided to end the Dual Government system. This decision was implemented in 1772 by Warren Hastings. The Calcutta Council and its President were instructed to act as the Diwan themselves and take over the administration of Bengal, Bihar and Orissa. Warren Hastings removed the two Deputy Diwans, Muhammad Raza Khan and Raja Shitab Rai, from their posts. Under the Dual Government system, which is considered to have begun in Bengal from 1765, the Company retained the Diwani rights and carried out the Nizamat functions through the Nawab; however, the real power remained with the Company. Clive believed that all power lay with the Company and that the Nawab had only a shadow of authority. He wrote to the Select Committee: “This name, this shadow is necessary, and we should accept it.”","b":false},{"id":26,"c":3,"q":"Under whose leadership wasthe suppression of Thugs achieved?","o":[["a","Lord Clive"],["b","Captain Sleeman"],["c","Lord Minto"],["d","Alexander Burnes"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019 · 64th B.P.S.C. (Pre) 2018","y":2019,"e":"The British government believed that Thugs included followers of both Hindu and Muslim faiths; however, in reality, these people worshipped Kali, Durga or Bhavani and usually killed their victims as a sacrifice to the goddess. The Thugs believed that this occupation was ordained by fate, and that a person’ s death was written in destiny in the same way. There were some differences of opinion on the issue of Sati, but thugs the entire public supported the government. Lord William Bentinck appointed Captain William Henry Sleeman to take action against the Thugs. He captured about 1,562 Thugs (between 1826 and 1835). Many Thugs were hanged, and the rest were transported for life. After 1837, organized Thuggee came to an end.","b":false},{"id":27,"c":3,"q":"Who is credited with the suppression of Thugs in India?","o":[["a","Earl of Dalhousie"],["b","Charles Metcalfe"],["c","W.T. Denison"],["d","W.H. Sleeman"],["e","None of the above/More than one of the above"]],"a":"d","s":"B.P.S.C. C.D.P.O. (Pre) 2018","y":2018,"e":"The British government believed that Thugs included followers of both Hindu and Muslim faiths; however, in reality, these people worshipped Kali, Durga or Bhavani and usually killed their victims as a sacrifice to the goddess. The Thugs believed that this occupation was ordained by fate, and that a person’ s death was written in destiny in the same way. There were some differences of opinion on the issue of Sati, but thugs the entire public supported the government. Lord William Bentinck appointed Captain William Henry Sleeman to take action against the Thugs. He captured about 1,562 Thugs (between 1826 and 1835). Many Thugs were hanged, and the rest were transported for life. After 1837, organized Thuggee came to an end.","b":true},{"id":28,"c":3,"q":"The first railway in India was laid down during the period of-","o":[["a","Lord Dalhousie"],["b","Lord Curzon"],["c","Lord Wellesley"],["d","Lord Lytton"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"The first railway line was laid in 1853 between Bombay and Thane during Dalhousie’ s time. The first passenger train of Eastern India ran on 15 August 1854 between Howrah and Hooghly.","b":false},{"id":29,"c":3,"q":"Which of the following social reforms were started by William Bentinck?","o":[["a","1 and 2 only"],["b","Only 1, 3 and 4"],["c","Only 1, 2 and 4"],["d","Only 1, 2, 3 and 4"],["e","None of the above"]],"a":"c","s":"67th B.P.S.C. (Pre) (Re-Exam.) 2017","y":2017,"e":"Lord William Bentinck became the Governor-General in 1828. In 1829, he declared Sati a crime and abolished it. During Bentinck’ s period, the Charter Act, 1833 was passed; it contained provisions aimed at abolishing slavery. Bentinck also launched a campaign against Thug gangs and tried to suppress them. He also worked on education and freedom of the press. In 1835, he returned to England. The provision of disqualification due to religious conversion was removed in 1850. Therefore, statements 1, 2 and 4 are correct, and hence option (c) is the correct answer. Note—The Charter Act of 1833 was an initial and policy-level step towards the abolition of slavery, but slavery did not end immediately after the Act was passed. Rather, it provided a practical platform for abolition. The actual and formal abolition of slavery took place through the Indian Slavery Act, 1843. This Act directly declared the buying and selling of slaves, and keeping slaves, illegal.","b":false,"L":["1.⦙Abolition of Sati Pratha","2.⦙Abolition of slavery","3.⦙Removal of the provision of disqualification due to religious conversion","4.⦙Suppression of organized gangs of thugs"],"n":"Select the correct answer from the code given below-"},{"id":30,"c":3,"q":"Who declared ‘Sati Pratha’ illegal?","o":[["a","Warren Hastings"],["b","William Bentinck"],["c","Cornwallis"],["d","Curzon"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"Lord William Bentinck became the Governor-General in 1828. In 1829, he declared Sati a crime and abolished it. During Bentinck’ s period, the Charter Act, 1833 was passed; it contained provisions aimed at abolishing slavery. Bentinck also launched a campaign against Thug gangs and tried to suppress them. He also worked on education and freedom of the press. In 1835, he returned to England. The provision of disqualification due to religious conversion was removed in 1850. Therefore, statements 1, 2 and 4 are correct, and hence option (c) is the correct answer. Note—The Charter Act of 1833 was an initial and policy-level step towards the abolition of slavery, but slavery did not end immediately after the Act was passed. Rather, it provided a practical platform for abolition. The actual and formal abolition of slavery took place through the Indian Slavery Act, 1843. This Act directly declared the buying and selling of slaves, and keeping slaves, illegal.","b":true},{"id":31,"c":3,"q":"Who was the Governor-General of India in 1857?","o":[["a","Wellesley"],["b","Dalhousie"],["c","Canning"],["d","Minto"]],"a":"c","s":"56th to 59th B.P.S.C. (Pre) 2014","y":2014,"e":"At the time of the Revolt of 1857, the Governor-General of India was Lord Canning (1856–58). Lord Canning was the last Governor-General appointed by the Company, and the first Viceroy of India appointed under the British Crown (1858–62).","b":false},{"id":32,"c":3,"q":"Which Viceroy adopted an aggressive policy towards Afghanistan?","o":[["a","Lord Mayo"],["b","Lord Lytton"],["c","Lord Dufferin"],["d","Lord Canning"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"When Lord Lytton became Viceroy in 1876, the policy towards Afghanistan changed. The policy of “efficient inaction,” was replaced by a forward policy.","b":false},{"id":33,"c":3,"q":"Lord Lytton is not associated with which of the following?","o":[["a","The Strachey Commission"],["b","The Arms Act"],["c","The Vernacular Press Act"],["d","The Ilbert Bill"]],"a":"d","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"Lord Lytton was not related to the Ilbert Bill controversy. The Ilbert Bill was introduced during the tenure of Viceroy Lord Ripon. This bill sought to allow senior Indian judges to try European offenders.","b":false},{"id":34,"c":3,"q":"Which Viceroy decentralized the colonial economic structure in India?","o":[["a","Mayo"],["b","Curzon"],["c","Ripon"],["d","More than one of the above"]],"a":"a","s":"70th B.P.S.C. (Re-Exam) (Pre) 2024","y":2024,"e":"The tenure of Viceroy Lord Mayo (1869–72) is known for educational, economic and administrative reforms. Mayo issued a resolution on 14 December 1870. This resolution, for the first time, spoke of decentralizing the colonial economic structure and took the first step towards the division of central and provincial finances. It also granted some autonomy to provincial governments by allocating them a portion of central revenue for services like jails, education and medical facilities, and allowing them to administer as they wished. Hence, option (a) is the correct answer.","b":false},{"id":35,"c":3,"q":"Sind was conquered and annexed by","o":[["a","Wellington"],["b","Sleeman"],["c","Napier"],["d","Lawrence"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th B.P.S.C. (Re-Exam) (Pre) 2021","y":2021,"e":"During the period of Governor-General Lord Ellen borough (1842–44), Sindh was fully annexed into the British Empire by Charles Napier in 1843. According to P.E. Roberts, “The conquest of Sindh took place after the Afghan War (1839–42) and was, morally and politically, its outcome.”","b":false},{"id":36,"c":3,"q":"In the context of the colonial period of Indian history, match List-I (Person) with List-II (Subject) and select","o":[["a","3 2 1 4"],["b","3 2 4 1"],["c","2 3 1 4"],["d","2 3 4 1"]],"a":"c","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The correct matching is as follows— Person Subject Macdonald Communal Award Linlithgow August Offer Dalhousie Doctrine of Lapse Chelmsford Dyarchy","b":false,"L":["⦚List-I (Person)⦙List-II (Subject)","A. Macdonald⦙1. Doctrine of Lapse","B. Linlithgow⦙2. Communal Award","C. Dalhousie⦙3. August Offer","D. Chelmsford⦙4. Dyarchy"],"n":"the correct answer using the code:"},{"id":37,"c":3,"q":"Which of the following States was not annexed under Lord Dalhousie's Doctrine of Lapse?","o":[["a","Nagpur"],["b","Jaipur"],["c","Sambalpur"],["d","Satara"]],"a":"b","s":"70th B.P.S.C. (Re-Exam) 2024","y":2024,"e":"Lord Dalhousie (1848–1856) annexed Awadh into the British dominions in February 1856, accusing the Nawab of Awadh, Wajid Ali Shah, of mal administration. Apart from Awadh, the territories annexed under Dalhousie’ s Doctrine of Lapse were—Satara (1849), Jaitpur and Sambalpur (1849), Baghat (1850), Udaipur (1852), Jhansi (1854) and Nagpur (1854). Jaipur was not included in these. Under Dalhousie’ s Doctrine of Lapse, the process of annexation of Satara began in 1848, while it was completed on 1 May, 1849.","b":false},{"id":38,"c":3,"q":"The policy of 'Security Cell' is related to-","o":[["a","Warren Hastings"],["b","Lord Dalhousie"],["c","Henry Lawrence"],["d","Lord Hastings"]],"a":"a","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"The Ring-Fence Policy was associated with Warren Hastings and Wellesley. Warren Hastings fought wars with Mysore and the Marathas, and with other Indian states, with the aim of gaining an equal status. During this time, the Company tried to create buffer states around its territory. Its objective was only to protect its own state; or we can also say: “Protect the borders of your neighbouring states so that your own borders remain secure.” At that time, the main fear was from the Afghans and the Marathas. Therefore, the Company took charge of Awadh’ s defence on the condition that the Nawab of Awadh would bear the expenditure; and in this way, the defence of Awadh was the defence of Bengal. With Wellesley’ s arrival, the Company’ s relations with Indian princely states changed. Wellesley’ s objective was to compel Indian states to depend on the Company for their protection. He tried to bring Indian states within the ring of British political power and military protection.","b":false},{"id":39,"c":3,"q":"First Maratha Sardar to accept the subsidiary alliance of Lord Wellesley was-","o":[["a","Peshwa Bajirao- II"],["b","Raghuji Bhosle"],["c","Daulat Rao Scindia"],["d","None of the above"]],"a":"a","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"Daulat Rao Scindia and Jaswant Holkar both wanted to prove themselves supreme in Pune. Baji Rao II was supporting Scindia. In 1801, he got Jaswant’ s brother killed; as a result, Jaswant Holkar’ s army attacked Pune and defeated the combined forces of the Peshwa and Scindia. Baji Rao II fled and took refuge at Bassein, and on 31 December, 1802, he signed the Treaty of Bassein with the British. Under the treaty, Peshwa Baji Rao II accepted British protection. This treaty is regarded as the first Subsidiary Alliance concluded by the Marathas with the British.","b":false},{"id":40,"c":3,"q":"Which of the following statements about Lord Mayo’ s Resolution of 1870 are correct?","o":[["a","Only 1 and 2"],["b","Only 1, 3 and 4"],["c","Only 2, 3 and 4"],["d","1, 2, 3 and 4"]],"a":"d","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"Viceroy Lord Mayo’ s tenure (1869–1872) is remembered for his educational and administrative reforms. For administrative improvement, after correspondence with different administrations, he issued a resolution on 14 December, 1870, which is also called the “Mayo Resolution” or the “Charter of Provincial Governments.” It took the first step that bifurcated central and provincial finances; and while giving some autonomy to provincial governments, it allotted them funds from the central revenue for services like jails, education and medical services, and asked them to administer as they wished. In this way, Mayo promoted provincial autonomy and focused on the real needs of the provinces. In 1871, Mayo focused on financial decentralization and tried to balance the financial problems of the British Empire, which were marked by continuous deficits.","b":false,"L":["1. It was the first step that bifurcated Central and Provincial finances.","2. Provincial Governments were empowered to administer certain services.","3. It attempted to rectify existing imparity.","4. It focused on the actual needs of the Provinces."],"n":"Select the correct answer using the codes given below."},{"id":41,"c":3,"q":"Whichof the following Princely States wasnot annexed by the British?","o":[["a","Sind"],["b","Gwalior"],["c","Awadh"],["d","Satara"],["e","None of the above/ More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre.) 2017","y":2017,"e":"Among the given options, the princely state of Gwalior was not annexed by the British. Sindh was annexed during the tenure of Lord Ellen borough (1842–1844 A.D.). During Lord Dalhousie’ s period, Awadh was annexed (1856 A.D.) on charges of mis governance, and Satara was annexed (1849 A.D.) under the Doctrine of Lapse. Under Dalhousie’ s Doctrine of Lapse, the process of annexation of Satara began in 1848, while Satara was completed on 1 May, 1849.","b":false},{"id":42,"c":3,"q":"At which Viceroy was a bomb thrown on the occasion of his state entry into Delhi?","o":[["a","Lord Minto"],["b","Lord Curzon"],["c","Lord Hardinge"],["d","Lord Wavell"]],"a":"c","s":"71st B.P.S.C.(Pre) 2025","y":2025,"e":"In 1911, the British government announced shifting India’ s capital from Calcutta to Delhi. After this, on 23 December, 1912, a grand state entry procession of Viceroy Lord Hardinge II was taken out in the new capital, Delhi. On this occasion, in the Chandni Chowk area of Delhi, revolutionaries threw a bomb at the Viceroy’ s elephant howdah. In this attack, Lord Hardinge II was seriously injured and the mahout was killed. This attack was planned under the leadership of the revolutionary Rash Behari Bose.","b":false},{"id":43,"c":3,"q":"In whose tenure as the Viceroy of India were the great martyrs Bhagat Singh,Sukhdev and Raj guru hanged?","o":[["a","Lord Curzon"],["b","Lord Irwin"],["c","Lord Minto"],["d","Lord Chelmsford"]],"a":"b","s":"B.P.S.C. (Assistant) 2019","y":2019,"e":"The great revolutionary martyrs Bhagat Singh, Sukhdev and Rajguru were hanged on 23 March, 1931 during the tenure of Viceroy Lord Irwin (tenure: 3 April, 1926–18 April, 1931).","b":false},{"id":44,"c":3,"q":"Who established Imperial Cadet Corps?","o":[["a","Lord Minto"],["b","Lord Curzon"],["c","Lord Lytton"],["d","Lord Ripon"],["e","None of the above/More than one of the above"]],"a":"b","s":"63rd B.P.S.C. (Pre) 2017","y":2017,"e":"Lord Curzon established the Imperial Cadet Corps in 1901. Its objective was to provide military training for the princes of princely states and the sons of feudal chiefs/landed nobility.","b":false},{"id":45,"c":3,"q":"Who hailed free India's first Prime Minister Jawaharlal Nehru as an outstanding leader of courage and vision?","o":[["a","Maulana Abul Kalam Azad"],["b","Lord Mountbatten"],["c","Sardar Patel"],["d","Clement Attlee"],["e","None of the above / More than one of the above"]],"a":"b","s":"B.P.S.C. C.D.P.O. (Pre) 2022","y":2022,"e":"Lord Mountbatten hailed Jawaharlal Nehru, the first Prime Minister of independent India, as an outstanding leader of courage and farsightedness.","b":false},{"id":46,"c":3,"q":"Which among the following viceroy’ s period the title of ‘Rai Bahadur’ and ‘Khan Bahadur’ began to confer to Indian?","o":[["a","Lord Ripon"],["b","Lord Lytton"],["c","Lord Mayo"],["d","Lord Dufferin"],["e","None of the above/More than one of the above"]],"a":"e","s":"60th to 62nd B.P.S.C. (Pre) 2016","y":2016,"e":"To win the confidence of the princely rulers, zamindars, etc. who helped the British during the Revolt of 1857, the British began granting them facilities such as titles, robes of honour (khil'at), land grants, loan waivers, etc. Among these, the major title given to Hindus was ‘Rai Bahadur’, and the equivalent title given to Muslims and Parsis was ‘Khan Bahadur’. Evidence of these titles being conferred is found from 1859–1860 A.D. onwards.","b":false},{"id":47,"c":3,"q":"The first Indian who assumed the office of Governor General in independent India was—","o":[["a","Jamnalal Bajaj"],["b","C. Rajagopalachari"],["c","Dr. Rajendra Prasad"],["d","M.A. Ansari"]],"a":"b","s":"46th B.P.S.C. (Pre) 2004","y":2004,"e":"C. Rajagopalachari was the first Indian and the last Governor-General of independent India from 1948 to 1950. He remained in this post till 26 January, 1950. He served as the Chief Minister of Madras from 1952 to 1954. Due to differences with the Congress on various issues, he resigned from the Congress and, in 1959, formed the “Swatantra Party” along with his associates.","b":false},{"id":48,"c":3,"q":"The first Indian Governor-General of independent India was-","o":[["a","Rajagopalachari"],["b","Surendra Nath"],["c","Rajendra Prasad"],["d","B.R. Ambedkar"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"C. Rajagopalachari was the first Indian and the last Governor-General of independent India from 1948 to 1950. He remained in this post till 26 January, 1950. He served as the Chief Minister of Madras from 1952 to 1954. Due to differences with the Congress on various issues, he resigned from the Congress and, in 1959, formed the “Swatantra Party” along with his associates.","b":true},{"id":49,"c":4,"q":"What was the impact of railways on Indian industries during the colonial period?","o":[["a","Hindered industrial development by promoting imports."],["b","Entrepreneurship was encouraged in remote areas."],["c","Promoted industrial development by providing cheap transport."],["d","More than one of the above"],["e","None of the above/More than one of the above"]],"a":"a","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The first railway in India ran in 1853 between Bombay and Thane. During the colonial period, the development of railways promoted imports and created obstacles to industrial development. As a result, it had a negative impact on Indian industries.","b":false},{"id":50,"c":4,"q":"The ‘Permanent Settlement’ was made with –","o":[["a","Zamindars"],["b","Village communities"],["c","Muqaddamas"],["d","Peasants"]],"a":"a","s":"53rd to 55th B.P.S.C. (Pre) 2011","y":2011,"e":"In 1793, Lord Cornwallis introduced the Permanent Settlement system of land revenue. It was also known by different names such as Istemrari, Jagirdari, Malguzari and Biswedari, etc. This system was implemented in Bengal, Bihar, Odisha and Varanasi in Uttar Pradesh. Under it, about 19% of the total area of British India was covered. Under this arrangement, a new class of zamindars was declared as landowners. They had to pay 10/11 of the land revenue to the Company and could keep 1/11 for their services.","b":false},{"id":51,"c":4,"q":"Who introduced the permanent settlement in Bengal?","o":[["a","Holt Mackenzie"],["b","Lord Cornwallis"],["c","Warren Hastings"],["d","None of the above"]],"a":"b","s":"70th B.P.S.C Re-Exam (Pre) 2024","y":2024,"e":"In 1793, Lord Cornwallis introduced the Permanent Settlement system of land revenue. It was also known by different names such as Istemrari, Jagirdari, Malguzari and Biswedari, etc. This system was implemented in Bengal, Bihar, Odisha and Varanasi in Uttar Pradesh. Under it, about 19% of the total area of British India was covered. Under this arrangement, a new class of zamindars was declared as landowners. They had to pay 10/11 of the land revenue to the Company and could keep 1/11 for their services.","b":true},{"id":52,"c":4,"q":"The Ryotwari system was first implemented in –","o":[["a","Gujarat"],["b","Madras"],["c","Bombay"],["d","Odisha"],["e","None of the above/More than one of the above"]],"a":"b","s":"67th B.P.S.C. (Pre) 2022","y":2022,"e":"The Ryotwari system was first introduced experimentally in the Madras Presidency by Alexander Read in 1792 in the Baramahal region of Tamil Nadu. Thomas Munro is closely associated with the Ryotwari system. After becoming the Governor of Madras in 1820, he implemented it throughout the Madras Presidency. Munro’ s disciple Elphinstone introduced it in the Bombay Presidency. This system was implemented in about 51% of the total area of British India (Madras, some parts of Bombay, Assam and Coorg now a part of modern Karnataka, etc.). Under this system, ryots were given ownership rights over land, and they were directly and individually responsible for paying land revenue. After 1835, G. Wingate and H. E. Goldsmith introduced reforms in this system.","b":false},{"id":53,"c":4,"q":"Who introduced the Ryotwari system in Madras?","o":[["a","Lord Cornwallis"],["b","Thomas Munro"],["c","Lord William Bentinck"],["d","Lord Wellesley"],["e","None of the above/More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"The Ryotwari system was first introduced experimentally in the Madras Presidency by Alexander Read in 1792 in the Baramahal region of Tamil Nadu. Thomas Munro is closely associated with the Ryotwari system. After becoming the Governor of Madras in 1820, he implemented it throughout the Madras Presidency. Munro’ s disciple Elphinstone introduced it in the Bombay Presidency. This system was implemented in about 51% of the total area of British India (Madras, some parts of Bombay, Assam and Coorg now a part of modern Karnataka, etc.). Under this system, ryots were given ownership rights over land, and they were directly and individually responsible for paying land revenue. After 1835, G. Wingate and H. E. Goldsmith introduced reforms in this system.","b":true},{"id":54,"c":4,"q":"The system, under which the peasant himself is the owner of the land and is held responsible for the payment of land revenue to the government is known as?","o":[["a","Zamindari system"],["b","Ryotwari system"],["c","Mahalwari system"],["d","Dahsala system"],["e","None of the above More than one of the above"]],"a":"b","s":"65th B.P.S.C. (Pre) 2019","y":2019,"e":"Under the Ryotwari system, the peasant himself is the owner of the land and is held responsible for the payment of land revenue to the Government..","b":false},{"id":55,"c":4,"q":"Who introduced the system of Mahalwari Settlement in Bengal?","o":[["a","Lord Hastings"],["b","Lord Cornwallis"],["c","Holt Mackenzie"],["d","More than one of the above"],["e","None of the above"]],"a":"c","s":"68th B.P.S.C. (Pre) 2023","y":2023,"e":"In 1822, Holt Mackenzie prepared a new method of land-revenue administration, the Mahalwari system, in the Bengal Presidency of the North Western Province (most of this area lies in present-day Uttar Pradesh). In this system, nearly 30% of British India’ s land area was included, along with the Central Provinces and Punjab. The Mahalwari system contained elements of both the Zamindari and Ryotwari systems. In the asked question, the word “Bengal” has been used, which is incorrect; instead, the term “Bengal Presidency” is more appropriate. Therefore, option (c) is correct. The Bihar Public Service Commission also considered option (c) as correct in both its original and revised answer keys.","b":false},{"id":56,"c":4,"q":"What was the name also given to the forced labor (begar) or illegal levy demanded from the farmer by the landlord?","o":[["a","Vethi"],["b","Fenugreek"],["c","Sathi"],["d","Biti"],["e","None of the above"]],"a":"a","s":"B.P.S.C. (CDPO) (Pre) 2018","y":2018,"e":"The begar (unpaid forced labour) or illegal levy demanded by zamindars from cultivators was called Vethi. The practice of making people work without wages is called begar; that is, it is a kind of unpaid forced labour.","b":false},{"id":57,"c":4,"q":"Home Charges or the expenses of the Indian government in Britain included:","o":[["a","Pensions of British Indian officers"],["b","Military and other stores purchased in India"],["c","Guaranteed interest on railways"],["d","All of the above"],["e","None of the above"]],"a":"d","s":"65th B.P.S.C. (Re-Exam) (Pre) 2020","y":2020,"e":"Home Charges, i.e., the expenditure of the Government of India in Britain, included the pensions of British officials serving in India, military and other stores purchased in England and supplied to India, and the guaranteed interest paid to railway investors. Here, due to an error in the option, it is written “military and other stores purchased in India,” whereas “purchased in England and supplied to India” is more accurate, as mentioned by historians like Bipan Chandra as well.","b":false},{"id":58,"c":4,"q":"In which year was the first cotton textile mill established in India?","o":[["a","1818"],["b","1861"],["c","1854"],["d","More than one of the above"],["e","None of the above"]],"a":"a","s":"B.P.S.C. TRE-3 July, 2024","y":2024,"e":"The first cotton textile mill in India was established in 1818 at Fort Gloster near Kolkata. However, this mill proved to be a commercial failure and was shut down.","b":false},{"id":59,"c":5,"q":"When was the new Enfield Rifle with greased cartridges introduced in the British Indian Army?","o":[["a","November, 1856"],["b","December, 1856"],["c","January, 1857"],["d","February, 1857"]],"a":"b","s":"47th B.P.S.C. (Pre) 2005","y":2005,"e":"In December, 1856, the government decided to replace the old Brown Bess musket with the new Enfield rifle. Training for these rifles was to be given at Dum Dum, Ambala and Sialkot. These rifles used greased cartridges, which were said to be coated with the fat of cows and pigs. In this rifle, the upper part of the cartridge had to be bitten off with the mouth. In January, 1857, a rumour spread in the Bengal Army that the greased cartridges contained the fat of cows and pigs. The military officers denied it immediately without proper investigation. But the soldiers became convinced that the use of such cartridges was a deliberate attempt to corrupt their religion, and this became the immediate cause of the Revolt of 1857.","b":false},{"id":60,"c":5,"q":"Where from the Revolution of 1857 started first?","o":[["a","Lucknow"],["b","Allahabad"],["c","Jhansi"],["d","Meerut"],["e","None of the above/More than one of the above"]],"a":"d","s":"66th B.P.S.C. Re-Exam (Pre) 2020","y":2020,"e":"The incident of 24 April, 1857 at Meerut proved to be a milestone in the history of India’ s freedom struggle. Colonel Carmichael Smyth ordered that greased cartridges be issued to Indian soldiers, which had to be opened with the mouth. Angered by this, 85 out of 90 soldiers of the 3rd Bengal Native Cavalry / 3rd Regiment of Light Cavalry revolted against these cartridges. On 9 May, 1857, these rebel soldiers were court-martialled at the Meerut parade ground. Enraged by this action, they revolted at Meerut on 10 May, 1857 and sounded the bugle of the first war of independence, i.e., the Revolt of 1857.","b":false},{"id":61,"c":5,"q":"The Revolt of 1857 AD first started from-","o":[["a","Barrack pore"],["b","Meerut"],["c","Delhi"],["d","Jhansi"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"The incident of 24 April, 1857 at Meerut proved to be a milestone in the history of India’ s freedom struggle. Colonel Carmichael Smyth ordered that greased cartridges be issued to Indian soldiers, which had to be opened with the mouth. Angered by this, 85 out of 90 soldiers of the 3rd Bengal Native Cavalry / 3rd Regiment of Light Cavalry revolted against these cartridges. On 9 May, 1857, these rebel soldiers were court-martialled at the Meerut parade ground. Enraged by this action, they revolted at Meerut on 10 May, 1857 and sounded the bugle of the first war of independence, i.e., the Revolt of 1857.","b":true},{"id":62,"c":5,"q":"Which of the following was not a reason for making the sepoys of the East India Company rebellious?","o":[["a","The efforts of the officers of the company to spread Christianity"],["b","The order to the sepoys to travel on ships"],["c","The stoppage of Bhatta"],["d","The inefficiency of the officers"],["e","None of the above/More than one of the above"]],"a":"d","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Attempts by Company officials to spread Christianity, orders to sepoys to travel by ship, and the stoppage of allowances such as postal allowances, etc., became reasons that pushed the sepoys of the East India Company towards rebellion, which ultimately resulted in the Revolt of 1857. It is noteworthy that the incompetence of officers was not a cause, although ill-treatment by officers certainly aggravated the situation.","b":false},{"id":63,"c":5,"q":"The revolt of 1857 at Lucknow was led by:","o":[["a","Begum of Awadh"],["b","Tatya Tope"],["c","Rani Lakshmibai"],["d","Nana Saheb"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"In Lucknow (Awadh), the revolt began on 30 May, 1857. It was led by the Begum of Awadh, Hazrat Mahal.","b":false},{"id":64,"c":5,"q":"Which of the following persons had participated actively in the Revolt of 1857?","o":[["a","Nana Saheb (Kanpur)"],["b","Begum Hazrat Mahal (Lucknow)"],["c","Maulavi Ahmadullah (Faizabad)"],["d","Begum Zeenat Mahal (Delhi)"],["e","None of the above/ More than one of the above"]],"a":"e","s":"66th B.P.S.C. (Pre) 2020","y":2020,"e":"The political, economic, social and religious causes, due to the Revolt of 1857 began. The revolt started in Lucknow in May, 1857 and it was led by Begum Hazrat Mahal. In Kanpur, it was led by Nana Saheb, and in Faizabad, it was led by Maulvi Ahmadullah Shah. On the other hand, the role of Begum Zeenat Mahal, wife of Bahadur Shah Zafar (the last Mughal emperor), in the Revolt of 1857 was doubtful. According to British sources, she was not a supporter of the rebels; rather, she sought a compromise with the British and acted in a way that weakened the revolt. However, some sources say that Zeenat Mahal opened the gates of Delhi for the rebels of 1857, but this claim is not confirmed by any reliable source. Therefore, among all the given options, the most appropriate answer is option (e).","b":false},{"id":65,"c":5,"q":"Who among the following did not rebel against the British East India Company’ s control over them?","o":[["a","Raja of Vijayanagar"],["b","Nizam of Hyderabad"],["c","Poligar of Tamil Nadu"],["d","Dewan Velu Thampi of Travancore"],["e","None of the above/More than one of the above"]],"a":"b","s":"64th B.P.S.C. (Pre) 2018","y":2018,"e":"Among the above options, the Nizam of Hyderabad did not rebel against the Company’ s control. The King of Vijayanagar rebelled against Company rule in the latter half of the eighteenth century. The Poligars of Tamil Nadu revolted several times, and Dewan Velu Thampi of Travancore led a revolt against the English in 1808–09.","b":false},{"id":66,"c":5,"q":"Who among the following was the bitterest enemy of the British during the Revolt of 1857?","o":[["a","Maulavi Ahmadullah Shah"],["b","Maulavi Imdadullah"],["c","Maulana Fazil-i-Haq Kha ira bad i"],["d","Nawab Liaquat Ali"]],"a":"a","s":"45th B.P.S.C. (Pre) 2000","y":2000,"e":"Maulavi Ahmadullah Shah provided leadership to the revolt in Faizabad. He was considered the most staunch enemy of the English. He was originally from Chen napa tnam in the Madras Presidency, but he came and settled in Faizabad. Calling upon followers of different religions in India, he said, “All people, rise against the infidel English and drive them out of India.” The English said of him that he was “A man full of indomitable courage and firm determination, and the best soldier among the rebels.” The British government announced a reward of Rs. 50,000 for his arrest.","b":false},{"id":67,"c":5,"q":"The Revolt of 1857 was witnessed by the poet –","o":[["a","Mir Taqi Mir"],["b","Zauq"],["c","Ghalib"],["d","Iqbal"]],"a":"c","s":"45th B.P.S.C. (Pre) 2001","y":2001,"e":"Mirza Ghalib witnessed the Revolt of 1857 with his own eyes.","b":false},{"id":68,"c":5,"q":"Which of the following names is associated with the movement of 1857 A.D.?","o":[["a","Bhagat Singh"],["b","Tatya Tope"],["c","B.G. Tilak"],["d","G.K. Gokhale"]],"a":"b","s":"B.P.S.C. (CDPO) (Pre) 2005","y":2005,"e":"Tatya Tope (1814–1859) was also known as Ramchandra Pandurang. He was a major leader of the Indian Revolt of 1857. He was born in the Yeola/Yevla village of Maharashtra, where he became a friend of Nana Dhondu Pant (also known as Nana Saheb), the adopted son of Peshwa Baji Rao II. After the death of Peshwa Baji Rao II in 1851, Dalhousie deprived Nana of his father’ s pension. Tatya Tope had already begun to consider the British as his enemy. Together, they defeated the Indian troops of the East India Company at Kanpur, established Nana Saheb’ s supremacy, and Tatya himself became the Commander-in-Chief of the army. He was hanged by a military court in April 1859.","b":false},{"id":69,"c":5,"q":"Where was Jhansi ki Rani Lakshmibai died?","o":[["a","Lucknow"],["b","Kanpur"],["c","Gwalior"],["d","Jhansi"],["e","None of the above/More than one of the above"]],"a":"c","s":"67th B.P.S.C. (Re-Exam) (Pre) 2022","y":2022,"e":"Rani Lakshmibai of Jhansi died in Gwalior. Her samadhi (memorial) is also located in Gwalior. She was born in Varanasi, and her childhood name was Manu.","b":false},{"id":70,"c":5,"q":"Which of the following groups did not participate in the revolt of 1857?","o":[["a","Only 1"],["b","1 and 2"],["c","Only 2"],["d","2 and 4"]],"a":"d","s":"40th B.P.S.C. (Pre) 1995","y":1995,"e":"The Revolt of 1857 spread over a very large area and received wide popular support. Even so, it could not engulf the whole country or all sections and classes of Indian society. It did not spread to South India and to most parts of Eastern and Western India. Most rulers of the Indian princely states and the big zamindars were self-seeking and, frightened of British power, did not join the revolt. On the contrary, the Scindia of Gwalior, the Holkar of Indore, the Nizam of Hyderabad, the Maharaja of Jodhpur, the Sikh rulers of Patiala, Nabha and Jind, other Sikh chiefs of Punjab, the Maharaja of Kashmir, and many other chiefs and big zamindars actively helped the British in suppressing the revolt. Governor-General Canning later remarked that these rulers “acted like a dam before the storm; otherwise the storm would have swept us away in a single wave.” Traders and the educated class held meetings in Calcutta and Bombay and appealed to help the British. Most people of the upper and middle classes were critics of the rebels. Many talukdars (big zamindars) of Awadh who had joined the revolt withdrew from it after receiving an assurance from the British that their estates would be restored. In rural attacks, the main targets were moneylenders; therefore, they naturally became enemies of the revolt. Indians with modern education also did not support the revolt. The educated Indians wanted to remove the backwardness of the country. They were wrongly convinced that the British would help them in completing these tasks of modernization.","b":false,"L":["1. Agricultural Labour 2. Sahukar","3. Farmers 4. Zamindars Select your answer from the following codes:"]},{"id":71,"c":5,"q":"What was the main cause of the failure of the revolt of 1857?","o":[["a","Lack of Hindu-Muslim unity"],["b","Lack of common strategy and central organization"],["c","Its effect was within a limited area"],["d","Non-participation of Landlords"]],"a":"b","s":"41st B.P.S.C. (Pre) 1996","y":1996,"e":"The main reason for the failure of the Revolt of 1857 was the lack of a common plan and a central organization. No spirit of organization was seen among the rebel leaders. The 82-year-old Bahadur Shah was weak, and his call to various chiefs was not sufficient. The rebels certainly showed bravery and appeared determined to destroy the government, but they completely lacked a planned and unified programme to do so. They also lacked discipline. At times, they behaved like a rioting mob rather than a disciplined army. Except for a shared hatred towards foreign rule, there was no other binding link among the leaders. After uprooting British authority from a particular region, they did not even know what kind of political power or institutions should be established in its place. They lacked a future-oriented programme, coherent ideology, political perspective, or a clear vision of a future society and economy.","b":false},{"id":72,"c":5,"q":"Whichof the following were the reasons for the failure of the Revolt of 1857?","o":[["a","Only 1 and 2"],["b","Only 2 and 3"],["c","All of the above"],["d","None of the above"]],"a":"c","s":"69th B.P.S.C. (Pre) 2023","y":2023,"e":"The main reason for the failure of the Revolt of 1857 was the lack of a common plan and a central organization. No spirit of organization was seen among the rebel leaders. The 82-year-old Bahadur Shah was weak, and his call to various chiefs was not sufficient. The rebels certainly showed bravery and appeared determined to destroy the government, but they completely lacked a planned and unified programme to do so. They also lacked discipline. At times, they behaved like a rioting mob rather than a disciplined army. Except for a shared hatred towards foreign rule, there was no other binding link among the leaders. After uprooting British authority from a particular region, they did not even know what kind of political power or institutions should be established in its place. They lacked a future-oriented programme, coherent ideology, political perspective, or a clear vision of a future society and economy.","b":true,"L":["1. The military superiority of the British","2. The rebels did not have a unified programme and ideology","3. There was a lack of support from all the sections of society"],"n":"Select the correct answer using the codes given below."},{"id":73,"c":5,"q":"Consider: Assertion (A): The first war of Independence in 1857 failed to secure freedom from the British Government. Reason (R): The leadership of Bahadur Shah Zafar did not have popular support and most of the Indian rulers of important States shied away from the struggle.","o":[["a","Both (A) and (R) are true, and (R) is the correct explanation of (A)."],["b","Both (A) and (R) are true, but (R) is not the correct explanation of (A)."],["c","(A) is true, and (R) is false."],["d","(A) is false, but (R) is true."]],"a":"a","s":"39th B.P.S.C. (Pre) 1994","y":1994,"e":"The nature of the Revolt of 1857 was mainly feudal, though it contained some elements of nationalism. The feudal elements of Awadh, Roh ilk hand and other parts of North India led the revolt and, on the other hand, the rulers of Patiala, Jind, Gwalior and Hyderabad helped in suppressing it. In a time of crisis, Canning said—“If Scindia also joins the revolt, I will have to roll up my bed tomorrow.”","b":false,"n":"Select the correct answer from the code given below:"},{"id":74,"c":5,"q":"When did Queen Victoria declare the taking over of Indian administration under the British Crown?","o":[["a","1 Nov. 1858"],["b","31 Dec. 1857"],["c","6 Jan. 1858"],["d","17 Nov. 1859"]],"a":"a","s":"48th to 52nd B.P.S.C. (Pre) 2008","y":2008,"e":"After the suppression of the Revolt of 1857, on 1 November, 1858, Queen Victoria declared that Indian administration would be taken under the control of the British Crown. After this proclamation, Company rule in India ended and India was brought directly under the British Crown. The post of Secretary of State for India (also called India Secretary) was created, and to assist him
