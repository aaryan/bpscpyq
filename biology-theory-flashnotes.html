ckwards)."},{"t":"b","v":"HIV first enters **macrophages**, which become an HIV factory, then attacks **helper T-lymphocytes**."},{"t":"b","v":"Destroying helper T-cells **weakens immunity**, so the body falls prey to other infections."},{"t":"b","v":"It spreads by **unprotected sex, infected blood/needles, and mother-to-child**; not by casual touch."}]},{"h":"The Immune System and Blood Cells","pts":[{"t":"b","v":"Immunity is the body's defence; the most important cells are the **white blood cells (WBCs / leucocytes)**."},{"t":"b","v":"**Lymphocytes** are the key immune cells: **B-cells make antibodies**, **T-cells** direct cell-mediated defence."},{"t":"b","v":"An **antigen** is a foreign substance; the body makes matching **antibodies** to neutralise it."},{"t":"b","v":"Lymphocytes are formed in the **bone marrow** (T-cells mature in the thymus)."},{"t":"b","v":"**Innate immunity** is present from birth; **acquired immunity** develops after exposure or vaccination."},{"t":"b","v":"**Leukaemia** is blood cancer with an abnormal increase in white blood cells."}]},{"h":"Antibodies (Immunoglobulins)","pts":[{"t":"b","v":"Antibodies are protein molecules called **immunoglobulins (Ig)** produced by B-lymphocytes."},{"t":"b","v":"**IgM is the first antibody produced** in response to a new infection."},{"t":"b","v":"**IgG is the most abundant** and provides long-term protection; it crosses the placenta."},{"t":"b","v":"**IgA** guards mucous membranes (saliva, tears, milk); **IgE** is linked to allergies."},{"t":"table","rows":[["Antibody","Key Feature"],["IgM","First produced in infection"],["IgG","Most abundant, long-term, crosses placenta"],["IgA","Protects mucosa (saliva, tears, milk)"],["IgE","Allergy and parasite response"]],"hdr":true}]},{"h":"Vaccines and How They Work","pts":[{"t":"b","v":"A **vaccine** introduces a harmless form of a pathogen (an antigen) so the body makes antibodies in advance."},{"t":"b","v":"This builds **memory cells**, giving fast protection if the real germ attacks later."},{"t":"b","v":"**Live attenuated** vaccines use weakened germs; **inactivated** vaccines use killed germs."},{"t":"b","v":"**mRNA vaccines** deliver genetic instructions so cells make the viral spike protein (e.g. Pfizer, Moderna against Covid-19)."},{"t":"b","v":"**Vector vaccines** use a harmless carrier virus to deliver the antigen gene (e.g. Covishield)."},{"t":"b","v":"**Covishield** is made by the **Serum Institute of India** (Oxford-AstraZeneca technology)."}]},{"h":"Vaccine Immune Response Steps","pts":[{"t":"b","v":"Step 1: The vaccine introduces an **antigen** recognised as foreign."},{"t":"b","v":"Step 2: B-lymphocytes produce **antibodies** against that antigen."},{"t":"b","v":"Step 3: The body forms **memory cells** that remember the pathogen."},{"t":"b","v":"Step 4: On real exposure, memory cells trigger a **fast, strong secondary response**. **How vaccines trigger an immune response**"}]},{"h":"Deficiency Diseases","pts":[{"t":"b","v":"**Scurvy** (bleeding gums) is due to lack of **Vitamin C**."},{"t":"b","v":"**Beri-beri** is caused by lack of **thiamine (Vitamin B1)**; eating only polished rice causes it."},{"t":"b","v":"**Kwashiorkor and marasmus** are due to **protein deficiency** in children."},{"t":"b","v":"**Iron deficiency** causes **anaemia**; **iodine deficiency** causes **goitre**."},{"t":"b","v":"Dengue fever causes a sharp fall in **platelets (thrombocytes)**."},{"t":"table","rows":[["Deficiency","Disease"],["Vitamin C","Scurvy"],["Vitamin B1 (thiamine)","Beri-beri"],["Protein","Kwashiorkor, marasmus"],["Iron","Anaemia"],["Iodine","Goitre"]],"hdr":true}]},{"h":"Cancer and Lifestyle Diseases","pts":[{"t":"b","v":"**Cancer** is uncontrolled, abnormal cell division forming tumours."},{"t":"b","v":"**Oncogenes** are cancer-causing genes; normal genes can mutate into them."},{"t":"b","v":"**Carcinogens** (cancer-causing agents) include tobacco, UV rays and certain chemicals; **UV rays cause skin cancer**."},{"t":"b","v":"**Radiation** can both cause cancer and, in controlled doses, treat it (radiotherapy)."},{"t":"b","v":"**Leukaemia** is cancer of white blood cells (blood cancer)."},{"t":"b","v":"Lifestyle/non-communicable diseases include **diabetes, hypertension and heart disease**."}]},{"h":"Disease Outbreak Terms and Disorders","pts":[{"t":"b","v":"**Epidemic**: disease spreads rapidly across a large community or region."},{"t":"b","v":"**Pandemic**: an outbreak spreads across many countries or the whole world (e.g. Covid-19)."},{"t":"b","v":"**Endemic**: a disease constantly present in a particular area."},{"t":"b","v":"**Insomnia** is a sleep disorder (inability to sleep); **sleep apnea** is repeated stopping of breathing during sleep."},{"t":"b","v":"**Anorexia** is loss/lack of appetite; **bulimia** involves not knowing when to stop eating."},{"t":"b","v":"**Dyspnoea** means shortness of breath; **anosmia** means loss of the sense of smell."},{"t":"table","rows":[["Term","Meaning"],["Epidemic","Spreads across a region"],["Pandemic","Spreads worldwide"],["Endemic","Always present in an area"]],"hdr":true}]},{"h":"Food Preservation and Disease Prevention","pts":[{"t":"b","v":"**Refrigeration** preserves food by **slowing the growth of microbes**, not by killing them."},{"t":"b","v":"**Pasteurisation** heats milk to kill harmful germs while keeping it usable."},{"t":"b","v":"**Clean water and sanitation** prevent waterborne diseases like typhoid and cholera."},{"t":"b","v":"**Vaccination** and good ventilation cut airborne and preventable infections. **Mosquito-borne disease vector & life cycle Human respiratory system (lungs & alveoli) Bone with marrow (site of lymphocyte formation)**"}]}]},{"t":"Ecology, Ecosystem & Biodiversity","S":[{"h":"What Ecology Studies","pts":[{"t":"b","v":"**Ecology** is the study of how organisms interact with each other and with their non-living surroundings."},{"t":"b","v":"The word comes from Greek **oikos = home**, so ecology means the study of the home of life."},{"t":"b","v":"Energy flows from the **Sun → plants → animals → decomposers**, while materials are recycled endlessly."},{"t":"b","v":"The four big ideas of this chapter are the **ecosystem, energy flow, nutrient cycling and biodiversity**."},{"t":"b","v":"Levels of organisation studied are **organism → population → community → ecosystem → biome → biosphere**."}]},{"h":"Ecosystem – Structure & Components","pts":[{"t":"b","v":"An **ecosystem** is a unit where living organisms interact with each other and their physical environment."},{"t":"b","v":"NCERT calls it the **structural and functional unit of nature**; a pond, forest or aquarium is one."},{"t":"b","v":"**Abiotic components** are non-living factors – air, water, soil, temperature and light."},{"t":"b","v":"**Biotic components** are all living things, grouped as producers, consumers and decomposers."},{"t":"b","v":"Key structural features are **species composition** (which species) and **stratification** (vertical layering)."},{"t":"b","v":"A large climate-and-vegetation region is a **biome**; the exact spot an organism lives in is its **habitat**."},{"t":"table","rows":[["Component","Examples"],["Abiotic","Air, water, soil, light, temperature"],["Biotic","Producers, consumers, decomposers"]],"hdr":true}]},{"h":"Abiotic Factors & Adaptations","pts":[{"t":"b","v":"The four most important abiotic factors are **temperature, water, light and soil**."},{"t":"b","v":"Life survives in extremes – deserts, ocean trenches, polar permafrost, **hot thermal springs** and the human gut."},{"t":"b","v":"An **adaptation** is a useful feature evolved through natural selection to help survival and reproduction."},{"t":"b","v":"Desert (dry-loving) animals are called **xerocoles**; desert plants storing water are **xerophytes**."},{"t":"b","v":"Salt-loving plants are called **halophytes**; water-loving plants are **hydrophytes**."},{"t":"b","v":"A cactus storing water and spiny leaves is a classic **desert adaptation**."},{"t":"table","rows":[["Term","Adapted to"],["Xerophyte","Dry / desert habitat"],["Halophyte","Saline (salty) soil"],["Hydrophyte","Aquatic habitat"],["Mesophyte","Moderate moisture"]],"hdr":true}]},{"h":"Producers, Consumers & Decomposers","pts":[{"t":"b","v":"**Producers (autotrophs)** make their own food from CO2 and water using sunlight – green plants, algae, phytoplankton."},{"t":"b","v":"Producers are the **entry point of energy** into every ecosystem."},{"t":"b","v":"**Consumers (heterotrophs)** cannot make food; all animals ultimately depend on plants."},{"t":"b","v":"**Herbivores** are primary consumers; **carnivores** are secondary/tertiary consumers."},{"t":"b","v":"**Omnivores** like humans, crows and cockroaches eat both plants and animals."},{"t":"b","v":"**Decomposers (saprotrophs)** – fungi and bacteria – break down dead matter (detritus) and recycle nutrients."},{"t":"table","rows":[["Group","Food source","Example"],["Producer","Sunlight + CO2","Green plant, algae"],["Herbivore","Plants","Deer, grasshopper"],["Carnivore","Animals","Snake, eagle"],["Decomposer","Dead matter","Fungi, bacteria"]],"hdr":true}]},{"h":"Trophic Levels, Food Chains & Food Webs","pts":[{"t":"b","v":"A **trophic level** is the feeding position in a food chain; it is a functional level, not a fixed species."},{"t":"b","v":"Producers are the **1st trophic level**, herbivores the 2nd, carnivores the 3rd, and so on."},{"t":"b","v":"A **food chain** is a straight-line who-eats-whom, e.g. grass → grasshopper → frog → snake → eagle."},{"t":"b","v":"A **grazing food chain (GFC)** starts with living plants and dominates aquatic ecosystems."},{"t":"b","v":"A **detritus food chain (DFC)** starts with dead matter; on land more energy flows through the DFC."},{"t":"b","v":"Many interlinked chains form a **food web**, which makes the ecosystem more stable."},{"t":"table","rows":[["Food chain","Starts with","Dominant in"],["Grazing (GFC)","Living green plants","Aquatic ecosystems"],["Detritus (DFC)","Dead organic matter","Terrestrial ecosystems"]],"hdr":true}]},{"h":"Energy Flow & the 10% Law","pts":[{"t":"b","v":"The **Sun** is the energy source for almost all ecosystems; the exception is deep-sea hydrothermal vents (chemical energy)."},{"t":"b","v":"Less than **50% of sunlight is PAR** (photosynthetically active radiation) usable by plants."},{"t":"b","v":"Plants capture only about **2–10% of PAR**, yet this sustains all life."},{"t":"b","v":"Energy flow is **unidirectional** (Sun → producers → consumers → decomposers); it never flows backward."},{"t":"b","v":"The **10% law** states only about 10% of energy passes to the next trophic level; ~90% is lost as heat."},{"t":"b","v":"Example: 1000 units in plants → **100 in herbivores → 10 in carnivores**. **Energy flow & 10% law in an ecosystem**"}]},{"h":"Ecological Pyramids","pts":[{"t":"b","v":"An **ecological pyramid** shows the relationship between trophic levels by number, biomass or energy."},{"t":"b","v":"The **pyramid of energy is always upright** because energy decreases at every higher level."},{"t":"b","v":"The **pyramid of numbers** can be inverted, e.g. one big tree supporting many insects."},{"t":"b","v":"The **pyramid of biomass** is inverted in the sea (small phytoplankton support larger fish)."},{"t":"b","v":"Producers always form the **base** of the pyramid."},{"t":"table","rows":[["Pyramid","Can be inverted?"],["Energy","No – always upright"],["Number","Yes (e.g. tree ecosystem)"],["Biomass","Yes (e.g. aquatic ecosystem)"]],"hdr":true}]},{"h":"Nutrient Cycling (Biogeochemical Cycles)","pts":[{"t":"b","v":"**Nutrient cycling** is the repeated movement of nutrients between living organisms and the environment."},{"t":"b","v":"**Gaseous cycles** (carbon, nitrogen, oxygen) have their main reservoir in the atmosphere."},{"t":"b","v":"**Sedimentary cycles** (phosphorus, sulphur) have their reservoir in rocks and soil."},{"t":"b","v":"In the **nitrogen cycle**, bacteria fix atmospheric N2 into usable forms; legumes host Rhizobium."},{"t":"b","v":"In the **carbon cycle**, photosynthesis removes CO2 and respiration/burning returns it."},{"t":"b","v":"**Decomposers** are essential – they release locked nutrients back into the soil."},{"t":"table","rows":[["Cycle type","Main reservoir","Example"],["Gaseous","Atmosphere","Carbon, nitrogen"],["Sedimentary","Earth's crust / soil","Phosphorus, sulphur"]],"hdr":true},{"t":"note","v":"**Phosphorus cycle – a sedimentary cycle whose reservoir is rock; weathering releases it into soil, plants take it up, litter and decomposition return it.**"}]},{"h":"Biodiversity & Its Levels","pts":[{"t":"b","v":"**Biodiversity** is the variety of all life forms – genes, species and ecosystems on Earth."},{"t":"b","v":"**Genetic diversity** is variation within a species (e.g. many rice varieties)."},{"t":"b","v":"**Species diversity** is the number of different species in an area."},{"t":"b","v":"**Ecosystem diversity** is the variety of habitats like forests, wetlands and deserts."},{"t":"b","v":"Biodiversity is **highest near the equator** (tropical rainforests) and falls toward the poles."},{"t":"b","v":"Maximum species of **butterflies and other groups occur in the tropics** due to stable warm climate."},{"t":"table","rows":[["Level","Meaning"],["Genetic","Variation within a species"],["Species","Number of species in an area"],["Ecosystem","Variety of habitats"]],"hdr":true}]},{"h":"Symbiosis & Species Interactions","pts":[{"t":"b","v":"A **lichen** is a partnership of an alga and a fungus – the alga makes food, the fungus gives shelter."},{"t":"b","v":"This algae-fungus relationship is called **symbiosis (mutualism)**, benefiting both."},{"t":"b","v":"Lichens are excellent **indicators of air pollution** and do not grow in polluted areas."},{"t":"b","v":"**Mutualism** benefits both; **commensalism** benefits one with no harm to the other."},{"t":"b","v":"**Parasitism** benefits one and harms the host; **predation** is one species eating another."},{"t":"b","v":"**Competition** occurs when species fight for the same limited resource."},{"t":"table","rows":[["Interaction","Species A","Species B"],["Mutualism","Benefit","Benefit"],["Commensalism","Benefit","No effect"],["Parasitism","Benefit","Harm"],["Predation","Benefit","Harm"],["Competition","Harm","Harm"]],"hdr":true}]},{"h":"Pollution, Bioaccumulation & Indicators","pts":[{"t":"b","v":"**DDT** is a non-biodegradable chlorinated insecticide (pesticide) that persists in the environment."},{"t":"b","v":"**Biomagnification** is the increasing concentration of toxins like DDT up the food chain."},{"t":"b","v":"The vulture population in India collapsed mainly due to the drug **diclofenac** in cattle carcasses."},{"t":"b","v":"**Ozone** in the stratosphere protects the biosphere from harmful **ultraviolet (UV) radiation**."},{"t":"b","v":"**Lichens** serve as biological indicators of clean air."},{"t":"b","v":"**Ecological succession** is the orderly change of a community over time toward a stable climax. **Pollution, Bioaccumulation & Indicators**"}]},{"h":"Conservation & Endangered Species","pts":[{"t":"b","v":"**In-situ conservation** protects species in their natural home – national parks, sanctuaries, biosphere reserves."},{"t":"b","v":"**Ex-situ conservation** protects species outside their habitat – zoos, botanical gardens, seed banks."},{"t":"b","v":"The **IUCN Red List** classifies species by extinction risk."},{"t":"b","v":"The **Gangetic river dolphin** is listed as Endangered and is India's National Aquatic Animal."},{"t":"b","v":"**Biodiversity hotspots** are species-rich, highly threatened regions (e.g. Western Ghats, Himalaya)."},{"t":"b","v":"A **keystone species** has a large effect on its ecosystem relative to its numbers."},{"t":"table","rows":[["Type","Where","Example"],["In-situ","Natural habitat","National park, sanctuary"],["Ex-situ","Off-site","Zoo, seed bank"]],"hdr":true}]}]},{"t":"Biology in Everyday Life & Applied Biology","S":[{"h":"Microbes – The Big Idea","pts":[{"t":"b","v":"A **microbe (micro-organism)** is a tiny living thing seen only under a microscope."},{"t":"b","v":"Main groups are **bacteria, fungi, yeast and protozoa**."},{"t":"b","v":"The key lesson: **not all microbes are harmful** – most are useful."},{"t":"b","v":"Useful microbes make **curd, bread, antibiotics and biogas**."},{"t":"b","v":"Harmful microbes cause disease and are called **pathogens**."},{"t":"b","v":"Microbes are nature's **decomposers**, recycling dead matter into soil nutrients."}]},{"h":"Fermentation","pts":[{"t":"b","v":"**Fermentation** is microbes breaking down sugars without enough oxygen."},{"t":"b","v":"It produces simpler substances like **alcohol or acid** and releases gas (often CO2)."},{"t":"b","v":"The spongy texture of idli, dosa and bread comes from trapped **CO2 gas**."},{"t":"b","v":"**Yeast** ferments sugars into **ethanol (alcohol) and CO2**."},{"t":"b","v":"Yeast reproduces by **budding** – a small bud grows out and breaks off as a new cell."},{"t":"b","v":"**Lactobacillus** ferments milk into curd and adds **vitamin B12**."}]},{"h":"Common Fermented Products & Microbes","pts":[{"t":"b","v":"Match each food with the microbe that makes it – a favourite exam trap."},{"t":"b","v":"**Baker's yeast and brewer's yeast** are the same species, Saccharomyces cerevisiae."},{"t":"b","v":"Swiss cheese holes are **CO2 bubbles** made by Propionibacterium."},{"t":"b","v":"Roquefort cheese gets its flavour from a **fungus** grown on it."},{"t":"table","rows":[["Product","Microbe used"],["Curd","Lactobacillus (bacteria)"],["Bread","Saccharomyces cerevisiae (yeast)"],["Ethanol / wine / beer","Saccharomyces cerevisiae"],["Toddy","Yeast (fermented palm sap)"],["Swiss cheese","Propionibacterium"],["Roquefort cheese","Fungus (Penicillium)"]],"hdr":true}]},{"h":"Alcoholic Drinks – Distilled vs Not","pts":[{"t":"b","v":"All alcoholic drinks begin with **fermentation** of sugars."},{"t":"b","v":"**Wine and beer** are made WITHOUT distillation."},{"t":"b","v":"**Whisky, brandy and rum** are made WITH distillation of the fermented liquid."},{"t":"b","v":"Distillation increases the **alcohol concentration**."},{"t":"table","rows":[["Drink","Distilled?"],["Wine, Beer","No"],["Whisky, Brandy, Rum","Yes"]],"hdr":true}]},{"h":"Antibiotics – Medicines from Microbes","pts":[{"t":"b","v":"An **antibiotic** is a chemical made by microbes that kills or stops other microbes."},{"t":"b","v":"Fleming named it after the mould **Penicillium notatum**."},{"t":"b","v":"**Chain and Florey** developed it into a medicine; the three shared the 1945 Nobel Prize."},{"t":"b","v":"Antibiotics cured once-deadly diseases like **plague, diphtheria, whooping cough and leprosy**."},{"t":"b","v":"Crucial point: antibiotics work on **bacteria and fungi, NOT viruses** – so they cannot cure cold or flu."},{"t":"table","rows":[["Antibiotic","Microbial source"],["Penicillin","Penicillium (fungus)"],["Streptomycin","Streptomyces (bacteria)"],["Tetracycline","Streptomyces"],["A. Fleming","Penicillin was the first antibiotic, discovered accidentally by Alexander Fleming in 1928."]],"hdr":true}]},{"h":"Drugs & Products from Plants","pts":[{"t":"b","v":"Many drugs come straight from plants – exams test **which plant part** gives the drug."},{"t":"b","v":"**Quinine**, the anti-malaria drug, comes from the **stem bark of Cinchona** tree."},{"t":"b","v":"Quinine works by attacking the **malaria parasite inside red blood cells**."},{"t":"b","v":"**Tulsi** has medicinal value due to **eugenol** (an essential oil)."},{"t":"b","v":"**Turmeric** powder comes from the **rhizome (underground stem)**; its compound is curcumin."},{"t":"b","v":"Pungency (hotness) of chillies is due to **capsaicin**."},{"t":"table","rows":[["Product","Plant","Part used"],["Quinine","Cinchona","Stem bark"],["Opium","Poppy","Latex of fruit"],["Hing (Asafoetida)","Ferula","Root"],["Rubber","Hevea","Latex (bark)"],["Turmeric","Curcuma","Rhizome (stem)"],["Ginger","Zingiber","Rhizome (stem)"]],"hdr":true}]},{"h":"Vaccines & Immunisation","pts":[{"t":"b","v":"A **vaccine** is weakened or killed germs (or their proteins) put into the body to train immunity."},{"t":"b","v":"It works like a **practice fight** – the body learns the germ and builds memory."},{"t":"b","v":"Vaccination makes **memory B-cells and T-cells** plus protective **antibodies**."},{"t":"b","v":"**Smallpox** has been completely eradicated by vaccination."},{"t":"b","v":"Polio, diphtheria, pneumonia and tetanus are **largely controlled**."},{"t":"b","v":"For fast poisons (tetanus, snakebite) ready-made antibodies called **antitoxin** are injected directly."},{"t":"b","v":"The **Hepatitis B vaccine** is a recombinant DNA vaccine made in yeast. **Vaccines & Immunisation**"}]},{"h":"Biotechnology","pts":[{"t":"b","v":"**Biotechnology** uses living organisms or their enzymes to make useful products."},{"t":"b","v":"Broadly, even making **curd, bread and wine** is biotechnology."},{"t":"b","v":"Modern usage means using **genetically modified (GM)** organisms by changing their genes."},{"t":"b","v":"Examples: **test-tube baby (IVF)**, DNA vaccines, and gene therapy."},{"t":"b","v":"**Gene therapy** means correcting a defective gene."},{"t":"b","v":"**GM crops** give higher yield, resist pests, tolerate drought/salt and improve nutrition."},{"t":"b","v":"Pest-resistant crops need less spraying, so they **reduce chemical pesticide use**."}]},{"h":"Microbes in Sewage, Biogas & Biocontrol","pts":[{"t":"b","v":"Microbes are nature's **cleaners and recyclers** of waste."},{"t":"b","v":"In **sewage treatment**, bacteria break down organic matter in dirty water."},{"t":"b","v":"**Biogas** is produced when bacteria decompose waste without oxygen (anaerobic)."},{"t":"b","v":"The main gas in biogas is **methane (CH4)**; the methane producers are methanogens."},{"t":"b","v":"**Gobar gas** uses cow dung as the raw material for biogas."},{"t":"b","v":"**Biofertilisers** (like Rhizobium, blue-green algae) naturally enrich soil with nitrogen."},{"t":"b","v":"**Biocontrol** uses living organisms instead of chemicals to control pests."}]},{"h":"Biodegradable Waste & Vermiculture","pts":[{"t":"b","v":"**Biodegradable waste** is matter that microbes can break down naturally."},{"t":"b","v":"Microbes convert biodegradable waste into **useful compost / manure**."},{"t":"b","v":"**Vermiculture** is rearing earthworms to convert organic waste into compost."},{"t":"b","v":"The product of vermiculture is **vermicompost**, a rich natural fertiliser."},{"t":"b","v":"**Non-biodegradable** wastes like plastic do not decay and cause pollution. **Biodegradable Waste & Vermiculture**"}]},{"h":"Marine & Other Useful Organisms","pts":[{"t":"b","v":"**Seaweeds (marine algae)** are an important source of **iodine and agar**."},{"t":"b","v":"Seaweeds also yield **algin and carrageenan**, used as food thickeners."},{"t":"b","v":"Light emitted by some marine animals and insects in darkness is **bioluminescence**."},{"t":"b","v":"Bioluminescence is produced by the enzyme **luciferase** acting on luciferin."},{"t":"b","v":"The painkiller **diclofenac** given to cattle nearly wiped out India's **vultures**."}]},{"h":"Everyday Body & Plant Facts","pts":[{"t":"b","v":"**Blood groups** A, B, AB and O are favourite exam topics."},{"t":"b","v":"**O group** is the universal donor; **AB group** is the universal recipient."},{"t":"b","v":"**Hormones** are chemical messengers controlling body functions (e.g. insulin, adrenaline)."},{"t":"b","v":"A **true fruit** develops only from the ovary; a **false fruit** includes other parts (e.g. apple)."},{"t":"b","v":"**Stems** grow above ground; some, like potato and ginger, are **underground stems**."},{"t":"b","v":"Distinguishing **true vs false fruit** and stem vs root is a common BPSC question."},{"t":"table","rows":[["Feature","True fruit","False fruit"],["Develops from","Ovary only","Ovary + other parts"],["Example","Mango","Apple, Pear"]],"hdr":true}]}]},{"t":"Inventions, Discoveries & Scientists","S":[{"h":"Discovery vs Invention","pts":[{"t":"b","v":"A **discovery** means finding something that already existed in nature but was unknown before."},{"t":"b","v":"An **invention** means creating something brand-new that nature never made, built by human effort."},{"t":"b","v":"You **discover facts of nature** – bacteria, the cell, gravity, oxygen, X-rays."},{"t":"b","v":"You **invent machines or tools** – telephone, bulb, aeroplane, steam engine."},{"t":"b","v":"Memory trick: if the answer is a **natural fact it is a discovery**; if it is a man-made device it is an invention."},{"t":"b","v":"The exam loves to test this difference, so fix it firmly first."}]},{"h":"Pioneers of Biology & Microbiology","pts":[{"t":"b","v":"Darwin's idea is **natural selection** – \"survival of the fittest\"; best-suited organisms survive and pass on traits."},{"t":"b","v":"Easy split: **Leeuwenhoek = bacteria, Hooke = cell**."},{"t":"b","v":"**Gregor Mendel**, \"Father of Genetics\", found the laws of inheritance using **pea plants**."},{"t":"table","rows":[["Charles Darwin","Charles Darwin wrote On the Origin of Species (1859) and gave the theory of evolution."],["Gregor Carl Linnaeus Mendel","Common trap: Origin of Species is Darwin, NOT Lamarck, Linnaeus or Mendel."],["Robert Hooke","Robert Hooke discovered the cell by seeing box-like rooms in thin cork."],["Robert Koch","Traps for the Jenner question: Koch, Lister and Metchnikoff are common wrong options."]],"hdr":false}]},{"h":"Landmarks in Medicine","pts":[{"t":"b","v":"Word \"vaccine\" comes from **vacca** (Latin for cow), after Jenner's cowpox method."},{"t":"b","v":"**Arthur Kornberg** first made **DNA in a test tube (in vitro, 1956)** by discovering DNA polymerase; Nobel 1959."},{"t":"b","v":"**In vitro** means in glass / test tube; **in vivo** means inside a living body."},{"t":"b","v":"**Christiaan Barnard** did the world's first human **heart transplant (3 Dec 1967)** at Cape Town, South Africa."}]},{"h":"Scientist to Key Contribution (Medicine)","pts":[{"t":"b","v":"Memorise each name beside its single defining contribution; the exam swaps them as distractors."},{"t":"table","rows":[["Scientist","Key Contribution"],["Edward Jenner","First vaccine (smallpox); Father of Immunology"],["Alexander Fleming","Discovered penicillin (first antibiotic)"],["Louis Pasteur","Germ theory of disease; pasteurisation"],["Robert Koch","Proved specific germs cause TB and cholera"],["Joseph Lister","Father of Antiseptic Surgery"],["Elie Metchnikoff","Discovered phagocytes (germ-eating cells)"],["Casimir Funk","Coined \"vitamine\"; discovered vitamins"]],"hdr":true}]},{"h":"Discovery of DNA Structure","pts":[{"t":"b","v":"DNA is shaped like a **twisted ladder (double helix)** of two strands."},{"t":"b","v":"Watson, Crick and Wilkins shared the **Nobel Prize (1962)** for this work."},{"t":"b","v":"**Arthur Kornberg** made DNA in a test tube – do not confuse with discovering its structure."},{"t":"table","rows":[["James Francis Crick Watson","James Watson and Francis Crick discovered the DNA double helix structure (1953)."],["Rosalind Franklin","They built on the X-ray images taken by Rosalind Franklin and Maurice Wilkins."]],"hdr":true},{"t":"note","v":"**DNA double helix structure**"}]},{"h":"Famous Inventions & Their Inventors","pts":[{"t":"b","v":"The **Wright Brothers** (Orville & Wilbur) built and flew the first powered **aeroplane (1903)** at Kitty Hawk, USA."},{"t":"b","v":"Traps for the aeroplane: **James Watt only improved the steam engine**; Davy made the safety lamp; von Braun built rockets."},{"t":"b","v":"A single inventor is usually the answer for everyday machines."},{"t":"table","rows":[["Invention","Inventor"],["Aeroplane","Wright Brothers (1903)"],["Electric bulb","Thomas Edison"],["Telephone","Alexander Graham Bell"],["Radio / wireless","Guglielmo Marconi"],["Television","J. L. Baird"],["Miners' safety lamp","Humphry Davy"],["W. Röntgen","Wilhelm Rontgen discovered X-rays – a discovery, not an invention."]],"hdr":true}]},{"h":"Rays & Waves Used in Medicine","pts":[{"t":"b","v":"Key idea: tell apart **safe sound waves** from **harmful radiation**."},{"t":"b","v":"**Ultrasonic waves (ultrasound)** are sound above **20,000 Hz**, beyond human hearing, and are safe."},{"t":"b","v":"Ultrasound watches a growing **fetus in the womb** and scans soft organs like liver and kidney."},{"t":"b","v":"**X-rays are high-energy radiation**, not sound; they pass through flesh but are blocked by bone."},{"t":"b","v":"X-rays clearly show **bones, teeth and fractures**."},{"t":"b","v":"X-rays can harm a developing baby, so they are **avoided in pregnancy** – hence ultrasound is used instead."},{"t":"table","rows":[["Ray / Wave","Nature","Main Medical Use"],["Ultrasound","Safe sound (>20,000 Hz)","Scanning fetus, soft organs"],["X-rays","Harmful radiation","Imaging bones, fractures, teeth"]],"hdr":true}]},{"h":"How Vaccines Work","pts":[{"t":"b","v":"A **vaccine** is a harmless dose – a dead, weakened or partial germ – given so the body learns to fight the real disease later."},{"t":"b","v":"The body responds by making **antibodies** and memory cells against that germ."},{"t":"b","v":"When the real germ attacks later, the body fights it off quickly; this is **immunity**."},{"t":"b","v":"Vaccines protect against diseases like **smallpox, polio, measles and COVID-19**."},{"t":"b","v":"Smallpox is the first disease ever **eradicated by vaccination**. **How Vaccines Work**"}]},{"h":"COVID-19 Vaccines (India & World)","pts":[{"t":"b","v":"COVID-19 is caused by the **SARS-CoV-2** coronavirus; the disease began spreading in 2019-2020."},{"t":"b","v":"**Covaxin** is India's first indigenous vaccine, made by **Bharat Biotech with ICMR** (inactivated virus type)."},{"t":"b","v":"**Covishield** is the Oxford-AstraZeneca vaccine made in India by the **Serum Institute of India (SII)**."},{"t":"b","v":"**Pfizer-BioNTech and Moderna** are **mRNA vaccines** used worldwide."},{"t":"b","v":"Sputnik V is the Russian COVID vaccine; **India's first dose was given on 16 January 2021**."},{"t":"table","rows":[["Vaccine","Maker","Type"],["Covaxin","Bharat Biotech + ICMR","Inactivated virus"],["Covishield","Serum Institute (Oxford-AZ)","Viral vector"],["Pfizer / Moderna","Pfizer-BioNTech / Moderna","mRNA"],["Sputnik V","Gamaleya, Russia","Viral vector"]],"hdr":true}]},{"h":"Vitamins, Penicillin & Other Quick Facts","pts":[{"t":"b","v":"**Casimir Funk** coined the term **\"vitamine\"** (1912) and is credited with discovering vitamins."},{"t":"b","v":"**Karl Landsteiner** discovered the **ABO blood groups**."},{"t":"b","v":"**Hargobind Khorana**, an Indian-American, helped decode the **genetic code** (Nobel 1968)."},{"t":"table","rows":[["A. Fleming","Alexander Fleming discovered penicillin (1928), the first antibiotic, from a mould."],["Ronald Ross","Ronald Ross discovered that mosquitoes spread malaria; Nobel Prize 1902."]],"hdr":false}]}]}]};
const CH = DATA.chapters;
CH.forEach((c,ci)=> c.S.forEach((s,si)=>{ s.id = ci+'/'+si; s.ci = ci; }));
const ALLSEC = CH.flatMap(c=>c.S);

const KEY='bio-notes-v1';
const def={known:{},star:{},chap:0,mode:'read',set:'all',theme:'light',pos:0};
let S=load();
function load(){ try{ return Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ return {...def}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md =s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const $  =id=>document.getElementById(id);

/* caption-style 2-col tables read better as notes than as a grid */
function isCaption(p){
  return p.t==='table' && !p.hdr && p.rows.every(r=>r.length===2 && r[1].length>45);
}
function ptHTML(p){
  if(p.t==='table'){
    if(isCaption(p)) return p.rows.map(r=>`<li class="note"><strong>${md(r[0])}</strong> — ${md(r[1])}</li>`).join('');
    const n=Math.max(...p.rows.map(r=>r.length));
    const pad=r=>r.concat(Array(n-r.length).fill(''));
    const [h,...b] = p.hdr ? [p.rows[0],...p.rows.slice(1)] : [null,...p.rows];
    return `<li class="tbl"><div class="tw"><table>
      ${h?`<thead><tr>${pad(h).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead>`:''}
      <tbody>${b.map(r=>`<tr>${pad(r).map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></li>`;
  }
  if(p.t==='note') return `<li class="note">${md(p.v)}</li>`;
  return `<li>${md(p.v)}</li>`;
}

/* ---------- rail ---------- */
function rail(){
  $('rail').innerHTML = `<p class="railh">Chapters</p>` + CH.map((c,i)=>{
    const k=c.S.filter(s=>S.known[s.id]).length;
    const d = k===0?'' : k===c.S.length?'full':'part';
    return `<button class="ch ${S.chap===i&&!searching()?'on':''}" data-c="${i}">
      <span class="dot ${d}"></span><span class="nm">${esc(c.t)}</span><span class="ct">${k}/${c.S.length}</span></button>`;
  }).join('');
  $('rail').querySelectorAll('[data-c]').forEach(b=> b.onclick=()=>{
    S.chap=+b.dataset.c; S.pos=0; $('q').value=''; save(); draw();
    if(innerWidth<=860){ $('rail').classList.remove('open'); $('bRail').classList.remove('on'); }
    scrollTo({top:0,behavior:'smooth'});
  });
}

/* ---------- study set ---------- */
function studySet(){
  let p = ALLSEC;
  if(S.set==='chapter') p = CH[S.chap].S;
  else if(S.set==='starred') p = ALLSEC.filter(s=>S.star[s.id]);
  else if(S.set==='review')  p = ALLSEC.filter(s=>!S.known[s.id]);
  return p;
}
const searching = ()=> $('q').value.trim().length>1;

/* ---------- read mode ---------- */
function drawRead(){
  const c=CH[S.chap];
  const known=c.S.filter(s=>S.known[s.id]).length;
  const nb=c.S.reduce((a,s)=>a+s.pts.filter(p=>p.t!=='table'||isCaption(p)).length,0);
  const nt=c.S.reduce((a,s)=>a+s.pts.filter(p=>p.t==='table'&&!isCaption(p)).length,0);
  $('content').innerHTML = `
    <h1 class="chaptitle">${esc(c.t)}</h1>
    <p class="chapmeta">${c.S.length} sections · ${nb} points${nt?` · ${nt} tables`:''} · ${known} marked known</p>
    ${c.S.map((s,i)=>`
      <section class="sec ${s.quick?'quick':''}" id="sec${i}">
        <div class="sech">
          <h3>${esc(s.h)}</h3>
          <button class="mark ${S.star[s.id]?'on':''}" data-star="${s.id}" title="Star">${S.star[s.id]?'★':'☆'}</button>
          <button class="tick ${S.known[s.id]?'on':''}" data-known="${s.id}" title="Mark known">✓</button>
        </div>
        <ul class="pts">${s.pts.map(ptHTML).join('')}</ul>
      </section>`).join('')}
    <div class="navrow">
      <button class="nb" id="pv" ${S.chap===0?'disabled':''}>← ${S.chap>0?esc(CH[S.chap-1].t.slice(0,26)):''}</button>
      <button class="nb" id="nx" ${S.chap===CH.length-1?'disabled':''}>${S.chap<CH.length-1?esc(CH[S.chap+1].t.slice(0,26)):''} →</button>
    </div>`;
  bindToggles();
  const pv=$('pv'), nx=$('nx');
  if(pv) pv.onclick=()=>{ S.chap--; save(); draw(); scrollTo({top:0}); };
  if(nx) nx.onclick=()=>{ S.chap++; save(); draw(); scrollTo({top:0}); };
}

function bindToggles(){
  document.querySelectorAll('[data-star]').forEach(b=> b.onclick=()=>{
    const id=b.dataset.star; S.star[id]=!S.star[id]; save();
    b.classList.toggle('on',!!S.star[id]); b.textContent=S.star[id]?'★':'☆';
  });
  document.querySelectorAll('[data-known]').forEach(b=> b.onclick=()=>{
    const id=b.dataset.known; S.known[id]=!S.known[id]; save();
    b.classList.toggle('on',!!S.known[id]); rail();
  });
}

/* ---------- recall mode ---------- */
let revealed=false;
function drawRecall(){
  const p=studySet();
  const sets=[['all','Everything'],['chapter','This chapter'],['review','Not yet known'],['starred','Starred']];
  const bar=`<div class="toolbar">${sets.map(([v,l])=>{
      const n = v==='all'?ALLSEC.length : v==='chapter'?CH[S.chap].S.length
              : v==='review'?ALLSEC.filter(s=>!S.known[s.id]).length
              : ALLSEC.filter(s=>S.star[s.id]).length;
      return `<button class="chip ${S.set===v?'on':''}" data-set="${v}">${l}<b>${n}</b></button>`;
    }).join('')}<button class="nb" id="shuf" style="margin-left:auto">Shuffle</button></div>`;

  if(!p.length){
    $('content').innerHTML = bar + `<div class="empty"><p>${
      S.set==='starred' ? 'No starred sections yet. Star one in Read mode to build a set.'
      : S.set==='review' ? 'Everything is marked known. Solid.'
      : 'Nothing in this set.'}</p></div>`;
    bindSets(); return;
  }
  if(S.pos>=p.length) S.pos=0;
  const s=p[S.pos];
  $('content').innerHTML = bar + `
    <div class="card">
      <div class="cardtop">
        <span class="pill">${esc(CH[s.ci].t)}</span>
        <button class="mark ${S.star[s.id]?'on':''}" data-star="${s.id}">${S.star[s.id]?'★':'☆'}</button>
        <span class="cardcount">${S.pos+1} / ${p.length}</span>
      </div>
      <h2 class="prompt">${esc(s.h)}</h2>
      <p class="promptsub">${s.pts.length} point${s.pts.length>1?'s':''} — recall what you can, then check</p>
      ${revealed
        ? `<div class="body"><ul class="pts">${s.pts.map(ptHTML).join('')}</ul></div>
           <div class="rate">
             <button class="rb again" id="again">Needs review</button>
             <button class="rb know" id="know">I knew this</button>
           </div>`
        : `<div class="hidden"><button class="revealbtn" id="rev">Show the points</button></div>`}
    </div>
    <div class="navrow">
      <button class="nb" id="pv" ${S.pos===0?'disabled':''}>Previous</button>
      <button class="nb" id="nx">Skip</button>
      <span class="keyhint">space reveal · 1 review · 2 known · ← → move</span>
    </div>`;
  bindSets(); bindToggles();
  const rev=$('rev'); if(rev) rev.onclick=()=>{ revealed=true; drawRecall(); };
  const kn=$('know'); if(kn) kn.onclick=()=>{ S.known[s.id]=true; save(); rail(); next(); };
  const ag=$('again'); if(ag) ag.onclick=()=>{ S.known[s.id]=false; save(); rail(); next(); };
  $('pv').onclick=()=>{ S.pos=Math.max(0,S.pos-1); revealed=false; save(); drawRecall(); };
  $('nx').onclick=next;
  $('shuf').onclick=()=>{
    const arr=studySet();
    for(let i=arr.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [arr[i],arr[j]]=[arr[j],arr[i]]; }
    S.pos=0; revealed=false; save(); drawRecall();
  };
}
function next(){ const p=studySet(); S.pos=(S.pos+1)%Math.max(1,p.length); revealed=false; save(); drawRecall(); }
function bindSets(){
  document.querySelectorAll('[data-set]').forEach(b=> b.onclick=()=>{
    S.set=b.dataset.set; S.pos=0; revealed=false; save(); drawRecall();
  });
}

/* ---------- search ---------- */
function drawSearch(term){
  const t=term.toLowerCase();
  const rx=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  const hi=h=>h.replace(rx,'<mark>$1</mark>');
  const hits=[];
  CH.forEach((c,ci)=> c.S.forEach((s,si)=>{
    const inH = s.h.toLowerCase().includes(t);
    const pts = s.pts.filter(p=>{
      const txt = p.t==='table' ? p.rows.flat().join(' ') : p.v;
      return txt.toLowerCase().includes(t);
    });
    if(inH||pts.length) hits.push({c,ci,si,s,pts,inH});
  }));
  $('content').innerHTML = `
    <h1 class="chaptitle">${hits.length} result${hits.length===1?'':'s'}</h1>
    <p class="chapmeta">Searching all 19 chapters for “${esc(term)}”</p>
    ${hits.length? hits.map(h=>`
      <div class="hit">
        <div class="hitch">${esc(h.c.t)}</div>
        <div class="hith" data-go="${h.ci}/${h.si}">${hi(esc(h.s.h))}</div>
        ${h.pts.slice(0,3).map(p=>{
          const txt = p.t==='table' ? p.rows.filter(r=>r.join(' ').toLowerCase().includes(t)).map(r=>r.join(' — ')).join('; ') : p.v;
          return `<div class="hitp">${hi(md(txt))}</div>`;
        }).join('')}
        ${h.pts.length>3?`<div class="hitp" style="border:0;color:var(--faint);font-size:.8rem">+${h.pts.length-3} more in this section</div>`:''}
      </div>`).join('')
      : `<div class="empty"><p>Nothing matches “${esc(term)}”.</p></div>`}`;
  document.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=>{
    const [ci,si]=b.dataset.go.split('/').map(Number);
    S.chap=ci; S.mode='read'; $('q').value=''; save(); setMode('read');
    requestAnimationFrame(()=> $('sec'+si)?.scrollIntoView({block:'start',behavior:'smooth'}));
  });
}

/* ---------- routing ---------- */
function draw(){
  const term=$('q').value.trim();
  if(term.length>1){ drawSearch(term); rail(); return; }
  if(S.mode==='recall') drawRecall(); else drawRead();
  rail();
}
function setMode(m){
  S.mode=m; revealed=false; save();
  $('mRead').classList.toggle('on',m==='read');
  $('mRecall').classList.toggle('on',m==='recall');
  draw();
}
$('mRead').onclick=()=>setMode('read');
$('mRecall').onclick=()=>setMode('recall');
$('bRail').onclick=()=>{ $('rail').classList.toggle('open'); $('bRail').classList.toggle('on',$('rail').classList.contains('open')); };
$('bTheme').onclick=()=>{ S.theme=S.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=S.theme; save(); };
let td; $('q').oninput=()=>{ clearTimeout(td); td=setTimeout(draw,140); };

addEventListener('keydown',e=>{
  if(e.target===$('q')){ if(e.key==='Escape'){ $('q').value=''; draw(); $('q').blur(); } return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('q').focus(); return; }
  if(e.key==='d'){ $('bTheme').click(); return; }
  if(S.mode!=='recall'||searching()) return;
  if(e.key===' '){ e.preventDefault(); if(!revealed){ revealed=true; drawRecall(); } }
  else if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); S.pos=Math.max(0,S.pos-1); revealed=false; save(); drawRecall(); }
  else if(e.key==='1'&&revealed){ $('again')?.click(); }
  else if(e.key==='2'&&revealed){ $('know')?.click(); }
});

document.documentElement.dataset.theme=S.theme;
setMode(S.mode);
</script>

<script>
(() => {
  const topin = document.querySelector('.topin');
  if (topin && !document.getElementById('flashHomeBtn')) {
    const btn = document.createElement('a');
    btn.id = 'flashHomeBtn';
    btn.href = 'index.html';
    btn.style.cssText = 'display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:.82rem;font-weight:600;text-decoration:none;flex:none;margin-right:4px;';
    btn.textContent = '← Home';
    topin.prepend(btn);
  }
})();
</script>
