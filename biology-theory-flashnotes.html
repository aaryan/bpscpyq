n an **open system**, blood leaves vessels and bathes organs directly in spaces called **haemocoel**."},{"t":"b","v":"The fluid in an open system is **haemolymph**; flow is slow and pressure is low."},{"t":"b","v":"Open systems are seen in **cockroaches and most insects**; the cockroach heart has side-holes called **ostia**."},{"t":"b","v":"In a **closed system**, blood always stays inside vessels, so flow is fast and pressure stays high."},{"t":"b","v":"All **vertebrates** and a few invertebrates (like the earthworm) have closed circulation."},{"t":"b","v":"In the **earthworm**, haemoglobin is dissolved in plasma and its blood cells are phagocytic."},{"t":"table","rows":[["Feature","Open","Closed"],["Blood stays in vessels","No","Yes"],["Fluid name","Haemolymph","Blood"],["Pressure / speed","Low / slow","High / fast"],["Example","Cockroach","Earthworm, vertebrates"]],"hdr":true}]},{"h":"Heart Chambers Across Animals","pts":[{"t":"b","v":"An **atrium** receives blood returning to the heart; a **ventricle** pumps blood out."},{"t":"b","v":"Fishes have a **2-chambered heart** with **single circulation** (blood passes the heart once)."},{"t":"b","v":"Amphibians and most reptiles have a **3-chambered heart**, causing partial mixing of blood."},{"t":"b","v":"The frog heart is wrapped in a **pericardium** and frogs have a well-developed lymphatic system."},{"t":"b","v":"Crocodiles, birds and mammals have a **4-chambered heart**, so blood never mixes."},{"t":"b","v":"The **crocodile** is the famous reptile exception with 4 chambers."},{"t":"table","rows":[["Animal","Chambers","Circulation"],["Fish","2","Single"],["Amphibian / most reptiles","3","Incomplete double"],["Crocodile","4","Double"],["Bird / mammal","4","Double"]],"hdr":true}]},{"h":"Structure of the Human Heart","pts":[{"t":"b","v":"The human heart is a **fist-sized muscular pump** lying in the chest, tilted to the left."},{"t":"b","v":"It has **four chambers**: right atrium, right ventricle, left atrium, left ventricle."},{"t":"b","v":"A muscular wall called the **septum** keeps oxygen-rich and oxygen-poor blood from mixing."},{"t":"b","v":"The **right side** handles deoxygenated blood; the **left side** handles oxygenated blood."},{"t":"b","v":"The **left ventricle has the thickest wall** to pump blood around the whole body."},{"t":"b","v":"The heart muscle is **tireless**, contracting and relaxing for life without true rest. **Human heart four chambers**"}]},{"h":"Heart Valves – One-Way Doors","pts":[{"t":"b","v":"**Valves** are one-way doors that snap shut to stop blood flowing backward."},{"t":"b","v":"The **tricuspid valve** lies between the right atrium and right ventricle."},{"t":"b","v":"The **bicuspid (mitral) valve** lies between the left atrium and left ventricle."},{"t":"b","v":"**Semilunar valves** guard the exits into the pulmonary artery and the aorta."},{"t":"b","v":"The familiar **'lub-dub'** heart sounds are the valves snapping shut."},{"t":"table","rows":[["Valve","Location"],["Tricuspid","Right atrium → right ventricle"],["Bicuspid (mitral)","Left atrium → left ventricle"],["Semilunar","Exits to pulmonary artery & aorta"]],"hdr":true}]},{"h":"Heartbeat, Pacemaker & Cardiac Cycle","pts":[{"t":"b","v":"Heart muscle is **auto-excitable** – it generates its own electrical signals."},{"t":"b","v":"The **sino-atrial node (SAN)** in the right atrium is the **pacemaker**, firing 70–75 times/min."},{"t":"b","v":"Contraction is called **systole** and relaxation is called **diastole**."},{"t":"b","v":"One complete heartbeat is a **cardiac cycle**, lasting about **0.8 seconds**."},{"t":"b","v":"An **ECG** records the heart's electrical activity as P, Q, R, S, T waves."},{"t":"b","v":"A doctor listens to heart sounds with a **stethoscope**. **Detailed section of human heart showing chambers, valves, and the conducting system (SAN, AVN, Bundle of His).**"}]},{"h":"Cardiac Output & Key Heart Values","pts":[{"t":"b","v":"**Stroke volume** is the blood pumped per beat by a ventricle, about **70 mL**."},{"t":"b","v":"A healthy heart performs about **72 cardiac cycles per minute**."},{"t":"b","v":"**Cardiac output = stroke volume × heart rate**, roughly **5 litres per minute**."},{"t":"b","v":"An **athlete's cardiac output** is higher because stroke volume and heart rate can rise."},{"t":"b","v":"The body increases output during exercise to meet greater oxygen demand."},{"t":"table","rows":[["Quantity","Normal value"],["Heart rate","~72 beats/min"],["One cardiac cycle","~0.8 sec"],["Stroke volume","~70 mL"],["Cardiac output","~5 L/min"]],"hdr":true}]},{"h":"Double Circulation – Two Loops","pts":[{"t":"b","v":"**Double circulation** means blood passes through the heart **twice** per full body trip."},{"t":"b","v":"The **pulmonary circuit** carries blood from the heart to the lungs and back."},{"t":"b","v":"The **systemic circuit** carries oxygen-rich blood from the heart to the body and back."},{"t":"b","v":"Mammals and birds have complete double circulation due to a 4-chambered heart."},{"t":"b","v":"This keeps oxygenated and deoxygenated blood fully separated for efficient delivery. **Human double circulation (pulmonary vein)**"}]},{"h":"Blood Vessels – Arteries, Veins, Capillaries","pts":[{"t":"b","v":"**Arteries** carry blood away from the heart and have thick, elastic walls."},{"t":"b","v":"**Veins** carry blood back to the heart and have valves to prevent backflow."},{"t":"b","v":"**Capillaries** are the thinnest vessels where exchange of gases and nutrients occurs."},{"t":"b","v":"Most arteries carry oxygenated blood; the **pulmonary artery** is the exception (carries deoxygenated)."},{"t":"b","v":"Most veins carry deoxygenated blood; the **pulmonary vein** is the only vein carrying oxygenated blood."},{"t":"b","v":"In bypass surgery a vein graft (often the saphenous vein) reroutes blood past blocked arteries."},{"t":"table","rows":[["Vessel","Blood direction","Exception"],["Artery","Away from heart","Pulmonary artery (deoxy.)"],["Vein","Toward heart","Pulmonary vein (oxy.)"],["Capillary","Exchange site","–"]],"hdr":true}]},{"h":"Composition of Blood","pts":[{"t":"b","v":"Blood is a fluid connective tissue made of **plasma** plus different blood cells."},{"t":"b","v":"**Plasma** is the liquid part (~55%) carrying water, proteins, salts, nutrients and wastes."},{"t":"b","v":"**Red blood cells (RBCs)** carry oxygen using the pigment haemoglobin."},{"t":"b","v":"**White blood cells (WBCs)** fight infection and provide immunity."},{"t":"b","v":"**Platelets** help blood clot to stop bleeding."},{"t":"b","v":"Total blood volume in a normal adult is about **5 litres**."},{"t":"table","rows":[["Component","Main job"],["Plasma","Liquid transport medium"],["RBC","Carry oxygen (haemoglobin)"],["WBC","Immunity / fight germs"],["Platelet","Blood clotting"]],"hdr":true},{"t":"note","v":"**Composition of blood (plasma and cells)**"}]},{"h":"Haemoglobin & Special Blood Facts","pts":[{"t":"b","v":"**Haemoglobin** is an **iron-containing** red pigment that carries oxygen in blood."},{"t":"b","v":"It gives blood its red colour and does **not** provide immunity (that is the WBCs' role)."},{"t":"b","v":"Some animals (e.g. cockroach, many insects) lack red blood and have **colourless 'white' blood**."},{"t":"b","v":"Animals like the cockroach have **no red blood cells**; their haemolymph carries no haemoglobin."},{"t":"b","v":"In the **earthworm**, haemoglobin is dissolved in plasma rather than packed in cells."},{"t":"b","v":"Low haemoglobin causes **anaemia**, reducing oxygen delivery."}]},{"h":"Blood Groups & Transfusion","pts":[{"t":"b","v":"The **ABO system** gives four blood groups: **A, B, AB and O**."},{"t":"b","v":"Group **O** is the **universal donor**; group **AB** is the **universal acceptor**."},{"t":"b","v":"Blood must match in both **ABO type and Rh factor** for safe transfusion."},{"t":"b","v":"Rh-positive blood has the **Rh antigen**; Rh-negative blood lacks it."},{"t":"b","v":"Mismatched transfusion causes clumping (agglutination) of red cells, which can be fatal."},{"t":"b","v":"The **Cath lab** (catheterization lab) in a hospital is part of the **cardiology** department."},{"t":"table","rows":[["Group","Can donate to","Can receive from"],["O","All groups (universal donor)","O"],["A","A, AB","A, O"],["B","B, AB","B, O"],["AB","AB","All (universal acceptor)"]],"hdr":true},{"t":"note","v":"**ABO blood group compatibility chart**"}]}]},{"t":"Respiratory System","S":[{"h":"What is Respiration?","pts":[{"t":"b","v":"**Respiration** is taking in oxygen to slowly 'burn' food and release the energy locked inside it."},{"t":"b","v":"Inputs and outputs: O ₂ and glucose are used; **CO ₂, water and energy** are released."},{"t":"b","v":"The main fuel broken down is **glucose**; fats and proteins can also be used when needed."},{"t":"b","v":"**CO ₂ is a harmful waste gas** that the body must throw out continuously."},{"t":"b","v":"**Breathing** is only the physical taking in and pushing out of air – the first step of respiration."},{"t":"b","v":"**Respiration is bigger than breathing**: it adds the chemical release of energy inside cells."},{"t":"table","rows":[["Term","Meaning"],["Breathing","Physical exchange of air (in and out)"],["Respiration","Breathing + energy release in cells"]],"hdr":true}]},{"h":"Respiratory Organs in Different Animals","pts":[{"t":"b","v":"The organ used depends on **where the animal lives and how complex its body is**."},{"t":"b","v":"Simplest method is **diffusion** – gases spread from high to low concentration, no special organ needed."},{"t":"b","v":"**Sponges, coelenterates (Hydra), flatworms** exchange gases by diffusion over the whole body surface."},{"t":"b","v":"**Earthworm** breathes through its moist skin – called **cutaneous respiration**."},{"t":"b","v":"**Insects** use a network of air tubes called **tracheal tubes** carrying air to inner tissues."},{"t":"b","v":"**Gills** take dissolved O ₂ from water (fishes); **lungs** are used by land animals."},{"t":"b","v":"The **frog** has lungs but also breathes through its moist skin (only via skin during hibernation)."},{"t":"table","rows":[["Animal / Group","Respiratory organ / method"],["Sponge, Hydra, flatworm","Diffusion over body surface"],["Earthworm","Moist skin (cutaneous)"],["Insects","Tracheal tubes"],["Fishes","Gills (branchial)"],["Frog (amphibian)","Lungs + moist skin"],["Reptiles, birds, mammals","Lungs (pulmonary)"]],"hdr":true},{"t":"note","v":"**Gills – the breathing organs in a fish, used for branchial respiration in water.**"}]},{"h":"Human Respiratory System – Pathway of Air","pts":[{"t":"b","v":"Air route: **Nostrils → Nasal chamber → Pharynx → Larynx → Trachea → Bronchi → Bronchioles → Alveoli**."},{"t":"b","v":"**Nasal chamber** filters dust, warms and moistens the incoming air."},{"t":"b","v":"**Pharynx (throat)** is a common passage for both food and air."},{"t":"b","v":"**Larynx** is the sound box (voice box); the **epiglottis** flap stops food entering the airway."},{"t":"b","v":"**Trachea** (windpipe) divides at the 5th thoracic vertebra into right and left **primary bronchi**."},{"t":"b","v":"Trachea and bronchi are kept open by **incomplete Cshaped cartilage rings** so airways never collapse."},{"t":"b","v":"Each bronchiole ends in millions of thin-walled, bloodrich **alveoli** – the gas-exchange air sacs. **Human Respiratory System – Pathway of Air**"}]},{"h":"Lungs and the Thoracic Chamber","pts":[{"t":"b","v":"The branching bronchi, bronchioles and alveoli make up the two pink, elastic **lungs**."},{"t":"b","v":"Each lung is wrapped in a double-layered membrane called the **pleura**."},{"t":"b","v":"**Pleural fluid** between the layers reduces friction as the lungs move."},{"t":"b","v":"Lungs sit in an air-tight **thoracic chamber (chest cavity)**."},{"t":"b","v":"Boundaries: **vertebral column** at back, **sternum** in front, **ribs** at sides, **diaphragm** below."},{"t":"b","v":"The dome-shaped **diaphragm** is the main driver (muscle) of breathing."},{"t":"table","rows":[["Part","Function"],["Nasal chamber","Filter, warm, moisten air"],["Pharynx","Common food + air passage"],["Larynx","Sound production (voice box)"],["Epiglottis","Covers glottis during swallowing"],["Trachea / bronchi","Carry air; held open by cartilage"],["Alveoli","Site of gas exchange"],["Diaphragm","Main breathing muscle"]],"hdr":true}]},{"h":"Mechanism of Breathing","pts":[{"t":"b","v":"The chest works like a **bellows**: make space bigger and air rushes in, smaller and air is pushed out."},{"t":"b","v":"Two stages: **inspiration (inhalation)** draws air in, **expiration (exhalation)** pushes air out."},{"t":"b","v":"We cannot squeeze lungs directly, so we **change the chest volume** and the lungs follow."},{"t":"b","v":"Air always flows from **high pressure to low pressure**; lung pressure is the **intra-pulmonary pressure**."},{"t":"b","v":"Muscles used: the **diaphragm** and the **external and internal intercostal** muscles between ribs."},{"t":"b","v":"**Inspiration:** diaphragm flattens, ribs lift, chest volume rises, lung pressure falls below atmospheric."},{"t":"b","v":"**Expiration:** muscles relax, ribs fall, chest volume shrinks, lung pressure rises above atmospheric."},{"t":"table","rows":[["Feature","Inspiration","Expiration"],["Diaphragm","Contracts, flattens","Relaxes, domes up"],["Ribs / sternum","Move up and out","Move down and in"],["Chest volume","Increases","Decreases"],["Lung pressure","Below atmospheric","Above atmospheric"],["Air movement","Air rushes in","Air pushed out"]],"hdr":true},{"t":"note","v":"**Mechanism of Breathing**"}]},{"h":"Breathing Rate and Lung Measurement","pts":[{"t":"b","v":"A healthy human breathes about **12–16 times per minute** at rest."},{"t":"b","v":"Relaxed breathing is enough at rest; during heavy exercise we use **abdominal muscles** for forced breathing."},{"t":"b","v":"A **spirometer** measures the volume of air a person moves."},{"t":"b","v":"Spirometry is used for the **clinical assessment of lung (pulmonary) function**."}]},{"h":"Exchange and Transport of Gases","pts":[{"t":"b","v":"Breathing only brings air to the alveoli; the real swap happens at the **alveoli and at the tissues**."},{"t":"b","v":"Both exchanges occur by **simple diffusion**, never by active pumping."},{"t":"b","v":"**Partial pressure** (pO ₂, pCO ₂) is the share of pressure of one gas in a mixture."},{"t":"b","v":"Rule: each gas moves from **higher partial pressure to lower partial pressure**."},{"t":"b","v":"At alveoli: high pO ₂ sends O ₂ into blood; high pCO ₂ in blood sends CO ₂ into alveoli to be breathed out."},{"t":"b","v":"At tissues: O ₂ leaves blood for cells; CO ₂ from cells enters the blood."},{"t":"table","rows":[["Site","O₂ moves","CO₂ moves"],["Alveoli","Air → blood","Blood → air (out)"],["Tissues","Blood → cells","Cells → blood"]],"hdr":true},{"t":"note","v":"**Exchange and Transport of Gases**"}]},{"h":"Transport of Oxygen and Carbon Dioxide in Blood","pts":[{"t":"b","v":"About **97% of oxygen** is carried by **haemoglobin** in red blood cells as **oxyhaemoglobin**."},{"t":"b","v":"The remaining **~3% of oxygen** is carried dissolved in blood plasma."},{"t":"b","v":"Most CO ₂ (about **70%**) is carried as **bicarbonate ions** in the plasma."},{"t":"b","v":"About **20–23% of CO ₂** binds haemoglobin as **carbamino-haemoglobin**; ~7% stays dissolved."},{"t":"b","v":"The pigment **haemoglobin** gives blood its red colour and binds oxygen reversibly."},{"t":"b","v":"**Carbon monoxide (CO)** binds haemoglobin far more strongly than O ₂, so it is a dangerous poison."},{"t":"table","rows":[["Gas","Main transport form","Approx %"],["O₂","Oxyhaemoglobin","97%"],["O₂","Dissolved in plasma","3%"],["CO₂","Bicarbonate ions","70%"],["CO₂","Carbamino-haemoglobin","20–23%"],["CO₂","Dissolved in plasma","7%"]],"hdr":true}]},{"h":"Special Cases and Common Facts","pts":[{"t":"b","v":"**Dolphins and whales** are mammals that breathe air through **blowholes** on top of the head."},{"t":"b","v":"**Fish die out of water** because gills work only with dissolved O ₂ in water, not with air."},{"t":"b","v":"**Aerobic respiration** uses O ₂ and gives more energy; **anaerobic** works without O ₂."},{"t":"b","v":"In our muscles during heavy exercise, lack of O ₂ forms **lactic acid**, causing cramps."},{"t":"b","v":"**Yeast** respires anaerobically producing **alcohol and CO ₂** (fermentation)."},{"t":"table","rows":[["Type","Needs O₂?","End products"],["Aerobic","Yes","CO₂ + water + much energy"],["Anaerobic (muscle)","No","Lactic acid + little energy"],["Anaerobic (yeast)","No","Alcohol + CO₂ + little energy"]],"hdr":true}]},{"h":"Respiratory Disorders and First Aid","pts":[{"t":"b","v":"**CPR** stands for **Cardio-Pulmonary Resuscitation** – emergency aid to restart breathing and heartbeat."},{"t":"b","v":"**Asthma**: bronchioles narrow causing difficulty in breathing and wheezing."},{"t":"b","v":"**Emphysema**: alveolar walls are damaged, reducing gasexchange surface (often from **smoking**)."},{"t":"b","v":"**Pneumonia**: infection that fills alveoli with fluid, blocking gas exchange."},{"t":"b","v":"**Occupational lung diseases** like silicosis and asbestosis come from inhaling dust/fibres at work."},{"t":"b","v":"**Tobacco smoking** is the leading preventable cause of lung damage and lung cancer."}]}]},{"t":"Excretory System","S":[{"h":"What Is Excretion?","pts":[{"t":"b","v":"**Excretion** is the removal of harmful nitrogen-containing (nitrogenous) metabolic wastes formed inside the body."},{"t":"b","v":"These wastes are leftovers of **metabolism** (the non-stop chemical work of cells) and would poison the blood if not removed."},{"t":"b","v":"Nitrogenous waste forms when the body breaks down **extra proteins and amino acids** it cannot store."},{"t":"b","v":"Do not confuse it with **egestion** – throwing out undigested food as faeces, which was never part of body chemistry."},{"t":"b","v":"Key exam point: only **metabolic, nitrogenous waste** counts as true excretion."}]},{"h":"Three Types of Nitrogenous Waste","pts":[{"t":"b","v":"**Ammonia (NH3)** is the most toxic but most watersoluble; removed by aquatic animals (ammonotelism)."},{"t":"b","v":"**Urea** is made in the liver from ammonia, is moderately toxic, and is removed by the kidneys."},{"t":"b","v":"**Uric acid** is least toxic and almost insoluble; thrown out as dry paste to save maximum water (uricotelism)."},{"t":"b","v":"Toxicity and water needed both follow the order **ammonia > urea > uric acid**."},{"t":"b","v":"Humans and frogs are **ureotelic** (excrete mainly urea)."},{"t":"table","rows":[["Waste","Animal type","Examples"],["Ammonia (ammonotelic)","Aquatic","Bony fish, tadpole"],["Urea (ureotelic)","Land mammals","Human, frog"],["Uric acid (uricotelic)","Dry-land","Birds, reptiles, insects"]],"hdr":true}]},{"h":"Other Excretory Organs","pts":[{"t":"b","v":"Kidneys are the main organs, but they are **not the only** excretory organs."},{"t":"b","v":"The **lungs** remove carbon dioxide (CO2) and water vapour."},{"t":"b","v":"The **skin** removes water, salts and urea through sweat."},{"t":"b","v":"The **liver** removes bile pigments (bilirubin and biliverdin) from broken-down haemoglobin."},{"t":"b","v":"The **large intestine** can remove some salts like excess iron and calcium."},{"t":"table","rows":[["Organ","Waste removed"],["Kidneys","Urea, salts, water (urine)"],["Lungs","CO2, water vapour"],["Skin","Sweat (water, salts, urea)"],["Liver","Bile pigments"]],"hdr":true}]},{"h":"Parts of the Human Excretory System","pts":[{"t":"b","v":"It has four parts: two **kidneys**, two **ureters**, one **urinary bladder**, one **urethra**."},{"t":"b","v":"**Kidneys** are two bean-shaped, reddish-brown organs that filter and clean the blood."},{"t":"b","v":"**Ureters** are thin tubes carrying urine from each kidney down to the bladder."},{"t":"b","v":"The **urinary bladder** is a stretchy muscular bag that stores urine."},{"t":"b","v":"The **urethra** is the tube through which urine finally leaves the body. **Parts of the Human Excretory System**"}]},{"h":"Position and Size of the Kidney","pts":[{"t":"b","v":"Each kidney lies between the **last thoracic and third lumbar vertebra**, against the back wall of the abdomen."},{"t":"b","v":"An adult kidney is about **10-12 cm long, 5-7 cm wide, 2- 3 cm thick**."},{"t":"b","v":"Each kidney weighs roughly **120-170 g**."},{"t":"b","v":"The inner curved side has a notch, the **hilum**, where ureter, blood vessels and nerves enter or leave."},{"t":"b","v":"Inside the hilum is a funnel-shaped **renal pelvis** with finger-like **calyces** that collect urine."},{"t":"table","rows":[["Feature","Value"],["Length","10-12 cm"],["Width","5-7 cm"],["Thickness","2-3 cm"],["Weight","120-170 g"]],"hdr":true}]},{"h":"Internal Structure of the Kidney","pts":[{"t":"b","v":"A tough protective covering, the **renal capsule**, wraps the kidney from outside."},{"t":"b","v":"A length-wise cut shows two zones: an outer lighter **cortex** and an inner darker **medulla**."},{"t":"b","v":"The medulla is divided into cone-shaped **medullary pyramids** whose tips drip urine into the calyces."},{"t":"b","v":"Cortex tissue dips inward between pyramids as strips called **renal columns (columns of Bertini)**."},{"t":"b","v":"The **renal pelvis and calyces** collect urine before it enters the ureter. **Human kidney with blood supply**"}]},{"h":"The Nephron - Functional Unit","pts":[{"t":"b","v":"Each kidney has over **one million nephrons**; the nephron is the structural and functional unit of the kidney."},{"t":"b","v":"A nephron has two main parts: the **glomerulus** (filter) and the **renal tubule** (winding pipe)."},{"t":"b","v":"The **glomerulus** is a tuft of blood capillaries; blood enters via the afferent and leaves via the efferent arteriole."},{"t":"b","v":"The cup-shaped **Bowman's capsule** wraps the glomerulus and catches the filtered liquid."},{"t":"b","v":"Glomerulus plus Bowman's capsule form the **Malpighian (renal) corpuscle**."},{"t":"b","v":"Tubule order: **PCT -> Loop of Henle -> DCT -> collecting duct**, which empties into the renal pelvis. **The Nephron - Functional Unit**"}]},{"h":"Two Types of Nephrons","pts":[{"t":"b","v":"**Cortical nephrons** have a short loop of Henle that barely enters the medulla; they form the majority."},{"t":"b","v":"**Juxtamedullary nephrons** have a long loop dipping deep into the medulla and make concentrated urine."},{"t":"b","v":"A U-shaped capillary, the **vasa recta**, runs alongside the long loop and helps save water."},{"t":"b","v":"The vasa recta is poorly developed or absent in **cortical nephrons**."},{"t":"table","rows":[["Feature","Cortical","Juxtamedullary"],["Loop of Henle","Short","Long"],["Number","Majority","Fewer"],["Vasa recta","Reduced","Well developed"],["Urine concentration","Less","More"]],"hdr":true}]},{"h":"How Urine Is Made - Three Steps","pts":[{"t":"b","v":"Step 1 is **glomerular filtration**: high blood pressure pushes plasma into Bowman's capsule."},{"t":"b","v":"Filtrate passes through endothelium, basement membrane and **podocytes** with filtration slits, so it is called **ultrafiltration**."},{"t":"b","v":"Everything except **large proteins and blood cells** passes through into the capsule."},{"t":"b","v":"Step 2 is **reabsorption**: useful substances like glucose, amino acids, salts and most water return to blood (mostly in the PCT)."},{"t":"b","v":"Step 3 is **tubular secretion**: extra ions like H+, K+ and ammonia are added into the tubule to keep blood pH balanced."},{"t":"table","rows":[["Step","What happens"],["Filtration","Plasma filtered into capsule"],["Reabsorption","Useful items returned to blood"],["Secretion","Extra wastes added to filtrate"]],"hdr":true},{"t":"note","v":"**How Urine Is Made - Three Steps**"}]},{"h":"Key Filtration Values (BPSC Numbers)","pts":[{"t":"b","v":"About **1100-1200 ml of blood** is filtered by the kidneys every minute."},{"t":"b","v":"This is roughly **one-fifth (1/5)** of the blood the heart pumps each minute."},{"t":"b","v":"**GFR (Glomerular Filtration Rate)** is about 125 ml of filtrate per minute."},{"t":"b","v":"This adds up to nearly **180 litres of filtrate per day**, but only about 1.5 litres becomes urine."},{"t":"b","v":"GFR is regulated by the **JGA (Juxtaglomerular Apparatus)**, which releases the enzyme renin when blood pressure falls."},{"t":"table","rows":[["Quantity","Value"],["Blood filtered/min","1100-1200 ml"],["GFR","~125 ml/min"],["Filtrate/day","~180 litres"],["Urine/day","~1.5 litres"]],"hdr":true}]},{"h":"Composition and Passing of Urine","pts":[{"t":"b","v":"Normal urine is a **light yellow, watery fluid**, slightly acidic, with a faint smell."},{"t":"b","v":"It is about **95% water** with urea, uric acid, salts, creatinine and the pigment urochrome."},{"t":"b","v":"Glucose, proteins or blood in urine signal disease such as **diabetes (glucose) or kidney damage**."},{"t":"b","v":"Urine collects in the bladder; its stretching triggers the urge to urinate, called **micturition**."},{"t":"b","v":"Micturition is controlled by the **micturition reflex** and relaxation of the urethral sphincters."}]},{"h":"Kidney Disorders and Treatment","pts":[{"t":"b","v":"**Kidney stones (renal calculi)** are hard crystals, mainly of calcium oxalate, formed in the kidney."},{"t":"b","v":"**Kidney failure** means kidneys stop filtering, so urea builds up in blood (uraemia)."},{"t":"b","v":"**Dialysis** is an artificial method to remove wastes from blood when kidneys fail."},{"t":"b","v":"A permanent cure for failure is **kidney transplantation** from a matching donor."},{"t":"b","v":"Hormones controlling kidney function are **ADH (vasopressin)**, which saves water, and aldosterone, which saves salt."},{"t":"table","rows":[["Problem","Cause / cure"],["Kidney stone","Calcium oxalate crystals"],["Uraemia","Urea builds in blood"],["Failure","Dialysis or transplant"]],"hdr":true}]}]},{"t":"Nervous System & Sense Organs","S":[{"h":"What the Nervous System Does","pts":[{"t":"b","v":"The nervous system is the body's **high-speed control and communication network**."},{"t":"b","v":"It carries messages as **electrical impulses** through living wires called neurons."},{"t":"b","v":"It always does three jobs in order: **receive, process, respond**."},{"t":"b","v":"It receives input from **sense organs** (eyes, ears, skin, nose, tongue)."},{"t":"b","v":"It processes input in the **brain and spinal cord** and makes a decision."},{"t":"b","v":"It responds by ordering **muscles to move or glands to secrete**."},{"t":"b","v":"It is faster than the **hormonal (chemical) system**, which is slow but longer-lasting."},{"t":"table","rows":[["Feature","Nervous System","Hormonal System"],["Messenger","Electrical impulse","Chemical hormone"],["Path","Neurons","Blood"],["Speed","Very fast","Slow"],["Effect","Short-lived","Long-lasting"]],"hdr":true}]},{"h":"The Neuron – Structure","pts":[{"t":"b","v":"The **neuron (nerve cell)** is the basic working unit of the nervous system."},{"t":"b","v":"**Dendrites** are short branched fibres that carry the impulse towards the cell body."},{"t":"b","v":"Dendrites contain dark-staining particles called **Nissl's granules**."},{"t":"b","v":"The **cell body (cyton)** holds the nucleus and keeps the cell alive."},{"t":"b","v":"The **axon** is one long fibre that carries the impulse away from the cell body."},{"t":"b","v":"The axon tip ends in a **synaptic knob** holding vesicles of neurotransmitters."},{"t":"b","v":"Bare gaps in the sheath are the **nodes of Ranvier**, where the impulse jumps to go faster."}]},{"h":"Types of Neurons","pts":[{"t":"b","v":"Axons are of two kinds: **myelinated** (spinal and cranial nerves) and **non-myelinated**."},{"t":"b","v":"Neurons are also classified by the number of fibres from the cell body."},{"t":"b","v":"**Multipolar** neurons have one axon and many dendrites (cerebral cortex)."},{"t":"b","v":"**Bipolar** neurons have one axon and one dendrite (retina of the eye)."},{"t":"b","v":"**Unipolar** neurons have one axon and no dendrite (embryonic stage)."},{"t":"table","rows":[["Type","Axon / Dendrites","Found in"],["Multipolar","1 axon, many dendrites","Cerebral cortex"],["Bipolar","1 axon, 1 dendrite","Retina of eye"],["Unipolar","1 axon, no dendrite","Embryonic stage"]],"hdr":true}]},{"h":"The Synapse","pts":[{"t":"b","v":"The **synapse** is the junction where one neuron passes its message to the next."},{"t":"b","v":"It is formed by the **pre-synaptic** (sender) and **postsynaptic** (receiver) membranes."},{"t":"b","v":"The tiny gap between them is the **synaptic cleft**."},{"t":"b","v":"In an **electrical synapse**, current flows directly across; it is faster but rare in humans."},{"t":"b","v":"In a **chemical synapse**, the sender releases **neurotransmitters** across the cleft."},{"t":"b","v":"Chemical synapses are the **common type** in the human body."},{"t":"table","rows":[["Type","Mechanism","Speed / Frequency"],["Electrical","Direct current flow","Faster, rare"],["Chemical","Neurotransmitters","Slower, common"]],"hdr":true},{"t":"note","v":"**The Synapse**"}]},{"h":"Organisation of the Nervous System","pts":[{"t":"b","v":"The **central nervous system (CNS)** is the brain and spinal cord – the control room."},{"t":"b","v":"The **peripheral nervous system (PNS)** is all nerves branching from the CNS."},{"t":"b","v":"The PNS includes **cranial nerves** (from brain) and **spinal nerves** (from spinal cord)."},{"t":"b","v":"The **autonomic nervous system (ANS)** controls involuntary organs automatically."},{"t":"b","v":"The **sympathetic** part drives fight-or-flight (speeds heart) in emergencies."},{"t":"b","v":"The **parasympathetic** part drives rest-and-digest (slows heart, aids digestion)."},{"t":"b","v":"**Afferent (sensory)** fibres carry input to the CNS; **efferent (motor)** fibres carry output away."},{"t":"b","v":"Humans have **12 pairs of cranial nerves** and **31 pairs of spinal nerves**."},{"t":"table","rows":[["Division","Made of","Role"],["CNS","Brain + spinal cord","Processing, decisions"],["PNS","Cranial + spinal nerves","Connects CNS to body"],["ANS","Sympathetic + parasympathetic","Involuntary control"]],"hdr":true},{"t":"note","v":"**Organisation of the Nervous System**"}]},{"h":"The Brain – Protection","pts":[{"t":"b","v":"The brain is the body's main computer where most decisions are made."},{"t":"b","v":"It is enclosed in a bony box called the **cranium** (brain box) of the skull."},{"t":"b","v":"It is wrapped in three membranes together called the **meninges**."},{"t":"b","v":"From outside in, the meninges are **dura mater, arachnoid, pia mater**."},{"t":"b","v":"The **pia mater** is the delicate innermost layer touching the brain."},{"t":"b","v":"Inflammation of these membranes is the disease **meningitis**."},{"t":"b","v":"Fluid between the layers (**cerebrospinal fluid**) cushions the brain from shock."},{"t":"table","rows":[["Meninges layer","Position","Texture"],["Dura mater","Outer","Tough"],["Arachnoid","Middle","Web-like"],["Pia mater","Inner","Delicate"]],"hdr":true}]},{"h":"Parts of the Brain","pts":[{"t":"b","v":"The brain has three major parts: **forebrain, midbrain, hindbrain**."},{"t":"b","v":"The **cerebrum** (forebrain) is the largest part; it controls intelligence, memory and voluntary action."},{"t":"b","v":"The **thalamus and hypothalamus** lie in the forebrain; the **hypothalamus** regulates body temperature, hunger and thirst."},{"t":"b","v":"The **cerebellum** (hindbrain) controls balance, posture and coordination of muscles."},{"t":"b","v":"The **medulla oblongata** (hindbrain) controls heartbeat, breathing and blood pressure (involuntary vital actions)."},{"t":"b","v":"The **pons** connects brain parts and helps regulate breathing."},{"t":"b","v":"The midbrain and hindbrain together form the **brain stem**."},{"t":"table","rows":[["Brain part","Region","Main function"],["Cerebrum","Forebrain","Thinking, memory, voluntary acts"],["Hypothalamus","Forebrain","Temperature, hunger, thirst"],["Cerebellum","Hindbrain","Balance, coordination"],["Medulla","Hindbrain","Heartbeat, breathing"]],"hdr":true},{"t":"note","v":"**Human brain regions**"}]},{"h":"Spinal Cord & Reflex Action","pts":[{"t":"b","v":"The **spinal cord** runs inside the backbone and links the brain to body nerves."},{"t":"b","v":"It is protected by the **vertebral column** and the meninges."},{"t":"b","v":"A **reflex action** is a sudden, automatic response to a stimulus, like pulling the hand off a hot object."},{"t":"b","v":"The pathway of a reflex is the **reflex arc**."},{"t":"b","v":"The **spinal cord** is the governing centre of reflex action, not the brain."},{"t":"b","v":"The arc runs: receptor to **sensory neuron** to spinal cord to **motor neuron** to effector (muscle)."},{"t":"b","v":"Reflexes are fast because they bypass the brain."},{"t":"b","v":"**Tetraplegia (quadriplegia)** is paralysis of all four limbs due to spinal cord injury in the neck region. **Reflex arc (sensory/motor neurons to CNS)**"}]},{"h":"The Eye","pts":[{"t":"b","v":"The **cornea** is the transparent front through which light enters."},{"t":"b","v":"The **iris** is the coloured part that controls the size of the **pupil**."},{"t":"b","v":"The **lens** focuses light onto the **retina** at the back."},{"t":"b","v":"The **retina** holds light-sensitive cells: **rods** (dim light) and **cones** (colour)."},{"t":"b","v":"The **optic nerve** carries signals from the retina to the brain."},{"t":"b","v":"Lack of vitamin A causes **night blindness**."},{"t":"b","v":"The **Ishihara test** is used to detect **colour blindness**."},{"t":"table","rows":[["Part","Function"],["Cornea","Light entry"],["Iris / Pupil","Controls light amount"],["Lens","Focuses light"],["Retina","Detects image"],["Optic nerve","Carries signal to brain"]],"hdr":true}]},{"h":"The Ear","pts":[{"t":"b","v":"The ear is the organ for **hearing** and **balance**."},{"t":"b","v":"The **outer ear (pinna)** collects sound waves."},{"t":"b","v":"The **eardrum (tympanum)** vibrates when sound hits it."},{"t":"b","v":"Three middle-ear bones – **malleus, incus, stapes** – amplify and pass vibrations."},{"t":"b","v":"The **cochlea** in the inner ear converts vibrations into nerve signals."},{"t":"b","v":"The **semicircular canals** help maintain body balance."},{"t":"b","v":"The **auditory nerve** carries sound signals to the brain."},{"t":"table","rows":[["Region","Key structures","Role"],["Outer","Pinna, ear canal","Collect sound"],["Middle","Eardrum, ear bones","Amplify sound"],["Inner","Cochlea, semicircular canals","Hearing, balance"]],"hdr":true}]},{"h":"The Tongue, Skin & Nose","pts":[{"t":"b","v":"The tongue detects taste through **taste buds**."},{"t":"b","v":"The five basic tastes are **sweet, sour, salty, bitter and umami**."},{"t":"b","v":"**Spicy and pungent are NOT tastes** – they are pain/heat sensations."},{"t":"b","v":"The **back of the tongue** is most sensitive to **bitter** taste."},{"t":"b","v":"The **skin** senses touch, pressure, pain and temperature."},{"t":"b","v":"The **nose** detects smell using **olfactory receptors**."},{"t":"b","v":"The **brain (cerebral cortex)** itself feels no pain when pricked – it has no pain receptors."},{"t":"table","rows":[["Sense organ","Sense"],["Eye","Sight"],["Ear","Hearing, balance"],["Tongue","Taste"],["Nose","Smell"],["Skin","Touch, pain, temperature"]],"hdr":true}]},{"h":"Common Disorders & Exam Facts","pts":[{"t":"b","v":"**Cerebral palsy** is a brain disorder affecting movement, found generally in **children**."},{"t":"b","v":"**Meningitis** is inflammation of the meninges (brain membranes)."},{"t":"b","v":"**Tetraplegia** means paralysis of all four limbs."},{"t":"b","v":"**Night blindness** is caused by deficiency of **vitamin A**."},{"t":"b","v":"Body temperature is regulated by the **hypothalamus**."},{"t":"b","v":"Heartbeat and breathing are controlled by the **medulla oblongata**."},{"t":"b","v":"Input (sensory) and output (motor) nerves meet at the **spinal cord / synapse**."},{"t":"b","v":"Among animals, the **tree shrew** / small mammals have the largest brain relative to body size. **Tongue taste regions**"}]}]},{"t":"Endocrine System & Hormones","S":[{"h":"Two Control Systems of the Body","pts":[{"t":"b","v":"The body has **two coordination systems** that make all organs work together at the right time."},{"t":"b","v":"The **nervous system** sends fast electrical signals along nerves; the effect is instant but short-lasting."},{"t":"b","v":"The **endocrine system** sends slow chemical signals through the blood; the effect is delayed but long-lasting and reaches distant organs."},{"t":"b","v":"A useful analogy: nervous = **phone call** (instant, ends at once); endocrine = **letter** (slow, travels far, lasts long)."},{"t":"b","v":"Exam point: nervous = **fast and short**; endocrine = **slow but long-lasting**."},{"t":"table","rows":[["Feature","Nervous","Endocrine"],["Signal","Electrical","Chemical (hormone)"],["Pathway","Nerves","Blood"],["Speed","Fast","Slow"],["Effect","Short-lasting","Long-lasting"]],"hdr":true}]},{"h":"What is a Hormone?","pts":[{"t":"b","v":"NCERT defines a hormone as a **non-nutrient chemical** that acts as an inter-cellular messenger."},{"t":"b","v":"Hormones are produced in **trace (tiny) amounts**, yet are extremely powerful."},{"t":"b","v":"\"Non-nutrient\" means a hormone is **not food and gives no energy** - it only carries an instruction."},{"t":"b","v":"A hormone acts only on its **target organ or target cells**, which have matching receptors."},{"t":"b","v":"Hormones are **poured directly into the blood**, which carries them throughout the body."}]},{"h":"Glands - Exocrine vs Endocrine","pts":[{"t":"b","v":"A **gland** is a cell or organ that makes and releases a useful substance (a secretion)."},{"t":"b","v":"**Exocrine glands** release products through tubes called **ducts** (e.g. salivary, sweat, oil, mammary, tear glands)."},{"t":"b","v":"**Endocrine glands** have no ducts; they are **ductless glands** that pour hormones directly into blood."},{"t":"b","v":"Memory hook: **Exo = exit through a tube; Endo = enters the blood directly**."},{"t":"b","v":"The **pancreas is a composite (mixed) gland** - exocrine part makes digestive juice, endocrine part makes insulin and glucagon."},{"t":"table","rows":[["Feature","Exocrine","Endocrine"],["Duct","Has ducts","Ductless"],["Releases into","Surface/cavity","Blood"],["Product","Enzymes, sweat, milk","Hormones"],["Example","Salivary gland","Thyroid gland"]],"hdr":true}]},{"h":"Hypothalamus - Top Control Centre","pts":[{"t":"b","v":"The **hypothalamus** is a small region at the base of the brain that links the brain to the endocrine system."},{"t":"b","v":"It regulates **body temperature, hunger, thirst, sleep and emotions**."},{"t":"b","v":"It directly controls the **pituitary gland** using releasing and inhibiting hormones."},{"t":"b","v":"**Releasing hormones** tell the pituitary to secrete; **inhibiting hormones** tell it to stop."},{"t":"b","v":"Example: **GnRH** stimulates release of gonadotrophins; **somatostatin** inhibits growth hormone."}]},{"h":"Pituitary Gland - The Master Gland","pts":[{"t":"b","v":"The **pituitary** is a pea-sized gland sitting in a bony pocket called the **sella turcica**, located in the brain."},{"t":"b","v":"It is called the **master gland** because its hormones control many other endocrine glands."},{"t":"b","v":"It has two parts: **anterior (adenohypophysis)** and **posterior (neurohypophysis)**."},{"t":"b","v":"The **anterior pituitary makes six hormones**: GH, PRL, TSH, ACTH, LH and FSH."},{"t":"b","v":"The **posterior pituitary makes nothing itself** - it only stores and releases oxytocin and vasopressin (ADH)."},{"t":"b","v":"**Pars intermedia** makes MSH (controls skin pigment); in humans it is nearly merged with the anterior part. **Pituitary gland location in the brain**"}]},{"h":"Anterior Pituitary Hormones","pts":[{"t":"b","v":"**GH (Growth Hormone)** controls growth of body tissues."},{"t":"b","v":"Too much GH in children causes **gigantism**; too little causes **pituitary dwarfism**."},{"t":"b","v":"Excess GH in an adult causes **acromegaly** (enlarged face, jaw and hands)."},{"t":"b","v":"**TSH** tells the thyroid to make thyroxine; **ACTH** tells the adrenal cortex to make glucocorticoids."},{"t":"b","v":"**LH and FSH (gonadotrophins)** control the gonads - sperm/androgens in males, ovulation/follicle growth in females."},{"t":"b","v":"**PRL (Prolactin)** develops mammary glands and triggers milk formation."},{"t":"table","rows":[["Hormone","Main function"],["GH","Body growth"],["PRL","Milk formation"],["TSH","Stimulates thyroid"],["ACTH","Stimulates adrenal cortex"],["LH/FSH","Control gonads"]],"hdr":true}]},{"h":"Posterior Pituitary Hormones","pts":[{"t":"b","v":"Both hormones are actually **made by the hypothalamus** and only stored here."},{"t":"b","v":"**Oxytocin** causes uterine contraction during birth and milk ejection."},{"t":"b","v":"**Vasopressin / ADH** makes the kidney reabsorb water, so it is **anti-diuretic**."},{"t":"b","v":"Shortage of ADH causes **diabetes insipidus** (excess dilute urine)."},{"t":"b","v":"Memory aid: **oxytocin = birth and milk; ADH = saves water**."}]},{"h":"Pineal Gland","pts":[{"t":"b","v":"The **pineal gland** is a tiny gland located in the brain."},{"t":"b","v":"It secretes the hormone **melatonin**."},{"t":"b","v":"Melatonin regulates the body's **24-hour (diurnal) rhythms** like the sleep-wake cycle."},{"t":"b","v":"It is often called the **sleep hormone** because it rises in darkness and falls in daylight."},{"t":"b","v":"Think of it as the body's **internal clock-keeper**."}]},{"h":"Thyroid Gland","pts":[{"t":"b","v":"The **thyroid** is a butterfly-shaped gland with two lobes beside the trachea, joined by the **isthmus**."},{"t":"b","v":"It makes **thyroxine (T4) and triiodothyronine (T3)**, both of which need the element **iodine**."},{"t":"b","v":"These hormones control the **Basal Metabolic Rate (BMR)** and support red blood cell formation."},{"t":"b","v":"Iodine deficiency causes **hypothyroidism and goitre** (swollen neck) - reason we use iodised salt."},{"t":"b","v":"Too little thyroid hormone in a baby causes **cretinism** (stunted growth, low IQ)."},{"t":"b","v":"The thyroid also makes **thyrocalcitonin (TCT)**, which lowers blood calcium."},{"t":"table","rows":[["Disorder","Cause"],["Goitre","Iodine deficiency (hypothyroid)"],["Cretinism","Low thyroid in infants"],["Hyperthyroidism","Excess thyroid hormone"]],"hdr":true}]},{"h":"Parathyroid Gland & Calcium Balance","pts":[{"t":"b","v":"There are **four parathyroid glands**, embedded on the back of the thyroid lobes."},{"t":"b","v":"They secrete **parathyroid hormone (PTH)**, a peptide hormone."},{"t":"b","v":"PTH **raises blood calcium (Ca2+)**, doing the opposite of thyrocalcitonin (TCT)."},{"t":"b","v":"Memory aid: **PTH pushes calcium UP; TCT brings it DOWN**."},{"t":"b","v":"Together they keep blood calcium steady - called **calcium homeostasis**."},{"t":"b","v":"Calcium is needed for **bones, muscle contraction, nerve signals and blood clotting**."},{"t":"table","rows":[["Hormone","Effect on Ca2+"],["PTH","Raises (UP)"],["TCT (Calcitonin)","Lowers (DOWN)"]],"hdr":true},{"t":"note","v":"**Position of the thyroid (around the trachea, joined by isthmus) and the four parathyroid glands on its back.**"}]},{"h":"Thymus & Adrenal Glands","pts":[{"t":"b","v":"The **thymus** lies in the chest behind the breastbone and secretes **thymosin**, which develops immunity (T-cells)."},{"t":"b","v":"The **adrenal glands** sit on top of each kidney and have two parts: cortex and medulla."},{"t":"b","v":"The **adrenal medulla** secretes **adrenaline and noradrenaline** - the emergency \"fight-or-flight\" hormones."},{"t":"b","v":"Adrenaline raises **heart rate, blood pressure and blood glucose** during stress or fear."},{"t":"b","v":"The **adrenal cortex** secretes glucocorticoids (e.g. cortisol) and mineralocorticoids (e.g. aldosterone)."},{"t":"b","v":"Aldosterone controls **salt and water balance**; cortisol manages stress and metabolism."},{"t":"table","rows":[["Part","Hormone","Role"],["Medulla","Adrenaline","Fight-or-flight"],["Cortex","Cortisol","Stress/metabolism"],["Cortex","Aldosterone","Salt-water balance"]],"hdr":true}]},{"h":"Pancreas - Islets of Langerhans","pts":[{"t":"b","v":"The endocrine part of the pancreas is the **Islets of Langerhans**."},{"t":"b","v":"**Beta cells** secrete **insulin**, which lowers blood glucose by helping cells absorb it."},{"t":"b","v":"**Alpha cells** secrete **glucagon**, which raises blood glucose."},{"t":"b","v":"Insulin and glucagon together maintain **blood sugar homeostasis**."},{"t":"b","v":"Lack of insulin causes **diabetes mellitus** (high blood glucose, sugar in urine)."},{"t":"b","v":"Blood glucose is commonly expressed in **mg/dL (milligrams per decilitre)**; normal fasting is about 70- 110 mg/dL."},{"t":"table","rows":[["Cell","Hormone","Effect on glucose"],["Beta cell","Insulin","Lowers"],["Alpha cell","Glucagon","Raises"]],"hdr":true}]},{"h":"Gonads - Sex Hormones","pts":[{"t":"b","v":"The **testes (in males)** secrete **testosterone**, the main male sex hormone (androgen)."},{"t":"b","v":"Testosterone controls male secondary characters like beard, deep voice and sperm production."},{"t":"b","v":"The **ovaries (in females)** secrete **estrogen and progesterone**."},{"t":"b","v":"**Estrogen** develops female secondary characters; **progesterone** maintains pregnancy."},{"t":"b","v":"After **menopause**, the ovaries stop producing **estrogen and progesterone**."},{"t":"b","v":"Gonads are controlled by the pituitary gonadotrophins **LH and FSH**."},{"t":"table","rows":[["Gland","Hormone","Type"],["Testes","Testosterone","Male"],["Ovaries","Estrogen","Female"],["Ovaries","Progesterone","Female"]],"hdr":true}]},{"h":"Hormonal Disorders - Quick Revision","pts":[{"t":"b","v":"**Diabetes mellitus** - insulin deficiency, high blood sugar (pancreas)."},{"t":"b","v":"**Goitre / cretinism** - iodine/thyroxine deficiency (thyroid)."},{"t":"b","v":"**Gigantism, dwarfism, acromegaly** - growth hormone imbalance (pituitary)."},{"t":"b","v":"**Diabetes insipidus** - ADH deficiency (posterior pituitary)."},{"t":"b","v":"**Tetany** - low calcium from low PTH (parathyroid)."},{"t":"table","rows":[["Disorder","Hormone/Gland"],["Diabetes mellitus","Insulin / Pancreas"],["Goitre","Thyroxine / Thyroid"],["Gigantism","GH / Pituitary"],["Diabetes insipidus","ADH / Pituitary"],["Tetany","PTH / Parathyroid"]],"hdr":true}]}]},{"t":"Skeletal & Muscular System","S":[{"h":"Skeleton – Role and Basic Facts","pts":[{"t":"b","v":"The **skeletal system** is the body's internal framework of bones and a few cartilages."},{"t":"b","v":"An adult human has **206 bones** plus some cartilages."},{"t":"b","v":"A **baby is born with more bones**; many fuse during growth to give 206 in the adult."},{"t":"b","v":"Functions: **support and shape**, protection of soft organs, and movement with muscles."},{"t":"b","v":"Bones **store calcium** as a mineral reserve."},{"t":"b","v":"The **bone marrow** inside some bones makes blood cells."},{"t":"b","v":"**Osteology** is the branch of science that studies bones. **Skeleton – Role and Basic Facts**"}]},{"h":"Connective Tissue – Bone and Cartilage","pts":[{"t":"b","v":"**Connective tissue** binds, supports, strengthens and protects other tissues."},{"t":"b","v":"Its family includes **bone, cartilage, blood and fat (adipose)**."},{"t":"b","v":"Its cells are spread out inside a non-living **matrix (ground substance)**."},{"t":"b","v":"The **hardness of the matrix** decides how stiff the tissue is."},{"t":"b","v":"In the embryo the skeleton is mostly **cartilage**, later replaced by bone."}]},{"h":"Bone vs Cartilage","pts":[{"t":"b","v":"Bone has a **hard, non-pliable matrix** rich in calcium salts and collagen."},{"t":"b","v":"Cartilage has a **soft, pliable matrix** with chondroitin salts and little calcium."},{"t":"b","v":"**Cartilage can be bent**; bone cannot – felt in nose tip and outer ear (pinna)."},{"t":"b","v":"Bone cells = **osteocytes** (in spaces called lacunae); cartilage cells = chondrocytes."},{"t":"b","v":"Cartilage also lies **between vertebrae** and at the ends of limb bones."},{"t":"table","rows":[["Feature","Bone","Cartilage"],["Matrix","Hard, non-pliable","Soft, pliable"],["Main content","Calcium + collagen","Chondroitin salts"],["Cells","Osteocytes","Chondrocytes"],["Can bend?","No","Yes"],["Found in","Limbs, skull","Nose tip, pinna"]],"hdr":true}]},{"h":"Two Divisions of the Skeleton","pts":[{"t":"b","v":"The skeleton splits by location into **axial** and **appendicular**."},{"t":"b","v":"**Axial** (from axis) = bones of the central midline: head and trunk."},{"t":"b","v":"**Appendicular** (from appendage) = limb bones plus the two girdles."},{"t":"b","v":"**Axial = 80 bones**; appendicular = 126 bones."},{"t":"b","v":"Memory check: **80 + 126 = 206** total bones."},{"t":"table","rows":[["Division","Bones","Examples"],["Axial","80","Skull, backbone, ribs, sternum"],["Appendicular","126","Limbs + pectoral & pelvic girdles"],["Total","206","Whole skeleton"]],"hdr":true}]},{"h":"Skull and Ear Ossicles","pts":[{"t":"b","v":"The skull has **22 bones** = 8 cranial + 14 facial."},{"t":"b","v":"The **8 cranial bones** form the cranium that protects the brain."},{"t":"b","v":"Joints between cranial bones are **fixed (immovable)** for safety."},{"t":"b","v":"Of the face, only the **lower jaw can move**; the upper jaw is fixed."},{"t":"b","v":"The U-shaped **hyoid** bone sits at the base of the mouth."},{"t":"b","v":"Each middle ear has three ossicles – **Malleus, Incus, Stapes**."},{"t":"b","v":"The **stapes is the smallest bone** in the body (about 3 mm)."}]},{"h":"Vertebral Column (Backbone)","pts":[{"t":"b","v":"Built from **26 vertebrae** stacked along the back (dorsal) side."},{"t":"b","v":"Each vertebra has a **neural canal** through which the spinal cord passes."},{"t":"b","v":"The first vertebra, the **atlas**, joins the skull and lets you nod."},{"t":"b","v":"The atlas–skull joint allows nodding; the **axis (pivot joint)** allows head rotation."},{"t":"b","v":"Almost all mammals, even the giraffe, have **7 cervical vertebrae**."},{"t":"b","v":"The column protects the spinal cord and supports the head."},{"t":"table","rows":[["Region","Number"],["Cervical (neck)","7"],["Thoracic (chest)","12"],["Lumbar (lower back)","5"],["Sacral (fused)","1"],["Coccygeal (fused)","1"],["Total","26"]],"hdr":true},{"t":"note","v":"**Vertebral Column (Backbone)**"}]},{"h":"Rib Cage – Ribs and Sternum","pts":[{"t":"b","v":"The **sternum (breast bone)** is a flat bone on the frontmiddle of the chest."},{"t":"b","v":"There are **12 pairs of ribs** – thin, flat, curved bones."},{"t":"b","v":"Each rib is **bicephalic (two-headed)** at its back end."},{"t":"b","v":"**True ribs (1–7)** join the sternum directly by hyaline cartilage."},{"t":"b","v":"**False ribs (8–10)** join the 7th rib, not the sternum directly."},{"t":"b","v":"**Floating ribs (11–12)** are not joined to the sternum in front."},{"t":"b","v":"Thoracic vertebrae + ribs + sternum form the **rib cage** protecting heart and lungs."},{"t":"table","rows":[["Rib type","Pairs","Front attachment"],["True","1–7","Sternum directly"],["False","8–10","7th rib by cartilage"],["Floating","11–12","None"]],"hdr":true}]},{"h":"Appendicular Skeleton – Limbs and Girdles","pts":[{"t":"b","v":"A **girdle** is a ring of bones connecting a limb to the axial skeleton."},{"t":"b","v":"The **pectoral girdle** attaches the arms: clavicle + scapula."},{"t":"b","v":"The scapula's **glenoid cavity** holds the humerus to form the shoulder joint."},{"t":"b","v":"The **pelvic girdle (hip)** attaches the legs; made of two coxal bones."},{"t":"b","v":"Each **coxal bone** is the fusion of ilium, ischium and pubis."},{"t":"b","v":"Arm bones: **humerus, radius, ulna**; leg bones: femur, tibia, fibula."},{"t":"b","v":"The **femur (thigh bone)** is the longest and strongest bone."},{"t":"table","rows":[["Girdle","Limb","Bones"],["Pectoral","Arms","Clavicle + scapula"],["Pelvic","Legs","Two coxal bones"]],"hdr":true}]},{"h":"Joints","pts":[{"t":"b","v":"A **joint** is where two or more bones meet."},{"t":"b","v":"**Fixed (immovable) joints** hold cranial bones together – no movement."},{"t":"b","v":"**Slightly movable joints** occur between vertebrae."},{"t":"b","v":"**Freely movable (synovial) joints** allow large movement, e.g. knee, shoulder."},{"t":"b","v":"The **ball-and-socket joint** (shoulder, hip) moves in all directions."},{"t":"b","v":"The **hinge joint** (knee, elbow) moves in one plane like a door."},{"t":"b","v":"The **pivot joint** at the neck (atlas–axis) lets the head turn side to side."},{"t":"table","rows":[["Joint type","Example","Movement"],["Ball-and-socket","Shoulder, hip","All directions"],["Hinge","Knee, elbow","One plane"],["Pivot","Neck (atlas-axis)","Rotation"],["Fixed","Skull","None"]],"hdr":true},{"t":"note","v":"**Types of joints (pivot joint at neck/head)**"}]},{"h":"The Muscular System","pts":[{"t":"b","v":"**Muscles** are the engines that move the skeleton by contracting."},{"t":"b","v":"Muscle cells are **contractile** – they can shorten and pull."},{"t":"b","v":"Muscles work in **antagonistic pairs** (one contracts, the other relaxes)."},{"t":"b","v":"Muscles can only **pull, not push**, so pairs are needed."},{"t":"b","v":"**Tendons** attach muscle to bone; ligaments join bone to bone."},{"t":"b","v":"The body has over **600 muscles**, making up much of body weight."}]},{"h":"Three Types of Muscle","pts":[{"t":"b","v":"**Skeletal (striated) muscle** is voluntary and attached to bones for movement."},{"t":"b","v":"**Smooth (unstriated) muscle** is involuntary, in walls of stomach and intestines."},{"t":"b","v":"**Cardiac muscle** is involuntary, found only in the heart, and never tires."},{"t":"b","v":"Skeletal muscle has **stripes (striations)**; smooth muscle does not."},{"t":"b","v":"Cardiac muscle is **striated but involuntary** – a unique mix."},{"t":"table","rows":[["Type","Control","Location"],["Skeletal","Voluntary","Attached to bones"],["Smooth","Involuntary","Stomach, intestines"],["Cardiac","Involuntary","Heart only"]],"hdr":true},{"t":"note","v":"**Three Types of Muscle**"}]},{"h":"Disorders and Medical Terms","pts":[{"t":"b","v":"**Osteology** is the study of bones."},{"t":"b","v":"**Arthritis** is inflammation and pain of the joints."},{"t":"b","v":"**Osteoporosis** is weakening of bones from calcium loss, common in old age."},{"t":"b","v":"**Rickets** in children is soft, bent bones from vitamin D deficiency."},{"t":"b","v":"**Biological resurfacing** is a surgical technique to treat cartilage/joint problems."},{"t":"b","v":"A **fracture** is a break or crack in a bone."}]}]},{"t":"Reproductive System & Reproductive Health","S":[{"h":"Why Reproduction Matters","pts":[{"t":"b","v":"**Reproduction** is the process by which living things make new individuals of their own kind."},{"t":"b","v":"No organism lives forever, so reproduction keeps the **species** from dying out."},{"t":"b","v":"Parents pass on a copy of their **genes** (instruction book) to offspring."},{"t":"b","v":"The **zygote** is the single first cell of every new individual."},{"t":"b","v":"The zygote is **diploid** – it has the full restored set of chromosomes."}]},{"h":"Asexual vs Sexual Reproduction","pts":[{"t":"b","v":"**Asexual reproduction** needs one parent and gives identical clones."},{"t":"b","v":"**Sexual reproduction** needs two parents (male and female) and gives variation."},{"t":"b","v":"Variation helps a species survive **changing conditions**."},{"t":"b","v":"Each parent makes a sex cell called a **gamete** carrying half the chromosomes."},{"t":"b","v":"Most higher animals, including **humans**, reproduce sexually."},{"t":"table","rows":[["Feature","Asexual","Sexual"],["Parents","One","Two"],["Offspring","Identical clones","Show variation"],["Speed","Fast, simple","Slower"],["Examples","Budding in Hydra, spores","Humans, most plants"]],"hdr":true}]},{"h":"Chromosomes: Haploid & Diploid","pts":[{"t":"b","v":"A **chromosome** is a thread-like structure that carries the genes."},{"t":"b","v":"A human body cell has **46 chromosomes** arranged as 23 pairs."},{"t":"b","v":"A cell with the full double set is **diploid (2n)**."},{"t":"b","v":"A cell with only half the set is **haploid (n)** – 23 in humans."},{"t":"b","v":"Sperm and egg are haploid so that **23 + 23 = 46** at fertilisation."},{"t":"table","rows":[["Type","Symbol","Chromosomes (human)"],["Diploid","2n","46"],["Haploid","n","23"]],"hdr":true}]},{"h":"Cell Division & Gamete Formation","pts":[{"t":"b","v":"**Mitosis** makes two identical cells with the same number (46 to 46)."},{"t":"b","v":"Mitosis is used for **growth, repair** and asexual reproduction."},{"t":"b","v":"**Meiosis** is a reduction division that halves the number (46 to 23)."},{"t":"b","v":"Meiosis produces the **haploid gametes**."},{"t":"b","v":"Making gametes is **gametogenesis**: spermatogenesis (male), oogenesis (female)."},{"t":"table","rows":[["Division","Result","Use"],["Mitosis","46 to 46, identical","Body cells, growth"],["Meiosis","46 to 23, halved","Gametes"]],"hdr":true},{"t":"note","v":"**Cell Division & Gamete Formation**"}]},{"h":"Types of Gametes & Patterns of Fusion","pts":[{"t":"b","v":"**Homogametes (isogametes)** look alike, e.g. in alga Ulothrix."},{"t":"b","v":"**Heterogametes** look different: small motile male, large still female."},{"t":"b","v":"**Isogamy** = fusion of two same-sized gametes (Spirogyra, Ulothrix)."},{"t":"b","v":"**Anisogamy** = fusion of two different-sized gametes (Eudorina)."},{"t":"b","v":"**Oogamy** = large non-moving egg fuses with small moving sperm (Volvox, humans)."},{"t":"table","rows":[["Pattern","Gametes","Example"],["Isogamous","Same size","Spirogyra, Ulothrix"],["Anisogamous","Different size","Eudorina"],["Oogamous","Big egg + tiny sperm","Volvox, Fucus, human"]],"hdr":true},{"t":"note","v":"**Types of Gametes & Patterns of Fusion**"}]},{"h":"Human Male Reproductive System","pts":[{"t":"b","v":"Its two jobs are to make sperms and to deliver them into the female body."},{"t":"b","v":"The **testes** are the primary male sex organs that make sperms and testosterone."},{"t":"b","v":"Testes hang in a skin pouch, the **scrotum**, which keeps them cooler than body temperature."},{"t":"b","v":"Sperms form inside coiled **seminiferous tubules**, supported by Sertoli (nurse) cells."},{"t":"b","v":"The **vas deferens** carries sperms toward the urethra in the penis."},{"t":"b","v":"**Semen** = sperms plus fluid from seminal vesicle, prostate and bulbourethral glands. **Human Male Reproductive System**"}]},{"h":"Spermatogenesis: Making Sperms","pts":[{"t":"b","v":"**Spermatogenesis** happens in the seminiferous tubules from puberty onward."},{"t":"b","v":"The diploid starting cell is the **spermatogonium** (46 chromosomes)."},{"t":"b","v":"A primary spermatocyte undergoes meiosis I to give two haploid **secondary spermatocytes**."},{"t":"b","v":"One primary spermatocyte finally yields **four haploid spermatids**."},{"t":"b","v":"Spermatids reshape into sperms by **spermiogenesis**, then are released by spermiation."},{"t":"b","v":"A mature sperm has four parts: **head, neck, middle piece and tail**."},{"t":"table","rows":[["Stage","Chromosomes","Number"],["Spermatogonium","46 (2n)","1"],["Primary spermatocyte","46 (2n)","1"],["Secondary spermatocyte","23 (n)","2"],["Spermatid / Sperm","23 (n)","4"]],"hdr":true}]},{"h":"Human Female System & Oogenesis","pts":[{"t":"b","v":"The **ovaries** are the primary female sex organs that make eggs and hormones."},{"t":"b","v":"The **fallopian tube (oviduct)** carries the egg and is where fertilisation occurs."},{"t":"b","v":"The **uterus (womb)** shelters and nourishes the developing baby."},{"t":"b","v":"**Oogenesis** begins before birth and produces the egg (ovum)."},{"t":"b","v":"One primary oocyte gives only **one ovum** plus tiny polar bodies."},{"t":"b","v":"Females normally release **one egg per cycle** (ovulation)."},{"t":"table","rows":[["Organ","Main role"],["Ovary","Makes eggs and hormones"],["Fallopian tube","Site of fertilisation"],["Uterus","Shelters the embryo"],["Vagina","Receives sperms; birth canal"]],"hdr":true},{"t":"note","v":"**Human Female System & Oogenesis**"}]},{"h":"Menstrual Cycle & Hormones","pts":[{"t":"b","v":"The **menstrual cycle** in human females repeats about every 28 days."},{"t":"b","v":"**Ovulation** (release of the egg) occurs around day 14, mid-cycle."},{"t":"b","v":"If no fertilisation occurs, the uterus lining sheds as **menstruation (bleeding)**."},{"t":"b","v":"**Oestrogen and progesterone** are the main female hormones controlling the cycle."},{"t":"b","v":"The cycle starts at puberty (**menarche**) and ends near 45-50 (**menopause**)."}]},{"h":"Fertilisation, Pregnancy & Birth","pts":[{"t":"b","v":"**Fertilisation** is the fusion of one sperm with one egg, forming a zygote."},{"t":"b","v":"In humans fertilisation occurs in the **fallopian tube (oviduct)**."},{"t":"b","v":"The zygote divides repeatedly to form an **embryo** that implants in the uterus."},{"t":"b","v":"The **placenta** supplies the embryo with food and oxygen from the mother."},{"t":"b","v":"Human pregnancy (gestation) lasts about **nine months (280 days)**."},{"t":"b","v":"Birth of the fully formed baby is called **parturition**. **Site of human fertilisation**"}]},{"h":"Sexual Reproduction in Flowering Plants","pts":[{"t":"b","v":"The **flower** is the reproductive organ of a flowering plant."},{"t":"b","v":"The **stamen** (anther + filament) is the male part making pollen grains."},{"t":"b","v":"The **pistil/carpel** (stigma, style, ovary) is the female part holding ovules."},{"t":"b","v":"**Pollination** is the transfer of pollen from the anther to the stigma."},{"t":"b","v":"**Self-pollination** is within the same flower; **crosspollination** is between two flowers."},{"t":"b","v":"Pollen reaching the ovule causes **fertilisation**, and the ovule becomes a seed."},{"t":"table","rows":[["Part","Belongs to","Role"],["Anther","Stamen (male)","Makes pollen"],["Stigma","Pistil (female)","Receives pollen"],["Ovary","Pistil (female)","Holds ovules, becomes fruit"]],"hdr":true},{"t":"note","v":"**Pollination (anther to stigma)**"}]},{"h":"Reproductive Health & Adolescence","pts":[{"t":"b","v":"**Puberty** is when the body becomes capable of reproduction (about 10-14 years)."},{"t":"b","v":"**Secondary sexual characters** appear, e.g. facial hair in boys, breasts in girls."},{"t":"b","v":"**Testosterone** (male) and **oestrogen** (female) drive these changes."},{"t":"b","v":"**Contraception** (birth control) is used to prevent unwanted pregnancy."},{"t":"b","v":"**STDs** like AIDS and syphilis spread through sexual contact."},{"t":"b","v":"A balanced diet, hygiene and awareness support good **reproductive health**."}]}]},{"t":"Genetics & Evolution","S":[{"h":"What is Genetics?","pts":[{"t":"b","v":"**Genetics** is the branch of biology that studies heredity and variation."},{"t":"b","v":"**Heredity** is the passing of features from parents to offspring through reproduction."},{"t":"b","v":"**Variation** means the differences that still exist between parents and offspring; no two children are identical."},{"t":"b","v":"A feature that is inherited (height, eye colour, blood group) is called a **trait**."},{"t":"b","v":"Mendel worked on the garden pea (**Pisum sativum**) from 1856 to 1863."},{"t":"b","v":"Pea was ideal: clear contrasting traits, easy to grow, selfpollinating (pure lines), and many offspring quickly. **What is Genetics?**"}]},{"h":"Basic Terms You Must Know","pts":[{"t":"b","v":"A **gene** is a stretch of DNA carrying the code for one trait; it is the physical unit of heredity."},{"t":"b","v":"Different versions of a gene are called **alleles** (e.g. tall T and dwarf t)."},{"t":"b","v":"A **dominant** allele shows even with one copy and is written in CAPITAL (T)."},{"t":"b","v":"A **recessive** allele is hidden unless both copies are present; written in small letter (t)."},{"t":"b","v":"**Genotype** is the set of alleles carried (TT, Tt, tt); **phenotype** is the visible feature (tall/dwarf)."},{"t":"b","v":"Same alleles (TT or tt) = **homozygous** (pure); different alleles (Tt) = **heterozygous** (hybrid)."},{"t":"b","v":"Body cells carry two copies of each gene, so they are **diploid**."},{"t":"table","rows":[["Term","Meaning"],["Gene","DNA unit coding one trait"],["Allele","Version of a gene (T or t)"],["Dominant","Shows with one copy (T)"],["Recessive","Hidden unless both copies (t)"],["Genotype","Allele set (TT, Tt, tt)"],["Phenotype","Visible feature (tall/dwarf)"],["Homozygous","Same alleles (TT/tt)"],["Heterozygous","Different alleles (Tt)"],["Gregor Mendel","A cross that follows just ONE trait is a monohybrid cross."]],"hdr":true}]},{"h":"Mendel's Monohybrid Cross","pts":[{"t":"b","v":"Pure tall (TT) crossed with pure dwarf (tt) gave an all-tall **F1 generation** (Tt)."},{"t":"b","v":"Self-crossing F1 made dwarf plants reappear in F2, proving traits stay as separate units, not blends."},{"t":"b","v":"Monohybrid F2 **phenotype ratio is 3: 1** (3 tall: 1 dwarf)."},{"t":"b","v":"Monohybrid F2 **genotype ratio is 1: 2: 1** (1 TT: 2 Tt: 1 tt)."},{"t":"b","v":"A **Punnett square** (by Reginald Punnett) is a grid used to predict offspring ratios."},{"t":"b","v":"Generations are labelled **P** (parents), **F1** (first offspring), **F2** (F1 self-cross). **Mendel's Monohybrid Cross**"}]},{"h":"Mendel's Three Laws","pts":[{"t":"b","v":"**Law of Dominance**: in a heterozygote (Tt) only the dominant allele shows."},{"t":"b","v":"**Law of Segregation**: alleles separate during gamete formation, so each gamete gets only ONE allele."},{"t":"b","v":"Segregation is also called the Law of Purity of Gametes."},{"t":"b","v":"**Law of Independent Assortment**: alleles of different genes are inherited independently."},{"t":"b","v":"A **dihybrid cross** (two traits) gives the F2 ratio **9: 3: 3: 1**."},{"t":"table","rows":[["Law","What it states"],["Dominance","Only dominant allele shows in hybrid"],["Segregation","Alleles separate into gametes"],["Independent Different genes inherited Assortment independently"],["Gregor Mendel","Mendel published his work in 1866, but it was ignored."],["Hugo de Vries","In 1900, de Vries, Correns and von Tschermak independently rediscovered his laws."]],"hdr":true}]},{"h":"Exceptions to Simple Dominance","pts":[{"t":"b","v":"**Incomplete dominance**: neither allele fully wins, F1 is a blend (red x white flower gives pink)."},{"t":"b","v":"**Co-dominance**: both alleles express fully and separately, F1 resembles BOTH parents."},{"t":"b","v":"The best example of co-dominance is the human **ABO blood group** (genotype IA IB gives group AB)."},{"t":"b","v":"**Multiple alleles**: a gene has more than two versions in the population (IA, IB, i)."},{"t":"b","v":"**Polygenic inheritance**: one trait controlled by three or more genes whose effects add up."},{"t":"b","v":"Polygenic examples are **human height and skin colour**, giving a continuous range."},{"t":"b","v":"In skin colour, AABBCC is darkest and aabbcc is lightest; each dominant allele adds darkness."},{"t":"table","rows":[["Pattern","Result","Example"],["Incomplete dominance","Blended F1","Pink flower"],["Co-dominance","Both shown","Blood group AB"],["Multiple alleles","3+ versions","IA, IB, i"],["Polygenic","Continuous range","Skin colour, height"]],"hdr":true}]},{"h":"ABO Blood Groups","pts":[{"t":"b","v":"Blood group is controlled by gene **I** with three alleles: IA, IB and i."},{"t":"b","v":"**IA makes A sugar**, IB makes B sugar, and i makes no sugar on red blood cells."},{"t":"b","v":"Both IA and IB are **dominant over i**, but co-dominant with each other."},{"t":"b","v":"There are **6 genotypes but only 4 phenotypes** (A, B, AB, O)."},{"t":"b","v":"Group **O** (genotype ii) is the universal donor; group **AB** is the universal recipient."},{"t":"table","rows":[["Blood Group","Genotype"],["A","IA IA or IA i"],["B","IB IB or IB i"],["AB","IA IB"],["O","i i"]],"hdr":true}]},{"h":"Chromosomes – Where Genes Live","pts":[{"t":"b","v":"**Chromosomes** are thread-like structures in the nucleus made of DNA plus protein."},{"t":"b","v":"The name means 'coloured body', as they stain darkly in a dividing cell."},{"t":"b","v":"The **Chromosomal Theory of Inheritance** was given by Sutton and Boveri (1902)."},{"t":"b","v":"Humans have **46 chromosomes = 23 pairs**."},{"t":"b","v":"**Homologous chromosomes** carry the same genes, one from each parent."},{"t":"b","v":"The **centromere** is the constriction holding the two arms and decides chromosome shape."},{"t":"b","v":"**22 pairs are autosomes**; the 23rd pair (X and Y) are sex chromosomes."},{"t":"table","rows":[["Position of centromere","Chromosome type"],["Middle","Metacentric"],["Slightly off-centre","Sub-metacentric"],["Near one end","Acrocentric"],["At the tip","Telocentric"],["James Francis Crick Watson","DNA is a double helix, modelled by Watson and Crick (1953)."],["Hugo de Vries","Hugo de Vries proposed the Mutation Theory of evolution."]],"hdr":true},{"t":"note","v":"**Chromosomes – Where Genes Live**"}]},{"h":"Sex Determination in Humans","pts":[{"t":"b","v":"Sex is decided by the **23rd pair**, the sex chromosomes."},{"t":"b","v":"Females are **XX** and males are **XY**."},{"t":"b","v":"The **mother always gives an X**; eggs carry only X."},{"t":"b","v":"The **father decides the sex** of the child by giving either an X or a Y sperm."},{"t":"b","v":"X sperm + egg gives a girl (XX); Y sperm + egg gives a boy (XY)."}]},{"h":"DNA, Genetic Material & Mutation","pts":[{"t":"b","v":"**DNA** (deoxyribonucleic acid) is the genetic material that stores hereditary information."},{"t":"b","v":"Its bases pair as **A–T and G–C**; the sequence of bases is the genetic code."},{"t":"b","v":"A **mutation** is a sudden change in the base sequence within a gene."},{"t":"b","v":"Mutation is the ultimate source of new alleles and a major cause of **large-scale diversity** among organisms."},{"t":"b","v":"Agents that cause mutations are called **mutagens** (Xrays, UV rays, certain chemicals)."}]},{"h":"Genetic Disorders","pts":[{"t":"b","v":"**Genetic disorders** are diseases caused by faulty genes or chromosomes, passed to offspring."},{"t":"b","v":"**Haemophilia** (failure of blood clotting) is an X-linked recessive disorder."},{"t":"b","v":"**Colour blindness** (red-green) is also X-linked recessive, commoner in males."},{"t":"b","v":"**Sickle-cell anaemia and thalassaemia** are gene-based blood disorders."},{"t":"b","v":"**Down's syndrome** is caused by an extra chromosome 21 (47 chromosomes)."},{"t":"b","v":"Infectious diseases like cholera, typhoid, malaria and AIDS are NOT genetic diseases."},{"t":"table","rows":[["Disease","Genetic?"],["Haemophilia","Yes"],["Colour blindness","Yes"],["Down's syndrome","Yes"],["Sickle-cell anaemia","Yes"],["Cholera / Malaria","No"]],"hdr":true}]},{"h":"Genetic Engineering & Biotechnology","pts":[{"t":"b","v":"**Genetic engineering** is the deliberate alteration of an organism's DNA to give new traits."},{"t":"b","v":"It is also called **recombinant DNA (rDNA) technology**."},{"t":"b","v":"**Restriction enzymes** act as molecular scissors that cut DNA at specific sites."},{"t":"b","v":"**DNA ligase** joins DNA pieces together (molecular glue)."},{"t":"b","v":"A **vector** carries the desired gene into the host cell; bacterial **plasmids** are common vectors."},{"t":"b","v":"Genetically engineered bacteria now produce **human insulin** (humulin)."},{"t":"b","v":"**GM crops** like Bt cotton are products of genetic engineering. **Bacterial plasmid as genetic engineering vector**"}]},{"h":"Theories of Evolution","pts":[{"t":"b","v":"**Evolution** is the slow change in living organisms over generations to form new species."},{"t":"b","v":"**Lamarck** proposed Inheritance of Acquired Characters (use and disuse of organs)."},{"t":"b","v":"Darwin wrote the book **'On the Origin of Species'** (1859)."},{"t":"b","v":"Modern Darwinism (Neo-Darwinism) combines natural selection with genetics and mutation."},{"t":"table","rows":[["Scientist","Theory / Contribution"],["Lamarck","Inheritance of acquired characters"],["Darwin","Natural selection (Origin of Species)"],["de Vries","Mutation theory"],["Charles Darwin","Charles Darwin proposed Natural Selection, the 'survival of the fittest'."],["Hugo de Vries","Hugo de Vries proposed evolution by sudden mutations."]],"hdr":true}]},{"h":"Evidence & Origin of Life","pts":[{"t":"b","v":"**Fossils** are preserved remains of ancient organisms and the best evidence of evolution."},{"t":"b","v":"**Homologous organs** have the same structure but different functions (human arm, bat wing) and show common ancestry."},{"t":"b","v":"**Analogous organs** have different structure but the same function (bird wing, insect wing)."},{"t":"b","v":"**Vestigial organs** (appendix, ear muscles in humans) are reduced, useless remnants from ancestors."},{"t":"b","v":"**Oparin and Haldane** proposed life arose from chemicals in the early ocean (chemical evolution)."},{"t":"b","v":"The **Miller–Urey experiment** showed organic molecules can form from simple gases."},{"t":"table","rows":[["Organ type","Structure","Function"],["Homologous","Same","Different"],["Analogous","Different","Same"],["Vestigial","Reduced","Lost / useless"]],"hdr":true},{"t":"note","v":"**Evidence & Origin of Life**"}]}]},{"t":"Human Health, Diseases & Immunity","S":[{"h":"Health and Disease: Basics","pts":[{"t":"b","v":"**Health** is a state of complete physical, mental and social well-being, not merely absence of disease (WHO definition)."},{"t":"b","v":"**Disease** (dis-ease) is any condition where the body's normal working is disturbed, shown by symptoms like fever, pain or weakness."},{"t":"b","v":"**Infectious (communicable) diseases** are caused by a germ and spread person-to-person, e.g. cholera, TB, AIDS."},{"t":"b","v":"**Non-infectious (non-communicable) diseases** do not spread; they arise from inside the body, e.g. cancer, diabetes, scurvy."},{"t":"b","v":"The germ that actually causes an infectious disease is called a **pathogen**."},{"t":"b","v":"Normal **human body temperature is 37 degrees C (98.6 degrees F)**."}]},{"h":"Types of Pathogens (Disease-Causing Germs)","pts":[{"t":"b","v":"The five main pathogen groups are **viruses, bacteria, fungi, protozoa and worms (helminths)**."},{"t":"b","v":"Speed rule: **viruses, bacteria and fungi multiply very fast**, while worms multiply very slowly."},{"t":"b","v":"All **viruses live only inside host cells**; bacteria can live and multiply outside cells."},{"t":"b","v":"Key trap: **antibiotics work against bacteria but NOT against viruses**, because viruses lack the life processes antibiotics block."},{"t":"table","rows":[["Pathogen","Example Diseases"],["Virus","Common cold, flu, dengue, polio, AIDS, hepatitis-B"],["Bacteria","Typhoid, cholera, TB, tetanus, anthrax, diphtheria"],["Fungi","Ringworm, athlete's foot, late blight of potato"],["Protozoa","Malaria (Plasmodium), kala-azar"],["Worms","Elephantiasis (filariasis), taeniasis (tapeworm)"]],"hdr":true}]},{"h":"Viruses: Structure and Key Facts","pts":[{"t":"b","v":"A virus is the **smallest germ**, so small it passes through a bacteria-proof filter."},{"t":"b","v":"It is genetic material (**either DNA or RNA, never both**) wrapped in a protein coat called the **capsid**, made of subunits called **capsomeres**."},{"t":"b","v":"A virus is an **obligate parasite** (a nucleoprotein): alive only inside a host, inert outside."},{"t":"b","v":"The name **virus was given by Dmitri Ivanowsky (1892)** while studying tobacco mosaic disease."},{"t":"b","v":"**M.W. Beijerinck (1898)** called it Contagium vivum fluidum; **W.M. Stanley (1935)** crystallised it."},{"t":"b","v":"A **bacteriophage** infects bacteria; the **Hershey-Chase experiment** used it to prove DNA is the genetic material. **Viruses: Structure and Key Facts**"}]},{"h":"How Diseases Spread (Transmission)","pts":[{"t":"b","v":"**Airborne spread**: germs ride in droplets from coughs/sneezes, e.g. common cold, pneumonia, TB."},{"t":"b","v":"**Waterborne spread**: germs enter via dirty water/food, e.g. typhoid and cholera (classic waterborne diseases)."},{"t":"b","v":"**Vector-borne spread**: an insect carrier (vector) ferries the germ; the mosquito is the most important vector."},{"t":"b","v":"**Direct/sexual contact**: STIs like syphilis, gonorrhoea and AIDS spread this way."},{"t":"b","v":"AIDS can also spread via **shared needles, infected blood transfusion, or mother-to-foetus** through the placenta."},{"t":"table","rows":[["Mode","Diseases"],["Air (droplet)","Common cold, pneumonia, TB"],["Water/food","Typhoid, cholera"],["Vector (insect)","Malaria, dengue, filariasis"],["Sexual/blood","Syphilis, gonorrhoea, AIDS"]],"hdr":true},{"t":"note","v":"**Common methods of disease transmission - direct contact, air, indirect contact, food/water, mosquito and rabid animals.**"}]},{"h":"Mosquito Vectors (High-Yield Table)","pts":[{"t":"b","v":"The **female Anopheles** mosquito spreads **malaria**, and also filariasis and encephalitis."},{"t":"b","v":"The **Aedes** (tiger) mosquito spreads **dengue and chikungunya**."},{"t":"b","v":"The **Culex** mosquito spreads **filariasis and Japanese encephalitis**."},{"t":"b","v":"Resting posture clue: **Anopheles sits at an angle (tilted)**; **Culex sits parallel (flat)** to the surface."},{"t":"table","rows":[["Mosquito","Diseases Spread"],["Anopheles (female)","Malaria, filariasis, encephalitis"],["Aedes","Dengue, chikungunya, yellow fever, Zika"],["Culex","Filariasis, Japanese encephalitis"]],"hdr":true}]},{"h":"Important Named Diseases (Exam Tags)","pts":[{"t":"b","v":"**Pneumonia** is an infection of the lungs; air sacs fill with fluid causing cough and breathlessness."},{"t":"b","v":"**Anthrax** (caused by Bacillus anthracis) is called **splenic fever**; it affects cattle and humans."},{"t":"b","v":"**Taeniasis** is intestinal tapeworm infection (Taenia solium, saginata, asiatica); cysts in brain cause **neurocysticercosis**."},{"t":"b","v":"**Malaria** (Plasmodium, via female Anopheles) is treated with **chloroquine/quinine**; quinine comes from **Cinchona bark**."},{"t":"b","v":"**Tetanus (lockjaw)** causes muscle stiffness; treated with antitoxin (ATS) and prevented by vaccine."},{"t":"b","v":"**Haemophilus influenzae** bacterium causes respiratory illness/meningitis; **citrus canker** is a bacterial plant disease."}]},{"h":"Disease - Prevention/Treatment Pairs","pts":[{"t":"b","v":"**Tuberculosis (TB)** is prevented by the **BCG vaccine**."},{"t":"b","v":"**Diphtheria** is covered by the **DPT vaccine** (diphtheria, pertussis, tetanus)."},{"t":"b","v":"**Tetanus** is prevented by vaccine and treated with **antitetanus serum (ATS / antitoxin)**."},{"t":"b","v":"**Malaria** is treated with **chloroquine / quinine**."},{"t":"table","rows":[["Disease","Prevention / Treatment"],["TB","BCG vaccine"],["Diphtheria","DPT vaccine"],["Tetanus","Vaccine + ATS antitoxin"],["Malaria","Chloroquine / quinine"],["Polio","Oral polio vaccine (OPV)"]],"hdr":true}]},{"h":"AIDS and HIV","pts":[{"t":"b","v":"**AIDS = Acquired Immuno-Deficiency Syndrome**, caused by the **Human Immunodeficiency Virus (HIV)**."},{"t":"b","v":"HIV is a **retrovirus** with an **RNA genome** inside an envelope."},{"t":"b","v":"It copies RNA into DNA using the enzyme **reverse transcriptase** ('retro' = ba
