<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biology Flashnotes — BPSC &amp; UPPCS</title>
<style>
:root{
  --ground:#E9EDE6; --paper:#FFFFFF; --raise:#F4F6F1;
  --ink:#201C2E; --muted:#6C6882; --faint:#908CA3;
  --haema:#54459A; --haema-soft:#EAE5F7;
  --eosin:#BF3D66; --eosin-soft:#FBE7ED;
  --chloro:#2C7A4E; --chloro-soft:#E1F2E7;
  --amber:#9A6B12; --amber-soft:#FBF0D8;
  --line:#D5DACE; --line-soft:#E4E8DF;
  --onhaema:#FFFFFF;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
html[data-theme="dark"]{
  --ground:#131519; --paper:#1B1E24; --raise:#22262E;
  --ink:#E9E7F0; --muted:#9C99AD; --faint:#7A7789;
  --haema:#A797EA; --haema-soft:#2A2543;
  --eosin:#EC7F9E; --eosin-soft:#3A2029;
  --chloro:#5FCB8A; --chloro-soft:#16301F;
  --amber:#E3B44C; --amber-soft:#33280F;
  --line:#2C313A; --line-soft:#242830;
  --onhaema:#14121C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%}
strong{font-weight:650}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
input{font:inherit}
:focus-visible{outline:2.5px solid var(--haema); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- header ---------- */
header.top{position:sticky; top:0; z-index:50; background:var(--ground); border-bottom:1px solid var(--line)}
.topin{display:flex; align-items:center; gap:10px; padding:10px 18px; max-width:1180px; margin:0 auto}
.brand{font-family:var(--serif); font-size:1.05rem; font-weight:600; line-height:1.2; margin-right:auto}
.brand small{display:block; font-family:var(--sans); font-size:.66rem; font-weight:500; color:var(--faint); letter-spacing:.04em}
.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--paper)}
.seg button{padding:6px 14px; font-size:.82rem; color:var(--muted); font-weight:550}
.seg button.on{background:var(--haema); color:var(--onhaema)}
.iconbtn{width:34px; height:34px; border-radius:8px; display:grid; place-items:center; border:1px solid var(--line); background:var(--paper); color:var(--muted); font-size:.95rem; flex:none}
.iconbtn:hover{color:var(--ink); border-color:var(--haema)}
.iconbtn.on{background:var(--haema); color:var(--onhaema); border-color:var(--haema)}
.search{flex:none; width:210px; padding:7px 11px; border-radius:9px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:.85rem}
.search::placeholder{color:var(--faint)}
@media(max-width:860px){ .search{width:auto; flex:1; min-width:90px} }
@media(max-width:640px){
  .topin{flex-wrap:wrap; padding:9px 14px; gap:8px}
  .brand{order:1; flex:1 1 auto; margin-right:0; font-size:.98rem}
  .brand small{display:none}
  #bRail,#bTheme{order:2}
  .search{order:3; flex:1 1 120px; width:auto; min-width:0}
  .seg{order:4; flex:none}
  .seg button{padding:7px 16px}
  .rail{top:0}
}

/* ---------- layout ---------- */
.shell{max-width:1180px; margin:0 auto; display:flex; gap:30px; padding:0 18px; align-items:flex-start}
.rail{
  width:252px; flex:none; position:sticky; top:63px; max-height:calc(100vh - 78px);
  overflow-y:auto; padding:16px 0 30px;
}
.railh{font-size:.7rem; color:var(--faint); font-weight:650; margin:0 0 8px; padding-left:9px}
.ch{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 9px; border-radius:8px; font-size:.85rem; color:var(--muted); line-height:1.32}
.ch:hover{background:var(--raise); color:var(--ink)}
.ch.on{background:var(--haema-soft); color:var(--ink); font-weight:600}
html[data-theme="dark"] .ch.on{color:var(--haema)}
.ch .nm{flex:1; min-width:0}
.ch .ct{font-size:.68rem; color:var(--faint); font-variant-numeric:tabular-nums; flex:none}
.dot{width:5px; height:5px; border-radius:50%; flex:none; background:var(--line)}
.dot.part{background:var(--amber)} .dot.full{background:var(--chloro)}
.content{flex:1; min-width:0; padding:18px 0 90px}
@media(max-width:860px){
  .shell{flex-direction:column; gap:0; padding:0 16px}
  .rail{width:100%; position:static; max-height:none; padding:10px 0 4px; display:none}
  .rail.open{display:block}
  .content{padding-top:12px}
}

/* ---------- read mode ---------- */
.chaptitle{font-family:var(--serif); font-size:1.72rem; font-weight:600; letter-spacing:-.015em; margin:0 0 4px; line-height:1.18}
.chapmeta{font-size:.8rem; color:var(--faint); margin:0 0 26px}
.sec{margin:0 0 30px; scroll-margin-top:76px}
.sech{display:flex; align-items:baseline; gap:9px; margin:0 0 11px}
.sech h3{font-family:var(--serif); font-size:1.12rem; font-weight:600; margin:0; flex:1; line-height:1.3}
.sec.quick .sech h3{color:var(--amber)}
.mark{font-size:.95rem; color:var(--line); line-height:1; flex:none}
.mark.on{color:var(--amber)}
.tick{font-size:.8rem; color:var(--line); border:1px solid var(--line); border-radius:6px; width:24px; height:24px; display:grid; place-items:center; flex:none}
.tick.on{background:var(--chloro); border-color:var(--chloro); color:var(--onhaema)}
ul.pts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
ul.pts li{position:relative; padding-left:18px; font-size:.945rem; line-height:1.6; color:var(--muted)}
ul.pts li strong{color:var(--ink)}
ul.pts li::before{content:""; position:absolute; left:1px; top:.63em; width:5px; height:5px; border-radius:50%; background:var(--haema)}
.sec.quick ul.pts li::before{background:var(--amber)}
li.note{padding-left:0!important; font-family:var(--serif); font-size:.92rem; font-style:italic; color:var(--faint); border-left:2px solid var(--line); padding:2px 0 2px 11px!important}
li.note::before{display:none!important}
li.note strong{font-style:normal; color:var(--muted)}
li.tbl{padding:0!important; font-style:normal}
li.tbl::before{display:none!important}

/* tables */
.tw{overflow-x:auto; margin:4px 0 2px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:.86rem; min-width:320px}
th,td{text-align:left; padding:7px 11px; border-bottom:1px solid var(--line-soft); vertical-align:top; line-height:1.45}
th{background:var(--raise); font-weight:650; font-size:.76rem; color:var(--ink); border-bottom:1px solid var(--line)}
td{color:var(--muted)}
td:first-child{color:var(--ink); font-weight:550}
tr:last-child td{border-bottom:0}

/* ---------- recall mode ---------- */
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:26px 24px; min-height:330px; display:flex; flex-direction:column}
.cardtop{display:flex; align-items:center; gap:9px; margin-bottom:16px}
.pill{font-size:.7rem; font-weight:650; color:var(--haema); background:var(--haema-soft); padding:3px 9px; border-radius:5px}
.cardcount{margin-left:auto; font-size:.74rem; color:var(--faint); font-variant-numeric:tabular-nums}
.prompt{font-family:var(--serif); font-size:1.5rem; font-weight:600; line-height:1.32; letter-spacing:-.01em; margin:0 0 6px}
.promptsub{font-size:.78rem; color:var(--faint); margin:0 0 18px}
.hidden{flex:1; display:grid; place-items:center}
.revealbtn{padding:12px 26px; border-radius:10px; border:1px solid var(--haema); color:var(--haema); font-weight:600; font-size:.9rem; background:var(--paper)}
.revealbtn:hover{background:var(--haema); color:var(--onhaema)}
.body{flex:1}
.rate{display:flex; gap:9px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line-soft)}
.rb{flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); font-weight:600; font-size:.88rem; background:var(--paper)}
.rb.know{color:var(--chloro); border-color:var(--chloro)}
.rb.know:hover{background:var(--chloro); color:#fff}
.rb.again{color:var(--eosin); border-color:var(--eosin)}
.rb.again:hover{background:var(--eosin); color:#fff}

/* ---------- shared ---------- */
.toolbar{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 20px; align-items:center}
.chip{padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:.78rem; color:var(--muted)}
.chip:hover{border-color:var(--haema); color:var(--ink)}
.chip.on{background:var(--haema); border-color:var(--haema); color:var(--onhaema); font-weight:550}
.chip b{font-weight:600; opacity:.65; margin-left:4px; font-size:.72rem}
.nb{padding:9px 15px; border-radius:9px; border:1px solid var(--line); font-size:.85rem; font-weight:550; color:var(--muted); background:var(--paper)}
.nb:hover{color:var(--ink); border-color:var(--haema)}
.nb[disabled]{opacity:.35; cursor:not-allowed}
.nb.danger{color:var(--eosin); border-color:var(--eosin)}
.navrow{display:flex; gap:8px; align-items:center; margin-top:16px}
.keyhint{font-size:.68rem; color:var(--faint); margin-left:auto}
@media(max-width:600px){ .keyhint{display:none} }
.empty{text-align:center; padding:60px 20px; color:var(--faint)}
.empty p{font-family:var(--serif); font-size:1.08rem; color:var(--muted); margin:0 0 16px}
mark{background:var(--amber-soft); color:var(--ink); padding:0 2px; border-radius:3px}
.hit{border-bottom:1px solid var(--line-soft); padding:13px 0}
.hitch{font-size:.7rem; color:var(--haema); font-weight:600; margin-bottom:3px}
.hith{font-family:var(--serif); font-size:1rem; font-weight:600; margin-bottom:5px; cursor:pointer}
.hith:hover{color:var(--haema)}
.hitp{font-size:.88rem; color:var(--muted); line-height:1.55; padding-left:13px; border-left:2px solid var(--line); margin-top:5px}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="brand">Biology Flashnotes<small>BPSC &amp; UPPCS · 19 chapters</small></div>
    <input class="search" id="q" type="search" placeholder="Search notes…" autocomplete="off">
    <div class="seg">
      <button id="mRead" class="on">Read</button>
      <button id="mRecall">Recall</button>
    </div>
    <button class="iconbtn" id="bRail" title="Chapters">☰</button>
    <button class="iconbtn" id="bTheme" title="Theme (d)">◐</button>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <div class="content" id="content"></div>
</div>

<script>
const DATA = {"chapters":[{"t":"Cell: Structure & Function","S":[{"h":"What Is a Cell?","pts":[{"t":"b","v":"The **cell** is the smallest unit of life that can survive and carry out all life activities on its own."},{"t":"b","v":"It is called the **basic structural and functional unit of life** – the building block and the smallest working part."},{"t":"b","v":"**Unicellular** organisms have one cell (Amoeba, bacteria) that does everything itself."},{"t":"b","v":"**Multicellular** organisms (humans, plants) are made of many cells with a **division of labour**."},{"t":"b","v":"Inside a cell, tiny **organelles** each handle one special task (energy, waste, etc.)."},{"t":"b","v":"Anything smaller than a cell cannot live independently."}]},{"h":"History & Discovery of the Cell","pts":[{"t":"b","v":"The cell was discovered only after the **microscope** was invented."},{"t":"b","v":"**Robert Brown (1831)** discovered the **nucleus**."},{"t":"b","v":"**Purkinje** coined the term **protoplasm** for the living substance of the cell."},{"t":"table","rows":[["Scientist","Year","Contribution"],["Robert Hooke","1665","Coined 'cell' (dead cork)"],["Leeuwenhoek","1674","First saw living cells"],["Robert Brown","1831","Discovered nucleus"],["Schleiden","1838","All plants are cells"],["Schwann","1839","All animals are cells"],["Virchow","1855","Cells from pre-existing cells"]],"hdr":true}]},{"h":"The Cell Theory","pts":[{"t":"b","v":"**Rudolf Virchow (1855)** showed every cell arises from a pre-existing cell – **Omnis cellula e cellula**."},{"t":"b","v":"Point 1: **All living things are made of cells**."},{"t":"b","v":"Point 2: The **cell is the basic unit of life**."},{"t":"b","v":"Point 3: **Every cell comes from a pre-existing cell**."},{"t":"table","rows":[["M. Schleiden","M. J. Schleiden (1838) stated all plants are made of cells."],["Theodor Schwann","Theodor Schwann (1839) stated all animals are made of cells."]],"hdr":false}]},{"h":"Prokaryotic vs Eukaryotic Cells","pts":[{"t":"b","v":"A **prokaryotic cell** (pro = primitive) has **no membranebound nucleus**; its DNA lies naked in the cytoplasm."},{"t":"b","v":"Examples: **bacteria** and **blue-green algae (cyanobacteria)**."},{"t":"b","v":"Prokaryotes have **no membrane-bound organelles** – no mitochondria or chloroplast, only **ribosomes**."},{"t":"b","v":"Their membrane folds inward to form a **mesosome**, found only in prokaryotes."},{"t":"b","v":"A **eukaryotic cell** (eu = true) has a **true nucleus** enclosed by a nuclear membrane."},{"t":"b","v":"Eukaryotes: all **plants, animals, fungi and protists**."},{"t":"b","v":"Many bacteria carry extra DNA rings called **plasmids**, which give antibiotic resistance and are used in genetic engineering."},{"t":"table","rows":[["Feature","Prokaryotic","Eukaryotic"],["Nucleus","No membrane (naked DNA)","True, membrane-bound"],["Organelles","Absent","Present"],["Size","Small (1-10 µm)","Large (10-100 µm)"],["DNA","Single circular","Linear, many chromosomes"],["Examples","Bacteria, cyanobacteria","Plants, animals, fungi"]],"hdr":true},{"t":"note","v":"**Prokaryotic vs eukaryotic cell compared**"}]},{"h":"Plant Cell vs Animal Cell","pts":[{"t":"b","v":"Both are **eukaryotic** and share nucleus, cytoplasm, mitochondria, ribosomes, ER, Golgi and cell membrane."},{"t":"b","v":"A **plant cell** has a rigid **cell wall** of cellulose outside the membrane."},{"t":"b","v":"Plant cells have green **chloroplasts** for photosynthesis and one **large central vacuole**."},{"t":"b","v":"An **animal cell** has **no cell wall**, no chloroplast and only small or no vacuoles."},{"t":"b","v":"Animal cells have a **centriole** that helps in cell division."},{"t":"b","v":"Plant cells keep a fixed box-like shape; animal cells take many shapes."},{"t":"table","rows":[["Feature","Plant Cell","Animal Cell"],["Cell wall","Present (cellulose)","Absent"],["Chloroplast","Present","Absent"],["Vacuole","One large central","Small or absent"],["Centriole","Absent","Present"],["Shape","Fixed, box-like","Variable"]],"hdr":true},{"t":"note","v":"**Simple comparison: (a) Plant cell and (b) Animal cell – the basic boundaries and parts**"}]},{"h":"Cell Membrane & Cell Wall","pts":[{"t":"b","v":"The **cell membrane (plasma membrane)** is the thin living skin around every cell."},{"t":"b","v":"It is **selectively permeable** – a gatekeeper letting in food and oxygen and pushing out waste."},{"t":"b","v":"Chemically the membrane is made of a **lipid bilayer with proteins** (lipids and proteins)."},{"t":"b","v":"The **cell wall** is a non-living, rigid covering in plants, fungi and bacteria, outside the membrane."},{"t":"b","v":"In plants it is made mainly of **cellulose** and gives shape and protection."},{"t":"b","v":"The young, flexible **primary wall** forms first; a tougher **secondary wall** is added inside as the cell matures. **Fluid mosaic model of cell membrane**"}]},{"h":"Fluid Mosaic Model of the Membrane","pts":[{"t":"b","v":"The structure of the membrane is explained by the **Fluid Mosaic Model** (Singer & Nicolson, 1972)."},{"t":"b","v":"It has a **phospholipid bilayer** with hydrophilic heads outside and hydrophobic tails inside."},{"t":"b","v":"**Proteins float** in or across this layer like a mosaic of tiles."},{"t":"b","v":"'Fluid' means the lipids and proteins can **move sideways**, giving the membrane flexibility."},{"t":"b","v":"**Cholesterol** in animal membranes keeps them stable."}]},{"h":"The Nucleus – Control Centre","pts":[{"t":"b","v":"The **nucleus** is the brain or control centre directing all cell activities."},{"t":"b","v":"It stores the instruction manual of life – the **genes (DNA)**."},{"t":"b","v":"It is wrapped in a double-layered **nuclear envelope** dotted with **nuclear pores** for transport."},{"t":"b","v":"Inside is the **nucleolus**, which makes **ribosomes**."},{"t":"b","v":"DNA winds with protein into thread-like **chromatin**, which condenses into **chromosomes** during division."},{"t":"b","v":"**Humans have 46 chromosomes (23 pairs)**."}]},{"h":"Cytoplasm & Energy Organelles","pts":[{"t":"b","v":"**Cytoplasm** is the jelly-like fluid filling the cell where organelles float and reactions occur."},{"t":"b","v":"**Mitochondria** are the **powerhouse of the cell**, making energy as **ATP** through respiration."},{"t":"b","v":"Mitochondria have their **own DNA**, can self-replicate, and have a folded inner membrane (cristae)."},{"t":"b","v":"**Chloroplasts** contain **chlorophyll** and convert **solar energy into food (and ATP)** by photosynthesis."},{"t":"b","v":"Chloroplasts also have their **own DNA**, which qualifies them for self-replication."},{"t":"b","v":"Mitochondria and chloroplasts are called **semiautonomous organelles**."}]},{"h":"Other Cell Organelles","pts":[{"t":"b","v":"**Ribosomes** are the site of **protein synthesis**; they are the only organelle in prokaryotes."},{"t":"b","v":"The **Endoplasmic Reticulum (ER)** is a network of tubes; **rough ER** (with ribosomes) makes proteins, **smooth ER** makes fats."},{"t":"b","v":"The **Golgi apparatus** packages, modifies and dispatches materials, like a post office."},{"t":"b","v":"**Lysosomes** are the **suicide bags** with digestive enzymes that clear waste and worn-out parts."},{"t":"b","v":"**Vacuoles** store water, food and waste; large in plant cells."},{"t":"b","v":"**Centriole/centrosome** (animal cells) organises fibres during cell division."},{"t":"table","rows":[["Organelle","Main Function"],["Ribosome","Protein synthesis"],["Rough ER","Makes proteins"],["Smooth ER","Makes fats/lipids"],["Golgi body","Packaging & dispatch"],["Lysosome","Digestion (suicide bag)"],["Vacuole","Storage"]],"hdr":true}]},{"h":"Viruses – Living or Non-living?","pts":[{"t":"b","v":"A **virus** is on the borderline of living and non-living – it is **acellular** (not a true cell)."},{"t":"b","v":"It is made of a **nucleic acid core (DNA or RNA) inside a protein coat (capsid)**."},{"t":"b","v":"Viruses have **no enzymes and no cell machinery** of their own."},{"t":"b","v":"Outside a host they behave like **non-living crystals**; inside a host cell they reproduce."},{"t":"b","v":"They are an obligate **intracellular parasite**, depending fully on a host cell."},{"t":"b","v":"Examples of viral diseases: **COVID-19, influenza, AIDS, polio**. **Virus structure**"}]},{"h":"Quick Facts & Exam Points","pts":[{"t":"b","v":"The **cell membrane is composed of lipids and proteins** (biological membranes)."},{"t":"b","v":"**Solar energy is converted into ATP in the chloroplast**."},{"t":"b","v":"**Viruses have no enzymes** in them."},{"t":"b","v":"The **largest cell** is the ostrich egg; the **longest cell** is the nerve cell (neuron)."},{"t":"b","v":"The **smallest cell** is the bacterium **Mycoplasma (PPLO)**."},{"t":"b","v":"**Human RBCs and sieve tube cells lack a nucleus** when mature."}],"quick":1}]},{"t":"Biomolecules & DNA/RNA","S":[{"h":"What are Biomolecules?","pts":[{"t":"b","v":"A **biomolecule** is any carbon-based chemical made by a living cell."},{"t":"b","v":"**Carbon** is the backbone of life because each atom forms **four bonds** and links into long chains."},{"t":"b","v":"Very large biomolecules are called **macromolecules** ('macro' = large)."},{"t":"b","v":"A **polymer** is a long chain made by joining many small repeating units called **monomers**."},{"t":"b","v":"NCERT lists only **three macromolecules** in living systems: proteins, nucleic acids and polysaccharides – all are polymers."},{"t":"b","v":"**Lipids (fats) are NOT true macromolecules**; they are smaller but separate out with big molecules because they sit in membranes."},{"t":"b","v":"A **homopolymer** uses one type of monomer repeated; a **heteropolymer** uses many different monomers."},{"t":"table","rows":[["Biomolecule","Monomer (building block)"],["Carbohydrate (polysaccharide)","Simple sugars (e.g. glucose)"],["Protein","Amino acids (20 types)"],["Nucleic acid (DNA/RNA)","Nucleotides"],["Lipid (fat)","Fatty acids + glycerol"]],"hdr":true}]},{"h":"Elements in the Living Body","pts":[{"t":"b","v":"Living bodies are made mostly of a few **major elements** with smaller amounts of trace elements."},{"t":"b","v":"The four most abundant elements in the human body are **oxygen, carbon, hydrogen and nitrogen**."},{"t":"b","v":"Bulk minerals like **calcium, potassium and sodium** are present in larger amounts than trace metals."},{"t":"b","v":"**Iron (Fe)** is a trace element but vital – it is the metal at the centre of **haemoglobin**."},{"t":"b","v":"**Copper (Cu)** and iron are needed only in tiny (micro) amounts compared to sodium and potassium."},{"t":"b","v":"Increasing order of amount (typical 70 kg man): **Copper < Iron < Potassium < Sodium**."},{"t":"table","rows":[["Element","Amount in body"],["Sodium (Na)","Bulk mineral (more)"],["Potassium (K)","Bulk mineral"],["Iron (Fe)","Trace (less)"],["Copper (Cu)","Trace (least)"]],"hdr":true}]},{"h":"Carbohydrates & Polysaccharides","pts":[{"t":"b","v":"**Carbohydrates** are the body's sugars and starches – quick fuel and stored fuel."},{"t":"b","v":"The smallest unit is a **simple sugar like glucose**; many joined together form a **polysaccharide**."},{"t":"b","v":"**Starch** is the storage carbohydrate in **plants** (e.g. rice, potato)."},{"t":"b","v":"**Glycogen** is the storage carbohydrate in **animals** (stored in liver and muscle)."},{"t":"b","v":"**Cellulose** is a polysaccharide that builds the tough **plant cell wall**."},{"t":"b","v":"**Chitin** forms the **exoskeleton** of arthropods like insects, crabs and prawns."},{"t":"table","rows":[["Polysaccharide","Role","Found in"],["Starch","Energy store","Plants"],["Glycogen","Energy store","Animals (liver/muscle)"],["Cellulose","Structure","Plant cell wall"],["Chitin","Structure","Arthropod shell"]],"hdr":true},{"t":"note","v":"**Carbohydrates & Polysaccharides**"}]},{"h":"Proteins – Workhorses of the Cell","pts":[{"t":"b","v":"A **protein** is a polymer (long chain) of **amino acids**."},{"t":"b","v":"There are **20 types of amino acids**, so a protein is a **heteropolymer**."},{"t":"b","v":"Their order is like alphabets making words – sequence decides which protein it is."},{"t":"b","v":"The first amino acid is the **N-terminal**, the last is the **Cterminal**."},{"t":"b","v":"**Collagen** is the most abundant protein in the **animal world** (skin, bone, connective tissue)."},{"t":"b","v":"**RuBisCO** is the most abundant protein in the whole **biosphere** (works in photosynthesis)."},{"t":"b","v":"**Biuret test**: NaOH + copper sulphate gives a **violet/purple colour** if protein is present."}]},{"h":"Essential vs Non-essential Amino Acids","pts":[{"t":"b","v":"**Essential amino acids** cannot be made by the body and must come from the diet."},{"t":"b","v":"**Non-essential amino acids** can be made by the body itself."},{"t":"b","v":"Protein-rich foods supply essential amino acids: **milk, eggs, fish, meat, pulses (dal), soyabean**."},{"t":"b","v":"**Egg** and milk are 'complete' foods because they contain **all essential amino acids**."},{"t":"b","v":"Examples of amino acids: **alanine, cysteine, proline, tryptophan, lysine**."},{"t":"table","rows":[["Type","Source","Example food"],["Essential","Diet only","Egg, milk, soyabean"],["Non-essential","Body makes it","Synthesised internally"]],"hdr":true}]},{"h":"Four Levels of Protein Structure","pts":[{"t":"b","v":"**Primary structure** = the exact sequence (order) of amino acids in the chain."},{"t":"b","v":"**Secondary structure** = the chain coils into a **helix** or folds into a **beta-pleated sheet**."},{"t":"b","v":"In proteins only **right-handed helices** occur."},{"t":"b","v":"**Tertiary structure** = the whole chain folds like a hollow woollen ball into a 3-D shape."},{"t":"b","v":"Tertiary structure is **essential for the biological activity** of a protein."},{"t":"b","v":"**Quaternary structure** = two or more folded chains join into one working unit."},{"t":"b","v":"**Haemoglobin** (four chains) is the classic example of quaternary structure."},{"t":"table","rows":[["Level","What it means"],["Primary","Sequence of amino acids"],["Secondary","Helix / beta-sheet"],["Tertiary","Full 3-D folded shape"],["Quaternary","Several chains joined"]],"hdr":true},{"t":"note","v":"**Four Levels of Protein Structure**"}]},{"h":"Enzymes – Biological Catalysts","pts":[{"t":"b","v":"A **catalyst** speeds up a reaction but is not used up; an **enzyme** is a biological catalyst."},{"t":"b","v":"Almost all enzymes are **proteins**; a few RNA enzymes exist, called **ribozymes**."},{"t":"b","v":"The **active site** is a pocket where the **substrate** fits like a key in a lock."},{"t":"b","v":"Enzymes act at the **site where they are produced** and work at very high speed."},{"t":"b","v":"Most enzymes are **denatured (damaged) above ~40°C**."},{"t":"b","v":"Exception: **thermophilic** organisms from hot springs have heat-stable enzymes (stable at 80–90°C)."},{"t":"b","v":"Activity depends on **temperature, pH and substrate concentration**, each with an optimum value."},{"t":"table","rows":[["Factor","Effect"],["Temperature","Optimum near 40°C; denatures if higher"],["pH","Each enzyme has an optimum pH"],["Substrate conc.","Rate rises then levels off"]],"hdr":true}]},{"h":"Nucleic Acids – DNA & RNA","pts":[{"t":"b","v":"**Nucleic acids** are the instruction manuals of life that store and pass on genetic information."},{"t":"b","v":"A nucleic acid is a **polymer of nucleotides**."},{"t":"b","v":"Each **nucleotide** = a nitrogen base + a sugar + a phosphate group."},{"t":"b","v":"The two nucleic acids are **DNA** (deoxyribonucleic acid) and **RNA** (ribonucleic acid)."},{"t":"b","v":"DNA stores the master genetic code; RNA helps **read the code and make proteins**."},{"t":"b","v":"The sugar is **deoxyribose in DNA** and **ribose in RNA**."},{"t":"table","rows":[["Feature","DNA","RNA"],["Strands","Double","Single (usually)"],["Sugar","Deoxyribose","Ribose"],["Bases","A, T, G, C","A, U, G, C"],["Role","Stores genes","Makes protein"]],"hdr":true}]},{"h":"Nitrogen Bases & Base Pairing","pts":[{"t":"b","v":"There are **four bases in DNA**: Adenine (A), Thymine (T), Guanine (G), Cytosine (C)."},{"t":"b","v":"In RNA, **Thymine is replaced by Uracil (U)**."},{"t":"b","v":"**Purines** are double-ring bases: **Adenine and Guanine**."},{"t":"b","v":"**Pyrimidines** are single-ring bases: **Cytosine, Thymine, Uracil**."},{"t":"b","v":"Base-pairing rule: **A pairs with T** (A–U in RNA) and **G pairs with C**."},{"t":"b","v":"Pairs are held by **hydrogen bonds** across the two strands."},{"t":"table","rows":[["Class","Bases","Rings"],["Purine","Adenine, Guanine","Two"],["Pyrimidine","Cytosine, Thymine, Uracil","One"]],"hdr":true},{"t":"note","v":"**Nitrogen Bases & Base Pairing**"}]},{"h":"Structure of DNA & Key Discoveries","pts":[{"t":"b","v":"DNA has a **double-helix** shape – two strands twisted like a spiral ladder."},{"t":"b","v":"**Chargaff's rule**: amount of A = T and amount of G = C."},{"t":"b","v":"The two strands are **antiparallel** (run in opposite directions)."},{"t":"b","v":"**Har Gobind Khorana** helped synthesise/decode the genetic code; DNA was first synthesised in vitro by **Arthur Kornberg**."},{"t":"table","rows":[["James Francis Crick Watson","The double-helix model of DNA was proposed by Watson and Crick (1953)."],["Rosalind Franklin","Their model used the X-ray data of Rosalind Franklin and Maurice Wilkins."]],"hdr":false}]},{"h":"Types of RNA, Codons & Protein Synthesis","pts":[{"t":"b","v":"**mRNA** = messenger RNA; it carries the code from DNA to the ribosome."},{"t":"b","v":"**tRNA** = transfer RNA; it brings the correct amino acid to the ribosome."},{"t":"b","v":"**rRNA** = ribosomal RNA; it forms part of the ribosome (the protein factory)."},{"t":"b","v":"A **codon** is a group of **three bases** that codes for one amino acid."},{"t":"b","v":"**Transcription** = DNA copied into mRNA; **translation** = mRNA read to build protein."},{"t":"b","v":"**Stop (non-sense) codons** – UAA, UAG, UGA – code for no amino acid and end the chain."},{"t":"b","v":"**AUG** is the start codon (also codes for methionine)."},{"t":"table","rows":[["RNA type","Function"],["mRNA","Carries genetic message"],["tRNA","Brings amino acids"],["rRNA","Forms the ribosome"]],"hdr":true}]}]},{"t":"Plant Kingdom & Classification","S":[{"h":"Plant Kingdom & Classification Basics","pts":[{"t":"b","v":"The Plant Kingdom is scientifically named **Plantae** and includes every plant from pond-scum to giant trees."},{"t":"b","v":"**Classification** means sorting organisms into groups based on shared features for easy study and naming."},{"t":"b","v":"Almost all plants are **autotrophs** – they make their own food by photosynthesis using sunlight."},{"t":"b","v":"In **binomial nomenclature** each plant gets a genus + species name, e.g. mango = Mangifera indica."},{"t":"b","v":"**R. H. Whittaker (1969)** proposed the Five Kingdom classification, in which plants form kingdom Plantae."},{"t":"b","v":"Plant kingdom order, simplest to advanced: **Algae → Bryophytes → Pteridophytes → Gymnosperms → Angiosperms**."}]},{"h":"The Five Plant Groups Compared","pts":[{"t":"b","v":"**Algae**: simple, water-living, chlorophyll-bearing; body is a thallus with no true root, stem or leaf."},{"t":"b","v":"**Bryophytes** (moss, Marchantia): the amphibians of plants – live on land but need water to reproduce."},{"t":"b","v":"**Pteridophytes** (ferns): first plants with true roots, stem, leaves and a vascular system, but no seeds."},{"t":"b","v":"**Gymnosperms**: seed plants with naked seeds not enclosed in a fruit (gymnos = naked, sperma = seed)."},{"t":"b","v":"**Angiosperms**: flowering plants with seeds enclosed in a fruit; largest and most advanced group."},{"t":"table","rows":[["Group","Vascular?","Seed/Flower"],["Algae","No","No seed, no flower"],["Bryophytes","No","No seed, no flower"],["Pteridophytes","Yes","No seed, no flower"],["Gymnosperms","Yes","Naked seed, no flower"],["Angiosperms","Yes","Seed in fruit, flowers"]],"hdr":true}]},{"h":"Algae and Bryophytes in Detail","pts":[{"t":"b","v":"Algae are classed by **pigment colour** into green, brown and red types."},{"t":"b","v":"**Chlorophyceae** = green algae (Spirogyra); **Phaeophyceae** = brown algae (seaweeds)."},{"t":"b","v":"**Rhodophyceae** = red algae found in deeper sea water."},{"t":"b","v":"Bryophytes cling to soil by thread-like **rhizoids**, which are not true roots."},{"t":"b","v":"Their male organ is the **antheridium** and female organ is the flask-shaped archegonium."},{"t":"b","v":"**Sperm must swim through water** to reach the egg, so bryophytes depend on moisture to reproduce."},{"t":"table","rows":[["Algae class","Colour","Example"],["Chlorophyceae","Green","Spirogyra"],["Phaeophyceae","Brown","Seaweeds"],["Rhodophyceae","Red","Red algae"]],"hdr":true}]},{"h":"Gymnosperms – Naked-Seed Plants","pts":[{"t":"b","v":"Gymnosperms bear **naked seeds** not enclosed inside any fruit."},{"t":"b","v":"Common examples: **Pine, Fir, Spruce, Cedar, Larch, Cypress, Cycas** and the redwood Sequoia."},{"t":"b","v":"Most are **conifers** – cone-bearing hill plants with needlelike leaves."},{"t":"b","v":"Their **needle leaves** have small surface and thick cuticle to reduce water loss."},{"t":"b","v":"**Sequoia** (redwood) is among the tallest and most massive plants on Earth."},{"t":"b","v":"Pine, Fir, Spruce, Cedar, Larch and Cypress are famous **timber-yielding conifers** of India's hills."}]},{"h":"Angiosperms – Dicots vs Monocots","pts":[{"t":"b","v":"A **cotyledon** is the seed-leaf that stores and supplies food to the young sprouting plant."},{"t":"b","v":"The **number of cotyledons** splits flowering plants into dicots and monocots."},{"t":"b","v":"**Dicots** have two cotyledons (gram, pea, mango); a gram seed splits into two halves."},{"t":"b","v":"**Monocots** have one cotyledon (wheat, maize, rice, onion); a wheat grain stays in one piece."},{"t":"b","v":"Dicot floral parts are in **fours or fives**; monocot floral parts are in threes."},{"t":"table","rows":[["Feature","Dicot","Monocot"],["Cotyledons","Two","One"],["Leaf veins","Reticulate (net)","Parallel"],["Root","Tap root","Fibrous"],["Floral parts","4 or 5","3"]],"hdr":true}]},{"h":"The Root System","pts":[{"t":"b","v":"Roots **absorb water and minerals**, anchor the plant firmly, and store reserve food."},{"t":"b","v":"A **tap root** is one main thick root with branches (carrot, mustard), found in dicots."},{"t":"b","v":"A **fibrous root** is a cluster of many thin equal roots (wheat, grass), found in monocots."},{"t":"b","v":"**Adventitious roots** grow from places other than the radicle, e.g. banyan prop roots, maize stilt roots."},{"t":"b","v":"**Root hairs** are fine outgrowths above the tip that actually absorb water and minerals."},{"t":"b","v":"The **root cap** is a thimble-like cover that protects the tender root tip in hard soil."},{"t":"table","rows":[["Root type","Found in","Example"],["Tap root","Dicots","Carrot, mustard"],["Fibrous root","Monocots","Wheat, grass"],["Adventitious","Special cases","Banyan, maize"]],"hdr":true}]},{"h":"The Stem","pts":[{"t":"b","v":"The stem is the upright (ascending) part that bears leaves, flowers and fruits; it grows from the **plumule**."},{"t":"b","v":"Its main jobs are to **hold up the plant** and conduct water and food."},{"t":"b","v":"A **node** is the point where a leaf attaches; the internode is the gap between two nodes."},{"t":"b","v":"A **bud** is a tiny compressed, undeveloped (embryonic) shoot that can grow into a branch or flower."},{"t":"b","v":"A **terminal bud** sits at the stem tip; an axillary bud sits in the leaf axil (armpit)."},{"t":"b","v":"**Nodes, internodes and buds** distinguish a stem from a root; potato and ginger are modified stems."}]},{"h":"The Leaf – Food Factory","pts":[{"t":"b","v":"The leaf is a flat green lateral outgrowth of the stem and the main site of **photosynthesis**."},{"t":"b","v":"Three parts of a typical leaf: the **leaf base, petiole (stalk) and lamina (blade)**."},{"t":"b","v":"The **petiole** holds the blade in light and lets it flutter, cooling it and supplying fresh air."},{"t":"b","v":"The **lamina** is the broad green blade carrying veins, where most food-making happens."},{"t":"b","v":"The central prominent main vein of the lamina is the **midrib**."},{"t":"b","v":"**Venation** is the arrangement of veins – reticulate in dicots, parallel in monocots. **The Leaf – Food Factory**"}]},{"h":"True vs False Fruits & Plant Products","pts":[{"t":"b","v":"A **true fruit** develops only from the ovary after fertilisation (mango, tomato)."},{"t":"b","v":"A **false fruit** develops from a part other than the ovary, like the thalamus – apple, pear, cashew."},{"t":"b","v":"**Clove** is a spice obtained from the dried flower bud of the clove plant."},{"t":"b","v":"**Quinine**, an anti-malarial drug, is obtained from the bark of the Cinchona plant."},{"t":"b","v":"**Tapa cloth** is made from the bark of plants of the mulberry family (Moraceae)."},{"t":"b","v":"Plants give us **food, fodder, fuel, fibre and medicine** from various parts."},{"t":"table","rows":[["Product","Source plant","Plant part"],["Clove","Clove tree","Flower bud"],["Quinine","Cinchona","Bark"],["Saffron","Crocus","Stigma"],["Tapa cloth","Mulberry (Moraceae)","Bark"]],"hdr":true},{"t":"note","v":"**True vs false fruit (apple)**"}]},{"h":"Fungi, Lichens & Spore-formers","pts":[{"t":"b","v":"**Fungi** lack chlorophyll, so they cannot make their own food and are heterotrophic."},{"t":"b","v":"Fungi reproduce by **spore formation**, as do bacteria, algae, ferns and mosses."},{"t":"b","v":"A **lichen** is a symbiosis of a chlorophyll-containing alga with a fungus."},{"t":"b","v":"In a lichen the **alga makes food** while the fungus gives shelter, water and minerals."},{"t":"b","v":"Lichens are sensitive **indicators of air pollution** and do not grow in polluted air. **Lichen (algae-fungus symbiosis)**"},{"t":"note","v":"**Carl Linnaeus / vascular tissue**: A. W. Eichler and others used vascular tissue features to classify plants."}]},{"h":"Insectivorous Plants & Special Adaptations","pts":[{"t":"b","v":"**Insectivorous plants** trap and digest insects to get nitrogen from nitrogen-poor soils."},{"t":"b","v":"Examples include **Pitcher plant (Nepenthes), Venus flytrap, Drosera (sundew) and Utricularia**."},{"t":"b","v":"The **pitcher plant** has a modified leaf shaped like a jug to trap insects."},{"t":"b","v":"These plants are still **green and photosynthetic** – they only supplement nitrogen by eating insects."},{"t":"b","v":"**Parasitic plants** like Cuscuta (dodder) take food from a host plant instead."},{"t":"b","v":"Such traps are examples of **leaf modification** for special functions. **Insectivorous plant (Nepenthes pitcher)**"}]}]},{"t":"Plant Tissues & Anatomy","S":[{"h":"What is a Tissue?","pts":[{"t":"b","v":"A **tissue** is a group of similar cells working together to do one common function."},{"t":"b","v":"The body order in plants is **cell → tissue → organ (root, stem, leaf) → whole plant**."},{"t":"b","v":"Plants are fixed in one place, so they build internal equipment from cells: pipes, packing and support rods."},{"t":"b","v":"The study of the internal structure of a plant is called **anatomy**."},{"t":"b","v":"Plant tissues fall into two broad families: **meristematic** (dividing) and **permanent** (fixed-job) tissue."}]},{"h":"History – Classifying Plants by Tissue","pts":[{"t":"b","v":"Early botanists grouped plants only by outward looks like flower colour and leaf shape."},{"t":"b","v":"The deeper clue is whether a plant has **vascular tissue** (xylem and phloem)."},{"t":"b","v":"**A. P. de Candolle** (Swiss, ~1813) first classified plants by presence or absence of vascular tissue."},{"t":"b","v":"He named two groups: **Vasculares** (with vascular bundles, e.g. ferns, seed plants)."},{"t":"b","v":"And **Cellulares** (without vascular bundles, e.g. algae, mosses)."},{"t":"b","v":"Later systems (Bentham & Hooker, Engler & Prantl) used many features; **de Candolle was the first to use vascular tissue**."}]},{"h":"Meristematic Tissue – the Growth Zones","pts":[{"t":"b","v":"**Meristem** = small, thin-walled cells that keep dividing to make new cells; the plant's cell factory."},{"t":"b","v":"Plants grow only at special spots, not all over at once."},{"t":"b","v":"**Apical meristem** sits at root tips and shoot tips and causes length-wise **primary growth**."},{"t":"b","v":"**Intercalary meristem** lies between mature tissues (base of grass leaves) and regrows grazed/mown parts."},{"t":"b","v":"Apical and intercalary are **primary meristems**; the sidelocated one is the secondary meristem."},{"t":"b","v":"**Lateral (secondary) meristem** is cylindrical and causes thickness, i.e. **secondary growth**."},{"t":"b","v":"An **axillary bud** is left in the leaf axil and can grow into a branch or flower."},{"t":"table","rows":[["Meristem","Location","Function"],["Apical","Root tip, shoot tip","Increases length (primary growth)"],["Intercalary","Base of grass leaves/internodes","Regrows grazed/cut parts"],["Lateral","Sides of stem & root","Increases thickness (secondary growth)"]],"hdr":true},{"t":"note","v":"**Meristematic Tissue – the Growth Zones**"}]},{"h":"Lateral Meristem & Secondary Growth","pts":[{"t":"b","v":"The lateral meristem has two examples: **vascular cambium** and **cork cambium**."},{"t":"b","v":"**Vascular cambium** sits between xylem and phloem."},{"t":"b","v":"It makes new **xylem on the inner side** and new **phloem on the outer side** each year."},{"t":"b","v":"This thickening produces the **annual rings** seen in a cut tree trunk."},{"t":"b","v":"**Cork cambium (phellogen)** forms the protective bark (cork) on the outside of woody stems and roots. **Lateral Meristem & Secondary Growth**"}]},{"h":"Permanent Tissue – Simple vs Complex","pts":[{"t":"b","v":"**Permanent tissue** = mature, specialised cells that have lost the ability to divide."},{"t":"b","v":"They are the finished products of the plant's cell factory, each doing one fixed job for life."},{"t":"b","v":"**Simple permanent tissue** = made of only one type of cell."},{"t":"b","v":"Its three kinds are **parenchyma, collenchyma and sclerenchyma**."},{"t":"b","v":"**Complex permanent tissue** = made of more than one type of cell cooperating."},{"t":"b","v":"Its two kinds are **xylem and phloem**, which together form a vascular bundle."},{"t":"b","v":"Memory trick: **simple = single cell type, complex = combination of cell types**."}]},{"h":"Sclerenchyma","pts":[{"t":"b","v":"**Parenchyma**: living, thin cellulose walls, isodiametric; does photosynthesis, storage and secretion."},{"t":"b","v":"It forms the bulk of cortex, pith and fleshy fruit parts."},{"t":"b","v":"**Chlorenchyma** = parenchyma full of chloroplasts (green leaf mesophyll, does photosynthesis)."},{"t":"b","v":"**Aerenchyma** = parenchyma with big air spaces in water plants; helps them float."},{"t":"b","v":"**Collenchyma**: living cells thickened at the corners with cellulose and pectin; gives flexible support (e.g. celery strings)."},{"t":"b","v":"**Sclerenchyma**: dead cells with thick lignified walls and narrow lumen; gives rigid strength."},{"t":"b","v":"Sclerenchyma comes as long **fibres** (jute, hemp for rope) and stone-like **sclereids** (grit in pear)."},{"t":"b","v":"Exam tip: **parenchyma and collenchyma are living; sclerenchyma is dead**."},{"t":"table","rows":[["Tissue","Living/Dead","Wall & Role"],["Parenchyma","Living","Thin cellulose; storage, photosynthesis"],["Collenchyma","Living","Corner-thickened; flexible support"],["Sclerenchyma","Dead","Thick lignin; rigid strength"]],"hdr":true},{"t":"note","v":"**Simple Tissues – Parenchyma, Collenchyma, Sclerenchyma**"}]},{"h":"Xylem – Water Pipeline","pts":[{"t":"b","v":"**Xylem** carries water and dissolved minerals **upward** from roots to stem and leaves."},{"t":"b","v":"It also adds mechanical strength. Memory aid: in \"X\"ylem, water goes **up**."},{"t":"b","v":"Xylem has four elements: **tracheids, vessels, xylem fibres and xylem parenchyma**."},{"t":"b","v":"**Tracheids**: long, dead, lignified tubes with tapering ends; present in all higher plants."},{"t":"b","v":"**Vessels**: wide, dead tubes with perforated end-walls for fast water flow; typical of angiosperms."},{"t":"b","v":"**Xylem fibres** give support; **xylem parenchyma** (only living element) stores food."},{"t":"b","v":"Three of the four xylem elements are **dead**; only xylem parenchyma is living."},{"t":"table","rows":[["Xylem element","Living/Dead","Role"],["Tracheid","Dead","Conducts water"],["Vessel","Dead","Conducts water fast"],["Xylem fibre","Dead","Support"],["Xylem parenchyma","Living","Food storage"]],"hdr":true},{"t":"note","v":"**Xylem and phloem (vascular tissue)**"}]},{"h":"Phloem – Food Pipeline","pts":[{"t":"b","v":"**Phloem** carries food (sugar made in leaves) to all parts of the plant; this transport is **translocation**."},{"t":"b","v":"Food can move **both up and down** in the phloem, unlike one-way xylem."},{"t":"b","v":"Phloem has four parts: **sieve tubes, companion cells, phloem fibres and phloem parenchyma**."},{"t":"b","v":"**Sieve tubes**: living tube cells with sieve-plate ends that conduct food."},{"t":"b","v":"**Companion cells** control the activity of sieve tubes."},{"t":"b","v":"**Phloem fibres** are the only dead part of phloem; all other phloem cells are living."},{"t":"table","rows":[["Feature","Xylem","Phloem"],["Carries","Water & minerals","Food (sugars)"],["Direction","Upward only","Up and down"],["Mostly","Dead cells","Living cells"]],"hdr":true}]},{"h":"Tissue Systems & Plant Body Plan","pts":[{"t":"b","v":"All plant tissues are grouped into three **tissue systems**."},{"t":"b","v":"**Epidermal (dermal) system**: the outer protective layer with epidermis, stomata, root hairs."},{"t":"b","v":"**Stomata** are tiny leaf pores guarded by **guard cells** for gas exchange and transpiration."},{"t":"b","v":"**Ground tissue system**: all tissue except dermal and vascular; mainly parenchyma for storage and support."},{"t":"b","v":"**Vascular (conducting) system**: the xylem and phloem bundles."},{"t":"b","v":"A waxy waterproof layer called the **cuticle** covers the epidermis of aerial parts to cut water loss."}]},{"h":"Dicot vs Monocot Anatomy","pts":[{"t":"b","v":"**Vascular bundles** are arranged differently in the two flowering-plant groups."},{"t":"b","v":"In a **dicot stem** the bundles form a ring; in a **monocot stem** they are scattered."},{"t":"b","v":"Dicot bundles are **open** (have cambium, so secondary growth occurs); monocot bundles are **closed** (no cambium)."},{"t":"b","v":"**Annual rings** and wood form only where cambium exists (mostly dicots and trees)."},{"t":"b","v":"Dicot leaves show **reticulate (net) venation**; monocot leaves show **parallel venation**."},{"t":"table","rows":[["Feature","Dicot stem","Monocot stem"],["Bundle arrangement","Ring","Scattered"],["Cambium","Present (open)","Absent (closed)"],["Secondary growth","Yes","No"]],"hdr":true}]},{"h":"Stem vs Root & Stem Modifications","pts":[{"t":"b","v":"A **stem** bears nodes, internodes, buds and leaves; a **root** has none of these and bears root hairs."},{"t":"b","v":"**Ginger is a stem (rhizome), not a root**, because it has nodes, scale leaves and buds."},{"t":"b","v":"Stems carry water and minerals up (via xylem) and distribute food to all parts (via phloem)."},{"t":"b","v":"**Underground stems**: rhizome (ginger, turmeric), tuber (potato), bulb (onion), corm (colocasia)."},{"t":"b","v":"Buds are normally found in the **leaf axil and at stem/shoot tips**, confirming a structure is a stem."},{"t":"b","v":"Stems also help in **support, storage and (when green) photosynthesis**. **Underground stem modifications (ginger rhizome)**"}]},{"h":"Edible Plant Parts (Quick Facts)","pts":[{"t":"b","v":"In **mango** the part we eat is the fleshy **mesocarp** (the juicy middle layer of the fruit)."},{"t":"b","v":"Edible part of **potato** = stem tuber; **ginger** = rhizome (stem); **onion** = bulb (modified leaves)."},{"t":"b","v":"Edible part of **carrot and radish** = root; **cabbage** = leaves; **cauliflower** = flower."},{"t":"b","v":"Edible part of **apple and pear** = swollen fleshy thalamus (false fruit), with gritty sclereids in pear."},{"t":"b","v":"These food and fleshy stores are mostly **parenchyma** tissue."},{"t":"table","rows":[["Plant","Edible part"],["Mango","Mesocarp (fruit pulp)"],["Potato","Stem tuber"],["Ginger","Rhizome (stem)"],["Carrot/Radish","Root"],["Onion","Bulb (leaves)"]],"hdr":true}]}]},{"t":"Plant Physiology: Photosynthesis, Respiration & Nutrition","S":[{"h":"What Plant Physiology Studies","pts":[{"t":"b","v":"**Plant physiology** is the study of how a plant's lifeprocesses work inside it."},{"t":"b","v":"A plant works like a **tiny food factory**: leaves are the kitchen, roots are the pumps, stem holds the delivery pipes."},{"t":"b","v":"**Leaves** make food; **roots** absorb water and minerals; **xylem and phloem** transport them."},{"t":"b","v":"Four big life-jobs: **photosynthesis** (making food), **respiration** (getting energy), **nutrition** (minerals), and **transport**."},{"t":"b","v":"Plants that make their own food are **autotrophs**; those that depend on others are **heterotrophs**."}]},{"h":"Photosynthesis – Making Food from Light","pts":[{"t":"b","v":"**Photosynthesis** = making food using light (photo = light, synthesis = making)."},{"t":"b","v":"Green plants use **sunlight, CO2 and water** to make glucose and release oxygen."},{"t":"b","v":"Word equation: **6CO2 + 6H2O + light → C6H12O6 + 6O2**."},{"t":"b","v":"The main product is **glucose** (the food); **oxygen is only a by-product**."},{"t":"b","v":"The released oxygen comes from the **splitting of water**, not from CO2."},{"t":"b","v":"CO2 enters through tiny leaf-pores called **stomata**; water comes from the roots."},{"t":"b","v":"Main site of photosynthesis is the **mesophyll cells of the leaf**."},{"t":"table","rows":[["Raw material","Source"],["Carbon dioxide","Air (through stomata)"],["Water","Soil (absorbed by roots)"],["Sunlight","The Sun"],["Chlorophyll","Green leaf cells"]],"hdr":true}]},{"h":"Chlorophyll and Photosynthetic Pigments","pts":[{"t":"b","v":"**Chlorophyll** is the green pigment that traps sunlight; it sits inside **chloroplasts**."},{"t":"b","v":"Chlorophyll contains the metal **magnesium (Mg)** at its centre."},{"t":"b","v":"**Chlorophyll a** is the chief (main) pigment of photosynthesis."},{"t":"b","v":"**Chlorophyll b and carotenoids** are accessory pigments that capture extra light."},{"t":"b","v":"Chlorophyll absorbs light best in the **blue and red** regions of the spectrum."},{"t":"b","v":"**Green light is reflected** (not absorbed), so leaves look green."},{"t":"b","v":"Chlorophyll is used to **trap and convert light energy** for making food."},{"t":"table","rows":[["Pigment","Role"],["Chlorophyll a","Chief pigment"],["Chlorophyll b","Accessory pigment"],["Carotenoids","Accessory (yellow-orange)"]],"hdr":true}]},{"h":"Light Reaction and Dark Reaction","pts":[{"t":"b","v":"Photosynthesis runs in **two stages** inside the chloroplast."},{"t":"b","v":"**Light reaction** happens on the **thylakoid membranes (grana)** and needs light."},{"t":"b","v":"In the light reaction, water is split (**photolysis**), releasing O2 and storing energy as **ATP and NADPH**."},{"t":"b","v":"**Dark reaction (Calvin cycle)** happens in the **stroma** and fixes CO2 into glucose."},{"t":"b","v":"It is called 'dark' because it **does not directly need light**, not because it needs darkness."},{"t":"b","v":"Two photosystems: **PS I (P700)** and **PS II (P680)**; watersplitting is linked with PS II."},{"t":"table","rows":[["Feature","Light reaction","Dark reaction"],["Place","Thylakoid (grana)","Stroma"],["Needs light","Yes","Not directly"],["Output","ATP, NADPH, O2","Glucose"]],"hdr":true},{"t":"note","v":"**Photosynthesis – light + CO ₂ + water → carbohydrates + O ₂**"}]},{"h":"Factors Affecting Rate of Photosynthesis","pts":[{"t":"b","v":"**Rate of photosynthesis** = how fast a plant makes food; it is not fixed."},{"t":"b","v":"Four main factors: **light intensity, CO2 amount, temperature, and water**."},{"t":"b","v":"More light raises the rate, but only up to a point, then it **plateaus (levels off)**."},{"t":"b","v":"**Blackman's Law of Limiting Factors**: the rate is set by the factor in shortest supply."},{"t":"b","v":"That scarce factor is called the **limiting factor**."},{"t":"b","v":"Very high temperature **damages enzymes** and lowers the rate."},{"t":"table","rows":[["Factor","Effect on rate"],["Light intensity","Rises, then plateaus"],["CO2 level","Rises with more CO2"],["Temperature","Optimum, then falls"],["Water","Shortage lowers rate"]],"hdr":true},{"t":"note","v":"**Factors Affecting Rate of Photosynthesis**"}]},{"h":"Respiration – Releasing Energy from Food","pts":[{"t":"b","v":"**Respiration** is the controlled breakdown of glucose to release energy as ATP."},{"t":"b","v":"Equation: **C6H12O6 + 6O2 → 6CO2 + 6H2O + energy**."},{"t":"b","v":"Respiration is almost the **reverse of photosynthesis**."},{"t":"b","v":"Plants **respire day and night**, but photosynthesise only in light."},{"t":"b","v":"**Aerobic respiration** uses oxygen and gives a lot of energy."},{"t":"b","v":"**Anaerobic respiration (fermentation)** works without oxygen and gives little energy."},{"t":"b","v":"Respiration occurs in the **mitochondria**, the 'powerhouse of the cell'."},{"t":"table","rows":[["Feature","Photosynthesis","Respiration"],["Energy","Stored","Released"],["Oxygen","Released","Used up"],["When","Daytime only","Day and night"],["Site","Chloroplast","Mitochondria"]],"hdr":true}]},{"h":"Why Not Sleep Under Trees at Night","pts":[{"t":"b","v":"In daytime, plants photosynthesise and **release oxygen**."},{"t":"b","v":"At night there is **no photosynthesis**, but respiration continues."},{"t":"b","v":"So at night plants **release carbon dioxide** and use up oxygen."},{"t":"b","v":"This is why it is advised not to sleep under trees at night – **CO2 builds up**."},{"t":"b","v":"Photosynthesis using the **invisible (UV) part** of sunlight is done by some bacteria."}]},{"h":"Plant Nutrition and Mineral Nutrients","pts":[{"t":"b","v":"Plants need two things: **home-made sugar** and **mineral nutrients** from outside."},{"t":"b","v":"Carbon comes from **air (CO2)**; mineral salts come mainly from the **soil**."},{"t":"b","v":"**Macronutrients** (needed in large amounts): N, P, K, Ca, Mg, S."},{"t":"b","v":"**Micronutrients** (needed in tiny amounts): Fe, Mn, Zn, Cu, B, Mo, Cl."},{"t":"b","v":"**Nitrogen (N)** is needed for proteins and chlorophyll; **phosphorus (P)** stimulates early growth and roots."},{"t":"b","v":"**Potassium (K)** helps overall growth and stomatal function."},{"t":"b","v":"Roots absorb nutrients **dissolved in water**."},{"t":"table","rows":[["Nutrient","Main use"],["Nitrogen (N)","Proteins, chlorophyll"],["Phosphorus (P)","Early growth, roots"],["Potassium (K)","Growth, stomata"],["Magnesium (Mg)","Chlorophyll core"]],"hdr":true}]},{"h":"Nitrogen and Special Feeding Relationships","pts":[{"t":"b","v":"Plants cannot use free N2 gas; they take nitrogen as **nitrates (NO3-) and ammonium (NH4+)**."},{"t":"b","v":"**Nitrogen fixation** by Rhizobium bacteria in legume root nodules converts N2 into usable form."},{"t":"b","v":"**Insectivorous plants** (e.g. pitcher plant, Venus flytrap) trap insects to get nitrogen."},{"t":"b","v":"They grow in soil **deficient in nitrogen**."},{"t":"b","v":"**Mycorrhiza** is a root-fungus partnership; the plant gets better **water and mineral absorption**."},{"t":"b","v":"The fungus in turn gets **sugar (food)** from the plant."}]},{"h":"Transport: Xylem and Phloem","pts":[{"t":"b","v":"Plants have two transport tissues: **xylem and phloem**."},{"t":"b","v":"**Xylem** carries water and minerals **upward** from roots to leaves."},{"t":"b","v":"**Phloem** carries food (sugar) from leaves to all parts (**translocation**)."},{"t":"b","v":"Water enters root cells from the soil by **osmosis** (water moving toward more solute)."},{"t":"b","v":"Water enters by the physical process of **diffusion/osmosis**, needing no energy."},{"t":"b","v":"After cutting cucumber and adding salt, water comes out due to **osmosis (exosmosis)**."},{"t":"table","rows":[["Tissue","Carries","Direction"],["Xylem","Water, minerals","Roots to leaves (up)"],["Phloem","Food (sugar)","Leaves to all parts"]],"hdr":true}]},{"h":"Transpiration and Stomata","pts":[{"t":"b","v":"**Transpiration** is the loss of water as vapour from leaves through stomata."},{"t":"b","v":"It creates a **suction pull (transpiration pull)** that lifts water up tall trees."},{"t":"b","v":"This pull, with cohesion of water, lets water **reach great heights** in trees."},{"t":"b","v":"**Stomata** are tiny pores guarded by two **guard cells**."},{"t":"b","v":"Stomata **open when guard cells become turgid** (swell with water) and close when flaccid."},{"t":"b","v":"So stomata open or close due to a change in the **turgidity of guard cells**."}]},{"h":"Stomatal Opening Mechanism","pts":[{"t":"b","v":"Each stoma is bordered by two bean-shaped **guard cells**."},{"t":"b","v":"When water flows in, guard cells become **turgid** and bend apart, opening the pore."},{"t":"b","v":"When water leaves, guard cells go **flaccid** and the pore closes."},{"t":"b","v":"Open stomata allow **CO2 in for photosynthesis** and water vapour out."},{"t":"b","v":"Stomata usually **open in light (day)** and close in the dark."}]},{"h":"Plant Hormones (Phytohormones)","pts":[{"t":"b","v":"**Plant hormones** are chemicals that control growth and responses."},{"t":"b","v":"**Auxin** promotes cell elongation and bending toward light (phototropism)."},{"t":"b","v":"**Gibberellin** promotes stem growth and seed germination."},{"t":"b","v":"**Cytokinin** promotes cell division and delays ageing."},{"t":"b","v":"**Ethylene** is a gas that ripens fruits and causes ageing/leaf fall."},{"t":"b","v":"**Abscisic acid (ABA)** is the stress hormone that closes stomata and causes dormancy."},{"t":"table","rows":[["Hormone","Main function"],["Auxin","Cell elongation, bending"],["Gibberellin","Stem growth, germination"],["Cytokinin","Cell division"],["Ethylene","Fruit ripening"],["Abscisic acid","Stomata close, dormancy"]],"hdr":true}]},{"h":"Fruit Ripening and Cold Storage","pts":[{"t":"b","v":"Fruit ripening is driven by the hormone **ethylene** and by respiration."},{"t":"b","v":"Cold lowers the **rate of respiration and ethylene action**."},{"t":"b","v":"So fruits in a **cold chamber stay fresh longer** (slower ripening and rotting)."},{"t":"b","v":"Low temperature also slows the **growth of spoilage microbes**."},{"t":"b","v":"This is the basic principle behind **cold storage** of fruits and vegetables."}]}]},{"t":"Animal Kingdom, Morphology & Classification","S":[{"h":"Why and How We Classify Life","pts":[{"t":"b","v":"**Classification** is arranging organisms into groups and sub-groups by shared features."},{"t":"b","v":"**Taxonomy** is the science of naming, describing and grouping organisms."},{"t":"b","v":"**Systematics** studies kinds of organisms and the relationships among them."},{"t":"b","v":"Classification makes study easy, shows relationships, and reveals the path of **evolution**."},{"t":"b","v":"The descending order of taxa is **Kingdom > Phylum > Class > Order > Family > Genus > Species**."},{"t":"b","v":"**Species** is the basic (lowest) unit of classification."}]},{"h":"History of Classification – Scientists","pts":[{"t":"b","v":"**Aristotle** made the first scientific classification using morphological characters; called the **Father of Biology**."},{"t":"b","v":"Linnaeus introduced **binomial nomenclature** – a twoword Latin name (Genus + species), e.g. **Homo sapiens**; he is the **Father of Taxonomy**."},{"t":"b","v":"**R. H. Whittaker (1969)** proposed the modern **Five Kingdom classification**."},{"t":"b","v":"Two-kingdom system failed because it mixed **prokaryotes with eukaryotes** and plants with fungi."},{"t":"table","rows":[["Scientist","Contribution"],["Aristotle","Father of Biology; first classification"],["Linnaeus","Two Kingdoms; binomial naming; Father of Taxonomy"],["Whittaker","Five Kingdom system (1969)"],["Carl Linnaeus","Carolus Linnaeus gave the Two Kingdom system: Plantae and Animalia."]],"hdr":true}]},{"h":"Whittaker's Five Kingdoms","pts":[{"t":"b","v":"Whittaker's criteria: **cell structure, body organisation, nutrition, reproduction and evolutionary relationships**."},{"t":"b","v":"**Monera** are prokaryotes (bacteria); **Protista** are unicellular eukaryotes."},{"t":"b","v":"**Fungi** are heterotrophic with a **chitin** cell wall."},{"t":"b","v":"**Plantae** are autotrophic with a **cellulose** cell wall."},{"t":"b","v":"**Animalia** cells have **no cell wall**, so they stay soft and flexible."},{"t":"table","rows":[["Kingdom","Cell","Wall / Nutrition"],["Monera","Prokaryote","Wall present"],["Protista","Eukaryote, unicellular","Mixed nutrition"],["Fungi","Eukaryote","Chitin wall, heterotroph"],["Plantae","Eukaryote","Cellulose wall, autotroph"],["Animalia","Eukaryote","No wall, heterotroph"]],"hdr":true}]},{"h":"Smallest Organisms (Exam Favourites)","pts":[{"t":"b","v":"**Mycoplasma (PPLO)** is the smallest organism capable of autonomous growth and reproduction."},{"t":"b","v":"Mycoplasma has **no cell wall** and is the smallest known living cell."},{"t":"b","v":"**Viruses** are smaller still but are non-living outside a host (need a host to reproduce)."},{"t":"b","v":"Order of size: **bacteria > Mycoplasma/PPLO > virus**."},{"t":"b","v":"**Bacteria** are the smallest true cellular (prokaryotic) organisms."}]},{"h":"Features of Kingdom Animalia","pts":[{"t":"b","v":"All animals are **multicellular eukaryotes** with no cell wall."},{"t":"b","v":"Animals are **heterotrophic** – they eat other organisms as they cannot photosynthesise."},{"t":"b","v":"Stored food is mainly **glycogen or fat**."},{"t":"b","v":"Most animals show **locomotion** and reproduce **sexually**."},{"t":"b","v":"By the backbone, animals split into **Invertebrates** (no backbone) and **Vertebrates** (with backbone)."}]},{"h":"Levels of Organisation","pts":[{"t":"b","v":"**Cellular level** – loose cells with little division of labour, as in **sponges (Porifera)**."},{"t":"b","v":"**Tissue level** – similar cells form tissues, as in **coelenterates (Cnidaria)**."},{"t":"b","v":"**Organ level** – tissues form organs, as in **Platyhelminthes (flatworms)**."},{"t":"b","v":"**Organ-system level** – organs work as systems, as in **annelids, arthropods, molluscs and chordates**."},{"t":"b","v":"Complexity rises in this order, showing an **evolutionary trend**."},{"t":"table","rows":[["Level","Example group"],["Cellular","Porifera (sponges)"],["Tissue","Cnidaria (coelenterates)"],["Organ","Platyhelminthes"],["Organ-system","Annelids, arthropods, chordates"]],"hdr":true}]},{"h":"Body Symmetry","pts":[{"t":"b","v":"**Asymmetrical** – no plane gives equal halves, as in **sponges**."},{"t":"b","v":"**Radial symmetry** – any plane through the central axis gives two identical halves."},{"t":"b","v":"Radial symmetry occurs in **Coelenterata, Ctenophora and adult Echinodermata**."},{"t":"b","v":"**Bilateral symmetry** – only one plane gives matching left and right halves."},{"t":"b","v":"Bilateral symmetry occurs in **annelids, arthropods and chordates** and is more advanced."},{"t":"table","rows":[["Symmetry","Example"],["Asymmetrical","Sponges"],["Radial","Coelenterata, Echinodermata"],["Bilateral","Annelids, arthropods, chordates"]],"hdr":true}]},{"h":"Germ Layers – Diploblastic vs Triploblastic","pts":[{"t":"b","v":"Embryos are built from cell sheets called **germ layers**."},{"t":"b","v":"The outer layer is **ectoderm**; the inner layer is **endoderm**."},{"t":"b","v":"**Diploblastic** animals have two layers (ectoderm + endoderm), e.g. **coelenterates**."},{"t":"b","v":"**Triploblastic** animals have a middle **mesoderm** as well, from flatworms up to chordates."},{"t":"b","v":"**Mesoderm** forms muscles, skeleton, heart and internal organs, allowing complex bodies."},{"t":"table","rows":[["Type","Layers","Example"],["Diploblastic","Ecto + Endoderm","Coelenterates"],["Triploblastic","Ecto + Meso + Endoderm","Flatworms to chordates"]],"hdr":true},{"t":"note","v":"**Germ Layers – Diploblastic vs Triploblastic**"}]},{"h":"Body Cavity (Coelom)","pts":[{"t":"b","v":"A **coelom** is a fluid-filled space between the body wall and the gut."},{"t":"b","v":"**Coelomates** have a true coelom lined by mesoderm – annelids, molluscs, arthropods, echinoderms, chordates."},{"t":"b","v":"**Pseudocoelomates** have a false cavity not lined by mesoderm, e.g. **Aschelminthes (roundworms)**."},{"t":"b","v":"**Acoelomates** have no body cavity, e.g. **Platyhelminthes (flatworms)**."},{"t":"b","v":"The cavity gives room for organs to grow, fold and move, so it is a key classification clue."},{"t":"table","rows":[["Type","Coelom","Example"],["Coelomate","True, mesoderm-lined","Annelids, chordates"],["Pseudocoelomate","False cavity","Roundworms"],["Acoelomate","Absent","Flatworms"]],"hdr":true}]},{"h":"Invertebrate Phyla – Quick Map","pts":[{"t":"b","v":"**Porifera** – sponges; pores and cellular level; asymmetrical."},{"t":"b","v":"**Coelenterata (Cnidaria)** – Hydra, jellyfish, corals; tissue level; diploblastic."},{"t":"b","v":"**Platyhelminthes** – flatworms, tapeworm, liver fluke; flat, acoelomate."},{"t":"b","v":"**Aschelminthes** – roundworms (Ascaris); pseudocoelomate."},{"t":"b","v":"**Annelida** – earthworm, leech; segmented body; true coelom."},{"t":"b","v":"**Arthropoda** – insects, crabs; **largest phylum**; jointed legs and chitin exoskeleton."},{"t":"b","v":"**Mollusca** – snail, octopus; soft body, often shelled; **Echinodermata** – starfish, spiny skin."}]},{"h":"Vertebrate Classes – Quick Map","pts":[{"t":"b","v":"**Pisces (fish)** – gills, fins, cold-blooded, scales."},{"t":"b","v":"**Amphibia** – frogs, toads; live on land and water; moist skin."},{"t":"b","v":"**Reptilia** – snakes, lizards, turtles; dry scaly skin; lay eggs on land."},{"t":"b","v":"**Aves (birds)** – feathers, wings, beak; warm-blooded; lay eggs."},{"t":"b","v":"**Mammalia** – hair, mammary glands; warm-blooded; mostly give birth to young."},{"t":"table","rows":[["Class","Key feature"],["Pisces","Gills, fins, scales"],["Amphibia","Moist skin, dual life"],["Reptilia","Dry scaly skin"],["Aves","Feathers, beak"],["Mammalia","Hair, mammary glands"]],"hdr":true}]},{"h":"Mammals – Special Facts","pts":[{"t":"b","v":"Most mammals give birth to live young, but the **egglaying mammals (monotremes)** are exceptions."},{"t":"b","v":"The **Platypus (duck-billed platypus)** and the **Echidna (spiny anteater)** lay eggs yet feed milk."},{"t":"b","v":"Whales and dolphins are **mammals**, not fish – they breathe air with lungs."},{"t":"b","v":"The **Sperm whale** is the largest of the toothed whales."},{"t":"b","v":"The **Blue whale** is the largest animal ever to have lived."}]},{"h":"Apes and Human Relatives","pts":[{"t":"b","v":"**Apes** (gibbon, orangutan, gorilla, chimpanzee) have no tail, unlike monkeys."},{"t":"b","v":"The **Gibbon** is the smallest man-like ape."},{"t":"b","v":"The **Gorilla** is the largest living ape."},{"t":"b","v":"Humans belong to the order **Primates**, scientific name **Homo sapiens**."},{"t":"b","v":"Chimpanzee is the ape genetically closest to humans. **Apes and Human Relatives**"}]},{"h":"Insects and Useful Products","pts":[{"t":"b","v":"**Honey and beeswax** come from the honeybee."},{"t":"b","v":"**Silk** comes from the silkworm (Bombyx mori)."},{"t":"b","v":"**Lac** (shellac) comes from the lac insect."},{"t":"b","v":"**Cochineal dye** is obtained from the cochineal insect."},{"t":"b","v":"**Pearls are NOT from insects** – they come from oysters (molluscs); a common trick option."},{"t":"table","rows":[["Product","Source insect"],["Honey, wax","Honeybee"],["Silk","Silkworm"],["Lac","Lac insect"],["Cochineal dye","Cochineal insect"],["Pearl (not insect)","Oyster (mollusc)"]],"hdr":true}]},{"h":"Mosquitoes and Disease Vectors","pts":[{"t":"b","v":"**Female Anopheles** spreads malaria and sits with its body tilted, at an angle to the surface."},{"t":"b","v":"**Female Culex** rests with its body parallel to the surface and spreads filaria."},{"t":"b","v":"**Female Aedes** spreads dengue, chikungunya and yellow fever."},{"t":"b","v":"Only **female mosquitoes** bite, as they need blood to develop eggs."},{"t":"b","v":"Aedes has a black-and-white striped body and bites mostly by day."},{"t":"table","rows":[["Mosquito","Disease"],["Anopheles","Malaria"],["Culex","Filaria"],["Aedes","Dengue, yellow fever"]],"hdr":true}]},{"h":"Survival Adaptations","pts":[{"t":"b","v":"The **camel** can live the longest without drinking water and is the ship of the desert."},{"t":"b","v":"The **kangaroo rat** can survive almost entirely on metabolic water from food."},{"t":"b","v":"Camels store fat (not water) in the **hump** for energy."},{"t":"b","v":"**Warm-blooded** (homeothermic) animals keep a steady body temperature; **cold-blooded** ones change with surroundings."},{"t":"b","v":"Desert animals reduce water loss through concentrated urine and dry dung."}]}]},{"t":"Nutrition & Digestive System","S":[{"h":"What is Nutrition?","pts":[{"t":"b","v":"**Nutrition** is the process of taking in food, breaking it down, absorbing it and using it for energy, growth and repair."},{"t":"b","v":"Food is both the body's **fuel** (for energy) and its **building material** (for new and repaired cells)."},{"t":"b","v":"**Digestion** is the breaking of large, complex food molecules into small, simple, **soluble** molecules the blood can absorb."},{"t":"b","v":"**Soluble** means the molecules can dissolve in watery blood and be carried everywhere."},{"t":"b","v":"**Autotrophs** (green plants) make their own food by photosynthesis; **heterotrophs** (animals, humans) must eat others."},{"t":"b","v":"Humans are **heterotrophs** and cannot make their own food."},{"t":"table","rows":[["Type","Meaning","Example"],["Autotroph","Self-feeding (makes food)","Green plants"],["Heterotroph","Feeds on others","Animals, humans"]],"hdr":true},{"t":"note","v":"**What is Nutrition?**"}]},{"h":"Components of Food (Nutrients)","pts":[{"t":"b","v":"There are **six classes of nutrients**: carbohydrates, proteins, fats, vitamins, minerals and water."},{"t":"b","v":"**Carbohydrates** are the main quick-energy food (rice, wheat, sugar, potato); broken down to **glucose**."},{"t":"b","v":"**Proteins** are building material for muscles and tissues (dals, eggs, fish, milk); broken to **amino acids**."},{"t":"b","v":"**Fats (lipids)** store energy and give over **double the energy** of carbohydrates per gram."},{"t":"b","v":"**Vitamins and minerals** are needed in tiny amounts; their lack causes **deficiency diseases**."},{"t":"b","v":"**Water** carries everything and runs every reaction, but gives **zero calories**."},{"t":"b","v":"**Legumes (pulses)** are highly nutritious because they are rich in **proteins**."},{"t":"table","rows":[["Nutrient","Final product","Main source"],["Carbohydrate","Glucose","Rice, wheat, sugar"],["Protein","Amino acids","Dals, eggs, fish"],["Fat","Fatty acids + glycerol","Oils, butter, nuts"]],"hdr":true},{"t":"note","v":"**Components of Food (Nutrients)**"}]},{"h":"Energy Storage & Milk Facts","pts":[{"t":"b","v":"Extra glucose is stored in the **liver and muscles as glycogen**, nicknamed 'animal starch'."},{"t":"b","v":"**Glycogen** is the body's ready energy savings account."},{"t":"b","v":"**Milk** is almost a 'complete food' but lacks **vitamin C** and is low in **iron**."},{"t":"b","v":"Milk is rich in **calcium, protein, fat and vitamin A**."},{"t":"b","v":"A glass of **water gives 0 calories** (no energy value)."},{"t":"table","rows":[["Milk: rich in","Milk: poor in"],["Calcium, protein","Vitamin C"],["Fat, vitamin A","Iron"]],"hdr":true}]},{"h":"Vitamins & Deficiency Diseases","pts":[{"t":"b","v":"**Most vitamins are NOT synthesised in the human body** and must come from diet."},{"t":"b","v":"**Vitamin K** is essential for **blood clotting (coagulation)**."},{"t":"b","v":"**Vitamin A** is essential for **normal vision** (its lack causes night blindness)."},{"t":"b","v":"**Vitamin C** deficiency causes **scurvy**; its richest source is amla (Indian gooseberry)."},{"t":"b","v":"**Vitamin B2 (riboflavin)** deficiency causes **cheilosis / ariboflavinosis**."},{"t":"b","v":"**Vitamin B12** is the **anti-anaemic factor**; vitamin D prevents rickets."},{"t":"table","rows":[["Vitamin","Function / Disease","Rich source"],["A","Vision / Night blindness","Carrot, milk"],["B2 (Riboflavin)","Cheilosis","Cod-liver oil"],["C","Scurvy","Amla, citrus"],["D","Rickets","Sunlight, fish"],["E","Antioxidant","Wheat germ"],["K","Blood clotting","Green leaves"]],"hdr":true}]},{"h":"Enzymes – Helpers of Digestion","pts":[{"t":"b","v":"An **enzyme** is a biological catalyst that speeds up a reaction without being used up."},{"t":"b","v":"Almost all enzymes are **proteins**; a few RNA molecules called **ribozymes** also act as enzymes."},{"t":"b","v":"Each enzyme has an **active site** that fits one **substrate** like a key fits one lock."},{"t":"b","v":"Enzymes are **denatured (destroyed) by high heat** and stop working above about **40°C**."},{"t":"b","v":"Some enzymes need a helper called a **cofactor** (metal ion, prosthetic group or coenzyme)."},{"t":"b","v":"Many coenzymes are made from **vitamins** (e.g. NAD and NADP contain niacin)."},{"t":"b","v":"All true cells have enzymes; the exception is a **virus**, which has no enzymes or metabolism of its own. **Enzymes – Helpers of Digestion**"}]},{"h":"Human Digestive System – Overview","pts":[{"t":"b","v":"The system has two parts: the **alimentary canal** and the **digestive glands**."},{"t":"b","v":"The alimentary canal is one food tube about **9 metres long**, from mouth to anus."},{"t":"b","v":"Order: **mouth → pharynx → oesophagus → stomach → small intestine → large intestine → rectum → anus**."},{"t":"b","v":"The three accessory glands are the **salivary glands, liver (with gall bladder) and pancreas**."},{"t":"b","v":"**Starch digestion starts in the mouth**, protein in the stomach, and all food is finally digested in the small intestine."},{"t":"b","v":"Digestion is a **relay**, passed from organ to organ along the canal."},{"t":"table","rows":[["Organ","Main action"],["Mouth","Starch digestion begins"],["Stomach","Protein digestion begins"],["Small intestine","All food fully digested + absorbed"],["Large intestine","Water absorption"]],"hdr":true},{"t":"note","v":"**Human digestive system**"}]},{"h":"Mouth (Buccal Cavity)","pts":[{"t":"b","v":"Digestion **begins in the mouth**; teeth chew (**mastication**) and the tongue mixes food with saliva."},{"t":"b","v":"Food rolled into a soft, slippery ball is called a **bolus**."},{"t":"b","v":"Teeth set in sockets in the jaw is called **thecodont**; two sets of teeth in life is **diphyodont**."},{"t":"b","v":"Saliva contains **salivary amylase (ptyalin)** and the germ-killing enzyme **lysozyme**."},{"t":"b","v":"**Salivary amylase digests starch into maltose** – the first chemical step of digestion."},{"t":"b","v":"This is why plain bread or rice slowly tastes **sweet** when kept in the mouth."},{"t":"b","v":"Swallowing the bolus is called **deglutition**."},{"t":"table","rows":[["Tooth type","Function"],["Incisors","Cutting, biting"],["Canines","Tearing"],["Premolars","Grinding"],["Molars","Grinding, crushing"]],"hdr":true}]},{"h":"Oesophagus & Peristalsis","pts":[{"t":"b","v":"The **oesophagus (food pipe)** is a muscular tube carrying the bolus to the stomach."},{"t":"b","v":"The oesophagus **does NOT digest food** – it is only a passage."},{"t":"b","v":"Food moves by **peristalsis**: wave-like contractions of the muscular wall."},{"t":"b","v":"**Peristalsis** squeezes food downward and occurs all along the alimentary canal."},{"t":"b","v":"These muscular waves let food move even **against gravity**. **Oesophagus & Peristalsis**"}]},{"h":"Stomach – Protein Digestion Begins","pts":[{"t":"b","v":"**Protein digestion begins in the stomach**."},{"t":"b","v":"The stomach secretes **hydrochloric acid (HCl)**, which kills germs and gives an acidic medium."},{"t":"b","v":"The enzyme **pepsin** digests proteins into smaller peptides."},{"t":"b","v":"**Trypsin and chymotrypsin** are pancreatic enzymes, NOT secreted by the stomach."},{"t":"b","v":"The acid plus enzymes turn food into a semi-liquid paste called **chyme**."},{"t":"b","v":"A layer of **mucus** protects the stomach wall from its own acid."},{"t":"table","rows":[["Stomach secretion","Role"],["HCl","Kills germs, acidic medium"],["Pepsin","Digests protein"],["Mucus","Protects stomach lining"]],"hdr":true}]},{"h":"Liver, Bile & Pancreas","pts":[{"t":"b","v":"The **liver** is the largest gland; it makes **bile**, stored in the **gall bladder**."},{"t":"b","v":"**Bile is received by the small intestine (duodenum)** from the liver."},{"t":"b","v":"Bile **emulsifies fats** (breaks large fat drops into tiny ones) but contains no enzymes."},{"t":"b","v":"**Gallstones** in the gall bladder block bile and affect **fat digestion**."},{"t":"b","v":"The **pancreas** secretes pancreatic juice with **trypsin, lipase and amylase**."},{"t":"b","v":"The liver also stores **glycogen, iron and some vitamins**."},{"t":"table","rows":[["Gland","Secretion","Acts on"],["Liver","Bile","Fats (emulsify)"],["Pancreas","Trypsin","Proteins"],["Pancreas","Lipase","Fats"]],"hdr":true}]},{"h":"Small Intestine – Final Digestion & Absorption","pts":[{"t":"b","v":"The **small intestine** is where ALL food is finally and fully digested."},{"t":"b","v":"It receives **bile from the liver** and **pancreatic juice** in its first part, the duodenum."},{"t":"b","v":"Carbohydrates become **glucose**, proteins become **amino acids**, fats become **fatty acids and glycerol**."},{"t":"b","v":"Its inner wall has tiny finger-like **villi** that hugely increase absorbing surface area."},{"t":"b","v":"**Absorption** of digested food into the blood happens mainly here."},{"t":"b","v":"The human body **cannot digest cellulose** (roughage/fibre), as it lacks the enzyme to break it. **Small Intestine – Final Digestion & Absorption**"}]},{"h":"Large Intestine & Egestion","pts":[{"t":"b","v":"The **large intestine** absorbs mostly **water** from undigested food."},{"t":"b","v":"Undigested matter forms **faeces**, stored in the **rectum**."},{"t":"b","v":"Removal of faeces through the anus is called **egestion (defaecation)**."},{"t":"b","v":"**Cellulose (fibre)** is not digested by humans but adds essential **roughage**."},{"t":"b","v":"Roughage helps the smooth movement of food and prevents **constipation**."}]}]},{"t":"Circulatory System & Body Fluids","S":[{"h":"Why We Need a Circulatory System","pts":[{"t":"b","v":"The **circulatory system** is the body's transport network for trillions of cells."},{"t":"b","v":"It has three parts: the **heart (pump)**, **blood vessels (pipes)** and **blood (fluid)**."},{"t":"b","v":"It delivers **oxygen, nutrients, water and hormones** to every cell."},{"t":"b","v":"It picks up **carbon dioxide** (carried to lungs) and wastes (carried to kidneys)."},{"t":"b","v":"It defends the body using disease-fighting **white blood cells**."},{"t":"b","v":"Deep-lying cells cannot exchange directly with surroundings, so a delivery system is essential."}]},{"h":"Open vs Closed Circulation","pts":[{"t":"b","v":"I
