<title>Physics PYQs · BPSC + UPPCS</title>
<script>try{var t=JSON.parse(localStorage.getItem('bpsc_physics_mcq_v1')||'{}').theme;
document.documentElement.dataset.t=t==='light'?'light':'dark';}catch(e){document.documentElement.dataset.t='dark';}</script>
<style>
:root{
  --bg:#12141a; --bg2:#171a22; --panel:#1c202a; --panel2:#222734; --line:#2c3240; --line2:#3a4254;
  --ink:#e8e4da; --ink2:#a9a396; --ink3:#6f6a60;
  --lapis:#4b7fe0; --orpiment:#e0a33c; --cinnabar:#dd5f4c; --malachite:#44ab88; --violet:#9d72cc;
  --acc:#4b7fe0; --acc-soft:rgba(75,127,224,.13); --acc-line:rgba(75,127,224,.42); --acc-ink:#fff;
  --ok:var(--malachite); --ok-soft:rgba(68,171,136,.14); --no:var(--cinnabar); --no-soft:rgba(221,95,76,.14);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --r:11px; --sh:0 1px 3px rgba(0,0,0,.35); --motif:none; --motif-op:.055;
}
html[data-t="light"]{
  --bg:#f4f1e8; --bg2:#eceadf; --panel:#fffdf7; --panel2:#f6f3ea; --line:#ddd8c8; --line2:#c8c2ae;
  --ink:#22242c; --ink2:#5d5850; --ink3:#8d877c;
  --lapis:#2f5bb5; --orpiment:#a9761a; --cinnabar:#b8422f; --malachite:#1f7a5b; --violet:#6f4a9c;
  --ok-soft:rgba(31,122,91,.11); --no-soft:rgba(184,66,47,.11); --sh:0 1px 3px rgba(60,50,30,.12);
  --motif-op:.07;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.6;
  font-size:16.5px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);position:relative}
body::before{content:'';position:fixed;inset:-170px;z-index:0;pointer-events:none;
  background-image:var(--motif);background-size:160px 160px;opacity:var(--motif-op);
  transition:opacity .5s;animation:drift 90s linear infinite}
@keyframes drift{to{background-position:160px 160px}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 0%,var(--acc-soft),transparent 66%),
             radial-gradient(70% 58% at 6% 96%,var(--acc-soft),transparent 72%);transition:background .5s}
#bgart{position:fixed;right:-5%;bottom:-8%;width:min(920px,94vw);z-index:0;pointer-events:none;
  opacity:var(--art-op);transition:opacity .5s;line-height:0}
#bgart svg{width:100%;height:auto;display:block}
@media(max-width:860px){#bgart{right:-22%;bottom:-4%;width:150vw}}
header,.shell,.exwrap{position:relative;z-index:1}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
.brand{font-size:18px;font-weight:600}.brand em{font-style:normal;color:var(--acc);transition:color .35s}
.bsub{font-size:11.5px;color:var(--ink3);letter-spacing:.5px;margin-top:-3px}
.hstats{margin-left:auto;display:flex;align-items:center;gap:15px;font-size:12.5px;color:var(--ink2)}
.hstat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--ink2);transition:.16s;flex:none}
.iconbtn:hover{border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.bar{height:2px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--acc),var(--malachite));
  transition:width .35s cubic-bezier(.4,0,.2,1),background .35s}

.shell{max-width:1180px;margin:0 auto;padding:20px 18px 90px;display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
aside{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto;scrollbar-width:thin}
aside::-webkit-scrollbar{width:5px}aside::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.slab{font-size:10.5px;letter-spacing:1.3px;color:var(--ink3);text-transform:uppercase;margin:0 0 9px 3px;font-weight:600}
.spine{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.tp{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;text-align:left;width:100%;
  transition:.14s;border:1px solid transparent}
.tp:hover{background:var(--panel)}
.tp.on{background:var(--acc-soft);border-color:var(--acc-line)}
.tp .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tc,var(--line2));opacity:.9}
.tp.on .dot{box-shadow:0 0 0 3px var(--acc-soft)}
.tp .nm{flex:1;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp.on .nm{color:var(--ink)}
.tp .ct{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.tp .acc{font-size:10.5px;font-variant-numeric:tabular-nums;flex:none;min-width:30px;text-align:right}
.tp .acc.g{color:var(--malachite)}.tp .acc.y{color:var(--orpiment)}.tp .acc.r{color:var(--cinnabar)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);transition:.14s}
.chip:hover{border-color:var(--acc-line);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip .n{font-size:10.5px;opacity:.72;margin-left:3px;font-variant-numeric:tabular-nums}

.tools{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tb{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);transition:.14s}
.tb:hover{border-color:var(--acc-line);color:var(--acc)}
.tb.on{color:var(--orpiment);border-color:var(--orpiment);background:rgba(224,163,60,.1)}
.tb.exam{border-color:var(--acc-line);color:var(--acc)}
.tb.exam:hover{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.srch{flex:1;min-width:150px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
  color:var(--ink);font-size:13px;font-family:inherit}
.srch::placeholder{color:var(--ink3)}
.srch:focus{outline:none;border-color:var(--acc-line)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.qhead{display:flex;align-items:center;gap:9px;padding:13px 20px;border-bottom:1px solid var(--line);
  background:var(--panel2);flex-wrap:wrap}
.qno{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:2.5px 9px;border-radius:12px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.tag.exam{border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.qhead .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.tmr{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.4px;min-width:42px;text-align:right}
.tmr.run{color:var(--acc)}
.star{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);transition:.14s}
.star:hover{color:var(--orpiment)}.star.on{color:var(--orpiment)}
.qbody{padding:20px 22px}
.qtext{font-size:18px;line-height:1.52;margin:0 0 18px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-radius:9px;border:1px solid var(--line);
  text-align:left;width:100%;transition:.15s;background:var(--bg2);line-height:1.45}
.opt:hover:not(.lk){border-color:var(--acc-line);background:var(--acc-soft)}
.opt .k{width:23px;height:23px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;
  font-size:12px;color:var(--ink2);flex:none;margin-top:1px}
.opt .tx{flex:1;font-size:15.5px}
.opt.lk{cursor:default}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.opt .mk{font-size:13px;flex:none;margin-top:2px;font-weight:600}
.opt.ok .mk{color:var(--ok)}.opt.no .mk{color:var(--no)}

.exp{margin-top:18px;border-top:1px dashed var(--line2);padding-top:15px;animation:rise .26s ease}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.vd{font-size:14px;margin-bottom:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vd b{font-weight:600}.vd.g b{color:var(--ok)}.vd.r b{color:var(--no)}
.vd .t{color:var(--ink3);font-variant-numeric:tabular-nums}
.exp ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:8px}
.exp li{font-size:15px;line-height:1.56;color:var(--ink2)}
.exp li::marker{color:var(--acc)}
.exp li b{color:var(--ink);font-weight:600}

.nav{display:flex;align-items:center;gap:9px;padding:13px 20px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.nb{padding:8px 16px;border-radius:9px;border:1px solid var(--line);font-size:14px;color:var(--ink2);transition:.15s}
.nb:hover:not(:disabled){border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.nb:disabled{opacity:.32;cursor:not-allowed}
.nb.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nb.pri:hover{filter:brightness(1.12);color:var(--acc-ink)}
.nb.warn{border-color:var(--cinnabar);color:var(--cinnabar)}
.nb.warn:hover{background:var(--no-soft);color:var(--cinnabar)}
.pos{margin:0 auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.empty{padding:60px 24px;text-align:center;color:var(--ink3)}
.empty h3{color:var(--ink2);font-weight:500;font-size:17px;margin:0 0 7px}
.empty p{font-size:14px;margin:0 0 18px}
.keys{margin-top:16px;font-size:11.5px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:5px 14px;padding:0 4px}
kbd{font-family:inherit;border:1px solid var(--line2);border-radius:4px;padding:.5px 5px;font-size:10.5px;color:var(--ink2)}

.exwrap{max-width:1180px;margin:0 auto;padding:20px 18px 90px}
.setup{max-width:640px;margin:10px auto;padding:26px 26px 22px}
.setup h2{font-size:24px;margin:0 0 6px;font-weight:600}
.setup .lead{font-size:14px;color:var(--ink2);margin:0 0 22px;line-height:1.55}
.frow{margin-bottom:18px}
.frow .fl{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;font-weight:600}
.sel{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);
  color:var(--ink);font-family:inherit;font-size:14.5px}
.sel:focus{outline:none;border-color:var(--acc-line)}
.note{font-size:12.5px;color:var(--ink3);margin-top:7px}

.exbar{position:sticky;top:58px;z-index:30;display:flex;align-items:center;gap:14px;padding:11px 16px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;flex-wrap:wrap}
.clock{font-size:21px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.5px;color:var(--acc);line-height:1.1}
.clock.low{color:var(--cinnabar);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.clab{font-size:10.5px;color:var(--ink3);letter-spacing:.7px;text-transform:uppercase}
.exbar .gap{margin-left:auto}
.exgrid{display:grid;grid-template-columns:1fr 226px;gap:18px;align-items:start}
.palwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:136px}
.palhead{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:280px;overflow-y:auto;margin-bottom:12px}
.pb{aspect-ratio:1;border-radius:7px;border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);
  display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:.13s;position:relative}
.pb:hover{border-color:var(--acc)}
.pb.cur{outline:2px solid var(--acc);outline-offset:1px}
.pb.ans{background:var(--ok);border-color:var(--ok);color:#fff}
.pb.skip{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.pb.mark{background:var(--violet);border-color:var(--violet);color:#fff}
.pb.mark.ans::after{content:'';position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--malachite)}
.leg{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink3)}
.leg div{display:flex;align-items:center;gap:7px}
.leg i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line2);flex:none}
.leg i.a{background:var(--ok);border-color:var(--ok)}
.leg i.s{background:var(--no-soft);border-color:var(--no)}
.leg i.m{background:var(--violet);border-color:var(--violet)}

.res{max-width:820px;margin:0 auto}
.score{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center;margin-bottom:16px;box-shadow:var(--sh)}
.score .big{font-size:46px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--acc)}
.score .of{font-size:14.5px;color:var(--ink3);margin-top:3px}
.score .verd{font-size:15px;color:var(--ink2);margin-top:11px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:9px;margin-bottom:18px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 13px}
.sbox .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.sbox .l{font-size:11.5px;color:var(--ink3);margin-top:2px}
.sbox.g .v{color:var(--ok)}.sbox.r .v{color:var(--no)}.sbox.y .v{color:var(--orpiment)}
.brk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.brk h3{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--ink2)}
.brow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.brow .bn{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bb{width:82px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:none}
.brow .bb i{display:block;height:100%;background:var(--ok)}
.brow .bv{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:46px;text-align:right;flex:none}
.rvlist{display:flex;flex-direction:column;gap:12px}

@media(max-width:920px){.exgrid{grid-template-columns:1fr}
  .palwrap{position:static;order:-1}.pal{grid-template-columns:repeat(10,1fr);max-height:170px}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;padding:14px 13px 80px;gap:16px}
  aside{position:static;max-height:none;order:2}main{order:1}
  .hstats{gap:11px;font-size:11.5px}.brand{font-size:16px}
  .qbody{padding:16px 15px}.qhead{padding:11px 15px}.nav{padding:11px 14px}
  .qtext{font-size:17px}.opt .tx{font-size:15px}.exp li{font-size:14.5px}
  .keys{display:none}.nb{padding:8px 13px;font-size:13.5px}
  .exwrap{padding:14px 13px 80px}
  .score .big{font-size:38px}.setup{padding:20px 17px 18px}
  .pal{grid-template-columns:repeat(8,1fr)}
}
@media(max-width:430px){.hstat.hide-s{display:none}}
</style></head><body>
<div id="bgart" aria-hidden="true"></div>

<header>
 <div class="hwrap">
  <div><div class="brand">Physics <em>PYQs</em></div>
   <div class="bsub" id="bsub">BPSC + UPPCS · 144 solved questions</div></div>
  <div class="hstats">
    <div class="hstat hide-s">Seen <b id="sSeen">0</b></div>
    <div class="hstat">Correct <b id="sAcc">—</b></div>
    <div class="hstat hide-s">Avg time <b id="sTime">—</b></div>
    <button class="iconbtn" id="bgBtn" title="Background artwork" aria-label="Background intensity">❖</button>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    <button class="iconbtn" id="reset" title="Reset all progress" aria-label="Reset progress">↺</button>
  </div>
 </div>
 <div class="bar"><i id="bar" style="width:0%"></i></div>
</header>

<div class="shell" id="practiceWrap">
 <aside>
  <div class="slab">Chapters</div>
  <div class="spine" id="spine"></div>
  <div class="keys">
    <span><kbd>1</kbd>–<kbd>5</kbd> answer</span><span><kbd>←</kbd><kbd>→</kbd> move</span>
    <span><kbd>S</kbd> star</span><span><kbd>R</kbd> reveal</span><span><kbd>N</kbd> next unseen</span>
  </div>
 </aside>
 <main>
  <div class="chips" id="modes"></div>
  <div class="tools">
    <input class="srch" id="srch" placeholder="Search questions, answers, explanations…" aria-label="Search">
    <button class="tb" id="shuf">⤮ Shuffle</button>
    <button class="tb" id="jump">↦ Next unseen</button>
    <button class="tb exam" id="goExam">⏱ Exam mode</button>
  </div>
  <div id="stage"></div>
 </main>
</div>

<div class="exwrap" id="examWrap" hidden></div>

<script>
const Q=[{"n":1,"t":"Units","e":"71st BPSC","q":"Energy consumed in a home is 250 units then the total energy in Joule will be:","o":["8 × 10⁶","9 × 10⁵","9 × 10⁸","10⁵"],"a":2,"x":["In electricity billing, <b>1 unit = 1 kilowatt-hour (kWh)</b>, so 250 units = 250 kWh.","Conversion: <b>1 kWh = 3.6 × 10⁶ J</b>.","Total = 250 × 3.6 × 10⁶ = <b>9 × 10⁸ Joules</b>."]},{"n":2,"t":"Units","e":"70th BPSC","q":"The meter that is used to measure the distance moved by the vehicle is known as:","o":["Ammeter","Speedometer","Chronometer","Odometer"],"a":3,"x":["An <b>odometer</b> records the total <b>distance</b> travelled by a vehicle, shown on the dashboard in km or miles.","A <b>speedometer</b> measures speed, an <b>ammeter</b> measures current, and a <b>chronometer</b> measures time precisely."]},{"n":3,"t":"Units","e":"67th BPSC","q":"Which of the following is not a vector quantity?","o":["Velocity","Torque","Displacement","Speed","None of the above/More than one of the above"],"a":3,"x":["<b>Speed</b> is a <b>scalar quantity</b> having only magnitude, with no specified direction.","<b>Velocity</b>, <b>displacement</b> and <b>torque</b> are <b>vector quantities</b>, possessing both magnitude and direction.","Hence speed is the odd one out, as it lacks a directional component."]},{"n":4,"t":"Units","e":"UPPSC 2022","q":"Which of the following pairs is NOT correctly matched? [Quantity – S.I. Unit] (a) Activity of radio-active substance – Curie (b) Power of lens – Diopter (c) Heat – Joule (d) Pressure – Pascal","o":["(a)","(b)","(c)","(d)"],"a":0,"x":["The SI unit of <b>activity of a radioactive substance</b> is the <b>becquerel (Bq)</b>, not the curie, so pair (a) is wrong.","<b>Power of a lens</b> = <b>dioptre (D)</b>, <b>heat</b> = <b>joule (J)</b>, and <b>pressure</b> = <b>pascal (Pa)</b> are all correctly matched.","The <b>curie</b> is an older non-SI unit of radioactivity."]},{"n":5,"t":"Units","e":"66th BPSC","q":"'Light-year' is a unit of","o":["time","speed","distance","intensity of light","None of the above / More than one of the above"],"a":2,"x":["A <b>light-year</b> is the <b>distance</b> travelled by light in vacuum in one Julian year, so it measures length, not time.","It equals about <b>9.46 × 10¹² km</b> (≈ 6 trillion miles), using the speed of light <b>3 × 10⁸ m s⁻¹</b>.","Other astronomical distance units are the <b>astronomical unit (AU)</b> and the <b>parsec (pc)</b>."]},{"n":6,"t":"Units","e":"65th BPSC","q":"The unit of pressure is","o":["kg / cm²","kg / cm","kg / mm","kg / cm³","None of the above / More than one of the above"],"a":4,"x":["<b>Pressure</b> is force per unit area, <b>P = F/A</b>; its SI unit is the <b>pascal (Pa) = N/m²</b>.","In MKS terms this equals <b>kg·m⁻¹·s⁻²</b>; the CGS unit is the <b>barye</b>.","None of kg/cm², kg/cm, kg/mm or kg/cm³ is a correct SI unit of pressure."]},{"n":7,"t":"Units","e":"65th BPSC","q":"Which one of the following is a scalar quantity?","o":["Force","Pressure","Velocity","Acceleration","None of the above / More than one of the above"],"a":1,"x":["A <b>scalar quantity</b> has only <b>magnitude</b> and no direction.","<b>Pressure</b> acts equally in all directions, so it is a scalar.","<b>Force, velocity</b> and <b>acceleration</b> have both magnitude and direction, making them <b>vector quantities</b>."]},{"n":8,"t":"Units","e":"UPPSC 2015","q":"'Pyrheliometer' is used for measuring?","o":["Sun spots","Solar radiation","Air temperature","Temperature of plants"],"a":1,"x":["A <b>pyrheliometer</b> measures <b>direct solar radiation (irradiance)</b> coming straight from the sun, in <b>watts per square metre (W/m²)</b>.","Air temperature is measured by a <b>thermometer</b>, so the other options are incorrect."]},{"n":9,"t":"Units","e":"45th BPSC","q":"Who invented aeroplane?","o":["Wright Brothers","James Watt","Humphrey Davy","Von Braun"],"a":0,"x":["The <b>aeroplane</b> was invented by the <b>Wright Brothers</b> (<b>Orville and Wilbur Wright</b>), who made the first powered, controlled flight on <b>17 December 1903</b>.","<b>James Watt</b> improved the steam engine and <b>Humphry Davy</b> invented the safety lamp, so they are distractors."]},{"n":10,"t":"Units","e":"45th BPSC","q":"Which physical quantity is represented by the ratio of momentum and velocity of the body?","o":["Velocity","Acceleration","Mass","Force"],"a":2,"x":["<b>Momentum (p) = mass (m) × velocity (v)</b>, so <b>mass = momentum / velocity</b>.","<b>Mass</b> is the measure of <b>inertia</b>; its SI unit is the <b>kilogram (kg)</b>.","Velocity and acceleration involve direction/time, and force = mass × acceleration, so they do not fit this ratio."]},{"n":11,"t":"Units","e":"45th BPSC","q":"Which of the following quantities is not a vector?","o":["Displacement","Velocity","Force","Volume"],"a":3,"x":["A <b>vector</b> has both <b>magnitude and direction</b>; displacement, velocity and force all qualify.","<b>Volume</b> has only magnitude (amount of space occupied) and no direction, making it a <b>scalar</b>."]},{"n":12,"t":"Units","e":"45th BPSC","q":"A distance of 1 km means","o":["100 m","1000 cm","1000 m","100 cm"],"a":2,"x":["<b>1 kilometre (km) = 1000 metres (m)</b> by definition of the SI prefix kilo.","1 m = 100 cm, so 1 km = 100000 cm, eliminating the centimetre options."]},{"n":13,"t":"Motion","e":"71st BPSC","q":"We apply a force of 200 Newtons on a wooden Box and push it on the floor at constant velocity. The marginal friction force will be:","o":["200 Newtons","100 Newtons","300 Newtons","400 Newtons"],"a":0,"x":["At <b>constant velocity</b> the box has zero acceleration, so by <b>Newton's First Law</b> the net force is zero.","The applied push must be exactly balanced by the <b>kinetic (sliding) friction</b> acting opposite to motion.","Hence friction force = applied force = <b>200 N</b>."]},{"n":14,"t":"Motion","e":"71st BPSC","q":"A truck starts from rest down a hill with a constant acceleration. It achieves 400 meters in 20 seconds. If the weight of the truck is 7 tons then what will be the force acting on it?","o":["12000 Newtons","11000 Newtons","13000 Newtons","14000 Newtons"],"a":3,"x":["From rest, <b>s = ut + ½at²</b> gives 400 = ½ × a × 20², so <b>a = 2 m/s²</b>.","Mass = 7 tonnes = <b>7000 kg</b>.","By <b>Newton's Second Law</b>, F = ma = 7000 × 2 = <b>14000 N</b>."]},{"n":15,"t":"Motion","e":"70th BPSC","q":"Which of the following is a non-contact force?","o":["Magnetic force","Frictional force","Impact force","None of these"],"a":0,"x":["<b>Magnetic force</b> is a <b>non-contact force</b>; it acts over a distance without physical touch, e.g. a magnet attracting iron.","<b>Frictional force</b> is a contact force arising between surfaces that are touching.","<b>Impact force</b> is a contact force produced during a collision between two objects."]},{"n":16,"t":"Motion","e":"UPPSC 2024","q":"A bus covers the first half of a certain distance with speed v₁ and the second half with a speed v₂. The average speed during the whole journey is:","o":["(2 v₁ v₂)/(v₁+v₂)","(v₁+v₂)/2","(v₁ v₂)/(v₁+v₂)","√(v₁ v₂)"],"a":0,"x":["For equal half-distances, <b>average speed = total distance ÷ total time</b>, not the simple mean of the two speeds.","With each half = d: time = <b>d/v₁ + d/v₂</b>, so average speed = 2d ÷ (d/v₁ + d/v₂).","Simplifying gives the <b>harmonic mean 2v₁v₂/(v₁+v₂)</b>."]},{"n":17,"t":"Motion","e":"68th BPSC","q":"Ball bearings are used to convert static friction into","o":["rolling friction","drag","sliding friction","More than one of the above","None of the above"],"a":0,"x":["<b>Ball bearings</b> use freely moving metal balls that force machine parts to roll over one another instead of sliding.","This replaces high <b>static/sliding friction</b> with much smaller <b>rolling friction</b>, reducing wear and resistance.","<b>Rolling friction</b> is far less than sliding friction, so machines move more smoothly."]},{"n":18,"t":"Motion","e":"68th BPSC","q":"A goalkeeper in a game of football pulls his hands backwards after holding the ball shot at the goal. This enables the goalkeeper to","o":["decrease the rate of change of momentum","exert large force on the ball","increase the force exerted by the ball on hands","More than one of the above","None of the above"],"a":0,"x":["Pulling the hands back <b>increases the time</b> over which the ball is stopped.","By <b>Newton's second law</b>, force equals the <b>rate of change of momentum</b>; a longer time lowers this rate and the force on the hands.","This <b>decreases the rate of change of momentum</b>, protecting the goalkeeper from injury."]},{"n":19,"t":"Motion","e":"68th BPSC","q":"Centripetal force is responsible to","o":["independent motion of the object in space","keep the body moving along the circular path","fly the object along a straight line","More than one of the above","None of the above"],"a":1,"x":["<b>Centripetal force</b> acts on a body moving in a circle and always points <b>towards the centre</b> of the circular path.","It continuously changes the direction of motion, thereby keeping the body <b>moving along the circular path</b>.","The outward-seeming <b>centrifugal force</b> is a pseudo-force; it is not what sustains circular motion."]},{"n":20,"t":"Motion","e":"68th BPSC","q":"A bus is moving along a straight path and takes a sharp turn to the right side suddenly. The passengers sitting on the bus will","o":["bent towards right side","fall in the forward direction","bent towards left side","More than one of the above","None of the above"],"a":2,"x":["Due to <b>inertia of direction</b>, passengers tend to keep moving in their original straight line when the bus turns right.","The required <b>centripetal force</b> acts towards the centre of the turn (right), so the body is thrown to the opposite side.","Therefore passengers are flung outward and <b>bend towards the left side</b>."]},{"n":21,"t":"Motion","e":"67th BPSC","q":"The working principle of a washing machine is","o":["diffusion","centrifugation","dialysis","reverse osmosis","None of the above/More than one of the above"],"a":1,"x":["A washing machine's spin-dry works on <b>centrifugation</b>, where rapid rotation creates <b>centrifugal force</b> that flings water out of wet clothes.","This force separates particles by <b>density and mass</b>, throwing heavier water outward through the drum holes.","<b>Diffusion</b>, <b>dialysis</b> and <b>reverse osmosis</b> are membrane/concentration-based processes, not used for spin drying."]},{"n":22,"t":"Motion","e":"67th BPSC","q":"Who is the first person to define speed?","o":["Newton","Kepler","Ptolemy","Galileo","None of the above/More than one of the above"],"a":3,"x":["<b>Galileo Galilei</b> was the first to measure and define <b>speed</b> as distance covered per unit time.","Speed is thus a <b>scalar quantity</b>, describing magnitude of motion without direction.","<b>Newton</b> gave the laws of motion, <b>Kepler</b> the laws of planetary motion, and <b>Ptolemy</b> the geocentric model – none defined speed."]},{"n":23,"t":"Motion","e":"45th BPSC","q":"What is the correct equation for finding the acceleration?","o":["a = (v − u)/t","a = u + vt","a = (v + u)/t","a = (v + u)/2"],"a":0,"x":["<b>Acceleration</b> is the rate of change of velocity with time.","If velocity changes from initial <b>u</b> to final <b>v</b> in time <b>t</b>, then <b>a = (v − u) / t</b>.","It is a <b>vector quantity</b> with SI unit <b>m s⁻²</b>."]},{"n":24,"t":"Gravitation","e":"69th BPSC","q":"Two objects of different masses falling freely near the surface of the Moon would","o":["have different accelerations","undergo a change in their inertia","have same velocity at any instant","experience forces of same magnitude"],"a":2,"x":["In <b>free fall</b>, acceleration equals <b>acceleration due to gravity (g)</b> and is completely independent of an object's mass.","Starting from rest (u = 0), velocity follows <b>v = gt</b>, so both objects gain the <b>same velocity</b> at any instant.","This rules out different accelerations or unequal forces (heavier mass feels a larger force, but also has more inertia, keeping g constant)."]},{"n":25,"t":"Gravitation","e":"67th BPSC","q":"If the spinning speed of the earth increases, then the weight of the body at the equator will","o":["decrease","remain same","be doubled","increase","None of the above/More than one of the above"],"a":0,"x":["Apparent weight at the equator is reduced by rotation: <b>g' = g − ω²R</b>, where ω is angular speed and R is Earth's radius.","A higher <b>spinning speed (ω)</b> increases the outward centrifugal effect, lowering effective <b>g</b> and thus the body's weight.","The effect is maximum at the <b>equator</b> (zero at the poles), so weight there decreases."]},{"n":26,"t":"Gravitation","e":"67th BPSC","q":"If a feather, a rubber ball, and a wooden ball are falling freely simultaneously from the same height in a vacuum, then","o":["the feather will reach at the ground first","the rubber ball will reach at the ground first","the wooden ball will reach at the ground first","all the three will reach at the ground together","None of the above/More than one of the above"],"a":3,"x":["In a <b>vacuum</b> there is no air, so <b>aerodynamic drag</b> and <b>buoyancy</b> are absent and only <b>gravity</b> acts.","This is <b>free fall</b>, where acceleration equals <b>g (9.8 m/s²)</b> for every object regardless of mass or shape.","Since all bodies fall with the same <b>g</b> from the same height, they take equal time and land together."]},{"n":27,"t":"Energy","e":"71st BPSC","q":"The potential energy of a freely falling body continuously decreases.","o":["The principle of conservation of energy is not violated","The principle of conservation of energy is violated","Gravitational force is violated","Gravitational force is not violated"],"a":0,"x":["As a body falls, its <b>potential energy</b> decreases but its <b>kinetic energy</b> increases by the same amount.","By the <b>Law of Conservation of Energy</b>, total mechanical energy (PE + KE) stays constant.","Energy is merely transformed, not lost, so the principle is <b>not violated</b>."]},{"n":28,"t":"Energy","e":"71st BPSC","q":"A pair of Oxen exerts a force of 140 newton while ploughing the field. The field ploughed is 15 meter long. The work done in ploughing the length of the field is:","o":["2000 Joule","1900 Joule","2100 Joule","2200 Joule"],"a":2,"x":["Work done is given by <b>W = Force × Distance</b> along the direction of force.","Here <b>F = 140 N</b> and <b>d = 15 m</b>.","W = 140 × 15 = <b>2100 Joule</b>."]},{"n":29,"t":"Energy","e":"68th BPSC","q":"Which of the following energy changes involves frictional force?","o":["Kinetic energy to heat energy","Potential energy to sound energy","Chemical energy to heat energy","More than one of the above","None of the above"],"a":0,"x":["<b>Friction</b> between two surfaces opposes relative motion and converts <b>kinetic energy into heat energy</b>.","Rubbing pieces of wood together to start a fire is a classic example of this transformation.","The other pairings (potential to sound, chemical to heat) do not involve frictional force."]},{"n":30,"t":"Energy","e":"UPPSC 2016","q":"In wind power which form of energy is converted into electrical energy?","o":["Kinetic energy","Potential energy","Solar energy","Radiant energy"],"a":0,"x":["In wind power the <b>kinetic energy</b> of moving air is harnessed by <b>wind turbines</b>.","The turbine converts this kinetic energy into <b>mechanical energy</b>, which a <b>generator</b> then turns into electrical energy.","<b>Wind energy</b> is a renewable source; solar, radiant and potential energy are not the form being converted here."]},{"n":31,"t":"Fluids","e":"67th BPSC","q":"A piece of ice is floating in a beaker containing water up to its brim. When the whole of the ice melts","o":["the water will spill on the floor","the level of water will come down in the beaker","the level of water will first fall and then it will spill out of the beaker","the water level will not change","None of the above/More than one of the above"],"a":3,"x":["Floating ice displaces a volume of water whose weight equals the <b>weight of the ice</b> (Archimedes' principle).","On melting, the ice turns into water of exactly the same volume it had displaced.","The displaced volume is precisely replaced, so the <b>water level does not change</b>."]},{"n":32,"t":"Fluids","e":"67th BPSC","q":"The temperature point at which solid, liquid and gaseous states may stay together is known as","o":["boiling point","melting point","freezing point","triple point","None of the above/More than one of the above"],"a":3,"x":["The <b>triple point</b> is the unique temperature and pressure where <b>solid, liquid and gas</b> phases of a substance coexist in equilibrium.","For water it occurs at <b>0.01°C</b> and a pressure of about <b>4.58 mm Hg</b>.","Boiling, melting and freezing points involve only two phases, not all three together."]},{"n":33,"t":"Fluids","e":"66th BPSC","q":"The highest viscosity among the following is of","o":["water","air","blood","honey","None of the above / More than one of the above"],"a":3,"x":["<b>Viscosity</b> is a fluid's internal resistance to flow, measured in <b>pascal-seconds (Pa·s)</b>.","Among the options, <b>honey</b> has by far the highest viscosity, flowing far more slowly than water, blood, or air.","Gases like <b>air</b> have extremely low viscosity, while <b>water</b> and <b>blood</b> are much thinner than honey."]},{"n":34,"t":"Fluids","e":"65th BPSC","q":"Which one of the following quantities does not have unit?","o":["Stress","Force","Strain","Pressure","None of the above / More than one of the above"],"a":2,"x":["<b>Strain</b> is the ratio of change in dimension to original dimension, so it is <b>dimensionless</b> and has no unit.","<b>Stress</b> and <b>pressure</b> are measured in <b>pascal (Pa)</b>, and <b>force</b> in <b>newton (N)</b>.","By <b>Hooke's law</b>, stress is proportional to strain within the elastic limit."]},{"n":35,"t":"Fluids","e":"UPPSC 2016","q":"The velocity of wind is measured by","o":["Barometer","Anemometer","Hydrometer","Wind Vane"],"a":1,"x":["An <b>anemometer</b> measures the <b>velocity (speed) of wind</b>, typically using revolving cups that drive a generator.","<b>Barometer</b> measures atmospheric pressure, <b>hydrometer</b> measures specific gravity, and <b>wind vane</b> shows wind direction."]},{"n":36,"t":"Fluids","e":"UPPSC 2015","q":"Which one of the following denotes water salinity gradient?","o":["Thermocline","Halocline","Pycnocline","Chemocline"],"a":1,"x":["<b>Halocline</b> is the vertical ocean layer where <b>salinity</b> changes rapidly with depth.","It sits below the well-mixed, uniformly saline surface layer.","Distinguish: <b>Thermocline</b> = temperature gradient; <b>Pycnocline</b> = density gradient; <b>Chemocline</b> = chemical gradient."]},{"n":37,"t":"Fluids","e":"UPPSC 2012","q":"When ice melts, then the","o":["volume increases","volume decreases","mass increases","mass decreases"],"a":1,"x":["<b>Ice</b> is less dense than water, so on melting the same mass occupies a smaller space and the <b>volume decreases</b>.","Water shows <b>anomalous expansion</b>: it has maximum density and least volume at <b>4°C</b>.","<b>Mass</b> stays constant during melting; only volume (and hence density) changes."]},{"n":38,"t":"Thermo","e":"UPPSC 2025","q":"Assertion (A): Evaporation of sweat from human skin dissipates body heat. Reason (R): High humidity on a hot day increases discomfort.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A) is true, but (R) is false","(A) is false, but (R) is true","Both (A) and (R) are true, but (R) is not the correct explanation of (A)"],"a":3,"x":["(A) is true: sweat evaporating from skin absorbs the <b>latent heat of vaporisation</b>, cooling the body.","(R) is true: <b>high humidity</b> slows evaporation of sweat, reducing cooling and increasing discomfort.","Both are true, but (R) describes a hindrance to cooling and does not explain the heat-loss mechanism in (A)."]},{"n":39,"t":"Thermo","e":"70th BPSC","q":"Heat transfer that does not require a medium is called:","o":["Radiation","Reflection","Conduction","Convection"],"a":0,"x":["<b>Radiation</b> transfers heat through <b>electromagnetic waves</b> (e.g. infrared) and needs <b>no medium</b>, as with sunlight crossing the vacuum of space.","<b>Conduction</b> needs a solid medium and <b>convection</b> needs a fluid medium, so both are ruled out."]},{"n":40,"t":"Thermo","e":"70th BPSC","q":"Compared to a burn due to air at 100°C, the burn due to steam at 100°C is","o":["Less dangerous due to high latent heat of evaporation","More dangerous due to high latent heat of evaporation","Less dangerous due to low latent heat of evaporation","More dangerous due to low latent heat of evaporation"],"a":1,"x":["Steam at 100°C carries extra energy as the <b>latent heat of vaporization</b> (about <b>540 cal/g</b>) compared with air at the same temperature.","When steam touches skin it <b>condenses</b>, releasing this latent heat into the skin in addition to its 100°C heat, causing far more severe burns.","Air only transfers heat by conduction with no phase change, so steam burns are more dangerous due to high latent heat."]},{"n":41,"t":"Thermo","e":"UPPSC 2024","q":"Assertion (A): Relative humidity decreases with increasing air temperature. Reason (R): Absolute humidity increases with increasing evaporation.","o":["(A) is false, but (R) is true","Both (A) and (R) are true and (R) is the correct explanation of (A)","Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A) is true, but (R) is false"],"a":2,"x":["<b>Assertion is true</b>: <b>relative humidity</b> falls as temperature rises, because warmer air can hold more moisture while the actual vapour stays the same.","<b>Reason is true</b>: <b>absolute humidity</b> (mass of vapour per unit volume) rises with increased <b>evaporation</b>.","But R explains absolute humidity, whereas A depends on <b>temperature</b> – so R is not the correct explanation of A."]},{"n":42,"t":"Thermo","e":"67th BPSC","q":"A fan produces a feeling of comfort during the hot weather because","o":["fan supplies cool air","our body radiates more heat in air","conductivity of air increases","our perspiration evaporates rapidly","None of the above/More than one of the above"],"a":3,"x":["A fan only circulates room air; it does not supply cooler air or change air <b>conductivity</b>.","The moving air speeds up <b>evaporation of perspiration (sweat)</b> from the skin.","Evaporation absorbs <b>latent heat</b> from the body, producing the cooling sensation."]},{"n":43,"t":"Thermo","e":"67th BPSC","q":"Food gets cooked faster in a pressure cooker because","o":["water starts boiling at low temperature due to high pressure","water starts boiling at high temperature due to high pressure","water starts boiling at low temperature due to low pressure","water starts boiling at high temperature due to low pressure","None of the above/More than one of the above"],"a":1,"x":["A pressure cooker traps steam, raising the internal <b>pressure</b> above atmospheric.","Higher pressure raises the <b>boiling point</b> of water from about <b>100°C</b> to nearly <b>120°C</b>.","Cooking at this higher temperature makes food cook much faster."]},{"n":44,"t":"Thermo","e":"67th BPSC","q":"If the doors of a refrigerator are left open for few hours, then the room temperature will","o":["decrease","increase","remain the same","decrease only in the area in the vicinity of the refrigerator","None of the above/More than one of the above"],"a":1,"x":["A refrigerator is a <b>heat pump</b> that pumps heat from inside and exhausts it into the room via the condenser.","By the <b>second law of thermodynamics</b>, it dumps more heat into the room than it removes, since it also adds the work done by the compressor.","With the door open, this net heat is released into the same room, so the room temperature <b>increases</b>."]},{"n":45,"t":"Thermo","e":"UPPSC 2022","q":"In which of the following types of heat engines carburetor is used?","o":["Both diesel and petrol engines","Steam engine","Petrol engine","Diesel engine"],"a":2,"x":["A <b>carburetor</b> mixes <b>air and fuel</b> for combustion in a <b>spark-ignition (petrol) engine</b>.","It atomises petrol into fine droplets, the mix burning via a <b>spark plug</b>.","<b>Diesel engines</b> use no carburetor; fuel is injected into compressed air (<b>compression ignition</b>)."]},{"n":46,"t":"Thermo","e":"66th BPSC","q":"The poorest conductor of heat among the following is","o":["copper","lead","mercury","zinc","None of the above / More than one of the above"],"a":1,"x":["Metals conduct heat via <b>free electrons</b>; more mobile electrons mean better conduction.","<b>Copper</b> and <b>zinc</b> are good conductors, while <b>mercury</b> is a poor one.","<b>Lead</b> has the fewest effective free electrons here, making it the <b>poorest conductor of heat</b>."]},{"n":47,"t":"Thermo","e":"UPPSC 2020","q":"Which of the following is used in a fire alarm?","o":["Photo cell","Water","Solar cell","None of the above"],"a":0,"x":["A <b>photocell</b> (photoelectric smoke detector) is used in a fire alarm to detect <b>smoke</b>.","An <b>LED</b> beam crosses a chamber; smoke deflects the light onto a <b>photosensor</b>, triggering the alarm.","It works on the <b>photoelectric effect</b>, converting light signals into electrical response."]},{"n":48,"t":"Thermo","e":"65th BPSC","q":"The value of 50 °C in Fahrenheit scale is -","o":["104 °F","122 °F","100 °F","75 °F","None of the above / More than one of the above"],"a":1,"x":["Convert using <b>°F = (°C × 1.8) + 32</b>.","Substituting: <b>(50 × 1.8) + 32 = 90 + 32 = 122 °F</b>.","So <b>50 °C</b> equals <b>122 °F</b>."]},{"n":49,"t":"Thermo","e":"UPPSC 2019","q":"Which one of the following is associated with 'Albedo'?","o":["Transmitting power","Absorbing power","Emissive power","Reflecting power"],"a":3,"x":["<b>Albedo</b> is the <b>reflecting power</b> of a surface, i.e. the fraction of incident sunlight reflected without being absorbed.","It is a <b>dimensionless</b> ratio; bright surfaces like <b>sea ice</b> have high albedo, dark surfaces low albedo.","It relates to reflection, not transmission, absorption or emission."]},{"n":50,"t":"Thermo","e":"UPPSC 2019","q":"A liquid remains hot or cold for a long time in thermos flask because there is no loss or gain of heat by","o":["Conduction","Convection and radiation","Both (a) and (b)","None of the above"],"a":2,"x":["A <b>thermos flask</b> (Dewar flask, 1892) prevents heat transfer by all three modes.","The <b>double wall and vacuum</b> stop <b>conduction</b> and <b>convection</b>, while the <b>silvered</b> surfaces stop <b>radiation</b>.","Thus loss/gain occurs by neither conduction nor convection and radiation, keeping the liquid hot or cold for long."]},{"n":51,"t":"Thermo","e":"UPPSC 2016","q":"Which one of the following thermometers is known as a pyrometer?","o":["Thermo-electric thermometers","Radiation thermometers","Gas thermometers","Liquid thermometers"],"a":1,"x":["A <b>pyrometer</b> is a non-contact <b>radiation thermometer</b> that measures temperature from the <b>infrared radiation</b> emitted by a hot body.","It is ideal for measuring very high temperatures of distant or moving objects, such as furnaces.","Thermo-electric, gas and liquid thermometers are contact-type and unsuitable for such conditions."]},{"n":52,"t":"Thermo","e":"UPPSC 2015","q":"Normal temperature of human body is 98.4 °F. Its equivalent temperature in °C is","o":["40.16","36.89","35.72","32.36"],"a":1,"x":["Convert using <b>°C = (°F − 32) × 5/9</b>.","For <b>98.4°F</b>: (98.4 − 32) × 5/9 = 66.4 × 5/9 ≈ <b>36.89°C</b>.","This is the standard normal human body temperature."]},{"n":53,"t":"Thermo","e":"UPPSC 2012","q":"In an earthen pitcher, the water remains cold due to the process of","o":["Condensation","Evaporation","Sublimation","None of the above"],"a":1,"x":["An earthen pitcher keeps water cool by <b>evaporation</b> through its porous walls.","Water seeping out evaporates and draws <b>latent heat of vaporisation</b> from the water inside, lowering its temperature.","Condensation (gas to liquid) and sublimation (solid to vapour) do not occur here."]},{"n":54,"t":"Thermo","e":"UPPSC 2012","q":"Pendulum clocks become slow in summer because","o":["Days in summer are large.","Of the friction in the coil.","The length of the pendulum increases.","The weight of the pendulum changes."],"a":2,"x":["In summer, heat causes <b>thermal expansion</b>, so the <b>length</b> of the pendulum increases.","Time period <b>T = 2π√(l/g)</b>, so T ∝ √l; a longer pendulum has a larger time period and fewer oscillations per day.","The clock therefore runs slow in summer and fast in winter, when the length contracts."]},{"n":55,"t":"Waves","e":"71st BPSC","q":"In which medium, the speed of sound is maximum?","o":["Water","Steel","Air","Hydrogen"],"a":1,"x":["Speed of sound is governed by <b>v = √(E/ρ)</b>, rising with the medium's <b>elasticity</b>.","Sound travels fastest in <b>solids</b>, slower in liquids, and slowest in gases.","<b>Steel</b> (~5000 m/s) far exceeds water (~1500), hydrogen (~1284) and air (~343 m/s)."]},{"n":56,"t":"Waves","e":"UPPSC 2025","q":"Arrange the following electromagnetic radiations in decreasing order of their frequencies: 1. Gamma rays  2. Ultraviolet rays  3. Radio waves  4. X-rays","o":["4, 1, 3, 2","4, 1, 2, 3","1, 4, 2, 3","1, 4, 3, 2"],"a":2,"x":["Frequency is inversely proportional to wavelength, so shortest-wavelength radiation has the highest frequency.","<b>Gamma rays</b> have the highest frequency, followed by <b>X-rays</b>, then <b>Ultraviolet rays</b>.","<b>Radio waves</b> have the longest wavelength and lowest frequency, giving the order 1, 4, 2, 3."]},{"n":57,"t":"Waves","e":"UPPSC 2025","q":"Assertion (A): Voices of men and women are different. Reason (R): Length and thickness of vocal cord is different in men and women.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A) is true, but (R) is false","(A) is false, but (R) is true","Both (A) and (R) are true, but (R) is not the correct explanation of (A)"],"a":0,"x":["(A) is true: adult male voices have a lower <b>pitch (fundamental frequency)</b> than female voices.","(R) is true: after puberty males develop <b>longer and thicker vocal cords</b>, which vibrate more slowly.","Slower vibration means lower frequency, so (R) directly explains (A)."]},{"n":58,"t":"Waves","e":"68th BPSC","q":"Shrillness of sound is determined by","o":["velocity of sound","amplitude of sound","wavelength of sound","More than one of the above","None of the above"],"a":4,"x":["<b>Shrillness (pitch)</b> of sound is determined by its <b>frequency</b> – higher frequency gives a shriller, high-pitched sound.","Since <b>velocity = wavelength × frequency</b> and velocity is constant in a medium, pitch is equally linked to <b>wavelength</b> (inversely).","As both wavelength and frequency validly relate to shrillness, no single listed option is uniquely correct."]},{"n":59,"t":"Waves","e":"68th BPSC","q":"Before playing the orchestra in a musical concert, a sitarist tries to adjust the tension and pluck the string suitably. By doing so, he/she is adjusting","o":["frequency of the sitar string with the frequency of other musical instruments","amplitude of sound","intensity of sound","More than one of the above","None of the above"],"a":0,"x":["Adjusting the <b>tension</b> and plucking of a sitar string changes its <b>frequency</b> (pitch) of vibration.","This tunes the string's frequency to match the <b>frequency of other musical instruments</b> in the orchestra.","<b>Amplitude</b> and <b>intensity</b> relate to loudness, not pitch matching, so they are distractors."]},{"n":60,"t":"Waves","e":"67th BPSC","q":"Which of the following rays/waves are used to know the growth of the fetus in the womb?","o":["X-rays","Microwaves","Ultrasonic waves","Ultraviolet rays","None of the above/More than one of the above"],"a":2,"x":["<b>Ultrasonic waves</b> (ultrasonography) are used to image the <b>fetus</b> in the womb during pregnancy.","The waves reflect at changes in tissue density and are converted into images, making them safe for the unborn baby.","<b>X-rays</b> and <b>ultraviolet rays</b> are harmful radiations, so they are avoided in pregnancy."]},{"n":61,"t":"Waves","e":"UPPSC 2022","q":"In the context of permissible noise level match List-I with List-II. [List-I: A. Residential area, B. Silent zone, C. Industrial area, D. Commercial area | List-II: 1. 50 dB, 2. 55 dB, 3. 65 dB, 4. 70 dB]","o":["A-2, B-1, C-3, D-4","A-3, B-4, C-2, D-1","A-2, B-1, C-4, D-3","A-1, B-2, C-3, D-4"],"a":2,"x":["As per the <b>Noise Pollution (Regulation and Control) Rules, 2000</b>, daytime limits are: <b>Residential – 55 dB</b>, <b>Silent zone – 50 dB</b>, <b>Industrial – 75 dB</b>, <b>Commercial – 65 dB</b>.","Matching the given list: A–2 (55 dB), B–1 (50 dB), C–4 (industrial highest), D–3 (65 dB)."]},{"n":62,"t":"Waves","e":"65th BPSC","q":"Sound wave in air is","o":["transverse","longitudinal","electromagnetic","polarized","None of the above / More than one of the above"],"a":1,"x":["Sound in air is a <b>longitudinal wave</b>: medium particles vibrate <b>parallel</b> to the direction of propagation.","It is a <b>mechanical wave</b> needing a medium, so it cannot be <b>electromagnetic</b> or <b>polarized</b> (polarization needs transverse waves).","It travels as alternate <b>compressions and rarefactions</b>."]},{"n":63,"t":"Waves","e":"65th BPSC","q":"What is measured in hertz?","o":["Frequency","Energy","Heat","Quality","None of the above / More than one of the above"],"a":0,"x":["<b>Hertz (Hz)</b> is the SI unit of <b>frequency</b> – the number of cycles of a repeating event per second.","It relates to period by the formula <b>f = 1/T</b>.","Energy and heat are measured in <b>joule (J)</b>, not hertz, ruling out those options."]},{"n":64,"t":"Waves","e":"UPPSC 2018","q":"Sound will have the highest velocity in","o":["Vacuum","Air","Water","Steel"],"a":3,"x":["The <b>speed of sound</b> depends on the medium's <b>elasticity</b> and <b>density</b>, and is highest in <b>solids</b>.","In <b>steel</b> it is about <b>5970 m/s</b>, far above <b>water (~1433 m/s)</b> and <b>air (~343 m/s)</b>.","Sound cannot travel through a <b>vacuum</b>, where its speed is zero."]},{"n":65,"t":"Waves","e":"UPPSC 2018","q":"Which of the following represents the decibel level of rustling of tree leaves in normal circumstances?","o":["10 db","20 db","60 db","100 db"],"a":1,"x":["Sound level is measured in <b>decibels (dB)</b>, a logarithmic unit where +10 dB means 10 times more intense sound.","Rustling of tree leaves is about <b>20 dB</b>; a whisper is around 30 dB and normal conversation about 60 dB."]},{"n":66,"t":"Waves","e":"UPPSC 2017","q":"An artificial satellite can be tracked very precisely from the earth by using","o":["Doppler effect","Radar","Sonar","Pulsar"],"a":0,"x":["The <b>Doppler effect</b> is the change in observed <b>frequency</b> due to relative motion between source and observer.","A satellite's frequency shift lets its <b>velocity and position</b> be tracked very precisely from Earth.","<b>Radar</b> ranges objects and <b>sonar</b> uses sound underwater, but Doppler shift gives the precise tracking."]},{"n":67,"t":"Waves","e":"UPPSC 2017","q":"Television viewers using dish antenna to receive satellite signals do not receive signals in rain because: 1. of the small size antenna. 2. rain droplets absorb the energy of radio waves. 3. rain droplets disperse the energy of radio waves from their original direction. Which of the above statements are correct?","o":["Only 1","Only 1 and 2","Only 2 and 3","1, 2 and 3"],"a":3,"x":["Satellite TV is sent in the <b>microwave band</b>, which is weakened heavily by rain (<b>Rain Fade</b>).","<b>Rain droplets absorb</b> and also <b>scatter (disperse)</b> the radio-wave energy from its path, cutting the received signal.","The relatively <b>small dish antenna</b> collects limited power, so any loss leaves too weak a signal, validating all three statements."]},{"n":68,"t":"Waves","e":"UPPSC 2014","q":"Sound waves do not travel in ____________.","o":["Solids","Liquids","Gases","Vacuum"],"a":3,"x":["<b>Sound waves</b> are <b>mechanical longitudinal waves</b> that need a material medium of vibrating particles to travel.","A <b>vacuum</b> has no particles, so it cannot carry the compressions and rarefactions of sound.","Sound travels through <b>solids</b>, <b>liquids</b> and <b>gases</b>, being fastest in solids due to closely packed particles."]},{"n":69,"t":"Waves","e":"UPPSC 2012","q":"Ultrasonics are sound waves of frequency","o":["Greater than 20,000 Hz","Less than 10,000 Hz","Equal to 1000 Hz","None of these"],"a":0,"x":["<b>Ultrasonic</b> waves have frequency <b>greater than 20,000 Hz (20 kHz)</b>, above the upper limit of human hearing.","The audible range for humans is <b>20 Hz to 20,000 Hz</b>; sounds below 20 Hz are infrasonic.","Ultrasonics are used in <b>sonography</b>, distance measurement and flaw detection."]},{"n":70,"t":"Waves","e":"45th BPSC","q":"What is the distance between two successive crests or successive troughs called?","o":["Amplitude","Wavelength","Frequency","None of the above"],"a":1,"x":["<b>Wavelength</b> is the distance between two successive <b>crests</b> or two successive <b>troughs</b> of a wave.","<b>Amplitude</b> is the maximum displacement from the mean position, and <b>frequency</b> is the number of waves per second, not a distance.","Wavelength is denoted by <b>λ</b> and measured in <b>metres</b>."]},{"n":71,"t":"Optics","e":"71st BPSC","q":"The focal distance of a plane mirror is","o":["-1 cm","+1 cm","2 cm","Infinity"],"a":3,"x":["A <b>plane mirror</b> is perfectly flat with no curvature, so its <b>radius of curvature R = infinity</b>.","Using <b>f = R/2</b>, the focal length f = infinity/2 = infinity.","It neither converges nor diverges parallel rays, so it has no real focus."]},{"n":72,"t":"Optics","e":"70th BPSC","q":"As the diameter of objective lens of a telescope increases, the resolution of telescope","o":["Remains same","Depends on focal length of lens","Increases","Decreases"],"a":2,"x":["A telescope's <b>resolving power</b> is limited by <b>diffraction</b>, with resolving angle <b>θ ∝ λ/D</b>, where <b>D</b> is the objective lens diameter.","A larger diameter (aperture) gives a smaller θ, gathers more light and resolves finer detail, so <b>resolution increases</b> with diameter.","Resolution depends on aperture, not focal length, ruling out the other options."]},{"n":73,"t":"Optics","e":"70th BPSC","q":"Which of the following is responsible for production of shadow?","o":["Polarisation","Rectilinear propagation of light","Diffraction","Interference"],"a":1,"x":["<b>Rectilinear propagation</b> means light travels in a <b>straight line</b>, so it cannot bend around an opaque object.","When an <b>opaque object</b> blocks this straight path, a <b>shadow</b> forms behind it.","<b>Polarisation, diffraction and interference</b> involve wave behaviour and do not cause shadows in everyday situations."]},{"n":74,"t":"Optics","e":"69th BPSC","q":"The image formed by concave mirror is real, inverted and of the same size as that of the object. The position of the object should be","o":["at the focus","at the centre of curvature","between the focus and centre of curvature","beyond the centre of curvature"],"a":1,"x":["For a <b>concave mirror</b>, when the object is at the <b>centre of curvature (C)</b>, the image forms at <b>C</b> itself.","This image is <b>real</b>, <b>inverted</b> and of the <b>same size</b> as the object (magnification = 1).","Other positions give magnified, diminished or virtual images, not equal-sized."]},{"n":75,"t":"Optics","e":"69th BPSC","q":"Match List-I (Colour) with List-II (Combination): (a) Magenta (b) Teal (c) Mauve (d) Cyan | 1. Green and blue  2. Red and blue  3. Blue, green and white  4. Blue, red and white","o":["a-2, b-3, c-4, d-1","a-2, b-4, c-3, d-1","a-4, b-2, c-1, d-3","a-3, b-4, c-2, d-1"],"a":0,"x":["<b>Magenta</b> is formed by mixing <b>red and blue</b>, giving a vivid purple shade (a–2).","<b>Teal</b> = <b>blue, green and white</b> (b–3); <b>Mauve</b> = <b>blue, red and white</b> (c–4), a pale tertiary purple.","<b>Cyan</b> is the mix of <b>green and blue</b> (d–1), confirming the pairing."]},{"n":76,"t":"Optics","e":"68th BPSC","q":"Large number of thin strips of black paint are made on the surface of a convex lens of focal length 20 cm to catch the image of a white horse. The image will be","o":["a horse of less brightness","a zebra of black stripes","a horse of black stripes","More than one of the above","None of the above"],"a":0,"x":["A <b>convex lens</b> forms a complete image from light passing through any part of its surface, not from one spot.","The black strips only block some incoming light, so the <b>full image of the horse</b> still forms, just with reduced <b>intensity (brightness)</b>.","No stripes appear on the image, since each lens point contributes to the whole picture."]},{"n":77,"t":"Optics","e":"67th BPSC","q":"What type of lens is used in magnifying glass?","o":["Plano-concave lens","Convex lens","Convex mirror","Concave lens","None of the above/More than one of the above"],"a":1,"x":["A magnifying glass uses a <b>convex lens</b>, which is thicker at the centre and <b>converges</b> light rays.","When the object is within the focal length, it forms an enlarged, erect <b>virtual image</b>.","A <b>concave lens</b> diverges light and gives a diminished image, so it cannot magnify."]},{"n":78,"t":"Optics","e":"67th BPSC","q":"The speed of light will be minimum while passing through","o":["Vacuum","air","glass","water","None of the above/More than one of the above"],"a":2,"x":["Speed of light is inversely proportional to a medium's <b>refractive index</b> (v = c/n); a denser medium slows light more.","Among the options, <b>glass</b> has the highest refractive index (about <b>1.5</b>), versus vacuum and air (≈1) and water (1.33).","Therefore light travels slowest, with minimum speed, while passing through <b>glass</b>."]},{"n":79,"t":"Optics","e":"67th BPSC","q":"A person standing in front of a mirror finds his image larger than himself. This implies that the mirror is","o":["concave","plane","convex","cylindrical with bulging side outwards","None of the above/More than one of the above"],"a":0,"x":["A <b>concave mirror</b> can form a <b>magnified</b> image when the object is placed between the mirror and its focus, giving a virtual, erect and enlarged image.","A <b>plane mirror</b> always gives a same-size image, while a <b>convex mirror</b> always gives a diminished image, so neither can enlarge."]},{"n":80,"t":"Optics","e":"67th BPSC","q":"Twinkling of stars in clear sky during nighttime can be explained with","o":["refraction of light","reflection of light","polarization of light","interference of light","None of the above/More than one of the above"],"a":0,"x":["The <b>atmosphere</b> has layers of different temperature and density, hence different <b>refractive indices</b>.","Starlight bends repeatedly as it passes through this turbulent air – <b>atmospheric refraction</b>.","Continuous changes in apparent position and brightness make stars appear to <b>twinkle</b>."]},{"n":81,"t":"Optics","e":"67th BPSC","q":"When a soap film on the water is seen in the daytime, it shows beautiful colors. This phenomenon is due to","o":["diffraction of light","refraction of light","polarization of light","interference of light","None of the above/More than one of the above"],"a":3,"x":["Colours on a soap film arise from <b>interference of light</b>, where waves reflected off the front and back surfaces of the thin film superpose.","Path difference in the <b>thin film</b> causes some wavelengths to interfere constructively and others destructively, producing colours.","It is not <b>refraction</b> (rainbow) or <b>dispersion</b>; the effect needs two reflected wavefronts to combine."]},{"n":82,"t":"Optics","e":"UPPSC 2021","q":"Diffusion of light in the atmosphere takes place due to","o":["Carbon dioxide","Dust Particles","Helium","Water vapours"],"a":1,"x":["Light scatters in the atmosphere mainly due to <b>dust particles</b> (and other suspended particles), which deflect the incoming rays.","This <b>scattering/diffusion</b> explains everyday optical effects in the air.","Gases like <b>CO₂</b>, <b>helium</b> and water vapour are not the principal scatterers responsible for diffusion of light."]},{"n":83,"t":"Optics","e":"UPPSC 2021","q":"Which of the following types of glass can cut off ultraviolet rays?","o":["Soda glass","Pyrex glass","Jena glass","Crookes Glass"],"a":3,"x":["<b>Crookes glass</b> contains <b>cerium oxide</b> and silica, which sharply absorb harmful <b>ultraviolet (UV) rays</b>.","This makes it ideal for <b>sunglasses</b> that cut off UV radiation.","<b>Soda glass</b> (window glass) and <b>Pyrex</b> (borosilicate) do not block UV the way Crookes glass does."]},{"n":84,"t":"Optics","e":"66th BPSC","q":"Which of the following does not change when light travels from one medium to another?","o":["Velocity","Wavelength","Frequency","Refractive index","None of the above / More than one of the above"],"a":2,"x":["During <b>refraction</b>, the <b>speed</b> and <b>wavelength</b> of light change as it passes between media of different optical densities.","The <b>frequency</b> stays constant because it is fixed by the source, so the number of waves per second is unchanged.","The <b>refractive index</b> differs from medium to medium, governed by <b>Snell's law (sin i / sin r = constant)</b>."]},{"n":85,"t":"Optics","e":"65th BPSC","q":"The sunlight from the sun to the earth reaches in","o":["5 minutes approx","6 minutes approx","8 minutes approx","10 minutes approx","None of the above / More than one of the above"],"a":2,"x":["Sunlight takes about <b>8 minutes 20 seconds</b> to travel from the Sun to the Earth.","Light moves at <b>3 × 10⁸ m/s</b> and the Sun is one <b>Astronomical Unit (≈ 1.5 × 10⁸ km)</b> away.","Distance ÷ speed gives roughly <b>500 seconds ≈ 8 minutes</b>."]},{"n":86,"t":"Optics","e":"UPPSC 2019","q":"The phenomenon used in optical fibre for transmission of light energy is","o":["Total internal reflection","Diffraction","Scattering","Refraction"],"a":0,"x":["Optical fibres carry light by <b>Total Internal Reflection</b>, where light striking the core-cladding boundary is fully reflected back inside.","It occurs only when light travels from a <b>denser to a rarer medium</b> and the angle of incidence exceeds the <b>critical angle</b>.","<b>Refraction</b> (bending across media), <b>diffraction</b> (bending around edges) and <b>scattering</b> cause loss, not guided transmission."]},{"n":87,"t":"Optics","e":"UPPSC 2018","q":"Which of the following electromagnetic radiations has the maximum energy?","o":["Visible light","Infrared rays","Ultraviolet rays","X - Rays"],"a":3,"x":["In the <b>electromagnetic spectrum</b>, energy increases with frequency: infrared < visible < ultraviolet < X-rays < gamma rays.","Among the given options, <b>X-rays</b> have the shortest wavelength and highest frequency, hence the maximum energy."]},{"n":88,"t":"Optics","e":"UPPSC 2017","q":"A cut diamond shines brilliantly due to","o":["some inherent property","total internal reflection","its molecular structure","absorption of light"],"a":1,"x":["A cut diamond sparkles due to <b>total internal reflection</b>, where light striking a face beyond the <b>critical angle</b> is fully reflected inside.","Diamond's very high <b>refractive index (about 2.42)</b> gives a small critical angle, trapping light through many reflections before it exits.","Molecular structure or light absorption do not produce this brilliance, ruling them out."]},{"n":89,"t":"Optics","e":"UPPSC 2016","q":"The minimum distance of clear vision for a normal healthy eye of human being is supposed to be","o":["50 cm","10 cm","15 cm","25 cm"],"a":3,"x":["The <b>least distance of distinct vision (D)</b> is the closest distance at which a normal eye can see an object clearly without strain.","For a healthy human eye this value is <b>25 cm</b>; objects nearer than this appear blurred.","The eye cannot focus comfortably at <b>10 cm</b> or <b>15 cm</b>, while <b>50 cm</b> is well beyond the near point."]},{"n":90,"t":"Optics","e":"UPPSC 2015","q":"A person with vision defect 'Myopia' can see _______.","o":["nearby objects clearly","distant objects clearly","nearby as well as distant objects clearly","neither nearby nor distant objects clearly"],"a":0,"x":["<b>Myopia</b> (near-sightedness) lets a person see <b>nearby objects clearly</b> but distant objects appear blurred.","The eyeball is too long, so the image of a distant object forms <b>in front of the retina</b>.","It is corrected using a <b>concave (diverging) lens</b>."]},{"n":91,"t":"Optics","e":"UPPSC 2015","q":"The mirror used by the dentists to see the teeth of the patients is","o":["Convex","Concave","Plane","None of the above"],"a":1,"x":["Dentists use a <b>concave mirror</b> to view teeth as it produces an <b>enlarged, erect (virtual) image</b> when the object is close to the mirror.","A concave mirror has an inward-curved reflecting surface that <b>converges</b> light; convex and plane mirrors only diminish or keep size, so they are unsuitable."]},{"n":92,"t":"Optics","e":"UPPSC 2015","q":"Blue color of the sky is due to","o":["Scattering of light","Dispersion of light","Interference of light","Emission of more blue light as compared to other colours by the sun"],"a":0,"x":["The blue colour of the sky is due to <b>scattering of light</b> by air molecules, known as <b>Rayleigh scattering</b>.","Shorter wavelengths (<b>blue</b>) scatter much more than longer wavelengths (red), so blue dominates the sky.","It is not dispersion, interference, or extra blue emission by the Sun."]},{"n":93,"t":"Optics","e":"UPPSC 2014","q":"To look total image of a person, the minimum height of a plane mirror is","o":["Equal to the height of a person","Half of the height of a person","One fourth of the height of a person","Two times the height of a person"],"a":1,"x":["By the <b>laws of reflection</b>, a <b>plane mirror</b> needs a minimum height equal to <b>half the height</b> of a person to show the full image.","Rays from the head and feet strike the mirror at its <b>midpoints</b>, so only half the body length of glass is required.","This result is independent of how far the person stands from the mirror."]},{"n":94,"t":"Optics","e":"UPPSC 2013","q":"The mirror used by a dentist to examine the teeth of patients is","o":["Concave","Convex","Plane","Cylindrical"],"a":0,"x":["A dentist uses a <b>concave mirror</b>, which gives an <b>enlarged, erect (virtual) image</b> of the tooth when held close.","It also <b>converges light</b> onto the tooth, brightening the area being examined.","A <b>convex mirror</b> only forms small, diminished images, so it is unsuitable."]},{"n":95,"t":"Optics","e":"UPPSC 2012","q":"The reason of mirage is","o":["Interference of light","Diffraction of light","Polarisation of light","Total internal reflection of light"],"a":3,"x":["A <b>mirage</b> is an optical illusion caused by <b>total internal reflection of light</b> through layers of air of differing density.","Hot ground heats the lower air, making it rarer; light from the sky bends past the <b>critical angle</b> and reflects back, looking like water.","Interference, diffraction and polarisation are unrelated wave effects, not the cause."]},{"n":96,"t":"Optics","e":"UPPSC 2012","q":"The colour of light is determined by its","o":["Amplitude","Wavelength","Intensity","Velocity"],"a":1,"x":["The <b>colour</b> of light depends on its <b>wavelength</b>; <b>red</b> has the longest and <b>violet</b> the shortest wavelength.","<b>Amplitude</b> and <b>intensity</b> decide the brightness, not the colour.","<b>Velocity</b> of light in vacuum is constant at <b>3 × 10⁸ m/s</b> for all colours."]},{"n":97,"t":"Electricity","e":"71st BPSC","q":"Which term in the following does not denote the electric power in electric circuit?","o":["IR²","I²R","VI","V²/R"],"a":0,"x":["<b>Electric power</b> is the rate of energy use, basically <b>P = VI</b>.","Using <b>Ohm's Law (V = IR)</b>, this rewrites as <b>P = I²R</b> and <b>P = V²/R</b>.","<b>IR²</b> matches none of these valid forms, so it does not denote electric power."]},{"n":98,"t":"Electricity","e":"71st BPSC","q":"In short circuit, the value of electric current in a circuit:","o":["Do not change","Very low","Increases very high","Continuously changing"],"a":2,"x":["A <b>short circuit</b> occurs when a near-zero resistance path lets current bypass the intended load.","By <b>Ohm's Law, I = V/R</b>; as <b>R</b> approaches zero, the current <b>I</b> rises to a very high value.","This excess current causes <b>overheating</b> and <b>fire</b>, which is why <b>fuses</b> and <b>circuit breakers</b> are used."]},{"n":99,"t":"Electricity","e":"71st BPSC","q":"What is the device to protect equipments from the electric shock?","o":["Generator","Fuse","Motor","Current controller"],"a":1,"x":["A <b>fuse</b> is a safety device that protects appliances and people from <b>excess current</b> and electric shock.","It uses a thin wire of <b>low melting point</b> that melts when current exceeds the safe limit, breaking the circuit.","A <b>generator</b> produces electricity and a <b>motor</b> converts electrical to mechanical energy; neither offers protection."]},{"n":100,"t":"Electricity","e":"UPPSC 2025","q":"Assertion (A): Generally an alloy of lead and tin is used as a material of the fuse wire. Reason (R): Alloy of lead and tin has a higher melting point than copper and aluminium.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A)","(A) is true, but (R) is false","(A) is false, but (R) is true","Both (A) and (R) are true, but (R) is not the correct explanation of (A)"],"a":1,"x":["(A) is true: <b>fuse wire</b> is made of a low-melting <b>tin–lead alloy</b> so it melts and breaks the circuit on excess current.","(R) is false: tin–lead solder melts at only ~<b>183–230 °C</b>, far below <b>aluminium (~660 °C)</b> and <b>copper (~1085 °C)</b>.","The low melting point is precisely why it suits a fuse, so (R) is incorrect."]},{"n":101,"t":"Electricity","e":"70th BPSC","q":"Which of the following is the resistance of the wire?","o":["R = IV","R = I/2V","R = V/I","R = I/V"],"a":2,"x":["By <b>Ohm's Law</b>, resistance equals voltage divided by current: <b>R = V/I</b>.","Here <b>R</b> is in <b>ohms (Ω)</b>, <b>V</b> is voltage in <b>volts</b>, and <b>I</b> is current in <b>amperes</b>.","Forms like R = IV or R = I/V are dimensionally wrong and do not follow Ohm's Law."]},{"n":102,"t":"Electricity","e":"70th BPSC","q":"Reactance of a capacitor is","o":["Directly proportional to frequency","Inversely proportional to sq. root of frequency","Inversely proportional to frequency","None of the above"],"a":2,"x":["Capacitive reactance is given by <b>X_C = 1/(2πfC)</b>, where <b>f</b> is frequency and <b>C</b> is capacitance.","Since <b>f</b> sits in the denominator, X_C falls as frequency rises – an <b>inverse</b> relationship, not direct or square-root."]},{"n":103,"t":"Electricity","e":"70th BPSC","q":"An electron of mass M kg and charge e coulomb travels from rest through a potential difference of V volts. The final energy in joules would be","o":["eV","(eV)/M","e/V","MeV"],"a":0,"x":["Work done on a charge by a potential difference is <b>W = qV</b>; here q = <b>e</b>, giving energy = <b>eV</b> joules.","Starting from rest, all this work becomes <b>kinetic energy</b>, so the final energy is <b>eV</b>.","The <b>mass M</b> affects the final speed but not the energy gained."]},{"n":104,"t":"Electricity","e":"69th BPSC","q":"Which of the following liquids is a bad conductor of electricity?","o":["Salted water","Orange juice","Lemon juice","None of the above"],"a":3,"x":["<b>Salted water</b> conducts well because <b>NaCl</b> dissociates into mobile <b>Na⁺ and Cl⁻ ions</b>.","<b>Orange</b> and <b>lemon juice</b> are acidic and contain <b>H⁺ ions</b>, so they also conduct electricity.","Since all three given liquids are conductors, none qualifies as a bad conductor."]},{"n":105,"t":"Electricity","e":"69th BPSC","q":"Current density is","o":["a scalar quantity","a vector quantity","dimensionless","None of the above"],"a":1,"x":["<b>Current density (J)</b> is the current flowing per unit cross-sectional area, given by <b>J = I / A</b>.","It has both magnitude and direction (along the flow of current), making it a <b>vector quantity</b>.","Its SI unit is <b>ampere per square metre (A/m²)</b>; note that electric current itself is a scalar."]},{"n":106,"t":"Electricity","e":"68th BPSC","q":"Which of the following photoelectric devices is most suitable for digital applications?","o":["Photodiode","Photovoltaic cell","Photoemitter","More than one of the above","None of the above"],"a":1,"x":["A <b>photovoltaic cell (solar cell)</b> converts light into electric current via the <b>photoelectric effect</b>, giving a clean on/off electrical signal ideal for digital use.","<b>Photodiodes</b> and <b>photoemitters</b> are less suited; photoemitters emit light from current, the opposite function.","Photovoltaic cells power <b>satellites and digital devices</b>, making them most suitable for digital applications."]},{"n":107,"t":"Electricity","e":"67th BPSC","q":"Due to temperature variation along a conductor, potential variation occurs along it. This phenomenon is known as","o":["Joule effect","Seebeck effect","Peltier effect","Thomson effect","None of the above/More than one of the above"],"a":3,"x":["The <b>Thomson effect</b> is the evolution or absorption of heat when current flows through a <b>single conductor</b> that has a temperature difference along its length.","Unlike the <b>Seebeck effect</b> (potential difference from two dissimilar metals) or the <b>Peltier effect</b> (heat at a junction of two metals), Thomson involves only one material."]},{"n":108,"t":"Electricity","e":"67th BPSC","q":"Which of the following is not correctly matched?","o":["Voltmeter - Potential difference","Ammeter - Electric current","Potentiometer - Electromotive force","Galvanometer - Electric resistance","None of the above/More than one of the above"],"a":3,"x":["A <b>galvanometer</b> detects and measures small <b>electric current</b>, not resistance.","The correct pairs are <b>Voltmeter–potential difference</b>, <b>Ammeter–electric current</b> and <b>Potentiometer–EMF</b>.","So 'Galvanometer–electric resistance' is the wrongly matched pair."]},{"n":109,"t":"Electricity","e":"UPPSC 2021","q":"With reference to the electric potential which of the following statements is/are correct? 1. It is a scalar quantity. 2. It is a vector quantity.","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"x":["<b>Electric potential</b> is the work done to move a unit charge from a reference point to a given point against the electric field.","It depends on <b>charge</b> and <b>distance</b> (both scalars), so it has magnitude but no direction, making it a <b>scalar quantity</b>.","Its SI unit is the <b>volt (V)</b>; only statement 1 is correct."]},{"n":110,"t":"Electricity","e":"66th BPSC","q":"The total resistance of a circuit having two parallel resistors is 1.403 kilo-ohm. If one of the resistors is 2.0 kilo-ohm then the other resistor will be","o":["1.403 kilo-ohm","2.0 kilo-ohm","3.403 kilo-ohm","4.70 kilo-ohm","None of the above / More than one of the above"],"a":3,"x":["For resistors in <b>parallel</b>: <b>1/R = 1/R1 + 1/R2</b>.","With R = 1.403 kΩ and R1 = 2.0 kΩ: 1/R2 = 1/1403 – 1/2000.","Solving gives R2 ≈ <b>4700 Ω = 4.70 kΩ</b>."]},{"n":111,"t":"Electricity","e":"66th BPSC","q":"On heating, the resistance of a semiconductor","o":["increases","decreases","remains same","first increases and then decreases","None of the above / More than one of the above"],"a":1,"x":["In a <b>semiconductor</b>, heating breaks covalent bonds and releases more <b>free electrons</b>.","More charge carriers raise conductivity, so <b>resistance decreases</b> with temperature.","This is opposite to a metallic conductor, whose resistance rises on heating."]},{"n":112,"t":"Electricity","e":"65th BPSC","q":"The device to measure electric current is -","o":["voltmeter","ammeter","voltameter","potentiometer","None of the above / More than one of the above"],"a":1,"x":["An <b>ammeter</b> measures <b>electric current</b> and is connected in series in a circuit.","A <b>voltmeter</b> measures potential difference, while a <b>potentiometer</b> is a voltage divider.","A <b>voltameter</b> is an electrolytic cell used for electrolysis, not current measurement."]},{"n":113,"t":"Electricity","e":"65th BPSC","q":"The unit of electric power is","o":["ampere","volt","coulomb","watt","None of the above / More than one of the above"],"a":3,"x":["<b>Watt (W)</b> is the SI unit of <b>electric power</b> – the rate of transfer of energy.","One <b>watt</b> equals one <b>ampere</b> flowing under one <b>volt</b> (P = VI).","Ampere measures current, volt measures potential and coulomb measures charge, so they are ruled out."]},{"n":114,"t":"Electricity","e":"UPPSC 2018","q":"Which of the following elements is a semiconductor?","o":["Aluminium","Silicon","Silver","Lead"],"a":1,"x":["<b>Silicon (Si)</b> is a Group-14 elemental <b>semiconductor</b>, like germanium, with conductivity between metals and insulators.","Distractors: <b>aluminium, silver and lead</b> are metallic condu
