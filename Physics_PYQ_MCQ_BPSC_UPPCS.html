ctors, not semiconductors.","Doping Si with Group-15 gives <b>n-type</b> and Group-13 gives <b>p-type</b> semiconductors."]},{"n":115,"t":"Electricity","e":"UPPSC 2017","q":"Five bulbs each of 100 watt capacity in a tunnel are illuminated continuously for twenty hours. The consumption of electricity will be:","o":["One unit","Two units","Ten units","Twenty units"],"a":2,"x":["One <b>unit</b> of electricity equals <b>1 kilowatt-hour (kWh)</b>.","Energy = power × time = <b>(5 × 100 W × 20 h) = 10000 Wh = 10 kWh</b>.","Therefore total consumption is <b>10 units</b>."]},{"n":116,"t":"Electricity","e":"UPPSC 2015","q":"Which of the following is a semiconductor?","o":["Plastic","Aluminium","Wood","Germanium"],"a":3,"x":["A <b>semiconductor</b> has electrical conductivity between a conductor and an insulator.","<b>Germanium (Ge)</b>, like <b>silicon (Si)</b>, is a Group IV elemental semiconductor used in diodes and transistors.","<b>Aluminium</b> is a conductor, while <b>plastic</b> and <b>wood</b> are insulators."]},{"n":117,"t":"Magnetism","e":"70th BPSC","q":"Which of the following is equivalent to tesla?","o":["Ampere per Newton","Newton per Coulomb","Newton per ampere-second","Newton per ampere meter"],"a":3,"x":["The <b>tesla (T)</b> is the SI unit of <b>magnetic flux density</b> (magnetic field strength).","From the magnetic force formula <b>F = BIL</b>, we get B = F/(IL), so 1 T = <b>Newton per ampere metre (N/A·m)</b>.","This makes it equivalent to newton per ampere per metre, not the other listed combinations."]},{"n":118,"t":"Magnetism","e":"70th BPSC","q":"What is the unit of measure of magnetic field?","o":["Cobalt","Ampere","Ohm","Tesla"],"a":3,"x":["The <b>SI unit</b> of magnetic field (magnetic flux density, <b>B</b>) is the <b>Tesla (T)</b>, where <b>1 T = 1 Weber per square metre (Wb/m²)</b>.","It is named after the scientist <b>Nikola Tesla</b>; the CGS unit Gauss relates as 1 T = 10,000 G.","<b>Ampere</b> measures current and <b>Ohm</b> measures resistance, while 'Cobalt' is an element, not a unit."]},{"n":119,"t":"Magnetism","e":"69th BPSC","q":"An AC current can be produced by","o":["choke coil","dynamo","transformer","None of the above"],"a":1,"x":["A <b>dynamo</b> generates current by rotating a coil within a magnetic field, working on <b>Faraday's law of electromagnetic induction</b>.","As the coil rotates, the changing magnetic flux reverses the current direction each half-turn, producing <b>alternating current (AC)</b>.","A <b>choke coil</b> only opposes AC, and a <b>transformer</b> merely changes voltage of existing AC; neither produces it."]},{"n":120,"t":"Magnetism","e":"67th BPSC","q":"The paramagnetic theory of magnetism applies to","o":["mercury","iron","platinum","nickel","None of the above/More than one of the above"],"a":2,"x":["<b>Paramagnetic</b> substances are feebly attracted by magnets and have a small positive <b>magnetic susceptibility (χ > 0)</b>.","Among the options, <b>platinum</b> is paramagnetic, along with aluminium and chromium.","<b>Iron</b> and <b>nickel</b> are <b>ferromagnetic</b> (strongly attracted), while <b>mercury</b> is <b>diamagnetic</b>."]},{"n":121,"t":"Magnetism","e":"66th BPSC","q":"The velocity of electromagnetic waves is","o":["3 × 10⁸ ms⁻¹","3 × 10⁷ ms⁻¹","3 × 10⁶ ms⁻¹","3 × 10⁵ ms⁻¹","4 × 10⁵ ms⁻¹"],"a":0,"x":["<b>Electromagnetic waves</b> need no medium and travel through vacuum at a constant <b>speed of light</b>.","This velocity is <b>3 × 10⁸ m s⁻¹</b>, the same for all EM waves (radio, X-rays, gamma rays, visible light).","They consist of mutually perpendicular oscillating <b>electric</b> and <b>magnetic fields</b>."]},{"n":122,"t":"Magnetism","e":"UPPSC 2017","q":"A mobile phone charger is","o":["An inverter","A UPS","A step up transformer","A step down transformer"],"a":3,"x":["A mobile charger uses a <b>step-down transformer</b> to reduce the mains <b>220 V AC</b> to a working output of about <b>5 V</b>.","In a step-down type the secondary coil has <b>fewer turns</b> than the primary, so output voltage is lower than input.","A step-up transformer raises voltage, while an inverter/UPS converts or backs up power, so they do not fit."]},{"n":123,"t":"Magnetism","e":"UPPSC 2016","q":"'Dynamo' is a device, which converts","o":["chemical energy into electrical energy","electrical energy into mechanical energy","mechanical energy into electrical energy","electrical energy into chemical energy"],"a":2,"x":["A <b>dynamo</b> is an electrical generator that works on <b>electromagnetic induction</b>.","It converts <b>mechanical energy into electrical energy</b> (a motor does the reverse).","Cells/batteries convert chemical energy to electrical, while electrolytic cells convert electrical to chemical energy."]},{"n":124,"t":"Magnetism","e":"UPPSC 2013","q":"What type of electromagnetic radiation is used in the remote control of a television?","o":["Infrared","Ultraviolet","Visible","None of the above"],"a":0,"x":["TV remotes transmit signals using <b>infrared (IR)</b> radiation, whose wavelength is longer than that of visible light.","IR is <b>invisible to the human eye</b> yet easily emitted by a cheap LED and detected by a sensor.","<b>Ultraviolet</b> is harmful and high-energy, making it unsuitable for everyday remotes."]},{"n":125,"t":"Magnetism","e":"UPPSC 2012","q":"What is MRI?","o":["Magnetic Record of Intestines","Magnetic Recording of Investigations","Magnetic Resonance Imaging","Magnetic Resonance in Intestines"],"a":2,"x":["<b>MRI</b> stands for <b>Magnetic Resonance Imaging</b>.","It uses powerful <b>magnets</b> and <b>radio waves</b> to align body protons and produce detailed images of organs and tissues.","It is widely used to detect brain tumours, stroke, and soft-tissue disorders without radiation."]},{"n":126,"t":"Modern Physics","e":"70th BPSC","q":"Which of the following radiation is used to get relief from body aches?","o":["Infra-red radiation","UV radiation","Visible radiation","None of these"],"a":0,"x":["<b>Infra-red radiation</b> is used in physiotherapy to relieve body aches and muscle pain.","It penetrates the skin and generates <b>heat</b>, improving <b>blood circulation</b> and relaxing stiff muscles.","Unlike <b>UV radiation</b> (which can damage tissue), infra-red is a safe, non-invasive heat therapy for arthritis and sprains."]},{"n":127,"t":"Modern Physics","e":"70th BPSC","q":"One of the properties associated with X-rays is that they can be deflected by","o":["Both electric and magnetic fields together","Electric fields only","Magnetic fields only","None of the above"],"a":3,"x":["<b>X-rays</b> are high-energy <b>electromagnetic waves</b> with very short wavelength and carry <b>no electric charge</b>.","Only charged particles experience force in <b>electric</b> or <b>magnetic fields</b>, so chargeless X-rays are deflected by neither.","Hence X-rays travel undeflected through both fields, making 'None of the above' correct."]},{"n":128,"t":"Modern Physics","e":"69th BPSC","q":"In the universe, what are pulsars?","o":["A group of stars","Rotating neutron stars","Explosion of a star","Radio waves emitted by a star"],"a":1,"x":["<b>Pulsars</b> are highly dense, rapidly <b>rotating neutron stars</b> that emit beams of electromagnetic radiation.","They act like cosmic lighthouses, sending out regular pulses of radio waves, X-rays and gamma rays, and form after a <b>supernova</b> collapse.","They are single rotating stars, not a star group, an explosion, or merely radio waves."]},{"n":129,"t":"Modern Physics","e":"69th BPSC","q":"A photoelectric cell is a device which","o":["converts light energy into electric energy","converts electric energy into light energy","stores light energy","None of the above"],"a":0,"x":["A <b>photoelectric cell</b> (photocell) converts <b>light energy into electrical energy</b> based on the <b>photoelectric effect</b>.","Incident <b>photons</b> eject electrons from a photosensitive surface, producing an electric current; the effect was explained by <b>Albert Einstein</b> (Nobel Prize, 1921)."]},{"n":130,"t":"Modern Physics","e":"68th BPSC","q":"Which of the following laboratories claimed a historic nuclear fusion breakthrough in December 2022?","o":["Los Alamos National Laboratory","Lawrence Livermore National Laboratory","Oak Ridge National Laboratory","More than one of the above","None of the above"],"a":1,"x":["In December 2022, the <b>Lawrence Livermore National Laboratory</b> (USA) achieved the first <b>net energy gain</b> from a <b>nuclear fusion</b> reaction.","It used <b>inertial confinement fusion</b>, firing a 192-beam laser at a hydrogen capsule to trigger fusion.","This differs from magnetic-confinement projects like <b>ITER</b> and China's <b>EAST</b> tokamak."]},{"n":131,"t":"Modern Physics","e":"68th BPSC","q":"Which among the following is a positively charged particle emitted by a radioactive element?","o":["Cathode ray","Beta ray","Alpha ray","More than one of the above","None of the above"],"a":2,"x":["<b>Alpha rays</b> are <b>positively charged</b> particles, each made of <b>2 protons and 2 neutrons</b> (a helium nucleus), emitted in radioactive decay.","<b>Beta rays</b> are negatively charged electrons, and <b>cathode rays</b> are also electrons – both negative, not emitted as positive radiation.","Alpha particles are highly ionizing but short-range, first studied by <b>Rutherford</b>."]},{"n":132,"t":"Modern Physics","e":"67th BPSC","q":"The 'theory of relativity' is presented by which scientist?","o":["Isaac Newton","Stephen Hawking","Marie Curie","Albert Einstein","None of the above/More than one of the above"],"a":3,"x":["The <b>Theory of Relativity</b> was presented by <b>Albert Einstein</b>, comprising <b>Special Relativity (1905)</b> and <b>General Relativity (1915)</b>.","It holds that the <b>speed of light</b> is constant for all observers and that space and time are relative to the frame of reference.","<b>Newton</b> gave gravitation and motion laws, while Hawking and Curie worked in other fields – not relativity."]},{"n":133,"t":"Modern Physics","e":"67th BPSC","q":"Hydrogen bomb is based on the principle of","o":["controlled fusion reaction","uncontrolled fusion reaction","controlled fission reaction","uncontrolled fission reaction","None of the above/More than one of the above"],"a":1,"x":["A hydrogen bomb works on <b>nuclear fusion</b>, where light nuclei of <b>deuterium</b> and <b>tritium</b> combine to form <b>helium</b>, releasing huge energy.","The fusion is a self-sustaining <b>uncontrolled</b> reaction triggered by the extreme heat of a fission (atom) bomb.","Fission powers reactors and bombs, but the H-bomb's energy comes from <b>thermonuclear fusion</b>."]},{"n":134,"t":"Modern Physics","e":"UPPSC 2022","q":"Solar energy is converted into electric energy through","o":["Dry cells","Leclanche cells","Voltaic cells","Photo voltaic cells"],"a":3,"x":["A <b>photovoltaic cell</b> is a semiconductor device that converts sunlight directly into electricity via the <b>photovoltaic effect</b>.","<b>Dry cells, Leclanché cells and voltaic cells</b> are all chemical cells that convert chemical energy, not solar energy, into electricity."]},{"n":135,"t":"Modern Physics","e":"UPPSC 2021","q":"Which of the following particles has zero charge?","o":["Positron","Neutrino","Electron","α-particle"],"a":1,"x":["A <b>neutrino</b> is a subatomic particle with <b>zero electric charge</b> and almost negligible mass.","The others are charged: <b>positron</b> (+), <b>electron</b> (–) and <b>alpha-particle</b> (+2, being 2 protons + 2 neutrons).","Neutrinos interact only via the <b>weak nuclear force</b>."]},{"n":136,"t":"Modern Physics","e":"66th BPSC","q":"The radiation used in the treatment of muscle ache are","o":["infrared","microwave","UV","X-ray","None of the above / More than one of the above"],"a":0,"x":["<b>Infrared radiation</b> carries heat and penetrates tissue, easing <b>muscle ache</b> and tension.","Its warming effect improves blood flow, which is why it is used in physiotherapy.","<b>UV</b> and <b>X-rays</b> are high-energy and harmful for such therapy; microwaves are not used here."]},{"n":137,"t":"Modern Physics","e":"UPPSC 2018","q":"Which of the following has the highest velocity?","o":["Cosmic rays","Light","Electron","Supersonic wave"],"a":1,"x":["<b>Light</b> travels at <b>3 × 10⁸ m/s</b> in vacuum, the highest known velocity.","Nothing can travel faster than light; <b>cosmic rays</b> and <b>electrons</b> only approach but never exceed it.","A <b>supersonic wave</b> moves at sound-scale speeds (~hundreds of m/s), far slower than light."]},{"n":138,"t":"Modern Physics","e":"UPPSC 2018","q":"Which of the following invented by Wilhelm Roentgen?","o":["Radio","X - Ray Machine","Electric Bulb","None of the above"],"a":1,"x":["<b>Wilhelm Roentgen</b> discovered <b>X-rays</b> in <b>1895</b>, leading to the X-ray machine; he won the first Nobel Prize in Physics.","Distractors: <b>Marconi</b> developed the radio, while <b>Humphry Davy/Edison</b> are linked to the electric bulb."]},{"n":139,"t":"Modern Physics","e":"UPPSC 2016","q":"Which one of the following is used in the treatment of blood cancer?","o":["Iodine - 131","Sodium - 24","Phosphorus - 32","Cobalt - 60"],"a":3,"x":["<b>Cobalt-60</b> is a radioactive isotope that emits high-energy <b>gamma rays</b>, used in radiotherapy for <b>blood cancer (leukemia)</b>.","<b>Iodine-131</b> treats thyroid disorders, <b>Sodium-24</b> traces blood circulation, and <b>Phosphorus-32</b> is used in some bone/skin cancer studies."]},{"n":140,"t":"Modern Physics","e":"UPPSC 2016","q":"The substance used as moderator and coolant both, in nuclear reactors is","o":["Ordinary water","Heavy water","Liquid Ammonia","Liquid Hydrogen"],"a":1,"x":["<b>Heavy water (D₂O)</b>, or deuterium oxide, acts as both <b>moderator</b> and <b>coolant</b> in many nuclear reactors.","As a moderator it slows down fast <b>neutrons</b> without absorbing them, sustaining the chain reaction.","<b>Ordinary water</b> absorbs neutrons more readily, while <b>liquid ammonia</b> and <b>liquid hydrogen</b> are not used for this dual role."]},{"n":141,"t":"Modern Physics","e":"UPPSC 2016","q":"Photovoltaic cells are","o":["Solar cells","Thermal cells","Sulphur cells","Molar cells"],"a":0,"x":["<b>Photovoltaic cells</b> are <b>solar cells</b> that convert <b>sunlight</b> directly into electricity.","They use <b>semiconductor</b> layers; absorbed <b>photons</b> free electrons, creating a potential difference and current (<b>photovoltaic effect</b>).","They are unrelated to thermal, sulphur or molar cells."]},{"n":142,"t":"Modern Physics","e":"59th BPSC","q":"Cosmic rays","o":["are charged particles","are uncharged particles","can be charged as well as uncharged","None of the above"],"a":0,"x":["<b>Cosmic rays</b> are high-energy <b>charged particles</b> reaching Earth from outer space.","They are mostly <b>atomic nuclei</b> - chiefly <b>hydrogen (protons)</b> and <b>helium nuclei</b>, which carry positive charge.","Being charged, they are deflected by magnetic fields, unlike neutral particles."]},{"n":143,"t":"Modern Physics","e":"UPPSC 2012","q":"Laser is a device for producing","o":["Spontaneous radiation","Dispersed radiation","Scattered radiation","Stimulated radiation"],"a":3,"x":["<b>LASER</b> stands for Light Amplification by <b>Stimulated Emission</b> of Radiation.","In <b>stimulated emission</b>, an incoming photon makes an excited atom release a second identical photon, giving a coherent, monochromatic beam.","Spontaneous radiation is random in direction and phase, so it cannot produce laser light."]},{"n":144,"t":"Modern Physics","e":"45th BPSC","q":"Which of the following carries a negative charge?","o":["X-rays","Alpha particles","Beta particles","Gamma rays"],"a":2,"x":["<b>Beta particles</b> are high-speed <b>electrons</b> emitted in beta decay, carrying a charge of <b>-e</b> (negative).","<b>Alpha particles</b> are positively charged <b> const LS='bpsc_physics_mcq_v1';
const BG_VALID=['off','soft','bold'];
let S={pick:{},star:{},time:{},theme:'dark',bg:'soft',exam:null,hist:[]};
try{const r=localStorage.getItem(LS); if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
S.pick=S.pick||{};S.star=S.star||{};S.time=S.time||{};S.hist=S.hist||[];
if(BG_VALID.indexOf(S.bg)<0)S.bg='soft';
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
document.documentElement.dataset.t=S.theme==='light'?'light':'dark';

const byN={}; Q.forEach(q=>byN[q.n]=q);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LET=['a','b','c','d','e'];
const isDone=n=>S.pick[n]!==undefined;
const isRight=n=>isDone(n)&&S.pick[n]===byN[n].a;
const NOTA=/none of the above|more than one of the above/i;

function fmt(ms){if(ms==null||!isFinite(ms))return '0:00';const s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtShort(ms){if(!ms||!isFinite(ms))return '—';const s=Math.round(ms/1000);
  return s<60?s+'s':Math.floor(s/60)+'m '+(s%60)+'s';}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function ordFor(q){const ix=q.o.map((_,i)=>i);
  return shuffle(ix.filter(i=>!NOTA.test(q.o[i]))).concat(ix.filter(i=>NOTA.test(q.o[i])));}

function motifURL(t){
  const c=(THEME[t]||THEME.all).c, body=(MOTIF[t]||MOTIF.all).split('COL').join(c);
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120' fill='none' stroke='"+
    c+"' stroke-width='1.3' stroke-linecap='round'>"+body+"</svg>";
  return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}
function hex2rgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
const BG=['off','soft','bold'];
const BGOP={off:[0,0],soft:[.075,.13],bold:[.14,.26]};
function applyBg(){
  const lv=BG.indexOf(S.bg)>=0?S.bg:'soft';
  const light=document.documentElement.dataset.t==='light', o=BGOP[lv];
  const k=light?1.3:1;
  document.documentElement.style.setProperty('--motif-op',(o[0]*k).toFixed(3));
  document.documentElement.style.setProperty('--art-op',(o[1]*k).toFixed(3));
  const b=document.getElementById('bgBtn');
  if(b)b.title='Background artwork: '+lv[0].toUpperCase()+lv.slice(1)+' — click to change';
}
function applyTheme(t){
  const th=THEME[t]||THEME.all, rgb=hex2rgb(th.c), r=rgb[0],g=rgb[1],b=rgb[2];
  const st=document.documentElement.style;
  st.setProperty('--acc',th.c);
  st.setProperty('--acc-soft','rgba('+r+','+g+','+b+',.14)');
  st.setProperty('--acc-line','rgba('+r+','+g+','+b+',.45)');
  st.setProperty('--acc-ink',(r*299+g*587+b*114)/1000>150?'#14161a':'#fff');
  st.setProperty('--motif',motifURL(t));
  const art=document.getElementById('bgart');
  if(art&&art.dataset.t!==t){art.dataset.t=t;
    art.innerHTML="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' fill='none' stroke='"+
      th.c+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>"+
      (ART[t]||ART.all).split('COL').join(th.c)+"</svg>";}
  applyBg();
  document.getElementById('bsub').textContent = t==='all'
    ? 'BPSC + UPPCS · '+Q.length+' solved questions' : FULL[t]+' · '+th.n;
}

let topic='all', mode='all', list=[], idx=0, shuffled=false, query='';
let qStart=0, ord=null, tick=null;

function pool(){
  let a=Q.filter(q=>topic==='all'||q.t===topic);
  if(mode==='unseen')a=a.filter(q=>!isDone(q.n));
  else if(mode==='missed')a=a.filter(q=>isDone(q.n)&&!isRight(q.n));
  else if(mode==='starred')a=a.filter(q=>S.star[q.n]);
  if(query){const t=query.toLowerCase();
    a=a.filter(q=>(q.q+' '+q.o.join(' ')+' '+q.x.join(' ')+' '+q.e).toLowerCase().includes(t));}
  return a;
}
function rebuild(keep){
  const cur=list[idx]&&list[idx].n;
  list=pool(); if(shuffled)shuffle(list);
  if(keep&&cur!==undefined){const p=list.findIndex(q=>q.n===cur);idx=p>=0?p:0;}else idx=0;
  if(idx>=list.length)idx=Math.max(0,list.length-1);
  draw();
}
function drawSpine(){
  const el=document.getElementById('spine'); el.innerHTML='';
  const mk=(key,name,arr)=>{
    const done=arr.filter(q=>isDone(q.n)).length, ok=arr.filter(q=>isRight(q.n)).length;
    const pct=done?Math.round(ok/done*100):null;
    const b=document.createElement('button');
    b.className='tp'+(topic===key?' on':''); b.style.setProperty('--tc',(THEME[key]||THEME.all).c);
    b.innerHTML='<span class="dot"></span><span class="nm" title="'+esc(name)+'">'+esc(name)+'</span>'+
      '<span class="ct">'+arr.length+'</span><span class="acc '+(pct===null?'':pct>=70?'g':pct>=45?'y':'r')+'">'+
      (pct===null?'':pct+'%')+'</span>';
    b.onclick=()=>{topic=key;applyTheme(key);rebuild();drawSpine();drawModes();};
    el.appendChild(b);
  };
  mk('all','All chapters',Q);
  ORDER.forEach(t=>mk(t,FULL[t],Q.filter(q=>q.t===t)));
}
function drawModes(){
  const base=Q.filter(q=>topic==='all'||q.t===topic);
  const defs=[['all','All',base.length],['unseen','Unseen',base.filter(q=>!isDone(q.n)).length],
    ['missed','Missed',base.filter(q=>isDone(q.n)&&!isRight(q.n)).length],
    ['starred','Starred',base.filter(q=>S.star[q.n]).length]];
  const el=document.getElementById('modes'); el.innerHTML='';
  defs.forEach(d=>{const b=document.createElement('button');
    b.className='chip'+(mode===d[0]?' on':''); b.innerHTML=esc(d[1])+'<span class="n">'+d[2]+'</span>';
    b.onclick=()=>{mode=d[0];rebuild();drawModes();}; el.appendChild(b);});
}
function drawStats(){
  const done=Q.filter(q=>isDone(q.n)).length, ok=Q.filter(q=>isRight(q.n)).length;
  const ts=Object.keys(S.time).map(k=>S.time[k]).filter(v=>v>0);
  document.getElementById('sSeen').textContent=done+'/'+Q.length;
  document.getElementById('sAcc').textContent=done?Math.round(ok/done*100)+'%':'—';
  document.getElementById('sTime').textContent=ts.length?fmtShort(ts.reduce((a,b)=>a+b,0)/ts.length):'—';
  document.getElementById('bar').style.width=(done/Q.length*100)+'%';
}

function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function startTick(){stopTick();tick=setInterval(()=>{
  const el=document.getElementById('tmr'); if(!el){stopTick();return;}
  el.textContent=fmt(Date.now()-qStart);},1000);}

function draw(){
  stopTick();
  const st=document.getElementById('stage');
  if(!list.length){
    st.innerHTML='<div class="card"><div class="empty"><h3>Nothing here yet</h3><p>'+
      (query?'No question matches that search.':mode==='missed'?'No wrong answers in this set — keep going.':
       mode==='starred'?'Star a question to keep it here for revision.':
       mode==='unseen'?'Every question in this chapter is done.':'No questions in this selection.')+
      '</p><button class="nb pri" id="cf">Show all questions</button></div></div>';
    document.getElementById('cf').onclick=clearFilters; applyTheme(topic); drawStats(); return;
  }
  const q=list[idx], picked=S.pick[q.n], done=picked!==undefined;
  applyTheme(q.t);
  ord = shuffled ? ordFor(q) : q.o.map((_,i)=>i);
  if(!done)qStart=Date.now();
  st.innerHTML='<div class="card"><div class="qhead">'+
    '<span class="qno">Q'+q.n+'</span><span class="tag exam">'+esc(q.e)+'</span>'+
    '<span class="tag">'+esc(FULL[q.t])+'</span><span class="sp">'+
    '<span class="tmr'+(done?'':' run')+'" id="tmr" title="Time on this question">'+
    (done?fmtShort(S.time[q.n]):'0:00')+'</span>'+
    '<button class="star'+(S.star[q.n]?' on':'')+'" id="stB" title="Star (S)" aria-label="Star">'+
    (S.star[q.n]?'★':'☆')+'</button></span></div>'+
    '<div class="qbody"><p class="qtext">'+esc(q.q)+'</p><div class="opts">'+
    ord.map((oi,slot)=>{let cls='opt',mk='';
      if(done){cls+=' lk';
        if(oi===q.a){cls+=' ok';mk='<span class="mk">✓</span>';}
        else if(oi===picked){cls+=' no';mk='<span class="mk">✗</span>';}}
      return '<button class="'+cls+'" data-o="'+oi+'"><span class="k">'+LET[slot]+'</span><span class="tx">'+
        esc(q.o[oi])+'</span>'+mk+'</button>';}).join('')+
    '</div>'+(done?expHTML(q,picked):'')+'</div>'+
    '<div class="nav"><button class="nb" id="prv"'+(idx===0?' disabled':'')+'>← Prev</button>'+
    (done?'':'<button class="nb" id="rev">Reveal answer</button>')+
    '<span class="pos">'+(idx+1)+' of '+list.length+'</span>'+
    '<button class="nb pri" id="nxt"'+(idx>=list.length-1?' disabled':'')+'>Next →</button></div></div>';

  if(!done){[].forEach.call(document.querySelectorAll('.opt'),b=>b.onclick=()=>answer(+b.dataset.o));startTick();}
  const rv=document.getElementById('rev'); if(rv)rv.onclick=()=>answer(-1);
  document.getElementById('prv').onclick=()=>{if(idx>0){idx--;draw();}};
  document.getElementById('nxt').onclick=()=>{if(idx<list.length-1){idx++;draw();}};
  document.getElementById('stB').onclick=()=>{S.star[q.n]=!S.star[q.n];save();draw();drawModes();};
  drawStats();
}
function expHTML(q,picked){
  const skipped=picked===-1, right=picked===q.a;
  const v=skipped?['','Answer revealed']:right?['g','Correct']:['r','Not quite'];
  const slot=ord.indexOf(q.a);
  return '<div class="exp"><div class="vd '+v[0]+'"><b>'+v[1]+'</b>'+
    '<span style="color:var(--ink3)">· correct answer is ('+LET[slot]+') '+esc(q.o[q.a])+'</span>'+
    (S.time[q.n]?'<span class="t">· answered in '+fmtShort(S.time[q.n])+'</span>':'')+'</div><ul>'+
    q.x.map(b=>'<li>'+b+'</li>').join('')+'</ul></div>';
}
function answer(i){
  const q=list[idx]; if(S.pick[q.n]!==undefined)return;
  S.pick[q.n]=i; S.time[q.n]=Date.now()-qStart; save();
  stopTick(); draw(); drawSpine(); drawModes();
}
function clearFilters(){topic='all';mode='all';query='';document.getElementById('srch').value='';
  applyTheme('all');rebuild();drawSpine();drawModes();}
function nextUnseen(){const n=list.length; if(!n)return;
  for(let k=1;k<=n;k++){const j=(idx+k)%n; if(!isDone(list[j].n)){idx=j;draw();return;}}
  alert('No unseen questions left in this selection.');}

/* ---------- exam mode ---------- */
const PW=document.getElementById('practiceWrap'), EW=document.getElementById('examWrap');
let EX=null, clock=null;
function show(which){PW.hidden=which!=='practice';EW.hidden=which==='practice';if(which==='practice')stopClock();}
function stopClock(){if(clock){clearInterval(clock);clock=null;}}

function examSetup(){
  stopTick(); show('exam'); window.scrollTo(0,0); applyTheme('all');
  const cfg={scope:'all',count:20,dur:'auto',neg:0.25};
  const poolSize=()=>cfg.scope==='all'?Q.length:Q.filter(q=>q.t===cfg.scope).length;
  const counts=()=>[10,20,30,50,'all'].filter(v=>v==='all'||v<=poolSize());
  const autoMin=()=>Math.max(5,Math.round((cfg.count==='all'?poolSize():cfg.count)*1.2));

  EW.innerHTML='<div class="setup card"><h2>Exam mode</h2>'+
   '<p class="lead">A timed paper with negative marking, an answer palette and a full review afterwards. '+
   'Answers are saved as you go, so refreshing or closing the tab will not lose the paper.</p>'+
   '<div class="frow"><div class="fl">Scope</div><select class="sel" id="fScope">'+
     '<option value="all">All chapters ('+Q.length+' questions)</option>'+
     ORDER.map(t=>'<option value="'+t+'">'+esc(FULL[t])+' ('+Q.filter(q=>q.t===t).length+')</option>').join('')+
   '</select></div>'+
   '<div class="frow"><div class="fl">Number of questions</div><div class="chips" id="fCount"></div></div>'+
   '<div class="frow"><div class="fl">Duration</div><div class="chips" id="fDur"></div>'+
     '<div class="note" id="durNote"></div></div>'+
   '<div class="frow"><div class="fl">Negative marking</div><div class="chips" id="fNeg"></div></div>'+
   '<div class="nav" style="border:none;background:none;padding:6px 0 0">'+
     '<button class="nb" id="bBack">← Back to practice</button>'+
     '<button class="nb pri" id="bStart" style="margin-left:auto">Start test</button></div></div>';

  function chipSet(host,opts,key,label){
    const el=document.getElementById(host); el.innerHTML='';
    opts.forEach(v=>{const b=document.createElement('button');
      b.className='chip'+(cfg[key]===v?' on':''); b.textContent=label(v);
      b.onclick=()=>{cfg[key]=v;render();}; el.appendChild(b);});
  }
  function render(){
    if(cfg.count!=='all'&&cfg.count>poolSize())cfg.count=counts()[0];
    chipSet('fCount',counts(),'count',v=>v==='all'?'All '+poolSize():String(v));
    chipSet('fDur',['auto',10,15,20,30,45,60],'dur',v=>v==='auto'?'Auto':v+' min');
    chipSet('fNeg',[0,0.25,0.33,0.5],'neg',v=>v===0?'None':'−'+v+' per wrong');
    document.getElementById('durNote').textContent = cfg.dur==='auto'
      ? 'Auto gives '+autoMin()+' minutes — about 1.2 minutes per question.'
      : cfg.dur+' minutes for '+(cfg.count==='all'?poolSize():cfg.count)+' questions.';
  }
  document.getElementById('fScope').onchange=e=>{cfg.scope=e.target.value;applyTheme(cfg.scope);render();};
  document.getElementById('bBack').onclick=()=>{show('practice');draw();};
  document.getElementById('bStart').onclick=()=>startExam({scope:cfg.scope,
    count:cfg.count==='all'?poolSize():cfg.count, dur:cfg.dur==='auto'?autoMin():cfg.dur, neg:cfg.neg});
  render();
}

function startExam(cfg){
  let p=(cfg.scope==='all'?Q.slice():Q.filter(q=>q.t===cfg.scope));
  shuffle(p); p=p.slice(0,cfg.count);
  EX={ids:p.map(q=>q.n),ord:{},ans:{},mark:{},seen:{},times:{},cur:0,
      start:Date.now(),dur:cfg.dur*60000,neg:cfg.neg,scope:cfg.scope,done:false};
  p.forEach(q=>EX.ord[q.n]=ordFor(q));
  S.exam=EX; save(); qStart=Date.now(); drawExam();
}
const remain=()=>EX.dur-(Date.now()-EX.start);
function logTime(){const n=EX.ids[EX.cur];EX.times[n]=(EX.times[n]||0)+(Date.now()-qStart);qStart=Date.now();}
function gotoQ(i){logTime();EX.cur=i;EX.seen[EX.ids[i]]=1;save();drawExam();}

function drawExam(){
  show('exam'); stopTick();
  const n=EX.ids[EX.cur], q=byN[n], ordq=EX.ord[n], pick=EX.ans[n];
  EX.seen[n]=1; applyTheme(q.t);
  EW.innerHTML='<div class="exbar"><div><div class="clab">Time left</div>'+
    '<div class="clock" id="clk">'+fmt(remain())+'</div></div><div class="gap"></div>'+
    '<div style="font-size:12.5px;color:var(--ink2)">Question <b>'+(EX.cur+1)+'</b> of '+EX.ids.length+
    ' · '+Object.keys(EX.ans).length+' answered</div>'+
    '<button class="nb warn" id="bSub">Submit test</button></div>'+
   '<div class="exgrid"><div><div class="card"><div class="qhead">'+
    '<span class="qno">Q'+(EX.cur+1)+'</span><span class="tag exam">'+esc(q.e)+'</span>'+
    '<span class="tag">'+esc(FULL[q.t])+'</span></div>'+
    '<div class="qbody"><p class="qtext">'+esc(q.q)+'</p><div class="opts">'+
    ordq.map((oi,slot)=>'<button class="opt'+(pick===oi?' sel':'')+'" data-o="'+oi+'">'+
      '<span class="k">'+LET[slot]+'</span><span class="tx">'+esc(q.o[oi])+'</span></button>').join('')+
    '</div></div><div class="nav">'+
    '<button class="nb" id="bPrev"'+(EX.cur===0?' disabled':'')+'>← Prev</button>'+
    '<button class="nb" id="bClear">Clear</button>'+
    '<button class="nb" id="bMark">'+(EX.mark[n]?'Unmark':'Mark for review')+'</button>'+
    '<button class="nb pri" id="bNext" style="margin-left:auto"'+(EX.cur>=EX.ids.length-1?' disabled':'')+'>Save &amp; next →</button>'+
    '</div></div></div>'+
    '<div class="palwrap"><div class="palhead">Answer palette</div><div class="pal" id="pal"></div>'+
    '<div class="leg"><div><i class="a"></i>Answered</div><div><i class="m"></i>Marked for review</div>'+
    '<div><i class="s"></i>Seen, not answered</div><div><i></i>Not visited</div></div></div></div>';

  [].forEach.call(EW.querySelectorAll('.opt'),b=>b.onclick=()=>{EX.ans[n]=+b.dataset.o;save();drawExam();});
  document.getElementById('bClear').onclick=()=>{delete EX.ans[n];save();drawExam();};
  document.getElementById('bMark').onclick=()=>{EX.mark[n]=!EX.mark[n];save();drawExam();};
  document.getElementById('bPrev').onclick=()=>{if(EX.cur>0)gotoQ(EX.cur-1);};
  document.getElementById('bNext').onclick=()=>{if(EX.cur<EX.ids.length-1)gotoQ(EX.cur+1);};
  document.getElementById('bSub').onclick=()=>{
    const un=EX.ids.length-Object.keys(EX.ans).length;
    if(confirm('Submit the test?'+(un?' '+un+' question'+(un>1?'s are':' is')+' still unanswered.':'')))submitExam(false);};

  const pal=document.getElementById('pal');
  EX.ids.forEach((id,i)=>{const b=document.createElement('button');
    let c='pb'; if(EX.ans[id]!==undefined)c+=' ans'; else if(EX.seen[id])c+=' skip';
    if(EX.mark[id])c+=' mark'; if(i===EX.cur)c+=' cur';
    b.className=c; b.textContent=i+1; b.title='Question '+(i+1);
    b.onclick=()=>gotoQ(i); pal.appendChild(b);});

  stopClock();
  clock=setInterval(()=>{
    const el=document.getElementById('clk'); if(!el){stopClock();return;}
    const r=remain(); el.textContent=fmt(r); el.classList.toggle('low',r<60000);
    if(r<=0){stopClock();submitExam(true);}},500);
}
function submitExam(auto){
  logTime(); stopClock();
  EX.done=true; EX.end=Date.now(); EX.auto=!!auto; S.exam=EX;
  EX.ids.forEach(id=>{ if(EX.ans[id]!==undefined && S.pick[id]===undefined){
    S.pick[id]=EX.ans[id]; if(EX.times[id])S.time[id]=EX.times[id]; }});
  save(); drawResult();
}
function scoreOf(){
  let right=0,wrong=0,skip=0;
  EX.ids.forEach(id=>{const a=EX.ans[id];
    if(a===undefined)skip++; else if(a===byN[id].a)right++; else wrong++;});
  return {right:right,wrong:wrong,skip:skip,score:right-wrong*EX.neg,max:EX.ids.length};
}
function archive(r,total){
  S.hist.push({ts:EX.end,scope:EX.scope,n:EX.ids.length,score:r.score,max:r.max,
    right:r.right,wrong:r.wrong,skip:r.skip,time:total});
  if(S.hist.length>40)S.hist=S.hist.slice(-40);
  S.exam=null; EX=null; save();
}
function drawResult(){
  show('exam'); stopClock(); window.scrollTo(0,0); applyTheme(EX.scope);
  const r=scoreOf(), total=EX.end-EX.start, att=r.right+r.wrong;
  const accy=att?Math.round(r.right/att*100):0;
  const times=EX.ids.map(id=>EX.times[id]||0).filter(v=>v>0);
  const avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;
  const slow=EX.ids.slice().sort((a,b)=>(EX.times[b]||0)-(EX.times[a]||0))[0];
  const verd=!att?'No questions were attempted.':accy>=75?'Strong paper — keep this pace.':
    accy>=50?'Solid, but the missed ones deserve a revision pass.':
    'Worth going back to the theory for this scope before the next attempt.';
  const bych={};
  EX.ids.forEach(id=>{const t=byN[id].t;bych[t]=bych[t]||{n:0,r:0};bych[t].n++;
    if(EX.ans[id]===byN[id].a)bych[t].r++;});

  EW.innerHTML='<div class="res"><div class="score">'+
    '<div class="big">'+(Math.round(r.score*100)/100)+'</div>'+
    '<div class="of">out of '+r.max+(EX.neg?' · −'+EX.neg+' per wrong answer':' · no negative marking')+'</div>'+
    '<div class="verd">'+(EX.auto?'Time ran out. ':'')+verd+'</div></div>'+
    '<div class="sgrid">'+
     '<div class="sbox g"><div class="v">'+r.right+'</div><div class="l">Correct</div></div>'+
     '<div class="sbox r"><div class="v">'+r.wrong+'</div><div class="l">Wrong</div></div>'+
     '<div class="sbox y"><div class="v">'+r.skip+'</div><div class="l">Unattempted</div></div>'+
     '<div class="sbox"><div class="v">'+accy+'%</div><div class="l">Accuracy</div></div>'+
     '<div class="sbox"><div class="v">'+fmt(total)+'</div><div class="l">Time taken</div></div>'+
     '<div class="sbox"><div class="v">'+fmtShort(avg)+'</div><div class="l">Avg / question</div></div></div>'+
    '<div class="brk"><h3>Chapter breakdown</h3>'+
      Object.keys(bych).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(t=>{
        const v=bych[t];return '<div class="brow"><span class="bn">'+esc(FULL[t])+'</span>'+
        '<span class="bb"><i style="width:'+(v.r/v.n*100)+'%"></i></span>'+
        '<span class="bv">'+v.r+'/'+v.n+'</span></div>';}).join('')+
      (slow&&EX.times[slow]?'<div class="brow" style="margin-top:8px;border-top:1px solid var(--line);padding-top:9px">'+
        '<span class="bn">Longest on Q'+slow+' · '+esc(FULL[byN[slow].t])+'</span>'+
        '<span class="bv">'+fmtShort(EX.times[slow])+'</span></div>':'')+'</div>'+
    '<div class="chips" id="rvF"></div><div class="rvlist" id="rvL"></div>'+
    '<div class="nav" style="border:none;background:none;padding:18px 0 0">'+
      '<button class="nb" id="bDone">← Back to practice</button>'+
      '<button class="nb pri" id="bAgain" style="margin-left:auto">New test</button></div></div>';

  let f=r.wrong?'wrong':'all';
  const fdefs=[['wrong','Wrong',r.wrong],['skip','Unattempted',r.skip],['right','Correct',r.right],['all','All',r.max]];
  function paintF(){const el=document.getElementById('rvF');el.innerHTML='';
    fdefs.forEach(d=>{const b=document.createElement('button');
      b.className='chip'+(f===d[0]?' on':'');b.innerHTML=esc(d[1])+'<span class="n">'+d[2]+'</span>';
      b.onclick=()=>{f=d[0];paintF();paintL();};el.appendChild(b);});}
  function paintL(){
    const el=document.getElementById('rvL');
    const ids=EX.ids.filter(id=>{const a=EX.ans[id];
      return f==='all'||(f==='skip'&&a===undefined)||(f==='right'&&a===byN[id].a)||
             (f==='wrong'&&a!==undefined&&a!==byN[id].a);});
    if(!ids.length){el.innerHTML='<div class="card"><div class="empty"><p>Nothing in this group.</p></div></div>';return;}
    el.innerHTML=ids.map(id=>{const q=byN[id],a=EX.ans[id];
      return '<div class="card"><div class="qhead"><span class="qno">Q'+q.n+'</span>'+
        '<span class="tag exam">'+esc(q.e)+'</span><span class="tag">'+esc(FULL[q.t])+'</span>'+
        '<span class="sp"><span class="tmr">'+fmtShort(EX.times[id])+'</span></span></div>'+
        '<div class="qbody"><p class="qtext" style="font-size:16.5px">'+esc(q.q)+'</p><div class="opts">'+
        EX.ord[id].map((oi,slot)=>{let c='opt lk',mk='';
          if(oi===q.a){c+=' ok';mk='<span class="mk">✓</span>';}
          else if(oi===a){c+=' no';mk='<span class="mk">✗</span>';}
          return '<button class="'+c+'"><span class="k">'+LET[slot]+'</span><span class="tx">'+
            esc(q.o[oi])+'</span>'+mk+'</button>';}).join('')+'</div>'+
        '<div class="exp"><div class="vd '+(a===undefined?'':a===q.a?'g':'r')+'"><b>'+
        (a===undefined?'Not attempted':a===q.a?'Correct':'Not quite')+'</b>'+
        '<span style="color:var(--ink3)">· answer: '+esc(q.o[q.a])+'</span></div><ul>'+
        q.x.map(b=>'<li>'+b+'</li>').join('')+'</ul></div></div></div>';}).join('');}
  paintF();paintL();
  document.getElementById('bDone').onclick=()=>{archive(r,total);show('practice');
    drawSpine();drawModes();rebuild();};
  document.getElementById('bAgain').onclick=()=>{archive(r,total);examSetup();};
}

document.getElementById('theme').onclick=()=>{
  S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.t=S.theme;applyBg();save();};
document.getElementById('bgBtn').onclick=()=>{
  S.bg=BG[(BG.indexOf(S.bg)+1)%BG.length];applyBg();save();};
document.getElementById('reset').onclick=()=>{
  if(!confirm('Clear all answers, timings, stars and test history? This cannot be undone.'))return;
  S={pick:{},star:{},time:{},theme:S.theme,bg:S.bg,exam:null,hist:[]};
  EX=null;stopClock();save();show('practice');rebuild();drawSpine();drawModes();};
document.getElementById('shuf').onclick=e=>{
  shuffled=!shuffled;e.currentTarget.classList.toggle('on',shuffled);
  e.currentTarget.textContent=shuffled?'⤮ Shuffled':'⤮ Shuffle';rebuild();};
document.getElementById('jump').onclick=nextUnseen;
document.getElementById('goExam').onclick=examSetup;
let tmr2;document.getElementById('srch').oninput=e=>{clearTimeout(tmr2);
  tmr2=setTimeout(()=>{query=e.target.value.trim();rebuild();drawModes();},180);};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(EX&&!EX.done){
    const n=EX.ids[EX.cur], ordq=EX.ord[n];
    if(e.key>='1'&&e.key<='5'){const s=+e.key-1;
      if(s<ordq.length){e.preventDefault();EX.ans[n]=ordq[s];save();drawExam();}}
    else if(e.key==='ArrowRight'){if(EX.cur<EX.ids.length-1)gotoQ(EX.cur+1);}
    else if(e.key==='ArrowLeft'){if(EX.cur>0)gotoQ(EX.cur-1);}
    else if(e.key==='m'||e.key==='M'){EX.mark[n]=!EX.mark[n];save();drawExam();}
    return;
  }
  if(!PW.hidden){
    const q=list[idx]; if(!q)return;
    if(e.key>='1'&&e.key<='5'){const s=+e.key-1;
      if(ord&&s<ord.length&&S.pick[q.n]===undefined){e.preventDefault();answer(ord[s]);}}
    else if(e.key==='ArrowRight'){if(idx<list.length-1){idx++;draw();}}
    else if(e.key==='ArrowLeft'){if(idx>0){idx--;draw();}}
    else if(e.key==='s'||e.key==='S'){S.star[q.n]=!S.star[q.n];save();draw();drawModes();}
    else if(e.key==='r'||e.key==='R'){if(S.pick[q.n]===undefined)answer(-1);}
    else if(e.key==='n'||e.key==='N'){nextUnseen();}
  }
});

applyTheme('all'); drawSpine(); drawModes(); rebuild();
if(S.exam&&S.exam.ids&&S.exam.ids.length){
  EX=S.exam;
  if(EX.done)drawResult();
  else if(remain()>0){qStart=Date.now();drawExam();}
  else submitExam(true);
}
</script>

    btn.href = 'index.html';
    btn.style.cssText = 'display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;text-decoration:none;margin-right:6px;flex:none;transition:border-color .15s,color .15s;';
    btn.textContent = '← Home';
    btn.onmouseover = () => { btn.style.borderColor = 'var(--acc-line)'; btn.style.color = 'var(--acc)'; };
    btn.onmouseout = () => { btn.style.borderColor = 'var(--line)'; btn.style.color = 'var(--ink)'; };
    hwrap.prepend(btn);
  }
})();
