ihar."}],"xref":null}]},{"title":"Economic Scenario","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Who presented the Bihar Budget 2024-25 in the State Assembly ?"}],"opts":[{"k":"a","t":"Shri Vijay Sinha"},{"k":"b","t":"Shri Nitish Kumar"},{"k":"c","t":"Shri Vijay Kumar Choudhary"},{"k":"d","t":"Shri Samrat Choudhary"}],"ans":"d","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 13 February, 2024, the State Budget for the financial year 2024–25 was presented in the Bihar Legislative Assembly by the Deputy Chief Minister of Bihar and the then Finance Minister, Samrat Choudhary. The State Budget for the year 2025–26 was also presented by him on 3 March, 2025."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"Which of the following statements is/are correct about Bihar's economic performance in 2023-24?"}],"opts":[{"k":"a","t":"Bihar's per capita GSDP at current prices increased by 12.8% in 2023 24 over the previous year"},{"k":"b","t":"The estimated share of the tertiary sector in Bihar's GSVA (constant prices) in 2023-24 was 58.6%"},{"k":"c","t":"The Gross Fixed Capital Formation (GFCF) formed 4.6% of GSDP at current prices in 2023-24"},{"k":"d","t":"More than one of the above"}],"ans":"d","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2024–25, in 2023–24 Bihar’s per capita GSDP at current prices increased by 12.8 percent over the previous year to approximately ₹66,828. At constant prices (2011–12), the estimated share of the tertiary (service) sector in Bihar’s Gross State Value Added for 2023–24 was 58.6 percent. Gross Fixed Capital Formation at current prices increased from 1.6 percent of GSDP in 2019–20 to 4.6 percent of GSDP in 2023–24."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"How is the fiscal deficit estimated in Bihar during 2021- 22?"}],"opts":[{"k":"a","t":"Rs 22,511 crore"},{"k":"b","t":"Rs 27,617 crore"},{"k":"c","t":"Rs 20,011 crore"},{"k":"d","t":"Rs 21,543 crore"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Budget Estimates for 2021–22, the fiscal deficit of Bihar was estimated at ₹22,510.78 crore. In the Budget Estimates for 2025–26, the fiscal deficit is estimated at ₹32,718.30 crore, which is 2.98 percent of the Gross State Domestic Product. Therefore, the nearest correct answer is option (a)."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Which sector received the highest allocation in the Bihar Budget 2024-25 ?"}],"opts":[{"k":"a","t":"Agriculture"},{"k":"b","t":"Health"},{"k":"c","t":"Infrastructure"},{"k":"d","t":"Education"}],"ans":"d","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the Bihar State Budget 2024–25, the Education Department received the highest allocation. In the year 2024–25, a budget of ₹52,639.03 crore was proposed for the Education Department. In the Bihar Budget 2025–26 as well, the Education Department received the highest allocation of ₹60,964.87 crore. After that, ₹20,035.80 crore was allocated for the Health Department."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Taking 2011–12 as the base year, what was Bihar’s per capita Net State Domestic Product at current prices for the financial year 2022–23?"}],"opts":[{"k":"a","t":"₹54,111"},{"k":"b","t":"₹42,083"},{"k":"c","t":"₹61,434"},{"k":"d","t":"₹47,498"}],"ans":"a","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was the correct answer. However, according to the Economic Survey 2024–25, for the financial year 2022–23, Bihar’s per capita Net State Domestic Product (Per Capita Net State Domestic Product) at current prices (2011–12 series) was ₹53,478. For the financial year 2021–22, it was recorded at ₹47,296. During this period, in terms of per capita NSDP, Bihar was at the lowest position among all the States / Union Territories of the country."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"The per capita Net State Domestic Product at constant prices for Bihar is less than that of the country. In the year 2018-19, it was"}],"opts":[{"k":"a","t":"75 percent of the national average"},{"k":"b","t":"60 percent of the national average"},{"k":"c","t":"50 percent of the national average"},{"k":"d","t":"33 percent of the national average"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2019–20, Bihar’s per capita Net State Domestic Product at constant prices in the year 2018–19 was ₹30,617, whereas at the national level it was ₹92,565. Thus, Bihar’s per capita income was 33.1 percent of the national average, which is close to option (d). According to the Bihar Economic Survey 2024–25, in the year 2023–24 (Q), at constant prices (2011–12), Bihar’s per capita Net State Domestic Product was ₹32,174, which is only 30.14 percent of the national average of ₹1,06,744."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"What is the contribution of agriculture to the Gross Domestic Product (GDP) of Bihar ?"}],"opts":[{"k":"a","t":"19%"},{"k":"b","t":"17%"},{"k":"c","t":"33%"},{"k":"d","t":"26%"}],"ans":"*","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2023–24, in the year 2022–23 (Q), the contribution of agriculture, forestry and fisheries to Bihar’s Gross State Value Added (GSVA) at constant prices (2011–12) was 19.8 percent. Note that the share of the secondary and tertiary sectors is approximately 20 percent and 60 percent, respectively. The Bihar Public Service Commission deleted this question in the final answer key. According to the Bihar Economic Survey 2024–25, in the year 2023–24 (Q), at constant prices (2011–12), the contribution of agriculture, forestry and fisheries to Bihar’s GSVA was 19.5 percent."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"The 60.2 percent share in GSDP of Bihar in 2019-20 was that of"}],"opts":[{"k":"a","t":"Service Sector"},{"k":"b","t":"Manufacturing Sector"},{"k":"c","t":"Industrial Sector"},{"k":"d","t":"Agriculture Sector"}],"ans":"a","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was the correct answer. According to the Bihar Economic Survey 2024–25, in the year 2023–24 (Quick), at constant prices (2011–12), the contribution of the tertiary sector (service sector) to Bihar’s GSVA was 58.6 percent."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"The contribution of agricultural and allied sectors to the Gross State Value Added (GSVA) of Bihar state was _____ in the financial year 2017-18."}],"opts":[{"k":"a","t":"17 percent"},{"k":"b","t":"18 percent"},{"k":"c","t":"19 percent"},{"k":"d","t":"20 percent"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At constant prices (2011–12), the share of agriculture and allied sectors in Bihar’s Gross State Value Added in the year 2017–18 was 21 percent (21.5 percent according to the Bihar Economic Survey 2024–25). According to the Bihar Economic Survey 2024–25, in the years 2021–22, 2022–23 (P) and 2023–24 (Q), at constant prices (2011–12), the share of agriculture and allied sectors in Gross State Value Added (GSVA) was 21.1 percent, 20.2 percent and 19.5 percent, respectively."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"What was the growth rate of the Bihar economy at constant prices in the year 2018-19?"}],"opts":[{"k":"a","t":"13.53%"},{"k":"b","t":"11.53%"},{"k":"c","t":"12.53%"},{"k":"d","t":"10.53%"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The growth rate of Bihar’s economy at constant prices in the year 2018–19 was 10.53 percent (10.9 percent according to the Bihar Economic Survey 2024–25). According to the Bihar Economic Survey 2024–25, for the years 2022–23 (estimate) and 2023–24 (Quick estimate), Bihar’s economic growth rate is estimated at 9.8 percent and 9.2 percent, respectively."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"The fiscal deficit is expected to be of GSDP of Bihar for the financial year 2022-23."}],"opts":[{"k":"a","t":"3.18%"},{"k":"b","t":"12.1%"},{"k":"c","t":"3.47%"},{"k":"d","t":"9.89%"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Budget Estimates, 2022–23, for the financial year 2022–23 the fiscal deficit (₹25,885.10 crore) was about 3.47 percent of Bihar’s GSDP (₹7,45,310 crore). In the Bihar Budget 2025–26, it is estimated at 2.98 percent of the GSDP (₹10,97,264 crore)."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Which state has the lowest per capita income in India at the current prices?"}],"opts":[{"k":"a","t":"Bihar"},{"k":"b","t":"Odisha"},{"k":"c","t":"Rajasthan"},{"k":"d","t":"Gujarat"}],"ans":"a","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"As per the time reference of the question and the Economic Survey 2024–25, option (a) is also the correct answer. According to the Bihar Economic Survey 2024–25, at constant prices (2011–12) Bihar’s per capita income in 2023–24 (Q) and 2022–23 (P) was ₹36,333 and ₹33,763 respectively (per capita GSDP). During the same period, at current prices it was ₹66,828 and ₹59,244 respectively."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"The percentage share of agricultural labour in total workers of Bihar is –"}],"opts":[{"k":"a","t":"40.18 percent"},{"k":"b","t":"48.18 percent"},{"k":"c","t":"29.17 percent"},{"k":"d","t":"46.18 percent"}],"ans":"*","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Census of 2001, the work participation rate in India was 39.1 percent, whereas in Bihar it was 33.7 percent. The proportion of agricultural labourers in Bihar’s total workforce was about 48 percent. According to the Census of 2011, the share of agricultural labourers in total workers was 52.8 percent. As per the Bihar Economic Survey 2024–25, in 2023–24 the percentage of workers (male + female) engaged in agriculture, forestry and fishing in Bihar was 54.2, while for all India it was 46.1 percent."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"'Bihar Economic Survey', for the first time, was published for the Financial Year"}],"opts":[{"k":"a","t":"2004-05"},{"k":"b","t":"2006-07"},{"k":"c","t":"2008-09"},{"k":"d","t":"2009-10"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Government of Bihar presented the ‘Bihar Economic Survey’ for the first time for the financial year 2006–07. It was presented by the then Deputy Chief Minister and State Finance Minister, Sushil Kumar Modi."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"When did Bihar State introduce the Green Budget for the first time ?"}],"opts":[{"k":"a","t":"Financial Year 2020-21"},{"k":"b","t":"Financial Year 2018-19"},{"k":"c","t":"Financial Year 2021-22"},{"k":"d","t":"Financial Year 2019-20"}],"ans":"a","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar presented the Green Budget for the first time in the financial year 2020–21. Bihar is the first state in the country to present a separate Green Budget with the objective of aligning government expenditure with environmental considerations."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"What is the percentage of population in Bihar State employed in the agriculture sector in 2017-18?"}],"opts":[{"k":"a","t":"65"},{"k":"b","t":"65"},{"k":"c","t":"68"},{"k":"d","t":"70"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Agriculture is the backbone of Bihar’s economy, in which more than 75 percent of the state’s population is engaged. According to the Bihar Economic Survey 2024–25, in 2017–18 the share of agriculture, livestock, forestry and fisheries in employment in Bihar was 45.1 percent, which increased to 54.2 percent in 2023–24 (Quick / Provisional)."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"The growth rate of the tertiary sector in Bihar during the year 2017-18 was :"}],"opts":[{"k":"a","t":"14.2%"},{"k":"b","t":"14.6%"},{"k":"c","t":"15.6%"},{"k":"d","t":"15.2%"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2018–19, during 2017–18 the growth rate of the tertiary sector in Bihar at constant (2011–12) prices and current prices was 14.6 percent and 17.9 percent respectively. During the same period, the growth rates of the primary sector at constant (2011–12) prices and current prices were 1.4 percent and 6.1 percent respectively, and for the secondary sector they were 2.5 percent and 4.1 percent respectively. According to the Bihar Economic Survey 2024–25, in 2023–24 (Q) the estimated growth rates at constant prices for the primary, secondary and tertiary sectors are 5.7 percent, 8.2 percent and 10.8 percent respectively."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"The Gross State Domestic Product (GSDP) of Bihar at current prices in the year 2017-18 was :"}],"opts":[{"k":"a","t":"Rs. 4,87,628 crores"},{"k":"b","t":"Rs. 3,61,504 crores"},{"k":"c","t":"Rs. 1,50,036 crores"},{"k":"d","t":"Rs. 5,63,424 crores"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to Bihar Economic Survey, 2018-19, the Gross State Domestic Product (GSDP) of Bihar State at current and constant (2011-12) prices was Rs 4,87,628 crore and Rs 3,61,504 crore respectively in the year 2017-18 (Rs 468746 crore and Rs 344028 crore respectively as per Bihar Economic Survey, 2024-25), whereas as per Bihar Economic Survey, 2024-25,the Gross State Domestic Product of Bihar at constant (2011-12) and current prices is estimated to be Rs 854429 crore and Rs 464540 crore respectively in 2023-24 (Q)."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"What was the economic growth rate of the State of Bihar during the year 2016-17?"}],"opts":[{"k":"a","t":"6.3 percent"},{"k":"b","t":"7.3 percent"},{"k":"c","t":"8.3 percent"},{"k":"d","t":"9.3 percent"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the 12th Economic Survey Report of Bihar, the state's Gross Domestic Growth rate increased to 10.3 percent in 2016-17 [13.3 percent and 7.5 percent at current and constant prices (2011-12), respectively, as per Bihar Economic Survey 2024-25] from 7.5 percent during 2015- 16 [8.4 percent and 6.1 percent at current and constant prices (2011-12), respectively, as per Bihar Economic Survey 2024-25]. According to Bihar Economic Survey 2024-25, it is estimated to grow at 14.5 percent and 9.2 percent at current and constant prices (2011-12), respectively, during 2023-24 (Q)."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"In Bihar which sector recorded the highest growth during 2005-06 to 2014-15 ?"}],"opts":[{"k":"a","t":"Agriculture"},{"k":"b","t":"Banking"},{"k":"c","t":"Registered Manufacturing"},{"k":"d","t":"Transport"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, during 2005-06 to 2014-15, the registered manufacturing sector recorded the highest average annual growth rate. In 2023-24, the three major activities that recorded high economic growth were Hotels and Restaurants (29.1%), Mining (21.1%), and Storage (18.3%)."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"The reason for the maximum number of people below the poverty line in the state of Bihar is:"}],"opts":[{"k":"a","t":"Failure of land reforms"},{"k":"b","t":"Lack of political will"},{"k":"c","t":"Larger number of working class"},{"k":"d","t":"All of these"}],"ans":"d","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar is one of the poorest states in India. The main reason for poverty in Bihar has been the failure of land reforms in the state. The cause of this failure has been the lack of political will. Further, being an industrially backward state, Bihar also has a comparatively large labour force. Therefore, all the above three options are major reasons for Bihar’s backwardness and the resulting poverty."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"The Planning Commission estimated the following percentage of Below Poverty Line (BPL) for Bihar in 1993-94—"}],"opts":[{"k":"a","t":"55"},{"k":"b","t":"65"},{"k":"c","t":"45"},{"k":"d","t":"35"}],"ans":"a","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On the Lakdawala formula, the percentage of people below the poverty line for Bihar in 1993-94 was estimated at 54.96. In 2004-05, the percentage of poverty in Bihar was 41.4. On the Suresh Tendulkar formula, poverty was 54.4 percent in 2004-05 and 33.7 percent in 2011-12. During 2019-21, poverty in Bihar was 33.76 percent."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"Bihar Government has introduced the Comprehensive Financial Management System (CFMS) on 1st April, 2019. This system"}],"opts":[{"k":"a","t":"Will make all financial activities in the State online and paperless"},{"k":"b","t":"Will solve the problem of NPA of banks"},{"k":"c","t":"Will ensure effective implementation of State projects"},{"k":"d","t":"Will manage state governmentfinances including local bodies"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Comprehensive Financial Management System (CFMS) was started in Bihar to strengthen public financial management, digitize related work, promote electronic transactions, and ensure a single, reliable source of data. The system provides effective financial control, tracking, and reliability in reporting within the regulatory and institutional framework. It is noteworthy that for implementing all types of financial activities under the state government, CFMS 2.0 is being implemented from 1 January, 2025 in place of CFMS 1.0. Note—In the given question, instead of “Public Financial Management System”, it should be “Comprehensive Financial Management System”."}],"xref":null},{"n":24,"g":null,"stem":[{"type":"p","text":"The outstanding liability of the State of Bihar is-"}],"opts":[{"k":"a","t":"Rs. 37,653 crores"},{"k":"b","t":"Rs. 67,653 crores"},{"k":"c","t":"Rs. 87,663 crores"},{"k":"d","t":"Rs. 90,000 crores"}],"ans":"*","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the reference materials, data relating to Bihar’s outstanding debt for that period were not available. As per the reference materials, the then Deputy Chief Minister of the state, Sushil Kumar Modi, presented a White Paper on the state’s debts in the Bihar Legislative Assembly in April 2006. According to the White Paper, Bihar’s outstanding debt in 2005–06 was 42,483 crore rupees. For the financial year 2025–26, the outstanding public debt is estimated at 353,819.11 crore rupees, which is 32.25% of the GSDP of 1,097,264 crore rupees. By the end of 2025–26, the outstanding public debt, along with other liabilities, is estimated at 406,476.12 crore rupees, which is 37.04% of the GSDP of 1,097,264 crore rupees."}],"xref":null},{"n":25,"g":null,"stem":[{"type":"p","text":"In 2006–07, Bihar’s developmental expenditure as a share of its total expenditure was—"}],"opts":[{"k":"a","t":"60 percent"},{"k":"b","t":"67 percent"},{"k":"c","t":"56 percent"},{"k":"d","t":"54 percent"}],"ans":"a","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was the correct answer. In Bihar Budget 2025–26, the estimated developmental and non-developmental expenditure is 206,818.53 crore rupees and 110,076.48 crore rupees, which is 65.26% and 34.74% of the total estimated expenditure of 316,895.02 crore rupees."}],"xref":null},{"n":26,"g":null,"stem":[{"type":"p","text":"The per capita Gross State Domestic Product (GSDP) of Bihar at current prices in 2017-18 was Rs. 42242.What is the estimated per capita GSDP at constant prices (base year 2011-12)?"}],"opts":[{"k":"a","t":"Rs. 31316"},{"k":"b","t":"Rs. 30000"},{"k":"c","t":"Rs. 21316"},{"k":"d","t":"Rs. 20000"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. Re-Exam. (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2018–19, Bihar’s per capita GSDP in 2017–18 (Q) at current prices was 42,242 rupees, while during the same period at constant prices (2011–12) it was 31,316 rupees. As per the Bihar Economic Survey 2024–25, the per capita GSDP at current prices in 2023–24 (Q) is estimated at 66,828 rupees, and at constant prices at 36,333 rupees."}],"xref":null},{"n":27,"g":null,"stem":[{"type":"p","text":"Choose the correct order of the Bihar State districts in descending order of per capita income."}],"opts":[{"k":"a","t":"Nawada > Kishanganj > East Champaran > Araria > Sheohar"},{"k":"b","t":"Sheohar > Araria > East Champaran > Kishanganj > Nawada"},{"k":"c","t":"East Champaran > Sheohar > Araria > Kishanganj > Nawada"},{"k":"d","t":"Araria > Nawada > East Champaran > Sheohar > Kishanganj"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"As per the data released in the Bihar Economic Survey 2021–22, at constant prices (2011–12) with reference to 2019–20, the descending order of the per capita Gross District Domestic Product of the given districts is— Nawada (23,351 rupees) > Kishanganj (23,222 rupees) > East Champaran (22,306 rupees) > Araria (20,613 rupees) > Sheohar (19,592 rupees). As per the Bihar Economic Survey 2024–25, the per capita Gross District Domestic Product of the given districts in 2022–23 is as follows— Per capita Gross District Domestic Product (Year 2022–23) (in rupees) Current prices Constant prices Kishanganj: 47,831 25,493 Nawada 40,247 23,065 East Champaran 39,623 22,698 Araria 41,707 22,204 Sheohar 33,399 19,561"}],"xref":null},{"n":28,"g":null,"stem":[{"type":"p","text":"Which district of Bihar in 2018-19, at constant prices (base year 2011-12), is one of the three richest districts(according to per capita income)?"}],"opts":[{"k":"a","t":"Madhepura"},{"k":"b","t":"Supaul"},{"k":"c","t":"Begusarai"},{"k":"d","t":"Sheohar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. Re-Exam. (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (c) was the correct answer. As per the Bihar Economic Survey 2024–25, in 2022–23 the top three richest districts are Patna, Begusarai, and Munger; and the three poorest districts are Sheohar, Sitamarhi, and Araria."}],"xref":null},{"n":29,"g":null,"stem":[{"type":"p","text":"Which district in Bihar is the poorest according to per capita income criteria?"}],"opts":[{"k":"a","t":"Begusarai"},{"k":"b","t":"Madhepura"},{"k":"c","t":"Supaul"},{"k":"d","t":"Sheohar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (d) was the correct answer. As per the Bihar Economic Survey 2024–25, even at present, according to the criterion of per capita income, Sheohar district is the poorest in Bihar. As per the Bihar Economic Survey 2024–25, in 2022–23 the three richest districts of Bihar are Patna (121,396 rupees), Begusarai (49,064 rupees), and Munger (46,795 rupees). The three poorest districts are Sheohar (19,561 rupees), Sitamarhi (21,931 rupees), and Araria (22,204 rupees)."}],"xref":null},{"n":30,"g":null,"stem":[{"type":"p","text":"According to the Economic Survey for the year 2019- 2020, which district has the lowest per capita income?"}],"opts":[{"k":"a","t":"Sitamarhi"},{"k":"b","t":"Sheohar"},{"k":"c","t":"Araria"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Economic Survey for the year 2019–20, the most backward districts of Bihar in terms of per capita income are, respectively, Sheohar, Supaul, and Madhepura. According to the Bihar Economic Survey, 2024–25, the three most backward districts of Bihar in terms of per capita district gross domestic product are, respectively, Sheohar (₹19,561), Sitamarhi (₹21,931), and Araria (₹22,204)"}],"xref":null},{"n":31,"g":null,"stem":[{"type":"p","text":"What is the estimated percentage increase in surplus revenue in Bihar in 2018-19 as compared to 2017-18?"}],"opts":[{"k":"a","t":"40%"},{"k":"b","t":"50%"},{"k":"c","t":"54%"},{"k":"d","t":"44%"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["65th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Review, 2019–20, Bihar has been maintaining a continuous revenue surplus since 2004–05. In 2018–19, the revenue surplus was 1.34 percent of the Gross State Domestic Product (GSDP). The revenue surplus kept increasing continuously up to 2014–15, and thereafter increased by 153 percent to reach ₹14,823 crore in 2017–18. However, in 2018–19, it declined by 52.5 percent and stood at ₹6,897 crore. In the state’s budget estimate for 2019–20, the revenue surplus was estimated at ₹21,517 crore. In 2025–26 (budget estimate), the revenue surplus is estimated to be ₹8,831.18 crore (0.80% of GSDP)."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"According to PLFS 2023-24, which of the following statements best describes the nature of employment among women in Bihar?"}],"opts":[{"k":"a","t":"Most women are employed in formal, regular wage jobs"},{"k":"b","t":"The majority of women are self-employed, often serving as helpers in household enterprises"},{"k":"c","t":"Majority of women were engaged in the secondary sector"},{"k":"d","t":"More than one of the above"}],"ans":"b","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2024–25, the Periodic Labour Force Survey (PLFS) classifies employment into three major categories—self-employed, regular wage/ salaried, and casual labour. Analyses based on PLFS 2023–24 indicate that the largest share of working women in Bihar falls under the self-employed category. On the basis of PLFS 2023–24, under the Current Weekly Status (CWS), 83.7 percent of total female workers in Bihar are self-employed, 10.8 percent are casual labour, and only 5.5 percent are regular wage/salaried. Out of these 83.7 percent self-employed female workers, 39.8 percent are engaged as helpers in household enterprises. Note—The category of self-employed workers also includes those workers who had work in household enterprises but could not work due to illness or some other reason."}],"xref":null},{"n":33,"g":null,"stem":[{"type":"p","text":"At what percentage has Bihar registered the lowest Female Workforce Participation Rate for the year 2020- 2022?"}],"opts":[{"k":"a","t":"7% in rural and 9.1% in urban areas"},{"k":"b","t":"4% in rural and 6.5% in urban areas"},{"k":"c","t":"6% in rural and 8.1% in urban areas"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"e","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the data released by the National Sample Survey Office (Ministry of Statistics and Programme Implementation, Government of India), in 2020–21 and 2021–22, Bihar recorded the lowest female workforce participation rate (15 years and above) among all states of India. In 2020–21 and 2021–22, the female workforce participation rate in Bihar was, respectively, 11.2 percent and 10.1 percent in rural areas, and 6.3 percent and 10.5 percent in urban areas. According to the data for 2023–24, the female workforce participation rate in rural and urban areas is 33.1 percent and 15.5 percent, respectively. It is noteworthy that the Bihar Public Service Commission considered option (b) as the correct answer to this question."}],"xref":null},{"n":34,"g":null,"stem":[{"type":"p","text":"According to the National Family Health Survey-5 released by the Union Ministry of Health and Family Welfare on November 24, 2021, there has been a significant improvement in the sex ratio of Bihar. It has increased from_________in 2015-2016 to________in 2020-2022."}],"opts":[{"k":"a","t":"1030, 1050"},{"k":"b","t":"1062, 1090"},{"k":"c","t":"1040, 1070"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the National Family Health Survey (NFHS)-5 released by the Ministry of Health and Family Welfare, an improvement compared to the previous period is reflected in Bihar’s sex ratio. In Bihar, the sex ratio shown as 1062/1000 in the NFHS-4 (2015–16) survey has become 1090/1000 in NFHS-5 (2019–21). Note— The mention of 2020–2022 in the given question is erroneous. Instead, it should be 2019–21."}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"According to the Bihar Economic Survey (2021-2022), what was the rate of growth of Gross State Domestic Product (GSDP) of Bihar in 2020-2021?"}],"opts":[{"k":"a","t":"2.5%"},{"k":"b","t":"3%"},{"k":"c","t":"2%"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey (2021–2022), due to the impact of COVID-19 and the lockdown, Bihar’s Gross State Domestic Product increased by only 2.5 percent in 2020–2021. According to the Bihar Economic Survey (2024–25), in 2023–24, Bihar’s per capita Gross State Domestic Product increased by 12.8 percent at current prices and by 7.6 percent at constant prices (2011–12) compared to the previous year."}],"xref":null},{"n":36,"g":null,"stem":[{"type":"p","text":"Which one of the following is correct for Bihar economy?"}],"opts":[{"k":"a","t":"The occupational structure of the economy is stagnant from above"},{"k":"b","t":"The growth rate is one of the lowest in India at 2.5%"},{"k":"c","t":"Bihar produces mostly primary goods"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"d","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The occupational structure of Bihar’s economy is stagnant in nature at the upper level. Bihar’s economy is mainly based on agriculture (the primary sector). According to the Bihar Economic Survey (2021–22), due to the impact of the lockdown, the growth rate of Bihar’s GSDP at current prices in 2020–21 was 2.5 percent (2.4 percent as per the Bihar Economic Survey, 2024–25), which was the lowest among all the states in India. According to the Bihar Economic Survey (2024–25), in 2023–24, Bihar’s Gross State Domestic Product growth rate compared to the previous year was estimated at 14.5 percent at current prices and 9.2 percent at constant prices (2011–12)."}],"xref":null},{"n":37,"g":null,"stem":[{"type":"p","text":"According to the 15th Finance Commission’s recommendations, how much share will Bihar receive in divisible pool of Central pool of Central taxes from 2021-26?"}],"opts":[{"k":"a","t":"4.12 percent"},{"k":"b","t":"4.23 percent"},{"k":"c","t":"4.89 percent"},{"k":"d","t":"4.06 percent"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the recommendations of the 15th Finance Commission, from 2021–22 to 2025–26, Bihar will receive a 10.058 percent share from the divisible pool of central taxes and duties, which is the second highest among all states. The highest share among all states (17.939%) is received by Uttar Pradesh."}],"xref":null},{"n":38,"g":null,"stem":[{"type":"p","text":"The new ministry proposed in the Bihar Budget for the year 2021-22 focuses on –"}],"opts":[{"k":"a","t":"Child care"},{"k":"b","t":"Women empowerment"},{"k":"c","t":"Infrastructure development"},{"k":"d","t":"Skill and Entrepreneurship Development"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"*","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At present in Bihar, ITIs are operated by the Labour Resources Department and Polytechnic institutions are operated by the Department of Science and Technology, due to which it is not easy to establish coordination between the two sectors. Therefore, to establish coordination and for skill and entrepreneurship development (in the Bihar Budget, 2021– 22), the formation of a separate department, the “Skill Development and Entrepreneurship Department”, was announced. However, the word “ministry” has been used in the question; accordingly, the answer can be option (e). But if “ministry” is taken to mean “department”, then the answer can be option (d)."}],"xref":null},{"n":39,"g":null,"stem":[{"type":"p","text":"Choose the incorrect statement as per the Economic Survey of Bihar, 2021-22."}],"opts":[{"k":"a","t":"The primary sector in Bihar had grown at 2.3 percent"},{"k":"b","t":"The secondary sector in Bihar had grown at 4.8 percent"},{"k":"c","t":"The tertiary sector in Bihar had grown at the highest rate of 8.5 percent"},{"k":"d","t":"The primary sector in Bihar had grown at 2.8 percent"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2021–22, during the period 2016–17 to 2020–21, the growth rate of the primary sector was 2.3%. The medium-term growth rate of the secondary sector was 4.8%, and the tertiary sector recorded the highest growth rate of 8.5%. According to the Bihar Economic Survey, 2024–25, at constant prices (2011– 12), during 2023–24 (Quick Estimate), the growth rates of the primary, secondary, and tertiary sectors in the state’s Gross State Domestic Product were 5.7%, 8.2%, and 10.8%, respectively."}],"xref":null},{"n":40,"g":null,"stem":[{"type":"p","text":"In the history of Bihar for the first time, the economic survey of the State was presented by –"}],"opts":[{"k":"a","t":"Nitish Kumar"},{"k":"b","t":"Lalu Prasad"},{"k":"c","t":"Sushil Modi"},{"k":"d","t":"None of them"}],"ans":"c","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In March 2007, for the first time in Bihar’s history, the Economic Survey was presented by the then Deputy Chief Minister and the State Finance Minister, Sushil Kumar Modi. The Economic Survey 2024–25 and the Budget 2025–26 were presented by the then Finance Minister Samrat Choudhary."}],"xref":null},{"n":41,"g":null,"stem":[{"type":"p","text":"What percentage of its total expenditure is spent by the Government of Bihar on salary and pension alone?"}],"opts":[{"k":"a","t":"40 percent"},{"k":"b","t":"50 percent"},{"k":"c","t":"60 percent"},{"k":"d","t":"46 percent"}],"ans":"*","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"None of the options is correct. In the answer key published by the Bihar Public Service Commission, the answer to this question has been marked with an asterisk. According to the Bihar Economic Survey, 2024–25, in 2023–24, the Bihar Government’s total expenditure on salaries and pension was ₹52,677 crore, which is 27.7% of the total revenue expenditure."}],"xref":null},{"n":42,"g":null,"stem":[{"type":"p","text":"In NITI Aayog's Health Index, 2019, Bihar scored what?"}],"opts":[{"k":"a","t":"30.12"},{"k":"b","t":"30.13"},{"k":"c","t":"32.11"},{"k":"d","t":"32.12"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the second round of NITI Aayog’s Health Index, 2019, Bihar’s score was 32.11. According to the report “Healthy States, Progressive India” released by NITI Aayog in December 2021, in the fourth round of the “Health Index, 2019–20”, Bihar’s score was 31.00. According to the report, the top 5 better-performing large states are— State Score Kerala 82.20 Tamil Nadu 72.42 Telangana 69.96 Andhra Pradesh 69.95 Maharashtra 69.14 According to the report, the 5 poorly-performing large states are— State Score Uttar Pradesh 30.57 Bihar 31.00 Madhya Pradesh 36.72 Rajasthan 41.33 Uttarakhand 44.21 In the ‘Fiscal Health Index, 2025’ released by NITI Aayog, Bihar’s score is 27.8."}],"xref":null},{"n":43,"g":null,"stem":[{"type":"p","text":"Choose the option which is not part of the 'Saat Nischay Part-2 Scheme' of Bihar."}],"opts":[{"k":"a","t":"Yuva Shakti-Progress of Bihar"},{"k":"b","t":"Strong woman, capable woman"},{"k":"c","t":"Irrigation water to every field"},{"k":"d","t":"Airways to everyone"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar Budget Estimates, 2022–23, the components of “Aatmanirbhar Bihar: Saat Nishchay Part-2” (Financial Year 2022–23) are—"},{"type":"list","items":["1. Yuva Shakti—Bihar’s Progress","2. Sashakt Mahila, Saksham Mahila","3. Irrigation water to every field","4. Clean Village—Prosperous Village","5. Clean City—Developed City","6. Accessible Connectivity","7. Additional health facilities for all."]}],"xref":null},{"n":44,"g":null,"stem":[{"type":"p","text":"Which of the following is not included in the Seven Resolves (Saat Nishchay) of Bihar Government?"}],"opts":[{"k":"a","t":"Women employment"},{"k":"b","t":"Clean drinking water"},{"k":"c","t":"Supply of electricity to all households"},{"k":"d","t":"Child welfare"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Bihar Government adopted a common programme for five years based on “Development with Justice”. The Seven Resolves developed for Bihar were included in the Good Governance Programme, 2015–2020. The Seven Resolves include—"},{"type":"list","items":["(i) Economic solutions, strength to youth","(ii) Reserved employment, rights of women","(iii) Electricity to every household, continuously","(iv) Tap water to every household","(v) Paved streets and drains up to every house","(vi) Construction of toilets, dignity of the home","(vii) More opportunities, study further"]}],"xref":null},{"n":45,"g":null,"stem":[{"type":"p","text":"How many departments are included under the Human Development Sub-Mission in Bihar?"}],"opts":[{"k":"a","t":"6"},{"k":"b","t":"7"},{"k":"c","t":"8"},{"k":"d","t":"10"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the Human Development Sub-Mission in Bihar, 7 departments are included, which are as follows—"},{"type":"list","items":["1. Health Department","2. Education Department","3. Social Welfare Department","4. Scheduled Castes & Scheduled Tribes Welfare Department","5. Backward Classes and Extremely Backward Classes"]},{"type":"p","text":"Welfare Department 6. Minority Welfare Department 7. Disaster Management Department"}],"xref":null},{"n":46,"g":null,"stem":[{"type":"p","text":"Which of the following is a land records ofÏcer?"}],"opts":[{"k":"a","t":"Patwari"},{"k":"b","t":"Lambardar"},{"k":"c","t":"Zamindar"},{"k":"d","t":"Jaildar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"A Patwari or Lekhpal is the village-level land records officer in the Revenue Department. Their main work is to maintain all records related to land in the villages under their jurisdiction."}],"xref":null},{"n":47,"g":null,"stem":[{"type":"p","text":"At the initial level in Chotanagpur, the economy was based on -"}],"opts":[{"k":"a","t":"On Agriculture"},{"k":"b","t":"On Forests"},{"k":"c","t":"On Mines"},{"k":"d","t":"On Industries"}],"ans":"b","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the initial stage, the economy of Chhotanagpur was forest-based. Chhotanagpur is a plateau region. In the absence of technological development in the early period, neither industries were developed there nor was mining possible. Scheme"}],"xref":null},{"n":48,"g":"Scheme","stem":[{"type":"p","text":"What is the primary objective of Bihar's Mission Daksh?"}],"opts":[{"k":"a","t":"To increase school enrolment in primary schools in rural areas"},{"k":"b","t":"To provide to vocational training to teachers at senior-secondary level"},{"k":"c","t":"To offer personalised mentoring for lagging studedents to reach grade-level competencies"},{"k":"d","t":"More than one of the above"}],"ans":"c","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The main objective of Mission Daksh is to identify students who are lagging behind in studies and provide them with personalised mentoring so that they can reach their grade-level competencies."}],"xref":null},{"n":49,"g":"Scheme","stem":[{"type":"p","text":"Bihar Government’s Mission “Daksh” initiative is related to—"}],"opts":[{"k":"a","t":"Academically weak students"},{"k":"b","t":"Economically weak students"},{"k":"c","t":"Orphan students"},{"k":"d","t":"Students of backward classes"}],"ans":"a","src":["B.P.S.C. B.A.O. 2024"],"yr":2024,"fam":["B.P.S.C. B.A.O."],"expl":[{"type":"p","text":"The main objective of Mission Daksh is to identify students who are lagging behind in studies and provide them with personalised mentoring so that they can reach their grade-level competencies."}],"xref":48},{"n":50,"g":"Scheme","stem":[{"type":"p","text":"Which of the following is NOT one of the components under the YUVA framework of the Bihar Startup Policý 2022?"}],"opts":[{"k":"a","t":"Vibrancy in the education system"},{"k":"b","t":"Regulatory enablers for support"},{"k":"c","t":"Intermational market expansion schemes"},{"k":"d","t":"More than one of the above"}],"ans":"c","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"To support startups for youth and create an enabling ecosystem, the framework of the Bihar Startup Policy, 2022 has been prepared on the following four pillars—"},{"type":"list","items":["1. Awareness, networking and mentoring campaigns.","2. Making startups free from regulators for support.","3. Encouraging and supporting startups through vibrancy in the education system."]}],"xref":null},{"n":51,"g":"Scheme","stem":[{"type":"p","text":"Facilitating financial and incubation support. Therefore, there is no component included under this framework by the name “international market expansion plans”. 4. 'JEEVIKA' has achieved unprecedented success in promoting social development in Bihar. The estimated number of self-help groups formed till September, 2018 was-"}],"opts":[{"k":"a","t":"7.17 lakh"},{"k":"b","t":"9.01 lakh"},{"k":"c","t":"9.17 lakh"},{"k":"d","t":"8.17 lakh"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["65th B.P.S.C. Re-Exam. (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Established to ensure the social and economic empowerment of Bihar’s rural poor, the “Bihar Rural Livelihoods Project”, popularly known as “JEEViKA”, has achieved unprecedented success. It is primarily a State Government initiative related to poverty alleviation in rural areas of Bihar. Up to September, 2018, the estimated number of Self-Help Groups (SHGs) in Bihar was approximately 8.17 lakh. As per the Bihar Economic Survey 2024–25, under JEEViKA, up to September, 2024, 1063.5 thousand Self-Help Groups and 71.1 thousand Village Organizations were formed."}],"xref":null},{"n":52,"g":"Scheme","stem":[{"type":"p","text":"'JEEViKA' is an initiative of Bihar Govt. for:"}],"opts":[{"k":"a","t":"Employment Generation"},{"k":"b","t":"Financial Inclusion"},{"k":"c","t":"Poverty Attenuation"},{"k":"d","t":"Public Distribution"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Established to ensure the social and economic empowerment of Bihar’s rural poor, the “Bihar Rural Livelihoods Project”, popularly known as “JEEViKA”, has achieved unprecedented success. It is primarily a State Government initiative related to poverty alleviation in rural areas of Bihar. Up to September, 2018, the estimated number of Self-Help Groups (SHGs) in Bihar was approximately 8.17 lakh. As per the Bihar Economic Survey 2024–25, under JEEViKA, up to September, 2024, 1063.5 thousand Self-Help Groups and 71.1 thousand Village Organizations were formed."}],"xref":51},{"n":53,"g":"Scheme","stem":[{"type":"p","text":"'SPUR' project in Bihar relates to :"}],"opts":[{"k":"a","t":"Health"},{"k":"b","t":"Poverty"},{"k":"c","t":"Banking"},{"k":"d","t":"Municipal Finances"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"SPUR (Support Programme for Urban Reforms) is a six-year partnership programme of the Government of Bihar and the United Kingdom’s Department for International Development for supporting urban reforms in Bihar. Through the SPUR project, emphasis has been laid on economic growth and reduction of urban poverty by increasing the financial attractiveness for private investment in urban local body projects. The SPUR programme has five components—"},{"type":"list","items":["1. Urban governance and planning","2. Municipal finance and accounting","3. Urban infrastructure","4. Local economic development","5. Social development, poverty alleviation and livelihoods."]}],"xref":null},{"n":54,"g":"Scheme","stem":[{"type":"p","text":"Choose the correct statement regarding the 'Vibrant Village Programme'-"}],"opts":[{"k":"a","t":"It is for the development of road connectivity in Bihar"},{"k":"b","t":"It is for the state of Maharashtra in India"},{"k":"c","t":"It was launched in the year 2017"},{"k":"d","t":"This is for the development of border villages on the northern border"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. Re-Exam. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Budget Speech 2022–23, sparsely populated border villages along the northern frontier, where connectivity and basic facilities are very limited and which have remained deprived of development benefits, will be covered under the Vibrant Village Programme. Activities under this programme include provision of basic village amenities, housing, construction of tourism centres, road connectivity, decentralized renewable energy arrangements, Direct-to-Home access for Doordarshan and educational channels, and support for livelihood generation. Additional funds will be provided for these activities."}],"xref":null},{"n":55,"g":"Scheme","stem":[{"type":"p","text":"The Government of Bihar launched a new scheme 'Sustainable Livelihood Scheme' in August, 2018. The objective of this scheme is -"}],"opts":[{"k":"a","t":"Providing unemployment allowance to the youth"},{"k":"b","t":"Providing employment in rural areas through local bodies"},{"k":"c","t":"Providing assets for sustainable income generation to the extremely poor families"},{"k":"d","t":"Providing free training to enhance skills among youth"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Government of Bihar launched the Sustainable Livelihood Scheme on 5 August, 2018. This scheme was started for extremely poor families, including those traditionally associated with the production, transportation and sale of country liquor and toddy (whose economic condition weakened after the implementation of prohibition in the State), as well as targeted extremely poor families from Scheduled Castes, Scheduled Tribes and other communities. This initiative aims to build self-confidence among identified families and develop entrepreneurial skills. After completion of training, each targeted family is allocated up to ₹2 lakh under the Livelihood Investment Fund."}],"xref":null},{"n":56,"g":"Scheme","stem":[{"type":"p","text":"In Bihar, name the scheme which aims at building up infrastructural facilities of a high standard, required for establishment of 'Export-oriented Units' –"}],"opts":[{"k":"a","t":"Integrated Infrastructural Development (IID)"},{"k":"b","t":"Export Promotion Industrial Park (EPIP)"},{"k":"c","t":"Concept of Build-Operate-Transfer (BOT)"},{"k":"d","t":"Software / Hardware Technology Park (STP/HTP)"}],"ans":"b","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the aegis of the Ministry of Commerce and Industry, Government of India, and the Government of Bihar, an Export Promotion Industrial Park (EPIP) has been established at Hajipur as a multi-product export-processing zone for North Bihar. It focuses on developing the high-level infrastructure required for export-oriented units."}],"xref":null},{"n":57,"g":"Scheme","stem":[{"type":"p","text":"Which of the following is not true about Bihar's Mukhyamantri Kanya Utthan Yojana?"}],"opts":[{"k":"a","t":"Proposed annual expenditure for the scheme is ₹ 7,221 crore"},{"k":"b","t":"Education, Health and Social Welfare three departments run the scheme"},{"k":"c","t":"Every girl child will receive total ₹ 60000 from her birth to graduation level education"},{"k":"d","t":"At the time of a girl child's birth, her family receives ₹ 2000"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Mukhyamantri Kanya Utthan Yojana, launched in April 2018 by Bihar Chief Minister Nitish Kumar, is a major initiative of the Government of Bihar. Its objective is to promote girls’ education and empowerment by providing financial support from birth up to the graduate level. Initially, the Bihar Government allocated a budget of about Rs. 2,221 crore per year for implementation. It is an integrated scheme implemented jointly by multiple departments. The nodal department is the Social Welfare Department, which performs the main coordination role, while the other two departments— Education and Health—provide benefits at different stages. Under this scheme, a girl receives total financial assistance of Rs. 94,100 (in different instalments) from birth till graduation. Notably, earlier this amount was fixed at Rs. 54,100, which was enhanced with approval of the State Cabinet in February 2021. The scheme also provides Rs. 2,000 to the family at the time of the girl child’s birth."}],"xref":null},{"n":58,"g":"Scheme","stem":[{"type":"p","text":"'Sunandini Programme' is related to the"}],"opts":[{"k":"a","t":"Anganwadi workers"},{"k":"b","t":"Auxiliary Nurse Midwives (ANMs)"},{"k":"c","t":"Primary health centre's doctors"},{"k":"d","t":"Members of Gram Panchayat"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 2021, through the joint efforts of the Social Welfare Department, ICDS, and the Bihar Board of Open Schooling and Examination (BBOSE), the Sunandini Programme was started to strengthen the educational qualification of Anganwadi workers and to enable them to receive online education."}],"xref":null}]},{"title":"Agriculture and Irrigation","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Which districts in Bihar will benefit from the Kosi Mechi Link Project?"}],"opts":[{"k":"a","t":"Patna, Nalanda, Gaya, Siwan"},{"k":"b","t":"Darbhanga, Muzaffarpur, Sitamarhi, Begusarai"},{"k":"c","t":"Araria, Purnia, Kishanganj, Katihar"},{"k":"d","t":"More than one of the above"}],"ans":"d","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kosi–Mechi Link Project is an intra-state river-linking project within Bihar. Under this project, the Eastern Kosi Main Canal will be redeveloped and extended up to the Mechi River. This will provide irrigation facilities in about 2,10,516 hectares of additional area during the Kharif season. The main beneficiary districts will be Araria, Purnia, Kishanganj, and Katihar."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"In which agro-climatic region of Bihar are the maximum number of districts located?"}],"opts":[{"k":"a","t":"North-East"},{"k":"b","t":"North-West"},{"k":"c","t":"South-East"},{"k":"d","t":"South-West"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar falls in Agro-Climatic Region IV, known as the Middle Gangetic Plains Region. On the basis of soil characteristics, rainfall, temperature, and physiography, Bihar is divided into three sub-regions: North-East alluvial plains, North-West alluvial plains, and South Bihar alluvial plains. The South Bihar alluvial plains are further classified into South-East (A) and South-West (B). The North-West zone includes a total of 12 districts, while the North-East zone includes 8 districts. The South Bihar alluvial plains zone has 17 districts, out of which 6 are in the South-East zone (A) and 11 are in the South-West zone (B). Thus, it is clear that the maximum number of districts are included in the North-West zone."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"What is the percentage of population employed in agriculture in the state of Bihar in 2017-18?"}],"opts":[{"k":"a","t":"65"},{"k":"b","t":"67"},{"k":"c","t":"68"},{"k":"d","t":"70"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2018–19, about 74 percent of the state’s workforce was employed in agriculture, which was much higher than the national average. According to the Bihar Economic Survey 2024–25, more than 75 percent of the workforce of the state was engaged in agricultural activities."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Bihar produces 71 percent of India annual production of which of these"}],"opts":[{"k":"a","t":"Pineapple"},{"k":"b","t":"Orange"},{"k":"c","t":"Lychee"},{"k":"d","t":"Mango"}],"ans":"*","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the data for the years 2022–23 and 2023–24, Bihar produced 41.39 percent and 23.51 percent respectively of India’s total litchi production. During the same years, Bihar’s share in mango production was 7.55 percent and 7.06 percent, and in pineapple production 18.73 percent and 6.68 percent respectively. Therefore, Bihar does not produce 71 percent of any of the given fruits. In its final answer key, the Bihar Public Service Commission treated option (c) as the correct answer, which is incorrect."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"In which district of Bihar, Litchi production is maximum ?"}],"opts":[{"k":"a","t":"Siwan"},{"k":"b","t":"Sonpur"},{"k":"c","t":"Muzaffarpur"},{"k":"d","t":"Chhapara"}],"ans":"c","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2023–24, in the year 2022–23 the highest litchi production in Bihar was recorded in Muzaffarpur (147.95 thousand tonnes). Litchi production in Siwan was 8.70 thousand tonnes. Sonpur and Chhapra are not districts of Bihar; Chhapra is the headquarters of Saran district. According to the Bihar Economic Survey 2024–25, in the year 2023–24 also the highest litchi production was recorded in Muzaffarpur (101.52 thousand tonnes)"}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Litchi production in Bihar is"}],"opts":[{"k":"a","t":"60% of India's production"},{"k":"b","t":"50% of India's production"},{"k":"c","t":"74% of India's production"},{"k":"d","t":"80% of India's production"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2023–24, in the year 2022–23 the highest litchi production in Bihar was recorded in Muzaffarpur (147.95 thousand tonnes). Litchi production in Siwan was 8.70 thousand tonnes. Sonpur and Chhapra are not districts of Bihar; Chhapra is the headquarters of Saran district. According to the Bihar Economic Survey 2024–25, in the year 2023–24 also the highest litchi production was recorded in Muzaffarpur (101.52 thousand tonnes)"}],"xref":5},{"n":7,"g":null,"stem":[{"type":"p","text":"The average size of landholdings in Bihar in comparison with other states is –"}],"opts":[{"k":"a","t":"Lowest"},{"k":"b","t":"Second lowest"},{"k":"c","t":"Highest"},{"k":"d","t":"Second highest"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Agricultural Census 2015–16, the average size of landholding in Bihar is 0.39 hectare. The average landholding size is smaller in Daman and Diu (0.36 hectare), Kerala (0.18 hectare), and Lakshadweep (0.27 hectare). From the viewpoint of states, Bihar ranks second lowest in terms of average size of landholdings."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"What percent of cultivable land in Bihar is irrigated?"}],"opts":[{"k":"a","t":"More than 50%"},{"k":"b","t":"40% to 50%"},{"k":"c","t":"30% to 40%"},{"k":"d","t":"Less than 30%"}],"ans":"a","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the examination, option (a) was the correct answer. According to the Bihar Economic Survey 2024–25, in the year 2022–23 the gross sown area in Bihar was 7268.2 thousand hectares, out of which the gross irrigated area was 5697.9 thousand hectares, which constituted 78.39 percent of the total gross sown area."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"The percentage of net cultivated area out of total area in Bihar is –"}],"opts":[{"k":"a","t":"60"},{"k":"b","t":"40"},{"k":"c","t":"80"},{"k":"d","t":"70"}],"ans":"a","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the examination, option (a) was the correct answer. According to the Bihar Economic Survey 2024–25, in the year 2022–23 the total net sown area was 5112.8 thousand hectares, which constituted about 54.63 percent of Bihar’s total geographical area of 9359.6 thousand hectares."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"In which district of Bihar, maize production is maximum ?"}],"opts":[{"k":"a","t":"Muzaffarpur"},{"k":"b","t":"East Champaran"},{"k":"c","t":"Siwan"},{"k":"d","t":"Saran"}],"ans":"a","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2023–24, among the given options, in the year 2022–23 maize production was highest in Muzaffarpur (156.36 thousand tonnes), followed by East Champaran (135.39 thousand tonnes), Siwan (57.37 thousand tonnes), and Saran (78.67 thousand tonnes). However, the highest maize production overall was recorded in Araria (987.26 thousand tonnes). According to the Bihar Economic Survey 2024–25, in the year 2023–24 the highest maize production was recorded in Purnia (1144.9 thousand tonnes), followed by Araria (829.8 thousand tonnes) and Katihar (622.8 thousand tonnes)."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"In which district of Bihar, wheat crop production is maximum ?"}],"opts":[{"k":"a","t":"Jehanabad"},{"k":"b","t":"Bhojpur"},{"k":"c","t":"Rohtas"},{"k":"d","t":"Patna"}],"ans":"c","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2023–24, in the year 2022–23 the highest production of wheat was in Rohtas district (675.88 thousand tonnes). Wheat production in Jehanabad was 69.02 thousand tonnes, in Bhojpur 356.24 thousand tonnes, and in Patna 245.63 thousand tonnes. According to the Bihar Economic Survey, 2024–25, in the year 2023–24 the highest wheat production was in Rohtas district (716.2 thousand tonnes). Thereafter, Muzaffarpur (400.1 thousand tonnes) and Bhojpur (386.8 thousand tonnes)."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"The leading sugarcane producer district of Bihar is –"}],"opts":[{"k":"a","t":"West Champaran"},{"k":"b","t":"Sitamarhi"},{"k":"c","t":"Gopalganj"},{"k":"d","t":"East Champaran"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question as well as at present, option (a) is the correct answer. According to the Bihar Economic Survey, 2024–25, in the year 2023–24 the highest sugarcane production was in West Champaran (9,667,743 metric tonnes). Thereafter, East Champaran (1,325,554 metric tonnes), Gopalganj (697,653 metric tonnes), and Sitamarhi (637,287 metric tonnes) were next."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"Leading fish producer districts of Bihar are:"}],"opts":[{"k":"a","t":"Madhubani and East Champaran"},{"k":"b","t":"Madhubani and Darbhanga"},{"k":"c","t":"East Champaran and Darbhanga"},{"k":"d","t":"East Champaran and Muzaffarpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question as well as at present, option (b) is the correct answer. According to the Bihar Economic Survey, 2024–25, in the year 2023–24 the top three districts of Bihar in fish production were as follows: Madhubani (92 thousand tonnes), Darbhanga (83 thousand tonnes), and East Champaran (82 thousand tonnes)."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"The total production of coarse cereals in Bihar (in lakh tonnes) in 2017-18 and its growth rate between 2013-14 and 2017-18 were, respectively-"}],"opts":[{"k":"a","t":"2.15; 5%"},{"k":"b","t":"4.0; 6%"},{"k":"c","t":"3.15 ; 6%"},{"k":"d","t":"5.15; 4%"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. Re-Exam. (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2019–20, among the major cereals, the production of maize and rice increased by 6 percent and 4 percent respectively during the last five years. In the year 2017–18, the total production of coarse cereals was 3.15 lakh tonnes. Between 2013–14 and 2017–18, a growth rate of 6 percent was recorded."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Coarse grains are called miracle grains and crops of the future. Why?"}],"opts":[{"k":"a","t":"Drought tolerant crops"},{"k":"b","t":"Requires some external factor"},{"k":"c","t":"Nutritionally equivalent to rice and wheat"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["B.P.S.C. School Teacher 7.12.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"Coarse cereals are called miracle grains and the crops of the future because they are rich in nutrients. They have drought tolerance, crop resilience, and adaptability to climate change."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"In which district of Bihar is the highest production of Makhana?"}],"opts":[{"k":"a","t":"Vaishali"},{"k":"b","t":"Muzaffarpur"},{"k":"c","t":"Patna"},{"k":"d","t":"Madhubani"}],"ans":"d","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the given options, Madhubani district has the highest production of makhana in Bihar. Darbhanga, Purnia, Saharsa, Katihar, Supaul, Madhepura, Araria, and Kishanganj are other major makhana-producing districts."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"The district with the highest jute production in Bihar is -"}],"opts":[{"k":"a","t":"Siwan"},{"k":"b","t":"Gaya"},{"k":"c","t":"Vaishali"},{"k":"d","t":"Purnia"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the options given above, the highest production of jute in Bihar is in Purnia district. According to the Directorate of Jute Development, in 2023–24, the highest jute production in India was in the state of West Bengal. West Bengal accounts for 81.15% of total jute production, Assam 6.95%, and Bihar 10.17%. As per the data for 2023–24, the top four jute-producing districts of Bihar are, respectively—Katihar (41,945 metric tons), Kishanganj (41,237 metric tons), Araria (25,851 metric tons), and Madhepura (18,393 metric tons)"}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"The 'Organic Corridor' plan of Bihar Government shall promote organic farming along/in"}],"opts":[{"k":"a","t":"Ganga River"},{"k":"b","t":"National Highways"},{"k":"c","t":"Tarai Belt"},{"k":"d","t":"Urban Centres"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Under the Organic Corridor scheme, the Bihar Government is promoting organic farming in 13 districts located along the River Ganga."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"In terms of production in Bihar, the second crop after rice is -"}],"opts":[{"k":"a","t":"Wheat"},{"k":"b","t":"Corn"},{"k":"c","t":"Chickpea"},{"k":"d","t":"Potato"}],"ans":"a","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, in undivided Bihar (including Jharkhand), rice had the highest production. Thereafter, wheat production was next. According to the Bihar Economic Survey, 2024–25, in 2023–24 the total production of wheat was 7,306.65 thousand tons, while the total production of rice was 9,522.8 thousand tons. Therefore, even at present, rice production is higher than wheat production."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"The principal foodgrain crops of Bihar are-"}],"opts":[{"k":"a","t":"rice, wheat and maize"},{"k":"b","t":"sugarcane, tea and barley"},{"k":"c","t":"groundnut, coffee and wheat"},{"k":"d","t":"None of these"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The main foodgrain crops of Bihar are rice, wheat and maize."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"What form of agriculture is in Bihar?"},{"type":"list","items":["1. Subsistence 2. Commercial","3. Export-intensive 4. Self-reliant"]},{"type":"p","text":"Select your answer of the following codes–"}],"opts":[{"k":"a","t":"Only 1"},{"k":"b","t":"2 and 3"},{"k":"c","t":"Only 2"},{"k":"d","t":"Only 4"}],"ans":"d","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar is a state with self-reliant agriculture."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"The area under agriculture in Bihar is –"}],"opts":[{"k":"a","t":"95 lakh hectare"},{"k":"b","t":"85 lakh hectare"},{"k":"c","t":"89 lakh hectare"},{"k":"d","t":"89.9 lakh hectare"}],"ans":"*","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2024–25, in 2022–23, 51.13 lakh hectares area (Net Sown Area) in Bihar is under agriculture."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"What is the crop density in Bihar?"}],"opts":[{"k":"a","t":"108%"},{"k":"b","t":"118%"},{"k":"c","t":"128%"},{"k":"d","t":"138%"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was the correct answer. According to the Bihar Economic Survey, 2024–25, in 2022–23 the cropping intensity was 142%."}],"xref":null},{"n":24,"g":null,"stem":[{"type":"p","text":"In Bihar, tea gardens were established for the first time in which of the following places?"}],"opts":[{"k":"a","t":"Supaul"},{"k":"b","t":"Thakurganj"},{"k":"c","t":"Bahadurganj"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, tea gardens were established for the first time at Thakurganj (Kishanganj). It is noteworthy that tea is cultivated on about 25 thousand acres of land in Bihar. However, Kishanganj district is the principal place for tea cultivation in Bihar."}],"xref":null},{"n":25,"g":null,"stem":[{"type":"p","text":"The largest canal irrigated area of Bihar lies in the district of –"}],"opts":[{"k":"a","t":"West Champaran"},{"k":"b","t":"Aurangabad"},{"k":"c","t":"Rohtas"},{"k":"d","t":"Bhojpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, in the matter of irrigation through canals, in 2020–21 Rohtas district ranked first with 3.07 lakh hectares; thereafter West Champaran (1.85 lakh hectares) and Aurangabad (1.61 lakh hectares) were next. In gross irrigated area also, Rohtas district ranked first with 4.15 lakh hectares. According to the Bihar Economic Survey, 2024–25, in 2022–23 the highest gross irrigated area through canals was in Rohtas district (299.40 thousand hectares). Thereafter, West Champaran (182.80 thousand hectares) was next."}],"xref":null},{"n":26,"g":null,"stem":[{"type":"p","text":"Which food industry dominates among the agro-based industries in Bihar?"}],"opts":[{"k":"a","t":"Sugarcane industry"},{"k":"b","t":"Cereal-based industry"},{"k":"c","t":"Pulses industry"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"d","src":["68th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, the two most important agro-based industries are food-grain–based industries and the sugar industry."}],"xref":null},{"n":27,"g":null,"stem":[{"type":"p","text":"At present, what is the main source of wealth of Bihar?"}],"opts":[{"k":"a","t":"Industry"},{"k":"b","t":"Agriculture"},{"k":"c","t":"Natural resources"},{"k":"d","t":"Mineral wealth"}],"ans":"b","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question as well as at present, agriculture remains the principal source of the state’s economy in Bihar."}],"xref":null},{"n":28,"g":null,"stem":[{"type":"p","text":"Which one of the following cereals has the highest per hectare yield in Bihar?"}],"opts":[{"k":"a","t":"Rice"},{"k":"b","t":"Wheat"},{"k":"c","t":"Maize"},{"k":"d","t":"Barley"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to data for the year 2018-19, the productivity (kg/ ha) of crops in Bihar was: Rice – 1948, Wheat – 2998, Maize – 4771 and Barley – 1990. Bihar Economic Survey, 2020-21 in the year 2019-20, productivity was: Rice – 2245 kg/ha, Wheat – 2595 kg/ha, Maize – 5193 kg/ha and Barley – 1369 kg/ha. Thus, maize recorded the highest productivity in both years. Bihar Economic Survey 2024-25 in the year 2023-24, productivity was: Rice – 3062 kg/ha, Wheat – 3211 kg/ha, Maize – 6138 kg/ha and Barley – 1641 kg/ha."}],"xref":null},{"n":29,"g":null,"stem":[{"type":"p","text":"What is the main crop of the Chotanagpur Plateau?"},{"type":"list","items":["(i) Rice","(ii) Maize","(iii) Pulses","(iv) Wheat"]},{"type":"p","text":"Choose your answer from the following codes-"}],"opts":[{"k":"a","t":"Only (i) is correct"},{"k":"b","t":"(i) and (iii) are correct"},{"k":"c","t":"(ii) and (iv) are correct"},{"k":"d","t":"(ii) and (iii) are correct"}],"ans":"*","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The main crops of the Chotanagpur Plateau are rice, wheat and maize. Among these crops, rice had the highest production."}],"xref":null},{"n":30,"g":null,"stem":[{"type":"p","text":"Which is the main cash crop of the state of Bihar?"}],"opts":[{"k":"a","t":"Tea"},{"k":"b","t":"Rubber"},{"k":"c","t":"Sugarcane"},{"k":"d","t":"Coconut and coffee"}],"ans":"c","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The major cash crops of Bihar are sugarcane, tobacco, jute and mesta. Among these, sugarcane occupies the first position in terms of both value and production."}],"xref":null},{"n":31,"g":null,"stem":[{"type":"p","text":"The top ranking pulses in terms of acreage in Bihar are –"}],"opts":[{"k":"a","t":"Masoor and gram"},{"k":"b","t":"Moong and gram"},{"k":"c","t":"Moong and Masoor"},{"k":"d","t":"Masoor and Khesari"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey 2019-20, in 2018-19, the production of Bhadai Moong was 5.32 thousand tons and that of Garma Moong was 113.16 thousand tons. Thus, the total Moong production was 118.48 thousand tons. During the same period, the production of lentils was 148.03 thousand tons, gram was 67.69 thousand tons, and Khesari was 51.38 thousand tons. Therefore, Moong and lentils held the top positions among pulses in Bihar. According to Bihar Economic Survey, 2024-25, in the year 2023-24, the production of lentils was 113.8 thousand tonnes, production of green gram was 117 thousand tonnes (Bhadai moong 4.6 + Garma moong 112.4 thousand tonnes), production of gram was 78.5 thousand tonnes and production of khesari was 33.1 thousand tonnes."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"What is the position of Bihar in terms of jute production among the states of India?"}],"opts":[{"k":"a","t":"First"},{"k":"b","t":"Second"},{"k":"c","t":"Third"},{"k":"d","t":"Fourth"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the examination, the correct answer was option (c). At present, According to the Directorate of Jute Development Bihar ranks second in jute production in India, after West Bengal, while Assam occupies the third position."}],"xref":null},{"n":33,"g":null,"stem":[{"type":"p","text":"Which one of the following statements about irrigation in Bihar is not correct?"}],"opts":[{"k":"a","t":"Of the total sown area in Bihar nearly 30 percent is irrigated"},{"k":"b","t":"Of the total irrigated area in Bihar nearly 30 percent is irrigated by canals and 39 percent by tubewells"},{"k":"c","t":"The maximum area irrigated by canals is found in Bhojpur, Aurangabad, West Champaran, Rohtas and Munger districts"},{"k":"d","t":"The maximum area irrigated by tube wells is found in Samastipur, Sitamarhi, Begusarai, Sitamarhi, Begusarai, Muzaffarpur, Gopalganj and Khagaria districts"}],"ans":"b","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (b) was the correct answer. According to the Bihar Economic Survey, 2024–25, in the year 2022–23, 78.39 percent of the gross cropped area of Bihar was irrigated. Of the total irrigated area of Bihar (5,697.9 thousand hectares), 30.28 percent area was irrigated by canals and 63.41 percent area by tube wells. The districts having the highest gross irrigated area through canals, respectively, are Rohtas, West Champaran, Bhojpur, Aurangabad and Kaimur. Whereas the districts having the highest gross irrigated area through tube wells, respectively, are Samastipur, Sitamarhi, Nalanda, Muzaffarpur and East Champaran."}],"xref":null},{"n":34,"g":null,"stem":[{"type":"p","text":"Joint irrigation project of the States of Bihar and Uttar Pradesh is –"}],"opts":[{"k":"a","t":"Damodar Valley Project"},{"k":"b","t":"Kosi Project"},{"k":"c","t":"Son Barrage Project"},{"k":"d","t":"Gandak Project"}],"ans":"d","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"
