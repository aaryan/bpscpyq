ublished?"}],"opts":[{"k":"a","t":"Patna Harkara"},{"k":"b","t":"Bihar Bandhu"},{"k":"c","t":"Akhbar-e-Bihar"},{"k":"d","t":"Bihar Herald"}],"ans":"a","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the given options, Patna Harkara started publication first. The newspapers/journals given in the options and their years of publication are as follows—"},{"type":"table","rows":[["Patna Harkara","1855"],["Akhbar-e-Bihar","1856"],["Bihar Bandhu","1872"],["Bihar Herald","1874"]]},{"type":"p","text":"It is noteworthy that Noor-ul-Anwar, published from Ara in 1853, was the first newspaper of Bihar."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"The hundred years of Indian National Congress in Bihar was edited by"}],"opts":[{"k":"a","t":"K. K. Dutta"},{"k":"b","t":"P. N. Ojha"},{"k":"c","t":"A. R. Desai"},{"k":"d","t":"B. B. Mishra"}],"ans":"b","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"One Hundred Years of the Indian National Congress in Bihar, 1885–1985 (History of Indian National Congress in Bihar, 1885–1985) is an edited work by P. N. Ojha."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"On 22nd March, 2018 who unveiled the book, Neel Ke Dhabbe on the occasion of 106th Bihar Day in Patna?"}],"opts":[{"k":"a","t":"Vice President Shri Venkaiah Naidu"},{"k":"b","t":"Prime Minister Shri Narendra Modi"},{"k":"c","t":"Home Minister Shri Rajnath Singh"},{"k":"d","t":"Speaker Smt. Sumitra Mahajan"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 22 March, 2018, on the occasion of the 106th Foundation Day of Bihar, at a ceremony held at the historic Gandhi Maidan in Patna, the then Vice President M. Venkaiah Naidu released four books centred on the life and ideas of Mahatma Gandhi. Among the books released was the novel ‘Neel Ke Dhabbe’ written by Vindhyachal Prasad."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Who was the author of 'Mahatma Gandhi and Bihar, Some Reminiscences'?"}],"opts":[{"k":"a","t":"Dr. Rajendra Prasad"},{"k":"b","t":"J. P. Narayan"},{"k":"c","t":"Karpoori Thakur"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The author of Mahatma Gandhi and Bihar, Some Reminiscences was Dr. Rajendra Prasad, the first President of India."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"'The author of 'Rajneeti Ratnakar' is:'"}],"opts":[{"k":"a","t":"Chandeshwar"},{"k":"b","t":"Vidyapati"},{"k":"c","t":"Jyotirishwar"},{"k":"d","t":"Haribrahma Dev"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The author of the book ‘Rajniti Ratnakar’ is considered to be Chandeshwar. Vidyapati composed Padavali, Kirtilata, Purush Pariksha, Bhu-Parikrama, Likhanavali and Kirtipataka. Vidyapati was given the titles ‘Maithil Kokil’ and ‘Abhinav Jayadev’."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Who highlighted the plight of the farmers of Champaran by writing under pseudonyms such as 'Dukhi', 'Dukhi Atma', 'Dukhi Hriday'?"}],"opts":[{"k":"a","t":"Pir Muhammad Munis"},{"k":"b","t":"Rajendra Prasad"},{"k":"c","t":"Sahajanand Saraswati"},{"k":"d","t":"S.N. Sinha"}],"ans":"a","src":["56th to 59th B.P.S.C. (Pre) 2015"],"yr":2015,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Pir Muhammad Munis, writing under the pen names ‘Dukhi’, ‘Dukhi Atma’ and ‘Dukhi Hriday’, highlighted the plight of the Champaran peasants by writing ‘Champaran Mein Andher’ (13 March, 1916), ‘Champaran Ki Durdasha’ (10 April, 1917) and ‘Dukhi Hriday’ (February, 1916). He also wrote articles on Mahatma Gandhi in Champaran, Hindu-Muslim unity, etc."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"Swami Sahajanand Saraswati published a magazine named-"}],"opts":[{"k":"a","t":"Jankranti"},{"k":"b","t":"Hunkar"},{"k":"c","t":"Krishak Samachar"},{"k":"d","t":"Vidrohi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Swami Sahajanand Saraswati (1889–1950) is called the father of the peasant movement in India. He was an intellectual, writer, social reformer and peasant leader. Swami Sahajanand Saraswati was a Dandi sannyasi of the Dashnami Sannyasi Akhara of the Adi Shankaracharya tradition. He also published a magazine named ‘Hunkar’."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Who wrote ‘Kisan Kya Karein’?"}],"opts":[{"k":"a","t":"Swami Sahajanand Saraswati"},{"k":"b","t":"Karyanand Sharma"},{"k":"c","t":"Baba Ramchandra"},{"k":"d","t":"All of the above"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The book ‘Kisan Kya Karein’ was written by Swami Sahajanand Saraswati, a renowned peasant leader of the twentieth century."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Who was the Editor of Searchlight newspaper in Bihar?"}],"opts":[{"k":"a","t":"Abdul Bari"},{"k":"b","t":"Lambodar Mukherjee"},{"k":"c","t":"Murli Manohar Prasad"},{"k":"d","t":"Ramananda Chatterjee"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, the publication of the Searchlight newspaper was started from Patna in 1918 by Dr. Sachchidanand Sinha. It began in 1918 as an English twice-weekly newspaper. In 1920 it became a thrice-weekly newspaper, and from 1930 it began to be published as a daily. Dr. Rajendra Prasad was one of the founders of this newspaper. Murli Manohar Prasad remained the editor of the Searchlight newspaper for a long period."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"Which of the following newspapers was published from Patna?"}],"opts":[{"k":"a","t":"Indian Nation"},{"k":"b","t":"Punjab Kesari"},{"k":"c","t":"Prabhakar"},{"k":"d","t":"Dawn"}],"ans":"a","src":["45th B.P.S.C. (Pre) Exam 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1931, Maharaja Kameshwar Singh of Darbhanga founded “The Indian Nation”. It was published from Patna."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"The editor of 'Bihari', a leading newspaper of Bihar, was –"}],"opts":[{"k":"a","t":"Babu G. Prasad"},{"k":"b","t":"Babu Ram Prasad"},{"k":"c","t":"Babu Gopal Prasad"},{"k":"d","t":"Babu Maheshwar Prasad"}],"ans":"d","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The editor of the prominent Bihar newspaper “Bihari” was Babu Maheshwar Prasad."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Who published “Motherland”?"}],"opts":[{"k":"a","t":"Rajendra Prasad"},{"k":"b","t":"Muhammad Shafi"},{"k":"c","t":"Mazharul Haque"},{"k":"d","t":"Braj Kishore Prasad"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The weekly paper “Motherland” was started by Maulana Mazharul Haque from “Sadaqat Ashram”, Patna."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"The Bihar Herald was started in 1872 by –"}],"opts":[{"k":"a","t":"Munshi Surajmal"},{"k":"b","t":"Rai Roshan Lal"},{"k":"c","t":"Babu Guru Prasad Sen"},{"k":"d","t":"Krishna Bhatt"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1874 A.D., “Bihar Herald” (Behar Herald) was established as an English-language weekly newspaper by Guru Prasad Sen. It was the first English newspaper published from Patna. Note—The mention of the year 1872 in the given question is erroneous; it should be 1874."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"Which was the first English newspaper published from Patna?"}],"opts":[{"k":"a","t":"The Indian Nation"},{"k":"b","t":"Bihar Herald"},{"k":"c","t":"The Mirror"},{"k":"d","t":"Hindu Patriot"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"In 1874 A.D., “Bihar Herald” (Behar Herald) was established as an English-language weekly newspaper by Guru Prasad Sen. It was the first English newspaper published from Patna. Note—The mention of the year 1872 in the given question is erroneous; it should be 1874."}],"xref":13}]},{"title":"Industries and Factories","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Bihar State (before separation) had how many 'Industrial Area Development Authorities'?"}],"opts":[{"k":"a","t":"Six, viz., Adityapur, Bokaro, Patna, Ranchi, Darbhanga and Muzaffarpur"},{"k":"b","t":"Five, viz.,Adityapur,Bokaro, Darbhanga, Muzaffarpur and Patna"},{"k":"c","t":"Seven, viz., Adityapur, Bokaro, Patna, Darbhanga, Muzaffarpur, Ranchi and Bhojpur"},{"k":"d","t":"Four, viz., Adityapur Muzaffarpur, Bhojpur and Khagaria"}],"ans":"a","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was the correct answer. For industrial development in Bihar, the Bihar Industrial Area Development Authority (BIADA) has created 9 clusters. These are as follows—(1) Begusarai, (2) Bhagalpur, Saharsa and Purnia, (3) Gaya, (4) Patna, (5) Darbhanga, (6) Hajipur, (7) Muzaffarpur, (8) Bihta, (9) Motipur."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"In Bihar, Dalmianagar is famous for—"}],"opts":[{"k":"a","t":"Silk"},{"k":"b","t":"Cement"},{"k":"c","t":"Leather"},{"k":"d","t":"Jute"}],"ans":"b","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, Dalmianagar is mainly famous for cement. In addition, chemical and other industries are also established there."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"Heavy Machine Manufacturing Plant in Bihar is situated at –"}],"opts":[{"k":"a","t":"Jamshedpur"},{"k":"b","t":"Bokaro"},{"k":"c","t":"Barauni"},{"k":"d","t":"Ranchi"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In undivided Bihar, the Heavy Machine Building Plant of “Heavy Engineering Corporation Limited” was established at Ranchi in 1958. Heavy Engineering Corporation Limited manufactures capital equipment and machinery for core-sector industries."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Which one of the following pairs of industry and place is not correctly matched?"}],"opts":[{"k":"a","t":"Oil refinery–Barauni"},{"k":"b","t":"Cement–Banjari"},{"k":"c","t":"Fertilizer–Bhaurahi"},{"k":"d","t":"Wagon and engineering–Bhagalpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bharat Wagon and Engineering Ltd. had two units located at Muzaffarpur and Mokama. Freight wagons and engineering products were manufactured here. In August, 2017, the Cabinet Committee on Economic Affairs, chaired by Prime Minister Narendra Modi, approved the proposal of the Ministry of Railways to close Bharat Wagon and Engineering Ltd., a public sector enterprise under the Ministry of Railways."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Match List-I with List-II - List -I List - II A. Vaishali 1. Silk Textile B. Bhagalpur 2. Gold C. Jamui 3. Rail Coach Factory D. Madhepura 4. Floriculture Give the correct answer by using the given code. A B C D"}],"opts":[{"k":"a","t":"2 3 4 1"},{"k":"b","t":"3 4 1 2"},{"k":"c","t":"4 1 2 3"},{"k":"d","t":"1 2 3 4"}],"ans":"*","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The correct matching is as follows— List–I List–II Vaishali Floriculture Bhagalpur Silk textiles Jamui Gold Madhepura Electric Locomotive Factory Note—In the given question, Madhepura has been matched with “Railway coach factory”, which is incorrect. Madhepura has an Electric Locomotive Factory."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"The belt of Jute Industry in Bihar is located in (i) North-West plain of Bihar (ii) North-East plain of Bihar (iii) Middle-south plain of Bihar (iv) Damodar Valley region Select the correct answer from the following codes -"}],"opts":[{"k":"a","t":"i and ii"},{"k":"b","t":"ii only"},{"k":"c","t":"ii and iii"},{"k":"d","t":"i and iii"}],"ans":"b","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the 2023–24 data, Bihar is India’s second-largest jute-producing state. The top four jute-producing districts in Bihar are, respectively: Katihar, Kishanganj, Araria and Madhepura. Katihar, Kishanganj and Araria have large jute factories. The jute industry is a raw-material-oriented industry. Since this industry requires clean water and abundant, cheap labour, these conditions are widely available in these regions; therefore, the jute industry is mainly concentrated here. On the map of Bihar, these industrial locations lie in the North-Eastern Bihar Plain."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"Most significant oil refinery of Bihar is -"}],"opts":[{"k":"a","t":"Singhbhum"},{"k":"b","t":"Rudrasagar"},{"k":"c","t":"Barauni"},{"k":"d","t":"Ranchi"}],"ans":"c","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"An oil refinery is located at Barauni in Bihar. At Ranchi, the heavy machinery industry has been set up, and in East Singhbhum, the steel industry has been established."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Which type of industries has potential and prospects in Bihar?"}],"opts":[{"k":"a","t":"Oil refinery"},{"k":"b","t":"Forest-based industry"},{"k":"c","t":"Sand-mining industry"},{"k":"d","t":"Agro-based industry"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, there are prospects and possibilities for agro-based industries, forest-based industries, the sand-mining industry, and oil refineries, along with industries related to metal work, chemicals, plastics, electrical goods, leather, etc."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"With whose cooperation was the Barauni Refinery established in Bihar?"}],"opts":[{"k":"a","t":"Germany"},{"k":"b","t":"South Korea"},{"k":"c","t":"Soviet Russia"},{"k":"d","t":"France"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Re-Exam) (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Barauni Refinery of Indian Oil Corporation Limited in Bihar was dedicated to the nation in 1965. Established in 1964, this refinery was built with the cooperation of the Soviet Union (present-day Russia), with limited participation from Romania."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"The steel plant centre in Bihar is located in –"}],"opts":[{"k":"a","t":"Dhanbad"},{"k":"b","t":"Ranchi"},{"k":"c","t":"Mithila"},{"k":"d","t":"Patna"}],"ans":"a","src":["43rd B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Bokaro Steel Plant was earlier in the Dhanbad district of Bihar. Now Bokaro has become a separate district. At present, it is located in the state of Jharkhand."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"A steel factory in Bihar -"}],"opts":[{"k":"a","t":"is in Darbhanga"},{"k":"b","t":"is in Gaya"},{"k":"c","t":"is in Hazaribagh"},{"k":"d","t":"is in Jamshedpur"}],"ans":"d","src":["39th B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["39th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jamshedji Nusserwanji Tata established an iron and steel plant in Jamshedpur in 1907. At the time of this question, Jamshedpur was a part of Bihar. At present, it is in the state of Jharkhand."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Which of the following is a silk textile producing centre in Bihar?"}],"opts":[{"k":"a","t":"Motipur"},{"k":"b","t":"Bajari"},{"k":"c","t":"Bhagalpur"},{"k":"d","t":"Dalmianagar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, Bhagalpur is known as the 'Silk City'. This city is situated on the southern bank of the Ganga River. Bhagalpur is world-famous for sericulture, the production of silk yarn, and silk-based products."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"Which district of Bihar is known as 'Silk City'?"}],"opts":[{"k":"a","t":"Katihar"},{"k":"b","t":"Bhojpur"},{"k":"c","t":"Bhagalpur"},{"k":"d","t":"Banka"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, Bhagalpur is known as the 'Silk City'. This city is situated on the southern bank of the Ganga River. Bhagalpur is world-famous for sericulture, the production of silk yarn, and silk-based products."}],"xref":12},{"n":14,"g":null,"stem":[{"type":"p","text":"Which of the following is a centre of the textile industry in Bihar?"}],"opts":[{"k":"a","t":"Gaya"},{"k":"b","t":"Bhagalpur"},{"k":"c","t":"Patna"},{"k":"d","t":"Munger"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["B.P.S.C. C.D.P.O. 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Among the given options, the centres of the textile industry in Bihar are Bhagalpur, Patna and Gaya. The textile industry in Bihar includes handloom, silk and jute industries. Therefore, since more than one option is correct, the correct answer is option (e)."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"First Sugar Mill was set up in Bihar at –"}],"opts":[{"k":"a","t":"Marhaura"},{"k":"b","t":"Bettiah"},{"k":"c","t":"Motihari"},{"k":"d","t":"Patna"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The first modern sugar mill (using the vacuum-pan process) was set up in 1904 at Marhaura (Saran district), whereas the first sugar factory in Bihar based on traditional techniques was started in 1840 at Bettiah."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"Where is the office of the Commissioner of Industries of Bihar located?"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Gaya"},{"k":"c","t":"Hajipur"},{"k":"d","t":"Muzaffarpur"}],"ans":"a","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The office of the Commissioner of Industries, Bihar is located in Patna."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"Kapilansh Dhatu Udyog has been set up in"}],"opts":[{"k":"a","t":"Rajpur in Buxar district"},{"k":"b","t":"Ranipur in Buxar district"},{"k":"c","t":"Rajpur in Gaya district"},{"k":"d","t":"Tamkuha in West Champaran district"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Kapilansh Metal Industry was established in Rajpur of Buxar district in Bihar. Kapilansh Metal Industry Private Limited is a leading and well-established manufacturer in India of centrifugal cast-iron pipes and fittings."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"Which is the prominent financial institution to give industrial financial aid in Bihar –"}],"opts":[{"k":"a","t":"World Bank"},{"k":"b","t":"BISCOMAN"},{"k":"c","t":"Bihar State Financial Corporation"},{"k":"d","t":"State Bank of India"}],"ans":"c","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"For providing industrial financial assistance in Bihar, the Bihar State Financial Corporation was established in 1954."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"Two statements are given below, in which one is Assertion (A) and the other is Reason (R). Read both carefully Assertion (A) : South Bihar is more developed than North Bihar. Reason (R) : Industries have developed in South Bihar. In reference to the above two statements, which of the following is correct?"}],"opts":[{"k":"a","t":"Both (A) and (R) are true and (R) is the correct explanation of (A)"},{"k":"b","t":"Both (A) and (R) are true, but (R) is not the correct explanation of (A)"},{"k":"c","t":"(A) is true, but (R) is false"},{"k":"d","t":"(A) is false, but (R) is true"}],"ans":"d","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At present, South Bihar is more developed than North Bihar, but before the year 2000, South Bihar (that is, present-day Jharkhand) was less developed than North Bihar. The underdevelopment of southern Bihar was the main issue behind the creation of a separate Jharkhand state. The then South Bihar was a mineral-rich region; therefore, mineral-based industries developed comparatively more there. Jamshedpur, Dhanbad and Bokaro were major industrial towns of the then South Bihar."}],"xref":null}]},{"title":"Energy Resources","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Nepal's first transnational Petroleum Pipeline starts from which place in Bihar?"}],"opts":[{"k":"a","t":"Motihari"},{"k":"b","t":"Raxaul"},{"k":"c","t":"Jogbani"},{"k":"d","t":"Patna"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Nepal’s first multinational petrol pipeline starts from Motihari in Bihar and goes up to Amlekhganj in Nepal. This 69 km. long pipeline was inaugurated on 10 September, 2019 by Nepal’s then Prime Minister K. P. Sharma Oli and India’s Prime Minister Narendra Modi."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"What was the power capacity availability in the Bihar state in the year 2019?"}],"opts":[{"k":"a","t":"4767 MW"},{"k":"b","t":"4867 MW"},{"k":"c","t":"5767 MW"},{"k":"d","t":"5867 MW"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was the correct answer. As per the Bihar Economic Survey, 2024–25, according to the state’s generation plan, the estimated peak availability is 7157 MW in 2024–25 and 7463 MW in 2025–26."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"Per capita energy consumption of the state of Bihar is :"}],"opts":[{"k":"a","t":"203kWh"},{"k":"b","t":"187kWh"},{"k":"c","t":"161kWh"},{"k":"d","t":"145kWh"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the context of the time of the question, option (a) was the correct answer. As per the Bihar Economic Survey, 2024–25, per capita electricity consumption in Bihar increased from 203 kWh in 2015 to 348 kWh in 2023. As per the provisional figures for 2024, per capita electricity consumption in Bihar has become 363 kWh."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"The latest annual per capita consumption of electricity in Bihar is –"}],"opts":[{"k":"a","t":"Lowest"},{"k":"b","t":"Second lowest"},{"k":"c","t":"Highest"},{"k":"d","t":"Second highest"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"As per the Bihar Economic Survey, 2020–21, per capita electricity consumption in Bihar in 2019–20 was 332 kWh, which is the lowest level of electricity consumption in the country, whereas as per the Bihar Economic Survey, 2024–25, for 2024 (provisional), per capita electricity consumption in Bihar is 363 kWh."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"The three thermal power stations in Bihar run on coal are"}],"opts":[{"k":"a","t":"Chandrapur, Panchet, Barauni"},{"k":"b","t":"Bokaro, Panchet, Chandrapur"},{"k":"c","t":"Barauni, Chandrapur, Santaldih"},{"k":"d","t":"Bokaro, Chandrapur, Santaldih"}],"ans":"*","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bokaro, Chandrapura (Chandpura) and Santaldih are three coal-based thermal power stations. At present, Bokaro and Chandrapura are in the state of Jharkhand (earlier Bihar), while Santaldih is located in West Bengal. Therefore, both during the time of the question and even at present, Santaldih Thermal Power Station is located in the state of West Bengal. At present, in Bihar, coal-based thermal power stations such as Barauni, Barh and Kahalgaon are operated by NTPC."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Kahalgaon, Kanti, Barh and Nabinagar are the centres for which of the following?"}],"opts":[{"k":"a","t":"Coal mining"},{"k":"b","t":"Tourism"},{"k":"c","t":"Thermal power"},{"k":"d","t":"Cotton textile industry"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Kahalgaon (Bhagalpur), Kanti (Muzaffarpur), Barh (Patna) and Nabinagar (Aurangabad) are centres of thermal power in Bihar."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"The Barh Super Thermal Power Station (BSTPS) is located in which state?"}],"opts":[{"k":"a","t":"Bihar"},{"k":"b","t":"Karnataka"},{"k":"c","t":"Rajasthan"},{"k":"d","t":"Punjab"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Kahalgaon (Bhagalpur), Kanti (Muzaffarpur), Barh (Patna) and Nabinagar (Aurangabad) are centres of thermal power in Bihar."}],"xref":6},{"n":8,"g":null,"stem":[{"type":"p","text":"In which of the following years was the Bihar state Hydroelectric Power Corporation was established ?"}],"opts":[{"k":"a","t":"1992"},{"k":"b","t":"1982"},{"k":"c","t":"1998"},{"k":"d","t":"1990"}],"ans":"b","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Bihar State Hydroelectric Power Corporation (BHPC: Bihar State Hydroelectric Power Corporation) was established in 1982. It was an undertaking of the Government of Bihar. It worked for the development, installation, coordination, financing, and operation, etc. of all types of renewable energy projects in Bihar (such as hydroelectric, solar, wind, biomass, etc.)."}],"xref":null}]},{"title":"Current Events : Bihar","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"How many bronze medals were won by Bihar players in the 38th National Junior Athletics Championship 2025?"}],"opts":[{"k":"a","t":"4"},{"k":"b","t":"5"},{"k":"c","t":"6"},{"k":"d","t":"More than one of the above"}],"ans":"*","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the final answer key of the Bihar Public Service Commission, this question has been deleted. No such championship was held in 2025. The 38th National Junior Athletics Championship was held in 2023."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"In which city of Bihar was the recently inaugurated National Dolphin Research Centre located ?"}],"opts":[{"k":"a","t":"Darbhanga"},{"k":"b","t":"Patna"},{"k":"c","t":"Munger"},{"k":"d","t":"Gaya"}],"ans":"b","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 4 March, 2024, the Chief Minister of Bihar, Nitish Kumar, inaugurated the National Dolphin Research Centre. This centre is located in Patna."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"Who has been awarded with the Dadasaheb Phalke Indian Television Award in 2022 from Bihar?"}],"opts":[{"k":"a","t":"Sharad Sinha"},{"k":"b","t":"Deep Shrestha"},{"k":"c","t":"Madan Pande"},{"k":"d","t":"Shatrughan Sinha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Re-Exam) (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the Dadasaheb Phalke Indian Television Award, 2022 held in Mumbai, Deep Shrestha, a film actor and director from Patna, was honoured with this award. Deepak Desai has been honoured with the Dadasaheb Phalke Indian Television Award, 2025 for his poetry collection “Balloons of Memories”."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"In which state is 'Raksha Bandhan' celebrated as 'Tree Protection Day'?"}],"opts":[{"k":"a","t":"Madhya Pradesh"},{"k":"b","t":"Uttar Pradesh"},{"k":"c","t":"Bihar"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"c","src":["B.P.S.C. Teacher (9th-10th) 08.12.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"In the state of Bihar, the day of ‘Raksha Bandhan’ is celebrated as ‘Tree Protection Day’ by the Bihar Government. This initiative was started by the Chief Minister of Bihar, Nitish Kumar."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"In April, 2020 the Bihar Education Department started the following program through DD Bihar"}],"opts":[{"k":"a","t":"the telecast of e-content for class V-VI students"},{"k":"b","t":"the telecast of e-content for class IX-X students"},{"k":"c","t":"the telecast of Krishak-Chaupal program for farmers"},{"k":"d","t":"the telecast of a cultural program to save old culture of Bihar"}],"ans":"b","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In April 2020, during COVID-19, the Bihar Education Department started TV-based education through DD Bihar. It was started first for students of Classes 9 and 10. Later, students of other classes were also included through this initiative. Therefore, with reference to April 2020, option (b) will be the correct answer."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"In which district of Bihar was the first floating solar power plant built?"}],"opts":[{"k":"a","t":"Darbhanga"},{"k":"b","t":"West Champaran"},{"k":"c","t":"Madhubani"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["B.P.S.C. Teacher (9th-10th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"The first floating solar power plant in Bihar has been built in Darbhanga district. This solar plant has been built on a pond in Kadirabad in Darbhanga district, with a capacity of 2 megawatts."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"Which of the following centres in Bihar is proposed to be developed under Vishnupad Yojana for promotion of tourism in Union Budget 2024 ?"}],"opts":[{"k":"a","t":"Nalanda"},{"k":"b","t":"Rajgir"},{"k":"c","t":"Vaishali"},{"k":"d","t":"Gaya"}],"ans":"d","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the Union Budget 2024–25 presented in July, 2024, following the model of the Kashi Vishwanath Temple Corridor, extensive development was proposed for the Vishnupad Temple Corridor in Gaya and the Mahabodhi Temple Corridor in Bodh Gaya to transform them into world-class pilgrimage and tourist destinations."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Bihula Festival is especially celebrated every year in the month of August in which of the following districts of Bihar?"}],"opts":[{"k":"a","t":"Bhagalpur"},{"k":"b","t":"Patna"},{"k":"c","t":"Sitamarhi"},{"k":"d","t":"Darbhanga"}],"ans":"a","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Bihula Festival is especially celebrated every year in August in Bhagalpur district of Bihar. In this festival of eastern Bihar, people pray to Goddess Manasa for the welfare of their families."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Which of the following has received a GI tag in Bihar?"}],"opts":[{"k":"a","t":"Magahi Paan"},{"k":"b","t":"Basmati rice"},{"k":"c","t":"Chanderi Saree"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["B.P.S.C. Teacher (9th -10th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"Among the given options, Magahi Paan has received the GI tag. Magahi Paan is an expensive variety of betel leaf, cultivated in the Magadh region of Bihar, in districts such as Aurangabad, Gaya, Nalanda, etc."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"Who has been appointed by the Government of Bihar as the Chairman of the State Backward Classes Commission on January 2, 2022?"}],"opts":[{"k":"a","t":"Justice Sanjay Kumar"},{"k":"b","t":"Justice Balmiki Prasad Sinha"},{"k":"c","t":"Justice Iqbal A. Ansari"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["B.P.S.C. Teacher (11th-12th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"Justice Sanjay Kumar was appointed as the Chairman of the State Backward Classes Commission by the Government of Bihar on 2 January 2022. He assumed charge on 5 January 2022."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"Bihar Government has planned to make Bihar State ‘pollution-free’ by reducing carbon emissions by which year?"}],"opts":[{"k":"a","t":"2047"},{"k":"b","t":"2022"},{"k":"c","t":"2024"},{"k":"d","t":"2030"}],"ans":"*","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Government of Bihar signed a Memorandum of Understanding with the United Nations Environment Programme with the objective of reducing carbon emissions and making the state ‘pollution-free’ by the year 2040. Since the year 2040 is not mentioned in the given options, none of the options is correct; therefore, the Bihar Public Service Commission excluded this question from evaluation."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Who was the Chief Justice of the Patna High Court who administered the oath of ofÏce to Shri Phagu Chauhan as the Governor of Bihar in July 2019?"}],"opts":[{"k":"a","t":"Hon'ble Mukesh Shah"},{"k":"b","t":"Hon'ble A.P. Sahi"},{"k":"c","t":"Hon. Rekha Manharlal Doshit"},{"k":"d","t":"Hon. Deepak Mishra"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 29 July, 2019, the Chief Justice of the Patna High Court, A. P. Sahi, administered the oath of office to the newly appointed Governor of Bihar, Phagu Chauhan. Senior Judge Sangam Kumar Sahoo of the Orissa High Court was appointed as the new Chief Justice of the Patna High Court."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"Which airport did the NDMA conduct a mock drill based on CBRN emergency in April, 2018?"}],"opts":[{"k":"a","t":"IGI - New Delhi"},{"k":"b","t":"L.N.J.P. - Patna"},{"k":"c","t":"C.S.I. - Mumbai"},{"k":"d","t":"D.A.B.H. - Indore"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The National Disaster Management Authority conducted a mock drill based on a CBRN (Chemical, Biological, Radiological and Nuclear) emergency in April, 2018 at Jay Prakash Narayan International Airport, Patna. This exercise was carried out with the cooperation of the Airports Authority of India and the Institute of Nuclear Medicine and Allied Sciences."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"When was the Lok Sabha Election 2004 cancelled and re-voting done at Chhapra constituency in Bihar?"}],"opts":[{"k":"a","t":"10 May and 15 July"},{"k":"b","t":"10 May and 31 May"},{"k":"c","t":"15 May and 31 May"},{"k":"d","t":"25 May and 10 June"}],"ans":"b","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 10 May, 2004, the Election Commission cancelled the Lok Sabha election held in Chhapra on 26 April, 2004, considering it neither free nor fair, and ordered re-polling on 31 May, 2004."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Recently, the incident of massacre in Bihar, in which about 40 people were killed, where did this incident happen?"}],"opts":[{"k":"a","t":"Near Gaya"},{"k":"b","t":"Near Patna"},{"k":"c","t":"Near Ranchi"},{"k":"d","t":"Near Bhagalpur"}],"ans":"a","src":["38th B.P.S.C. (Pre) 1992-93"],"yr":1992,"fam":["38th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 12 February, 1992, 35 persons were killed in a massacre at Bara near Gaya. However, the question has an error as it mentions “about 40”."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"In which Indian state is 'Kala-azar' disease widespread?"}],"opts":[{"k":"a","t":"West Bengal"},{"k":"b","t":"Bihar"},{"k":"c","t":"Orissa"},{"k":"d","t":"Uttar Pradesh"}],"ans":"b","src":["38th B.P.S.C. (Pre) 1992-93"],"yr":1992,"fam":["38th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1991–92, Kala-azar spread in Bihar. The scientific name of Kala-azar is Visceral Leishmaniasis."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"Who among the following was elected to the Rajya Sabha from the Bihar Legislative Assembly?"}],"opts":[{"k":"a","t":"Sunil Dutt"},{"k":"b","t":"Rabri Devi"},{"k":"c","t":"Sahib Singh Verma"},{"k":"d","t":"None of these"}],"ans":"d","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, none of these was a member of the Rajya Sabha. At present, the Rajya Sabha members from Bihar are—Dr. Faiyyaz Ahmad, Satish Chandra Dubey, Prem Chand Gupta, Dharmashila Gupta, Harivansh Narayan Singh, Sanjay Kumar Jha, Manoj Kumar Jha, Upendra Kushwaha, Manan Kumar Mishra, Khiru Mahto, Shambhu Sharan Patel, Dr. Bhim Singh, Amarendra Dhari Singh, Akhilesh Prasad Singh, Ramnath Thakur and Sanjay Yadav."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"Where is India's first dolphin observatory being built?"}],"opts":[{"k":"a","t":"Delhi"},{"k":"b","t":"Mumbai"},{"k":"c","t":"Bihar"},{"k":"d","t":"Odisha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"India’s first Dolphin Observatory is being established at the Vikramshila Gangetic Dolphin Sanctuary in Bhagalpur district of Bihar."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"Which person from Bihar was awarded the Padma Bhushan on 26 January, 2021?"}],"opts":[{"k":"a","t":"Mridula Sinha"},{"k":"b","t":"Ram Vilas Paswan (Posthumously)"},{"k":"c","t":"Ramchandra Devi"},{"k":"d","t":"Ramchandra Manjhi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"*","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"On 25 January, 2021, it was announced that former Union Minister Ram Vilas Paswan would be awarded the Padma Bhushan posthumously. This award was received by his son, Chirag Paswan, during a ceremony held at Rashtrapati Bhavan on 9 November, 2021. It may be noted that he died on 8 October, 2020 due to a heart-related illness. He was the Cabinet Minister of the Ministry of Consumer Affairs, Food and Public Distribution in the government led by Narendra Modi. Ram Vilas Paswan first entered Parliament in 1977 by winning the Lok Sabha election from Hajipur on a Janata Party ticket. Note- The Padma awards are announced on the eve of Republic Day, i.e., 25 January. Therefore, mentioning 26 January, 2021 in the given question is incorrect. Instead, it should be 25 January, 2021."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"On 26 January, 2021, how many people from Bihar were honoured with the Padma Shri award in different fields?"}],"opts":[{"k":"a","t":"Four"},{"k":"b","t":"Three"},{"k":"c","t":"Two"},{"k":"d","t":"Five"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"*","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"On 25 January, 2021, it was announced that the following four persons from Bihar would be honoured with the Padma Shri, as follows—Dr. Dilip Kumar Singh, Dulari Devi, Late Mridula Sinha and Ramchandra Manjhi. On 25 January, 2025, it was announced that seven personalities from Bihar would be conferred Padma awards. This included folk singer Sharda Sinha (posthumous) and Bihar’s former Deputy Chief Minister Sushil Kumar Modi (posthumous) for the Padma Vibhushan and Padma Bhushan respectively, and Kishor Kunal (posthumous), Bhim Singh Bhavesh, Nirmala Devi, Hemant Kumar and Vijay Nityanand Surishwar Ji Maharaj for the Padma Shri."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"On 26 January, 2021, which person from Bihar was awarded the Padma Shri for outstanding contribution in the field of medicine?"}],"opts":[{"k":"a","t":"Dr. Ramkumar Yadav"},{"k":"b","t":"Dr. Raj Bahadur"},{"k":"c","t":"Dr. Randeep Guleria"},{"k":"d","t":"Dr. Dilip Kumar Singh"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"*","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"For outstanding contribution in the field of medicine, Dr. Dilip Kumar Singh was awarded the Padma Shri on 9 November, 2021. This was announced on 25 January, 2021. At the time of receiving the Padma Shri, Dilip Kumar Singh was 92 years old. Even at this age, he continues to give medicines to patients in Shermari village of Pirpainti block in Bhagalpur district."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"Which of the following persons from Bihar has received the Dadasaheb Phalke Award?"}],"opts":[{"k":"a","t":"Ashok Kumar"},{"k":"b","t":"Shatrughan Sinha"},{"k":"c","t":"Mohan Mishra"},{"k":"d","t":"Sharda Sinha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Actor Ashok Kumar, a resident of Bihar, was awarded the Dadasaheb Phalke Award in 1988 for his contribution to Indian cinema, and he was honoured with the Padma Bhushan in 1999. He was honoured with the Filmfare Award for Best Actor in 1963 for the film Rakhi."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"Which Indian journalist and media personality, a native of Bihar, has received the Magsaysay Award for the year 2019?"}],"opts":[{"k":"a","t":"Deepak Chaurasia"},{"k":"b","t":"Ravish Kumar"},{"k":"c","t":"Meenakshi Joshi"},{"k":"d","t":"Pankaj Bhargava"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"In 2019, Ravish Kumar, then a television journalist at NDTV, was honoured with the Ramon Magsaysay Award for the year 2019. Through his well-known programme “Prime Time”, Ravish Kumar prominently raised social, economic and political issues of national and regional importance. Ravish Kumar is from East Champaran district of Bihar."}],"xref":null},{"n":24,"g":null,"stem":[{"type":"p","text":"Which poor girl from Bihar received the 'Women's Creativity in Rural Life Award' from the World Women's Summit Foundation for her outstanding work in uplifting the people of her community?"}],"opts":[{"k":"a","t":"Ariba Falak"},{"k":"b","t":"Chhoti Kumari Singh"},{"k":"c","t":"Prema Mahato"},{"k":"d","t":"Reena Mandal"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Chhoti Kumari Singh of Bihar was honoured with the “Prize for Women’s Creativity in Rural Life” by the Switzerland-based Women’s World Summit Foundation for her outstanding work for the upliftment of the Musahar community of the state."}],"xref":null},{"n":25,"g":null,"stem":[{"type":"p","text":"Which of the following individuals from Bihar has been awarded the Bharat Ratna?"}],"opts":[{"k":"a","t":"Rajendra Prasad"},{"k":"b","t":"Nitish Kumar"},{"k":"c","t":"Karpuri Thakur"},{"k":"d","t":"Ram Vilas Paswan"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"In the context of the time of the question, option (a) was the correct answer. Dr. Rajendra Prasad, the first President of India, was honoured with India’s highest civilian award, the Bharat Ratna, in 1962. It is noteworthy that Dr. Rajendra Prasad was born on 3 December, 1884, in Ziradei village of Siwan district (then Saran) of Bihar. People affectionately called him “Rajendra Babu”. His father’s name was Mahadev Sahai and his mother’s name was Kamleshwari Devi. In 2024, former Chief Minister of Bihar Karpoori Thakur was also awarded the Bharat Ratna. Therefore, in the present context, option (e) will be the correct answer."}],"xref":null},{"n":26,"g":null,"stem":[{"type":"p","text":"Where was the Agriculture Kumbh Mela, 2019 organised in Bihar?"}],"opts":[{"k":"a","t":"Champaran"},{"k":"b","t":"Motihari"},{"k":"c","t":"Rajgir"},{"k":"d","t":"Gaya"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, the “Agriculture Kumbh Mela, 2019” was organised at Gandhi Maidan, Motihari, from 9 to 11 February, 2019."}],"xref":null},{"n":27,"g":null,"stem":[{"type":"p","text":"When was the first integrated check post established in Bihar?"}],"opts":[{"k":"a","t":"2012"},{"k":"b","t":"2014"},{"k":"c","t":"2018"},{"k":"d","t":"2020"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The first Integrated Check Post in Bihar was established on 7 April, 2018. In August, 2009, the Government of India, through the Ministry of External Affairs, gave approval for providing financial assistance for construction at Birgunj and Biratnagar in Nepal. This Integrated Check Post at Birgunj (Raxaul–Birgunj) was jointly inaugurated by the Prime Ministers of India and Nepal on 7 April, 2018, whereas the Biratnagar (Jogbani–Biratnagar) Integrated Check Post was inaugurated on 21 January, 2020."}],"xref":null},{"n":28,"g":null,"stem":[{"type":"p","text":"On March 18, 2018, in which city of Bihar did Deputy Chief Minister Sushil Modi inaugurate the state's first 'Start-up Hub'?"}],"opts":[{"k":"a","t":"Motihari"},{"k":"b","t":"Munger"},{"k":"c","t":"Patna"},{"k":"d","t":"Ara"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 16 March, 2018, Bihar’s Deputy Chief Minister Sushil Kumar Modi inaugurated the state’s first IT Start-up Hub at Biscoman Bhawan in Patna."}],"xref":null},{"n":29,"g":null,"stem":[{"type":"p","text":"Under which of the following Chief Minister Shri Nitish Kumar launched more than 750 development schemes at Begusarai and Khagaria districts on 6 January, 2018?"}],"opts":[{"k":"a","t":"Vikas Yatra"},{"k":"b","t":"Vikas Survekshan Yatra"},{"k":"c","t":"Nav-Srijan Yojana, 2018"},{"k":"d","t":"Vikas Samiksha Yatra"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the ‘Vikas Samiksha Yatra’, Chief Minister Nitish Kumar inaugurated more than 750 development projects in the Begusarai and Khagaria districts on 6 January 2018. The total cost of these projects was estimated at approximately ₹500 crore."}],"xref":null},{"n":30,"g":null,"stem":[{"type":"p","text":"The world’s first Gender Literature Festival was organised—"}],"opts":[{"k":"a","t":"In Patna"},{"k":"b","t":"In Jaipur"},{"k":"c","t":"In Mumbai"},{"k":"d","t":"In Hyderabad"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The world’s first ‘Gender Literature Festival’ was organised in Patna, Bihar, in April, 2017. The main objective of this festival was to provide a platform for exchanging and sharing ideas and to understand the experiences of renowned personalities in the field of gender literature."}],"xref":null},{"n":31,"g":null,"stem":[{"type":"p","text":"On April 10, 2018, where did Prime Minister Narendra Modi address the 'National Convention of Swachhagrahis'?"}],"opts":[{"k":"a","t":"Motihari"},{"k":"b","t":"Patna"},{"k":"c","t":"Kishanganj"},{"k":"d","t":"Katihar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 10 April 2018, Prime Minister Narendra Modi addressed the ‘National Convention of Swachhagrahis’ at Motihari in Bihar. This convention was organised as part of the centenary celebrations of the Champaran Satyagraha led by Mahatma Gandhi."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"According to a report, what is the rank of Patna city among 20 cities as per availability of 4G signals between December 2017 and February 2018?"}],"opts":[{"k":"a","t":"First"},{"k":"b","t":"Second"},{"k":"c","t":"Nineteenth"},{"k":"d","t":"Twentieth"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the ‘OpenSignal Report’, Patna ranked first among 20 cities of the country in terms of availability of 4G signals between December, 2017 and February, 2018."}],"xref":null},{"n":33,"g":null,"stem":[{"type":"p","text":"In which city of Bihar, Sulabh International launched the cheapest drinking water project 'Sulabh Jal'?"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Bhagalpur"},{"k":"c","t":"Darbhanga"},{"k":"d","t":"Purnea (d) None of the above / More than one of the above"}],"ans":"c","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In July, 2018, Sulabh International launched a water project named ‘Sulabh Jal’ in Darbhanga city of Bihar. Under this project, polluted water from ponds and rivers will be converted into clean and safe drinking water. Through this project, people will be able to obtain pure and clean water easily at a rate of only 50 paise per litre."}],"xref":null},{"n":34,"g":null,"stem":[{"type":"p","text":"In 2019, the value of the Human Development Index of Bihar was-"}],"opts":[{"k":"a","t":"0.641"},{"k":"b","t":"0.613"},{"k":"c","t":"0.596"},{"k":"d","t":"0.574"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 2019, the value of the Human Development Index (HDI) of Bihar was 0.574."}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"The Government of India conferred the Krishi Karman Award to Bihar State on 2nd January, 2020. This award was given for –"}],"opts":[{"k":"a","t":"Production and productivity of maize and wheat"},{"k":"b","t":"Food grain production"},{"k":"c","t":"Production of rice"},{"k":"d","t":"Production of oilseeds"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 2 January 2020, the Government of India awarded the Krishi Karman Award to the state of Bihar for continuous growth in production along with increased productivity in maize and wheat."}],"xref":null},{"n":36,"g":null,"stem":[{"type":"p","text":"'Digital India Award, 2020' was given to the Bihar Government for?"}],"opts":[{"k":"a","t":"Establishing technical institutes in Bihar"},{"k":"b","t":"Bringing the IT revolution in Bihar"},{"k":"c","t":"Faciliating e-administration in Bihar"},{"k":"d","t":"Providing services to the people stranded outside Bihar during the Covid-19 lockdown"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"For providing services to people stranded outside Bihar during the COVID-19 lockdown, the then President, Ram Nath Kovind, conferred the ‘Digital India Award, 2020’ on the Government of Bihar."}],"xref":null},{"n":37,"g":null,"stem":[{"type":"p","text":"In which state was the 'Ghar Tak Fibre' scheme launched on September 21, 2020, via video conference?"}],"opts":[{"k":"a","t":"Uttar Pradesh"},{"k":"b","t":"Madhya Pradesh"},{"k":"c","t":"Bihar"},{"k":"d","t":"Karnataka"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 21 September, 2020, through video conferencing, the ‘Ghar Tak Fiber’ scheme was launched in Bihar."}],"xref":null},{"n":38,"g":null,"stem":[{"type":"p","text":"In which district of Bihar was the Garib Kalyan Rojgar Abhiyan launched by the Prime Minister in 2020?"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Banka"},{"k":"c","t":"Madhepura"},{"k":"d","t":"Khagaria"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 20 June, 2020, the Prime Minister, Narendra Modi, launched the ‘Garib Kalyan Rojgar Abhiyan’ through video conferencing from Khagaria district of Bihar. The objective of this campaign was to empower the large number of migrant workers who returned home due to the COVID-19 pandemic and to provide livelihood opportunities in their respective regions/villages."}],"xref":null},{"n":39,"g":null,"stem":[{"type":"p","text":"Which state government has recently completely banned the manufacturing, sale, and purchase of electronic cigarettes in the entire state?"}],"opts":[{"k":"a","t":"Madhya Pradesh"},{"k":"b","t":"Rajasthan"},{"k":"c","t":"Uttar Pradesh"},{"k":"d","t":"Bihar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The Government of Bihar has imposed a complete ban throughout the state on the manufacture, sale and purchase of electronic cigarettes. States that have imposed a ban on e-cigarettes also include Punjab, Maharashtra, Kerala, Karnataka, Mizoram, Uttar Pradesh and Rajasthan. An e-cigarette is a device that looks like an ordinary cigarette. It has a battery and a cartridge."}],"xref":null},{"n":40,"g":null,"stem":[{"type":"p","text":"Which of the following states launched the 'Safe City Surveillance Scheme' in December, 2017 to curb crimes against women in public places?"}],"opts":[{"k":"a","t":"Maharashtra"},{"k":"b","t":"Uttarakhand"},{"k":"c","t":"Bihar"},{"k":"d","t":"Delhi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"In December, 2017, the Government of Bihar launched the ‘Safe City Surveillance Scheme’ to curb crimes against women in public places. The objective of this scheme is to bring all major public places under strict surveillance through Closed-Circuit Television (CCTV) cameras and to improve overall crime control in the state."}],"xref":null}]},{"title":"Miscellaneous","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Which of the following is the state animal of Bihar?"}],"opts":[{"k":"a","t":"Bull"},{"k":"b","t":"Cow"},{"k":"c","t":"Buffalo"},{"k":"d","t":"Horse"}],"ans":"a","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the gazette issued by the Government of Bihar on 7 May, 2013, the state animal of Bihar is the Bull (Bos taurus), the state bird is the Sparrow (Passer domesticus), the state tree is the Peepal (Ficus religiosa), and the state flower is the Marigold (Tagetes spp.)."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"In which year, the Nalanda University was re-established in Bihar?"}],"opts":[{"k":"a","t":"2007"},{"k":"b","t":"2005"},{"k":"c","t":"2008"},{"k":"d","t":"2014"}],"ans":"d","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the Nalanda University Act, 2010 was passed by Parliament, the university actually began its academic session in September, 2014 with the enrollment of the first batch of students. This is considered the year of its re-establishment."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"Where is the 'Gullak Bachcha Bank'?"}],"opts":[{"k":"a","t":"Delhi"},{"k":"b","t":"Patna"},{"k":"c","t":"Bhopal"},{"k":"d","t":"Jaipur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"‘Gullak Bachcha Bank’ is a collective bank for poor children, located in Patna. Accounts are opened in this bank for children aged 8 years to 16 years. Here, a child’s account can be opened for just ₹10. This bank is operated through the Bihar Government’s Education Department institution ‘Kilkari Bihar Bal Bhavan’. The operation of this bank is done by the children themselves."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"What is the tagline of Bihar State Tourism Development Corporation?"}],"opts":[{"k":"a","t":"Bright Bihar"},{"k":"b","t":"Hum Sabka Bihar"},{"k":"c","t":"Blissful Bihar"},{"k":"d","t":"Bihar is the Best"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Bihar State Tourism Development Corporation is responsible for the development of tourism in the state. The tagline of the Bihar State Tourism Development Corporation/ Bihar Tourism is ‘Blissful Bihar’."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"What is the significance of ‘Bihar Day’, which is celebrated every year on 22 March?"}],"opts":[{"k":"a","t":"On this day, the State Reorganisation Commission created Bihar"},{"k":"b","t":"On this day in 1873 CE, Bihar was taken out of the United Provinces"},{"k":"c","t":"To commemorate the separation of Bihar from the Bengal Presidency in 1912"},{"k":"d","t":"To celebrate the naming of Bihar by Muslim rulers in the 12th century"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar Day is celebrated every year on 22 March. It may be noted that on 22 March 1912, the announcement was made to separate the Bihar and Odisha Division from the Bengal Presidency. However, this came into effect on 1 April 1912."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Bihar Day is celebrated _______."}],"opts":[{"k":"a","t":"On 22 March to mark separation from the Calcutta Presidency"},{"k":"b","t":"On 22 March in memory of separation from the Mughal Presidency"},{"k":"c","t":"On 22 March to mark separation from the Bengal Presidency"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"c","src":["B.P.S.C. Teacher, July 2024"],"yr":2024,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"Bihar Day is celebrated every year on 22 March. It may be noted that on 22 March 1912, the announcement was made to separate the Bihar and Odisha Division from the Bengal Presidency. However, this came into effect on 1 April 1912."}],"xref":5},{"n":7,"g":null,"stem":[{"type":"p","text":"Under the Digital Bihar programme, which students will receive computer education and training from 2021-22 onwards?"}],"opts":[{"k":"a","t":"All students of class V"},{"k":"b","t":"All students of class VI"},{"k":"c","t":"All students of class VII"},{"k":"d","t":"All students of class VIII"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the ‘Digital Bihar Programme’, students of all classes from Class VI onwards will receive computer education and training from the academic year 2021–22."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Nearly 55 percent of the total population of Bihar survives in absolute poverty because: I. Bihar lacks in natural resources, both existing and potential. II. Bihar has the fastest total fertility rate in India. III.Bihar has very unfavorable agro-climatic conditions. IV. Bihar lacks in quality infrastructure and business-friendly environment. Which of these reasons are correct?"}],"opts":[{"k":"a","t":"I and II"},{"k":"b","t":"II and III"},{"k":"c","t":"II and IV"},{"k":"d","t":"I, III and IV"}],"ans":"a","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the division of Bihar, all its natural resources went to the state of Jharkhand, resulting in a lack of natural resources, both existing and potential. In terms of total fertility rate, Bihar is among the states with the highest rates in India. Bihar’s Total Fertility Rate (TFR) is recorded as 3.0 [ NFHS-5 (2019–21)], whereas NFHS-4 it was 3.4 (2015–16)."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"The 'Operation Prahar' in Bihar is related to"}],"opts":[{"k":"a","t":"COVID-19 vaccination"},{"k":"b","t":"Literacy campaign"},{"k":"c","t":"No smoking"},{"k":"d","t":"Liquor ban"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"To realize the vision of a crime-free Bihar, the Bihar Police started Operation Prahar. Operation Prahar is being conducted in Bihar against persons involved in serious criminal incidents as well as against those who violate the liquor prohibition law."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"Cow slaughter was banned by a law in Bihar in which year?"}],"opts":[{"k":"a","t":"1948"},{"k":"b","t":"1949"},{"k":"c","t":"1954"},{"k":"d","t":"1955"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Through the Bihar Animal Preservation and Improvement Act, 1955, the slaughter of cow, calf, bull and buffalo (she-buffalo) was prohibited in Bihar."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"Which of these is true?"}],"opts":[{"k":"a","t":"Bihar has been a major producer of coal and mica"},{"k":"b","t":"Bihar was separated from Orissa in the year 1911"},{"k":"c","t":"Bihar borders Odisha after the formation of the state of Jharkhand"},{"k":"d","t":"Bihar has a unicameral legislature"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001-02"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar was a major producer of coal and mica, but after the formation of Jharkhand state, this is no longer the case. Odisha (Orissa) was separated from Bihar and made a new province in 1936. After the formation of Jharkhand state, Bihar does not share a border with Odisha. Bihar has a bicameral legislature."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Which of the following items is not registered as a Geographical Indication (GI) of Bihar?"}],"opts":[{"k":"a","t":"Jardalu Mango"},{"k":"b","t":"Muga Silk"},{"k":"c","t":"Katni Paddy"},{"k":"d","t":"Magahi Paan"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Assam’s Muga silk was granted the GI tag in 2007, whereas Bhagalpuri Jardalu mango, Katni paddy (Katarni rice) and Magahi paan of Bihar were granted the GI tag in 2018."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"From the last few years Buddhist monks in Bihar are agitating to have control over–"}],"opts":[{"k":"a","t":"Mahabodhi Temple of Gaya"},{"k":"b","t":"Vishnupad Temple of Gaya"},{"k":"c","t":"Sun Temple of Deo"},{"k":"d","t":"None of the above"}],"ans":"a","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In recent years, Buddhist monks have been protesting in Bihar to obtain control over the Mahabodhi Temple at Gaya. For the first time, the Sri Lankan Buddhist monk Anagarika Dharmapala raised this demand in 1891 AD, stating that the Mahabodhi Temple at Gaya should be under the control of Buddhist monks. Nagarjuna Surai Seshai, President of the All India Mahabodhi Temple Liberation Committee, also placed the demand for control of the Mahabodhi Temple by Buddhist monks before the United Nations High Commissioner for Refugees (UNHCR)."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"Where is the lunatic asylum situated in Bihar?"}],"opts":[{"k":"a","t":"Dhanbad"},{"k":"b","t":"Nalanda"},{"k":"c","t":"Patna"},{"k":"d","t":"Ranchi"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997","43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["42nd B.P.S.C. (Pre)","43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, the mental asylum in Bihar was actually located at a place called Kanke in Ranchi, at the Ranchi Institute of Neuro-Psychiatry & Allied Sciences (RINPAS). At present, Ranchi is the capital of Jharkhand."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Rashmi Kumari from Bihar is a/an-"}],"opts":[{"k":"a","t":"International cricketer"},{"k":"b","t":"International Carrom champion"},{"k":"c","t":"Football player"},{"k":"d","t":"Chess player"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Rashmi Kumari of Bihar is a renowned international carrom player. She has been the winner of the 2nd, 3rd, 5th and 6th Asian Carrom Championships, the 1st and 4th Carrom World Cups, the 1st Malaysia Open Carrom Championship (1999), etc."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"The late actor Kumudlal Ganguly, also known by his stage name Ashok Kumar, was born in which of the following cities of Bihar?"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Munger"},{"k":"c","t":"Bhagalpur"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"c","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Actor Kumudlal Ganguly (Ashok Kumar) was born on 13 October, 1911 in Bhagalpur, Bihar. He died on 10 December 2001 in Mumbai."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"Which medal did Ritik Anand of Bihar win for India at the 24th Summer Deaf Badminton Olympics held in Brazil?'"}],"opts":[{"k":"a","t":"Gold medal"},{"k":"b","t":"Silver medal"},{"k":"c","t":"Bronze Medal"},{"k":"d","t":"Platinum Medal"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The 24th Summer Deaflympics were held in Brazil from 1 to 15 May, 2022. Ritik (Hrithik) Anand of Bihar won a gold medal in the badminton team event."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"Who is the Brand Ambassador of Khadi in Bihar?"}],"opts":[{"k":"a","t":"Pawan Singh"},{"k":"b","t":"Rajesh Tiwari"},{"k":"c","t":"Manoj Tiwari"},{"k":"d","t":"Manoj Bajpayee"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In February 2022, the Bihar Government announced Bhojpuri singer and Lok Sabha Member of Parliament (from North East Delhi) Manoj Tiwari as the Brand ambassador of Khadi in Bihar. In November, 2022, folk singer and currently a Bihar Legislative Assembly member, Maithili Thakur, was made the brand ambassador of Khadi and handicrafts in Bihar."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"At one time, the Naxalites were limited to only West Bengal and Andhra Pradesh in India. Now they have extended their activities in these states, also."}],"opts":[{"k":"a","t":"Odisha, Chhattisgarh, Jharkhand, Bihar"},{"k":"b","t":"Bihar, Chhattisgarh, Tamil Nadu, Uttar Pradesh"},{"k":"c","t":"Madhy Pradesh, Maharashtra, Jammu & Kashmir, Rajasthan"},{"k":"d","t":"Jharkhand, Bihar, Karnataka, Gujrat"}],"ans":"a","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, the Naxalism-affected area in India had expanded to Odisha (Orissa), Chhattisgarh, Jharkhand, West Bengal, Maharashtra, Telangana and Bihar. According to updated data, Naxalism in India is now concentrated in Chhattisgarh, Jharkhand, Maharashtra, Andhra Pradesh, Madhya Pradesh, Odisha and Telangana. At present, Bihar has become free from Naxalism."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"Shri Nibaran Chandra Dasgupta belonged to –"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Purulia"},{"k":"c","t":"Hazipur"},{"k":"d","t":"Minapur"}],"ans":"b","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shri Nivaran Chandra Dasgupta was born in Bikrampur (present-day Bangladesh). He was the Headmaster of the Purulia District School in the then Province of Bihar and Orissa (Purulia is in present-day West Bengal). His place of work was the Purulia district of present-day West Bengal."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"Manvi Madhu Kashyap recently became Bihar's first transgender"}],"opts":[{"k":"a","t":"Havildar in Bihar Regiment"},{"k":"b","t":"Bus Driver in state transport"},{"k":"c","t":"TrafÏc Police Inspector"},{"k":"d","t":"Sub-Inspector of Police"}],"ans":"d","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Manvi Madhu Kashyap became the first trans woman to become a Police Sub-Inspector after qualifying in the Bihar Police Sub-Inspector Competitive Examination, the result of which was declared in July, 2024. Two other transgender candidates were also selected in this examination, but they are trans men."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"Shreyasi Singh, Member of the Legislative Assembly, who has represented India in shooting in Paris Olympics 2024 was elected from which constituency in Bihar ?"}],"opts":[{"k":"a","t":"Sugauli"},{"k":"b","t":"Gidhaur"},{"k":"c","t":"Jamui"},{"k":"d","t":"Kesaria"}],"ans":"c","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shreyasi Singh is a member of the Bharatiya Janata Party in the Bihar Legislative Assembly, elected from the Jamui Assembly constituency in the 2020 and 2025 Assembly elections. She won a gold medal in the women’s double trap shooting event at the Commonwealth Games, 2018 held in Gold Coast."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"Which community was categorized as Scheduled Caste (SC) by a 2015 Bihar government notification which was quashed in july, 2024 by the Supreme Court, ruling that states cannot make changes to the SC list published under Article 341 of the Constitution ?"}],"opts":[{"k":"a","t":"Lal Begi"},{"k":"b","t":"Tanti-Tantwa"},{"k":"c","t":"Pano"},{"k":"d","t":"Dabgar"}],"ans":"b","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In its 2015 notification, the Bihar Government classified the Tanti-Tantwa community, earlier included in the Extremely Backward Class category, as a Scheduled Caste (SC). This was set aside by the Supreme Court in July, 2015. The Supreme Court held that states do not have the power to modify the SC list published under Article 341 of the Constitution. Under Article 341, the list of Scheduled Castes for the states is issued by the President through a Constitutional Order, and any amendment can be made only by Parliament through legislation."}],"xref":null}]}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const KEY = 'biharPYQ.mcq.v1';
const THEME_KEY = 'biharPYQ.theme';
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

/* ---------- flatten ---------- */
const ALL = [];
DATA.sections.forEach((s, si) => s.qs.forEach(q => {
  q.si = si; q.sec = s.title; q.id = si + ':' + q.n;
  q.hay = (blocksText(q.stem) + ' ' + q.opts.map(o => o.t).join(' ') + ' ' +
           blocksText(q.expl) + ' ' + q.src.join(' ')).toLowerCase();
  ALL.push(q);
}));
function blocksText(bs){
  return (bs || []).map(b => b.type === 'p' ? b.text
    : b.type === 'list' ? b.items.join(' ')
    : b.type === 'table' ? b.rows.map(r => r.join(' ')).join(' ') : '').join(' ');
}

/* ---------- state ---------- */
let store = { pick:{}, star:{}, seen:{} };
try { const r = localStorage.getItem(KEY); if (r) store = Object.assign(store, JSON.parse(r)); } catch(e){}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
}, 200); }

const view = { sec:null, i:0, filter:'all', query:'', exam:'', year:'', shuffle:false, seed:0, read:false, order:[] };

/* ---------- helpers ---------- */
const isRight = q => store.pick[q.id] && q.ans !== '*' && store.pick[q.id] === q.ans;
const isWrong = q => store.pick[q.id] && store.pick[q.id] !== '?' && q.ans !== '*' && store.pick[q.id] !== q.ans;
const done   = q => !!store.pick[q.id];

function pool(){
  let a = view.sec === null ? ALL : ALL.filter(q => q.si === view.sec);
  if (view.filter === 'todo')  a = a.filter(q => !done(q));
  if (view.filter === 'wrong') a = a.filter(isWrong);
  if (view.filter === 'star')  a = a.filter(q => store.star[q.id]);
  if (view.filter === 'flag')  a = a.filter(q => q.ans === '*');
  if (view.exam) a = a.filter(q => q.fam.indexOf(view.exam) > -1);
  if (view.year) a = a.filter(q => String(q.yr) === view.year);
  if (view.query){
    const words = view.query.toLowerCase().split(/\s+/).filter(Boolean);
    a = a.filter(q => words.every(w => q.hay.indexOf(w) > -1));
  }
  if (view.shuffle){
    const key = view.seed + '#' + a.map(q => q.id).join('|');
    if (view.orderKey !== key){
      view.orderKey = key;
      view.order = a.slice();
      for (let i = view.order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [view.order[i], view.order[j]] = [view.order[j], view.order[i]];
      }
    }
    return view.order;
  }
  view.orderKey = null;
  return a;
}

/* ---------- rendering primitives ---------- */
function renderBlocks(bs, host){
  (bs || []).forEach(b => {
    if (b.type === 'p'){ host.appendChild(el('p', null, b.text)); }
    else if (b.type === 'list'){
      const ul = el('ul');
      b.items.forEach(t => ul.appendChild(el('li', null, t)));
      host.appendChild(ul);
    } else if (b.type === 'table'){
      const tb = el('table'), tbody = el('tbody');
      b.rows.forEach(r => {
        const tr = el('tr');
        r.forEach(c => tr.appendChild(el('td', null, c)));
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody); host.appendChild(tb);
    }
  });
}

function bar(host, okN, noN, total){
  const b = el('div', 'bar');
  const o = el('i', 'ok'), n = el('i', 'no');
  o.style.width = total ? (okN / total * 100) + '%' : '0';
  n.style.width = total ? (noN / total * 100) + '%' : '0';
  b.append(o, n); host.appendChild(b); return b;
}

function secStats(si){
  const a = si === null ? ALL : ALL.filter(q => q.si === si);
  let ok = 0, no = 0;
  a.forEach(q => { if (isRight(q)) ok++; else if (isWrong(q)) no++; });
  return { n:a.length, ok, no, done:a.filter(done).length };
}

/* ---------- rail ---------- */
function drawRail(){
  const host = $('#subs'); host.textContent = '';
  (function allRow(){
    const st = secStats(null);
    const b = el('button', 'sub');
    b.setAttribute('aria-current', view.sec === null ? 'true' : 'false');
    const top = el('div', 'sub-top');
    top.append(el('span', 'sub-name', 'All topics'), el('span', 'sub-n', st.done + '/' + st.n));
    b.appendChild(top);
    bar(b, st.ok, st.no, st.n);
    b.style.marginBottom = '8px';
    b.onclick = () => { view.sec = null; view.i = 0; drawRail(); draw(); closeRail(); };
    host.appendChild(b);
  })();
  DATA.sections.forEach((s, i) => {
    const st = secStats(i);
    const b = el('button', 'sub');
    b.setAttribute('aria-current', view.sec === i ? 'true' : 'false');
    const top = el('div', 'sub-top');
    top.append(el('span', 'sub-name', s.title), el('span', 'sub-n', st.done + '/' + st.n));
    b.appendChild(top);
    bar(b, st.ok, st.no, st.n);
    b.onclick = () => { openSec(i); closeRail(); };
    host.appendChild(b);
  });
  const t = secStats(null);
  $('#ovOk').style.width = (t.ok / t.n * 100) + '%';
  $('#ovNo').style.width = (t.no / t.n * 100) + '%';
  const scored = t.ok + t.no;
  $('#ovLeft').textContent = t.done ? t.done + ' of ' + t.n + ' seen' : 'Not started';
  $('#ovRight').textContent = !t.done ? t.n + ' questions'
    : scored ? Math.round(t.ok / scored * 100) + '% of ' + scored + ' correct'
    : 'none scored yet';
}

/* ---------- counts on chips ---------- */
function drawCounts(){
  const base = view.sec === null ? ALL : ALL.filter(q => q.si === view.sec);
  $('#cAll').textContent = base.length;
  $('#cTodo').textContent = base.filter(q => !done(q)).length;
  $('#cWrong').textContent = base.filter(isWrong).length;
  $('#cStar').textContent = base.filter(q => store.star[q.id]).length;
  $('#cFlag').textContent = base.filter(q => q.ans === '*').length;
}

/* ---------- home ---------- */
function drawHome(){
