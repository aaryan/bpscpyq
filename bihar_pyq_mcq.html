The Gandak Project is a joint project of Nepal and India. Through this project, the states of Bihar and Uttar Pradesh in India, as well as Nepal, are benefited. This project is constructed on the Gandak River near Valmiki Nagar in Bihar. Two canals have been taken out from it—"},{"type":"list","items":["(1) Tirhut Main Canal","(2) Saran Main Canal"]}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"From which of the following canal systems is irrigation done in the area of Bihar?"}],"opts":[{"k":"a","t":"Upper Ganga Canal"},{"k":"b","t":"Triveni Canal"},{"k":"c","t":"Sharda Canal"},{"k":"d","t":"Eastern Yamuna Canal"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the question, among the given options, irrigation in the area of Bihar is done by the Triveni Canal. This canal is related to the Gandak Irrigation Project. It is located in West Champaran district."}],"xref":null},{"n":36,"g":null,"stem":[{"type":"p","text":"Finally, what is the irrigation capacity of Bihar?"}],"opts":[{"k":"a","t":"89.20 lakh hectares"},{"k":"b","t":"90.30 lakh hectares"},{"k":"c","t":"91.30 lakh hectares"},{"k":"d","t":"92.11 lakh hectares"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (a) was correct. According to the Bihar Economic Survey, 2024–25, in the year 2023–24, the utilized irrigation potential of major and medium irrigation projects in Bihar was 26.7 lakh hectares, while the created irrigation potential was 37.72 lakh hectares. In the case of minor irrigation, the utilized potential was 43.31 lakh hectares, whereas the created potential was 48.12 lakh hectares."}],"xref":null},{"n":37,"g":null,"stem":[{"type":"p","text":"The traditional water conservation irrigation method prevalent in South Bihar is called -"}],"opts":[{"k":"a","t":"Ahar-Pyne"},{"k":"b","t":"Canal-Pyne"},{"k":"c","t":"Irrigation-Pyne"},{"k":"d","t":"Khadin-Pyne"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. Re-Exam. (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The traditional water conservation irrigation system prevalent in South Bihar is called Ahar–Pyne. In this system, retention ponds and channels or canals are used for the management of water resources."}],"xref":null},{"n":38,"g":null,"stem":[{"type":"p","text":"After independence the irrigated area in Bihar enlarged approximately-"}],"opts":[{"k":"a","t":"Two times"},{"k":"b","t":"Four times"},{"k":"c","t":"Five times"},{"k":"d","t":"Ten times"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After independence, the irrigated area in Bihar has increased by approximately ten times. At present (2023–24), the created irrigation potential in Bihar is 85.84 lakh hectares."}],"xref":null},{"n":39,"g":null,"stem":[{"type":"p","text":"What type of banks are proposed to be set up in Bihar for agriculture and rural development?"}],"opts":[{"k":"a","t":"Krishi Vigyan Bank"},{"k":"b","t":"Krishi Yantra Bank"},{"k":"c","t":"Krishi Vikas Bank"},{"k":"d","t":"Krishi Utthan Bank"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In October, 2021, during the 'Rabi Mahabhiyan' launched by the Chief Minister of Bihar, Nitish Kumar, it was announced to establish Krishi Yantra Bank for providing farmers with necessary agricultural implements for modern farming. Under this scheme, more than 100 agricultural machinery banks have been established in various districts of the state."}],"xref":null}]},{"title":"Mineral Resource","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"With reference to the mineral production in Bihar, consider the following statements:"},{"type":"list","items":["1. Rohtas has the highest deposit of pyrites.","2. Limestone is found in Kaimur (Bhabhua), Munger and Rohtas districts.","3. Gold deposits are found in Jamui district."]},{"type":"p","text":"Which of the statements given above is/are correct?"}],"opts":[{"k":"a","t":"1 and 3 only"},{"k":"b","t":"3 only"},{"k":"c","t":"1 and 2 only"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"d","src":["68th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"All the statements given in the question are correct. Rohtas has the largest reserves of pyrite. Limestone is found in Kaimur (Bhabua), Munger and Rohtas districts. Gold reserves are found in Jamui district. Therefore, the correct answer is option (d)."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"Coal Reserves in Bihar on January 1, 2003 is (in million tonnes) –"}],"opts":[{"k":"a","t":"260"},{"k":"b","t":"360"},{"k":"c","t":"160"},{"k":"d","t":"210"}],"ans":"c","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 1 January, 2003, the estimated coal reserve in Bihar was 16 crore tonnes (160 million tonnes). According to the Indian Minerals Yearbook, 2023, the coal reserves in Bihar as of 1 April 2022 were 4437 million tonnes."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"The estimated coal reserves in Bihar are –"}],"opts":[{"k":"a","t":"1260 crore tonnes"},{"k":"b","t":"303 crore tonnes"},{"k":"c","t":"25310 crore tonnes"},{"k":"d","t":"16 crore tonnes"}],"ans":"d","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the formation of Jharkhand as a separate state from Bihar, Bihar’s natural resources declined significantly. According to the Indian Minerals Yearbook, 2023, Bihar has coal reserves of 4437 million tonnes (as of 1 April, 2022). At the time of the question, the estimated coal reserves in Bihar were 16 crore tonnes."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Which of the following is/are largely mined in Bihar? I. Coal II. Iron III. Manganese IV. Petroleum Choose the correct answer from the following :"}],"opts":[{"k":"a","t":"I only"},{"k":"b","t":"I and II only"},{"k":"c","t":"I and III only"},{"k":"d","t":"I, II and IV only"}],"ans":"c","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the relevant period, coal, iron ore and manganese— all three—were found. Petroleum was not found here. Therefore, in the context of undivided Bihar during that period, the correct answer was option (c). According to the Indian Minerals Yearbook, 2023, minerals produced in Bihar include—coal, mica, quartz/silica sand, quartzite, talc/ soapstone/steatite, bauxite, china clay, feldspar, fire clay, gold, granite, iron ore (hematite + magnetite), lead-zinc, pyrite and limestone."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Among the following pairs of mineral and district, which one is correctly matched?"}],"opts":[{"k":"a","t":"Limestone–Kaimur"},{"k":"b","t":"Mica–Bhagalpur"},{"k":"c","t":"Quartzite–Madhubani"},{"k":"d","t":"Lead-zinc–Gaya"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Indian Minerals Yearbook, 2024, limestone is found in Kaimur (Bhabua), Munger and Rohtas districts; mica in Nawada district; quartzite in Lakhisarai, Munger and Nalanda districts; and lead-zinc in Banka and Rohtas districts."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Iron ore is found in Jharkhand in the district –"}],"opts":[{"k":"a","t":"Lohardagga"},{"k":"b","t":"Dumka"},{"k":"c","t":"Dhanbad"},{"k":"d","t":"Singhbhum"}],"ans":"d","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the relevant period, in the context of undivided Bihar, the correct answer was option (d). In 1990, Singhbhum district was divided into East Singhbhum and West Singhbhum. According to the Indian Minerals Yearbook, 2024, Bihar has iron ore reserves of 49439 thousand tonnes (hematite + magnetite)."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"In India, Bihar is the largest producer of –"}],"opts":[{"k":"a","t":"lead"},{"k":"b","t":"manganese"},{"k":"c","t":"mica"},{"k":"d","t":"limestone"}],"ans":"c","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the relevant period, in undivided Bihar (including Jharkhand), mica had the highest production. According to the Indian Minerals Yearbook, 2023, Bihar is a leading state in pyrite reserves. Andhra Pradesh holds the leading position in mica production."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Which district of Bihar has mica deposits?"}],"opts":[{"k":"a","t":"Rohtas"},{"k":"b","t":"Patna"},{"k":"c","t":"Gaya"},{"k":"d","t":"Saran"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Mica reserves are found in Nawada district of Bihar."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Bihar produces .....% of pyrite of the whole India."}],"opts":[{"k":"a","t":"75"},{"k":"b","t":"85"},{"k":"c","t":"90"},{"k":"d","t":"100"}],"ans":"*","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the India Minerals Yearbook, 2023 In Bihar, 94 percent of India’s total pyrite reserves/resources are found. However, the word “produces” used in the question is technically incorrect. Therefore, the Bihar Public Service Commission deleted this question."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"In the production of the following in India, Bihar has a monopoly in –"}],"opts":[{"k":"a","t":"Limestone"},{"k":"b","t":"Coal"},{"k":"c","t":"Pyrite"},{"k":"d","t":"Graphite"}],"ans":"c","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, Bihar had a monopoly in the production of pyrite in India. In Bihar, 94 percent of the country’s pyrite reserves are found."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"Gold is found in which district of Bihar?"}],"opts":[{"k":"a","t":"Jamui District"},{"k":"b","t":"Gaya District"},{"k":"c","t":"Nalanda District"},{"k":"d","t":"Bhagalpur District"}],"ans":"a","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The entire recorded gold ore resource of Bihar is associated with Jamui district. Indian Minerals Year Book 2024, As of 1 April 2020, the total gold ore (primary) reserves/resources in Bihar are recorded as 222,884,860 tonnes."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Gold is found in which of the following districts of Bihar?"}],"opts":[{"k":"a","t":"Munger"},{"k":"b","t":"Saran"},{"k":"c","t":"Siwan"},{"k":"d","t":"Jamui"}],"ans":"d","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The entire recorded gold ore resource of Bihar is associated with Jamui district. Indian Minerals Year Book 2024, As of 1 April 2020, the total gold ore (primary) reserves/resources in Bihar are recorded as 222,884,860 tonnes."}],"xref":11},{"n":13,"g":null,"stem":[{"type":"p","text":"Which district of Bihar has the largest gold reserve?"}],"opts":[{"k":"a","t":"Munger"},{"k":"b","t":"Jamui"},{"k":"c","t":"Banka"},{"k":"d","t":"Katihar"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The entire recorded gold ore resource of Bihar is associated with Jamui district. Indian Minerals Year Book 2024, As of 1 April 2020, the total gold ore (primary) reserves/resources in Bihar are recorded as 222,884,860 tonnes."}],"xref":12},{"n":14,"g":null,"stem":[{"type":"p","text":"Best mica ore of the world is obtained from –"},{"type":"list","items":["1. Dhanbad 2. Hazaribagh","3. Jharia 4. Kulti"]},{"type":"p","text":"Select the correct answer from the following codes –"}],"opts":[{"k":"a","t":"1 and 2"},{"k":"b","t":"only 2"},{"k":"c","t":"2 and 3"},{"k":"d","t":"2 and 4"}],"ans":"b","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, mica was obtained from Hazaribagh, Giridih, and Koderma. In Bihar, mica reserves are found in Nawada district."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Palamau (Ranchi) is famous for which mineral?"}],"opts":[{"k":"a","t":"Iron ore"},{"k":"b","t":"Copper ore"},{"k":"c","t":"Manganese ore"},{"k":"d","t":"Bauxite ore"}],"ans":"*","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Indian Minerals Year Book 2024, Palamu district of Jharkhand, reserves of many minerals are found, the major ones being—"},{"type":"list","items":["(1) Bauxite (2) Dolomite","(3) Fireclay (4) Graphite","(5) Magnetite iron ore (6) Quartz / Silica sand","(7) Talc / Steatite / Soapstone (8) Rock phosphate","(9) Limestone (10) Feldspar","(11) Coal (12) Granite","(13) Gold"]}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"What percentage of the total mineral production in the country is found in Bihar?"}],"opts":[{"k":"a","t":"approx 36%"},{"k":"b","t":"approx 60%"},{"k":"c","t":"approx 16%"},{"k":"d","t":"none of the above"}],"ans":"d","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In undivided Bihar, Bihar was rich in minerals. After bifurcation, most mineral-rich areas went to Jharkhand. Therefore, Bihar is no longer rich in minerals. At the time of the question, option (a) was the correct answer."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"In the production of crude copper in the country, Bihar ranks-"}],"opts":[{"k":"a","t":"third"},{"k":"b","t":"fourth"},{"k":"c","t":"second"},{"k":"d","t":"first"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In copper production, the position of the then Bihar was third. Hence, under the then prevailing conditions, the desired answer was option (a). At present, copper is not produced in Bihar. Indian Minerals Year Book 2024, In 2023–24 stood at the top in the production of copper concentrate."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"Which is the most important district of Jharkhand in iron ore production?"}],"opts":[{"k":"a","t":"Daltonganj"},{"k":"b","t":"Hazaribagh"},{"k":"c","t":"Dhanbad"},{"k":"d","t":"Singhbhum"}],"ans":"d","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Singhbhum region of Jharkhand (East and West Singhbhum districts) holds the most important place in iron-ore production. The iron ore obtained from here is used in the Jamshedpur and Bokaro steel industries. 2023-24 (P), According to the Indian Minerals Yearbook, 2024 Odisha is India’s top iron-ore producing state."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"Iron is obtained from which of the following minerals?"}],"opts":[{"k":"a","t":"Limestone"},{"k":"b","t":"Pitchblende"},{"k":"c","t":"Monazite sand"},{"k":"d","t":"Hematite"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Iron is mainly found in four types of ores—(i) Magnetite, (ii) Hematite, (iii) Limonite, and (iv) Siderite. Besides these, iron content is also found in taconite, chamosite, and pyrite. However, since the metal content in these is low, their economic importance is limited."}],"xref":null}]},{"title":"Population & Urbanisation","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Consider the following statements:"},{"type":"list","items":["(1) The proportion of the young population (0-19 years) in Bihar is projected to decline significantly by 2041.","(2) Bihar's demographic dividend is expected to peak around 2041.","(3) The elderly population (60 + years) in Bihar is ex pected to rise more sharply than in India."]},{"type":"p","text":"Select the correct answer using the codes given below:"}],"opts":[{"k":"a","t":"l and 2 are correct"},{"k":"b","t":"1and 3 are correct"},{"k":"c","t":"2and 3 are correct"},{"k":"d","t":"More than one of the above"}],"ans":"a","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to Bihar Economic Survey, 2024-25, Bihar’s population share in the 0–19 age group was about 49.4% in 2011, which is estimated to decline to about 30.1% by 2041. Therefore, a significant decline in the proportion of youth population up to 2041 is recorded. The population share of the working-age group (20–59 years) is estimated to increase from about 43.2% in 2011 to about 58.3% in 2041. The proportion of the elderly population is not expected to rise faster in Bihar (11.6%) than in India (15.9%); rather, it is expected to increase at a relatively slower pace."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"The state which is third in India by population and twelfth by area is—"}],"opts":[{"k":"a","t":"Maharashtra"},{"k":"b","t":"Madhya Pradesh"},{"k":"c","t":"Karnataka"},{"k":"d","t":"Bihar"}],"ans":"d","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar was the third-largest state in India by population and the 12th largest by area. After the formation of Telangana, Bihar’s rank by area became 13th. It is noteworthy that after Jammu and Kashmir was declared a Union Territory, Bihar’s rank by area again became 12th. Note that in the context of all States / Union Territories, Bihar stands 13th by area."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"The population of Bihar in India is"}],"opts":[{"k":"a","t":"Maximum"},{"k":"b","t":"Second to the maximum"},{"k":"c","t":"Third to the maximum"},{"k":"d","t":"Fourth to the maximum"}],"ans":"b","src":["38th B.P.S.C. (Pre) 1992"],"yr":1992,"fam":["38th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the 1991 Census, the population of undivided Bihar (including Jharkhand) was 8.637 crore, which was the highest after Uttar Pradesh’s population (13.91 crore). Thus, in 1991 Bihar was the second most populous state in India. According to the 2001 Census, Bihar was the third most populous state in India. In the 2011 Census as well, Bihar holds the third position."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"According to the 1991 Census, which state is considered the second largest state in India based on population?"}],"opts":[{"k":"a","t":"West Bengal"},{"k":"b","t":"Maharashtra"},{"k":"c","t":"Bihar"},{"k":"d","t":"Uttar Pradesh"}],"ans":"c","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the 1991 Census, the population of undivided Bihar (including Jharkhand) was 8.637 crore, which was the highest after Uttar Pradesh’s population (13.91 crore). Thus, in 1991 Bihar was the second most populous state in India. According to the 2001 Census, Bihar was the third most populous state in India. In the 2011 Census as well, Bihar holds the third position."}],"xref":3},{"n":5,"g":null,"stem":[{"type":"p","text":"According to the Census 2011, in terms of population, Bihar State stands at which position in the country?"}],"opts":[{"k":"a","t":"First"},{"k":"b","t":"Seco r of population density as per the 2001 census?"}],"opts":[{"k":"a","t":"Darbhanga, Samastipur, Siwan, Saran"},{"k":"b","t":"Siwan, Saran, Darbhanga, Samastipur"},{"k":"c","t":"Saran, Darbhanga, Samstipur, Siwan"},{"k":"d","t":"Darbhanga, Saran, Samastipur, Siwan"}],"ans":"*","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Census of 2001 and 2011, the population density of the above districts is as follows—"},{"type":"table","rows":[["District","2001","2011"],["Darbhanga","1446","1728"],["Saran","1230","1496"],["Siwan","1223","1501"],["Samastipur","1169","1467"]]},{"type":"p","text":"Therefore, none of the given options is correct."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"The largest populated city is –"}],"opts":[{"k":"a","t":"Dhanbad"},{"k":"b","t":"Gaya"},{"k":"c","t":"Jamshedpur"},{"k":"d","t":"Ranchi"}],"ans":"c","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, among the cities given in the options, the largest city was Jamshedpur. According to the final data of the Census 2011, the largest district of Bihar is Patna (5,838,465)."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Which of the following districts recorded the highest growth of population during 2001-11?"}],"opts":[{"k":"a","t":"Kishanganj"},{"k":"b","t":"Araria"},{"k":"c","t":"Madhepura"},{"k":"d","t":"Khagaria"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During 2001–11, the five districts of Bihar with the highest population growth rates, respectively, were Madhepura (31.12%), Kishanganj (30.40%), Araria (30.25%), Khagaria (30.19%), and East Champaran (29.43%). Hence, Madhepura recorded the highest population growth during 2001–2011."}],"xref":null},{"n":16,"g":null,"s :"Which one of the following pairs of tribe and district is not correct?"}],"opts":[{"k":"a","t":"Santhal-Banka"},{"k":"b","t":"Munda-Jamui"},{"k":"c","t":"Oraon-Supaul"},{"k":"d","t":"Kharwar-Bhagalpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Santhal tribe is mainly found in Banka, the Uraon / Oraon tribe in Supaul, and the Kharwar tribe mainly in Bhagalpur, whereas the Munda tribe does not have its major concentration in Jamui. In Jamui district, mainly the Santhal, Kharwar, Kora, Mudi Kora, Mahli, and Kol tribes are found. The highest concentration of the Munda tribe in Bihar is in Katihar, West Champaran, Kishanganj, Purnia, and Araria districts. In its final answer key, the Bihar Public Service Commission considered option (b) as the correct answer. Note— As per Census 2011 data, the total population of the Munda (including Patar) tribe in Jamui district of Bihar is only 61."}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"Numerically, the largest Scheduled Tribe of Bihar is -"}],"opts":[{"k":"a","t":"Munda"},{"k":"b","t":"Santhal"},{"k":"c","t":"Gond"},{"k":"d","t":"Kora"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"According to the 2011 Census, the top five tribes of Bihar by population are, in order: Santhal, Gond, Tharu, Oraon, and Kharwar. Therefore, numerically, the largest Scheduled Tribe in Bihar is Santhal. As per the 2011 Census, the literacy rate among tribes in Bihar is 51.1%."}],"xref":null},{"n":36,"g":null,"stem":[{"type":"p","text":"Least populated district in Bihar is–"}],"opts":[{"k":"a","t":"Godda"},{"k":"b","t":"Gumla"},{"k":"c","t":"Araria"},{"k":"d","t":"Lohardaga"}],"ans":"d","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl akh: Sheohar (656,246), Sheikhpura (636,342) and Arwal (700,843). As per Census 2011, 35 districts of Bihar had a population of more than 10 lakh, in which Patna (5,838,465) was the highest and Lakhisarai (1,000,912) was the lowest."}],"xref":null},{"n":40,"g":null,"stem":[{"type":"p","text":"As per the Census, 2011, the child sex ratio in Bihar was:"}],"opts":[{"k":"a","t":"935"},{"k":"b","t":"934"},{"k":"c","t":"933"},{"k":"d","t":"932"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to Census 2011, the child sex ratio (population in the age group 0–6 years) in Bihar was 935."}],"xref":null},{"n":41,"g":null,"stem":[{"type":"p","text":"According to Census 2001, .............. percent of India’s population lives in the state of Bihar."}],"opts":[{"k":"a","t":"8"},{"k":"b","t":"10"},{"k":"c","t":"11"},{"k":"d","t":"12"}],"ans":"a","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In terms of population, Bihar is the third most populous state in India. As per Census, 2001, the total population of Bihar was 82,998,509. Therefore, about 8.07% of India’s total population lived in Bihar. As per Census 2011, about 8.60% (104,099,452) of India’s population lives in Bihar."}],"xref":null},{"n":42,"g":null,"stem":[{"type":"p","text":"According to Census 2001, what is the total population of Bihar?"}],"opts":[{"k":"a","t":"82,998,509"},{"k":"b","t":"76,210,007"},{"k":"c","t":"96,878,627"},{"k":"d","t":"80,176,197"}],"ans":"a","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In terms of population, Bihar is the third most populous state in India. As per Census, 2001, the total population of Bihar was 82,998,509. Therefore, about 8.07% of India’s total population lived in Bihar. As per Census 2011, about 8.60% (104,099,452) of India’s population lives in Bihar."}],"xref":41},{"n":43,"g":null,"stem":[{"type":"p","text":"The growth rate of the population of Bihar during 1981- 91 decade is –"}],"opts":[{"k":"a","t":"19.76%"},{"k":"b","t":"21.33%"},{"k":"c","t":"23.54%"},{"k":"d","t":"24.06%"}],"ans":"*","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the 1991 Census, Bihar recorded a decadal population increase of about 23.38% during 1981–1991. On the other hand, in the decade 2001–2011, the population growth rate was 25.42%, which was lower than 28.62% in the 1991–2001 decade."}],"xref":null},{"n":44,"g":null,"stem":[{"type":"p","text":"What is the proportion of the urban population in Bihar according to the 1991 Census?"}],"opts":[{"k":"a","t":"13.14%"},{"k":"b","t":"14.13%"},{"k":"c","t":"10.03%"},{"k":"d","t":"23.17%"}],"ans":"a","src":["44th B.P.S.C. (Pre) 2000","41st B.P.S.C. (Pre) 1996"],"yr":2000,"fam":["41st B.P.S.C. (Pre)","44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1991, the total population of undivided Bihar (including Jharkhand) was 8.637 crore, out of which the rural population was 7.502 crore and the urban population was 1.135 crore. Clearly, the percentage of urban population in 1991 was 13.14%"}],"xref":null},{"n":45,"g":null,"stem":[{"type":"p","text":"On the basis of the density of population, Bihar ranks –"}],"opts":[{"k":"a","t":"First in India"},{"k":"b","t":"Second in India"},{"k":"c","t":"Third in India"},{"k":"d","t":"Fourth in India"}],"ans":"c","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Census 2011, Bihar’s population density is 1106 persons per sq km. From the viewpoint of states, it stands first, while in the combined list of states and Union Territories it stands sixth. In this context, Delhi ranks first (11,320 persons per sq km). India’s population density is 382 persons per sq km. In 2001, Bihar’s population density was 881 persons per sq km, whereas as per the 1991 Census, Bihar (497 persons per sq. km.) was in the third position."}],"xref":null},{"n":46,"g":null,"stem":[{"type":"p","text":"The order of Bihar according to population density in India is –"}],"opts":[{"k":"a","t":"Second"},{"k":"b","t":"Third"},{"k":"c","t":"Eighth"},{"k":"d","t":"Ninth"}],"ans":"b","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Census 2011, Bihar’s population density is 1106 persons per sq km. From the viewpoint of states, it stands first, while in the combined list of states and Union Territories it stands sixth. In this context, Delhi ranks first (11,320 persons per sq km). India’s population density is 382 persons per sq km. In 2001, Bihar’s population density was 881 persons per sq km, whereas as per the 1991 Census, Bihar (497 persons per sq. km.) was in the third position."}],"xref":45},{"n":47,"g":null,"stem":[{"type":"p","text":"Which district of Bihar has recorded the highest density of population (per sq. km) as per the 2011 Census?"}],"opts":[{"k":"a","t":"Sheohar"},{"k":"b","t":"Vaishali"},{"k":"c","t":"Patna"},{"k":"d","t":"Darbhanga"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"As per the 2011 Census, the population density of the given districts is as follows— District Population density (Per sq. km.)"},{"type":"table","rows":[["Sheohar","1880"],["Vaishali","1717"],["Patna","1823"],["Darbhanga","1728"]]},{"type":"p","text":"From the above figures, it is clear that among the given districts—and overall in Bihar—the district with the highest population density is Sheohar. After that come Patna (1823) and Darbhanga (1728)."}],"xref":null},{"n":48,"g":null,"stem":[{"type":"p","text":"According to the Economic Survey of Bihar 2021-22, what is the level of urbanization in the State at present?"}],"opts":[{"k":"a","t":"11.6%"},{"k":"b","t":"22.4%"},{"k":"c","t":"15.3%"},{"k":"d","t":"18.6%"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2021–2022, the present level of urbanization in the state is 15.3%, whereas as per Census, 2011, the level of urbanization in the state is 11.3%. According to the Bihar Economic Review, 2022–2023, the level of urbanization in Bihar rose to 16.2% in 2022."}],"xref":null},{"n":49,"g":null,"stem":[{"type":"p","text":"Choose the correct order of the following districts of Bihar as per the ascending level of urbanization."}],"opts":[{"k":"a","t":"Nalanda < Munger < Patna"},{"k":"b","t":"Nalanda < Patna < Munger"},{"k":"c","t":"Patna < Munger < Nalanda"},{"k":"d","t":"Munger < Nalanda < Patna"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2023–2024, in 2022, the order of the given districts in terms of increasing urbanization level is as follows: Nalanda (26.2%) < Munger (28.3%) < Patna (44.3%)."}],"xref":null}]},{"title":"Wildlife and Bird Sanctuaries","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Which of the following National Parks / Wildlife Sanctuaries are in Bihar?"},{"type":"list","items":["1. Valmiki National Park","2. Dudhwa National Park","3. Gajner Wildlife Sanctuary","4. Bhimbandh Wildlife Sanctuary"]},{"type":"p","text":"Choose the correct answer using the code given below."}],"opts":[{"k":"a","t":"2 and 4"},{"k":"b","t":"1 and 4"},{"k":"c","t":"2 and 3"},{"k":"d","t":"1 and 3"}],"ans":"b","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the given options, Valmiki National Park and Bhimbandh Wildlife Sanctuary are in Bihar, whereas Gajner Wildlife Sanctuary is in Rajasthan and Dudhwa National Park is located in Uttar Pradesh. Valmiki National Park is located in West Champaran district. Bhimbandh Wildlife Sanctuary is spread over 681.90 sq. km in Munger, Lakhisarai and Jamui districts."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"Which one of the following wildlife sanctuaries is situated in Munger district of Bihar?"}],"opts":[{"k":"a","t":"Valmiki"},{"k":"b","t":"Rajgir (wildlife Sanctuary)"},{"k":"c","t":"Bhimbandh"},{"k":"d","t":"Gautam Buddha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the given options, Valmiki National Park and Bhimbandh Wildlife Sanctuary are in Bihar, whereas Gajner Wildlife Sanctuary is in Rajasthan and Dudhwa National Park is located in Uttar Pradesh. Valmiki National Park is located in West Champaran district. Bhimbandh Wildlife Sanctuary is spread over 681.90 sq. km in Munger, Lakhisarai and Jamui districts."}],"xref":1},{"n":3,"g":null,"stem":[{"type":"p","text":"Which of the following parks/sanctuaries come under the Project tiger in Bihar?"}],"opts":[{"k":"a","t":"Valmiki National Park"},{"k":"b","t":"Udaypur Wildlife Sanctuary"},{"k":"c","t":"Bhimbandh Wildlife Sanctuary"},{"k":"d","t":"None of these"}],"ans":"a","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the Government of India’s centrally sponsored scheme for tiger conservation, “Project Tiger,” the protected areas that are notified are considered Tiger Reserves. At present, Bihar has only one Tiger Reserve—Valmiki Tiger Reserve. It is located in West Champaran district of Bihar. As the state’s second Tiger Reserve, Kaimur Wildlife Sanctuary has received in-principle approval."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"In which district is the “Valmiki Tiger Reserve” located?"}],"opts":[{"k":"a","t":"Buxar"},{"k":"b","t":"West Champaran"},{"k":"c","t":"Kaimur"},{"k":"d","t":"Gopalganj"}],"ans":"b","src":["B.P.S.C. B.A.O. 2024"],"yr":2024,"fam":["B.P.S.C. B.A.O."],"expl":[{"type":"p","text":"Under the Government of India’s centrally sponsored scheme for tiger conservation, “Project Tiger,” the protected areas that are notified are considered Tiger Reserves. At present, Bihar has only one Tiger Reserve—Valmiki Tiger Reserve. It is located in West Champaran district of Bihar. As the state’s second Tiger Reserve, Kaimur Wildlife Sanctuary has received in-principle approval."}],"xref":3},{"n":5,"g":null,"stem":[{"type":"p","text":"Which city in Bihar is famous for wildlife sanctuary and national parks?"}],"opts":[{"k":"a","t":"Hazaribagh"},{"k":"b","t":"Nalanda"},{"k":"c","t":"Gaya"},{"k":"d","t":"Jamshedpur"}],"ans":"*","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, no National Park was located in any of the then Bihar districts/cities given in the options. Among the options, Hazaribagh and Gaya have Hazaribagh Wildlife Sanctuary and Gautam Buddha Wildlife Sanctuary respectively. It is noteworthy that at present Gautam Buddha Wildlife Sanctuary extends into Gaya district of Bihar and also into Koderma and Chatra districts of Jharkhand. In Bihar, the only National Park has been established in West Champaran district under the name “Valmiki National Park.”"}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Which one of the following districts has the only National Park of Bihar?"}],"opts":[{"k":"a","t":"Nalanda"},{"k":"b","t":"Bhagalpur"},{"k":"c","t":"West Champaran"},{"k":"d","t":"East Champaran"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, no National Park was located in any of the then Bihar districts/cities given in the options. Among the options, Hazaribagh and Gaya have Hazaribagh Wildlife Sanctuary and Gautam Buddha Wildlife Sanctuary respectively. It is noteworthy that at present Gautam Buddha Wildlife Sanctuary extends into Gaya district of Bihar and also into Koderma and Chatra districts of Jharkhand. In Bihar, the only National Park has been established in West Champaran district under the name “Valmiki National Park.”"}],"xref":5},{"n":7,"g":null,"stem":[{"type":"p","text":"Which of the following places is famous for its wildlife in Bihar?"}],"opts":[{"k":"a","t":"Bhagalpur"},{"k":"b","t":"Bodh Gaya"},{"k":"c","t":"Patna"},{"k":"d","t":"Hazaribagh"}],"ans":"b","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, Jharkhand was not a part of Bihar. Therefore, as per the options, Bodh Gaya is the correct answer because Gautam Buddha Wildlife Sanctuary extends into Gaya (Bihar) and also into Koderma and Chatra (Jharkhand), whereas Hazaribagh Wildlife Sanctuary extends in Hazaribagh district of Jharkhand. Since Bodh Gaya is a part of Gaya district (Bihar), the correct option is (b)."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"At which place in Bihar, North India's first bird ringing station has been recently opened?"}],"opts":[{"k":"a","t":"Bhagalpur"},{"k":"b","t":"Saran"},{"k":"c","t":"East Champaran"},{"k":"d","t":"West Champaran"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bhagalpur (Bihar), India’s fourth “Bird Ringing and Monitoring Station” has been opened. The other three “Bird Ringing and Monitoring Stations” are located at Point Calimere (Tamil Nadu), Jaipur (Rajasthan) and Bhubaneswar (Odisha). It has been established through the joint efforts of the Bombay Natural History Society and the Environment, Forest and Climate Change Department, Government of Bihar. Note—In the given question, mentioning “North India” is incorrect."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"In which district of Bihar is the Vikramshila Gangetic Dolphin Sanctuary located?"}],"opts":[{"k":"a","t":"Bhagalpur"},{"k":"b","t":"Patna"},{"k":"c","t":"Buxar"},{"k":"d","t":"Nalanda"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Re-Exam) (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Vikramshila Gangetic Dolphin Sanctuary is located in Bhagalpur district of the state of Bihar."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"Which of the following in Bihar started the Vulture Conservation Plan?"}],"opts":[{"k":"a","t":"Kaimur Tiger Reserve"},{"k":"b","t":"Rajgir Wildlife Sanctuary"},{"k":"c","t":"Valmiki Tiger Reserve"},{"k":"d","t":"Kanwar Lake Bird Sanctuary"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Valmiki Tiger Reserve (VTR) of Bihar has started the Vulture Conservation Scheme."}],"xref":null}]},{"title":"Rivers, Lakes & Waterfalls","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Karmanasa river originates in"}],"opts":[{"k":"a","t":"Vaishali District"},{"k":"b","t":"Kaimur District"},{"k":"c","t":"Patna District"},{"k":"d","t":"Bikram District"}],"ans":"b","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Karmanasha River is a tributary of the Ganga River, and it originates from the Kaimur Hills in Kaimur district of Bihar. This river forms the boundary between Uttar Pradesh and Bihar and ultimately meets the Ganga River near Chausa in Buxar district."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"The district of Bihar which has a longer length of the Ganga River is"}],"opts":[{"k":"a","t":"Bhagalpur"},{"k":"b","t":"Katihar"},{"k":"c","t":"Patna"},{"k":"d","t":"Begusarai"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Ganga River flows through 12 districts of Bihar (Saran, Buxar, Bhojpur, Patna, Vaishali, Samastipur, Begusarai, Lakhisarai, Munger, Khagaria, Bhagalpur and Katihar). Among these, the length of the Ganga is maximum in Patna district (99 km). Bhagalpur is in the second place, where the length of the Ganga River is 97 km."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"The number of districts situated on the bank of the Ganga river in Bihar State is :"}],"opts":[{"k":"a","t":"21"},{"k":"b","t":"17"},{"k":"c","t":"12"},{"k":"d","t":"6"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Ganga River flows through 12 districts of Bihar (Saran, Buxar, Bhojpur, Patna, Vaishali, Samastipur, Begusarai, Lakhisarai, Munger, Khagaria, Bhagalpur and Katihar). Among these, the length of the Ganga is maximum in Patna district (99 km). Bhagalpur is in the second place, where the length of the Ganga River is 97 km."}],"xref":2},{"n":4,"g":null,"stem":[{"type":"p","text":"Which of the following lakes is located in Bihar?"}],"opts":[{"k":"a","t":"Anupam Lake"},{"k":"b","t":"Sambhar Lake"},{"k":"c","t":"Sukhna Lake"},{"k":"d","t":"Rama Lake"}],"ans":"a","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Anupam Lake is located in Kaimur (Bihar). This lake lies within the boundary of the Kaimur Wildlife Sanctuary. The Kaimur Wildlife Sanctuary is located in the Kaimur and Rohtas districts of Bihar. The Kaimur Wildlife Sanctuary is the largest wildlife sanctuary in Bihar. Sambhar Lake is located in Rajasthan, and Sukhna Lake is located in Chandigarh."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Where is the first Ramsar site of Bihar located?"}],"opts":[{"k":"a","t":"Begusarai"},{"k":"b","t":"Banka"},{"k":"c","t":"Bhagalpur"},{"k":"d","t":"Bhojpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Kanwar Lake (Kabar Tal Wetland), Asia’s largest freshwater oxbow lake and bird sanctuary, located in Begusarai district of Bihar, was included in the list of Ramsar sites in July, 2020. It is Bihar’s first Ramsar site and the 39th Ramsar site of India."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Which is the first Ramsar site in Bihar?"}],"opts":[{"k":"a","t":"Kaimur Range"},{"k":"b","t":"Kharagpur Lake"},{"k":"c","t":"Kanwar Lake"},{"k":"d","t":"Rajgir Hill"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Kanwar Lake (Kabar Tal Wetland), Asia’s largest freshwater oxbow lake and bird sanctuary, located in Begusarai district of Bihar, was included in the list of Ramsar sites in July, 2020. It is Bihar’s first Ramsar site and the 39th Ramsar site of India."}],"xref":5},{"n":7,"g":null,"stem":[{"type":"p","text":"Which is the Asia's largest and freshwater oxbow lake in Bihar?"}],"opts":[{"k":"a","t":"Ghogha Lake"},{"k":"b","t":"Kanwar Lake"},{"k":"c","t":"Anupam Lake"},{"k":"d","t":"Kusheshwar Lake"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Kanwar Lake (Kabar Tal Wetland), Asia’s largest freshwater oxbow lake and bird sanctuary, located in Begusarai district of Bihar, was included in the list of Ramsar sites in July, 2020. It is Bihar’s first Ramsar site and the 39th Ramsar site of India."}],"xref":6},{"n":8,"g":null,"stem":[{"type":"p","text":"The Saran irrigation canal originates from—"}],"opts":[{"k":"a","t":"Son"},{"k":"b","t":"Ganga"},{"k":"c","t":"Kosi"},{"k":"d","t":"Gandak"}],"ans":"d","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the Gandak Project, a 739.33 m long barrage has been constructed on the Gandak River near Triveni Ghat, from which some canals have been drawn out; one of them is the Saran irrigation canal."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"From which of the following canal systems is irrigation done in Bihar?"}],"opts":[{"k":"a","t":"Upper Ganga Canal"},{"k":"b","t":"Triveni Canal"},{"k":"c","t":"Sharda Canal"},{"k":"d","t":"Eastern Yamuna Canal"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"As per the question, among the given options, irrigation in Bihar is done through the Triveni Canal. This canal is related to the Gandak Irrigation Project. It is located in West Champaran district."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"Triveni Canal has been constructed on the river"}],"opts":[{"k":"a","t":"Kosi"},{"k":"b","t":"Son"},{"k":"c","t":"Gandak"},{"k":"d","t":"Kamla"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Triveni Canal was taken out from the Gandak River."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"The Triveni Canal has been constructed on which of the following rivers?"}],"opts":[{"k":"a","t":"Mayurakshi"},{"k":"b","t":"Kosi"},{"k":"c","t":"Son"},{"k":"d","t":"Gandak"}],"ans":"d","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Triveni Canal was taken out from the Gandak River."}],"xref":10},{"n":12,"g":null,"stem":[{"type":"p","text":"Water comes into the Triveni Canal from which river?"}],"opts":[{"k":"a","t":"Son"},{"k":"b","t":"Kosi"},{"k":"c","t":"Gandak"},{"k":"d","t":"Mayurakshi"}],"ans":"c","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Triveni Canal was taken out from the Gandak River."}],"xref":11},{"n":13,"g":null,"stem":[{"type":"p","text":"Rivers belonging to which one of the following groups form the boundary between Bihar and Uttar Pradesh?"}],"opts":[{"k":"a","t":"Kamla, Son and Baghmati"},{"k":"b","t":"Budh Gandak, Kosi and Ganga"},{"k":"c","t":"Karmanasa, Gandak and Ghaghara"},{"k":"d","t":"North Koel, Ajay and Punpun"}],"ans":"c","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Karmanasa, Gandak and Ghaghara rivers determine the boundary line between Uttar Pradesh and Bihar. The Karmanasa merges into the Ganga near Chausa of Buxar, the Gandak near Pahleja Ghat (Saran district), and the Ghaghara near Revelganj (Saran district)."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"Which of the following rivers in Bihar merge into the Ganga –"},{"type":"list","items":["(1) Gandak (2) Son","(3) Ghaghara (4) Punpun"]}],"opts":[{"k":"a","t":"1, 2, 3, 4"},{"k":"b","t":"1, 2, 4"},{"k":"c","t":"1, 3, 4"},{"k":"d","t":"2, 4"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Gandak meets the Ganga near Pahleja Ghat (Saran district), the Ghaghara near Revelganj (Saran district), the Son near Maner, and the Punpun near a place called Fatuha."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Which of the following rivers joins the Ganges near Fatuha?"}],"opts":[{"k":"a","t":"Son"},{"k":"b","t":"Punpun"},{"k":"c","t":"Sakri"},{"k":"d","t":"Balan"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Gandak meets the Ganga near Pahleja Ghat (Saran district), the Ghaghara near Revelganj (Saran district), the Son near Maner, and the Punpun near a place called Fatuha."}],"xref":14},{"n":16,"g":null,"stem":[{"type":"p","text":"The other name of the Gandak River is—"}],"opts":[{"k":"a","t":"Punpun"},{"k":"b","t":"Budhi Gandak"},{"k":"c","t":"Mahananda"},{"k":"d","t":"Narayani"}],"ans":"d","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the given options, the other name of the Gandak River is “Narayani”. Another name of it is “Shaligrami” as well. It is noteworthy that the Gandak River originates from the Nepal Himalayas and meets the Ganga near Pahleja Ghat. The Gandak River has 7 main tributaries—Trishuli, Budhi Gandak, Seti, Daraudi, Madi, Kali Gandak, and Marsyangdi."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"A river formerly known as the 'Sorrow of Bengal' rises from Bihar is"}],"opts":[{"k":"a","t":"Barakar"},{"k":"b","t":"Damodar"},{"k":"c","t":"Mayurakshi"},{"k":"d","t":"Subarnarekha"}],"ans":"b","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Damodar River was earlier called the ‘Sorrow of Bengal’. The Damodar River originates from Palamu district of Jharkhand (which was Bihar at the time of the question). It flows through a fault valley."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"In Bihar, Damodar flows –"}],"opts":[{"k":"a","t":"In a Karst topography"},{"k":"b","t":"In a rift valley"},{"k":"c","t":"In a marshy region"},{"k":"d","t":"None of them"}],"ans":"b","src":["42nd B.P.S.C. (Pre) 1997"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Damodar River was earlier called the ‘Sorrow of Bengal’. The Damodar River originates from Palamu district of Jharkhand (which was Bihar at the time of the question). It flows through a fault valley."}],"xref":17},{"n":19,"g":null,"stem":[{"type":"p","text":"Which of the following drainage systems drains the lands of Bihar ?"}],"opts":[{"k":"a","t":"Ghagra"},{"k":"b","t":"Mahanadi"},{"k":"c","t":"Yamuna"},{"k":"d","t":"Narmada"}],"ans":"a","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Among the given rivers, the land of Bihar is drained by the Ghaghara River drainage system. The Ghaghara River joins the Ganga near Revelganj (Saran district) in Bihar. The Mahanadi flows in Chhattisgarh and Odisha, the Yamuna flows in Uttarakhand, Haryana, Delhi and Uttar Pradesh, and the Narmada flows through Madhya Pradesh, Maharashtra and Gujarat."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"The land of Bihar is drained by which of the following river systems?"}],"opts":[{"k":"a","t":"Mahanadi"},{"k":"b","t":"Ganga"},{"k":"c","t":"Yamuna"},{"k":"d","t":"Godavari"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The land of Bihar is drained by the Ganga River system. The Ganga River divides Bihar into two parts—North Bihar and South Bihar. Many major rivers of Bihar join the Ganga."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"In which district of Bihar is the confluence of the Son and Ganga rivers located?"}],"opts":[{"k":"a","t":"Buxar"},{"k":"b","t":"Patna"},{"k":"c","t":"Bhojpur"},{"k":"d","t":"Nalanda"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Son River, originating from the Amarkantak Hills/ Plateau, flows through Chhattisgarh, Madhya Pradesh, Uttar Pradesh, Jharkhand and Bihar, and finally merges with the Ganga near Maner, close to Patna."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"The origin of the Son River, which joins the Ganga River in Bihar, is -"}],"opts":[{"k":"a","t":"Hazaribagh Plateau"},{"k":"b","t":"Palamu Plateau"},{"k":"c","t":"Malwa Plateau"},{"k":"d","t":"Amarkantak Plateau"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The Son River, originating from the Amarkantak Hills/ Plateau, flows through Chhattisgarh, Madhya Pradesh, Uttar Pradesh, Jharkhand and Bihar, and finally merges with the Ganga near Maner, close to Patna."}],"xref":21},{"n":23,"g":null,"stem":[{"type":"p","text":"The average height of the Kosi Plain above mean sea level is—"}],"opts":[{"k":"a","t":"30 metres"},{"k":"b","t":"300 metres"},{"k":"c","t":"150 metres"},{"k":"d","t":"None of these"}],"ans":"a","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The average height of the Kosi Plain above mean sea level is approximately 30 to 50 metres. The Kosi Plain lies in the Middle Ganga Plain. This region frequently faces flood situations created by the Kosi and its tributaries. Therefore, the Kosi River is also called the ‘Sorrow of Bihar’."}],"xref":null},{"n":24,"g":null,"stem":[{"type":"p","text":"The average height of the Kosi Plain above sea level is—"}],"opts":[{"k":"a","t":"100 metres"},{"k":"b","t":"30 metres"},{"k":"c","t":"150 metres"},{"k":"d","t":"300 metres"}],"ans":"b","src":["70th B.P.S.C. Re-Exam (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The average height of the Kosi Plain above mean sea level is approximately 30 to 50 metres. The Kosi Plain lies in the Middle Ganga Plain. This region frequently faces flood situations created by the Kosi and its tributaries. Therefore, the Kosi River is also called the ‘Sorrow of Bihar’."}],"xref":23},{"n":25,"g":null,"stem":[{"type":"p","text":"Which river of Bihar is known for changing its course?"}],"opts":[{"k":"a","t":"Kosi"},{"k":"b","t":"Gandak"},{"k":"c","t":"Punpun"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["B.P.S.C. TRE-3 July 2024"],"yr":2024,"fam":["B.P.S.C. TRE"],"expl":[{"type":"p","text":"The Kosi River is known for its continuous change of course. The Kosi is formed by the confluence of three rivers—Sun Koshi, Arun Koshi and Tamur Koshi. All these rivers originate from the Himalayan region of Nepal and Tibet. The original name of the Kosi is Kaushiki. Due to its tendency to change course, it is called the ‘Sorrow of Bihar’. It joins the Ganga near Kursela (Katihar)."}],"xref":null},{"n":26,"g":null,"stem":[{"type":"p","text":"Among the following rivers, which has undergone the maximum shifting of course—"}],"opts":[{"k":"a","t":"Son River"},{"k":"b","t":"Gandak River"},{"k":"c","t":"Kosi River"},{"k":"d","t":"Ganga River"}],"ans":"c","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kosi River is known for its continuous change of course. The Kosi is formed by the confluence of three rivers—Sun Koshi, Arun Koshi and Tamur Koshi. All these rivers originate from the Himalayan region of Nepal and Tibet. The original name of the Kosi is Kaushiki. Due to its tendency to change course, it is called the ‘Sorrow of Bihar’. It joins the Ganga near Kursela (Katihar)."}],"xref":25},{"n":27,"g":null,"stem":[{"type":"p","text":"Which river is known as the “Sorrow of Bihar”?"}],"opts":[{"k":"a","t":"Son"},{"k":"b","t":"Gandak"},{"k":"c","t":"Kosi"},{"k":"d","t":"Ganga"}],"ans":"c","src":["70th B.P.S.C. Re-Exam (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kosi River is known for its continuous change of course. The Kosi is formed by the confluence of three rivers—Sun Koshi, Arun Koshi and Tamur Koshi. All these rivers originate from the Himalayan region of Nepal and Tibet. The original name of the Kosi is Kaushiki. Due to its tendency to change course, it is called the ‘Sorrow of Bihar’. It joins the Ganga near Kursela (Katihar)."}],"xref":26},{"n":28,"g":null,"stem":[{"type":"p","text":"Which river is called the “Sorrow of Bihar”?"}],"opts":[{"k":"a","t":"Ghaghara"},{"k":"b","t":"Ganga"},{"k":"c","t":"Kosi"},{"k":"d","t":"Son"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. Re-Exam (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kosi River is known for its continuous change of course. The Kosi is formed by the confluence of three rivers—Sun Koshi, Arun Koshi and Tamur Koshi. All these rivers originate from the Himalayan region of Nepal and Tibet. The original name of the Kosi is Kaushiki. Due to its tendency to change course, it is called the ‘Sorrow of Bihar’. It joins the Ganga near Kursela (Katihar)."}],"xref":27},{"n":29,"g":null,"stem":[{"type":"p","text":"At which of the following places does the Kosi River meet the Ganges River?"}],"opts":[{"k":"a","t":"Kursela"},{"k":"b","t":"Vaishali"},{"k":"c","t":"Hajipur"},{"k":"d","t":"Jamalpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Re-Exam) (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kosi River is known for its continuous change of course. The Kosi is formed by the confluence of three rivers—Sun Koshi, Arun Koshi and Tamur Koshi. All these rivers originate from the Himalayan region of Nepal and Tibet. The original name of the Kosi is Kaushiki. Due to its tendency to change course, it is called the ‘Sorrow of Bihar’. It joins the Ganga near Kursela (Katihar)."}],"xref":28},{"n":30,"g":null,"stem":[{"type":"p","text":"The naming of the \"Diara\" land of the Ganges River is related to which of the following?'"}],"opts":[{"k":"a","t":"Diya"},{"k":"b","t":"Dahar"},{"k":"c","t":"Devara"},{"k":"d","t":"Daira"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The naming of the ‘Diara’ land of the Ganga River is associated with ‘Dayara’."}],"xref":null},{"n":31,"g":null,"stem":[{"type":"p","text":"Which of the following rivers flowing in Bihar is a north flowing river?"}],"opts":[{"k":"a","t":"Bagmati"},{"k":"b","t":"Kamla"},{"k":"c","t":"Kosi"},{"k":"d","t":"Gandak"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"None of the rivers given in the options flows towards the north; rather, these rivers flow southward from their source region and ultimately meet the Ganga as tributaries or sub-tributaries."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"Expansion of the Terai Region in Bihar is –"}],"opts":[{"k":"a","t":"Parallel to the north bank of Chotanagpur plateau"},{"k":"b","t":"Parallel to the India-Nepal boundary"},{"k":"c","t":"Parallel to the east bank of the Rohtas plateau"},{"k":"d","t":"Parallel to the west boundary of the Rajmahal mountain range"}],"ans":"b","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Terai region of Bihar extends parallel to the India–Nepal border. It extends as a thin belt in the districts adjacent to Nepal in Bihar (West Champaran, East Champaran, Sitamarhi, Madhubani, Supaul, Araria, Kishanganj)."}],"xref":null},{"n":33,"g":null,"stem":[{"type":"p","text":"In which district of Bihar, Telhar Kund Waterfall is located?"}],"opts":[{"k":"a","t":"Sasaram"},{"k":"b","t":"Nawada"},{"k":"c","t":"Kaimur"},{"k":"d","t":"Rohtas"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Telhar (Telhar / Talhar) Kund waterfall is located in Kaimur district of Bihar."}],"xref":null}]},{"title":"Art and Culture","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Which of the following is the only UNESCO World Heritage Site present in Bihar State of India?"}],"opts":[{"k":"a","t":"Mahabodhi Temple"},{"k":"b","t":"Buddhist Monastery in Nalanda"},{"k":"c","t":"Ancient site of Vikramashila Monastery"},{"k":"d","t":"Tomb of Sher Shah Suri"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the UNESCO World Heritage List, both the Archaeological Site of Nalanda Mahavihara at Nalanda (in 2016) and the Mahabodhi Temple Complex at Bodh Gaya (in 2002) are included."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"In which of the following cities did Japanese build a World Peace Stupa?"}],"opts":[{"k":"a","t":"Deo"},{"k":"b","t":"Rajgir"},{"k":"c","t":"Gaya"},{"k":"d","t":"Bodhgaya"}],"ans":"b","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The ‘World Peace Stupa’, situated on the Ratnagiri hill (about 400 metres high) in Rajgir, was constructed in 1969 by a Japanese Buddhist monk, Nipponzan Myohoji."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"Where is the 'Vishwa Shanti Stupa', said to be the highest in the world, located in Bihar?"}],"opts":[{"k":"a","t":"Vaishali"},{"k":"b","t":"Nalanda"},{"k":"c","t":"Rajgir"},{"k":"d","t":"Patna"}],"ans":"c","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The ‘World Peace Stupa’, situated on the Ratnagiri hill (about 400 metres high) in Rajgir, was constructed in 1969 by a Japanese Buddhist monk, Nipponzan Myohoji."}],"xref":2},{"n":4,"g":null,"stem":[{"type":"p","text":"The original meaning of the word 'Vihar' is -"}],"opts":[{"k":"a","t":"Buddhist monastery"},{"k":"b","t":"Land of Angels"},{"k":"c","t":"Arya Pradesh"},{"k":"d","t":"The Land of Greenery"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The residence of Buddhist monks is called a Vihar (monastery). In ancient Sanskrit, Prakrit and Pali literature, there is no mention of any region named Bihar. Toward the end of the 12th century, due to the large number of Buddhist viharas in this region (especially around Odantapuri), it came to be called Vihar, which later became Bihar."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Who used the caves of Barabar as their shelter-house?"}],"opts":[{"k":"a","t":"Ajivakas"},{"k":"b","t":"Tharus"},{"k":"c","t":"Jains"},{"k":"d","t":"Tantrikas"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the Mauryan period, the art of carving caves to make dwellings developed. During the time of Ashoka and his grandson Dasharatha, shelters were carved out in the Barabar and Nagarjuni hills for the followers of the Ajivakas sect."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Mahabodhi Temple has been built at Bodh Gaya where-"}],"opts":[{"k":"a","t":"Gautama Buddha was born"},{"k":"b","t":"Gautama Buddha received enlightenment"},{"k":"c","t":"Gautama Buddha gave his first sermon"},{"k":"d","t":"Gautama Buddha passed away"}],"ans":"b","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At Bodh Gaya, after six years of penance, Buddha attained enlightenment at the age of 35 on the night of Vaishakh Purnima under a peepal tree. Construction of the temple at this site was started by Emperor Ashoka in the third century BCE; however, its present form was built in the 5th–6th century CE. This temple is entirely made of bricks. In 2002, UNESCO included it in the list of World Heritage Sites."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"Chandragupta’s palace situated at Pataliputra is mainly made up of –"}],"opts":[{"k":"a","t":"Bricks"},{"k":"b","t":"Stones"},{"k":"c","t":"Wood"},{"k":"d","t":"Clays"}],"ans":"c","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Excavations at Bulandibagh and Kumrahar near Patna (Pataliputra) in Bihar have revealed remains of huge wooden buildings of the Mauryan period. The credit for bringing these to light goes to Mr. Spooner. Bulandibagh yielded remains of the city fortification, while Kumrahar yielded remains of the royal palace."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Which is the oldest church in Bihar?"}],"opts":[{"k":"a","t":"Padri Ki Haveli"},{"k":"b","t":"Luke's Church"},{"k":"c","t":"Stephen's Church"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["68th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Padri ki Haveli, also known as St. Mary’s Church, is the oldest church in Bihar. It was originally built in Patna in 1713. Its present structure was constructed in 1772."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Which is the unique festival of Bihar?"}],"opts":[{"k":"a","t":"Deepavali"},{"k":"b","t":"Bisu"},{"k":"c","t":"Vinayak Chaturthi"},{"k":"d","t":"Chhath Puja"}],"ans":"d","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Chhath Puja is the most important festival of Bihar, and it is called the Mahaparv of Bihar. It is observed on the sixth day of the bright fortnight of the Kartik month, exactly six days after Diwali. On this festival, Surya Dev (Sun God) and Chhathi Maiya are worshipped, and Arghya is offered—first at sunset and the second at sunrise. Diwali, also called the festival of lights, is a major Hindu festival celebrated on the new moon day of the Kartik month. Vishu is the traditional New Year festival of Kerala. It is celebrated on the first day of the Malayalam month Medam and is considered a symbol of good luck for the coming year. Vinayak Chaturthi is celebrated by Hindus across India, including Maharashtra, on the Shukla Chaturthi of the month of Bhadrapada on the occasion of Lord Vinayak’s (Ganesha’s) birth."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"'Surya Temple' is situated in which of the following cities?"}],"opts":[{"k":"a","t":"Gaya"},{"k":"b","t":"Bodhgaya"},{"k":"c","t":"Deo"},{"k":"d","t":"Ranchi"}],"ans":"c","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Surya Temple is situated in Deo (Aurangabad district). It is believed that the famous Chhath festival of Bihar began from the pond situated in front of the Sun Temple."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"The famous animal fair of Bihar is held on Kartik Purnima -"}],"opts":[{"k":"a","t":"In Gaya"},{"k":"b","t":"In Madhubani"},{"k":"c","t":"In Bhagalpur"},{"k":"d","t":"In Sonpur"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["65th B.P.S.C. (Re-Exam) (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar’s famous animal fair is organized every year on the occasion of Kartik Purnima at Sonpur (at the confluence of the Ganga and Gandak rivers). It is considered the largest animal fair in Asia."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"What is the name of the one month long cattle fair organized at the confluence of Ganga and Gandak rivers ?"}],"opts":[{"k":"a","t":"Katihar Mela"},{"k":"b","t":"Sonepur Mela"},{"k":"c","t":"Purnia Mela"},{"k":"d","t":"More than one of the above"}],"ans":"b","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar’s famous animal fair is organized every year on the occasion of Kartik Purnima at Sonpur (at the confluence of the Ganga and Gandak rivers). It is considered the largest animal fair in Asia."}],"xref":11},{"n":13,"g":null,"stem":[{"type":"p","text":"In the context of Indian handicrafts, what is ‘Sujini’ in Bihar?"}],"opts":[{"k":"a","t":"A type of glassware"},{"k":"b","t":"A metal craft"},{"k":"c","t":"A type of embroidery"},{"k":"d","t":"A type of clay pottery"}],"ans":"d","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the context of Indian handicrafts, ‘Sujini’ is a type of embroidery, which has also received a GI tag. Sujini embroidery is also known as Sujani. It originated from Bhusura village in Bihar. Notably, it was initially considered a form of making quilts and blankets, in which old saris and dhotis were used as a creative canvas. The cloth was folded three or four times, and then simple stitches were applied on the used fabrics to give them a new look."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"In which district of Bihar, the world's tallest (251 m) statue of Mother Sita will be constructed?"}],"opts":[{"k":"a","t":"Madhubani"},{"k":"b","t":"Sitamarhi"},{"k":"c","t":"Bodh Gaya"},{"k":"d","t":"Patna"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 13 February, 2022, the National Coordinator of the Ramayan Research Council and Mahamandaleshwar of the Juna Akhara, Swami Virendranand Ji Maharaj, announced the installation of the world’s tallest statue (251 feet) of Mata Sita at Sitamarhi. Along with the statue, a digital museum, a research institute, and a study center based on the life of Mata Sita will also be constructed. Note—The Ramayan Research Council has shown the height of the statue as 251 feet in its gallery, whereas some sources have erroneously mentioned its height as 251 meters."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"'Nava Nalanda Mahavihara' is famous for what?"}],"opts":[{"k":"a","t":"Xuanzang Memorial"},{"k":"b","t":"Birthplace of Mahavira"},{"k":"c","t":"Pali Research Institute"},{"k":"d","t":"Museum"}],"ans":"c","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"‘Nava Nalanda Mahavihara’ is a modern center of Buddhist studies, which was established by the Government of Bihar in 1951 at Nalanda. A large number of students from Sri Lanka, Japan, Korea, Tibet, Bhutan, and other countries/ regions come here for research in Pali and Buddhist studies."}],"xref":null}]},{"title":"Transportation System","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"The total length of National Highways in Bihar is:"}],"opts":[{"k":"a","t":"3410 km"},{"k":"b","t":"3587 km"},{"k":"c","t":"4595 km"},{"k":"d","t":"4707 km"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2015–16, the length of National Highways in Bihar increased from 3410 km. in 2001 to 4595 km in 2015. As per the Bihar Economic Survey, 2024–25 (status as of September, 2024), the total length of National Highways in Bihar is 6130 km, while according to the Annual Report, 2024–25 issued by the Ministry of Road Transport and Highways, Government of India, the length of National Highways in Bihar was 6132 km as of 31 December, 2024."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"The total length of National Highways in Bihar is –"}],"opts":[{"k":"a","t":"1913 km"},{"k":"b","t":"1088 km"},{"k":"c","t":"1313 km"},{"k":"d","t":"1371 km"}],"ans":"*","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar Economic Survey, 2015–16, the length of National Highways in Bihar increased from 3410 km. in 2001 to 4595 km in 2015. As per the Bihar Economic Survey, 2024–25 (status as of September, 2024), the total length of National Highways in Bihar is 6130 km, while according to the Annual Report, 2024–25 issued by the Ministry of Road Transport and Highways, Government of India, the length of National Highways in Bihar was 6132 km as of 31 December, 2024."}],"xref":1},{"n":3,"g":null,"stem":[{"type":"p","text":"The road length per lakh of population in Bihar is"}],"opts":[{"k":"a","t":"lowest"},{"k":"b","t":"second lowest"},{"k":"c","t":"highest"},{"k":"d","t":"second highest"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Ministry of Road Transport and Highways, as on 31 March, 2019, in National Highways (per lakh population), Bihar’s road length ranks fifth from the bottom."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Which of the following National Highways connects Chhapra and Gopalganj?"}],"opts":[{"k":"a","t":"National Highway No. 77"},{"k":"b","t":"National Highway No. 84"},{"k":"c","t":"National Highway No. 85"},{"k":"d","t":"National Highway No. 80"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, National Highway No. 85 connected Chhapra–Siwan–Gopalganj, whereas National Highway 77 connected Hajipur–Sitamarhi–Sonbarsa, National Highway 84 connected Ara–Buxar, and National Highway 80 connected Mokama–Rajmahal–Farakka."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Match List-I (Characteristics of National Highways) with List-II (Numbers of National Highways) and select the correct answer using the codes given below the lists: List-I List-II (Characteristics of (Numbers of National Highways) National Highways)"},{"type":"list","items":["A. National Highway that 1. National Highway passes through Bihar No. 12","B. National Highway that 2. National Highway does not pass through No. 87"]},{"type":"p","text":"Bihar C. National Highway having 3. National Highway maximum length in Bihar No. 2 D. Proposed National 4. National Highway Highway not to serve No. 31 Bihar. Codes : A B C D"}],"opts":[{"k":"a","t":"3 1 4 2"},{"k":"b","t":"4 2 3 1"},{"k":"c","t":"1 3 2 4"},{"k":"d","t":"2 4 1 3"}],"ans":"a","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, the main stretch of National Highway No. 87 connected Rampur (Uttar Pradesh) to Jeolikote (Uttarakhand) and National Highway No. 12 connected Jabalpur (Madhya Pradesh) to Jaipur (Rajasthan)— these did not pass through Bihar. National Highway No. 2 also passed through Bihar, but its length was 202 km, whereas at present, the longest National Highway passing through Bihar is National Highway No. 27 (East–West/E.W.), whose length is 487 km."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"Which one is not located on National Highway-2 (NH-2)?"}],"opts":[{"k":"a","t":"Aurangabad"},{"k":"b","t":"Sasaram"},{"k":"c","t":"Mohania"},{"k":"d","t":"Patna"}],"ans":"d","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, under National Highway-2 (NH-2), Bihar included Mohania, Sasaram, Aurangabad and Dehri-on-Sone, whereas NH-2 did not pass through Patna"}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"The National Highway that passes through Bihar is"}],"opts":[{"k":"a","t":"N.H. No. 3"},{"k":"b","t":"N.H. No. 8"},{"k":"c","t":"N.H. No. 22"},{"k":"d","t":"N.H. No. 23"}],"ans":"d","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"National Highway No. 23 connected Chas of the then undivided Bihar with Ranchi, Gumla and Thethaitangar. According to the Annual Report, 2024–25 issued by the Ministry of Road Transport and Highways, as on 31 December, 2024, the total number of National Highways passing through Bihar is 56, and their total length in Bihar is 6132 km. The length of National Highway No. 27 (East– West/E.W.) in Bihar is 487 km."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"In Bihar, air services are provided by"}],"opts":[{"k":"a","t":"Only Indian Airlines"},{"k":"b","t":"Only Sahara Airlines"},{"k":"c","t":"Only Royal Nepal Airlines"},{"k":"d","t":"Indian Airlines, Sahara Airlines and Royal Nepal Airlines"}],"ans":"*","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At present, air services in Bihar are provided by several airlines, including Air India, Air India Express, IndiGo, SpiceJet, Nepal Airlines, etc. Since none of the options given in the question were correct, the Bihar Public Service Commission excluded this question from evaluation."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Patna International Airport is directly connected with"}],"opts":[{"k":"a","t":"Kathmandu (Nepal), New Delhi, Kolkata, Mumbai, Lucknow, Varanasi and Ranchi"},{"k":"b","t":"Bengaluru, Hyderabad and Dhaka"},{"k":"c","t":"Islamabad, Dhaka and Bengaluru"},{"k":"d","t":"Washington, Dhaka and Chennai"}],"ans":"*","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Lok Nayak Jayaprakash Narayan International Airport, Patna, is directly connected to Ahmedabad, Bengaluru, Kolkata, Chennai, Hyderabad, Mumbai, Lucknow, Pune, New Delhi, etc. On this basis, none of the options is correct. Therefore, the Bihar Public Service Commission excluded this question from evaluation."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"The East Central Railway zone headquarters is located at-"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Hajipur"},{"k":"c","t":"Muzaffarpur"},{"k":"d","t":"Katihar"}],"ans":"b","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The headquarters of the East Central Railway zone is located at Hajipur. It includes the Sonpur, Samastipur, Danapur, Pandit Deen Dayal Upadhyaya and Dhanbad divisions."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"The most powerful locomotive of India, manufactured at Madhepura Locomotive Factory. The power of the electric rail engine is-"}],"opts":[{"k":"a","t":"9000 HP"},{"k":"b","t":"10000 HP"},{"k":"c","t":"11000 HP"},{"k":"d","t":"12000 HP"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The power of India’s most powerful electric locomotive manufactured at the Madhepura Electric Locomotive Factory is 12,000 horsepower (HP)."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Which of the following global companies bagged the contract for setting up of locomotive factories in Bihar?"}],"opts":[{"k":"a","t":"Siemens and Alstom"},{"k":"b","t":"GE and Alstom"},{"k":"c","t":"Lombardy"},{"k":"d","t":"Nissan"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The global company GE (United States) and the French company Alstom were awarded the contract to establish locomotive factories in Bihar. GE set up its factory at Marhaura in Saran district, while Alstom established its factory at Madhepura."}],"xref":null}]},{"title":"Books and Authors","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Among the following Newspapers of Bihar, which was the first one to get p
