  document.body.classList.remove('in-q');
  const c = $('#stage'); c.textContent = '';
  const head = el('div', 'home-head');
  head.appendChild(el('h2', 'home-title', 'Bihar: state-based questions'));
  head.appendChild(el('p', 'home-lede',
    'Every Bihar question the BPSC has asked between 1991 and 2025, kept in the book’s own sixteen ' +
    'topics, each with its answer and full explanation. Pick a topic to start, or search across all of them.'));
  const t = secStats(null);
  const stats = el('div', 'stats');
  [[t.n, 'questions'], [DATA.sections.length, 'topics'], [yearSpan(), 'exam years'],
   [t.done, 'seen'], [t.ok + t.no ? Math.round(t.ok / (t.ok + t.no) * 100) + '%' : '—', 'accuracy']]
   .forEach(([v, l]) => { const s = el('div', 'stat'); s.append(el('b', null, String(v)), el('span', null, l)); stats.appendChild(s); });
  head.appendChild(stats);
  c.appendChild(head);

  const idx = el('div', 'idx');
  DATA.sections.forEach((s, i) => {
    const st = secStats(i);
    const r = el('button', 'idx-row');
    r.append(el('span', 'idx-name', s.title));
    const bw = el('span', 'idx-bar'); bar(bw, st.ok, st.no, st.n); r.appendChild(bw);
    r.append(el('span', 'idx-meta', st.done + ' / ' + st.n));
    r.onclick = () => openSec(i);
    idx.appendChild(r);
  });
  c.appendChild(idx);
}
function yearSpan(){
  const ys = ALL.map(q => q.yr).filter(Boolean);
  return Math.min.apply(null, ys) + '–' + Math.max.apply(null, ys);
}

/* ---------- question ---------- */
function drawQ(){
  const list = pool();
  const c = $('#stage'); c.textContent = '';
  drawCounts();
  if (!list.length){ drawEmpty(c); return; }
  if (view.read){ drawRead(c, list); return; }
  document.body.classList.add('in-q');
  view.i = Math.max(0, Math.min(view.i, list.length - 1));
  const q = list[view.i];

  const head = el('div', 'qhead');
  const L = el('div', 'qhead-l');
  const cr = el('div', 'crumb');
  cr.appendChild(el('b', null, q.sec));
  if (q.g) cr.appendChild(el('span', null, q.g));
  cr.appendChild(el('span', 'pill', q.src[0] || 'B.P.S.C.'));
  if (q.src.length > 1) cr.appendChild(el('span', 'pill', q.src[1]));
  if (q.ans === '*') cr.appendChild(el('span', 'pill warn', 'no correct option'));
  L.appendChild(cr);
  head.appendChild(L);

  const nav = el('div', 'qnav');
  const prev = iconBtn('M15 5l-7 7 7 7', 'Previous question'); prev.onclick = () => step(-1);
  const next = iconBtn('M9 5l7 7-7 7', 'Next question'); next.onclick = () => step(1);
  const star = iconBtn('M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.73L6.8 19.6l1-5.8-4.2-4.1 5.8-.85z', 'Star question');
  star.setAttribute('aria-pressed', store.star[q.id] ? 'true' : 'false');
  star.onclick = () => { toggleStar(q); };
  nav.append(star, prev, el('span', 'counter', (view.i + 1) + ' / ' + list.length), next);
  head.appendChild(nav);
  c.appendChild(head);

  const stem = el('div', 'stem'); renderBlocks(q.stem, stem); c.appendChild(stem);

  const picked = store.pick[q.id];
  const opts = el('div', 'opts');
  q.opts.forEach(o => {
    const b = el('button', 'opt');
    const d = el('span', 'disc', o.k.toUpperCase());
    b.append(d, el('span', 'opt-t', o.t));
    if (picked){
      b.disabled = true;
      if (o.k === q.ans) { b.classList.add('correct'); b.appendChild(el('span', 'tag', 'answer')); }
      if (picked !== '?' && o.k === picked && o.k !== q.ans) { b.classList.add(q.ans === '*' ? 'chosen' : 'wrong'); b.appendChild(el('span', 'tag', 'you')); }
      if (picked !== '?' && o.k === picked && o.k === q.ans) b.appendChild(el('span', 'tag', 'you'));
    } else {
      b.onclick = () => choose(q, o.k);
    }
    opts.appendChild(b);
  });
  c.appendChild(opts);

  if (picked){
    const state = picked === '?' ? 'neutral' : (q.ans === '*' ? 'neutral' : (picked === q.ans ? 'ok' : 'no'));
    const v = el('div', 'verdict ' + state);
    v.textContent = q.ans === '*'
      ? 'The Commission found no correct option for this question.'
      : picked === '?' ? 'Answer shown — this one is not counted in your score.'
      : (picked === q.ans ? 'Correct.' : 'Not correct — the answer is (' + q.ans + ').');
    const secs = (store.time || {})[q.id];
    if (secs && picked !== '?') v.appendChild(el('span', 'yours', secs < 60 ? secs + 's'
      : Math.floor(secs / 60) + 'm ' + (secs % 60) + 's'));
    const redo = el('button', 'btn', 'Try again');
    redo.style.marginLeft = 'auto';
    redo.onclick = () => { delete store.pick[q.id]; save(); drawQ(); drawRail(); };
    v.appendChild(redo);
    c.appendChild(v);

    const ex = el('div', 'expl');
    ex.appendChild(el('p', 'expl-h', 'Explanation'));
    if (q.xref) ex.appendChild(el('p', 'xref', 'Carried over from question ' + q.xref + ' of this topic, which the book cross-references.'));
    const body = el('div', 'expl-b'); renderBlocks(q.expl, body); ex.appendChild(body);
    c.appendChild(ex);
  } else {
    const row = el('div', 'reveal-row');
    const sk = el('button', 'btn', 'Show answer');
    sk.onclick = () => { store.pick[q.id] = '?'; store.seen[q.id] = 1; save(); drawQ(); drawRail(); };
    row.appendChild(sk);
    c.appendChild(row);
  }
  $('#fStar').textContent = store.star[q.id] ? 'Starred' : 'Star';
  qStart = picked ? 0 : Date.now();
  window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
}

function iconBtn(d, label){
  const b = el('button', 'icon-btn');
  b.setAttribute('aria-label', label); b.title = label;
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>';
  return b;
}
function choose(q, k){
  store.pick[q.id] = k; store.seen[q.id] = 1;
  if (qStart) { store.time = store.time || {}; store.time[q.id] = Math.round((Date.now() - qStart) / 1000); }
  save(); drawQ(); drawRail();
}
function toggleStar(q){
  if (store.star[q.id]) delete store.star[q.id]; else store.star[q.id] = 1;
  save(); drawQ(); drawCounts();
}
function step(d){
  const list = pool();
  if (!list.length) return;
  view.i = (view.i + d + list.length) % list.length;
  drawQ();
}

/* ---------- read mode ---------- */
function drawRead(c, list){
  document.body.classList.remove('in-q');
  const CAP = 260, capped = list.length > CAP;
  if (capped) list = list.slice(0, CAP);
  const h = el('div', 'crumb');
  h.style.marginBottom = '18px';
  h.appendChild(el('b', null, view.sec === null ? 'All topics' : DATA.sections[view.sec].title));
  h.appendChild(el('span', null, list.length + ' questions with answers and explanations'
    + (capped ? ' — showing the first ' + CAP + ', pick a topic to see the rest' : '')));
  c.appendChild(h);
  const wrap = el('div', 'rev');
  list.forEach(q => {
    const it = el('div', 'rev-item');
    const cr = el('div', 'crumb'); cr.style.marginBottom = '10px';
    cr.appendChild(el('b', null, 'Q' + q.n));
    if (view.sec === null) cr.appendChild(el('span', null, q.sec));
    cr.appendChild(el('span', 'pill', q.src[0] || 'B.P.S.C.'));
    if (q.ans === '*') cr.appendChild(el('span', 'pill warn', 'no correct option'));
    it.appendChild(cr);
    const st = el('div', 'stem'); renderBlocks(q.stem, st); it.appendChild(st);
    const os = el('div', 'rev-opts');
    q.opts.forEach(o => {
      const r = el('div', 'rev-opt' + (o.k === q.ans ? ' is-ans' : ''));
      r.append(el('i', null, '(' + o.k + ')'), el('span', null, o.t));
      os.appendChild(r);
    });
    it.appendChild(os);
    const ex = el('div', 'expl');
    if (q.xref) ex.appendChild(el('p', 'xref', 'Carried over from question ' + q.xref + ' of this topic.'));
    const body = el('div', 'expl-b'); renderBlocks(q.expl, body); ex.appendChild(body);
    it.appendChild(ex);
    wrap.appendChild(it);
  });
  c.appendChild(wrap);
}

function drawEmpty(c){
  document.body.classList.remove('in-q');
  const e = el('div', 'empty');
  e.appendChild(el('p', null, 'Nothing matches these filters.'));
  const b = el('button', 'btn', 'Clear filters');
  b.onclick = () => { view.filter = 'all'; view.query = ''; view.exam = ''; view.year = '';
    $('#q').value = ''; $('#fExam').value = ''; $('#fYear').value = ''; syncChips(); draw(); };
  e.appendChild(b); c.appendChild(e);
}

/* ---------- nav ---------- */
function openSec(i){ view.sec = i; view.i = 0; drawRail(); draw(); }
function draw(){
  if (EX && EX.done) { drawResult(); return; }
  if (EX) { drawExam(); return; }
  document.body.classList.remove('in-exam');
  $('#btnExam').textContent = 'Exam';
  if (view.sec === null && !view.query && view.filter === 'all' && !view.read) drawHome(); else drawQ();
  drawCounts();
}
function syncChips(){
  document.querySelectorAll('#filters .chip[data-f]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.f === view.filter ? 'true' : 'false'));
}
function closeRail(){ document.body.classList.remove('rail-open'); }

/* ---------- filter selects ---------- */
(function initSelects(){
  const fams = {}, yrs = {};
  ALL.forEach(q => { q.fam.forEach(f => fams[f] = (fams[f] || 0) + 1); if (q.yr) yrs[q.yr] = (yrs[q.yr] || 0) + 1; });
  const fe = $('#fExam');
  fe.appendChild(new Option('Any exam', ''));
  Object.keys(fams).sort((a, b) => fams[b] - fams[a]).forEach(f => fe.appendChild(new Option(f + ' (' + fams[f] + ')', f)));
  const fy = $('#fYear');
  fy.appendChild(new Option('Any year', ''));
  Object.keys(yrs).sort((a, b) => b - a).forEach(y => fy.appendChild(new Option(y + ' (' + yrs[y] + ')', y)));
  fe.onchange = () => { view.exam = fe.value; view.i = 0; draw(); };
  fy.onchange = () => { view.year = fy.value; view.i = 0; draw(); };
})();

/* ---------- events ---------- */
document.querySelectorAll('#filters .chip[data-f]').forEach(b => b.onclick = () => {
  view.filter = b.dataset.f; view.i = 0; syncChips();
  if (view.sec === null && view.filter !== 'all') drawQ(); else draw();
});
$('#btnMode').onclick = () => {
  view.read = !view.read;

  exp.onclick = () => {
    const blob = new Blob([JSON.stringify(store)], { type:'application/json' });
    const a = el('a'); a.href = URL.createObjectURL(blob);
    a.download = 'bihar-pyq-progress.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const imp = el('button', 'btn', 'Load progress');
  const fi = el('input'); fi.type = 'file'; fi.accept = 'application/json'; fi.style.display = 'none';
  fi.onchange = () => {
    const f = fi.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { store = Object.assign({ pick:{}, star:{}, seen:{} }, JSON.parse(r.result));
      save(); drawRail(); draw(); dlg.close(); } catch(e){ alert('That file could not be read.'); } };
    r.readAsText(f);
  };
  imp.onclick = () => fi.click();
  const rst = el('button', 'btn', 'Reset everything');
  rst.onclick = () => { if (confirm('Clear all answers and stars?')){

  row.append(exp, imp, rst, fi);

    const th = el('tr');

    tb.appendChild(th);
    hist.slice(0, 8).forEach(h => {

        .forEach(v => tr.appendChild(el('td', null, String(v))));
      tb.appendChild(tr);
    });
    b.appendChild(tb);
  }
});

/* ============= Bihar background: Madhubani (Mithila) painting ============= */
(function paintBg(){
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const P  = (d, a) => mk('path', Object.assign({ d }, a || {}));
  const C  = (cx, cy, r, a) => mk('circle', Object.assign({ cx, cy, r }, a || {}));
  const G  = (a) => mk('g', a || {});
  const add = (p, ...kids) => { kids.forEach(k => p.appendChild(k)); return p; };
  const r1 = n => Math.round(n * 10) / 10;
  // pigments: turmeric, kusum red, indigo, leaf green — the traditional four
  const A = 'var(--mb-a)', B = 'var(--mb-b)', I = 'var(--mb-c)', L = 'var(--mb-d)';

  /* --- motifs, each drawn around its own origin --- */

  function peacock(){                                   // the Mithila peacock
    const g = G();
    for (let i = 0; i < 13; i++){                      // fanned tail with eye-feathers
      const a = (-92 + i * 10) * Math.PI / 180, len = 64, bx = 14, by = 10;
      const tx = bx + Math.cos(a) * len, ty = by + Math.sin(a) * len;
      const mx = bx + Math.cos(a) * len * .55 - Math.sin(a) * 9;
      const my = by + Math.sin(a) * len * .55 + Math.cos(a) * 9;
      add(g, P(`M${bx} ${by} Q${r1(mx)} ${r1(my)} ${r1(tx)} ${r1(ty)}`, { 'stroke-width':'.8' }),
             C(r1(tx), r1(ty), 7, { fill:L }),
             C(r1(tx), r1(ty), 4.4, { fill:I }),
             C(r1(tx), r1(ty), 1.9, { fill:B }));
    }
    add(g,
      P('M2 -6 C14 -9, 23 2, 21 13 C19 25, 4 29, -4 22 C-13 15, -10 0, 2 -6 Z', { fill:I }),
      P('M-4 -2 C-12 -9, -18 -17, -19 -27'), P('M3 0 C-5 -7, -13 -16, -14 -27'),
      C(-17, -31, 6.5, { fill:A }), C(-19, -32, 1.6, { fill:'currentColor' }),
      P('M-23.5 -30 l-8 3 l8 3'),
      P('M-17 -38 v-8 M-22 -37 l-4 -7 M-12 -37 l4 -7'),
      C(-17, -47, 2, { fill:B }), C(-27, -45, 2, { fill:B }), C(-7, -45, 2, { fill:B }),
      P('M2 27 v9 m-5 0 h10 M12 26 v10 m-5 0 h10'),
      C(6, 10, 3, { fill:A }), C(13, 17, 2.2, { fill:B }));
    return g;
  }

  function elephant(){
    const g = G();
    add(g,
      P('M-26 6 C-28 -8, -16 -18, 2 -18 C19 -18, 30 -9, 30 5 C30 12, 27 17, 22 18 L-20 18 C-24 17, -26 12, -26 6 Z', { fill:A }),
      P('M-20 18 v13 h10 v-13 M-4 18 v13 h10 v-13 M12 18 v13 h10 v-13'),
      P('M-26 2 C-38 6, -41 22, -35 32 C-32 37, -25 36, -24 30 C-25 26, -30 27, -30 30 C-33 24, -31 12, -21 7 Z', { fill:A }),
      P('M-33 12 l6 2 M-35 19 l6 1 M-35 26 l6 0'),   // trunk rings
      P('M-29 16 c-7 2 -10 7 -10 11'),                               // tusk
      P('M-16 -6 c12 -3 17 6 15 15 c-2 8 -12 11 -17 6 c-4 -5 -5 -17 2 -21 Z', { fill:B }),
      P('M-13 -1 c8 -1 11 5 9 11'),
      C(-22, -5, 2, { fill:'currentColor' }),
      P('M30 2 c7 5 8 13 6 19 m-4 -3 l4 4 m0 -4 l-4 4'),
      C(4, -4, 4, { fill:L }), C(16, 2, 3, { fill:B }), C(10, 9, 2.4, { fill:I }), C(22, -6, 2.4, { fill:I }));
    return g;
  }

  function bird(){
    return add(G(),
      P('M0 0 c6 -7 17 -7 21 0 c-5 7 -16 7 -21 0 Z', { fill:B }),
      C(22, -4, 4.2, { fill:A }), P('M26 -4 l6 2 l-6 2.4'),
      P('M0 0 l-9 -5 m9 5 l-9 5'), C(20, -5, 1.3, { fill:'currentColor' }));
  }

  function tree(){                                       // tree of life
    const g = G();
    add(g, P('M-5 48 C-8 26, -8 12, -3 -4 L4 -4 C9 12, 9 26, 6 48 Z', { fill:A }),
           P('M-5 48 c-9 4 -15 4 -20 1 M6 48 c9 4 15 4 20 1'),
           P('M-4 36 h9 M-5 24 h10 M-4 12 h9'));
    [[-2, 0], [10, 1], [22, 2]].forEach(([y, k]) => {
      const w = 30 - k * 5;
      add(g, P(`M-2 ${y} C${-w * .6} ${y - 7}, ${-w} ${y - 16}, ${-w - 3} ${y - 27}`),
             P(`M3 ${y} C${w * .6} ${y - 7}, ${w} ${y - 16}, ${w + 3} ${y - 27}`));
      for (let j = 1; j <= 5; j++){
        const t = j / 5.6, lx = -(w + 3) * t - 2, rx = (w + 3) * t + 2, ly = y - 27 * t * .95;
        add(g, P(`M${r1(lx)} ${r1(ly)} q-7 -6 -10 -1 q4 5 10 1 Z`, { fill:L }),
               P(`M${r1(rx)} ${r1(ly)} q7 -6 10 -1 q-4 5 -10 1 Z`, { fill:L }));
      }
    });
    add(g, C(0, -16, 12, { fill:A }), C(0, -16, 5, { fill:B }));
    for (let i = 0; i < 8; i++)
      g.appendChild(P('M0 -28 v-6', { transform:`rotate(${i * 45} 0 -16)` }));
    const b1 = bird(); b1.setAttribute('transform', 'translate(-46,-26) scale(.8)');
    const b2 = bird(); b2.setAttribute('transform', 'translate(46,-26) scale(-.8,.8)');
    add(g, b1, b2);
    return g;
  }

  function tortoise(){
    const g = G();
    add(g, mk('ellipse', { rx:30, ry:21, fill:L }), mk('ellipse', { rx:20, ry:13, fill:A }),
           mk('ellipse', { rx:9, ry:6, fill:B }), C(0, 0, 3, { fill:I }),
           P('M-20 -6 l-10 -8 M20 -6 l10 -8 M-20 6 l-10 8 M20 6 l10 8 M0 -13 v-8 M0 13 v8'),
           P('M30 -1 c10 -2 16 2 16 6 c0 5 -7 7 -14 5'),
           C(40, 3, 1.7, { fill:'currentColor' }),
           P('M-18 13 c-4 7 -9 8 -12 5 M18 13 c4 7 9 8 12 5 M-18 -13 c-4 -7 -9 -8 -12 -5 M18 -13 c4 -7 9 -8 12 -5'),
           P('M-25 1 c-7 2 -10 5 -10 8'));
    return g;
  }

  function sun(){
    const g = G();
    for (let i = 0; i < 16; i++)
      g.appendChild(P(i % 2 ? 'M0 -20 v-11' : 'M0 -20 l-4 -6 l4 -7 l4 7 z',
        { transform:`rotate(${i * 22.5})`, fill:i % 2 ? 'none' : B }));
    add(g, C(0, 0, 19, { fill:A }), C(0, 0, 14.5),
           C(-6, -4, 2.4, { fill:'currentColor' }), C(6, -4, 2.4, { fill:'currentColor' }),
           P('M0 -2 v5 M-6 7 q6 6 12 0'));
    return g;
  }

  function fish(){
    return add(G(),
      P('M-27 0 C-15 -14, 15 -14, 26 0 C15 14, -15 14, -27 0 Z', { fill:I }),
      P('M26 0 l14 -10 v20 z', { fill:B }),
      C(-16, -3, 1.9, { fill:'currentColor' }),
      P('M-7 -10 q7 10 0 20 M3 -11.5 q7 11.5 0 23'),
      P('M-2 -12 c4 -6 10 -7 13 -4'));
  }

  function lotus(){                                      // kohbar lotus
    const g = G();
    for (let i = 0; i < 12; i++)
      g.appendChild(mk('ellipse', { cx:0, cy:-22, rx:6, ry:16, transform:`rotate(${i * 30})`, fill:B }));
    for (let i = 0; i < 8; i++)
      g.appendChild(mk('ellipse', { cx:0, cy:-12, rx:4.5, ry:9, transform:`rotate(${i * 45 + 22})`, fill:A }));
    add(g, C(0, 0, 6, { fill:L }), C(0, 0, 34, { 'stroke-dasharray':'2 7' }));
    return g;
  }

  function bamboo(){                                     // the kohbar's bamboo stalk
    const g = G();
    add(g, P('M0 42 V-40'), P('M5 42 V-40'));
    for (let i = 0; i < 6; i++){
      const y = 34 - i * 15;
      add(g, P(`M0 ${y} h5`),
             P(`M0 ${y - 4} q-11 -4 -15 -11 q11 2 15 11 Z`, { fill:L }),
             P(`M5 ${y - 9} q11 -4 15 -11 q-11 2 -15 11 Z`, { fill:L }));
    }
    return g;
  }

  function flower(){
    const g = G();
    for (let i = 0; i < 6; i++)
      g.appendChild(mk('ellipse', { cx:0, cy:-7, rx:3.2, ry:6, transform:`rotate(${i * 60})`, fill:A }));
    g.appendChild(C(0, 0, 2.6, { fill:B }));
    return g;
  }

  // wavy vine with alternating leaves — Madhubani rarely leaves a line bare
  function vine(len, step){
    const g = G();
    let d = 'M0 0';
    for (let x = 0; x < len; x += step) d += ` q${step / 2} -7 ${step} 0 q${step / 2} 7 ${step} 0`;
    g.appendChild(P(d));
    for (let x = step; x < len; x += step * 2){
      add(g, P(`M${x} 0 q-6 -9 -13 -10 q3 9 13 10 Z`, { fill:L }),
             P(`M${x + step} 0 q6 9 13 10 q-3 -9 -13 -10 Z`, { fill:L }));
    }
    return g;
  }

  /* --- assemble one framed panel, bordered the way a Mithila painting is --- */
  const T = 400, M = 30;                       // tile, frame margin
  const g = G({ fill:'none', stroke:'currentColor', 'stroke-width':'1.15',
                'stroke-linecap':'round', 'stroke-linejoin':'round' });

  // seeded jitter so the tile is identical on every render
  let _s = 7;
  const rnd = () => (_s = (_s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  // the filled ground: a dotted field, as in kachni work
  const ground = G({ 'stroke-width':'.85' });
  for (let y = M + 8; y < T - M; y += 21)
    for (let x = M + 8; x < T - M; x += 21){
      const jx = x + (rnd() - .5) * 5, jy = y + (rnd() - .5) * 5, k = rnd();
      if (k < .42) ground.appendChild(C(r1(jx), r1(jy), 1.5, { fill:'currentColor', stroke:'none' }));
      else if (k < .72) ground.appendChild(P(`M${r1(jx - 3)} ${r1(jy)} h6`));
      else ground.appendChild(P(`M${r1(jx)} ${r1(jy - 3)} q4 3 0 6 q-4 -3 0 -6 Z`, { fill:A, stroke:'none' }));
    }
  g.appendChild(ground);

  // border: double rule, a band of teeth, then an inner rule
  add(g, mk('rect', { x:7, y:7, width:T - 14, height:T - 14, rx:4 }),
         mk('rect', { x:12, y:12, width:T - 24, height:T - 24, rx:4 }),
         mk('rect', { x:M - 4, y:M - 4, width:T - 2 * M + 8, height:T - 2 * M + 8, rx:3 }));
  let teeth = '';
  for (let x = 14; x < T - 14; x += 14){
    teeth += `M${x} 12 l7 9 l7 -9 `;
    teeth += `M${x} ${T - 12} l7 -9 l7 9 `;
  }
  for (let y = 14; y < T - 14; y += 14){
    teeth += `M12 ${y} l9 7 l-9 7 `;
    teeth += `M${T - 12} ${y} l-9 7 l9 7 `;
  }
  g.appendChild(P(teeth, { fill:B, 'stroke-width':'.9' }));
  [[20, 20], [T - 20, 20], [20, T - 20], [T - 20, T - 20]].forEach(([x, y]) =>
    add(g, C(x, y, 6, { fill:A }), C(x, y, 2.5, { fill:I })));

  const place = (node, x, y, sc, rot) => {
    node.setAttribute('transform', `translate(${x},${y}) scale(${sc})` + (rot ? ` rotate(${rot})` : ''));
    g.appendChild(node);
  };

  place(vine(T - 2 * M - 16, 26), M + 8, M + 6, 1);
  place(vine(T - 2 * M - 16, 26), M + 8, T - M - 6, 1);

  place(peacock(),  108, 112, 1.02);
  place(lotus(),    300,  98, 1);
  place(bamboo(),   356, 116, .88);
  place(elephant(), 116, 292, 1.05);
  place(tree(),     292, 286, .98);
  place(sun(),      212,  56, .82);
  place(fish(),     176, 190, .84);
  place(fish(),     236, 214, -.7);
  place(tortoise(), 200, 352, .82);
  place(bird(),      52, 198, 1.3);
  place(bird(),     344, 238, -1.2);
  [[200, 130], [60, 60], [346, 348], [268, 170], [130, 214], [58, 348], [346, 46]]
    .forEach(([x, y]) => place(flower(), x, y, 1));

  const pat = mk('pattern', { id:'madhubani', width:T, height:T, patternUnits:'userSpaceOnUse' });
  pat.appendChild(g);
  const defs = mk('defs'); defs.appendChild(pat);
  const svg = mk('svg', { width:'100%', height:'100%', preserveAspectRatio:'none' });
  add(svg, defs, mk('rect', { width:'100%', height:'100%', fill:'url(#madhubani)' }));
  document.getElementById('bgart').appendChild(svg);
})();

/* ==================== timer ==================== */
let sessionMs = 0, sessionFrom = Date.now(), sessionOn = true, qStart = 0;
function fmt(ms){
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = n => (n < 10 ? '0' : '') + n;
  return (h ? h + ':' : '') + p(m) + ':' + p(ss);
}
function tick(){
  const box = $('#timer'), c = $('#clock');
  box.classList.remove('warn', 'crit', 'run');
  if (EX && !EX.done){
    const left = EX.ends - Date.now();
    c.textContent = fmt(left);
    box.classList.add(left < 60000 ? 'crit' : left < 300000 ? 'warn' : 'run');
    box.title = 'Time left in this exam';
    if (left <= 0) submitExam(true);
    return;
  }
  const total = sessionMs + (sessionOn ? Date.now() - sessionFrom : 0);
  c.textContent = fmt(total);
  if (sessionOn) box.classList.add('run');
  box.title = sessionOn ? 'Session time — click to pause' : 'Paused — click to resume';
}
setInterval(tick, 500);
$('#timer').onclick = () => {
  if (EX && !EX.done) return;
  if (sessionOn){ sessionMs += Date.now() - sessionFrom; sessionOn = false; }
  else { sessionFrom = Date.now(); sessionOn = true; }
  tick();
};

function shuffledCopy(a, n){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return n ? a.slice(0, n) : a;
}

function examSetup(){
  const cfg = { scope:(view.sec === null ? 'all' : 'topic'), count:25, per:60, neg:0, shuffle:true, custom:null };
  openDlg('Start an exam', b => {
    const mkSeg = (label, opts, get, set, note) => {
      const f = el('div', 'fset'); f.appendChild(el('span', null, label));
      const seg = el('div', 'seg');
      opts.forEach(([txt, val]) => {
        const x = el('button', null, txt);
        const paint = () => seg.querySelectorAll('button').forEach((n, i) =>
          n.setAttribute('aria-pressed', opts[i][1] === get() ? 'true' : 'false'));
        x.onclick = () => { set(val); paint(); if (f.upd) f.upd(); };
        seg.appendChild(x);
      });
      f.appendChild(seg);
      seg.querySelectorAll('button').forEach((n, i) => n.setAttribute('aria-pressed', opts[i][1] === get() ? 'true' : 'false'));
      if (note) f.appendChild(el('p', 'note', note));
      b.appendChild(f); return f;
    };
    const scopes = [['All topics', 'all']];
    if (view.sec !== null) scopes.unshift([DATA.sections[view.sec].title, 'topic']);
    scopes.push(['Starred', 'star'], ['Unattempted', 'todo']);
    const fScope = mkSeg('Draw questions from', scopes, () => cfg.scope, v => cfg.scope = v);
    const fCount = mkSeg('How many', [['10', 10], ['25', 25], ['50', 50], ['100', 100], ['150', 150]],
      () => cfg.count, v => cfg.count = v);
    const fPer = mkSeg('Seconds per question', [['30s', 30], ['45s', 45], ['1 min', 60], ['90s', 90]],
      () => cfg.per, v => cfg.per = v);
    mkSeg('Negative marking', [['None', 0], ['¼ mark', 0.25], ['⅓ mark', 1 / 3]],
      () => cfg.neg, v => cfg.neg = v, 'Check the notification for the exam you are targeting — this is yours to set.');
    const avail = el('p', 'note'); b.appendChild(avail);
    const upd = () => {
      const n = Math.min(cfg.count, examPool(cfg).length);
      avail.textContent = n + ' questions available for this choice · ' + fmt(n * cfg.per * 1000) + ' on the clock';
    };
    fScope.upd = upd; fCount.upd = upd; fPer.upd = upd; upd();
    const row = el('div', 'row');
    const go = el('button', 'btn primary', 'Start');
    go.onclick = () => { dlg.close(); startExam(cfg); };
    const cancel = el('button', 'btn', 'Cancel'); cancel.onclick = () => dlg.close();
    row.append(go, cancel); b.appendChild(row);
  });
}

function examPool(cfg){
  let a = cfg.scope === 'topic' && view.sec !== null ? ALL.filter(q => q.si === view.sec)
        : cfg.scope === 'star' ? ALL.filter(q => store.star[q.id])
        : cfg.scope === 'todo' ? ALL.filter(q => !store.pick[q.id])
        : ALL;
  return a.filter(q => q.ans !== '*');
}

function startExam(cfg){
  const src = examPool(cfg);
  if (!src.length){ alert('No questions available for that choice.'); return; }
  const picked = cfg.shuffle ? shuffledCopy(src, cfg.count) : src.slice(0, cfg.count);
  const mins = picked.length * cfg.per * 1000;
  EX = { ids:picked.map(q => q.id), i:0, ans:{}, mark:{}, neg:cfg.neg,
         started:Date.now(), ends:Date.now() + mins, dur:mins, done:false,
         label:cfg.scope === 'topic' ? DATA.sections[view.sec].title
             : cfg.scope === 'star' ? 'Starred questions'
             : cfg.scope === 'todo' ? 'Unattempted questions' : 'All topics' };
  exSave(); closeRail(); draw();
}

function drawExam(){
  $('#btnExam').textContent = 'Resume';
  document.body.classList.add('in-exam');
  document.body.classList.remove('in-q');
  const c = $('#stage'); c.textContent = '';
  const q = byId[EX.ids[EX.i]];
  const head = el('div', 'ex-head');
  head.appendChild(el('span', 'ex-title', EX.label));
  head.appendChild(el('span', 'counter', (EX.i + 1) + ' / ' + EX.ids.length));
  const sub = el('button', 'btn', 'Submit');
  sub.onclick = () => { if (confirm('Submit this exam now?')) submitExam(false); };
  head.appendChild(sub);
  c.appendChild(head);

  const stem = el('div', 'stem'); renderBlocks(q.stem, stem); c.appendChild(stem);
  const opts = el('div', 'opts');
  q.opts.forEach(o => {
    const btn = el('button', 'opt' + (EX.ans[q.id] === o.k ? ' chosen' : ''));
    btn.append(el('span', 'disc', o.k.toUpperCase()), el('span', 'opt-t', o.t));
    btn.onclick = () => { EX.ans[q.id] = o.k; exSave(); nextEx(1); };
    opts.appendChild(btn);
  });
  c.appendChild(opts);

  const act = el('div', 'ex-actions');
  const clr = el('button', 'btn', 'Clear');
  clr.onclick = () => { delete EX.ans[q.id]; exSave(); drawExam(); };
  const mk = el('button', 'btn', EX.mark[q.id] ? 'Unmark' : 'Mark for review');
  mk.onclick = () => { EX.mark[q.id] ? delete EX.mark[q.id] : EX.mark[q.id] = 1; exSave(); drawExam(); };
  const pv = el('button', 'btn', 'Previous'); pv.onclick = () => nextEx(-1);
  const nx = el('button', 'btn primary', 'Next'); nx.onclick = () => nextEx(1);
  act.append(pv, clr, mk, nx); c.appendChild(act);

  c.appendChild(el('p', 'sheet-h', 'Answer sheet'));
  const pal = el('div', 'palette');
  EX.ids.forEach((id, i) => {
    const a = !!EX.ans[id], m = !!EX.mark[id];
    const p = el('button', 'pal' + (a && m ? ' ansmark' : a ? ' ans' : m ? ' mark' : '') + (i === EX.i ? ' cur' : ''), String(i + 1));
    p.onclick = () => { EX.i = i; exSave(); drawExam(); };
    pal.appendChild(p);
  });
  c.appendChild(pal);
  const key = el('div', 'pal-key');
  [['Answered', 'ans'], ['Marked', 'mark'], ['Answered and marked', 'ansmark'], ['Not visited', '']]
    .forEach(([lab, cls]) => { const sp = el('span'); const i = el('i', cls); sp.append(i, document.createTextNode(lab)); key.appendChild(sp); });
  c.appendChild(key);
  window.scrollTo({ top:0 });
}
function nextEx(d){ EX.i = (EX.i + d + EX.ids.length) % EX.ids.length; exSave(); drawExam(); }

function submitExam(auto){
  let ok = 0, no = 0, skip = 0;
  const per = {};
  EX.ids.forEach(id => {
    const q = byId[id], a = EX.ans[id];
    per[q.sec] = per[q.sec] || { n:0, ok:0, no:0, skip:0 };
    per[q.sec].n++;
    if (!a){ skip++; per[q.sec].skip++; return; }
    store.pick[id] = a; store.seen[id] = 1;
    if (a === q.ans){ ok++; per[q.sec].ok++; } else { no++; per[q.sec].no++; }
  });
  save();
  EX.done = true; EX.auto = !!auto; EX.finished = Date.now();
  EX.res = { ok, no, skip, per, marks:+(ok - EX.neg * no).toFixed(2),
             used:Math.min(EX.dur, (EX.finished - EX.started)) };
  store.exams = (store.exams || []).concat([{ when:EX.finished, label:EX.label, n:EX.ids.length,
    ok, no, skip, marks:EX.res.marks, used:EX.res.used }]).slice(-20);
  save(); exSave(); drawRail(); draw();
}

function drawResult(){
  $('#btnExam').textContent = 'New exam';
  document.body.classList.add('in-exam');
  const c = $('#stage'); c.textContent = '';
  const r = EX.res, n = EX.ids.length;
  const head = el('div', 'home-head');
  head.appendChild(el('p', 'crumb', EX.label + (EX.auto ? ' — time ran out' : '')));
  const sc = el('h2', 'res-score', r.marks + ' ');
  sc.appendChild(Object.assign(el('small'), { textContent:'of ' + n }));
  head.appendChild(sc);
  const stats = el('div', 'stats');
  [[r.ok, 'correct'], [r.no, 'wrong'], [r.skip, 'not answered'],
   [(r.ok + r.no) ? Math.round(r.ok / (r.ok + r.no) * 100) + '%' : '—', 'accuracy'],
   [fmt(r.used), 'time used'],
   [Math.round(r.used / 1000 / n) + 's', 'per question']]
   .forEach(([v, l]) => { const s2 = el('div', 'stat'); s2.append(el('b', null, String(v)), el('span', null, l)); stats.appendChild(s2); });
  head.appendChild(stats);
  if (EX.neg) head.appendChild(el('p', 'note', 'Scored with a ' + (EX.neg === 0.25 ? '¼' : '⅓') + ' mark penalty for each wrong answer.'));
  c.appendChild(head);

  const keys = Object.keys(r.per);
  if (keys.length > 1){
    const tb = el('table', 'res-tbl');
    const thead = el('thead'), htr = el('tr');
    ['Topic', 'Asked', 'Right', 'Wrong', 'Skipped'].forEach(h => htr.appendChild(el('th', null, h)));
    thead.appendChild(htr); tb.appendChild(thead);
    const tbody = el('tbody');
    keys.sort((a, b2) => r.per[b2].n - r.per[a].n).forEach(k => {
      const tr = el('tr'); const p = r.per[k];
      [k, p.n, p.ok, p.no, p.skip].forEach(v => tr.appendChild(el('td', null, String(v))));
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody); c.appendChild(tb);
  }

  const row = el('div', 'ex-actions');
  const again = el('button', 'btn primary', 'New exam');
  again.onclick = () => { EX = null; exSave(); draw(); examSetup(); };
  const back = el('button', 'btn', 'Back to practice');
  back.onclick = () => { EX = null; exSave(); document.body.classList.remove('in-exam'); draw(); };
  row.append(again, back); c.appendChild(row);

  c.appendChild(el('p', 'sheet-h', 'Review — your answer against the key'));
  const wrap = el('div', 'rev'); wrap.style.marginTop = '14px';
  EX.ids.forEach((id, i) => {
    const q = byId[id], a = EX.ans[id];
    const it = el('div', 'rev-item');
    const cr = el('div', 'crumb'); cr.style.marginBottom = '10px';
    cr.appendChild(el('b', null, 'Q' + (i + 1)));
    cr.appendChild(el('span', null, q.sec));
    cr.appendChild(el('span', 'pill', !a ? 'not answered' : a === q.ans ? 'right' : 'wrong'));
    it.appendChild(cr);
    const st = el('div', 'stem'); renderBlocks(q.stem, st); it.appendChild(st);
    const os = el('div', 'rev-opts');
    q.opts.forEach(o => {
      const rr = el('div', 'rev-opt' + (o.k === q.ans ? ' is-ans' : ''));
      rr.append(el('i', null, '(' + o.k + ')'), el('span', null, o.t));
      if (o.k === a && o.k !== q.ans) rr.appendChild(el('span', 'yours', 'your answer'));
      os.appendChild(rr);
    });
    it.appendChild(os);
    const ex = el('div', 'expl');
    if (q.xref) ex.appendChild(el('p', 'xref', 'Carried over from question ' + q.xref + ' of this topic.'));
    const body = el('div', 'expl-b'); renderBlocks(q.expl, body); ex.appendChild(body);
    it.appendChild(ex); wrap.appendChild(it);
  });
  c.appendChild(wrap);
  window.scrollTo({ top:0 });
}

$('#btnExam').onclick = () => {
  if (EX && !EX.done){ draw(); return; }
  if (EX && EX.done){ EX = null; exSave(); }
  examSetup();
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA'){
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === '/'){ e.preventDefault(); qi.focus(); return; }
  if (k === 't'){ $('#btnTheme').click(); return; }
  if (k === 'r'){ $('#btnShuffle').click(); return; }
  if (dlg.open) return;
  if (EX && !EX.done){
    const q = byId[EX.ids[EX.i]];
    if (k === 'arrowright' || k === 'n' || k === 'enter'){ e.preventDefault(); nextEx(1); return; }
    if (k === 'arrowleft'  || k === 'p'){ e.preventDefault(); nextEx(-1); return; }
    if (k === 'm'){ e.preventDefault(); EX.mark[q.id] ? delete EX.mark[q.id] : EX.mark[q.id] = 1; exSave(); drawExam(); return; }
    if (k === 'c'){ e.preventDefault(); delete EX.ans[q.id]; exSave(); drawExam(); return; }
    let L = /^[1-5]$/.test(k) ? 'abcde'[+k - 1] : (/^[a-e]$/.test(k) ? k : null);
    if (L && q.opts.some(o => o.k === L)){ e.preventDefault(); EX.ans[q.id] = L; exSave(); nextEx(1); }
    return;
  }
  const list = pool(); if (!list.length || view.read) return;
  const q = list[view.i];
  if (k === 'arrowright' || k === 'n'){ e.preventDefault(); step(1); return; }
  if (k === 'arrowleft'  || k === 'p'){ e.preventDefault(); step(-1); return; }
  if (k === 's'){ e.preventDefault(); toggleStar(q); return; }
  if (k === 'enter' || k === ' '){
    e.preventDefault();
    if (store.pick[q.id]) step(1);
    else { store.pick[q.id] = '?'; save(); drawQ(); drawRail(); }
    return;
  }
  let letter = null;
  if (/^[1-5]$/.test(k)) letter = 'abcde'[+k - 1];
  else if (/^[a-e]$/.test(k)) letter = k;
  if (letter && !store.pick[q.id] && q.opts.some(o => o.k === letter)){ e.preventDefault(); choose(q, letter); }
});

/* ---------- go ---------- */
if (EX && !EX.done && EX.ends <= Date.now()) submitExam(true);
tick();
drawRail(); syncChips(); draw();
})();
</script>
