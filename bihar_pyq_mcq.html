<!DOCTYPE html>
<html lang="en" data-theme="dark" data-pattern="paint">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bihar State-Based PYQs — BPSC Prelims</title>
<script>
  // no-flash theme boot
  try {
    var t = localStorage.getItem('biharPYQ.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var a = localStorage.getItem('biharPYQ.pattern');
    document.documentElement.setAttribute('data-pattern',
      (a === 'line' || a === 'off' || a === 'paint') ? a : 'paint');
  } catch (e) {}
</script>
<style>
/* ============================== tokens ============================== */
html[data-theme="dark"]{
  --bg:#12131a; --bg-2:#171922; --surface:#1c1f2a; --surface-2:#232735; --raised:#282c3a;
  --line:#2e3242; --line-soft:#252936;
  --ink:#e9e6dd; --ink-2:#a6a59d; --ink-3:#75757f;
  --accent:#e2a83e; --accent-ink:#14151c; --accent-soft:rgba(226,168,62,.13);
  --ok:#62ab79; --ok-soft:rgba(98,171,121,.14);
  --no:#cf655a; --no-soft:rgba(207,101,90,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px -18px rgba(0,0,0,.9);
}
html[data-theme="light"]{
  --bg:#edebe3; --bg-2:#e6e3d9; --surface:#fbfaf5; --surface-2:#f2f0e7; --raised:#ffffff;
  --line:#d4d0c2; --line-soft:#e1ded2;
  --ink:#22232a; --ink-2:#5b5b61; --ink-3:#87868c;
  --accent:#a8721a; --accent-ink:#fffdf6; --accent-soft:rgba(168,114,26,.12);
  --ok:#2f7a4b; --ok-soft:rgba(47,122,75,.11);
  --no:#a63f34; --no-soft:rgba(166,63,52,.11);
  --shadow:0 1px 2px rgba(48,44,32,.06), 0 12px 28px -20px rgba(48,44,32,.4);
}
:root{
  --read:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail:272px; --maxw:760px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================== shell ============================== */
.app{display:flex;min-height:100dvh}

/* ---- rail ---- */
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--bg-2);
  border-right:1px solid var(--line-soft); display:flex; flex-direction:column;
  position:sticky; top:0; height:100dvh;
}
.rail-head{padding:20px 18px 14px;border-bottom:1px solid var(--line-soft)}
.mark{font-family:var(--read);font-size:19px;line-height:1.15;letter-spacing:-.01em;margin:0}
.mark em{font-style:normal;color:var(--accent)}
.mark-sub{margin:6px 0 0;font-size:12px;color:var(--ink-3);line-height:1.4}
.overall{margin-top:14px}
.bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.ok{background:var(--ok)}
.bar i.no{background:var(--no)}
.overall-txt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:7px;font-variant-numeric:tabular-nums}
.rail-list{overflow-y:auto;flex:1;padding:8px 8px 24px}
.sub{
  display:block;width:100%;text-align:left;padding:9px 10px;border-radius:7px;
  border:1px solid transparent;margin-bottom:1px;
}
.sub:hover{background:var(--surface)}
.sub[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.sub-top{display:flex;align-items:baseline;gap:8px}
.sub-name{font-size:13.5px;line-height:1.3;flex:1;color:var(--ink)}
.sub-n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sub[aria-current="true"] .sub-name{color:var(--accent)}
.sub .bar{margin-top:7px;height:3px}
.rail-foot{padding:10px 14px 14px;border-top:1px solid var(--line-soft);display:flex;gap:6px;flex-wrap:wrap}
.tbtn{
  font-size:11.5px;color:var(--ink-2);padding:5px 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);
}
.tbtn:hover{color:var(--ink);border-color:var(--ink-3)}

/* ---- main ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 22px}
.icon-btn{
  width:34px;height:34px;border-radius:7px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);background:var(--surface);flex:none;
}
.icon-btn:hover{color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.8;pointer-events:none}
.search input{
  width:100%;padding:8px 30px 8px 32px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);font-size:13.5px;
}
.search input::placeholder{color:var(--ink-3)}
.search .clr{position:absolute;right:6px;color:var(--ink-3);font-size:16px;line-height:1;padding:4px 6px}
.filters{display:flex;gap:6px;padding:0 22px 10px;flex-wrap:wrap;align-items:center}
.chip{
  font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface);white-space:nowrap;
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
select.chip{appearance:none;padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 11px,calc(100% - 8px) 11px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---- stage ---- */
.stage{flex:1;padding:26px 22px 120px;display:flex;justify-content:center}
.col{width:100%;max-width:var(--maxw)}

/* ---- home ---- */
.home-head{margin:6px 0 26px}
.home-title{font-family:var(--read);font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;letter-spacing:-.015em}
.home-title span{color:var(--accent)}
.home-lede{max-width:60ch;color:var(--ink-2);font-family:var(--read);font-size:17px;line-height:1.6;margin:14px 0 0}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--line-soft)}
.stat b{display:block;font-family:var(--read);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.idx{display:grid;gap:2px;margin-top:28px}
.idx-row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:13px 14px;border-radius:9px;border:1px solid transparent;background:var(--surface);
}
.idx-row:hover{border-color:var(--line);background:var(--surface-2)}
.idx-name{font-family:var(--read);font-size:17px;flex:1;min-width:0}
.idx-meta{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.idx-bar{width:64px;flex:none}
.idx-row .bar{height:4px}

/* ---- question ---- */
.qhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.qhead-l{flex:1;min-width:0}
.crumb{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--accent);font-weight:500}
.pill{
  display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap;
}
.pill.warn{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.qnav{display:flex;gap:6px;align-items:center;flex:none}
.counter{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}

.stem{font-family:var(--read);font-size:19.5px;line-height:1.55;margin:0 0 20px}
.stem p{margin:0 0 10px}
.stem p:last-child{margin-bottom:0}
.stem ul{margin:10px 0;padding-left:22px}
.stem li{margin:3px 0}

.opts{display:grid;gap:8px;margin:0 0 20px}
.opt{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  padding:12px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.disc{
  width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);
  margin-top:1px;transition:all .12s;
}
.opt-t{font-family:var(--read);font-size:17px;line-height:1.45;flex:1;min-width:0;padding-top:2px}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen .disc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .disc{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .disc{background:var(--no);border-color:var(--no);color:#fff}
.opt .tag{font-size:11px;color:var(--ink-3);align-self:center;flex:none}
.opt.correct .tag{color:var(--ok)}
.opt.wrong .tag{color:var(--no)}

.verdict{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:13.5px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)} .verdict.neutral{color:var(--ink-2)}
.reveal-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.btn{
  padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);font-size:13.5px;color:var(--ink-2);
}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}

.expl{border-top:1px solid var(--line-soft);padding-top:18px}
.expl-h{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.expl-b{font-family:var(--read);font-size:16.5px;line-height:1.65;color:var(--ink)}
.expl-b p{margin:0 0 12px}
.expl-b p:last-child{margin-bottom:0}
.expl-b ul{margin:0 0 12px;padding-left:20px;list-style:none}
.expl-b ul li{margin:5px 0;position:relative}
.expl-b table{border-collapse:collapse;margin:4px 0 14px;font-family:var(--ui);font-size:13.5px}
.expl-b td{border:1px solid var(--line);padding:6px 12px;font-variant-numeric:tabular-nums}
.expl-b tr:first-child td{background:var(--surface-2);color:var(--ink-2)}
.xref{font-size:12.5px;color:var(--ink-3);font-family:var(--ui);margin:0 0 12px;font-style:italic}

/* ---- review list ---- */
.rev{display:grid;gap:14px}
.rev-item{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:18px}
.rev-item .stem{font-size:17px;margin-bottom:12px}
.rev-opts{display:grid;gap:4px;margin-bottom:14px;font-family:var(--read);font-size:16px}
.rev-opt{display:flex;gap:9px;padding:3px 0;color:var(--ink-2)}
.rev-opt.is-ans{color:var(--ok);font-weight:600}
.rev-opt i{font-style:normal;flex:none;width:20px;color:var(--ink-3)}
.rev-opt.is-ans i{color:var(--ok)}
.rev-item .expl{border-top-style:dashed}

/* ---- empty ---- */
.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.empty p{font-family:var(--read);font-size:18px;color:var(--ink-2);margin:0 0 14px}

/* ---- dialog ---- */
dialog{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:0;max-width:460px;width:calc(100% - 32px);box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(6,7,11,.62)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.dlg-h h2{font-family:var(--read);font-size:18px;margin:0;font-weight:500}
.dlg-b{padding:18px 20px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.kbd-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:2px 7px;color:var(--ink);white-space:nowrap;
}
.dlg-b .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---- mobile ---- */
.scrim{display:none}
@media (max-width:900px){
  .rail{
    position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:var(--shadow);width:284px;flex-basis:284px;
  }
  body.rail-open .rail{transform:none}
  body.rail-open .scrim{display:block;position:fixed;inset:0;background:rgba(6,7,11,.5);z-index:50}
  .top-row{padding:9px 14px;flex-wrap:wrap;row-gap:8px}
  .search{order:10;flex:1 0 100%}
  #timer{margin-left:auto}
  .btn-exam{padding:0 11px}
  .timer{padding:0 8px;font-size:12.5px}
  .filters{padding:0 14px 9px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .filters::after{content:'';flex:0 0 4px}
  .stage{padding:18px 14px 110px}
  .opt-t{font-size:16px}
  .stem{font-size:18px}
}
@media (min-width:901px){ .only-mobile{display:none!important} }

/* ---- Madhubani background ---- */
.bgart{
  position:fixed;inset:0;z-index:0;pointer-events:none;color:var(--accent);opacity:.055;
  --mb-a:transparent;--mb-b:transparent;--mb-c:transparent;--mb-d:transparent;
}
html[data-theme="light"] .bgart{opacity:.085}
html[data-pattern="off"] .bgart{display:none}
html[data-pattern="paint"] .bgart{
  opacity:.16;color:#efe0c6;--mb-a:#d9a03c;--mb-b:#b0453c;--mb-c:#35618f;--mb-d:#4f7a4c;
}
html[data-theme="light"][data-pattern="paint"] .bgart{
  opacity:.17;color:#2b2118;--mb-a:#c98f2c;--mb-b:#a33c33;--mb-c:#2c5480;--mb-d:#40683f;
}
@media (min-width:901px){
  html[data-pattern="paint"] .bgart{
    -webkit-mask-image:radial-gradient(ellipse 42% 75% at 61% 48%, transparent 0 56%, #000 100%);
            mask-image:radial-gradient(ellipse 42% 75% at 61% 48%, transparent 0 56%, #000 100%);
  }
}
@media (max-width:900px){
  html[data-pattern="paint"] .bgart{opacity:.07}
  html[data-theme="light"][data-pattern="paint"] .bgart{opacity:.1}
}

/* ---- timer ---- */
.timer{
  display:flex;align-items:center;gap:6px;padding:0 11px;height:34px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex:none;
}
.timer b{font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.timer svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.timer.run b{color:var(--ink)}
.timer.warn{border-color:var(--accent);color:var(--accent)} .timer.warn b{color:var(--accent)}
.timer.crit{border-color:var(--no);color:var(--no)} .timer.crit b{color:var(--no)}
.btn-exam{
  height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:500;flex:none;
}
.btn-exam:hover{filter:brightness(1.07)}
body.in-exam .filters,body.in-exam .search,body.in-exam #btnShuffle,body.in-exam #btnReshuffle{display:none}
body.in-exam .fnav{display:none!important}

/* ---- exam runtime ---- */
.ex-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;
  padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.ex-head .counter{min-width:auto}
.ex-title{font-family:var(--read);font-size:17px;flex:1;min-width:0}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.pal{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pal:hover{border-color:var(--ink-3)}
.pal.ans{background:var(--ok);border-color:var(--ok);color:#fff}
.pal.mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pal.ansmark{background:var(--ok);border-color:var(--accent);color:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
.pal.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal-key{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:12px}
.pal-key span{display:flex;align-items:center;gap:6px}
.pal-key i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);display:block;flex:none}
.pal-key i.ans{background:var(--ok);border-color:var(--ok)}
.pal-key i.mark{background:var(--accent);border-color:var(--accent)}
.pal-key i.ansmark{background:var(--ok);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.sheet-h{font-size:12px;color:var(--ink-3);margin:30px 0 0;padding-top:18px;border-top:1px solid var(--line-soft)}

/* ---- results ---- */
.res-score{font-family:var(--read);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0}
.res-score small{font-size:.42em;color:var(--ink-3);font-family:var(--ui);margin-left:8px}
.res-tbl{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px}
.res-tbl th,.res-tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.res-tbl th{font-weight:500;color:var(--ink-3);font-size:11.5px}
.res-tbl td:not(:first-child),.res-tbl th:not(:first-child){text-align:right}
.yours{display:inline-block;margin-left:10px;font-size:11px;color:var(--ink-3)}

/* ---- exam setup form ---- */
.fset{margin:0 0 16px}
.fset > span{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  font-size:12.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fset input[type=number]{width:84px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.note{font-size:12px;color:var(--ink-3);margin:2px 0 0;line-height:1.5}

/* ---- footer nav (mobile sticky) ---- */
.fnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;
  gap:8px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line-soft);
}

<script id="qdata" type="application/json">{"meta":{"source":"BPSC Prelims General Studies Chapterwise Solved Papers (2026), Bihar : State Based Questions","total":603},"sections":[{"title":"Historical Scenario","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"In July, 2019, experts visited for the first documentation of a Megalithic site of Bihar in which of the following districts?"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Kaimur"},{"k":"c","t":"Madhubani"},{"k":"d","t":"Banka"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In July, 2019, for the first-time archaeological exploration of Bihar’s megalithic sites, a team of experts visited Rohtas district. It is noteworthy that in November, 2018, a team of archaeologists led by Shyam Sundar Tiwari, a researcher of the Son Valley Civilization, discovered five megalithic sites at Rohtasgarh in Rohtas district. The Bihar Public Service Commission, in its final answer key, considered option (b) as correct, which is incorrect."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"The oldest culture from Chirand of Bihar is"}],"opts":[{"k":"a","t":"Paleolithic culture"},{"k":"b","t":"Mesolithic culture"},{"k":"c","t":"Neolithic culture"},{"k":"d","t":"Chalcolithic culture"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"From the archaeological site named Chirand in Saran district of Bihar, the Neolithic culture has come to light. Excavation at this site has been carried out in various surveys by the Department of Ancient Indian History and Archaeology, Patna University, and the Directorate of Archaeology, Government of Bihar. Evidence of human habitation is seen here from the Neolithic period. This is the first Neolithic archaeological site discovered in any river valley in India."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"Chinese traveller I-Tsing was on the tour of Bihar in about:"}],"opts":[{"k":"a","t":"405 A.D"},{"k":"b","t":"635 A.D"},{"k":"c","t":"637 A.D"},{"k":"d","t":"None of the above"}],"ans":"d","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Chinese traveller I-Tsing (671–695 A.D.), when he was 37 years old, decided to visit India with some of his Buddhist companions, with the desire to see the remnants of Buddhism. Later, his companions left him, and he alone boarded a ship from City of Canton and set out for India. He came to India via the southern sea route and returned to China via Sumatra."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Who was the first Muslim conqueror of Bihar?"}],"opts":[{"k":"a","t":"Malik Ibrahim"},{"k":"b","t":"Iltutmish"},{"k":"c","t":"Bakhtiyar Khalji"},{"k":"d","t":"Ali Mardan Khalji"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Ikhtiyar al-Din Muhammad bin Bakhtiyar Khalji conquered Bihar between 1193 and 1202 AD and destroyed Nalanda and Vikramashila Mahavihara. Therefore, Bakhtiyar Khalji was the first Muslim conqueror of Bihar."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Nalanda University was destroyed by –"}],"opts":[{"k":"a","t":"Muslims"},{"k":"b","t":"Kushans"},{"k":"c","t":"Scythians"},{"k":"d","t":"Mughals"}],"ans":"a","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Ikhtiyar al-Din Muhammad bin Bakhtiyar Khalji conquered Bihar between 1193 and 1202 AD and destroyed Nalanda and Vikramashila Mahavihara. Therefore, Bakhtiyar Khalji was the first Muslim conqueror of Bihar."}],"xref":4},{"n":6,"g":null,"stem":[{"type":"p","text":"Nalanda Vihar was destroyed by :"}],"opts":[{"k":"a","t":"Bakhtiyar Khalji"},{"k":"b","t":"Qutbuddin Aibak"},{"k":"c","t":"Muhammad Bin Tughlaq"},{"k":"d","t":"Alauddin Khalji"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Ikhtiyar al-Din Muhammad bin Bakhtiyar Khalji conquered Bihar between 1193 and 1202 AD and destroyed Nalanda and Vikramashila Mahavihara. Therefore, Bakhtiyar Khalji was the first Muslim conqueror of Bihar."}],"xref":5},{"n":7,"g":null,"stem":[{"type":"p","text":"Who was the real founder of Turk rule in Bihar?"}],"opts":[{"k":"a","t":"Malik Husamuddin"},{"k":"b","t":"Bakhtiyar Khalji"},{"k":"c","t":"Ibrahim"},{"k":"d","t":"Dariya Khan Noohani"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Re-Exam) (Pre)-2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Ikhtiyar al-Din Muhammad bin Bakhtiyar Khalji (Ibn Bakhtiyar Khalji) was the real founder of Turkish power in Bihar."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"The first account of Bakhtiyar Khalji's attack on Bihar is found in-"}],"opts":[{"k":"a","t":"From Tarikh-e-Hind"},{"k":"b","t":"From Tabaqat-e-Nasiri"},{"k":"c","t":"From Taj-ul-Masir"},{"k":"d","t":"From Tarikh-e-Mubarak Shahi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The famous Persian historian Minhaj-ud-din Siraj, in his book Tabaqat-e-Nasiri, has described Bakhtiyar Khalji’s attacks in Bihar."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Yusuf Shah Chak, the last Muslim ruler of the Kashmir Valley, who was exiled to Bihar by the Mughal Emperor Akbar, is buried in-"}],"opts":[{"k":"a","t":"Patliputra"},{"k":"b","t":"Rajgir"},{"k":"c","t":"Munger"},{"k":"d","t":"Nalanda"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The last Muslim Chak ruler of the Kashmir Valley was Yusuf Shah Chak, who was exiled by the Mughal Emperor Akbar. He died in 1592 AD during his exile. He was buried at Nalanda (Bihar)."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"The city of Bihar Sharif remained important in the medieval period i. As a center of trade ii. As a center of education iii. As an administrative center iv. As a religious center Choose your answer from the codes given below-"}],"opts":[{"k":"a","t":"i and iii"},{"k":"b","t":"i, ii and iii"},{"k":"c","t":"ii, iii and iv"},{"k":"d","t":"ii and iii"}],"ans":"c","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Originally, the word “Bihar” is related to Buddhist viharas or monasteries. In the medieval period, Bihar Sharif was famous as a center of education, an administrative centre, and a religious centre. It was known for Odantapuri University, which was constructed by the Pala ruler Gopala, and for the dargah of the famous Sufi saint Sheikh Sharfuddin Yahya Maneri."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"Bihar's famous saint Sharfuddin Maneri is related to which Sufi sect he belonged to?"}],"opts":[{"k":"a","t":"Chishti"},{"k":"b","t":"Suhrawardi"},{"k":"c","t":"Firdausi"},{"k":"d","t":"Kubravi"}],"ans":"c","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Sharfuddin Ahmad was born in 1263 AD at Maner Sharif (Patna), and he died in 1381 AD at Bihar Sharif. Sharfuddin Maneri was a Sufi saint of the Firdausia silsila. He wrote a commentary on the Arabic work Adab-ul-Muridin by Suhrawardi. His famous work is Maktubat-e-Sadi."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"Patna was made the provincial capital by-"}],"opts":[{"k":"a","t":"Sher Shah"},{"k":"b","t":"Alauddin Hussain Shah"},{"k":"c","t":"Ibrahim Lodi"},{"k":"d","t":"Prince Azim"}],"ans":"a","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the description in Tarikh-e Daudi, after understanding the geographical and strategic importance of Patna, Sher Shah built a strong fort here in 1541 AD and made it the capital of Bihar. The ancient name of Patna was Pataliputra, which was founded by the emperor Ajatashatru of Magadha. Ajatashatru’s successor Udayin made Pataliputra (Patna) his capital in place of Rajgriha."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"Which company established its factory in 1632 at Patna, Bihar?"}],"opts":[{"k":"a","t":"British East India Company"},{"k":"b","t":"Dutch East India Company"},{"k":"c","t":"Portuguese East India Company"},{"k":"d","t":"French East India Company"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1632 AD, the Dutch established a Dutch factory in Patna College’s northern building. They were interested in trade in cotton textiles, sugar, saltpetre, opium, etc."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"When was the Bihar province merged with the Bengal province?"}],"opts":[{"k":"a","t":"1713 AD"},{"k":"b","t":"1732 AD"},{"k":"c","t":"1733 AD"},{"k":"d","t":"1734 AD"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"In 1733 AD, the Bihar Subah was merged into the Bengal Subah. The then Nawab of Bengal, Shuja-ud-din Muhammad Khan, divided the Bengal Subah into four parts: (1) Central Division—covering central, western, and a part of northern Bengal, (2) Dhaka Division—covering eastern and southern Bengal, (3) Bihar Division, and (4) Odisha Division."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"In which year was Alivardi appointed the Deputy Governor of Bihar ?"}],"opts":[{"k":"a","t":"1729"},{"k":"b","t":"1734"},{"k":"c","t":"1746"},{"k":"d","t":"1733"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The Nawab of Bengal, Shuja-ud-Din, appointed Alivardi Khan as the Naib Subedar (Deputy Governor) of Bihar in 1733 AD. During the time of Nawab Sarfaraz of Bengal, Alivardi Khan, the Naib Subedar of Bihar, revolted and killed Sarfaraz Khan in the Battle of Giria (1740 AD). In 1740 AD, Alivardi Khan became the Nawab of Bengal."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"Which year did Ali Gauhar's Bihar campaign end?"}],"opts":[{"k":"a","t":"1761"},{"k":"b","t":"1757"},{"k":"c","t":"1764"},{"k":"d","t":"1759"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Mughal emperor Ali Gauhar invaded Bihar in 1759 AD, and in the same year he declared himself the Mughal Badshah and adopted the name Shah Alam II. Shah Alam II was crowned in 1761 AD at the English factory of Gulzarbagh (near Patna) under the control of the English. During his time, the Third Battle of Panipat (1761 AD) and the Battle of Buxar (1764 AD) took place."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"Which one of the following is correct about the Permanents settlement introduced in Bihar."}],"opts":[{"k":"a","t":"The Zamindars were deprived of the ownership of the land"},{"k":"b","t":"The right of ownership of land was made hereditary and transferable for the Zamindars"},{"k":"c","t":"Land revenue was commutationalised"},{"k":"d","t":"Abolition of Zamindari"}],"ans":"c","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Lord Cornwallis introduced a ten-year revenue settlement in 1790 AD in place of annual revenue assessment. This system was made permanent on 22 March, 1793, which is called the Permanent Settlement. The reason for implementing it in Bihar was to allow zamindars to voluntarily transfer hereditary rights over land, and the main reason was to fix a definite amount of land revenue for the Company."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"In the 1830s, Patna city was a centre of—"}],"opts":[{"k":"a","t":"Sanyasi Revolt"},{"k":"b","t":"Godkhari Revolt"},{"k":"c","t":"Munda Revolt"},{"k":"d","t":"Wahabi Movement"}],"ans":"d","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Wahabi movement originally began in Arabia. Its founder was Abdul Wahhab (Muhammad ibn Abd al-Wahhab), and it was named after him. Initially, it was an Islamic reform movement. In India, the founder and early propagator of the Wahabi movement was Syed Ahmad of Rae Bareli district (Uttar Pradesh). In 1830 AD, during Syed Ahmad’s visit to Patna, Patna became a major centre of the Wahabi movement."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"Which British officer informed the Government of India that the Muslims of Patna used to correspond with the 64th Native Infantry near Peshawar and urged them to rebel against the British?"}],"opts":[{"k":"a","t":"Robert Montgomery"},{"k":"b","t":"John Lawrence"},{"k":"c","t":"Charles Metcalfe"},{"k":"d","t":"General Von Cortland"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"To reduce the intensity of the Wahabi movement, the British government began police action and intensified judicial prosecution against them. During these cases, the British government came to know about several anti-British operational centres. During this time, Robert Montgomery, Judicial Commissioner of Punjab, reported that the Muslims of Patna and Thanesar (Thaneshwar) used to correspond with the 64th Native Infantry near Peshawar and urged them to revolt against the British."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"In which year did the 'Chuar Revolt' of Bihar took place?"}],"opts":[{"k":"a","t":"1842"},{"k":"b","t":"1798"},{"k":"c","t":"1784"},{"k":"d","t":"1832"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. Re-Exam. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"No authenticated source mentions any “Chauri Revolt” in Bihar. Most probably, the Commission intended to ask about the “Chuar Revolt”. The Chuar Revolt in the then Bengal Presidency continued from 1767 to 1802 AD, and it was at its peak in 1798–99 AD. On this basis, the answer to this question will be option (b)."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"When did Chhotanagpur Tribal Revolt occur?"}],"opts":[{"k":"a","t":"1807-1808"},{"k":"b","t":"1820"},{"k":"c","t":"1858-1859"},{"k":"d","t":"1889"}],"ans":"*","src":["39th B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["39th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"No revolt took place specifically known as the “Chotanagpur tribal revolt.” However, there was a long series of revolts in this region, known by different names. None of the given dates matches the correct period of any revolt. Major revolts of this region include the Kol Revolt (1831–32), Santhal Revolt (1855–56), and Munda Revolt (1899–1900). Therefore, none of the options is correct."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"Which British Commander was defeated by the Santhals in 1855?"}],"opts":[{"k":"a","t":"Captain Nek Feville"},{"k":"b","t":"Lt. Bastion"},{"k":"c","t":"Major Burrough"},{"k":"d","t":"Colonel White"}],"ans":"c","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1855, the Santhals revolted in Bhognadih village of the Bhagalpur region (presently located in Sahibganj district of Jharkhand). They carried out attacks simultaneously on the police and the dikus, under the leadership of Sidhu (Sido), Kanhu, Chand and Bhairav. To suppress the Santhal rebellion, an army was sent under the leadership of Major Burrough, which the Santhals defeated. Finally, in 1856, Bhagalpur Commissioner Brown and Major General Lloyd brutally crushed the Santhal rebellion."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"The Tribal Movement-Santhal hool (Rebellion) took place in"}],"opts":[{"k":"a","t":"1857-58"},{"k":"b","t":"1858-59"},{"k":"c","t":"1855-56"},{"k":"d","t":"1854"}],"ans":"c","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1855, the Santhals revolted in Bhognadih village of the Bhagalpur region (presently located in Sahibganj district of Jharkhand). They carried out attacks simultaneously on the police and the dikus, under the leadership of Sidhu (Sido), Kanhu, Chand and Bhairav. To suppress the Santhal rebellion, an army was sent under the leadership of Major Burrough, which the Santhals defeated. Finally, in 1856, Bhagalpur Commissioner Brown and Major General Lloyd brutally crushed the Santhal rebellion."}],"xref":22},{"n":24,"g":null,"stem":[{"type":"p","text":"Which among the following year ‘Santhal revolt’ was occurred?"}],"opts":[{"k":"a","t":"1831-32 AD"},{"k":"b","t":"1844-46 AD"},{"k":"c","t":"1851-52 AD"},{"k":"d","t":"1855-56 AD"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1855, the Santhals revolted in Bhognadih village of the Bhagalpur region (presently located in Sahibganj district of Jharkhand). They carried out attacks simultaneously on the police and the dikus, under the leadership of Sidhu (Sido), Kanhu, Chand and Bhairav. To suppress the Santhal rebellion, an army was sent under the leadership of Major Burrough, which the Santhals defeated. Finally, in 1856, Bhagalpur Commissioner Brown and Major General Lloyd brutally crushed the Santhal rebellion."}],"xref":23},{"n":25,"g":null,"stem":[{"type":"p","text":"Who led the Santhal rebellion in 1855 AD?"}],"opts":[{"k":"a","t":"Sido and Kanhu"},{"k":"b","t":"Budhu Bhagat and Teja Bhagat"},{"k":"c","t":"Mulu Manek and Jodha Manek"},{"k":"d","t":"Madari Pasi and Sahdev"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1855, the Santhals revolted in Bhognadih village of the Bhagalpur region (presently located in Sahibganj district of Jharkhand). They carried out attacks simultaneously on the police and the dikus, under the leadership of Sidhu (Sido), Kanhu, Chand and Bhairav. To suppress the Santhal rebellion, an army was sent under the leadership of Major Burrough, which the Santhals defeated. Finally, in 1856, Bhagalpur Commissioner Brown and Major General Lloyd brutally crushed the Santhal rebellion."}],"xref":24},{"n":26,"g":null,"stem":[{"type":"p","text":"Who were the leaders of the Santhal Revolt?"}],"opts":[{"k":"a","t":"Jara Bhagat and Balaram Bhagat"},{"k":"b","t":"Sidhu and Kanhu"},{"k":"c","t":"Gorakshini Bhagat and Keshav Chandra Roy"},{"k":"d","t":"Shambh Nath Pal and Korra Mallaya"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1855, the Santhals revolted in Bhognadih village of the Bhagalpur region (presently located in Sahibganj district of Jharkhand). They carried out attacks simultaneously on the police and the dikus, under the leadership of Sidhu (Sido), Kanhu, Chand and Bhairav. To suppress the Santhal rebellion, an army was sent under the leadership of Major Burrough, which the Santhals defeated. Finally, in 1856, Bhagalpur Commissioner Brown and Major General Lloyd brutally crushed the Santhal rebellion."}],"xref":25},{"n":27,"g":null,"stem":[{"type":"p","text":"Identify the region where Santhals declared their government is 1855-56?"}],"opts":[{"k":"a","t":"Munger-Bhagalpur"},{"k":"b","t":"Bhagalpur - Rajmahal"},{"k":"c","t":"Gaya - Munger"},{"k":"d","t":"Shahabad - Gaya"}],"ans":"b","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1855–56, the Santhal rebellion mainly took place against British rule. Their main complaint was against the bhadralog (civilized people), i.e., the respectable people of Bengal and North India who came and settled in their area and exploited them. When the tribals complained to the British, the British supported those bhadralog. The tribals called their exploiters diku. In 1855, under the leadership of four brothers—Sidhu, Kanhu, Chand and Bhairav—the Santhals gathered and expressed their desire to govern their area themselves. The rebellion began and became widespread. The rebels disrupted the communication system between Bhagalpur and Rajmahal. The entire region came under their rule. They announced the end of the Company’s rule."}],"xref":null},{"n":28,"g":null,"stem":[{"type":"p","text":"Who was Birsa Munda's guru?"}],"opts":[{"k":"a","t":"Swami Sahajanand"},{"k":"b","t":"Anand Pandey"},{"k":"c","t":"Jatra Bhagat"},{"k":"d","t":"M. N. Roy"}],"ans":"b","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The name of Birsa Munda’s guru was Anand Pandey. Birsa Munda led the Munda rebellion (1899–1900). He was born in 1875 in Ulihatu village. He received his education in Chaibasa. Influenced by German missionaries, he became a Christian, but his inner quest did not end. He began to believe in the original Munda religion of his ancestors. He was also greatly influenced by Hindu ideology. In 1895, he introduced a new sect, under which he asked people to worship Sing-Bonga (one God) instead of bongas (gods and goddesses). People started considering him the incarnation of God. During this period, on 3 February 1900, Birsa was caught while sleeping, and in June 1900, he died in jail."}],"xref":null},{"n":29,"g":null,"stem":[{"type":"p","text":"Who was the leader of the Munda rebellion?"}],"opts":[{"k":"a","t":"Birsa"},{"k":"b","t":"Kanhu"},{"k":"c","t":"Tilak Manjhi"},{"k":"d","t":"Siddhu"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The name of Birsa Munda’s guru was Anand Pandey. Birsa Munda led the Munda rebellion (1899–1900). He was born in 1875 in Ulihatu village. He received his education in Chaibasa. Influenced by German missionaries, he became a Christian, but his inner quest did not end. He began to believe in the original Munda religion of his ancestors. He was also greatly influenced by Hindu ideology. In 1895, he introduced a new sect, under which he asked people to worship Sing-Bonga (one God) instead of bongas (gods and goddesses). People started considering him the incarnation of God. During this period, on 3 February 1900, Birsa was caught while sleeping, and in June 1900, he died in jail."}],"xref":28},{"n":30,"g":null,"stem":[{"type":"p","text":"Who was the leader of the Munda Rebellion?"}],"opts":[{"k":"a","t":"Birsa"},{"k":"b","t":"Kanhu"},{"k":"c","t":"Tilka Manjhi"},{"k":"d","t":"Sidhu"}],"ans":"a","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The name of Birsa Munda’s guru was Anand Pandey. Birsa Munda led the Munda rebellion (1899–1900). He was born in 1875 in Ulihatu village. He received his education in Chaibasa. Influenced by German missionaries, he became a Christian, but his inner quest did not end. He began to believe in the original Munda religion of his ancestors. He was also greatly influenced by Hindu ideology. In 1895, he introduced a new sect, under which he asked people to worship Sing-Bonga (one God) instead of bongas (gods and goddesses). People started considering him the incarnation of God. During this period, on 3 February 1900, Birsa was caught while sleeping, and in June 1900, he died in jail."}],"xref":29},{"n":31,"g":null,"stem":[{"type":"p","text":"Which was the working area of Birsa Munda?"}],"opts":[{"k":"a","t":"Champaran"},{"k":"b","t":"Ranchi"},{"k":"c","t":"Ballia"},{"k":"d","t":"Alipur"}],"ans":"b","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Birsa Munda’s area of work extended from Ranchi to Bhagalpur. His main objective was to bring social reform among the tribes and keep them away from British authority. Birsa appealed to his followers to give up the worship of many deities (Bonga) and worship only one God (Sing Bonga)."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"Where did the revolt of Birsa Munda take place?"}],"opts":[{"k":"a","t":"Champaran"},{"k":"b","t":"Ballia"},{"k":"c","t":"Ranchi"},{"k":"d","t":"None of the above"}],"ans":"c","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Birsa Munda’s area of work extended from Ranchi to Bhagalpur. His main objective was to bring social reform among the tribes and keep them away from British authority. Birsa appealed to his followers to give up the worship of many deities (Bonga) and worship only one God (Sing Bonga)."}],"xref":31},{"n":33,"g":null,"stem":[{"type":"p","text":"Who was the leader of the Munda revolution of 1899- 1900 AD?"}],"opts":[{"k":"a","t":"Sidhu"},{"k":"b","t":"Budha Bhagat"},{"k":"c","t":"Birsa Munda"},{"k":"d","t":"Shambhudan"}],"ans":"c","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Birsa Munda’s area of work extended from Ranchi to Bhagalpur. His main objective was to bring social reform among the tribes and keep them away from British authority. Birsa appealed to his followers to give up the worship of many deities (Bonga) and worship only one God (Sing Bonga)."}],"xref":32},{"n":34,"g":null,"stem":[{"type":"p","text":"Birsa was captured, while asleep on :"}],"opts":[{"k":"a","t":"1 February, 1900"},{"k":"b","t":"2 February, 1900"},{"k":"c","t":"3 February, 1900"},{"k":"d","t":"4 February, 1900"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Birsa Munda was captured while asleep at forest in Chakradharpur on 3 February, 1900."}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"Who was appointed 'Commander-in-Chief' by Birsa Munda?"}],"opts":[{"k":"a","t":"Demka Munda"},{"k":"b","t":"Gaya Munda"},{"k":"c","t":"Sundar Munda"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["B.P.S.C. Teacher (11th-12th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"For the struggle against the British, Birsa Munda gathered tribal youths from nearby villages and trained them for armed resistance. For efficient command of his collected force (Birsa Dal), Birsa made Gaya Munda the minister and commander (Commander-in-Chief) of the Birsa Dal."}],"xref":null},{"n":36,"g":null,"stem":[{"type":"p","text":"Birsa Munda was in favour of—"}],"opts":[{"k":"a","t":"Jharkhand"},{"k":"b","t":"Uttaranchal"},{"k":"c","t":"Chhattisgarh"},{"k":"d","t":"None of these"}],"ans":"d","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Between 1899 and 1900 A.D., the Munda tribals revolted under the leadership of Birsa Munda. This rebellion was against changes in the land system and against the outsiders (Dikus). Birsa spoke of establishing the rule of the Munda community, but he was not in favour of establishing any particular state."}],"xref":null},{"n":37,"g":null,"stem":[{"type":"p","text":"The revolt of 1857 affected many towns of Bihar. Which of the following is the correct sequence of the occurrence of revolt in various towns of Bihar?"}],"opts":[{"k":"a","t":"Patna, Muzaffarpur, Rohini, Jagdishpur"},{"k":"b","t":"Rohini, Patna, Muzaffarpur, Jagdishpur"},{"k":"c","t":"Muzaffarpur, Patna, Jagdishpur, Rohini"},{"k":"d","t":"Jagdishpur, Patna, Rohini, Muzaffarpur"}],"ans":"b","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"For many reasons, the Company Government considered Bihar an important administrative region. In Rohini village of the Deoghar Sub-Division (under the Santhal Pargana district), there was the headquarters of a company of the 5th Irregular Cavalry (5th temporary cavalry force). On 12 June, 1857, this unit was the first to openly revolt. The revolt took place in Patna on 3 July, 1857. After the arrest of Waris Ali (23 June, 1857), the revolt broke out in Muzaffarpur in the first week of July, 1857, and in the last week of July, 1857, Kunwar Singh revolted at Arrah (Jagdishpur)."}],"xref":null},{"n":38,"g":null,"stem":[{"type":"p","text":"Which of the following was not a reason for making the sepoys of the East India Company rebellious?"}],"opts":[{"k":"a","t":"The efforts of the ofÏcers of the company to spread Christianity"},{"k":"b","t":"The order to the sepoys to travel by ships"},{"k":"c","t":"The stoppage of Bhatta"},{"k":"d","t":"The inefÏciency of the ofÏcers"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The incompetence of British officers was not a reason that made the sepoys of the East India Company rebellious. In fact, it was on the strength of these officers’ capability that the British government captured most of India in about 100 years. Apart from this, all the other reasons contributed to making the sepoys rebellious."}],"xref":null},{"n":39,"g":null,"stem":[{"type":"p","text":"Which of the following statements is correct?"}],"opts":[{"k":"a","t":"In 1857 the Maharajas of Darbhanga, Dumraon and Hatwa and their fellow landlords helped the British with men and money"},{"k":"b","t":"In 1857 the Maharajas of Darbhanga, Dumraon and Hatwa and their fellow landlords helped the British with men, not money"},{"k":"c","t":"In 1857 the Maharajas of Darbhanga, Dumraon and Hatwa and their fellow landlords helped the British with money not men"},{"k":"d","t":"In 1857, the Maharajas of Darbhanga, Dumraon and Hatwa and their fellow landlords opposed the British"}],"ans":"a","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the Revolt of 1857, some major zamindars of Bihar provided substantial help to the British with both money and men. Zamindars who helped the British in this manner included those of Darbhanga, Dumraon and Hatwa."}],"xref":null},{"n":40,"g":null,"stem":[{"type":"p","text":"Who led the revolt of 1857 in Bihar?"}],"opts":[{"k":"a","t":"Babu Amar Singh"},{"k":"b","t":"Hare Krishna Singh"},{"k":"c","t":"Kunwar Singh"},{"k":"d","t":"Raja Shahzada Singh"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1857, the revolt at Jagdishpur was led by Kunwar Singh, who belonged to Arrah (Bhojpur district) in Bihar. He raised the banner of revolt against the British. Nature had endowed him with indomitable courage, bravery, and the ideal qualities of a military leader; therefore, he is rightly regarded as the “Lion of Bihar” during the revolt. He overthrew British authority in the then Shahabad and established his own government. He moved towards Kalpi to help Nana Saheb for a joint attack on Kanpur. He carried the flame of revolt to Rohtas, Mirzapur, Rewa, Banda and Lucknow, where he was welcomed with great respect. As his final success, he badly defeated the British near his hometown Jagdishpur. During this battle, he was severely injured after being defeated by the British commander William Taylor, and he attained martyrdom on 26 April, 1858. However, in some sources the date of his death is given as 9 May, 1858, which is erroneous."}],"xref":null},{"n":41,"g":null,"stem":[{"type":"p","text":"Where did Kunwar Singh join the Rebellion of 1857 against the British?"}],"opts":[{"k":"a","t":"Arrah"},{"k":"b","t":"Patna"},{"k":"c","t":"Bettiah"},{"k":"d","t":"Varanasi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1857, the revolt at Jagdishpur was led by Kunwar Singh, who belonged to Arrah (Bhojpur district) in Bihar. He raised the banner of revolt against the British. Nature had endowed him with indomitable courage, bravery, and the ideal qualities of a military leader; therefore, he is rightly regarded as the “Lion of Bihar” during the revolt. He overthrew British authority in the then Shahabad and established his own government. He moved towards Kalpi to help Nana Saheb for a joint attack on Kanpur. He carried the flame of revolt to Rohtas, Mirzapur, Rewa, Banda and Lucknow, where he was welcomed with great respect. As his final success, he badly defeated the British near his hometown Jagdishpur. During this battle, he was severely injured after being defeated by the British commander William Taylor, and he attained martyrdom on 26 April, 1858. However, in some sources the date of his death is given as 9 May, 1858, which is erroneous."}],"xref":40},{"n":42,"g":null,"stem":[{"type":"p","text":"The king of Jagdishpur was"}],"opts":[{"k":"a","t":"Nana Saheb"},{"k":"b","t":"Tatya Tope"},{"k":"c","t":"Lakshmi Bai"},{"k":"d","t":"Kunwar Singh"}],"ans":"d","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1857, the revolt at Jagdishpur was led by Kunwar Singh, who belonged to Arrah (Bhojpur district) in Bihar. He raised the banner of revolt against the British. Nature had endowed him with indomitable courage, bravery, and the ideal qualities of a military leader; therefore, he is rightly regarded as the “Lion of Bihar” during the revolt. He overthrew British authority in the then Shahabad and established his own government. He moved towards Kalpi to help Nana Saheb for a joint attack on Kanpur. He carried the flame of revolt to Rohtas, Mirzapur, Rewa, Banda and Lucknow, where he was welcomed with great respect. As his final success, he badly defeated the British near his hometown Jagdishpur. During this battle, he was severely injured after being defeated by the British commander William Taylor, and he attained martyrdom on 26 April, 1858. However, in some sources the date of his death is given as 9 May, 1858, which is erroneous."}],"xref":41},{"n":43,"g":null,"stem":[{"type":"p","text":"Which person of Jagdishpur led the revolutionaries in the uprising of 1857?"}],"opts":[{"k":"a","t":"Kunwar Singh"},{"k":"b","t":"Chandrashekhar"},{"k":"c","t":"Teerat Singh"},{"k":"d","t":"Ram Singh"}],"ans":"a","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1857, the revolt at Jagdishpur was led by Kunwar Singh, who belonged to Arrah (Bhojpur district) in Bihar. He raised the banner of revolt against the British. Nature had endowed him with indomitable courage, bravery, and the ideal qualities of a military leader; therefore, he is rightly regarded as the “Lion of Bihar” during the revolt. He overthrew British authority in the then Shahabad tem":[{"type":"p","text":"Who said, \"Wherever I am, there is Jagdishpur\"?"}],"opts":[{"k":"a","t":"Amar Singh"},{"k":"b","t":"Jhansi ki Rani"},{"k":"c","t":"Kunwar Singh"},{"k":"d","t":"General Lloyd"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"During the Revolt of 1857, the 80-year-old Babu Kunwar Singh of Jagdishpur in Shahabad district of Bihar led the revolt in the state. During this revolt, Kunwar Singh said, “I am wherever I am, Jagdishpur is there.” After his death, his brother Amar Singh took over the leadership of the revolt and continued the struggle till December, 1858. Finally, William Taylor and Vincent Eyre suppressed the revolt."}],"xref":null},{"n":54,"g":null,"stem":[{"type":"p","text":"Which part of Bihar was unaffected by the revolt of 1857?"},{"type":"list","items":["(i) Danapur (ii) Patna","(iii) Arrah (iv) Muzaffarpur","(v) Munger"]},{"type":"p","text":"Choose the correct answer from the code given below:"}],"opts":[{"k":"a","t":"iv and v"},{"k":"b","t":"Only v"},{"k":"c","t":"Only iv"},{"k":"d","t":"iii, iv and v"}],"ans":"b","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Revolt of 1857 in Bihar, Arrah (present-day headquarters of Bhojpur district), Danapur, Patna and Muzaffarpur were the major centres of the revolt. In Patna, Pir Ali (a bookseller) led the rebels. The rural population working against British rule supported the rebel sepoys. Munger remained unaffected by the Revolt of 1857."}],"xref":null},{"n":55,"g":null,"stem":[{"type":"p","text":"Fill in the blank: In ......... the rights of the tenants on land in Bengal and Bihar were given by the Bengal Tenancy Act."}],"opts":[{"k":"a","t":"1885"},{"k":"b","t":"1886"},{"k":"c","t":"1889"},{"k":"d","t":"1900"}],"ans":"a","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–5 atma Gandhi in Lucknow and requested him to come to Champaran. After reaching Champaran, Gandhiji launched a satyagraha against the Tinkathia system of indigo cultivation."}],"xref":null},{"n":96,"g":null,"stem":[{"type":"p","text":"The cook from Bihar who saved Mahatma Gandhi’s life from a murder attempt by food poisoning in 1917 was"}],"opts":[{"k":"a","t":"Muzaffar Ahmad"},{"k":"b","t":"Batak Miyan"},{"k":"c","t":"Mir Bakawal"},{"k":"d","t":"None of them"}],"ans":"b","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Champaran Satyagraha, the indigo plantation manager W.S. Irwin invited Gandhiji to dinner. He instructed his cook Batak Miyan to serve poisoned milk to Gandhiji, but Batak Miyan did not follow the order and informed Gandhiji about the truth of the poisoned milk. Dr. Rajendra Prasad was a witness to this incident."}],"xref":null},{"n":97,"g":null,"stem":[{"type":"p","text":"Who saved the life of Gandhiji during Champaran Satyagraha?"}],"opts":[{"k":"a","t":"Ravindra Pathak"},{"k":"b","t":"Batak Miyan"},{"k":"c","t":"Hamid Ansari"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Champaran Satyagraha, the indigo plantation manager W.S. Irwin invited Gandhiji to dinner. He instructed his cook Batak Miyan to serve poisoned milk to Gandhiji, but Batak Miyan did not follow the order and informed Gandhiji about the truth of the poisoned milk. Dr. Rajendra Prasad was a witness to this incident."}],"xref":96},{"n":98,"g":null,"stem":[{"type":"p","text":"In the Tinkathia system in Bihar, what part of the land was kept in trust for the cultivation of indigo?"}],"opts":[{"k":"a","t":"01/10"},{"k":"b","t":"01/03"},{"k":"c","t":"03/20"},{"k":"d","t":"03/25"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the Tinkathia system, the farmers of the Champaran region of Bihar were compelled to cultivate indigo on 3/20th of their land. At the invitation of Rajkumar Shukla of Champaran during the annual session of the Congress held in Lucknow in 1916, Mahatma Gandhi came to Champaran in April 1917. Later, the government was compelled to constitute the “Champaran Agrarian Inquiry Committee” or Champaran Inquiry Committee to survey the condition of the farmers, and Mahatma Gandhi himself was a member of this committee. On the recommendations of this committee, the government abolished the Tinkathia system and refunded 25 percent of the illegally collected money to the farmers."}],"xref":null},{"n":99,"g":null,"stem":[{"type":"p","text":"Who founded the Jamshedpur Labour Association in 1920?"}],"opts":[{"k":"a","t":"S.N. Haldar"},{"k":"b","t":"Vyomkesh Chakravarti"},{"k":"c","t":"Ramesh Pal"},{"k":"d","t":"Swami Vishwanand"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["65th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Jamshedpur Labour Association was founded on 5 March, 1920 with the cooperation of Surendranath Haldar and Vyomkesh Chakravarti. It began with the workers of the Tata iron and steel industry established in Jamshedpur."}],"xref":null},{"n":100,"g":null,"stem":[{"type":"p","text":"When was Patna Lawn renamed as Gandhi Maidan?"}],"opts":[{"k":"a","t":"During Quit India Movement"},{"k":"b","t":"During Anti-Simon Commission Rally"},{"k":"c","t":"During Champaran Satyagraha"},{"k":"d","t":"On the eve of Independence of India"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Gandhi Maidan is a historic ground located in Patna, the capital of Bihar. Before 1948, it was known as “Patna Lawn”. After the Champaran Satyagraha, a massive public meeting of Mahatma Gandhi was held here in May, 1918. As a memorial, the tallest (72 feet) statue of Mahatma Gandhi was installed here in 2013. It is noteworthy that after the death of Mahatma Gandhi (30 January, 1948), Patna Lawn was renamed as “Gandhi Maidan”. Therefore, the correct answer to this question should be option (e), whereas the Bihar Public Service Commission gave option (d) as the answer."}],"xref":null},{"n":101,"g":null,"stem":[{"type":"p","text":"Which lawyer from Bihar gave up his lucrative legal practice during the Non-Cooperation Movement?"}],"opts":[{"k":"a","t":"Jayaprakash Narayan"},{"k":"b","t":"Rajendra Prasad"},{"k":"c","t":"Sahajanand Saraswati"},{"k":"d","t":"Rajkumar Shukla"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Rajendra Prasad gave up his lucrative legal practice to join the Non-Cooperation Movement (1920–22). Rajendra Prasad wrote a book titled India Divided."}],"xref":null},{"n":102,"g":null,"stem":[{"type":"p","text":"One of the popular beliefs in Bihar during the Non-Cooperation Movement of 1920-22 was that they would be victorious because Gandhi?"}],"opts":[{"k":"a","t":"Was the epitome of Dharma"},{"k":"b","t":"Was an accomplished politician"},{"k":"c","t":"Knew the ways to defeat the English"},{"k":"d","t":"Knew English"}],"ans":"*","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1918, Gandhiji successfully led the strike of mill workers in Ahmedabad, Gujarat, and in 1920 he launched non-violent non-cooperation with the British government. This included not only the boycott of goods, but also the boycott of institutions run by the British in India or run with their support—such as the legislature, courts, offices, or schools. This programme infused enthusiasm across the country, and the Non-Cooperation Movement shook the very foundations of British rule. Gandhiji also brought Hindus and Muslims together on a common platform. Due to the rise of Gandhiji as a great personality and the fear created among British rulers because of his actions, the people of Bihar developed the belief that victory would be theirs, because Gandhiji knew the way to defeat the British. The Bihar Public Service Commission considered option (a) as the answer in its preliminary answer key, but later deleted this question in the final answer key."}],"xref":null},{"n":103,"g":null,"stem":[{"type":"p","text":"Gandhiji's Non-Cooperation Movement urged people to avoid alcohol. This resulted in a serious loss of revenue for the government. The government of a province circulated a list of prominent individuals who drank alcohol as a device to persuade people to start drinking again. Name the province."}],"opts":[{"k":"a","t":"Andhra Pradesh"},{"k":"b","t":"Bihar"},{"k":"c","t":"Bombay"},{"k":"d","t":"Gujarat"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["64th B.P.S.C.(Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"As a result of Gandhiji’s Non-Cooperation Movement, when people abstained from alcohol, government revenue fell sharply. Therefore, the provincial government of Bihar and Orissa issued a list of such famous and great personalities who consumed alcohol, in order to publicize and promote its health benefits. This list included Alexander, Julius Caesar, Napoleon, Shakespeare, etc."}],"xref":null},{"n":104,"g":null,"stem":[{"type":"p","text":"Who left Patna College with just 20 days remaining for his examination during....... the Non-Cooperation Movement?"}],"opts":[{"k":"a","t":"Rajendra Prasad"},{"k":"b","t":"Braj Kishore"},{"k":"c","t":"Jai Prakash Narayan"},{"k":"d","t":"Sri Krishna Sinha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jayaprakash Narayan, a freedom fighter born in the Saran district of Bihar, left Patna College during the Non-Cooperation Movement when only 20 days were left for his examination. Thereafter, he took admission in Bihar Vidyapeeth established by Mahatma Gandhi."}],"xref":null},{"n":105,"g":null,"stem":[{"type":"p","text":"Who led the farmers in Bihar during the Non-Cooperation Movement?"}],"opts":[{"k":"a","t":"Swami Vidyanand"},{"k":"b","t":"Rajkumar Shukla"},{"k":"c","t":"Shri Krishna Singh"},{"k":"d","t":"J.B. Sen"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"‘Swami Vidyanand’ was a peasant leader of Bihar. During the Non-Cooperation Movement (1920–22 A.D.), Swami Vidyanand led the peasants in Bihar, especially in several districts of North Bihar. Particularly in the Darbhanga region, Swami Vidyanand was making the tenants (raiyats) aware of their rights."}],"xref":null},{"n":106,"g":null,"stem":[{"type":"p","text":"Who led the farmers in Bihar during the Non-Cooperation Movement?"}],"opts":[{"k":"a","t":"Shri Krishna Singh"},{"k":"b","t":"Swami Vidyanand"},{"k":"c","t":"Rajkumar Shukla"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"‘Swami Vidyanand’ was a peasant leader of Bihar. During the Non-Cooperation Movement (1920–22 A.D.), Swami Vidyanand led the peasants in Bihar, especially in several districts of North Bihar. Particularly in the Darbhanga region, Swami Vidyanand was making the tenants (raiyats) aware of their rights."}],"xref":105},{"n":107,"g":null,"stem":[{"type":"p","text":"During the Non-Cooperation Movement, who led the peasants in Bihar?"}],"opt 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The 16th session of the Bihari Students’ Conference (Bihari Students’ Conference) was held in Hazaribagh in October 1921. This session was presided over by Sarala Devi."}],"xref":109},{"n":111,"g":null,"stem":[{"type":"p","text":"Who organized Kisan Sabha at Munger in 1922-23?"}],"opts":[{"k":"a","t":"Swami Sahajanand Saraswati"},{"k":"b","t":"Shri Krishna Singh"},{"k":"c","t":"Mohammad Jubair"},{"k":"d","t":"K. N. Singh"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"With the objective of organizing peasants in Bihar, the ‘Kisan Sabha’ was formed in Munger in 1922–23 by Shah Mohammad Jubair and Shri Krishna Singh. However, the peasant movement got a decisive turn when Swami Sahajanand Saraswati formally established the ‘Kisan Sabha’ on 4 March 1928. In 1929, Swami Sahajanand founded the ‘Bihar Provincial Kisan Sabha’ and became its first president."}],"xref":null},{"n":112,"g":null,"stem":[{"type":"p","text":"What was the purpose of Barhiyataal resistance in Munger?"}],"opts":[{"k":"a","t":"Demand of Bakast land restoration"},{"k":"b","t":"Muslim peasants might not be exploited"},{"k":"c","t":"Abolition of Zamindari custom"},{"k":"d","t":"Beginning of class struggle"}],"ans":"a","src":["39th B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["39th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The objective of the Barhiyatal protest in Munger was to demand the return of bakast land. This movement was led by Karyanand Sharma."}],"xref":null},{"n":113,"g":null,"stem":[{"type":"p","text":"Who formed the Swaraj Dal in Bihar?"}],"opts":[{"k":"a","t":"Shri Krishna Singh"},{"k":"b","t":"Ramlal Shah"},{"k":"c","t":"Bankim Chandra Mitra"},{"k":"d","t":"Sachindranath Sanyal"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the failure of the Non-Cooperation Movement, the Swaraj Party (Congress–Khilafat Swaraj Party) was formed in 1923 by C. R. Das and Motilal Nehru. C. R. Das became its president, and Motilal Nehru became its general secretary. A branch of the Swaraj Dal was formed in Bihar, and Shri Krishna Singh was made its leader."}],"xref":null},{"n":114,"g":null,"stem":[{"type":"p","text":"Who established Swaraj Dal in Bihar?"}],"opts":[{"k":"a","t":"Bankim Chandra Mitra"},{"k":"b","t":"Shri Krishna Singh"},{"k":"c","t":"Ramlal Shah"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the failure of the Non-Cooperation Movement, the Swaraj Party (Congress–Khilafat Swaraj Party) was formed in 1923 by C. R. Das and Motilal Nehru. C. R. Das became its president, and Motilal Nehru became its general secretary. A branch of the Swaraj Dal was formed in Bihar, and Shri Krishna Singh was made its leader."}],"xref":113},{"n":115,"g":null,"stem":[{"type":"p","text":"The Patna Yuvak Sangh was established in—"}],"opts":[{"k":"a","t":"1917"},{"k":"b","t":"1925"},{"k":"c","t":"1927"},{"k":"d","t":"1930"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Patna Yuvak Sangh was established in the year 1927, and it played an important role in promoting revolutionary activities in Bihar."}],"xref":null},{"n":116,"g":null,"stem":[{"type":"p","text":"Name the revolutionary from Bihar who attended the meeting of the Hindustan Socialist Republican Army in September, 1928–"}],"opts":[{"k":"a","t":"Phanindranath Ghosh"},{"k":"b","t":"Ajay Ghosh"},{"k":"c","t":"Jyotindranath"},{"k":"d","t":"Bhagat Singh"}],"ans":"a","src":["47th B  in 1934 at Patna in Bihar under the leadership of Jayaprakash Narayan."}],"xref":141},{"n":143,"g":null,"stem":[{"type":"p","text":"Who led the Ambari Satyagraha in 1939 in Bihar?"}],"opts":[{"k":"a","t":"Rahul Sankrityayan"},{"k":"b","t":"Yadunandan Sharma"},{"k":"c","t":"Swami Sahajanand"},{"k":"d","t":"Swami Yoganand"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1938–39, the ‘Ambari Satyagraha’ (Amwari Peasant Movement) in Bihar was led by Rahul Sankrityayan."}],"xref":null},{"n":144,"g":null,"stem":[{"type":"p","text":"During 1937-1938, the Bakasht Movement in Bihar was organized by whom?"}],"opts":[{"k":"a","t":"Pir Ali Khan"},{"k":"b","t":"Swami Dayanand Saraswati"},{"k":"c","t":"Jayaprakash Narayan"},{"k":"d","t":"Swami Sahajanand Saraswati"}],"ans":"d","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During 1937–38, the main leader of the Bakasht Movement in Bihar was Swami Sahajanand Saraswati. Bakasht means “cultivated by the cultivator (tenant) himself.” Generally, landlords used to evict cultivators from Bakasht land. During this movement, peasants struggled against eviction."}],"xref":null},{"n":145,"g":null,"stem":[{"type":"p","text":"In 1930 and 1931 in which district did the Barahi Congress successfully make the British rule functionless?"}],"opts":[{"k":"a","t":"Madhubani"},{"k":"b","t":"Bhagalpur"},{"k":"c","t":"Gaya"},{"k":"d","t":"Munger"}],"ans":"d","src":["39th B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["39th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Between 1930 and 1932, the Barhi (Barahia) Congress successfully foiled British rule in Munger district."}],"xref":null},{"n":146,"g":null,"stem":[{"type":"p","text":"Who was murdered while hoisting the national flag under the area of Bikram Police Station?"}],"opts":[{"k":"a","t":"Raghunath Singh of Gorakhari"},{"k":"b","t":"Ram Narain of Bikrampur"},{"k":"c","t":"Satyendra of Gorakhari"},{"k":"d","t":"None of the above"}],"ans":"d","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Under the Bikram Police Station, while hoisting the national flag, Rang Nath Sharma alias Raghunath Sharma was shot dead by the police on 17 August, 1942."}],"xref":null},{"n":147,"g":null,"stem":[{"type":"p","text":"The news of Gandhi and other Congress leaders arrest in 1942, a riot in Bihar took place, leading to a total breakdown in the rail services. The most affected area was :"}],"opts":[{"k":"a","t":"Munger"},{"k":"b","t":"Gaya"},{"k":"c","t":"Patna"},{"k":"d","t":"Shahabad"}],"ans":"a","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Quit India Movement of 1942, Gandhiji and major Congress leaders were arrested. To suppress the movement, the police launched repression. Angered by this repression, people carried out violent actions at many places and attacked police stations, railway stations, and post offices. Railway tracks were uprooted, and railway services came to a complete halt. In this regard, Madras and Bengal were the most affected. In Bihar too, violent incidents occurred at many places, in which Patna was the most affected."}],"xref":null},{"n":148,"g":null,"stem":[{"type":"p","text":"On the outbreak of 1942, the people proclaimed the establishment of a National Government under Siyaram Singh at"}],"opts":[{"k":"a","t":"Patna"},{"k":"b","t":"Bhagalpur"},{"k":"c","t":"Champaran"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["B.P.S.C. School Teacher 07-12-2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"During the Quit India Movement of 1942, under the leadership of Siyaram Singh, the establishment of a National Government was announced at Bhagalpur (Bihar)."}],"xref":null},{"n":149,"g":null,"stem":[{"type":"p","text":"Who guided the Quit India Movement in Patna city on August 11, 1942?"}],"opts":[{"k":"a","t":"Zamindars"},{"k":"b","t":"Mukhias"},{"k":"c","t":"By rickshaw pullers and ekk drivers"},{"k":"d","t":"By the city ordinary citizen"},{"k":"e","t":"None of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"On 11 August, 1942, the Quit India Movement in Patna city (Bihar) was guided by the city’s ordinary citizens. During this period, nationalist youths attempted to hoist the national flag on the Secretariat building in Patna. The Patna Collector, W. G. Archer, ordered firing on these students, in which seven students were killed and many were injured."}],"xref":null},{"n":150,"g":null,"stem":[{"type":"p","text":"In 1942, Bihar's leaders made significant contributions to the Quit India Movement. Which prominent leader from Bihar was known as 'Bihar Kesari' and actively participated in the Quit India Movement?"}],"opts":[{"k":"a","t":"Ram Manohar Lohia"},{"k":"b","t":"Dr. Rajendra Prasad"},{"k":"c","t":"Shri Krishna Singh"},{"k":"d","t":"Anugrah Narayan Sinha"}],"ans":"c","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shri Krishna Singh was the first Chief Minister of British Bihar. He was elected as the Premier of Bihar in the first Congress ministry in 1937. Shri Krishna Singh was also known as “Bihar Kesari.” He was among the major leaders of the Quit India Movement in 1942."}],"xref":null},{"n":151,"g":null,"stem":[{"type":"p","text":"Dr. Rajendra Prasad was arrested on 9th August, 1942 and was sent to :"}],"opts":[{"k":"a","t":"Camp Jail"},{"k":"b","t":"Hazaribag Jail"},{"k":"c","t":"Bhagalpur Jail"},{"k":"d","t":"Bankipur Jail"}],"ans":"d","src":["48th to 52nd B.P.S.C. (Pre) 2008","43rd B.P.S.C. (Pre) 1999"],"yr":2008,"fam":["43rd B.P.S.C. (Pre)","48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 9 August, 1942, Gandhiji and other prominent Congress leaders were taken into custody. Gandhiji and Sarojini Naidu were detained at Aga Khan Palace in Poona, and members of the Congress Working Committee (Jawaharlal Nehru, Abul Kalam Azad, Govind Ballabh Pant, Dr. Prafulla Chandra Ghosh, Dr. Pattabhi Sitaramayya, Dr. Syed Mahmud, Acharya J. B. Kripalani, etc.) were kept at Ahmednagar Fort. Since Rajendra Prasad, a member of the Congress Working Committee, had not gone to Bombay, he was arrested in Patna itself and detained in Bankipur Jail."}],"xref":null},{"n":152,"g":null,"stem":[{"type":"p","text":"Where was Shri Yogendra Shukla brought on the 7th December, 1942?"}],"opts":[{"k":"a","t":"Ranchi"},{"k":"b","t":"Munger"},{"k":"c","t":"Patna"},{"k":"d","t":"Bhagalpur"}],"ans":"c","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Yogendra Shukla was a prominent socialist freedom fighter and a close associate of Jayaprakash Narayan. He was also associated with the incident of Jayaprakash Narayan’s escape from Hazaribagh Jail. However, he was soon arrested at Muzaffarpur, and on 7 December, 1942, he was brought to Patna."}],"xref":null},{"n":153,"g":null,"stem":[{"type":"p","text":"Jagat Narayan Lal was sent to :"}],"opts":[{"k":"a","t":"Bankipur Jail"},{"k":"b","t":"Camp Jail"},{"k":"c","t":"Bhagalpur Jail"},{"k":"d","t":"Hazaribagh Jail"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jagat Narayan Lal was a well-known freedom fighter, a close associate of Jayaprakash Narayan, and a prominent leader of the Quit India Movement of 1942. During this period, he was arrested and sent to Bankipur Jail."}],"xref":null},{"n":154,"g":null,"stem":[{"type":"p","text":"Who was the wife of Mr. Jagat Narayan Lal?"}],"opts":[{"k":"a","t":"Mrs. Rampyari"},{"k":"b","t":"Mrs. Sundari Devi"},{"k":"c","t":"Mrs. Bhagawati Devi"},{"k":"d","t":"Mrs. Mangala Devi"}],"ans":"a",
