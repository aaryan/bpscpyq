"src":["37th B.P.S.C. (Pre) 1991"],"yr":1991,"fam":["37th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The name of Shri Jagat Narayan Lal’s wife was Rampyari Devi. During the Quit India Movement, Rampyari Devi addressed a meeting at Congress Maidan (Patna) and called upon people to leave government jobs."}],"xref":null},{"n":155,"g":null,"stem":[{"type":"p","text":"In 1942 AD, on the occasion of which festival Jay Prakash Narayan escaped from Hazaribagh jail?"}],"opts":[{"k":"a","t":"Baisakhi"},{"k":"b","t":"Holi"},{"k":"c","t":"Dussehra"},{"k":"d","t":"Deepawali"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Quit India Movement, Jayaprakash Narayan escaped from Hazaribagh Jail along with his companions on the day of Diwali in November 1942."}],"xref":null},{"n":156,"g":null,"stem":[{"type":"p","text":"Who among the following escaped from Hazaribagh Jail during the Quit India Movement?"}],"opts":[{"k":"a","t":"Sachchidanand Sinha"},{"k":"b","t":"Jay Prakash Narayan"},{"k":"c","t":"Jagjivan Ram"},{"k":"d","t":"Rafi Ahmed Kidwai"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Quit India Movement, Jayaprakash Narayan escaped from Hazaribagh Jail along with his companions on the day of Diwali in November 1942."}],"xref":155},{"n":157,"g":null,"stem":[{"type":"p","text":"On 9th August, 1942 the two arrested leaders of Hazaribag were"}],"opts":[{"k":"a","t":"Ramlal and Devilal"},{"k":"b","t":"Narayan Singh and Sukhlal Singh"},{"k":"c","t":"Ramnath and Devnath"},{"k":"d","t":"Shiv Kumar and Ramanand"}],"ans":"d","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Quit India Movement began on 9 August, 1942. On 9 August, 1942, Gandhiji and major Congress leaders were arrested. During this period, Shivkumar and Ramanand were arrested in Hazaribagh."}],"xref":null},{"n":158,"g":null,"stem":[{"type":"p","text":"In which context did Jay Prakash Narayan get the recognition of a national leader?"}],"opts":[{"k":"a","t":"Quit India Movement"},{"k":"b","t":"Establishment of Congress Socialist Party"},{"k":"c","t":"Bhoodan Movement"},{"k":"d","t":"Making the member of Congress Executive Committee"}],"ans":"a","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jayaprakash Narayan gained recognition as a national-level leader during the Quit India Movement. In fact, on the very day the movement began (9 August, 1942), major Congress leaders were arrested. Those Congress leaders who could not be arrested gave underground directions to the scattered masses. Prominent among them were Jayaprakash Narayan, Ram Manohar Lohia, and Aruna Asaf Ali."}],"xref":null},{"n":159,"g":null,"stem":[{"type":"p","text":"During which Movement 'Azad Dasta' was active in Bihar?"}],"opts":[{"k":"a","t":"Champaran Satyagraha"},{"k":"b","t":"Non-Cooperation Movement"},{"k":"c","t":"Civil Disobedience Movement"},{"k":"d","t":"Quit India Movement"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["67th B.P.S.C. (Re-Exam) (Pre)-2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the Quit India Movement, after escaping from jail, Jayaprakash Narayan formed ‘Azad Dasta’ in Nepal and led the movement."}],"xref":null},{"n":160,"g":null,"stem":[{"type":"p","text":"Prabhavati Devi was a freedom fighter from which region?"}],"opts":[{"k":"a","t":"Champaran"},{"k":"b","t":"Patna"},{"k":"c","t":"Bhagalpur"},{"k":"d","t":"Shahabad"}],"ans":"b","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the freedom struggle, women in Bihar made an important contribution. Among them, Prabhavati Devi, Rajvanshi Devi, Suniti Devi, and Radhika Devi were prominent. Prabhavati Devi was a freedom fighter from Patna."}],"xref":null},{"n":161,"g":null,"stem":[{"type":"p","text":"Which title was given to Jayaprakash Narayan?"}],"opts":[{"k":"a","t":"Praja Hitecchu"},{"k":"b","t":"Loknayak"},{"k":"c","t":"Lokmanya"},{"k":"d","t":"Rashtranayak"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jayaprakash Narayan is also known as ‘Loknayak’. In 1942, during the Quit India Movement, he, along with Dr. Ram Manohar Lohia and Aruna Asaf Ali, organized the Indian masses through underground activities. On 5 June 1974, he gave the call for “Total Revolution” at Gandhi Maidan, Patna. In 1999, he was awarded the Bharat Ratna (India’s highest civilian award) posthumously."}],"xref":null},{"n":162,"g":null,"stem":[{"type":"p","text":"By which name is Jay Prakash Narayan known?"}],"opts":[{"k":"a","t":"Lokmanya"},{"k":"b","t":"Loknayak"},{"k":"c","t":"Lokhitvadi"},{"k":"d","t":"Lokneta"}],"ans":"b","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jayaprakash Narayan is also known as ‘Loknayak’. In 1942, during the Quit India Movement, he, along with Dr. Ram Manohar Lohia and Aruna Asaf Ali, organized the Indian masses through underground activities. On 5 June 1974, he gave the call for “Total Revolution” at Gandhi Maidan, Patna. In 1999, he was awarded the Bharat Ratna (India’s highest civilian award) posthumously."}],"xref":161},{"n":163,"g":null,"stem":[{"type":"p","text":"Who is known as “Loknayak”?"}],"opts":[{"k":"a","t":"Mahatma Gandhi"},{"k":"b","t":"Subhash Chandra Bose"},{"k":"c","t":"Jay Prakash Narayan"},{"k":"d","t":"Bal Gangadhar Tilak"}],"ans":"c","src":["46th B.P.S.C. (Pre) 2004"],"yr":2004,"fam":["46th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Jayaprakash Narayan is also known as ‘Loknayak’. In 1942, during the Quit India Movement, he, along with Dr. Ram Manohar Lohia and Aruna Asaf Ali, organized the Indian masses through underground activities. On 5 June 1974, he gave the call for “Total Revolution” at Gandhi Maidan, Patna. In 1999, he was awarded the Bharat Ratna (India’s highest civilian award) posthumously."}],"xref":162},{"n":164,"g":null,"stem":[{"type":"p","text":"Jay Prakash Diwas was celebrated in:"}],"opts":[{"k":"a","t":"January, 1946"},{"k":"b","t":"February, 1946"},{"k":"c","t":"March, 1946"},{"k":"d","t":"April, 1946"}],"ans":"d","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In April, 1946, ‘Jayaprakash Day’ was observed to demand the release of Jayaprakash Narayan. A public meeting was held at Bankipur Maidan, Patna, in which the government policy of keeping political prisoners in jail was criticized and Jayaprakash’s release was demanded."}],"xref":null},{"n":165,"g":null,"stem":[{"type":"p","text":"What was Shri Narasingh Narayan?"}],"opts":[{"k":"a","t":"Socialist"},{"k":"b","t":"Nationalist"},{"k":"c","t":"Internationalist"},{"k":"d","t":"Communist"}],"ans":"a","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shri Narasingh Narayan Singh was a socialist."}],"xref":null},{"n":166,"g":null,"stem":[{"type":"p","text":"Who joined Subhas Chandra Bose to found the All India Forward Bloc and actively associated with the INA movement?"}],"opts":[{"k":"a","t":"Jay Prakash Narayan"},{"k":"b","t":"Baikunth Shukla"},{"k":"c","t":"Sheel Bhadra Yajee"},{"k":"d","t":"Ram Narain Prasad"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Sheelbhadra Yajee was a freedom fighter from Bihar, who was associated with Mahatma Gandhi and Subhash Chandra Bose. Yajee joined Subhash Chandra Bose for the establishment of the All India Forward Bloc and also remained associated with the I.N.A. movement."}],"xref":null},{"n":167,"g":null,"stem":[{"type":"p","text":"Which village was Ramchandra Sharma from?"}],"opts":[{"k":"a","t":"Gogri"},{"k":"b","t":"Indrapur"},{"k":"c","t":"Pema"},{"k":"d","t":"Amhara"}],"ans":"d","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Ramchandra Sharma was a resident of Amhara (Patna). He was a prominent leader of the Forward Bloc in Bihar."}],"xref":null},{"n":168,"g":null,"stem":[{"type":"p","text":"When was the Patna College established?"}],"opts":[{"k":"a","t":"1859"},{"k":"b","t":"1861"},{"k":"c","t":"1863"},{"k":"d","t":"None of the above"}],"ans":"c","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Patna College was established in 1863 A.D. It is known as the oldest institution of higher education in Bihar, and it is important both historically and academically."}],"xref":null},{"n":169,"g":null,"stem":[{"type":"p","text":"In 1940, Patna Women's College was established by which of the following societies?"}],"opts":[{"k":"a","t":"Sisters of the Apostolic Carmel"},{"k":"b","t":"Society of Jesus"},{"k":"c","t":"Irish Christian Brothers"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Patna Women’s College is the first institution of higher education in Bihar opened to meet the educational needs of women. Bishop B. J. Sullivan, S.J., the Bishop of Patna (founder), and Mother M. Josephine, A.C., the Superior General of the Apostolic Carmel, named it Patna Women’s College and presented it as a gift for the women of Bihar. At present, Patna Women’s College is run by the Sisters of the Apostolic Carmel. The Apostolic Carmel was founded in 1868 in France, and in India it was established in 1870."}],"xref":null},{"n":170,"g":null,"stem":[{"type":"p","text":"Who laid the foundation stone of National College and Bihar Vidyapith?"}],"opts":[{"k":"a","t":"Dr. Rajendra Prasad"},{"k":"b","t":"Maulana Abdul Bari"},{"k":"c","t":"Mahatma Gandhi"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"c","src":["B.P.S.C. Teacher (9th-10th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"Mahatma Gandhi laid the foundation stone of National College and Bihar Vidyapith. Bihar Vidyapith was inaugurated by Gandhiji in February, 1921."}],"xref":null},{"n":171,"g":null,"stem":[{"type":"p","text":"In Bihar though 'Zamindari' was statutorily abolished in 1952, the social base of land control remained in the grip of"}],"opts":[{"k":"a","t":"Middle Caste Hindus"},{"k":"b","t":"Scheduled Caste Hindus"},{"k":"c","t":"Dominant Caste Hindus"},{"k":"d","t":"Scheduled Tribe Hindus"}],"ans":"c","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 1950, the Bihar government passed the “Bihar Land Reforms Act”, whose validity was upheld by the Supreme Court (except sections 4(b) and 23(F). Amendments were made in 1954 and 1959. However, the Act had certain provisions under which a large portion of land could be retained by the landlords for purposes such as house, garden, pond, library, business, etc. Moreover, due to slow implementation of the law, control over land continued to remain with the dominant castes."}],"xref":null},{"n":172,"g":null,"stem":[{"type":"p","text":"Who is considered the creator of modern Bihar?"}],"opts":[{"k":"a","t":"Sachchidananda Sinha"},{"k":"b","t":"Kumar Kalika Prasad Sinha"},{"k":"c","t":"Sir Ganesh Singh"},{"k":"d","t":"Acharya Narendra Dev"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Sachchidanand Sinha was a noted Indian politician, educationist, lawyer, and journalist. He is regarded as the “maker of modern Bihar.” He was the driving force behind the movement for the separation of Bihar from Bengal, and the formation of the Bihar and Orissa Province was the result of his tireless efforts. Sachchidanand Sinha was made the temporary President of the Constituent Assembly. The first meeting of the Constituent Assembly was held on 9 December, 1946 in the Central Hall of the Parliament House under the chairmanship of Sachchidanand Sinha. Besides this, Bihar’s first Chief Minister Dr. Shri Krishna Singh is also called the “Creator of Modern Bihar.”"}],"xref":null},{"n":173,"g":null,"stem":[{"type":"p","text":"Sachchidananda Sinha was associated with :"}],"opts":[{"k":"a","t":"Quit India Movement"},{"k":"b","t":"Dandi March"},{"k":"c","t":"Civil Disobedience Movement"},{"k":"d","t":"None of these"}],"ans":"d","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Sachchidananda Sinha was not associated with any of the above movements. He was unanimously chosen as the temporary chairman at the first sitting of the Constituent Assembly (9 December, 1946)."}],"xref":null},{"n":174,"g":null,"stem":[{"type":"p","text":"Which one of the following was not a dominant caste in pre-independence Bihar?"}],"opts":[{"k":"a","t":"Bhumihar"},{"k":"b","t":"Rajput"},{"k":"c","t":"Kayastha"},{"k":"d","t":"Kurmi"}],"ans":"d","src":["46th B.P.S.C. (Pre) 2004"],"yr":2004,"fam":["46th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In pre-independence Bihar, Bhumihars, Rajputs and Kayasthas were dominant castes, whereas the Kurmi caste was not dominant."}],"xref":null},{"n":175,"g":null,"stem":[{"type":"p","text":"“It will be our blunder if we leave the people of Bihar and their Government unsafe before the violence and uncivilized attacks of League leaders.” In the year 1946 who told this?"}],"opts":[{"k":"a","t":"Mahatma Gandhi"},{"k":"b","t":"Jawahar Lal Nehru"},{"k":"c","t":"Rajendra Prasad"},{"k":"d","t":"Sardar Patel"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The statement in the question was made by Sardar Patel in 1946 during the communal riots in Bihar."}],"xref":null}]},{"title":"Political Scenario","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Where did Lord Sinha resign from the post of Governor in 1921?"}],"opts":[{"k":"a","t":"Bihar-Odisha"},{"k":"b","t":"Bengal"},{"k":"c","t":"Punjab"},{"k":"d","t":"Madras"}],"ans":"a","src":["53th to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Satyendra Prasanna Sinha was born on 24 March, 1863, at Raipur in Birbhum, Bengal. He was the first Indian to be appointed Advocate General of Bengal in 1905. His appointment to this post was confirmed in 1908. In 1920, he was appointed Governor of Bihar and Orissa, and he was the first Indian to obtain this post in administration. Due to health reasons, he resigned from his post in 1921. He died on 4 March, 1928."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"Who was the first Indian Governor of Bihar?"}],"opts":[{"k":"a","t":"Satyendra Prasanna Sinha"},{"k":"b","t":"Dr. Shri Krishna Singh"},{"k":"c","t":"Brij Kishor Prasad"},{"k":"d","t":"B. P. Mandal"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Satyendra Prasanna Sinha was born on 24 March, 1863, at Raipur in Birbhum, Bengal. He was the first Indian to be appointed Advocate General of Bengal in 1905. His appointment to this post was confirmed in 1908. In 1920, he was appointed Governor of Bihar and Orissa, and he was the first Indian to obtain this post in administration. Due to health reasons, he resigned from his post in 1921. He died on 4 March, 1928."}],"xref":1},{"n":3,"g":null,"stem":[{"type":"p","text":"Who among the following was the first Governor of Bihar?"}],"opts":[{"k":"a","t":"Sir Maurice Garnier Hallett"},{"k":"b","t":"Sir James David Sifton"},{"k":"c","t":"Sir Hugh Dow"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Sir James David Sifton served as Governor of Bihar and Odisha from 26 April, 1929 to 25 August, 1929; from 5 June, 1930 to 21 September, 1930; from 7 April, 1932 to 12 October, 1934; and again from 11 February, 1935 to 31 March, 1936. Thereafter, from 1 April, 1936 to 10 March, 1937, he served as Governor of Bihar. After the division of the Bihar and Odisha Province, he became the first Governor of Bihar. After him, Sir Maurice Garnier Hallett became the Governor of Bihar on 11 March, 1937."}],"xref":null},{"n":4,"g":null,"stem":[{"type":"p","text":"Who was the first elected Speaker of the Bihar Legislative Council under the Government of India Act, 1935?"}],"opts":[{"k":"a","t":"Rai Bahadur Satish Chandra"},{"k":"b","t":"Rajendra Prasad"},{"k":"c","t":"Rajiv Ranjan Sinha"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"c","src":["B.P.S.C. TRE-3 July 2024","70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)","B.P.S.C. TRE"],"expl":[{"type":"p","text":"Under the Government of India Act, 1935, the Bihar Legislative Council had 29 members. Under this, the members were elected indirectly, and some were also nominated. By order of the Governor, Rai Bahadur Satish Chandra Sinha became its Chairman. Later, Rajiv Ranjan Sinha (Rajiv Ranjan Prasad) was elected as Chairman."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Which of the following Acts converted the Unicameral Legislature of Bihar into Bicameral : Bihar Legislative Assembly and Bihar Legislative Council?"}],"opts":[{"k":"a","t":"Government of India Act 1919"},{"k":"b","t":"Government of India Act 1909"},{"k":"c","t":"Government of India Act 1935"},{"k":"d","t":"More than one of the above"}],"ans":"c","src":["70th B.P.S.C. Re-Exam 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On the basis of the provisions of the Government of India Act, 1935, Bihar and Odisha were separated and made two provinces, and provincial autonomy was introduced. Under the provisions of this Act, bicameral legislatures were established in six provinces (Madras, Bombay, Bengal, United Provinces, Bihar and Assam). Accordingly, Bihar’s unicameral legislature was converted into a bicameral legislature—the Bihar Legislative Assembly and the Bihar Legislative Council. Under this arrangement, the then existing Provincial Legislative Council was renamed as the Bihar Legislative Assembly, and the Bihar Legislative Council was constituted as the upper house."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"The first Indian Ministry in Bihar in 1937 came into existence under whose leadership?"}],"opts":[{"k":"a","t":"Shri Krishna Singh"},{"k":"b","t":"Md. Yunus"},{"k":"c","t":"G. S. Lal"},{"k":"d","t":"Wahab Ali"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The first Bihar ministry formed in 1937 was led by Muhammad Yunus (from 1 April 1937 to 19 July 1937). After this, Shri Krishna Singh took charge as the Premier of Bihar."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"Who became Chief Minister of Bihar in March 1939?"}],"opts":[{"k":"a","t":"Anugraha Narain Singh"},{"k":"b","t":"Rajendra Prasad"},{"k":"c","t":"Shri Krishna Singh"},{"k":"d","t":"None of the above"}],"ans":"d","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shri Krishna Singh remained the Premier (provincial head of government) of Bihar continuously from 20 July 1937 to 31 October 1939. March 1939 falls within this period; therefore, the head of government of Bihar at that time (in today’s terms, the Chief Minister) was Shri Krishna Singh. However, since the question uses the term “Chief Minister” instead of “Premier”, the Bihar Public Service Commission gave option (d) as the answer."}],"xref":null},{"n":8,"g":null,"stem":[{"type":"p","text":"Who among the following was the leader of the first Congress Ministry in Bihar?"}],"opts":[{"k":"a","t":"Anugrah Narayan Sinha"},{"k":"b","t":"Abdul Bari"},{"k":"c","t":"Jayaprakash Narayan"},{"k":"d","t":"Shri Krishna Sinha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shri Krishna Singh, also known as Shri Krishna Sinha, was the first Chief Minister of Bihar. He became the Premier of Bihar in the first Congress ministry formed in 1937. He served as Premier / Chief Minister from 20 July 1937 to 31 October 1939 and again from 02 January 1946 to 31 January 1961."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"Who was the first Chief Minister of Bihar?"}],"opts":[{"k":"a","t":"Shri Krishna Sinha"},{"k":"b","t":"Satya Pal Malik"},{"k":"c","t":"Nitish Kumar"},{"k":"d","t":"Rabri Devi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Shri Krishna Singh, also known as Shri Krishna Sinha, was the first Chief Minister of Bihar. He became the Premier of Bihar in the first Congress ministry formed in 1937. He served as Premier / Chief Minister from 20 July 1937 to 31 October 1939 and again from 02 January 1946 to 31 January 1961."}],"xref":8},{"n":10,"g":null,"stem":[{"type":"p","text":"The elected Government of Bihar resigned in February 1938 for which reason?"}],"opts":[{"k":"a","t":"The participation of India in war"},{"k":"b","t":"Satyagraha against the British at the call of Gandhi"},{"k":"c","t":"High taxes being imposed by the British"},{"k":"d","t":"For the release of political prisoners"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On the basis of the Government of India Act, 1935, provincial legislature elections were held in February, 1937. In July 1937, the Congress formed ministries in six provinces—Madras, Bombay, Central Provinces and Berar, Odisha, Bihar and the United Provinces. Later, Congress also formed ministries with allied parties in the North-West Frontier Province and Assam. In the 1936–37 elections, the release of political prisoners was one of the major issues for Congress. Congress governments in various provinces tried to release political prisoners, but the Governors opposed these efforts. As a result, the elected Congress governments of the United Provinces and Bihar resigned on 15 February, 1938."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"For what reason did the elected government of Bihar resign in February 1938?"}],"opts":[{"k":"a","t":"India's involvement in the war"},{"k":"b","t":"Satyagraha against the British at the call of Gandhi"},{"k":"c","t":"Heavy taxes imposed by the British"},{"k":"d","t":"Releasing political prisoners"},{"k":"e","t":"None of the above"}],"ans":"d","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On the basis of the Government of India Act, 1935, provincial legislature elections were held in February, 1937. In July 1937, the Congress formed ministries in six provinces—Madras, Bombay, Central Provinces and Berar, Odisha, Bihar and the United Provinces. Later, Congress also formed ministries with allied parties in the North-West Frontier Province and Assam. In the 1936–37 elections, the release of political prisoners was one of the major issues for Congress. Congress governments in various provinces tried to release political prisoners, but the Governors opposed these efforts. As a result, the elected Congress governments of the United Provinces and Bihar resigned on 15 February, 1938."}],"xref":10},{"n":12,"g":null,"stem":[{"type":"p","text":"Who was a member of the Constituent Assembly of India from Bihar?"}],"opts":[{"k":"a","t":"A. N. Sinha"},{"k":"b","t":"Rajendra Prasad"},{"k":"c","t":"Jagjivan Ram"},{"k":"d","t":"Shyam Nandan Prasad Mishra"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 9 December, 1946, Sachchidanand Sinha from Bihar was nominated as the temporary President of the Constituent Assembly. On 11 December 1946, Dr. Rajendra Prasad was elected as the first permanent President of the Constituent Assembly. From Bihar, 36 members were elected to the Constituent Assembly, among whom Anugrah Narayan Sinha, Rajendra Prasad, Jagjivan Ram, Sachchidanand Sinha, etc. were prominent."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"When did Baldev Sahay resign from the post of Advocate General?"}],"opts":[{"k":"a","t":"1942"},{"k":"b","t":"1943"},{"k":"c","t":"1913"},{"k":"d","t":"1911"}],"ans":"a","src":["48th to 52nd B.P.S.C. (Pre) 2008"],"yr":2008,"fam":["48th–52nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The failures of the August Offer (August 1940) and the Cripps Mission (1942) ultimately gave rise to the Quit India Movement. During this period, when the demand for the formation of a national government was rejected, the Wardha Resolution was reaffirmed at the meeting of the All India Congress Committee held at the Gowalia Tank Maidan, Bombay, on 7–8 August, 1942. As soon as the Quit India Movement began on 9 August, 1942, the British government arrested all top-level Congress leaders under Operation Zero Hour. In protest against this, Bihar’s Advocate General, Baldev Sahay, resigned from his post in 1942."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"When did the Election Commission of India issue a Press Note for the General Election to the Legislative Assembly of Bihar, 2020?"}],"opts":[{"k":"a","t":"23rd September, 2020"},{"k":"b","t":"24th September, 2020"},{"k":"c","t":"25th September, 2020"},{"k":"d","t":"26th September, 2020"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Through a press note issued on 25 September, 2020, the Election Commission of India announced the general election for all 243 seats of the Bihar Legislative Assembly. This election was conducted in three phases. The first phase was held on 28 October, 2020; the second phase on 3 November 2020; and the third phase on 7 November, 2020. Counting of votes was completed on 10 November, 2020."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"In Bihar’s last Assembly election, which national political party got the maximum seats?"}],"opts":[{"k":"a","t":"BJP"},{"k":"b","t":"BSP"},{"k":"c","t":"Congress"},{"k":"d","t":"RJD"}],"ans":"a","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the Bihar Assembly election held in February, 2000, the Rashtriya Janata Dal (RJD) got 124 seats; however, it did not have the status of a national political party. Therefore, the Bharatiya Janata Party (BJP), which got 67 seats, was considered the national political party with the maximum seats. In the 18th Bihar Assembly election (2025), the Bharatiya Janata Party got the maximum seats (89), followed by Janata Dal (United) with 85 seats. Hence, among national political parties, the Bharatiya Janata Party would be the one with the maximum seats."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"The final phase of elections in February, 2005 in Bihar was for –"}],"opts":[{"k":"a","t":"93 seats"},{"k":"b","t":"83 seats"},{"k":"c","t":"73 seats"},{"k":"d","t":"None of these"}],"ans":"a","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In 2005, elections for 243 Assembly seats in Bihar were held in three phases on 3, 15 and 23 February, in which elections were held for 64 seats in the first phase, 86 seats in the second phase, and 93 seats in the third phase. The Bihar Assembly election, 2025, for 243 seats was conducted in two phases, as follows— Phase Polling Date Assembly Seats First 6 November, 2025 121 seats Second 11 November, 2025 122 seats"}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"Which party-wise performance is correct for Bihar Assembly Elections, 2010 in comparison to the elections of 2005? JDU BJP RJD LJP CONG OTHERS"}],"opts":[{"k":"a","t":"+40 +25 –30 –10 –7 –19"},{"k":"b","t":"+25 +34 –20 –5 –3 –11"},{"k":"c","t":"+27 +36 –32 –7 –5 –19"},{"k":"d","t":"+17 +46 –15 –10 –10 –10"}],"ans":"c","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (c) was the correct answer. In the Bihar Assembly election, 2025, the party-wise position is as follows— Party Number of Seats JD(U) 85 BJP 89 RJD 25 LJPRV 19 INC 6 AIMIM 5 HAMS 5 Others 9"}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"Bihar Politician Late Raghuvansh Prasad Singh was for the first time elected to which Lok Sabha?"}],"opts":[{"k":"a","t":"Tenth Lok Sabha"},{"k":"b","t":"Eleventh Lok Sabha"},{"k":"c","t":"Twelfth Lok Sabha"},{"k":"d","t":"Thirteenth Lok Sabha"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The late Raghuvansh Prasad Singh was first elected in the year 1996 from Vaishali as a member of the 11th Lok Sabha. He continued to win the Lok Sabha elections from the Vaishali seat up to the year 2009."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"At the end of 1995, the number of districts in Bihar was-"}],"opts":[{"k":"a","t":"55"},{"k":"b","t":"52"},{"k":"c","t":"50"},{"k":"d","t":"None of the above"}],"ans":"a","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the end of the year 1995, the total number of districts in Bihar was 55. On 15 November 2000, with the formation of the state of Jharkhand with 18 districts, 37 districts remained in Bihar. At present, the total number of districts in Bihar is 38. In August, 2001, Arwal was made a new district by separating it from Jehanabad."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"Who was the first Governor of Bihar after Independence?"}],"opts":[{"k":"a","t":"Jagannath Mishra"},{"k":"b","t":"Lalit Narayan Mishra"},{"k":"c","t":"Jairamdas Daulatram"},{"k":"d","t":"Jaiprakash Narayan"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After Independence, the first Governor of Bihar was Jairamdas Daulatram, whose tenure was from 15 August 1947 to 11 January, 1948. Thereafter, Madhav Shrihari Aney was the second Governor of Bihar from 12 January, 1948 to 14 June, 1952."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"How many Members of Parliament from Bihar are currently included in the Union Council of Ministers?"}],"opts":[{"k":"a","t":"3"},{"k":"b","t":"5"},{"k":"c","t":"7"},{"k":"d","t":"None of the above"}],"ans":"b","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, 5 MPs (Rajya Sabha + Lok Sabha) from Bihar were included in the Union Council of Ministers. At present, 8 MPs from Bihar are included in the Union Council of Ministers—Rajiv Ranjan Singh alias Lalan Singh, Giriraj Singh, Jitan Ram Manjhi, Chirag Paswan, Ram Nath Thakur, Raj Bhushan Choudhary, Nityanand Rai (all from the Lok Sabha) and Satish Chandra Dubey (from the Rajya Sabha)."}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"In which year was the first sitting of the Bihar Legislative Council convened?"}],"opts":[{"k":"a","t":"1911"},{"k":"b","t":"1913"},{"k":"c","t":"1914"},{"k":"d","t":"1919"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The first meeting of the Bihar Legislative Council was held on 20 January 1913 at Bankipur. Under the Indian Councils Act, 1861 and 1909 (as amended in 1912), the Bihar and Orissa Legislative Council was constituted, in which 3 ex-officio members, 21 elected members and 19 nominated members were included."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"Which city of Bihar became the capital of the Jharkhand state?"}],"opts":[{"k":"a","t":"Buxar"},{"k":"b","t":"Dhanbad"},{"k":"c","t":"Ranchi"},{"k":"d","t":"Hazaribagh"}],"ans":"c","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 15 November, 2000, the new state (28th) Jharkhand was formed by separating it from Bihar. Its capital was made Ranchi. Earlier, Ranchi used to be the summer capital of Bihar."}],"xref":null},{"n":24,"g":null,"stem":[{"type":"p","text":"In which year was Bihar divided to form Jharkhand?"}],"opts":[{"k":"a","t":"2000"},{"k":"b","t":"2001"},{"k":"c","t":"2004"},{"k":"d","t":"2005"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 15 November, 2000, the new state (28th) Jharkhand was formed by separating it from Bihar. Its capital was made Ranchi. Earlier, Ranchi used to be the summer capital of Bihar."}],"xref":23},{"n":25,"g":null,"stem":[{"type":"p","text":"The state of Jharkhand was established in-"}],"opts":[{"k":"a","t":"1997"},{"k":"b","t":"1998"},{"k":"c","t":"1999"},{"k":"d","t":"2000"}],"ans":"d","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"On 15 November, 2000, the new state (28th) Jharkhand was formed by separating it from Bihar. Its capital was made Ranchi. Earlier, Ranchi used to be the summer capital of Bihar."}],"xref":24},{"n":26,"g":null,"stem":[{"type":"p","text":"Who will be the chairperson of the proposed Women's Commission in Bihar?"}],"opts":[{"k":"a","t":"Governor of Bihar"},{"k":"b","t":"Chief Minister of Bihar"},{"k":"c","t":"Chief Justice of Bihar"},{"k":"d","t":"None of the above"}],"ans":"d","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the Bihar State Women Commission Act, 1999, the Chairperson of the Bihar State Women Commission, who must be committed to the cause of women, is nominated by the State Government. Therefore, the correct answer is option (d)."}],"xref":null},{"n":27,"g":null,"stem":[{"type":"p","text":"Who is the Leader of the Opposition in the Bihar Legislative Council?"}],"opts":[{"k":"a","t":"Tej Pratap Yadav"},{"k":"b","t":"Tejashwi Prasad Yadav"},{"k":"c","t":"Rabri Devi"},{"k":"d","t":"Misa Bharti"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"At the time of the question, Rabri Devi was the Leader of Opposition in the Bihar Legislative Council."}],"xref":null},{"n":28,"g":null,"stem":[{"type":"p","text":"Which of these has been the Governor of Bihar twice?"}],"opts":[{"k":"a","t":"Akhlaq Ur Rahman Kidwai"},{"k":"b","t":"Mohammad Yunus Salim"},{"k":"c","t":"Mohammad Shafi Qureshi"},{"k":"d","t":"Zakir Hussain"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Dr. Akhlaq ur Rahman Kidwai served as the Governor of Bihar twice. He first assumed office on 20 September, 1979 and remained in office until 15 March, 1985. He again assumed office on 14 August, 1993 and served until 26 April, 1998."}],"xref":null},{"n":29,"g":null,"stem":[{"type":"p","text":"Who was the first non-Congress Chief Minister of Bihar?"}],"opts":[{"k":"a","t":"Karpoori Thakur"},{"k":"b","t":"Mahamaya Prasad Sinha"},{"k":"c","t":"Ram Sundar Das"},{"k":"d","t":"Lalu Prasad Yadav"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Mahamaya Prasad Sinha was the first non-Congress Chief Minister of Bihar. He served as Chief Minister from 5 March, 1967 to 28 January, 1968."}],"xref":null},{"n":30,"g":null,"stem":[{"type":"p","text":"Who is Bihar State Election Commissioner?"}],"opts":[{"k":"a","t":"M.L. Majumdar"},{"k":"b","t":"Renuka Bajaj"},{"k":"c","t":"L.M. Singhvi"},{"k":"d","t":"None of them"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"M. L. Majumdar served as the State Election Commissioner of Bihar from 26 September 2000 to 28 March 2003."}],"xref":null},{"n":31,"g":null,"stem":[{"type":"p","text":"Who among the following is the common Governor of Bihar and Jharkhand?"}],"opts":[{"k":"a","t":"Vinod Kumar Pandey"},{"k":"b","t":"Vimal Kumar Dubey"},{"k":"c","t":"Vishnu Kant Shastri"},{"k":"d","t":"Girish Chaubey"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, Vinod Kumar Pandey was the common Governor of Bihar and Jharkhand."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"Identify the number of wards in the Patna Municipal Corporation-"}],"opts":[{"k":"a","t":"57"},{"k":"b","t":"67"},{"k":"c","t":"64"},{"k":"d","t":"59"}],"ans":"*","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The number of wards in Patna Municipal Corporation is 75. Patna Nagar Nigam was established on 15 August, 1952 by Patna nagar Nigam Act, 1951."}],"xref":null},{"n":33,"g":null,"stem":[{"type":"p","text":"Total number of Lok Sabha seats in Bihar is -"}],"opts":[{"k":"a","t":"50"},{"k":"b","t":"52"},{"k":"c","t":"54"},{"k":"d","t":"None of the above"}],"ans":"c","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Before 15 November, 2000, undivided Bihar had 54 Lok Sabha seats and 22 Rajya Sabha seats. After the formation of Jharkhand on 15 November, 2000, Bihar was left with 40 Lok Sabha seats and 16 Rajya Sabha seats."}],"xref":null},{"n":34,"g":null,"stem":[{"type":"p","text":"What is the total number of Lok Sabha seats from Bihar?"}],"opts":[{"k":"a","t":"48"},{"k":"b","t":"50"},{"k":"c","t":"52"},{"k":"d","t":"54"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Refer to the explanation of the previous question."}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"How many members are elected to the Lok Sabha from Bihar?"}],"opts":[{"k":"a","t":"20"},{"k":"b","t":"30"},{"k":"c","t":"35"},{"k":"d","t":"40"}],"ans":"d","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Refer to the explanation of the previous question."}],"xref":34},{"n":36,"g":null,"stem":[{"type":"p","text":"Recently, which new state was formed from Bihar?"}],"opts":[{"k":"a","t":"Vananchal"},{"k":"b","t":"Vidarbha"},{"k":"c","t":"Jharkhand"},{"k":"d","t":"Chhattisgarh"}],"ans":"c","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Refer to the explanation of the previous question."}],"xref":35},{"n":37,"g":null,"stem":[{"type":"p","text":"In which year did the state of Jharkhand come into existence?"}],"opts":[{"k":"a","t":"1998"},{"k":"b","t":"1999"},{"k":"c","t":"2000"},{"k":"d","t":"2001"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Refer to the explanation of the previous question."}],"xref":36},{"n":38,"g":null,"stem":[{"type":"p","text":"How many seats are reserved for SC candidates in the Bihar Legislative Assembly?"}],"opts":[{"k":"a","t":"38"},{"k":"b","t":"40"},{"k":"c","t":"44"},{"k":"d","t":"46"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Bihar Legislative Assembly has a total of 243 seats (member strength), out of which 203 seats are general, 38 are reserved for Scheduled Castes, and 2 seats are reserved for Scheduled Tribes."}],"xref":null},{"n":39,"g":null,"stem":[{"type":"p","text":"In which year was 50% reservation to women in Panchayat bodies in Bihar?"}],"opts":[{"k":"a","t":"2005"},{"k":"b","t":"2006"},{"k":"c","t":"2009"},{"k":"d","t":"2014"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, about 50% reservation for women (approximately 50%, but not more than 50%) in Panchayat bodies was provided under the Bihar Panchayati Raj Act, 2006. In the three-tier Panchayati Raj system of Bihar, at the lowest level there is the Gram Panchayat, at the block level there is the Panchayat Samiti, and at the district level there is the Zila Parishad."}],"xref":null},{"n":40,"g":null,"stem":[{"type":"p","text":"From which political party did Ram Vilas Paswan start his political career?"}],"opts":[{"k":"a","t":"Janata Party"},{"k":"b","t":"Bharatiya Lok Dal"},{"k":"c","t":"United Socialist Party"},{"k":"d","t":"Praja Socialist Party"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Ram Vilas Paswan began his political life as a member of the United Socialist Party and became an MLA in 1969. In 1974, he joined Lok Dal. In 1977, he won the Hajipur Lok Sabha seat by a record margin of votes. In 1983, he formed the Dalit Sena. In 1989, he again won the Hajipur Lok Sabha seat by a record margin of votes from Janata Dal. He passed away on 8 October, 2020."}],"xref":null},{"n":41,"g":null,"stem":[{"type":"p","text":"Match List-I with List-II List-I List-II a. Governor of Bihar 1. Mr. Nitish Kumar b. Chief Justice of Bihar 2. Mr. H. R. Srinivas c. Chief Minister of Bihar 3. Mr. Sanjay Karol d. Chief Electoral OfÏcer 4. Mr. Fagu Chauhan of Bihar Choose the correct answer from the options given below."}],"opts":[{"k":"a","t":"a b c d 3 2 1 4"},{"k":"b","t":"a b c d 1 2 3 4"},{"k":"c","t":"a b c d 4 3 1 2"},{"k":"d","t":"a b c d 4 2 1 3"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Correct matching is— Governor of Bihar — Fagu Chauhan (At present: Arif Mohammad Khan) Chief Justice — Sanjay Karol (At present: Acting Chief Justice Sudhir Singh) Chief Minister of Bihar — Nitish Kumar Chief Electoral Officer — H.R. Srinivas (At present: Vinod Singh Gunjiyal)"}],"xref":null},{"n":42,"g":null,"stem":[{"type":"p","text":"Which State has hosted the 6th Commonwealth Parliamentary Association (CPA) India Regional Conference?"}],"opts":[{"k":"a","t":"Chhattisgarh"},{"k":"b","t":"West Bengal"},{"k":"c","t":"Bihar"},{"k":"d","t":"Assam"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Bihar hosted the 6th Commonwealth Parliamentary Association (CPA) India Regional Conference. This event was held in Patna (Bihar) during 16–19 February, 2018. The Commonwealth Parliamentary Association (CPA) is one of the oldest established organizations of the Commonwealth. It was established in 1911 under the name Empire Parliamentary Association. The headquarters of the CPA is located in London."}],"xref":null},{"n":43,"g":null,"stem":[{"type":"p","text":"Patna High Court was set up in –"}],"opts":[{"k":"a","t":"1916"},{"k":"b","t":"1917"},{"k":"c","t":"1918"},{"k":"d","t":"1971"}],"ans":"a","src":["39th B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["39th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the year 1912, a new province of Bihar and Orissa was formed by separating it from Bengal. After the formation of this province, the Patna High Court was established and formally inaugurated on 3 February 1916."}],"xref":null}]},{"title":"Geographical Scenario","qs":[{"n":1,"g":null,"stem":[{"type":"p","text":"Bihar state is situated between the following longitudes"}],"opts":[{"k":"a","t":"About 84° East to 88° East"},{"k":"b","t":"About 80° East to 84° East"},{"k":"c","t":"About 80° East to 88° East"},{"k":"d","t":"None of these"}],"ans":"d","src":["38th B.P.S.C. (Pre) 1992"],"yr":1992,"fam":["38th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar State lies between 83°19′50″E to 88°17′40″E longitudes. Therefore, option (d) is the correct answer."}],"xref":null},{"n":2,"g":null,"stem":[{"type":"p","text":"Total geographical area of Bihar is–"}],"opts":[{"k":"a","t":"Approximately 170 sq. km"},{"k":"b","t":"Approximately 172 sq. km"},{"k":"c","t":"Approximately 174 sq. km"},{"k":"d","t":"Approximately 178 sq. km"}],"ans":"*","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the formation of Jharkhand State on 15 November 2000, Bihar’s present area is 94,163 sq km. This is about 2.86% of India’s total area. In terms of area, it stands at 13th position overall among the States and Union Territories of India (after including the Union Territory of Ladakh)."}],"xref":null},{"n":3,"g":null,"stem":[{"type":"p","text":"The total geographical area of Bihar State is:"}],"opts":[{"k":"a","t":"94200 sq. km"},{"k":"b","t":"94316 sq. km"},{"k":"c","t":"94163 sq. km"},{"k":"d","t":"94526 sq. km"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["67th B.P.S.C. (Re-Exam) (Pre) 2022"],"yr":2022,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the formation of Jharkhand State on 15 November 2000, Bihar’s present area is 94,163 sq km. This is about 2.86% of India’s total area. In terms of area, it stands at 13th position overall among the States and Union Territories of India (after including the Union Territory of Ladakh)."}],"xref":2},{"n":4,"g":null,"stem":[{"type":"p","text":"Local time of Patna is—"}],"opts":[{"k":"a","t":"Ahead of Indian Standard Time"},{"k":"b","t":"Behind Indian Standard Time"},{"k":"c","t":"The same as Indian Standard Time"},{"k":"d","t":"Not related to Indian Standard Time"}],"ans":"a","src":["41st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Patna’s standard time is determined by Indian Standard Time (IST). India’s standard time is based on 82°30′E longitude, which passes through Mirzapur. India’s standard time is 5 hours 30 minutes ahead of Greenwich Mean Time (GMT), whereas Patna’s local time is ahead of IST, because Patna is located at 85°1′E longitude."}],"xref":null},{"n":5,"g":null,"stem":[{"type":"p","text":"Most of Bihar comes under which of the following climate type?"}],"opts":[{"k":"a","t":"Tropical savannah"},{"k":"b","t":"Subtropical Monsoon"},{"k":"c","t":"Hot and dry"},{"k":"d","t":"Hot and Semi Arid"}],"ans":"b","src":["71st B.P.S.C. (Pre) 2025"],"yr":2025,"fam":["71st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Most of Bihar falls under Subtropical monsoon climate, but in the south-eastern part of the State, some districts—such as Jamui, Banka, Munger, Lakhisarai, Khagaria, Sheikhpura (entire parts) and some parts of Bhagalpur, Saharsa and Begusarai—fall under tropical savanna climate."}],"xref":null},{"n":6,"g":null,"stem":[{"type":"p","text":"According to Koppen's Climate Classification, Uttar Pradesh and Bihar are in which climate Category?"}],"opts":[{"k":"a","t":"Dfc"},{"k":"b","t":"Cwg"},{"k":"c","t":"Aw"},{"k":"d","t":"None of the above"},{"k":"e","t":"More than one of the above"}],"ans":"b","src":["68th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["68th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the India Meteorological Department, under Köppen’s climate classification scheme, the districts located in the south-eastern part of Bihar State, namely Jamui, Banka, Munger, Lakhisarai, Khagaria, Sheikhpura (entire parts) and some parts of Bhagalpur, Saharsa and Begusarai fall under Aw type climatic region, whereas the remaining parts of the State fall under Cwa type climatic region. According to NCERT, the Cwg climatic condition extends over the Gangetic Plains, eastern Rajasthan, northern Madhya Pradesh and most parts of north-eastern India. Since both Uttar Pradesh and Bihar are included in the Gangetic Plains, Cwg climatic condition is found in both the States. On this basis, the Bihar Public Service Commission considered option (b) as the correct answer."}],"xref":null},{"n":7,"g":null,"stem":[{"type":"p","text":"According to Köppen's climate classification, the climate of North Bihar can be represented by which of the following?"}],"opts":[{"k":"a","t":"Cwg"},{"k":"b","t":"Aw"},{"k":"c","t":"CA’w"},{"k":"d","t":"CB’w"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the India Meteorological Department, under Köppen’s climate classification scheme, the districts located in the south-eastern part of Bihar State, namely Jamui, Banka, Munger, Lakhisarai, Khagaria, Sheikhpura (entire parts) and some parts of Bhagalpur, Saharsa and Begusarai fall under Aw type climatic region, whereas the remaining parts of the State fall under Cwa type climatic region. According to NCERT, the Cwg climatic condition extends over the Gangetic Plains, eastern Rajasthan, northern Madhya Pradesh and most parts of north-eastern India. Since both Uttar Pradesh and Bihar are included in the Gangetic Plains, Cwg climatic condition is found in both the States. On this basis, the Bihar Public Service Commission considered option (b) as the correct answer."}],"xref":6},{"n":8,"g":null,"stem":[{"type":"p","text":"According to Thornthwaite's scheme, what type of climate does eastern Bihar have?"}],"opts":[{"k":"a","t":"C2"},{"k":"b","t":"Cl"},{"k":"c","t":"A"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"a","src":["B.P.S.C. School Teacher 7.12.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"According to Thornthwaite’s scheme, the climate of Eastern Bihar is mainly of the C2 type. However, due to variations in the distribution of rainfall within the region, both dry sub-humid (C1) and moist sub-humid (C2 ) sub-types are found. The northern and north-eastern districts of Eastern Bihar (Purnia, Araria, Kishanganj, etc.) fall under the C2 category because of higher rainfall, whereas the south-western part (Bhagalpur, etc.) comes under the C1 category due to comparatively lower rainfall. The Bihar Public Service Commission has considered option (a) as the correct answer in its answer key."}],"xref":null},{"n":9,"g":null,"stem":[{"type":"p","text":"According to R. L. Singh’s classification scheme, Bihar falls under which type of climatic region?"}],"opts":[{"k":"a","t":"Humid South-East"},{"k":"b","t":"Sub-humid Transitional"},{"k":"c","t":"Sub-humid Continental"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["B.P.S.C. Teacher (9th–10th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"According to R. L. Singh’s classification scheme, Bihar falls under the sub-humid transitional type of climatic region. R. L. Singh presented his climatic divisions in the year 1971. On the basis of the temperature conditions of the hottest and coldest months and the average annual rainfall, he divided the country into 10 climatic divisions."}],"xref":null},{"n":10,"g":null,"stem":[{"type":"p","text":"Chotanagpur Plateau is—"}],"opts":[{"k":"a","t":"A cuesta"},{"k":"b","t":"A graben"},{"k":"c","t":"A piedmont"},{"k":"d","t":"A peneplain"}],"ans":"a","src":["40th B.P.S.C. (Pre) 1995"],"yr":1995,"fam":["40th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In the Chotanagpur Plateau, a sequence of plateaus of different elevations is found. In the middle-western part lies the Pat land, whose maximum height is about 1100 m. Steps or terraces are found in all directions of this plateau, and steep slopes occur widely. Therefore, it is a cuesta."}],"xref":null},{"n":11,"g":null,"stem":[{"type":"p","text":"The parts of eastern Uttar Pradesh and Bihar are included in which of the following plains?"}],"opts":[{"k":"a","t":"Upper Ganga Plain"},{"k":"b","t":"Middle Ganga Plain"},{"k":"c","t":"Lower Ganga Plain"},{"k":"d","t":"Brahmaputra Plain"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"Parts of Eastern Uttar Pradesh and Bihar are included in the Middle Ganga Plain."}],"xref":null},{"n":12,"g":null,"stem":[{"type":"p","text":"The plains of Magadha and Anga are parts of which of the following?"}],"opts":[{"k":"a","t":"Upper Ganga Plain"},{"k":"b","t":"Middle Ganga Plain"},{"k":"c","t":"Lower Ganga Plain"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"b","src":["B.P.S.C. School Teacher / Headmaster 10.12.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"Anga and Magadha were among the sixteen Mahajanapadas. The capital of the Anga Mahajanapada was Champa. It lay within the present-day districts of Munger and Bhagalpur in Bihar. The capital of Magadha was Girivraja (Rajgriha), later shifted to Pataliputra. Both Mahajanapadas were located within the Middle Ganga Plain."}],"xref":null},{"n":13,"g":null,"stem":[{"type":"p","text":"Munger Hilly region is a part of which of the following physiographic region ?"}],"opts":[{"k":"a","t":"Southern Hilly Region"},{"k":"b","t":"North Bihar Plain"},{"k":"c","t":"Someshwar Hilly Range"},{"k":"d","t":"South Bihar Plain"}],"ans":"a","src":["70th B.P.S.C. (Pre) 2024"],"yr":2024,"fam":["70th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Munger hilly region is a part of the southern hilly region of the state of Bihar. It is an extension of the Chotanagpur Plateau."}],"xref":null},{"n":14,"g":null,"stem":[{"type":"p","text":"Which of the following landforms occupy the North-Western parts of Bihar state?"}],"opts":[{"k":"a","t":"Someshwar Hilly Range"},{"k":"b","t":"Kaimur Plateau"},{"k":"c","t":"Nawada Hilly Region"},{"k":"d","t":"Rajgir Hilly Region"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["60th to 62nd B.P.S.C. (Pre) 2016"],"yr":2016,"fam":["60th–62nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The north-western part of Bihar state is bounded by the Someshwar Range. The Someshwar Range and the Dun Range are parts of the Outer Himalayan Range."}],"xref":null},{"n":15,"g":null,"stem":[{"type":"p","text":"Someshwar range of Bihar is-"}],"opts":[{"k":"a","t":"Older than Parasnath mountain series"},{"k":"b","t":"Older than Rajmahal mountain series"},{"k":"c","t":"Older than Kharagpur mountain series"},{"k":"d","t":"Younger than all of these"}],"ans":"d","src":["42nd B.P.S.C. (Pre) 1997-98"],"yr":1997,"fam":["42nd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Sumeshwar (Someshwar) Range of Bihar and the Shivalik Range were formed mainly during the Pleistocene period. Therefore, it is younger than all the three hills mentioned above."}],"xref":null},{"n":16,"g":null,"stem":[{"type":"p","text":"Correctly match List-I (Agro-climatic zones) with List-II (Percentage of Bihar's Area) and select the correct answer using the codes given below the lists : List-I List-II (Agro-climatic zones) (Percentage of Bihar's area) A. North and North- 1. 29.87% Eastern Bihar Plains B. South Bihar Plains 2. 23.71% C. Chhota Nagpur Plateau 3. 26.14% D. Chhota Nagpur Hills 4. 20.28% Code : A B C D"}],"opts":[{"k":"a","t":"3 4 1 2"},{"k":"b","t":"1 2 3 4"},{"k":"c","t":"2 1 4 3"},{"k":"d","t":"4 3 2 1"}],"ans":"b","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"With reference to undivided Bihar, option (b) was the correct answer. Geographically, Bihar is divided into three regions— Sub-Himalayan foothill region, Indo-Gangetic plains, and Southern plateau region. The Sub-Himalayan foothill region extends over the northern part of Bihar. Some small hills such as the Someshwar and Doon hills are found here. To its south lies the Terai region, which is a marshy and sparsely populated belt. The river Ganga divides the Gangetic plains of Bihar into two parts—North and South."}],"xref":null},{"n":17,"g":null,"stem":[{"type":"p","text":"Which of the following pairs does not correspond to the south Ganga region of Bihar?"}],"opts":[{"k":"a","t":"Patna-Munger"},{"k":"b","t":"Gaya-Arwal"},{"k":"c","t":"Patna-Vaishali"},{"k":"d","t":"More than one of the above"},{"k":"e","t":"None of the above"}],"ans":"c","src":["B.P.S.C. Teacher (11th-12th) 26.08.2023"],"yr":2023,"fam":["B.P.S.C. Teacher"],"expl":[{"type":"p","text":"In Bihar, the Southern Ganga Plains constitute about 43.42 percent of the total geographical area of the state. Therefore, Patna–Munger and Gaya–Arwal districts fall in the Southern Ganga region, whereas Vaishali lies in the Northern Ganga region."}],"xref":null},{"n":18,"g":null,"stem":[{"type":"p","text":"In which one of the following pairs of Administrative Divisions of Bihar, the Ganga river does not flow?"}],"opts":[{"k":"a","t":"Darbhanga–Munger"},{"k":"b","t":"Purnea–Bhagalpur"},{"k":"c","t":"Tirhut–Saran"},{"k":"d","t":"Kosi–Magadh"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During its course, the river Ganga flows through the Darbhanga–Munger, Purnea–Bhagalpur, and Tirhut–Saran administrative divisions. It does not flow through the Kosi– Magadh administrative division. Hence, option (d) is the correct answer."}],"xref":null},{"n":19,"g":null,"stem":[{"type":"p","text":"In Bihar, the terms Balsundari, Tal, Karail and Balthar are used for which of the following?"}],"opts":[{"k":"a","t":"Agriculture"},{"k":"b","t":"Crop"},{"k":"c","t":"Soil"},{"k":"d","t":"Natural vegetation"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. C.D.P.O. (Pre) 2022"],"yr":2022,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"In Bihar, the terms Balsundari, Tal, Karail, and Balthar are used for soil. Various types of soils are found in the state. Alluvial soil covers the largest area in Bihar. In the Kaimur region, Balthar soil (sandy, calcareous, yellow) is found, while Khadar soil is mainly found in Muzaffarpur, Katihar, Saharsa, and Darbhanga. Terai soil is mainly found in East Champaran and West Champaran districts; Bangar soil in Patna and Rohtas districts; Balsundari soil in Saharsa, East Champaran, and West Champaran districts; and marshy soil is found in the north-western corner of Bihar."}],"xref":null},{"n":20,"g":null,"stem":[{"type":"p","text":"In which of the following district-pairs is the reserve of old alluvial soil found in Bihar?"}],"opts":[{"k":"a","t":"Patna and Gaya"},{"k":"b","t":"Purnea and Gaya"},{"k":"c","t":"Purnea and Patna"},{"k":"d","t":"Darbhanga and Purnea"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["65th B.P.S.C. Re-Exam (Pre) 2020"],"yr":2020,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The reserve of old alluvial soil (Bangar) is found mainly in Purnea and Patna districts among the districts mentioned in the question."}],"xref":null},{"n":21,"g":null,"stem":[{"type":"p","text":"Piedmont Swamp Soil is found only in which one of the following districts of Bihar?"}],"opts":[{"k":"a","t":"Madhubani"},{"k":"b","t":"Bhagalpur"},{"k":"c","t":"West Champaran"},{"k":"d","t":"Sitamarhi"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Three major types of soils are found in Bihar— (i) Piedmont swamp soil, found in the north-western part of West Champaran district."},{"type":"list","items":["(ii) Terai soil, found in the northern part of the state along the Nepal border.","(iii) Gangetic alluvial soil—the plains of Bihar are covered with Gangetic alluvium (both new and old)."]}],"xref":null},{"n":22,"g":null,"stem":[{"type":"p","text":"Most of the area of Bihar is covered with -"}],"opts":[{"k":"a","t":"Hilly soil"},{"k":"b","t":"Alluvial soil"},{"k":"c","t":"Regur soil"},{"k":"d","t":"Tarai soil"},{"k":"e","t":"None of the above / Above more than one"}],"ans":"b","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Most of Bihar is covered with alluvial (Kachhari) soil."}],"xref":null},{"n":23,"g":null,"stem":[{"type":"p","text":"Which one of the following parts of Bihar is geologically older in age relatively?"}],"opts":[{"k":"a","t":"Rohtas Plateau"},{"k":"b","t":"North-Western Hills"},{"k":"c","t":"Kharagpur Hills"},{"k":"d","t":"North Ganga Plains"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kharagpur Hills consist of Pre-Cambrian / Proterozoic rocks of the Munger–Rajgir range, whereas the Rohtas Plateau belongs to the Vindhyan sequence; the North-Western Hills are a part of the Shivalik Himalaya (Upper Tertiary to Early Quaternary), and the North Ganga Plain is the newest."}],"xref":null},{"n":24,"g":null,"stem":[{"type":"p","text":"The geographical structure of Bihar is made up of rock systems. Match the rock systems with their descriptions— A. Dharwar rock system 1. Formed by rapid deposition of sediments by Himalayan and Peninsular rivers B. Vindhyan rock system 2. Can be found in West Champaran district C. Quaternary rock system 3. A part of the oldest Archean rock system D. Tertiary rock system 4. Sandstone, limestone, dolomite, quartzite and shale are the main components of this rock system Use the code given below and choose the correct answer. A B C D"}],"opts":[{"k":"a","t":"4 2 3 1"},{"k":"b","t":"3 4 1 2"},{"k":"c","t":"1 3 2 4"},{"k":"d","t":"2 3 4 1"}],"ans":"b","src":["69th B.P.S.C. (Pre) 2023"],"yr":2023,"fam":["69th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The correct matching is as follows— Dharwar rock system — A part of the oldest Archean rock system Vindhyan rock system — Sandstone, limestone, dolomite, quartzite and shale are the main components of the rock system Quaternary rock system — Formed by rapid deposition of sediments by Himalayan and Peninsular rivers Tertiary rock system — Can be found in West Champaran district"}],"xref":null},{"n":25,"g":null,"stem":[{"type":"p","text":"Which of the following districts does not have a Dharwar geological structure?"}],"opts":[{"k":"a","t":"Munger"},{"k":"b","t":"Rohtas"},{"k":"c","t":"Jamui"},{"k":"d","t":"Nawada"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Bihar, districts with Dharwar stratigraphic structure lie in south-eastern Bihar. These include Munger, Nawada and Jamui, whereas Rohtas is a part of south-western Bihar. Vindhyan sequence rocks are found in this region. In Bihar, Vindhyan sequence rocks occur in the Kaimur region and the Son river valley (Rohtas)."}],"xref":null},{"n":26,"g":null,"stem":[{"type":"p","text":"Which of the following physiographic divisions of Bihar does not share its boundary with Jharkhand?"}],"opts":[{"k":"a","t":"Ganga-Son Divide"},{"k":"b","t":"Anga Plain"},{"k":"c","t":"Magadha Plain"},{"k":"d","t":"Mithila Plain"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["B.P.S.C. C.D.P.O. (Pre) 2018"],"yr":2018,"fam":["B.P.S.C. C.D.P.O."],"expl":[{"type":"p","text":"The geomorphological division “Mithila Plain” of Bihar does not share its boundary with Jharkhand, whereas the Ganga– Son Divide, Anga Plain and Magadha Plain do share a boundary with Jharkhand."}],"xref":null},{"n":27,"g":null,"stem":[{"type":"p","text":"The percentage of land area of old Bihar that forms the State of Jharkhand is –"}],"opts":[{"k":"a","t":"38.40 %"},{"k":"b","t":"45.85 %"},{"k":"c","t":"42.35 %"},{"k":"d","t":"51.72 %"}],"ans":"b","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Before the formation of Jharkhand, the total area of undivided Bihar was 173,877 sq. km. Out of this, 79,714 sq. km. area was used for the formation of the state of Jharkhand on 15 November, 2000. Hence, Jharkhand was formed by taking about 45.84% of the land of old Bihar; therefore, the nearest option (b) is correct. At present, the total area of Bihar is 94,163 sq. km."}],"xref":null},{"n":28,"g":null,"stem":[{"type":"p","text":"Consider the following statements regarding the various geographical aspects of Bihar – I. Agriculture contributes nearly 67 per cent to Bihar's domestic product. II. Silk industry in Bihar provides self-employment to over 1,50,000 people III. About 47 lakh acres of land in Bihar get flooded every year, while 10 lakh acres remain permanently waterlogged. IV. 85 to 90 percent of Bihar's rural households own less than 5 acres of land each. Which of these statements are correct?"}],"opts":[{"k":"a","t":"II and IV"},{"k":"b","t":"I and II"},{"k":"c","t":"II and III"},{"k":"d","t":"III and IV"}],"ans":"c","src":["47th B.P.S.C. (Pre) 2005"],"yr":2005,"fam":["47th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, option (c) was the correct answer. In 2022–23 (provisional) and 2023–24 (quick estimate), the share of agriculture, forestry and fishing in Bihar’s gross state value added was 20.2 percent and 19.5 percent respectively. In 2024–25 (up to January 2025), the estimated number of persons employed in Bihar’s silk sector was 0.24 lakh. In 2023, about 2.914 million hectares area in Bihar was affected by floods."}],"xref":null},{"n":29,"g":null,"stem":[{"type":"p","text":"Which soil is mostly found in Muzaffarpur, Darbhanga and Champaran districts?"}],"opts":[{"k":"a","t":"Black soil"},{"k":"b","t":"New alluvium"},{"k":"c","t":"Old alluvium"},{"k":"d","t":"Red soil"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"In Darbhanga and Muzaffarpur districts, new alluvial soil (Khadar) is found. New alluvial soil (Khadar) is formed due to the deposition of debris/silt brought every year by the flood water of rivers. In East Champaran and West Champaran districts of Bihar, along with new alluvial soil (Khadar), Terai soil and Balsundari soil are also found."}],"xref":null},{"n":30,"g":null,"stem":[{"type":"p","text":"Kaimur Plateau is famous for –"}],"opts":[{"k":"a","t":"Copper"},{"k":"b","t":"Limestone"},{"k":"c","t":"Lithium"},{"k":"d","t":"Bauxite"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"b","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The Kaimur Plateau is famous for limestone. The Kaimur Plateau is located in Rohtas and Kaimur districts. This plateau is made up of shale, limestone and sandstone. On the basis of the limestone of this plateau, there is a cement industry at Banjari."}],"xref":null},{"n":31,"g":null,"stem":[{"type":"p","text":"North Bihar is famous for –"}],"opts":[{"k":"a","t":"Agricultural prosperity"},{"k":"b","t":"Heavy industries"},{"k":"c","t":"Flood"},{"k":"d","t":"Drought"}],"ans":"c","src":["53rd to 55th B.P.S.C. (Pre) 2011"],"yr":2011,"fam":["53rd–55th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"73.63 percent of the area of North Bihar is vulnerable to floods. Due to floods every year in this region, crops and public life get disrupted."}],"xref":null},{"n":32,"g":null,"stem":[{"type":"p","text":"Which of the following cities is located in the easternmost part of Bihar?"}],"opts":[{"k":"a","t":"Bhagalpur"},{"k":"b","t":"Patna"},{"k":"c","t":"Katihar"},{"k":"d","t":"Purnia"}],"ans":"c","src":["56th to 59th B.P.S.C. (Pre) 2014"],"yr":2014,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Katihar is situated in the easternmost part of Bihar. To the south of Katihar lie Bhagalpur and Sahibganj district of Jharkhand; to the east lies Malda district of West Bengal; to the north lies Dinajpur district; and to the north and west lies Purnia."}],"xref":null},{"n":33,"g":null,"stem":[{"type":"p","text":"Brahmayoni Hill is located in which district of Bihar?"}],"opts":[{"k":"a","t":"Gaya"},{"k":"b","t":"Rohtas"},{"k":"c","t":"Nalanda"},{"k":"d","t":"Nawada"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["67th B.P.S.C. (Pre) 2021"],"yr":2021,"fam":["67th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Brahmayoni Hill is a sacred hill located in Gaya district of Bihar. It is mentioned in the Mahabharata, Buddhist inscriptions, etc. Gaya district is situated on the bank of the Phalgu River."}],"xref":null},{"n":34,"g":null,"stem":[{"type":"p","text":"Which city of Bihar is surrounded by five hills?"}],"opts":[{"k":"a","t":"Gaya"},{"k":"b","t":"Patna"},{"k":"c","t":"Bhagalpur"},{"k":"d","t":"Bodh Gaya"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["66th B.P.S.C. (Re-Exam) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Rajgir city of Bihar is surrounded by five hills, which is also mentioned in various texts including the Mahabharata. The hills of Rajgir are world-famous. The names of these five hills are Vipulagiri (Vipulachal), Ratnagiri, Udaygiri, Swarnagiri and Vaibhavgiri (Vaibhargiri). Gaya is surrounded on three sides by small rocky hills, named—Mangala-Gauri, Shring Sthan, Ramshila and Brahmayoni."}],"xref":null},{"n":35,"g":null,"stem":[{"type":"p","text":"The number of Indian states touching the boundary of Bihar is –"}],"opts":[{"k":"a","t":"Four"},{"k":"b","t":"Five"},{"k":"c","t":"Six"},{"k":"d","t":"Seven"}],"ans":"a","src":["43rd B.P.S.C. (Pre) 1999"],"yr":1999,"fam":["43rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question, undivided Bihar shared its boundary with four states (Madhya Pradesh, Uttar Pradesh, Odisha, and West Bengal). After the bifurcation on 15 November 2000, the Indian states touching Bihar’s boundary are Uttar Pradesh, West Bengal, and Jharkhand."}],"xref":null},{"n":36,"g":null,"stem":[{"type":"p","text":"Which of the following districts of Bihar does not share border with Nepal?"}],"opts":[{"k":"a","t":"Madhubani"},{"k":"b","t":"Kishanganj"},{"k":"c","t":"Sitamarhi"},{"k":"d","t":"Purnia"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"d","src":["63rd B.P.S.C. (Pre) 2017"],"yr":2017,"fam":["63rd B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"Bihar shares an international boundary of 729 km with Nepal. Seven districts of Bihar share a boundary with Nepal— Sitamarhi, Kishanganj, Araria, Supaul, Madhubani, East Champaran, and West Champaran."}],"xref":null},{"n":37,"g":null,"stem":[{"type":"p","text":"After the formation of Jharkhand how many districts were left with Bihar? (Nearest figure)"}],"opts":[{"k":"a","t":"37"},{"k":"b","t":"65"},{"k":"c","t":"60"},{"k":"d","t":"62"}],"ans":"a","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"After the formation of Jharkhand, 37 districts remained in Bihar. Before the formation of Jharkhand, Bihar had 55 districts. Eighteen districts of Bihar went to the newly formed state of Jharkhand. At present, Bihar has 38 districts. The 38th district, “Arwal”, was created in August 2001 by bifurcating Jehanabad."}],"xref":null},{"n":38,"g":null,"stem":[{"type":"p","text":"By how many districts of Bihar was Patna district bounded till July 2018?"}],"opts":[{"k":"a","t":"7"},{"k":"b","t":"8"},{"k":"c","t":"9"},{"k":"d","t":"10"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"c","src":["64th B.P.S.C. (Pre) 2018"],"yr":2018,"fam":["64th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At present, Patna district shares its boundary with 9 districts, namely—Bhojpur, Saran, Vaishali, Samastipur, Begusarai, Lakhisarai, Nalanda, Jehanabad, and Arwal."}],"xref":null},{"n":39,"g":null,"stem":[{"type":"p","text":"Which of the following districts of Bihar transferred some of its areas to West Bengal?"}],"opts":[{"k":"a","t":"Jamshedpur"},{"k":"b","t":"Bhagalpur and Samastipur"},{"k":"c","t":"Purnea and Manbhum"},{"k":"d","t":"Rajgir"}],"ans":"c","src":["45th B.P.S.C. (Pre) 2001"],"yr":2001,"fam":["45th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the reorganization of states in 1956, most parts of Purulia located in the then Manbhum district of undivided Bihar (except Patamda police station) and some parts of Purnia were transferred to West Bengal. Forests and Vegetation"}],"xref":null},{"n":40,"g":"Forests and Vegetation","stem":[{"type":"p","text":"Forests of Chhotanagpur are –"},{"type":"list","items":["(i) Evergreen (ii) Deciduous","(iii) Savanna (iv) Thorny"]},{"type":"p","text":"Select your answer out of the following codes –"}],"opts":[{"k":"a","t":"i and ii both are true"},{"k":"b","t":"only ii is true"},{"k":"c","t":"ii and iii both are true"},{"k":"d","t":"only iv is true"}],"ans":"c","src":["41st B.P.S.C. (Pre) 1996"],"yr":1996,"fam":["41st B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The forests of the Chhotanagpur region mainly consist of deciduous vegetation, in which mahua, khair, semal, shisham, mango, and banyan are prominent. Along with this, savanna-type forests are also found here. The presence of scattered trees in grassland (scrub) areas is a characteristic feature of savanna-type forests."}],"xref":null},{"n":41,"g":"Forests and Vegetation","stem":[{"type":"p","text":"The expansion of forest in Bihar is on the area of:"}],"opts":[{"k":"a","t":"28 lakh hectare"},{"k":"b","t":"29 lakh hectare"},{"k":"c","t":"30 lakh hectare"},{"k":"d","t":"31 lakh hectare"}],"ans":"*","src":["39th B.P.S.C. (Pre) 1994"],"yr":1994,"fam":["39th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the State of Forest Report (SFR), 1993, Bihar had forests over a total area of 26.587 lakh hectares. As per the India State of Forest Report (ISFR), 2023, Bihar has forest cover over an area of 7,532.45 sq km, which is 8% of the total geographical area."}],"xref":null},{"n":42,"g":"Forests and Vegetation","stem":[{"type":"p","text":"The percent of the total geographical area of Bihar covered by forests is-"}],"opts":[{"k":"a","t":"17%"},{"k":"b","t":"23%"},{"k":"c","t":"27%"},{"k":"d","t":"33%"}],"ans":"a","src":["42nd B.P.S.C. (Pre) 1997-98","44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["42nd B.P.S.C. (Pre)","44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"During the period of the question, option (a) was the correct answer. According to the India State of Forest Report (ISFR), 2023, forest cover in Bihar is 8% (7,532.45 sq km) and tree cover is 2.52% (2,370.21 sq km) of the total geographical area (94,163 sq km). Thus, as per the updated status, the total forest cover and tree cover together account for 10.52% (9,902.66 sq km) of the state’s area."}],"xref":null},{"n":43,"g":"Forests and Vegetation","stem":[{"type":"p","text":"What is the percentage of all types of forest area to the total geographical area of Bihar State?"}],"opts":[{"k":"a","t":"7.27"},{"k":"b","t":"6.87"},{"k":"c","t":"3.21"},{"k":"d","t":"12.77"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"e","src":["66th B.P.S.C. (Pre) 2020"],"yr":2020,"fam":["66th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the India State of Forest Report, 2019, the forest area in Bihar was 7.84 percent of the total geographical area. According to the India State of Forest Report, 2023, the forest area in Bihar is recorded at approximately 8 percent of the total geographical area."}],"xref":null},{"n":44,"g":"Forests and Vegetation","stem":[{"type":"p","text":"How much square meter of forest of area is there in Bihar?"}],"opts":[{"k":"a","t":"2812 sq. meter"},{"k":"b","t":"3612 sq. meter"},{"k":"c","t":"2461 sq. meter"},{"k":"d","t":"2612 sq. meter"}],"ans":"*","src":["56th to 59th B.P.S.C. (Pre) 2015"],"yr":2015,"fam":["56th–59th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"The above question and all the given options are incorrect. It is not possible to determine the correct answer on the basis of the options provided. According to the India State of Forest Report, 2023, the total forest cover area of Bihar is 7532.45 square kilometers, which is 8.00 percent of Bihar’s total geographical area. In Bihar, very dense forest covers 387 square kilometers, moderately dense forest covers 3284.21 square kilometers, and open forest covers 3861.24 square kilometres. The three districts with the highest forest cover area in Bihar are Kaimur (Bhabua), West Champaran, and Jamui, while the three districts with the lowest forest cover area are Sheikhpura, Arwal, and Buxar. The three districts with the highest forest cover percentage are Kaimur (Bhabua), Jamui, and Munger, and the three districts with the lowest forest cover percentage are Sheikhpura, Buxar, and Siwan."}],"xref":null},{"n":45,"g":"Forests and Vegetation","stem":[{"type":"p","text":"Among the following districts, which one has the larger area under dense deciduous forest cover?"}],"opts":[{"k":"a","t":"West Champaran"},{"k":"b","t":"Gaya"},{"k":"c","t":"Kaimur"},{"k":"d","t":"Nawada"},{"k":"e","t":"None of the above / More than one of the above"}],"ans":"a","src":["65th B.P.S.C. (Pre) 2019"],"yr":2019,"fam":["65th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"At the time of the question as well as at present, West Champaran has the largest area under dense deciduous forests. According to the India State of Forest Report, 2023, West Champaran has a total forest area of 908.23 square kilometers, of which 303.78 square kilometers are very dense forest, 527.25 square kilometres is moderately dense forest, and 77.20 square kilometres is open forest."}],"xref":null},{"n":46,"g":"Forests and Vegetation","stem":[{"type":"p","text":"The total forest area as a percentage of area in Bihar is-"}],"opts":[{"k":"a","t":"32%"},{"k":"b","t":"21%"},{"k":"c","t":"19%"},{"k":"d","t":"31%"}],"ans":"*","src":["44th B.P.S.C. (Pre) 2000"],"yr":2000,"fam":["44th B.P.S.C. (Pre)"],"expl":[{"type":"p","text":"According to the State of Forest Report, 1999, the forest cover of undivided Bihar (including Jharkhand) was 15.23 percent. According to the India State of Forest Report, 2023, forests cover about 8 percent of the total area of B
