te/abolish <mark>state legislative councils<\/mark>"},{"t":"li","lv":2,"m":"b","h":"<mark>Rules of Procedure<\/mark> in Parliament"},{"t":"li","lv":2,"m":"b","h":"<mark>Quorum<\/mark> in Parliament; salaries of MPs"},{"t":"li","lv":2,"m":"b","h":"Use of <mark>Official language<\/mark>"},{"t":"li","lv":2,"m":"b","h":"Increase <mark>powers of SC<\/mark>; etc …"}]},{"kind":"note","title":"Our Constitution is living document because","group":"Amendment Of The Constitution","items":[{"t":"li","lv":0,"m":"b","h":"It can be amended as per needs of society"},{"t":"li","lv":0,"m":"b","h":"It has flexibility of interpretation"},{"t":"li","lv":0,"m":"b","h":"But Basic structure should not change."},{"t":"li","lv":0,"m":"b","h":"Courts have most important role in this."}]},{"kind":"pyq","title":"Amendment Of The Constitution","group":"Amendment Of The Constitution","year":"2013","q":"Consider the following statements:\n1. An amendment to Constitution can be initiated by introducing bill in Lok Sabha only\n2. If such an amendment seeks to make changes in federal character of Constitution, the amendment also requires to be ratified by legislature of all the States of India.\nWhich of the above statements is/are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":42,"ans":3,"exp":"An amendment bill can be introduced in either House, and federal amendments need ratification by half of the States, not all.","check":false},{"kind":"pyq","title":"Amendment Of The Constitution","group":"Amendment Of The Constitution","year":"1995","q":"Which of the following are matters on which constitutional amendment is possible only with ratification of legislatures of not less than one half of the States?\n1. Election of the President\n2. Representation of States in Parliament\n3. Any of the Lists in the 7th Schedule\n4. Abolition of Legislative Council of a State","opts":["1, 2 and 3","1, 2 and 4","1, 3 and 4","2, 3 and 4"],"page":42,"ans":0,"exp":"Election of President, representation of States in Parliament and the 7th Schedule lists need ratification; abolishing a Legislative Council needs only a simple majority (Art. 169).","check":false},{"kind":"pyq","title":"Amendment Of The Constitution","group":"Amendment Of The Constitution","year":"2019","q":"Consider the following statements:\n1. The 44th Amendment to the Constitution of India introduced an article placing the election of the Prime Minister beyond judicial review.\n2. The Supreme Court of India struck down the 99th Amendment to the Constitution of India as being violative of the independence of the judiciary.\nWhich of the statements given above is/are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":43,"ans":1,"exp":"The 39th Amendment (not 44th) placed the PM's election beyond judicial review; the 99th Amendment (NJAC) was struck down in 2015.","check":false},{"kind":"note","title":"Important Amendments","group":"Important Amendments","items":[{"t":"tab","rows":[["<b>Year<\/b>","<b>Amendment<\/b>","<b>About<\/b>"],["1951","1","9th Schedule"],["1956","7","State reorganization"],["1975","39","Election of President, Vice-President, Prime Minister, Speaker beyond judicial review.\nStruck down by Supreme Court in 1976 for violating Basic Structure."],["1985","52","10th schedule (Anti Defection law)"],["1987","56","Goa became State;\nDaman &amp; Diu became UT"],["1988","61","Lowered voting age from 21 to 18 years for Lok Sabha and State Legislative Assemblies"],["1991","69","Delhi got special status, to be called as National Capital Territory of Delhi;\nDelhi got Legislative Assembly and a Council of Ministers"],["2001","84","Froze constituency boundaries till first census after 2026"],["2003","91","Restrict the size of council of ministers to 15% of legislative members;\nStrengthened Anti Defection law"],["2003","92","Added four languages (Bodo, Dogri, Santali, Maithili) to 8th schedule"],["2005","93","OBC reservation in government and private educational institutions"],["2014","99","NJAC: National Judicial Appointments Commission;\nStruck down by Supreme Court in 2015 for violating Basic Structure"],["2015","100","Exchange of certain Enclaves with Bangladesh"],["2016","101","GST"],["2018","102","NCBC given Constitutional status"],["2019","103","EWS reservation"],["2019","104","Extended reservation for SC/ST in Lok Sabha/State Legislative Assemblies for another 10 years;\nDid not extend reservation for Anglo-Indians in Lok Sabha/State Legislative Assemblies"],["2021","105","Restored states' power to make their own OBC lists"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Basic Structure of the Constitution","group":"Basic Structure of the Constitution","items":[{"t":"li","lv":0,"m":"b","h":"<s>Defined in Constitution<\/s>"},{"t":"li","lv":0,"m":"b","h":"<s>Introduced by 44th amendment<\/s>"},{"t":"li","lv":0,"m":"b","h":"<s>Can be amended by special majority in Parliament<\/s>"},{"t":"li","lv":0,"m":"b","h":"Introduced by SC in <mark>Kesavananda Bharati case 1973<\/mark>"},{"t":"li","lv":0,"m":"b","h":"<mark>24th April, 1973 – 13 judge bench – largest bench ever<\/mark>"},{"t":"li","lv":0,"m":"b","h":"<mark>Kesavananda Bharti lost the case<\/mark>"},{"t":"li","lv":0,"m":"b","h":"Judiciary decides what comes under basic structure"}]},{"kind":"note","title":"Basic structure: elements from judgements · part 1","group":"From various judgements, following are some of them","items":[{"t":"li","lv":0,"m":"b","h":"Democracy, Free and fair elections"},{"t":"li","lv":0,"m":"b","h":"Judicial review, Independence of Judiciary"},{"t":"li","lv":0,"m":"b","h":"Powers of SC u/a 32, 136, 141, 142"},{"t":"li","lv":0,"m":"b","h":"Powers of HC u/a 226, 227"},{"t":"li","lv":0,"m":"b","h":"Article <b>226<\/b>: issue order/writ for FR or other purpose"},{"t":"li","lv":0,"m":"b","h":"Article <b>227<\/b>: HC has superintendence on courts / tribunals in its area"},{"t":"li","lv":0,"m":"b","h":"Article <b>32<\/b>: approach SC for ividual liberty in the interest of State Authority\n2. places effective restrictions on the Authority of the State in the interest of individual liberty Which of the above statements are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":45,"ans":1,"exp":"It restricts the State's authority in the interest of individual liberty.","check":false},{"kind":"pyq","title":"Basic structure: elements from judgements","group":"From various judgements, following are some of them","year":"1985","q":"The original structure of the Indian Constitution cannot be changed. In which of the following cases, Supreme Court gave this verdict?","opts":["Golak Nath case","Minerva Mills case","Kesavananda Bharati case","None of the above"],"page":46,"ans":2,"exp":"Kesavananda Bharati (1973) propounded the basic structure doctrine.","check":false},{"kind":"pyq","title":"Basic structure: elements from judgements","group":"From various judgements, following are some of them","year":"1994","q":"The basic structure theory of the Constitution implies that","opts":["certain features of the Constitution are so essential to it that they cannot be abrogated","fundamental rights cannot be abridged or taken away","the Constitution cannot be amended except in accordance with the procedure prescribed in Article 368","the Preamble of the Constitution cannot be amended for it is not a part of the Constitution and at the same time represents its real spirit"],"page":46,"ans":0,"exp":"Certain features are so essential that they cannot be abrogated even by amendment.","check":false}]},{"title":"Parliamentary System","cards":[{"kind":"note","title":"Parliamentary form of government","group":"Parliamentary form of government","items":[{"t":"tab","rows":[["<b>Feature<\/b>","<b>Parliamentary Government<\/b>","<b>Presidential Government<\/b>"],["Examples","India, Britain, Canada, Japan","USA, Brazil, Russia (semi), Sri Lanka (semi)"],["Model","Westminster model; Responsible government; Cabinet government;\nPrime Ministerial government","Non-responsible government;\nFixed Executive government"],["Responsibility","Executive is responsible to Legislature","Executive is not responsible to Legislature"],["Independence","","Executive is independent for term of office"],["Features","1. Dual executive (President Head of State; PM Head of Government)","1. Single executive"],["","2. Majority party rule","2. President and legislators elected separately for a fixed term"],["","3. Collective responsibility","3. Non-responsibility"],["","4. Political homogeneity","4. Political homogeneity may not exist"],["","5. Double membership","5. Single membership"],["","6. Leadership of prime minister","6. Domination of president"],["","7. Executive can get legislature dissolved","7. Executive can’t get legislature dissolved"],["","8. Fusion of powers","8. Separation of powers"],["Merits","1. Harmony between legislature and executive","1. Stable government"],["","2. Responsible government","2. Definiteness in policies"],["","3. Prevents despotism","3. Based on separation of powers"],["","4. Wide representation","4. Government by experts"],["Demerits","1. Unstable government","1. Conflict between legislature and executive"],["","2. No continuity of policies","2. Non-responsible government"],["","3. Against separation of powers","3. May lead to autocracy"],["","4. Government by amateurs","4. Narrow representation"]],"hdr":true,"cap":null}]},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"2013","q":"In the context of India, which of the following principles are implied institutionally in parliamentary government?\n1. Members of the Cabinet are Members of the Parliament\n2. Ministers hold office till they enjoy confidence in Parliament\n3. Cabinet is headed by the Head of the State\nSelect the correct answer:","opts":["1 and 2 only","3 only","2 and 3 only","1, 2 and 3"],"page":48,"ans":0,"exp":"Ministers are MPs and hold office while they enjoy the confidence of Parliament; the Cabinet is headed by the PM, not the Head of State.","check":false},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"1993","q":"The Swaran Singh Committee considered the Question of","opts":["more autonomy to Punjab on the model of J&amp;K","suitability of Presidential form of government for India","precedence of DPSP over FR","Administrative reforms"],"page":48,"ans":2,"exp":"The Swaran Singh Committee (1976) led to the 42nd Amendment, which gave DPSPs precedence over FRs and added Fundamental Duties.","check":true},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"2020","q":"A Parliamentary System of Govt is one in which","opts":["all political parties in Parliament are represented in Govt","Govt is responsible to Parliament and can be removed by it","Govt is elected by people and can be removed by them","Govt is chosen by Parliament but cannot be removed by it before completion of a fixed term"],"page":49,"ans":1,"exp":"Government is responsible to Parliament and can be removed by it.","check":false},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"2017","q":"The main advantage of the parliamentary form of government is that","opts":["the executive and independently.","it provides continuity of policy and is more efficient.","the executive remains responsible to the legislature.","the head of the government cannot be changed without election"],"page":49,"ans":2,"exp":"The executive remains responsible to the legislature.","check":false},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"1987","q":"India has parliamentary democracy system because","opts":["Members of the Lok Sabha are elected by public","Council of Ministers is responsible to Legislature","of distribution of power between Centre and States","of a single constitutional framework"],"page":49,"ans":1,"exp":"The Council of Ministers is responsible to the legislature.","check":false},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"2015","q":"There is a Parliamentary System of Government in India because the","opts":["Lok Sabha is elected directly by the people","Parliament can amend the constitution","Rajya Sabha cannot be dissolved","Council of Ministers is responsible to Lok Sabha"],"page":49,"ans":3,"exp":"Council of Ministers is collectively responsible to the Lok Sabha (Art. 75(3)).","check":false},{"kind":"pyq","title":"Parliamentary form of government","group":"Parliamentary form of government","year":"2017","q":"Out of the following statements, choose the one that brings out the principle underlying the Cabinet form of Government:","opts":["An arrangement for minimizing the criticism against the Government whose responsibilities are complex and hard to carry out to the satisfaction of all.","A mechanism for speeding up activities of Govt whose responsibilities are increasing day by day","A mechanism of parliamentary democracy to ensure collective responsibility of Govt to people","A device for strengthening hands of head of Govt whose hold over people is in a state of decline"],"page":50,"ans":2,"exp":"Cabinet government ensures collective responsibility of the government to the people.","check":false},{"kind":"note","title":"Britain vs India: parliamentary system","group":"Parliamentary form of government","items":[{"t":"tab","rows":[["<b>Aspect<\/b>","<b>Britain<\/b>","<b>India<\/b>"],["Type of Government","Constitutional Monarchy (Hereditary)","Republic (Elected)"],["Sovereignty of Parliament","Sovereign (no written Constitution)","Not sovereign/supreme (written Constitution, federal system, judicial review, and fundamental rights)"],["Eligibility of Ministers","Only MPs can be made Minister","Non-MP can b thdraw a case from a subordinate court and can deal with the case itself if it is satisfied that the case involves a substantial point of constitutional law\nSelect the correct answer using the codes given below:","opts":["1 and 2","1 and 3","1 and 4","2, 3 and 4"],"page":60,"ans":2,"exp":"HC judges are appointed by the President, and the High Court (not subordinate courts) heads the state judiciary.","check":false},{"kind":"pyq","title":"Judiciary","group":"Judiciary","year":"2019","q":"Consider the following statements:\n1. The motion to impeach a judge of the Supreme Court of India cannot be rejected by the Speaker of the Lok Sabha as per the Judges (Inquiry) Act, 1968.\n2. The Constitution of India defines and gives details of what constitutes &#x27;incapacity and proved misbehavior&#x27; of the judges of the Supreme Court of India.\n3. The details of the process of impeachment of the judges of the Supreme Court of India are given in the Judges (Inquiry) Act, 1968.\n4. If motion of impeachment of a judge is taken up for voting, the law requires the motion to be backed by each house of the parliament and supported by a majority of total membership of that house and by not less than two-thirds of total members of that House present and voting.\nWhich of the statements given above is/are correct?","opts":["1 and 2","3 only","3 and 4 only","1, 3 and 4"],"page":60,"ans":2,"exp":"The Speaker may reject the motion, and the Constitution does not define ‘incapacity’ or ‘proved misbehaviour’.","check":false},{"kind":"pyq","title":"Judiciary","group":"Judiciary","year":"2019","q":"With reference to the constitution of India, prohibition or limitations or provisions contained in ordinary laws cannot act as prohibitions or limitations on the constitutional powers under Article 142. It could mean which one of the following?","opts":["Decisions taken by ECI while discharging its duties can not be challenged in any court of law.","Supreme Court is not constrained in the exercise of its powers by laws made by the parliament.","In the event of grave financial crises in the country, the President of India can declare Financial Emergency without the counsel from the cabinet.","State Legislatures can not make laws on certain matters without concurrence of Union legislature."],"page":61,"ans":1,"exp":"Art. 142 powers are not constrained by ordinary laws of Parliament.","check":false},{"kind":"note","title":"Supreme Court","group":"Supreme Court","items":[{"t":"li","lv":0,"m":"b","h":"<b>Custodian<\/b> of Constitution"},{"t":"li","lv":0,"m":"b","h":"Parliament can <b>extend, not curtail<\/b> SC’s jurisdiction and powers"},{"t":"li","lv":0,"m":"b","h":"CJI has freedom to <b>appoint staff<\/b> of SC and prescribe conditions of their service"},{"t":"li","lv":0,"m":"b","h":"All expenses are <b>charged<\/b> on Consolidated fund of India (Parliament can discuss, not vote)"},{"t":"li","lv":0,"m":"b","h":"<b>Removed by President<\/b> only after special majority in Parliament (proven misbehavior or incapacity)"},{"t":"li","lv":0,"m":"b","h":"<b>Ban on pleading or acting<\/b> in any Court or authority in India after retirement"},{"t":"li","lv":0,"m":"b","h":"<b>Note:<\/b> Retired HC judge can plead only in SC and other HCs"}]},{"kind":"note","title":"Article 131","group":"Supreme Court","items":[{"t":"li","lv":0,"m":"b","h":"SC has <b>original &amp; exclusive<\/b> jurisdiction in inter-govt disputes (Centre vs States;"},{"t":"p","lv":0,"m":null,"h":"States vs States)"},{"t":"li","lv":0,"m":"b","h":"It <b>does not cover<\/b> inter-govt disputes due to pre-Constitutional agreement or river water sharing"},{"t":"li","lv":0,"m":"b","h":"Original: one can directly move SC"},{"t":"li","lv":0,"m":"b","h":"Exclusive: no other court can decide such dispute"},{"t":"li","lv":0,"m":"b","h":"Original and exclusive: inter-govt dispute; Dispute in election of President and VP"},{"t":"li","lv":0,"m":"b","h":"Original but not exclusive: enforcement of FRs, issue of writs, judicial review, etc."},{"t":"li","lv":0,"m":"b","h":"<b>Note:<\/b> inter-govt dispute in the above is in the context of constitutional relation, not commercial disputes between the governments. Article 131 was first invoked by West Bengal in 1961."}]},{"kind":"note","title":"Advisory Jurisdiction","group":"Supreme Court","items":[{"t":"p","lv":0,"m":null,"h":"By <b>Article 143<\/b> President can seek opinion of SC on"},{"t":"li","lv":0,"m":"yes","h":"any question of <b>law or fact<\/b> of public importance (SC can <b>refuse<\/b>)"},{"t":"li","lv":0,"m":"yes","h":"dispute due to any <b>pre-Constitution agreement<\/b> etc. (SC <b>must<\/b> tender its opinion) In either case SC advice is not binding on President."}]},{"kind":"note","title":"Article 136: Special Leave Petition","group":"Supreme Court","items":[{"t":"li","lv":0,"m":"yes","h":"Any judgment in any matter passed by any court or tribunal in the country"},{"t":"p","lv":0,"m":null,"h":"(except military tribunal and court martial)"},{"t":"li","lv":0,"m":"yes","h":"It is a discretionary power and hence, cannot be claimed as a matter of right"}]},{"kind":"pyq","title":"Supreme Court","group":"Supreme Court","year":"2005","q":"Consider the following statements:\n1. The Parliament cannot enlarge the jurisdiction of the Supreme Court of India as its jurisdiction is limited to that conferred by the Constitution\n2. The officers and servants of the Supreme Court and High Courts are appointed by the concerned Chief Justice and the administrative expenses are charged on the Consolidated Fund of India.\nWhich of the statements given above is/are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":62,"ans":3,"exp":"Parliament can enlarge SC jurisdiction; HC administrative expenses are charged on the State's Consolidated Fund.","check":false},{"kind":"note","title":"Constitution Bench","group":"Constitution Bench","items":[{"t":"p","lv":0,"m":null,"h":"SC bench of 5 or more judges"},{"t":"li","lv n<\/b>"],["<b>Article 74<\/b>","CoM aids and advises the President."],["<b>Article 75<\/b>","President appoints the Prime Minister and, on their advice, appoints other ministers."],["<b>Article 75(1A)<\/b>","Maximum strength of the CoM is 15% of the total members of the Lok Sabha (inserted by 91st CAA, 2003)."],["<b>Article 75(2)<\/b>","Ministers hold office during the pleasure of the President."],["<b>Article 75(3)<\/b>","CoM is collectively responsible to the Lok Sabha."],["<b>Article 75(4)<\/b>","Ministers take an oath of office and secrecy before the President."],["<b>Article 75(5)<\/b>","A minister who is not a member of Parliament for six consecutive months loses their ministership."]],"hdr":true,"cap":null}]},{"kind":"note","title":"Prime Minister · Term","group":"Prime Minister","items":[{"t":"li","lv":0,"m":"n","h":"<b>1. Term:<\/b>"},{"t":"li","lv":1,"m":"b","h":"The Prime Minister does not have a fixed 5-year term."},{"t":"li","lv":1,"m":"b","h":"The Prime Minister holds office during the pleasure of the President."},{"t":"li","lv":1,"m":"b","h":"If the Prime Minister resigns or passes away, the Council of Ministers is automatically dissolved."},{"t":"li","lv":1,"m":"b","h":"The political party then elects a new leader."},{"t":"li","lv":0,"m":"n","h":"<b>2. Oath:<\/b>"},{"t":"li","lv":1,"m":"b","h":"The oath of office is administered by the President."},{"t":"li","lv":0,"m":"n","h":"<b>3. Salary:<\/b>"},{"t":"li","lv":1,"m":"b","h":"The salary of the Prime Minister is the same as that of a Member of Parliament."},{"t":"li","lv":1,"m":"b","h":"It is determined by Parliament and is not charged on the Consolidated Fund of India."}]},{"kind":"note","title":"Prime Minister · Roles","group":"Prime Minister","items":[{"t":"li","lv":0,"m":"n","h":"<b>4. Roles:<\/b>"},{"t":"li","lv":1,"m":"b","h":"The President is the nominal executive (de jure)."},{"t":"li","lv":1,"m":"b","h":"The Prime Minister is the real executive (de facto)."},{"t":"li","lv":0,"m":"n","h":"<b>5. Appointment:<\/b>"},{"t":"li","lv":1,"m":"b","h":"The Constitution does not specify a detailed procedure; Article 75 states the PM shall be appointed by the President."},{"t":"li","lv":1,"m":"b","h":"By convention, the President appoints the leader of the majority party, who must prove their majority within one month."},{"t":"li","lv":1,"m":"b","h":"If no party has a clear majority, the President may use their discretion to appoint the Prime Minister."},{"t":"li","lv":1,"m":"b","h":"The Prime Minister can be from the Rajya Sabha (examples include Indira Gandhi in 1966, Deve Gowda in 1996, and Manmohan Singh in 2004)."},{"t":"li","lv":1,"m":"b","h":"A non-MP can be appointed as PM, but must get elected to Parliament within six months."}]},{"kind":"note","title":"Prime Minister · Bits on PM","group":"Prime Minister","items":[{"t":"li","lv":0,"m":"n","h":"<b>6. Bits on PM:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Leader of the House of which he is a member."},{"t":"li","lv":1,"m":"b","h":"Advises President to summon/prorogue Parliament."},{"t":"li","lv":1,"m":"b","h":"Can advise President to dissolve Lok Sabha anytime."},{"t":"li","lv":1,"m":"b","h":"Cannot advise President to dissolve Rajya Sabha anytime."},{"t":"li","lv":1,"m":"b","h":"Advises President to appoint ministers and allocates their portfolios."},{"t":"li","lv":1,"m":"b","h":"Can ask any minister to resign anytime."},{"t":"li","lv":1,"m":"b","h":"Channel of communication between the President and the Council of Ministers (CoM)."},{"t":"li","lv":1,"m":"b","h":"Advises President on the appointment of key officials such as the Attorney General (AG), Comptroller and Auditor General (CAG), Union Public Service Commission (UPSC) members, Election Commission (EC) members, Finance Commission (FC) members, etc."},{"t":"li","lv":1,"m":"b","h":"Article 78: Duty of Prime Minister to Communicate to the President"},{"t":"li","lv":2,"m":"n","h":"i. All decisions of the CoM."},{"t":"li","lv":2,"m":"n","h":"ii. Information sought by the President."}]},{"kind":"note","title":"Disqualification of MPs in India · part 1","group":"Disqualification of MPs in India","items":[{"t":"li","lv":0,"m":"n","h":"1. <b>Defection<\/b>:"},{"t":"li","lv":1,"m":"b","h":"<b>Provisions<\/b>: Governed by the 10th Schedule, introduced by the 52nd Amendment Act, 1985, and amended by the 91st Amendment Act, 2003."},{"t":"li","lv":1,"m":"b","h":"<b>Causes<\/b>:"},{"t":"li","lv":2,"m":"b","h":"Voluntarily giving up membership of the party."},{"t":"li","lv":2,"m":"b","h":"Voting against party directions without approval."},{"t":"li","lv":2,"m":"b","h":"Independent members joining a party."},{"t":"li","lv":2,"m":"b","h":"Nominated members joining a party after six months."},{"t":"li","lv":1,"m":"b","h":"<b>Exemptions:<\/b>"},{"t":"li","lv":2,"m":"b","h":"Speaker"},{"t":"li","lv":2,"m":"b","h":"2/3rd split → either they join other party or remain separate"},{"t":"li","lv":1,"m":"b","h":"<b>Deciding Authority<\/b>: The Presiding Officer (Speaker or Chairman)."},{"t":"li","lv":1,"m":"b","h":"<b>Important Case<\/b>: Kilhoto Holohan"},{"t":"li","lv":2,"m":"b","h":"Upheld ADL"},{"t":"li","lv":2,"m":"b","h":"No judicial review before decision of speaker"}]},{"kind":"note","title":"Disqualification of MPs in India · part 2","group":"Disqualification of MPs in India","items":[{"t":"li","lv":0,"m":"n","h":"2. <b>Office of Profit<\/b>: Not defined in Constitution"},{"t":"li","lv":1,"m":"b","h":"<b>Provisions<\/b>: Article 102(1)(a) for MPs and Article 191(1)(a) for MLAs."},{"t":"li","lv":1,"m":"b","h":"<b>Causes<\/b>: Holding an office under the government that yields profit or pecuniary gain."},{"t":"li","lv":1,"m":"b","h":"<b>Deciding Authority<\/b>: The President (for MPs) or the Governor (for MLAs), in consultation with the Election Commission of India (ECI)."},{"t":"li","lv":1,"m":"b","h":"<b>Important Case<\/b>: Jaya Bachchan Case → SC declared what’s office of profit"},{"t":"li","lv":2,"m":"b","h":"If the government is the appointing authority"},{"t":"li","lv":2,"m":"b","h":"Government has the power to terminate"},{"t":"li","lv":2,"m":"b","h":"Whether the government determines remuneration"},{"t":"li","lv":0,"m":"n","h":"3. <b>Criminal Activities<\/b>:"},{"t":"li","lv":1,"m":"b","h":"<b>Provisions<\/b>: Articles 102 and 103 for MPs and Articles 191 and 192 for MLAs."},{"t":"li","lv":1,"m":"b","h":"<b>Causes<\/b>: Conviction under various criminal laws, as specified in different sections of the Representation of the People Act (RPA):"},{"t":"li","lv":2,"m":"b","h":"8(1) - Various criminal acts as given in IPC"},{"t":"li","lv":2,"m":"b","h":"8(2) - Hoarding, adulteration, dowry"},{"t":"li","lv":2,"m":"b","h":"8(3) - If person is convicted for 2 years/+ then he/she shall be disqualified from the date of conviction"},{"t":"li","lv":2,"m":"b","h":"8A - corrupt practices during elections"},{"t":"li","lv":2,"m":"b","h":"9 - Corruption, disloyalty"},{"t":"li","lv":2,"m":"b","h":"9A - Govt. Contracts"},{"t":"li","lv":2,"m":"b","h":"10 - Member of both houses"},{"t":"li","lv":1,"m":"b","h":"<b>Deciding Authority<\/b>: The President (for MPs) or the Governor (for MLAs), in consultation with the Election Commission of India (ECI)."},{"t":"li","lv":1,"m":"b","h":"<b>Important Case<\/b>: Lily Thomas Case → SC struck down Sec 8(4) which gave time for appeal"}]}]},{"title":"Parliamentary Business","cards":[{"kind":"note","title":"Sessions of the House","group":"Sessions of the House","items":[{"t":"li","lv":0,"m":"b","h":"Number of Sessions -&gt; According to Parliamentary Convention: 3"},{"t":"li","lv":1,"m":"n","h":"1. Budget Session → February - May"},{"t":"li","lv":1,"m":"n","h":"2. Monsoon Session → July - September"},{"t":"li","lv":1,"m":"n","h":"3. Winter Session → November - December"},{"t":"li","lv":0,"m":"b","h":"Initiating the Session : Summoning by → President (Article 85) → At such time and place as he thinks fit"},{"t":"li","lv":0,"m":"b","h":"Not more than 6 months must be passed between two sessions (Article 85)"},{"t":"li","lv":0,"m":"b","h":"<b>Session cycle<\/b>: <mark>Summon<\/mark> → sittings of the House (<mark>adjournment<\/mark> and reassembly between sittings) → <mark>prorogation<\/mark> (or <mark>dissolution<\/mark> of Lok Sabha) → <mark>recess<\/mark> → summon again for the new session"},{"t":"li","lv":0,"m":"b","h":"Sitting of the house → 1st hour = Question House → Zero Hour → Lunch → Agenda of the day : Legislative bills"},{"t":"li","lv":0,"m":"b","h":"Question hour → Asking questions to government/ministers/private members + Mentioned in Rules of Procedure"},{"t":"li","lv":0,"m":"b","h":"Zero Hour = Time gap between Question hour and agenda + Informal device → not mentioned in Rules of procedure + Indian innovation"}]},{"kind":"note","title":"Joint Sitting of the Houses (Article 108) · part 1","group":"Joint Sitting of the Houses (Article 108)","items":[{"t":"li","lv":0,"m":"b","h":"When?"},{"t":"li","lv":1,"m":"b","h":"Bill passed by one House; rejected by the other House."},{"t":"li","lv":1,"m":"b","h":"Houses disagree on amendments to the Bill."},{"t":"li","lv":1,"m":"b","h":"Bill not passed for more than 6 months by the other House."},{"t":"li","lv":0,"m":"b","h":"Who Summons?"},{"t":"li","lv":1,"m":"b","h":"President"},{"t":"li","lv":0,"m":"b","h":"Who Presides?"},{"t":"li","lv":1,"m":"b","h":"Speaker of Lok Sabha"},{"t":"li","lv":1,"m":"b","h":"Deputy Speaker of Lok Sabha (if Speaker is absent)"},{"t":"li","lv":1,"m":"b","h":"Deputy Chairman of Rajya Sabha (if both are absent)"}]},{"kind":"note","title":"Joint Sitting of the Houses (Article 108) · part 2","group":"Joint Sitting of the Houses (Article 108)","items":[{"t":"li","lv":0,"m":"b","h":"Quorum"},{"t":"li","lv":1,"m":"b","h":"One-tenth of the total members of both Houses"},{"t":"li","lv":0,"m":"b","h":"Passage of Bill"},{"t":"li","lv":1,"m":"b","h":"Majority of total members present and voting"},{"t":"li","lv":0,"m":"b","h":"Joint Sitting Applies to:"},{"t":"li","lv":1,"m":"b","h":"Ordinary Bill"},{"t":"li","lv":1,"m":"b","h":"<s>Money Bill<\/s> (No joint sitting, Rajya Sabha has no veto power)"},{"t":"li","lv":1,"m":"b","h":"<s>Constitutional Amendment Bill<\/s> (Must be passed separately by both Houses)"}]},{"kind":"note","title":"President's approach to Bills","group":"Joint Sitting of the Houses (Article 108)","items":[{"t":"tab","rows":[["","<b>Ordinary Bill<\/b>","<b>Money Bill<\/b>","<b>Constitution Amendment Bill<\/b>"],["<b>Gives Assent<\/b>","✔","✔","✔"],["<b>Withholds Assent<\/b>","✔","✔","<b>x<\/b>"],["<b>Returns the bill for reconsideration<\/b>","✔","<b>x<\/b>","<b>x<\/b>"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Motions","group":"Motions","items":[{"t":"li","lv":0,"m":"b","h":"Regulated by the Presiding Officer"},{"t":"li","lv":0,"m":"b","h":"A proposal by a member to discuss an issue in the House"},{"t":"li","lv":0,"m":"b","h":"Basis of parliamentary proceedings"}]},{"kind":"note","title":"Types of Motions · Substantive Motion","group":"Motions","items":[{"t":"li","lv":0,"m":"n","h":"<b>1. Substantive Motion:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Self-contained"},{"t":"li","lv":1,"m":"b","h":"Important matter"},{"t":"li","lv":1,"m":"b","h":"Examples:"},{"t":"li","lv":2,"m":"b","h":"Impeachment of the President"},{"t":"li","lv":2,"m":"b","h":"No confidence motion"},{"t":"li","lv":0,"m":"n","h":"<b>2. Substitute Motion:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Acts as a substitute for the original motion [Depends on the original motion]"},{"t":"li","lv":1,"m":"b","h":"Example: Present international situation"},{"t":"li","lv":2,"m":"b","h":"Unsatisfactory"},{"t":"li","lv":2,"m":"b","h":"Conduct not up to mark"},{"t":"li","lv":2,"m":"b","h":"Kuwait and Iraq"}]},{"kind":"note","title":"Types of Motions · Subsidiary Motion","group":"Motions","items":[{"t":"li","lv":0,"m":"n","h":"<b>3. Subsidiary Motion:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Meaningless by itself"},{"t":"li","lv":1,"m":"b","h":"Must refer to the original motion"},{"t":"li","lv":1,"m":"b","h":"Examples:"},{"t":"li","lv":2,"m":"b","h":"Conduct of members"},{"t":"li","lv":2,"m":"b","h":"Situation in Kuwait"},{"t":"li","lv":1,"m":"b","h":"<b>Types:<\/b>"},{"t":"li","lv":1,"m":"b","h":"<b>Ancillary Motion<\/b>"},{"t":"li","lv":2,"m":"b","h":"Way of doing business in the House"},{"t":"li","lv":2,"m":"b","h":"Example:"},{"t":"li","lv":2,"m":"b","h":"Motion that a bill be taken into consideration"},{"t":"li","lv":1,"m":"b","h":"<b>Superseding Motion:<\/b>"},{"t":"li","lv":2,"m":"b","h":"To supersede a question in the House"},{"t":"li","lv":2,"m":"b","h":"Example: Bill to"},{"t":"li","lv":3,"m":"b","h":"Select Committee"},{"t":"li","lv":3,"m":"b","h":"Joint Committee"},{"t":"li","lv":3,"m":"b","h":"Elicit public opinion"},{"t":"li","lv":1,"m":"b","h":"<b>Amendment Motion:<\/b>"},{"t":"li","lv":2,"m":"b","h":"To amend a question in the House"},{"t":"li","lv":2,"m":"b","h":"Example:"},{"t":"li","lv":3,"m":"b","h":"Motion to amend a bill"}]},{"kind":"note","title":"Types of Motions in Parliament","group":"Motions","items":[{"t":"p","lv":0,"m":null,"h":"<b>Motion → Opinion of the House → Resolution<\/b>"},{"t":"tab","rows":[["<b>Motion<\/b>","<b>Description<\/b>"],["<b>Closure Motion<\/b>","Motion to end debate and vote. Types include Simple, Compartment, Kangaroo, and Guillotine Closures."],["<b>Privilege Motion<\/b>","Addresses a breach of parliamentary privileges by a minister, aiming for censure."],["<b>Calling Attention<\/b>","Highlights urgent public matters and seeks an official statement."],["<b>Adjournment Motion<\/b>","Highlights urgent public matters with potential to interrupt regular House business."],["<b>No-Confidence Motion<\/b>","Removes the ministry from office if it loses the motion.\nMoved by Lok Sabha members."],["<b>Confidence Motion<\/b>","Government seeks to affirm its majority in the House.\nNegation results in the government's fall."],["<b>Censure Motion<\/b>","Motion of disapproval, distinct from a no-confidence motion."],["<b>Motion of Thanks<\/b>","Follows the President's annual address; its passage or failure implies government support or defeat."],["<b>No-Day-Yet-Named Motion<\/b>","Accepted but undated motion; date set based on House business status and leader discussions."],["<b>Dilatory Motion<\/b>","Adjourns, delays, or slows debate; can be moved anytime after a motion is made."]],"hdr":true,"cap":null}]},{"kind":"note","title":"Types of Bills in Parliament","group":"Types of Bills in Parliament","items":[{"t":"tab","rows":[["<b>Type of Bill<\/b>","<b>Description<\/b>"],["<b>Ordinary Bills<\/b>","Any matter other than financial matters."],["<b>Money Bills<\/b>","Concern financial matters like taxation, borrowing, expenditure, etc."],["<b>Financial Bills<\/b>","Include financial subjects but are not Money Bills."],["<b>Constitutional Amendment Bills<\/b>","Propose changes to the provisions of the Constitution."]],"hdr":true,"cap":null}]},{"kind":"note","title":"Comparison of Money Bill and Financial Bill","group":"Comparison of Money Bill and Financial Bill","items":[{"t":"tab","rows":[["<b>Aspect<\/b>","<b>Money Bill<\/b>","<b>Financial Bill<\/b>"],["<b>Constitutional Reference<\/b>","Article 110","Article 117"],["<b>Definition<\/b>","Only matters specified under Article 110:\n● Taxation,\n● Borrowing by Centre,\n● Consolidated &amp; Contingency Funds → Custody and Payment\n● Matters related to the Consolidated Fund → Appropriation of money + Charged Expenditure <s>Penalty and fees Tax by local authority<\/s>","3 types-\n● Money Bill (Article 110)\n● Financial Bill 1 (Article 117(1)), Financial Bill 2 (Article 117(3))\nFB1: Matters of Article 110 and also other financial matters;\nFB2: Expenditure from Consolidated Fund but no matters of Article 110"],["<b>Introduction<\/b>","Only in Lok Sabha","FB1: Only in Lok Sabha; FB2:\nAny House"],["<b>President's Recommendation<\/b>","Must before introduction","FB1: Must before introduction; FB2: Before consideration"],["<b>Procedure of Passage<\/b>","Passed by Lok Sabha\n⬇\nCannot be amended/rejected by Rajya Sabha\n⬇\nRajya Sabha must return within 14 days with/without recommendations","Like an Ordinary Bill"],["<b>Speaker's Certification<\/b>","Required before sending to Rajya Sabha","Not required"],["<b>President's Choice<\/b>","Assent, Withhold","Assent, Withhold, Return"],["<b>Joint Sitting<\/b>","No","Yes"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Presiding Officers of Parliament","group":"Presiding Officers of Parliament","items":[{"t":"tab","rows":[["<b>Position<\/b>","<b>Elected by<\/b>","<b>Resigns to<\/b>","<b>Removed by<\/b>"],["<b>Chairman<\/b>","All Rajya Sabha MPs","President","Effective majority in Rajya Sabha; agreed to by Lok Sabha"],["<b>Deputy Chairman<\/b>","All Rajya Sabha MPs","Vice-Presid ent","Effective majority in Rajya Sabha"],["<b>Speaker<\/b>","All Lok Sabha MPs","Deputy Speaker","Effective majority in Lok Sabha"],["<b>Deputy Speaker<\/b>","All Lok Sabha MPs","Speaker","Effective majority in Lok Sabha"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Speaker of the Lok Sabha","group":"Presiding Officers of Parliament","items":[{"t":"tab","rows":[["<b>Aspect<\/b>","<b>Details<\/b>"],["<b>Election<\/b>","1. Date fixed by President\n2. Elected by Lok Sabha members from amongst its members\n3. Does not resign from party (unlike the UK)"],["<b>Does the Speaker Vote?<\/b>","1. Does not vote in the first instance\n2. Votes in case of a tie (casting vote)\n3. When resolution for removal is being considered, does not preside and votes in the first instance, not in case of a tie"],["<b>Speaker Vacates Seat When<\/b>","1. The house is dissolved\n2. Ceases to be a member of the House\n3. Removed by effective majority of Lok Sabha"],["<b>When House is Dissolved<\/b>","Speaker continues in office until immediately before the first meeting of the new House (as given in the Constitution)"],["<b>Speaker<\/b>","Holds office during the pleasure of the President\nMust become a Member of Parliament within 6 months of becoming Speaker"],["<b>1st Speaker<\/b>","G.V. Mavalankar"],["<b>1st Deputy Speaker<\/b>","Ananthasayanam Ayyangar"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Deputy Speaker","group":"Presiding Officers of Parliament","items":[{"t":"li","lv":0,"m":"b","h":"<b>Election<\/b>:"},{"t":"li","lv":1,"m":"b","h":"Date of election fixed by Speaker."},{"t":"li","lv":1,"m":"b","h":"Usually, the post goes to the main opposition party."},{"t":"li","lv":1,"m":"b","h":"Seat vacant since 26th May 2019 (as of 8th March 2022)."},{"t":"li","lv":1,"m":"b","h":"Automatically becomes Chairman of any parliamentary committee of which he is a member."},{"t":"li","lv":0,"m":"b","h":"<b>Note<\/b>:"},{"t":"li","lv":1,"m":"b","h":"Speaker and Deputy Speaker do not take any separate oath (other than as an MP)."}]},{"kind":"note","title":"Speaker Pro Tem","group":"Presiding Officers of Parliament","items":[{"t":"li","lv":0,"m":"b","h":"Appointed by President."},{"t":"li","lv":0,"m":"b","h":"Usually the senior-most member of the House."},{"t":"li","lv":0,"m":"b","h":"Has all powers of Speaker."},{"t":"li","lv":0,"m":"b","h":"Presides over the first sitting of the new Lok Sabha, administers the oath to new members, and lets the House elect the Speaker."},{"t":"li","lv":0,"m":"b","h":"Ceases to exist once the new Speaker is elected."}]},{"kind":"note","title":"Leader of Opposition","group":"Presiding Officers of Parliament","items":[{"t":"li","lv":0,"m":"b","h":"Salaries and Allowances of Leaders of Opposition in Parliament Act 1977 (SALOP Act, 1977) defines Leader of Opposition in Lok Sabha/Rajya Sabha."},{"t":"li","lv":0,"m":"b","h":"Leader of the party with at least 1/10th seats."},{"t":"li","lv":0,"m":"b","h":"Leader of the largest opposition party recognized by Speaker/Chairman."},{"t":"li","lv":0,"m":"b","h":"Official recognition in 1969."},{"t":"li","lv":0,"m":"b","h":"Statutory recognition in 1977."},{"t":"li","lv":0,"m":"b","h":"Salary/allowance same as Cabinet Minister."},{"t":"li","lv":0,"m":"b","h":"Table of precedence: CJI at #6, Leader of Opposition at #7, CEC at #9."},{"t":"li","lv":0,"m":"b","h":"Leader of Opposition in Lok Sabha is part of the selection committee for Lokpal, CVC, CIC, CBI Director."}]},{"kind":"note","title":"Directions by Speaker (1956)","group":"Presiding Officers of Parliament","items":[{"t":"li","lv":0,"m":"b","h":"To get rooms, etc., a party/group should have strength at least equal to quorum."}]},{"kind":"note","title":"Whip","group":"Presiding Officers of Parliament","items":[{"t":"li","lv":0,"m":"b","h":"Issued by political parties to regulate the action of party members in Parliament."},{"t":"li","lv":0,"m":"b","h":"Not mentioned in Constitution, laws, rules, etc.; it is a convention."}]}]},{"title":"Committees & State Legislature","cards":[{"kind":"note","title":"Parliamentary Committees in India","group":"Parliamentary Committees in India","items":[{"t":"li","lv":0,"m":"b","h":"Parliament has limited time and expertise, so it is assisted by a number of committees by the rules of the two houses."},{"t":"li","lv":0,"m":"b","h":"Mentioned in Constitution → Article 105"},{"t":"li","lv":0,"m":"b","h":"Membership and tenure → determined by the rules of two houses"}]},{"kind":"note","title":"Types of Committees","group":"Parliamentary Committees in India","items":[{"t":"tab","rows":[["<b>Aspect<\/b>","<b>Standing Committees<\/b>","<b>Ad Hoc Committees<\/b>"],["<b>Existence<\/b>","Permanent, continuous","Temporary"],["<b>Constitutional Basis<\/b>","Article 105, Article 118","Article 105, Article 118"],["<b>Roles &amp; Functions<\/b>","Scrutinize bills, budgets, parliamentary oversight","Scrutinize bills, budgets, parliamentary oversight"],["<b>Appointment<\/b>","Appointed/elected by House, nominated by Speaker/Chairman","Appointed/elected by House, nominated by Speaker/Chairman"],["<b>Report<\/b>","Presents report to House/Speaker","Presents report to House/Speaker"],["<b>Secretariat<\/b>","Provided by concerned House","Provided by concerned House"],["<b>Membership<\/b>","Drawn from LS/RS","Drawn from LS/RS"],["<b>Term<\/b>","Usually 1 year","Based on mandate"],["<b>Examples<\/b>","DRSCs, Financial Committees","JPCs for specific purposes or duration"],["<b>Recommendati on<\/b>","Not binding","Not binding"],["<b>Party Whip<\/b>","Meetings held in closed doors, not bound by party whip","Meetings held in closed doors, not bound by party whip"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Department-Related Standing Committees (DRSCs)","group":"Parliamentary Committees in India","items":[{"t":"li","lv":0,"m":"n","h":"1. Members: 31 (21 from LS and 10 from RS)."},{"t":"li","lv":0,"m":"n","h":"2. Selection: Nominated by the Speaker/Chairman."},{"t":"li","lv":0,"m":"n","h":"3. Term: 1 year."},{"t":"li","lv":0,"m":"n","h":"4. Total Number: 24, covering all ministries/departments of the Central Government."},{"t":"li","lv":0,"m":"n","h":"5. Work: Consider bills (not all), demands for grants, long-term policy issues."}]},{"kind":"note","title":"Financial Committees in Parliament","group":"Parliamentary Committees in India","items":[{"t":"tab","rows":[["<b>Financial Committees<\/b>","<b>Purpose<\/b>","<b>Members (LS + RS)<\/b>","<b>Method<\/b>","<b>Term<\/b>","<b>Chairman<\/b>","<b>Miscellaneous<\/b>"],["<b>Public Accounts Committee<\/b>","Examine CAG reports on: appropriation accounts, finance accounts, public undertakings","22 (15 + 7)","Proportional Representation (PR)","1 year","From Opposition (convention), Appointed by Speaker","Since 1921 under GoI Act 1919"],["<b>Estimates Committee<\/b>","Examine budget and suggest economies in expenditure","30 (30 + 0)","Proportional Representation (PR)","1 year","From Ruling Party, Appointed by Speaker","Since 1950, aka 'continuous economy committee'"],["<b>Committee on Public Undertakings<\/b>","Examine reports on PSUs (by CAG and others)","22 (15 + 7)","Proportional Representation (PR)","1 year","From Lok Sabha, Appointed by Speaker","Since 1964"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Committees to Inquire","group":"Committees to Inquire","items":[{"t":"tab","rows":[["<b>Committees to Inquire<\/b>","<b>Purpose<\/b>","<b>LS Committee<\/b>","<b>RS Committee<\/b>"],["<b>Committee on Petitions<\/b>","To examine petitions on bills and matters related to Union subjects","15 members","10 members"],["<b>Committee of Privileges<\/b>","To examine breach of privilege of the House and its members","15 members","10 members"],["<b>Ethics Committee<\/b>","To enforce code of conduct of MPs","Since 2000","Since 1997"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Miscellaneous Committees in Parliament","group":"Committees to Inquire","items":[{"t":"li","lv":0,"m":"n","h":"<b>1. Committee on Government Assurances:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Purpose: Examines the status of promises made by ministers on the floor of the House."},{"t":"li","lv":1,"m":"b","h":"Lok Sabha Committee: 15 members."},{"t":"li","lv":1,"m":"b","h":"Rajya Sabha Committee: 10 members."},{"t":"li","lv":0,"m":"n","h":"<b>2. Committee on Subordinate Legislation:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Purpose: Examines whether the powers to make subordinate legislation are being properly exercised by the Executive."},{"t":"li","lv":1,"m":"b","h":"Lok Sabha Committee: 15 members."},{"t":"li","lv":1,"m":"b","h":"Rajya Sabha Committee: 15 members."},{"t":"li","lv":0,"m":"n","h":"<b>3. Rules Committee:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Purpose: Considers procedure and rules of the House."},{"t":"li","lv":1,"m":"b","h":"Lok Sabha Committee: 15 members, including the Speaker as ex-officio chairman."},{"t":"li","lv":1,"m":"b","h":"Rajya Sabha Committee: 16 members, including the Chairman as ex-officio chairman."},{"t":"li","lv":0,"m":"n","h":"<b>4. Business Advisory Committee:<\/b>"},{"t":"li","lv":1,"m":"b","h":"Purpose: Allocates time for the business of the House."},{"t":"li","lv":1,"m":"b","h":"Lok Sabha Committee: 15 members, including the Speaker as ex-officio chairman."},{"t":"li","lv":1,"m":"b","h":"Rajya Sabha Committee: 11 members, including the Chairman as ex-officio chairman."}]},{"kind":"note","title":"State Legislature · Articles 168-212: Part VI of the Constitution","group":"State Legislature","items":[{"t":"li","lv":0,"m":"n","h":"<b>1. Articles 168-212: Part VI of the Constitution<\/b>"},{"t":"li","lv":1,"m":"b","h":"This part deals with the state legislatures."},{"t":"li","lv":0,"m":"n","h":"<b>2. Unicameral and Bicameral Legislatures<\/b>"},{"t":"li","lv":1,"m":"b","h":"Unicameral: States with a single legislative house."},{"t":"li","lv":1,"m":"b","h":"Bicameral: States with two legislative houses. For example, Uttar Pradesh and Bihar."},{"t":"li","lv":1,"m":"b","h":"Number of States with Bicameral Legislature: 6 states."},{"t":"li","lv":0,"m":"n","h":"<b>3. Legislative Assembly (Vidhan Sabha)<\/b>"},{"t":"li","lv":1,"m":"b","h":"<b>Strength:<\/b> Minimum 60, Maximum 500 members."},{"t":"li","lv":1,"m":"b","h":"Directly Elected."},{"t":"li","lv":2,"m":"b","h":"Example: Bihar has 243 members."},{"t":"li","lv":1,"m":"b","h":"Reservation of Seats: Reserved for SCs/STs based on population (Article 332)."},{"t":"li","lv":2,"m":"b","h":"Example: Bihar has 38 seats for SCs and 2 seats for STs."}]},{"kind":"note","title":"State Legislature · Legislative Council (Vidhan Parishad)","group":"State Legislature","items":[{"t":"li","lv":0,"m":"n","h":"<b>4. Legislative Council (Vidhan Parishad)<\/b>"},{"t":"li","lv":1,"m":"b","h":"Permanent Body: Members have staggered terms."},{"t":"li","lv":1,"m":"b","h":"Strength: Minimum 40, Maximum one-third of Legislative Assembly seats."},{"t":"li","lv":1,"m":"b","h":"Example: Bihar has 75 seats in the Legislative Council. → 63 elected + 12 nominated"},{"t":"li","lv":1,"m":"b","h":"Composition:"},{"t":"li","lv":2,"m":"b","h":"Indirectly Elected."},{"t":"li","lv":2,"m":"b","h":"Election Method:"},{"t":"li","lv":3,"m":"n","h":"1. One third elected by MLAs."},{"t":"li","lv":3,"m":"n","h":"2. One third elected by local bodies."},{"t":"li","lv":3,"m":"n","h":"3. One twelfth elected by teachers (3 years standing)."},{"t":"li","lv":3,"m":"n","h":"4. One twelfth elected by graduates (3 years standing, residence in state)."},{"t":"li","lv":3,"m":"n","h":"5. Remaining members (one sixth) are nominated by the Governor for their expertise in fields like art, literature, science, cooperative movement, and social service."}]},{"kind":"note","title":"State Legislature · Passing Bills in the State Legislature","group":"State Legislature","items":[{"t":"li","lv":0,"m":"n","h":"<b>5. Passing Bills in the State Legislature<\/b>"},{"t":"li","lv":1,"m":"b","h":"Legislative Assembly: Passes bills, which then go to the Legislative Council."},{"t":"li","lv":1,"m":"b","h":"Legislative Council: Can pass, reject, or amend bills. If amended, the bill goes back to the Assembly."},{"t":"li","lv":1,"m":"b","h":"Governor: Final approval."},{"t":"li","lv":2,"m":"b","h":"Additional Feature: The Governor can reserve the bill for the consideration of the President."}]},{"kind":"note","title":"Types of Majorities in Parliamentary voting","group":"Types of Majorities in Parliamentary voting","items":[{"t":"tab","rows":[["<b>Type of Majority<\/b>","<b>Description<\/b>","<b>Example of Use<\/b>"],["<b>Simple Majority<\/b>","More than 50% of the members present and voting.","→ Passing ordinary bills, Financial bills\n→ No-confidence motions"],["<b>Absolute Majority<\/b>","More than 50% of the total membership of the House.","→ Required for forming a government (majority of the full strength of the House)"],["<b>Effective Majority<\/b>","More than 50% of the effective strength of the House (excluding vacant seats).","→ Removal of Vice President, Deputy Chairman, Speaker, Deputy Speaker"],["<b>Special Majority<\/b>","Two-thirds of the members present and voting","→ A. 249 t":"li","lv":0,"m":"b","h":"It can be limited to specified part of India by President (42nd Amendment)"},{"t":"li","lv":0,"m":"b","h":"Parliament can extend term of LS/SLAs one year at a time, any number of times"},{"t":"li","lv":0,"m":"b","h":"44th Amendment Act 1978:"},{"t":"li","lv":1,"m":"b","h":"It replaced ‘internal disturbance’ with ‘armed rebellion’."},{"t":"li","lv":1,"m":"b","h":"Prez needs written recommendation from cabinet (not PM) to declare Nat. Emergency."},{"t":"li","lv":0,"m":"b","h":"State govt are not suspended, but come in complete control of Centre."},{"t":"li","lv":0,"m":"b","h":"Parliament can make law on state list. If parliament not in session, Prez can issue ordinance."},{"t":"li","lv":0,"m":"b","h":"President can modify constitutional distribution of revenue between Centre and States."}]},{"kind":"note","title":"President’s Rule","group":"Emergency Provisions","items":[{"t":"p","lv":0,"m":null,"h":"proclaimed u/a 356 on two grounds"},{"t":"li","lv":0,"m":"b","h":"State not acting as per Constitution (mentioned in 356)"},{"t":"li","lv":0,"m":"b","h":"State fails to comply with any direction from Centre (mentioned in 365)"}]},{"kind":"note","title":"President’s rule can be imposed if","group":"Emergency Provisions","items":[{"t":"li","lv":0,"m":"b","h":"Hung assembly after elections"},{"t":"li","lv":0,"m":"b","h":"Govt resigns and no other party is able to form govt."},{"t":"li","lv":0,"m":"b","h":"Constitutional direction by Centre is disregarded by State"},{"t":"li","lv":0,"m":"b","h":"State govt is acting against the Constitution"},{"t":"li","lv":0,"m":"b","h":"<s>Maladministration, corruption, financial exigencies<\/s>"},{"t":"li","lv":0,"m":"b","h":"<s>Governor recommends Prez rule on his own assessment, without allowing govt to prove majority on floor of house<\/s>"}]},{"kind":"note","title":"During President's Rule","group":"Emergency Provisions","items":[{"t":"li","lv":0,"m":"b","h":"Council of Ministers dismissed"},{"t":"li","lv":0,"m":"b","h":"State assembly either suspended or dissolved"},{"t":"li","lv":0,"m":"b","h":"No impact on Fundamental rights"},{"t":"li","lv":0,"m":"b","h":"No impact on power of High Court"}]},{"kind":"pyq","title":"Emergency Provisions","group":"Emergency Provisions","year":"2003","q":"Which one of the following Articles of the Indian Constitution provides that it shall be the duty of the Union to protect every State against external aggression and internal disturbance?","opts":["Article 215","Article 275","Article 325","Article 355"],"page":103,"ans":3,"exp":"Art. 355 — duty of the Union to protect States against external aggression and internal disturbance.","check":false},{"kind":"note","title":"Article 355 → It is duty of Centre to","group":"Emergency Provisions","items":[{"t":"li","lv":0,"m":"b","h":"Protect every state from external aggression and internal disturbance"},{"t":"li","lv":0,"m":"b","h":"Ensure that State govt act as per Constitution"}]},{"kind":"pyq","title":"Emergency Provisions","group":"Emergency Provisions","year":"2017","q":"Which of the following are not necessarily the consequences of proclamation of President&#x27;s rule in a State?\n1. Dissolution of State Legislative Assembly\n2. Removal of Council of Ministers in the State\n3. Dissolution of local bodies\nSelect the correct answer:","opts":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"page":103,"ans":1,"exp":"Under President's rule the Council of Ministers is removed, but the Assembly may only be suspended and local bodies continue.","check":false},{"kind":"pyq","title":"Emergency Provisions","group":"Emergency Provisions","year":"2006","q":"Consider the following statements:\n1. The Rajya Sabha alone has the power to declare that it would be in national interest for the Parliament to legislate with respect to a matter in the State List.\n2. Resolution approving the Proclamation of Emergency are passed only by Lok Sabha.\nWhich of above statements are correct?","opts":["1 only","2 only","Both 1and 2","Neither 1 nor 2"],"page":104,"ans":0,"exp":"Only the Rajya Sabha can pass an Art. 249 resolution; emergency proclamations are approved by both Houses.","check":false},{"kind":"pyq","title":"Emergency Provisions","group":"Emergency Provisions","year":"2018","q":"If the President of India exercises his power as provided under Article 356 of the Constitution in respect of a particular State, then","opts":["the Assembly of the State is automatically dissolved","the powers of the Legislature of that State shall be exercisable by or under the authority of the Parliament","Article 19 is suspended in that State","the President can make laws relating to that State"],"page":104,"ans":1,"exp":"The State legislature's powers become exercisable by or under the authority of Parliament.","check":false},{"kind":"pyq","title":"Emergency Provisions","group":"Emergency Provisions","year":"2007","q":"Consider the following statements in respect of financial emergency under Article 360 of the Constitution of India:\n1. A Proclamation of financial emergency issued shall cease to operate at the expiration of two months, unless before the expiration of that period it has been approved by the resolution of both houses of Parliament.\n2. If any proclamation of financial emergency is in operation, it is competent for the president of India to issue directions for the reduction of salaries and allowances of all or any class of persons serving in connection with the affairs of the Union but excluding the Judges of the Supreme Court and the High Courts.\nWhich of the statements given above is/are correct?","opts":["1 only","2 only","Both 1and 2","Neither 1 nor 2"],"page":104,"ans":0,"exp":"Statement 1 is correct; during a financial emergency salaries of SC and HC judges can also be reduced.","check":false}]},{"title":"Constitutional & Statutory Bodies","cards":[{"kind":"note","title":"Constitutional Bodies","group":"Constitutional Bodies","items":[{"t":"tab","rows":[["","<b>ECI<\/b>","<b>UPSC<\/b>","<b>SPSC<\/b>","<b>CAG<\/b>"],["<b>Article<\/b>","324","315","315","148"],["<b>Purpose<\/b>","Free and Fair elections","Watchdog of merit system","","Guardian of public purse"],["<b>Composition<\/b>","1 CEC + such other numbers of ECs as <b>President<\/b> may fix","<b>President<\/b> decides the number of members","<b>Governor<\/b> decides the number of members","1"],["<b>Qualifications<\/b>","","50% of members should have been government servant for 10 years","",""],["<b>Selection Committee<\/b>","None","","",""],["<b>Appointed by<\/b>","President","President","Governor","President"],["<b>Sallary &amp; Allowances<\/b>","Like SC judge","Like CEC &amp; ECs, charged on CFI","charged on CFS","Like SC judge, charged on CFI"],["<b>Service conditions<\/b>","Determined by <b>President<\/b>","","Determined by <b>Governor<\/b>","Determined by <b>Parliament<\/b>"],["<b>Term; Retirement age<\/b>","6, 65","6, 65","6, 62","6, 65"],["<b>Removal<\/b>","Like SC judge","- By President\n- After taking advice of SC","","Like SC judge"],["<b>Reappointment<\/b>","<b>Yes<\/b>","No","No","No"],["<b>Govt employment after retirement<\/b>","Yes","Chairman: No\nMembers : Yes but only as chairman of UPSC/SPSC","No, but can be chairman/membe r of UPSC or chairman of SPSC","No"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Statutory Bodies","group":"Statutory Bodies","items":[{"t":"tab","rows":[["","<b>CIC<\/b>","<b>SIC<\/b>","<b>NHRC<\/b>","<b>SHRC<\/b>","<b>CVC<\/b>","<b>Lokpal<\/b>"],["<b>Law<\/b>","RTI Act, 2005","","Protection of Human Rights Act, 1993","","Central Vigilance Commission Act, 2003","Lokpal and Lokayuktas Act, 2013"],["<b>Purpose<\/b>","Complaints/Appeals","","Watchdog of Human Rights","","Anti-Corruption",""],["<b>Composition<\/b>","1+10","1+10","1+5+7","1+2","1+2","1+8"],["<b>Qualifications<\/b>","","","Ret. CJ or J of SC","Ret. CJ or J of HC","","Ret. CJ or J of SC or eminent person"],["<b>Selection Committee<\/b>","PM; Cabinet Minister;\nLoP in LS","CM; Cabinet Minister; LoP in SLA","PM; HM\nLS: Sp.; LoP\nRS:Dy.Ch; LoP","CM; HM\nSLA: Sp.; LoP\nSLC: Ch; LoP","PM; HM; LoP in LS","PM; CJI; LoP;\nSpeaker; eminent jurist"],["<b>Appointed by<\/b>","President","Governor","President","Governor","President","President"],["<b>Sallary &amp; Allowances<\/b>","Determined by Central Govt.","Determined by Central Govt.","Determined by Central Govt.","Determined by State govt","Same as UPSC","Same as SC CJ or judge"],["<b>Service conditions<\/b>","","","","","",""],["<b>Term;\nRetirement age<\/b>","Central Govt.; 65","","3;70","3; 70","4; 65","5; 70"],["<b>Removal<\/b>","President","Governor","President","","",""],["<b>Reappointment<\/b>","No","No","Yes","Yes","No","No"],["<b>Govt employment after retirement<\/b>","","","No","","",""]],"hdr":true,"cap":null}]}]}]</script>
<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('data').textContent);
var KEY='polityPYQ.notes.v1';
var S={status:{},pyq:{},mode:'recall',chap:0,kind:'all',filter:'all',shuffle:false,theme:'dark',pos:{}};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in saved)S[k]=saved[k];}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// index cards
var ALL=[];
DATA.forEach(function(ch,ci){ch.cards.forEach(function(c,i){c.id='c'+ci+'-'+i;c.ci=ci;c.text=cardText(c).toLowerCase();ALL.push(c);});});
function strip(h){return String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');}
function cardText(c){
  if(c.kind==='pyq')return c.title+' '+strip(c.q)+' '+c.opts.map(strip).join(' ');
  var t=c.title+' '+c.group;
  c.items.forEach(function(it){
    if(it.t==='tab')it.rows.forEach(function(r){t+=' '+r.map(strip).join(' ');});
    else if(it.t==='quote')t+=' '+it.h.map(strip).join(' ');
    else t+=' '+strip(it.h);
  });
  return t;
}
var $=function(s,r){return (r||document).querySelector(s);};
var view=$('#view'),stage=$('#stage');
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- deck ---------- */
var order=[],idx=0,shuffleSeed={};
function deckCards(){
  var src=S.chap===-1?ALL:DATA[S.chap].cards;
  return src.filter(function(c){
    if(S.kind!=='all'&&c.kind!==S.kind)return false;
    var st=S.status[c.id];
    if(S.filter==='new')return !st;
    if(S.filter==='again')return st==='again';
    if(S.filter==='known')return st==='known';
    return true;
  });
}
function rebuild(keepId){
  var cs=deckCards();
  if(S.shuffle){
    cs=cs.slice();
    for(var i=cs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=cs[i];cs[i]=cs[j];cs[j]=t;}
  }
  order=cs;
  idx=0;
  var want=keepId||S.pos[S.chap];
  if(want){for(var k=0;k<order.length;k++)if(order[k].id===want){idx=k;break;}}
}

/* ---------- item rendering ---------- */
function hasChild(items,i){return i+1<items.length&&items[i+1].t!=='tab'&&items[i+1].t!=='quote'&&(items[i+1].lv||0)>(items[i].lv||0);}
function tfGroups(items){
  // mark items that belong to a true/false sibling run
  var flag=new Array(items.length).fill(false);
  var i=0;
  while(i<items.length){
    var it=items[i];
    if(it.t!=='li'&&it.t!=='p'){i++;continue;}
    var lv=it.lv||0,j=i,run=[];
    while(j<items.length&&(items[j].t==='li'||items[j].t==='p')&&(items[j].lv||0)>=lv){
      if((items[j].lv||0)===lv)run.push(j);
      j++;
    }
    var any=run.some(function(k){var x=items[k];return /<s>/.test(x.h)||x.m==='yes'||x.m==='no';});
    if(any)run.forEach(function(k){
      var x=items[k];var prompt=hasChild(items,k)||/:\s*(<\/b>)?\s*$/.test(x.h);
      if(/<s>/.test(x.h)||x.m==='yes'||x.m==='no'||(!prompt&&!/<mark>/.test(x.h)))flag[k]=true;
    });
    i++;
  }
  return flag;
}
function czWrap(inner,block){return '<span class="cz'+(block?' blk':'')+'" tabindex="0" role="button" aria-label="Hidden text, press to reveal">'+inner+'</span>';}
function splitNum(h){var m=h.match(/^((?:<b>)?\s*(?:\d{1,2}[.)]|[a-h][.)]|[ivx]{1,4}\.)\s*)/);return m?[m[1],h.slice(m[1].length)]:['',h];}
function balanced(h){ // repair tags split by splitNum
  var open=(h.match(/<b>/g)||[]).length,close=(h.match(/<\/b>/g)||[]).length;
  if(close>open)h='<b>'+h;if(open>close)h=h+'</b>';return h;
}
function recallHtml(it,items,i,tf){
  var h=it.h;
  if(tf){return {html:h,tf:true};}
  if(/<mark>/.test(h))return {html:h.replace(/<mark>([\s\S]*?)<\/mark>/g,function(_,x){return czWrap('<mark>'+x+'</mark>');})};
  var lab=h.match(/^((?:\d+\.\s*)?<b>[^<]{1,70}[:→]\s*<\/b>\s*)([\s\S]+)$/)||h.match(/^(<b>[^<]{1,70}<\/b>\s*[:→\-–]\s*)([\s\S]+)$/)||h.match(/^([^<?]{4,90}\?\s+)([\s\S]{2,})$/)||h.match(/^((?:\d+\.\s*)?<b>[^<]{1,70}<\/b>\s*[:→\-–]\s*)([\s\S]+)$/)||h.match(/^([^<:]{2,40}?:\s+)([\s\S]{2,})$/)||h.match(/^([^<→]{2,30}?\s→\s*)([\s\S]{2,})$/);
  if(lab&&strip(lab[2]).trim().length>1)return {html:lab[1]+czWrap(lab[2])};
  if(/<b>/.test(h)&&!/^\s*(\d+[.)]\s*)?<b>/.test(h)&&strip(h).length>strip((h.match(/<b>[\s\S]*?<\/b>/g)||[]).join('')).length+3)
    return {html:h.replace(/<b>([\s\S]*?)<\/b>/g,function(_,x){return czWrap('<b>'+x+'</b>');})};
  var prompt=hasChild(items,i)||/[:?]\s*(<\/b>)?\s*$/.test(h)||(/^\s*(\d+[.)]\s*)?<b>[\s\S]*<\/b>\s*$/.test(h));
  if(prompt)return {html:h};
  var sp=splitNum(h);
  return {html:sp[0]+czWrap(balanced(sp[1]),true)};
}
function renderItems(items,mode){
  var frag=document.createDocumentFragment();
  var tf=mode==='recall'?tfGroups(items):null;
  items.forEach(function(it,i){
    if(it.t==='tab'){
      var w=el('div','tbl');
      if(it.cap)w.appendChild(el('div','cap',it.cap));
      var t=el('table');
      var body=it.rows.slice(it.hdr?1:0);
      var sparse=body.filter(function(r){return !strip(r[0]||'').trim();}).length>body.length/2;
      it.rows.forEach(function(r,ri){
        var tr=el('tr');
        r.forEach(function(c,k){
          var head=it.hdr&&ri===0;
          var cell=el(head?'th':'td');
          var txt=c||'';
          var keyCol=k===0||(sparse&&k===1&&/^\s*\d{1,3}[A-Z]?\s*$/.test(strip(txt)));
          if(mode==='recall'&&!head&&!keyCol&&strip(txt).trim())txt=czWrap(txt,true);
          cell.innerHTML=txt;
          tr.appendChild(cell);
        });
        t.appendChild(tr);
      });
      w.appendChild(t);frag.appendChild(w);return;
    }
    if(it.t==='quote'){
      var bq=el('blockquote');
      it.h.forEach(function(line){
        var x=line;
        if(mode==='recall')x=/<mark>/.test(x)?x.replace(/<mark>([\s\S]*?)<\/mark>/g,function(_,y){return czWrap('<mark>'+y+'</mark>');}):x;
        bq.appendChild(el('p',null,x));
      });
      frag.appendChild(bq);return;
    }
    var row=el('div','it lv'+Math.min(it.lv||0,3)+(it.t==='p'?' p':''));
    var dot=el('span','dot'+((it.m==='n'||it.m==='yes'||it.m==='no')?' none':''));
    row.appendChild(dot);
    var isFalse=/<s>/.test(it.h)||it.m==='no';
    var isTrue=it.m==='yes';
    if(mode==='theory'){
      if(isFalse)row.appendChild(el('span','falsetag','✗ false'));
      else if(isTrue)row.appendChild(el('span','truetag','✓ true'));
      row.appendChild(el('span','tx',it.h));
    }else{
      var r=recallHtml(it,items,i,tf[i]);
      if(r.tf){
        row.classList.add('tfq');
        var partial=/<s>/.test(it.h)&&strip(it.h.replace(/<s>[\s\S]*?<\/s>/g,'')).trim().length>3;
        var b=el('button','tf',partial?'Spot the error':'True or false?');
        b.type='button';
        b.dataset.v=isFalse?'f':'t';
        b.dataset.partial=partial?'1':'';
        row.appendChild(b);
      }
      row.appendChild(el('span','tx',r.html));
    }
    frag.appendChild(row);
  });
  return frag;
}
function openTf(b){
  if(b.classList.contains('t')||b.classList.contains('f'))return;
  var f=b.dataset.v==='f';
  b.classList.add(f?'f':'t');
  b.textContent=f?(b.dataset.partial?'✗ error struck':'✗ False'):'✓ True';
  b.closest('.it').classList.add('shown');
}
function revealAll(root,show){
  root.querySelectorAll('.cz').forEach(function(z){z.classList.toggle('open',show);});
  if(show)root.querySelectorAll('.tf').forEach(openTf);
}

/* ---------- views ---------- */
function statusTag(c){var s=S.status[c.id];return s?'<span class="tag '+s+'">'+(s==='known'?'Known':'Again')+'</span>':'';}
function scopeName(){return S.chap===-1?'All topics':DATA[S.chap].title;}
function renderRecall(){
  view.innerHTML='';
  if(!order.length){
    var e=el('div','empty-deck','<h2>No cards here</h2><p>Nothing in <b>'+esc(scopeName())+'</b> matches this filter. Choose “All cards” or another topic.</p>');
    var b=el('button','act reveal','Show all cards');b.type='button';b.onclick=function(){S.filter='all';$('#filterSel').value='all';save();rebuild();render();};
    e.appendChild(b);view.appendChild(e);return;
  }
  if(idx>=order.length)idx=order.length-1;
  var c=order[idx];
  S.pos[S.chap]=c.id;save();
  var head=el('div','deckhead','<span><b>'+esc(scopeName())+'</b> · card '+(idx+1)+' of '+order.length+'</span><span>'+(c.kind==='pyq'?'PYQ':'Note')+'</span>');
  view.appendChild(head);
  var card=el('article','card');
  card.setAttribute('aria-live','polite');
  var grp=(c.group&&c.group!==c.title.split(' · ')[0])?'<div class="grp">'+esc(c.group)+'</div>':'';
  if(S.chap===-1)grp='<div class="grp">'+esc(DATA[c.ci].title)+(c.group&&c.group!==c.title.split(' · ')[0]?' › '+esc(c.group):'')+'</div>';
  if(c.kind==='pyq'){
    card.innerHTML=grp+'<h2>'+(c.year?'Prelims '+c.year:'Practice question')+'</h2><div class="meta">'+statusTag(c)+'<span>'+esc(c.title)+'</span></div>';
    var qt=el('div','qtext body',c.q);card.appendChild(qt);
    var opts=el('div','opts');
    c.opts.forEach(function(o,k){
      var b=el('button','opt','<span class="l">'+'abcd'[k]+'</span><span>'+o+'</span>');b.type='button';
      b.onclick=function(){answer(c,k,card);};
      opts.appendChild(b);
    });
    card.appendChild(opts);
    if(S.pyq[c.id]!=null)showAnswer(c,S.pyq[c.id],card);
    else card.appendChild(el('p','hint','Pick an option, or press 1–4.'));
  }else{
    card.innerHTML=grp+'<h2>'+esc(c.title)+'</h2><div class="meta">'+statusTag(c)+'<span>Tap a blank to reveal it</span></div>';
    var body=el('div','body');body.appendChild(renderItems(c.items,'recall'));card.appendChild(body);
    if(!body.querySelector('.cz,.tf'))card.appendChild(el('p','hint','Nothing is hidden on this card. Read it, then rate yourself.'));
  }
  view.appendChild(card);
  var acts=el('div','actions');
  var nav=el('div','grp2 nav');
  var pv=el('button','act','← Prev');pv.type='button';pv.disabled=idx===0;pv.onclick=prev;
  var nx=el('button','act','Next →');nx.type='button';nx.disabled=idx>=order.length-1;nx.onclick=next;
  nav.appendChild(pv);nav.appendChild(nx);
  var rate=el('div','grp2');
  var ag=el('button','act again','Again<kbd>A</kbd>');ag.type='button';ag.onclick=function(){rateCard('again');};
  var rv=el('button','act reveal',c.kind==='pyq'?'Show answer<kbd>Space</kbd>':'Reveal all<kbd>Space</kbd>');rv.type='button';rv.id='revealBtn';rv.onclick=toggleReveal;
  var kn=el('button','act known','Got it<kbd>G</kbd>');kn.type='button';kn.onclick=function(){rateCard('known');};
  rate.appendChild(ag);rate.appendChild(rv);rate.appendChild(kn);
  acts.appendChild(nav);acts.appendChild(rate);
  view.appendChild(acts);
}
var revealed=false;
function toggleReveal(){
  var card=$('.card',view);if(!card)return;
  var c=order[idx];
  if(c.kind==='pyq'){if(S.pyq[c.id]==null)showAnswer(c,-1,card);return;}
  var closed=card.querySelector('.cz:not(.open)')||card.querySelector('.tf:not(.t):not(.f)');
  revealAll(card,!!closed);
  var b=$('#revealBtn');if(b)b.innerHTML=(closed?'Hide all':'Reveal all')+'<kbd>Space</kbd>';
}
function answer(c,k,card){
  if(S.pyq[c.id]!=null)return;
  S.pyq[c.id]=k;
  S.status[c.id]=k===c.ans?'known':'again';
  save();showAnswer(c,k,card);refreshSide();
  var m=card.querySelector('.meta');if(m)m.innerHTML=statusTag(c)+'<span>'+esc(c.title)+'</span>';
}
function showAnswer(c,k,card){
  var h=card.querySelector('.hint');if(h)h.remove();
  card.querySelectorAll('.opt').forEach(function(b,i){
    b.disabled=true;
    if(i===c.ans)b.classList.add('right');
    else if(i===k)b.classList.add('wrong');
  });
  if(card.querySelector('.exp'))return;
  var v=k<0?'Answer: ':(k===c.ans?'Correct. ':'Not quite. ');
  var e=el('div','exp','<span class="v">'+v+'('+'abcd'[c.ans]+')</span> '+esc(c.exp)+(c.check?'<span class="warn">Answer keys differ across sources for this one; confirm before relying on it.</span>':''));
  if(k>=0){
    var r=el('button','btn small','Try again');r.type='button';r.style.marginTop='10px';
    r.onclick=function(){delete S.pyq[c.id];delete S.status[c.id];save();refreshSide();render();};
    card.appendChild(e);card.appendChild(r);return;
  }
  card.appendChild(e);
}
function rateCard(s){
  var c=order[idx];if(!c)return;
  S.status[c.id]=s;save();refreshSide();
  if(S.filter!=='all'&&S.filter!==s){ // card leaves the filtered deck
    var id=order[idx+1]?order[idx+1].id:(order[idx-1]?order[idx-1].id:null);
    rebuild(id);render();return;
  }
  if(idx<order.length-1){idx++;render();stage.scrollTop=0;}
  else render();
}
function next(){if(idx<order.length-1){idx++;render();stage.scrollTop=0;}}
function prev(){if(idx>0){idx--;render();stage.scrollTop=0;}}

function renderTheory(){
  view.innerHTML='';
  var chs=S.chap===-1?DATA:[DATA[S.chap]];
  var w=el('div','theory');
  w.appendChild(el('div','legend','<span><mark style="background:var(--pyrite-bg);border-bottom:1.5px solid var(--pyrite-line);color:inherit;padding:0 3px">term</mark> key term</span><span><span class="falsetag">✗ false</span> struck statement is wrong</span><span><span class="truetag">✓ true</span> confirmed statement</span>'));
  chs.forEach(function(ch){
    w.appendChild(el('h2','ch',esc(ch.title)));
    var lastGrp=null;
    ch.cards.forEach(function(c){
      if(S.kind!=='all'&&c.kind!==S.kind)return;
      if(c.kind==='pyq'){
        var d=el('details','pq');d.id=c.id;
        var sm=el('summary',null,'<span class="yr">'+(c.year||'PYQ')+'</span><span>'+strip(c.q).split('\n')[0]+'</span>');
        d.appendChild(sm);
        var inn=el('div','in body');
        inn.appendChild(el('div','qtext',c.q));
        var ol=el('ol');ol.type='a';
        c.opts.forEach(function(o,k){ol.appendChild(el('li',k===c.ans?'ok':'',o+(k===c.ans?'  ✓':'')));});
        inn.appendChild(ol);
        inn.appendChild(el('div','exp',esc(c.exp)+(c.check?'<span class="warn">Answer keys differ across sources for this one.</span>':'')));
        d.appendChild(inn);w.appendChild(d);return;
      }
      var sec=el('section','sec');sec.id=c.id;
      var base=c.title.split(' · ')[0];
      if(c.group&&c.group!==base&&c.group!==lastGrp&&c.group!==ch.title)sec.appendChild(el('div','grp',esc(c.group)));
      lastGrp=c.group;
      sec.appendChild(el('h3',null,esc(c.title)));
      var b=el('div','body');b.appendChild(renderItems(c.items,'theory'));sec.appendChild(b);
      w.appendChild(sec);
    });
  });
  view.appendChild(w);
}
function render(){
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode));});
  $('#filterSel').disabled=S.mode==='theory';
  $('#shuffleBtn').disabled=S.mode==='theory';
  if(S.mode==='theory')renderTheory();else renderRecall();
}

/* ---------- sidebar ---------- */
function counts(cards){
  var k=0,a=0;cards.forEach(function(c){var s=S.status[c.id];if(s==='known')k++;else if(s==='again')a++;});
  return {k:k,a:a,n:cards.length};
}
function barHtml(ct){return '<i class="k" style="width:'+(ct.k/ct.n*100)+'%"></i><i class="a" style="width:'+(ct.a/ct.n*100)+'%"></i>';}
function refreshSide(){
  var nav=$('#chaps');nav.innerHTML='';
  var all=counts(ALL);
  $('#ovText').textContent=all.k+' known · '+all.a+' again';
  $('#ovPct').textContent=Math.round(all.k/all.n*100)+'%';
  $('#ovBar').innerHTML=barHtml(all);
  var entries=[{i:-1,title:'All topics',cards:ALL}].concat(DATA.map(function(ch,i){return {i:i,title:ch.title,cards:ch.cards};}));
  entries.forEach(function(e){
    var ct=counts(e.cards);
    var b=el('button','chap','<span class="t"><span>'+esc(e.title)+'</span><span class="n">'+ct.k+'/'+ct.n+'</span></span><span class="bar">'+barHtml(ct)+'</span>');
    b.type='button';
    b.setAttribute('aria-current',String(e.i===S.chap));
    b.onclick=function(){S.chap=e.i;save();rebuild();render();refreshSide();closeSide();stage.scrollTop=0;};
    nav.appendChild(b);
  });
}
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('open');}

/* ---------- search ---------- */
var qEl=$('#q'),resEl=$('#results');
function runSearch(){
  var q=qEl.value.trim().toLowerCase();
  if(q.length<2){resEl.hidden=true;return;}
  var terms=q.split(/\s+/);
  var hits=ALL.filter(function(c){return terms.every(function(t){return c.text.indexOf(t)>=0;});}).slice(0,40);
  resEl.innerHTML='';
  if(!hits.length)resEl.appendChild(el('div','empty','No card mentions “'+esc(q)+'”.'));
  hits.forEach(function(c){
    var label=c.kind==='pyq'?('PYQ '+(c.year||'')+': '+strip(c.q).slice(0,70)):c.title;
    var b=el('button',null,esc(label)+'<small>'+esc(DATA[c.ci].title)+'</small>');b.type='button';
    b.onclick=function(){goTo(c);};
    resEl.appendChild(b);
  });
  resEl.hidden=false;
}
function goTo(c){
  resEl.hidden=true;qEl.blur();
  if(S.mode==='theory'){
    S.chap=c.ci;if(S.kind!=='all'&&S.kind!==c.kind)S.kind='all';$('#kindSel').value=S.kind;
    save();render();refreshSide();
    var t=document.getElementById(c.id);
    if(t){if(t.tagName==='DETAILS')t.open=true;t.scrollIntoView({block:'start'});}
    return;
  }
  S.chap=c.ci;S.filter='all';$('#filterSel').value='all';
  if(S.kind!=='all'&&S.kind!==c.kind){S.kind='all';$('#kindSel').value='all';}
  save();rebuild(c.id);render();refreshSide();stage.scrollTop=0;
}
qEl.addEventListener('input',runSearch);
qEl.addEventListener('focus',runSearch);
qEl.addEventListener('keydown',function(e){
  if(e.key==='Escape'){qEl.value='';resEl.hidden=true;qEl.blur();}
  if(e.key==='Enter'){var f=resEl.querySelector('button');if(f)f.click();}
  if(e.key==='ArrowDown'){var g=resEl.querySelector('button');if(g){e.preventDefault();g.focus();}}
});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))resEl.hidden=true;});

/* ---------- events ---------- */
view.addEventListener('click',function(e){
  var z=e.target.closest('.cz');if(z){z.classList.toggle('open');return;}
  var t=e.target.closest('.tf');if(t){openTf(t);t.blur();}
});
view.addEventListener('keydown',function(e){
  var z=e.target.closest('.cz');
  if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();z.classList.toggle('open');}
});
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){S.mode=b.dataset.mode;save();render();stage.scrollTop=0;};});
$('#kindSel').value=S.kind;$('#filterSel').value=S.filter;$('#shuffleBtn').setAttribute('aria-pressed',String(!!S.shuffle));
$('#kindSel').onchange=function(){S.kind=this.value;save();rebuild();render();};
$('#filterSel').onchange=function(){S.filter=this.value;save();rebuild();render();};
$('#shuffleBtn').onclick=function(){S.shuffle=!S.shuffle;this.setAttribute('aria-pressed',String(S.shuffle));save();rebuild();idx=0;render();};
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme);$('#themeBtn').textContent=S.theme==='dark'?'Light theme':'Dark theme';}
$('#themeBtn').onclick=function(){S.theme=S.theme==='dark'?'light':'dark';save();applyTheme();};
$('#resetBtn').onclick=function(){
  if(confirm('Clear all “Known”, “Again” and PYQ answers? This cannot be undone.')){S.status={};S.pyq={};S.pos={};save();rebuild();render();refreshSide();}
};
$('#menuBtn').onclick=function(){$('#side').classList.add('open');$('#scrim').classList.add('open');};
$('#scrim').onclick=closeSide;
document.addEventListener('keydown',function(e){
  if(e.target.matches('input,select,textarea'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(k==='/'){e.preventDefault();qEl.focus();return;}
  if(k==='t'||k==='T'){S.mode=S.mode==='recall'?'theory':'recall';save();render();return;}
  if(S.mode!=='recall')return;
  var c=order[idx];
  if(k==='ArrowRight'){e.preventDefault();next();}
  else if(k==='ArrowLeft'){e.preventDefault();prev();}
  else if(k===' '&&!e.target.closest('button')){e.preventDefault();toggleReveal();}
  else if(k==='g'||k==='G'){rateCard('known');}
  else if(k==='a'||k==='A'){rateCard('again');}
  else if(c&&c.kind==='pyq'&&/^[1-4]$/.test(k)){var card=$('.card',view);if(card)answer(c,+k-1,card);}
});

if(S.chap>=DATA.length||S.chap<-1)S.chap=0;
applyTheme();rebuild();refreshSide();render();
})();
</script>
</body>
</html>
