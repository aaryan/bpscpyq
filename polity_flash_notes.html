<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polity Flash Notes · BPSC Prelims</title>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('polityPYQ.notes.v1')||'{}');if(s.theme)document.documentElement.setAttribute('data-theme',s.theme);}catch(e){}})();
</script>
<style>
:root{
  --radius-s:6px;--radius-m:12px;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0c1320;--bg2:#101a2b;--surface:#15223a;--surface2:#1c2d4a;--line:#28395a;
  --text:#e5e9f2;--muted:#95a3bd;--faint:#65738d;
  --lapis:#5b8be3;--lapis-deep:#2f5fb3;--lapis-ink:#dce7fb;
  --pyrite:#d4b152;--pyrite-bg:rgba(212,177,82,.14);--pyrite-line:rgba(212,177,82,.55);
  --cinnabar:#e0735d;--cinnabar-bg:rgba(224,115,93,.13);
  --malachite:#4fb38c;--malachite-bg:rgba(79,179,140,.13);
  --blank:#243656;--shadow:0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#eef1f6;--bg2:#e4e9f1;--surface:#ffffff;--surface2:#f3f6fb;--line:#cfd8e6;
  --text:#18233a;--muted:#55627a;--faint:#8591a6;
  --lapis:#2556ad;--lapis-deep:#1d4690;--lapis-ink:#ffffff;
  --pyrite:#8a6a12;--pyrite-bg:rgba(176,137,30,.14);--pyrite-line:rgba(138,106,18,.55);
  --cinnabar:#b8452f;--cinnabar-bg:rgba(184,69,47,.10);
  --malachite:#1f7d5a;--malachite-bg:rgba(31,125,90,.10);
  --blank:#dfe6f2;--shadow:0 8px 24px rgba(24,35,58,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;height:100dvh}
/* sidebar */
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{font:600 21px/1.2 var(--serif);margin:0;letter-spacing:.2px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.overall{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.bar .k{background:var(--malachite)}.bar .a{background:var(--cinnabar)}
.chaps{overflow:auto;padding:8px;flex:1}
.chap{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--radius-s);padding:8px 10px;margin:1px 0;color:var(--text)}
.chap:hover{background:var(--surface)}
.chap[aria-current="true"]{background:var(--surface2);box-shadow:inset 3px 0 0 var(--lapis)}
.chap .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.chap .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chap .bar{height:3px;margin-top:5px}
.sidefoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg)}
.btn.menu-btn{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg2)}
.seg button{border:0;background:none;padding:5px 13px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis-deep);color:var(--lapis-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:6px 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--lapis)}
.btn[aria-pressed="true"]{border-color:var(--lapis);color:var(--lapis)}
.btn.small{padding:4px 9px;font-size:12.5px}
select.btn{padding-right:6px}
.search{flex:1;min-width:150px;max-width:320px;position:relative;margin-left:auto}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:6px 10px}
.results{position:absolute;top:calc(100% + 4px);right:0;left:0;min-width:300px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);z-index:30;padding:4px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--radius-s)}
.results button:hover,.results button:focus{background:var(--surface2)}
.results small{display:block;color:var(--muted)}
.results .empty{padding:10px;color:var(--muted)}
.stage{flex:1;overflow:auto;padding:22px 16px 110px}
.wrap{max-width:780px;margin:0 auto}
.deckhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:13px}
.deckhead b{color:var(--text);font-weight:600}
/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);padding:22px 24px 20px}
.card .grp{color:var(--lapis);font-size:12.5px;margin-bottom:2px}
.card h2{font:600 23px/1.25 var(--serif);margin:0 0 4px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;font-size:12.5px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px}
.tag.known{color:var(--malachite);border-color:var(--malachite)}
.tag.again{color:var(--cinnabar);border-color:var(--cinnabar)}
.body{font-size:16px}
.it{margin:5px 0;display:flex;gap:8px;align-items:baseline}
.it .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--lapis);transform:translateY(-2px)}
.it.lv1 .dot{background:none;border:1.5px solid var(--lapis)}
.it.lv2 .dot,.it.lv3 .dot{border-radius:1px;background:var(--faint)}
.it .dot.none{visibility:hidden}
.it.lv1{margin-left:20px}.it.lv2{margin-left:40px}.it.lv3{margin-left:60px}
.it .tx{flex:1;min-width:0}
.it.p .dot{display:none}
.body mark{background:var(--pyrite-bg);color:inherit;border-bottom:1.5px solid var(--pyrite-line);padding:0 2px;border-radius:2px}
.body b{font-weight:650}
.body s{color:var(--cinnabar);text-decoration-thickness:1.5px}
.falsetag,.truetag{flex:none;font-size:11.5px;font-weight:600;border-radius:4px;padding:0 5px;line-height:18px}
.falsetag{color:var(--cinnabar);background:var(--cinnabar-bg)}
.truetag{color:var(--malachite);background:var(--malachite-bg)}
blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--pyrite);background:var(--surface2);border-radius:0 var(--radius-s) var(--radius-s) 0;font-family:var(--serif);font-size:15.5px}
blockquote p{margin:4px 0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:var(--radius-s)}
.tbl .cap{padding:7px 10px;font-weight:600;background:var(--surface2);border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;white-space:pre-line}
th{background:var(--surface2);font-weight:600}
td:first-child{font-weight:550}
tr:last-child td{border-bottom:0}
td+td,th+th{border-left:1px solid var(--line)}
/* recall affordances */
.cz{cursor:pointer;border-radius:3px;background:var(--blank);color:transparent;border-bottom:1.5px dashed var(--pyrite-line);transition:background .15s,color .15s;-webkit-user-select:none;user-select:none}
.cz mark,.cz b,.cz s{color:transparent;background:none;border:0;text-decoration:none}
.cz.open{background:var(--pyrite-bg);color:inherit;border-bottom-style:solid}
.cz.open mark,.cz.open b{color:inherit}
.cz.open s{color:var(--cinnabar);text-decoration:line-through}
.cz.blk{display:inline-block;min-width:60%;}
.cz:not(.open):empty::after{content:"\00a0\00a0\00a0\00a0"}
td .cz{display:block;min-height:1.4em}
.tf{flex:none;min-width:96px;text-align:center;border:1px solid var(--line);background:var(--surface2);border-radius:999px;font-size:11.5px;padding:0 8px;line-height:19px;color:var(--muted)}
.tf.t{border-color:var(--malachite);color:var(--malachite);background:var(--malachite-bg)}
.tf.f{border-color:var(--cinnabar);color:var(--cinnabar);background:var(--cinnabar-bg)}
.it.tfq s{color:inherit;text-decoration:none}
.it.tfq.shown s{color:var(--cinnabar);text-decoration:line-through}
.hint{color:var(--faint);font-size:12.5px;margin-top:14px}
/* pyq */
.qtext{white-space:pre-line;font-size:16px;margin:4px 0 12px}
.opts{display:grid;gap:7px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius-s);padding:8px 11px;display:flex;gap:10px}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt .l{font-weight:600;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--malachite);background:var(--malachite-bg)}
.opt.wrong{border-color:var(--cinnabar);background:var(--cinnabar-bg)}
.exp{margin-top:12px;padding:10px 12px;border-radius:var(--radius-s);background:var(--surface2);border-left:3px solid var(--lapis);font-size:14.5px}
.exp .v{font-weight:650}
.exp .warn{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
/* action bar */
.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.actions .grp2{display:flex;gap:8px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 14px;font-weight:550}
.act.again{color:var(--cinnabar)}
.act.again:hover{border-color:var(--cinnabar)}
.act.known{color:var(--malachite)}
.act.known:hover{border-color:var(--malachite)}
.act.reveal{background:var(--lapis-deep);color:var(--lapis-ink);border-color:var(--lapis-deep)}
kbd{font:11px var(--sans);color:inherit;opacity:.75;border-color:currentColor;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:6px}
.empty-deck{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-deck h2{font:600 22px var(--serif);color:var(--text)}
/* theory */
.theory h2.ch{font:600 30px/1.2 var(--serif);margin:4px 0 18px}
.sec{padding:14px 0 16px;border-top:1px solid var(--line)}
.sec h3{font:600 19px/1.3 var(--serif);margin:0 0 6px}
.sec .grp{color:var(--lapis);font-size:12px}
details.pq{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);margin:8px 0;padding:0}
details.pq summary{cursor:pointer;padding:8px 12px;list-style:none;display:flex;gap:10px}
details.pq summary::-webkit-details-marker{display:none}
details.pq summary .yr{flex:none;color:var(--pyrite);font-weight:600;font-variant-numeric:tabular-nums}
details.pq[open] summary{border-bottom:1px solid var(--line)}
details.pq .in{padding:10px 12px}
details.pq ol{margin:6px 0;padding-left:22px}
details.pq li.ok{color:var(--malachite);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-8px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .btn.menu-btn{display:inline-flex}
  .top{padding:8px 10px;gap:6px}
  .search{order:10;max-width:none;flex-basis:100%}
  .stage{padding:14px 10px 120px}
  .card{padding:16px 15px}
  .card h2{font-size:20px}
  .body{font-size:15.5px}
  .it.lv1{margin-left:14px}.it.lv2{margin-left:28px}.it.lv3{margin-left:40px}
  .actions{position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);z-index:20}
  .actions .nav{display:none}
  .actions .grp2{flex:1}
  .actions .grp2 .act{flex:1}
  kbd{display:none}
  .theory h2.ch{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Topics">
    <div class="brand">
      <h1>Polity flash notes</h1>
      <p>BPSC Prelims · revision deck</p>
      <div class="overall"><span id="ovText"></span><span id="ovPct"></span></div>
      <div class="bar" id="ovBar"><i class="k"></i><i class="a"></i></div>
    </div>
    <nav class="chaps" id="chaps"></nav>
    <div class="sidefoot">
      <button class="btn small" id="themeBtn" type="button">Light theme</button>
      <button class="btn small" id="resetBtn" type="button">Reset progress</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" type="button" aria-label="Open topics">☰ Topics</button>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="recall" aria-pressed="true">Recall</button>
        <button type="button" data-mode="theory" aria-pressed="false">Theory</button>
      </div>
      <select class="btn" id="kindSel" aria-label="Card types">
        <option value="all">Notes + PYQs</option>
        <option value="note">Notes only</option>
        <option value="pyq">PYQs only</option>
      </select>
      <select class="btn" id="filterSel" aria-label="Filter cards">
        <option value="all">All cards</option>
        <option value="new">Not yet rated</option>
        <option value="again">Marked again</option>
        <option value="known">Marked known</option>
      </select>
      <button class="btn" id="shuffleBtn" type="button" aria-pressed="false">Shuffle</button>
      <div class="search">
        <input id="q" type="search" placeholder="Search notes and PYQs  ( / )" autocomplete="off" aria-label="Search">
        <div class="results" id="results" hidden></div>
      </div>
    </header>
    <main class="stage" id="stage"><div class="wrap" id="view"></div></main>
  </div>
</div>

ckground to the constitution","items":[{"t":"li","lv":0,"m":"b","h":"<b>Total Membership<\/b>: 389"},{"t":"li","lv":1,"m":"b","h":"<b>Provinces<\/b>: 292"},{"t":"li","lv":1,"m":"b","h":"<b>Chief Commissioner Provinces<\/b>: 4"},{"t":"li","lv":1,"m":"b","h":"<b>Princely States<\/b>: 93 (but did not nominate)"},{"t":"li","lv":0,"m":"b","h":"It was a multi-party <b>indirectly elected body<\/b>, not based on adult franchise."},{"t":"li","lv":1,"m":"b","h":"Members were elected by provincial assemblies by proportional representation."},{"t":"li","lv":1,"m":"b","h":"Elections to 296 seats done in July-August 1946; INC 208, ML 73."},{"t":"li","lv":0,"m":"b","h":"<b>Constitution<\/b>: November 1946 under the scheme formulated by Cabinet Mission Plan."},{"t":"li","lv":0,"m":"b","h":"<b>Sovereign Body<\/b>:"},{"t":"li","lv":1,"m":"b","h":"Could frame any Constitution, could alter any law made by the British Parliament for India."},{"t":"li","lv":0,"m":"b","h":"<b>First Parliament<\/b>: Acted as the first Parliament of independent India (enacted ordinary laws)."},{"t":"li","lv":1,"m":"b","h":"<b>Dr. Rajendra Prasad<\/b>: Chaired sittings of the House when it met as Constituent Assembly."},{"t":"li","lv":1,"m":"b","h":"<b>GV Mavalankar<\/b>: Presided over as Speaker when the House met as Legislature."}]},{"kind":"note","title":"Important Facts about Constituent Assembly","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"b","h":"<b>Seal (Symbol)<\/b>: Elephant"},{"t":"li","lv":0,"m":"b","h":"<b>Not a Member<\/b>: Gandhi"},{"t":"li","lv":0,"m":"b","h":"<b>Advisor<\/b>: BN Rau"},{"t":"li","lv":0,"m":"b","h":"<b>Secretary<\/b>: HVR Iyengar"}]},{"kind":"note","title":"Functions Performed by Constituent Assembly (CA)","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"b","h":"<b>1947 July 22<\/b>: Adopted national flag (before independence)."},{"t":"li","lv":0,"m":"b","h":"<b>1949 May<\/b>: Ratified membership to Commonwealth, not the UN."}, :"Objectives Resolution","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"b","h":"<b>Moved by<\/b>: Nehru on 13-12-1946; adopted by Assembly on 22-01-1947 (before independence)"},{"t":"li","lv":0,"m":"b","h":"<b>Modified Version<\/b>: Forms the Preamble"},{"t":"li","lv":0,"m":"b","h":"<b>Features :<\/b>"},{"t":"li","lv":1,"m":"b","h":"People as the source of power"},{"t":"li","lv":1,"m":"b","h":"Republic, Justice, Liberty, Equality"},{"t":"li","lv":1,"m":"b","h":"Union of States; Residuary power to states"},{"t":"li","lv":1,"m":"b","h":"Safeguards for tribals, minorities, backward classes"},{"t":"li","lv":1,"m":"b","h":"Promote world peace and welfare of mankind"}]},{"kind":"note","title":"Salient Features of the Constitution · Reasons","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"n","h":"1. Lengthiest Written Constitution"},{"t":"li","lv":0,"m":"b","h":"<b>Reasons<\/b> →"},{"t":"li","lv":0,"m":"b","h":"The 1935 act was bulky."},{"t":"li","lv":0,"m":"b","h":"India's vast size and diversity."},{"t":"li","lv":0,"m":"b","h":"Single Constitution for Centre and States."},{"t":"li","lv":0,"m":"b","h":"Dominance of legal luminaries in the Constituent Assembly."},{"t":"li","lv":0,"m":"b","h":"Administrative details also included, which in other countries are left to the legislature."},{"t":"li","lv":0,"m":"n","h":"2. Drawn from Various Sources"},{"t":"li","lv":0,"m":"n","h":"3. Blend of Rigidity and Flexibility"}]},{"kind":"note","title":"Salient Features of the Constitution · Concepts","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"n","h":"4. Federal System with Unitary Bias"},{"t":"li","lv":0,"m":"n","h":"5. Parliamentary Form of Government"},{"t":"li","lv":0,"m":"n","h":"6. Synthesis of Parliamentary Sovereignty and Judicial Supremacy"},{"t":"li","lv":0,"m":"n","h":"7. Rule Of Law"},{"t":"li","lv":0,"m":"n","h":"8. Integrated and Independent Judiciary"},{"t":"li","lv":0,"m":"n","h":"9. Secularism"},{"t":"li","lv":0,"m":"b","h":"<b>Concepts<\/b>:"},{"t":"li","lv":1,"m":"b","h":"<b>Western (Negative) Concept<\/b>: Complete separation between religion and State."},{"t":"li","lv":1,"m":"b","h":"<b>Indian (Positive) Concept<\/b>: Equal respect to all religions or protect all religions equally."}]},{"kind":"note","title":"Salient Features of the Constitution · India as a Secular Country","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"b","h":"<b>India as a Secular Country<\/b>:"},{"t":"li","lv":1,"m":"b","h":"India does not have any official religion."},{"t":"li","lv":1,"m":"b","h":"Officially, India is the \"Republic of India\", while Pakistan is the \"Islamic Republic of Pakistan\"."},{"t":"li","lv":0,"m":"n","h":"10. Universal Adult Franchise"},{"t":"li","lv":0,"m":"b","h":"<b>Article 326<\/b>: Adult suffrage for elections to Lok Sabha and State Legislative Assemblies, age 21."},{"t":"li","lv":0,"m":"b","h":"<b>61st Amendment (1988)<\/b>: Reduced voting age to 18."},{"t":"li","lv":0,"m":"n","h":"11. Single Citizenship"},{"t":"li","lv":0,"m":"n","h":"12. Emergency Provisions"},{"t":"li","lv":0,"m":"n","h":"13. Three-tier Government"}]},{"kind":"note","title":"Sources and Features Borrowed for the Indian Constitution","group":"Background to the constitution","items":[{"t":"tab","rows":[["<b>Source<\/b>","<b>Features Borrowed<\/b>"],["<b>Government of India Act 1935<\/b>","Federal Scheme, Governor, Judiciary, Public Service Commissions, Emergency provisions, Administrative details"],["<b>Britain<\/b>","Parliamentary system, Bicameralism, Legislative procedure, Rule of Law, Parliamentary privileges, Cabinet system, Single citizenship, Writs"],["<b>USA<\/b>","Judicial review, Independence of judiciary, Removal of Supreme Court and High Court judges, Impeachment of President, Post of Vice President, Fundamental Rights"],["<b>Ireland<\/b>","Directive Principles of State Policy (DPSP), Nomination to Rajya Sabha, Method of election of President"],["<b>Canada<\/b>","Strong Centre, Residuary powers with Centre, Appointment of Governors by Centre, Advisory jurisdiction of Supreme Court"],["<b>Australia<\/b>","Concurrent List, Joint sitting, Freedom of trade &amp; commerce"],["<b>Weimar Constitution of Germany<\/b>","Suspension of Fundamental Rights during Emergency"],["<b>USSR<\/b>","Fundamental Duties, Ideals of justice in Preamble"],["<b>France<\/b>","Republic, Liberty, Equality, Fraternity"],["<b>South Africa<\/b>","Procedure for amending Constitution, Election to Rajya Sabha"],["<b>Japan<\/b>","Procedure established by Law"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Must remember following","group":"Background to the constitution","items":[{"t":"li","lv":0,"m":"b","h":"Fundamental Rights from the USA."},{"t":"li","lv":0,"m":"b","h":"Fundamental Duties from the USSR."},{"t":"li","lv":0,"m":"b","h":"Directive Principles of State Policy from Ireland."},{"t":"li","lv":0,"m":"b","h":"Nomination to Rajya Sabha from Ireland."},{"t":"li","lv":0,"m":"b","h":"Emergency provisions from the Government of India Act 1935 and Germany."},{"t":"li","lv":0,"m":"b","h":"Federal structure from the Government of India Act 1935 and Canada."},{"t":"li","lv":0,"m":"b","h":"Parliamentary system from the UK."},{"t":"li","lv":0,"m":"b","h":"Single citizenship from the UK."},{"t":"li","lv":0,"m":"b","h":"Concurrent list from Australia."}]},{"kind":"note","title":"Schedules of the Indian Constitution and Their Subject Matter","group":"Background to the constitution","items":[{"t":"tab","rows":[["<b>Schedule<\/b>","<b>Subject Matter<\/b>"],["<b>1st<\/b>","Name and territory of States and Union Territories (UTs)"],["<b>2nd<\/b>","Emoluments/allowances/privileges of:\n- President, Governors\n- Speaker, Deputy Speaker, Chairman, Deputy Chairman of Lok Sabha/Rajya Sabha/State Legislative Assemblies\n- Judges of Supreme Court and High Courts\n- Comptroller and Auditor General (CAG)"],["<b>3rd<\/b>","Oath for:\n- Union/State Ministers\n- Members of Parliament (MP)/Members of Legislative Assembly (MLA)/Members of Legislative Council (MLC); Candidates for election to Lok Sabha/State Legislative Assemblies/State Legislative Councils\n- Judges of Supreme Court and High Courts\n- Comptroller and Auditor General (CAG)"],["<b>4th<\/b>","Allocation of Rajya Sabha seats to States/UTs"],["<b>5th<\/b>","Administration and control of Scheduled Areas and Scheduled Tribes"],["<b>6th<\/b>","Administration of Tribal areas in Assam, Tripura, Meghalaya, Mizoram"],["<b>7th<\/b>","Division of powers between Union and States:\n- Union List (100 items)\n- State List (61 items)\n- Concurrent List (52 items)"],["<b>8th<\/b>","Languages recognized by the Constitution (22 languages)"],["<b>9th<\/b>","Added by 1st Amendment 1951 to protect laws from judicial review"],["<b>10th<\/b>","Added by 52nd Amendment 1985, Anti-defection law"],["<b>11th<\/b>","Added by 73rd Amendment 1992, Panchayat’s power &amp; responsibility"],["<b>12th<\/b>","Added by 74th Amendment 1992, Municipality’s power &amp; responsibility"]],"hdr":true,"cap":null}]}]},{"title":"Preamble","cards":[{"kind":"note","title":"The Preamble (as amended)","group":"Preamble","items":[{"t":"quote","h":["<b>WE, THE PEOPLE OF INDIA<\/b>, having solemnly resolved to constitute India into a <mark>SOVEREIGN SOCIALIST SECULAR DEMOCRATIC REPUBLIC<\/mark> and to secure to all its citizens:","<mark>JUSTICE<\/mark>, social, economic and political;","<mark>LIBERTY<\/mark> of thought, expression, belief, faith and worship;","<mark>EQUALITY<\/mark> of status and of opportunity;","and to promote among them all <mark>FRATERNITY<\/mark> assuring the dignity of the individual and the <mark>unity and integrity<\/mark> of the Nation;","IN OUR CONSTITUENT ASSEMBLY this <mark>twenty-sixth day of November, 1949<\/mark>, do HEREBY ADOPT, ENACT AND GIVE TO OURSELVES THIS CONSTITUTION.","“Socialist Secular” and “unity and integrity” were substituted by the <mark>42nd Amendment, 1976<\/mark> (w.e.f. 3-1-1977)."]}]},{"kind":"note","title":"Describing the Preamble","group":"Preamble","items":[{"t":"li","lv":0,"m":"b","h":"1. <b>Introduction/preface<\/b> to the constitution"},{"t":"li","lv":0,"m":"b","h":"2. <b>Soul<\/b> of the Constitution; <b>Jewel<\/b> set in the Constitution; <b>Identity card<\/b> of the Constitution"},{"t":"li","lv":0,"m":"b","h":"3. Based on <b>‘Objectives Resolution’<\/b> moved by Nehru on <mark>13-12-1946<\/mark> and adopted by CA on <mark>22-01-1947<\/mark>"},{"t":"li","lv":0,"m":"b","h":"4. <mark>US Constitution<\/mark> was the first to begin with a preamble"}]},{"kind":"note","title":"Preamble reveals","group":"Preamble reveals","items":[{"t":"li","lv":0,"m":"b","h":"<b>Source of authority<\/b> of Constitution:"},{"t":"li","lv":1,"m":"b","h":"people of India"},{"t":"li","lv":0,"m":"b","h":"<b>Nature<\/b> of Indian State:"},{"t":"li","lv":1,"m":"b","h":"Sovereign"},{"t":"li","lv":1,"m":"b","h":"Socialist"},{"t":"li","lv":1,"m":"b","h":"Secular"},{"t":"li","lv":1,"m":"b","h":"Democratic"},{"t":"li","lv":1,"m":"b","h":"Republic"},{"t":"li","lv":0,"m":"b","h":"<b>Objective<\/b> of Constitution:"},{"t":"li","lv":1,"m":"b","h":"Justice"},{"t":"li","lv":1,"m":"b","h":"Liberty"},{"t":"li","lv":1,"m":"b","h":"Equality"},{"t":"li","lv":1,"m":"b","h":"Fraternity"},{"t":"li","lv":0,"m":"b","h":"Date of <b>adoption &amp; enactment<\/b> of Constitution:"},{"t":"li","lv":1,"m":"b","h":"26-11-1949"}]},{"kind":"pyq","title":"Preamble reveals","group":"Preamble reveals","year":"2020","q":"The Preamble to the Constitution of India is","opts":["a part of the Constitution but has no legal effect","not a part of the Constitution and has no legal effect either","a part of the Constitution and has the same legal effect as any other part","a part of the Constitution but has no legal effect independently of other parts"],"page":9,"ans":3,"exp":"The Preamble is part of the Constitution (Kesavananda Bharati, 1973) but it is not enforceable on its own and is neither a source of power nor a limit on power.","check":false},{"kind":"pyq","title":"Preamble reveals","group":"Preamble reveals","year":"2017","q":"The mind of the makers of the Constitution of India is reflected in which of the following?","opts":["The Preamble","The Fundamental Rights","The Directive Principles of State Policy","The Fundamental Duties"],"page":9,"ans":0,"exp":"The Preamble is the key to the minds of the makers.","check":false},{"kind":"pyq","title":"Preamble reveals","group":"Preamble reveals","year":"2017","q":"Which of the following objectives is not embodied in Preamble to the Constitution of India?","opts":["Liberty of thought","Economic liberty","Liberty of expression","Liberty of belief"],"page":9,"ans":1,"exp":"The Preamble promises liberty of thought, expression, belief, faith and worship — not economic liberty.","check":false},{"kind":"pyq","title":"Preamble reveals","group":"Preamble reveals","year":"2013","q":"‘Economic Justice’ as one of the objectives of the Indian Constitution has been provided in","opts":["the Preamble and the Fundamental Rights","the Preamble and the Directive Principles of State Policy","the Fundamental Rights and the Directive Principles of State Policy","None of the above"],"page":9,"ans":1,"exp":"Economic justice appears in the Preamble and is carried forward by the DPSPs (e.g. Art. 38, 39).","check":false},{"kind":"pyq","title":"Preamble reveals","group":"Preamble reveals","year":"2021","q":"What was the exact constitutional status of India on 26th January, 1950?","opts":["A democratic Republic","A Sovereign Democratic Republic","A Sovereign Secular Democratic Republic","A Sovereign Socialist Secular Democratic Republic"],"page":10,"ans":1,"exp":"On 26 Jan 1950 India was a Sovereign Democratic Republic; ‘Socialist Secular’ came with the 42nd Amendment (1976).","check":false},{"kind":"note","title":"Points to remember","group":"Points to remember","items":[{"t":"li","lv":0,"m":"b","h":"Preamble was <b>enacted after rest of the Constitution<\/b> (so that its in conformity with Constitution)"},{"t":"li","lv":0,"m":"b","h":"Motion to make Preamble part of Constitution was passed by Constituent Assembly"},{"t":"li","lv":0,"m":"b","h":"Preamble is <b>non-justiciable<\/b>, i.e. its provisions are not enforceable in courts of law."},{"t":"li","lv":0,"m":"b","h":"Preamble is <b>neither a source of power<\/b> to legislature <b>nor a prohibition<\/b> upon powers of legislature."},{"t":"li","lv":0,"m":"b","h":"Preamble <b>can be amended<\/b> (ruled by SC in Kesavananda Bharati case 1973)"},{"t":"li","lv":0,"m":"b","h":"<b>42nd amendment, 1976<\/b> added the words - Socialist, Secular, and integrity"},{"t":"tab","rows":[["","Part of the Constitution?","Used to interpret the Constitution?"],["1960 Berubari Union case","No","Yes, in case of ambiguity"],["1973 Kesavananda Bharati case","Yes","Yes"],["","Same in all following cases",""]],"hdr":false,"cap":null}]}]},{"title":"Union & its Territory","cards":[{"kind":"note","title":"Union and its Territories","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"b","h":"<b>Article 1:<\/b> India, that is Bharat, shall be a Union of States"},{"t":"li","lv":1,"m":"b","h":"Union of States = Only States"},{"t":"li","lv":1,"m":"b","h":"Territory of India = States + UTs + any future acquisitions"},{"t":"li","lv":0,"m":"b","h":"<b>Article 2:<\/b> Parliament can add new states"},{"t":"li","lv":0,"m":"b","h":"<b>Article 3<\/b>: Parliament can change boundary/name of existing states"},{"t":"li","lv":0,"m":"b","h":"<b>Article 4:<\/b> Laws made under Art. 2&amp;3 (to amend Schedules 1&amp;4) are not constitutional amendments under article 368"}]},{"kind":"note","title":"Why “Union of States”?","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"b","h":"‘Union of States’ instead of ‘Federation of States’ because:"},{"t":"li","lv":1,"m":"b","h":"India is not result of an agreement among the states (e.g. USA)"},{"t":"li","lv":1,"m":"b","h":"States have no right to secede from the federation"},{"t":"li","lv":0,"m":"b","h":"India is divided into states only for administrative convenience"},{"t":"li","lv":0,"m":"b","h":"Article 2 is for adding new territory e.g. Goa, Sikkim, Puducherry, D&amp;D, D&amp;N Haveli"},{"t":"li","lv":0,"m":"b","h":"Article 3 is for existing territory e.g. Telangana, Uttarakhand, Jharkhand, Chhattisgarh"}]},{"kind":"note","title":"Bill under article 3","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"n","h":"1. President must refer the Bill to State legislature (no need if UT)"},{"t":"li","lv":0,"m":"n","h":"2. Irrespective of response, President recommends Bill to be introduced in Parliament"}]},{"kind":"note","title":"Bill under article 3 needs","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"n","h":"1. Simple majority in both LS &amp; RS ✔"},{"t":"li","lv":0,"m":"n","h":"<s>2. Special majority in both LS &amp; RS<\/s>"},{"t":"li","lv":0,"m":"n","h":"<s>3. Special majority in both LS &amp; RS and ratification by half of the States<\/s>"}]},{"kind":"note","title":"To settle border dispute","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"n","h":"1. Executive action is sufficient"},{"t":"li","lv":0,"m":"n","h":"2. Constitutional amendment not needed"}]},{"kind":"note","title":"To cede Indian territory","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"n","h":"1. Executive action is insufficient"},{"t":"li","lv":0,"m":"n","h":"2. Amendment u/a 368 is necessary"}]},{"kind":"note","title":"Destructible States","group":"Union and its Territories","items":[{"t":"li","lv":0,"m":"n","h":"1. India is described as ‘an indestructible union of destructible states’ (Ambedkar)"},{"t":"li","lv":0,"m":"n","h":"2. USA is described as ‘an indestructible union of indestructible states’"},{"t":"p","lv":0,"m":null,"h":"Reason: Indian Parliament can redraw the political map of India without state’s consent." Citizenship","cards":[{"kind":"note","title":"Part-II Articles 5 to 11 deals with citizenship","group":"Citizenship","items":[{"t":"li","lv":0,"m":"b","h":"Article 5 : <b>Citizens at commencement<\/b> of Constitution"},{"t":"li","lv":0,"m":"b","h":"Article 11 : <b>Parliament to regulate right of citizenship<\/b> (Hence came Citizenship Act, 1955"}]},{"kind":"note","title":"What the Constitution says on citizenship","group":"Citizenship","items":[{"t":"li","lv":0,"m":"b","h":"It identifies citizens as on 26-01-1950"},{"t":"li","lv":0,"m":"b","h":"It <b>does not deal with acquisition<\/b> or loss of citizenship subsequent to commencement"}]},{"kind":"note","title":"Acquisition of citizenship","group":"Citizenship","items":[{"t":"li","lv":0,"m":"n","h":"1) by birth"},{"t":"li","lv":0,"m":"n","h":"2) by descent"},{"t":"li","lv":0,"m":"n","h":"3) by registration (take oath)"},{"t":"li","lv":0,"m":"n","h":"4) by naturalization (take oath)"},{"t":"li","lv":0,"m":"n","h":"5) by incorporation of territory"},{"t":"p","lv":0,"m":null,"h":"Note: illegal migrant can not acquire Indian citizenship"},{"t":"tab","rows":[["<b>By<\/b>","<b>Details<\/b>"],["<b>Renunciation<\/b>","Giving up Indian citizenship. Minor children also lose citizenship, but can resume it on becoming major."],["<b>Termination<\/b>","On acquiring citizenship of another country, Indian citizenship automatically terminates"],["<b>Deprivation<\/b>","Central govt. terminating citizenship. e.g. disloyalty to Constitution; out of India for 7 years continuously; unlawfully communicated with enemy during war"]],"hdr":true,"cap":"<b>Loss of citizenship<\/b>"}]},{"kind":"note","title":"Citizenship by birth","group":"Citizenship","items":[{"t":"li","lv":0,"m":"n","h":"1. A child born in India automatically becomes Indian citizen"},{"t":"li","lv":0,"m":"n","h":"<s>2. X Children of foreign diplomats posted in India can get Indian citizenship by birth<\/s>"},{"t":"li","lv":0,"m":"n","h":"3. A child born today will get citizenship by birth if at least one parent is Indian, and another not an illegal migrant."}]},{"kind":"note","title":"Citizenship by naturalization","group":"Citizenship","items":[{"t":"li","lv":0,"m":"n","h":"1. Resided in India in last 12 months, and before that in 11 out of 14 years"},{"t":"li","lv":0,"m":"n","h":"2. Knows one of the languages of 8th schedule"}]},{"kind":"note","title":"Citizenship by registration","group":"Citizenship","items":[{"t":"li","lv":0,"m":"n","h":"1. Person of Indian origin resided for 7 years in India"},{"t":"li","lv":0,"m":"n","h":"2. Spouse/child of Indian citizen"},{"t":"li","lv":0,"m":"n","h":"3. And many more … . Conditions apply"}]},{"kind":"note","title":"Constitution denies following Fundamental Rights to aliens","group":"Citizenship","items":[{"t":"li","lv":0,"m":"b","h":"Article 15 -- Right against discrimination on grounds of religion, race, caste, sex or place of birth."},{"t":"li","lv":0,"m":"b","h":"Article 16 – Right to equality of opportunity in the matter of public employment."},{"t":"li","lv":0,"m":"b","h":"Article 19 – Right to freedom of speech and expression, assembly, association, movement, residence and profession."},{"t":"li","lv":0,"m":"b","h":"Articles 29 &amp; 30 – Cultural and educational rights."}]},{"kind":"note","title":"Do aliens enjoy the Right to Privacy?","group":"Citizenship","items":[{"t":"p","lv":0,"m":null,"h":"Yes, as its part of Article 21"}]},{"kind":"note","title":"Do aliens enjoy Right to assemble peacefully?","group":"Citizenship","items":[{"t":"p","lv":0,"m":null,"h":"No, it's part of Article 19"}]},{"kind":"pyq","title":"Citizenship","group":"Citizenship","year":"1984","q":"A good citizen is one who is","opts":["Conscious of social obligations","Not bothered about anything","Educated","Rich in cultural heritage"],"page":16,"ans":0,"exp":"A good citizen is conscious of social obligations.","check":false},{"kind":"pyq","title":"Citizenship","group":"Citizenship","year":"1999","q":"British citizen staying in India cannot claim Right to","opts":["Freedom of trade and profession","Equality before the Law","Protection of life and personal liberty","Freedom of religion"],"page":16,"ans":0,"exp":"Art. 19 freedoms (incl. trade and profession) are available only to citizens.","check":false},{"kind":"pyq","title":"Citizenship","group":"Citizenship","year":"2021","q":"With reference to India, consider the following statements :\n1. There is only one citizenship and one domicile.\n2. A citizen by birth only can become the Head of State.\n3. A foreigner once granted citizenship cannot be deprived of it under any circumstances.\nWhich of the statements given above is/are correct?","opts":["1 only","2 only","1 and 3","2 and 3"],"page":16,"ans":0,"exp":"India has single citizenship and one domicile; a naturalised citizen can become President; citizenship can be deprived under the Citizenship Act.","check":false},{"kind":"pyq","title":"Citizenship","group":"Citizenship","year":"2005","q":"Consider the following statements:\n1. Article 371A to 371I were inserted in the Constitution of India to meet regional demands of Nagaland, Assam, Manipur, Andhra Pradesh, Sikkim, Mizoram, Arunachal Pradesh and Goa.\n2. The Constitution of India and USA can envisage dual polity (Union and States) but single citizenship.\n3. A naturalized citizen of India can never be deprived of his citizenship.\nWhich of the statements given above is/are correct?","opts":["1, 2 and 3","1 and 3","3 only","1 only"],"page":16,"ans":3,"exp":"Only 1 is correct. USA has dual citizenship; a naturalised citizen can be deprived of citizenship.","check":false},{"kind":"note","title":"Overseas Citizen of India","group":"Overseas Citizen of India","items":[{"t":"p","lv":0,"m":null,"h":"<b>OCIs<\/b>: They are NOT Indians, so they need visa. Govt. has given them lifelong VISA."},{"t":"p","lv":0,"m":null,"h":"<b>NRIs<\/b>: They are Indians, so they don't need visa"}]},{"kind":"note","title":"Eligibility","group":"Overseas Citizen of India","items":[{"t":"li","lv":0,"m":"n","h":"1. Was Indian citizen on 26th January 1950; or his/her (great/grand) children; and their spouse"},{"t":"li","lv":0,"m":"n","h":"2. Should not be citizen of Pakistan or Bangladesh"},{"t":"li","lv":0,"m":"n","h":"3. Overseas Citizen of India: → Since 2005, by amending Citizenship Act, 1955"}]},{"kind":"note","title":"Rights of OCIs","group":"Overseas Citizen of India","items":[{"t":"li","lv":0,"m":"n","h":"1. Not a citizen, so can’t vote, get govt jobs, etc. They have the same FRs as other aliens."},{"t":"li","lv":0,"m":"n","h":"2. Same rights as NRIs in education, pursuing profession, adoption, fees at ASI monuments, etc."},{"t":"li","lv":0,"m":"n","h":"3. They are not at par to NRIs in case of acquisition of agricultural or plantation properties."},{"t":"li","lv":0,"m":"n","h":"4. Some restrictions like no Missionary, Tabligh, Journalism, Mountaineering."}]}]},{"title":"Fundamental Rights","cards":[{"kind":"note","title":"Fundamental Rights","group":"Fundamental Rights","items":[{"t":"p","lv":0,"m":null,"h":"<b>Articles 14-18:<\/b> Right to equality"},{"t":"p","lv":0,"m":null,"h":"<b>Articles 19-22:<\/b> Right to freedom"},{"t":"p","lv":0,"m":null,"h":"<b>Articles 23-24:<\/b> Right against exploitation"},{"t":"p","lv":0,"m":null,"h":"<b>Articles 25-28:<\/b> Right to freedom of religion"},{"t":"p","lv":0,"m":null,"h":"<b>Articles 29-30:<\/b> Cultural and educational rights"},{"t":"p","lv":0,"m":null,"h":"<b>Article 32:<\/b> Right to constitutional remedies"},{"t":"tab","rows":[["Equality","14","Equality before the law and equal protection of the laws"],["","15","Prohibition of <b>discrimination<\/b> on grounds of religion, race, caste, sex, or place of birth"],["","16","Equality of <b>opportunity<\/b> in matters of public employment"],["","17","Abolition of <b>untouchability<\/b> and prohibition of its practice"],["","18","Abolition of <b>titles<\/b> except military and academic"],["Freedom","19","Freedom of <b>speech<\/b>, assembly, association, movement, residence, and profession"],["","20","Protection in respect of <b>conviction<\/b> for offences"],["","21","Protection of <b>life<\/b> and personal liberty Right to elementary <b>education<\/b> (Art 21A)"],["","22","Protection against <b>arrest and detention<\/b> in certain cases"],["Exploitation","23","Prohibition of <b>traffic<\/b> in human beings and forced labour"],["","24","Prohibition of <b>employment of children<\/b> in factories, etc."],["Religion","25","Freedom of conscience and free profession, practice, and propagation of <b>religion<\/b>"],["","26","Freedom to <b>manage religious affairs<\/b>"],["","27","Freedom as to <b>payment of taxes<\/b> for the promotion of any particular religion"],["","28","Freedom as to <b>attendance at religious instruction<\/b> or religious worship in certain educational institutions"],["Cultural &amp; Educational Rights","29","Protection of interests of minorities"],["","30","Right of minorities to establish and administer educational institutions"]],"hdr":false,"cap":null}]},{"kind":"pyq","title":"Fundamental Rights","group":"Fundamental Rights","year":"2002","q":"Which of the following rights was described by Dr B R Ambedkar as heart &amp; soul of the Constitution?","opts":["Right to freedom of religion","Right to property","Right to equality","Right to Constitutional remedies"],"page":19,"ans":3,"exp":"Ambedkar called Art. 32 (constitutional remedies) the heart and soul of the Constitution.","check":false},{"kind":"pyq","title":"Fundamental Rights","group":"Fundamental Rights","year":"1995","q":"Prohibition of discrimination on grounds of religion, etc (Article 15 of Constitution) is a Fundamental Right classifiable under","opts":["Right to Freedom of Religion","Right against Exploitation","Cultural &amp; Educational Rights","Right to Equality"],"page":19,"ans":3,"exp":"Arts. 14–18 form the Right to Equality; Art. 15 is among them.","check":false},{"kind":"pyq","title":"Fundamental Rights","group":"Fundamental Rights","year":"2020","q":"Which of the following categories of Fundamental Rights incorporate protection against untouchability as a form of discrimination?","opts":["Right against Exploitation","Right to Freedom","Right to Constitutional Remedies","Right to Equality"],"page":19,"ans":3,"exp":"Abolition of untouchability (Art. 17) is part of the Right to Equality.","check":false},{"kind":"pyq","title":"Fundamental Rights","group":"Fundamental Rights","year":"2021","q":"A legislation which confers on executive or administrative authority an unguided and uncontrolled discretionary power in matter of application of law violates which of the following Articles?","opts":["Article 14","Article 28","Article 32","Article 44"],"page":19,"ans":0,"exp":"Unguided, arbitrary discretion violates equality before law — Art. 14.","check":false},{"kind":"pyq","title":"Fundamental Rights","group":"Fundamental Rights","year":"2021","q":"‘Right to Privacy’ is protected under which Article of Constitution?","opts":["Article 15","Article 19","Article 21","Article 29"],"page":20,"ans":2,"exp":"Right to privacy is part of Art. 21 (Puttaswamy, 2017).","check":false},{"kind":"pyq","title":"Fundamental Rights","group":"Fundamental Rights","year":"2017","q":"Which of the following are envisaged by Right against Exploitation? 1. Prohibition of traffic in human beings and forced labor\n2. Abolition of untouchability\n3. Protection of the interests of minorities\n4. Prohibition of employment of children in factories and mines\nSelect the correct answer using the code given below:","opts":["1, 2, 4 only","2, 3, 4 only","1, 4 only","1, 2, 3, 4"],"page":20,"ans":2,"exp":"Right against exploitation = Art. 23 (traffic, forced labour) and Art. 24 (child labour).","check":false},{"kind":"note","title":"Features of Fundamental Rights · part 1","group":"Features of Fundamental Rights","items":[{"t":"li","lv":0,"m":"b","h":"All FRs are available <b>against actions of State<\/b>"},{"t":"li","lv":1,"m":"b","h":"State is defined in Article 12"},{"t":"li","lv":1,"m":"b","h":"It includes Govt and all its agencies, even private companies working on behalf of govt"},{"t":"li","lv":0,"m":"b","h":"Some FRs are also available <b>against actions of private individuals<\/b>"},{"t":"li","lv":1,"m":"b","h":"15(2), 17, 23, 24"},{"t":"quote","h":["<b>Art. 15(1)<\/b> The State shall not discriminate against any <mark>citizen<\/mark> on grounds only of <mark>religion, race, caste, sex, place of birth<\/mark> or any of them.","<b>Art. 15(2)<\/b> No citizen shall, on these grounds, be subject to any disability, liability, restriction or condition with regard to — (a) access to <mark>shops, public restaurants, hotels and places of public entertainment<\/mark>; or (b) the use of <mark>wells, tanks, bathing ghats, roads and places of public resort<\/mark> maintained wholly or partly out of State funds or dedicated to the use of the general public."]},{"t":"li","lv":0,"m":"b","h":"FRs are <b>not absolute<\/b> but qualified"},{"t":"li","lv":1,"m":"b","h":"State can impose restrictions. Courts can decide if its reasonable."}]},{"kind":"note","title":"Features of Fundamental Rights · Negative and positive","group":"Features of Fundamental Rights","items":[{"t":"li","lv":0,"m":"b","h":"They are <b>not permanent or sacrosanct<\/b>"},{"t":"li","lv":1,"m":"b","h":"Parliament can amend or repeal FRs, but without affecting basic structure"},{"t":"li","lv":0,"m":"b","h":"<b>Negative and positive<\/b> in character:"},{"t":"li","lv":1,"m":"b","h":"Some are negative i.e. they impose restriction on State, e.g. 22"},{"t":"li","lv":1,"m":"b","h":"Some are positive i.e. they give privileges to people, e.g. 26"},{"t":"li","lv":0,"m":"b","h":"<b>Supreme Court is defender and guarantor of fundamental rights<\/b>"},{"t":"li","lv":1,"m":"b","h":"Under Article 32, one can directly move SC"},{"t":"li","lv":1,"m":"b","h":"To enforce FRs, jurisdiction of SC is original, but not exclusive. (concurrent to HC u/a 226)"},{"t":"li","lv":0,"m":"b","h":"<b>Article 13: laws inconsistent with FRs shall be void.<\/b>"},{"t":"li","lv":1,"m":"b","h":"Hence, it provides for judicial review. SC has this power u/a 13, and HCs have this power u/a 226"}]},{"kind":"note","title":"Features of Fundamental Rights · part 3","group":"Features of Fundamental Rights","items":[{"t":"li","lv":0,"m":"b","h":"Their application to <b>armed forces<\/b> etc. can be restricted by Parliament (Article 33)"},{"t":"li","lv":0,"m":"b","h":"Their application can be restricted during <b>martial law<\/b> (Article 34)"},{"t":"li","lv":0,"m":"b","h":"Some are self-executory, some can be <b>enforced by law<\/b>"},{"t":"li","lv":1,"m":"b","h":"Parliament, not states can make law to enforce FRs (Article 35)"}]},{"kind":"pyq","title":"Features of Fundamental Rights","group":"Features of Fundamental Rights","year":"2020","q":"Consider the following statements:\n1. The Constitution of India defines its structure in terms of federalism, secularism, fundamental rights and democracy.\n2. The Constitution of India provides for &#x27;Judicial review&#x27; to safeguard the citizens&#x27; liberties and to preserve the ideals on which the Constitution is based.\nWhich of the statements given above is are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":21,"ans":1,"exp":"The Constitution does not itself define its basic structure; judicial review is provided (Arts. 13, 32, 226).","check":false},{"kind":"pyq","title":"Features of Fundamental Rights","group":"Features of Fundamental Rights","year":"1993","q":"Which of the following comes under jurisdiction of both High Courts and SC?","opts":["Disputes between Centre and States","Disputes between States","Protection of Fundamental Rights","Protection against violation of Constitution"],"page":22,"ans":2,"exp":"Both SC (Art. 32) and HCs (Art. 226) can enforce Fundamental Rights.","check":false},{"kind":"pyq","title":"Features of Fundamental Rights","group":"Features of Fundamental Rights","year":"2017","q":"Which one of the following statements is correct?","opts":["Rights are claims of the State against the citizens","Rights are privileges which are incorporated in the Constitution of a State","Rights are claims of the citizens against the State","Rights are privileges of few citizens against many"],"page":22,"ans":2,"exp":"Rights are claims of the citizens against the State.","check":false},{"kind":"note","title":"Article 33","group":"Article 33","items":[{"t":"li","lv":0,"m":"b","h":"Parliament can <b>restrict FRs of armed forces<\/b>, police, intelligence agencies, etc."},{"t":"li","lv":0,"m":"b","h":"<s>State legislatures can restrict FRs of armed forces, police, intelligence agencies, etc.<\/s>"},{"t":"li","lv":0,"m":"b","h":"Army/Navy/AF/BSF Act etc impose restrictions on speech, association, etc."},{"t":"li","lv":0,"m":"b","h":"Applicable on all employees (officers, soldiers, cook, tailor, barber, etc)"},{"t":"tab","rows":[["<b>Martial Law (military rule)<\/b>","<b>National Emergency<\/b>"],["Affects only FRs","Also affects Centre-State relations, etc."],["Govt and ordinary law courts are suspended","Not suspended"]],"hdr":true,"cap":null}]},{"kind":"note","title":"Freedom of Religion","group":"Freedom of Religion","items":[{"t":"li","lv":0,"m":"b","h":"<s>People have religious rights <b>without any restrictions<\/b><\/s>"},{"t":"li","lv":0,"m":"b","h":"People have right to practice (worship/ritual/ceremony) religion"},{"t":"li","lv":0,"m":"b","h":"People have the right to propagate their religion"},{"t":"li","lv":0,"m":"b","h":"<s>People have the right to convert others to their religion<\/s>"},{"t":"li","lv":0,"m":"b","h":"<s>No religious instruction shall be provided in any educational institution administered by State<\/s>"},{"t":"li","lv":0,"m":"b","h":"No religious instruction shall be provided in any educational institution wholly maintained out of State funds"}]},{"kind":"note","title":"Cultural and Educational Rights (Arts. 29–30)","group":"Cultural and Educational Rights (Arts. 29–30)","items":[{"t":"quote","h":["<b>Art. 29(1)<\/b> <mark>Any section of the citizens<\/mark> residing in India having a <mark>distinct language, script or culture of its own<\/mark> shall have the right to conserve the same.","<b>Art. 29(2)<\/b> No citizen shall be denied admission into any educational institution <mark>maintained by the State or receiving aid out of State funds<\/mark> on grounds only of religion, race, caste, language or any of them.","<b>Art. 30(1)<\/b> <mark>All minorities, whether based on religion or language<\/mark>, shall have the right to <mark>establish and administer educational institutions of their choice<\/mark>.","<b>Art. 30(1A)<\/b> A law for the <mark>compulsory acquisition of any property of an educational institution<\/mark> run by a minority must fix an amount that does not restrict or abrogate this right. (Inserted by the <mark>44th Amendment, 1978<\/mark>.)","<b>Art. 30(2)<\/b> The State shall not, in <mark>granting aid<\/mark> to educational institutions, <mark>discriminate<\/mark> against an institution because it is under the management of a minority, whether based on religion or language."]}]},{"kind":"note","title":"Rights outside part-III","group":"Rights outside part-III","items":[{"t":"li","lv":0,"m":"b","h":"Aka constitutional rights or legal rights or non-fundamental rights"},{"t":"li","lv":0,"m":"b","h":"<b>Art. 265<\/b> → No <b>tax<\/b> except by authority of law"},{"t":"li","lv":0,"m":"b","h":"<b>Art. 300-A<\/b> → No person shall be <b>deprived of his property<\/b> save by authority of law"},{"t":"li","lv":0,"m":"b","h":"<b>Art. 301<\/b> → <b>Trade, commerce and intercourse<\/b> throughout the territory of India shall be free"}]},{"kind":"note","title":"Right to Property","group":"Rights outside part-III","items":[{"t":"li","lv":0,"m":"b","h":"<b>Type of right<\/b>"},{"t":"li","lv":1,"m":"b","h":"Fundamental right? <mark>No<\/mark>"},{"t":"li","lv":1,"m":"b","h":"Constitutional right? <mark>Yes<\/mark>"},{"t":"li","lv":1,"m":"b","h":"Legal right? <mark>Yes<\/mark>"},{"t":"li","lv":1,"m":"b","h":"Original Constitution had <mark>19(f) &amp; 31<\/mark> → a fundamental right, but property could be taken for public purpose with <mark>compulsory compensation<\/mark>"},{"t":"li","lv":1,"m":"b","h":"<mark>44th Constitutional Amendment Act 1978<\/mark> → removed 19(f) &amp; 31, inserted <mark>300-A<\/mark> → not a fundamental right; law can take away property; compensation not necessary"},{"t":"li","lv":0,"m":"b","h":"<b>Compensation<\/b> is necessary only if:"},{"t":"li","lv":1,"m":"b","h":"the property was of a <mark>minority educational institution<\/mark> (Article 30)"},{"t":"li","lv":1,"m":"b","h":"the property was under <mark>personal cultivation<\/mark> (Article 31-A, added by the <mark>1st Amendment 1951<\/mark>)"},{"t":"li","lv":0,"m":"b","h":"<b>Adverse possession<\/b>"},{"t":"li","lv":1,"m":"b","h":"If someone illegally occupies your property for <mark>12 years<\/mark> and you take no legal action, you lose its ownership"},{"t":"li","lv":1,"m":"b","h":"But the <mark>government cannot<\/mark> use this method to take over your property"},{"t":"li","lv":0,"m":"b","h":"<b>Remember<\/b>"},{"t":"li","lv":1,"m":"b","h":"300-A: no person shall be deprived of his property save by <mark>authority of law<\/mark>"},{"t":"li","lv":1,"m":"b","h":"300-A protects property against executive action"},{"t":"li","lv":1,"m":"b","h":"<s>300-A protects property against legislative action<\/s>"}]},{"kind":"pyq","title":"Rights outside part-III","group":"Rights outside part-III","year":"2005","q":"Consider the following statements:\n1. Article 301 pertains to Right to Property.\n2. Right to Property is a legal right but not a Fundamental Right.\n3. Article 300-A was inserted in the Constitution of India by the Congress Government at the Centre by the 44th Constitutional Amendment.\nWhich of the statement given above is/are correct?","opts":["2 only","2 and 3","1 and 3","1, 2 and 3"],"page":26,"ans":0,"exp":"Art. 301 is about trade and commerce. Art. 300-A came by the 44th Amendment (1978) under the Janata government, not Congress.","check":false},{"kind":"pyq","title":"Rights outside part-III","group":"Rights outside part-III","year":"2021","q":"What is the position of the Right to Property in India?","opts":["Legal right available to citizens only","Legal right available to any person","Fundamental Right available to citizens only","Neither Fundamental Right nor legal right"],"page":26,"ans":1,"exp":"Right to property (Art. 300-A) is a constitutional/legal right available to any person.","check":false},{"kind":"note","title":"Articles 358 and 359 relate to?","group":"Rights and National Emergency","items":[{"t":"li","lv":0,"m":"b","h":"Impact of National Emergency on FRs"},{"t":"li","lv":0,"m":"b","h":"<b>Article 358:<\/b> Art. 19 automatically suspended, only in case of external emergency (added by 44th Amendment)"},{"t":"li","lv":0,"m":"b","h":"<b>Article 359:<\/b> President can suspend enforcement of any FRs, <b>but not 20 &amp; 21<\/b> (added by 44th Amendment)"},{"t":"p","lv":0,"m":null,"h":"Note: President’s order u/a 359 must be approved by Parliament"}]},{"kind":"note","title":"Read carefully","group":"Rights and National Emergency","items":[{"t":"li","lv":0,"m":"b","h":"<s>When National emergency is proclaimed, Article 19 is automatically suspended.<\/s>"},{"t":"li","lv":0,"m":"b","h":"When National emergency is proclaimed, Article 19 is automatically suspended, only when it is due to war or external aggression, not armed rebellion."}]},{"kind":"note","title":"Writ: SC vs HC","group":"Writ: SC vs HC","items":[{"t":"li","lv":0,"m":"n","h":"1. <b>SC<\/b> can issue writ <b>only for FR<\/b>, but <b>HC<\/b> can issue writ for <b>other legal rights<\/b> also."},{"t":"li","lv":0,"m":"n","h":"2. <b>SC<\/b> can issue writ throughout <b>India<\/b>, <b>HC<\/b> can do so only in its <b>jurisdiction<\/b>."},{"t":"li","lv":0,"m":"n","h":"3. <b>SC can't refuse<\/b> to exercise Writ jurisdiction (Art. 32), but <b>HC can refuse<\/b> (as Art."},{"t":"p","lv":0,"m":null,"h":"226 is not FR)"}]},{"kind":"note","title":"Who can issue writs? · Habeas Corpus – (to have the body of)","group":"Writ: SC vs HC","items":[{"t":"li","lv":0,"m":"b","h":"SC (Art. 32)"},{"t":"li","lv":0,"m":"b","h":"HC (Art. 226)"},{"t":"li","lv":0,"m":"b","h":"Any other court empowered by parliament (Art. 32)."},{"t":"li","lv":0,"m":"n","h":"<b>1. Habeas Corpus – (to have the body of)<\/b>"},{"t":"li","lv":1,"m":"n","h":"a. Issued to a detaining authority, to produce the detained person in the court"},{"t":"li","lv":0,"m":"n","h":"<b>2. Mandamus – (we command)<\/b>"},{"t":"li","lv":1,"m":"n","h":"a. Issued to a public official / lower court / govt to perform official duties that were not performed"},{"t":"li","lv":0,"m":"n","h":"<b>3. Prohibition – (to forbid)<\/b>"},{"t":"li","lv":1,"m":"n","h":"a. Issued by a higher court to a lower court or tribunal, prohibiting it from taking up a case"},{"t":"li","lv":1,"m":"n","h":"b. Reason: lack of jurisdiction, hence Higher court transfers case to itself"},{"t":"li","lv":1,"m":"n","h":"c. Can be against only judicial or quasi-judicial authorities."}]},{"kind":"note","title":"Who can issue writs? · Quo-Warranto – (by what authority or warrant)","group":"Writ: SC vs HC","items":[{"t":"li","lv":0,"m":"n","h":"<b>4. Certiorari – (to be certified / to be informed)<\/b>"},{"t":"li","lv":1,"m":"n","h":"a. issued by a higher court to a lower court or tribunal, to transfer to itself or quash the order"},{"t":"li","lv":1,"m":"n","h":"b. Reason: lack of jurisdiction, or error of law"},{"t":"li","lv":1,"m":"n","h":"c. Can be also be against administrative authorities affecting rights of individuals (SC ruled in 1991)"},{"t":"li","lv":1,"m":"n","h":"d. Unlike prohibition which is only preventive, it is both preventive and curative."},{"t":"li","lv":0,"m":"n","h":"<b>5. Quo-Warranto – (by what authority or warrant)<\/b>"},{"t":"li","lv":1,"m":"n","h":"a. Issued to enquire into the legality of the claim of a person to a substantive public office."},{"t":"li","lv":1,"m":"n","h":"b. Unlike other four writs, it can be sought by non-aggrieved person also."}]},{"kind":"pyq","title":"Writ: SC vs HC","group":"Writ: SC vs HC","year":"1983","q":"The greatest hallmark of personal liberty is","opts":["Mandamus","Certiorari","Quo Warranto","Habeas Corpus"],"page":28,"ans":3,"exp":"Habeas corpus protects against illegal detention — the greatest safeguard of personal liberty.","check":false},{"kind":"pyq","title":"Writ: SC vs HC","group":"Writ: SC vs HC","year":"1985","q":"Mandamus means","opts":["A writ issued by a superior court command that a specified thing be done","A legal term for prisoner’s right to appear in person and be tried in court","A written public declaration of the intentions, opinions or motives of a sovereign or of a leader, party or body","The principle of hybridisation, discovered by Gregor Mendel which led to the improved breeds of plant and animal life"],"page":28,"ans":0,"exp":"Mandamus = ‘we command’ — an order to perform a public duty.","check":false},{"kind":"pyq","title":"Writ: SC vs HC","group":"Writ: SC vs HC","year":"1996","q":"When the Chief Justice of a High Court acts in an administrative capacity, he is subject to","opts":["the writ jurisdiction of any of the other judges of the High Court","special control exercised by the Chief Justice of India","discretionary powers of the Governor of the state","special powers provided to the Chief Minister in this regard"],"page":28,"ans":0,"exp":"In an administrative capacity the HC Chief Justice is subject to the writ jurisdiction of the other judges of the High Court.","check":false}]},{"title":"Fundamental Duties","cards":[{"kind":"note","title":"Fundamental Duties","group":"Fundamental Duties","items":[{"t":"p","lv":0,"m":null,"h":"It shall be the duty of <b>every citizen<\/b> of India:"},{"t":"li","lv":0,"m":"n","h":"1. To abide by the <b>Constitution<\/b> and respect its <b>ideals and institutions<\/b>, the National Flag and the National Anthem;"},{"t":"li","lv":0,"m":"n","h":"2. To cherish and follow the <b>noble ideals<\/b> which inspired our national struggle for freedom;"},{"t":"li","lv":0,"m":"n","h":"3. To uphold and protect the <b>sovereignty, unity and integrity<\/b> of India;"},{"t":"li","lv":0,"m":"n","h":"4. To <b>defend the country<\/b> and render national service when called upon to do so;"},{"t":"li","lv":0,"m":"n","h":"5. To promote <b>harmony<\/b> and the spirit of <b>common brotherhood<\/b> amongst all the people of India transcending religious, linguistic and regional or sectional diversities; to renounce practices derogatory to the dignity of women;"},{"t":"li","lv":0,"m":"n","h":"6. To value and preserve the rich <b>heritage<\/b> of our composite culture;"},{"t":"li","lv":0,"m":"n","h":"7. To protect and improve the natural <b>environment<\/b> including forests, lakes, rivers, wildlife and to have compassion for living creatures;"},{"t":"li","lv":0,"m":"n","h":"8. To develop the <b>scientific temper<\/b>, humanism and the spirit of inquiry and reform;"},{"t":"li","lv":0,"m":"n","h":"9. To safeguard <b>public property<\/b> and to abjure violence;"},{"t":"li","lv":0,"m":"n","h":"10.To strive towards <b>excellence<\/b> in all spheres of <b>individual and collective activity<\/b> so that the nation constantly rises to higher levels of endeavor and achievement;"},{"t":"li","lv":0,"m":"n","h":"11.Who is a parent or guardian, to provide opportunities for <b>education to his child<\/b>, or as the case may be, ward between the age of 6 to 14 years."}]},{"kind":"note","title":"It amended and added","group":"About 86th Amendment","items":[{"t":"p","lv":0,"m":null,"h":"<b>Fundamental duty #11 was added by 86th constitution amendments in 2002<\/b>"},{"t":"p","lv":0,"m":null,"h":"<b>FR: 21A:<\/b> State to provide free &amp; compulsory education to all children of 6-14 age"},{"t":"p","lv":0,"m":null,"h":"<b>FD: 51A:<\/b> To provide education to children of 6-14 years age"},{"t":"p","lv":0,"m":null,"h":"<b>DPSP: 45:<\/b> Care &amp; education to all children till 6 years of age"}]},{"kind":"note","title":"Features of Fundamental Duties","group":"Features of Fundamental Duties","items":[{"t":"li","lv":0,"m":"n","h":"1. FDs are <b>non-justiciable<\/b> (Justiciable: One can move court against their violation)"},{"t":"li","lv":0,"m":"n","h":"2. FDs are <b>enforceable by law<\/b> (Parliament can make law to enforce them)"},{"t":"li","lv":0,"m":"n","h":"3. Our Constitution says <b>nothing about their enforcement.<\/b>"},{"t":"li","lv":0,"m":"n","h":"4. FDs help courts in examining <b>constitutional validity of law.<\/b>"},{"t":"li","lv":0,"m":"n","h":"5. FDs apply <b>only to citizens, not foreigners.<\/b>"},{"t":"li","lv":0,"m":"n","h":"6. FDs were introduced by <b>Indira Gandhi govt<\/b> on recommendation of <b>Swaran Singh Committee.<\/b>"},{"t":"li","lv":0,"m":"n","h":"7. FDs are <b>inspired by USSR constitution.<\/b>"},{"t":"li","lv":0,"m":"n","h":"<s>8. Enjoyment of FRs is dependent on fulfillment of FDs.<\/s>"}]},{"kind":"pyq","title":"Features of Fundamental Duties","group":"Features of Fundamental Duties","year":"2012","q":"Which of the following are among Fundamental Duties of citizens laid down in Constitution?\n1. To preserve the rich heritage of our composite culture\n2. To protect the weaker sections from social injustice\n3. To develop the scientific temper and spirit of inquiry\n4. To strive towards excellence in all spheres of individual and collective activity.\nSelect the correct answer using the codes given below:","opts":["1 and 2 only","2 only","1, 3 and 4 only","1, 2, 3 and 4"],"page":30,"ans":2,"exp":"Protecting weaker sections from social injustice is a DPSP (Art. 46), not a Fundamental Duty.","check":false},{"kind":"pyq","title":"Features of Fundamental Duties","group":"Features of Fundamental Duties","year":"2017","q":"Which of the following statements are true of the Fundamental Duties of Indian citizen?\n1. A legislative process has been provided to enforce these duties.\n2. They are correlative to legal duties.\nSelect the correct answer:","opts":["1 only","2 only","Both 1&amp;2","Neither 1 nor 2"],"page":30,"ans":3,"exp":"No legislative process is laid down to enforce FDs, and they are not correlative to legal duties.","check":false},{"kind":"pyq","title":"Features of Fundamental Duties","group":"Features of Fundamental Duties","year":"2015","q":"To uphold and protect sovereignty, unity and integrity of India is a provision made in the","opts":["Preamble of the Constitution","Directive Principles of State Policy","Fundamental Rights","Fundamental Duties"],"page":31,"ans":3,"exp":"Art. 51A(c) — to uphold and protect the sovereignty, unity and integrity of India.","check":false}]},{"title":"Directive Principles","cards":[{"kind":"note","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","items":[{"t":"li","lv":0,"m":"b","h":"Constitution divides rights into <b>justiciable<\/b> and <b>non-justiciable<\/b> (as advised by Sir B N Rau)"},{"t":"li","lv":0,"m":"b","h":"Source: <b>Instrument of Instruction<\/b> of 1935 GoI Act and <b>Irish Constitution<\/b>"},{"t":"li","lv":0,"m":"b","h":"<b>Art. 37:<\/b> DPSP are <b>fundamental to governance<\/b> and it shall be the duty of the state to apply them in making laws."},{"t":"li","lv":0,"m":"b","h":"<b>1971, 25th Amendment:<\/b>"},{"t":"li","lv":1,"m":"b","h":"No law for DPSP Art. 39 (b)&amp;(c) shall be void for violating FR of Art.s 14, 19, 31"},{"t":"li","lv":0,"m":"b","h":"<b>1976, 42nd Amendment:<\/b>"},{"t":"li","lv":1,"m":"b","h":"extended scope of 25th Amendment to all DPSP"},{"t":"li","lv":0,"m":"b","h":"<b>1980, Minerva Mills case:<\/b>"},{"t":"li","lv":1,"m":"b","h":"extension given by 42nd amendment held unconstitutional by SC."},{"t":"li","lv":1,"m":"b","h":"SC also said that absolute primacy of one over other will disturb harmony of Constitution"},{"t":"li","lv":0,"m":"b","h":"Present position is that FR enjoy supremacy over the DPSP."},{"t":"li","lv":0,"m":"b","h":"Parliament can amend the FR for implementing DPSP (without damaging basic structure of Constitution)"},{"t":"li","lv":0,"m":"b","h":"<b>Art. 39<\/b>"},{"t":"li","lv":1,"m":"b","h":"<b>(b)<\/b> community resources be distributed to serve common good"},{"t":"li","lv":1,"m":"b","h":"<b>(c)<\/b> prevent concentration of wealth and means of production to the common detriment"}]},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2017","q":"Consider the following statements: With reference to the Constitution of India, the Directive Principles of State Policy constitute limitations upon\n1. Legislative function\n2. Executive function\nWhich of the above statements are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":32,"ans":3,"exp":"DPSPs are non-justiciable; they guide rather than limit legislative and executive functions.","check":false},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2020","q":"With reference to the provisions contained in Part IV of the constitution of India, which of the following statements is/ are correct?\n1. They shall be enforceable by courts\n2. They shall not be enforceable by any court\n3. The principles laid down in this part are to influence the making of laws by the state Select the correct answer using the code given below","opts":["1 only","2 only","1 &amp; 3 only","2 &amp; 3 only"],"page":33,"ans":3,"exp":"Art. 37: not enforceable by any court, but fundamental in the governance of the country and in making laws.","check":false},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2015","q":"Consider the following statements regarding Directive Principles of State Policy:\n1. The Principles spell out the socio-economic democracy in the country.\n2. The provisions contained in these Principles are not enforceable by any court.\nWhich of the statements given above is/ are correct?","opts":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"page":33,"ans":2,"exp":"DPSPs lay down socio-economic democracy and are non-justiciable.","check":false},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2015","q":"The ideal of Welfare State in the Indian Constitution is enshrined in its","opts":["Preamble","Directive Principles of State Policy","Fundamental Rights","Seventh Schedule"],"page":33,"ans":1,"exp":"The welfare-state ideal is enshrined in the Directive Principles.","check":false},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2002","q":"The purpose of the inclusion of DPSP in Indian Constitution is to establish:","opts":["political democracy","social democracy","Gandhian democracy","social and economic democracy"],"page":33,"ans":3,"exp":"DPSPs aim at social and economic democracy.","check":false},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2013","q":"According to the Constitution, which of the following are fundamental for governance of the country?","opts":["Fundamental Rights","Fundamental Duties","Directive Principles of State Policy","Fundamental Rights and Fundamental Duties"],"page":33,"ans":2,"exp":"Art. 37 calls DPSPs fundamental in the governance of the country.","check":false},{"kind":"pyq","title":"Directive Principles of State Policy","group":"Directive Principles of State Policy","year":"2021","q":"Under the Indian Constitution, concentration of wealth violates","o  and women","Participation of workers in management of industries","Right to work, education and public assistance","Securing living wage and human conditions of work to workers"],"page":35,"ans":1,"exp":"Art. 43A — participation of workers in management of industries — was added by the 42nd Amendment.","check":false},{"kind":"note","title":"DPSP at a glance (Arts. 36–51)","group":"DPSP at a glance (Arts. 36–51)","items":[{"t":"tab","rows":[["<b>Article<\/b>","<b>Content<\/b>","<b>Amendment<\/b>"],["Art. 36","<mark>Definition<\/mark> of the state.",""],["Art. 37","<mark>Application<\/mark> of the principles contained in this Part.",""],["Art. 38","State to secure a <mark>social order<\/mark> for the promotion of <mark>welfare<\/mark> of the people.","Amended by 44th Amendment, 1978"],["Art. 39","Certain principles of <mark>policy<\/mark> to be followed by the State.","Amended by 44th Amendment, 1978"],["Art. 39A","<mark>Equal justice<\/mark> and <mark>free legal aid<\/mark>.","Added by 42nd Amendment, 1976"],["Art. 40","Organisation of <mark>village panchayats<\/mark>.",""],["Art. 41","<mark>Right to work<\/mark>, to <mark>education<\/mark> and to public assistance in certain cases.",""],["Art. 42","Just and <mark>humane conditions<\/mark> of work and maternity relief.",""],["Art. 43","<mark>Living wage<\/mark>, etc., for workers.",""],["Art. 43A","<mark>Participation<\/mark> of workers in management of industries.","Added by 42nd Amendment, 1976"],["Art. 44","<mark>Uniform civil code<\/mark> for the citizens.",""],["Art. 45","Early <mark>childhood care<\/mark> and education to children below six years.","Amended by 86th Amendment, 2002"],["Art. 46","Promotion of <mark>educational<\/mark> and <mark>economic interests<\/mark> of SCs, STs and other weaker sections.",""],["Art. 47","Raise the level of <mark>nutrition<\/mark> and the <mark>standard of living<\/mark>; improve public health.",""],["Art. 48","Organisation of <mark>agriculture<\/mark> and animal husbandry.",""],["Art. 48A","<mark>Protection<\/mark> and improvement of environment; safeguarding forests and wildlife.","Added by 42nd Amendment, 1976"],["Art. 49","<mark>Protection<\/mark> of monuments and places and objects of national importance.",""],["Art. 50","<mark>Separation<\/mark> of judiciary from executive.",""],["Art. 51","Promotion of international <mark>peace<\/mark> and <mark>security<\/mark>.",""]],"hdr":true,"cap":null}]},{"kind":"note","title":"Classification of DPSP","group":"Classification of DPSP","items":[{"t":"p","lv":0,"m":null,"h":"<s>Constitution classifies DPSPs into categories: Socialistic, Gandhian,<\/s>"},{"t":"p","lv":0,"m":null,"h":"<s>Liberal-intellectual<\/s>"}]},{"kind":"note","title":"Socialistic principles","group":"Socialistic principles","items":[{"t":"li","lv":0,"m":"n","h":"1. Promote welfare; Secure justice (social, economic, political); Minimize inequalities in income, status, etc."},{"t":"li","lv":0,"m":"n","h":"2. Livelihood for all; equal distribution of resources; equal pay for equal work"},{"t":"li","lv":0,"m":"n","h":"3. Free legal aid to poor (Art 39A)"},{"t":"li","lv":0,"m":"n","h":"4. Right to work &amp; education; assistance for unemployed, old age, sick, disabled"},{"t":"li","lv":0,"m":"n","h":"5. Humane conditions of work; Maternity relief"},{"t":"li","lv":0,"m":"n","h":"6. Living wage for workers"},{"t":"li","lv":0,"m":"n","h":"7. Participation of workers in industries (Art 43A)"},{"t":"li","lv":0,"m":"n","h":"8. Better nutrition, standard of living, public health"}]},{"kind":"note","title":"Gandhian principles","group":"Gandhian principles","items":[{"t":"li","lv":0,"m":"n","h":"1. Empower village panchayats (Art. 40)"},{"t":"li","lv":0,"m":"n","h":"2. Promote cottage industries"},{"t":"li","lv":0,"m":"n","h":"3. Promote cooperate societies (Art 43B)"},{"t":"li","lv":0,"m":"n","h":"4. Promote education &amp; economic interest of SC/ST/weaker sections (Art 46)"},{"t":"li","lv":0,"m":"n","h":"5. Prohibit intoxicating drinks and drugs"},{"t":"li","lv":0,"m":"n","h":"6. Prohibit slaughter of cows (Art 48)"}]},{"kind":"note","title":"Liberal - Intellectual Principles","group":"Liberal - Intellectual Principles","items":[{"t":"li","lv":0,"m":"n","h":"1. Secure Uniform Civil Code (Art 44)"},{"t":"li","lv":0,"m":"n","h":"2. Care/education for children till 6 years of age (Art 45)"},{"t":"li","lv":0,"m":"n","h":"3. Agri and animal husbandry on scientific lines"},{"t":"li","lv":0,"m":"n","h":"4. Protect environment (Art 48A)"},{"t":"li","lv":0,"m":"n","h":"5. Protect monuments"},{"t":"li","lv":0,"m":"n","h":"6. Separate judiciary from executive (Art 50)"},{"t":"li","lv":0,"m":"n","h":"7. International peace, security, arbitration (Art 51)"}]},{"kind":"pyq","title":"Liberal - Intellectual Principles","group":"Liberal - Intellectual Principles","year":"2012","q":"Consider the following provisions under the DPSP as enshrined in the Constitution of India:\n1. Securing for citizens of India a uniform civil code\n2. Organizing village Panchayats\n3. Promoting cottage industries in rural areas\n4. Securing for all the workers reasonable leisure and cultural opportunities.\nWhich of the above are the Gandhian Principles that are reflected in the DPSP?","opts":["1, 2 and 4 only","2 and 3 only","1, 3 and 4 only","1, 2, 3 and 4"],"page":38,"ans":1,"exp":"Village panchayats (Art. 40) and cottage industries (Art. 43) are Gandhian; UCC is liberal-intellectual; leisure for workers is socialistic.","check":false},{"kind":"pyq","title":"Liberal - Intellectual Principles","group":"Liberal - Intellectual Principles","year":"2008","q":"Which of the following is/are included in DPSP?\n1. Prohibition of traffic in human beings and forced labor\n2. Prohibition of Consumption except for medicinal purposes of intoxicating drinks and other drugs which are injurious to health\nSelect the correct answer using the code given below:","opts":["1 Only","2 Only","Both 1&amp;2","Neither 1 nor 2"],"page":38,"ans":1,"exp":"
