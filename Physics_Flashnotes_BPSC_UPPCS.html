<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physics Flashnotes · BPSC + UPPCS</title>
<style>
:root{
  --bg:#13141a; --bg2:#181a21; --panel:#1d2028; --panel2:#242833; --line:#2e323e; --line2:#3d4351;
  --ink:#e9e5da; --ink2:#aca596; --ink3:#726c61;
  --orpiment:#e0a33c; --orp-d:#c08420; --lapis:#4b7fe0; --cinnabar:#dd5f4c;
  --malachite:#44ab88; --eosin:#dd6f9c; --violet:#9d72cc;
  --acc:var(--orpiment); --acc-soft:rgba(224,163,60,.13); --acc-line:rgba(224,163,60,.42);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --r:12px; --sh:0 1px 3px rgba(0,0,0,.35);
}
html[data-t="light"]{
  --bg:#f5f2e8; --bg2:#edeade; --panel:#fffdf6; --panel2:#f7f4e9; --line:#ded9c7; --line2:#c6bfa9;
  --ink:#23252c; --ink2:#5d584f; --ink3:#8c867a;
  --orpiment:#9a6d12; --orp-d:#7d5809; --lapis:#2f5bb5; --cinnabar:#b8422f;
  --malachite:#1f7a5b; --eosin:#b04872; --violet:#6f4a9c;
  --acc-soft:rgba(154,109,18,.10); --acc-line:rgba(154,109,18,.34); --sh:0 1px 3px rgba(60,50,30,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.6;font-size:16.5px;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 93%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1120px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
.brand{font-size:18px;font-weight:600}.brand em{font-style:normal;color:var(--acc)}
.bsub{font-size:11.5px;color:var(--ink3);letter-spacing:.5px;margin-top:-3px}
.hstats{margin-left:auto;display:flex;align-items:center;gap:15px;font-size:12.5px;color:var(--ink2)}
.hstat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--ink2);transition:.16s;flex:none}
.iconbtn:hover{border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.bar{height:2px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--orpiment),var(--malachite));
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 90px}

/* view switch */
.vsw{display:flex;gap:5px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  margin-bottom:18px;width:fit-content}
.vsw button{padding:6px 15px;border-radius:8px;font-size:13.5px;color:var(--ink2);transition:.15s}
.vsw button:hover{color:var(--ink)}
.vsw button.on{background:var(--acc);color:#fff}
html[data-t="light"] .vsw button.on{color:#fff}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);transition:.14s}
.chip:hover{border-color:var(--acc-line);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .n{font-size:10.5px;opacity:.72;margin-left:4px;font-variant-numeric:tabular-nums}

.srch{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
  color:var(--ink);font-size:14.5px;font-family:inherit;margin-bottom:18px}
.srch::placeholder{color:var(--ink3)}
.srch:focus{outline:none;border-color:var(--acc-line)}

/* ---------- topic grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;text-align:left;
  transition:.16s;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.tc:hover{border-color:var(--acc-line);transform:translateY(-2px)}
.tc .tn{font-size:16px;font-weight:600;line-height:1.32}
.tc .tm{font-size:12px;color:var(--ink3);display:flex;gap:11px;flex-wrap:wrap}
.tc .tm span{white-space:nowrap}
.prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .k{background:var(--malachite)}.prog .r{background:var(--cinnabar)}
.pct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- flashcard ---------- */
.stage{max-width:680px;margin:0 auto}
.crumb{margin-bottom:13px;line-height:1.45}
.crumb button{color:var(--acc);font-size:12.5px;padding:0;display:inline-block}
.crumb button:hover{color:var(--orp-d)}
.crumb .loc{font-size:12.5px;color:var(--ink2);margin-top:1px}
.crumb .loc .sec::before{content:"·";margin:0 7px;color:var(--ink3)}
.crumb .loc .sec{color:var(--ink3)}
.flip{perspective:1600px;margin-bottom:14px}
.inner{position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);
  min-height:260px;cursor:pointer}
.inner.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:30px 28px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.face.back{transform:rotateY(180deg);background:var(--panel2);border-color:var(--acc-line)}
.fq{font-size:20px;line-height:1.44;font-weight:500;text-align:center}
.fa{font-size:17.5px;line-height:1.62;color:var(--ink2)}
.fa b{color:var(--ink);font-weight:600}
.hint{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.4px}
.trap{position:absolute;top:12px;right:14px;font-size:11px;color:var(--cinnabar);letter-spacing:.3px}
.pin{position:absolute;top:12px;left:14px;font-size:16px;color:var(--ink3);line-height:1}
.pin.on{color:var(--orpiment)}

.marks{display:flex;gap:7px;margin-bottom:12px}
.mk{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;color:var(--ink2);transition:.15s}
.mk:hover{border-color:var(--acc-line);color:var(--ink)}
.mk.k.on{background:rgba(68,171,136,.15);border-color:var(--malachite);color:var(--malachite)}
.mk.r.on{background:rgba(221,95,76,.15);border-color:var(--cinnabar);color:var(--cinnabar)}
.mk.s.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.cnav{display:flex;align-items:center;gap:9px}
.nb{padding:8px 16px;border-radius:9px;border:1px solid var(--line);font-size:14px;color:var(--ink2);transition:.15s}
.nb:hover:not(:disabled){border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.nb:disabled{opacity:.32;cursor:not-allowed}
.nb.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.nb.pri:hover{background:var(--orp-d);border-color:var(--orp-d);color:#fff}
.pos{margin:0 auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- notes view ---------- */
.notes{max-width:780px;margin:0 auto}
.ch{margin-bottom:38px}
.ch h2{font-size:23px;font-weight:600;margin:0 0 4px;line-height:1.25}
.ch .chm{font-size:12px;color:var(--ink3);margin-bottom:20px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec{margin-bottom:24px}
.sec h3{font-size:15px;font-weight:600;color:var(--acc);margin:0 0 10px;letter-spacing:.15px}
.pt{display:flex;gap:11px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pt:last-child{border-bottom:none}
.pt .q{flex:0 0 40%;font-size:14.5px;color:var(--ink);font-weight:500;line-height:1.5}
.pt .a{flex:1;font-size:14.5px;color:var(--ink2);line-height:1.55}
.pt .a b{color:var(--ink);font-weight:600}
.pt.tr .q{color:var(--cinnabar)}
table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:14px}
caption{text-align:left;font-size:13px;font-weight:600;color:var(--ink2);padding-bottom:7px}
th{background:var(--panel2);color:var(--acc);font-weight:600;text-align:left;padding:7px 11px;
  border:1px solid var(--line);font-size:13px}
td{padding:7px 11px;border:1px solid var(--line);color:var(--ink2)}
tbody tr:nth-child(even) td{background:var(--bg2)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.empty{padding:60px 24px;text-align:center;color:var(--ink3)}
.empty h3{color:var(--ink2);font-weight:500;font-size:17px;margin:0 0 7px}
.empty p{font-size:14px;margin:0 0 18px}
.keys{margin-top:20px;text-align:center;font-size:11.5px;color:var(--ink3);display:flex;justify-content:center;
  flex-wrap:wrap;gap:5px 14px}
kbd{font-family:inherit;border:1px solid var(--line2);border-radius:4px;padding:.5px 5px;font-size:10.5px;color:var(--ink2)}

@media(max-width:720px){
  .wrap{padding:14px 13px 80px}
  .hstats{gap:10px;font-size:11.5px}.brand{font-size:16px}
  .grid{grid-template-columns:1fr;gap:10px}
  .face{padding:24px 19px}.fq{font-size:18.5px}.fa{font-size:16.5px}
  .inner{min-height:230px}
  .pt{flex-direction:column;gap:3px}.pt .q{flex:none}
  .ch h2{font-size:20px}
  .keys{display:none}
  .nb{padding:8px 13px;font-size:13.5px}
}
@media(max-width:430px){.hstat.hide-s{display:none}}
</style></head><body>

<header>
 <div class="hwrap">
  <div><div class="brand">Physics <em>Flashnotes</em></div>
   <div class="bsub">BPSC + UPPCS · 709 cards · 11 chapters</div></div>
  <div class="hstats">
   <div class="hstat hide-s">Known <b id="sK">0</b></div>
   <div class="hstat">Review <b id="sR">0</b></div>
   <div class="hstat hide-s">Starred <b id="sS">0</b></div>
   <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
   <button class="iconbtn" id="reset" title="Reset all progress" aria-label="Reset progress">↺</button>
  </div>
 </div>
 <div class="bar"><i id="bar" style="width:0%"></i></div>
</header>

<div class="wrap">
 <div class="vsw">
   <button id="vCards" class="on">Flashcards</button>
   <button id="vNotes">Read as notes</button>
 </div>
 <div id="body"></div>
</div>

<script>
const C=[{"t":"Units","s":"Measurement and Units: The Basics","f":"What is measurement?","b":"Comparing an unknown amount with a <b>fixed, agreed-upon standard</b>."},{"t":"Units","s":"Measurement and Units: The Basics","f":"What is a physical quantity?","b":"Anything that can be measured — length, time, mass."},{"t":"Units","s":"Measurement and Units: The Basics","f":"The two parts of every measurement","b":"A <b>number</b> (how many) and a <b>unit</b> (the standard)."},{"t":"Units","s":"Measurement and Units: The Basics","f":"Define a 'unit'","b":"A fixed reference amount of a quantity that everyone accepts."},{"t":"Units","s":"Measurement and Units: The Basics","f":"Why say 'the rope is 7 metres' not 'the rope is 7'?","b":"A number without a unit is meaningless; we need <b>one common system</b> worldwide."},{"t":"Units","s":"Measurement and Units: The Basics","f":"Why must units be universal?","b":"A measurement made in India must mean exactly the same in Japan or Brazil."},{"t":"Units","s":"The SI System and 7 Base Units","f":"SI stands for… and adopted when?","b":"<b>Système International d'Unités</b>, adopted in <b>1960</b> as the world standard."},{"t":"Units","s":"The SI System and 7 Base Units","f":"What are base (fundamental) quantities?","b":"Independent building blocks, <b>not defined by any other quantity</b>."},{"t":"Units","s":"The SI System and 7 Base Units","f":"How many SI base quantities are there?","b":"Exactly <b>seven</b> base quantities and seven base units."},{"t":"Units","s":"The SI System and 7 Base Units","f":"What are derived quantities?","b":"Built by combining base quantities, e.g. speed = length ÷ time."},{"t":"Units","s":"The SI System and 7 Base Units","f":"Name the older unit systems","b":"<b>CGS</b> (cm-g-s), <b>FPS</b> (foot-pound-second), <b>MKS</b> (m-kg-s)."},{"t":"Units","s":"The SI System and 7 Base Units","f":"SI relates to MKS how?","b":"SI is essentially the upgraded, expanded version of <b>MKS</b>."},{"t":"Units","s":"Derived Units and Special Names","f":"Can every special-named unit be rewritten?","b":"Yes — always re-writable purely in <b>base units</b>."},{"t":"Units","s":"Derived Units and Special Names","f":"How do units behave in multiplication/division?","b":"Like <b>algebra</b>; identical units cancel."},{"t":"Units","s":"Derived Units and Special Names","f":"Power formula and unit","b":"<b>Power = energy ÷ time</b> (rate of doing work); unit <b>watt</b>, 1 W = 1 J/s."},{"t":"Units","s":"Derived Units and Special Names","f":"1 tesla in base terms","b":"<b>1 tesla = 1 N/(A·m)</b> for magnetic flux density."},{"t":"Units","s":"Derived Units and Special Names","f":"Force: formula and unit","b":"<b>Force = mass × acceleration</b>; unit <b>newton</b>, 1 N = 1 kg·m/s². (Newton)"},{"t":"Units","s":"Derived Units and Special Names","f":"Pressure: formula and unit","b":"<b>Pressure = force ÷ area</b>; unit <b>pascal</b>, 1 Pa = 1 N/m². (Pascal)"},{"t":"Units","s":"Units of Length and Special Big/Small Units","f":"SI base unit of length","b":"The <b>metre (m)</b> — every true length reduces to metres."},{"t":"Units","s":"Units of Length and Special Big/Small Units","f":"Is a light-year time or distance?","b":"<b>Distance</b> — light's travel in one year, about <b>9.46 × 10¹⁵ m</b>."},{"t":"Units","s":"Units of Length and Special Big/Small Units","f":"What is an astronomical unit (AU)?","b":"The average <b>Earth–Sun distance</b>."},{"t":"Units","s":"Units of Length and Special Big/Small Units","f":"1 parsec equals…","b":"About <b>3.26 light-years</b>."},{"t":"Units","s":"Units of Length and Special Big/Small Units","f":"What is an angstrom used for?","b":"<b>Å = 10⁻¹⁰ m</b>, used for atomic sizes."},{"t":"Units","s":"Units of Length and Special Big/Small Units","f":"⚠ Trap: is kg/cm² an SI pressure unit?","b":"<b>No</b> — it's a workshop unit; the correct SI unit is the <b>pascal</b>."},{"t":"Units","s":"The Electricity 'Unit' and Energy in Joules","f":"On a home bill, one 'unit' means…","b":"One <b>kilowatt-hour (kWh)</b> — not an SI unit."},{"t":"Units","s":"The Electricity 'Unit' and Energy in Joules","f":"Define one unit physically","b":"Energy used by a <b>1000 W appliance running for 1 hour</b>."},{"t":"Units","s":"The Electricity 'Unit' and Energy in Joules","f":"Convert 1 unit to joules","b":"<b>1 unit = 1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J</b>."},{"t":"Units","s":"The Electricity 'Unit' and Energy in Joules","f":"Where does 3600 come from?","b":"<b>60 minutes × 60 seconds</b> in an hour."},{"t":"Units","s":"The Electricity 'Unit' and Energy in Joules","f":"250 units in joules","b":"250 × 3.6 × 10⁶ = <b>9 × 10⁸ J</b>."},{"t":"Units","s":"Scalar and Vector Quantities","f":"Define a scalar (with examples)","b":"Only <b>magnitude</b>: mass, time, speed, distance, temperature, energy."},{"t":"Units","s":"Scalar and Vector Quantities","f":"Define a vector (with examples)","b":"<b>Magnitude and direction</b>: displacement, velocity, acceleration, force, momentum."},{"t":"Units","s":"Scalar and Vector Quantities","f":"Famous scalar–vector pairs","b":"<b>distance</b> (scalar) vs <b>displacement</b> (vector); <b>speed</b> vs <b>velocity</b>."},{"t":"Units","s":"Scalar and Vector Quantities","f":"⚠ Is pressure a scalar or vector?","b":"<b>Scalar</b> — it pushes equally in all directions, with no single direction."},{"t":"Units","s":"Scalar and Vector Quantities","f":"⚠ Current vs current density","b":"<b>Current density (J = I/A) is a vector</b>, but ordinary <b>electric current is a scalar</b>."},{"t":"Units","s":"Scalar and Vector Quantities","f":"What is a unit vector?","b":"î, ĵ, k̂ — magnitude 1, <b>no dimension and no unit</b>; it shows direction only."},{"t":"Units","s":"Dimensions and Dimensional Formula","f":"What does 'dimension' show?","b":"Which base ingredients (<b>M, L, T</b>) make up a quantity, ignoring numbers."},{"t":"Units","s":"Dimensions and Dimensional Formula","f":"Base dimension symbols","b":"<b>[M]</b> mass, <b>[L]</b> length, <b>[T]</b> time, <b>[A]</b> current, <b>[K]</b>, <b>[mol]</b>, <b>[cd]</b>."},{"t":"Units","s":"Dimensions and Dimensional Formula","f":"What is a dimensional formula?","b":"It shows the <b>powers</b> of the base dimensions combined."},{"t":"Units","s":"Dimensions and Dimensional Formula","f":"Dimensional formula of speed","b":"Speed = length ÷ time → <b>[M⁰L¹T⁻¹]</b>."},{"t":"Units","s":"Dimensions and Dimensional Formula","f":"Dimensional formula of force","b":"Force = mass × acceleration → <b>[M¹L¹T⁻²]</b>."},{"t":"Units","s":"Dimensions and Dimensional Formula","f":"Name dimensionless quantities","b":"<b>Angle, strain, refractive index</b> — no dimensions or units."},{"t":"Units","s":"Uses of Dimensional Analysis","f":"State the principle of homogeneity","b":"Every term in a valid equation must have the <b>same dimensions</b>."},{"t":"Units","s":"Uses of Dimensional Analysis","f":"Three main uses","b":"<b>Check correctness</b> of an equation, <b>convert</b> units between systems, and <b>derive relations</b> between quantities."},{"t":"Units","s":"Uses of Dimensional Analysis","f":"⚠ Limit 1 of dimensional analysis","b":"It <b>cannot find dimensionless constants</b> (like ½ or 2π)."},{"t":"Units","s":"Uses of Dimensional Analysis","f":"⚠ Limit 2 of dimensional analysis","b":"It cannot handle <b>trigonometric, exponential or log</b> functions directly."},{"t":"Units","s":"Measuring Instruments You Must Know","f":"Odometer measures…","b":"The <b>distance travelled</b> by a vehicle."},{"t":"Units","s":"Measuring Instruments You Must Know","f":"Speedometer measures…","b":"The <b>instantaneous speed</b> of a vehicle."},{"t":"Units","s":"Measuring Instruments You Must Know","f":"Pyrheliometer measures…","b":"The intensity of <b>solar radiation</b> (direct sunlight)."},{"t":"Units","s":"Measuring Instruments You Must Know","f":"Barometer vs manometer","b":"<b>Barometer</b> → atmospheric pressure; <b>manometer</b> → gas pressure."},{"t":"Units","s":"Measuring Instruments You Must Know","f":"Vernier caliper & screw gauge measure…","b":"Small <b>lengths/thicknesses</b> accurately."},{"t":"Units","s":"Measuring Instruments You Must Know","f":"Ammeter vs voltmeter","b":"<b>Ammeter</b> → current; <b>voltmeter</b> → potential difference."},{"t":"Units","s":"Other Common Units and Pairs","f":"Unit of power of a lens","b":"The <b>dioptre (D)</b>."},{"t":"Units","s":"Other Common Units and Pairs","f":"Unit of heat and energy","b":"The <b>joule (J)</b>."},{"t":"Units","s":"Other Common Units and Pairs","f":"Momentum ÷ velocity gives…","b":"<b>Mass</b> (since momentum = mass × velocity)."},{"t":"Units","s":"Other Common Units and Pairs","f":"Temperature scales","b":"<b>Kelvin</b> (SI), Celsius and Fahrenheit."},{"t":"Units","s":"Other Common Units and Pairs","f":"Non-SI pressure units","b":"<b>Atmosphere, bar and torr</b>."},{"t":"Units","s":"Other Common Units and Pairs","f":"Unit of radioactivity","b":"<b>Curie / becquerel</b> — activity of a radioactive substance. (Becquerel)"},{"t":"Units","s":"Significant Figures, Accuracy and Errors","f":"Define significant figures","b":"The <b>reliable digits</b> in a measurement plus <b>one uncertain digit</b>."},{"t":"Units","s":"Significant Figures, Accuracy and Errors","f":"Accuracy vs precision","b":"<b>Accuracy</b> = how close to the true value; <b>precision</b> = how finely it is measured."},{"t":"Units","s":"Significant Figures, Accuracy and Errors","f":"Systematic errors","b":"Have a <b>fixed cause</b> (faulty instrument) and a <b>consistent direction</b>."},{"t":"Units","s":"Significant Figures, Accuracy and Errors","f":"Random errors","b":"Vary unpredictably; reduced by <b>taking many readings</b>."},{"t":"Units","s":"Significant Figures, Accuracy and Errors","f":"Absolute error","b":"The difference between a reading and the <b>true value</b>."},{"t":"Units","s":"Significant Figures, Accuracy and Errors","f":"Least count","b":"The <b>smallest value</b> an instrument can measure."},{"t":"Motion","s":"What is Motion?","f":"Define motion","b":"An object <b>changes its position with time</b>."},{"t":"Motion","s":"What is Motion?","f":"What do you need to judge motion?","b":"A fixed <b>reference point (origin)</b> to compare against."},{"t":"Motion","s":"What is Motion?","f":"Are rest and motion absolute?","b":"No — they are <b>relative</b>, depending on the observer's reference point."},{"t":"Motion","s":"What is Motion?","f":"Man in a moving train — at rest or in motion?","b":"<b>At rest with respect to the train</b>, but in motion with respect to the platform. Both views are correct."},{"t":"Motion","s":"Distance vs Displacement","f":"Define distance","b":"The <b>total length of the actual path</b> travelled. It is a <b>scalar</b>."},{"t":"Motion","s":"Distance vs Displacement","f":"Define displacement","b":"The <b>shortest straight line</b> from start to finish, with direction. It is a <b>vector</b>."},{"t":"Motion","s":"Distance vs Displacement","f":"Walk a full circle back to start — distance and displacement?","b":"Large <b>distance</b> but <b>zero displacement</b>."},{"t":"Motion","s":"Distance vs Displacement","f":"Can displacement be zero or negative?","b":"Yes — <b>zero or even negative</b>; but distance is <b>always positive</b>."},{"t":"Motion","s":"Scalars and Vectors","f":"Memory trick for scalar vs vector","b":"If <b>how much</b> is enough it is scalar; if you also need <b>which way</b> it is vector."},{"t":"Motion","s":"Scalars and Vectors","f":"Scalar–vector partners","b":"Speed & distance are scalars; <b>velocity and displacement are vectors</b>. Mass ↔ Weight is another exam pair."},{"t":"Motion","s":"Speed, Velocity & Average Speed","f":"Speed: formula, type, unit","b":"<b>Speed = Distance ÷ Time</b>; a scalar, SI unit <b>m/s</b>."},{"t":"Motion","s":"Speed, Velocity & Average Speed","f":"Velocity: formula, type, unit","b":"<b>Velocity = Displacement ÷ Time</b>; a vector, SI unit <b>m/s</b>."},{"t":"Motion","s":"Speed, Velocity & Average Speed","f":"What is uniform velocity?","b":"Equal displacements in equal times along a line."},{"t":"Motion","s":"Speed, Velocity & Average Speed","f":"⚠ Average speed for two equal halves","b":"<b>2v₁v₂ ÷ (v₁+v₂)</b> — the <b>harmonic mean</b>, not the simple average."},{"t":"Motion","s":"Speed, Velocity & Average Speed","f":"Average speed vs average velocity","b":"Average speed uses <b>total distance</b>; average velocity uses <b>total displacement</b>."},{"t":"Motion","s":"Acceleration","f":"Define acceleration","b":"The rate of change of <b>velocity</b> with time; it is a <b>vector</b>."},{"t":"Motion","s":"Acceleration","f":"Acceleration formula and unit","b":"<b>a = (v − u) ÷ t</b>, SI unit <b>m/s²</b>."},{"t":"Motion","s":"Acceleration","f":"Positive vs negative acceleration","b":"Increasing velocity → <b>positive</b>; decreasing velocity → <b>negative (retardation/deceleration)</b>."},{"t":"Motion","s":"Acceleration","f":"⚠ Is a car turning at steady speed accelerating?","b":"<b>Yes</b> — a change in <b>speed, direction, or both</b> causes acceleration."},{"t":"Motion","s":"Three Equations of Motion","f":"When are the three equations valid?","b":"Only when <b>acceleration is constant (uniform)</b>."},{"t":"Motion","s":"Three Equations of Motion","f":"First equation of motion","b":"<b>v = u + at</b> — gives final velocity after time t."},{"t":"Motion","s":"Three Equations of Motion","f":"Second equation of motion","b":"<b>s = ut + ½at²</b> — gives distance covered in time t."},{"t":"Motion","s":"Three Equations of Motion","f":"Third equation of motion","b":"<b>v² = u² + 2as</b> — used when time is not given."},{"t":"Motion","s":"Three Equations of Motion","f":"What do the symbols mean?","b":"u = initial velocity, v = final velocity, a = acceleration, t = time, s = distance. Derived from the <b>velocity-time graph</b>."},{"t":"Motion","s":"Graphs of Motion","f":"Slope of a distance-time graph","b":"= <b>speed</b>."},{"t":"Motion","s":"Graphs of Motion","f":"Straight slanting vs flat distance-time line","b":"Slanting = <b>uniform speed</b>; flat = <b>the object is at rest</b>."},{"t":"Motion","s":"Graphs of Motion","f":"Accelerated object on a distance-time graph","b":"Gives an <b>upward-bending curve</b>."},{"t":"Motion","s":"Graphs of Motion","f":"Slope of a velocity-time graph","b":"= <b>acceleration</b>."},{"t":"Motion","s":"Graphs of Motion","f":"Area under a velocity-time graph","b":"= <b>distance travelled</b>."},{"t":"Motion","s":"Graphs of Motion","f":"Uniform vs zero acceleration on a v-t graph","b":"Uniform = straight slanting line; zero = <b>horizontal line</b>."},{"t":"Motion","s":"Force and Its Effects","f":"Define force","b":"A <b>push or a pull</b>."},{"t":"Motion","s":"Force and Its Effects","f":"What can a force do to motion?","b":"<b>Start, stop, speed up, slow down or change the direction</b> of motion — and also <b>change the shape</b> of an object."},{"t":"Motion","s":"Force and Its Effects","f":"Contact vs non-contact forces","b":"<b>Contact</b>: friction, muscular, tension, normal. <b>Non-contact</b>: gravitational, magnetic, electrostatic."},{"t":"Motion","s":"Force and Its Effects","f":"SI unit of force","b":"The <b>newton (N)</b>; 1 N = 1 kg·m/s². (Newton)"},{"t":"Motion","s":"Newton's Laws of Motion","f":"Define inertia","b":"The tendency of an object to <b>resist any change</b> in its state of rest or motion."},{"t":"Motion","s":"Newton's Laws of Motion","f":"Newton's First Law (Law of Inertia)","b":"A body stays at rest or in uniform motion <b>unless an external force acts</b>."},{"t":"Motion","s":"Newton's Laws of Motion","f":"Newton's Second Law","b":"<b>Force = mass × acceleration (F = ma)</b>; it also equals the <b>rate of change of momentum</b>."},{"t":"Motion","s":"Newton's Laws of Motion","f":"Newton's Third Law","b":"Every action has an <b>equal and opposite reaction</b>."},{"t":"Motion","s":"Newton's Laws of Motion","f":"Why does a passenger jerk backward when a bus starts?","b":"Due to <b>inertia of rest</b>."},{"t":"Motion","s":"Newton's Laws of Motion","f":"Two classic examples of the third law","b":"<b>Rocket propulsion</b> and <b>recoil of a gun</b>."},{"t":"Motion","s":"Momentum & Impulse","f":"Momentum: formula, type, unit","b":"<b>p = mass × velocity</b>; a vector, SI unit <b>kg·m/s</b>."},{"t":"Motion","s":"Momentum & Impulse","f":"Law of Conservation of Momentum","b":"Total momentum of an <b>isolated system stays constant</b>."},{"t":"Motion","s":"Momentum & Impulse","f":"Define impulse","b":"<b>Impulse = Force × time = change in momentum</b>."},{"t":"Motion","s":"Momentum & Impulse","f":"Why does a goalkeeper pull hands back?","b":"To <b>increase the time</b> of catching, reducing the force felt."},{"t":"Motion","s":"Momentum & Impulse","f":"Same idea explains…","b":"<b>Shock absorbers</b> and bending knees while landing."},{"t":"Motion","s":"Friction","f":"Define friction","b":"The force that <b>opposes relative motion</b> between surfaces in contact."},{"t":"Motion","s":"Friction","f":"Static vs kinetic friction","b":"<b>Static</b> acts before motion starts; <b>kinetic (sliding)</b> acts during motion."},{"t":"Motion","s":"Friction","f":"Pushing a box at constant velocity means…","b":"Friction <b>exactly equals</b> the applied force."},{"t":"Motion","s":"Friction","f":"Rolling vs sliding friction","b":"<b>Rolling friction is much smaller</b> than sliding friction."},{"t":"Motion","s":"Friction","f":"What do ball bearings do?","b":"Convert <b>sliding friction into rolling friction</b> to reduce it."},{"t":"Motion","s":"Friction","f":"Friction: useful or harmful?","b":"<b>Useful</b> (walking, brakes, grip) but also <b>harmful</b> (wear, heat, energy loss)."},{"t":"Motion","s":"Circular Motion & Centripetal Force","f":"Why is a body in circular motion always accelerating?","b":"Because its <b>direction changes constantly</b>."},{"t":"Motion","s":"Circular Motion & Centripetal Force","f":"Define centripetal force","b":"Acts <b>towards the centre</b> and keeps the body on its circular path."},{"t":"Motion","s":"Circular Motion & Centripetal Force","f":"Define centrifugal force","b":"The <b>apparent outward force</b> felt in a rotating frame — a pseudo-force."},{"t":"Motion","s":"Circular Motion & Centripetal Force","f":"Washing-machine dryer works on…","b":"This principle — water is <b>flung outward</b> through the drum holes."},{"t":"Motion","s":"Circular Motion & Centripetal Force","f":"Examples of circular motion","b":"A stone whirled on a string, a car turning, planets orbiting the Sun."},{"t":"Motion","s":"Scientists Who Studied Motion","f":"Galileo's contribution","b":"Defined/measured <b>speed</b> using inclined planes; showed <b>all objects fall at the same rate</b> regardless of mass."},{"t":"Motion","s":"Scientists Who Studied Motion","f":"Newton's contribution (1687)","b":"The <b>three laws of motion</b> and <b>universal gravitation</b>."},{"t":"Motion","s":"Scientists Who Studied Motion","f":"Einstein's contribution","b":"<b>Relativity</b>; <b>E = mc²</b>."},{"t":"Gravitation","s":"What is Gravitation? The Big Idea","f":"Define gravitation","b":"The <b>attractive pull</b> every object in the universe feels towards every other object."},{"t":"Gravitation","s":"What is Gravitation? The Big Idea","f":"Is gravitation ever repulsive?","b":"<b>No</b> — it is always attractive, never repulsive; one of the most basic forces in nature."},{"t":"Gravitation","s":"What is Gravitation? The Big Idea","f":"Gravitation vs gravity","b":"<b>Gravitation</b> acts between any two masses anywhere; <b>gravity</b> is the special pull of a large body (Earth) on objects near it."},{"t":"Gravitation","s":"What is Gravitation? The Big Idea","f":"What does one single gravitational force explain?","b":"A falling fruit, our weight, ocean tides, the Moon orbiting Earth, planets orbiting the Sun, and satellites."},{"t":"Gravitation","s":"History – How We Understood the Sky","f":"Ptolemy (around 150 AD)","b":"Gave the <b>geocentric model</b>, placing the Earth at the centre — later proved wrong."},{"t":"Gravitation","s":"History – How We Understood the Sky","f":"Nicolaus Copernicus (1543)","b":"Gave the correct <b>heliocentric model</b>, with the Sun at the centre."},{"t":"Gravitation","s":"History – How We Understood the Sky","f":"Tycho Brahe","b":"Recorded extremely accurate positions of planets over years, <b>all without a telescope</b>."},{"t":"Gravitation","s":"History – How We Understood the Sky","f":"Johannes Kepler","b":"Used Brahe's data to work out <b>three precise laws of planetary motion</b>."},{"t":"Gravitation","s":"Kepler's Three Laws of Planetary Motion","f":"Kepler's 1st Law (Law of Orbits)","b":"Every planet moves around the Sun in an <b>ellipse with the Sun at one focus</b>, not the centre."},{"t":"Gravitation","s":"Kepler's Three Laws of Planetary Motion","f":"Kepler's 2nd Law (Law of Areas)","b":"The line joining a planet to the Sun <b>sweeps out equal areas in equal times</b> — so a planet moves <b>faster when near the Sun</b>."},{"t":"Gravitation","s":"Kepler's Three Laws of Planetary Motion","f":"Kepler's 3rd Law (Law of Periods)","b":"The square of the orbital period ∝ the cube of the average distance — <b>T² ∝ r³</b>."},{"t":"Gravitation","s":"Kepler's Three Laws of Planetary Motion","f":"Who unified Kepler's laws?","b":"<b>Newton</b> later showed all three follow naturally from his law of gravitation."},{"t":"Gravitation","s":"Newton's Universal Law of Gravitation","f":"State the law","b":"Every object attracts every other with a force <b>directly proportional to the product of their masses</b>."},{"t":"Gravitation","s":"Newton's Universal Law of Gravitation","f":"The inverse-square part","b":"The force is <b>inversely proportional to the square of the distance</b> between their centres."},{"t":"Gravitation","s":"Newton's Universal Law of Gravitation","f":"Write it in symbols","b":"<b>F = G m₁m₂ / r²</b>, where r is measured centre to centre."},{"t":"Gravitation","s":"Newton's Universal Law of Gravitation","f":"Double a mass? Double the distance?","b":"Double a mass → force <b>doubles</b>; double the distance → force drops to <b>one-fourth</b>."},{"t":"Gravitation","s":"Newton's Universal Law of Gravitation","f":"For a sphere like Earth, where is r measured from?","b":"The whole mass acts as if <b>concentrated at the centre</b>, so r is measured from the centre."},{"t":"Gravitation","s":"The Gravitational Constant G","f":"What is G?","b":"The <b>universal gravitational constant</b> — the same value everywhere in the universe; it never changes."},{"t":"Gravitation","s":"The Gravitational Constant G","f":"Value of G","b":"<b>G = 6.67 × 10⁻¹¹ N·m²/kg²</b>, an extremely small number."},{"t":"Gravitation","s":"The Gravitational Constant G","f":"Why is everyday gravity negligible?","b":"Because G is so tiny — gravity is huge only between giant bodies like planets and stars."},{"t":"Gravitation","s":"The Gravitational Constant G","f":"Who first measured G, and how?","b":"<b>Henry Cavendish (1798)</b>, using a sensitive <b>torsion balance</b>."},{"t":"Gravitation","s":"The Gravitational Constant G","f":"⚠ Exam trap: G vs g","b":"<b>G</b> = universal constant, same everywhere; <b>g</b> = acceleration due to gravity, which <b>changes place to place</b>."},{"t":"Gravitation","s":"Acceleration Due to Gravity (g)","f":"Define g","b":"The acceleration an object gains as it <b>falls freely</b> towards the Earth, caused purely by gravity."},{"t":"Gravitation","s":"Acceleration Due to Gravity (g)","f":"Value of g near Earth's surface","b":"<b>g = 9.8 m/s²</b> (often rounded to 10 for quick sums)."},{"t":"Gravitation","s":"Acceleration Due to Gravity (g)","f":"Does g depend on the falling object's mass?","b":"<b>No</b> — the mass cancels out."},{"t":"Gravitation","s":"Acceleration Due to Gravity (g)","f":"Relate g to G","b":"<b>g = G M / R²</b>, where M and R are Earth's mass and radius. (Newton)"},{"t":"Gravitation","s":"Acceleration Due to Gravity (g)","f":"Galileo's discovery","b":"A heavy stone and a light stone dropped together in a vacuum <b>fall side by side and land together</b>."},{"t":"Gravitation","s":"How g Changes from Place to Place","f":"Effect of Earth's shape on g","b":"Earth is flattened at the poles, so g is <b>greatest at the poles and least at the equator</b>."},{"t":"Gravitation","s":"How g Changes from Place to Place","f":"Effect of altitude on g","b":"g <b>decreases</b> as you go up because r increases."},{"t":"Gravitation","s":"How g Changes from Place to Place","f":"Effect of depth on g","b":"g <b>decreases</b> below the surface and becomes <b>zero at the centre</b> of the Earth."},{"t":"Gravitation","s":"How g Changes from Place to Place","f":"Effect of Earth's rotation on g","b":"Earth's spin reduces effective g most at the <b>equator</b>; if Earth spun faster, weight at the equator would <b>decrease</b>."},{"t":"Gravitation","s":"How g Changes from Place to Place","f":"g on the Moon","b":"About <b>one-sixth</b> of Earth's, so objects weigh much less there."},{"t":"Gravitation","s":"Free Fall and Equations of Motion","f":"Define free fall","b":"Motion under <b>gravity alone</b>, with no other force such as air resistance acting."},{"t":"Gravitation","s":"Free Fall and Equations of Motion","f":"Acceleration during free fall","b":"Always <b>g, directed downward</b>, regardless of the object's mass."},{"t":"Gravitation","s":"Free Fall and Equations of Motion","f":"Feather, rubber ball, wooden ball in a true vacuum","b":"They <b>fall together and reach the ground at the same time</b>."},{"t":"Gravitation","s":"Free Fall and Equations of Motion","f":"Motion equations under gravity","b":"<b>v = u + gt</b>; <b>s = ut + ½gt²</b>; <b>v² = u² + 2gs</b>."},{"t":"Gravitation","s":"Free Fall and Equations of Motion","f":"⚠ Sign of g for an object thrown upward","b":"<b>Negative</b>, because it opposes the upward motion."},{"t":"Gravitation","s":"Mass and Weight","f":"Define mass","b":"The amount of <b>matter</b> in a body; constant everywhere, measured in <b>kilograms (kg)</b>."},{"t":"Gravitation","s":"Mass and Weight","f":"Define weight","b":"The force with which Earth attracts a body — <b>W = mg</b> — measured in <b>newtons (N)</b>."},{"t":"Gravitation","s":"Mass and Weight","f":"Why does weight change but mass not?","b":"Weight changes from place to place because <b>g changes</b>; mass never changes."},{"t":"Gravitation","s":"Mass and Weight","f":"Weight on the Moon","b":"About <b>one-sixth</b> of its Earth weight, since the Moon's g is one-sixth."},{"t":"Gravitation","s":"Mass and Weight","f":"Define weightlessness","b":"Occurs in <b>free fall or in orbit</b>, when there is no support force — even though gravity still acts."},{"t":"Gravitation","s":"Mass and Weight","f":"Mass and weight: scalar or vector?","b":"Mass is a <b>scalar</b>; weight is a <b>vector</b> directed towards the Earth's centre."},{"t":"Gravitation","s":"Thrust, Pressure and Buoyancy","f":"Thrust vs pressure","b":"<b>Thrust</b> is the force acting perpendicular to a surface; <b>pressure</b> is thrust per unit area (P = F/A)."},{"t":"Gravitation","s":"Thrust, Pressure and Buoyancy","f":"Why does a sharp knife cut easily?","b":"It exerts <b>high pressure</b> because the force acts over a <b>tiny area</b>."},{"t":"Gravitation","s":"Thrust, Pressure and Buoyancy","f":"Define buoyancy (upthrust)","b":"The <b>upward force</b> a fluid exerts on an object placed in it — why things feel lighter in water."},{"t":"Gravitation","s":"Thrust, Pressure and Buoyancy","f":"When does an object float or sink?","b":"Floats if its density is <b>less than</b> the fluid's; sinks if greater."},{"t":"Gravitation","s":"Thrust, Pressure and Buoyancy","f":"SI unit of pressure","b":"The <b>pascal (Pa)</b>, equal to one newton per square metre. (Newton & Pascal)"},{"t":"Gravitation","s":"Archimedes' Principle and Density","f":"State Archimedes' principle","b":"A body immersed in a fluid experiences an <b>upward force equal to the weight of fluid it displaces</b>."},{"t":"Gravitation","s":"Archimedes' Principle and Density","f":"What does it explain?","b":"<b>Floating, swimming, and the working of ships and submarines</b>."},{"t":"Gravitation","s":"Archimedes' Principle and Density","f":"Define density","b":"<b>Mass per unit volume</b> (density = mass / volume), measured in <b>kg/m³</b>."},{"t":"Gravitation","s":"Archimedes' Principle and Density","f":"Define relative density","b":"The density of a substance compared to that of <b>water</b> — it has <b>no unit</b>."},{"t":"Gravitation","s":"Archimedes' Principle and Density","f":"Relative density < 1 or > 1?","b":"<b>Less than 1</b> → the object floats; <b>more than 1</b> → it sinks."},{"t":"Gravitation","s":"Archimedes' Principle and Density","f":"Why does an iron ship float?","b":"Its overall shape <b>displaces enough water</b> to balance its weight."},{"t":"Energy","s":"What is Work (Everyday vs Science)","f":"When is work done in science?","b":"Only when a <b>force moves a body in the direction of the force</b>."},{"t":"Energy","s":"What is Work (Everyday vs Science)","f":"⚠ Pushing a wall that does not move","b":"<b>No displacement means no work</b> — zero work is done."},{"t":"Energy","s":"What is Work (Everyday vs Science)","f":"Is reading or holding a heavy bag 'work'?","b":"It is effort but <b>scientifically zero work</b>."},{"t":"Energy","s":"What is Work (Everyday vs Science)","f":"Work: scalar or vector?","b":"A <b>scalar</b> — it has size but no direction."},{"t":"Energy","s":"What is Work (Everyday vs Science)","f":"SI unit of work","b":"The <b>joule (J)</b>, where 1 J = 1 N·m."},{"t":"Energy","s":"What is Work (Everyday vs Science)","f":"Define 1 joule","b":"Work done when <b>1 N moves a body 1 m</b> in its own direction. (Joule)"},{"t":"Energy","s":"Formula and Units of Work","f":"Work when force and motion are aligned","b":"<b>W = F × s</b> (force times displacement)."},{"t":"Energy","s":"Formula and Units of Work","f":"Work when force is at angle θ","b":"<b>W = F × s × cos θ</b> — only the component along motion counts."},{"t":"Energy","s":"Formula and Units of Work","f":"Dimensional formula of work","b":"<b>[ML²T⁻²]</b>."},{"t":"Energy","s":"Positive, Zero and Negative Work","f":"When is work positive?","b":"Force helps motion (θ < 90°, cos θ positive) — <b>gives energy</b> to the body."},{"t":"Energy","s":"Positive, Zero and Negative Work","f":"When is work negative?","b":"Force opposes motion (θ > 90°), like friction or gravity on a rising body — <b>takes energy away</b>."},{"t":"Energy","s":"Positive, Zero and Negative Work","f":"When is work zero?","b":"Force is <b>perpendicular</b> to motion (θ = 90°, cos 90° = 0)."},{"t":"Energy","s":"Positive, Zero and Negative Work","f":"⚠ Carrying a load horizontally does how much work?","b":"<b>Zero work</b> — force is perpendicular to displacement. Same for circular motion."},{"t":"Energy","s":"Energy – Capacity to Do Work","f":"Define energy","b":"The <b>ability of a body to do work</b> — to push, pull, lift or move something."},{"t":"Energy","s":"Energy – Capacity to Do Work","f":"Unit and type of energy","b":"Same unit as work — the <b>joule (J)</b>; it is a <b>scalar</b>."},{"t":"Energy","s":"Energy – Capacity to Do Work","f":"Dimensions of energy; 1 kJ = ?","b":"<b>[ML²T⁻²]</b>; <b>1 kJ = 1000 J</b>."},{"t":"Energy","s":"Energy – Capacity to Do Work","f":"1 calorie in joules","b":"<b>1 calorie ≈ 4.18 J</b>."},{"t":"Energy","s":"Different Forms of Energy","f":"Define mechanical energy","b":"<b>Kinetic + potential energy</b>."},{"t":"Energy","s":"Different Forms of Energy","f":"Where is chemical energy stored?","b":"In <b>food, fuels and batteries</b>."},{"t":"Energy","s":"Different Forms of Energy","f":"Where is nuclear energy locked?","b":"Inside the <b>nucleus of atoms</b>."},{"t":"Energy","s":"Different Forms of Energy","f":"Can energy change form?","b":"Yes — it <b>changes continually from one form to another</b>, but all forms can be expressed in joules."},{"t":"Energy","s":"Kinetic Energy (Energy of Motion)","f":"Define kinetic energy","b":"The energy a body has <b>because it is moving</b>."},{"t":"Energy","s":"Kinetic Energy (Energy of Motion)","f":"Formula for KE","b":"<b>KE = ½ m v²</b>, with mass m in kg and speed v in m/s."},{"t":"Energy","s":"Kinetic Energy (Energy of Motion)","f":"⚠ Double the speed — what happens to KE?","b":"KE becomes <b>four times</b>, since KE depends on the <b>square of the speed</b>."},{"t":"Energy","s":"Kinetic Energy (Energy of Motion)","f":"Can KE be negative?","b":"<b>No</b> — always positive, since v² can never be negative."},{"t":"Energy","s":"Kinetic Energy (Energy of Motion)","f":"Everyday examples of KE","b":"A moving hammer driving a nail; wind turning a windmill."},{"t":"Energy","s":"Work–Energy Theorem","f":"State the work–energy theorem","b":"The <b>net work</b> done on a body equals its <b>change in kinetic energy</b>."},{"t":"Energy","s":"Work–Energy Theorem","f":"Write it as a formula","b":"<b>W = ΔKE = KE_final − KE_initial</b>."},{"t":"Energy","s":"Work–Energy Theorem","f":"Positive vs negative net work","b":"Positive net work <b>speeds a body up</b>; negative net work (friction) <b>slows it down</b>."},{"t":"Energy","s":"Work–Energy Theorem","f":"Why is a fast car harder to stop?","b":"A body of mass m at speed v can do work equal to <b>½ m v²</b> before stopping."},{"t":"Energy","s":"Potential Energy (Stored Energy)","f":"Define potential energy","b":"Energy stored due to a body's <b>position or shape (configuration)</b>."},{"t":"Energy","s":"Potential Energy (Stored Energy)","f":"Formula for gravitational PE","b":"<b>PE = m × g × h</b>, stored when a body is lifted to height h."},{"t":"Energy","s":"Potential Energy (Stored Energy)","f":"Where is elastic PE stored?","b":"In a <b>stretched spring, bent bow, catapult or wound clock-spring</b>."},{"t":"Energy","s":"Potential Energy (Stored Energy)","f":"How do earthquakes relate to PE?","b":"Rock layers at fault lines store PE like compressed springs and release it as <b>earthquakes</b>."},{"t":"Energy","s":"Kinetic vs Potential Energy","f":"Kinetic needs… potential needs…","b":"Kinetic energy needs <b>motion</b>; potential energy needs <b>position or shape</b>."},{"t":"Energy","s":"Kinetic vs Potential Energy","f":"A falling stone converts…","b":"Its <b>potential energy into kinetic energy</b>."},{"t":"Energy","s":"Kinetic vs Potential Energy","f":"Do KE and PE share units?","b":"Yes — both use the <b>joule</b> and the same dimensions <b>[ML²T⁻²]</b>. (Joule)"},{"t":"Energy","s":"Mechanical Energy & Conservation of Energy","f":"Define mechanical energy","b":"<b>KE + PE</b> — total energy from motion and position."},{"t":"Energy","s":"Mechanical Energy & Conservation of Energy","f":"State the Law of Conservation of Energy","b":"Energy can <b>change form but is never created or destroyed</b>."},{"t":"Energy","s":"Mechanical Energy & Conservation of Energy","f":"Total energy of an isolated system","b":"Stays <b>constant</b> when all forms are counted."},{"t":"Energy","s":"Mechanical Energy & Conservation of Energy","f":"Conservation of mechanical energy","b":"If only gravity acts, <b>KE + PE stays constant</b> — as PE falls, KE rises by exactly the same amount."},{"t":"Energy","s":"Energy Conservation in Free Fall","f":"What happens to PE of a freely falling body?","b":"It <b>continuously decreases</b> as the body loses height."},{"t":"Energy","s":"Energy Conservation in Free Fall","f":"Where does the lost PE go?","b":"It is converted into <b>kinetic energy</b>, so the body speeds up as it falls."},{"t":"Energy","s":"Energy Conservation in Free Fall","f":"At the top vs just before hitting ground","b":"Top: <b>maximum PE, zero KE</b>. Just before landing: <b>maximum KE, minimum PE</b>."},{"t":"Energy","s":"Power – Rate of Doing Work","f":"Define power","b":"The <b>rate of doing work</b> (or rate of energy transfer)."},{"t":"Energy","s":"Power – Rate of Doing Work","f":"Formula for power","b":"<b>Power = Work ÷ Time (P = W / t)</b>."},{"t":"Energy","s":"Power – Rate of Doing Work","f":"SI unit of power","b":"The <b>watt (W)</b>, where 1 W = 1 J/s."},{"t":"Energy","s":"Power – Rate of Doing Work","f":"Larger units of power","b":"<b>1 kilowatt (kW) = 1000 W</b>; <b>1 horsepower (hp) ≈ 746 W</b>."},{"t":"Energy","s":"Power – Rate of Doing Work","f":"Power: scalar or vector? Dimensions?","b":"A <b>scalar</b>, with dimensions <b>[ML²T⁻³]</b>."},{"t":"Energy","s":"Energy Conversions & Friction","f":"A windmill converts…","b":"<b>Kinetic energy of wind</b> into electrical energy."},{"t":"Energy","s":"Energy Conversions & Friction","f":"A battery converts…","b":"<b>Chemical energy</b> into electrical energy."},{"t":"Energy","s":"Energy Conversions & Friction","f":"A bulb converts…","b":"<b>Electrical energy</b> into <b>light and heat</b>."},{"t":"Energy","s":"Energy Conversions & Friction","f":"Rubbing hands or brakes shows…","b":"<b>Kinetic energy converting into heat via friction</b>."},{"t":"Energy","s":"Energy Conversions & Friction","f":"Friction always does what kind of work?","b":"<b>Negative work</b>, opposing motion and producing heat (lost energy)."},{"t":"Fluids","s":"What is a Fluid?","f":"Define a fluid","b":"Any substance that can <b>flow and take the shape of its container</b>."},{"t":"Fluids","s":"What is a Fluid?","f":"Which states are fluids?","b":"Both <b>liquids and gases</b>; a solid is not, as it keeps a fixed shape."},{"t":"Fluids","s":"What is a Fluid?","f":"Solid, liquid, gas — shape and volume","b":"Solid: fixed shape + fixed volume. Liquid: fixed volume, no fixed shape. Gas: <b>neither</b>."},{"t":"Fluids","s":"What is a Fluid?","f":"Fluid statics vs fluid dynamics","b":"<b>Statics</b> studies fluids at rest; <b>dynamics</b> studies fluids in motion."},{"t":"Fluids","s":"Density and Relative Density","f":"Define density and its SI unit","b":"<b>ρ = mass ÷ volume</b>; SI unit <b>kg m⁻³</b>. It shows how tightly matter is packed."},{"t":"Fluids","s":"Density and Relative Density","f":"Density of water at 4°C","b":"<b>1.0 × 10³ kg m⁻³</b> (1 g cm⁻³); water is <b>densest at 4°C</b>."},{"t":"Fluids","s":"Density and Relative Density","f":"Define relative density","b":"Density of substance ÷ density of <b>water at 4°C</b> — a <b>pure number with no unit</b>."},{"t":"Fluids","s":"Density and Relative Density","f":"Relative density > 1 vs < 1","b":"<b>> 1</b> → the body sinks; <b>< 1</b> → it floats (ice, cork, oil)."},{"t":"Fluids","s":"Pressure in Fluids","f":"Define pressure in a fluid","b":"Force acting <b>perpendicular (normal)</b> to a surface ÷ area; <b>P = F ÷ A</b>."},{"t":"Fluids","s":"Pressure in Fluids","f":"Why does a sharp pin pierce easily?","b":"A <b>small area concentrates force</b>, so a blunt rod does not."},{"t":"Fluids","s":"Pressure in Fluids","f":"Dimensional formula of pressure","b":"<b>[M L⁻¹ T⁻²]</b>; named after <b>Blaise Pascal</b>."},{"t":"Fluids","s":"Pressure in Fluids","f":"Direction of fluid pressure at rest","b":"Always pushes <b>perpendicular (normal)</b> to any surface it touches."},{"t":"Fluids","s":"Pressure in Fluids","f":"How does pressure change with depth?","b":"It <b>increases with depth</b>; the difference over height h is <b>P₂ − P₁ = ρgh</b>."},{"t":"Fluids","s":"Pressure in Fluids","f":"Pressure at the same horizontal level","b":"<b>Equal everywhere</b> in a still liquid. Pressure is a <b>scalar</b>; 1 Pa = 1 N m⁻²."},{"t":"Fluids","s":"Pascal's Law","f":"State Pascal's Law","b":"Pressure on an enclosed fluid is transmitted <b>undiminished, equally, in all directions</b>."},{"t":"Fluids","s":"Pascal's Law","f":"Why does Pascal's law work?","b":"Because <b>liquids are nearly incompressible</b>, so the push reaches every point."},{"t":"Fluids","s":"Pascal's Law","f":"What does it power?","b":"The <b>hydraulic system</b>, which acts as a <b>force multiplier</b>."},{"t":"Fluids","s":"Pascal's Law","f":"Why does a larger piston give more force?","b":"Since force = pressure × area, a <b>larger piston</b> gives a much larger output force — a small push lifts a heavy car."},{"t":"Fluids","s":"Pascal's Law","f":"Devices using Pascal's law","b":"<b>Hydraulic lift, hydraulic press, hydraulic brakes</b> and the dentist's chair."},{"t":"Fluids","s":"Atmospheric Pressure and the Barometer","f":"Define atmospheric pressure","b":"The <b>weight of the air column</b> above a unit area."},{"t":"Fluids","s":"Atmospheric Pressure and the Barometer","f":"Why are we not crushed by it?","b":"The pressure <b>pushes equally from all sides</b>."},{"t":"Fluids","s":"Atmospheric Pressure and the Barometer","f":"Value of 1 atm at sea level","b":"<b>1 atm = 1.013 × 10⁵ Pa</b>."},{"t":"Fluids","s":"Atmospheric Pressure and the Barometer","f":"Why do climbers carry oxygen?","b":"Atmospheric pressure <b>falls with altitude</b>."},{"t":"Fluids","s":"Atmospheric Pressure and the Barometer","f":"Who first measured atmospheric pressure?","b":"<b>Evangelista Torricelli</b>, using the <b>mercury barometer</b>."},{"t":"Fluids","s":"Atmospheric Pressure and the Barometer","f":"Height of the mercury column at sea level","b":"About <b>76 cm (760 mm)</b>; the empty space above is the <b>Torricellian vacuum</b>."},{"t":"Fluids","s":"Buoyancy and Archimedes' Principle","f":"Define buoyancy (upthrust)","b":"The <b>upward force</b> a fluid exerts on a body in it — why an object feels lighter in water."},{"t":"Fluids","s":"Buoyancy and Archimedes' Principle","f":"When does a body float or sink?","b":"If buoyancy ≥ weight it <b>floats</b>; if weight > buoyancy it <b>sinks</b>."},{"t":"Fluids","s":"Buoyancy and Archimedes' Principle","f":"State the law of floatation","b":"A floating body displaces fluid equal to <b>its own weight</b>."},{"t":"Fluids","s":"Buoyancy and Archimedes' Principle","f":"How can relative density be found?","b":"From the <b>loss of weight</b> of a body in water."},{"t":"Fluids","s":"Buoyancy and Archimedes' Principle","f":"State Archimedes' Principle","b":"<b>Upthrust = weight of the fluid displaced</b> by the body."},{"t":"Fluids","s":"Floating Ice and Melting (Key Exam Cases)","f":"⚠ Ice melts in a brim-full beaker — what happens?","b":"The <b>water level stays the same</b> (no overflow)."},{"t":"Fluids","s":"Floating Ice and Melting (Key Exam Cases)","f":"Why does the level not change?","b":"The melted water <b>exactly fills the volume that was displaced</b>."},{"t":"Fluids","s":"Floating Ice and Melting (Key Exam Cases)","f":"⚠ Does ice expand or contract on melting?","b":"It <b>contracts</b> (volume decreases) because water is denser than ice."},{"t":"Fluids","s":"Floating Ice and Melting (Key Exam Cases)","f":"Why does ice float?","b":"Its <b>density (≈917 kg m⁻³) is less than water</b>."},{"t":"Fluids","s":"Floating Ice and Melting (Key Exam Cases)","f":"⚠ Floating ice holding a stone — level after melting?","b":"The level <b>falls</b> after melting."},{"t":"Fluids","s":"Anomalous Expansion of Water","f":"What is anomalous expansion of water?","b":"Water shows <b>unusual expansion between 0°C and 4°C</b>."},{"t":"Fluids","s":"Anomalous Expansion of Water","f":"Heating water from 0°C to 4°C does what?","b":"Water <b>contracts</b> instead of expanding; above 4°C it expands normally."},{"t":"Fluids","s":"Anomalous Expansion of Water","f":"Where is water densest?","b":"At <b>4°C</b> — maximum density and minimum volume."},{"t":"Fluids","s":"Anomalous Expansion of Water","f":"How does this let aquatic life survive?","b":"<b>Ice forms on top</b> while water below stays liquid; the warmest, densest water at <b>4°C settles at the bottom</b> of frozen lakes."},{"t":"Fluids","s":"Viscosity","f":"Define viscosity","b":"A fluid's <b>internal friction resisting flow</b> between its layers."},{"t":"Fluids","s":"Viscosity","f":"Which fluids have high vs low viscosity?","b":"<b>Honey, glycerine, tar</b> have high viscosity; <b>water and air</b> have low."},{"t":"Fluids","s":"Viscosity","f":"SI unit of coefficient of viscosity","b":"<b>Pa·s</b> (or <b>poise</b> in CGS)."},{"t":"Fluids","s":"Viscosity","f":"⚠ Viscosity of liquids vs gases with temperature","b":"Liquids: viscosity <b>decreases</b> as temperature rises. Gases: viscosity <b>increases</b>."},{"t":"Fluids","s":"Viscosity","f":"What does viscosity cause?","b":"<b>Drag</b> on a body moving through a fluid, like a stone falling in oil."},{"t":"Fluids","s":"Surface Tension and Capillarity","f":"Define surface tension","b":"Makes a liquid surface behave like a <b>stretched elastic film</b>."},{"t":"Fluids","s":"Surface Tension and Capillarity","f":"What causes surface tension?","b":"The <b>cohesive force</b> between molecules pulling inward."},{"t":"Fluids","s":"Surface Tension and Capillarity","f":"Two effects of surface tension","b":"Makes small drops <b>spherical</b>; lets insects walk on water."},{"t":"Fluids","s":"Surface Tension and Capillarity","f":"Define capillarity","b":"The <b>rise or fall</b> of a liquid in a thin tube."},{"t":"Fluids","s":"Surface Tension and Capillarity","f":"⚠ Water rises but mercury falls — why?","b":"Water rises in glass (<b>adhesion</b>); mercury falls (<b>cohesion dominates</b>)."},{"t":"Fluids","s":"Surface Tension and Capillarity","f":"What decreases surface tension?","b":"<b>Rising temperature</b> and <b>soap or detergent</b>."},{"t":"Fluids","s":"Fluids in Motion (Streamline, Bernoulli)","f":"Streamline vs turbulent flow","b":"<b>Streamline (laminar)</b> is smooth, orderly flow along fixed paths; <b>turbulent</b> is irregular and disordered, with eddies and swirls."},{"t":"Fluids","s":"Fluids in Motion (Streamline, Bernoulli)","f":"State the equation of continuity","b":"A fluid <b>speeds up where the pipe narrows</b> (Av = constant)."},{"t":"Fluids","s":"Fluids in Motion (Streamline, Bernoulli)","f":"State Bernoulli's principle","b":"Where fluid <b>speed is higher, its pressure is lower</b>."},{"t":"Fluids","s":"Fluids in Motion (Streamline, Bernoulli)","f":"How does Bernoulli explain aeroplane lift?","b":"<b>Faster air over the wing</b> gives lower pressure above."},{"t":"Fluids","s":"Fluids in Motion (Streamline, Bernoulli)","f":"What else does Bernoulli explain?","b":"The <b>spin of a ball (Magnus effect)</b> and the action of a sprayer."},{"t":"Fluids","s":"Wind, Salinity and Triple Point (PYQ Facts)","f":"Wind speed vs wind direction instruments","b":"Speed → <b>anemometer</b>; direction → <b>wind vane</b>."},{"t":"Fluids","s":"Wind, Salinity and Triple Point (PYQ Facts)","f":"What is a halocline?","b":"A water <b>salinity gradient</b> — varying salt concentration with depth."},{"t":"Fluids","s":"Wind, Salinity and Triple Point (PYQ Facts)","f":"Define the triple point","b":"Where <b>solid, liquid and gas</b> of a substance coexist together."},{"t":"Fluids","s":"Wind, Salinity and Triple Point (PYQ Facts)","f":"Triple point of water","b":"<b>273.16 K (0.01°C)</b> and low pressure."},{"t":"Fluids","s":"Wind, Salinity and Triple Point (PYQ Facts)","f":"⚠ Which quantities have no unit?","b":"<b>Relative density and strain</b>."},{"t":"Fluids","s":"Wind, Salinity and Triple Point (PYQ Facts)","f":"Atmospheric pressure is read from…","b":"The <b>height of the liquid column</b> in a barometer."},{"t":"Thermo","s":"Heat vs Temperature","f":"Define heat","b":"A form of <b>energy that flows</b> from a hotter body to a colder body due to a temperature difference."},{"t":"Thermo","s":"Heat vs Temperature","f":"Define temperature","b":"Measures the <b>average kinetic (jiggling) energy</b> of particles, not the total energy stored."},{"t":"Thermo","s":"Heat vs Temperature","f":"Heat vs temperature in one line","b":"Heat is the <b>total</b> thermal energy; temperature is only the <b>average per particle</b>."},{"t":"Thermo","s":"Heat vs Temperature","f":"⚠ Classic trap: matchstick vs bucket of warm water","b":"A burning matchstick has <b>high temperature but little total heat</b>; warm water has lower temperature but <b>more heat</b>."},{"t":"Thermo","s":"Heat vs Temperature","f":"Direction of heat flow","b":"Always from <b>high to low temperature</b> until both reach the same value."},{"t":"Thermo","s":"Heat vs Temperature","f":"Define thermal equilibrium","b":"When <b>no net heat flows</b> between two bodies."},{"t":"Thermo","s":"Units of Heat","f":"SI unit of heat","b":"The <b>joule (J)</b>."},{"t":"Thermo","s":"Units of Heat","f":"Define the calorie","b":"Heat to raise 1 g of water from <b>14.5°C to 15.5°C</b>."},{"t":"Thermo","s":"Units of Heat","f":"1 calorie in joules","b":"<b>1 calorie = 4.186 joules</b>, the mechanical equivalent of heat."},{"t":"Thermo","s":"Units of Heat","f":"1 kilocalorie equals…","b":"<b>1000 cal</b>; food energy is often given in kcal."},{"t":"Thermo","s":"Units of Heat","f":"Who measured the mechanical equivalent of heat?","b":"<b>James Prescott Joule</b>, proving heat is energy."},{"t":"Thermo","s":"Laws of Thermodynamics","f":"What does thermodynamics study?","b":"<b>Heat, work, temperature and energy conversions</b>."},{"t":"Thermo","s":"Laws of Thermodynamics","f":"State the Zeroth Law","b":"If A is in equilibrium with C, and B with C, then <b>A and B are in equilibrium</b> — this defines temperature and makes thermometers work."},{"t":"Thermo","s":"Laws of Thermodynamics","f":"State the First Law","b":"Energy is conserved; heat supplied either raises internal energy or does work — <b>Q = ΔU + W</b>."},{"t":"Thermo","s":"Laws of Thermodynamics","f":"Define internal energy","b":"The <b>total kinetic + potential energy</b> of all particles inside a body."},{"t":"Thermo","s":"Laws of Thermodynamics","f":"State the Second Law","b":"Heat <b>cannot flow on its own from a colder to a hotter body</b>; external work is needed."},{"t":"Thermo","s":"Laws of Thermodynamics","f":"⚠ Why does a refrigerator need electricity?","b":"It moves heat from the <b>cold inside to the warm room</b> — against the Second Law's natural direction."},{"t":"Thermo","s":"Thermometers & Temperature Scales","f":"What does a thermometer use?","b":"<b>Mercury (or alcohol)</b> that expands on heating."},{"t":"Thermo","s":"Thermometers & Temperature Scales","f":"Clinical vs laboratory thermometer range","b":"Clinical: narrow <b>35–42°C</b>. Laboratory: about <b>−10°C to 110°C</b>."},{"t":"Thermo","s":"Thermometers & Temperature Scales","f":"Normal human body temperature","b":"About <b>37°C (98.6°F)</b>."},{"t":"Thermo","s":"Thermometers & Temperature Scales","f":"What does a pyrometer measure?","b":"Very <b>high temperatures</b> (furnaces, molten metal) <b>without contact</b>."},{"t":"Thermo","s":"Thermometers & Temperature Scales","f":"Define absolute zero","b":"<b>0 K = −273.15°C</b> — the lowest possible temperature, where particle motion is minimum."},{"t":"Thermo","s":"Converting Between Scales","f":"Celsius to Fahrenheit","b":"<b>°F = (°C × 9/5) + 32</b>."},{"t":"Thermo","s":"Converting Between Scales","f":"Fahrenheit to Celsius","b":"<b>°C = (°F − 32) × 5/9</b>."},{"t":"Thermo","s":"Converting Between Scales","f":"Celsius to Kelvin","b":"<b>K = °C + 273.15</b> (rounded to +273 in exams)."},{"t":"Thermo","s":"Converting Between Scales","f":"Is a Celsius degree the same size as a Kelvin?","b":"<b>Yes</b> — only the starting point shifts."},{"t":"Thermo","s":"Converting Between Scales","f":"Worked example: 50°C in °F","b":"<b>(50 × 9/5) + 32 = 122°F</b>."},{"t":"Thermo","s":"Converting Between Scales","f":"⚠ Special fact: where do both scales read alike?","b":"<b>−40°C = −40°F</b> — the only such point."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"Define specific heat capacity","b":"Heat needed to raise <b>1 kg</b> of a substance by <b>1°C (or 1 K)</b>; SI unit <b>J kg⁻¹ K⁻¹</b>."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"Formula for heat required","b":"<b>Q = m × c × ΔT</b> (mass × specific heat × temperature change)."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"Specific heat of water and its effect","b":"<b>4186 J kg⁻¹ K⁻¹</b> — unusually high, so water heats and cools slowly."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"Two consequences of water's high specific heat","b":"Makes <b>coastal climates mild</b>; water is a good <b>coolant in radiators</b>."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"⚠ Why does a metal spoon heat faster than water?","b":"Metals have <b>low specific heat</b>."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"⚠ For gases, why is Cp > Cv?","b":"At constant pressure the gas <b>also does work in expanding</b>."},{"t":"Thermo","s":"Specific Heat Capacity & Calorimetry","f":"State the calorimetry principle","b":"<b>Heat lost by hot body = heat gained by cold body</b>; measured in a calorimeter."},{"t":"Thermo","s":"Change of State & Latent Heat","f":"Define a change of state","b":"Matter switching between <b>solid, liquid and gas</b> — melting, freezing, boiling, condensation."},{"t":"Thermo","s":"Change of State & Latent Heat","f":"⚠ Does temperature rise while melting or boiling?","b":"<b>No</b> — added heat <b>changes the state</b>, not the temperature."},{"t":"Thermo","s":"Change of State & Latent Heat","f":"Melting point vs boiling point","b":"Melting: solid → liquid (<b>ice melts at 0°C</b>). Boiling: liquid → gas (<b>water boils at 100°C</b>)."},{"t":"Thermo","s":"Change of State & Latent Heat","f":"Define latent heat","b":"The <b>hidden heat</b> absorbed or released during a change of state at <b>constant temperature</b>."},{"t":"Thermo","s":"Change of State & Latent Heat","f":"Latent heat of fusion vs vaporisation","b":"Fusion (ice→water) ≈ <b>336 kJ/kg</b>; vaporisation (water→steam) ≈ <b>2260 kJ/kg</b>."},{"t":"Thermo","s":"Change of State & Latent Heat","f":"⚠ Why does steam at 100°C burn worse than water at 100°C?","b":"Steam releases extra <b>latent heat of vaporisation</b> on the skin."},{"t":"Thermo","s":"Evaporation & Cooling","f":"Define evaporation","b":"The <b>slow change of a liquid to vapour from its surface</b>, at any temperature."},{"t":"Thermo","s":"Evaporation & Cooling","f":"Why does evaporation cause cooling?","b":"It <b>absorbs heat from the surroundings</b>."},{"t":"Thermo","s":"Evaporation & Cooling","f":"Why does sweating cool the body?","b":"Evaporating sweat takes <b>latent heat from the skin</b>."},{"t":"Thermo","s":"Evaporation & Cooling","f":"Why does water stay cold in an earthen pot?","b":"Water seeping through pores <b>evaporates and cools the rest</b>."},{"t":"Thermo","s":"Evaporation & Cooling","f":"⚠ How does a fan give comfort?","b":"By <b>speeding up evaporation of sweat</b> — not by lowering air temperature."},{"t":"Thermo","s":"Evaporation & Cooling","f":"What increases evaporation?","b":"Higher <b>temperature, surface area, wind</b> and <b>lower humidity</b>."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"Name the three modes of heat transfer","b":"<b>Conduction, convection and radiation</b>."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"Define conduction","b":"Heat flows <b>through a solid without the solid moving</b> (metal spoon getting hot)."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"Define convection","b":"Heat carried by the <b>actual movement of heated fluid</b> (boiling water, sea breeze)."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"Define radiation","b":"Needs <b>no medium</b> and travels through <b>vacuum</b> (heat from the Sun reaches Earth)."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"Good vs poor conductors of heat","b":"<b>Metals</b> are good conductors; <b>wood, plastic, air and water</b> are poor conductors (insulators)."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"⚠ Poorest conductors among common materials","b":"<b>Air/gases</b>."},{"t":"Thermo","s":"Modes of Heat Transfer","f":"Define albedo","b":"The <b>fraction of solar radiation a surface reflects</b>; bright/white surfaces have high albedo."},{"t":"Thermo","s":"Thermal Expansion & Applications","f":"What is thermal expansion?","b":"Most substances <b>expand on heating and contract on cooling</b>."},{"t":"Thermo","s":"Thermal Expansion & Applications","f":"Which state expands most?","b":"<b>Gases</b> expand the most, solids the least; solids show linear, area and volume expansion."},{"t":"Thermo","s":"Thermal Expansion & Applications","f":"⚠ Why do pendulum clocks run slow in summer?","b":"The rod <b>expands</b>, lengthening the pendulum and its time period."},{"t":"Thermo","s":"Thermal Expansion & Applications","f":"Why are gaps left in railway tracks and bridges?","b":"To allow for <b>summer expansion</b>."},{"t":"Thermo","s":"Thermal Expansion & Applications","f":"Why does a bimetallic strip bend on heating?","b":"Two metals <b>expand by different amounts</b>."},{"t":"Thermo","s":"Thermal Expansion & Applications","f":"Where are bimetallic strips used?","b":"<b>Fire alarms and thermostats</b>, to make or break a circuit."},{"t":"Thermo","s":"Boiling, Pressure & Pressure Cooker","f":"How does pressure affect boiling point?","b":"Boiling point <b>rises with pressure</b> and falls with reduced pressure."},{"t":"Thermo","s":"Boiling, Pressure & Pressure Cooker","f":"⚠ Why does cooking take longer at high altitudes?","b":"Lower air pressure <b>lowers the boiling point</b>."},{"t":"Thermo","s":"Boiling, Pressure & Pressure Cooker","f":"How does a pressure cooker work?","b":"It traps steam, <b>raising pressure and the boiling point above 100°C</b> (to nearly 120°C), so food cooks faster and saves fuel."},{"t":"Thermo","s":"Boiling, Pressure & Pressure Cooker","f":"Why do ponds freeze top-down?","b":"Because of the <b>anomalous expansion of water</b> — ice floats, letting fish survive below."},{"t":"Thermo","s":"Insulation, Thermos Flask & Heat Engines","f":"How does a thermos (vacuum) flask work?","b":"It keeps liquids hot or cold by <b>stopping all three modes of heat transfer</b>."},{"t":"Thermo","s":"Insulation, Thermos Flask & Heat Engines","f":"Which part blocks which mode?","b":"<b>Double walls with vacuum</b> block conduction and convection; <b>silvered surfaces</b> block radiation; the cork stopper reduces loss at the top."},{"t":"Thermo","s":"Insulation, Thermos Flask & Heat Engines","f":"Define a heat engine","b":"Converts <b>heat energy into mechanical (useful) work</b>."},{"t":"Thermo","s":"Insulation, Thermos Flask & Heat Engines","f":"What are internal combustion engines?","b":"Engines that <b>burn fuel inside the cylinder</b> (petrol and diesel engines)."},{"t":"Thermo","s":"Insulation, Thermos Flask & Heat Engines","f":"⚠ Which engine uses a carburetor?","b":"The <b>petrol engine</b> — it mixes air and petrol. <b>Not</b> the diesel engine."},{"t":"Thermo","s":"Insulation, Thermos Flask & Heat Engines","f":"Define relative humidity","b":"The water vapour in air compared to the maximum it can hold; it <b>decreases as air temperature rises</b>."},{"t":"Waves","s":"What is a Wave?","f":"Define a wave","b":"A <b>disturbance that travels and carries energy, not matter</b>, from place to place."},{"t":"Waves","s":"What is a Wave?","f":"Define the medium","b":"The material a wave passes through (air, water, steel)."},{"t":"Waves","s":"What is a Wave?","f":"⚠ Do particles of the medium travel with the wave?","b":"<b>No</b> — they only <b>vibrate about their rest position</b>."},{"t":"Waves","s":"What is a Wave?","f":"Mechanical vs electromagnetic wave","b":"<b>Mechanical</b> needs a medium and cannot cross a vacuum (sound); <b>EM</b> needs no medium and travels through vacuum (light)."},{"t":"Waves","s":"What is a Wave?","f":"Why can we see the Sun but not hear it?","b":"Light is an EM wave (no medium needed); sound is mechanical and <b>cannot cross the vacuum of space</b>."},{"t":"Waves","s":"What is a Wave?","f":"What is an oscillation?","b":"The <b>to-and-fro motion</b> of a particle — also called vibration."},{"t":"Waves","s":"Transverse vs Longitudinal Waves","f":"Define a transverse wave","b":"Particles vibrate <b>perpendicular (90°)</b> to the wave's direction."},{"t":"Waves","s":"Transverse vs Longitudinal Waves","f":"Parts of a transverse wave","b":"High points are <b>crests</b>, low points are <b>troughs</b>."},{"t":"Waves","s":"Transverse vs Longitudinal Waves","f":"Define a longitudinal wave","b":"Particles vibrate <b>parallel</b> to the wave's direction."},{"t":"Waves","s":"Transverse vs Longitudinal Waves","f":"Parts of a longitudinal wave","b":"Squeezed regions are <b>compressions (C)</b>; stretched regions are <b>rarefactions (R)</b>."},{"t":"Waves","s":"Transverse vs Longitudinal Waves","f":"Where can transverse mechanical waves travel?","b":"Only in <b>solids and on liquid surfaces</b>; longitudinal waves travel in <b>solids, liquids and gases</b>."},{"t":"Waves","s":"Transverse vs Longitudinal Waves","f":"⚠ Sound in air vs light — which is which?","b":"<b>Sound in air is longitudinal</b>; <b>light is a transverse EM wave</b>."},{"t":"Waves","s":"Measuring a Wave: Key Quantities","f":"Define wavelength (λ)","b":"The length of <b>one full wave</b> (crest to crest); unit <b>metre (m)</b>."},{"t":"Waves","s":"Measuring a Wave: Key Quantities","f":"Define amplitude (A)","b":"The <b>maximum displacement from rest</b>; it shows the wave's energy."},{"t":"Waves","s":"Measuring a Wave: Key Quantities","f":"Define time period (T)","b":"The time for <b>one wave</b>; <b>T = 1/f</b>, unit second."},{"t":"Waves","s":"Measuring a Wave: Key Quantities","f":"Master wave formula","b":"<b>v = f × λ</b> (speed = frequency × wavelength)."},{"t":"Waves","s":"Measuring a Wave: Key Quantities","f":"⚠ Does wave speed depend on the source's frequency?","b":"<b>No</b> — wave speed depends <b>only on the medium</b>."},{"t":"Waves","s":"Measuring a Wave: Key Quantities","f":"Define frequency and its unit","b":"The number of waves passing a point per second; unit <b>hertz (Hz)</b>. (Hertz)"},{"t":"Waves","s":"Properties of Sound: Loudness, Pitch, Quality","f":"What produces sound?","b":"Always a <b>vibrating object</b> (drum, vocal cords, string)."},{"t":"Waves","s":"Properties of Sound: Loudness, Pitch, Quality","f":"Loudness depends on…","b":"The <b>amplitude</b> of the wave; it falls with <b>distance</b> as amplitude decreases."},{"t":"Waves","s":"Properties of Sound: Loudness, Pitch, Quality","f":"Pitch (shrillness) depends on…","b":"The <b>frequency</b> — high frequency = high pitch."},{"t":"Waves","s":"Properties of Sound: Loudness, Pitch, Quality","f":"Which sounds are high vs low pitched?","b":"A whistle is <b>high-pitched</b>; a drum or man's voice is <b>low-pitched</b>."},{"t":"Waves","s":"Properties of Sound: Loudness, Pitch, Quality","f":"Define quality (timbre)","b":"Lets us tell a <b>sitar from a flute</b> playing the same note."},{"t":"Waves","s":"Properties of Sound: Loudness, Pitch, Quality","f":"Tuning a sitar adjusts what?","b":"<b>Tension</b>, to change the string's <b>frequency/pitch</b>."},{"t":"Waves","s":"Audible Range, Infrasound and Ultrasound","f":"Human audible range","b":"<b>20 Hz to 20,000 Hz (20 kHz)</b>."},{"t":"Waves","s":"Audible Range, Infrasound and Ultrasound","f":"What do older ears lose first?","b":"Sensitivity to the <b>high-frequency end</b>."},{"t":"Waves","s":"Audible Range, Infrasound and Ultrasound","f":"Define infrasound","b":"<b>Below 20 Hz</b> — heard by whales, elephants, rhinoceroses."},{"t":"Waves","s":"Audible Range, Infrasound and Ultrasound","f":"Define ultrasound","b":"<b>Above 20 kHz</b> — produced by bats, dolphins, porpoises."},{"t":"Waves","s":"Audible Range, Infrasound and Ultrasound","f":"What do earthquakes emit?","b":"<b>Infrasound</b>, which may warn animals before a shock."},{"t":"Waves","s":"Audible Range, Infrasound and Ultrasound","f":"Uses of ultrasound","b":"<b>Sonography, SONAR, kidney-stone breaking and flaw detection</b>."},{"t":"Waves","s":"Sound Needs a Medium","f":"⚠ Can sound travel through a vacuum?","b":"<b>No</b> — sound is a <b>mechanical wave</b>."},{"t":"Waves","s":"Sound Needs a Medium","f":"Bell-in-a-jar experiment","b":"A ringing bell grows <b>silent as air is pumped out</b>, though still seen ringing."},{"t":"Waves","s":"Sound Needs a Medium","f":"Why do astronauts talk by radio in space?","b":"<b>Sound has no medium there</b>."},{"t":"Waves","s":"Sound Needs a Medium","f":"Where does sound travel best?","b":"Where particles are <b>closely packed</b> — so it is <b>fastest in solids</b> and slowest in gases."},{"t":"Waves","s":"Speed of Sound in Different Media","f":"Order of sound speed by state","b":"<b>solid > liquid > gas</b> — denser/stiffer media carry sound faster."},{"t":"Waves","s":"Speed of Sound in Different Media","f":"Speed of sound in air at room temperature","b":"About <b>344 m/s</b> (around 22°C)."},{"t":"Waves","s":"Speed of Sound in Different Media","f":"How do temperature and humidity affect sound speed in air?","b":"Speed <b>increases</b> with both."},{"t":"Waves","s":"Speed of Sound in Different Media","f":"⚠ Sound vs light speed","b":"Sound is <b>far less</b> than the speed of light (3 × 10⁸ m/s)."},{"t":"Waves","s":"Reflection of Sound and Echo","f":"Does sound obey the laws of reflection?","b":"<b>Yes</b> — it bounces off hard surfaces following them."},{"t":"Waves","s":"Reflection of Sound and Echo","f":"Define an echo","b":"A sound heard <b>again after reflection</b> from a distant surface."},{"t":"Waves","s":"Reflection of Sound and Echo","f":"Minimum gap for the ear to distinguish an echo","b":"<b>0.1 second</b>."},{"t":"Waves","s":"Reflection of Sound and Echo","f":"⚠ Minimum distance of the reflector for an echo","b":"About <b>17.2 metres</b>."},{"t":"Waves","s":"Reflection of Sound and Echo","f":"Define reverberation","b":"<b>Repeated reflection</b> causing sound to persist in a hall — cut by <b>sound-absorbing materials</b> on walls and ceilings."},{"t":"Waves","s":"SONAR and Practical Uses of Sound","f":"SONAR stands for…","b":"<b>Sound Navigation And Ranging</b>."},{"t":"Waves","s":"SONAR and Practical Uses of Sound","f":"How does SONAR work?","b":"Uses <b>ultrasound echoes</b> to find distance and direction underwater."},{"t":"Waves","s":"SONAR and Practical Uses of Sound","f":"What does SONAR measure/locate?","b":"<b>Depth of the sea</b>; it locates submarines, rocks and shipwrecks."},{"t":"Waves","s":"SONAR and Practical Uses of Sound","f":"Echo method formula","b":"<b>Distance = (speed of sound × echo time) / 2</b>."},{"t":"Waves","s":"SONAR and Practical Uses of Sound","f":"Medical use of ultrasound","b":"<b>Sonography</b> — imaging organs and the fetus."},{"t":"Waves","s":"SONAR and Practical Uses of Sound","f":"Industrial uses of ultrasound","b":"<b>Cleans parts, breaks kidney stones and detects metal cracks</b>."},{"t":"Waves","s":"Noise, Decibels and Permissible Levels","f":"Unit of loudness","b":"The <b>decibel (dB)</b>."},{"t":"Waves","s":"Noise, Decibels and Permissible Levels","f":"⚠ Decibel level of rustling leaves","b":"About <b>10–20 dB</b>."},{"t":"Waves","s":"Noise, Decibels and Permissible Levels","f":"Decibel level of conversation and traffic","b":"Normal conversation ≈ <b>60 dB</b>; busy traffic near <b>80 dB</b>."},{"t":"Waves","s":"Noise, Decibels and Permissible Levels","f":"When does sound become noise pollution?","b":"Above about <b>80 dB</b> it becomes harmful."},{"t":"Waves","s":"Noise, Decibels and Permissible Levels","f":"Effects of prolonged loud noise","b":"<b>Hearing loss and stress</b>."},{"t":"Waves","s":"Noise, Decibels and Permissible Levels","f":"Which areas have higher permissible limits?","b":"<b>Industrial</b> areas, compared to residential."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"Three properties of EM waves","b":"They are <b>transverse</b>, need <b>no medium</b>, and travel at the <b>speed of light</b>."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"EM spectrum in order of increasing frequency","b":"<b>Radio, mi
