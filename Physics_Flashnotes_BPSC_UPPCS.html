crowave, infrared, visible, UV, X-ray, gamma</b>."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"Which has the highest frequency and shortest wavelength?","b":"<b>Gamma rays</b>."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"Which has the lowest frequency and longest wavelength?","b":"<b>Radio waves</b>."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"Higher frequency means…","b":"<b>Shorter wavelength and more energy</b>."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"⚠ What carries dish-antenna signals, and what weakens them?","b":"<b>Microwaves</b> — scattered and absorbed by <b>heavy rain</b>."},{"t":"Waves","s":"The Electromagnetic (EM) Spectrum","f":"How are satellites tracked?","b":"Using <b>radio/microwaves</b>, not sound."},{"t":"Optics","s":"Nature of Light","f":"Define light","b":"A <b>form of energy</b> that our eyes can detect; without light there is no vision."},{"t":"Optics","s":"Nature of Light","f":"How does light travel?","b":"In <b>straight lines (rectilinear propagation)</b> — which is why objects cast sharp shadows."},{"t":"Optics","s":"Nature of Light","f":"Speed of light in vacuum","b":"About <b>3 × 10⁸ m/s</b> (3 lakh km/s) — the fastest thing in the universe."},{"t":"Optics","s":"Nature of Light","f":"What is the dual nature of light?","b":"It behaves both as a <b>wave</b> and as particles called <b>photons</b>."},{"t":"Optics","s":"Nature of Light","f":"How long does sunlight take to reach Earth?","b":"About <b>8 minutes 20 seconds</b>."},{"t":"Optics","s":"Visible Light & VIBGYOR","f":"What is white light made of?","b":"Seven colours – <b>VIBGYOR</b>: Violet, Indigo, Blue, Green, Yellow, Orange, Red."},{"t":"Optics","s":"Visible Light & VIBGYOR","f":"Range of visible wavelengths","b":"About <b>4000 Å (violet) to 7000 Å (red)</b>, where 1 Å = 10⁻¹⁰ m."},{"t":"Optics","s":"Visible Light & VIBGYOR","f":"Violet: wavelength and frequency","b":"<b>Shortest wavelength, highest frequency</b> (~7.5 × 10¹⁴ Hz)."},{"t":"Optics","s":"Visible Light & VIBGYOR","f":"Red: wavelength and frequency","b":"<b>Longest wavelength, lowest frequency</b> (~4 × 10¹⁴ Hz)."},{"t":"Optics","s":"Visible Light & VIBGYOR","f":"⚠ Colour of light is determined by…","b":"Its <b>wavelength (frequency)</b> — not its speed or intensity."},{"t":"Optics","s":"Electromagnetic Spectrum","f":"Full EM spectrum, low to high energy","b":"<b>Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma</b>."},{"t":"Optics","s":"Electromagnetic Spectrum","f":"Which carries maximum energy?","b":"<b>Gamma rays</b> — energy increases as wavelength decreases."},{"t":"Optics","s":"Electromagnetic Spectrum","f":"Do all EM waves travel at the same speed?","b":"<b>Yes</b> — 3 × 10⁸ m/s in vacuum."},{"t":"Optics","s":"Electromagnetic Spectrum","f":"Which glass cuts off UV rays?","b":"<b>Crookes glass</b> / ultraviolet-filtering glass."},{"t":"Optics","s":"Reflection of Light","f":"Define reflection","b":"The <b>bouncing back</b> of light when it strikes a surface."},{"t":"Optics","s":"Reflection of Light","f":"Define the normal","b":"The line drawn <b>perpendicular (90°)</b> to the surface at the point of incidence."},{"t":"Optics","s":"Reflection of Light","f":"First law of reflection","b":"<b>Angle of incidence equals angle of reflection (i = r)</b>."},{"t":"Optics","s":"Reflection of Light","f":"Second law of reflection","b":"The <b>incident ray, reflected ray and normal lie in the same plane</b>."},{"t":"Optics","s":"Reflection of Light","f":"Do these laws hold for curved mirrors?","b":"<b>Yes</b> — for both plane and curved (spherical) mirrors."},{"t":"Optics","s":"Real vs Virtual Image","f":"Define a real image","b":"Forms where rays <b>actually meet</b>; can be caught on a screen and is usually <b>inverted</b>."},{"t":"Optics","s":"Real vs Virtual Image","f":"Define a virtual image","b":"Forms where rays <b>only appear to meet</b>; cannot be caught on a screen and is <b>erect</b>."},{"t":"Optics","s":"Real vs Virtual Image","f":"Cinema screen vs bathroom mirror","b":"Cinema: <b>real, inverted image</b> from a projector. Mirror: <b>virtual, erect image</b>."},{"t":"Optics","s":"Plane (Flat) Mirror","f":"Image in a plane mirror is…","b":"<b>Virtual, erect, same size</b>, and as far behind as the object is in front."},{"t":"Optics","s":"Plane (Flat) Mirror","f":"Define lateral inversion","b":"<b>Left and right are swapped</b> (e.g. AMBULANCE printed reversed)."},{"t":"Optics","s":"Plane (Flat) Mirror","f":"⚠ Are top and bottom flipped in a plane mirror?","b":"<b>No</b> — only sides are swapped; the image is not upside-down."},{"t":"Optics","s":"Plane (Flat) Mirror","f":"⚠ Focal length of a plane mirror","b":"<b>Infinity</b> — it has an infinite radius of curvature."},{"t":"Optics","s":"Plane (Flat) Mirror","f":"⚠ Minimum mirror height to see your full image","b":"<b>Half your height</b>."},{"t":"Optics","s":"Spherical Mirrors & Their Terms","f":"Concave vs convex mirror","b":"<b>Concave</b> curves inward and is <b>converging</b>; <b>convex</b> bulges outward and is <b>diverging</b>."},{"t":"Optics","s":"Spherical Mirrors & Their Terms","f":"Define pole (P) and centre of curvature (C)","b":"<b>P</b> is the centre of the mirror surface; <b>C</b> is the sphere's centre."},{"t":"Optics","s":"Spherical Mirrors & Their Terms","f":"Define principal focus (F)","b":"Where parallel rays <b>meet</b> (concave) or <b>seem to come from</b> (convex)."},{"t":"Optics","s":"Spherical Mirrors & Their Terms","f":"Key mirror relation","b":"<b>Focal length is half the radius of curvature, f = R/2</b>."},{"t":"Optics","s":"Images by Concave Mirror & Its Uses","f":"⚠ Object at C — what image?","b":"<b>Real, inverted and the same size</b>, also at C."},{"t":"Optics","s":"Images by Concave Mirror & Its Uses","f":"⚠ Object between P and F — what image?","b":"<b>Virtual, erect, magnified</b>."},{"t":"Optics","s":"Images by Concave Mirror & Its Uses","f":"What uses the magnifying behaviour?","b":"A <b>shaving / make-up mirror</b> and a <b>dentist's mirror</b>."},{"t":"Optics","s":"Images by Concave Mirror & Its Uses","f":"Other uses of concave mirrors","b":"Reflectors in <b>torches and headlights</b> and in <b>solar cookers</b>."},{"t":"Optics","s":"Images by Concave Mirror & Its Uses","f":"⚠ Image in a convex mirror is always…","b":"<b>Small, erect, virtual</b> — used as a vehicle rear-view mirror."},{"t":"Optics","s":"Refraction of Light","f":"Define refraction","b":"The <b>bending of light</b> as it passes from one medium to another."},{"t":"Optics","s":"Refraction of Light","f":"Why does light bend?","b":"Its <b>speed changes</b> between media of different density."},{"t":"Optics","s":"Refraction of Light","f":"Where is the speed of light minimum?","b":"In the <b>densest medium</b> — slowest in glass/diamond, fastest in vacuum."},{"t":"Optics","s":"Refraction of Light","f":"⚠ What does NOT change during refraction?","b":"The <b>frequency (and colour)</b> — only speed and wavelength change."},{"t":"Optics","s":"Refraction of Light","f":"Define refractive index","b":"Measures how much a medium <b>slows and bends light</b>."},{"t":"Optics","s":"Refraction of Light","f":"Everyday example of refraction","b":"A <b>pencil in a glass of water looks bent</b>."},{"t":"Optics","s":"Total Internal Reflection","f":"Define total internal reflection (TIR)","b":"Occurs when light in a <b>dense medium</b> hits the boundary <b>beyond the critical angle</b>."},{"t":"Optics","s":"Total Internal Reflection","f":"What happens instead of refracting out?","b":"The light is <b>completely reflected back inside</b>."},{"t":"Optics","s":"Total Internal Reflection","f":"Why does a cut diamond sparkle?","b":"Because of <b>repeated total internal reflection</b> (refractive index ≈ 2.42)."},{"t":"Optics","s":"Total Internal Reflection","f":"How do optical fibres work?","b":"They transmit light signals over long distances using <b>TIR</b>."},{"t":"Optics","s":"Total Internal Reflection","f":"⚠ What causes a mirage on hot roads?","b":"<b>Refraction and total internal reflection</b> in air layers."},{"t":"Optics","s":"Lenses","f":"Convex vs concave lens","b":"<b>Convex (converging)</b> is thick in the middle and brings rays to a focus; <b>concave (diverging)</b> is thin in the middle and spreads rays apart."},{"t":"Optics","s":"Lenses","f":"Which lens is a magnifying glass?","b":"A <b>convex lens</b> — gives an enlarged, erect, virtual image."},{"t":"Optics","s":"Lenses","f":"⚠ Covering part of a convex lens with black strips does what?","b":"Only <b>dims the image; the whole image still forms</b>."},{"t":"Optics","s":"Lenses","f":"Unit of lens power and its sign","b":"<b>Dioptres (D)</b>; convex power is <b>positive</b>, concave <b>negative</b>."},{"t":"Optics","s":"Human Eye & Defects of Vision","f":"Least distance of distinct vision","b":"About <b>25 cm</b> for a normal eye."},{"t":"Optics","s":"Human Eye & Defects of Vision","f":"Define myopia and its correction","b":"<b>Near-sightedness</b> — sees nearby objects clearly but not distant ones; corrected with a <b>concave (diverging) lens</b>."},{"t":"Optics","s":"Human Eye & Defects of Vision","f":"Define hypermetropia and its correction","b":"<b>Far-sightedness</b> — corrected using a <b>convex (converging) lens</b>."},{"t":"Optics","s":"Human Eye & Defects of Vision","f":"Presbyopia and cataract","b":"<b>Presbyopia</b> (old-age sight loss) needs <b>bifocal lenses</b>; <b>cataract</b> clouds the lens."},{"t":"Optics","s":"Dispersion & Colour Mixing","f":"Define dispersion","b":"The <b>splitting of white light into seven colours</b> by a prism."},{"t":"Optics","s":"Dispersion & Colour Mixing","f":"How does a rainbow form?","b":"By <b>dispersion, refraction and reflection</b> of sunlight in raindrops."},{"t":"Optics","s":"Dispersion & Colour Mixing","f":"Primary colours of light","b":"<b>Red, green and blue</b> (additive mixing)."},{"t":"Optics","s":"Dispersion & Colour Mixing","f":"Additive mixing results","b":"R+G+B = <b>white</b>; red+green = <b>yellow</b>; green+blue = <b>cyan</b>; red+blue = <b>magenta</b>."},{"t":"Optics","s":"Dispersion & Colour Mixing","f":"What colours soap bubbles and oil films?","b":"<b>Thin-film interference</b>."},{"t":"Optics","s":"Scattering & Atmospheric Effects","f":"Define scattering of light","b":"Air molecules <b>spread (diffuse)</b> sunlight in the atmosphere."},{"t":"Optics","s":"Scattering & Atmospheric Effects","f":"⚠ Why does the sky look blue?","b":"Shorter <b>blue wavelengths scatter the most</b> (Rayleigh scattering)."},{"t":"Optics","s":"Scattering & Atmospheric Effects","f":"⚠ Why does the Sun look red at sunrise/sunset?","b":"<b>Blue light scatters away</b> and red reaches the eye."},{"t":"Optics","s":"Scattering & Atmospheric Effects","f":"⚠ What causes the twinkling of stars?","b":"<b>Atmospheric refraction</b> of starlight."},{"t":"Optics","s":"Scattering & Atmospheric Effects","f":"Diffusion of light in the atmosphere is due to…","b":"<b>Scattering</b> (mainly by dust particles)."},{"t":"Optics","s":"Optical Instruments & Resolution","f":"Telescope vs microscope","b":"A <b>telescope</b> views distant objects; a <b>microscope</b> magnifies tiny objects."},{"t":"Optics","s":"Optical Instruments & Resolution","f":"⚠ Larger telescope objective diameter does what?","b":"<b>Increases resolving power</b> and gathers more light, giving brighter, clearer images."},{"t":"Optics","s":"Optical Instruments & Resolution","f":"Define resolution","b":"The ability to see <b>two close objects as separate</b>."},{"t":"Electricity","s":"Electric Charge and Current","f":"Two kinds of electric charge","b":"<b>Positive (+) and negative (−)</b>; like charges repel, unlike charges attract."},{"t":"Electricity","s":"Electric Charge and Current","f":"What carries charge inside a metal?","b":"<b>Free electrons</b>, which move freely and carry negative charge."},{"t":"Electricity","s":"Electric Charge and Current","f":"Define electric current","b":"The <b>flow of electric charge</b> through a conductor."},{"t":"Electricity","s":"Electric Charge and Current","f":"Unit of charge; charge on one electron","b":"<b>Coulomb (C)</b>; one electron carries about <b>1.6 × 10⁻¹⁹ C</b>."},{"t":"Electricity","s":"Electric Charge and Current","f":"Relate current, charge and time","b":"<b>I = Q / t</b>."},{"t":"Electricity","s":"Electric Charge and Current","f":"SI unit of current","b":"The <b>ampere (A)</b>: 1 A = 1 coulomb per second. (Ampère)"},{"t":"Electricity","s":"Conventional Current vs Electron Flow","f":"Direction of conventional current","b":"From the <b>+ terminal to the − terminal</b> outside the cell."},{"t":"Electricity","s":"Conventional Current vs Electron Flow","f":"⚠ Actual direction of electron drift","b":"The <b>opposite way, from − to +</b> — but the old convention is still used."},{"t":"Electricity","s":"Conventional Current vs Electron Flow","f":"How is current measured?","b":"By an <b>ammeter</b>, always connected <b>in series</b>."},{"t":"Electricity","s":"Conventional Current vs Electron Flow","f":"⚠ Define current density","b":"Current per unit cross-sectional area (<b>J = I / A</b>); it is a <b>vector quantity</b>."},{"t":"Electricity","s":"History of Electromagnetism","f":"Oersted's discovery (1820)","b":"A <b>current-carrying wire deflects a compass needle</b> — proving an electric current produces a <b>magnetic field</b>."},{"t":"Electricity","s":"History of Electromagnetism","f":"Volta's contribution (1800)","b":"The <b>first battery (voltaic pile)</b>; the unit volt."},{"t":"Electricity","s":"History of Electromagnetism","f":"Ohm's contribution (1827)","b":"<b>Ohm's law</b>."},{"t":"Electricity","s":"History of Electromagnetism","f":"Faraday's contribution (1831)","b":"<b>Electromagnetic induction</b> — moving magnets create electricity."},{"t":"Electricity","s":"History of Electromagnetism","f":"Who united electricity and magnetism?","b":"<b>Maxwell and Lorentz</b>, into one theory called electromagnetism."},{"t":"Electricity","s":"The Electric Circuit","f":"Define an electric circuit","b":"A <b>complete closed loop</b> through which current can flow."},{"t":"Electricity","s":"The Electric Circuit","f":"When does a bulb glow?","b":"Only when the circuit is <b>complete</b>; any gap stops the current."},{"t":"Electricity","s":"The Electric Circuit","f":"Cell vs battery","b":"A <b>cell</b> provides the push; a <b>battery</b> is two or more cells joined for a bigger push."},{"t":"Electricity","s":"The Electric Circuit","f":"What does a switch or plug key do?","b":"<b>Opens (breaks) or closes (completes)</b> the circuit."},{"t":"Electricity","s":"Potential Difference (Voltage)","f":"Define potential difference","b":"The <b>electrical pressure</b> that pushes current between two points."},{"t":"Electricity","s":"Potential Difference (Voltage)","f":"How is voltage measured?","b":"By a <b>voltmeter</b>, always connected <b>in parallel</b> across the part."},{"t":"Electricity","s":"Potential Difference (Voltage)","f":"⚠ Is electric potential a scalar or vector?","b":"A <b>scalar quantity</b>."},{"t":"Electricity","s":"Potential Difference (Voltage)","f":"Energy gained by a charge through p.d. V","b":"<b>E = eV</b> joules."},{"t":"Electricity","s":"Potential Difference (Voltage)","f":"SI unit of voltage","b":"The <b>volt (V)</b>: 1 V = 1 joule of energy per coulomb of charge."},{"t":"Electricity","s":"Conductors, Insulators and Semiconductors","f":"Why do conductors pass electricity easily?","b":"They have <b>many free electrons</b> — e.g. copper, silver, aluminium, the human body, the earth."},{"t":"Electricity","s":"Conductors, Insulators and Semiconductors","f":"Why do insulators resist current?","b":"They have <b>very few free electrons</b> — glass, porcelain, plastic, rubber, dry wood, dry air."},{"t":"Electricity","s":"Conductors, Insulators and Semiconductors","f":"Define semiconductors","b":"<b>Silicon, germanium</b> — conduct between metals and insulators and can be controlled."},{"t":"Electricity","s":"Conductors, Insulators and Semiconductors","f":"⚠ Effect of heating on metal vs semiconductor resistance","b":"A metal's resistance <b>increases</b>; a semiconductor's resistance <b>decreases</b>."},{"t":"Electricity","s":"Conductors, Insulators and Semiconductors","f":"⚠ Is distilled water a conductor?","b":"<b>No</b> — pure water is a <b>bad conductor</b>; salty/acidic water conducts."},{"t":"Electricity","s":"Resistance and Ohm's Law","f":"Define resistance","b":"The <b>opposition</b> a material offers to the flow of current."},{"t":"Electricity","s":"Resistance and Ohm's Law","f":"State Ohm's law (1827)","b":"At constant temperature, <b>current is directly proportional to voltage</b>."},{"t":"Electricity","s":"Resistance and Ohm's Law","f":"Ohm's law in symbols","b":"<b>V = I × R</b>, rearranged as <b>R = V/I</b> and <b>I = V/R</b>."},{"t":"Electricity","s":"Resistance and Ohm's Law","f":"Define a rheostat","b":"A <b>variable resistor</b> used to change the current in a circuit."},{"t":"Electricity","s":"Resistance and Ohm's Law","f":"SI unit of resistance","b":"The <b>ohm (Ω)</b>: 1 Ω allows 1 A when 1 V is applied. (Ohm)"},{"t":"Electricity","s":"Factors Affecting Resistance","f":"Effect of length and thickness","b":"Resistance <b>increases with length</b> and <b>decreases with thickness (area)</b>."},{"t":"Electricity","s":"Factors Affecting Resistance","f":"Other factors affecting resistance","b":"The <b>material</b> of the wire and its <b>temperature</b>."},{"t":"Electricity","s":"Factors Affecting Resistance","f":"Combine them in one formula","b":"<b>R = ρL / A</b>, where ρ is resistivity."},{"t":"Electricity","s":"Factors Affecting Resistance","f":"Define resistivity (ρ)","b":"A <b>fixed property of the material</b>, independent of wire shape."},{"t":"Electricity","s":"Resistors in Series and Parallel","f":"Series combination: current and formula","b":"Resistors joined end-to-end; the <b>same current</b> flows through each. <b>R = R₁ + R₂ + R₃</b>, always larger than the biggest one."},{"t":"Electricity","s":"Resistors in Series and Parallel","f":"Parallel combination: voltage and formula","b":"Both ends joined; <b>voltage is the same</b> across each. <b>1/R = 1/R₁ + 1/R₂ + 1/R₃</b>, always smaller than the smallest one."},{"t":"Electricity","s":"Resistors in Series and Parallel","f":"⚠ Where is each used?","b":"<b>Series</b> where one switch must control all; <b>parallel is used in home wiring</b>."},{"t":"Electricity","s":"Resistors in Series and Parallel","f":"Adding more resistors in parallel does what?","b":"<b>Increases total current</b> (lowers resistance)."},{"t":"Electricity","s":"Electric Power and Energy","f":"Define electric power and its unit","b":"The <b>rate at which electrical energy is used</b>; SI unit the <b>watt (W)</b>."},{"t":"Electricity","s":"Electric Power and Energy","f":"Three power formulas","b":"<b>P = V × I = I²R = V²/R</b>."},{"t":"Electricity","s":"Electric Power and Energy","f":"⚠ Which forms do NOT give power?","b":"<b>V × Q</b> or <b>I × t</b> — those denote other quantities."},{"t":"Electricity","s":"Electric Power and Energy","f":"Electrical energy and its commercial unit","b":"<b>Energy = Power × Time</b>; commercial unit is the <b>kilowatt-hour (kWh)</b>."},{"t":"Electricity","s":"Electric Power and Energy","f":"Define 1 unit of electricity","b":"<b>1 kWh</b> = energy used by a 1 kW device in 1 hour."},{"t":"Electricity","s":"Electric Power and Energy","f":"Example: 5 bulbs of 100 W for 20 hours","b":"5 × 100 × 20 = <b>10,000 Wh = 10 kWh (10 units)</b>."},{"t":"Electricity","s":"Heating Effect and Safety Devices","f":"Define the heating effect of current","b":"Current passing through a resistor produces heat — <b>H = I²Rt</b>."},{"t":"Electricity","s":"Heating Effect and Safety Devices","f":"Where is the heating effect used?","b":"<b>Electric heaters, irons, geysers and bulb filaments</b>."},{"t":"Electricity","s":"Heating Effect and Safety Devices","f":"What does a fuse do?","b":"Protects equipment by <b>melting and breaking the circuit</b> when current is too high."},{"t":"Electricity","s":"Heating Effect and Safety Devices","f":"⚠ What is fuse wire made of?","b":"A <b>low-melting alloy of lead and tin</b> with high resistance."},{"t":"Electricity","s":"Heating Effect and Safety Devices","f":"What happens in a short circuit?","b":"Resistance <b>falls</b> and the current becomes <b>very large</b> (dangerously high)."},{"t":"Electricity","s":"Heating Effect and Safety Devices","f":"What does earthing do?","b":"Protects users from electric shock by giving leaked current a <b>safe path to the ground</b>."},{"t":"Electricity","s":"AC Concepts: Reactance","f":"Define capacitive reactance","b":"The opposition a capacitor offers to current in AC circuits."},{"t":"Electricity","s":"AC Concepts: Reactance","f":"⚠ How does reactance relate to frequency?","b":"<b>Inversely proportional</b> — higher frequency gives lower reactance."},{"t":"Electricity","s":"AC Concepts: Reactance","f":"⚠ Does a capacitor pass AC or DC?","b":"It <b>blocks DC</b> (zero frequency → infinite reactance) but <b>passes AC</b>."},{"t":"Electricity","s":"AC Concepts: Reactance","f":"Define inductive reactance","b":"<b>Xl = 2πfL</b>, which <b>rises</b> with frequency."},{"t":"Electricity","s":"AC Concepts: Reactance","f":"Capacitive reactance formula","b":"<b>Xc = 1 / (2πfC)</b>, measured in ohms."},{"t":"Electricity","s":"Thermoelectric and Photoelectric Effects","f":"Define the thermoelectric (Seebeck) effect","b":"Temperature differences along a conductor cause <b>potential variation</b>."},{"t":"Electricity","s":"Thermoelectric and Photoelectric Effects","f":"What device works on the Seebeck effect?","b":"A <b>thermocouple</b>."},{"t":"Electricity","s":"Thermoelectric and Photoelectric Effects","f":"Define the photoelectric effect","b":"The <b>emission of electrons</b> when light falls on a surface."},{"t":"Electricity","s":"Thermoelectric and Photoelectric Effects","f":"⚠ Best photoelectric device for digital applications","b":"A <b>photodiode</b>, due to its fast response."},{"t":"Electricity","s":"Thermoelectric and Photoelectric Effects","f":"How do solar cells work?","b":"They use the <b>photoelectric effect</b> to convert light into electricity."},{"t":"Magnetism","s":"What Is a Magnet?","f":"Define a magnet","b":"An object that <b>attracts iron</b> and a few similar metals."},{"t":"Magnetism","s":"What Is a Magnet?","f":"Which way does a freely hung magnet point?","b":"Roughly <b>north-south</b>."},{"t":"Magnetism","s":"What Is a Magnet?","f":"Name the magnetic materials","b":"<b>Iron, nickel, cobalt and steel</b>."},{"t":"Magnetism","s":"What Is a Magnet?","f":"Name non-magnetic materials","b":"<b>Wood, plastic, paper, rubber, glass</b>."},{"t":"Magnetism","s":"What Is a Magnet?","f":"⚠ Surprising non-magnetic metals","b":"<b>Copper, gold and aluminium</b> are non-magnetic though they are metals."},{"t":"Magnetism","s":"What Is a Magnet?","f":"What is magnetism?","b":"The <b>invisible pull</b> that acts without touching the object."},{"t":"Magnetism","s":"Discovery and Types of Magnets","f":"What were the first magnets?","b":"Natural rocks called <b>lodestone</b>, found in nature."},{"t":"Magnetism","s":"Discovery and Types of Magnets","f":"Lodestone is made of…","b":"The iron mineral <b>magnetite</b>, which attracts iron."},{"t":"Magnetism","s":"Discovery and Types of Magnets","f":"Where do the names magnet/magnetite come from?","b":"<b>Magnesia</b>, where such rocks were found."},{"t":"Magnetism","s":"Discovery and Types of Magnets","f":"Why is the horseshoe shape used?","b":"It brings <b>both poles close</b>, making the pull stronger."},{"t":"Magnetism","s":"Poles of a Magnet","f":"Define the poles of a magnet","b":"The two places (usually the ends) where the <b>pull is strongest</b> — iron filings cluster thickly there."},{"t":"Magnetism","s":"Poles of a Magnet","f":"North pole vs South pole","b":"The end turning toward Earth's north is the <b>North pole (N)</b>; the end facing south is the <b>South pole (S)</b>."},{"t":"Magnetism","s":"Poles of a Magnet","f":"How many poles does every magnet have?","b":"Always <b>two</b> — one N and one S, whatever its shape."},{"t":"Magnetism","s":"Poles of a Magnet","f":"⚠ Has a magnetic monopole ever been found?","b":"<b>No</b> — a single lone pole has never been found."},{"t":"Magnetism","s":"Poles of a Magnet","f":"⚠ What happens if you cut a magnet?","b":"You get <b>two complete new magnets</b>, each with its own N and S."},{"t":"Magnetism","s":"Law of Magnetic Poles","f":"State the basic law of poles","b":"<b>Like poles repel; unlike poles attract</b>. N-N and S-S push apart; N-S pulls together."},{"t":"Magnetism","s":"Law of Magnetic Poles","f":"Is magnetic force a contact force?","b":"<b>No</b> — it is a <b>non-contact force</b>, acting across a gap like gravity."},{"t":"Magnetism","s":"Law of Magnetic Poles","f":"⚠ What is the sure test of magnetism?","b":"<b>Repulsion</b>, not attraction."},{"t":"Magnetism","s":"Law of Magnetic Poles","f":"Why is an iron nail not a true magnet?","b":"It is <b>only ever attracted, never repelled</b>."},{"t":"Magnetism","s":"Making a Magnet and the Compass","f":"Describe the single-touch method","b":"<b>Stroke</b> an iron bar with one pole, in <b>one direction only</b>, about 30-40 times."},{"t":"Magnetism","s":"Making a Magnet and the Compass","f":"⚠ Why not rub back and forth?","b":"Rubbing back and forth would <b>undo the effect</b>."},{"t":"Magnetism","s":"Making a Magnet and the Compass","f":"Define a compass","b":"A tiny <b>magnetised needle pivoted to spin freely</b>."},{"t":"Magnetism","s":"Making a Magnet and the Compass","f":"Where does the compass needle settle?","b":"In the <b>north-south direction</b>, helping find the way."},{"t":"Magnetism","s":"Magnetic Field and Field Lines","f":"Define the magnetic field","b":"The region where a magnet's <b>force can be felt</b>."},{"t":"Magnetism","s":"Magnetic Field and Field Lines","f":"Direction of field lines outside and inside a magnet","b":"Outside: <b>North pole to South pole</b>. Inside: <b>S to N</b>, so each line is a <b>complete closed loop</b>."},{"t":"Magnetism","s":"Magnetic Field and Field Lines","f":"⚠ Can field lines cross?","b":"<b>Never</b>."},{"t":"Magnetism","s":"Magnetic Field and Field Lines","f":"Crowded vs spread field lines","b":"Crowded = <b>strong field</b> (near poles); spread = <b>weak field</b>."},{"t":"Magnetism","s":"Magnetic Field and Field Lines","f":"How does a compass needle behave in a field?","b":"It always lines up <b>along the field line</b> at any point."},{"t":"Magnetism","s":"Earth as a Magnet","f":"Earth behaves like…","b":"A <b>giant bar magnet</b> with its own field."},{"t":"Magnetism","s":"Earth as a Magnet","f":"⚠ Where is Earth's magnetic South pole?","b":"At Earth's <b>geographic North</b> — which is why a compass N points north."},{"t":"Magnetism","s":"Earth as a Magnet","f":"Strength of Earth's magnetic field","b":"Very weak, only about <b>0.25 to 0.65 gauss</b>."},{"t":"Magnetism","s":"Earth as a Magnet","f":"Define magnetic declination","b":"The <b>angle between geographic and magnetic north</b>."},{"t":"Magnetism","s":"Unit of Magnetic Field","f":"What is field strength called?","b":"<b>Magnetic flux density</b>, with symbol <b>B</b>."},{"t":"Magnetism","s":"Unit of Magnetic Field","f":"SI unit of magnetic field","b":"The <b>tesla (T)</b>, named after Nikola Tesla."},{"t":"Magnetism","s":"Unit of Magnetic Field","f":"CGS unit of magnetic field","b":"The <b>gauss (G)</b>, named after C. F. Gauss."},{"t":"Magnetism","s":"Unit of Magnetic Field","f":"1 tesla in weber terms","b":"<b>1 tesla = 1 weber per square metre (Wb/m²)</b>."},{"t":"Magnetism","s":"Unit of Magnetic Field","f":"⚠ Conversion to memorise","b":"<b>1 tesla = 10,000 gauss (10⁴ G)</b>."},{"t":"Magnetism","s":"Unit of Magnetic Field","f":"⚠ Define one tesla via force","b":"The field that exerts <b>1 newton on 1 metre of wire carrying 1 ampere</b> — i.e. N/(A·m)."},{"t":"Magnetism","s":"Magnetic Materials (Classification)","f":"Define diamagnetic materials","b":"<b>Weakly repelled</b> by a magnet — e.g. copper, bismuth, water."},{"t":"Magnetism","s":"Magnetic Materials (Classification)","f":"Define paramagnetic materials","b":"<b>Weakly attracted</b> by a magnet — e.g. aluminium, platinum."},{"t":"Magnetism","s":"Magnetic Materials (Classification)","f":"Define ferromagnetic materials","b":"<b>Strongly attracted</b> — e.g. iron, nickel, cobalt."},{"t":"Magnetism","s":"Magnetic Materials (Classification)","f":"What causes paramagnetism?","b":"<b>Unpaired electrons</b> that align with the field."},{"t":"Magnetism","s":"Magnetic Materials (Classification)","f":"Soft vs hard magnet","b":"A <b>soft magnet</b> (soft iron) loses magnetism easily; a <b>hard magnet</b> (steel) keeps it."},{"t":"Magnetism","s":"Electromagnetism and the Electromagnet","f":"Oersted's discovery","b":"A <b>current-carrying wire produces a magnetic field</b> around it."},{"t":"Magnetism","s":"Electromagnetism and the Electromagnet","f":"What is a solenoid?","b":"A coiled wire that makes the field <b>strong and bar-magnet-like</b>."},{"t":"Magnetism","s":"Electromagnetism and the Electromagnet","f":"Define an electromagnet","b":"A <b>soft-iron core wrapped with a current-carrying coil</b>."},{"t":"Magnetism","s":"Electromagnetism and the Electromagnet","f":"What increases an electromagnet's strength?","b":"<b>More turns and more current</b>."},{"t":"Magnetism","s":"Electromagnetism and the Electromagnet","f":"⚠ Key advantage of an electromagnet","b":"It works <b>only while current flows</b>, so it can be switched on and off."},{"t":"Magnetism","s":"Electromagnetism and the Electromagnet","f":"Uses of electromagnets","b":"<b>Electric bells, cranes, relays and loudspeakers</b>."},{"t":"Magnetism","s":"Motor Effect and Defining the Tesla","f":"What happens to a current-carrying conductor in a magnetic field?","b":"It <b>experiences a force</b> — the working principle of the <b>electric motor</b>."},{"t":"Magnetism","s":"Motor Effect and Defining the Tesla","f":"What does an electric motor convert?","b":"<b>Electrical energy into mechanical (rotational) energy</b>."},{"t":"Magnetism","s":"Motor Effect and Defining the Tesla","f":"Which rule gives the direction of this force?","b":"<b>Fleming's left-hand rule</b> (the motor rule)."},{"t":"Magnetism","s":"Electromagnetic Induction and the Dynamo","f":"What does a dynamo / generator convert?","b":"<b>Mechanical energy into electrical energy</b>."},{"t":"Magnetism","s":"Electromagnetic Induction and the Dynamo","f":"What does an AC generator produce?","b":"<b>Alternating current</b>, by a coil rotating in a field."},{"t":"Magnetism","s":"Electromagnetic Induction and the Dynamo","f":"Define electromagnetic induction","b":"A <b>changing magnetic field induces a current</b> in a coil (Faraday, 1831)."},{"t":"Magnetism","s":"Electromagnetic Induction and the Dynamo","f":"Which rule gives the induced current direction?","b":"<b>Fleming's right-hand rule</b> (the generator rule)."},{"t":"Magnetism","s":"Electromagnetic Induction and the Dynamo","f":"⚠ Frequency of Indian mains AC","b":"<b>50 hertz</b>."},{"t":"Magnetism","s":"Transformer","f":"What does a transformer change?","b":"The <b>voltage of alternating current (AC only)</b>."},{"t":"Magnetism","s":"Transformer","f":"What principle does it work on?","b":"<b>Mutual electromagnetic induction</b> between two coils."},{"t":"Magnetism","s":"Transformer","f":"Step-up vs step-down transformer","b":"<b>Step-up</b> increases voltage (more secondary turns); <b>step-down</b> decreases voltage (fewer secondary turns)."},{"t":"Magnetism","s":"Transformer","f":"⚠ What type is a mobile phone charger?","b":"A <b>step-down transformer</b> (plus rectifier)."},{"t":"Magnetism","s":"Transformer","f":"⚠ Do transformers work on DC?","b":"<b>No</b> — DC gives no changing field."},{"t":"Magnetism","s":"Electromagnetic Waves and Spectrum","f":"What do electromagnetic waves carry?","b":"Energy as combined <b>electric and magnetic fields</b>."},{"t":"Magnetism","s":"Electromagnetic Waves and Spectrum","f":"Speed of all EM waves in vacuum","b":"The <b>speed of light, 3 × 10⁸ m/s</b>."},{"t":"Magnetism","s":"Electromagnetic Waves and Spectrum","f":"Do EM waves need a medium?","b":"<b>No</b> — they can travel through empty space."},{"t":"Magnetism","s":"Electromagnetic Waves and Spectrum","f":"⚠ What are infrared rays used for?","b":"<b>TV remote controls</b> (and heating)."},{"t":"Magnetism","s":"Electromagnetic Waves and Spectrum","f":"What are radio waves used for?","b":"<b>Broadcasting and mobile communication</b>."},{"t":"Magnetism","s":"Electromagnetic Waves and Spectrum","f":"What are X-rays used for?","b":"<b>Medical imaging of bones</b>."},{"t":"Magnetism","s":"Applications: MRI and Maglev","f":"What does MRI stand for and use?","b":"<b>Magnetic Resonance Imaging</b> — scans the body using strong <b>magnetic fields and radio waves</b>."},{"t":"Magnetism","s":"Applications: MRI and Maglev","f":"What does MRI image best?","b":"<b>Soft tissues, brain and organs</b>, without X-rays."},{"t":"Magnetism","s":"Applications: MRI and Maglev","f":"How do Maglev trains work?","b":"They <b>float and move using powerful magnetic levitation</b>."},{"t":"Magnetism","s":"Applications: MRI and Maglev","f":"Other everyday uses of magnets","b":"<b>Loudspeakers, microphones and hard disks</b>; <b>magnetic strips</b> store data on ATM and credit cards."},{"t":"Modern Physics","s":"The Atom and Its Sub-Atomic Particles","f":"Define an atom","b":"The <b>smallest unit of an element</b> that still keeps the element's properties."},{"t":"Modern Physics","s":"The Atom and Its Sub-Atomic Particles","f":"Basic structure of an atom","b":"A tiny heavy central <b>nucleus</b> with light <b>electrons</b> moving around it in shells."},{"t":"Modern Physics","s":"The Atom and Its Sub-Atomic Particles","f":"What does the nucleus hold?","b":"<b>Protons</b> (positive charge) and <b>neutrons</b> (no charge), together called <b>nucleons</b>."},{"t":"Modern Physics","s":"The Atom and Its Sub-Atomic Particles","f":"Why is an atom electrically neutral?","b":"The <b>number of protons equals the number of electrons</b>."},{"t":"Modern Physics","s":"The Atom and Its Sub-Atomic Particles","f":"⚠ Where is almost all the atom's mass?","b":"In the <b>nucleus</b> — electrons are extremely light."},{"t":"Modern Physics","s":"History of Atomic Models","f":"J. J. Thomson (1897)","b":"Discovered the <b>electron</b> and gave the <b>plum-pudding model</b> (electrons stuck in a positive sphere)."},{"t":"Modern Physics","s":"History of Atomic Models","f":"Ernest Rutherford (1911)","b":"Did the <b>gold-foil experiment</b> and gave the <b>nuclear model</b> (mass and positive charge in a tiny nucleus)."},{"t":"Modern Physics","s":"History of Atomic Models","f":"Niels Bohr (1913)","b":"Said electrons revolve only in <b>fixed energy levels (shells) K, L, M, N</b> = n 1, 2, 3, 4."},{"t":"Modern Physics","s":"History of Atomic Models","f":"James Chadwick (1932)","b":"Discovered the <b>neutron</b>, completing the three-particle picture."},{"t":"Modern Physics","s":"History of Atomic Models","f":"Albert Einstein","b":"Gave the <b>Theory of Relativity</b> and explained the <b>photoelectric effect</b>."},{"t":"Modern Physics","s":"Atomic Number, Mass Number and Notation","f":"Define atomic number (Z)","b":"The <b>number of protons</b>; it decides the identity of the element."},{"t":"Modern Physics","s":"Atomic Number, Mass Number and Notation","f":"Define mass number (A)","b":"<b>Protons + neutrons</b> (total nucleons)."},{"t":"Modern Physics","s":"Atomic Number, Mass Number and Notation","f":"How do you find the neutron count?","b":"<b>Neutrons = A − Z</b>."},{"t":"Modern Physics","s":"Atomic Number, Mass Number and Notation","f":"Define atomicity, with examples","b":"The <b>number of atoms in one molecule</b>: He is monatomic, O₂ diatomic, O₃ triatomic."},{"t":"Modern Physics","s":"Isotopes, Isobars and Isotones","f":"Define isotopes","b":"<b>Same atomic number Z, different mass number A</b> — same element, different neutrons."},{"t":"Modern Physics","s":"Isotopes, Isobars and Isotones","f":"Name the hydrogen isotopes","b":"<b>Protium, deuterium and tritium</b>, with 0, 1 and 2 neutrons."},{"t":"Modern Physics","s":"Isotopes, Isobars and Isotones","f":"Carbon and chlorine isotopes","b":"Carbon: C-12, C-13, <b>C-14</b> (radio-carbon dating); chlorine: Cl-35 and Cl-37."},{"t":"Modern Physics","s":"Isotopes, Isobars and Isotones","f":"Define isobars","b":"<b>Different elements with the same mass number A</b>, e.g. argon-40 and calcium-40."},{"t":"Modern Physics","s":"Isotopes, Isobars and Isotones","f":"Define isotones","b":"Atoms having the <b>same number of neutrons</b> but different Z and A."},{"t":"Modern Physics","s":"Isotopes, Isobars and Isotones","f":"⚠ Memory trick","b":"Isoto<b>p</b>e same <b>p</b>rotons, iso<b>bar</b> same mass, isoto<b>n</b>e same <b>n</b>eutrons."},{"t":"Modern Physics","s":"Atomic Mass and the Atomic Mass Unit","f":"Define the atomic mass unit","b":"The <b>unified atomic mass unit (amu or u)</b> — a special unit for very light atoms."},{"t":"Modern Physics","s":"Atomic Mass and the Atomic Mass Unit","f":"Define 1 u","b":"<b>1/12 of the mass of one carbon-12 atom</b>; a C-12 atom is exactly 12 u."},{"t":"Modern Physics","s":"Atomic Mass and the Atomic Mass Unit","f":"When was the carbon-12 standard adopted?","b":"<b>1961</b> (earlier hydrogen was used)."},{"t":"Modern Physics","s":"Atomic Mass and the Atomic Mass Unit","f":"Define gram atomic mass (molar mass)","b":"The <b>same number with unit changed from u to gram</b>."},{"t":"Modern Physics","s":"Atomic Mass and the Atomic Mass Unit","f":"What is the Avogadro number?","b":"One mole of atoms equals about <b>6.022 × 10²³</b> atoms."},{"t":"Modern Physics","s":"The Nuclear (Strong) Force","f":"Why doesn't the nucleus fly apart?","b":"The <b>nuclear force (strong force)</b> binds nucleons together despite proton repulsion."},{"t":"Modern Physics","s":"The Nuclear (Strong) Force","f":"Range of the strong force","b":"<b>Short-range</b>, acting only across the tiny distance inside the nucleus."},{"t":"Modern Physics","s":"The Nuclear (Strong) Force","f":"Strong force vs electric repulsion","b":"It is <b>much stronger</b> than the electric (Coulomb) repulsion between protons."},{"t":"Modern Physics","s":"The Nuclear (Strong) Force","f":"Is the strong force charge independent?","b":"<b>Yes</b> — it acts equally between proton-proton, neutron-neutron and proton-neutron pairs."},{"t":"Modern Physics","s":"The Nuclear (Strong) Force","f":"⚠ Rank among the fundamental forces","b":"The <b>strongest of the four</b> fundamental forces of nature."},{"t":"Modern Physics","s":"Mass Defect, Binding Energy and E = mc²","f":"Define mass defect","b":"The nucleus mass is <b>slightly less</b> than the total mass of its nucleons; this loss is the mass defect."},{"t":"Modern Physics","s":"Mass Defect, Binding Energy and E = mc²","f":"Define binding energy","b":"The <b>released energy that holds the nucleus together</b>."},{"t":"Modern Physics","s":"Mass Defect, Binding Energy and E = mc²","f":"Higher binding energy per nucleon means…","b":"A <b>more stable nucleus</b>; <b>iron</b> is among the most stable."},{"t":"Modern Physics","s":"Mass Defect, Binding Energy and E = mc²","f":"Why do both fission and fusion release energy?","b":"Both <b>increase binding energy per nucleon</b>."},{"t":"Modern Physics","s":"Mass Defect, Binding Energy and E = mc²","f":"Einstein's relation","b":"<b>E = mc²</b> — the lost mass is converted into energy."},{"t":"Modern Physics","s":"Radioactivity and Its Rays","f":"Define radioactivity","b":"The <b>spontaneous emission of radiation by unstable heavy nuclei</b>, discovered by <b>Henri Becquerel</b>."},{"t":"Modern Physics","s":"Radioactivity and Its Rays","f":"⚠ Define alpha rays","b":"<b>Positively charged helium nuclei</b> (2 protons + 2 neutrons) — the positive particle in PYQs."},{"t":"Modern Physics","s":"Radioactivity and Its Rays","f":"⚠ Define beta rays","b":"Fast-moving <b>negatively charged electrons</b>."},{"t":"Modern Physics","s":"Radioactivity and Its Rays","f":"⚠ Define gamma rays","b":"<b>Neutral</b>, high-energy electromagnetic waves with the <b>highest penetrating power</b>."},{"t":"Modern Physics","s":"Radioactivity and Its Rays","f":"⚠ Behaviour in an electric or magnetic field","b":"Alpha bends one way, beta the <b>opposite</b> way, and gamma goes <b>undeflected</b>."},{"t":"Modern Physics","s":"Radioactivity and Its Rays","f":"Units of radioactivity","b":"SI unit is the <b>becquerel</b>; the older unit is the <b>curie</b>."},{"t":"Modern Physics","s":"Nuclear Fission and Nuclear Reactors","f":"Define nuclear fission","b":"The <b>splitting of a heavy nucleus</b> (like uranium-235) into lighter nuclei, releasing huge energy."},{"t":"Modern Physics","s":"Nuclear Fission and Nuclear Reactors","f":"What is a chain reaction?","b":"Fission produces <b>extra neutrons that split more nuclei</b>."},{"t":"Modern Physics","s":"Nuclear Fission and Nuclear Reactors","f":"⚠ Atom bomb vs nuclear reactor","b":"The atom bomb works on <b>uncontrolled fission</b>; a nuclear reactor uses <b>controlled fission</b>."},{"t":"Modern Physics","s":"Nuclear Fission and Nuclear Reactors","f":"What does a moderator do?","b":"<b>Slows down neutrons</b> — e.g. heavy water or graphite. <b>Heavy water acts as both moderator and coolant</b>."},{"t":"Modern Physics","s":"Nuclear Fission and Nuclear Reactors","f":"What do control rods do?","b":"<b>Cadmium or boron</b> rods <b>absorb extra neutrons</b> to control the reaction."},{"t":"Modern Physics","s":"Nuclear Fission and Nuclear Reactors","f":"Common nuclear fuels","b":"<b>Uranium-235</b> and <b>plutonium-239</b>."},{"t":"Modern Physics","s":"Nuclear Fusion","f":"Define nuclear fusion","b":"The <b>joining of light nuclei</b> (like hydrogen) to form a heavier nucleus, releasing enormous energy."},{"t":"Modern Physics","s":"Nuclear Fusion","f":"What conditions does fusion need?","b":"<b>Very high temperature and pressure</b>."},{"t":"Modern Physics","s":"Nuclear Fusion","f":"Where do the Sun and stars get their energy?","b":"From <b>fusion of hydrogen into helium</b>."},{"t":"Modern Physics","s":"Nuclear Fusion","f":"⚠ Which bomb works on fusion?","b":"The <b>hydrogen bomb</b> — uncontrolled thermonuclear fusion."},{"t":"Modern Physics","s":"Nuclear Fusion","f":"⚠ Fusion breakthrough of December 2022","b":"The <b>Lawrence Livermore National Laboratory (USA)</b> claimed a fusion ignition breakthrough."},{"t":"Modern Physics","s":"Nuclear Fusion","f":"Fusion vs fission — energy and waste","b":"Fusion releases <b>more energy per unit mass</b> and produces <b>less radioactive waste</b>."},{"t":"Modern Physics","s":"Photoelectric Effect and Solar Cells","f":"What does a photoelectric cell (photocell) do?","b":"Converts <b>light energy into electrical energy / current</b>."},{"t":"Modern Physics","s":"Photoelectric Effect and Solar Cells","f":"Light behaves as…","b":"Packets of energy called <b>photons</b>."},{"t":"Modern Physics","s":"Photoelectric Effect and Solar Cells","f":"What do photovoltaic (solar) cells do?","b":"Convert <b>solar energy directly into electric energy</b>."},{"t":"Modern Physics","s":"Photoelectric Effect and Solar Cells","f":"Where are photocells used?","b":"<b>Automatic doors, burglar alarms and light meters</b>."},{"t":"Modern Physics","s":"Photoelectric Effect and Solar Cells","f":"Who explained the photoelectric effect?","b":"<b>Einstein</b> — the emission of electrons from a metal when light falls on it."},{"t":"Modern Physics","s":"X-Rays and Their Uses","f":"Who discovered X-rays and when?","b":"<b>Wilhelm Roentgen</b> in <b>1895</b>."},{"t":"Modern Physics","s":"X-Rays and Their Uses","f":"⚠ Are X-rays deflected by electric or magnetic fields?","b":"<b>No</b> — they are high-energy EM waves and are <b>chargeless</b>."},{"t":"Modern Physics","s":"X-Rays and Their Uses","f":"What can X-rays penetrate?","b":"<b>Soft tissue</b> — used to photograph bones and detect fractures."},{"t":"Modern Physics","s":"X-Rays and Their Uses","f":"Three uses of X-rays","b":"<b>Medical imaging, airport security and crystal study</b>."},{"t":"Modern Physics","s":"Lasers and Their Applications","f":"LASER stands for…","b":"<b>Light Amplification by Stimulated Emission of Radiation</b>."},{"t":"Modern Physics","s":"Lasers and Their Applications","f":"Properties of a laser beam","b":"Intense, <b>highly coherent and monochromatic</b> (single-colour), and <b>highly directional</b> — travels long distances without spreading."},{"t":"Modern Physics","s":"Lasers and Their Applications","f":"What principle does a laser work on?","b":"<b>Stimulated emission</b> of light."},{"t":"Modern Physics","s":"Lasers and Their Applications","f":"Uses of lasers","b":"<b>Surgery, CD/DVD players, barcode scanners, cutting and communication</b>."},{"t":"Modern Physics","s":"Medical and Industrial Uses of Radiation","f":"⚠ What are infrared rays used for medically?","b":"To give <b>relief from body aches and muscle pain</b> (heat therapy)."},{"t":"Modern Physics","s":"Medical and Industrial Uses of Radiation","f":"⚠ Cobalt-60 is used for…","b":"<b>Radiotherapy to treat cancer</b> (a gamma source)."},{"t":"Modern Physics","s":"Medical and Industrial Uses of Radiation","f":"⚠ Phosphorus-32 is used for…","b":"The treatment of <b>blood cancer (leukaemia)</b>."},{"t":"Modern Physics","s":"Medical and Industrial Uses of Radiation","f":"⚠ Iodine-131 is used for…","b":"Treating and studying the <b>thyroid gland</b>."},{"t":"Modern Physics","s":"Medical and Industrial Uses of Radiation","f":"⚠ Carbon-14 is used for…","b":"<b>Radio-carbon dating</b> of old fossils and objects."},{"t":"Modern Physics","s":"Medical and Industrial Uses of Radiation","f":"Other uses of radiation","b":"To <b>preserve food</b> and to <b>sterilise medical equipment</b>."},{"t":"Modern Physics","s":"Cosmic Rays, Pulsars and Space Physics","f":"⚠ Define cosmic rays","b":"<b>High-energy charged particles</b> (mostly protons) reaching Earth from outer space."},{"t":"Modern Physics","s":"Cosmic Rays, Pulsars and Space Physics","f":"Are cosmic rays deflected by magnetic fields?","b":"<b>Yes</b> — being charged, they are deflected, including by Earth's field."},{"t":"Modern Physics","s":"Cosmic Rays, Pulsars and Space Physics","f":"Define a pulsar","b":"A <b>rapidly rotating neutron star</b> that emits regular pulses of radiation."},{"t":"Modern Physics","s":"Cosmic Rays, Pulsars and Space Physics","f":"Define a neutron star","b":"An extremely dense remnant left after a <b>massive star explodes</b>."},{"t":"Modern Physics","s":"Cosmic Rays, Pulsars and Space Physics","f":"Define a black hole","b":"A region with <b>gravity so strong that even light cannot escape</b>."},{"t":"Modern Physics","s":"Order of Speed and Quick Comparisons","f":"Which travel at the speed of light?","b":"<b>Light, gamma rays and X-rays</b> — about 3 × 10⁸ m/s."},{"t":"Modern Physics","s":"Order of Speed and Quick Comparisons","f":"⚠ Highest velocity among alpha, beta, gamma and light","b":"<b>Gamma rays / light</b>."},{"t":"Modern Physics","s":"Order of Speed and Quick Comparisons","f":"⚠ Heaviest and slowest emitted particle","b":"<b>Alpha particles</b>; gamma rays are fastest."},{"t":"Modern Physics","s":"Order of Speed and Quick Comparisons","f":"⚠ Charge quick-check","b":"Positive emitted particle = <b>alpha particle</b>; negatively charged = <b>electron (beta)</b>; zero charge = <b>neutron</b>."},{"t":"Modern Physics","s":"Order of Speed and Quick Comparisons","f":"⚠ Penetrating power order","b":"<b>gamma > beta > alpha</b>."} C.forEach((c,i)=>c.i=i);
const LS='bpsc_physics_notes_v1';
let S={k:{},r:{},s:{},theme:'dark'};
try{const raw=localStorage.getItem(LS); if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
document.documentElement.dataset.t=S.theme;

let view='cards', topic=null, set='all', idx=0, flip=false, query='';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isTrap=c=>c.f.indexOf('\u26a0')>=0;

function pool(){
  let a=query?C.slice():C.filter(c=>!topic||c.t===topic);
  if(set==='unseen')a=a.filter(c=>!S.k[c.i]&&!S.r[c.i]);
  else if(set==='review')a=a.filter(c=>S.r[c.i]);
  else if(set==='starred')a=a.filter(c=>S.s[c.i]);
  else if(set==='traps')a=a.filter(isTrap);
  if(query){const t=query.toLowerCase();
    a=a.filter(c=>(c.f+' '+c.b+' '+c.s).toLowerCase().includes(t));}
  return a;
}
let list=[];
function rebuild(keep){
  const cur=list[idx]&&list[idx].i;
  list=pool();
  if(keep&&cur!==undefined){const p=list.findIndex(c=>c.i===cur);idx=p>=0?p:0;}else idx=0;
  if(idx>=list.length)idx=Math.max(0,list.length-1);
  flip=false; render();
}
function stats(){
  const k=Object.keys(S.k).filter(x=>S.k[x]).length;
  document.getElementById('sK').textContent=k+'/'+C.length;
  document.getElementById('sR').textContent=Object.keys(S.r).filter(x=>S.r[x]).length;
  document.getElementById('sS').textContent=Object.keys(S.s).filter(x=>S.s[x]).length;
  document.getElementById('bar').style.width=(k/C.length*100)+'%';
}

function render(){
  const b=document.getElementById('body');
  document.getElementById('vCards').classList.toggle('on',view==='cards');
  document.getElementById('vNotes').classList.toggle('on',view==='notes');
  if(view==='notes')renderNotes(b);
  else if(!topic&&!query&&set==='all')renderGrid(b);
  else renderCards(b);
  stats();
}

/* ---------- grid ---------- */
function renderGrid(b){
  b.innerHTML=`<input class="srch" id="srch" placeholder="Search all 709 cards…" value="${esc(query)}">
    <div class="grid" id="g"></div>`;
  hookSearch();
  const g=document.getElementById('g');
  ORDER.forEach(t=>{
    const arr=C.filter(c=>c.t===t);
    const k=arr.filter(c=>S.k[c.i]).length, r=arr.filter(c=>S.r[c.i]).length;
    const secs=new Set(arr.map(c=>c.s)).size, tb=TB.filter(x=>x.t===t).length;
    const el=document.createElement('button'); el.className='tc';
    el.innerHTML=`<div class="tn">${esc(FULL[t])}</div>
      <div class="tm"><span>${arr.length} cards</span><span>${secs} sections</span>${tb?`<span>${tb} tables</span>`:''}</div>
      <div class="prog"><i class="k" style="width:${k/arr.length*100}%"></i><i class="r" style="width:${r/arr.length*100}%"></i></div>
      <div class="pct">${k} known${r?' · '+r+' to review':''}</div>`;
    el.onclick=()=>{topic=t;set='all';idx=0;rebuild();};
    g.appendChild(el);
  });
}

/* ---------- cards ---------- */
function renderCards(b){
  const base=query?C.slice():C.filter(c=>!topic||c.t===topic);
  const sets=[['all','All',base.length],
    ['unseen','Unseen',base.filter(c=>!S.k[c.i]&&!S.r[c.i]).length],
    ['review','Review',base.filter(c=>S.r[c.i]).length],
    ['starred','Starred',base.filter(c=>S.s[c.i]).length],
    ['traps','Traps',base.filter(isTrap).length]];
  b.innerHTML=`<input class="srch" id="srch" placeholder="Search all 709 cards…" value="${esc(query)}">
    <div class="chips" id="ch"></div><div class="stage" id="st"></div>`;
  hookSearch();
  const ch=document.getElementById('ch');
  sets.forEach(([k,l,n])=>{const x=document.createElement('button');
    x.className='chip'+(set===k?' on':''); x.innerHTML=esc(l)+`<span class="n">${n}</span>`;
    x.onclick=()=>{set=k;idx=0;rebuild();}; ch.appendChild(x);});

  const st=document.getElementById('st');
  if(!list.length){
    st.innerHTML=`<div class="empty"><h3>Nothing in this set</h3>
      <p>${query?'No card matches that search.':set==='review'?'No cards marked for review.':set==='starred'?'Star a card to keep it here.':set==='unseen'?'Every card here is marked.':'No cards.'}</p>
      <button class="nb pri" id="bk">Back to chapters</button></div>`;
    document.getElementById('bk').onclick=goHome; return;
  }
  const c=list[idx];
  st.innerHTML=`<div class="crumb"><button id="home">← All chapters</button>
      <div class="loc">${esc(FULL[c.t])}<span class="sec">${esc(c.s)}</span></div></div>
    <div class="flip"><div class="inner${flip?' f':''}" id="inner">
      <div class="face">
        <span class="pin${S.s[c.i]?' on':''}" id="pin">${S.s[c.i]?'★':'☆'}</span>
        ${isTrap(c)?'<span class="trap">exam trap</span>':''}
        <div class="fq">${esc(c.f.replace('\u26a0 ',''))}</div>
        <div class="hint">tap or press space to flip</div>
      </div>
      <div class="face back">
        <span class="pin${S.s[c.i]?' on':''}" id="pin2">${S.s[c.i]?'★':'☆'}</span>
        <div class="fa">${c.b}</div>
        <div class="hint">${esc(c.s)}</div>
      </div></div></div>
    <div class="marks">
      <button class="mk k${S.k[c.i]?' on':''}" id="mk">✓ Known</button>
      <button class="mk r${S.r[c.i]?' on':''}" id="mr">↻ Review</button>
      <button class="mk s${S.s[c.i]?' on':''}" id="ms">★ Star</button>
    </div>
    <div class="cnav">
      <button class="nb" id="pv" ${idx===0?'disabled':''}>← Prev</button>
      <span class="pos">${idx+1} of ${list.length}</span>
      <button class="nb pri" id="nx" ${idx>=list.length-1?'disabled':''}>Next →</button>
    </div>
    <div class="keys"><span><kbd>space</kbd> flip</span><span><kbd>←</kbd><kbd>→</kbd> move</span>
      <span><kbd>K</kbd> known</span><span><kbd>R</kbd> review</span><span><kbd>S</kbd> star</span></div>`;

  document.getElementById('inner').onclick=()=>{flip=!flip;
    document.getElementById('inner').classList.toggle('f',flip);};
  document.getElementById('home').onclick=goHome;
  document.getElementById('pin').onclick=e=>{e.stopPropagation();toggle('s');};
  document.getElementById('pin2').onclick=e=>{e.stopPropagation();toggle('s');};
  document.getElementById('mk').onclick=()=>toggle('k');
  document.getElementById('mr').onclick=()=>toggle('r');
  document.getElementById('ms').onclick=()=>toggle('s');
  document.getElementById('pv').onclick=()=>{if(idx>0){idx--;flip=false;render();}};
  document.getElementById('nx').onclick=()=>{if(idx<list.length-1){idx++;flip=false;render();}};
}
function toggle(kind){
  const c=list[idx]; if(!c)return;
  S[kind][c.i]=!S[kind][c.i];
  if(kind==='k'&&S.k[c.i])S.r[c.i]=false;
  if(kind==='r'&&S.r[c.i])S.k[c.i]=false;
  save();
  if(kind!=='s'&&(set==='unseen'||set==='review')){rebuild(false);return;}
  render();
}
function goHome(){topic=null;set='all';query='';idx=0;rebuild();}

/* ---------- notes ---------- */
function renderNotes(b){
  b.innerHTML=`<input class="srch" id="srch" placeholder="Search all 709 cards…" value="${esc(query)}">
    <div class="notes" id="nn"></div>`;
  hookSearch();
  const n=document.getElementById('nn');
  const q=query.toLowerCase();
  const tops=(topic&&!query)?[topic]:ORDER;
  let any=false;
  tops.forEach(t=>{
    let cards=C.filter(c=>c.t===t);
    if(q)cards=cards.filter(c=>(c.f+' '+c.b+' '+c.s).toLowerCase().includes(q));
    const tbs=TB.filter(x=>x.t===t).filter(x=>!q||(x.title+' '+x.head.join(' ')+' '+x.rows.flat().join(' ')).toLowerCase().includes(q));
    if(!cards.length&&!tbs.length)return;
    any=true;
    const secs=[]; cards.forEach(c=>{if(!secs.length||secs[secs.length-1][0]!==c.s)secs.push([c.s,[]]);
      secs[secs.length-1][1].push(c);});
    const d=document.createElement('div'); d.className='ch';
    d.innerHTML=`<h2>${esc(FULL[t])}</h2>
      <div class="chm">${cards.length} points · ${secs.length} sections${tbs.length?' · '+tbs.length+' tables':''}</div>
      ${secs.map(([s,items])=>`<div class="sec"><h3>${esc(s)}</h3>
        ${items.map(c=>`<div class="pt${isTrap(c)?' tr':''}">
          <div class="q">${esc(c.f.replace('\u26a0 ',''))}</div><div class="a">${c.b}</div></div>`).join('')}
      </div>`).join('')}
      ${tbs.map(x=>`<div class="tblwrap"><table><caption>${esc(x.title)}</caption>
        <thead><tr>${x.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${x.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`).join('')}`;
    n.appendChild(d);
  });
  if(!any)n.innerHTML=`<div class="empty"><h3>No match</h3><p>Nothing found for that search.</p></div>`;
}

let tmr;
function hookSearch(){
  const el=document.getElementById('srch'); if(!el)return;
  el.oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{
    query=e.target.value.trim(); idx=0;
    const pos=e.target.selectionStart;
    rebuild();
    const nel=document.getElementById('srch');
    if(nel){nel.focus();try{nel.setSelectionRange(pos,pos)}catch(x){}}
  },200);};
}

document.getElementById('vCards').onclick=()=>{view='cards';flip=false;render();};
document.getElementById('vNotes').onclick=()=>{view='notes';render();};
document.getElementById('theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';
  document.documentElement.dataset.t=S.theme;save();};
document.getElementById('reset').onclick=()=>{
  if(!confirm('Clear all known / review / star marks? This cannot be undone.'))return;
  S={k:{},r:{},s:{},theme:S.theme};save();rebuild();};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(view!=='cards'||!list.length)return;
  if(e.key===' '){e.preventDefault();flip=!flip;
    const el=document.getElementById('inner'); if(el)el.classList.toggle('f',flip);}
  else if(e.key==='ArrowRight'){if(idx<list.length-1){idx++;flip=false;render();}}
  else if(e.key==='ArrowLeft'){if(idx>0){idx--;flip=false;render();}}
  else if(e.key==='k'||e.key==='K')toggle('k');
  else if(e.key==='r'||e.key==='R')toggle('r');
  else if(e.key==='s'||e.key==='S')toggle('s');
});

rebuild();
</script></body></html>
