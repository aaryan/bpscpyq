nds were **auctioned off**."],[1,"Faced exploitation by **zamindars, moneylenders**, and the **British**."],[1,"In **June 1855**, Santhals rose under **Sidhu** and **Kanhu**."],[1,"Began the **Santhal Hul** (movement for liberation)."]],"p":35,"b":0},{"i":"k0185","k":1,"t":"Santhal Rebellion (1855-56)","a":["","",""],"n":[[1,"Aimed to **reclaim territory** and establish their own **government**."],[1,"Despite bravery, their **outdated weaponry** was a disadvantage."],[1,"After a year, the British suppressed the rebellion, killing around **20,000 Santhals**."]],"p":35,"b":0},{"i":"k0186","k":1,"t":"Outcomes","a":[],"n":[[2,"Led to some **British policy changes**."],[2,"**Santhal Parganas Tenancy Act** provided tribes some protection → prohibited the transfer of Adivasi lands (urban or rural land) to non-Adivasis"],[2,"**Regular police** abolished; **village headmen** maintained peace and order."]],"p":35,"b":0}]},{"t":"Peasants in 1857 Revolt","p":35,"c":[{"i":"k0187","k":1,"t":"Peasants in 1857 Revolt","a":["","",""],"n":[[1,"The **1857 revolt** showed no uniform pattern of **peasant participation**."],[1,"In **Oudh** and **western UP**, peasants joined local feudal leaders to oppose **foreign imperialism**."],[1,"Peasants momentarily forgot oppression by local **zamindars**."]],"p":35,"b":0}]},{"t":"Indigo Revolt (1860)","p":36,"c":[{"i":"k0188","k":1,"t":"Indigo Revolt (1860)","a":["","","",""],"n":[[1,"Revolt against British **planters** behaving like **feudal lords**."],[1,"From early 19th century, retired British officials acquired land in **Bihar** and **Bengal** to cultivate **indigo**."],[1,"Planters forced cultivators to grow indigo under exploitative terms."],[1,"**April 1860**: Cultivators went on **strike**, refusing to sow indigo."]],"p":36,"b":1},{"i":"k0189","k":1,"t":"Indigo Revolt (1860)","a":["","",""],"n":[[1,"Government issued a notification affirming cultivators' **right to grow crops of choice**."],[1,"**Bengal planters** gradually moved to **Bihar** and **UP**."],[1,"**Din Bandhu Mitra** wrote **'Nil Darpan'** in 1861 based on the revolt."]],"p":36,"b":1}]},{"t":"Pabna Agrarian Leagues","p":36,"c":[{"i":"k0190","k":1,"t":"Pabna Agrarian Leagues","a":["","","",""],"n":[[1,"**Eastern Bengal** during the **1870s and 1880s** saw peasants oppressed by **zamindars**."],[1,"Zamindars extracted rents beyond legal limits and denied **occupancy rights** under **Act X of 1859**."],[1,"Peasants faced **forcible evictions**, seizure of **cattle and crops**, and costly litigations."],[1,"Peasants in **Yusufshahi Pargana** formed an **agrarian league** to resist."]],"p":36,"b":0},{"i":"k0191","k":1,"t":"Pabna Agrarian Leagues","a":["","","",""],"n":[[1,"Organized **rent strikes**; refused to pay enhanced rents."],[1,"Collected funds for **court cases**; minimal violence occurred."],[1,"Efforts continued until **1885**, resulting in favorable court verdicts."],[1,"Led to the **Bengal Tenancy Act of 1885**, legalizing **tenants' rights**."]],"p":36,"b":0}]},{"t":"Deccan Riots (1875)","p":36,"c":[{"i":"k0192","k":1,"t":"Deccan Riots (1875)","a":["","","",""],"n":[[1,"**Deccan region**'s black soil favored **cotton cultivation**."],[1,"**American Civil War (1860s)** increased demand for Deccan cotton."],[1,"Post-war, cotton prices **declined**, causing hardship for peasants."],[1,"Burdened by increased **land revenue** and **bond frauds** by moneylenders."]],"p":36,"b":0},{"i":"k0193","k":1,"t":"Deccan Riots (1875)","a":["","","",""],"n":[[1,"**June 1875**: Peasants in **Poona** and **Ahmednagar** districts rebelled against moneylenders."],[1,"Destroyed houses and **bond documents**."],[1,"**Deccan Riots Commission** investigated causes."],[1,"**Agriculturists' Relief Act (1879)** passed, protecting peasants from evictions."]],"p":37,"b":0}]},{"t":"Indian National Congress and the Peasants","p":37,"c":[{"i":"k0194","k":1,"t":"Indian National Congress and the Peasants","a":["","","",""],"n":[[1,"Early **Congress Party** did not espouse peasants' causes; resolutions showed **class interests**."],[1,"Sought to extend **Permanent Settlement**; restricted over-assessment."],[1,"Did not demand **tenancy reforms** in key provinces."],[1,"**Mahatma Gandhi's** entry changed the scene; aimed to expand the **national movement's base**."]],"p":37,"b":0},{"i":"k0195","k":1,"t":"Indian National Congress and the Peasants","a":["",""],"n":[[1,"Led **peasant-centric satyagrahas** like **Champaran** and **Kheda**."],[1,"Peasants became part of the **national movement**."]],"p":37,"b":1}]},{"t":"Munda Ulgulan (1899-1900)","p":37,"c":[{"i":"k0196","k":0,"t":"Munda Ulgulan (1899-1900)","a":["Mundas","","Traditional land system",""],"n":[[1,"**Mundas**: Tribal group in the **Chhotanagpur Plateau**, present-day **Jharkhand**."],[1,"Practiced shifting cultivation; relied on forests and natural resources."],[1,"**Traditional land system: Khuntkari system**—customary rights over land; no landlords."],[1,"**British policies** replaced it with **Zamindari system** in **1874**."]],"p":37,"b":1},{"i":"k0197","k":1,"t":"Munda Ulgulan (1899-1900)","a":["","","","",""],"n":[[1,"Created **zamindars** (landlords) and **ryots** (tenants)."],[1,"Tribals had to pay rent; faced evictions for non-payment."],[1,"Exploited by landlords, moneylenders, and officials."],[1,"Blamed **dikus** (outsiders) for their misery."],[1,"Sought to remove outsiders and establish independent **raj**."]],"p":37,"b":0}]},{"t":"Led by Birsa Munda","p":37,"c":[{"i":"k0198","k":1,"t":"Led by Birsa Munda","a":["","","",""],"n":[[1,"In **1895, Birsa Munda** emerged as leader, called **Dharti Abba** (Father of the Earth)."],[1,"Persuaded followers to stop planting rice; claimed his powers would provide."],[1,"Predicted a divine fire would destroy outsiders."],[1,"British arrested Birsa to undermine his influence."]],"p":37,"b":0},{"i":"k0199","k":0,"t":"Led by Birsa Munda","a":["","","Slogan"],"n":[[1,"Post-release in **1897**, Birsa led a **revivalist campaign**."],[1,"Demanded **autonomous control** over land."],[1,"Slogan: **'Sirmare Firun Raja Jai'** (Victory to the Ancestral Kings)."]],"p":37,"b":0}]},{"t":"The Ulgulan (Great Tumult)","p":38,"c":[{"i":"k0200","k":1,"t":"The Ulgulan (Great Tumult)","a":["","","",""],"n":[[1,"**Munda Revolt** led by Birsa started in **1899**."],[1,"Used **guerrilla warfare** tactics against the British."],[1,"Attacked police, set property on fire."],[1,"British suppressed the rebellion, killing hundreds."]],"p":38,"b":0},{"i":"k0201","k":1,"t":"The Ulgulan (Great Tumult)","a":["","",""],"n":[[1,"Birsa was captured again; died in jail on **9th June 1900** at age **25**."],[1,"His death and the trial of **300 Mundas** gained national attention."],[1,"Led to the **Chotanagpur Tenancy Act (1908)**, restricting land transfer to non-Adivasis."]],"p":38,"b":1}]},{"t":"Mappila (Moplah) Uprising (1921)","p":38,"c":[{"i":"k0202","k":1,"t":"Mappila (Moplah) Uprising (1921)","a":["","","",""],"n":[[1,"**Mappilas**: Muslim cultivators in **South Malabar, Kerala**."],[1,"Worked as **tenants** or **bonded laborers** under **Hindu landlords**."],[1,"Faced high **land revenue**, insecure tenures, and extra exactions."],[1,"Rebelled **22 times** between **1836 and 1894**."]],"p":38,"b":0},{"i":"k0203","k":0,"t":"Mappila (Moplah) Uprising (1921)","a":["1921","",""],"n":[[1,"**1921** uprising fueled by **Khilafat Movement**."],[1,"Rebellion turned **communal**, targeting Hindu landlords."],[1,"Government suppressed it with extreme brutality by end of **1921**."]],"p":38,"b":0}]},{"t":"Kisan Sabhas","p":38,"c":[{"i":"k0204","k":1,"t":"Kisan Sabhas","a":["","","","",""],"n":[[1,"Recognized **contradictions** in Congress's agrarian policy."],[1,"Congress focused on relief from excessive **land revenue**, indifferent to **inter-agrarian relations**."],[1,"**Communist** and **left parties** promoted **class consciousness** among peasants."],[1,"Led to formation of **Kisan Sabhas** in **Bengal, Punjab, UP** in the 1920s."],[1,"First **All India Kisan Sabha** formed in **1936**."]],"p":38,"b":0}]},{"t":"Demands of Kisan Sabhas","p":38,"c":[{"i":"k0205","k":1,"t":"Demands of Kisan Sabhas","a":["","","",""],"n":[[1,"**Moratorium on debts**."],[1,"Reduction in **land revenue** and **rent**."],[1,"**Licensing of moneylenders**."],[1,"**Minimum wages** for agricultural workers."]],"p":38,"b":0},{"i":"k0206","k":1,"t":"Demands of Kisan Sabhas","a":["",""],"n":[[1,"**Abolition of zamindari**; land ownership to **tillers**."],[1,"Organized struggles against **zamindar exploitation**."]],"p":39,"b":0},{"i":"k0207","k":1,"t":"Demands of Kisan Sabhas","a":[""],"n":[[1,"In **Bihar, Sahajanand Saraswati** led the **Bakasht Movement (1937-1938)**."],[2,"Opposed eviction from **self-cultivated lands**."],[2,"Resulted in the **Bihar Tenancy Act** and **Bakasht Land Tax**."]],"p":39,"b":1}]},{"t":"Awadh Kisan Sabha and Eka Movement","p":39,"c":[{"i":"k0208","k":0,"t":"Awadh Kisan Sabha and Eka Movement","a":["1910s"],"n":[[1,"**1910s**: Kisan Sabhas organized in **UP**; led by **Baba Ramchandra**."]],"p":39,"b":0},{"i":"k0209","k":1,"t":"Awadh Kisan Sabha and Eka Movement","a":[""],"n":[[1,"**June 1920**: Formation of **Awadh Kisan Sabha**."],[2,"Urged peasants not to till **bedakhli land** (evicted land)."],[2,"Opposed **hari** and **begar** (forms of unpaid labor)."]],"p":39,"b":0},{"i":"k0210","k":1,"t":"Awadh Kisan Sabha and Eka Movement","a":[""],"n":[[1,"Movement turned violent and declined."]],"p":39,"b":0},{"i":"k0211","k":1,"t":"Awadh Kisan Sabha and Eka Movement","a":[""],"n":[[1,"**Late 1921: Eka Movement** emerged in northern UP."],[2,"Protested high rents, **thikadar oppression**, and **share rent**."],[2,"Peasants vowed to pay only legitimate rent, resist eviction, and refuse forced labor."]],"p":39,"b":0}]},{"t":"Peasants and Congress Ministries (1937-39)","p":39,"c":[{"i":"k0212","k":0,"t":"Peasants and Congress Ministries (1937-39)","a":["1937",""],"n":[[1,"**1937**: Congress formed governments in several provinces."],[1,"Peasants hoped for **land reforms** but faced disappointment."]],"p":39,"b":0},{"i":"k0213","k":1,"t":"Peasants and Congress Ministries (1937-39)","a":[""],"n":[[1,"In **Bihar**, enacted **Restoration of Bakasht Land Act** and **Bihar Tenancy Act (1938)**."],[2,"Provided some relief but **evictions continued**."]],"p":39,"b":1},{"i":"k0214","k":1,"t":"Peasants and Congress Ministries (1937-39)","a":["","","","",""],"n":[[1,"Allowed tenants to **transfer holdings** without landlord consent."],[1,"Reduced **salami rates** (initial payments to landlords)."],[1,"**Kisan leaders** wanted **Kisan Raj**: abolition of zamindari and land distribution."],[1,"Congress ministries, often backed by **zamindars**, couldn't abolish zamindari."],[1,"Some legislation led to **widespread tenant evictions** (e.g., **Bengal**)."]],"p":39,"b":0}]},{"t":"On the Eve of Independence: Tebhaga Movement","p":39,"c":[{"i":"k0215","k":1,"t":"Three significant peasant movements before independence","a":[],"n":[[2,"**Tebhaga Movement** in **Bengal**."],[2,"**Telangana Outbreak** in **Hyderabad State**."],[2,"**Varlis Revolt** in **Western India**."]],"p":39,"b":0},{"i":"k0216","k":1,"t":"Tebhaga Movement","a":[],"n":[[2,"Long struggle of **bargardars** (sharecroppers) against **zamindars** and **jotedars** (rich peasants)."],[2,"**Suhrawardy's government (1946-47)** passed **Bargardari Bill**, offering some tenant relief."]],"p":40,"b":0}]},{"t":"On the Eve of Independence: Telangana Movement","p":40,"c":[{"i":"k0217","k":1,"t":"On the Eve of Independence: Telangana Movement","a":["","","",""],"n":[[1,"Peasants in **Nizam's Hyderabad** faced oppression from **landlords, moneylenders**, **traders**, and officials."],[1,"Launched a movement supported by **Praja Mandal** and **Arya Samaj** leaders."],[1,"Significant role played by the **Communist Party**."],[1,"Continued until **1951** when communists changed tactics."]],"p":40,"b":0},{"i":"k0218","k":1,"t":"On the Eve of Independence: Telangana Movement","a":["",""],"n":[[1,"On independence, India inherited an **antiquated agrarian system** needing **drastic reforms**."],[1,"**70+ years** of history have seen limited fulfillment of these hopes."]],"p":40,"b":0}]}]},{"n":8,"t":"Early Political Associations","d":"Ilbert Bill and the pre-Congress political bodies","e":"1836 – 1893","p":41,"s":[{"t":"The Ilbert Bill Controversy","p":41,"c":[{"i":"k0219","k":1,"t":"The Ilbert Bill Controversy","a":["","","",""],"n":[[1,"In **1883**, under **Lord Ripon, C.P. Ilbert** introduced a bill to amend the **Criminal Procedure Code**."],[1,"Aimed to allow **Indian magistrates** to try **European British subjects** in criminal cases in rural areas (**mofussil**)."],[1,"**It was opposed** by the Anglo-Indian community."],[1,"**Europeans** considered it beneath their dignity to be tried by **Indians**."]],"p":41,"b":0},{"i":"k0220","k":1,"t":"The Ilbert Bill Controversy","a":["","","","",""],"n":[[1,"**Rumors** circulated about potential abuses, especially involving **English women**."],[1,"The British press spread **wild allegations** about Indian judges."],[1,"A **compromise** allowed British subjects to request a **jury** with half **European members**."],[1,"The incident **humiliated the Indian middle class**."],[1,"Served as a **prelude to the establishment** of the **Indian National Congress** in **1885**."]],"p":41,"b":0}]},{"t":"Formation of Early Political Associations","p":41,"c":[{"i":"k0221","k":1,"t":"Formation of Early Political Associations","a":["","",""],"n":[[1,"In the **19th century**, Indians began forming **political associations**."],[1,"Early associations were **regional**, dominated by the **rich and aristocrats**."],[1,"Demands were limited to **administrative and educational reforms** and greater Indian participation in governance."]],"p":41,"b":0}]},{"t":"Key Political Associations and Their Features","p":42,"c":[{"i":"k0222","k":2,"t":"1836","a":["Association","Features"],"n":[[1,"**Association**: Bangabhasha Prakasika Sabha"],[1,"**Features**: Formed by associates of Raja Rammohan Roy."]],"p":42,"b":0},{"i":"k0223","k":2,"t":"1838","a":["Association","Features"],"n":[[1,"**Association**: Zamindari Association or Landholders’ Society"],[1,"**Features**: Considered the first political association of modern India; set up by Radhakant Deb, Dwarkanath Tagore to safeguard landlords' interests."]],"p":42,"b":0},{"i":"k0224","k":2,"t":"1843","a":["Association","Features"],"n":[[1,"**Association**: Bengal British India Society"],[1,"**Features**: Led by the Young Bengal group (Derozians); aimed to foster good citizenship through Indo-British collaboration."]],"p":42,"b":0},{"i":"k0225","k":2,"t":"1851","a":["Association","Features"],"n":[[1,"**Association**: British Indian Association"],[1,"**Features**: Merger of Landholders’ Society and Bengal British India Society; demanded executive-judiciary separation, salary reduction for higher officers, abolition of salt, abkari, and stamp duties."]],"p":42,"b":0},{"i":"k0226","k":2,"t":"1866","a":["Association","Features"],"n":[[1,"**Association**: East India Association"],[1,"**Features**: Founded by Dadabhai Naoroji in London; aimed to influence British public opinion in favor of Indian welfare."]],"p":42,"b":0},{"i":"k0227","k":2,"t":"1870","a":["Association","Features"],"n":[[1,"**Association**: Poona Sarvajanik Sabha"],[1,"**Features**: Founded by M.G. Ranade and others; served as a bridge between the government and the people; demanded India’s direct representation in the British Parliament."]],"p":42,"b":0},{"i":"k0228","k":2,"t":"1875","a":["Association","Features"],"n":[[1,"**Association**: Indian League"],[1,"**Features**: Started by Sisir Kumar Ghosh to stimulate nationalism through political education."]],"p":42,"b":0},{"i":"k0229","k":2,"t":"1876","a":["Association","Features"],"n":[[1,"**Association**: Indian Association of Calcutta (also Indian National Association)"],[1,"**Features**: Founded by Surendranath Banerjea and Ananda Mohan Bose; superseded the Indian League; regarded British Indian Association as reactionary; protested against reducing the age for civil services examination; demanded exams be held simultaneously in India and England; campaigned against the Arms Act and Vernacular Press Act; merged with the Indian National Congress in 1886."]],"p":43,"b":0},{"i":"k0230","k":2,"t":"1884","a":["Association","Features"],"n":[[1,"**Association**: Madras Mahajan Sabha"],[1,"**Features**: Founded by M. Viraghavachari, B. Subramaniya Aiyer, P. Anandacharlu."]],"p":43,"b":0},{"i":"k0231","k":2,"t":"1885","a":["Association","Features"],"n":[[1,"**Association**: Bombay Presidency Association"],[1,"**Features**: Started by Badruddin Tyabji, Pherozshah Mehta, K.T. Telang."]],"p":43,"b":0},{"i":"k0232","k":2,"t":"1885","a":["Association","Features"],"n":[[1,"**Association**: Indian National Congress (INC)"],[1,"**Features**: Founded by A.O. Hume as a forum to represent Indian opinion; became the preeminent political association and later transformed into a mass movement."]],"p":43,"b":0},{"i":"k0233","k":2,"t":"1893","a":["Association","Features"],"n":[[1,"**Association**: Indian Parliamentary Committee"],[1,"**Features**: Formed by Sir William Wedderburn and Dadabhai Naoroji to advocate the Indian cause in the British Parliament."]],"p":43,"b":0}]}]},{"n":9,"t":"INC Sessions & Presidents","d":"Session-by-session presidents, venues and landmark decisions","e":"1885 – 1947","p":43,"s":[{"t":"INC Sessions","p":43,"c":[{"i":"k0234","k":2,"t":"1885","a":["President","Important Facts","Location"],"n":[[1,"**President**: Womesh Chandra Bonnerjee"],[1,"**Important Facts**"],[2,"First Session of INC"],[2,"Attended by 72 delegates (mainly elite sections – lawyers, teachers and journalists)"],[2,"Laid foundation for national movement"],[1,"**Location**: Original venue: Poona Changed to Gokuldas Tejpal Sanskrit College, Bombay due to Cholera outbreak in Poona."]],"p":44,"b":0},{"i":"k0235","k":2,"t":"1886","a":["President","Important Facts","Location"],"n":[[1,"**President**: Dadabhai Naoroji"],[1,"**Important Facts**"],[2,"Increased participation to 436 delegates (33 Muslims)"],[2,"Fostered discussions on social reforms"],[1,"**Location**: Calcutta"]],"p":44,"b":0},{"i":"k0236","k":2,"t":"1887","a":["President","Important Facts","Location"],"n":[[1,"**President**: Badruddin Tyabji"],[1,"**Important Facts**"],[2,"First Muslim President"],[2,"Aimed to bridge gap between Hindus and Muslims"],[2,"Advocated for communal harmony"],[1,"**Location**: Madras"]],"p":44,"b":0},{"i":"k0237","k":2,"t":"1888","a":["President","Important Facts","Location"],"n":[[1,"**President**: George Yule"],[1,"**Important Facts**"],[2,"First British President"],[2,"Highlighted inclusiveness of Congress"],[2,"Encouraged moderate policies"],[1,"**Location**: Allahabad"]],"p":44,"b":0},{"i":"k0238","k":2,"t":"1889","a":["President","Important Facts","Location"],"n":[[1,"**President**: Sir William Wedderburn"],[1,"**Important Facts**"],[2,"Second British President"],[2,"Emphasized constitutional reforms"],[2,"Supported Indian aspirations for self-governance"],[1,"**Location**: Bombay"]],"p":44,"b":0},{"i":"k0239","k":2,"t":"1890","a":["President","Important Facts","Location"],"n":[[1,"**President**: Pherozeshah Mehta"],[1,"**Important Facts**: Known as the \"Lion of Bombay\""],[1,"**Location**: Calcutta"]],"p":44,"b":0},{"i":"k0240","k":2,"t":"1892","a":["President","Important Facts","Location"],"n":[[1,"**President**: Womesh Chandra Bonnerjee"],[1,"**Important Facts**"],[2,"Re-elected as President"],[2,"Addressed issues of land revenue and taxation"],[1,"**Location**: Allahabad"]],"p":45,"b":0},{"i":"k0241","k":2,"t":"1893","a":["President","Important Facts","Location"],"n":[[1,"**President**: Dadabhai Naoroji"],[1,"**Important Facts**"],[2,"2nd time as President"],[2,"Advocated for Indian representation in British Parliament"],[2,"Highlighted the economic drain from India"],[1,"**Location**: Lahore"]],"p":45,"b":0},{"i":"k0242","k":2,"t":"1894","a":["President","Important Facts","Location"],"n":[[1,"**President**: Alfred Webb"],[1,"**Important Facts**: Third British President"],[1,"**Location**: Madras"]],"p":45,"b":0},{"i":"k0243","k":2,"t":"1895","a":["President","Important Facts","Location"],"n":[[1,"**President**: Surendranath Banerjee"],[1,"**Important Facts**: Stressed on constitutional methods for reforms"],[1,"**Location**: Poona"]],"p":45,"b":0},{"i":"k0244","k":2,"t":"1896","a":["President","Important Facts","Location"],"n":[[1,"**President**: Rahimtulla M. Sayani"],[1,"**Important Facts**: Vande Matram song sung for the first time."],[1,"**Location**: Calcutta"]],"p":45,"b":0},{"i":"k0245","k":2,"t":"1902","a":["President","Important Facts","Location"],"n":[[1,"**President**: Surendranath Banerjee"],[1,"**Important Facts**: Second term as President"],[1,"**Location**: Ahmedabad"]],"p":45,"b":0},{"i":"k0246","k":2,"t":"1905","a":["President","Important Facts","Location"],"n":[[1,"**President**: Gopal Krishna Gokhale"],[1,"**Important Facts**"],[2,"Partition of Bengal became effective"],[2,"Called for Swadeshi and Boycott Movements"],[2,"Urged unity to combat colonial policies"],[1,"**Location**: Banaras"]],"p":45,"b":0},{"i":"k0247","k":2,"t":"1906","a":["President","Important Facts","Location"],"n":[[1,"**President**: Dadabhai Naoroji"],[1,"**Important Facts**"],[2,"Declared Swaraj as goal of INC"],[2,"First official use of Swaraj (self-rule)"],[2,"Encouraged adoption of Swadeshi and national education"],[1,"**Location**: Calcutta"]],"p":45,"b":0},{"i":"k0248","k":2,"t":"1907","a":["President","Important Facts","Location"],"n":[[1,"**President**: Rash Behari Ghosh"],[1,"**Important Facts**"],[2,"Surat Split between Moderates and Extremists"],[2,"Differences over methods to achieve Swaraj"],[2,"Led to organizational division"],[1,"**Location**: Surat"]],"p":46,"b":0},{"i":"k0249","k":2,"t":"1912 (27th session)","a":["President","Important Facts","Location"],"n":[[1,"**President**: Raghunath Narasinha Mudholkar"],[1,"**Important Facts**: Advocated for administrative decentralization, education reforms and industrial growth."],[1,"**Location**: Bankipur, Patna"]],"p":46,"b":1},{"i":"k0250","k":2,"t":"1914","a":["President","Important Facts","Location"],"n":[[1,"**President**: BN Bose"],[1,"**Important Facts**"],[2,"Bombay group (led by Pherozshah Mehta) opposed Tilak’s entry in Congress."],[2,"Bengal group and Gokhale supported his entry."],[1,"**Location**: Madras"]],"p":46,"b":0},{"i":"k0251","k":2,"t":"1915","a":["President","Important Facts","Location"],"n":[[1,"**President**: Satyendra Prasad Sinha"],[1,"**Important Facts**"],[2,"First Indian appointed to the Viceroy's Executive Council"],[2,"Emphasized constitutional reforms"],[2,"Supported World War I efforts"],[1,"**Location**: Bombay"]],"p":46,"b":0},{"i":"k0252","k":2,"t":"1916","a":["President","Important Facts","Location"],"n":[[1,"**President**: Ambica Charan Mazumdar"],[1,"**Important Facts**"],[2,"Lucknow Pact between INC and Muslim League"],[2,"Reunion of Moderates and Extremists"],[2,"Demanded Home Rule"],[1,"**Location**: Lucknow"]],"p":46,"b":0},{"i":"k0253","k":2,"t":"1917","a":["President","Important Facts","Location"],"n":[[1,"**President**: Annie Besant"],[1,"**Important Facts**"],[2,"First Woman President"],[2,"Advocated for Home Rule"],[2,"Emphasized education and social reforms"],[1,"**Location**: Calcutta"]],"p":47,"b":0},{"i":"k0254","k":2,"t":"1920","a":["President","Important Facts","Location"],"n":[[1,"**President**: Lala Lajpat Rai / C. Vijayaraghavachari ar"],[1,"**Important Facts**"],[2,"Special Session in Calcutta led by Lala Lajpat Rai"],[2,"Adopted Non-Cooperation Resolution"],[2,"Annual Session in Nagpur led by C. Vijayaraghavachariar confirming the movement"],[1,"**Location**: Calcutta / Nagpur"]],"p":47,"b":0},{"i":"k0255","k":2,"t":"1921","a":["President","Important Facts","Location"],"n":[[1,"**President**: Hakim Ajmal Khan (Acting President)"],[1,"**Important Facts**"],[2,"C. R. Das elected but in jail"],[2,"Continued Non-Cooperation Movement"],[2,"Emphasized Swaraj through peaceful means"],[1,"**Location**: Ahmedabad"]],"p":47,"b":0},{"i":"k0256","k":2,"t":"1922 (37th session)","a":["President","Important Facts","Location"],"n":[[1,"**President**: CR Das"],[1,"**Important Facts**"],[2,"Post Chauri Chaura incident"],[2,"Suspension of Non-Cooperation Movement"],[2,"Called for reorganization of Congress"],[2,"Welcomed the formation of All India Trade Union Congress"],[1,"**Location**: Gaya"]],"p":47,"b":1},{"i":"k0257","k":2,"t":"1924","a":["President","Important Facts","Location"],"n":[[1,"**President**: Mahatma Gandhi"],[1,"**Important Facts**"],[2,"Only time Gandhi presided"],[2,"Focused on Swaraj through Non-Violence"],[2,"Addressed issues of untouchability and khadi promotion"],[1,"**Location**: Belgaum"]],"p":47,"b":0},{"i":"k0258","k":2,"t":"1925","a":["President","Important Facts","Location"],"n":[[1,"**President**: Sarojini Naidu"],[1,"**Important Facts**"],[2,"First Indian Woman President"],[2,"Promoted women's rights"],[2,"Emphasized literacy and education"],[1,"**Location**: Kanpur"]],"p":48,"b":0},{"i":"k0259","k":2,"t":"1928","a":["President","Important Facts","Location"],"n":[[1,"**President**: Motilal Nehru"],[1,"**Important Facts**"],[2,"Presented the Nehru Report"],[2,"Demanded Dominion Status within a year"],[2,"Opposed by Jawaharlal Nehru and Subhas Chandra Bose for not demanding complete independence"],[1,"**Location**: Calcutta"]],"p":48,"b":0},{"i":"k0260","k":2,"t":"1929","a":["President","Important Facts","Location"],"n":[[1,"**President**: Jawaharlal Nehru"],[1,"**Important Facts**"],[2,"Declaration of Purna Swaraj (Complete Independence)"],[2,"Tricolour flag was hoisted"],[2,"January 26, 1930 declared as Independence Day"],[2,"Authorized launch of Civil Disobedience Movement"],[1,"**Location**: Lahore"]],"p":48,"b":0},{"i":"k0261","k":2,"t":"1931","a":["President","Important Facts","Location"],"n":[[1,"**President**: Vallabhbhai Patel"],[1,"**Important Facts**"],[2,"Post Gandhi-Irwin Pact"],[2,"Gandhi attended Second Round Table Conference"],[2,"Adopted resolutions on Fundamental Rights and National Economic Program"],[1,"**Location**: Karachi"]],"p":48,"b":0},{"i":"k0262","k":2,"t":"1934","a":["President","Important Facts","Location"],"n":[[1,"**President**: Rajendra Prasad"],[1,"**Important Facts**"],[2,"Civil Disobedience Movement withdrawn"],[2,"Focused on reconstructing Congress"],[2,"Emphasized on village industries"],[1,"**Location**: Bombay"]],"p":48,"b":0},{"i":"k0263","k":2,"t":"1936 (50th session)","a":["President","Important Facts","Location"],"n":[[1,"**President**: Jawaharlal Nehru"],[1,"**Important Facts**"],[2,"First session to be held in a village."],[2,"Supported peasants' and workers' rights"],[2,"Addressed issues of feudal oppression"],[2,"Formation of All India Kisan Sabha"],[1,"**Location**: Lucknow"]],"p":49,"b":0},{"i":"k0264","k":2,"t":"1937","a":["President","Important Facts","Location"],"n":[[1,"**President**: Jawaharlal Nehru"],[1,"**Important Facts**"],[2,"Congress ministries formed in provinces"],[2,"Focused on implementation of pro-people policies"],[1,"**Location**: Faizpur"]],"p":49,"b":0},{"i":"k0265","k":2,"t":"1938","a":["President","Important Facts","Location"],"n":[[1,"**President**: Subhas Chandra Bose"],[1,"**Important Facts**"],[2,"Advocated for aggressive approach against British"],[2,"Emphasized industrialization and planning"],[2,"Formed National Planning Committee under the chairmanship of JL Nehru"],[1,"**Location**: Haripura"]],"p":49,"b":0},{"i":"k0266","k":2,"t":"1939","a":["President","Important Facts","Location"],"n":[[1,"**President**: Subhas Chandra Bose / Rajendra Prasad"],[1,"**Important Facts**"],[2,"Re-elected but faced opposition from Gandhi's supporters"],[2,"Led to Tripuri Crisis"],[2,"Bose resigned; Rajendra Prasad became President"],[1,"**Location**: Tripuri"]],"p":49,"b":0},{"i":"k0267","k":2,"t":"1940","a":["President","Important Facts","Location"],"n":[[1,"**President**: Maulana Abul Kalam Azad"],[1,"**Important Facts**"],[2,"Resolved to launch Individual Satyagraha"],[2,"Opposed India's involvement in World War II without consent"],[2,"Emphasized on Quit India Movement preparations"],[1,"**Location**: Ramgarh"]],"p":49,"b":0},{"i":"k0268","k":2,"t":"1941–45","a":["President","Important Facts","Location"],"n":[[1,"**President**: Maulana Abul Kalam Azad"],[1,"**Important Facts**"],[2,"No sessions due to World War II and Quit India Movement"],[2,"Led INC during crucial years"],[2,"Worked underground due to British crackdown"],[1,"**Location**: N/A"]],"p":50,"b":0},{"i":"k0269","k":2,"t":"1947","a":["President","Important Facts","Location"],"n":[[1,"**President**: J. B. Kripalani"],[1,"**Important Facts**"],[2,"Independence of India achieved"],[2,"Partition leading to communal violence"],[2,"Focused on rehabilitation and nation-building"],[2,"15 June, AICC resolution: States could not be independent and live in isolation in India"],[1,"**Location**: Delhi"]],"p":50,"b":0}]}]},{"n":10,"t":"Moderates to Revolutionaries","d":"Moderates, Extremists, Swadeshi, revolutionary terrorism, Ghadar","e":"1885 – 1915","p":50,"s":[{"t":"The Rise of Indian Nationalism and the Indian National Congress","p":50,"c":[{"i":"k0270","k":1,"t":"The Rise of Indian Nationalism and the Indian National Congress","a":["","","",""],"n":[[1,"Following the **1857 revolt**, political awareness among Indians grew, leading to emerging leadership at national and provincial levels."],[1,"Numerous political associations were established in the **19th century**, reflecting growing **political consciousness**."],[1,"**A.O. Hume**, a **retired British civil servant**, proposed forming a forum to represent Indian interests, leading to the foundation of the **Indian National Congress (INC)** in **1885**."],[1,"The INC held its first session in **Bombay** in **1885**, presided over by **Womesh Chandra Banerjee**, with delegates like **Dadabhai Naoroji, Pherozshah Mehta**, and **William Wedderburn**."]],"p":50,"b":0}]},{"t":"Early Goals, Methods, and the Moderates","p":50,"c":[{"i":"k0271","k":1,"t":"Early Goals, Methods, and the Moderates","a":["","","",""],"n":[[1,"The INC aimed to nurture **Indian nationalism** by fostering a **democratic national movement** and formulating an **anti-colonial nationalist ideology**."],[1,"Initially, it demanded **moderate reforms**, focusing on **spreading awareness** of **colonial exploitation**."],[1,"The **Moderates** believed in the benevolence of **British rule** and thought that making the British aware of **Indian aspirations** would lead to reforms."],[1,"They used methods like **prayer, petition, and constitutional agitation**, contributing significantly to the freedom struggle."]],"p":50,"b":0},{"i":"k0272","k":1,"t":"Early Goals, Methods, and the Moderates","a":["","","","",""],"n":[[1,"Leaders like **Dadabhai Naoroji, R.C. Dutt**, and **Dinshaw Wacha** analyzed the colonial economy, proposing the **'drain of wealth' theory**, highlighting how **Britain exploited India's resources for its industrial needs.**"],[1,"They advocated ending India's economic linkage with Britain to develop independently through **indigenous capital and enterprise**."],[1,"Political demands included **expansion of legislative councils**, greater **Indian participation** in administration, **free speech and press, Indianization of administration**, separation of **executive and judicial functions**, better treatment of **Indian laborers abroad**, reduced **land revenue** and **military expenditure**, improved working conditions in **plantations**, and abolition of **salt tax**."],[1,"Despite their contributions, the **Moderates lacked faith in the masses**, believing they were **not ready for political activities**, which limited their popular base."],[1,"The British administration was hostile to the Congress, labeling its leaders as **\"seditious Brahmins\"** and **\"disloyal babus\"**, and supported reactionary elements like **Syed Ahmed Khan** and **Raja Shiv Prasad** to counter the Congress by forming the **United Indian Patriotic Association**."]],"p":51,"b":0}]},{"t":"Rise of the Extremists and the Swadeshi Movement","p":51,"c":[{"i":"k0273","k":1,"t":"Rise of the Extremists and the Swadeshi Movement","a":["","","","",""],"n":[[1,"Around the turn of the **20th century**, dissatisfaction with the Moderates' limited achievements led to the rise of the **Extremists**, including leaders like **Bal Gangadhar Tilak, Bipin Chandra Pal, Aurobindo Ghosh** (“New Lamps for Old”), and **Lala Lajpat Rai**."],[1,"Influenced by figures like **Swami Vivekananda, Dayananda Saraswati, Bankim Chandra Chatterjee**, and **Rabindranath Tagore**, they advocated **active resistance** to British imperialism and aimed for **Swaraj** (self-rule)."],[1,"The **'drain of wealth' theorists** highlighted British exploitation, and indigenous industrialists resented policies hindering local industry."],[1,"Events like **Ethiopia defeating Italy (1896)**, British reverses in the **Boer War (1899-1902)**, and **Japan defeating Russia (1905)** shattered the myth of European invincibility."],[1,"**Viceroy Lord Curzon's** reactionary measures, including the **Official Secrets Act, Indian Universities Act**, and especially the **Partition of Bengal** in **1905**, became catalysts for intensified opposition."]],"p":51,"b":0}]},{"t":"Partition of Bengal and the Swadeshi Movement","p":52,"c":[{"i":"k0274","k":1,"t":"Partition of Bengal and the Swadeshi Movement","a":["","","",""],"n":[[1,"The **Bengal Presidency included Bengal, Bihar, parts of Chhattisgarh, Odisha, and Assam**, making it the largest province of British India with a **population of 78.5 million.**"],[1,"In December 1903, the British proposed **partitioning Bengal under the pretext of administrative efficiency.**"],[1,"The plan divided the province into **Bengal (Western Bengal, Bihar, Odisha) and Eastern Bengal (merged with Assam)**, creating Muslim and Bengali minority regions."],[1,"Indian leaders saw this as a **'divide and rule'** strategy to weaken Indian nationalism by fostering communal and linguistic divides."]],"p":52,"b":1},{"i":"k0275","k":1,"t":"Partition of Bengal and the Swadeshi Movement","a":["","","",""],"n":[[1,"**Moderate leaders like Surendranath Banerjea and KK Mitra** campaigned against the partition, using petitions, public meetings, and newspapers like **Hitabadi and Bengalee.**"],[1,"Despite their efforts, **Bengal's partition was implemented on 16th October 1905,** leading to widespread protests."],[1,"The Swadeshi movement began with protest meetings and a resolution to boycott foreign goods in August 1905."],[1,"On the day of partition, **people mourned by fasting, bathing in the Ganga, and singing patriotic songs like Bande Matram and Amar Sonar Bangla.**"]],"p":52,"b":0}]},{"t":"Expansion of the Movement and New Forms of Struggle","p":52,"c":[{"i":"k0276","k":1,"t":"Expansion of the Movement and New Forms of Struggle","a":[""],"n":[[1,"The movement spread to other regions, led by"],[2,"**Tilak** in **Bombay**,"],[2,"**Lala Lajpat Rai** and **Ajit Singh** in **Punjab**,"],[2,"**Syed Haider Raza** in **Delhi**, and"],[2,"**Chidambaram Pillai** in **Madras**."]],"p":52,"b":0},{"i":"k0277","k":1,"t":"Expansion of the Movement and New Forms of Struggle","a":["",""],"n":[[1,"**Extremists** wanted to **expand the movement nationally, extend the boycott** to all forms of associations (government services, law courts, legislative councils), and pursue **Swaraj**."],[1,"Meeting in **Benaras in 1905 – with Gokhale as president – the congress party** in its resolution condemned the partition of Bengal and approved the anti-partition Swadeshi movement of Bengal."]],"p":52,"b":0},{"i":"k0278","k":1,"t":"Expansion of the Movement and New Forms of Struggle","a":[""],"n":[[1,"The extremists led by **Tilak, Lala Lajpat Rai, BC Pal and Aurobindo Ghosh** wanted"],[2,"the movement to **spread outside Bengal**"],[2,"the boycott to **extend beyond foreign goods** and include all forms of associations – like government services, law courts, legislative councils, and"],[2,"to launch a **full-fledged mass struggle** with an aim to attain Swaraj."]],"p":52,"b":0},{"i":"k0279","k":1,"t":"Expansion of the Movement and New Forms of Struggle","a":["","","",""],"n":[[1,"At this time, the moderates dominated the congress. And they **didn’t approve either taking the movement out of Bengal or extending the boycott beyond foreign goods.**"],[1,"In Benaras session, the moderates had an upper hand. The president – Gokhale – too was one of their own."],[1,"But the next year at the **Calcutta session (1906)** – the extremists got a major headaway. There, with **Dadabhai Naoroji presiding**, the Congress passed resolutions supporting swaraj, swadeshi, boycott and national education."],[1,"**Remarkably it was for the first time that Congress declared swaraj as its goal.**"]],"p":53,"b":0},{"i":"k0280","k":1,"t":"Expansion of the Movement and New Forms of Struggle","a":["","","",""],"n":[[1,"Tilak declared, ‘Swaraj is my birth right and I shall have it,’ while Aurobindo held political freedom as the ‘lifebreath of a nation.’"],[1,"The extremists were thus able to transform the primary issue of Bengal partition into a demand for national liberty."],[1,"New methods included boycotting **foreign goods** (including **foreign-made salt and sugar**), public burnings of foreign cloth, and refusal of services involving foreign items (washermen, priests)."],[1,"**Volunteer Corps (Samitis)** like **Ashwini Kumar Dutt's Swadesh Bandhab Samiti** in **Barisal** mobilized masses, organizing community work, magic lantern lectures, and relief efforts."]],"p":53,"b":0},{"i":"k0281","k":1,"t":"Expansion of the Movement and New Forms of Struggle","a":["",""],"n":[[1,"In **Tamil Nadu, V.O. Chidambaram Pillai, Subramania Siva**, and others formed the **Swadeshi Sangam**."],[1,"Festivals like **Tilak's Ganpati** and **Shivaji** celebrations were used to communicate political messages and reach the masses."]],"p":53,"b":0}]},{"t":"Emphasis on Self-Reliance and Indigenous Development","p":53,"c":[{"i":"k0282","k":1,"t":"Emphasis on Self-Reliance and Indigenous Development","a":["","","",""],"n":[[1,"The movement emphasized **Atma-Shakti** (self-reliance), encouraging confidence, social regeneration, and eradication of social injustices like **casteism, dowry system**, and **liquor consumption**."],[1,"Educational initiatives included establishing the **Bengal National College** with **Aurobindo Ghosh** as principal and forming the **National Council of Education** in **August 1906** to impart education on national lines under Indian oversight."],[1,"Indigenous enterprises emerged, such as textile mills, soap and match factories, tanneries, banks, and insurance companies."],[1,"**V.O. Chidambaram Pillai's Swadeshi Steam Navigation Company** in **Tamil Nadu** challenged British monopolies by competing with British shipping companies."]],"p":53,"b":0}]},{"t":"Cultural Impact and Artistic Revival","p":53,"c":[{"i":"k0283","k":1,"t":"Cultural Impact and Artistic Revival","a":["",""],"n":[[1,"Patriotic songs by **Rabindranath Tagore (\"Amar Sonar Bangla\"), Rajnikant Sen**, **Dwijendralal Ray, Syed Abu Mohammed**, and **Subramania Bharati (\"Sudesha Geetham**\") inspired many."],[1,"Artists like **Abanindranath Tagore, Nandalal Bose**, and others revolutionized Indian painting by drawing inspiration from **Ajanta, Mughal**, and **Rajput** styles, breaking away from **Victorian naturalism.**"]],"p":54,"b":0}]},{"t":"The spoiler of reforms","p":54,"c":[{"i":"k0284","k":1,"t":"The spoiler of reforms","a":["","","",""],"n":[[1,"In the meantime, the government announced its decision to initiate reforms soon – carrying it out through **Morley Minto Reforms of 1909.**"],[1,"The moderates were much **pacified** by the announcement. They even saw in it an opportunity to realize their wish of greater Indian participation in the administration."],[1,"So in order to appease the British, they toned down the far-reaching resolutions passed at the Calcutta session."],[1,"The **extremists abhorred** this u-turn by moderates. They considered the **moderates to be a drag on the movement.**"]],"p":54,"b":0},{"i":"k0285","k":1,"t":"The spoiler of reforms","a":["","","",""],"n":[[1,"With these deep-seated differences, the **Congress convened its 1907 session in Surat.**"],[1,"The extremists wanted **either Tilak or Lala Lajpat Rai** to become the Congress president."],[1,"Further, they sought the **reiteration of the earlier resolutions on Swadeshi, boycott and national education.**"],[1,"The moderates were **not willing to accommodate any demand** made by the extremists."]],"p":54,"b":0},{"i":"k0286","k":1,"t":"The spoiler of reforms","a":["","","","",""],"n":[[1,"By convening the **Congress session of 1907 in Surat – then in Bombay province – they had already pre-empted the possibility of Tilak becoming the president.** The charter of the congress party prohibited anyone from the host province to become its president."],[1,"And when the session convened, the moderates forced their way through."],[1,"They were able to get the moderate **Ras Behari Ghosh – different from Ras Bihari Bose – elected as the president.**"],[1,"They even **went back on the earlier resolutions regarding swadeshi, boycott and national education.**"],[1,"Abuses were hurled, chappals were thrown, culminating into a split between the moderates and extremists."]],"p":54,"b":0}]},{"t":"The rulers re-evaluate","p":54,"c":[{"i":"k0287","k":1,"t":"The rulers re-evaluate","a":["","","",""],"n":[[1,"From early on, the **government had been hostile to the congress party** – even in its moderate phase."],[1,"But with the swadeshi movement, **when the militants began to dominate the nationalist agitation, the British changed their attitude.**"],[1,"They now **sought to pacify the moderates with reforms**, isolate the extremists, and then heavily repress them."],[1,"For the British recognised that the **extremists were much more dangerous** to their rule than the moderates."]],"p":55,"b":0},{"i":"k0288","k":1,"t":"The rulers re-evaluate","a":["","","","",""],"n":[[1,"And that’s why when the **news of Surat split reached their ears**, the British were delighted."],[1,"They had finally found the opportunity to work out their plan of repression."],[1,"New laws were brought about to check anti-government activity. These included the **Seditious Meetings Act, Indian Newspapers Act, Criminal Law Amendment act, Indian Press Act.**"],[1,"The government tried **Tilak for sedition, declared him guilty, and in 1909 sent him to a jail in Mandalay (Burma) for six years.**"],[1,"**Aurobindo and BC Pal retired from active politics, while Lala Lajpat Rai went abroad.**"]],"p":55,"b":0}]},{"t":"Decline of the Swadeshi Movement and Rise of Revolutionary Activities","p":55,"c":[{"i":"k0289","k":1,"t":"Decline of the Swadeshi Movement and Rise of Revolutionary Activities","a":["","","",""],"n":[[1,"By **1908**, the **open phase of the Swadeshi Movement declined** due to heavy government repression, lack of organizational structure, leader absences, internal splits, and limited reach to the **peasantry**."],[1,"**Students** participated actively, boycotting foreign goods and facing reprisals like disqualification from jobs and fines."],[1,"**Urban middle-class women** joined in picketing and processions."],[1,"Strikes occurred in **jute and cotton mills** and the **Indian Railways**."]],"p":55,"b":0},{"i":"k0290","k":1,"t":"Decline of the Swadeshi Movement and Rise of Revolutionary Activities","a":["","",""],"n":[[1,"**Muslim participation** was low, as leaders like **Nawab Salimullah of Dacca** supported the partition, favoring a Muslim-majority **East Bengal**."],[1,"Left leaderless, many youths turned to **revolutionary activities**, adopting the **\"cult of the bomb\"** and forming **secret societies**."],[1,"Influenced by **Russian nihilists** and **Irish nationalists**, they aimed to challenge British rule through violent means, believing that individual heroic acts could inspire mass uprising."]],"p":55,"b":0}]},{"t":"Revolutionary Activities and Key Figures","p":55,"c":[{"i":"k0291","k":1,"t":"Revolutionary Activities and Key Figures","a":["","","",""],"n":[[1,"**Vasudeva Balwant Phadke** from **Bombay** established the first secret society aiming for armed revolt."],[1,"The **Chapekar brothers** formed **Vyayam Mandal** in **1896-97**, assassinating British officials in **Poona**."],[1,"**V.D. Savarkar** founded **Abhinav Bharat** in **1904**, Bombay's first organized revolutionary society."],[1,"In **Bengal, Jnanendranath Basu** organized a revolutionary group in **Midnapore** in **1902**; later, **Promotha Mitter** and **Barindra Kumar Ghosh** set up the **Anushilan Samiti**."]],"p":56,"b":0},{"i":"k0292","k":1,"t":"Revolutionary Activities and Key Figures","a":["","","",""],"n":[[1,"Publications like **\"Yugantar\"** (started by **Barindra Kumar Ghosh** and **Bhupendranath Dutta**) promoted the motto \"**force must be stopped by force**\"."],[1,"**Ras Behari Bose** organized revolutionaries in **Uttar Pradesh** and **Delhi**."],[1,"In **Punjab, Ajit Singh** (uncle of **Bhagat Singh**) and **Lala Lajpat Rai** were active; **Ajit Singh** set up the extremist **Anjuman-i-Mohisban-i-Watan** in **Lahore** with its journal **Bharat Mata**."],[1,"**Sachin Sanyal** and **Sundarlal** led activities in **Benaras**, including assassinations of oppressive officials and fundraising through dacoities."]],"p":56,"b":0}]},{"t":"Notable Revolutionary Incidents","p":56,"c":[{"i":"k0293","k":0,"t":"Notable Revolutionary Incidents","a":["1907","1908","","1909"],"n":[[1,"**1907**: An unsuccessful attempt was made on the life of the **Lieutenant-Governor of Bengal; Allen**, the District Magistrate of **Dacca**, was killed in December."],[1,"**1908: Prafulla Chaki** and **Khudiram Bose** attempted to bomb **Judge Kingsford** in **Muzaffarpur**, resulting in the deaths of two European women. Chaki committed suicide; Bose was tried and hanged."],[1,"The government cracked down on the **Anushilan Samiti**, leading to the **Alipore Conspiracy Case** (also known as the **Manicktolla Bomb Conspiracy**), involving the **Ghosh brothers (Aurobindo** and **Barindra**)."],[1,"**1909: Anant Lakshman Kanhere** assassinated the District Magistrate of **Nashik** and was sentenced to death."]],"p":56,"b":1},{"i":"k0294","k":0,"t":"Notable Revolutionary Incidents","a":["1909","1912"],"n":[[1,"**1909: Madan Lal Dhingra** assassinated **Curzon-Wylie** in **London**."],[1,"**1912: Ras Behari Bose** and **Sachin Sanyal** attempted to assassinate **Viceroy Lord Hardinge**, wounding him; this led to the **Delhi Conspiracy Trial**."]],"p":56,"b":0}]},{"t":"Bagha Jatin and the Indo-German Conspiracy","p":56,"c":[{"i":"k0295","k":1,"t":"Bagha Jatin and the Indo-German Conspiracy","a":["","",""],"n":[[1,"**Jatindranath Mukherjee (\"Bagha Jatin**\") was a fierce revolutionary who led **Jugantar**, the western wing of the **Anushilan Samiti**."],[1,"During **World War I**, he planned an armed uprising against the British with support from **Germany**, collaborating with **Ras Behari Bose** and **M.N. Roy**."],[1,"The plan was leaked; in the **Battle of Balasore, Bagha Jatin** was severely wounded and died the next day."]],"p":56,"b":0}]},{"t":"Revolutionary Activities Abroad","p":57,"c":[{"i":"k0296","k":1,"t":"Revolutionary Activities Abroad","a":["","","",""],"n":[[1,"Due to suppression in India, revolutionaries operated from abroad."],[1,"In **London, Shyamji Krishnavarma** started the **Indian Home Rule Society (\"India House**\"), provided scholarships to radical Indian youth, and published **\"The Indian Sociologist\"**."],[1,"In **Paris, Madam Bhikaji Cama** established contacts with French socialists, published **\"Bande Mataram\"**, and operated with **Ajit Singh**. Madam Bhikaji Cama unfurled India’s **tricolor flag of freedom at “Stuttgart”** in Germany. She is regarded as **“Mother of Indian Revolution.”**"],[1,"In **Berlin, Virendranath Chattopadhyaya** was active in revolutionary activities."]],"p":57,"b":0}]},{"t":"The Ghadar Movement","p":57,"c":[{"i":"k0297","k":1,"t":"The Ghadar Movement","a":["","",""],"n":[[1,"The **Ghadar Party** was founded in **1913** in **San Francisco**, with **Lala Hardayal** as the leader."],[1,"Comprised mainly of **ex-soldiers** and **peasants** who had migrated to the **USA** and **Canada** seeking better jobs."],[1,"Prior activities included efforts by **Ramdas Puri, G.D. Kumar, Taraknath Das, Sohan Singh Bhakna**, and **Lala Hardayal**, who had set up the **Swadesh Sevak Home** in **Vancouver** and the **United India House** in **Seattle**."]],"p":57,"b":0},{"i":"k0298","k":1,"t":"The Ghadar Party published the newspaper \"The Ghadar\", aiming to","a":[],"n":[[2,"Assassinate officials."],[2,"Publish revolutionary and anti-imperialist literature."],[2,"Work among Indian troops serving abroad."],[2,"Procure arms and initiate a simultaneous revolt in all British colonies."]],"p":57,"b":0}]}]},{"n":11,"t":"Socio-Religious Reform","d":"Brahmo to Theosophy — reformers, caste, women, Muslim and Sikh reform","e":"1815 – 1920s","p":57,"s":[{"t":"Reform Movements in 19th Century India","p":57,"c":[{"i":"k0299","k":0,"t":"Reform Movements in 19th Century India","a":["Emergence of Social Reforms","Reaction to British Rule","Awareness of Weaknesses","Diverse Responses"],"n":[[1,"**Emergence of Social Reforms**: In the **early 19th century**, enlightened Indians sought to **reform Indian society** due to prevailing **religious and social ills** like superstitions, **infanticide, child marriage, polygamy, sati, casteism**, and other social vices."],[1,"**Reaction to British Rule**: The portrayal of **British culture** as superior led to a desire to **reinvigorate traditional Indian culture** and institutions."],[1,"**Awareness of Weaknesses**: Encounters with **modern Western culture** and colonization highlighted weaknesses in indigenous culture and social structures."],[1,"**Diverse Responses**: While some, like the **Derozians**, developed a revulsion for indigenous culture, there was a shared belief in the need to **reform social and religious life**."]],"p":57,"b":0}]},{"t":"Leaders and Ideologies","p":58,"c":[{"i":"k0300","k":0,"t":"Leaders and Ideologies","a":["Indian Intelligentsia","Common Ideological Threads"],"n":[[1,"**Indian Intelligentsia**: Led by the **newly emerging middle class** and **educated intellectuals** (both **Western-educated** and **traditionally educated**), including professionals in **government service, law, education, journalism**, and **medicine**."],[1,"**Common Ideological Threads**: Movements shared ideologies centered around **rationalism, religious universalism**, and **humanism**."]],"p":58,"b":0}]},{"t":"Rationalism in Reform","p":58,"c":[{"i":"k0301","k":1,"t":"Rationalism in Reform","a":["","","",""],"n":[[1,"**Principle of Causality**: Reformers like **Raja Rammohan Roy** argued that truth must be demonstrable."],[1,"**Akshay Kumar Dutt** proclaimed **\"rationalism is our only preceptor\"**, understanding phenomena through mechanical processes."],[1,"**Swami Vivekananda** insisted religion justify itself using scientific methods."],[1,"References to past scriptures (e.g., **Ishwar Chandra Vidyasagar** citing **Vedic texts** for widow remarriage) were used as aids, not for complete revival or rupture from tradition."]],"p":58,"b":0}]},{"t":"Religious Universalism and Humanism","p":58,"c":[{"i":"k0302","k":0,"t":"Religious Universalism and Humanism","a":["Underlying Unity of Religions","",""],"n":[[1,"**Underlying Unity of Religions: Rammohan Roy** viewed different religions as national embodiments of **universal theism**."],[1,"**Syed Ahmed Khan** believed all prophets shared the same **din** (faith), despite national differences."],[1,"Emphasis on **moral values** and **equal worth of all individuals** highlighted the **humanistic** aspect of reforms."]],"p":58,"b":0}]},{"t":"Evolution of Reform Movements","p":58,"c":[{"i":"k0303","k":0,"t":"Evolution of Reform Movements","a":["","Leadership Transition","National Movement's Role"],"n":[[1,"**Shift from Religious to Secular Focus**: Initially targeting religious aspects, movements gradually acquired a **secular character**."],[1,"**Leadership Transition**: From individual reformers like **Jyotiba Phule, Gopalhari Deshmukh, KT Telang, BM Malabari, DK Karve, Sri Narayana Guru, EV Ramaswami Naicker, Ambedkar**, to organizations like **Social Conference, Servants of India Society**, and **Christian missionaries**."],[1,"**National Movement's Role**: From the **20th century onwards**, the **national movement** provided leadership for social reform."]],"p":58,"b":0}]},{"t":"Women's Plight and Reforms","p":59,"c":[{"i":"k0304","k":0,"t":"Women's Plight and Reforms","a":["Oppression of Women","Identity Issues","Reform Efforts"],"n":[[1,"**Oppression of Women**: In **19th century India**, women faced denial of **education**, inability to inherit **property**, and were subjected to **purdah, early marriage, sati**, and prohibition of **widow remarriage**."],[1,"**Identity Issues**: Women lacked independent identity, seen primarily as **wives and mothers**."],[1,"**Reform Efforts**: Reformers worked tirelessly for women's betterment, leading to **reformative laws**."]],"p":59,"b":0}]},{"t":"Abolition of Sati and Infanticide","p":59,"c":[{"i":"k0305","k":0,"t":"Abolition of Sati and Infanticide","a":["Sati"],"n":[[1,"**Sati**: Practice where a widow immolated herself on her husband's pyre."],[2,"**Rammohan Roy** led agitation against it."],[2,"Declared illegal in **1829** through government regulation."]],"p":59,"b":0},{"i":"k0306","k":0,"t":"Abolition of Sati and Infanticide","a":["Infanticide"],"n":[[1,"**Infanticide**: Intentional killing of infants, mainly females."],[2,"Declared illegal through **Bengal Regulations of 1795 and 1804**."],[2,"**Act of 1870** mandated **birth registration** and verification to prevent infanticide."]],"p":59,"b":0}]},{"t":"Widow Remarriage and Rehabilitation","p":59,"c":[{"i":"k0307","k":0,"t":"Widow Remarriage and Rehabilitation","a":["Legalization"],"n":[[1,"**Legalization: Widow Remarriage Act of 1856**, due to **Ishwar Chandra Vidyasagar**'s efforts."]],"p":59,"b":0},{"i":"k0308","k":1,"t":"Advocacy","a":[],"n":[[2,"**Vishnu Shastri Pandit** founded **Widow Remarriage Association** in Bombay."],[2,"**Karsondas Mulji** started **Satya Prakash** advocating widow remarriage."],[2,"**DK Karve** married a widow (**1893**), opened a **widows' home** in Poona."]],"p":59,"b":0},{"i":"k0309","k":0,"t":"Widow Remarriage and Rehabilitation","a":["Other Leaders"],"n":[[1,"**Other Leaders: BM Malabari, Narmad, MG Ranade, Veerasalingam Pantulu**."]],"p":59,"b":0}]},{"t":"Campaign Against Child Marriage","p":59,"c":[{"i":"k0310","k":0,"t":"Campaign Against Child Marriage","a":["Historical Roots","Reevaluation","","",""],"n":[[1,"**Historical Roots**: Originated in **Vedic times**, became prevalent with **Dharmasutra** and **Dharmashastra**."],[1,"**Reevaluation**: European ideas prompted critique of **child marriage**."],[1,"**BM Malabari** led agitation against it."],[1,"**Age of Consent Act (1891)**: Prohibited marriage of girls below **12 years**."],[1,"**Sarda Act (1930)**: Raised marriageable age to **18 for boys, 14 for girls**."]],"p":59,"b":0}]},{"t":"Women's Education","p":60,"c":[{"i":"k0311","k":1,"t":"Early Initiatives","a":[],"n":[[2,"**Calcutta Female Juvenile Society** (1819) by **Christian missionaries**."],[2,"**Bethune School** founded by **JED Bethune**."]],"p":60,"b":0},{"i":"k0312","k":1,"t":"Contributions","a":[],"n":[[2,"**Ishwar Chandra Vidyasagar** associated with numerous girls' schools."],[2,"**Charles Wood's Despatch (1854)** emphasized **female education**."],[2,"In **Maharashtra, Jagannath Shankar Seth** and **Bhau Daji** promoted girls' schools."],[2,"**Maharshi DK Karve** established **Indian Women's University** (1916)."],[2,"**Lady Hardinge Medical College** founded in **1916**."]],"p":60,"b":0}]},{"t":"Caste Discrimination and Reforms","p":60,"c":[{"i":"k0313","k":0,"t":"Caste Discrimination and Reforms","a":["Prevalence of Caste System"],"n":[[1,"**Prevalence of Caste System: Dalits** faced severe discrimination in education, land ownership, profession, and social rights."]],"p":60,"b":0},{"i":"k0314","k":1,"t":"British Influence: Unintentionally weakened caste structures through","a":[],"n":[[2,"Creation of **private property** and free land sale."],[2,"**Urbanization**, modern commerce, and new transportation."],[2,"Introduction of **equality before law**."],[2,"Opening **administrative services** to all castes."]],"p":60,"b":0},{"i":"k0315","k":1,"t":"Indigenous Efforts","a":[],"n":[[2,"Organizations like **Brahmo Samaj, Prarthana Samaj, Arya Samaj, Ramakrishna Mission, Theosophists**, and individuals like **Jyotiba Phule** worked towards caste reform."],[2,"**Arya Samaj** promoted a merit-based **Chaturvarna system**."],[2,"**Jyotiba Phule** emphasized education for **lower castes** and **girls**, opened schools."]],"p":60,"b":0}]},{"t":"Ambedkar and the Annihilation of Caste","p":60,"c":[{"i":"k0316","k":1,"t":"Ambedkar and the Annihilation of Caste","a":["","","","",""],"n":[[1,"**Babasaheb Ambedkar** condemned caste hierarchy, advocating for **'Annihilation of Caste'**."],[1,"Founded **Bahishkrit Hitakarini Sabha** (1924): Motto **'Educate, Agitate and Organise'**."],[1,"Led **Mahad Satyagraha** (1927) to allow Dalits access to public water."],[1,"Burned the **Manusmriti** as a protest."],[1,"Formed **All India Scheduled Castes Federation** (1942)."]],"p":60,"b":0}]},{"t":"Gandhi and the Congress Party's Role","p":61,"c":[{"i":"k0317","k":1,"t":"Gandhi's Efforts","a":[],"n":[[2,"Founded **All India Anti Untouchability League** (1932), later **Harijan Sevak Sangh**."],[2,"Worked for Dalits' access to **public places**."],[2,"Promoted **inter-dining** and **inter-caste marriages**."]],"p":61,"b":0},{"i":"k0318","k":1,"t":"Congress Initiatives","a":[],"n":[[2,"Introduced **free education** for Dalits in provinces (post-1937)."]],"p":61,"b":0},{"i":"k0319","k":1,"t":"Southern Movements","a":[],"n":[[2,"**Self-Respect Movement** by **EV Ramaswamy Naicker**."],[2,"Efforts of **Sri Narayana Guru** in Kerala."]],"p":61,"b":0}]},{"t":"Reformist vs. Revivalist Movements","p":61,"c":[{"i":"k0320","k":0,"t":"Reformist vs. Revivalist Movements","a":["Reformist Movements"],"n":[[1,"**Reformist Movements**: Aimed at modernizing society without heavy reliance on past traditions."],[2,"Examples: **Brahmo Samaj, Prarthana Samaj, Aligarh Movement**."]],"p":61,"b":0},{"i":"k0321","k":0,"t":"Reformist vs. Revivalist Movements","a":["Revivalist Movements"],"n":[[1,"**Revivalist Movements**: Sought to revive and purify ancient traditions."],[2,"Examples: **Arya Samaj, Deoband Movement**."]],"p":61,"b":0}]},{"t":"Key Reform Movements and Leaders","p":61,"c":[{"i":"k0322","k":1,"t":"Raja Rammohan Roy and Brahmo Samaj","a":[],"n":[[2,"Advocated **monotheism**, opposed **idolatry** and **social evils**."],[2,"Founded **Atmiya Sabha** (1814) and **Brahmo Samaj** (1828)."],[2,"Worked against **sati**, promoted **women's rights** and **education**."],[2,"Published journals: **Sambad Kaumudi, Mirat-Ul-Akhbar**."]],"p":61,"b":0},{"i":"k0323","k":1,"t":"Debendranath Tagore","a":[],"n":[[2,"Joined Brahmo Samaj (**1842**), revitalized it."],[2,"Founded **Tattwabodhini Sabha (1839**), propagated **Vedanta**."],[2,"Opposed **Christian missionary** criticism."],[2,"Supported **social reforms** like widow remarriage, women's education."]],"p":61,"b":0},{"i":"k0324","k":1,"t":"Keshab Chandra Sen","a":[],"n":[[2,"Expanded Brahmo Samaj beyond Bengal."],[2,"Established **'Bharatvarshiya Brahmo Samaj' (1866**)."],[2,"Controversies led to formation of **Sadharan Brahmo Samaj (1878**)."]],"p":61,"b":0},{"i":"k0325","k":1,"t":"Henry Vivian Derozio and Young Bengal","a":[],"n":[[2,"Promoted **free thinking**, rationalism, inspired by **French Revolution**."],[2,"Led to **Young Bengal Movement**, advocating for social and political reforms."],[2,"Despite progressive ideas, failed to connect with the **masses**."]],"p":62,"b":0},{"i":"k0326","k":1,"t":"Ishwar Chandra Vidyasagar","a":[],"n":[[2,"Simplified **Bengali prose**, reformed **Sanskrit education**."],[2,"Campaigned for **widow remarriage**, leading to its legalization (**1856**)."],[2,"Promoted **women's education**, associated with **35 girls' schools**."]],"p":62,"b":0}]},{"t":"Reform Movements in Maharashtra","p":62,"c":[{"i":"k0327","k":1,"t":"Paramhansa Mandali","a":[],"n":[[2,"Established (**1849**) by **Durgaram Mehtaji, Dadoba Pandurang**."],[2,"Promoted **monotheism, women's education, widow remarriage**, broke caste rules."]],"p":62,"b":0},{"i":"k0328","k":1,"t":"Prarthana Samaj","a":[],"n":[[2,"Founded (**1867**) by **Dadoba** and **Atmaram Pandurang**."],[2,"Influenced by **Keshab Chandra Sen**, leaders included **MG Ranade, RG Bhandarkar**."],[2,"Focused on **social and cultural reforms** over religious reform."]],"p":62,"b":0},{"i":"k0329","k":1,"t":"Balshastri Jambhekar","a":[],"n":[[2,"Known as **'Father of Marathi Journalism'**."],[2,"Started **Darpan (1832**), advocated for **social awareness**."]],"p":62,"b":0},{"i":"k0330","k":1,"t":"Jyotiba Phule and Satyashodhak Samaj","a":[],"n":[[2,"Criticized **caste oppression, Brahmanical dominance**."],[2,"Founded **Satyashodhak Samaj (1873**), promoted **education** for lower castes and **girls**."],[2,"Opened schools, homes for widows."]],"p":62,"b":0},{"i":"k0331","k":1,"t":"Gopalhari Deshmukh ('Lokahitawadi')","a":[],"n":[[2,"Advocated **rational, secular** societal reorganization."],[2,"Wrote in **Prabhakar**, started **Hitechu**, contributed to **Gyan Prakash, Indu Prakash**."]],"p":62,"b":0},{"i":"k0332","k":1,"t":"Gopal Ganesh Agarkar","a":[],"n":[[2,"Educationist, co-founded **Deccan Education Society, Fergusson College**."],[2,"Edited **Kesari**, started **Sudharak** advocating against **untouchability, caste system**."]],"p":62,"b":0},{"i":"k0333","k":1,"t":"Gopal Krishna Gokhale and Servants of India Society","a":[],"n":[[2,"Founded **Servants of India Society (1905**) to train workers for **national service**."],[2,"Published **Hitavada (1911**)."]],"p":62,"b":0},{"i":"k0334","k":1,"t":"Narayan Malhar Joshi and Social Service League","a":[],"n":[[2,"Founded **Social Service League (1911**) to alleviate **mass suffering**."],[2,"Co-founded **All India Trade Union Congress (1920**)."]],"p":63,"b":0}]},{"t":"Other Reform Movements","p":63,"c":[{"i":"k0335","k":1,"t":"Dayananda Saraswati and Arya Samaj","a":[],"n":[[2,"Founded **Arya Samaj (1875**), advocated **'Back to the Vedas'**."],[2,"Opposed **idolatry, untouchability, child marriage**."],[2,"Promoted **education** through **Dayanand Anglo-Vedic (DAV) schools**."],[2,"Initiated **Shuddhi Movement** to reconvert people to Hinduism."]],"p":63,"b":0},{"i":"k0336","k":1,"t":"BM Malabari and Seva Sadan","a":[],"n":[[2,"Parsi reformer, founded **Seva Sadan (1908**)."],[2,"Campaigned against **child marriage**, leading to **Age of Consent Act (1891)**."]],"p":63,"b":0},{"i":"k0337","k":1,"t":"SNDP Movement","a":[],"n":[[2,"Led by **Sree Narayana Guru** for **Ezhavas** in Kerala."],[2,"Established **Sivalinga** at **Aruvippuram (1888**)."],[2,"Promoted equality, access to **education, public services**."]],"p":63,"b":0},{"i":"k0338","k":1,"t":"Justice Movement","a":[],"n":[[2,"Formed **South Indian Liberal Federation (1916**) by **CN Mudaliar, TM Nair, P Tyagaraja**."],[2,"Aimed for better representation of **non-Brahmins**."],[2,"Led to **Dravidian Movement**."]],"p":63,"b":0},{"i":"k0339","k":1,"t":"Periyar and Self-Respect Movement","a":[],"n":[[2,"**EV Ramaswamy Naicker** started **Self-Respect Movement (1925**)."],[2,"Opposed **Brahmanical dominance**, promoted **rationalism, equality**."],[2,"Advocated for an independent **Dravida Nadu**."]],"p":63,"b":0},{"i":"k0340","k":1,"t":"Temple Entry Movements","a":[],"n":[[2,"**Vaikom Satyagraha (1924**) in Kerala led by **KP Kesava**."],[2,"**Guruvayur Satyagraha (1931**) led by **K Kelappan, Subramaniyam Tirumambu**."],[2,"Demanded Dalits' access to **temples**."]],"p":63,"b":0},{"i":"k0341","k":1,"t":"Indian Social Conference","a":[],"n":[[2,"Founded (**1887**) by **MG Ranade, Raghunath Rao**."],[2,"Social reform wing of **INC**, opposed **polygamy**, promoted **inter-caste marriages**, launched **Pledge Movement** against **child marriage**."]],"p":63,"b":0}]},{"t":"Muslim Reform Movements","p":63,"c":[{"i":"k0342","k":1,"t":"Wahabi/Waliullah Movement","a":[],"n":[[2,"Inspired by **Abdul Wahab** and **Shah Walliullah**."],[2,"Called for return to **pure Islam**, reconciliation among **Muslim jurisprudence schools**."],[2,"Later led by **Syed Ahmed Barelvi**, became politically active against British."]],"p":64,"b":0},{"i":"k0343","k":1,"t":"Titu Mir's Movement","a":[],"n":[[2,"**Titu Mir** adopted **Wahhabism**, led Muslim peasants against **landlords** and **British planters** in Bengal."]],"p":64,"b":0},{"i":"k0344","k":1,"t":"Faraizi Movement","a":[],"n":[[2,"Founded by **Haji Shariatullah (1818**), emphasized religious duties (**Faraiz**)."],[2,"Under **Dadu Mian**, became revolutionary against **Zamindars** and **British**."]],"p":64,"b":0},{"i":"k0345","k":1,"t":"Ahmadiyya Movement","a":[],"n":[[2,"Founded by **Mirza Ghulam Ahmad** (1835-1908), claimed to be the **Promised Mahdi** and **Messiah**."],[2,"Aimed for **Mohammedan Renaissance**, universal religion, morality, peace, justice."]],"p":64,"b":0},{"i":"k0346","k":1,"t":"Sir Syed Ahmed Khan and Aligarh Movement","a":[],"n":[[2,"Social reformer, educationist, loyal to British."],[2,"Founded **Mohammadan Anglo-Oriental College (1875**), later **Aligarh Muslim University**."],[2,"Published **Tahdhib-ul-Akhlaq**."],[2,"Advocated for **Western education**, opposed **purdah, polygamy**."],[2,"Later proposed **'Two Nation Theory'**, pioneering **Muslim nationalism**."]],"p":64,"b":0},{"i":"k0347","k":1,"t":"Deoband Movement","a":[],"n":[[2,"Founded **Darul Uloom** in **Deoband (1866**)."],[2,"Sought to spread pure teachings of **Quran** and **Hadith**."],[2,"Opposed British rule, supported **national unity**."]],"p":64,"b":0}]},{"t":"Parsi and Sikh Reform Movements","p":64,"c":[{"i":"k0348","k":1,"t":"Rehnumai Mazdayasan Sabha","a":[],"n":[[2,"Founded (**1851**) by progressive Parsis like **Dadabhai Naoroji**."],[2,"Aimed to reform **Zoroastrianism**, promoted women's rights."]],"p":64,"b":0},{"i":"k0349","k":1,"t":"Singh Sabha Movement","a":[],"n":[[2,"Launched (**1873**) to revitalize **Sikhism**, counter proselytization."],[2,"Established **Khalsa schools**, promoted **education**."]],"p":64,"b":0},{"i":"k0350","k":1,"t":"Akali Movement","a":[],"n":[[2,"Offshoot of Singh Sabha, sought control of **Gurudwaras** from corrupt mahants."],[2,"Led to **Sikh Gurudwaras Act (1922**), formation of **Shiromani Gurudwara Prabandhak Committee (SGPC)**."]],"p":64,"b":0}]},{"t":"The Theosophical Movement","p":65,"c":[{"i":"k0351","k":1,"t":"The Theosophical Movement","a":["","","","",""],"n":[[1,"Founded (**1875**) by **Madame Blavatsky** and **Colonel Olcott** in New York."],[1,"Moved headquarters to **Adyar**, Madras (**1882**)."],[1,"Believed in **incarnation, Karma**, universal brotherhood."],[1,"Influenced by **Vedanta, Samkhya, Yoga**."],[1,"**Annie Besant** became president (**1907**), promoted Indian culture, self-respect among Indians."]],"p":65,"b":0}]},{"t":"Evaluation of Reform Movements","p":65,"c":[{"i":"k0352","k":1,"t":"Positive Aspects","a":[],"n":[[2,"Avoided **downright Westernization**, aimed for modernization."],[2,"Used scriptures to support reforms (e.g., **Vidyasagar** citing **Vedas** for widow remarriage)."]],"p":65,"b":0},{"i":"k0353","k":1,"t":"Limitations","a":[],"n":[[2,"Had a **narrow social base**, mostly **educated urban middle class**."],[2,"Heightened **religious consciousness**, later contributing to communalism."],[2,"Selectively highlighted past, undermining aspects like **art, architecture**, **literature, science, technology**."]],"p":65,"b":0}]}]},{"n":12,"t":"The Gandhian Era 1915–1934","d":"Champaran to Poona Pact — NCM, CDM, Round Tables, GoI Act 1935","e":"1915 – 1934","p":65,"s":[{"t":"Prelude to Gandhi and the Rise of Indian Nationalism","p":65,"c":[{"i":"k0354","k":1,"t":"Prelude to Gandhi and the Rise of Indian Nationalism","a":[""],"n":[[1,"**Indian Support in World War I**: Indian leaders of various ideologies supported the **British during World War I (1914-1918)**, believing it would lead to **political concessions** post-war."],[2,"**Massive Contribution**: India contributed over **one million troops** and significant financial resources."],[2,"**Post-War Economic Hardships**:"],[3,"**Industries** faced rising production costs amid a **recession**."],[3,"**Workers and Artisans** suffered from unemployment and high prices."],[3,"**Peasants** endured high taxation and deepening poverty."],[3,"**Educated Urban Class** grappled with unemployment and growing awareness of **British racism**."],[2,"**Charged Atmosphere**: The entire nation felt **impatient and disillusioned** due to unmet expectations."]],"p":65,"b":0}]},{"t":"Challenging Colonial Myths","p":66,"c":[{"i":"k0355","k":0,"t":"Challenging Colonial Myths","a":["Myth of British Invincibility"],"n":[[1,"**Myth of British Invincibility**: The British rule rested on two myths:"],[2,"**British Invincibility**."],[2,"**Indian Incapacity for Self-Rule**."]],"p":66,"b":0},{"i":"k0356","k":0,"t":"Erosion of Myths","a":[],"n":[[2,"**World War I Propaganda**: Both Allied and Central Powers exposed each other's **colonial atrocities**."],[2,"**Returning Soldiers**: Indian soldiers shared experiences that diminished the fear of British might."],[2,"**Russian Revolution (1917)**: The success of the **Bolsheviks** demonstrated that masses could overthrow powerful regimes."]],"p":66,"b":0}]},{"t":"Failed British Promises and Gandhi's Emergence","p":66,"c":[{"i":"k0357","k":0,"t":"Failed British Promises and Gandhi's Emergence","a":["Broken Promises"],"n":[[1,"**Broken Promises**: Despite expectations, the British offered only the **Montagu-Chelmsford Reforms (Government of India Act, 1919)**, which were seen as inadequate."],[2,"**Congress Reaction**: Declared the reforms **\"disappointing\"** and **\"unsatisfactory\"**; **Tilak** called it a **\"sunless dawn\"**."]],"p":66,"b":0},{"i":"k0358","k":0,"t":"Rowlatt Act (1919)","a":[],"n":[[2,"**Repressive Measures**: Allowed arrests without warrant, indefinite detention without trial, and trial without jury."],[2,"**Public Outrage**: Seen as a betrayal, leading to widespread anger."]],"p":66,"b":0},{"i":"k0359","k":0,"t":"Failed British Promises and Gandhi's Emergence","a":["Gandhi's Entry"],"n":[[1,"**Gandhi's Entry**: In this charged environment, **Mohandas Karamchand Gandhi** emerged as a new leader offering hope."]],"p":66,"b":0}]},{"t":"Gandhi's Background and Early Activism","p":66,"c":[{"i":"k0360","k":0,"t":"Early Life","a":[],"n":[[2,"**Birth**: Born in **1869** in **Porbandar, Gujarat**."],[2,"**Education**: Studied law in **England**."]],"p":66,"b":0},{"i":"k0361","k":1,"t":"South Africa (1893-1914)","a":[],"n":[[2,"**Experience with Racism**: Shocked by blatant **racial discrimination** against Indians."],[2,"**Indian Community**:"],[3,"**Indentured Laborers**: Mainly from South India, working on sugar plantations."],[3,"**Merchants**: Mainly **Memon Muslims**."],[3,"**Ex-Indentured Laborers**: Those who stayed after contracts ended."],[2,"**Activism**:"],[3,"Founded the **Natal Indian Congress (1894**) to unite Indians."],[3,"Started the newspaper **Indian Opinion**."],[3,"Initially used **moderate methods** (petitions, memorials), which were ineffective."],[2,"**Discovery of Satyagraha**:"],[3,"Developed the method of **Satyagraha (passive resistance)** based on **truth** and **non-violence**."],[3,"Led successful campaigns against discriminatory laws, convincing him of the masses' potential."]],"p":66,"b":0}]},{"t":"Gandhi's Return to India and Early Movements","p":67,"c":[{"i":"k0362","k":0,"t":"Gandhi's Return to India and Early Movements","a":["Arrival in India"],"n":[[1,"**Arrival in India**: Returned in **January 1915**."]],"p":67,"b":0},{"i":"k0363","k":1,"t":"Assessment Period","a":[],"n":[[2,"Toured India for a year to understand the **conditions of the masses**."]],"p":67,"b":0},{"i":"k0364","k":0,"t":"Political Context","a":[],"n":[[2,"**Moderates vs. Extremists**: Indian politics was divided."],[2,"**Home Rule Movement**: Led by **Tilak** and **Annie Besant**."]],"p":67,"b":0},{"i":"k0365","k":1,"t":"Early Satyagrahas","a":[],"n":[[2,"**Champaran Satyagraha (1917)**:"],[3,"**Issue**: Exploitation of peasants forced to grow **indigo** under the **tinkathia system**."],[3,"**Actions**:"],[3,"Gandhi defied authorities, leading to his first act of **civil disobedience** in India."],[3,"Abolition of the tinkathia system and partial compensation to peasants."],[3,"**Assistants: Rajendra Prasad, J.B. Kripalani, Mazhar-ul-Haq**."],[2,"**Ahmedabad Mill Strike (1918)**:"],[3,"**Issue**: Mill workers demanded a **50% wage hike** due to inflation; owners offered **20%**."],[3,"**Actions**:"],[3,"Gandhi advised workers to demand **35%**."],[3,"Undertook a **fast unto death** to support workers."],[3,"Resulted in a **35% wage increase**."],[2,"**Kheda Satyagraha (1918)**:"],[3,"**Issue**: Peasants faced crop failure and sought **revenue remission**."],[3,"**Actions**:"],[3,"Gandhi advised peasants to **withhold revenue**."],[3,"Led by **Sardar Patel** and others, the movement remained **non-violent** despite government repression."],[3,"Outcome: **Revenue suspended** for poor peasants."]],"p":67,"b":1}]},{"t":"Rowlatt Act and Jallianwala Bagh Massacre","p":68,"c":[{"i":"k0366","k":0,"t":"Rowlatt Act Opposition","a":[],"n":[[2,"**Gandhi's Response**: Called it a **\"Black Act\"**; organized a nationwide **hartal** on **April 6, 1919**."],[2,"**Protests**: Widespread, sometimes turning violent."]],"p":68,"b":0},{"i":"k0367","k":0,"t":"Punjab's Agitation","a":[],"n":[[2,"**Arrest of Leaders: Dr. Satyapal** and **Saifuddin Kitchlew** deported."],[2,"**Martial Law Imposed**: Under **General Dyer**; severe repression."]],"p":68,"b":0},{"i":"k0368","k":1,"t":"Jallianwala Bagh Massacre (April 13, 1919)","a":[],"n":[[2,"**Event**: Dyer ordered troops to fire on an unarmed crowd, killing around **1,000** people."],[2,"**Aftermath**:"],[3,"**Tagore** renounced his **knighthood**."],[3,"**Gandhi** returned the title **Kaiser-i-Hind**."],[3,"**Hunter Committee** condemned Dyer but imposed no penalties."]],"p":68,"b":0}]},{"t":"Khilafat Movement and Non-Cooperation","p":68,"c":[{"i":"k0369","k":0,"t":"Khilafat Issue","a":[],"n":[[2,"**Background**: Post-WWI dismemberment of the **Ottoman Empire** and weakening of the **Caliphate**."],[2,"**Indian Muslim Leaders: Ali brothers, Hakim Ajmal Khan, Maulana Abul Kalam Azad** initiated protests."]],"p":68,"b":0},{"i":"k0370","k":1,"t":"Gandhi's Involvement","a":[],"n":[[2,"Saw an opportunity for **Hindu-Muslim unity**."],[2,"**All India Khilafat Committee** appointed Gandhi as president."]],"p":68,"b":0},{"i":"k0371","k":1,"t":"Non-Cooperation Movement (1920-1922)","a":[],"n":[[2,"**Objectives**: Address **Punjab wrongs, Khilafat issue**, and achieve **Swaraj**."],[2,"**Methods**:"],[3,"**Boycott** of foreign goods, government schools, colleges, courts, and councils."],[3,"Promotion of **Khadi** and **indigenous industries**."],[3,"**Surrender of titles** and honors."],[2,"**Nagpur Session (1920)**:"],[3,"**Reforms in Congress**:"],[3,"Changed goal to attaining **Swaraj** through **peaceful means**."],[3,"Established a **15-member Congress Working Committee (CWC)**."],[3,"Organized provincial committees on **linguistic lines**."],[3,"Reduced membership fee to **four annas**."],[3,"**Departure of Leaders: Jinnah, Annie Besant, Surendranath Banerjee** left Congress."]],"p":68,"b":0}]},{"t":"Spread and Impact of Non-Cooperation","p":69,"c":[{"i":"k0372","k":1,"t":"Mass Participation","a":[],"n":[[2,"**Students** left government institutions; **national schools** like **Jamia Millia Islamia** and **Kashi Vidyapeeth** were established."],[2,"**Lawyers** gave up practice."],[2,"**Foreign Goods** were boycotted and burned."]],"p":69,"b":0},{"i":"k0373","k":0,"t":"Regional Variations","a":[],"n":[[2,"**Midnapore**: No-tax movement."],[2,"**Assam**: Strikes in tea plantations."],[2,"**Bihar**: Confrontations between castes."],[2,"**UP: Awadh Kisan Movement, Eka Movement**."],[2,"**Malabar: Mapillah Rebellion**, which turned communal."],[2,"**Punjab**: Sikhs agitated for control of **Gurudwaras**."]],"p":69,"b":1},{"i":"k0374","k":1,"t":"Diverse Participants","a":[],"n":[[2,"**Peasants, workers, women**, and **business class** participated."],[2,"**Hindu-Muslim Unity** was notable."]],"p":69,"b":0}]},{"t":"Chauri Chaura Incident and Suspension","p":69,"c":[{"i":"k0375","k":0,"t":"Chauri Chaura (February 1922)","a":[],"n":[[2,"**Event**: Protesters clashed with police, burned a police station, killing **22 policemen**."],[2,"**Gandhi's Reaction**: Deeply disturbed by the violence."]],"p":69,"b":0},{"i":"k0376","k":0,"t":"Suspension of Movement","a":[],"n":[[2,"**Congress Working Committee** met at **Bardoli** and decided to suspend the movement."],[2,"**Gandhi Arrested**: In March 1922, further demoralizing nationalists."]],"p":70,"b":0}]},{"t":"Emergence of Swarajists and No-Changers","p":70,"c":[{"i":"k0377","k":0,"t":"Debate within Congress","a":[],"n":[[2,"**No-Changers**: Favored continued **boycott** and focused on **constructive work**."],[3,"Leaders: **C. Rajagopalachari, Sardar Patel, Rajendra Prasad**."],[2,"**Swarajists**: Wanted to enter **legislative councils** to obstruct and expose them."],[3,"Leaders: **C.R. Das, Motilal Nehru, Ajmal Khan**."]],"p":70,"b":0},{"i":"k0378","k":1,"t":"Formation of Swaraj Party","a":[],"n":[[2,"After the **Gaya Session (1922)**, Swarajists formed the **Congress-Khilafat Swarajya Party**."]],"p":70,"b":1},{"i":"k0379","k":1,"t":"Compromise","a":[],"n":[[2,"In **1923**, both groups agreed to work under Congress while pursuing their strategies."]],"p":70,"b":0}]},{"t":"Swarajists in Legislative Councils","p":70,"c":[{"i":"k0380","k":1,"t":"Achievements","a":[],"n":[[2,"**Fiery Speeches** against colonial policies."],[2,"**Vithalbhai Patel** became **Speaker** of the Central Legislative Assembly."],[2,"Defeated the **Public Safety Bill (1928)**."]],"p":70,"b":0},{"i":"k0381","k":0,"t":"Challenges","a":[],"n":[[2,"**Internal Divisions**: Emergence of **Responsivists** who wanted to cooperate with the government."],[2,"**Death of C.R. Das (1925)**: Weakened the Swarajist faction."]],"p":70,"b":0},{"i":"k0382","k":1,"t":"End of Participation","a":[],"n":[[2,"With the declaration of **Purna Swaraj (Complete Independence)** in **1930**, Swarajists resigned from councils."]],"p":70,"b":0}]},{"t":"Simon Commission and Nehru Report","p":70,"c":[{"i":"k0383","k":0,"t":"Simon Commission (1927)","a":[],"n":[[2,"**Composition**: All-white commission without any Indian members."],[2,"**Nationwide Boycott**: Led by Congress, supported by **Hindu Mahasabha** and **Muslim League** factions."],[2,"**Protests: Lala Lajpat Rai** was fatally injured during protests."]],"p":70,"b":0},{"i":"k0384","k":1,"t":"Ch
