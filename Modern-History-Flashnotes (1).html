allenge by Birkenhead","a":[],"n":[[2,"**Secretary of State** challenged Indians to draft a **consensual constitution**."]],"p":71,"b":0},{"i":"k0385","k":1,"t":"Nehru Committee (1928)","a":[],"n":[[2,"**Chairman: Motilal Nehru**."],[2,"**Recommendations**:"],[3,"**Dominion Status** within the British Empire."],[3,"**Joint Electorates** with reserved seats for minorities."],[3,"**Fundamental Rights** and **Universal Adult Franchise**."],[3,"**Provincial Autonomy** and **Linguistic Provinces**."],[3,"**Secular State** with separation of religion and politics."]],"p":71,"b":0},{"i":"k0386","k":1,"t":"Opposition","a":[],"n":[[2,"**Young Leaders** like **Jawaharlal Nehru** and **Subhas Chandra Bose** demanded **Complete Independence**."],[2,"**Muslim League** and **Jinnah's Fourteen Points**: Rejected the Nehru Report for not accommodating their demands."]],"p":71,"b":0}]},{"t":"Towards Purna Swaraj","p":71,"c":[{"i":"k0387","k":1,"t":"Calcutta Session (1928)","a":[],"n":[[2,"Congress adopted the Nehru Report with the condition of seeking complete independence if dominion status wasn't granted in a year."]],"p":71,"b":0},{"i":"k0388","k":1,"t":"Irwin Declaration (1929)","a":[],"n":[[2,"Vague promise of dominion status without a timeline."],[2,"Announcement of a **Round Table Conference (RTC)**."]],"p":71,"b":0},{"i":"k0389","k":1,"t":"Lahore Session (1929)","a":[],"n":[[2,"**President: Jawaharlal Nehru**."],[2,"**Resolution**:"],[3,"Declared **Purna Swaraj (Complete Independence)** as the goal."],[3,"Decided to **boycott** the RTC."],[3,"Authorized the launch of a **Civil Disobedience Movement**."]],"p":71,"b":0}]},{"t":"Civil Disobedience Movement and Salt Satyagraha","p":71,"c":[{"i":"k0390","k":0,"t":"Gandhi's Eleven Demands","a":[],"n":[[2,"Included reduction of military expenditure, abolition of salt tax, and release of political prisoners."],[2,"**British Response**: No concessions."]],"p":71,"b":0},{"i":"k0391","k":0,"t":"Dandi March (March-April 1930)","a":[],"n":[[2,"**March 12, 1930**: Gandhi began a **240-mile march** from **Sabarmati Ashram** to **Dandi** with **78 followers**."],[2,"**April 6, 1930**: Broke the **salt law** by picking up salt, symbolizing defiance."]],"p":72,"b":0},{"i":"k0392","k":1,"t":"Nationwide Movement","a":[],"n":[[2,"**Salt Satyagraha** spread across India:"],[3,"**C. Rajagopalachari** led a march in **Tamil Nadu**."],[3,"**K. Kelappan** led in **Malabar**."],[3,"**Gopalbandhu Chaudhuri** in **Odisha**."],[2,"**No-Chowkidari Tax Agitation** in **Bihar**."],[2,"**Khudai Khidmatgars (Red Shirts)** under **Khan Abdul Ghaffar Khan** in **Peshawar**."]],"p":72,"b":1},{"i":"k0393","k":0,"t":"Government Repression","a":[],"n":[[2,"**Gandhi Arrested**: May 1930."],[2,"**Brutal Suppression**: Mass arrests, censorship, and violence against protesters."]],"p":72,"b":0}]},{"t":"First Round Table Conference (1930)","p":72,"c":[{"i":"k0394","k":1,"t":"Participants","a":[],"n":[[2,"**Princely States, Muslim League (Jinnah), Liberals, Dalits (Ambedkar), Sikhs**, **Justice Party, Hindu Mahasabha** sympathizers."]],"p":72,"b":0},{"i":"k0395","k":0,"t":"Outcome","a":[],"n":[[2,"Little progress due to Congress's absence."],[2,"**British Realization**: Recognized the need for Congress's participation."]],"p":72,"b":0}]},{"t":"Gandhi-Irwin Pact (1931)","p":72,"c":[{"i":"k0396","k":1,"t":"Terms of the Pact","a":[],"n":[[2,"**Government Concessions**:"],[3,"Release of political prisoners not involved in violence."],[3,"Return of confiscated properties."],[3,"Right to make salt in coastal areas."],[2,"**Congress Concessions**:"],[3,"Suspension of the **Civil Disobedience Movement**."],[3,"Participation in the **Second Round Table Conference**."]],"p":72,"b":0},{"i":"k0397","k":0,"t":"Controversies","a":[],"n":[[2,"**Bhagat Singh's Execution**: Gandhi couldn't secure commutation of his death sentence, leading to criticism."]],"p":72,"b":0}]},{"t":"Karachi Session and Fundamental Rights","p":73,"c":[{"i":"k0398","k":1,"t":"Karachi Session (March 1931)","a":[],"n":[[2,"**President: Sardar Vallabhbhai Patel**."],[2,"**Resolutions**:"],[3,"Reiterated commitment to **Purna Swaraj**."],[3,"Adopted resolutions on **Fundamental Rights** and **National Economic Programme**."]],"p":73,"b":0},{"i":"k0399","k":0,"t":"Fundamental Rights","a":[],"n":[[2,"**Civil Liberties**: Freedom of speech, press, assembly."],[2,"**Equality**: No discrimination based on caste, creed, or gender."],[2,"**Education**: Free and compulsory primary education."],[2,"**Minority Rights**: Protection of cultural and religious interests."]],"p":73,"b":0},{"i":"k0400","k":0,"t":"Economic Programme","a":[],"n":[[2,"**Land Reforms**: Reduction of rent, relief from indebtedness."],[2,"**Labor Rights**: Fair wages, right to form unions."],[2,"**State Ownership**: Control of key industries and services."]],"p":73,"b":0}]},{"t":"Second Round Table Conference (1931)","p":73,"c":[{"i":"k0401","k":0,"t":"Second Round Table Conference (1931)","a":["Congress Participation"],"n":[[1,"**Congress Participation**: Represented solely by **Gandhi**."]],"p":73,"b":0},{"i":"k0402","k":0,"t":"Challenges","a":[],"n":[[2,"**Minority Representation**: Other delegates contested Gandhi's claim to represent all Indians."],[2,"**Communal Issues**: Disagreements over separate electorates for minorities."]],"p":73,"b":0},{"i":"k0403","k":1,"t":"Outcome","a":[],"n":[[2,"**Failure to Reach Consensus**."],[2,"**British PM Ramsay MacDonald** promised a **Communal Award** if Indians couldn't agree."]],"p":73,"b":0}]},{"t":"Resumption and Suppression of Civil Disobedience","p":73,"c":[{"i":"k0404","k":1,"t":"Return to India","a":[],"n":[[2,"Gandhi resumed the **Civil Disobedience Movement**."],[2,"**Government Crackdown**:"],[3,"Gandhi and other leaders arrested."],[3,"**Repressive Measures**: Bans on Congress activities, censorship, property confiscation."]],"p":73,"b":0},{"i":"k0405","k":1,"t":"Movement's End","a":[],"n":[[2,"**Withdrawal in 1934** due to severe repression and lack of progress."]],"p":73,"b":0}]},{"t":"Communal Award and Poona Pact","p":74,"c":[{"i":"k0406","k":1,"t":"Communal Award (August 1932)","a":[],"n":[[2,"Announced by **Ramsay MacDonald**."],[2,"Granted **Separate Electorates** to minorities, including **Dalits**."]],"p":74,"b":0},{"i":"k0407","k":0,"t":"Gandhi's Opposition","a":[],"n":[[2,"Believed it would **divide Hindus** and harm Dalit interests."],[2,"**Fast unto Death**: Began in September 1932 to oppose the award."]],"p":74,"b":0},{"i":"k0408","k":1,"t":"Poona Pact (September 1932)","a":[],"n":[[2,"**Agreement** between **Gandhi** and **Ambedkar**."],[2,"**Terms**:"],[3,"Abolished separate electorates for Dalits."],[3,"Increased reserved seats for Dalits in legislatures."],[2,"**Government Acceptance**: Incorporated into the award."]],"p":74,"b":0}]},{"t":"Third Round Table Conference and Government of India Act 1935","p":74,"c":[{"i":"k0409","k":0,"t":"Third RTC (1932)","a":[],"n":[[2,"**Congress Boycott**: Minimal participation."],[2,"**Outcome**: Insignificant progress."]],"p":74,"b":0},{"i":"k0410","k":1,"t":"White Paper (1933)","a":[],"n":[[2,"Recommendations debated in the British Parliament."]],"p":74,"b":0},{"i":"k0411","k":1,"t":"Government of India Act 1935","a":[],"n":[[2,"**Provisions**:"],[3,"Introduction of **Provincial Autonomy**."],[3,"Establishment of a **Federal Government** (which never materialized)."],[3,"Extension of **Franchise**."],[3,"Retention of **Separate Electorates**."]],"p":74,"b":0}]},{"t":"Summary of Key Differences Between Non-Cooperation and Civil Disobedience Movements","p":74,"c":[{"i":"k0412","k":2,"t":"Goal","a":["Non-Cooperation Movement","Civil Disobedience Movement"],"n":[[1,"**Non-Cooperation Movement**: Swaraj/Dominion Status"],[1,"**Civil Disobedience Movement**: Complete Independence"]],"p":74,"b":0},{"i":"k0413","k":2,"t":"Methods","a":["Non-Cooperation Movement","Civil Disobedience Movement"],"n":[[1,"**Non-Cooperation Movement**: Non-Cooperation"],[1,"**Civil Disobedience Movement**: Non-Cooperation + Law Violation"]],"p":74,"b":0},{"i":"k0414","k":2,"t":"Muslim Participation","a":["Non-Cooperation Movement","Civil Disobedience Movement"],"n":[[1,"**Non-Cooperation Movement**: High"],[1,"**Civil Disobedience Movement**: Low"]],"p":75,"b":0},{"i":"k0415","k":2,"t":"Intelligentsia Role","a":["Non-Cooperation Movement","Civil Disobedience Movement"],"n":[[1,"**Non-Cooperation Movement**: Active"],[1,"**Civil Disobedience Movement**: Comparatively Inactive"]],"p":75,"b":0},{"i":"k0416","k":2,"t":"Women's Participation","a":["Non-Cooperation Movement","Civil Disobedience Movement"],"n":[[1,"**Non-Cooperation Movement**: Low"],[1,"**Civil Disobedience Movement**: High"]],"p":75,"b":0},{"i":"k0417","k":2,"t":"Arrests","a":["Non-Cooperation Movement","Civil Disobedience Movement"],"n":[[1,"**Non-Cooperation Movement**: Moderate"],[1,"**Civil Disobedience Movement**: Approximately Three Times Higher"]],"p":75,"b":0}]},{"t":"Conclusion","p":75,"c":[{"i":"k0418","k":1,"t":"Conclusion","a":[""],"n":[[1,"The period from **1917 to 1935** was marked by significant shifts in the **Indian independence movement**."]],"p":75,"b":0},{"i":"k0419","k":1,"t":"Gandhi's Leadership","a":[],"n":[[2,"Introduced **Satyagraha** as a powerful tool."],[2,"Unified diverse groups under common causes."]],"p":75,"b":0},{"i":"k0420","k":1,"t":"National Movements","a":[],"n":[[2,"**Non-Cooperation** and **Civil Disobedience** mobilized millions."]],"p":75,"b":0},{"i":"k0421","k":1,"t":"Challenges","a":[],"n":[[2,"**Communal Divisions** exacerbated by British policies."],[2,"**Internal Debates** on strategies and goals."]],"p":75,"b":0},{"i":"k0422","k":1,"t":"Legacy","a":[],"n":[[2,"Set the stage for future struggles leading to India's independence in **1947**."]],"p":75,"b":0}]}]},{"n":13,"t":"Towards Independence 1935–47","d":"Congress ministries, WWII, Quit India, INA, Wavell, Partition","e":"1935 – 1947","p":75,"s":[{"t":"Deliberations after the Civil Disobedience Movement","p":75,"c":[{"i":"k0423","k":1,"t":"Withdrawal of Civil Disobedience Movement (1934)","a":[],"n":[[2,"**Gandhi** withdrew the movement due to escalating violence and lack of immediate success."],[2,"The **Congress leadership** deliberated on future strategies."]],"p":75,"b":0},{"i":"k0424","k":1,"t":"Emergence of Three Distinct Strategies","a":[],"n":[[2,"**Constructive Work on Gandhian Lines**:"],[3,"Advocated by those who believed in building grassroots support through social reforms."],[3,"Focused on education, khadi promotion, and upliftment of rural areas."],[2,"**Entry into Legislative Councils**:"],[3,"Led by **MA Ansari, Asaf Ali, Bhulabhai Desai, S. Satyamurthy**."],[3,"Believed in participating in governance to influence policy from within."],[2,"**Continuation of Mass Struggle**:"],[3,"**Jawaharlal Nehru** and **Subhas Chandra Bose** advocated for a **more radical approach**."],[3,"Criticized legislative participation as a **\"surrender of ideals\"**."],[3,"Sought to incorporate **class struggle** into the anti-imperialist movement."]],"p":75,"b":0}]},{"t":"Gandhi's Struggle-Truce-Struggle Strategy vs. Nehru's Struggle-Victory","p":76,"c":[{"i":"k0425","k":1,"t":"Gandhi's Perspective","a":[],"n":[[2,"Believed in alternating periods of **active resistance** and **constructive work**."],[2,"Argued that continuous struggle could lead to **fatigue** among the masses."],[2,"Advocated for giving the **British government time to respond** to Indian demands."]],"p":76,"b":0},{"i":"k0426","k":1,"t":"Nehru's Perspective","a":[],"n":[[2,"Favored a **continuous confrontation** with imperialism until **victory**."],[2,"Criticized Gandhi's approach as **too cautious**."],[2,"Emphasized that real power cannot be won through **partial measures**."]],"p":76,"b":0}]},{"t":"Decision to Enter Legislative Councils","p":76,"c":[{"i":"k0427","k":1,"t":"Avoiding a Split in Congress","a":[],"n":[[2,"Despite disagreements, leaders sought to maintain **unity** within the party."],[2,"**Gandhi** agreed to support those wishing to enter councils."]],"p":76,"b":0},{"i":"k0428","k":1,"t":"Formation of Parliamentary Board (May 1934)","a":[],"n":[[2,"Established to contest elections under the Congress banner."]],"p":76,"b":0},{"i":"k0429","k":1,"t":"Gandhi's Resignation (October 1934)","a":[],"n":[[2,"Stepped down from Congress to **\"serve it better in thought, word, and deed\"**."]],"p":76,"b":0},{"i":"k0430","k":1,"t":"Election Victory (November 1934)","a":[],"n":[[2,"**Congress** won **45 out of 75 seats** in the Central Legislative Assembly."]],"p":76,"b":0}]},{"t":"Government of India Act 1935 and Provincial Elections","p":76,"c":[{"i":"k0431","k":1,"t":"Government of India Act 1935","a":[],"n":[[2,"Enacted in **August 1935**."],[2,"Widely condemned by Indian leaders for falling short of demands."],[2,"**Congress** demanded a **constituent assembly** elected by **adult franchise**."]],"p":76,"b":0},{"i":"k0432","k":1,"t":"Provincial Elections (1937)","a":[],"n":[[2,"**Congress** decided to contest elections despite internal differences."],[2,"**Elections held in 11 provinces**."],[2,"**Congress Victory**:"],[3,"Won **716 out of 1,161** contested seats."],[3,"Formed ministries in **Madras, United Provinces, Bihar, Central Provinces, Orissa, Bombay**, and later **NWFP**."],[2,"**Muslim League** performed poorly, highlighting limited support."]],"p":77,"b":1}]},{"t":"Congress Ministries (1937-1939)","p":77,"c":[{"i":"k0433","k":0,"t":"Governance Period","a":[],"n":[[2,"**Congress ministries** governed for **28 months**."],[2,"**Gandhi's Advice**: Urged ministers to hold office **\"lightly and not tightly\"**."]],"p":77,"b":0},{"i":"k0434","k":1,"t":"Achievements","a":[],"n":[[2,"**Civil Liberties**:"],[3,"Repealed emergency laws."],[3,"Lifted bans on organizations like **Hindustan Seva Dal**."],[3,"Released political prisoners."],[2,"**Agricultural Reforms**:"],[3,"Enacted laws on **land tenure, debt relief**, and **rent reduction**."],[3,"Faced challenges due to **financial constraints** and **opposition** from landlords."],[2,"**Labor Reforms**:"],[3,"Promoted **harmony** between labor and capital."],[3,"Introduced measures for **compulsory arbitration** before strikes."],[3,"Criticized for suppressing militant trade unions."],[2,"**Social Welfare**:"],[3,"Implemented **prohibition** in certain areas."],[3,"Emphasized **education** and **khadi promotion**."],[3,"Established the **National Planning Committee** under **Nehru**."]],"p":77,"b":0}]},{"t":"Rise of Subhas Chandra Bose","p":77,"c":[{"i":"k0435","k":1,"t":"Haripura Session (1938)","a":[],"n":[[2,"**Subhas Chandra Bose** elected Congress President."],[2,"Emphasized **economic planning** and support for agitations in princely states."]],"p":77,"b":0},{"i":"k0436","k":1,"t":"Differences with Gandhi","a":[],"n":[[2,"Disagreed on methods to achieve independence and economic policies."],[2,"Bose favored a **more aggressive stance** against the British."]],"p":77,"b":0},{"i":"k0437","k":0,"t":"Tripuri Session (1939)","a":[],"n":[[2,"Bose re-elected but faced opposition from the **Gandhi faction**."],[2,"**Gandhi-backed candidate: Pattabhi Sitaramayya**."],[2,"Despite winning, Bose resigned due to lack of support."]],"p":78,"b":0},{"i":"k0438","k":1,"t":"Formation of Forward Bloc (May 1939)","a":[],"n":[[2,"Bose established the **Forward Bloc** within Congress."],[2,"Later expelled from Congress positions for violating party discipline."]],"p":78,"b":0}]},{"t":"Outbreak of World War II and Indian Politics","p":78,"c":[{"i":"k0439","k":1,"t":"Britain Declares War on Germany (September 1939)","a":[],"n":[[2,"**India** declared a belligerent without consultation."]],"p":78,"b":0},{"i":"k0440","k":1,"t":"Congress Reaction","a":[],"n":[[2,"Objected to unilateral decision."],[2,"Demanded assurances for **independence** and **formation of a constituent assembly**."],[2,"**Viceroy Linlithgow** refused substantive concessions."]],"p":78,"b":0},{"i":"k0441","k":1,"t":"Resignation of Congress Ministries (October 1939)","a":[],"n":[[2,"As a protest against British policies."]],"p":78,"b":0},{"i":"k0442","k":0,"t":"Divergent Views within Congress","a":[],"n":[[2,"**Gandhi**: Proposed unconditional support against fascism."],[2,"**Bose and Socialists**: Wanted to exploit the situation for independence."],[2,"**Nehru**: Opposed both fascism and imperialism; advocated for **non-cooperation** without taking advantage of British difficulties."]],"p":78,"b":0}]},{"t":"August Offer (1940)","p":78,"c":[{"i":"k0443","k":1,"t":"Linlithgow's Statement","a":[],"n":[[2,"Proposed expansion of **Viceroy's Executive Council**."],[2,"Promised a **post-war constituent assembly**."],[2,"Assured **Dominion Status** after the war."]],"p":78,"b":0},{"i":"k0444","k":0,"t":"Reactions","a":[],"n":[[2,"**Congress**: Rejected due to lack of immediate transfer of power and giving minorities veto power."],[2,"**Muslim League**: Initially accepted, later rejected over clarification on Pakistan."],[2,"**Result**: Offer failed to satisfy major Indian political groups."]],"p":78,"b":0}]},{"t":"Individual Satyagraha (1940-1941)","p":79,"c":[{"i":"k0445","k":1,"t":"Gandhi's Strategy","a":[],"n":[[2,"Launched to affirm the **right to free speech** against war."],[2,"Chose **Vinoba Bhave** as the first satyagrahi."],[2,"**Jawaharlal Nehru** followed."],[2,"Over **25,000 satyagrahis** participated."]],"p":79,"b":0},{"i":"k0446","k":1,"t":"Outcome","a":[],"n":[[2,"Movement lacked mass appeal."],[2,"Suspended by Gandhi in **December 1940**."]],"p":79,"b":0}]},{"t":"Cripps Mission (1942)","p":79,"c":[{"i":"k0447","k":1,"t":"Context","a":[],"n":[[2,"**Japanese advancement** in Southeast Asia posed a threat to India."],[2,"**Allied Powers** pressured Britain to gain Indian support."]],"p":79,"b":0},{"i":"k0448","k":1,"t":"Stafford Cripps' Proposals","a":[],"n":[[2,"**Dominion Status** after the war."],[2,"Formation of a **constituent assembly** with elected representatives."],[2,"**Right of provinces** to opt out of the Indian Union."],[2,"**British control over defense** during the war."]],"p":79,"b":0},{"i":"k0449","k":0,"t":"Reactions","a":[],"n":[[2,"**Congress**: Rejected due to provision allowing provinces to secede and lack of immediate self-governance."],[2,"**Muslim League**: Opposed as it didn't explicitly guarantee Pakistan."],[2,"**Outcome**: Mission failed to achieve consensus."]],"p":79,"b":0}]},{"t":"Quit India Movement (1942)","p":79,"c":[{"i":"k0450","k":0,"t":"Launch of Movement","a":[],"n":[[2,"**August 8, 1942: Gandhi** delivered the **\"Do or Die\"** speech in Bombay."],[2,"**All India Congress Committee (AICC)** demanded immediate British withdrawal."]],"p":79,"b":0},{"i":"k0451","k":0,"t":"Instructions by Gandhi","a":[],"n":[[2,"**Government Servants**: Continue work but declare allegiance to Congress."],[2,"**Soldiers**: Stay in ranks but refuse to fire on compatriots."],[2,"**Students**: Leave educational institutions if they could."],[2,"**Peasants**: Withhold rent from pro-British landlords."],[2,"**Princely States**: Support rulers only if they opposed British rule."]],"p":79,"b":0},{"i":"k0452","k":1,"t":"Government Response","a":[],"n":[[2,"Arrested **Gandhi** and other leaders within hours."],[2,"Declared Congress an **unlawful association**."]],"p":79,"b":0},{"i":"k0453","k":0,"t":"Spontaneous Uprising","a":[],"n":[[2,"Leaderless movement spread rapidly."],[2,"**Mass Protests**: Strikes, demonstrations, sabotage of communication lines."],[2,"**Underground Activities**:"],[3,"**Key Leaders: Ram Manohar Lohia, Jayaprakash Narayan, Aruna Asaf Ali, Usha Mehta**."],[3,"**Underground Radio**: Broadcasted messages to inspire resistance."],[2,"**Parallel Governments**:"],[3,"**Ballia**: Led by **Chittu Pandey**."],[3,"**Tamluk: Jatiya Sarkar** operated (1942-44)."],[3,"**Satara: Prati Sarkar** under **Y.B. Chavan** and **Nana Patil** (1943-45)."]],"p":80,"b":0}]},{"t":"Participation in Quit India Movement","p":80,"c":[{"i":"k0454","k":0,"t":"Participation in Quit India Movement","a":["Youth"],"n":[[1,"**Youth**: At the forefront of protests and revolutionary activities."]],"p":80,"b":0},{"i":"k0455","k":0,"t":"Women","a":[],"n":[[2,"**Prominent Figures: Aruna Asaf Ali, Sucheta Kripalani, Usha Mehta**."],[2,"Actively involved in organizing protests and underground work."]],"p":80,"b":0},{"i":"k0456","k":1,"t":"Workers","a":[],"n":[[2,"Organized **strikes** despite severe repression."]],"p":80,"b":0},{"i":"k0457","k":1,"t":"Peasants","a":[],"n":[[2,"Participated widely, targeting symbols of British authority."],[2,"Notably absent was violence against landlords."]],"p":80,"b":0},{"i":"k0458","k":1,"t":"Government Officials","a":[],"n":[[2,"Lower-level officials showed **sympathy**, leading to erosion of government control."]],"p":80,"b":0},{"i":"k0459","k":1,"t":"Muslims","a":[],"n":[[2,"Many sheltered activists; no significant communal clashes occurred."]],"p":80,"b":0}]},{"t":"Non-Participants and Opposition","p":80,"c":[{"i":"k0460","k":1,"t":"Communist Party of India (CPI)","a":[],"n":[[2,"Did not participate as the **Soviet Union** was allied with Britain against Germany."]],"p":80,"b":0},{"i":"k0461","k":1,"t":"Muslim League","a":[],"n":[[2,"Opposed the movement fearing it would hinder the creation of **Pakistan**."]],"p":80,"b":0},{"i":"k0462","k":1,"t":"Hindu Mahasabha","a":[],"n":[[2,"Boycotted the movement."]],"p":80,"b":0},{"i":"k0463","k":1,"t":"Princely States","a":[],"n":[[2,"Showed minimal response, largely remaining loyal to the British."]],"p":81,"b":0}]},{"t":"Efforts Towards Reconciliation and Partition","p":81,"c":[{"i":"k0464","k":1,"t":"C. Rajagopalachari Formula (1944)","a":[],"n":[[2,"Proposed that if Muslims supported independence, a **plebiscite** would determine partition in Muslim-majority areas."],[2,"**Jinnah's Response**:"],[3,"Rejected the plan, insisting only **Muslims** should vote in the plebiscite."]],"p":81,"b":0},{"i":"k0465","k":0,"t":"Desai-Liaqat Pact","a":[],"n":[[2,"Negotiated by **Bhulabhai Desai** (Congress) and **Liaqat Ali Khan** (Muslim League)."],[2,"Proposed equal representation in an interim government."],[2,"**Outcome**: No agreement reached, but set a precedent for parity between Congress and League."]],"p":81,"b":0}]},{"t":"Wavell Plan and Shimla Conference (1945)","p":81,"c":[{"i":"k0466","k":1,"t":"Wavell Plan","a":[],"n":[[2,"Proposed reconstitution of the **Viceroy's Executive Council** with equal representation for **Caste Hindus** and **Muslims**."],[2,"Aimed to include all Indian parties in governance."]],"p":81,"b":0},{"i":"k0467","k":1,"t":"Shimla Conference","a":[],"n":[[2,"Convened to discuss the plan."],[2,"**Deadlock** over Muslim League's demand to be the sole representative of Muslims."],[2,"**Congress** objected, leading to the failure of talks."]],"p":81,"b":0}]},{"t":"Subhas Chandra Bose and the Indian National Army (INA)","p":81,"c":[{"i":"k0468","k":1,"t":"Formation of Forward Bloc (1939)","a":[],"n":[[2,"Bose's faction after resigning from Congress presidency."]],"p":81,"b":0},{"i":"k0469","k":1,"t":"Activities Abroad","a":[],"n":[[2,"Escaped to **Germany** via **Afghanistan**."],[2,"Met with **Hitler** to seek support against the British."],[2,"Formed the **\"Freedom Army\"** with Indian POWs in Europe."]],"p":81,"b":0},{"i":"k0470","k":1,"t":"Formation of INA in Southeast Asia","a":[],"n":[[2,"**First Phase**:"],[3,"Initiated by **Captain Mohan Singh** with Japanese support."],[3,"Faced setbacks due to differences with Japanese authorities."],[2,"**Second Phase**:"],[3,"Bose took command from **Rash Behari Bose** in **Singapore** (1943)."],[3,"Proclaimed the **Provisional Government of Free India**."],[3,"INA included the **Rani of Jhansi Regiment**, an all-women combat force."]],"p":81,"b":0},{"i":"k0471","k":1,"t":"Military Campaigns","a":[],"n":[[2,"Captured **Andaman and Nicobar Islands**, renaming them **Shaheed** and **Swaraj**."],[2,"Advanced to **Manipur**, hoisting the flag in **Moirang** (April 1944)."],[2,"**Challenges**:"],[3,"INA faced discrimination and supply issues from the Japanese."],[3,"Retreat after Japanese defeats in 1944."]],"p":82,"b":0},{"i":"k0472","k":1,"t":"Legacy","a":[],"n":[[2,"Despite military setbacks, the INA's efforts inspired nationalist sentiments."],[2,"**Trials of INA Soldiers**:"],[3,"British plans to court-martial INA soldiers led to widespread protests."],[3,"United different sections of Indian society in support of the INA."]],"p":82,"b":0}]},{"t":"Conclusion","p":82,"c":[{"i":"k0473","k":1,"t":"Conclusion","a":["","","",""],"n":[[1,"The period from **1934 to 1945** was marked by significant developments in India's struggle for independence."],[1,"**Internal Debates** within Congress highlighted differing strategies but ultimately aimed for a common goal."],[1,"**World War II** created both challenges and opportunities for the independence movement."],[1,"The **Quit India Movement** demonstrated the depth of anti-colonial sentiment across diverse sections of Indian society."]],"p":82,"b":0},{"i":"k0474","k":1,"t":"Conclusion","a":["",""],"n":[[1,"**Subhas Chandra Bose** and the **INA** added a new dimension to the freedom struggle, emphasizing armed resistance."],[1,"Despite setbacks, these events collectively weakened British control and set the stage for India's independence in **1947**."]],"p":82,"b":0}]}]},{"n":14,"t":"Constitutional Development","d":"Regulating Act to Independence Act — every major statute in sequence","e":"1600 – 1947","p":83,"s":[{"t":"The Trading Roots and Early Company Rule","p":83,"c":[{"i":"k0475","k":0,"t":"Formation of the East India Company (1600)","a":[],"n":[[2,"**December 31, 1600**: London merchants formed the **East India Company**."],[2,"Secured a **royal charter** from **Queen Elizabeth I**, granting monopoly rights to trade with India and parts of Southeast Asia for **15 years**."]],"p":83,"b":0},{"i":"k0476","k":0,"t":"Transition from Trade to Political Power","a":[],"n":[[2,"**1707**: After **Aurangzeb's** death, the **Mughal Empire** began to disintegrate."],[2,"The **East India Company** shifted from trading to becoming a **dominant political power**."]],"p":83,"b":0},{"i":"k0477","k":1,"t":"Battle of Plassey (1757)","a":[],"n":[[2,"Victory over **Nawab Sirajuddaula** marked the foundation of British rule in India."]],"p":83,"b":0},{"i":"k0478","k":0,"t":"Battle of Buxar (1764)","a":[],"n":[[2,"Defeated the combined forces of **Mughal Emperor Shah Alam II**, the Nawab of Bengal, and the Nawab of Awadh."],[2,"**1765**: Acquired **Diwani rights** (revenue collection) for Bengal, Bihar, and Odisha."],[2,"Established dual governance: Company controlled revenue and civil justice; Nawab retained law and order and criminal justice."]],"p":83,"b":1}]},{"t":"Early Regulatory Acts","p":83,"c":[{"i":"k0479","k":1,"t":"Need for Regulation","a":[],"n":[[2,"The dual governance system (1765-1772) led to administrative chaos."],[2,"British Parliament sought to regulate the Company's activities."]],"p":83,"b":0},{"i":"k0480","k":1,"t":"Regulating Act of 1773","a":[],"n":[[2,"First step towards British parliamentary control over the Company."],[2,"Established a **Supreme Court at Calcutta**."],[2,"Made the **Governor-General of Bengal** (with four councillors) the head of British India."],[2,"Brought the presidencies of **Bombay and Madras** under Bengal's control."],[2,"Reformed the **Court of Directors** of the Company."]],"p":83,"b":0},{"i":"k0481","k":1,"t":"Pitt's India Act of 1784","a":[],"n":[[2,"Introduced dual control: **Court of Directors** (trade) and **Board of Control** (political matters)."],[2,"Reduced the number of Governor-General's councillors from four to three."],[2,"Subordinated Bombay and Madras to Bengal in diplomacy, revenue, and war."],[2,"Prohibited the Company from waging wars and annexing territories."]],"p":83,"b":0},{"i":"k0482","k":1,"t":"Charter Act of 1793","a":[],"n":[[2,"Extended the Company's commercial privileges for 20 years."],[2,"Empowered the Governor-General to override his council in extraordinary cases."],[2,"Salaries of the **Board of Control** members paid from Indian revenues."]],"p":84,"b":0}]},{"t":"Charter Acts and Constitutional Developments","p":84,"c":[{"i":"k0483","k":1,"t":"Charter Act of 1813","a":[],"n":[[2,"Ended the Company's trade monopoly in India (except with China and in tea)."],[2,"Allowed Christian missionaries to preach in India."],[2,"Allocated **₹1 lakh annually** for the promotion of education."]],"p":84,"b":0},{"i":"k0484","k":1,"t":"Charter Act of 1833","a":[],"n":[[2,"Renewed the Company's charter for 20 years, but it ceased commercial activities."],[2,"Governor-General of Bengal became **Governor-General of India**."],[2,"Centralized administrative, legislative, and financial powers."],[2,"Introduced a fourth (law) member to the Governor-General's Council (e.g., **Macaulay**)."],[2,"Removed restrictions on European immigration and property ownership in India."],[2,"Proposed to open civil services to Indians (not implemented)."]],"p":84,"b":0},{"i":"k0485","k":1,"t":"Charter Act of 1853","a":[],"n":[[2,"Did not specify a renewal period, allowing the Crown to take over anytime."],[2,"Separated the Governor-General of Bengal from Governor-General of India."],[2,"Expanded the legislative council (now with 12 members)."],[2,"Introduced open competition for civil services."]],"p":84,"b":0}]},{"t":"Transition to Crown Rule","p":84,"c":[{"i":"k0486","k":1,"t":"Act for the Better Government of India (1858)","a":[],"n":[[2,"Abolished Company rule following the **Revolt of 1857**."],[2,"India to be governed directly by the Crown through a **Secretary of State**."],[2,"Established the position of **Viceroy** as the Crown's representative."],[2,"Secretary of State assumed powers of the **Court of Directors** and **Board of Control**."]],"p":84,"b":0}]},{"t":"Indian Councils and Legislative Reforms","p":85,"c":[{"i":"k0487","k":1,"t":"Indian Councils Act of 1861","a":[],"n":[[2,"Introduced a **portfolio system** in the executive council."],[2,"Expanded legislative councils and included Indians for the first time."],[2,"Restored legislative powers to **Bombay** and **Madras**."],[2,"Empowered the Governor-General to issue ordinances during emergencies."]],"p":85,"b":0},{"i":"k0488","k":1,"t":"Indian Councils Act of 1892","a":[],"n":[[2,"Expanded legislative councils further."],[2,"Introduced the **principle of election** (indirectly)."],[2,"Allowed members to discuss the budget and ask questions."]],"p":85,"b":0},{"i":"k0489","k":1,"t":"Indian Councils Act of 1909 (Morley-Minto Reforms)","a":[],"n":[[2,"Increased the size of legislative councils."],[2,"Introduced **indirect elections**."],[2,"**Satyendra Prasad Sinha** became the first Indian in the Governor-General's Executive Council."],[2,"Introduced **separate electorates for Muslims**, institutionalizing communal representation."]],"p":85,"b":0}]},{"t":"Towards Self-Government","p":85,"c":[{"i":"k0490","k":1,"t":"Montagu Declaration (1917)","a":[],"n":[[2,"Announced British policy of **\"increasing association of Indians in every branch of administration\"**."]],"p":85,"b":0},{"i":"k0491","k":1,"t":"Government of India Act, 1919","a":[],"n":[[2,"Introduced **diarchy** in provinces."],[2,"Bicameral legislature at the center."],[2,"Expanded communal representation."],[2,"Limited responsible government but retained significant British control."]],"p":85,"b":0}]},{"t":"The Road to Independence","p":85,"c":[{"i":"k0492","k":1,"t":"Simon Commission (1927)","a":[],"n":[[2,"All-white commission to review the 1919 reforms."],[2,"Led to widespread protests due to lack of Indian representation."]],"p":86,"b":0},{"i":"k0493","k":1,"t":"Government of India Act, 1935","a":[],"n":[[2,"Proposed an **all-India federation** (never fully implemented)."],[2,"Abolished diarchy in provinces; introduced provincial autonomy."],[2,"Introduced diarchy at the center."],[2,"Extended communal electorates."]],"p":86,"b":0},{"i":"k0494","k":1,"t":"Cabinet Mission Plan (1946)","a":[],"n":[[2,"Proposed a three-tier federal structure."],[2,"Rejected the idea of a separate **Pakistan**."],[2,"Suggested grouping provinces into three sections."],[2,"Both Congress and Muslim League had reservations, leading to further conflict."]],"p":86,"b":0}]},{"t":"Partition and Independence","p":86,"c":[{"i":"k0495","k":1,"t":"Mountbatten Plan (June 3, 1947)","a":[],"n":[[2,"Proposed partitioning India into two dominions: **India** and **Pakistan**."],[2,"Set August 15, 1947, as the date for transfer of power."],[2,"Allowed princely states to accede to either dominion."]],"p":86,"b":0},{"i":"k0496","k":1,"t":"Indian Independence Act, 1947","a":[],"n":[[2,"Enacted the provisions of the Mountbatten Plan."],[2,"Established legislative sovereignty for both dominions."],[2,"Marked the end of British rule and the birth of two independent nations on **August 15, 1947**."]],"p":86,"b":0}]},{"t":"Summary of Key Constitutional Developments","p":86,"c":[{"i":"k0497","k":1,"t":"Early Acts","a":[],"n":[[2,"Regulated the East India Company's trade and governance."],[2,"Established the foundation for British administrative structures in India."]],"p":86,"b":0},{"i":"k0498","k":1,"t":"Introduction of Indians in Governance","a":[],"n":[[2,"Gradual inclusion of Indians in legislative councils."],[2,"Introduction of indirect and then direct elections."]],"p":86,"b":0},{"i":"k0499","k":0,"t":"Communal Representation","a":[],"n":[[2,"**1909 Act**: Introduced separate electorates for Muslims."],[2,"**Extended in 1919 and 1935 Acts**: Included other minorities."]],"p":86,"b":0},{"i":"k0500","k":0,"t":"Steps Towards Self-Government","a":[],"n":[[2,"**1919 Act**: Introduced diarchy, a limited form of self-government."],[2,"**1935 Act**: Provided provincial autonomy."]],"p":87,"b":0},{"i":"k0501","k":0,"t":"Final Moves to Independence","a":[],"n":[[2,"Failed attempts at constitutional reforms led to increasing demands for complete independence."],[2,"Partition became inevitable due to irreconcilable differences between Congress and the Muslim League."],[2,"**1947 Act**: Legally ended British sovereignty over India."]],"p":87,"b":0}]}]}];
</script>
<script>
/* ---------------- state ---------------- */
const KEY = 'mh-flashnotes-v1';
let S = {theme:'dark', mark:{}, star:{}, seen:{}, filter:'all', chap:null, pos:{}, shuffle:false, mode:'smart'};
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const ALL = [];
DATA.forEach(c => c.s.forEach(s => s.c.forEach(k =>
  ALL.push(Object.assign({}, k, {ch:c.n, chT:c.t, sec:s.t})))));
const BYID = Object.fromEntries(ALL.map(k => [k.i, k]));

/* ---------------- helpers ---------------- */
const esc = t => t.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rich = t => esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const clozed = t => {
  const runs = t.match(/\*\*([^*]+)\*\*/g) || [];
  const bold = runs.reduce((a, r) => a + r.length - 4, 0);
  const bare = t.replace(/\*\*/g, '').length || 1;
  // a line that is almost entirely bold leaves no context to recall from:
  // keep the opening phrase visible, or show the line plainly if it is the only phrase
  const widest = runs.reduce((a, r) => Math.max(a, r.length - 4), 0);
  const thin = bold / bare > 0.72 || widest / bare > 0.42;
  const skip = thin ? (runs.length < 2 ? Infinity : 1) : 0;
  let n = 0;
  return esc(t).replace(/\*\*([^*]+)\*\*/g, (m, g) => (n++ < skip)
    ? `<b>${g}</b>`
    : `<button class="cz" aria-label="Reveal hidden term">${g}</button>`);
};
const plain = t => t.replace(/\*\*/g, '');
const hasCz = k => k.n.some(p => /\*\*[^*]+\*\*/.test(p[1]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

function deckOf(chapN){
  let list = ALL.filter(k => k.ch === chapN);
  const f = S.filter;
  if (f === 'unseen')  list = list.filter(k => !S.seen[k.i]);
  if (f === 'review')  list = list.filter(k => S.mark[k.i] === 'r');
  if (f === 'known')   list = list.filter(k => S.mark[k.i] === 'k');
  if (f === 'star')    list = list.filter(k => S.star[k.i]);
  if (f === 'bihar')   list = list.filter(k => k.b);
  if (S.shuffle) list = shuffled(list, chapN);
  return list;
}
function shuffled(list, seed){
  const a = list.slice(); let s = (seed * 9301 + 49297) % 233280;
  for (let i = a.length - 1; i > 0; i--){
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor(s / 233280 * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const stat = list => ({
  k: list.filter(x => S.mark[x.i] === 'k').length,
  r: list.filter(x => S.mark[x.i] === 'r').length,
  s: list.filter(x => S.star[x.i]).length,
  n: list.length
});

/* ---------------- home ---------------- */
function renderHome(){
  const g = stat(ALL);
  document.getElementById('tally').innerHTML =
    `<i><s></s>${ALL.length} cards</i>` +
    `<i class="k"><s></s>${g.k} known</i>` +
    `<i class="r"><s></s>${g.r} to review</i>` +
    `<i class="st"><s></s>${g.s} starred</i>`;

  document.getElementById('spine').innerHTML = DATA.map(c => {
    const list = ALL.filter(k => k.ch === c.n), st = stat(list);
    const pk = Math.round(st.k / st.n * 100), pr = Math.round(st.r / st.n * 100);
    const cls = pk === 100 ? 'done' : (st.k + st.r) ? 'part' : '';
    return `<li class="${cls}"><button class="chap" data-ch="${c.n}">
      <span class="era sans">${esc(c.e)}</span>
      <h3>${esc(c.t)}</h3>
      <p>${esc(c.d)}</p>
      <span class="meter"><span class="track"><u class="a" style="width:${pk}%"></u><u class="b" style="width:${pr}%"></u></span>
      <em>${st.k}/${st.n}</em></span>
    </button></li>`;
  }).join('');
  document.querySelectorAll('[data-ch]').forEach(b =>
    b.onclick = () => openChapter(+b.dataset.ch));
}

/* ---------------- study ---------------- */
const FILTERS = [['all','All'],['unseen','Unseen'],['review','To review'],['known','Known'],['star','Starred'],['bihar','Bihar focus']];
let DECK = [], IDX = 0;

function openChapter(n){
  S.chap = n; save();
  tab('study');
}
function renderFilters(){
  const chapList = ALL.filter(k => k.ch === S.chap);
  document.getElementById('filters').innerHTML = FILTERS.map(([v, l]) => {
    let c = chapList.length;
    if (v === 'unseen') c = chapList.filter(k => !S.seen[k.i]).length;
    if (v === 'review') c = chapList.filter(k => S.mark[k.i] === 'r').length;
    if (v === 'known')  c = chapList.filter(k => S.mark[k.i] === 'k').length;
    if (v === 'star')   c = chapList.filter(k => S.star[k.i]).length;
    if (v === 'bihar')  c = chapList.filter(k => k.b).length;
    if (!c && v !== 'all' && S.filter !== v) return '';
    return `<button class="chip${v==='bihar'?' bih':''}" data-f="${v}" aria-pressed="${S.filter===v}">${l} ${c}</button>`;
  }).join('');
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    S.filter = b.dataset.f; save(); buildDeck(true);
  });
}
function buildDeck(reset){
  const chap = DATA.find(c => c.n === S.chap);
  document.getElementById('crumbName').textContent = chap ? chap.t : '';
  renderFilters();
  DECK = deckOf(S.chap);
  if (!DECK.length){ S.filter = 'all'; save(); renderFilters(); DECK = deckOf(S.chap); }
  const stored = S.pos[S.chap] || 0;
  IDX = reset ? 0 : Math.min(stored, Math.max(0, DECK.length - 1));
  drawCard();
}
function drawCard(turn){
  const deck = document.getElementById('deck');
  if (!DECK.length){
    deck.innerHTML = `<div class="empty"><b>Nothing here yet</b>Pick another filter to keep going.</div>`;
    document.getElementById('progTxt').textContent = '';
    return;
  }
  IDX = Math.max(0, Math.min(IDX, DECK.length - 1));
  const k = DECK[IDX];
  S.seen[k.i] = 1; S.pos[S.chap] = IDX; save();

  const kind = ['Recall', 'Key terms', 'Table'][k.k];
  const hasLabels = k.a.some(x => x);
  const useCz = S.mode === 'terms' || (S.mode === 'smart' && (k.k === 1 || !hasLabels));
  const open = S.mode === 'none';

  const pts = k.n.map((p, i) => {
    const lvl = p[1 + 0] !== undefined ? p[0] : 1;
    const cls = lvl === 2 ? 'sub' : lvl >= 3 ? 'sub sub3' : '';
    const anchorFor = (lvl === 1 && hasLabels) ? (k.a[k.n.filter(x => x[0] === 1).indexOf(p)] || '') : '';
    const shown = anchorFor
      ? p[1].replace(new RegExp('^\\*\\*' + anchorFor.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\*\\*\\s*:?\\s*'), '')
      : p[1];
    const isGroup = /^\*\*[^*]+\*\*:?$/.test(p[1].trim()) && k.n[i + 1] && k.n[i + 1][0] > lvl;
    if (isGroup) return `<li class="${cls} grp"><span class="lab">${esc(plain(p[1]).replace(/:$/, ''))}</span></li>`;
    if (open) return `<li class="${cls}"><p class="pt">${rich(p[1])}</p></li>`;
    if (useCz) return `<li class="${cls}"><p class="pt">${clozed(p[1])}</p></li>`;
    return `<li class="${cls}" data-slot="${i}">
        <button class="slot" data-open="${i}">
          ${anchorFor ? `<span class="lab">${esc(anchorFor)}</span>` : ''}
          <span class="rule"></span>
        </button>
        <p class="pt hide">${anchorFor ? `<span class="lab">${esc(anchorFor)}</span>` : ''}${rich(shown)}</p>
      </li>`;
  }).join('');

  const mk = S.mark[k.i];
  const html = `<article class="card${turn ? ' turn' : ''}">
    <div class="chead">
      <div class="ctag">
        <u>${esc(k.sec)}</u><u>p.${k.p}</u><u>${kind}</u>${k.b ? '<b>Bihar</b>' : ''}
      </div>
      <h2 class="ctitle">${rich(k.t)}</h2>
    </div>
    <div class="cbody">
      <ol class="slots">${pts}</ol>
      ${open ? '' : `<button class="reveal" id="revealAll">${useCz ? 'Reveal all key terms' : 'Reveal all points'} &nbsp;·&nbsp; Space</button>`}
      <div class="marks">
        <button class="mk k" data-mk="k" aria-pressed="${mk === 'k'}"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Known</button>
        <button class="mk r" data-mk="r" aria-pressed="${mk === 'r'}"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>Review</button>
        <button class="mk s" data-mk="s" aria-pressed="${!!S.star[k.i]}"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.6 9.7l5.8-.8z"/></svg>Star</button>
      </div>
    </div>
  </article>`;
  deck.innerHTML = html;
  if (turn) requestAnimationFrame(() => requestAnimationFrame(() =>
    deck.querySelector('.card').classList.remove('turn')));

  deck.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    b.parentElement.querySelector('.pt').classList.remove('hide');
    b.remove();
  });
  deck.querySelectorAll('.cz').forEach(b => b.onclick = () => b.classList.toggle('on'));
  const ra = document.getElementById('revealAll');
  if (ra) ra.onclick = revealAll;
  deck.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => mark(b.dataset.mk));

  document.getElementById('progBar').style.width = ((IDX + 1) / DECK.length * 100) + '%';
  document.getElementById('progTxt').textContent = `${IDX + 1} of ${DECK.length}`;
  document.getElementById('prev').disabled = IDX === 0;
  document.getElementById('next').disabled = IDX === DECK.length - 1;
}
function revealAll(){
  document.querySelectorAll('#deck [data-open]').forEach(b => {
    b.parentElement.querySelector('.pt').classList.remove('hide'); b.remove();
  });
  document.querySelectorAll('#deck .cz').forEach(b => b.classList.add('on'));
  const ra = document.getElementById('revealAll'); if (ra) ra.remove();
}
function isHidden(){
  return !!document.querySelector('#deck [data-open]') || !!document.querySelector('#deck .cz:not(.on)');
}
function mark(m){
  const k = DECK[IDX]; if (!k) return;
  if (m === 's'){ S.star[k.i] = S.star[k.i] ? 0 : 1; }
  else { S.mark[k.i] = S.mark[k.i] === m ? '' : m; }
  save(); renderFilters(); drawCard();
  if (m !== 's' && S.mark[k.i] && IDX < DECK.length - 1) setTimeout(() => go(1), 170);
}
function go(d){
  if (!DECK.length) return;
  const n = IDX + d;
  if (n < 0 || n >= DECK.length) return;
  IDX = n; drawCard(true);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* ---------------- theory ---------------- */
function renderNotes(query){
  const q = (query || '').trim().toLowerCase();
  const box = document.getElementById('notes');
  let hits = 0;
  const hl = s => q ? s.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') : s;

  const out = DATA.map(c => {
    const secs = c.s.map(s => {
      const cards = s.c.filter(k => !q ||
        (k.t + ' ' + s.t + ' ' + k.n.map(p => p[1]).join(' ')).toLowerCase().includes(q));
      if (!cards.length) return '';
      hits += cards.length;
      const body = cards.map(k => {
        const head = plain(k.t) === s.t ? '' : `<h5>${hl(rich(k.t))}</h5>`;
        const lis = k.n.map(p => `<li class="l${p[0]}">${hl(rich(p[1]))}</li>`).join('');
        return head + `<ul>${lis}</ul>`;
      }).join('');
      return `<details class="sec"${q ? ' open' : ''}>
        <summary><h4>${hl(esc(s.t))}</h4><u class="ct">${cards.length} note${cards.length > 1 ? 's' : ''}</u></summary>
        <div class="note">${body}</div></details>`;
    }).join('');
    if (!secs) return '';
    return `<div class="chapnote"><span class="sans">${esc(c.e)}</span><h3>${esc(c.t)}</h3></div>${secs}`;
  }).join('');

  box.innerHTML = out || `<div class="empty"><b>No note matches “${esc(query)}”</b>Try a shorter word, a year, or a place name.</div>`;
  if (q && hits) box.insertAdjacentHTML('afterbegin',
    `<p class="sans" style="color:var(--tx3);font-size:.78rem;margin:.2rem 0 1rem">${hits} note${hits > 1 ? 's' : ''} matched</p>`);
}

/* ---------------- sheets ---------------- */
const sheet = document.getElementById('sheet');
const panel = document.getElementById('sheetPanel');
function openSheet(html){ panel.innerHTML = html; sheet.classList.add('on'); }
function closeSheet(){ sheet.classList.remove('on'); }
sheet.addEventListener('click', e => { if (e.target.dataset.close !== undefined) closeSheet(); });

document.getElementById('index').onclick = () => {
  const chap = DATA.find(c => c.n === S.chap); if (!chap) return;
  const rows = chap.s.map(s => {
    const first = DECK.findIndex(k => k.sec === s.t);
    return `<li><button data-jump="${first}" ${first < 0 ? 'disabled style="opacity:.35"' : ''}>
      <u>p.${s.p}</u><span>${esc(s.t)}</span><u>${s.c.length}</u></button></li>`;
  }).join('');
  openSheet(`<h4>${esc(chap.t)}</h4><ul class="seclist">${rows}</ul>`);
  panel.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const i = +b.dataset.jump; if (i < 0) return;
    IDX = i; closeSheet(); drawCard(true); window.scrollTo({top: 0});
  });
};

document.getElementById('btnHelp').onclick = () => {
  openSheet(`<h4>How this works</h4>
    <div class="kv">
      <kbd>Space</kbd><span>Reveal everything on the card</span>
      <kbd>&rarr;</kbd><span>Next card</span>
      <kbd>&larr;</kbd><span>Previous card</span>
      <kbd>1</kbd><span>Mark known and move on</span>
      <kbd>2</kbd><span>Mark for review</span>
      <kbd>3</kbd><span>Star</span>
      <kbd>H</kbd><span>Cycle what stays hidden</span>
      <kbd>/</kbd><span>Search the theory</span>
    </div>
    <h4 style="margin-top:1.3rem">What stays hidden</h4>
    <div class="kv" id="modeRow"></div>
    <h4 style="margin-top:1.3rem">Your progress</h4>
    <p class="sans" style="font-size:.84rem;color:var(--tx2);margin:0 0 .7rem">
      Marks and stars are saved in this browser only. Nothing leaves the file.</p>
    <button class="reveal" id="wipe">Reset all progress</button>`);
  drawModes();
  document.getElementById('wipe').onclick = () => {
    if (!confirm('Clear every mark, star and star position?')) return;
    S.mark = {}; S.star = {}; S.seen = {}; S.pos = {}; save();
    closeSheet(); renderHome(); if (!document.getElementById('vStudy').classList.contains('hide')) buildDeck(true);
  };
};
const MODES = [['smart','Smart — points on recall cards, key terms elsewhere'],
               ['points','Points — every bullet hidden behind its label'],
               ['terms','Key terms — sentences shown, bold facts blanked'],
               ['none','Nothing — cards read as plain theory']];
function drawModes(){
  const r = document.getElementById('modeRow'); if (!r) return;
  r.innerHTML = MODES.map(([v, l]) =>
    `<kbd data-mode="${v}" style="cursor:pointer;${S.mode === v ? 'background:var(--cin);border-color:var(--cin);color:#fff' : ''}">${v}</kbd><span>${l.split('— ')[1]}</span>`).join('');
  r.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode; save(); drawModes(); drawCard();
  });
}

/* ---------------- tabs / chrome ---------------- */
function tab(which){
  const map = {home: 'vHome', study: 'vStudy', notes: 'vNotes'};
  Object.entries(map).forEach(([k, id]) =>
    document.getElementById(id).classList.toggle('hide', k !== which));
  document.getElementById('tHome').setAttribute('aria-selected', which === 'home');
  document.getElementById('tStudy').setAttribute('aria-selected', which === 'study');
  document.getElementById('tNotes').setAttribute('aria-selected', which === 'notes');
  document.getElementById('navStrip').classList.toggle('hide', which !== 'study');
  document.getElementById('btnShuffle').classList.toggle('hide', which !== 'study');
  if (which === 'home') renderHome();
  if (which === 'study'){ if (S.chap == null) S.chap = 1; buildDeck(false); }
  if (which === 'notes' && !document.getElementById('notes').children.length) renderNotes('');
  window.scrollTo({top: 0});
}
document.getElementById('tHome').onclick  = () => tab('home');
document.getElementById('tStudy').onclick = () => tab('study');
document.getElementById('tNotes').onclick = () => tab('notes');
document.getElementById('backHome').onclick = () => tab('home');
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('btnShuffle').onclick = e => {
  S.shuffle = !S.shuffle; save();
  e.currentTarget.setAttribute('aria-pressed', S.shuffle);
  buildDeck(true);
};
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('themeIcon').innerHTML = S.theme === 'dark'
    ? '<path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
}
document.getElementById('btnTheme').onclick = () => {
  S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme();
};
const qi = document.getElementById('q');
let qt;
qi.addEventListener('input', () => {
  document.getElementById('qClear').classList.toggle('hide', !qi.value);
  clearTimeout(qt); qt = setTimeout(() => renderNotes(qi.value), 160);
});
document.getElementById('qClear').onclick = () => {
  qi.value = ''; qi.dispatchEvent(new Event('input')); qi.focus();
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey){
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === '/' ){ e.preventDefault(); tab('notes'); qi.focus(); return; }
  if (e.key === 'Escape'){ closeSheet(); return; }
  if (document.getElementById('vStudy').classList.contains('hide')) return;
  if (e.key === ' '){ e.preventDefault(); isHidden() ? revealAll() : go(1); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === '1') mark('k');
  else if (e.key === '2') mark('r');
  else if (e.key === '3') mark('s');
  else if (e.key.toLowerCase() === 'h'){
    const i = MODES.findIndex(m => m[0] === S.mode);
    S.mode = MODES[(i + 1) % MODES.length][0]; save(); drawCard();
  }
});

applyTheme();
document.getElementById('btnShuffle').setAttribute('aria-pressed', S.shuffle);
renderHome();
tab('home');
</script>
</body>
</html>
