<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern History — Flashnotes</title>
<style>
:root{
  --ink:#0e1017; --ink2:#151824; --ink3:#1b1f2e; --ink4:#232839;
  --line:#2b3145; --line2:#39405a;
  --tx:#e8e4db; --tx2:#a8aec2; --tx3:#767d94;
  --cin:#e2563f;      /* cinnabar  — accent, current card, primary action */
  --orp:#e3a83e;      /* orpiment  — key terms revealed */
  --mal:#54ad8e;      /* malachite — known */
  --lap:#5f93d8;      /* lapis     — review */
  --eos:#d97ba1;      /* eosin     — starred */
  --blank:#2f3550;
  --sh:0 1px 2px rgba(0,0,0,.5),0 8px 28px -14px rgba(0,0,0,.8);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Times New Roman",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --wrap:min(860px,100%);
}
html[data-theme="light"]{
  --ink:#e9eaec; --ink2:#f6f6f4; --ink3:#fffefb; --ink4:#f0efea;
  --line:#d3d4d2; --line2:#bcbec0;
  --tx:#1a1e2a; --tx2:#565c6d; --tx3:#7e8494;
  --cin:#c03f2b; --orp:#9a6c10; --mal:#2e7a5e; --lap:#2f63ab; --eos:#a94871;
  --blank:#dcdcd6;
  --sh:0 1px 2px rgba(20,22,30,.08),0 10px 26px -18px rgba(20,22,30,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--tx); font-family:var(--serif);
  font-size:17px; line-height:1.68; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cin);outline-offset:2px;border-radius:3px}
.sans{font-family:var(--sans)}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ink) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);
}
.bar{width:var(--wrap);margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.6rem}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-weight:600;font-size:1.02rem;letter-spacing:.005em}
.brand span{font-family:var(--sans);font-size:.72rem;color:var(--tx3)}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx2);
  border:1px solid transparent;flex:none}
.icon:hover{background:var(--ink3);color:var(--tx)}
.icon[aria-pressed="true"]{background:var(--ink4);border-color:var(--line2);color:var(--tx)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- tabs ---------- */
nav.tabs{width:var(--wrap);margin:0 auto;padding:0 1rem;display:flex;gap:.15rem}
nav.tabs button{
  font-family:var(--sans);font-size:.78rem;letter-spacing:.02em;padding:.5rem .75rem .55rem;
  color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px
}
nav.tabs button[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--cin)}

main{width:var(--wrap);margin:0 auto;padding:1.1rem 1rem 5.5rem}
.hide{display:none!important}

/* ---------- home / spine ---------- */
.lede{max-width:62ch;margin:.4rem 0 1.4rem;color:var(--tx2);font-size:1.02rem}
.lede b{color:var(--tx);font-weight:600}
.tally{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.5rem;font-family:var(--sans);font-size:.75rem}
.tally i{font-style:normal;display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;
  border:1px solid var(--line);border-radius:999px;color:var(--tx2)}
.tally i s{text-decoration:none;width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.tally i.k s{background:var(--mal)} .tally i.r s{background:var(--lap)} .tally i.st s{background:var(--eos)}

.spine{list-style:none;margin:0;padding:0 0 0 1.55rem;position:relative}
.spine:before{content:"";position:absolute;left:.42rem;top:.6rem;bottom:.6rem;width:1px;background:var(--line)}
.spine li{position:relative;margin:0 0 .45rem}
.spine li:before{content:"";position:absolute;left:-1.28rem;top:1.5rem;width:9px;height:9px;border-radius:50%;
  background:var(--ink);border:1.5px solid var(--line2)}
.spine li.done:before{background:var(--mal);border-color:var(--mal)}
.spine li.part:before{background:var(--orp);border-color:var(--orp)}
.chap{display:block;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);
  border-radius:12px;padding:.85rem 1rem .9rem;transition:border-color .15s,background .15s}
.chap:hover{border-color:var(--line2);background:var(--ink3)}
.chap .era{font-family:var(--sans);font-size:.68rem;letter-spacing:.07em;color:var(--tx3)}
.chap h3{margin:.08rem 0 .2rem;font-size:1.12rem;font-weight:600;letter-spacing:.004em}
.chap p{margin:0;color:var(--tx2);font-size:.93rem;line-height:1.5}
.meter{margin-top:.6rem;display:flex;align-items:center;gap:.55rem}
.meter .track{flex:1;height:4px;border-radius:4px;background:var(--ink4);overflow:hidden;display:flex}
.meter .track u{display:block;height:100%;text-decoration:none}
.meter .track .a{background:var(--mal)} .meter .track .b{background:var(--lap)}
.meter em{font-style:normal;font-family:var(--sans);font-size:.7rem;color:var(--tx3);flex:none}

/* ---------- study ---------- */
.crumb{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;font-family:var(--sans);font-size:.78rem}
.crumb button{color:var(--tx2);display:inline-flex;align-items:center;gap:.3rem}
.crumb button:hover{color:var(--tx)}
.crumb span{color:var(--tx3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chips{display:flex;gap:.35rem;overflow-x:auto;padding:.15rem 0 .6rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--sans);font-size:.74rem;white-space:nowrap;padding:.32rem .68rem;border-radius:999px;
  border:1px solid var(--line);color:var(--tx2);flex:none}
.chip[aria-pressed="true"]{background:var(--cin);border-color:var(--cin);color:#fff}
html[data-theme="light"] .chip[aria-pressed="true"]{color:#fff}
.chip.bih[aria-pressed="true"]{background:var(--orp);border-color:var(--orp);color:#17150d}

.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);
  overflow:hidden;transition:transform .22s cubic-bezier(.2,.7,.3,1),opacity .22s}
.card.turn{transform:translateY(6px) scale(.985);opacity:0}
.chead{padding:.9rem 1.1rem .75rem;border-bottom:1px solid var(--line);position:relative}
.ctag{font-family:var(--sans);font-size:.67rem;letter-spacing:.06em;color:var(--tx3);
  display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.3rem}
.ctag u{text-decoration:none;color:var(--tx3)}
.ctag b{font-weight:500;color:var(--orp);border:1px solid color-mix(in srgb,var(--orp) 40%,transparent);
  border-radius:999px;padding:.05rem .42rem;font-size:.64rem}
.ctitle{margin:0;max-width:30ch;font-size:clamp(1.16rem,4.6vw,1.5rem);font-weight:600;line-height:1.3;letter-spacing:.003em}
.cbody{padding:.35rem 1.1rem 1rem}

/* slots */
ol.slots{list-style:none;margin:0;padding:0;max-width:66ch}
ol.slots>li{padding:.62rem 0;border-bottom:1px dashed var(--line);}
ol.slots>li:last-child{border-bottom:0}
ol.slots>li.grp{border-bottom:0;padding:.7rem 0 .1rem}
.slot{display:block;width:100%;text-align:left}
.lab{font-family:var(--sans);font-size:.73rem;letter-spacing:.04em;color:var(--cin);
  display:block;margin-bottom:.12rem;font-weight:600}
.rule{display:block;height:1.15rem;max-width:min(100%,24rem);border-radius:3px;
  background:linear-gradient(var(--blank),var(--blank)) bottom/100% 1px no-repeat,
             color-mix(in srgb,var(--blank) 38%,transparent)}
.slot:hover .rule{background:linear-gradient(var(--cin),var(--cin)) bottom/100% 1px no-repeat,
             color-mix(in srgb,var(--cin) 12%,transparent)}
ol.slots>li.sub{padding-left:1.15rem;position:relative}
li.sub:before{content:"";position:absolute;left:.28rem;top:1.28rem;width:5px;height:1px;background:var(--line2)}
ol.slots>li.sub3{padding-left:2.2rem}
li.sub3:before{left:1.35rem}
.pt{margin:0;font-size:1.0rem;line-height:1.62}
li.sub .pt{font-size:.96rem;color:var(--tx2)}
.pt b{font-weight:600;color:var(--orp)}
html[data-theme="light"] .pt b{color:var(--orp)}
.cz{display:inline-block;border-radius:4px;padding:0 .1rem;font-weight:600;
  background:var(--blank);color:transparent;border-bottom:1px solid var(--line2);
  transition:background .18s,color .18s}
.cz:hover{background:var(--line2)}
.cz.on{background:none;color:var(--orp);font-weight:600;
  border-bottom-color:color-mix(in srgb,var(--orp) 45%,transparent)}
.reveal{width:100%;margin-top:.5rem;padding:.62rem;border:1px solid var(--line);border-radius:10px;
  font-family:var(--sans);font-size:.8rem;color:var(--tx2);background:var(--ink3)}
.reveal:hover{border-color:var(--cin);color:var(--tx)}

/* mark bar */
.marks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;margin-top:.8rem}
.mk{font-family:var(--sans);font-size:.79rem;padding:.6rem .3rem;border:1px solid var(--line);
  border-radius:10px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:.38rem}
.mk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mk:hover{border-color:var(--line2);color:var(--tx)}
.mk.k[aria-pressed="true"]{color:var(--mal);border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.mk.r[aria-pressed="true"]{color:var(--lap);border-color:var(--lap);background:color-mix(in srgb,var(--lap) 12%,transparent)}
.mk.s[aria-pressed="true"]{color:var(--eos);border-color:var(--eos);background:color-mix(in srgb,var(--eos) 12%,transparent)}
.mk.s[aria-pressed="true"] svg{fill:currentColor}

/* nav strip */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(12px);
  padding-bottom:env(safe-area-inset-bottom)}
.navin{width:var(--wrap);margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem}
.navin .pill{flex:none;width:44px;height:40px;border-radius:11px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--tx2)}
.navin .pill:hover{border-color:var(--line2);color:var(--tx)}
.navin .pill:disabled{opacity:.32;cursor:default}
.navin .pill svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;min-width:0}
.prog .track{height:3px;border-radius:3px;background:var(--ink4);overflow:hidden}
.prog .track u{display:block;height:100%;background:var(--cin);text-decoration:none;transition:width .2s}
.prog em{display:block;font-style:normal;font-family:var(--sans);font-size:.7rem;color:var(--tx3);
  margin-top:.25rem;text-align:center}

/* ---------- notes ---------- */
.search{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:11px;
  padding:.5rem .75rem;background:var(--ink2);margin-bottom:1rem}
.search input{border:0;background:none;outline:0;width:100%;font-family:var(--sans);font-size:.92rem}
.search svg{width:16px;height:16px;fill:none;stroke:var(--tx3);stroke-width:1.8;flex:none}
.search button{color:var(--tx3);font-family:var(--sans);font-size:.78rem}
details.sec{border-bottom:1px solid var(--line);padding:.1rem 0}
details.sec>summary{list-style:none;cursor:pointer;padding:.72rem .2rem;display:flex;gap:.6rem;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h4{margin:0;font-size:1.04rem;font-weight:600;flex:1}
details.sec>summary u{text-decoration:none;font-family:var(--sans);font-size:.68rem;color:var(--tx3);flex:none}
details.sec>summary u.ct{min-width:4.6rem;text-align:right}
details.sec[open]>summary h4{color:var(--cin)}
.note{padding:.1rem .2rem 1rem;max-width:70ch}
.note h5{margin:.9rem 0 .3rem;font-size:.99rem;font-weight:600}
.note ul{list-style:none;margin:0;padding:0}
.note li{padding:.16rem 0 .16rem 1rem;position:relative;font-size:1rem;line-height:1.6}
.note li:before{content:"";position:absolute;left:.1rem;top:.78rem;width:4px;height:4px;border-radius:50%;background:var(--line2)}
.note li.l2{padding-left:2rem;font-size:.95rem;color:var(--tx2)}
.note li.l2:before{left:1.1rem;width:4px;height:1px;border-radius:0}
.note li.l3{padding-left:3rem;font-size:.93rem;color:var(--tx2)}
.note li.l3:before{left:2.1rem;width:4px;height:1px;border-radius:0}
.note b{font-weight:600;color:var(--orp)}
mark{background:color-mix(in srgb,var(--cin) 30%,transparent);color:inherit;border-radius:2px;padding:0 .08em}
.chapnote{margin:1.9rem 0 .2rem;padding-top:.1rem}
.chapnote h3{margin:0;font-size:1.3rem;font-weight:600;letter-spacing:.004em}
.chapnote span{font-family:var(--sans);font-size:.68rem;letter-spacing:.07em;color:var(--tx3)}
.empty{padding:3rem 1rem;text-align:center;color:var(--tx3);font-family:var(--sans);font-size:.9rem}
.empty b{display:block;color:var(--tx2);font-size:1rem;margin-bottom:.3rem;font-weight:500}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .scrim{position:absolute;inset:0;background:rgba(4,5,9,.62)}
.sheet .panel{position:relative;background:var(--ink2);border:1px solid var(--line);
  border-radius:16px 16px 0 0;width:var(--wrap);max-height:82vh;overflow:auto;padding:1rem 1.1rem 1.6rem}
.sheet h4{margin:.2rem 0 .8rem;font-size:1.05rem;font-weight:600}
.kv{font-family:var(--sans);font-size:.84rem;color:var(--tx2);display:grid;grid-template-columns:auto 1fr;
  gap:.4rem .8rem;align-items:baseline}
.kv kbd{font-family:var(--sans);font-size:.72rem;border:1px solid var(--line2);border-radius:5px;
  padding:.08rem .38rem;color:var(--tx)}
.seclist{list-style:none;margin:0;padding:0}
.seclist li button{width:100%;text-align:left;padding:.6rem .2rem;border-bottom:1px solid var(--line);
  display:flex;gap:.7rem;align-items:baseline}
.seclist li button:hover{color:var(--cin)}
.seclist u{text-decoration:none;font-family:var(--sans);font-size:.7rem;color:var(--tx3);flex:none}
.seclist span{flex:1;font-size:.98rem}
@media (min-width:720px){
  .sheet{align-items:center}
  .sheet .panel{border-radius:16px;max-width:560px}
  .marks{grid-template-columns:repeat(3,minmax(0,160px));justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <b>Modern History</b>
      <span>Compiled notes for BPSC and UPPCS</span>
    </div>
    <button class="icon" id="btnShuffle" title="Shuffle this deck" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7M16 21h5v-5M14 14l7 7M3 3l7 7"/></svg>
    </button>
    <button class="icon" id="btnTheme" title="Light / dark">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg>
    </button>
    <button class="icon" id="btnHelp" title="Shortcuts and data">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.6v.4"/><path d="M12 17h.01"/></svg>
    </button>
  </div>
  <nav class="tabs" role="tablist">
    <button id="tHome" role="tab" aria-selected="true">Chapters</button>
    <button id="tStudy" role="tab" aria-selected="false">Flashcards</button>
    <button id="tNotes" role="tab" aria-selected="false">Theory</button>
  </nav>
</header>

<main>
  <!-- HOME -->
  <section id="vHome">
    <p class="lede">Every note in the compilation, rebuilt as <b>501 flashcards</b> across 87 pages.
      Hidden points reveal one tap at a time, or read the whole thing as plain theory.</p>
    <div class="tally" id="tally"></div>
    <ul class="spine" id="spine"></ul>
  </section>

  <!-- STUDY -->
  <section id="vStudy" class="hide">
    <div class="crumb">
      <button id="backHome"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Chapters</button>
      <span id="crumbName"></span>
    </div>
    <div class="chips" id="filters"></div>
    <div id="deck"></div>
  </section>

  <!-- NOTES -->
  <section id="vNotes" class="hide">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search every note — try “Bakasht”, “1919”, “Tebhaga”" autocomplete="off">
      <button id="qClear" class="hide">Clear</button>
    </div>
    <div id="notes"></div>
  </section>
</main>

<div class="nav hide" id="navStrip">
  <div class="navin">
    <button class="pill" id="prev" title="Previous card">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="prog">
      <div class="track"><u id="progBar" style="width:0%"></u></div>
      <em id="progTxt"></em>
    </div>
    <button class="pill" id="index" title="Jump to a section">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="pill" id="next" title="Next card">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="scrim" data-close></div>
  <div class="panel" id="sheetPanel"></div>
</div>

const DATA = [{"n":1,"t":"Exam Focus Checklist","d":"Rapid-fire topic pointers the notes flag as directly exam-relevant","e":"topic pointers","p":1,"s":[{"t":"Modern History of India","p":1,"c":[{"i":"k0001","k":0,"t":"Modern History of India","a":["","Partition of Bengal","Congress Sessions and Presidents",""],"n":[[1,"**Battle of Buxar** – Treaty"],[1,"**Partition of Bengal**: Partition felt like a \"bombshell\", date of partition, Swadeshi Movement, Annulment of Partition."],[1,"**Congress Sessions and Presidents**: Founder of Congress, first woman president, first European president, sessions held in Bihar, representatives in the first Congress session, Muslim delegates in 2nd Congress session, president during Bengal Partition, session presided over by Gandhi, Resolution related to FRs."],[1,"**Praja Mandal Movement**"]],"p":1,"b":1},{"i":"k0002","k":0,"t":"Modern History of India","a":["Gandhian Movements","Journals and Books","",""],"n":[[1,"**Gandhian Movements**: Non-Cooperation Movement (NCM), Chauri Chaura incident, \"Himalayan Blunder\", Civil Disobedience Movement (CDM), origin, Salt Satyagraha, Individual Satyagraha, Quit India Movement (QIM), organizations founded by Gandhi."],[1,"**Journals and Books**: AnandMath, DinBandhu Mitra, Bahiskrit Bharat, India for Indians, Desher Katha, The Hindu, Kesari, Bengalee, Hindustani, Sudharak, Poverty and Un-British Rule in India, Now or Never, Sandhya, Yugantar."],[1,"**Constitutional Developments Leading to Partition**: Cabinet Mission, Cripps Mission, Wavell Plan."],[1,"**Boundary Commission**."]],"p":1,"b":0},{"i":"k0003","k":0,"t":"Modern History of India","a":["Land Settlements","","Agricultural Reforms",""],"n":[[1,"**Land Settlements**: Implemented by whom, in which areas."],[1,"**Montford Reforms**."],[1,"**Agricultural Reforms**: Baba Ramachandra, Swami Sahajanand, Swami Vidyanand, AIKS"],[1,"**Sindh Conquest**"]],"p":1,"b":1},{"i":"k0004","k":0,"t":"Modern History of India","a":["","William Bentinck - : Contributions, legacy."]],"p":2,"b":0},{"i":"k0014","k":0,"t":"Modern History of India","a":["Swaraj Dal","First Railway Lines","AITUC"],"n":[[1,"**Swaraj Dal**: when formed, why, role."],[1,"**First Railway Lines**: When, from where to where."],[1,"**AITUC**: Formation, INTUC."]],"p":2,"b":0}]},{"t":"Bihar Special – Modern History","p":3,"c":[{"i":"k0015","k":1,"t":"Bihar Special – Modern History","a":["","","",""],"n":[[1,"**1632 - company established**"],[1,"**Swaraj Dal in Bihar**"],[1,"**Salt satyagraha** - opposed which tax, salt satyagraha in BGP"],[1,"**First congress ministry** - leader, Bihar govt. resigned in 1938"]],"p":3,"b":1},{"i":"k0016","k":1,"t":"Bihar Special – Modern History","a":["","","",""],"n":[[1,"**Bakasht movement**"],[1,"**Ambari Satyagraha**, Rahul Sankritayan region"],[1,"**Champaran Satyagraha** - who invited (village), who saved, leaders, against what, tinkathia system, Dukhi Dukhi Atma Dukhi Hriday"],[1,"**Agri leaders** - during NCM, Swami Sahajanand, Bihar Provincial Kisan Sabha, Kisan Sabha at Munger"]],"p":3,"b":1},{"i":"k0017","k":1,"t":"Bihar Special – Modern History","a":["","","",""],"n":[[1,"**College** - PWC founded by?"],[1,"**Church** - Oldest"],[1,"**Gandhi Maidan** - renamed?"],[1,"**Governor of Bihar** - First, First Indian, first after independence"]],"p":3,"b":1},{"i":"k0018","k":1,"t":"Bihar Special – Modern History","a":["","","",""],"n":[[1,"**Bihar separate state**, Odisha separate"],[1,"**Khudiram Bose**"],[1,"**QIM** - Azad Dasta, JP escaped"],[1,"**Revolutionaries** - Anushilan Samiti in Bihar"]],"p":3,"b":1},{"i":"k0019","k":1,"t":"Bihar Special – Modern History","a":["","","",""],"n":[[1,"**Bihar Socialist Party**"],[1,"**Congress sessions in Bihar**, Bihar Provincial Congress session"],[1,"**Student Conference** - 16th session, Golden League"],[1,"**1857** - Kunwar Singh - entry in Jagdishpur"]],"p":3,"b":1},{"i":"k0020","k":1,"t":"Bihar Special – Modern History","a":["","","","",""],"n":[[1,"**Journals and Books** - Bihar Herald, MG and Bihar - Some Reminiscences, Searchlight, Bihari"],[1,"**First CM of Bihar**, JP title - left Patna College, Creator of Modern Bihar, Prabhavati Devi, Bihar Kesari"],[1,"**Land Tenancy Act**, Land settlements"],[1,"**Father of Pakistan**, Raju Prasad imprisoned during 1942?"],[1,"**Constituent Assembly** - Bihar members"]],"p":3,"b":1}]}]},{"n":2,"t":"Advent of the Europeans","d":"Portuguese, Dutch, English, French and Danish — arrival, factories, decline","e":"1498 – 1760","p":4,"s":[{"t":"Medieval Trade and the Search for Sea Routes","p":4,"c":[{"i":"k0021","k":1,"t":"Medieval Trade and the Search for Sea Routes","a":["","","",""],"n":[[1,"**Long-distance trade** was significant during the Middle Ages."],[1,"The **trade route** connecting Europe to the East via the **Middle East** was famous."],[1,"**Spices** (like pepper) and **textiles** (Indian cottons, Chinese silks) were in high demand in Europe."],[1,"Goods moved from **China and India** through cities like **Aleppo** and **Cairo** to **Venice** and other European destinations."]],"p":4,"b":0},{"i":"k0022","k":1,"t":"Medieval Trade and the Search for Sea Routes","a":["","","",""],"n":[[1,"**Middle Eastern merchants** bought Eastern goods and sold them in Europe for **huge profits**."],[1,"High **profit margins** by Middle Eastern merchants made goods costly for Europeans."],[1,"**Religious rivalry** between **Arabs (Muslims)** and **Europeans (Christians)** intensified."],[1,"Europeans sought a **direct trade route to the East**, bypassing the Middle East."]],"p":4,"b":0},{"i":"k0023","k":1,"t":"Medieval Trade and the Search for Sea Routes","a":["",""],"n":[[1,"**Improved agriculture** made Europe prosperous, increasing demand for **oriental luxury goods**."],[1,"Developments in **ship-building** and the onset of the **Age of Exploration** in the 15th century encouraged explorations."]],"p":4,"b":0}]},{"t":"The Portuguese in India","p":4,"c":[{"i":"k0024","k":1,"t":"The Portuguese in India","a":["","","",""],"n":[[1,"**Vasco da Gama's voyages** (1497-99, 1502-03, 1524) opened the **sea route** from Western Europe to Asia via the **Cape of Good Hope**."],[1,"In **1498**, da Gama landed in **Calicut (Kozhikode)**, marking the start of **Portugal's involvement with India**."],[1,"Portugal aimed to buy **spices** from India and sell them in Europe for profit."],[1,"India was known as the **'Land of Spices'**; da Gama sought **pepper ('black gold')**."]],"p":4,"b":0},{"i":"k0025","k":1,"t":"The Portuguese in India","a":["","","",""],"n":[[1,"**Calicut** was ideal for fulfilling these ambitions."],[1,"From the **14th to 16th century, Calicut** was a major **port city** admired by traders."],[1,"Flourished due to **economic strategies** and **liberal policies** of the **Zamorins**."],[1,"Transformed into a significant **entrepôt** for **spices** to the Middle East and Europe."]],"p":4,"b":0},{"i":"k0026","k":1,"t":"The Portuguese in India","a":["",""],"n":[[1,"**Vasco da Gama** met the **Zamorin** seeking favor; relations soured later."],[1,"Da Gama returned to Portugal with a **rich cargo**, earning a **huge profit**."]],"p":4,"b":0}]},{"t":"Portuguese Expansion and Influence","p":5,"c":[{"i":"k0027","k":1,"t":"Portuguese Expansion and Influence","a":["","","",""],"n":[[1,"**Pedro Álvares Cabral** reached **Calicut** in **September 1500**, established a **factory**, and made treaties with **Cochin** and **Cannanore**."],[1,"**Da Gama** returned in **1501**, setting up a factory at **Cannanore**."],[1,"**Calicut, Cochin**, and **Cannanore** became key **Portuguese trade centers**."],[1,"The Portuguese **fortified their factories** to secure trade."]],"p":5,"b":0},{"i":"k0028","k":1,"t":"Portuguese Expansion and Influence","a":[""],"n":[[1,"**Francisco de Almeida** appointed governor in **1505** to consolidate **Portuguese interests**."],[2,"Aimed to make Portugal the **paramount power** and **monopolize the spice trade**."],[2,"Established fortified posts and implemented the **Cartaz system (Blue Water Policy)**."],[2,"Defeated **Arabs and Egyptians** in the **Battle of Diu (February 1509**)."]],"p":5,"b":0},{"i":"k0029","k":1,"t":"Portuguese Expansion and Influence","a":[""],"n":[[1,"**Afonso de Albuquerque** became governor in **1509**, considered the **real founder** of Portuguese power."],[2,"Aimed to control **strategic points** of the Indian Ocean to dominate trade."],[2,"Captured **Goa** in **1510** from the **Sultan of Bijapur**, developing it as the trade hub."],[2,"**Goa** was the **first Indian territory** annexed by Europeans since **Alexander the Great**."],[2,"Encouraged **marriages** between his men and **local women** in Goa."],[2,"**Abolished Sati** in the region."],[2,"Despite reforms, was a **religious zealot** persecuting **Muslims**."],[2,"**Trivia**: The **Alphonso mango** is named after him; he introduced it from **Brazil**."]],"p":5,"b":0},{"i":"k0030","k":1,"t":"Portuguese Expansion and Influence","a":[""],"n":[[1,"In **1529, Nuno da Cunha** became governor."],[2,"Shifted headquarters from **Cochin** to **Goa** in **1530**."],[2,"**Bahadur Shah** of Gujarat ceded **Bassein** to the Portuguese in **1534**."],[2,"Established factories at **San Thome** and **Hugli**."],[2,"Portuguese entrenched on India's **western coast** by mid-16th century."]],"p":5,"b":0},{"i":"k0031","k":1,"t":"Portuguese Expansion and Influence","a":[""],"n":[[1,"**Eastern expansion** faced challenges."],[2,"**Sultan Mahmud Shah** of Bengal initially opposed them."],[2,"Allied with Portuguese against **Sher Shah Suri** (1535-36)."],[2,"Granted rights to build **factories** and collect **customs duties** at **Chittagong** and **Satgaon**."]],"p":6,"b":0}]},{"t":"Portuguese in Bihar","p":6,"c":[{"i":"k0032","k":1,"t":"Portuguese in Bihar","a":["","",""],"n":[[1,"**First Europeans** in Bihar, entering in the **17th century**."],[1,"Established **factory at Hooghly** in Bengal, often visiting **Patna for trade** via waterways and roads."],[1,"Traded **spices** and **China clay** for **Bihar’s textiles – carpets, ambrette, thin cloths**."]],"p":6,"b":1}]},{"t":"The Dutch in India","p":7,"c":[{"i":"k0033","k":0,"t":"The Dutch in India","a":["1590s","1602","",""],"n":[[1,"**1590s: Dutch** challenge Portuguese in East Asia."],[1,"**1602: Dutch East India Company** established with Asian trade monopoly."],[1,"Traded **spices, textiles**, and other goods for **huge profits**."],[1,"Exchanged **Indian textiles** for **Indonesian spices**."]],"p":7,"b":0},{"i":"k0034","k":1,"t":"The Dutch in India","a":["","","",""],"n":[[1,"Established presence on the **Coromandel Coast**."],[1,"First factory in **1608 at Pulicat**."],[1,"Became the first global **multinational company (MNC)**."],[1,"Other factories: **Masulipatnam, Nagapattinam, Golconda, Surat, Chinsurah, Patna**, **Cochin**."]],"p":7,"b":1}]},{"t":"Decline of Dutch Power","p":7,"c":[{"i":"k0035","k":0,"t":"Decline of Dutch Power","a":["","","1824"],"n":[[1,"Defeated by **Travancore** in the **Battle of Colachel (1741**)."],[1,"Losses to the English in **Anglo-Dutch Wars** ended ambitions."],[1,"**1824: Anglo-Dutch Treaty** transferred Indian possessions to the **British**."]],"p":8,"b":0}]},{"t":"Dutch in Bihar","p":8,"c":[{"i":"k0036","k":0,"t":"Dutch in Bihar","a":["1632","","1662","1665"],"n":[[1,"**1632**: Dutch East India Company set up a **factory in Patna** (near present Patna College)."],[1,"Sought **cotton textiles, saltpetre, opium, food grains**."],[1,"**1662**: Mughal Emperor **Aurangzeb** granted **trade rights** in **Bihar, Bengal, Odisha**."],[1,"**1665**: Dutch traveler **Tavernier** visited Patna and **Chhapra**."]],"p":8,"b":1},{"i":"k0037","k":0,"t":"Dutch in Bihar","a":["","1781"],"n":[[1,"**Rivalry** with **British** and **French** over **saltpetre trade; Battle of Bedara** (1759) led to British dominance."],[1,"**1781**: British Major **Hardy** captured Dutch **warehouse in Patna**; later took **Chhapra and Singhia** factories. **Returned in 1784**."]],"p":8,"b":1}]},{"t":"The British Rise to Power in India","p":9,"c":[{"i":"k0038","k":0,"t":"The British Rise to Power in India","a":["1600"],"n":[[1,"**1600: Queen Elizabeth I** granted trading rights to the **East India Company (EIC)**."]],"p":9,"b":0},{"i":"k0039","k":0,"t":"The British Rise to Power in India","a":["1608"],"n":[[1,"**1608**: Captain **William Hawkins** reached **Surat**."],[2,"Met **Emperor Jahangir** seeking to establish an **English factory**."],[2,"**Portuguese** opposed Hawkins, leading to his departure in **1611**."]],"p":9,"b":0},{"i":"k0040","k":0,"t":"The British Rise to Power in India","a":["1612","1615"],"n":[[1,"**1612**: Captain **Thomas Best** defeated the Portuguese in the **Battle of Swally** → **Jahangir** was impressed, treated English and Portuguese equally."],[1,"**1615: Sir Thomas Roe** obtained trading concessions from **Jahangir** → Jahangir granted an imperial **farman** allowing the English to trade and establish factories."]],"p":9,"b":0},{"i":"k0041","k":0,"t":"The British Rise to Power in India","a":[""],"n":[[1,"Established factories in **Surat, Masulipatnam, Orissa**, and **Madras**."],[2,"**1632: Sultan of Golconda** issued a **Golden Farman** for free trade."],[2,"**1639**: Built a fortified factory at **Madras** (Fort St. George)."]],"p":9,"b":0},{"i":"k0042","k":0,"t":"The British Rise to Power in India","a":["1662",""],"n":[[1,"**1662**: Acquired **Bombay** from the Portuguese."],[1,"Built **Fort St. David** in **1725**."]],"p":9,"b":0}]},{"t":"The British in Bengal","p":9,"c":[{"i":"k0043","k":0,"t":"The British in Bengal","a":["1651","","","1690","1698"],"n":[[1,"**1651**: Permission to trade at **Hugli**."],[1,"Opened factories in **Patna, Balasore, Dhaka**."],[1,"Faced hostility over **farmans** and fortifications."],[1,"**1690: Job Charnock** re-established settlement at **Sutanuti**."],[1,"**1698**: Purchased **zamindari** of **Sutanuti, Gobindpur**, and **Kalikata** → Built **Fort William**, making it the eastern seat of British power."]],"p":9,"b":1},{"i":"k0044","k":1,"t":"The British in Bengal","a":[""],"n":[[1,"**1717: Emperor Farrukhsiyar** issued three famous **farmans**."],[2,"Exempted the Company from **custom duties** in Bengal."],[2,"Allowed issuance of **dastaks** for **duty-free company trade**."],[2,"Recognized **Company coins** throughout the Mughal Empire."]],"p":9,"b":0}]},{"t":"British East India Company in Bihar","p":9,"c":[{"i":"k0045","k":0,"t":"British East India Company in Bihar","a":["1620","1651","","1680"],"n":[[1,"**1620**: Initial factory at **Alamganj, Patna** for **saltpetre**, closed in 1621."],[1,"**1651**: Reopened factory at **Gulzarbagh**, which is now the **Government Printing Press**."],[1,"Dominated trade in **saltpetre, opium, calico cloth**."],[1,"**1680**: Subedar **Shaista Khan** imposed **3.5% tax** on British trade."]],"p":9,"b":1},{"i":"k0046","k":0,"t":"British East India Company in Bihar","a":["1697","1713","1733","1750"],"n":[[1,"**1697**: Governor **Azimushan** granted **trade permissions**; factory re-established in **1703**."],[1,"**1713**: Closed, then reopened in **1718** under **Emperor Farrukhsiyar**."],[1,"**1733: Alivardi Khan** became **Naib Nazim of Bihar; 1740**, gained control of **Bengal and Bihar**."],[1,"**1750**: Patna factory closed under **Alivardi Khan’s pressure**."]],"p":10,"b":1}]},{"t":"The French in India","p":11,"c":[{"i":"k0047","k":0,"t":"The French in India","a":["1664","1667","",""],"n":[[1,"**1664: French East India Company** established."],[1,"**1667: Francois Caron** set up first French factory at **Surat**."],[1,"Established factories in **Masulipatnam, Chandernagore, Pondicherry (under Francois Martin)**."],[1,"Other important centres were **Mahe, Karaikal, Balasore, Qasim Bazar**."]],"p":11,"b":0}]},{"t":"Carnatic Wars: British vs. French","p":11,"c":[{"i":"k0048","k":2,"t":"First Carnatic War (1746-48)","a":["Key Events"],"n":[[1,"**Key Events**"],[2,"Triggered by the Austrian War of Succession."],[2,"French captured Madras (1746)."],[2,"Battle of St. Thome: Showcased European military superiority."],[2,"Ended with Treaty of Aix-La Chapelle (1748)."]],"p":11,"b":0},{"i":"k0049","k":2,"t":"Second Carnatic War (1749-54)","a":["Key Events"],"n":[[1,"**Key Events**"],[2,"Dupleix interfered in local disputes to expand French influence."],[2,"Siege of Arcot (1751): Robert Clive captured Arcot."],[2,"Dupleix recalled; Treaty of Pondicherry ended the war."],[2,"French influence weakened in the Deccan."]],"p":11,"b":0},{"i":"k0050","k":2,"t":"Third Carnatic War (1758-63)","a":["Key Events"],"n":[[1,"**Key Events**"],[2,"Part of the Seven Years' War."],[2,"Battle of Wandiwash (1760): British defeated the French."],[2,"Treaty of Paris (1763) ended French colonial ambitions."],[2,"French restricted to commerce in small enclaves."]],"p":11,"b":0}]},{"t":"French in Bihar","p":12,"c":[{"i":"k0051","k":1,"t":"French in Bihar","a":["","",""],"n":[[1,"Set up a trading **center in Patna (1734)**, competing with Dutch for **saltpetre**."],[1,"Tensions with the British; **Chandernagore captured** (1757)."],[1,"After **Battle of Plassey**, British **expelled French** from Patna, taking over **French warehouses**."]],"p":12,"b":1}]},{"t":"Danish in Bihar","p":12,"c":[{"i":"k0052","k":0,"t":"Danish in Bihar","a":["","1774",""],"n":[[1,"Danish East India Company operated **1616-1650**, revived in **1670-1729, Asiatic Company** established in **1730**."],[1,"**1774**: Built a factory **at Nepali Kothi (Patna)** for **saltpetre** processing."],[1,"Danish presence ended when **Denmark sold Indian settlements in 1845**"]],"p":12,"b":1}]},{"t":"Reasons for British Success in India","p":12,"c":[{"i":"k0053","k":1,"t":"Reasons for British Success in India","a":["","","",""],"n":[[1,"**The English Company** was private and agile; **the French Company** was state-run and bureaucratic."],[1,"Superior **English navy** and focus on **commercial interests**."],[1,"**The Industrial Revolution** boosted English capabilities."],[1,"Less **religious zeal** aided relations with locals."]],"p":12,"b":0},{"i":"k0054","k":1,"t":"Reasons for British Success in India","a":["",""],"n":[[1,"Effective use of **debt markets** funded wars."],[1,"India became the **'crown jewel'** of the British Empire."]],"p":12,"b":0}]}]},{"n":3,"t":"Bengal: Plassey to Buxar","d":"Plassey, Mir Jafar and Mir Kasim, Buxar, Allahabad, Dual Government","e":"1757 – 1772","p":13,"s":[{"t":"Battle of Plassey: Background","p":13,"c":[{"i":"k0055","k":1,"t":"Abuse of Trade Privileges","a":[],"n":[[2,"**Farukhsiyar's farman** granted free trading rights only to the **Company**, not its officials."],[2,"**Company officials** engaged in **private trade** without paying duties, causing revenue loss."],[2,"Successive Nawabs – **Murshid Quli Khan, Alivardi Khan, Siraj-ud-Daulah** – were **antagonized**."]],"p":13,"b":0},{"i":"k0056","k":0,"t":"Unauthorized Fortifications","a":[],"n":[[2,"The Company began **constructing new fortifications** in **Calcutta** without permission."],[2,"**Siraj-ud-Daulah** ordered dismantling; the Company **refused**."],[2,"**1756**: Siraj **drove out the British** from Calcutta."],[2,"**Black Hole Incident**: Alleged imprisonment of **146 English persons; 123 died** of suffocation."]],"p":13,"b":0}]},{"t":"The Battle of Plassey (1757)","p":13,"c":[{"i":"k0057","k":1,"t":"British Regroup and Conspiracy","a":[],"n":[[2,"**Robert Clive** arrived with reinforcements from **Madras**."],[2,"Formed alliances with **Mir Jafar, Rai Durlabh, Jagat Seth**, and **Omichand**—traitors to the Nawab."]],"p":13,"b":0},{"i":"k0058","k":1,"t":"Decisive Victory","a":[],"n":[[2,"**June 1757**: Clive's **3,000 troops** defeated Siraj-ud-Daulah's **50,000-strong army** at **Plassey**."],[2,"**Siraj-ud-Daulah** was **captured and killed**."],[2,"**Mir Jafar** installed as the **new Nawab of Bengal**."]],"p":13,"b":0},{"i":"k0059","k":1,"t":"Consequences","a":[],"n":[[2,"British emerged as **king-makers** with far-reaching implications."],[2,"**Mir Jafar** granted the British **large sums of money** and **zamindari of 24 parganas**."],[2,"**English sovereignty** over Calcutta was recognized."],[2,"A **British resident** was posted at the Nawab's court."]],"p":13,"b":0}]},{"t":"Power Struggles: Mir Jafar and Mir Kasim","p":14,"c":[{"i":"k0060","k":1,"t":"Mir Jafar's Downfall","a":[],"n":[[2,"Failed to meet the **Company's financial demands**."],[2,"**Interfered** with by the British; couldn't make regular payments."],[2,"Attempted to ally with the **Dutch** but was defeated in the **Battle of Bidara (1759)**."],[2,"**Replaced** by **Mir Kasim** as Nawab."]],"p":14,"b":0},{"i":"k0061","k":1,"t":"Mir Kasim's Reforms and Conflict","a":[],"n":[[2,"**Ceded Burdwan, Midnapur, Chittagong** to the British."],[2,"**Paid ₹5 lakh** for British wars."],[2,"Shifted capital to **Munger** to distance from British control."],[2,"Filled bureaucracy with his own men; **remodeled the army**."],[2,"**Conflict arose** due to **misuse of trade privileges** by Company officials."],[2,"**Mir Kasim waged war** against the Company."]],"p":14,"b":1}]},{"t":"The Battle of Buxar (1764)","p":14,"c":[{"i":"k0062","k":1,"t":"Alliance Against the British","a":[],"n":[[2,"**Mir Kasim, Shuja-ud-Daulah** (Nawab of Awadh), and **Shah Alam II** (Mughal Emperor) united to oust the British."],[2,"Despite preparations, they were **defeated** by the British."]],"p":14,"b":0},{"i":"k0063","k":1,"t":"Significant Outcomes","a":[],"n":[[2,"**Mir Jafar** reinstated as Nawab."],[2,"**Midnapore, Burdwan**, and **Chittagong** given to the British for army maintenance."],[2,"British power in **Northern India** became **unchallengeable**."],[2,"Nawabs became **puppets**; the Mughal Emperor a **pensioner**."],[2,"Opened the path to **Delhi** for British expansion."]],"p":14,"b":0}]},{"t":"Treaty of Allahabad (1765)","p":14,"c":[{"i":"k0064","k":1,"t":"With Nawab of Awadh","a":[],"n":[[2,"**Surrendered Allahabad and Kara** to **Shah Alam II**."],[2,"Paid **₹50 lakh** as war indemnity."],[2,"Granted **Balwant Singh** full possession of his estate."]],"p":14,"b":0},{"i":"k0065","k":1,"t":"With Mughal Emperor Shah Alam II","a":[],"n":[[2,"**Resided at Allahabad**."],[2,"Issued a **farman** granting the Company **diwani** rights over **Bengal, Bihar**, and **Odisha**."],[2,"Company paid an annual tribute of **₹26 lakh**."]],"p":15,"b":1}]},{"t":"Dual Government in Bengal (1765-1772)","p":15,"c":[{"i":"k0066","k":1,"t":"Implementation","a":[],"n":[[2,"**Robert Clive** introduced the **dual system**—joint rule by the Company and the Nawab."],[2,"Company controlled both **diwani** (revenue collection) and **nizamat** (administration)."],[2,"Exercised **diwani rights** through the **farman** from Shah Alam II."],[2,"Controlled **nizamat** by nominating the **deputy Subahdar**."]],"p":15,"b":0},{"i":"k0067","k":0,"t":"Negative Impact","a":[],"n":[[2,"Led to **administrative breakdown** and **public suffering**."],[2,"Neither the Company nor the Nawab focused on **governance** or **welfare**."],[2,"**1770**: A devastating **famine** struck Bengal."],[2,"**1772: Warren Hastings** abolished the dual system."]],"p":15,"b":0}]},{"t":"British Administration in Bihar","p":15,"c":[{"i":"k0068","k":1,"t":"British Administration in Bihar","a":["","","",""],"n":[[1,"The **East India Company** created the post of **Deputy Governor** to administer **Bihar**."],[1,"**Robert Clive** appointed **Shitab Rai** as **Naib (Deputy) Diwan of Bihar**."],[1,"The general administration of Bihar was left in charge of the **Council**."],[1,"In **1770**, a **'Revenue Council of Patna'** was constituted; it was later replaced by the position of **'Revenue Chief of Bihar'** in **1781**."]],"p":15,"b":1},{"i":"k0069","k":1,"t":"British Administration in Bihar","a":["",""],"n":[[1,"In **1783**, when **famine** struck Bihar, **Warren Hastings**, the then **Governor-General of Bengal**, ordered the construction of the **Golghar**—a dome-shaped massive granary in **Patna**."],[1,"The **Golghar** was designed by **John Garstin** and completed on **28th July, 1786** to cope with famines."]],"p":15,"b":1}]}]},{"n":4,"t":"Expansion & Annexations","d":"Mysore, Maratha, Sindh, Punjab, Burma and Afghan frontiers","e":"1767 – 1856","p":16,"s":[{"t":"Annexations and Policies","p":16,"c":[{"i":"k0070","k":1,"t":"Subsidiary Alliance System","a":[],"n":[[2,"Devised by **Lord Richard Wellesley**."],[2,"Indian rulers were not allowed to have independent armies."],[2,"British provided protection in return for **territory** or **subsidies**."],[2,"Used to annex **Hyderabad, Awadh**, and attempted with **Mysore**."]],"p":16,"b":0},{"i":"k0071","k":1,"t":"Doctrine of Lapse","a":[],"n":[[2,"Introduced by **Lord Dalhousie**."],[2,"Annexed states without a male heir."],[2,"Used to annex **Satara, Jhansi, Nagpur**, and others."]],"p":16,"b":0}]},{"t":"Anglo-Mysore Wars","p":16,"c":[{"i":"k0072","k":0,"t":"First Anglo-Mysore War (1767-1769)","a":[],"n":[[2,"**Causes**: British desire to curb Mysore's power; Haider Ali's disputes with the **Nizam** and **Marathas**."],[2,"**Course**: Initial British alliance with Nizam and Marathas against Haider."],[2,"**Outcome: Treaty of Madras (1769)**; return to pre-war territories; mutual defense agreement."]],"p":16,"b":0},{"i":"k0073","k":0,"t":"Second Anglo-Mysore War (1780-1784)","a":[],"n":[[2,"**Causes**: British seizure of **Mahe**; Haider's alliance with **Marathas** and **Nizam**."],[2,"**Course**: Haider's initial successes; British victories under **Sir Eyre Coote**."],[2,"**Outcome: Treaty of Mangalore (1784)**; mutual restitution of territories."]],"p":16,"b":0},{"i":"k0074","k":0,"t":"Third Anglo-Mysore War (1790-1792)","a":[],"n":[[2,"**Causes**: Tipu's attack on **Travancore**; British desire for expansion."],[2,"**Course**: British, Marathas, and Nizam formed a **Triple Alliance** against Tipu."],[2,"**Outcome: Treaty of Seringapatam (1792)**; Tipu ceded half his territories, paid indemnity, and surrendered two sons as hostages."]],"p":16,"b":0},{"i":"k0075","k":0,"t":"Fourth Anglo-Mysore War (1799)","a":[],"n":[[2,"**Causes**: Tipu's alliance with **France**; British desire to eliminate him."],[2,"**Course**: British forces led by **Lord Wellesley** attacked Mysore."],[2,"**Outcome: Tipu Sultan** was **killed**; Mysore annexed; **Subsidiary Alliance** imposed."]],"p":16,"b":0},{"i":"k0076","k":1,"t":"Tipu Sultan's Administration","a":[],"n":[[2,"Established a **centralized administration** with **seven departments**."],[2,"Issued **coins** and introduced a new **calendar**."],[2,"Encouraged **trade** and **agriculture**; built a **navy**."],[2,"Used **iron-cased rockets**, a first in military history."],[2,"Maintained embassies in **France, Turkey**, and **Egypt**."]],"p":16,"b":0}]},{"t":"Anglo-Maratha Wars","p":17,"c":[{"i":"k0077","k":1,"t":"Rise of the Marathas","a":[],"n":[[2,"**Shivaji** (1627-1680) founded a **stable kingdom** challenging Mughal authority."],[2,"After Shivaji, **Peshwas** became the de facto rulers."],[2,"Marathas became a formidable force, challenging the British."]],"p":17,"b":0},{"i":"k0078","k":0,"t":"First Anglo-Maratha War (1775-1782)","a":[],"n":[[2,"**Causes**: British interference in Maratha succession disputes."],[2,"**Outcome: Treaty of Salbai (1782)**; mutual restoration of territories; peace for 20 years."]],"p":17,"b":0},{"i":"k0079","k":0,"t":"Second Anglo-Maratha War (1803-1805)","a":[],"n":[[2,"**Causes: Peshwa Baji Rao II** signed the **Treaty of Bassein (1802)** with the British."],[2,"**Outcome**: British defeated Maratha chiefs; treaties of **Deogaon**, **Surji-Anjangaon, Rajghat** imposed."]],"p":17,"b":0},{"i":"k0080","k":0,"t":"Third Anglo-Maratha War (1817-1818)","a":[],"n":[[2,"**Causes**: British desire to end Maratha power; conflict with **Pindaris**."],[2,"**Outcome**: Maratha confederacy dissolved; **Peshwa** pensioned off; territories annexed."]],"p":17,"b":0}]},{"t":"Sindh: A Brief History","p":17,"c":[{"i":"k0081","k":1,"t":"Sindh: A Brief History","a":["","","",""],"n":[[1,"**18th Century Rule**: Sindh ruled by **Kallora chiefs**."],[1,"**Talpura Takeover (1771): Baluch Talpura tribe** moved to Sindh, gained power."],[1,"**Mir Fath Ali Khan (1783)**: Talpura leader exiled Kallora prince, secured Sindh."],[1,"**Power Sharing: Durrani monarch** urged Fath Ali to share power with brothers (\"**Char Yar**\")."]],"p":17,"b":0},{"i":"k0082","k":0,"t":"Sindh: A Brief History","a":["British Arrival","Napoleonic Threat","",""],"n":[[1,"**British Arrival**: Soon followed, marking British interests in Sindh."],[1,"**Napoleonic Threat**: Fear of **French invasion** led British to secure allies."],[1,"**Treaty with Amirs (1809)**: British-Amir **'eternal friendship' treaty**; no French allowed in Sindh."],[1,"**Renewed in 1820**: Resolved **border disputes** with Cutch."]],"p":17,"b":0}]},{"t":"Sindh under Subsidiary Alliance (1839)","p":18,"c":[{"i":"k0083","k":0,"t":"Sindh under Subsidiary Alliance (1839)","a":["Subsidiary Force","","Loss of Autonomy"],"n":[[1,"**Subsidiary Force**: Sindh entered **subsidiary alliance**; Amirs paid Rs. 3 lakh for British troops."],[1,"**First Anglo-Afghan War (1839-42)**: Amirs obligated to assist British."],[1,"**Loss of Autonomy**: Independent status diminished."]],"p":18,"b":0}]},{"t":"Final Annexation","p":18,"c":[{"i":"k0084","k":1,"t":"Final Annexation","a":["",""],"n":[[1,"**Governor-General Lord Ellenborough (1842)**: Pushed for **Sindh’s annexation**."],[1,"**Sir Charles Napier (1843)**: Annexed Sindh; **Napier as first governor**."]],"p":18,"b":0}]},{"t":"Punjab: A Brief History","p":18,"c":[{"i":"k0085","k":0,"t":"Punjab: A Brief History","a":["Post-Mughal Disorder","Rise of Sikh Misls","Sukerchakia Misl"],"n":[[1,"**Post-Mughal Disorder: Ahmad Shah Abdali’s** invasions created chaos."],[1,"**Rise of Sikh Misls: Sikh military brotherhoods** emerged, seizing territories."],[1,"**Sukerchakia Misl**: Controlled area between Ravi and Chenab."]],"p":18,"b":0}]},{"t":"The Rise of Ranjit Singh","p":18,"c":[{"i":"k0086","k":0,"t":"The Rise of Ranjit Singh","a":["","","Blood and Iron Policy"],"n":[[1,"**Early Leadership (1792-1797)**: Took control after his father’s death."],[1,"**Governorship of Lahore (1799): Zaman Shah** appointed him, extended territory."],[1,"**Blood and Iron Policy**: Rapidly consolidated **Punjab’s** power."]],"p":18,"b":0}]},{"t":"Ranjit Singh and the English","p":18,"c":[{"i":"k0087","k":0,"t":"Ranjit Singh and the English","a":["Cis-Sutlej Ambitions","","Further Conquests"],"n":[[1,"**Cis-Sutlej Ambitions**: Clashed with **East India Company**."],[1,"**Treaty of Amritsar (1809): River Sutlej** became boundary; limited Ranjit Singh’s expansion."],[1,"**Further Conquests**: Expanded to **Multan, Kashmir, Peshawar**."]],"p":18,"b":0}]},{"t":"Punjab After Ranjit Singh","p":18,"c":[{"i":"k0088","k":0,"t":"Punjab After Ranjit Singh","a":["Decline","Instability"],"n":[[1,"**Decline**: Civil power weakened; **military dominance** increased post-Ranjit."],[1,"**Instability**: Rival factions and **'king-maker' army** emerged."]],"p":18,"b":0}]},{"t":"1st Anglo-Sikh War (1845-46)","p":19,"c":[{"i":"k0089","k":0,"t":"1st Anglo-Sikh War (1845-46)","a":["Causes"],"n":[[1,"**Causes**: Anarchy post-Ranjit, **British annexations** aroused Sikh suspicion."]],"p":19,"b":0},{"i":"k0090","k":0,"t":"Outcome","a":[],"n":[[2,"**Treaty of Lahore** (1846); British resident appointed, Sikh army reduced."],[2,"**Separating Kashmir**"],[3,"**War Indemnity**: Kashmir sold to **Gulab Singh Dogra**."],[3,"**Sikh Rebellion**: Led to **Treaty of Bhairowal** (1846), concessions but Kashmir retained by Dogras."]],"p":19,"b":0}]},{"t":"2nd Anglo-Sikh War (1848-49)","p":19,"c":[{"i":"k0091","k":0,"t":"2nd Anglo-Sikh War (1848-49)","a":["Provocation","Annexation of Punjab"],"n":[[1,"**Provocation: Mulraj’s revolt** after replacement in Multan."],[1,"**Annexation of Punjab**: Final defeat; **Dalhousie annexed Punjab**."]],"p":19,"b":0}]},{"t":"Anglo-Burmese Relations","p":19,"c":[{"i":"k0092","k":0,"t":"Anglo-Burmese Relations","a":["Expansion Tensions","",""],"n":[[1,"**Expansion Tensions: British-Burmese rivalry** over territory led to wars."],[1,"**1st Anglo-Burmese War (1824-26)**: British victory; **Treaty of Yandabo**, large indemnity, territory ceded."],[1,"**2nd Anglo-Burmese War (1852)**: British seized **Pegu**, expanded control."]],"p":19,"b":0},{"i":"k0093","k":0,"t":"3rd Anglo-Burmese War (1885)","a":[],"n":[[2,"**French Threat: British invaded Upper Burma** to counter French influence."],[2,"**Annexation of Burma**: Thibaw deposed; Burma came under British control."]],"p":19,"b":0}]},{"t":"Anglo-Afghan Relations: Background","p":19,"c":[{"i":"k0094","k":0,"t":"Anglo-Afghan Relations: Background","a":["British Strategy","",""],"n":[[1,"**British Strategy: Forward policy** to counter **Russian threat**."],[1,"**Tripartite Treaty (1838)**: British, **Sikhs, Shah Shuja** alliance to control Afghanistan."],[1,"**British Invasion (1839)**: General **Keane stormed Kabul**, installed Shah Shuja."]],"p":19,"b":0}]}]},{"n":5,"t":"People's Resistance 1757–1856","d":"Civil, tribal and peasant uprisings before the Great Revolt","e":"1757 – 1856","p":19,"s":[{"t":"People's Resistance Against British Rule (1757-1856)","p":19,"c":[{"i":"k0095","k":1,"t":"People's Resistance Against British Rule (1757-1856)","a":[""],"n":[[1,"After the Battle of Plassey in **1757**, British control expanded in India, leading to widespread discontent due to foreign intrusion, administrative restructuring, and excessive land revenue demands. This period witnessed numerous **local uprisings and revolts** as different regions reacted to the loss of autonomy and oppressive policies. Although these disturbances were mostly localized and lacked national consciousness, they set the stage for future organized resistance."]],"p":19,"b":0}]},{"t":"Rebellions in Bengal and Eastern India","p":20,"c":[{"i":"k0096","k":0,"t":"Sanyasi Rebellion (1770 onwards)","a":[],"n":[[2,"**Background**: Following the **Battle of Plassey**, British economic policies devastated Bengal's zamindars, peasants, and artisans."],[2,"**Catalyst**: The **Great Bengal Famine of 1770** worsened conditions; restrictions on visiting holy places alienated the **sanyasis** (Hindu ascetics)."],[2,"**Revolt**: Sanyasis raided Company factories and treasuries, battling British forces."],[2,"**Suppression**: Warren Hastings eventually contained the rebellion after prolonged military action."],[2,"**Cultural Impact: Bankim Chandra Chatterjee's** novel **'Anandamath'** (1882) is based on this rebellion."]],"p":20,"b":0},{"i":"k0097","k":0,"t":"Rebellions in Bengal and Eastern India","a":["Exam Tip"],"n":[[1,"**Exam Tip**: The **Sanyasi Rebellion** was made famous by **Bankim Chandra Chatterjee's** novel Anandamath."]],"p":20,"b":0},{"i":"k0098","k":0,"t":"Chuar Uprisings","a":[],"n":[[2,"**Participants: Chuars**, aboriginal tribesmen of **Midnapore** (West Bengal)."],[2,"**Causes**: Loss of tax-free lands and forced revenue collection by the British."],[2,"**Events**: Labeled as 'Chuars' (uncivilized), they revolted at the end of the 18th century but were suppressed by British forces."]],"p":20,"b":0},{"i":"k0099","k":0,"t":"Ho and Munda Uprisings","a":[],"n":[[2,"**Participants: Ho** and **Munda** tribes of **Chhotanagpur** and **Singbhum**."],[2,"**Causes**: Resentment against British intrusion and exploitation."],[2,"**Events**: Challenged Company forces in **1820-22**, again in **1831**, with disturbances until **1837**."]],"p":20,"b":1},{"i":"k0100","k":0,"t":"Paika Rebellion (1817)","a":[],"n":[[2,"**Participants: Paikas**, the landed militia of **Odisha**."],[2,"**Causes**: Loss of traditional rights and exploitation by British revenue collectors."],[2,"**Leader: Bakshi Jagabandhu**, hereditary Commander-in-Chief of the **Rajas of Khurda**."],[2,"**Events**: Revolted against British rule; practiced guerrilla warfare after initial defeat."],[2,"**Outcome**: Bakshi Jagabandhu surrendered in **1825**; died in captivity in **1829**."]],"p":20,"b":0},{"i":"k0101","k":0,"t":"Kol Mutiny (1831)","a":[],"n":[[2,"**Participants: Kols** of **Chhotanagpur**."],[2,"**Causes**: Transfer of land to outsiders and exploitation."],[2,"**Events**: Rebels killed about a thousand outsiders; spread to Ranchi, Singhbhum, Hazaribagh, Palamau, and Manbhum."],[2,"**Suppression**: Restored after large-scale military operations."]],"p":21,"b":1},{"i":"k0102","k":0,"t":"Ahom Revolt","a":[],"n":[[2,"**Background**: British promised to withdraw from **Assam** after the **First Anglo-Burmese War** (1824-26) but reneged."],[2,"**Events**: In **1828**, Ahoms proclaimed **Gomdhar Konwar** as king; plan foiled by the British."],[2,"**Outcome**: Upper Assam handed over to **Maharaja Purander Singh Narendra** in **1833**."]],"p":21,"b":0},{"i":"k0103","k":0,"t":"Khasi Rising (1833)","a":[],"n":[[2,"**Participants: Khasis** led by **Tirat Singh**, supported by Garos, Khamptis, and Singhpos."],[2,"**Causes**: British occupation and plans to build a road linking Brahmaputra valley to Sylhet."],[2,"**Events**: Revolt to drive away outsiders."],[2,"**Outcome**: Suppressed by superior British forces."]],"p":21,"b":0},{"i":"k0104","k":0,"t":"Pagal Panthis","a":[],"n":[[2,"**Background**: A semi-religious sect founded by **Karam Shah** in **Bengal**."],[2,"**Leader: Tipu**, son of Karam Shah."],[2,"**Causes**: Oppression by zamindars; aimed to expel British."],[2,"**Events**: Captured **Sherpur** in **1825**; area remained disturbed into the 1840s."]],"p":21,"b":0},{"i":"k0105","k":0,"t":"Faraizi Revolt","a":[],"n":[[2,"**Participants**: Followers of a Muslim sect founded by **Haji Shariatullah** in **Faridpur**, Eastern Bengal."],[2,"**Leader: Dadu Mian**, son of Shariatullah."],[2,"**Causes**: Advocacy for radical changes; tenant rights against zamindars."],[2,"**Events**: Disturbances from **1838** to **1857**; many later joined the **Wahabi movement**."]],"p":21,"b":0}]},{"t":"Rebellions in Western India","p":21,"c":[{"i":"k0106","k":0,"t":"Bhil Uprising","a":[],"n":[[2,"**Participants: Bhils**, aboriginal tribe of the **Western Ghats**."],[2,"**Causes**: British expansion and agrarian hardships."],[2,"**Events**: Revolted in **1817-19**; led by **Sewram** in **1825**, again in **1831** and **1846**."],[2,"**Suppression**: British forces crushed the revolts."]],"p":22,"b":0},{"i":"k0107","k":0,"t":"Koli Uprising","a":[],"n":[[2,"**Participants: Kolis**, neighboring the Bhils."],[2,"**Causes**: Dismantlement of forts; unemployment due to British policies."],[2,"**Events**: Rebellions in **1829, 1839**, and **1844-48**."]],"p":22,"b":0},{"i":"k0108","k":0,"t":"Cutch (Kutch) Rebellion","a":[],"n":[[2,"**Causes**: Deposition of **Rao Bharmal** in **1819**; administrative changes and excessive land assessment."],[2,"**Events**: Revolts demanding Rao Bharmal's restoration; significant disturbances in **1831**."],[2,"**Outcome**: British adopted a conciliatory policy."]],"p":22,"b":0},{"i":"k0109","k":0,"t":"Waghera Uprising","a":[],"n":[[2,"**Participants: Wagheras** of **Okha Mandal** (Gujarat)."],[2,"**Causes**: Exactions by the **Gaekwad of Baroda** and British support."],[2,"**Events**: Carried out raids during **1818-19**."],[2,"**Outcome**: Peace treaty in **November 1820**."]],"p":22,"b":0},{"i":"k0110","k":0,"t":"Surat Salt Agitation","a":[],"n":[[2,"**Causes**: Increase in salt duty from 50 paisa to 1 rupee in **1844**."],[2,"**Events**: Revolt ensued; attacks on Europeans."],[2,"**Outcome**: British withdrew the additional salt levy."]],"p":22,"b":0},{"i":"k0111","k":0,"t":"Ramosi Uprising","a":[],"n":[[2,"**Participants: Ramosis**, hill tribes of the **Western Ghats**."],[2,"**Causes**: Discontent with British rule and administration."],[2,"**Leader: Chittur Singh** in **1822; Narsingrao Dattatraya Petkar** in **1839**."],[2,"**Events**: Plundered areas around **Satara**; seized **Fort Badami**."],[2,"**Suppression**: British forces restored order."]],"p":22,"b":0},{"i":"k0112","k":0,"t":"Kolhapur and Savantvadi Revolts","a":[],"n":[[2,"**Causes**: Hardships from administrative reorganization; disbanding of the **Gadkaris** (hereditary military class)."],[2,"**Events**: Gadkaris occupied forts; similar discontent in **Savantvadi**."],[2,"**Outcome**: British suppressed the revolts."]],"p":22,"b":0}]},{"t":"Rebellions in South India","p":23,"c":[{"i":"k0113","k":0,"t":"Revolt of the Raja of Vizianagaram","a":[],"n":[[2,"**Background**: Post-**1765**, British demanded excessive tributes and disbandment of troops."],[2,"**Events**: Raja revolted with popular support but was killed in **1794**."],[2,"**Outcome**: British reduced demands and restored the estate to his son."]],"p":23,"b":0},{"i":"k0114","k":0,"t":"Diwan Velu Thampi's Revolt","a":[],"n":[[2,"**Background**: Imposition of the **Subsidiary Alliance** on **Travancore** in **1805**."],[2,"**Causes**: Harsh treaty terms; overbearing British resident."],[2,"**Leader: Velu Thampi**, the Diwan of Travancore."],[2,"**Events**: Raised revolt with the **Nair battalion**."],[2,"**Outcome**: British deployed large forces to suppress the rebellion."]],"p":23,"b":0}]},{"t":"Nonia Revolt (1700-1800)","p":24,"c":[{"i":"k0115","k":0,"t":"Nonia Revolt (1700-1800)","a":["Location","Community Involved","Cause","Outcome"],"n":[[1,"**Location**: Occurred in Bihar's saltpetre-producing regions: **Hajipur, Tirhut, Saran, and Purnea.**"],[1,"**Community Involved**: Led by the **Nonia** caste, traditionally involved in saltpetre production."],[1,"**Cause**: Exploitation by the East India Company, which imposed **unfair practices and low prices for saltpetre**, essential for explosives."],[1,"**Outcome**: The Nonia community organized a rebellion against British exploitation."]],"p":24,"b":1}]},{"t":"Tamar Revolt (1789-1832)","p":24,"c":[{"i":"k0116","k":0,"t":"Tamar Revolt (1789-1832)","a":["Location","Cause","Leadership","Outcome"],"n":[[1,"**Location**: Tamar region in Jharkhand, involving tribes like Oraon, Munda, Ho, and Kol."],[1,"**Cause**: British interference in **traditional agricultural systems**, adversely affecting tribal socio-economic conditions."],[1,"**Leadership**: Led by **Bhola Nath Sahay**"],[1,"**Outcome**: Suppressed by the British in 1832; Tamar region annexed."]],"p":24,"b":0}]},{"t":"Chero Revolt (1800)","p":25,"c":[{"i":"k0117","k":0,"t":"Chero Revolt (1800)","a":["Location","Cause","Leadership","Outcome"],"n":[[1,"**Location: Palamau** region."],[1,"**Cause**: Imposition of **Churaman as king by the Company**, who levied heavy taxes, leading to exploitation of peasants and tribals."],[1,"**Leadership**: Led by **Sardar Bhushan Singh.**"],[1,"**Outcome**: The revolt was quickly suppressed by the British."]],"p":25,"b":1}]},{"t":"Ho and Munda Uprisings (1820-1837)","p":25,"c":[{"i":"k0118","k":0,"t":"Ho and Munda Uprisings (1820-1837)","a":["Location","Cause","Leadership","Outcome"],"n":[[1,"**Location: Chotanagpur** region."],[1,"**Cause**: Resistance against British occupation of **Singhbhum** and exploitation by local **moneylenders and zamindars**."],[1,"**Leadership**: Led by the **Raja of Parahat.**"],[1,"**Outcome**: Initial revolts in 1820-22, followed by another in 1831, continuing until 1837."]],"p":25,"b":1}]},{"t":"Bhumij Revolt (1832-1833)","p":25,"c":[{"i":"k0119","k":0,"t":"Bhumij Revolt (1832-1833)","a":["Location","Cause","Leadership","Outcome"],"n":[[1,"**Location: Singhbhum and Birbhum** regions."],[1,"**Cause**: Increased land revenue demands by the British and exploitation by local authorities."],[1,"**Leadership**: Led by **Ganga Narayan Singh.**"],[1,"**Outcome**: Began on April 26, 1832; Ganga Narayan Singh was killed on February 7, 1833, leading to the revolt's suppression."]],"p":25,"b":1}]},{"t":"Lotah Uprising (1856)","p":25,"c":[{"i":"k0120","k":0,"t":"Lotah Uprising (1856)","a":["Cause","Location","Public Reaction","Outcome"],"n":[[1,"**Cause**: The British government's decision to **replace brass vessels (lotahs)** with **earthenware** in jails offended prisoners' religious sentiments, as brass was integral to their rituals."],[1,"**Location**: The movement began in the jails of **Arrah and Muzaffarpur**, Bihar."],[1,"**Public Reaction**: A large crowd from the towns gathered and **attacked the prisons** in protest."],[1,"**Outcome**: Facing widespread unrest, the British government **reinstated the use of brass vessels in jails.**"]],"p":25,"b":1}]},{"t":"Sardari Movement (1858-1895)","p":26,"c":[{"i":"k0121","k":0,"t":"Sardari Movement (1858-1895)","a":["Nature","Objective","Methods","Outcome"],"n":[[1,"**Nature**: An agrarian movement led by **Christian tribal peasants**, primarily the Munda and Oraon tribes, against oppressive **landlords**."],[1,"**Objective**: Aimed to end the **begari (forced labor)** system and implement land reforms in agricultural practices."],[1,"**Methods**: Employed peaceful means like **petitions, prayers, and protests** to demand justice from the colonial regime."],[1,"**Outcome**: The movement laid the groundwork for subsequent tribal uprisings, including Birsa Munda's rebellion."]],"p":26,"b":0}]},{"t":"Sapha Har Movement (1868)","p":26,"c":[{"i":"k0122","k":0,"t":"Sapha Har Movement (1868)","a":["Also Known As","Initiator","Beliefs","Political Aspiration"],"n":[[1,"**Also Known As: Kherwar** Movement."],[1,"**Initiator**: Started by **Bhagirath Manjhi** among the Santhal community."],[1,"**Beliefs**: Promoted the worship of a single deity and sought to reform social practices, including stopping sacrifices to 'evil bongas' (spirits)."],[1,"**Political Aspiration**: Bhagirath declared himself the king of the Santhals and demanded a separate Santhal state."]],"p":26,"b":0}]},{"t":"Tana Bhagat Movement (1914)","p":26,"c":[{"i":"k0123","k":0,"t":"Tana Bhagat Movement (1914)","a":["Origin","Nature","Leadership","Objectives"],"n":[[1,"**Origin**: Initiated by the Oraon tribe under the leadership of Jatra Bhagat."],[1,"**Nature**: A religious movement considered an extension of the Birsa Movement, incorporating Hindu practices into its ideology."],[1,"**Leadership**: Key figures included Jatra Bhagat, Balram Bhagat, Bhikhu Bhagat, and Shibu Bhagat."],[1,"**Objectives**: Opposed foreign exploiters, landlords, and contractors; resisted British-imposed taxes; and adopted non-violence as a principle."]],"p":26,"b":0}]}]},{"n":6,"t":"The Revolt of 1857","d":"Causes, centres, leaders, suppression, failure and consequences","e":"1857 – 1858","p":27,"s":[{"t":"Revolt of 1857","p":27,"c":[{"i":"k0124","k":0,"t":"Revolt of 1857","a":["East India Company's record",""],"n":[[1,"**East India Company's record**: Increasing **conquest** and **commercial exploitation**."],[1,"**Unlimited greed** of the English."]],"p":27,"b":0},{"i":"k0125","k":1,"t":"British policies adversely affected","a":[],"n":[[2,"**Rulers** of Indian states"],[2,"**Sepoys**"],[2,"**Zamindars**"],[2,"**Peasants**"],[2,"**Traders**"],[2,"**Pundits** and **Maulvis**"]],"p":27,"b":0},{"i":"k0126","k":1,"t":"Prior to 1857, resentment expressed in","a":[],"n":[[2,"**Mutiny at Vellore (1806)**"],[2,"**Barrackpore (1824)**"],[2,"**Ferozepur (1842)**"],[2,"Mutinies of **7th Bengal Cavalry** and **64th Regiment**"],[2,"Mutiny of **22nd Native Infantry (1849)**"],[2,"Mutiny of **66th Native Infantry (1850)**"],[2,"Mutiny of **38th Native Infantry (1852)**"],[2,"**Santhal uprising (1855-56)**"]],"p":27,"b":0},{"i":"k0127","k":1,"t":"Revolt of 1857","a":["",""],"n":[[1,"In **1857**, discontent erupted into a **violent storm**, shaking British rule. It began as a sepoy revolt, but eventually masses joined it."],[1,"VD Savarkar called it **First War of Independence**"]],"p":27,"b":0}]},{"t":"Causes of the Revolt","p":27,"c":[{"i":"k0128","k":1,"t":"Causes of the Revolt","a":["","","","",""],"n":[[1,"**Political**"],[1,"**Social and Religious**"],[1,"**Economic**"],[1,"**Military**"],[1,"**Immediate**"]],"p":27,"b":0}]},{"t":"Political Causes","p":27,"c":[{"i":"k0129","k":1,"t":"Political Causes","a":[""],"n":[[1,"**British expansion policy** via **Doctrine of Lapse** and **direct annexation**."]],"p":27,"b":0},{"i":"k0130","k":1,"t":"Doctrine of Lapse","a":[],"n":[[2,"Enforced by **Lord Dalhousie** (Governor-General, 1848-56)."],[2,"Prohibited Hindu rulers without natural heirs from adopting successors."],[2,"Annexed territories upon ruler's death."]],"p":27,"b":0},{"i":"k0131","k":1,"t":"Annexations under Doctrine of Lapse","a":[],"n":[[2,"**Satara, Nagpur, Jhansi, Jaitpur, Sambalpur, Udaipur**."]],"p":28,"b":0},{"i":"k0132","k":1,"t":"Political Causes","a":[""],"n":[[1,"**Rani Lakshmi Bai's** adopted son not recognized."]],"p":28,"b":0},{"i":"k0133","k":1,"t":"Annexation of Awadh","a":[],"n":[[2,"On pretext of **maladministration**."],[2,"Left thousands jobless."],[2,"Turned Awadh into a **hotbed of discontent**."]],"p":28,"b":0}]},{"t":"Social and Religious Causes","p":28,"c":[{"i":"k0134","k":1,"t":"Social and Religious Causes","a":["",""],"n":[[1,"British were **rude, arrogant**, and displayed **racist attitudes**."],[1,"**Social reforms** (abolition of **sati**, female **infanticide, widow remarriage**) seen as **intrusions**."]],"p":28,"b":0},{"i":"k0135","k":1,"t":"Religious policies caused alarm","a":[],"n":[[2,"**Act of 1850**: Allowed **Hindu converts to Christianity** to inherit property."],[2,"Led to fears of **forced conversions**."]],"p":28,"b":0},{"i":"k0136","k":1,"t":"Social and Religious Causes","a":[""],"n":[[1,"Introduction of **Western education** challenged **orthodox beliefs**."]],"p":28,"b":0}]},{"t":"Economic Causes","p":28,"c":[{"i":"k0137","k":1,"t":"Economic Causes","a":["","","",""],"n":[[1,"**British economic policies** harmed Indian **trade** and **industry**."],[1,"**Destruction of handicrafts** by East India Company."],[1,"Shift to **agriculture** increased pressure on land."],[1,"**Peasants** and **zamindars** burdened by heavy **taxes** and strict **revenue collection**."]],"p":28,"b":0},{"i":"k0138","k":1,"t":"Economic Causes","a":["",""],"n":[[1,"Many lost ancestral lands due to inability to pay."],[1,"**Sepoys** from peasant families; shared agrarian grievances."]],"p":28,"b":0}]},{"t":"Military Causes","p":28,"c":[{"i":"k0139","k":1,"t":"Military Causes","a":["","","",""],"n":[[1,"**Service conditions** of sepoys deteriorated."],[1,"Made up **87%** of troops but considered **inferior**."],[1,"**Lower pay** than European counterparts."],[1,"Required to serve away from home without extra **bhatta** (allowance)."]],"p":28,"b":0},{"i":"k0140","k":1,"t":"General Service Enlistment Act (1856)","a":[],"n":[[2,"Issued by **Lord Canning**."],[2,"Required overseas service, risking **loss of caste**."]],"p":28,"b":0}]},{"t":"Immediate Cause","p":29,"c":[{"i":"k0141","k":1,"t":"Immediate Cause","a":[""],"n":[[1,"**Greased cartridge** issue sparked rebellion."]],"p":29,"b":0},{"i":"k0142","k":1,"t":"Introduction of Enfield rifle","a":[],"n":[[2,"Cartridges rumored to be greased with **pig** and **cow fat**."],[2,"Offended both **Hindu** and **Muslim** religious beliefs."]],"p":29,"b":0},{"i":"k0143","k":1,"t":"Immediate Cause","a":[""],"n":[[1,"**Sepoys refused** to use cartridges."]],"p":29,"b":0},{"i":"k0144","k":1,"t":"Mangal Pandey","a":[],"n":[[2,"Attacked officers; hanged on **8th April 1857**."]],"p":29,"b":0},{"i":"k0145","k":1,"t":"Meerut incident (9th May 1857)","a":[],"n":[[2,"85 soldiers imprisoned for refusal."]],"p":29,"b":0},{"i":"k0146","k":1,"t":"Immediate Cause","a":[""],"n":[[1,"**10th May 1857**: Open rebellion; marched to **Delhi**."]],"p":29,"b":0}]},{"t":"Centres of Revolt","p":29,"c":[{"i":"k0147","k":1,"t":"Delhi","a":[],"n":[[2,"Seized on **12th May 1857**."],[2,"**Bahadur Shah Zafar** proclaimed **Emperor of India**."],[2,"Real leader – commander Bakht Khan"]],"p":29,"b":0},{"i":"k0148","k":1,"t":"Centres of Revolt","a":[""],"n":[[1,"Rebellion spread to **Northern and Central India**."]],"p":30,"b":0},{"i":"k0149","k":1,"t":"Main centres","a":[],"n":[[2,"**Lucknow (Begum Hazrat Mahal)**"],[2,"**Kanpur (Nana Saheb and Tantia Tope)**"],[2,"**Jhansi (Rani Laxmi Bai)**"],[2,"**Bareilly (Khan Bahadur Khan**"],[2,"**Bihar (Kunwar Singh)**"],[2,"**Faizabad (Maulvi Ahmadullah aka Danka Shah)**"]],"p":30,"b":1}]},{"t":"Lucknow","p":30,"c":[{"i":"k0150","k":1,"t":"Lucknow","a":["","","",""],"n":[[1,"Capital of **Awadh**."],[1,"Led by **Begum Hazrat Mahal**. She declared her son **Birjis Qadir** as the Nawab."],[1,"Joined by disbanded Awadh soldiers."],[1,"British recaptured city; Begum escaped to **Nepal**."]],"p":30,"b":0}]},{"t":"Kanpur","p":30,"c":[{"i":"k0151","k":1,"t":"Kanpur","a":["","","",""],"n":[[1,"Led by **Nana Saheb** (adopted son of Peshwa Baji Rao II)."],[1,"Proclaimed himself **Peshwa** after capturing Kanpur."],[1,"British recaptured city; Nana Saheb escaped."],[1,"**Tantia Tope** continued the struggle; eventually **captured and hanged**."]],"p":30,"b":0}]},{"t":"Jhansi and Gwalior","p":30,"c":[{"i":"k0152","k":1,"t":"Jhansi and Gwalior","a":["","","","",""],"n":[[1,"Led by **Rani Lakshmi Bai**."],[1,"Fought after her adopted son's claim was rejected."],[1,"Joined by **Tantia Tope**; captured **Gwalior**."],[1,"**Rani Lakshmi Bai** died fighting."],[1,"**Gwalior** recaptured by British."]],"p":30,"b":0}]},{"t":"Bihar","p":30,"c":[{"i":"k0153","k":1,"t":"3 major developments","a":[],"n":[[2,"Revolt in Patna led by Pir Ali (a book seller)"],[2,"Mutiny by sepoys at Danapur"],[2,"Assumption of leader by Veer Kunwar Singh"]],"p":30,"b":1},{"i":"k0154","k":0,"t":"Bihar","a":["July 3, 1857","July 25, 1857","","Birth"],"n":[[1,"July 3, 1857: Revolt in Patna led by Pir Ali → Dy. Opium Agent Dr. Lyall gets killed → Commissioner of Patna William Taylor convicts Pir Ali, and he is hanged."],[1,"July 25, 1857: Mutiny by Sepoys of Danapur → Crossed Son and reached Shahabad → Joined Kunwar Singh"],[1,"Kunwar Singh leads the revolt with his brothers Amar Singh and Ritnarain Singh. Kunwar Singh (1777-1858)"],[1,"**Birth**: 1777, Jagdishpur, Shahabad (now Bhojpur), Bihar."]],"p":31,"b":1},{"i":"k0155","k":0,"t":"Bihar","a":["Family","Enthroned"],"n":[[1,"**Family**: Son of Raja Sahabzada Singh and Panchratan Kunwar."],[1,"**Enthroned**: Became the chief of Jagdishpur estate in 1826 after his father's death."]],"p":31,"b":1}]},{"t":"Role in the 1857 Revolt","p":31,"c":[{"i":"k0156","k":0,"t":"Role in the 1857 Revolt","a":["Rebellion Begins","Danapur Revolt"],"n":[[1,"**Rebellion Begins**: On 10 May 1857, the Indian Rebellion started in Meerut, spreading across India."],[1,"**Danapur Revolt**: On 25 July 1857, Indian soldiers at Danapur revolted and joined Kunwar Singh."]],"p":31,"b":1},{"i":"k0157","k":0,"t":"Role in the 1857 Revolt","a":["Siege of Arrah"],"n":[[1,"**Siege of Arrah**: On 27 July 1857, Kunwar Singh led his forces to capture Arrah – the district HQ."],[2,"**Battle with Captain Dunbar**: On 29 July 1857, Kunwar Singh ambushed and defeated Captain Dunbar’s 415 British troops, leaving only 50 survivors."],[2,"**Battle of Bibiganj**: On 3 August 1857 → The British under Major Vincent Eyre defeated Kunwar Singh → Kunwar Singh left Jagdishpur and moved to Mirzapur, Rewa, Banda, Lucknow and Kanpur"]],"p":31,"b":1},{"i":"k0158","k":0,"t":"Role in the 1857 Revolt","a":["Lucknow Campaign"],"n":[[1,"**Lucknow Campaign**: Reached Lucknow in December 1857 and was honored by the King of Oudh."]],"p":31,"b":0},{"i":"k0159","k":0,"t":"Role in the 1857 Revolt","a":["Azamgarh Campaign"],"n":[[1,"**Azamgarh Campaign**: Occupied Azamgarh in March 1858."],[2,"**Victory at Atrolia**: On 22 March 1858, Kunwar Singh defeated Col. Milman, forcing the British to retreat."]],"p":31,"b":1},{"i":"k0160","k":0,"t":"Role in the 1857 Revolt","a":["Return to Jagdishpur","Death","Commemorative Stamp"],"n":[[1,"**Return to Jagdishpur**: Crossed the Ganga and reached Jagdishpur on 23 April, 1858. While crossing Ganga, wounded by Captain Le Grand → cut off his injured hand and offered it to the Ganga."],[1,"**Death**: Passed away on 26 April 1858, three days after his last major victory at Jagdishpur."],[1,"**Commemorative Stamp**: Issued on 23 April 1966 by the Government of India."]],"p":31,"b":0}]},{"t":"Suppression of the Revolt","p":32,"c":[{"i":"k0161","k":0,"t":"Suppression of the Revolt","a":["","July 8, 1858"],"n":[[1,"Lasted over a year; suppressed by mid-**1858**."],[1,"**July 8, 1858**: Peace proclaimed by **Lord Canning**."]],"p":32,"b":0}]},{"t":"Key British Officials Involved:","p":32,"c":[{"i":"k0162","k":2,"t":"Delhi","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Bahadur Shah Zafar"],[1,"**British Officials**: John Nicholson"]],"p":32,"b":0},{"i":"k0163","k":2,"t":"Lucknow","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Begum Hazrat Mahal"],[1,"**British Officials**: Henry Lawrence"]],"p":32,"b":0},{"i":"k0164","k":2,"t":"Kanpur","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Nana Saheb"],[1,"**British Officials**: Sir Colin Campbell"]],"p":32,"b":0},{"i":"k0165","k":2,"t":"Jhansi & Gwalior","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Rani Lakshmi Bai & Tantia Tope"],[1,"**British Officials**: General Hugh Rose"]],"p":32,"b":0},{"i":"k0166","k":2,"t":"Bareilly","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Khan Bahadur Khan"],[1,"**British Officials**: Sir Colin Campbell"]],"p":32,"b":0},{"i":"k0167","k":2,"t":"Allahabad & Banaras","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Maulvi Liyakat Ali"],[1,"**British Officials**: Colonel Oncell"]],"p":32,"b":0},{"i":"k0168","k":2,"t":"Bihar","a":["Indian Leaders","British Officials"],"n":[[1,"**Indian Leaders**: Kunwar Singh"],[1,"**British Officials**: William Taylor"]],"p":32,"b":1}]},{"t":"Reasons for Failure","p":32,"c":[{"i":"k0169","k":1,"t":"Limited Uprising","a":[],"n":[[2,"Localized and poorly organized."],[2,"**Bombay** and **Madras** armies remained loyal."],[2,"Major princely states did not join."]],"p":32,"b":0},{"i":"k0170","k":1,"t":"Lack of Effective Leadership","a":[],"n":[[2,"Leaders lacked experience and coordination."],[2,"No overarching plan."]],"p":32,"b":0},{"i":"k0171","k":1,"t":"Inferior Resources","a":[],"n":[[2,"Rebels lacked modern weapons."],[2,"British had superior arms like the **Enfield Rifle**."]],"p":32,"b":0},{"i":"k0172","k":1,"t":"No Common Ideal","a":[],"n":[[2,"Unified mainly by **anti-foreign sentiment**."],[2,"Lacked inclusive programme."],[2,"Feudal leaders sought personal power restoration."]],"p":32,"b":0}]},{"t":"Impact of the Revolt","p":33,"c":[{"i":"k0173","k":1,"t":"Impact of the Revolt","a":[""],"n":[[1,"**End of East India Company** rule."]],"p":33,"b":0},{"i":"k0174","k":1,"t":"Government of India Act, 1858","a":[],"n":[[2,"Control transferred to the **British Crown**."]],"p":33,"b":0},{"i":"k0175","k":1,"t":"British policies shifted","a":[],"n":[[2,"Reinstated **feudal elements**; became imperialism's favorite child."],[2,"Halted annexation of **princely states**."],[2,"Cultivated princely states as empire's **bulwark**."]],"p":33,"b":0},{"i":"k0176","k":1,"t":"Impact of the Revolt","a":[""],"n":[[1,"Promised **religious tolerance**."]],"p":33,"b":0},{"i":"k0177","k":1,"t":"Reorganized Indian Army","a":[],"n":[[2,"Implemented policy of **'division and counterpoise'**."],[2,"Increased **European troops**."],[2,"Disbanded Indian **artillery units**."],[2,"Emphasized **caste and religious divisions**."]],"p":33,"b":0},{"i":"k0178","k":1,"t":"Increased racial bitterness","a":[],"n":[[2,"Indians faced **insults, humiliation**, and **contempt**."],[2,"Government based on **master race** ideology."]],"p":33,"b":0}]}]},{"n":7,"t":"Peasant & Tribal Movements","d":"Santhal, Indigo, Pabna, Deccan, Ulgulan, Moplah, Kisan Sabhas, Tebhaga","e":"1855 – 1947","p":34,"s":[{"t":"Peasants Revolts and Civil Rebellions (1856-1947)","p":34,"c":[{"i":"k0179","k":1,"t":"Peasants Revolts and Civil Rebellions (1856-1947)","a":["","","","",""],"n":[[1,"**British rule** introduced far-reaching changes in **Indian agrarian structure**."],[1,"**old agrarian system collapsed**"],[1,"**New land tenures → land ownerships** → land **marketable commodity**"],[1,"**excessive land revenue**, ruthlessly extracted by **zamindars**."],[1,"**Absentee landlordism, parasitical intermediaries**, and **greedy moneylenders** deepened peasant poverty."]],"p":34,"b":0}]},{"t":"When Peasants Became Paupers","p":34,"c":[{"i":"k0180","k":1,"t":"When Peasants Became Paupers","a":["","","",""],"n":[[1,"**Droughts** and **famines** became common."],[1,"Process of **pauperization** led to a new category of **agricultural proletariat**."],[1,"Peasants faced with adversities **rebelled** in many areas."],[1,"Grievances were **local**, mainly against **zamindars**."]],"p":34,"b":0},{"i":"k0181","k":1,"t":"When Peasants Became Paupers","a":["",""],"n":[[1,"Lacked **political consciousness** and were largely without **anti-British sentiments**."],[1,"Upcoming sections will cover **peasant revolts chronologically**."]],"p":34,"b":0}]},{"t":"Santhal Rebellion (1855-56)","p":34,"c":[{"i":"k0182","k":0,"t":"Santhal Rebellion (1855-56)","a":["Santhals"],"n":[[1,"**Santhals**: Peaceful agricultural people in **Jharkhand** and **West Bengal**."]],"p":35,"b":0},{"i":"k0183","k":1,"t":"Permanent Settlement (1793) by Lord Cornwallis","a":[],"n":[[2,"Snatched Santhal lands, giving them to **zamindars**."],[2,"Landlords had **perpetual and hereditary rights** over land for fixed revenue to the British."]],"p":35,"b":0},{"i":"k0184","k":1,"t":"Santhal Rebellion (1855-56)","a":["","","",""],"n":[[1,"Santhals lost all rights as their la
